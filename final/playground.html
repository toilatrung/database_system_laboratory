{"q":"\u003cstrong>PE 6.3.\u003c/strong> Thiết kế E-R lưu thống kê ghi điểm của đội bóng yêu thích: các trận, tỉ số mỗi trận, cầu thủ tham gia mỗi trận, thống kê ghi điểm của từng cầu thủ mỗi trận. Thống kê tổng hợp mô hình bằng derived attribute và giải thích cách tính.","en":"\u003cp>\u003cstrong>Exercise 6.3.\u003c/strong> Design an E-R diagram that keeps track of the scoring statistics of your favorite sports team. Store the matches played, the scores of each match, the players in each match, and each player’s individual scoring statistics for each match. Model summary statistics as derived attributes, explaining how each one is computed.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[player] ---------- &lt;played&gt; ---------- [match]\n player_id            score              match_id\n name                                    date, stadium, opponent\n age                                     own_score, opp_score\n season_score()\u003c/code>\u003c/pre>\n\u003cul>\u003cli>played: many-to-many player – match, thuộc tính score (điểm cầu thủ ghi trong trận).\u003c/li>\u003cli>\u003cstrong>season_score()\u003c/strong> là derived: tổng score của player qua mọi bộ played của player đó (trong mùa giải).\u003c/li>\u003cli>Lược đồ: player(\u003cu>player_id\u003c/u>, name, age), match(\u003cu>match_id\u003c/u>, date, stadium, opponent, own_score, opp_score), played(\u003cu>match_id, player_id\u003c/u>, score); season_score hiện thực bằng view \u003ccode>sum(score) group by player_id\u003c/code>.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 6.4.\u003c/strong> Một E-R diagram có cùng một entity set xuất hiện nhiều lần, thuộc tính được lặp lại ở nhiều chỗ. Vì sao cho phép redundancy này là thói quen xấu?","en":"\u003cp>\u003cstrong>Exercise 6.4.\u003c/strong> In an E-R diagram the same entity set may appear several times, with its attributes repeated in more than one occurrence. Why is allowing this redundancy a bad practice that should be avoided?\u003c/p>","answer":"\u003cp>Entity set được vẽ nhiều lần thường vì diagram trải trên nhiều trang. Nếu ghi thuộc tính ở mỗi lần xuất hiện, các bản có thể \u003cstrong>khác nhau\u003c/strong> (thêm/bớt thuộc tính ở một chỗ) → diagram không nhất quán. Nên chỉ ghi thuộc tính \u003cstrong>một lần\u003c/strong>; các lần xuất hiện khác không ghi thuộc tính nào — vì entity set không thể không có thuộc tính, người đọc hiểu rằng thuộc tính được định nghĩa ở chỗ khác.\u003c/p>"},{"q":"\u003cstrong>PE 6.5.\u003c/strong> Xem E-R diagram như một đồ thị. Các điều sau có ý nghĩa gì với cấu trúc lược đồ doanh nghiệp? (a) Đồ thị không liên thông. (b) Đồ thị có chu trình.","en":"\u003cp>\u003cstrong>Exercise 6.5.\u003c/strong> An E-R diagram can be seen as a graph. What does each of the following mean for the structure of an enterprise schema?\u003c/p>\n\u003cp>a. The graph is disconnected.\u003c/p>\n\u003cp>b. The graph has a cycle.\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Hai entity set nối nhau bằng một đường đi thì có liên quan (có thể gián tiếp). Không liên thông nghĩa là có các cặp entity set hoàn toàn không liên quan: các phần đó của doanh nghiệp \u003cstrong>độc lập\u003c/strong>, thực chất mỗi thành phần liên thông là một CSDL riêng.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Có chu trình thì mọi cặp entity set trên chu trình liên quan với nhau theo \u003cstrong>ít nhất hai cách\u003c/strong> khác nhau. Nếu diagram không có chu trình, giữa hai entity set có đúng một đường đi, tức một quan hệ duy nhất.\u003c/p>"},{"q":"\u003cstrong>PE 6.6.\u003c/strong> Ternary relationship R(A, B, C) được biểu diễn bằng entity set E và ba binary relationship R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub> (Figure 6.29b). (a) Cho một instance của E, A, B, C, R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub> không tương ứng với instance nào của A, B, C, R. (b) Sửa diagram thêm ràng buộc để mọi instance thoả ràng buộc đều tương ứng với một instance của R. (c) Sửa cách dịch để xử lý total participation trên ternary relationship.","en":"\u003cp>\u003cstrong>Exercise 6.6.\u003c/strong> Consider representing the ternary relationship R of Figure 6.29a (among A, B, C) by an entity set E with binary relationships R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub>, as in Figure 6.29b (attributes not shown).\u003c/p>\n\u003cp>a. Give a simple instance of E, A, B, C, R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, and R\u003csub>C\u003c/sub> that cannot correspond to any instance of A, B, C, and R.\u003c/p>\n\u003cp>b. Modify the E-R diagram of Figure 6.29b by adding constraints that guarantee every instance of E, A, B, C, R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, and R\u003csub>C\u003c/sub> satisfying them corresponds to an instance of A, B, C, and R.\u003c/p>\n\u003cp>c. Modify the translation above so that it also handles total participation constraints on the ternary relationship.\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> E = {e1, e2}, A = {a1, a2}, B = {b1}, C = {c1}, R\u003csub>A\u003c/sub> = {(e1, a1), (e2, a2)}, R\u003csub>B\u003c/sub> = {(e1, b1)}, R\u003csub>C\u003c/sub> = {(e1, c1)}. e2 chỉ nối với a2 mà không nối b, c nào → không có bộ (a, b, c) nào ứng với e2.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Cho E \u003cstrong>total participation\u003c/strong> vào R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub> và R\u003csub>C\u003c/sub> (đường đôi), đồng thời mỗi R\u003csub>X\u003c/sub> là many-to-one từ E (mũi tên về A, B, C): mỗi e nối đúng một a, một b, một c.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[A] &lt;---- &lt;R_A&gt; ==== [E] ==== &lt;R_B&gt; ----&gt; [B]\n                      ||\n                    &lt;R_C&gt; ----&gt; [C]\u003c/code>\u003c/pre>\n\u003cp>(Nên thêm ràng buộc không có hai e cùng bộ (a, b, c) — trong SQL là \u003ccode>unique\u003c/code>.)\u003c/p>\n\u003cp>\u003cstrong>(c)\u003c/strong> Nếu A total trong R thì thêm total participation của A vào R\u003csub>A\u003c/sub>; tương tự cho B (R\u003csub>B\u003c/sub>) và C (R\u003csub>C\u003c/sub>).\u003c/p>"},{"q":"\u003cstrong>PE 6.7.\u003c/strong> Weak entity set luôn có thể biến thành strong entity set bằng cách thêm các thuộc tính primary key của identifying entity set. Hãy nêu loại redundancy phát sinh.","en":"\u003cp>\u003cstrong>Exercise 6.7.\u003c/strong> A weak entity set can always be turned into a strong entity set by adding to its attributes the primary-key attributes of its identifying entity set. Describe the kind of redundancy this produces.\u003c/p>","answer":"\u003cp>PK của weak entity suy ra được từ relationship với strong entity. Nếu thêm PK của owner vào weak entity, giá trị đó xuất hiện \u003cstrong>cả\u003c/strong> trong entity set và trong relationship set (identifying relationship), và hai chỗ \u003cstrong>phải luôn bằng nhau\u003c/strong> → redundancy (và nguy cơ không nhất quán). Ví dụ section có course_id trong khi sec_course đã nối section với course.\u003c/p>"},{"q":"\u003cstrong>PE 6.8.\u003c/strong> Xét relation sec_course sinh từ relationship set many-to-one sec_course. Các ràng buộc primary key và foreign key tạo trên relation này có ép được cardinality many-to-one không? Giải thích.","en":"\u003cp>\u003cstrong>Exercise 6.8.\u003c/strong> Take a relation such as \u003cem>sec_course\u003c/em>, created from the many-to-one relationship set \u003cem>sec_course\u003c/em>. Do the primary-key and foreign-key constraints created on that relation enforce the many-to-one cardinality constraint? Explain why.\u003c/p>","answer":"\u003cp>\u003cstrong>Có.\u003c/strong> PK của section là (course_id, sec_id, semester, year), cũng là PK của sec_course; course_id là FK từ sec_course tới course. Do đó mỗi section chỉ ứng với \u003cstrong>một\u003c/strong> course → many-to-one được ép.\u003c/p>\n\u003cp>Nhưng các ràng buộc này \u003cstrong>không\u003c/strong> ép được total participation: một course (hoặc một section) có thể không xuất hiện trong sec_course.\u003c/p>"},{"q":"\u003cstrong>PE 6.9.\u003c/strong> Giả sử relationship set advisor là one-to-one. Cần thêm ràng buộc gì trên relation advisor để ép cardinality one-to-one?","en":"\u003cp>\u003cstrong>Exercise 6.9.\u003c/strong> Suppose the \u003cem>advisor\u003c/em> relationship set were one-to-one. Which additional constraints are needed on the relation \u003cem>advisor\u003c/em> so that the one-to-one cardinality constraint is enforced?\u003c/p>","answer":"\u003cp>Ngoài khai báo \u003cstrong>s_ID là primary key\u003c/strong> của advisor, khai báo \u003cstrong>i_ID là superkey\u003c/strong> — trong SQL dùng \u003ccode>unique (i_ID)\u003c/code>. Như vậy mỗi student có tối đa một instructor và mỗi instructor hướng dẫn tối đa một student.\u003c/p>"},{"q":"\u003cstrong>PE 6.10.\u003c/strong> R là relationship many-to-one giữa A và B; relation của R được gộp vào relation của A. Trong SQL, thuộc tính tham gia foreign key có thể null. Giải thích cách ép total participation của A trong R bằng not null.","en":"\u003cp>\u003cstrong>Exercise 6.10.\u003c/strong> Let R be a many-to-one relationship between entity sets A and B, and suppose the relation created from R is merged into the relation created from A. In SQL, attributes that take part in a foreign-key constraint may be null. Explain how total participation of A in R can be enforced with \u003cstrong>not null\u003c/strong> constraints in SQL.\u003c/p>","answer":"\u003cp>Khai báo thuộc tính FK (trong bảng A, ứng với PK của B) là \u003cstrong>not null\u003c/strong>. Một a không liên kết b nào sẽ phải có FK null khi gộp R vào A — bị cấm. Ví dụ instructor(ID, name, dept_name \u003cstrong>not null\u003c/strong> references department) ép mỗi instructor thuộc một khoa.\u003c/p>"},{"q":"\u003cstrong>PE 6.11.\u003c/strong> Foreign key trong SQL chỉ tham chiếu được primary key hoặc thuộc tính unique. Vì thế total participation trên relationship many-to-many (hoặc trên phía \"one\" của one-to-many) không ép được bằng primary key, foreign key và not null. (a) Giải thích vì sao. (b) Giải thích cách ép bằng check phức tạp hoặc assertion.","en":"\u003cp>\u003cstrong>Exercise 6.11.\u003c/strong> In SQL a foreign key may reference only the primary-key attributes of the referenced relation, or other attributes declared as a superkey with \u003cstrong>unique\u003c/strong>. Consequently, total participation constraints on a many-to-many relationship set (or on the “one” side of a one-to-many relationship set) cannot be enforced on the relations created from that relationship set using only primary-key, foreign-key, and not-null constraints.\u003c/p>\n\u003cp>a. Explain why.\u003c/p>\n\u003cp>b. Explain how total participation constraints can be enforced using complex check constraints or assertions (see Section 4.4.8). (These features are, unfortunately, not supported by any widely used database at present.)\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Với many-to-many, R phải là bảng riêng. Không có cách nào trong SQL bảo đảm mỗi giá trị PK của E1 xuất hiện trong R, vì cột tương ứng của R \u003cstrong>không unique\u003c/strong>, mà FK chỉ được trỏ tới PK/unique. Tương tự với one-to-many: không thể bảo đảm giá trị ở phía \"one\" xuất hiện trong bảng phía \"many\".\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> R many-to-one từ A tới B (A chứa FK b). Đặt trên bảng B:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>constraint total_part check (b in (select b from A));\nset constraints total_part deferred;\u003c/code>\u003c/pre>\n\u003cp>hoặc assertion \u003ccode>create assertion ... check (not exists (select * from B where b not in (select b from A)))\u003c/code>. Phải \u003cstrong>deferred\u003c/strong> (kiểm tra cuối transaction): chèn b vào B trước thì vi phạm total; chèn A trước thì vi phạm foreign key. PostgreSQL không có assertion/check có subquery → dùng \u003cstrong>constraint trigger deferrable initially deferred\u003c/strong> (bài CK1.09).\u003c/p>"},{"q":"\u003cstrong>PE 6.12.\u003c/strong> Cấu trúc lattice: X và Y là entity cấp cao; A là specialization của X, C của Y, B của cả X và Y. Giải thích cách A, B, C thừa kế thuộc tính. Xử lý thế nào khi X và Y có thuộc tính trùng tên?","en":"\u003cp>\u003cstrong>Exercise 6.12.\u003c/strong> Consider a lattice of generalization and specialization (attributes not shown) with higher-level entity sets X and Y and lower-level entity sets A, B, C: A specializes X, B specializes both X and Y, and C specializes Y.\u003c/p>\n\u003cp>For entity sets A, B, and C, explain how attributes are inherited from the higher-level entity sets X and Y. Discuss how to deal with the case where an attribute of X has the same name as an attribute of Y.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>   [X]       [Y]\n   / \\       / \\\n [A]   [B]-----  [C]\u003c/code>\u003c/pre>\n\u003cul>\u003cli>A thừa kế mọi thuộc tính của X, cộng thuộc tính riêng.\u003c/li>\u003cli>C thừa kế mọi thuộc tính của Y, cộng thuộc tính riêng.\u003c/li>\u003cli>B thừa kế thuộc tính của \u003cstrong>cả X và Y\u003c/strong> (multiple inheritance).\u003c/li>\u003cli>Nếu X và Y cùng có thuộc tính \u003ccode>name\u003c/code>, trong B dùng tên đầy đủ \u003cstrong>X.name\u003c/strong> và \u003cstrong>Y.name\u003c/strong> để phân biệt.\u003c/li>\u003c/ul>\n\u003cp>Bảng (method 1): x(\u003cu>id\u003c/u>, ...), y(\u003cu>id\u003c/u>, ...), b(\u003cu>id\u003c/u>, ...) với id vừa là FK → x vừa là FK → y.\u003c/p>"},{"q":"\u003cstrong>PE 6.13.\u003c/strong> E-R thường mô hình trạng thái doanh nghiệp tại một thời điểm. Muốn theo dõi thay đổi theo thời gian: định nghĩa kiểu valid time (khoảng hoặc tập khoảng thời gian), gắn valid time cho mỗi entity và relationship; thuộc tính thay đổi theo thời gian là tập giá trị, mỗi giá trị có valid time riêng (end time có thể là vô cực). (a) Vẽ E-R có student, instructor, advisor với các mở rộng này. (b) Chuyển sang tập relation.","en":"\u003cp>\u003cstrong>Exercise 6.13.\u003c/strong> An E-R diagram normally models the state of an enterprise at one point in time. Suppose instead we want to track \u003cem>temporal changes\u003c/em>, i.e., how data changes over time. For instance, Zhang may have been a student from September 2015 to May 2019, and Shankar may have had instructor Einstein as advisor from May 2018 to December 2018 and again from June 2019 to January 2020. Likewise, attribute values of entities or relationships — such as \u003cem>title\u003c/em> and \u003cem>credits\u003c/em> of \u003cem>course\u003c/em>, \u003cem>salary\u003c/em> or even \u003cem>name\u003c/em> of \u003cem>instructor\u003c/em>, and \u003cem>tot_cred\u003c/em> of \u003cem>student\u003c/em> — can change over time.\u003c/p>\n\u003cp>One way to model this: define a new data type \u003cstrong>valid time\u003c/strong>, which is a time interval or a set of time intervals, and attach a \u003cem>valid_time\u003c/em> attribute to every entity and relationship, recording the periods during which it is valid. The end of an interval may be infinity; e.g., if Shankar became a student in September 2018 and still is one, the end of the valid-time interval of the Shankar entity is infinity. Attributes that change over time are modeled as a set of values, each with its own \u003cem>valid_time\u003c/em>.\u003c/p>\n\u003cp>a. Draw an E-R diagram with the \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em> entities and the \u003cem>advisor\u003c/em> relationship, using the extensions above to track temporal changes.\u003c/p>\n\u003cp>b. Convert that E-R diagram into a set of relations.\u003c/p>\n\u003cp>The resulting set of relations is clearly quite complex, which makes tasks such as writing SQL queries difficult. A more widely used alternative is to ignore temporal changes (especially changes to attribute values) while designing the E-R model, and then modify the relations generated from the E-R model so that they track temporal changes.\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[student]                         [instructor]\n student_id                        instructor_id\n {valid_times(start_time, end_time)}  {valid_times(start_time, end_time)}\n {name(value, start_time, end_time)}  {name(value, start_time, end_time)}\n {dept_name(value, start_time, end_time)} {dept_name(value, start_time, end_time)}\n {tot_cred(value, start_time, end_time)}  {salary(value, start_time, end_time)}\n        \\                              /\n         ------- &lt;advisor&gt; ------------\n                  {valid_time(start_time, end_time)}\u003c/code>\u003c/pre>\n\u003cp>student_id, instructor_id không đổi theo thời gian; mọi thuộc tính khác là multivalued composite.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong>\u003c/p>\n\u003cul>\u003cli>student(\u003cu>student_id\u003c/u>), student_valid_times(\u003cu>student_id, start_time, end_time\u003c/u>)\u003c/li>\u003cli>student_name(\u003cu>student_id, value, start_time, end_time\u003c/u>), student_dept_name(...), student_tot_cred(...)\u003c/li>\u003cli>instructor(\u003cu>instructor_id\u003c/u>), instructor_valid_times(...), instructor_name(...), instructor_dept_name(...), instructor_salary(...)\u003c/li>\u003cli>advisor(\u003cu>student_id, instructor_id, start_time, end_time\u003c/u>)\u003c/li>\u003c/ul>\n\u003cp>Nếu thêm ràng buộc các khoảng không chồng nhau (hoặc một start_time không có hai end_time) thì có thể bỏ end_time khỏi primary key. Tập relation này phức tạp, truy vấn SQL khó viết; thực tế người ta thường bỏ qua thời gian khi thiết kế E-R rồi thêm start/end time vào các relation sinh ra.\u003c/p>"}],"exercises":[{"id":"CK1.01","topic":"PE 6.1 DDL","level":3,"prompt":"\u003cp>\u003cstrong>PE 6.1 — hiện thực bằng SQL.\u003c/strong> Tạo các bảng (mọi khoá/chuỗi varchar(10), tiền numeric(10,2), ngày date):\u003c/p>\n\u003cul>\u003cli>\u003ccode>ins_customer(customer_id, name, address)\u003c/code>\u003c/li>\u003cli>\u003ccode>ins_policy(policy_id)\u003c/code>\u003c/li>\u003cli>\u003ccode>ins_car(license_no, model, policy_id)\u003c/code> — covers gộp vào car, mỗi xe thuộc \u003cstrong>đúng một\u003c/strong> policy\u003c/li>\u003cli>\u003ccode>ins_owns(customer_id, license_no)\u003c/code> — many-to-many\u003c/li>\u003cli>\u003ccode>ins_accident(report_id, acc_date, place)\u003c/code>\u003c/li>\u003cli>\u003ccode>ins_participated(report_id, license_no)\u003c/code>\u003c/li>\u003cli>\u003ccode>ins_premium_payment(policy_id, payment_no, due_date, amount, received_on)\u003c/code> — \u003cstrong>weak entity\u003c/strong> của policy (xoá theo policy)\u003c/li>\u003c/ul>","en":"\u003cp>\u003cstrong>Exercise 6.1.\u003c/strong> Construct an E-R diagram for a car-insurance company. Each customer owns one or more cars. Each car has zero or more recorded accidents. Each insurance policy covers one or more cars and has one or more premium payments. Each payment covers a particular period of time and has a due date and the date on which the payment was received.\u003c/p>","hint":"premium_payment: PK (policy_id, payment_no), FK on delete cascade; ins_car.policy_id not null.","solution":"create table ins_customer (customer_id varchar(10) primary key, name varchar(10), address varchar(10));\ncreate table ins_policy (policy_id varchar(10) primary key);\ncreate table ins_car (\n  license_no varchar(10) primary key,\n  model      varchar(10),\n  policy_id  varchar(10) not null references ins_policy\n);\ncreate table ins_owns (\n  customer_id varchar(10) references ins_customer,\n  license_no  varchar(10) references ins_car,\n  primary key (customer_id, license_no)\n);\ncreate table ins_accident (report_id varchar(10) primary key, acc_date date, place varchar(10));\ncreate table ins_participated (\n  report_id  varchar(10) references ins_accident,\n  license_no varchar(10) references ins_car,\n  primary key (report_id, license_no)\n);\ncreate table ins_premium_payment (\n  policy_id   varchar(10) references ins_policy on delete cascade,\n  payment_no  varchar(10),\n  due_date    date,\n  amount      numeric(10,2),\n  received_on date,\n  primary key (policy_id, payment_no)\n);","check":"select try_sql($$insert into ins_policy values ('P1'), ('P2')$$)                                   as policies,\n       try_sql($$insert into ins_car values ('C1', 'Vios', 'P1'), ('C2', 'City', 'P1')$$)            as two_cars_one_policy,\n       try_sql($$insert into ins_car values ('C3', 'Orphan', null)$$)                                as car_without_policy,\n       try_sql($$insert into ins_customer values ('U1', 'An', 'Hue')$$)                               as customer,\n       try_sql($$insert into ins_owns values ('U1', 'C1'), ('U1', 'C2')$$)                            as owns_two,\n       try_sql($$insert into ins_accident values ('R1', '2025-01-01', 'Hue')$$)                       as accident,\n       try_sql($$insert into ins_participated values ('R1', 'C1'), ('R1', 'C2')$$)                    as two_cars_one_accident,\n       try_sql($$insert into ins_premium_payment values ('P1', '1', '2025-01-31', 100, null)$$)       as pay_1,\n       try_sql($$insert into ins_premium_payment values ('P2', '1', '2025-01-31', 100, null)$$)       as same_no_other_policy,\n       try_sql($$insert into ins_premium_payment values ('P1', '1', '2025-02-28', 100, null)$$)       as duplicate_payment,\n       try_sql($$insert into ins_premium_payment values ('P9', '1', '2025-02-28', 100, null)$$)       as no_policy,\n       try_sql($$delete from ins_policy where policy_id = 'P2'$$)                                    as delete_policy,\n       sql_value($$select count(*) from ins_premium_payment$$)                                      as payments_left;","ordered":false,"fresh":false,"expected":{"fields":["policies","two_cars_one_policy","car_without_policy","customer","owns_two","accident","two_cars_one_accident","pay_1","same_no_other_policy","duplicate_payment","no_policy","delete_policy","payments_left"],"rows":[["ok","ok","23502","ok","ok","ok","ok","ok","ok","23505","23503","ok","1"]]}},{"id":"CK1.02","topic":"PE 6.2a ternary","level":3,"prompt":"\u003cp>\u003cstrong>PE 6.2(a)\u003c/strong> — exam là entity, dùng ternary relationship. Tạo:\u003c/p>\n\u003cul>\u003cli>\u003ccode>exam(exam_id varchar(5) primary key, name varchar(20), place varchar(20), exam_time timestamp)\u003c/code>\u003c/li>\u003cli>\u003ccode>exam_marks(ID, course_id, sec_id, semester, year, exam_id, marks)\u003c/code> (kiểu cột giống bảng takes; marks numeric(5,2)) với primary key là ternary (student, section, exam), FK ID → student, (course_id, sec_id, semester, year) → section, exam_id → exam.\u003c/li>\u003c/ul>","en":"\u003cp>\u003cstrong>Exercise 6.2 (a).\u003c/strong> A database contains the entity sets \u003cem>student\u003c/em>, \u003cem>course\u003c/em>, and \u003cem>section\u003c/em> of the university schema, and in addition records the marks students obtain in the different exams of the different sections.\u003c/p>\n\u003cp>a. Construct an E-R diagram that models exams as entities and uses a ternary relationship in the design.\u003c/p>","hint":"","solution":"create table exam (\n  exam_id    varchar(5) primary key,\n  name       varchar(20),\n  place      varchar(20),\n  exam_time  timestamp\n);\ncreate table exam_marks (\n  ID         varchar(5) references student,\n  course_id  varchar(8),\n  sec_id     varchar(8),\n  semester   varchar(6),\n  year       numeric(4,0),\n  exam_id    varchar(5) references exam,\n  marks      numeric(5,2),\n  primary key (ID, course_id, sec_id, semester, year, exam_id),\n  foreign key (course_id, sec_id, semester, year) references section\n);","check":"select try_sql($$insert into exam values ('MT', 'Midterm', 'Watson 100', '2017-10-15 09:00'), ('FN', 'Final', 'Packard 101', '2017-12-15 09:00')$$) as exams,\n       try_sql($$insert into exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'MT', 8.5)$$)  as mark_mt,\n       try_sql($$insert into exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'FN', 9)$$)    as mark_fn,\n       try_sql($$insert into exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'MT', 7)$$)    as duplicate,\n       try_sql($$insert into exam_marks values ('00128', 'CS-101', '9', 'Fall', 2017, 'MT', 7)$$)    as bad_section,\n       try_sql($$insert into exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'XX', 7)$$)    as bad_exam;","ordered":false,"fresh":false,"expected":{"fields":["exams","mark_mt","mark_fn","duplicate","bad_section","bad_exam"],"rows":[["ok","ok","ok","23505","23503","23503"]]}},{"id":"CK1.03","topic":"PE 6.2b binary","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.2(b)\u003c/strong> — chỉ một binary relationship student–section với thuộc tính multivalued composite {exam_marks(exam_id, marks)}. Tạo bảng \u003ccode>sec_exam_marks(ID, course_id, sec_id, semester, year, exam_id varchar(5), marks numeric(5,2))\u003c/code> (FK tới student và section; \u003cstrong>không\u003c/strong> có bảng exam) sao cho một sinh viên trong một section có nhiều bài thi nhưng mỗi bài thi một điểm.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.2 (b).\u003c/strong> A database contains the entity sets \u003cem>student\u003c/em>, \u003cem>course\u003c/em>, and \u003cem>section\u003c/em> of the university schema, and in addition records the marks students obtain in the different exams of the different sections.\u003c/p>\n\u003cp>b. Construct an alternative E-R diagram that uses only a binary relationship between \u003cem>student\u003c/em> and \u003cem>section\u003c/em>. There must be only one relationship between a given \u003cem>student\u003c/em> and \u003cem>section\u003c/em> pair, yet it must still be possible to represent the marks a student gets in different exams.\u003c/p>","hint":"","solution":"create table sec_exam_marks (\n  ID         varchar(5) references student,\n  course_id  varchar(8),\n  sec_id     varchar(8),\n  semester   varchar(6),\n  year       numeric(4,0),\n  exam_id    varchar(5),\n  marks      numeric(5,2),\n  primary key (ID, course_id, sec_id, semester, year, exam_id),\n  foreign key (course_id, sec_id, semester, year) references section\n);","check":"select try_sql($$insert into sec_exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'MT', 8.5)$$) as mt,\n       try_sql($$insert into sec_exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'FN', 9)$$)   as fn,\n       try_sql($$insert into sec_exam_marks values ('00128', 'CS-101', '1', 'Fall', 2017, 'MT', 6)$$)   as duplicate_exam,\n       try_sql($$insert into sec_exam_marks values ('99999', 'CS-101', '1', 'Fall', 2017, 'MT', 6)$$)   as bad_student,\n       (select count(*) from information_schema.tables where table_name = 'exam') as exam_table;","ordered":false,"fresh":false,"expected":{"fields":["mt","fn","duplicate_exam","bad_student","exam_table"],"rows":[["ok","ok","23505","23503","0"]]}},{"id":"CK1.04","topic":"PE 6.3 derived (view)","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.3\u003c/strong> — dữ liệu có sẵn: \u003ccode>er_player(player_id, name, age)\u003c/code>, \u003ccode>er_match(...)\u003c/code>, \u003ccode>er_played(match_id, player_id, score)\u003c/code>. Hiện thực derived attribute season_score: tạo view \u003ccode>season_score(player_id, name, season_score)\u003c/code> cho \u003cstrong>mọi\u003c/strong> cầu thủ (cầu thủ chưa đá trận nào có 0).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.3.\u003c/strong> Design an E-R diagram that keeps track of the scoring statistics of your favorite sports team. Store the matches played, the scores of each match, the players in each match, and each player’s individual scoring statistics for each match. Model summary statistics as derived attributes, explaining how each one is computed.\u003c/p>","hint":"left join + coalesce(sum(score), 0).","solution":"create view season_score (player_id, name, season_score) as\n  select p.player_id, p.name, coalesce(sum(pl.score), 0)\n  from er_player p left join er_played pl on pl.player_id = p.player_id\n  group by p.player_id, p.name;","check":"select * from season_score;","ordered":false,"fresh":false,"expected":{"fields":["player_id","name","season_score"],"rows":[["PL4","Hai","0"],["PL5","Long","0"],["PL1","Minh","3"],["PL3","Tuan","1"],["PL2","Quang","2"]]}},{"id":"CK1.05","topic":"PE 6.3 derived (query)","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.3\u003c/strong> — thêm derived attribute \u003ccode>result()\u003c/code> của match: \u003ccode>W\u003c/code> nếu own_score > opp_score, \u003ccode>D\u003c/code> nếu bằng, \u003ccode>L\u003c/code> nếu thua. Trả về match_id, opponent, result, và số cầu thủ đã ra sân (\u003ccode>num_players\u003c/code>), sắp theo match_date.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.3.\u003c/strong> Design an E-R diagram that keeps track of the scoring statistics of your favorite sports team. Store the matches played, the scores of each match, the players in each match, and each player’s individual scoring statistics for each match. Model summary statistics as derived attributes, explaining how each one is computed.\u003c/p>","hint":"","solution":"select m.match_id, m.opponent,\n       case when m.own_score > m.opp_score then 'W'\n            when m.own_score = m.opp_score then 'D'\n            else 'L' end as result,\n       count(pl.player_id) as num_players\nfrom er_match m left join er_played pl on pl.match_id = m.match_id\ngroup by m.match_id, m.opponent, m.own_score, m.opp_score, m.match_date\norder by m.match_date;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["match_id","opponent","result","num_players"],"rows":[["M1","Thailand","W","3"],["M2","Malaysia","D","3"],["M3","Indonesia","W","3"],["M4","Singapore","L","3"]]}},{"id":"CK1.06","topic":"PE 6.8 many-to-one","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.8\u003c/strong> — giả sử section có định danh riêng \u003ccode>section_id\u003c/code>. Tạo bảng \u003ccode>sec_course(section_id varchar(10), course_id varchar(8))\u003c/code> biểu diễn relationship \u003cstrong>many-to-one\u003c/strong> từ section tới course, ép được cardinality bằng primary key + foreign key (mỗi section thuộc đúng một course). Hệ thống cũng kiểm tra rằng course không có section nào vẫn hợp lệ — tức total participation \u003cstrong>không\u003c/strong> được ép.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.8.\u003c/strong> Take a relation such as \u003cem>sec_course\u003c/em>, created from the many-to-one relationship set \u003cem>sec_course\u003c/em>. Do the primary-key and foreign-key constraints created on that relation enforce the many-to-one cardinality constraint? Explain why.\u003c/p>","hint":"","solution":"create table sec_course (\n  section_id  varchar(10) primary key,\n  course_id   varchar(8) not null references course\n);","check":"select try_sql($$insert into sec_course values ('S1', 'CS-101')$$) as s1,\n       try_sql($$insert into sec_course values ('S2', 'CS-101')$$) as same_course,\n       try_sql($$insert into sec_course values ('S1', 'CS-347')$$) as section_second_course,\n       try_sql($$insert into sec_course values ('S3', 'XX-000')$$) as bad_course,\n       sql_value($$select count(*) from course where course_id not in (select course_id from sec_course)$$) as courses_without_section;","ordered":false,"fresh":false,"expected":{"fields":["s1","same_course","section_second_course","bad_course","courses_without_section"],"rows":[["ok","ok","23505","23503","12"]]}},{"id":"CK1.07","topic":"PE 6.9 one-to-one","level":1,"prompt":"\u003cp>\u003cstrong>PE 6.9\u003c/strong> — tạo \u003ccode>advisor_1to1(s_ID varchar(5), i_ID varchar(5))\u003c/code> là phiên bản \u003cstrong>one-to-one\u003c/strong> của advisor: s_ID là primary key, và thêm ràng buộc để mỗi instructor hướng dẫn tối đa một sinh viên. FK tới student/instructor.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.9.\u003c/strong> Suppose the \u003cem>advisor\u003c/em> relationship set were one-to-one. Which additional constraints are needed on the relation \u003cem>advisor\u003c/em> so that the one-to-one cardinality constraint is enforced?\u003c/p>","hint":"","solution":"create table advisor_1to1 (\n  s_ID  varchar(5) primary key references student (ID),\n  i_ID  varchar(5) unique references instructor (ID)\n);","check":"select try_sql($$insert into advisor_1to1 values ('00128', '45565')$$) as a1,\n       try_sql($$insert into advisor_1to1 values ('12345', '45565')$$) as instructor_twice,\n       try_sql($$insert into advisor_1to1 values ('00128', '10101')$$) as student_twice,\n       try_sql($$insert into advisor_1to1 values ('12345', '10101')$$) as a2;","ordered":false,"fresh":false,"expected":{"fields":["a1","instructor_twice","student_twice","a2"],"rows":[["ok","23505","23505","ok"]]}},{"id":"CK1.08","topic":"PE 6.10 not null","level":1,"prompt":"\u003cp>\u003cstrong>PE 6.10\u003c/strong> — relationship many-to-one \u003ccode>member_of\u003c/code> từ student tới \u003ccode>club\u003c/code>, \u003cstrong>total\u003c/strong> phía student, được gộp vào bảng phía many. Tạo \u003ccode>club(club_name varchar(20) primary key)\u003c/code> và \u003ccode>club_member(student_id varchar(5) primary key references student, club_name varchar(20))\u003c/code> sao cho mỗi club_member thuộc đúng một club đã tồn tại.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.10.\u003c/strong> Let R be a many-to-one relationship between entity sets A and B, and suppose the relation created from R is merged into the relation created from A. In SQL, attributes that take part in a foreign-key constraint may be null. Explain how total participation of A in R can be enforced with \u003cstrong>not null\u003c/strong> constraints in SQL.\u003c/p>","hint":"","solution":"create table club (club_name varchar(20) primary key);\ncreate table club_member (\n  student_id  varchar(5) primary key references student (ID),\n  club_name   varchar(20) not null references club\n);","check":"select try_sql($$insert into club values ('Chess'), ('Music')$$)            as clubs,\n       try_sql($$insert into club_member values ('00128', 'Chess')$$)         as m1,\n       try_sql($$insert into club_member values ('12345', null)$$)            as no_club,\n       try_sql($$insert into club_member values ('12345', 'Dance')$$)         as bad_club,\n       try_sql($$insert into club_member values ('00128', 'Music')$$)         as second_club;","ordered":false,"fresh":false,"expected":{"fields":["clubs","m1","no_club","bad_club","second_club"],"rows":[["ok","ok","23502","23503","23505"]]}},{"id":"CK1.09","topic":"PE 6.11 deferred trigger","level":3,"prompt":"\u003cp>\u003cstrong>PE 6.11\u003c/strong> — ép total participation ở phía \"one\". Tạo\u003c/p>\n\u003cul>\u003cli>\u003ccode>dept_t(dept_name varchar(20) primary key)\u003c/code>\u003c/li>\u003cli>\u003ccode>emp_t(emp_id varchar(5) primary key, dept_name varchar(20) not null references dept_t)\u003c/code> (many-to-one emp → dept)\u003c/li>\u003c/ul>\n\u003cp>và ràng buộc \u003cstrong>mỗi dept_t phải có ít nhất một emp_t\u003c/strong>. PostgreSQL không có assertion, nên dùng một trigger function \u003ccode>returns trigger\u003c/code> gắn bằng \u003cstrong>constraint trigger\u003c/strong> \u003ccode>deferrable initially deferred\u003c/code> (after insert/update trên dept_t và after delete/update trên emp_t). Khi vi phạm, hãy \u003ccode>raise exception ... using errcode = 'check_violation'\u003c/code>.\u003c/p>\n\u003cp>Hệ thống sẽ thử trong các khối riêng (kết thúc bằng \u003ccode>set constraints all immediate\u003c/code>): thêm khoa không có nhân viên (phải lỗi 23514), thêm khoa cùng nhân viên (ok), xoá nhân viên cuối cùng (phải lỗi).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.11.\u003c/strong> In SQL a foreign key may reference only the primary-key attributes of the referenced relation, or other attributes declared as a superkey with \u003cstrong>unique\u003c/strong>. Consequently, total participation constraints on a many-to-many relationship set (or on the “one” side of a one-to-many relationship set) cannot be enforced on the relations created from that relationship set using only primary-key, foreign-key, and not-null constraints.\u003c/p>\n\u003cp>a. Explain why.\u003c/p>\n\u003cp>b. Explain how total participation constraints can be enforced using complex check constraints or assertions (see Section 4.4.8). (These features are, unfortunately, not supported by any widely used database at present.)\u003c/p>","hint":"create constraint trigger t after insert or update on dept_t deferrable initially deferred for each row execute function f();","solution":"create table dept_t (dept_name varchar(20) primary key);\ncreate table emp_t (\n  emp_id     varchar(5) primary key,\n  dept_name  varchar(20) not null references dept_t\n);\ncreate function dept_has_emp() returns trigger language plpgsql as $$\nbegin\n  if exists (select 1 from dept_t d\n             where not exists (select 1 from emp_t e where e.dept_name = d.dept_name)) then\n    raise exception 'department without employee' using errcode = 'check_violation';\n  end if;\n  return null;\nend $$;\ncreate constraint trigger dept_total after insert or update on dept_t\n  deferrable initially deferred for each row execute function dept_has_emp();\ncreate constraint trigger emp_total after delete or update on emp_t\n  deferrable initially deferred for each row execute function dept_has_emp();","check":"select try_sql($q$do $x$ begin insert into dept_t values ('D1'); set constraints all immediate; end $x$$q$) as dept_alone,\n       try_sql($q$do $x$ begin insert into dept_t values ('D2'); insert into emp_t values ('E1', 'D2'); set constraints all immediate; end $x$$q$) as dept_with_emp,\n       try_sql($q$do $x$ begin insert into emp_t values ('E2', 'D2'); set constraints all immediate; end $x$$q$) as second_emp,\n       try_sql($q$do $x$ begin delete from emp_t; set constraints all immediate; end $x$$q$) as delete_all_emps,\n       sql_value($$select count(*) from dept_t$$) as depts,\n       sql_value($$select count(*) from emp_t$$)  as emps;","ordered":false,"fresh":false,"expected":{"fields":["dept_alone","dept_with_emp","second_emp","delete_all_emps","depts","emps"],"rows":[["23514","ok","ok","23514","1","2"]]}},{"id":"CK1.10","topic":"PE 6.8/6.11 vi phạm total","level":1,"prompt":"\u003cp>\u003cstrong>PE 6.8 / 6.11\u003c/strong> — nếu yêu cầu mỗi course phải có ít nhất một section (total participation của course trong sec_course), những course nào trong University database đang vi phạm? Trả về course_id, title.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.8.\u003c/strong> Take a relation such as \u003cem>sec_course\u003c/em>, created from the many-to-one relationship set \u003cem>sec_course\u003c/em>. Do the primary-key and foreign-key constraints created on that relation enforce the many-to-one cardinality constraint? Explain why.\u003c/p>\n\u003cp>\u003cstrong>Exercise 6.11.\u003c/strong> In SQL a foreign key may reference only the primary-key attributes of the referenced relation, or other attributes declared as a superkey with \u003cstrong>unique\u003c/strong>. Consequently, total participation constraints on a many-to-many relationship set (or on the “one” side of a one-to-many relationship set) cannot be enforced on the relations created from that relationship set using only primary-key, foreign-key, and not-null constraints.\u003c/p>\n\u003cp>a. Explain why.\u003c/p>\n\u003cp>b. Explain how total participation constraints can be enforced using complex check constraints or assertions (see Section 4.4.8). (These features are, unfortunately, not supported by any widely used database at present.)\u003c/p>","hint":"","solution":"select course_id, title from course\nwhere course_id not in (select course_id from section);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title"],"rows":[["BIO-399","Computational Biology"]]}},{"id":"CK1.11","topic":"PE 6.12 multiple inheritance","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.12\u003c/strong> — lattice: B là specialization của cả X và Y (method 1). Tạo \u003ccode>lat_x(id varchar(5) primary key, name varchar(20), x_attr integer)\u003c/code>, \u003ccode>lat_y(id varchar(5) primary key, name varchar(20), y_attr integer)\u003c/code> và \u003ccode>lat_b(id varchar(5) primary key, b_attr integer)\u003c/code> trong đó id của lat_b phải tồn tại ở \u003cstrong>cả\u003c/strong> lat_x và lat_y. Sau đó tạo view \u003ccode>lat_b_full(id, x_name, y_name, x_attr, y_attr, b_attr)\u003c/code> gom đủ thuộc tính thừa kế (hai thuộc tính name trùng tên được đổi thành x_name, y_name).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.12.\u003c/strong> Consider a lattice of generalization and specialization (attributes not shown) with higher-level entity sets X and Y and lower-level entity sets A, B, C: A specializes X, B specializes both X and Y, and C specializes Y.\u003c/p>\n\u003cp>For entity sets A, B, and C, explain how attributes are inherited from the higher-level entity sets X and Y. Discuss how to deal with the case where an attribute of X has the same name as an attribute of Y.\u003c/p>","hint":"","solution":"create table lat_x (id varchar(5) primary key, name varchar(20), x_attr integer);\ncreate table lat_y (id varchar(5) primary key, name varchar(20), y_attr integer);\ncreate table lat_b (\n  id      varchar(5) primary key references lat_x references lat_y,\n  b_attr  integer\n);\ncreate view lat_b_full (id, x_name, y_name, x_attr, y_attr, b_attr) as\n  select b.id, x.name, y.name, x.x_attr, y.y_attr, b.b_attr\n  from lat_b b join lat_x x on x.id = b.id join lat_y y on y.id = b.id;","check":"select try_sql($$insert into lat_x values ('K1', 'Xname', 1), ('K2', 'X2', 2)$$) as xs,\n       try_sql($$insert into lat_y values ('K1', 'Yname', 10)$$)                 as ys,\n       try_sql($$insert into lat_b values ('K1', 100)$$)                         as b_in_both,\n       try_sql($$insert into lat_b values ('K2', 200)$$)                         as b_only_in_x,\n       sql_value($$select x_name || '/' || y_name || '/' || (x_attr + y_attr + b_attr) from lat_b_full$$) as b_full;","ordered":false,"fresh":false,"expected":{"fields":["xs","ys","b_in_both","b_only_in_x","b_full"],"rows":[["ok","ok","ok","23503","Xname/Yname/111"]]}},{"id":"CK1.12","topic":"PE 6.13 temporal DDL","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.13(b)\u003c/strong> — tạo ba relation (date cho thời gian, varchar(5) cho ID, varchar(20) cho value): \u003ccode>t_student(student_id)\u003c/code>, \u003ccode>t_student_name(student_id, value, start_time, end_time)\u003c/code> và \u003ccode>t_advisor(student_id, instructor_id, start_time, end_time)\u003c/code> với primary key như lời giải của sách (end_time nằm trong khoá). t_student_name.student_id và t_advisor.student_id tham chiếu t_student.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.13.\u003c/strong> An E-R diagram normally models the state of an enterprise at one point in time. Suppose instead we want to track \u003cem>temporal changes\u003c/em>, i.e., how data changes over time. For instance, Zhang may have been a student from September 2015 to May 2019, and Shankar may have had instructor Einstein as advisor from May 2018 to December 2018 and again from June 2019 to January 2020. Likewise, attribute values of entities or relationships — such as \u003cem>title\u003c/em> and \u003cem>credits\u003c/em> of \u003cem>course\u003c/em>, \u003cem>salary\u003c/em> or even \u003cem>name\u003c/em> of \u003cem>instructor\u003c/em>, and \u003cem>tot_cred\u003c/em> of \u003cem>student\u003c/em> — can change over time.\u003c/p>\n\u003cp>One way to model this: define a new data type \u003cstrong>valid time\u003c/strong>, which is a time interval or a set of time intervals, and attach a \u003cem>valid_time\u003c/em> attribute to every entity and relationship, recording the periods during which it is valid. The end of an interval may be infinity; e.g., if Shankar became a student in September 2018 and still is one, the end of the valid-time interval of the Shankar entity is infinity. Attributes that change over time are modeled as a set of values, each with its own \u003cem>valid_time\u003c/em>.\u003c/p>\n\u003cp>a. Draw an E-R diagram with the \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em> entities and the \u003cem>advisor\u003c/em> relationship, using the extensions above to track temporal changes.\u003c/p>\n\u003cp>b. Convert that E-R diagram into a set of relations.\u003c/p>\n\u003cp>The resulting set of relations is clearly quite complex, which makes tasks such as writing SQL queries difficult. A more widely used alternative is to ignore temporal changes (especially changes to attribute values) while designing the E-R model, and then modify the relations generated from the E-R model so that they track temporal changes.\u003c/p>","hint":"","solution":"create table t_student (student_id varchar(5) primary key);\ncreate table t_student_name (\n  student_id  varchar(5) references t_student,\n  value       varchar(20),\n  start_time  date,\n  end_time    date,\n  primary key (student_id, start_time, end_time)\n);\ncreate table t_advisor (\n  student_id     varchar(5) references t_student,\n  instructor_id  varchar(5),\n  start_time     date,\n  end_time       date,\n  primary key (student_id, instructor_id, start_time, end_time)\n);","check":"select try_sql($$insert into t_student values ('S1')$$)                                         as student,\n       try_sql($$insert into t_student_name values ('S1', 'Shankar', '2018-09-01', 'infinity')$$)    as name_open_ended,\n       try_sql($$insert into t_student_name values ('S1', 'Shankar', '2018-09-01', 'infinity')$$)    as duplicate_name_period,\n       try_sql($$insert into t_advisor values ('S1', 'I1', '2018-05-01', '2018-12-31')$$)            as advisor_1,\n       try_sql($$insert into t_advisor values ('S1', 'I1', '2019-06-01', '2020-01-31')$$)            as same_advisor_again,\n       try_sql($$insert into t_advisor values ('S9', 'I1', '2019-06-01', '2020-01-31')$$)            as unknown_student;","ordered":false,"fresh":false,"expected":{"fields":["student","name_open_ended","duplicate_name_period","advisor_1","same_advisor_again","unknown_student"],"rows":[["ok","ok","23505","ok","ok","23503"]]}},{"id":"CK1.13","topic":"PE 6.13 query tại thời điểm","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.13\u003c/strong> — dữ liệu có sẵn: \u003ccode>er_t_advisor(student_id, instructor_id, start_time, end_time)\u003c/code>, \u003ccode>er_t_instructor_name(instructor_id, value, start_time, end_time)\u003c/code>. Ai (instructor_id và tên \u003cstrong>có hiệu lực tại thời điểm đó\u003c/strong>) là advisor của student \u003ccode>12345\u003c/code> vào ngày \u003ccode>2019-03-15\u003c/code>?\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.13.\u003c/strong> An E-R diagram normally models the state of an enterprise at one point in time. Suppose instead we want to track \u003cem>temporal changes\u003c/em>, i.e., how data changes over time. For instance, Zhang may have been a student from September 2015 to May 2019, and Shankar may have had instructor Einstein as advisor from May 2018 to December 2018 and again from June 2019 to January 2020. Likewise, attribute values of entities or relationships — such as \u003cem>title\u003c/em> and \u003cem>credits\u003c/em> of \u003cem>course\u003c/em>, \u003cem>salary\u003c/em> or even \u003cem>name\u003c/em> of \u003cem>instructor\u003c/em>, and \u003cem>tot_cred\u003c/em> of \u003cem>student\u003c/em> — can change over time.\u003c/p>\n\u003cp>One way to model this: define a new data type \u003cstrong>valid time\u003c/strong>, which is a time interval or a set of time intervals, and attach a \u003cem>valid_time\u003c/em> attribute to every entity and relationship, recording the periods during which it is valid. The end of an interval may be infinity; e.g., if Shankar became a student in September 2018 and still is one, the end of the valid-time interval of the Shankar entity is infinity. Attributes that change over time are modeled as a set of values, each with its own \u003cem>valid_time\u003c/em>.\u003c/p>\n\u003cp>a. Draw an E-R diagram with the \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em> entities and the \u003cem>advisor\u003c/em> relationship, using the extensions above to track temporal changes.\u003c/p>\n\u003cp>b. Convert that E-R diagram into a set of relations.\u003c/p>\n\u003cp>The resulting set of relations is clearly quite complex, which makes tasks such as writing SQL queries difficult. A more widely used alternative is to ignore temporal changes (especially changes to attribute values) while designing the E-R model, and then modify the relations generated from the E-R model so that they track temporal changes.\u003c/p>","hint":"date '2019-03-15' between start_time and end_time — áp dụng cho cả advisor và tên.","solution":"select a.instructor_id, n.value as name\nfrom er_t_advisor a\n     join er_t_instructor_name n on n.instructor_id = a.instructor_id\nwhere a.student_id = '12345'\n  and date '2019-03-15' between a.start_time and a.end_time\n  and date '2019-03-15' between n.start_time and n.end_time;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["instructor_id","name"],"rows":[["45565","Katz"]]}},{"id":"CK1.14","topic":"PE 6.13 lịch sử","level":2,"prompt":"\u003cp>\u003cstrong>PE 6.13\u003c/strong> — liệt kê toàn bộ lịch sử advisor của sinh viên có tên (hiện tại) \u003ccode>Shankar\u003c/code>: instructor_id, start_time, end_time, sắp theo start_time. (Tên sinh viên ở \u003ccode>er_t_student_name\u003c/code>.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.13.\u003c/strong> An E-R diagram normally models the state of an enterprise at one point in time. Suppose instead we want to track \u003cem>temporal changes\u003c/em>, i.e., how data changes over time. For instance, Zhang may have been a student from September 2015 to May 2019, and Shankar may have had instructor Einstein as advisor from May 2018 to December 2018 and again from June 2019 to January 2020. Likewise, attribute values of entities or relationships — such as \u003cem>title\u003c/em> and \u003cem>credits\u003c/em> of \u003cem>course\u003c/em>, \u003cem>salary\u003c/em> or even \u003cem>name\u003c/em> of \u003cem>instructor\u003c/em>, and \u003cem>tot_cred\u003c/em> of \u003cem>student\u003c/em> — can change over time.\u003c/p>\n\u003cp>One way to model this: define a new data type \u003cstrong>valid time\u003c/strong>, which is a time interval or a set of time intervals, and attach a \u003cem>valid_time\u003c/em> attribute to every entity and relationship, recording the periods during which it is valid. The end of an interval may be infinity; e.g., if Shankar became a student in September 2018 and still is one, the end of the valid-time interval of the Shankar entity is infinity. Attributes that change over time are modeled as a set of values, each with its own \u003cem>valid_time\u003c/em>.\u003c/p>\n\u003cp>a. Draw an E-R diagram with the \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em> entities and the \u003cem>advisor\u003c/em> relationship, using the extensions above to track temporal changes.\u003c/p>\n\u003cp>b. Convert that E-R diagram into a set of relations.\u003c/p>\n\u003cp>The resulting set of relations is clearly quite complex, which makes tasks such as writing SQL queries difficult. A more widely used alternative is to ignore temporal changes (especially changes to attribute values) while designing the E-R model, and then modify the relations generated from the E-R model so that they track temporal changes.\u003c/p>","hint":"","solution":"select a.instructor_id, a.start_time, a.end_time\nfrom er_t_advisor a\n     join er_t_student_name s on s.student_id = a.student_id\nwhere s.value = 'Shankar' and s.end_time = 'infinity'\norder by a.start_time;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["instructor_id","start_time","end_time"],"rows":[["22222","2018-05-01","2018-12-31"],["45565","2019-01-01","2019-05-31"],["22222","2019-06-01","2020-01-31"],["83821","2020-02-01","infinity"]]}},{"id":"CK1.15","topic":"PE 6.13 snapshot","level":3,"prompt":"\u003cp>\u003cstrong>PE 6.13\u003c/strong> — \"chụp\" trạng thái tại ngày \u003ccode>2021-06-01\u003c/code>: tạo view \u003ccode>advisor_snapshot_2021(student_name, instructor_name)\u003c/code> gồm các cặp advisor có hiệu lực ngày đó, với tên sinh viên và tên giảng viên có hiệu lực ngày đó.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 6.13.\u003c/strong> An E-R diagram normally models the state of an enterprise at one point in time. Suppose instead we want to track \u003cem>temporal changes\u003c/em>, i.e., how data changes over time. For instance, Zhang may have been a student from September 2015 to May 2019, and Shankar may have had instructor Einstein as advisor from May 2018 to December 2018 and again from June 2019 to January 2020. Likewise, attribute values of entities or relationships — such as \u003cem>title\u003c/em> and \u003cem>credits\u003c/em> of \u003cem>course\u003c/em>, \u003cem>salary\u003c/em> or even \u003cem>name\u003c/em> of \u003cem>instructor\u003c/em>, and \u003cem>tot_cred\u003c/em> of \u003cem>student\u003c/em> — can change over time.\u003c/p>\n\u003cp>One way to model this: define a new data type \u003cstrong>valid time\u003c/strong>, which is a time interval or a set of time intervals, and attach a \u003cem>valid_time\u003c/em> attribute to every entity and relationship, recording the periods during which it is valid. The end of an interval may be infinity; e.g., if Shankar became a student in September 2018 and still is one, the end of the valid-time interval of the Shankar entity is infinity. Attributes that change over time are modeled as a set of values, each with its own \u003cem>valid_time\u003c/em>.\u003c/p>\n\u003cp>a. Draw an E-R diagram with the \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em> entities and the \u003cem>advisor\u003c/em> relationship, using the extensions above to track temporal changes.\u003c/p>\n\u003cp>b. Convert that E-R diagram into a set of relations.\u003c/p>\n\u003cp>The resulting set of relations is clearly quite complex, which makes tasks such as writing SQL queries difficult. A more widely used alternative is to ignore temporal changes (especially changes to attribute values) while designing the E-R model, and then modify the relations generated from the E-R model so that they track temporal changes.\u003c/p>","hint":"","solution":"create view advisor_snapshot_2021 (student_name, instructor_name) as\n  select s.value, i.value\n  from er_t_advisor a\n       join er_t_student_name s on s.student_id = a.student_id\n       join er_t_instructor_name i on i.instructor_id = a.instructor_id\n  where date '2021-06-01' between a.start_time and a.end_time\n    and date '2021-06-01' between s.start_time and s.end_time\n    and date '2021-06-01' between i.start_time and i.end_time;","check":"select * from advisor_snapshot_2021;","ordered":false,"fresh":false,"expected":{"fields":["student_name","instructor_name"],"rows":[["Shankar","Brandt"],["Browne","Einstein"]]}}]},{"key":"ck2","store":"ck2","short":"CK2","label":"Ôn CK · Phần 2","navLabel":"CK2","kind":"Ôn tập","title":"Practice Exercises — Chapter 7","titleVi":"Practice Exercises Chương 7 (Normalization)","summary":"\u003ch3>Cách ôn phần này\u003c/h3>\n\u003col>\u003cli>Đọc \u003cstrong>cheat sheet\u003c/strong> dưới đây, thuộc 6 thuật toán.\u003c/li>\u003cli>Làm \u003cstrong>Câu hỏi tự luận\u003c/strong>: mỗi câu là đúng một Practice Exercise (PE 7.1 → 7.20) — tự giải ra giấy rồi mới mở đáp án.\u003c/li>\u003cli>Làm \u003cstrong>Bài tập SQL\u003c/strong>: chạy các kết luận của PE trên dữ liệu thật (kiểm tra FD, lossless, bảo toàn phụ thuộc, 4NF).\u003c/li>\u003cli>Đối chiếu mọi bài tính tay bằng \u003cstrong>Công cụ › Phụ thuộc hàm (FD)\u003c/strong> (có preset cho PE 7.1/7.6/7.7/7.13, 7.14, 7.17).\u003c/li>\u003c/ol>\n\u003ch3>Cheat sheet — thuật toán cần thuộc\u003c/h3>\n\u003cp>\u003cstrong>A. Bao đóng α⁺\u003c/strong>\u003c/p>\n\u003col>\u003cli>result := α\u003c/li>\u003cli>Lặp: với mỗi β → γ ∈ F, nếu β ⊆ result thì result := result ∪ γ\u003c/li>\u003cli>Dừng khi không đổi. α superkey ⇔ α⁺ = R; α → β ∈ F⁺ ⇔ β ⊆ α⁺.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>B. Tìm candidate key\u003c/strong>\u003c/p>\n\u003col>\u003cli>Thuộc tính không ở vế phải nào → có trong mọi key (gọi là lõi).\u003c/li>\u003cli>Nếu lõi⁺ = R thì lõi là key duy nhất.\u003c/li>\u003cli>Ngược lại thử thêm lần lượt 1, 2, … thuộc tính (chỉ những thuộc tính xuất hiện ở cả hai vế), bỏ qua tập chứa key đã tìm.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>C. Canonical cover\u003c/strong>\u003c/p>\n\u003col>\u003cli>Gộp các FD cùng vế trái (union).\u003c/li>\u003cli>Tìm \u003cstrong>một\u003c/strong> thuộc tính thừa: vế trái — A ∈ α thừa nếu (α − A)⁺ dưới F chứa β; vế phải — A ∈ β thừa nếu α⁺ dưới F' (đã bỏ A khỏi β) chứa A.\u003c/li>\u003cli>Xoá nó, quay lại bước 1 tới khi không đổi. \u003cstrong>Không xoá hai thuộc tính cùng lúc\u003c/strong> (PE 7.15). Kết quả có thể không duy nhất (PE 7.14).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>D. Lossless (phân rã đôi)\u003c/strong>: R₁ ∩ R₂ → R₁ hoặc R₁ ∩ R₂ → R₂ (tính (R₁ ∩ R₂)⁺).\u003c/p>\n\u003cp>\u003cstrong>E. Bảo toàn phụ thuộc\u003c/strong>: với mỗi α → β ∈ F: result := α; lặp với từng R\u003csub>i\u003c/sub>: result := result ∪ ((result ∩ R\u003csub>i\u003c/sub>)⁺ ∩ R\u003csub>i\u003c/sub>); FD được bảo toàn ⇔ β ⊆ result. (Mẹo nhanh: FD nằm trọn trong một R\u003csub>i\u003c/sub> thì chắc chắn được bảo toàn.)\u003c/p>\n\u003cp>\u003cstrong>F. BCNF\u003c/strong>: mọi α → β không tầm thường: α superkey. Phân rã: R → (α ∪ β), (R − (β − α)); lặp cho tới khi mọi bảng ở BCNF (trên bảng con phải xét F⁺, không chỉ F).\u003c/p>\n\u003cp>\u003cstrong>G. 3NF\u003c/strong>: mọi α → β: tầm thường, hoặc α superkey, hoặc mọi thuộc tính của β − α là prime. Tổng hợp: F\u003csub>c\u003c/sub> → mỗi FD một bảng αβ (nếu chưa có bảng chứa) → thêm một candidate key nếu chưa bảng nào chứa key → bỏ bảng nằm trong bảng khác.\u003c/p>\n\u003cp>\u003cstrong>H. Dạng chuẩn\u003c/strong>: 1NF (atomic) ⊃ 2NF (không phụ thuộc bộ phận vào key) ⊃ 3NF (không phụ thuộc bắc cầu vào key) ⊃ BCNF (vế trái là superkey) ⊃ 4NF (kể cả MVD).\u003c/p>\n\u003ch3>Bảng đối chiếu Practice Exercise → câu ôn\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Tự luận\u003c/th>\u003cth>SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>7.1\u003c/td>\u003ctd>Lossless của (ABC), (ADE)\u003c/td>\u003ctd>Câu 1\u003c/td>\u003ctd>CK2.05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.2\u003c/td>\u003ctd>Liệt kê FD thoả trên một instance\u003c/td>\u003ctd>Câu 2\u003c/td>\u003ctd>CK2.01, CK2.02\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.3\u003c/td>\u003ctd>FD biểu diễn quan hệ 1-1 / nhiều-1\u003c/td>\u003ctd>Câu 3\u003c/td>\u003ctd>CK2.14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.4\u003c/td>\u003ctd>Chứng minh union rule\u003c/td>\u003ctd>Câu 4\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.5\u003c/td>\u003ctd>Chứng minh pseudotransitivity\u003c/td>\u003ctd>Câu 5\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.6\u003c/td>\u003ctd>F⁺ và candidate key\u003c/td>\u003ctd>Câu 6\u003c/td>\u003ctd>CK2.06\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.7\u003c/td>\u003ctd>Canonical cover\u003c/td>\u003ctd>Câu 7\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.8\u003c/td>\u003ctd>Thuật toán α⁺ tuyến tính\u003c/td>\u003ctd>Câu 8\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.9\u003c/td>\u003ctd>SQL kiểm tra và ép FD B → C\u003c/td>\u003ctd>Câu 9\u003c/td>\u003ctd>CK2.03, CK2.04\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.10\u003c/td>\u003ctd>Null ở vế trái FD làm hỏng lossless\u003c/td>\u003ctd>Câu 10\u003c/td>\u003ctd>CK2.08\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.11\u003c/td>\u003ctd>PK/FK sau phân rã BCNF/3NF\u003c/td>\u003ctd>Câu 11\u003c/td>\u003ctd>CK2.09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.12\u003c/td>\u003ctd>u ⊆ r₁ ⋈ … ⋈ r\u003csub>n\u003c/sub>\u003c/td>\u003ctd>Câu 12\u003c/td>\u003ctd>CK2.10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.13\u003c/td>\u003ctd>(ABC), (ADE) không bảo toàn phụ thuộc\u003c/td>\u003ctd>Câu 13\u003c/td>\u003ctd>CK2.07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.14\u003c/td>\u003ctd>Nhiều canonical cover\u003c/td>\u003ctd>Câu 14\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.15\u003c/td>\u003ctd>Không xoá hai thuộc tính thừa cùng lúc\u003c/td>\u003ctd>Câu 15\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.16\u003c/td>\u003ctd>3NF + candidate key ⇒ lossless\u003c/td>\u003ctd>Câu 16\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.17\u003c/td>\u003ctd>Ba phân rã BCNF khác nhau\u003c/td>\u003ctd>Câu 17\u003c/td>\u003ctd>CK2.11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.18\u003c/td>\u003ctd>Định nghĩa 3NF qua phụ thuộc bắc cầu\u003c/td>\u003ctd>Câu 18\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.19\u003c/td>\u003ctd>3NF ⇒ 2NF\u003c/td>\u003ctd>Câu 19\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.20\u003c/td>\u003ctd>BCNF nhưng không 4NF\u003c/td>\u003ctd>Câu 20\u003c/td>\u003ctd>CK2.12, CK2.13\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Các PE chỉ có \"—\" là chứng minh/lập luận, không chạy SQL được; hãy luyện viết ra giấy.\u003c/p>","quiz":[{"q":"(PE 7.1) R = (A, B, C, D, E), F = {A → BC, CD → E, B → D, E → A}, phân rã (A, B, C), (A, D, E). Vì sao lossless?","options":["Vì A → D","Vì R₁ ∩ R₂ = A và A → ABC (A là candidate key)","Vì mọi phân rã thành 2 bảng đều lossless","Vì E → A"],"answer":1,"explain":"Phần chung A là superkey của R₁ (thậm chí của R)."},{"q":"(PE 7.2) Instance r(A, B, C) = {(a1,b1,c1), (a1,b1,c2), (a2,b1,c1), (a2,b1,c3)}. FD đơn nào thoả?","options":["A → C","C → A","A → B và C → B","B → A"],"answer":2,"explain":"Mọi dòng có cùng b1 nên mọi X → B đều thoả; A → C sai (dòng 1, 2), C → A sai (dòng 1, 3)."},{"q":"(PE 7.3) FD nào biểu diễn quan hệ NHIỀU-MỘT từ student tới instructor?","options":["Pk(instructor) → Pk(student)","Pk(student) → Pk(instructor)","Cả hai chiều","Không biểu diễn được bằng FD"],"answer":1,"explain":"Mỗi student ứng với ≤ 1 instructor. Có thêm chiều ngược lại thì thành một-một."},{"q":"(PE 7.4) Chứng minh union rule (α → β, α → γ ⇒ α → βγ) cần những tiên đề nào?","options":["Chỉ reflexivity","Augmentation (hai lần) và transitivity","Chỉ transitivity","Decomposition"],"answer":1,"explain":"α → αβ (augment α), αβ → γβ (augment β), rồi bắc cầu."},{"q":"(PE 7.6) Candidate key của R = (A, B, C, D, E) với F = {A → BC, CD → E, B → D, E → A}:","options":["A","A, E","A, E, BC, CD","A, BC, BD"],"answer":2,"explain":"A⁺ = E⁺ = (BC)⁺ = (CD)⁺ = R; B⁺ = BD, (BD)⁺ = BD nên BD không phải key."},{"q":"(PE 7.7) Canonical cover của F trong PE 7.6 là:","options":["F (không có gì thừa)","{A → B, A → C, CD → E, B → D, E → A}","{A → BC, B → D, E → A}","{A → BCDE, E → A}"],"answer":0,"explain":"Vế trái khác nhau, kiểm tra từng thuộc tính đều không thừa."},{"q":"(PE 7.9) Câu SQL nào trả về rỗng khi và chỉ khi B → C đúng trên r?","options":["select B from r group by B having count(distinct C) > 1","select B, C from r group by B, C having count(*) > 1","select C from r group by C having count(distinct B) > 1","select count(*) from r"],"answer":0,"explain":"Một giá trị B đi với ≥ 2 giá trị C là vi phạm. Đáp án C kiểm tra C → B."},{"q":"(PE 7.10) Vì sao null ở vế trái của FD dùng để phân rã có thể làm phân rã thành lossy?","options":["Vì null làm sai primary key","Vì natural join so sánh null = null cho unknown nên các tuple có null ở thuộc tính chung bị loại khỏi kết quả","Vì null chiếm nhiều bộ nhớ","Vì FD không áp dụng cho null"],"answer":1,"explain":"Ở đây \"lossy\" theo nghĩa mất tuple, khác lossy thông thường (thừa tuple)."},{"q":"(PE 7.11) Phân rã BCNF r(α, β, γ) theo α → β thành r₁(α, β), r₂(α, γ). Ràng buộc nên có:","options":["α là primary key của r₂","α là primary key của r₁, và α trong r₂ là foreign key tham chiếu r₁","β là foreign key","Không cần ràng buộc"],"answer":1,"explain":"Thiếu FK thì có thể xoá dòng ở r₁ mà vẫn còn dòng tham chiếu ở r₂."},{"q":"(PE 7.12) Với phân rã bất kỳ, quan hệ giữa u và r₁ ⋈ … ⋈ r\u003csub>n\u003c/sub> (r\u003csub>i\u003c/sub> = Π\u003csub>Ri\u003c/sub>(u)) là:","options":["u = join","u ⊆ join","join ⊆ u","Không xác định"],"answer":1,"explain":"Mỗi tuple t của u tự join lại thành t. Bằng nhau khi phân rã lossless."},{"q":"(PE 7.13) FD nào KHÔNG được bảo toàn khi tách R ở PE 7.1 thành (A, B, C), (A, D, E)?","options":["A → BC","E → A","B → D","Mọi FD đều được bảo toàn"],"answer":2,"explain":"B và D ở hai bảng khác nhau; B⁺ trong R₁ chỉ là B nên không bắc cầu qua A được. (CD → E cũng bị mất.)"},{"q":"(PE 7.14) F = {X → YZ, Y → XZ, Z → XY}. Khẳng định nào đúng?","options":["Canonical cover là duy nhất","Có nhiều canonical cover, ví dụ {X → Y, Y → Z, Z → X} và {X → Z, Y → X, Z → Y}","F không có canonical cover","Canonical cover phải giữ nguyên F"],"answer":1,"explain":"Thứ tự xoá thuộc tính thừa khác nhau cho kết quả khác nhau nhưng tương đương."},{"q":"(PE 7.15) Trong X → YZ (PE 7.14), Y và Z đều được suy ra là thừa. Xoá cả hai cùng lúc thì sao?","options":["Vẫn đúng","Mất X → YZ: không còn suy ra được từ F mới","Lỗi cú pháp","Được canonical cover nhỏ hơn"],"answer":1,"explain":"Xoá Y thì Z không còn thừa và ngược lại; phải xoá từng thuộc tính một."},{"q":"(PE 7.16) Phân rã 3NF bảo toàn phụ thuộc trở thành lossless khi:","options":["Mọi bảng có primary key","Ít nhất một bảng chứa một candidate key của R","Có đúng 2 bảng","Không có null"],"answer":1,"explain":"Đó là lý do thuật toán 3NF thêm một bảng là candidate key nếu cần."},{"q":"(PE 7.19) Mọi lược đồ 3NF đều ở 2NF vì:","options":["Mọi phụ thuộc bộ phận vào key là một phụ thuộc bắc cầu","2NF mạnh hơn 3NF","Mọi thuộc tính đều prime","Không có FD"],"answer":0,"explain":"Nếu A phụ thuộc vào β ⊂ key α thì α → β, β ↛ α, β → A: A bắc cầu vào α."},{"q":"(PE 7.20) R(A, B, C) chỉ có MVD không tầm thường A →→ B. R ở:","options":["4NF","BCNF nhưng không 4NF","Không ở BCNF","3NF nhưng không BCNF"],"answer":1,"explain":"Không có FD không tầm thường → BCNF; A không phải superkey mà A →→ B không tầm thường → không 4NF."}],"questions":[{"q":"\u003cstrong>PE 7.1.\u003c/strong> Phân rã R = (A, B, C, D, E) thành (A, B, C) và (A, D, E). Chứng minh phân rã lossless nếu F = {A → BC, CD → E, B → D, E → A}.","en":"\u003cp>\u003cstrong>Exercise 7.1.\u003c/strong> The schema R = (A, B, C, D, E) is decomposed into (A, B, C) and (A, D, E). Show that this decomposition is lossless when the following set F of functional dependencies holds:\u003c/p>\n\u003cp>A → BC, CD → E, B → D, E → A\u003c/p>","answer":"\u003cul>\u003cli>R₁ = (A, B, C), R₂ = (A, D, E), \u003cstrong>R₁ ∩ R₂ = A\u003c/strong>.\u003c/li>\u003cli>Tính A⁺: A → ABC (A → BC) → ABCD (B → D) → ABCDE (CD → E). Vậy A → ABC = R₁ (A là candidate key của R, xem PE 7.6).\u003c/li>\u003cli>Theo tiêu chuẩn lossless: R₁ ∩ R₂ → R₁ ∈ F⁺ ⇒ \u003cstrong>lossless\u003c/strong>.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 7.2.\u003c/strong> Liệt kê mọi FD không tầm thường thoả bởi instance r(A, B, C) = {(a1, b1, c1), (a1, b1, c2), (a2, b1, c1), (a2, b1, c3)}.","en":"\u003cp>\u003cstrong>Exercise 7.2.\u003c/strong> List every nontrivial functional dependency satisfied by the relation of Figure 7.18.\u003c/p>\n\u003cp>\u003cem>Figure 7.18 — Relation of Exercise 7.2:\u003c/em>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answer":"\u003cp>\u003cem>(Errata: lời giải trong sách ghi \"Figure 7.18\", đúng ra là Figure 7.17.)\u003c/em>\u003c/p>\n\u003cul>\u003cli>Mọi dòng có cùng B = b1 ⇒ vế phải B luôn thoả: \u003cstrong>A → B\u003c/strong>, \u003cstrong>C → B\u003c/strong>, và hệ quả \u003cstrong>AC → B\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>A ↛ C\u003c/strong>: dòng 1, 2 cùng a1 nhưng c1 ≠ c2. Cũng dòng đó cho \u003cstrong>B ↛ C\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>C ↛ A\u003c/strong>: dòng 1, 3 cùng c1 nhưng a1 ≠ a2. Cũng dòng đó cho \u003cstrong>B ↛ A\u003c/strong>.\u003c/li>\u003cli>Các tập vế trái khác (AB, BC) cũng không xác định thêm thuộc tính nào: AB ↛ C (dòng 1, 2), BC ↛ A (dòng 1, 3). (AC là duy nhất trên instance nên AC → B là FD không tầm thường duy nhất có vế trái hai thuộc tính.)\u003c/li>\u003cli>Có \u003cstrong>19\u003c/strong> FD tầm thường α → β (β ⊆ α, β ≠ ∅): 3·1 + 3·3 + 1·7 = 19.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 7.3.\u003c/strong> Dùng FD để biểu diễn: (a) quan hệ một-một giữa student và instructor; (b) quan hệ nhiều-một giữa student và instructor.","en":"\u003cp>\u003cstrong>Exercise 7.3.\u003c/strong> Explain how functional dependencies can be used to express each of the following:\u003c/p>\n\u003cul>\u003cli>a one-to-one relationship set exists between the entity sets \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em>;\u003c/li>\u003cli>a many-to-one relationship set exists between the entity sets \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em>.\u003c/li>\u003c/ul>","answer":"\u003cp>Gọi Pk(r) là primary key của r, xét relation của relationship set.\u003c/p>\n\u003cul>\u003cli>(a) \u003cstrong>Pk(student) → Pk(instructor)\u003c/strong> và \u003cstrong>Pk(instructor) → Pk(student)\u003c/strong>: hai tuple cùng student phải cùng instructor và ngược lại.\u003c/li>\u003cli>(b) Chỉ \u003cstrong>Pk(student) → Pk(instructor)\u003c/strong>: một student ứng với tối đa một instructor, nhưng nhiều student có thể cùng một instructor.\u003c/li>\u003c/ul>\n\u003cp>(Thử trên bảng advisor của University ở CK2.14: s_ID → i_ID đúng, i_ID → s_ID sai ⇒ nhiều-một.)\u003c/p>"},{"q":"\u003cstrong>PE 7.4.\u003c/strong> Dùng Armstrong's axioms chứng minh tính đúng đắn (soundness) của union rule: α → β và α → γ ⇒ α → βγ.","en":"\u003cp>\u003cstrong>Exercise 7.4.\u003c/strong> Use Armstrong’s axioms to prove that the union rule is sound. (Hint: with the augmentation rule show that if α → β then α → αβ. Apply augmentation again using α → γ, and then apply the transitivity rule.)\u003c/p>","answer":"\u003col>\u003cli>α → β (giả thiết)\u003c/li>\u003cli>αα → αβ, tức \u003cstrong>α → αβ\u003c/strong> (augmentation với α; αα = α)\u003c/li>\u003cli>α → γ (giả thiết)\u003c/li>\u003cli>\u003cstrong>αβ → γβ\u003c/strong> (augmentation với β)\u003c/li>\u003cli>α → αβ và αβ → γβ ⇒ \u003cstrong>α → βγ\u003c/strong> (transitivity; γβ = βγ).\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 7.5.\u003c/strong> Dùng Armstrong's axioms chứng minh pseudotransitivity: α → β và γβ → δ ⇒ αγ → δ.","en":"\u003cp>\u003cstrong>Exercise 7.5.\u003c/strong> Use Armstrong’s axioms to prove that the pseudotransitivity rule is sound.\u003c/p>","answer":"\u003col>\u003cli>α → β (giả thiết)\u003c/li>\u003cli>\u003cstrong>γα → γβ\u003c/strong> (augmentation với γ; viết lại αγ → γβ)\u003c/li>\u003cli>γβ → δ (giả thiết)\u003c/li>\u003cli>αγ → γβ, γβ → δ ⇒ \u003cstrong>αγ → δ\u003c/strong> (transitivity).\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 7.6.\u003c/strong> Tính F⁺ của F = {A → BC, CD → E, B → D, E → A} trên R = (A, B, C, D, E) và liệt kê candidate key.","en":"\u003cp>\u003cstrong>Exercise 7.6.\u003c/strong> For the relation schema R = (A, B, C, D, E), compute the closure of the following set F of functional dependencies:\u003c/p>\n\u003cp>A → BC, CD → E, B → D, E → A\u003c/p>\n\u003cp>List the candidate keys of R.\u003c/p>","answer":"\u003cp>Không cần liệt kê hết F⁺ — chỉ cần các bao đóng:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>A⁺\u003c/strong> = ABCDE (A → BC, B → D, CD → E).\u003c/li>\u003cli>\u003cstrong>E⁺\u003c/strong> = ABCDE (E → A rồi như trên).\u003c/li>\u003cli>\u003cstrong>(CD)⁺\u003c/strong> = ABCDE (CD → E, E → A, A → BC).\u003c/li>\u003cli>\u003cstrong>(BC)⁺\u003c/strong> = ABCDE (B → D, CD → E, E → A).\u003c/li>\u003cli>B⁺ = BD, C⁺ = C, D⁺ = D, (BD)⁺ = BD.\u003c/li>\u003c/ul>\n\u003cp>Do đó F⁺ gồm: \u003cstrong>mọi FD có vế trái chứa A, E, BC hoặc CD\u003c/strong> (với vế phải bất kỳ ⊆ R), cộng các FD từ những vế trái còn lại: B → D, B → BD, BD → D, BD → B, BD → BD, và các FD tầm thường (C → C, D → D, …).\u003c/p>\n\u003cp>\u003cstrong>Candidate key: A, E, BC, CD\u003c/strong> (mỗi tập đều tối thiểu; các tập không chứa A, E chỉ có BC, CD là superkey, BD thì không).\u003c/p>"},{"q":"\u003cstrong>PE 7.7.\u003c/strong> Dùng F của PE 7.6, tính canonical cover.","en":"\u003cp>\u003cstrong>Exercise 7.7.\u003c/strong> Using the functional dependencies of Exercise 7.6, compute the canonical cover F\u003csub>c\u003c/sub>.\u003c/p>","answer":"\u003cul>\u003cli>Vế trái A, CD, B, E đôi một khác nhau → không gộp được.\u003c/li>\u003cli>A → BC: bỏ B, F' có A → C ⇒ A⁺ = AC không chứa B → B không thừa; bỏ C ⇒ A⁺ = ABD không chứa C → C không thừa.\u003c/li>\u003cli>CD → E: C thừa? D⁺ = D không chứa E → không; D thừa? C⁺ = C → không.\u003c/li>\u003cli>B → D, E → A: vế trái và vế phải chỉ một thuộc tính; bỏ vế phải thì B⁺ = B, E⁺ = E → không thừa.\u003c/li>\u003c/ul>\n\u003cp>⇒ \u003cstrong>F\u003csub>c\u003c/sub> = F\u003c/strong> = {A → BC, CD → E, B → D, E → A}.\u003c/p>"},{"q":"\u003cstrong>PE 7.8.\u003c/strong> Xét thuật toán tính α⁺ dùng mảng fdcount (số thuộc tính vế trái của FD thứ i chưa có trong α⁺) và appears[A] (danh sách FD có A ở vế trái), với thủ tục đệ quy addin. Chứng minh thuật toán đúng và hiệu quả hơn thuật toán của Figure 7.8.","en":"\u003cp>\u003cstrong>Exercise 7.8.\u003c/strong> Consider the algorithm of Figure 7.19 for computing α\u003csup>+\u003c/sup>. Show that it is more efficient than the algorithm of Figure 7.8 (Section 7.4.2) and that it computes α\u003csup>+\u003c/sup> correctly.\u003c/p>","answer":"\u003cp>\u003cstrong>Đúng (chỉ thêm thuộc tính thuộc α⁺)\u003c/strong>: α ⊆ α⁺ hiển nhiên. Một thuộc tính A ∉ α chỉ được thêm khi có FD β → γ với A ∈ γ và fdcount = 0, tức β ⊆ result; quy nạp theo độ sâu đệ quy: mọi thứ trong result thuộc α⁺ ⇒ β ⊆ α⁺ ⇒ γ ⊆ α⁺.\u003c/p>\n\u003cp>\u003cstrong>Đầy đủ (mọi A ∈ α⁺ đều được thêm)\u003c/strong>: quy nạp theo độ dài chứng minh α → A bằng Armstrong. Gọi addin(α) thì mọi thuộc tính của α được thêm; khi fdcount của một FD về 0 thì mọi thuộc tính vế phải của nó được thêm. Nếu bước cuối của chứng minh là reflexivity/augmentation thì A đã có sẵn; nếu là transitivity với β → γ (A ∈ γ, α → β chứng minh được trong ≤ n bước) thì theo giả thiết quy nạp β ⊆ result nên fdcount của β → γ về 0 và A được thêm.\u003c/p>\n\u003cp>\u003cstrong>Hiệu quả\u003c/strong>: mỗi FD được duyệt một lần để khởi tạo; mảng appears có kích thước tỉ lệ tổng độ dài F; mỗi thuộc tính được thêm vào result đúng một lần và mỗi lần giảm fdcount tương ứng một phần tử của appears ⇒ \u003cstrong>tuyến tính\u003c/strong> theo kích thước F. Thuật toán Figure 7.8 có thể lặp vòng while |F| lần, mỗi vòng duyệt cả F ⇒ \u003cstrong>bậc hai\u003c/strong>.\u003c/p>"},{"q":"\u003cstrong>PE 7.9.\u003c/strong> Cho R(A, B, C) và relation r. Viết câu SQL kiểm tra FD B → C có đúng trên r không, và một SQL assertion ép FD này (giả sử không có null).","en":"\u003cp>\u003cstrong>Exercise 7.9.\u003c/strong> For the schema R(A, B, C) and a relation r on R, write an SQL query that tests whether the functional dependency B → C holds on r. Also write an SQL assertion that enforces this dependency. Assume no null values are present. (Such assertions belong to the SQL standard but no database implementation currently supports them.)\u003c/p>","answer":"\u003cp>Kiểm tra (kết quả \u003cstrong>khác rỗng ⇔ B → C bị vi phạm\u003c/strong>):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select B from r group by B having count(distinct C) &gt; 1;\u003c/code>\u003c/pre>\n\u003cp>Assertion (chuẩn SQL):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create assertion b_to_c check (not exists (\n  select B from r group by B having count(distinct C) &gt; 1));\u003c/code>\u003c/pre>\n\u003cp>PostgreSQL (và các DBMS phổ biến) \u003cstrong>không hỗ trợ assertion\u003c/strong> → dùng trigger kiểm tra trước insert/update (xem CK2.04). Nếu B là khoá của một bảng riêng (B, C) thì chỉ cần primary key — đó chính là lợi ích của phân rã BCNF.\u003c/p>"},{"q":"\u003cstrong>PE 7.10.\u003c/strong> Thảo luận lossless ngầm giả định thuộc tính ở vế trái FD không được null. Điều gì có thể sai nếu vi phạm giả định này?","en":"\u003cp>\u003cstrong>Exercise 7.10.\u003c/strong> Our treatment of lossless decomposition silently assumed that attributes on the left-hand side of a functional dependency cannot be null. What could go wrong in a decomposition if this assumption is violated?\u003c/p>","answer":"\u003cp>Natural join định nghĩa qua Cartesian product + selection; so sánh với null cho \u003cstrong>unknown\u003c/strong> nên tuple có null ở thuộc tính chung \u003cstrong>không khớp\u003c/strong> với tuple nào — kể cả \"bản sao\" của chính nó ở bảng kia. Vì vậy khi phân rã theo α → β mà α có null, các tuple đó \u003cstrong>biến mất\u003c/strong> khỏi join: phân rã trở thành lossy theo nghĩa \u003cem>mất tuple\u003c/em> (khác lossy thông thường là \u003cem>thừa tuple\u003c/em>). Null ở thuộc tính chỉ nằm ở vế phải thì không gây vấn đề. Xem CK2.08.\u003c/p>"},{"q":"\u003cstrong>PE 7.11.\u003c/strong> Trong thuật toán BCNF, dùng α → β để tách r(α, β, γ) thành r₁(α, β), r₂(α, γ). (a) Nên có primary key/foreign key nào? (b) Nếu không ép foreign key thì bất nhất gì có thể xảy ra? (c) Với phân rã 3NF (thuật toán 7.5.2), PK/FK nào nên có?","en":"\u003cp>\u003cstrong>Exercise 7.11.\u003c/strong> In the BCNF decomposition algorithm, suppose a functional dependency α → β is used to decompose a relation schema r(α, β, γ) into r\u003csub>1\u003c/sub>(α, β) and r\u003csub>2\u003c/sub>(α, γ).\u003c/p>\n\u003cp>a. Which primary-key and foreign-key constraints do you expect to hold on the decomposed relations?\u003c/p>\n\u003cp>b. Give an example of an inconsistency that an erroneous update could cause if the foreign-key constraint were not enforced on these decomposed relations.\u003c/p>\n\u003cp>c. When a relation schema is decomposed into 3NF with the algorithm of Section 7.5.2, which primary-key and foreign-key dependencies would you expect on the decomposed schema?\u003c/p>","answer":"\u003cul>\u003cli>(a) \u003cstrong>α là primary key của r₁\u003c/strong>; \u003cstrong>α trong r₂ là foreign key tham chiếu r₁\u003c/strong>.\u003c/li>\u003cli>(b) Xoá một tuple của r₁ mà không xoá các tuple tham chiếu nó trong r₂: join r₁ ⋈ r₂ sẽ mất các tuple đó — tương đương với việc \u003cem>đặt β thành null\u003c/em> trong các tuple gốc thay vì xoá chúng. (Tương tự: chèn vào r₂ một α không có trong r₁.) CK2.09 cho thấy FK chặn được cả hai.\u003c/li>\u003cli>(c) Với mỗi lược đồ r\u003csub>i\u003c/sub>(α, β) sinh từ α → β: \u003cstrong>α là primary key\u003c/strong>. Lược đồ chứa candidate key của R: key đó là primary key. Foreign key: nếu primary key của r\u003csub>i\u003c/sub> xuất hiện trong r\u003csub>j\u003c/sub> khác thì các thuộc tính đó trong r\u003csub>j\u003c/sub> là foreign key tham chiếu r\u003csub>i\u003c/sub>.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 7.12.\u003c/strong> Cho R₁, …, R\u003csub>n\u003c/sub> là phân rã của U, u(U) là relation và r\u003csub>i\u003c/sub> = Π\u003csub>Ri\u003c/sub>(u). Chứng minh u ⊆ r₁ ⋈ r₂ ⋈ …
