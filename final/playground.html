⋈ r\u003csub>n\u003c/sub>.","en":"\u003cp>\u003cstrong>Exercise 7.12.\u003c/strong> Let R\u003csub>1\u003c/sub>, R\u003csub>2\u003c/sub>, …, R\u003csub>n\u003c/sub> be a decomposition of schema U, let u(U) be a relation, and let r\u003csub>i\u003c/sub> = Π\u003csub>R\u003csub>i\u003c/sub>\u003c/sub>(u). Show that\u003c/p>\n\u003cp>u ⊆ r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ ⋯ ⋈ r\u003csub>n\u003c/sub>\u003c/p>","answer":"\u003cp>Lấy t bất kỳ thuộc u. Vì r\u003csub>i\u003c/sub> = Π\u003csub>Ri\u003c/sub>(u) nên t[R\u003csub>i\u003c/sub>] ∈ r\u003csub>i\u003c/sub> với mọi i, do đó t[R₁] ⋈ … ⋈ t[R\u003csub>n\u003c/sub>] ⊆ r₁ ⋈ … ⋈ r\u003csub>n\u003c/sub>.\u003cbr>Theo định nghĩa natural join, t[R₁] ⋈ … ⋈ t[R\u003csub>n\u003c/sub>] = Π\u003csub>U\u003c/sub>(σ\u003csub>θ\u003c/sub>(t[R₁] × … × t[R\u003csub>n\u003c/sub>])) với θ: các thuộc tính trùng tên bằng nhau. Tích Cartesian của các tuple đơn cho một tuple; θ thoả vì mọi thuộc tính trùng tên đều lấy từ cùng t; phép chiếu bỏ cột trùng. Vì U = R₁ ∪ … ∪ R\u003csub>n\u003c/sub>, tuple thu được chứa đủ mọi thuộc tính của t, tức \u003cstrong>chính là t\u003c/strong>. Vậy t ∈ r₁ ⋈ … ⋈ r\u003csub>n\u003c/sub>; do t tuỳ ý nên u ⊆ r₁ ⋈ … ⋈ r\u003csub>n\u003c/sub>. (Dấu bằng xảy ra khi phân rã lossless.) Xem CK2.10.\u003c/p>"},{"q":"\u003cstrong>PE 7.13.\u003c/strong> Chứng minh phân rã ở PE 7.1 không bảo toàn phụ thuộc.","en":"\u003cp>\u003cstrong>Exercise 7.13.\u003c/strong> Show that the decomposition of Exercise 7.1 does not preserve dependencies.\u003c/p>","answer":"\u003cp>Xét \u003cstrong>B → D\u003c/strong>. F₁ (FD của F⁺ trên (A, B, C)) không có FD nào có D ở vế phải (D không thuộc R₁). F₂ (trên (A, D, E)) không có FD nào có B ở vế trái. Để suy ra B → D từ F₁ ∪ F₂ phải có B → γ ∈ F₁⁺ và γ → D ∈ F₂⁺, với γ ⊆ R₁ ∩ R₂ = A. Nhưng \u003cstrong>B → A ∉ F₁⁺\u003c/strong> vì B⁺ = BD. Vậy B → D không được bảo toàn.\u003cbr>Kiểm tra bằng thuật toán bảo toàn: result = B; (B ∩ R₁)⁺ ∩ R₁ = BD ∩ ABC = B; (B ∩ R₂) = ∅ → result dừng ở B, không chứa D. (Tương tự \u003cstrong>CD → E\u003c/strong> cũng bị mất.) Trên dữ liệu: CK2.07 chèn hai tuple hợp lệ ở từng bảng nhưng join vi phạm B → D.\u003c/p>"},{"q":"\u003cstrong>PE 7.14.\u003c/strong> Chứng minh có thể có nhiều canonical cover, dùng F = {X → YZ, Y → XZ, Z → XY}.","en":"\u003cp>\u003cstrong>Exercise 7.14.\u003c/strong> Using the dependencies X → YZ, Y → XZ, and Z → XY, show that a set of functional dependencies can have more than one canonical cover.\u003c/p>","answer":"\u003cul>\u003cli>Z thừa trong X → YZ (vì X → Y, Y → XZ cho X → Z) → X → Y; tiếp theo X thừa trong Y → XZ → Y → Z; Y thừa trong Z → XY → Z → X. Được \u003cstrong>{X → Y, Y → Z, Z → X}\u003c/strong>.\u003c/li>\u003cli>Hoặc: Y thừa trong X → YZ → X → Z; Z thừa trong Y → XZ → Y → X; X thừa trong Z → XY → Z → Y. Được \u003cstrong>{X → Z, Y → X, Z → Y}\u003c/strong>.\u003c/li>\u003cli>Còn có cách khác: bỏ Y khỏi X → YZ, bỏ X khỏi Y → XZ, rồi không còn gì thừa trong Z → XY: \u003cstrong>{X → Z, Y → Z, Z → XY}\u003c/strong> (công cụ FD trả về kết quả này). Mọi cover trên đều tương đương F (X, Y, Z xác định lẫn nhau).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 7.15.\u003c/strong> Thuật toán canonical cover chỉ xoá \u003cstrong>một\u003c/strong> thuộc tính thừa mỗi lần. Dùng F của PE 7.14 để chỉ ra điều gì sai nếu xoá hai thuộc tính cùng lúc.","en":"\u003cp>\u003cstrong>Exercise 7.15.\u003c/strong> The canonical-cover algorithm removes only one extraneous attribute at a time. With the functional dependencies of Exercise 7.14, show what can go wrong if two attributes found to be extraneous are removed at the same time.\u003c/p>","answer":"\u003cp>Trong X → YZ: Y thừa (vì X → Z → … → Y qua các FD khác) và Z cũng thừa (vì X → Y → … → Z). Nhưng nếu \u003cstrong>xoá cả hai\u003c/strong> thì còn X → ∅ (bỏ FD), và F mới {Y → XZ, Z → XY} không suy ra được X → YZ (X⁺ = X). Lý do: sau khi xoá Y, Z \u003cstrong>không còn\u003c/strong> thừa nữa (nó là con đường duy nhất để X suy ra Y), và ngược lại. Mỗi kết luận \"thừa\" chỉ đúng với F hiện tại, nên phải xoá từng thuộc tính rồi kiểm tra lại.\u003c/p>"},{"q":"\u003cstrong>PE 7.16.\u003c/strong> Chứng minh phân rã 3NF bảo toàn phụ thuộc là lossless nếu ít nhất một lược đồ chứa candidate key của lược đồ bị phân rã.","en":"\u003cp>\u003cstrong>Exercise 7.16.\u003c/strong> Show that a dependency-preserving decomposition into 3NF can be made lossless by guaranteeing that at least one schema contains a candidate key of the schema being decomposed. (Hint: show that the join of all projections onto the schemas of the decomposition cannot have more tuples than the original relation.)\u003c/p>","answer":"\u003cp>Gọi δ = {R₁, …, R\u003csub>n\u003c/sub>} là phân rã 3NF bảo toàn phụ thuộc, X là candidate key nằm trong một R\u003csub>k\u003c/sub>; r là instance hợp lệ, j = Π\u003csub>X\u003c/sub>(r) ⋈ Π\u003csub>R1\u003c/sub>(r) ⋈ … ⋈ Π\u003csub>Rn\u003c/sub>(r).\u003c/p>\n\u003col>\u003cli>\u003cstrong>Khẳng định\u003c/strong>: hai tuple t₁, t₂ ∈ j cùng giá trị X thì t₁ = t₂. Chạy thuật toán bao đóng X⁺ dưới F' = F₁ ∪ … ∪ F\u003csub>n\u003c/sub>; quy nạp theo số bước: ban đầu result = X nên t₁[result] = t₂[result]; mỗi bước dùng β → γ với β ⊆ result và β → γ thuộc một F\u003csub>i\u003c/sub>; vì t₁[R\u003csub>i\u003c/sub>], t₂[R\u003csub>i\u003c/sub>] ∈ Π\u003csub>Ri\u003c/sub>(r) thoả β → γ nên t₁[γ] = t₂[γ]. Do δ bảo toàn phụ thuộc và X là key, cuối cùng result = R ⇒ t₁ = t₂.\u003c/li>\u003cli>Vậy |j| = |Π\u003csub>X\u003c/sub>(j)| = |Π\u003csub>X\u003c/sub>(r)| = |r| (X là key của r).\u003c/li>\u003cli>Theo PE 7.12, r ⊆ j; cùng số tuple ⇒ \u003cstrong>r = j\u003c/strong>, tức lossless. (Vì vậy thuật toán 3NF thêm lược đồ X nếu chưa có.)\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 7.17.\u003c/strong> Cho ví dụ lược đồ R' và tập F' sao cho có ít nhất ba phân rã lossless khác nhau của R' thành BCNF.","en":"\u003cp>\u003cstrong>Exercise 7.17.\u003c/strong> Give an example of a relation schema R′ and a set F′ of functional dependencies for which there are at least three distinct lossless decompositions of R′ into BCNF.\u003c/p>","answer":"\u003cp>R' = (A, B, C, D), F' = {A → B, C → D, B → C} (key duy nhất: A). Ba phân rã BCNF:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>{(A, B), (C, D), (B, C)}\u003c/strong> — tách theo C → D, rồi B → C. Bảo toàn mọi FD.\u003c/li>\u003cli>\u003cstrong>{(A, B), (C, D), (A, C)}\u003c/strong> — tách theo C → D, rồi A → B (hoặc theo A → C suy ra). Mất B → C.\u003c/li>\u003cli>\u003cstrong>{(B, C), (A, D), (A, B)}\u003c/strong> — tách theo B → C, rồi A → B (A → D suy ra). Mất C → D.\u003c/li>\u003c/ul>\n\u003cp>Mỗi bảng hai thuộc tính luôn ở BCNF; mỗi bước tách có phần chung là key của một bên nên lossless (đã kiểm tra bằng chase trong công cụ FD và trên dữ liệu ở CK2.11). Ví dụ cho thấy kết quả thuật toán BCNF phụ thuộc thứ tự chọn FD — và không phải phân rã nào cũng tốt như nhau.\u003c/p>"},{"q":"\u003cstrong>PE 7.18.\u003c/strong> Thuộc tính prime là thuộc tính nằm trong ít nhất một candidate key. A \u003cem>phụ thuộc bắc cầu\u003c/em> vào α nếu α → β, β ↛ α, β → A, A ∉ α, A ∉ β. Chứng minh định nghĩa \"R ở 3NF nếu không có thuộc tính không khoá A nào phụ thuộc bắc cầu vào một key\" tương đương định nghĩa của sách.","en":"\u003cp>\u003cstrong>Exercise 7.18.\u003c/strong> Call an attribute \u003cem>prime\u003c/em> if it appears in at least one candidate key. Let α and β be sets of attributes such that α → β holds but β → α does not, and let A be an attribute that is in neither α nor β and for which β → A holds. We then say A is \u003cem>transitively dependent\u003c/em> on α. 3NF can be restated as: a relation schema R is in 3NF with respect to a set F of functional dependencies if no nonprime attribute A of R is transitively dependent on a key for R. Show that this definition is equivalent to the original one.\u003c/p>","answer":"\u003cp>\u003cstrong>Sách ⇒ định nghĩa mới\u003c/strong>: giả sử A không khoá phụ thuộc bắc cầu vào key α qua β. Xét β → A: (1) không tầm thường vì A ∉ β; (2) β không phải superkey vì β ↛ α; (3) A không thuộc candidate key nào vì A không khoá. Cả ba điều kiện 3NF đều sai ⇒ mâu thuẫn với R ở 3NF theo sách.\u003c/p>\n\u003cp>\u003cstrong>Định nghĩa mới ⇒ sách\u003c/strong>: giả sử R không ở 3NF theo sách: có α → β mà (1) không tầm thường, (2) α không phải superkey, (3) có A ∈ β − α không thuộc key nào. Lấy γ là một candidate key: γ → α; α ↛ γ (vì α không phải superkey); α → A; A ∉ α; A ∉ γ (A không khoá). Vậy A phụ thuộc bắc cầu vào key γ ⇒ vi phạm định nghĩa mới.\u003c/p>"},{"q":"\u003cstrong>PE 7.19.\u003c/strong> α → β là phụ thuộc bộ phận nếu có γ ⊂ α thực sự với γ → β. R ở 2NF nếu mỗi thuộc tính A hoặc thuộc một candidate key, hoặc không phụ thuộc bộ phận vào candidate key nào. Chứng minh mọi lược đồ 3NF đều ở 2NF.","en":"\u003cp>\u003cstrong>Exercise 7.19.\u003c/strong> A functional dependency α → β is a \u003cem>partial dependency\u003c/em> if some proper subset γ of α satisfies γ → β; β is then \u003cem>partially dependent\u003c/em> on α. A relation schema R is in \u003cem>second normal form\u003c/em> (2NF) if every attribute A of R satisfies one of these criteria:\u003c/p>\n\u003cul>\u003cli>it appears in a candidate key;\u003c/li>\u003cli>it is not partially dependent on a candidate key.\u003c/li>\u003c/ul>\n\u003cp>Show that every 3NF schema is in 2NF. (Hint: show that every partial dependency is a transitive dependency.)\u003c/p>","answer":"\u003cp>Viết lại 2NF: không có thuộc tính không khoá A nào phụ thuộc bộ phận vào một candidate key. Dùng định nghĩa 3NF của PE 7.18, chỉ cần chứng minh: \u003cstrong>mọi phụ thuộc bộ phận của A không khoá vào key α là một phụ thuộc bắc cầu\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>A phụ thuộc bộ phận vào α ⇒ có β ⊂ α thực sự với β → A.\u003c/li>\u003cli>β ⊂ α ⇒ α → β (reflexivity). β ↛ α vì nếu không β là superkey nhỏ hơn α, mâu thuẫn với α là candidate key.\u003c/li>\u003cli>A không khoá ⇒ A ∉ α và A ∉ β.\u003c/li>\u003c/ul>\n\u003cp>Vậy α → β, β ↛ α, β → A: \u003cstrong>A phụ thuộc bắc cầu vào α\u003c/strong>. Lược đồ 3NF không có phụ thuộc bắc cầu nào như vậy nên cũng không có phụ thuộc bộ phận ⇒ ở 2NF.\u003c/p>"},{"q":"\u003cstrong>PE 7.20.\u003c/strong> Cho ví dụ lược đồ R và tập phụ thuộc sao cho R ở BCNF nhưng không ở 4NF.","en":"\u003cp>\u003cstrong>Exercise 7.20.\u003c/strong> Give an example of a relation schema R and a set of dependencies for which R is in BCNF but not in 4NF.\u003c/p>","answer":"\u003cp>\u003cem>(Lời giải trong file PDF bị cắt — đây là đáp án chuẩn.)\u003c/em>\u003cbr>R = (A, B, C) với phụ thuộc không tầm thường duy nhất là \u003cstrong>A →→ B\u003c/strong> (do đó cũng A →→ C).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>BCNF\u003c/strong>: không có FD không tầm thường nào (A ↛ B, A ↛ C…) nên điều kiện BCNF thoả hiển nhiên.\u003c/li>\u003cli>\u003cstrong>Không 4NF\u003c/strong>: A →→ B không tầm thường (B ⊄ A và A ∪ B ≠ R) nhưng A không phải superkey.\u003c/li>\u003cli>Phân rã 4NF: (A, B) và (A, C) — lossless vì phần chung A →→ B. Ví dụ đời thực: inst_info(ID, child_name, phone). Xem CK2.12, CK2.13.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"CK2.01","topic":"PE 7.2 — test FD","level":1,"prompt":"\u003cp>Bảng \u003ccode>nf_r_abc(a, b, c)\u003c/code> là instance của PE 7.2. Trả về \u003cstrong>một dòng, 6 cột boolean\u003c/strong> theo thứ tự \u003ccode>a_b, a_c, b_a, b_c, c_a, c_b\u003c/code> cho biết mỗi FD A → B, A → C, B → A, B → C, C → A, C → B có thoả trên instance không.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.2.\u003c/strong> List every nontrivial functional dependency satisfied by the relation of Figure 7.18.\u003c/p>\n\u003cp>\u003cem>Figure 7.18 — Relation of Exercise 7.2:\u003c/em>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"X → Y thoả ⇔ not exists (select X from r group by X having count(distinct Y) > 1)","solution":"select not exists (select a from nf_r_abc group by a having count(distinct b) > 1) as a_b,\n       not exists (select a from nf_r_abc group by a having count(distinct c) > 1) as a_c,\n       not exists (select b from nf_r_abc group by b having count(distinct a) > 1) as b_a,\n       not exists (select b from nf_r_abc group by b having count(distinct c) > 1) as b_c,\n       not exists (select c from nf_r_abc group by c having count(distinct a) > 1) as c_a,\n       not exists (select c from nf_r_abc group by c having count(distinct b) > 1) as c_b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a_b","a_c","b_a","b_c","c_a","c_b"],"rows":[["true","false","false","false","false","true"]]}},{"id":"CK2.02","topic":"PE 7.2 — composite FD","level":2,"prompt":"\u003cp>Tiếp PE 7.2: trả về một dòng ba cột boolean: \u003ccode>ac_b\u003c/code> (AC → B có thoả), \u003ccode>ab_c\u003c/code> (AB → C có thoả), \u003ccode>ac_unique\u003c/code> (AC có xác định duy nhất mỗi dòng trên instance).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.2.\u003c/strong> List every nontrivial functional dependency satisfied by the relation of Figure 7.18.\u003c/p>\n\u003cp>\u003cem>Figure 7.18 — Relation of Exercise 7.2:\u003c/em>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a1\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a2\u003c/td>\u003ctd>b1\u003c/td>\u003ctd>c3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"","solution":"select not exists (select a, c from nf_r_abc group by a, c having count(distinct b) > 1) as ac_b,\n       not exists (select a, b from nf_r_abc group by a, b having count(distinct c) > 1) as ab_c,\n       count(*) = count(distinct (a, c)) as ac_unique\nfrom nf_r_abc;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["ac_b","ab_c","ac_unique"],"rows":[["true","false","true"]]}},{"id":"CK2.03","topic":"PE 7.9 — test FD","level":1,"prompt":"\u003cp>PE 7.9a: bảng \u003ccode>nf_pe79_r(a, b, c)\u003c/code>. Viết câu truy vấn trả về các giá trị b \u003cstrong>vi phạm\u003c/strong> FD B → C (kết quả rỗng ⇔ FD đúng).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.9.\u003c/strong> For the schema R(A, B, C) and a relation r on R, write an SQL query that tests whether the functional dependency B → C holds on r. Also write an SQL assertion that enforces this dependency. Assume no null values are present. (Such assertions belong to the SQL standard but no database implementation currently supports them.)\u003c/p>","hint":"","solution":"select b from nf_pe79_r group by b having count(distinct c) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["b"],"rows":[["y"]]}},{"id":"CK2.04","topic":"PE 7.9 — enforce FD","level":3,"prompt":"\u003cp>PE 7.9b: PostgreSQL không hỗ trợ \u003ccode>create assertion\u003c/code>. Hãy ép FD B → C trên bảng \u003ccode>nf_pe79_clean(a, b, c)\u003c/code> bằng \u003cstrong>trigger\u003c/strong> (before insert or update, raise exception khi có dòng khác cùng b mà khác c).\u003cbr>Hệ thống thử chèn (4, 'x', 11) — phải bị từ chối — và (5, 'x', 10) — phải thành công.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.9.\u003c/strong> For the schema R(A, B, C) and a relation r on R, write an SQL query that tests whether the functional dependency B → C holds on r. Also write an SQL assertion that enforces this dependency. Assume no null values are present. (Such assertions belong to the SQL standard but no database implementation currently supports them.)\u003c/p>","hint":"","solution":"create function nf_pe79_b_to_c() returns trigger\nlanguage plpgsql as $$\nbegin\n  if exists (select 1 from nf_pe79_clean\n             where b = new.b and c \u003c> new.c and a \u003c> new.a) then\n    raise exception 'FD B -> C violated for b = %', new.b;\n  end if;\n  return new;\nend $$;\n\ncreate trigger nf_pe79_fd\nbefore insert or update on nf_pe79_clean\nfor each row execute function nf_pe79_b_to_c();","check":"select try_sql($$insert into nf_pe79_clean values (4, 'x', 11)$$) \u003c> 'ok' as violating_rejected,\n       try_sql($$insert into nf_pe79_clean values (5, 'x', 10)$$) as valid_insert;","ordered":false,"fresh":false,"expected":{"fields":["violating_rejected","valid_insert"],"rows":[["true","ok"]]}},{"id":"CK2.05","topic":"PE 7.1 — lossless","level":2,"prompt":"\u003cp>PE 7.1 trên dữ liệu: \u003ccode>nf_pe71(a, b, c, d, e)\u003c/code> thoả F = {A → BC, CD → E, B → D, E → A}. Phân rã thành (a, b, c) và (a, d, e). Trả về một dòng ba cột \u003ccode>joined_rows\u003c/code>, \u003ccode>extra\u003c/code>, \u003ccode>missing\u003c/code> (số tuple thừa / thiếu của join so với bảng gốc).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.1.\u003c/strong> The schema R = (A, B, C, D, E) is decomposed into (A, B, C) and (A, D, E). Show that this decomposition is lossless when the following set F of functional dependencies holds:\u003c/p>\n\u003cp>A → BC, CD → E, B → D, E → A\u003c/p>","hint":"","solution":"with j as (\n  select a, b, c, d, e\n  from (select a, b, c from nf_pe71) r1 natural join (select a, d, e from nf_pe71) r2\n)\nselect (select count(*) from j) as joined_rows,\n       (select count(*) from (select * from j except select * from nf_pe71) x) as extra,\n       (select count(*) from (select * from nf_pe71 except select * from j) y) as missing;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["joined_rows","extra","missing"],"rows":[["4","0","0"]]}},{"id":"CK2.06","topic":"PE 7.6 — keys on data","level":2,"prompt":"\u003cp>PE 7.6: candidate key là A, E, BC, CD; B không phải key. Minh hoạ trên \u003ccode>nf_pe71\u003c/code>: trả về một dòng 5 cột boolean \u003ccode>a, e, bc, cd, b\u003c/code> — mỗi tập có xác định duy nhất mỗi dòng của instance không.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.6.\u003c/strong> For the relation schema R = (A, B, C, D, E), compute the closure of the following set F of functional dependencies:\u003c/p>\n\u003cp>A → BC, CD → E, B → D, E → A\u003c/p>\n\u003cp>List the candidate keys of R.\u003c/p>","hint":"","solution":"select count(*) = count(distinct a) as a,\n       count(*) = count(distinct e) as e,\n       count(*) = count(distinct (b, c)) as bc,\n       count(*) = count(distinct (c, d)) as cd,\n       count(*) = count(distinct b) as b\nfrom nf_pe71;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a","e","bc","cd","b"],"rows":[["true","true","true","true","false"]]}},{"id":"CK2.07","topic":"PE 7.13 — lost FD","level":3,"prompt":"\u003cp>PE 7.13 trên dữ liệu: tạo \u003ccode>nf_pe71_r1(a primary key, b, c)\u003c/code> và \u003ccode>nf_pe71_r2(a primary key, d, e)\u003c/code> từ nf_pe71 (A là key của cả hai). Rồi chèn ('a5', 'b1', 'c9') vào r1 và ('a5', 'd9', 'e9') vào r2 — ràng buộc của từng bảng đều thoả.\u003cbr>(Hệ thống join hai bảng và tìm các b vi phạm B → D — FD không được bảo toàn.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.13.\u003c/strong> Show that the decomposition of Exercise 7.1 does not preserve dependencies.\u003c/p>","hint":"","solution":"create table nf_pe71_r1 (a varchar(2) primary key, b varchar(2), c varchar(2));\ncreate table nf_pe71_r2 (a varchar(2) primary key, d varchar(2), e varchar(2));\ninsert into nf_pe71_r1 select a, b, c from nf_pe71;\ninsert into nf_pe71_r2 select a, d, e from nf_pe71;\ninsert into nf_pe71_r1 values ('a5', 'b1', 'c9');\ninsert into nf_pe71_r2 values ('a5', 'd9', 'e9');","check":"select b, count(distinct d) as d_values\nfrom nf_pe71_r1 natural join nf_pe71_r2\ngroup by b having count(distinct d) > 1;","ordered":false,"fresh":false,"expected":{"fields":["b","d_values"],"rows":[["b1","2"]]}},{"id":"CK2.08","topic":"PE 7.10 — nulls","level":2,"prompt":"\u003cp>PE 7.10: \u003ccode>nf_pe710(a, b, c)\u003c/code> với A → B, một số dòng có a là null. Phân rã thành (a, b) và (a, c). Trả về các dòng của bảng gốc \u003cstrong>bị mất\u003c/strong> sau natural join (cột a, b, c).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.10.\u003c/strong> Our treatment of lossless decomposition silently assumed that attributes on the left-hand side of a functional dependency cannot be null. What could go wrong in a decomposition if this assumption is violated?\u003c/p>","hint":"select * from nf_pe710 except select a, b, c from (...) natural join (...)","solution":"select a, b, c from nf_pe710\nexcept\nselect a, b, c from (select a, b from nf_pe710) r1 natural join (select a, c from nf_pe710) r2;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a","b","c"],"rows":[[null,"b4","c4"],[null,"b3","c3"]]}},{"id":"CK2.09","topic":"PE 7.11 — PK/FK","level":2,"prompt":"\u003cp>PE 7.11: phân rã BCNF \u003ccode>nf_in_dep\u003c/code> theo dept_name → building, budget thành \u003ccode>nf_dept(dept_name primary key, building, budget)\u003c/code> và \u003ccode>nf_inst(ID primary key, name, salary, dept_name)\u003c/code> với dept_name \u003cstrong>foreign key\u003c/strong> tham chiếu nf_dept; chép dữ liệu sang.\u003cbr>(Hệ thống thử xoá khoa Physics khỏi nf_dept và chèn giảng viên thuộc khoa 'Nowhere' — cả hai phải bị foreign key chặn, mã 23503.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.11.\u003c/strong> In the BCNF decomposition algorithm, suppose a functional dependency α → β is used to decompose a relation schema r(α, β, γ) into r\u003csub>1\u003c/sub>(α, β) and r\u003csub>2\u003c/sub>(α, γ).\u003c/p>\n\u003cp>a. Which primary-key and foreign-key constraints do you expect to hold on the decomposed relations?\u003c/p>\n\u003cp>b. Give an example of an inconsistency that an erroneous update could cause if the foreign-key constraint were not enforced on these decomposed relations.\u003c/p>\n\u003cp>c. When a relation schema is decomposed into 3NF with the algorithm of Section 7.5.2, which primary-key and foreign-key dependencies would you expect on the decomposed schema?\u003c/p>","hint":"","solution":"create table nf_dept (dept_name varchar(20) primary key, building varchar(15), budget numeric(12,2));\ncreate table nf_inst (ID varchar(5) primary key, name varchar(20), salary numeric(8,2),\n                      dept_name varchar(20) references nf_dept);\ninsert into nf_dept select distinct dept_name, building, budget from nf_in_dep;\ninsert into nf_inst select ID, name, salary, dept_name from nf_in_dep;","check":"select try_sql($$delete from nf_dept where dept_name = 'Physics'$$) as delete_referenced,\n       try_sql($$insert into nf_inst values ('99999', 'Nobody', 1000, 'Nowhere')$$) as insert_dangling,\n       (select count(*) from nf_inst) as instructors;","ordered":false,"fresh":false,"expected":{"fields":["delete_referenced","insert_dangling","instructors"],"rows":[["23503","23503","12"]]}},{"id":"CK2.10","topic":"PE 7.12 — u ⊆ join","level":2,"prompt":"\u003cp>PE 7.12 trên dữ liệu: u = \u003ccode>nf_r_abc\u003c/code>, phân rã (a, b), (b, c) — r₁, r₂ là \u003cstrong>projection\u003c/strong> (loại trùng). Trả về một dòng ba cột: \u003ccode>u_rows\u003c/code>, \u003ccode>joined_rows\u003c/code>, \u003ccode>missing\u003c/code> (số tuple của u không có trong join — phải bằng 0).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.12.\u003c/strong> Let R\u003csub>1\u003c/sub>, R\u003csub>2\u003c/sub>, …, R\u003csub>n\u003c/sub> be a decomposition of schema U, let u(U) be a relation, and let r\u003csub>i\u003c/sub> = Π\u003csub>R\u003csub>i\u003c/sub>\u003c/sub>(u). Show that\u003c/p>\n\u003cp>u ⊆ r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ ⋯ ⋈ r\u003csub>n\u003c/sub>\u003c/p>","hint":"","solution":"with j as (select a, b, c from (select distinct a, b from nf_r_abc) r1 natural join (select distinct b, c from nf_r_abc) r2)\nselect (select count(*) from nf_r_abc) as u_rows,\n       (select count(*) from j) as joined_rows,\n       (select count(*) from (select * from nf_r_abc except select * from j) x) as missing;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["u_rows","joined_rows","missing"],"rows":[["4","6","0"]]}},{"id":"CK2.11","topic":"PE 7.17 — 3 BCNF decompositions","level":3,"prompt":"\u003cp>PE 7.17: \u003ccode>nf_pe717(a, b, c, d)\u003c/code> thoả A → B, C → D, B → C. Với ba phân rã {(a,b),(c,d),(b,c)}, {(a,b),(c,d),(a,c)}, {(b,c),(a,d),(a,b)}, trả về một dòng ba cột \u003ccode>extra1, extra2, extra3\u003c/code>: số tuple \u003cstrong>thừa\u003c/strong> của natural join các projection so với bảng gốc (lossless ⇒ 0).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.17.\u003c/strong> Give an example of a relation schema R′ and a set F′ of functional dependencies for which there are at least three distinct lossless decompositions of R′ into BCNF.\u003c/p>","hint":"","solution":"with r as (select distinct * from nf_pe717),\nj1 as (select a, b, c, d from (select distinct a, b from r) x natural join (select distinct c, d from r) y natural join (select distinct b, c from r) z),\nj2 as (select a, b, c, d from (select distinct a, b from r) x natural join (select distinct c, d from r) y natural join (select distinct a, c from r) z),\nj3 as (select a, b, c, d from (select distinct b, c from r) x natural join (select distinct a, d from r) y natural join (select distinct a, b from r) z)\nselect (select count(*) from (select * from j1 except select * from r) t) as extra1,\n       (select count(*) from (select * from j2 except select * from r) t) as extra2,\n       (select count(*) from (select * from j3 except select * from r) t) as extra3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["extra1","extra2","extra3"],"rows":[["0","0","0"]]}},{"id":"CK2.12","topic":"PE 7.20 — MVD vs FD","level":2,"prompt":"\u003cp>PE 7.20: \u003ccode>nf_pe720(a, b, c)\u003c/code>. Trả về một dòng hai cột boolean: \u003ccode>mvd_a_b\u003c/code> — A →→ B thoả trên instance (với mỗi a, các dòng là đủ mọi tổ hợp b × c); \u003ccode>fd_a_b\u003c/code> — FD A → B có thoả không.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.20.\u003c/strong> Give an example of a relation schema R and a set of dependencies for which R is in BCNF but not in 4NF.\u003c/p>","hint":"","solution":"select not exists (select a from nf_pe720 group by a\n                   having count(*) \u003c> count(distinct b) * count(distinct c)) as mvd_a_b,\n       not exists (select a from nf_pe720 group by a having count(distinct b) > 1) as fd_a_b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["mvd_a_b","fd_a_b"],"rows":[["true","false"]]}},{"id":"CK2.13","topic":"PE 7.20 — 4NF","level":2,"prompt":"\u003cp>Phân rã 4NF của PE 7.20: tạo \u003ccode>nf_pe720_ab(a, b)\u003c/code> và \u003ccode>nf_pe720_ac(a, c)\u003c/code> bằng \u003ccode>create table ... as select distinct\u003c/code>. (Hệ thống đếm dòng hai bảng và số tuple thừa của join so với nf_pe720.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.20.\u003c/strong> Give an example of a relation schema R and a set of dependencies for which R is in BCNF but not in 4NF.\u003c/p>","hint":"","solution":"create table nf_pe720_ab as select distinct a, b from nf_pe720;\ncreate table nf_pe720_ac as select distinct a, c from nf_pe720;","check":"select (select count(*) from nf_pe720_ab) as ab_rows,\n       (select count(*) from nf_pe720_ac) as ac_rows,\n       (select count(*) from (select a, b, c from nf_pe720_ab natural join nf_pe720_ac\n                              except select * from nf_pe720) x) as extra;","ordered":false,"fresh":false,"expected":{"fields":["ab_rows","ac_rows","extra"],"rows":[["3","4","0"]]}},{"id":"CK2.14","topic":"PE 7.3 — cardinality via FD","level":1,"prompt":"\u003cp>PE 7.3 trên bảng \u003ccode>advisor(s_ID, i_ID)\u003c/code> của University: trả về một dòng hai cột boolean \u003ccode>s_to_i\u003c/code> (s_ID → i_ID có thoả) và \u003ccode>i_to_s\u003c/code> (i_ID → s_ID có thoả). Kết quả cho biết quan hệ advisor là một-một hay nhiều-một?\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 7.3.\u003c/strong> Explain how functional dependencies can be used to express each of the following:\u003c/p>\n\u003cul>\u003cli>a one-to-one relationship set exists between the entity sets \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em>;\u003c/li>\u003cli>a many-to-one relationship set exists between the entity sets \u003cem>student\u003c/em> and \u003cem>instructor\u003c/em>.\u003c/li>\u003c/ul>","hint":"","solution":"select not exists (select s_ID from advisor group by s_ID having count(distinct i_ID) > 1) as s_to_i,\n       not exists (select i_ID from advisor group by i_ID having count(distinct s_ID) > 1) as i_to_s;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["s_to_i","i_to_s"],"rows":[["true","false"]]}}]},{"key":"ck3","store":"ck3","short":"CK3","label":"Ôn CK · Phần 3","navLabel":"CK3","kind":"Ôn tập","title":"SQL & Relational Algebra Refresher","titleVi":"Ôn nhanh SQL & đại số quan hệ (phòng câu tổng hợp)","summary":"\u003ch3>0. Vì sao có phần này\u003c/h3>\n\u003cp>Đề cuối kỳ tập trung Chương 6–7, nhưng câu thiết kế thường kèm \"viết DDL\" hoặc \"viết truy vấn trên lược đồ vừa thiết kế\", và chuẩn hoá cần hiểu join/projection. Phần này ôn \u003cstrong>thật nhanh\u003c/strong> những gì hay ra nhất. Muốn ôn kỹ: Part 1 (Chương 2–4) và Part 3 (GK1–GK3).\u003c/p>\n\u003ch3>1. Đại số quan hệ ↔ SQL\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Đại số\u003c/th>\u003cth>SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>σ\u003csub>p\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select * from r where p\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Π\u003csub>A,B\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select distinct A, B from r\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ∪ s, r − s, r ∩ s\u003c/td>\u003ctd>\u003ccode>union\u003c/code>, \u003ccode>except\u003c/code>, \u003ccode>intersect\u003c/code> (tự loại trùng)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r × s\u003c/td>\u003ctd>\u003ccode>from r, s\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈\u003csub>θ\u003c/sub> s\u003c/td>\u003ctd>\u003ccode>r join s on θ\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈ s\u003c/td>\u003ctd>\u003ccode>r natural join s\u003c/code> (cẩn thận cột trùng tên ngoài ý muốn)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⟕ s, r ⟖ s, r ⟗ s\u003c/td>\u003ctd>\u003ccode>left / right / full outer join\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ÷ s (\"với mọi\")\u003c/td>\u003ctd>\u003ccode>not exists ((tập cần có) except (tập của đối tượng))\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003csub>G\u003c/sub>𝒢\u003csub>F(A)\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select G, F(A) from r group by G\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ρ\u003csub>x\u003c/sub>(E)\u003c/td>\u003ctd>\u003ccode>E as x\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Khuôn truy vấn hay gặp\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- Đếm cả nhóm rỗng: outer join + count(cột bên phải)\nselect b.branch_name, count(a.account_number)\nfrom branch b left join account a on a.branch_name = b.branch_name\ngroup by b.branch_name;\n\n-- Lớn nhất, có thể hoà\nwith t as (select company_name, count(*) as n from works group by company_name)\nselect company_name from t where n = (select max(n) from t);\n\n-- Không có / chưa từng\nselect * from person p\nwhere not exists (select * from participated x where x.driver_id = p.driver_id);\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>where\u003c/code> lọc dòng \u003cstrong>trước\u003c/strong> khi nhóm; \u003ccode>having\u003c/code> lọc \u003cstrong>nhóm\u003c/strong>.\u003c/li>\u003cli>\u003ccode>x &gt; all (S)\u003c/code>: lớn hơn max; \u003ccode>x &gt; some (S)\u003c/code>: lớn hơn min; \u003ccode>in\u003c/code> = \u003ccode>= some\u003c/code>; \u003ccode>not in\u003c/code> = \u003ccode>&lt;&gt; all\u003c/code> (cẩn thận null trong S).\u003c/li>\u003cli>Aggregate bỏ qua null; \u003ccode>count(*)\u003c/code> thì không. sum/avg của tập rỗng là null → dùng \u003ccode>coalesce\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>3. DDL & ràng buộc\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table policy (\n  policy_no  varchar(10) primary key,\n  driver_id  varchar(5) not null references person on delete cascade,\n  premium    numeric(10,2) check (premium &gt; 0),\n  start_date date,\n  end_date   date,\n  check (end_date &gt; start_date),\n  unique (driver_id, start_date));\u003c/code>\u003c/pre>\n\u003cul>\u003cli>PK = unique + not null; \u003ccode>unique\u003c/code> cho phép null; FK tham chiếu PK hoặc cột unique.\u003c/li>\u003cli>\u003ccode>on delete cascade | set null\u003c/code>; \u003ccode>check\u003c/code> không chứa subquery trong PostgreSQL.\u003c/li>\u003c/ul>\n\u003ch3>4. View & sửa dữ liệu\u003c/h3>\n\u003cul>\u003cli>\u003ccode>create view v(cột...) as select ...\u003c/code>; view có join/group by/distinct thì không update được.\u003c/li>\u003cli>\u003ccode>insert into r select ...\u003c/code>, \u003ccode>delete from r where ... in (subquery)\u003c/code>, \u003ccode>update r set c = case ... end where ...\u003c/code>.\u003c/li>\u003c/ul>","quiz":[{"q":"Π\u003csub>customer_city\u003c/sub>(customer) tương đương câu nào?","options":["select customer_city from customer","select distinct customer_city from customer","select * from customer","select count(customer_city) from customer"],"answer":1,"explain":"Projection loại trùng."},{"q":"Muốn liệt kê mọi customer kèm số account (0 nếu không có), phép join nào phù hợp?","options":["natural join","customer left outer join depositor","customer right outer join depositor","cross join"],"answer":1,"explain":"Giữ lại mọi customer, phía depositor bù null."},{"q":"Điều kiện chỉ áp dụng được sau khi nhóm (ví dụ count(*) >= 2) đặt ở đâu?","options":["where","having","from","order by"],"answer":1,"explain":"having lọc nhóm."},{"q":"\u003ccode>salary &gt; some (select salary from works where company_name = 'Small Bank Corporation')\u003c/code> nghĩa là?","options":["Lớn hơn lương lớn nhất của Small Bank","Lớn hơn lương nhỏ nhất của Small Bank","Bằng một lương nào đó","Lớn hơn trung bình"],"answer":1,"explain":"> some: lớn hơn ít nhất một giá trị, tức là lớn hơn min."},{"q":"Nếu S chứa null, \u003ccode>x not in (S)\u003c/code> có thể cho kết quả gì với mọi x không thuộc S?","options":["true","false","unknown — dòng bị loại","Lỗi"],"answer":2,"explain":"x \u003c> null là unknown, nên not in không bao giờ true. Dùng not exists an toàn hơn."},{"q":"Phép nào tương ứng \"khách có account ở MỌI branch của Horseneck\"?","options":["∪","−","÷","×"],"answer":2,"explain":"Division."},{"q":"\u003ccode>select sum(balance) from account where branch_name = 'Lakeview'\u003c/code> khi Lakeview không có account trả về?","options":["0","null (một dòng)","Không có dòng","Lỗi"],"answer":1,"explain":"Aggregate không group by luôn trả một dòng; sum tập rỗng = null."},{"q":"Ràng buộc nào cho phép giá trị null nhưng cấm trùng?","options":["primary key","unique","not null","foreign key"],"answer":1,"explain":"unique cho phép null."},{"q":"FK owns.license_plate → car có \u003ccode>on delete cascade\u003c/code>. Xoá một car thì?","options":["Bị từ chối","Các dòng owns của xe đó bị xoá theo","owns.license_plate thành null","Không ảnh hưởng owns"],"answer":1,"explain":"cascade lan sang bảng referencing."},{"q":"View nào UPDATE được (theo chuẩn SQL)?","options":["select branch_name, sum(balance) from account group by branch_name","select account_number, balance from account where balance > 500","select distinct branch_name from account","select * from account natural join depositor"],"answer":1,"explain":"Một bảng, chỉ có cột, không aggregate/distinct/group by."},{"q":"Kết quả \u003ccode>(select ID from depositor) union (select ID from borrower)\u003c/code> có dòng trùng không?","options":["Có","Không — union tự loại trùng","Chỉ khi có null","Tuỳ DBMS"],"answer":1,"explain":"Dùng union all nếu muốn giữ trùng."},{"q":"Đoạn \u003ccode>with t as (...) select ... from t where v = (select max(v) from t)\u003c/code> giải quyết vấn đề gì?","options":["Phân trang","Lấy tất cả các dòng đạt max, kể cả hoà","Tránh null","Tăng tốc join"],"answer":1,"explain":"Khác với order by ... limit 1 (chỉ lấy một dòng)."}],"questions":[{"q":"Viết đại số quan hệ (insurance database): tên những người \u003cstrong>sở hữu\u003c/strong> một chiếc xe đã gặp tai nạn năm 2017 nhưng \u003cstrong>không phải\u003c/strong> là người lái trong vụ đó.","en":"","answer":"\u003cp>D ← Π\u003csub>report_number, license_plate, driver_id\u003c/sub>(σ\u003csub>year = 2017\u003c/sub>(accident) ⋈ participated) — người \u003cstrong>lái\u003c/strong> trong mỗi vụ.\u003c/p>\n\u003cp>O ← ρ\u003csub>O(license_plate, owner_id)\u003c/sub>(owns) — \u003cstrong>chủ\u003c/strong> của mỗi xe (đổi tên để không trùng driver_id).\u003c/p>\n\u003cp>Kết quả: Π\u003csub>name\u003c/sub>(person ⋈\u003csub>person.driver_id = O.owner_id\u003c/sub> σ\u003csub>owner_id ≠ driver_id\u003c/sub>(D ⋈ O))\u003c/p>\n\u003cp>(D ⋈ O ghép theo license_plate; phải \u003cstrong>rename\u003c/strong> vì owns và participated cùng có driver_id — natural join không rename sẽ ép chủ = người lái, đúng cái ta muốn loại.)\u003c/p>\n\u003cp>\u003cstrong>SQL\u003c/strong> (dễ viết hơn, cũng là đáp án chấp nhận):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select distinct p.name\nfrom accident a join participated x on x.report_number = a.report_number\n     join owns o on o.license_plate = x.license_plate\n     join person p on p.driver_id = o.driver_id\nwhere a.year = 2017 and o.driver_id &lt;&gt; x.driver_id;\u003c/code>\u003c/pre>\n\u003cp>Với dữ liệu mẫu: Mary Lee (chủ DDD444, Chloe Park lái) và Brian Cho (đồng sở hữu EEE555).\u003c/p>"},{"q":"So sánh 3 cách tìm \"branch không có loan nào\": \u003ccode>not in\u003c/code>, \u003ccode>not exists\u003c/code>, \u003ccode>left outer join ... is null\u003c/code>. Cách nào có thể sai khi có null?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select branch_name from branch where branch_name not in (select branch_name from loan);\nselect branch_name from branch b where not exists (select * from loan l where l.branch_name = b.branch_name);\nselect b.branch_name from branch b left join loan l on l.branch_name = b.branch_name where l.loan_number is null;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>not in\u003c/strong> sai (trả rỗng) nếu subquery chứa một \u003ccode>branch_name\u003c/code> null, vì \u003ccode>x &lt;&gt; null\u003c/code> là unknown. \u003cstrong>not exists\u003c/strong> và \u003cstrong>left join + is null\u003c/strong> (kiểm tra cột khoá của bảng phải) không bị ảnh hưởng.\u003c/p>"},{"q":"Viết DDL cho bank database (branch, customer, loan, borrower, account, depositor) với PK, FK; giải thích vì sao borrower có khoá kép.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table branch (branch_name varchar(20) primary key, branch_city varchar(20), assets numeric(14,2) check (assets &gt;= 0));\ncreate table customer (ID varchar(5) primary key, customer_name varchar(20) not null, customer_street varchar(30), customer_city varchar(20));\ncreate table loan (loan_number varchar(10) primary key, branch_name varchar(20) references branch, amount numeric(12,2));\ncreate table borrower (ID varchar(5) references customer, loan_number varchar(10) references loan, primary key (ID, loan_number));\ncreate table account (account_number varchar(10) primary key, branch_name varchar(20) references branch, balance numeric(12,2));\ncreate table depositor (ID varchar(5) references customer, account_number varchar(10) references account, primary key (ID, account_number));\u003c/code>\u003c/pre>\n\u003cp>borrower biểu diễn quan hệ \u003cstrong>nhiều–nhiều\u003c/strong> customer–loan (một khách nhiều khoản vay, một khoản vay nhiều người đứng tên), nên khoá là hợp hai khoá của hai bên — đúng quy tắc chuyển relationship set many-to-many ở Chương 6.\u003c/p>"},{"q":"Giải thích tại sao \u003ccode>select * from employee natural join works natural join company\u003c/code> trên employee database cho kết quả \"lạ\".","en":"","answer":"\u003cp>employee có cột \u003cstrong>city\u003c/strong> (nơi ở) và company cũng có \u003cstrong>city\u003c/strong> (nơi đặt công ty). Natural join ghép theo \u003cstrong>mọi\u003c/strong> cột trùng tên, nên chỉ giữ nhân viên \u003cstrong>sống đúng thành phố công ty đặt trụ sở\u003c/strong> — không phải ý định. Cách đúng: \u003ccode>employee natural join works join company using (company_name)\u003c/code> hoặc \u003ccode>join ... on\u003c/code> rõ ràng. Đây là cùng loại bẫy với dept_name trong University (PE 4.1).\u003c/p>"}],"exercises":[{"id":"CK3.01","topic":"join","level":1,"prompt":"\u003cp>Bank: customer_name, loan_number, branch_name và amount của mọi khoản vay (mỗi người đứng tên một dòng).\u003c/p>","en":"","hint":"","solution":"select c.customer_name, l.loan_number, l.branch_name, l.amount\nfrom customer c join borrower b on b.ID = c.ID\n     join loan l on l.loan_number = b.loan_number;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["customer_name","loan_number","branch_name","amount"],"rows":[["Adams","L-16","Perryridge","1300"],["Brooks","L-14","Downtown","1500"],["Curry","L-93","Mianus","500"],["Glenn","L-20","North Town","7500"],["Hayes","L-15","Perryridge","1500"],["Jones","L-17","Downtown","1000"],["Smith","L-11","Round Hill","900"],["Smith","L-23","Redwood","2000"],["Turner","L-21","Chicago Loop","570"],["Williams","L-17","Downtown","1000"]]}},{"id":"CK3.02","topic":"left outer join + count","level":2,"prompt":"\u003cp>Mọi customer: ID, customer_name và số account đứng tên (\u003ccode>num_accounts\u003c/code>, 0 nếu không có).\u003c/p>","en":"","hint":"","solution":"select c.ID, c.customer_name, count(d.account_number) as num_accounts\nfrom customer c left outer join depositor d on d.ID = c.ID\ngroup by c.ID, c.customer_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","customer_name","num_accounts"],"rows":[["89012","Lindsay","1"],["56789","Hayes","1"],["23456","Curry","0"],["92345","Williams","0"],["19283","Brooks","0"],["93456","Knight","1"],["90123","Smith","1"],["45678","Green","1"],["78901","Jones","1"],["34567","Glenn","0"],["12345","Adams","1"],["91234","Turner","1"],["67890","Johnson","2"]]}},{"id":"CK3.03","topic":"group by / having","level":1,"prompt":"\u003cp>Các customer_city có \u003cstrong>ít nhất 2\u003c/strong> khách hàng; trả về customer_city và số khách.\u003c/p>","en":"","hint":"","solution":"select customer_city, count(*) as num_customers\nfrom customer\ngroup by customer_city\nhaving count(*) >= 2;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["customer_city","num_customers"],"rows":[["Stamford","2"],["Pittsfield","3"],["Harrison","2"],["Rye","2"]]}},{"id":"CK3.04","topic":"in subquery","level":1,"prompt":"\u003cp>Insurance: name của những người sở hữu ít nhất một xe đời (year) 2010.\u003c/p>","en":"","hint":"","solution":"select name from person\nwhere driver_id in (select o.driver_id from owns o join car c on c.license_plate = o.license_plate\n                    where c.year = 2010);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Mary Lee"],["John Carter"]]}},{"id":"CK3.05","topic":"not exists","level":2,"prompt":"\u003cp>Insurance: driver_id và name của những người \u003cstrong>có sở hữu xe\u003c/strong> nhưng \u003cstrong>chưa từng là người lái\u003c/strong> trong vụ tai nạn nào.\u003c/p>","en":"","hint":"","solution":"select p.driver_id, p.name\nfrom person p\nwhere exists (select * from owns o where o.driver_id = p.driver_id)\n  and not exists (select * from participated x where x.driver_id = p.driver_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["driver_id","name"],"rows":[["22222","Mary Lee"]]}},{"id":"CK3.06","topic":"> all","level":2,"prompt":"\u003cp>Employee: ID và salary của nhân viên có lương cao hơn \u003cstrong>mọi\u003c/strong> nhân viên của \u003ccode>Mega Corp\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select ID, salary from works\nwhere salary > all (select salary from works where company_name = 'Mega Corp');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","85000"],["10004","92000"],["10007","120000"],["10008","105000"]]}},{"id":"CK3.07","topic":"union","level":1,"prompt":"\u003cp>Các thành phố có branch \u003cstrong>hoặc\u003c/strong> có khách hàng sinh sống (không trùng).\u003c/p>","en":"","hint":"","solution":"(select branch_city from branch)\nunion\n(select customer_city from customer);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_city"],"rows":[["Stamford"],["Horseneck"],["Chicago"],["Harrison"],["Woodside"],["Palo Alto"],["Rye"],["Brooklyn"],["Pittsfield"],["Princeton"]]}},{"id":"CK3.08","topic":"with","level":2,"prompt":"\u003cp>Insurance: với mỗi năm, tổng damage_amount của các vụ tai nạn trong năm đó; chỉ trả về các năm có tổng damage \u003cstrong>lớn hơn trung bình\u003c/strong> tổng damage của các năm. Trả về year, total_damage.\u003c/p>","en":"","hint":"","solution":"with by_year as (\n  select a.year, sum(x.damage_amount) as total_damage\n  from accident a join participated x on x.report_number = a.report_number\n  group by a.year)\nselect year, total_damage from by_year\nwhere total_damage > (select avg(total_damage) from by_year);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["year","total_damage"],"rows":[["2017","5100"],["2018","3000"]]}},{"id":"CK3.09","topic":"scalar subquery","level":2,"prompt":"\u003cp>Mọi branch: branch_name, assets và số account của branch (dùng \u003cstrong>scalar subquery\u003c/strong> trong select, không dùng join).\u003c/p>","en":"","hint":"","solution":"select branch_name, assets,\n       (select count(*) from account a where a.branch_name = b.branch_name) as num_accounts\nfrom branch b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","assets","num_accounts"],"rows":[["Downtown","9000000","1"],["Redwood","2100000","1"],["Perryridge","1700000","1"],["Mianus","400000","1"],["Round Hill","8000000","1"],["Brighton","7100000","2"],["North Town","3700000","1"],["Chicago Loop","5000000","1"],["Lakeview","2500000","0"]]}},{"id":"CK3.10","topic":"case + group by","level":2,"prompt":"\u003cp>Phân loại account theo balance: dưới 500 là \u003ccode>'low'\u003c/code>, từ 500 đến dưới 800 là \u003ccode>'medium'\u003c/code>, còn lại \u003ccode>'high'\u003c/code>. Trả về level và số account mỗi loại.\u003c/p>","en":"","hint":"","solution":"select case when balance \u003c 500 then 'low'\n            when balance \u003c 800 then 'medium'\n            else 'high' end as level,\n       count(*)\nfrom account\ngroup by 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["level","count"],"rows":[["medium","5"],["high","2"],["low","2"]]}},{"id":"CK3.11","topic":"DDL + constraints","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>policy(policy_no, driver_id, premium, start_date, end_date)\u003c/code>: policy_no là primary key; driver_id \u003cstrong>bắt buộc\u003c/strong> và là foreign key tới person; premium > 0; end_date phải sau start_date.\u003c/p>","en":"","hint":"","solution":"create table policy (\n  policy_no  varchar(10) primary key,\n  driver_id  varchar(5) not null references person,\n  premium    numeric(10,2) check (premium > 0),\n  start_date date,\n  end_date   date,\n  check (end_date > start_date));","check":"select try_sql($$insert into policy values ('P1', '12345', 500, '2024-01-01', '2025-01-01')$$) as valid_row,\n       try_sql($$insert into policy values ('P1', '22222', 300, '2024-01-01', '2025-01-01')$$) as dup_key,\n       try_sql($$insert into policy values ('P2', null, 300, '2024-01-01', '2025-01-01')$$) as null_driver,\n       try_sql($$insert into policy values ('P3', '99999', 300, '2024-01-01', '2025-01-01')$$) as bad_driver,\n       try_sql($$insert into policy values ('P4', '22222', 0, '2024-01-01', '2025-01-01')$$) as zero_premium,\n       try_sql($$insert into policy values ('P5', '22222', 100, '2025-01-01', '2024-01-01')$$) as bad_dates;","ordered":false,"fresh":false,"expected":{"fields":["valid_row","dup_key","null_driver","bad_driver","zero_premium","bad_dates"],"rows":[["ok","23505","23502","23503","23514","23514"]]}},{"id":"CK3.12","topic":"create view","level":1,"prompt":"\u003cp>Tạo view \u003ccode>accident_damage(report_number, year, total_damage)\u003c/code> — tổng thiệt hại của từng vụ tai nạn.\u003c/p>","en":"","hint":"","solution":"create view accident_damage (report_number, year, total_damage) as\n  select a.report_number, a.year, sum(x.damage_amount)\n  from accident a join participated x on x.report_number = a.report_number\n  group by a.report_number, a.year;","check":"select * from accident_damage;","ordered":false,"fresh":false,"expected":{"fields":["report_number","year","total_damage"],"rows":[["AR1005","2016","400"],["AR1002","2017","2500"],["AR1004","2017","600"],["AR1003","2018","3000"],["AR1001","2017","2000"]]}},{"id":"CK3.13","topic":"delete + subquery","level":2,"prompt":"\u003cp>Xoá mọi chiếc xe đời \u003cstrong>trước 2016\u003c/strong> chưa từng gặp tai nạn nào. (owns có on delete cascade.)\u003c/p>","en":"","hint":"","solution":"delete from car\nwhere year \u003c 2016\n  and license_plate not in (select license_plate from participated);","check":"select c.license_plate, (select count(*) from owns o where o.license_plate = c.license_plate) as owners\nfrom car c;","ordered":false,"fresh":false,"expected":{"fields":["license_plate","owners"],"rows":[["AAA111","1"],["DDD444","1"],["EEE555","2"],["FFF666","1"],["GGG777","1"]]}},{"id":"CK3.14","topic":"update + subquery","level":1,"prompt":"\u003cp>Tăng 5% amount của các loan thuộc branch nằm ở thành phố \u003ccode>Horseneck\u003c/code>.\u003c/p>","en":"","hint":"","solution":"update loan set amount = amount * 1.05\nwhere branch_name in (select branch_name from branch where branch_city = 'Horseneck');","check":"select loan_number, amount from loan;","ordered":false,"fresh":false,"expected":{"fields":["loan_number","amount"],"rows":[["L-14","1500"],["L-17","1000"],["L-20","7500"],["L-21","570"],["L-23","2000"],["L-11","945"],["L-15","1575"],["L-16","1365"],["L-93","525"]]}},{"id":"CK3.15","topic":"division","level":3,"prompt":"\u003cp>ID và customer_name của khách có account ở \u003cstrong>mọi\u003c/strong> branch mà khách \u003ccode>'12345'\u003c/code> có account (kể cả chính 12345).\u003c/p>","en":"","hint":"","solution":"select c.ID, c.customer_name\nfrom customer c\nwhere not exists (\n  (select a.branch_name from depositor d join account a on a.account_number = d.account_number\n   where d.ID = '12345')\n  except\n  (select a.branch_name from depositor d join account a on a.account_number = d.account_number\n   where d.ID = c.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","customer_name"],"rows":[["12345","Adams"],["67890","Johnson"]]}}]},{"key":"ck4","store":"ck4","short":"Đề CK","label":"Đề thi thử CK","navLabel":"Đề CK","kind":"Đề thi thử","title":"Mock Final (Chapters 6–7)","titleVi":"Đề thi thử cuối kỳ — Chương 6–7","summary":"\u003ch3>1. Cách làm đề thi thử\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Thời gian gợi ý: 120 phút\u003c/strong>, không mở slide. Làm \u003cstrong>Trắc nghiệm\u003c/strong> và \u003cstrong>Tự luận\u003c/strong> trên giấy trước (khoảng 80 phút), rồi mới làm \u003cstrong>Bài tập SQL\u003c/strong> (khoảng 40 phút).\u003c/li>\u003cli>Các bài phụ thuộc hàm là lược đồ \u003cstrong>mới\u003c/strong> (không có trong sách) để kiểm tra bạn làm được thuật toán, không phải nhớ đáp án. Làm tay xong thì đối chiếu bằng \u003cstrong>Công cụ › Phụ thuộc hàm (FD)\u003c/strong> trên thanh menu — công cụ hiện từng bước bao đóng, khoá, canonical cover, phân rã BCNF/3NF.\u003c/li>\u003cli>Câu vẽ E-R: đáp án dùng sơ đồ chữ (ASCII). Trong phòng thi hãy vẽ đúng ký hiệu của sách: hình chữ nhật (entity set, liệt kê thuộc tính, gạch chân khoá), hình thoi (relationship set), mũi tên = \"một\", đường đôi = total participation, hình chữ nhật đôi/hình thoi đôi = weak entity set/identifying relationship, discriminator gạch chân nét đứt.\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phần\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Điểm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A. Trắc nghiệm\u003c/td>\u003ctd>25 câu × 0,16\u003c/td>\u003ctd>4,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B. Tự luận\u003c/td>\u003ctd>Câu 1–2 (E-R) 1,0đ mỗi câu; Câu 3–6 (FD) 0,75đ mỗi câu\u003c/td>\u003ctd>5,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C. SQL\u003c/td>\u003ctd>10 bài × 0,1\u003c/td>\u003ctd>1,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tổng\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>10\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Kế hoạch ôn (tuần 13–15, song song thuyết trình project)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Thời điểm\u003c/th>\u003cth>Việc cần làm\u003c/th>\u003cth>Ở đâu\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tuần 13, buổi 1\u003c/td>\u003ctd>Đọc lại tóm tắt Chương 6; làm PE 6.1–6.7 (vẽ E-R, ternary vs binary, weak entity)\u003c/td>\u003ctd>Part 2 · Chương 6 → \u003cstrong>CK1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tuần 13, buổi 2\u003c/td>\u003ctd>PE 6.8–6.13 (chuyển E-R sang bảng, ép cardinality/participation bằng PK/FK/unique/not null, specialization, temporal)\u003c/td>\u003ctd>\u003cstrong>CK1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tuần 14, buổi 1\u003c/td>\u003ctd>Chương 7: FD, bao đóng, khoá, lossless, BCNF, 3NF; PE 7.1–7.10\u003c/td>\u003ctd>Part 2 · Chương 7 → \u003cstrong>CK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tuần 14, buổi 2\u003c/td>\u003ctd>PE 7.11–7.20 (canonical cover, chứng minh Armstrong, 2NF/3NF/4NF); tự kiểm tra bằng công cụ FD\u003c/td>\u003ctd>\u003cstrong>CK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đầu tuần 15\u003c/td>\u003ctd>Ôn nhanh SQL/đại số quan hệ phòng câu tổng hợp\u003c/td>\u003ctd>\u003cstrong>CK3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 ngày trước thi\u003c/td>\u003ctd>Làm đề thi thử này trong 120 phút, chấm điểm, làm lại câu sai\u003c/td>\u003ctd>\u003cstrong>Đề CK\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Checklist \"phải thuộc\"\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Mapping cardinality\u003c/strong>: mũi tên chỉ vào phía \"một\". Ternary: tối đa một mũi tên.\u003c/li>\u003cli>\u003cstrong>Chuyển E-R → bảng\u003c/strong>: strong entity → bảng cùng khoá; composite → làm phẳng; multivalued → bảng riêng (khoá entity + giá trị); M:N → bảng có khoá = hợp khoá hai bên; M:1 total ở phía \"many\" → gộp vào bảng phía many (FK, not null nếu total); 1:1 → gộp bên nào cũng được + \u003ccode>unique\u003c/code> cho FK; weak entity → khoá = khoá strong entity + discriminator, FK \u003ccode>on delete cascade\u003c/code>, bảng của identifying relationship là thừa.\u003c/li>\u003cli>\u003cstrong>Specialization\u003c/strong>: cách 1 (bảng cha + bảng con chứa khoá cha) dùng được mọi trường hợp; cách 2 (chỉ bảng con, chứa cả thuộc tính kế thừa) chỉ hợp khi \u003cstrong>total + disjoint\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Aggregation\u003c/strong>: bảng của relationship ngoài chứa khoá của relationship được aggregate + khoá entity kia.\u003c/li>\u003cli>\u003cstrong>FD\u003c/strong>: α → β đúng trên r nếu hai tuple trùng α thì trùng β. K là superkey ⇔ K⁺ = R. Candidate key = superkey tối thiểu. Thuộc tính không xuất hiện ở vế phải nào phải có trong \u003cstrong>mọi\u003c/strong> khoá.\u003c/li>\u003cli>\u003cstrong>Lossless\u003c/strong> (2 lược đồ): R\u003csub>1\u003c/sub> ∩ R\u003csub>2\u003c/sub> → R\u003csub>1\u003c/sub> hoặc R\u003csub>1\u003c/sub> ∩ R\u003csub>2\u003c/sub> → R\u003csub>2\u003c/sub>.\u003c/li>\u003cli>\u003cstrong>Dependency preserving\u003c/strong>: mỗi FD kiểm tra được trong một lược đồ con (hoặc suy ra được từ các F\u003csub>i\u003c/sub>).\u003c/li>\u003cli>\u003cstrong>BCNF\u003c/strong>: mọi α → β không tầm thường có α là superkey. \u003cstrong>3NF\u003c/strong>: hoặc α superkey, hoặc mọi thuộc tính của β − α là prime. BCNF ⇒ 3NF.\u003c/li>\u003cli>\u003cstrong>Canonical cover\u003c/strong>: hợp vế trái trùng; bỏ \u003cstrong>từng\u003c/strong> thuộc tính thừa (trái: (α − A)⁺ ⊇ β dưới F; phải: α⁺ dưới F' vẫn chứa A).\u003c/li>\u003cli>\u003cstrong>3NF synthesis\u003c/strong>: mỗi FD trong F\u003csub>c\u003c/sub> → một lược đồ αβ; thêm một candidate key nếu chưa có; bỏ lược đồ nằm trong lược đồ khác.\u003c/li>\u003c/ul>","quiz":[{"q":"Một instructor có thể có nhiều số điện thoại. Trong E-R, phone nên là loại thuộc tính nào?","options":["Composite","Multivalued {phone}","Derived phone()","Khoá"],"answer":1,"explain":"Nhiều giá trị cho một entity → multivalued, chuyển thành bảng riêng inst_phone(ID, phone)."},{"q":"Thuộc tính age của student tính được từ date_of_birth. Đây là?","options":["Multivalued attribute","Derived attribute","Composite attribute","Discriminator"],"answer":1,"explain":"Derived attribute (ký hiệu age()), thường không lưu trong bảng."},{"q":"Relationship advisor: đường từ advisor tới instructor có mũi tên, tới student không có mũi tên. Nghĩa là?","options":["Mỗi instructor tối đa một student","Mỗi student có tối đa một advisor; một instructor có thể hướng dẫn nhiều student","One-to-one","Many-to-many"],"answer":1,"explain":"Mũi tên chỉ vào phía \"một\": quan hệ one-to-many từ instructor tới student."},{"q":"Đường đôi nối student với advisor nghĩa là?","options":["Mỗi student có đúng hai advisor","Total participation: mọi student phải tham gia ít nhất một quan hệ advisor","student là weak entity","advisor có thuộc tính"],"answer":1,"explain":"Double line = total participation."},{"q":"Trên đường student — advisor ghi 1..1, đường instructor — advisor ghi 0..*. Điều nào đúng?","options":["Mỗi instructor đúng một student","Mỗi student đúng một advisor; instructor có thể không hướng dẫn ai","Mỗi student có thể không có advisor","Quan hệ many-to-many"],"answer":1,"explain":"l..h ghi số lần tối thiểu/tối đa entity đó tham gia relationship."},{"q":"Primary key của weak entity set section (identifying entity course, discriminator sec_id, semester, year) là?","options":["(sec_id, semester, year)","(course_id, sec_id, semester, year)","(course_id)","Không có khoá"],"answer":1,"explain":"Khoá strong entity + discriminator."},{"q":"Relationship set takes là many-to-many giữa student và section, có thuộc tính grade. Khoá của bảng takes là?","options":["ID","(course_id, sec_id, semester, year)","(ID, course_id, sec_id, semester, year)","(ID, grade)"],"answer":2,"explain":"M:N → hợp khoá hai bên; thuộc tính của relationship (grade) không vào khoá."},{"q":"inst_dept là many-to-one từ instructor tới department, total ở phía instructor. Cách chuyển tốt nhất?","options":["Bảng inst_dept(ID, dept_name) riêng","Thêm cột dept_name (not null, FK) vào bảng instructor, bỏ bảng inst_dept","Thêm cột ID vào department","Gộp instructor và department"],"answer":1,"explain":"Bảng relationship M:1 total ở phía many là thừa; gộp vào phía many (PE 6.10)."},{"q":"advisor được đổi thành one-to-one; bảng advisor(s_ID PK, i_ID). Cần thêm ràng buộc gì?","options":["check (i_ID > 0)","unique (i_ID)","not null s_ID","Không cần"],"answer":1,"explain":"PE 6.9: i_ID cũng phải là superkey."},{"q":"Composite attribute name(first_name, last_name) của instructor được chuyển thành?","options":["Một cột name kiểu text","Hai cột name_first_name, name_last_name (hoặc first_name, last_name) trong bảng instructor","Bảng riêng instructor_name","Không chuyển"],"answer":1,"explain":"Composite được làm phẳng thành các cột thành phần."},{"q":"person được specialize thành employee và student; một người có thể vừa là employee vừa là student. Đây là specialization?","options":["Disjoint","Overlapping","Weak","Aggregation"],"answer":1,"explain":"Overlapping (ký hiệu một mũi tên ISA chung có nhánh, không ghi disjoint)."},{"q":"Với specialization overlapping và partial, cách chuyển nào phù hợp?","options":["Chỉ tạo bảng cho các lower-level entity (cách 2)","Bảng cho higher-level + bảng cho mỗi lower-level chứa khoá higher-level (cách 1)","Một bảng duy nhất không có khoá","Không chuyển được"],"answer":1,"explain":"Cách 2 lặp dữ liệu khi overlapping và không lưu được entity chỉ thuộc lớp cha khi partial."},{"q":"Aggregation dùng để làm gì?","options":["Tính tổng thuộc tính","Coi một relationship set như một entity để nó tham gia relationship khác (ví dụ eval_for trên proj_guide)","Thay weak entity","Thay specialization"],"answer":1,"explain":"Tránh redundancy giữa ternary relationship và relationship lồng."},{"q":"Vì sao ternary relationship chỉ cho phép tối đa một mũi tên?","options":["Vì vẽ khó","Nhiều mũi tên có thể hiểu theo hai nghĩa khác nhau, gây mơ hồ","Vì SQL không hỗ trợ","Vì ternary luôn many-to-many"],"answer":1,"explain":"Slide 6.33 (cardinality trên ternary)."},{"q":"Thêm khoá của identifying entity vào weak entity để biến nó thành strong entity gây ra vấn đề gì?","options":["Không có vấn đề","Redundancy: khoá đó xuất hiện cả ở entity và relationship, phải luôn bằng nhau","Mất dữ liệu","Vi phạm 1NF"],"answer":1,"explain":"PE 6.7."},{"q":"FD nào là trivial?","options":["ID → name","ID, name → name","name → ID","dept_name → building"],"answer":1,"explain":"β ⊆ α."},{"q":"R(A, B, C, D), F = {A → B, B → C, C → D}. Phân rã {(A,B), (A,C), (A,D)} là?","options":["Lossy","Lossless và bảo toàn phụ thuộc","Lossless nhưng KHÔNG bảo toàn B → C, C → D","Không phủ hết R"],"answer":2,"explain":"Giao luôn là A (khoá) nên lossless; nhưng B → C không kiểm tra được trong lược đồ nào."},{"q":"R(A, B, C, D), F = {AB → C, C → D, D → A}. Candidate key của R là?","options":["AB","AB, BC, BD","AB, CD","B"],"answer":1,"explain":"B phải có (không ở vế phải); B kết hợp với A, C hoặc D đều suy ra R."},{"q":"Với R và F ở câu trước, R đạt dạng chuẩn nào?","options":["BCNF","3NF nhưng không BCNF","Không đạt 3NF","Không xác định"],"answer":1,"explain":"C → D, D → A có vế trái không phải superkey (vi phạm BCNF), nhưng A, D đều prime nên đạt 3NF."},{"q":"Phân rã R thành R1, R2 là lossless khi?","options":["R1 ∩ R2 = ∅","R1 ∩ R2 → R1 hoặc R1 ∩ R2 → R2 thuộc F⁺","R1 ∪ R2 ≠ R","R1 và R2 cùng ở BCNF"],"answer":1,"explain":"Phần chung là superkey của ít nhất một bên."},{"q":"dept_advisor(s_ID, i_ID, dept_name) với i_ID → dept_name và s_ID, dept_name → i_ID. Nhận xét nào ĐÚNG?","options":["Ở BCNF","Không ở BCNF; mọi phân rã BCNF đều mất s_ID, dept_name → i_ID","Không ở 3NF","Không có candidate key"],"answer":1,"explain":"Ví dụ kinh điển BCNF không bảo toàn phụ thuộc; nhưng lược đồ ở 3NF."},{"q":"Điều nào luôn làm được với mọi lược đồ?","options":["Phân rã BCNF lossless và bảo toàn phụ thuộc","Phân rã 3NF lossless và bảo toàn phụ thuộc","Phân rã 4NF bảo toàn phụ thuộc","Không có"],"answer":1,"explain":"3NF synthesis luôn đảm bảo cả hai; BCNF có thể mất phụ thuộc."},{"q":"Canonical cover F\u003csub>c\u003c/sub> của F KHÔNG cần thoả điều nào?","options":["F\u003csub>c\u003c/sub> tương đương F","Không FD nào có thuộc tính thừa","Không hai FD cùng vế trái","Là duy nhất với mỗi F"],"answer":3,"explain":"PE 7.14: một F có thể có nhiều canonical cover."},{"q":"Ba tiên đề Armstrong là?","options":["Union, decomposition, pseudotransitivity","Reflexivity, augmentation, transitivity","Reflexivity, union, transitivity","Augmentation, decomposition, union"],"answer":1,"explain":"Union, decomposition, pseudotransitivity là luật suy ra (PE 7.4, 7.5)."},{"q":"inst_info(ID, child_name, phone): một giảng viên nhiều con và nhiều số điện thoại, không có FD không tầm thường. Vì sao vẫn chưa tốt?","options":["Vi phạm BCNF","Ở BCNF nhưng có multivalued dependency ID →→ child_name, ID →→ phone gây lặp; nên tách theo 4NF","Vi phạm 1NF","Không có khoá"],"answer":1,"explain":"Slide 7.33–7.35: động lực của 4NF."}],"questions":[{"q":"(1,0đ) \u003cstrong>Thiết kế E-R.\u003c/strong> Thư viện quản lý: \u003cem>thành viên\u003c/em> (mã, tên, nhiều số điện thoại); \u003cem>đầu sách\u003c/em> (ISBN, tên, năm xuất bản) có một hoặc nhiều \u003cem>tác giả\u003c/em> (mã, tên), một tác giả viết nhiều đầu sách; mỗi đầu sách do đúng một \u003cem>nhà xuất bản\u003c/em> (tên, thành phố); thư viện có nhiều \u003cem>bản sao\u003c/em> của mỗi đầu sách, bản sao đánh số 1, 2, 3… trong từng đầu sách và có tình trạng; mỗi \u003cem>lượt mượn\u003c/em> ghi thành viên nào mượn bản sao nào, ngày mượn, hạn trả, ngày trả (một thành viên có thể mượn lại cùng bản sao nhiều lần). Vẽ E-R và chuyển sang lược đồ quan hệ (gạch chân khoá, ghi FK).","en":"","answer":"\u003cp>\u003cstrong>Sơ đồ (ASCII):\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode> member(member_id, name, {phone})          author(author_id, name)\n        |                                          |\n        | 1                                        | (many)\n     &lt;borrows&gt;                                  &lt;writes&gt;\n        |                                          |\n        | *                                        | (many, total)\n loan(loan_id, loan_date, due_date,      book(isbn, title, year) ==&lt;published_by&gt;--&gt; publisher(pub_name, city)\n      return_date)                         ||   (total, many-to-one: mũi tên chỉ vào publisher)\n        | *                                ||\n     &lt;of_copy&gt;                          &lt;&lt;has_copy&gt;&gt;   (identifying relationship, hình thoi đôi)\n        | 1                                ||\n        +-------------------------------&gt; [[copy(copy_no - - -, condition)]]  (weak entity, copy_no là discriminator)\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ý chấm:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>copy\u003c/strong> là \u003cstrong>weak entity\u003c/strong> của book (copy_no chỉ duy nhất trong một đầu sách), total participation, identifying relationship hình thoi đôi.\u003c/li>\u003cli>\u003cstrong>writes\u003c/strong> many-to-many, book tham gia total (ít nhất một tác giả). \u003cstrong>published_by\u003c/strong> many-to-one, total phía book.\u003c/li>\u003cli>Mượn lại cùng bản sao nhiều lần ⇒ không dùng relationship member–copy với khoá (member_id, isbn, copy_no); mô hình \u003cstrong>loan\u003c/strong> thành entity (hoặc thêm loan_date vào khoá).\u003c/li>\u003cli>phone là \u003cstrong>multivalued\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Lược đồ:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>member(\u003cu>member_id\u003c/u>, name); member_phone(\u003cu>member_id, phone\u003c/u>) FK member_id → member\u003c/li>\u003cli>author(\u003cu>author_id\u003c/u>, name); publisher(\u003cu>pub_name\u003c/u>, city)\u003c/li>\u003cli>book(\u003cu>isbn\u003c/u>, title, year, pub_name \u003cstrong>not null\u003c/strong>) FK pub_name → publisher (gộp published_by vào book)\u003c/li>\u003cli>writes(\u003cu>isbn, author_id\u003c/u>) FK → book, author\u003c/li>\u003cli>copy(\u003cu>isbn, copy_no\u003c/u>, condition) FK isbn → book \u003cstrong>on delete cascade\u003c/strong> (bảng has_copy thừa)\u003c/li>\u003cli>loan(\u003cu>loan_id\u003c/u>, member_id not null, isbn, copy_no, loan_date, due_date, return_date) FK member_id → member, (isbn, copy_no) → copy (gộp borrows và of_copy vì many-to-one, total phía loan)\u003c/li>\u003c/ul>"},{"q":"(1,0đ) \u003cstrong>Chuyển E-R sang bảng.\u003c/strong> E-R gồm: employee(ID, name, {skill}); weak entity dependent(dep_name, relationship) phụ thuộc employee; employee được specialize \u003cstrong>overlapping, partial\u003c/strong> thành engineer(specialty) và manager(bonus); project(proj_id, title); works_on là many-to-many giữa employee và project, thuộc tính hours; \u003cstrong>aggregation\u003c/strong> works_on tham gia relationship monitors với manager, mỗi phân công (employee, project) do \u003cstrong>tối đa một\u003c/strong> manager giám sát. Viết lược đồ quan hệ, chỉ rõ PK/FK và giải thích lựa chọn.","en":"","answer":"\u003cul>\u003cli>employee(\u003cu>ID\u003c/u>, name)\u003c/li>\u003cli>employee_skill(\u003cu>ID, skill\u003c/u>), FK ID → employee — \u003cstrong>multivalued\u003c/strong> thành bảng riêng.\u003c/li>\u003cli>dependent(\u003cu>ID, dep_name\u003c/u>, relationship), FK ID → employee \u003cstrong>on delete cascade\u003c/strong> — khoá weak entity = khoá employee + discriminator; bảng của identifying relationship là thừa.\u003c/li>\u003cli>engineer(\u003cu>ID\u003c/u>, specialty), FK ID → employee; manager(\u003cu>ID\u003c/u>, bonus), FK ID → employee — \u003cstrong>cách 1\u003c/strong> vì overlapping (cách 2 sẽ lặp name cho người vừa là engineer vừa là manager) và partial (cách 2 không lưu được employee không thuộc lớp con nào).\u003c/li>\u003cli>project(\u003cu>proj_id\u003c/u>, title)\u003c/li>\u003cli>works_on(\u003cu>ID, proj_id\u003c/u>, hours), FK → employee, project — M:N.\u003c/li>\u003cli>monitors(\u003cu>ID, proj_id\u003c/u>, manager_id), FK (ID, proj_id) → works_on, FK manager_id → manager — khoá chỉ gồm khoá của aggregation vì \u003cstrong>many-to-one\u003c/strong> từ aggregation tới manager. Có thể gộp vào works_on dưới dạng cột manager_id \u003cstrong>nullable\u003c/strong> (partial).\u003c/li>\u003c/ul>"},{"q":"(0,75đ) R = (A, B, C, D, E), F = {A → B, BC → E, ED → A}. (a) Tính (BC)⁺. (b) Tìm \u003cstrong>mọi\u003c/strong> candidate key. (c) R có ở 3NF không? BCNF không? Giải thích.","en":"","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> (BC)⁺: result = BC → dùng BC → E: BCE. Không FD nào thêm được (A → B cần A; ED → A cần D). \u003cstrong>(BC)⁺ = BCE\u003c/strong> — không phải superkey.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> C và D không xuất hiện ở vế phải nào ⇒ thuộc \u003cstrong>mọi\u003c/strong> khoá. (CD)⁺ = CD — chưa đủ. Thử thêm một thuộc tính:\u003c/p>\n\u003cul>\u003cli>(ACD)⁺: A → B ⇒ ABCD; BC → E ⇒ ABCDE ✓\u003c/li>\u003cli>(BCD)⁺: BC → E ⇒ BCDE; ED → A ⇒ ABCDE ✓\u003c/li>\u003cli>(CDE)⁺: ED → A ⇒ ACDE; A → B ⇒ ABCDE ✓\u003c/li>\u003c/ul>\n\u003cp>Mọi tập lớn hơn chứa một trong ba tập này. \u003cstrong>Candidate key: ACD, BCD, CDE.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>(c)\u003c/strong> Mọi thuộc tính A, B, C, D, E đều \u003cstrong>prime\u003c/strong> ⇒ mọi FD thoả điều kiện thứ ba của 3NF ⇒ \u003cstrong>R ở 3NF\u003c/strong>. Nhưng vế trái A, BC, ED đều \u003cstrong>không phải superkey\u003c/strong> ⇒ \u003cstrong>không ở BCNF\u003c/strong>. (Kiểm tra bằng công cụ FD: nhập R = ABCDE và ba FD.)\u003c/p>"},{"q":"(0,75đ) Tính \u003cstrong>canonical cover\u003c/strong> của F = {A → BC, B → C, AB → D, D → E, AD → E} trên R = (A, B, C, D, E). Ghi rõ từng thuộc tính thừa và lý do.","en":"","answer":"\u003col>\u003cli>Không có hai vế trái trùng nhau ban đầu.\u003c/li>\u003cli>\u003cstrong>C thừa ở vế phải của A → BC\u003c/strong>: bỏ C được F' = {A → B, B → C, AB → D, D → E, AD → E}; dưới F', A⁺ = ABCDE vẫn chứa C ⇒ còn \u003cstrong>A → B\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>B thừa ở vế trái của AB → D\u003c/strong>: dưới F, A⁺ = ABCDE ⊇ D ⇒ thay bằng \u003cstrong>A → D\u003c/strong>. Hợp: \u003cstrong>A → BD\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>A thừa ở vế trái của AD → E\u003c/strong>: D⁺ = DE ⊇ E ⇒ thành D → E, trùng FD có sẵn — gộp lại.\u003c/li>\u003cli>Kiểm tra lại: trong A → BD, B không thừa (bỏ B thì A⁺ = ADE, không có B); D không thừa (bỏ D thì A⁺ = ABC). B → C, D → E không còn gì thừa.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>F\u003csub>c\u003c/sub> = {A → BD, B → C, D → E}.\u003c/strong> (Mỗi bước chỉ bỏ \u003cstrong>một\u003c/strong> thuộc tính — PE 7.15.)\u003c/p>"},{"q":"(0,75đ) R = (C, T, H, R, S, G) (Course, Teacher, Hour, Room, Student, Grade), F = {C → T, HR → C, HT → R, CS → G, HS → R}. (a) Chứng minh HS là khoá duy nhất. (b) Phân rã R về BCNF (ghi từng bước). (c) Phân rã có lossless không? FD nào bị mất?","en":"","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> H, S không ở vế phải nào ⇒ thuộc mọi khoá. (HS)⁺: HS → R ⇒ HSR; HR → C ⇒ HSRC; CS → G ⇒ +G; C → T ⇒ +T = CTHRSG ✓. Vì HS nằm trong mọi khoá và HS đã là superkey ⇒ \u003cstrong>HS là candidate key duy nhất\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> (Thứ tự chọn FD khác nhau có thể cho kết quả khác nhưng đều đúng.)\u003c/p>\n\u003col>\u003cli>CTHRSG vi phạm BCNF do \u003cstrong>C → T\u003c/strong> (C⁺ = CT) ⇒ tách \u003cstrong>CT\u003c/strong> và \u003cstrong>CHRSG\u003c/strong>.\u003c/li>\u003cli>Trong CHRSG: (CH)⁺ = CHTR, nên \u003cstrong>CH → R\u003c/strong> đúng và CH không phải superkey của CHRSG ⇒ tách \u003cstrong>CHR\u003c/strong> và \u003cstrong>CHSG\u003c/strong>.\u003c/li>\u003cli>Trong CHSG: \u003cstrong>CS → G\u003c/strong>, CS không phải superkey ⇒ tách \u003cstrong>CSG\u003c/strong> và \u003cstrong>CHS\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>Kết quả: \u003cstrong>CT, CHR, CSG, CHS\u003c/strong> — mỗi lược đồ đều BCNF (khoá CHS là HS; CHR có khoá HR và CH).\u003c/p>\n\u003cp>\u003cstrong>(c)\u003c/strong> Mỗi bước tách theo α → β với α là phần chung và α → β ⇒ \u003cstrong>lossless\u003c/strong>. \u003cstrong>HT → R bị mất\u003c/strong>: không lược đồ nào chứa cả H, T, R, và không suy ra được từ các F\u003csub>i\u003c/sub> (T chỉ nằm trong CT). Các FD còn lại vẫn kiểm tra được (HS → R suy từ HS → C trong CHS và HC → R trong CHR).\u003c/p>"},{"q":"(0,75đ) R = (A, B, C, D, E, F, G, H), F = {A → B, ABCD → E, EF → G, EF → H, ACDF → EG}. (a) Tìm canonical cover và candidate key. (b) Phân rã 3NF bằng thuật toán tổng hợp. (c) So sánh với BCNF.","en":"","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Hợp EF → G, EF → H thành EF → GH. \u003cstrong>B thừa\u003c/strong> trong ABCD → E vì (ACD)⁺ = ABCDE ⊇ E ⇒ ACD → E. Trong ACDF → EG: \u003cstrong>E thừa\u003c/strong> (ACDF⁺ dưới F' vẫn có E nhờ A → B, ACD → E) và sau đó \u003cstrong>G thừa\u003c/strong> (từ E, F suy ra G) ⇒ FD này bị xoá.\u003cbr>\u003cstrong>F\u003csub>c\u003c/sub> = {A → B, ACD → E, EF → GH}.\u003c/strong>\u003cbr>A, C, D, F không ở vế phải nào ⇒ trong mọi khoá; (ACDF)⁺ = ABCDEFGH ⇒ \u003cstrong>khoá duy nhất ACDF\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Mỗi FD của F\u003csub>c\u003c/sub> cho một lược đồ: \u003cstrong>(A, B)\u003c/strong>, \u003cstrong>(A, C, D, E)\u003c/strong>, \u003cstrong>(E, F, G, H)\u003c/strong>. Không lược đồ nào chứa khoá ACDF ⇒ thêm \u003cstrong>(A, C, D, F)\u003c/strong>. Không lược đồ nào nằm trong lược đồ khác.\u003cbr>Kết quả: \u003cstrong>AB, ACDE, EFGH, ACDF\u003c/strong> — lossless (có lược đồ chứa khoá) và bảo toàn phụ thuộc.\u003c/p>\n\u003cp>\u003cstrong>(c)\u003c/strong> Phân rã BCNF ở đây cho \u003cstrong>cùng kết quả\u003c/strong> (tách theo A → B, EF → GH, ACD → E) và không mất FD nào — không phải lúc nào cũng vậy (xem câu 5).\u003c/p>"}],"exercises":[{"id":"CK4.01","topic":"weak entity → DDL","level":2,"prompt":"\u003cp>Tạo bảng cho strong entity \u003ccode>hotel(hotel_id varchar(5), name, city)\u003c/code> và \u003cstrong>weak entity\u003c/strong> \u003ccode>hotel_room\u003c/code> của hotel với discriminator \u003ccode>room_no varchar(5)\u003c/code> và thuộc tính \u003ccode>floor integer\u003c/code>. Khoá và foreign key đúng quy tắc chuyển weak entity; xoá một hotel thì các phòng của nó bị xoá theo.\u003c/p>","en":"","hint":"","solution":"create table hotel (\n  hotel_id varchar(5) primary key,\n  name     varchar(30),\n  city     varchar(30));\ncreate table hotel_room (\n  hotel_id varchar(5) references hotel on delete cascade,\n  room_no  varchar(5),\n  floor    integer,\n  primary key (hotel_id, room_no));","check":"select (select string_agg(k.column_name, ', ' order by k.column_name)\n        from information_schema.table_constraints t\n        join information_schema.key_column_usage k on k.constraint_name = t.constraint_name and k.table_name = t.table_name\n        where t.table_name = 'hotel_room' and t.constraint_type = 'PRIMARY KEY') as room_pk,\n       try_sql($$insert into hotel values ('H1', 'Sunrise', 'Hue')$$) as add_hotel,\n       try_sql($$insert into hotel_room values ('H1', '101', 1)$$) as add_room,\n       try_sql($$insert into hotel_room values ('H1', '101', 2)$$) as dup_room,\n       try_sql($$insert into hotel_room values ('H9', '101', 1)$$) as room_of_unknown_hotel,\n       try_sql($$delete from hotel where hotel_id = 'H1'$$) as delete_hotel,\n       sql_value('select count(*) from hotel_room') as rooms_left;","ordered":false,"fresh":false,"expected":{"fields":["room_pk","add_hotel","add_room","dup_room","room_of_unknown_hotel","delete_hotel","rooms_left"],"rows":[["hotel_id, room_no","ok","ok","23505","23503","ok","0"]]}},{"id":"CK4.02","topic":"M:N → DDL","level":3,"prompt":"\u003cp>Tiếp CK4.01 (tạo lại hotel, hotel_room trong cùng câu trả lời). Thêm entity \u003ccode>guest(guest_id varchar(5), name)\u003c/code> và relationship \u003cstrong>many-to-many\u003c/strong> \u003ccode>stay\u003c/code> giữa guest và hotel_room với thuộc tính \u003ccode>nights integer\u003c/code>. Bảng \u003ccode>stay\u003c/code> có khoá theo quy tắc chuyển M:N và foreign key tới cả hai bên.\u003c/p>","en":"","hint":"Khoá của hotel_room là kép, nên FK từ stay tới hotel_room cũng là kép: foreign key (hotel_id, room_no) references hotel_room.","solution":"create table hotel (hotel_id varchar(5) primary key, name varchar(30), city varchar(30));\ncreate table hotel_room (\n  hotel_id varchar(5) references hotel on delete cascade,\n  room_no  varchar(5),\n  floor    integer,\n  primary key (hotel_id, room_no));\ncreate table guest (guest_id varchar(5) primary key, name varchar(30));\ncreate table stay (\n  guest_id varchar(5) references guest,\n  hotel_id varchar(5),\n  room_no  varchar(5),\n  nights   integer,\n  primary key (guest_id, hotel_id, room_no),\n  foreign key (hotel_id, room_no) references hotel_room);","check":"select (select string_agg(k.column_name, ', ' order by k.column_name)\n        from information_schema.table_constraints t\n        join information_schema.key_column_usage k on k.constraint_name = t.constraint_name and k.table_name = t.table_name\n        where t.table_name = 'stay' and t.constraint_type = 'PRIMARY KEY') as stay_pk,\n       (select count(*) from information_schema.table_constraints\n        where table_name = 'stay' and constraint_type = 'FOREIGN KEY') as stay_fks,\n       try_sql($$insert into hotel values ('H1', 'Sunrise', 'Hue')$$)\n       || try_sql($$insert into hotel_room values ('H1', '101', 1)$$)\n       || try_sql($$insert into guest values ('G1', 'Lan')$$) as setup,\n       try_sql($$insert into stay values ('G1', 'H1', '101', 3)$$) as valid_stay,\n       try_sql($$insert into stay values ('G1', 'H1', '999', 2)$$) as unknown_room;","ordered":false,"fresh":false,"expected":{"fields":["stay_pk","stay_fks","setup","valid_stay","unknown_room"],"rows":[["guest_id, hotel_id, room_no","2","okokok","ok","23503"]]}},{"id":"CK4.03","topic":"1:1 + total","level":2,"prompt":"\u003cp>Mỗi department có \u003cstrong>đúng một\u003c/strong> trưởng khoa là một instructor, và một instructor làm trưởng \u003cstrong>tối đa một\u003c/strong> khoa. Tạo bảng \u003ccode>
