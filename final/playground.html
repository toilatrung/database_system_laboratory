<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Ôn tập cuối kỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* ======================================================================
     CS4420 Practice Lab — "data terminal": a dark console read in long sessions.
     Cards sit darker than the ground; every selection is one 1px PostgreSQL-blue
     line as wide as its label; every figure, ID and query is set in JetBrains Mono.
     Grid: 248px sidebar + fluid canvas, 40px side padding, one 24px gap everywhere.
     ====================================================================== */
  :root {
    --ground: #171719;
    --surface: #131217;
    --raised: #212023;
    --well: #0d0d10;
    --hover: #1d1c21;
    --border: #262529;
    --rule: #1f1e23;
    --control: #3a3a3e;
    --text: #ffffff;
    --text-2: #cfcfd3;
    --muted: #8f9197;
    --accent: #4a8ad6;
    --accent-ink: #8bb6ea;
    --accent-bg: #16202e;
    --positive: #44a282;
    --negative: #e5566f;
    --negative-bg: #2c1a20;
    --warning: #d9a441;
    --warning-bg: #2a2416;
    --cell: #2c2b31;
    --shadow: 0 12px 28px rgba(0,0,0,.2);
    --shadow-menu: 0 16px 40px rgba(0,0,0,.45);
    --font: "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --radius: 6px; --radius-sm: 4px;
    --gap: 24px; --pad: 40px;
    --sidebar: 248px; --control-height: 34px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--text); font: 400 13px/20px var(--font); -webkit-font-smoothing: antialiased; }
  ::selection { background: #2b4f7c; color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--text); }
  h1, h2, h3 { margin: 0; }
  .n, .lx-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lx-mono { font-size: 12px; font-weight: 500; }
  .lx-subtle, .lx-dash { color: var(--muted); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Shell: labelled sidebar on the ground, one rule, canvas beside it ---------- */
  .lx-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .lx-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--ground); }
  .lx-brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 18px; color: var(--text); text-decoration: none; }
  .lx-brand__mark { width: 28px; height: 28px; flex: none; color: var(--accent); }
  .lx-brand__mark svg { width: 100%; height: 100%; display: block; }
  .lx-brand__name { font: 600 14px/18px var(--font); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-nav__group { display: flex; flex-direction: column; }
  .lx-nav__label { padding: 0 8px 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .lx-nav__item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; margin-bottom: 2px; padding: 6px 8px; border-radius: var(--radius-sm);
    color: var(--muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--text); }
  .lx-nav__item.is-active { color: var(--text); }
  .lx-nav__item.is-active::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: var(--accent); }
  .lx-nav__item.is-part.is-current { color: var(--text); font-weight: 600; }
  .lx-nav__k { flex: none; min-width: 34px; font: 500 12px/18px var(--mono); color: var(--muted); white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k, .lx-nav__item.is-current .lx-nav__k { color: var(--text-2); }
  .lx-nav__t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-nav__c { flex: none; font: 400 11px/18px var(--mono); color: var(--muted); }
  .lx-nav__sub { display: flex; flex-direction: column; margin: 0 0 6px 20px; }
  .lx-nav__sub .lx-nav__item { min-height: 30px; padding: 5px 8px; }
  .lx-sidebar__foot { padding: 12px; border-top: 1px solid var(--border); }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- PostgreSQL signal ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 8px;
    border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font: 500 12px/1 var(--font); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--text); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--control); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--positive); }
  [data-state="error"] .lx-signal__dot { background: var(--negative); }
  [data-state="loading"] .lx-signal__dot, [data-state="reloading"] .lx-signal__dot { animation: lx-blink 1.2s ease-in-out infinite; background: var(--warning); }
  @keyframes lx-blink { 50% { opacity: .35; } }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lx-pop { position: absolute; bottom: calc(100% + 8px); left: 0; width: 380px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--raised); color: var(--text); border: 1px solid var(--control); border-radius: var(--radius); box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  .lx-pop__title { font-weight: 600; font-size: 14px; }
  .lx-pop__body { padding: 0 16px 14px; font-size: 13px; line-height: 20px; color: var(--text-2); }
  .lx-pop__body p { margin: 0 0 8px; }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 6px; }
  .lx-pop__body code { font: 500 12px/1 var(--mono); color: var(--text); background: var(--well); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0 0 10px; }
  .lx-pop__body .lx-kv dt { color: var(--muted); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--text); }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }

  /* ---------- Feedback motion only: no entrances ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-tab, .lx-row, .lx-opt, .lx-cellmap a, .lx-week, .lx-exlist a, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .lx-btn:active, .lx-iconbtn:active { transform: translateY(1px); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-in .2s ease-out; }
  @keyframes lx-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- Canvas, title row ---------- */
  .lx-page { max-width: 1320px; padding: 36px var(--pad) 80px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
  .lx-head__text { flex: 1 1 520px; min-width: 0; max-width: 880px; }
  .lx-h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-ctx { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-ctx .n { color: var(--text-2); font-size: 12px; }
  .lx-lead { margin: 10px 0 0; color: var(--text-2); font-size: 14px; line-height: 22px; max-width: 780px; }
  .lx-find { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--text); }
  .lx-find .n { font-size: 13px; }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: 16px; }
  .lx-h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
  .lx-section { font-size: 20px; line-height: 26px; font-weight: 400; color: var(--muted); }
  .lx-section b { color: var(--text); font-weight: 600; }

  /* ---------- Buttons: pills; primary inverted white ---------- */
  .lx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text);
    font: 500 13px/1 var(--font); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--raised); border-color: #55555b; }
  .lx-btn--primary { background: #fff; border-color: #fff; color: #111; font-weight: 600; }
  .lx-btn--primary:hover { background: #dcdce0; border-color: #dcdce0; }
  .lx-btn--ghost { border-color: transparent; color: var(--text-2); padding: 0 12px; }
  .lx-btn--ghost:hover { background: var(--raised); border-color: transparent; color: var(--text); }
  .lx-btn[disabled] { opacity: .5; cursor: progress; }
  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; flex: none; }
  .lx-iconbtn:hover { background: var(--raised); color: var(--text); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: 0; white-space: nowrap; padding: 5px 9px;
    border-radius: var(--radius-sm); background: #f2f2f3; color: #111; font: 500 12px/16px var(--font); opacity: 0; pointer-events: none; z-index: 10; transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; transform: none; }
  .lx-iconbtn.is-off { opacity: .35; pointer-events: none; }
  kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: var(--radius-sm); background: var(--raised); color: var(--text-2); border: 1px solid var(--control); white-space: nowrap; }

  /* ---------- Status: a dot and a word; blue = solved, amber = not yet ---------- */
  .lx-badge { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; font: 500 12px/18px var(--font); color: var(--muted); }
  .lx-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--control); }
  .lx-badge--success { color: var(--accent-ink); } .lx-badge--success::before { background: var(--accent); }
  .lx-badge--info { color: var(--text-2); } .lx-badge--info::before { background: var(--text-2); }
  .lx-badge--warning { color: var(--warning); } .lx-badge--warning::before { background: var(--warning); }
  .lx-badge--danger { color: var(--negative); } .lx-badge--danger::before { background: var(--negative); }
  .lx-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--raised); color: var(--text-2);
    font: 500 12px/1 var(--font); white-space: nowrap; flex: none; text-decoration: none; }
  a.lx-tag:hover { background: #2e2d33; color: var(--text); }

  /* ---------- Cards: darker than the ground ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 20px; }
  .lx-card__head + .lx-card__body { padding-top: 0; }
  .lx-card__meta { font-size: 13px; color: var(--muted); }
  .lx-card__body { padding: 20px; }
  .lx-card__foot { padding: 14px 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }

  /* Tables: rules and alignment */
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 8px 20px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: 11px 20px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table--data { font: 400 12px/18px var(--mono); }
  .lx-table--data th { font: 500 12px/16px var(--mono); color: var(--text-2); position: sticky; top: 0; background: var(--surface); }
  .lx-table--data td, .lx-table--data th { padding: 7px 16px; white-space: pre; }
  .lx-table--data tbody tr:hover td { background: var(--hover); }
  .lx-table--data td:first-child, .lx-table--data th:first-child { padding-left: 20px; }
  .lx-datawrap { max-height: 480px; overflow: auto; border-top: 1px solid var(--rule); }
  .lx-null { color: var(--muted); font-style: italic; }

  /* KPI strip: one container, divided */
  .lx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lx-kpi { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--rule); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-kpi__v { font: 500 22px/28px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .lx-kpi--lead .lx-kpi__v { font-size: 32px; line-height: 38px; font-weight: 600; }
  .lx-kpi__u { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; font-family: var(--font); }
  .lx-kpi__n { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-meter { position: relative; height: 4px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 6px; }
  .lx-meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* ---------- Signature: every SQL exercise as one cell ---------- */
  .lx-map { display: flex; flex-direction: column; }
  .lx-row { display: grid; grid-template-columns: 52px minmax(200px, 1fr) minmax(240px, 380px) 72px 72px 112px 32px; align-items: center; gap: 0 20px;
    padding: 14px 20px; border-top: 1px solid var(--rule); text-decoration: none; color: var(--text); }
  .lx-row:hover { background: var(--hover); }
  .lx-row--head { padding-top: 0; padding-bottom: 10px; border-top: 0; color: var(--muted); font-size: 12px; line-height: 16px; }
  .lx-row--head:hover { background: none; }
  .lx-row--head .r { font-family: var(--font); font-size: 12px; }
  .lx-row__k { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-row__t { min-width: 0; }
  .lx-row__t a { color: var(--text); text-decoration: none; font-weight: 600; }
  .lx-row__t a:hover { color: var(--accent-ink); }
  .lx-row__sub { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-row .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .lx-row .r small { color: var(--muted); font-size: 12px; }
  .lx-cellmap { display: flex; flex-wrap: wrap; gap: 3px; }
  .lx-cellmap a, .lx-cellmap span { display: block; width: 12px; height: 12px; border-radius: 2px; background: var(--cell); }
  .lx-cellmap .is-pass { background: var(--accent); }
  .lx-cellmap .is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-cellmap a:hover { background: var(--text-2); }
  .lx-cellmap--empty { font-size: 12px; color: var(--muted); }
  .lx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .lx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lx-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--cell); }
  .lx-legend i.is-pass { background: var(--accent); }
  .lx-legend i.is-fail { background: transparent; border: 1px solid var(--warning); }

  /* ---------- Fifteen weeks: this part's weeks carry the blue line ---------- */
  .lx-weeks { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 0; padding: 0 20px 20px; }
  .lx-week { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 10px 4px; border-top: 1px solid var(--control); color: var(--muted); font-size: 12px; line-height: 16px; text-decoration: none; }
  .lx-week + .lx-week { border-left: 1px solid var(--rule); }
  .lx-week__n { font: 600 13px/16px var(--mono); color: var(--text-2); }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .lx-week.is-on { color: var(--text-2); }
  .lx-week.is-on::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--text); }
  .lx-week__exam { color: var(--warning); font-weight: 600; }
  .lx-weeks--thin .lx-week { min-height: 56px; }
  .lx-weeklist { list-style: none; margin: 0; padding: 0 20px 12px; }
  .lx-weeklist li { display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 13px; }
  .lx-weeklist .n { color: var(--text-2); font-size: 12px; }
  button.lx-week { appearance: none; background: none; border-right: 0; border-bottom: 0; text-align: left; font: inherit; cursor: pointer; }
  button.lx-week:hover { background: var(--hover); }
  .lx-week.is-now { background: var(--accent-bg); }
  .lx-week.is-now::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent); }

  .lx-callout { border-radius: var(--radius); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--raised); color: var(--text); font-size: 13px; }
  .lx-callout a { color: inherit; }
  .lx-callout--success { background: var(--accent-bg); color: #d6e6fa; }
  .lx-callout--warning { background: var(--warning-bg); color: #f0d49c; }
  .lx-callout--danger { background: var(--negative-bg); color: #f6b8c3; font-family: var(--mono); font-size: 12px; }
  .lx-callout--danger strong { font-family: var(--font); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Step tabs on one rule ---------- */
  .lx-flow { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); }
  .lx-flow__steps { flex: 1; display: flex; gap: 28px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .lx-tab:hover { color: var(--text); }
  .lx-tab .n { font-size: 12px; color: var(--muted); }
  .lx-tab.is-active { color: var(--text); }
  .lx-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); }
  .lx-flow__arrows { display: flex; gap: 4px; padding-bottom: 5px; }
  .lx-flow__arrows .lx-iconbtn::after { bottom: auto; top: calc(100% + 6px); }

  /* ---------- Reading ---------- */
  .lx-prose { color: #ececef; font-size: 14px; line-height: 23px; }
  .lx-prose h3 { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text); margin: 28px 0 8px; }
  .lx-prose h3:first-child { margin-top: 0; }
  .lx-prose p { margin: 8px 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: 8px 0; }
  .lx-prose li { margin: 4px 0; }
  .lx-prose li::marker { color: var(--muted); }
  .lx-prose a { color: var(--accent-ink); }
  .lx-prose code, .lx-code { font: 500 12.5px/1 var(--mono); background: var(--raised); color: #f0f0f2; border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-prose strong { font-weight: 600; color: var(--text); }
  .lx-prose .table-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px 12px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .lx-prose tr:last-child td { border-bottom: 0; }
  pre.code { font: 400 12.5px/1.65 var(--mono); background: var(--well); color: #e8e8ea; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 12px 0; }
  pre.code code { background: none; padding: 0; font: inherit; color: inherit; }
  details > summary { cursor: pointer; font-weight: 600; color: var(--text); list-style: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary svg.i { width: 12px; height: 12px; color: var(--muted); transition: transform .15s ease; }
  details > summary:hover { color: var(--accent-ink); }
  details[open] > summary svg.i { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: 8px; }
  .lx-en { margin: 0 0 14px; padding: 12px 16px; background: var(--raised); border-radius: var(--radius); color: var(--text-2); font-size: 13px; line-height: 21px; }
  .lx-en::before { content: "Đề gốc"; display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lx-en p { margin: 0; }

  /* ---------- Quiz & essays ---------- */
  .lx-qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .lx-qno { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-q__opts { display: grid; gap: 8px; margin-top: 14px; }
  .lx-opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--ground); border: 1px solid var(--border); cursor: pointer; }
  .lx-opt:hover { border-color: var(--control); background: var(--hover); }
  .lx-opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .lx-opt.is-right { border-color: var(--accent); background: var(--accent-bg); }
  .lx-opt.is-wrong { border-color: var(--negative); background: var(--negative-bg); }
  .lx-q__explain { margin-top: 12px; color: var(--text-2); }
  .lx-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .lx-check input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- Exercise: list beside the console ---------- */
  .lx-work { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-exlist { position: sticky; top: 24px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .lx-exlist ul { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-exlist a { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 8px; align-items: center; gap: 10px; min-height: 32px; padding: 6px 16px 6px 20px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .lx-exlist a:hover { background: var(--hover); color: var(--text); }
  .lx-exlist li[aria-selected="true"] a { color: var(--text); }
  .lx-exlist li[aria-selected="true"] a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--accent); }
  .lx-exlist .lx-list__id { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-exlist .lx-list__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cell); }
  .lx-dot.is-pass { background: var(--accent); }
  .lx-dot.is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-exhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 18px 20px 14px; }
  .lx-exhead__id { font: 600 18px/24px var(--mono); letter-spacing: -.01em; }
  .lx-exmeta { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .lx-console { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lx-console:focus-within { border-color: #3d5f8a; }
  .lx-console__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
  .lx-console__bar label { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-console__keys { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .lx-editor { width: 100%; min-height: 220px; resize: vertical; display: block; margin: 0;
    font: 400 13.5px/1.65 var(--mono); tab-size: 2; color: #f2f2f4; caret-color: var(--accent); background: transparent;
    border: 0; border-radius: 0; padding: 14px 16px; }
  .lx-editor::placeholder { color: #6f7177; }
  .lx-editor:focus { outline: none; }
  input.lx-editor { min-height: 0; height: 40px; resize: none; }
  .lx-field { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-field:focus-within { border-color: #3d5f8a; }
  .lx-runbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; }
  .lx-pager { display: flex; justify-content: space-between; gap: 12px; }

  /* ---------- Schema & FD ---------- */
  .lx-tables { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); align-items: start; }
  .lx-tables .lx-card__head { padding: 14px 16px 10px 20px; }
  .lx-tables h3 { font: 600 14px/20px var(--mono); }
  .lx-cols-list { list-style: none; margin: 0; padding: 0 0 12px; }
  .lx-cols-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 20px; font: 400 13px/18px var(--mono); }
  .lx-cols-list li + li { border-top: 1px solid var(--rule); }
  .lx-cols-list .is-pk { color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .lx-cols-list .lx-subtle { text-align: right; }
  .lx-fd-form { display: flex; flex-direction: column; gap: 16px; }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 8px; font-weight: 500; font-size: 13px; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-select { height: var(--control-height); max-width: 100%; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; padding: 0 14px; }

  /* ---------- Reading columns with a side panel ---------- */
  .lx-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
  .lx-aside { position: sticky; top: 24px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-aside .lx-kpi__v { margin-bottom: 4px; }
  .lx-aside__note { margin: 12px 0 0; font-size: 13px; color: var(--text-2); }
  .lx-read { max-width: 860px; }
  .lx-toc { list-style: none; margin: 0; padding: 0 8px 12px; counter-reset: toc; max-height: calc(100vh - 140px); overflow-y: auto; }
  .lx-toc li { margin: 0; }
  .lx-toc button { appearance: none; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font: 400 13px/18px var(--font); padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer; }
  .lx-toc button:hover { background: var(--hover); color: var(--text); }
  .lx-qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; margin-top: 16px; }
  .lx-qcell { appearance: none; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--ground); color: var(--text-2); font: 500 12px/1 var(--mono); cursor: pointer; }
  .lx-qcell:hover { border-color: var(--control); color: var(--text); }
  .lx-qcell.is-pass { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lx-qcell.is-fail { border-color: var(--warning); color: var(--warning); }
  .lx-qcell.is-picked { border-color: #6f7177; color: var(--text); background: var(--raised); }
  .lx-howto { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gap); }
  .lx-howto ul { margin: 0; padding-left: 18px; }
  .lx-keys { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; margin: 0; align-items: center; }
  .lx-keys dt { white-space: nowrap; color: var(--muted); }
  .lx-keys dd { margin: 0; color: var(--text-2); }
  .lx-fdgrid { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-fdin { position: sticky; top: 24px; }
  .lx-fdin .lx-select { max-width: 100%; }

  /* ---------- Tablet & phone: the sidebar folds into a 48px bar and a sheet ---------- */
  @media (max-width: 1100px) {
    .lx-split, .lx-fdgrid { grid-template-columns: minmax(0, 1fr); }
    .lx-aside, .lx-fdin { position: static; }
    .lx-work { grid-template-columns: 232px minmax(0, 1fr); }
    .lx-row { grid-template-columns: 48px minmax(160px, 1fr) minmax(160px, 240px) 64px 96px 32px; }
    .lx-row > .lx-row__ess { display: none; }
    .lx-weeks { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 0; }
  }
  @media (max-width: 900px) {
    :root { --pad: 16px; --gap: 16px; }
    .lx-app { display: block; }
    .lx-mbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 4px;
      background: var(--ground); border-bottom: 1px solid var(--border); }
    .lx-mbar .lx-brand__mark { width: 22px; height: 22px; }
    .lx-mbar__title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lx-mbar .lx-iconbtn { width: 44px; height: 44px; color: var(--text); }
    .lx-mbar .lx-iconbtn svg.i { width: 20px; height: 20px; }
    .lx-sidebar { display: none; position: fixed; inset: 52px 0 0; z-index: 24; height: auto; border-right: 0; }
    .lx-app.is-navopen .lx-sidebar { display: flex; }
    .lx-app.is-navopen { overflow: hidden; }
    .lx-sidebar > .lx-brand { display: none; }
    .lx-nav { padding-top: 16px; }
    .lx-nav__item, .lx-signal { min-height: 44px; font-size: 15px; }
    .lx-nav__sub .lx-nav__item { min-height: 44px; }
    .lx-pop { width: 100%; }
    .lx-page { padding: 20px var(--pad) 56px; }
    .lx-h1 { font-size: 22px; line-height: 28px; }
    .lx-head .lx-actions, .lx-head .lx-btn--primary { width: 100%; }
    .lx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lx-kpi { padding: 14px 16px; }
    .lx-kpi:nth-child(3) { border-left: 0; }
    .lx-kpi:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .lx-kpi--lead .lx-kpi__v { font-size: 26px; line-height: 32px; }
    .lx-row { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "k t s" "c c c"; gap: 10px 12px; padding: 14px 16px; }
    .lx-row--head { display: none; }
    .lx-row__k { grid-area: k; } .lx-row__t { grid-area: t; } .lx-row .lx-cellmap { grid-area: c; } .lx-row > .lx-row__st { grid-area: s; }
    .lx-row > .r, .lx-row > .lx-row__go { display: none; }
    .lx-weeks { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 16px 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 1px solid var(--rule); }
    .lx-week:nth-child(3n + 1) { border-left: 0; }
    .lx-work { grid-template-columns: minmax(0, 1fr); }
    .lx-weeklist li { grid-template-columns: 72px minmax(0, 1fr); }
    .lx-weeklist li > :last-child { grid-column: 2; }
    .lx-exlist { position: static; max-height: none; order: 2; }
    .lx-exlist ul { max-height: 320px; }
    .lx-exlist a { min-height: 44px; }
    .lx-flow__steps { gap: 20px; }
    .lx-flow__arrows { display: none; }
    .lx-console__keys { display: none; }
    .lx-runbar { padding: 12px 16px 16px; }
    .lx-runbar > .lx-actions { width: 100%; }
    .lx-runbar > .lx-actions:last-child .lx-btn { flex: 1; }
    .lx-card__head, .lx-card__body { padding-left: 16px; padding-right: 16px; }
    .lx-split, .lx-fdgrid, .lx-howto { grid-template-columns: minmax(0, 1fr); }
    .lx-aside, .lx-fdin { position: static; }
    .lx-toc { max-height: none; }
  }
</style>

cascade;\ndrop table if exists teaches cascade;\ndrop table if exists section cascade;\ndrop table if exists instructor cascade;\ndrop table if exists course cascade;\ndrop table if exists department cascade;\ndrop table if exists classroom cascade;\n\ncreate table classroom (\n  building      varchar(15),\n  room_number   varchar(7),\n  capacity      numeric(4,0),\n  primary key (building, room_number)\n);\n\ncreate table department (\n  dept_name     varchar(20),\n  building      varchar(15),\n  budget        numeric(12,2) check (budget > 0),\n  primary key (dept_name)\n);\n\ncreate table course (\n  course_id     varchar(8),\n  title         varchar(50),\n  dept_name     varchar(20),\n  credits       numeric(2,0) check (credits > 0),\n  primary key (course_id),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table instructor (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  salary        numeric(8,2) check (salary > 29000),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table section (\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6) check (semester in ('Fall', 'Winter', 'Spring', 'Summer')),\n  year          numeric(4,0) check (year > 1701 and year \u003c 2100),\n  building      varchar(15),\n  room_number   varchar(7),\n  time_slot_id  varchar(4),\n  primary key (course_id, sec_id, semester, year),\n  foreign key (course_id) references course (course_id)\n    on delete cascade,\n  foreign key (building, room_number) references classroom (building, room_number)\n    on delete set null\n);\n\ncreate table teaches (\n  ID            varchar(5),\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6),\n  year          numeric(4,0),\n  primary key (ID, course_id, sec_id, semester, year),\n  foreign key (course_id, sec_id, seme chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-0 nteger,\n  location       varchar(50)\n);\n\n-- on delete cascade: xoá một chiếc xe thì xoá luôn các dòng owns/participated\n-- của xe đó (sách để các dòng này lại; PostgreSQL sẽ báo lỗi foreign key nếu\n-- không cascade).\ncreate table owns (\n  driver_id      varchar(5) references person,\n  license_plate  varchar(10) references car on delete cascade,\n  primary key (driver_id, license_plate)\n);\n\ncreate table participated (\n  report_number  varchar(10) references accident,\n  license_plate  varchar(10) references car on delete cascade,\n  driver_id      varchar(5) references person,\n  damage_amount  numeric(10,2),\n  primary key (report_number, license_plate)\n);\n\ninsert into person values\n  ('12345', 'John Carter', '12 Maple St'),\n  ('22222', 'Mary Lee',    '40 Cedar Ave'),\n  ('33333', 'Anna Kim',    '7 Birch Rd'),\n  ('44444', 'Brian Cho',   '19 Willow Ln'),\n  ('55555', 'Chloe Park',  '3 Aspen Ct'),\n  ('66666', 'Daniel Wu',   '88 Spruce Dr');\n\ninsert into car values\n  ('AAA111', 'Toyota Camry',  2010),\n  ('BBB222', 'Honda Civic',   2010),\n  ('CCC333', 'Ford Focus',    2015),\n  ('DDD444', 'Mazda 3',       2010),\n  ('EEE555', 'Kia Rio',       2018),\n  ('FFF666', 'Tesla Model 3', 2020),\n  ('GGG777', 'Hyundai i30',   2012);\n\ninsert into accident values\n  ('AR1001', 2017, 'Main St'),\n  ('AR1002', 2017, 'Highway 1'),\n  ('AR1003', 2018, 'Downtown'),\n  ('AR1004', 2017, 'Airport Rd'),\n  ('AR1005', 2016, 'Old Bridge');\n\ninsert into owns values\n  ('12345', 'AAA111'),\n  ('12345', 'BBB222'),\n  ('12345', 'CCC333'),\n  ('22222', 'DDD444'),\n  ('33333', 'EEE555'),\n  ('44444', 'EEE555'),   -- EEE555 có hai chủ\n  ('44444', 'FFF666'),\n  ('55555', 'GGG777');\n\ninsert into participated values\n  ('AR1001', 'AAA111', '12345', 1200),\n  ('AR1001', 'EEE555', '33333',  800),\n  ('AR1002', 'DDD444', '55555', 2500),   -- người lái không phải chủ xe\n  ('AR1004', 'AAA111', '12345',  600),   -- 12345 dính hai vụ năm 2017\n  ('AR1003', 'FFF666', '44444', 3000),\n  ('AR1005', 'GGG777', '55555',  400);\n\n-- ---------------------------------------------------------------- Exercise 3.5\n-- Điểm số của sinh viên (ID lấy từ bảng student); có các giá trị biên 40, 60, 80.\ncreate table marks (\n  ID     varchar(5) primary key,\n  score  integer\n);\ninsert into marks values\n  ('00128', 92), ('12345', 78), ('19991', 39), ('23121', 60), ('44553', 55),\n  ('45678', 40), ('54321', 85), ('55739', 59), ('70557', 80), ('76543', 20),\n  ('76653', 61), ('98765', 79), ('98988', 100);\n\n-- ---------------------------------------------------------------- Exercise 4.10\n-- a(name, address, title) và b(name, address, salary); có null ở name/address.\ncreate table emp_title (\n  name     varchar(20),\n  address  varchar(30),\n  title    varchar(20)\n);\ncreate table emp_salary (\n  name     varchar(20),\n  address  varchar(30),\n  salary   numeric(10,2)\n);\ninsert into emp_title values\n  ('An',   'Hanoi',   'Engineer'),\n  ('Binh', 'Hue',     'Manager'),\n  ('Chi',  'Danang',  'Analyst'),\n  ('Dung', null,      'Intern'),\n  (null,   'Saigon',  'Designer');\ninsert into emp_salary values\n  ('An',   'Hanoi',   70000),\n  ('Binh', 'Saigon',  90000),\n  ('Em',   'Cantho',  50000),\n  ('Dung', null,      20000),\n  (null,   'Saigon',  65000);\n","-- =====================================================================\n-- Bảng cho bài tập Chương 6 (E-R) — Part 2 (ch6) và Part 4 (ck1).\n-- Mọi bảng đều có prefix er_. Chạy SAU university_data.sql.\n--\n--   Specialization, method 1 (slide 6.56):   er_person, er_employee, er_student\n--   Aggregation (slide 6.61–6.64):           er_project, er_proj_guide, er_evaluation, er_eval_for\n--   Sports statistics (Practice Ex. 6.3):    er_player, er_match, er_played\n--   Temporal data (Practice Ex. 6.13):       er_t_student, er_t_student_name, er_t_instructor,\n--                                            er_t_instructor_name, er_t_advisor\n-- =====================================================================\n\ndrop table if exists er_employee, er_student, er_person cascade;\ndrop table if exists er_eval_for, er_evaluation, er_proj_guide, er_project cascade;\ndrop table if exists er_played, er_match, er_player cascade;\ndrop table if exists er_t_advisor, er_t_student_name, er_t_instructor_name, er_t_student, er_t_instructor cascade;\n\n-- ---------------------------------------------------------------- Specialization (method 1)\n-- person là entity cấp cao; employee và student là specialization\n-- **overlapping** (một người có thể vừa là employee vừa là student).\ncreate table er_person (\n  ID      varchar(5) primary key,\n  name    varchar(20) not null,\n  street  varchar(30),\n  city    varchar(20)\n);\ncreate table er_employee (\n  ID      varchar(5) primary key references er_person on delete cascade,\n  salary  numeric(8,2)\n);\ncreate table er_student (\n  ID           varchar(5) primary key references er_person on delete cascade,\n  tot_credits  numeric(3,0)\n);\ninsert into er_person values\n  ('P01', 'An',    '1 Le Loi',      'Hue'),\n  ('P02', 'Binh',  '5 Tran Phu',    'Danang'),\n  ('P03', 'Chi',   '9 Hai Ba Trung', 'Hanoi'),\n  ('P04', 'Dung',  '2 Nguyen Hue',  'Saigon'),\n  ('P05', 'Giang', '7 Ly Thuong Kiet', 'Hue'),\n  ('P06', 'Hoa',   '3 Bach Dang',   'Danang');\ninsert into er_employee values\n  ('P01', 52000), ('P02', 61000), ('P05', 45000);\ninsert into er_student values\n  ('P02', 30), ('P03', 85), ('P04', 112), ('P05', 12);\n-- P06 không thuộc specialization nào (partial specialization).\n\n-- ---------------------------------------------------------------- Aggregation\ncreate table er_project (\n  project_id  varchar(5) primary key,\n  title       varchar(40) not null\n);\n-- Quan hệ ba ngôi proj_guide(instructor, student, project).\ncreate table er_proj_guide (\n  i_ID        varchar(5) references instructor (ID),\n  s_ID        varchar(5) references student (ID),\n  project_id  varchar(5) references er_project,\n  primary key (i_ID, s_ID, project_id)\n);\ncreate table er_evaluation (\n  evaluation_id  varchar(5) primary key,\n  grade          varchar(2),\n  comments       varchar(60)\n);\n-- eval_for: quan hệ giữa aggregation proj_guide và entity evaluation.\ncreate table er_eval_for (\n  i_ID           varchar(5),\n  s_ID           varchar(5),\n  project_id     varchar(5),\n  evaluation_id  varchar(5) references er_evaluation,\n  primary key (i_ID, s_ID, project_id, evaluation_id),\n  foreign key (i_ID, s_ID, project_id) references er_proj_guide\n);\ninsert into er_project values\n  ('PJ1', 'Robot Soccer'),\n  ('PJ2', 'Genome Search'),\n  ('PJ3', 'Music Recommender'),\n  ('PJ4', 'Quantum Simulator');\ninsert into er_proj_guide values\n  ('45565', '00128', 'PJ1'),\n  ('10101', '12345', 'PJ1'),\n  ('10101', '00128', 'PJ3'),\n  ('76766', '98988', 'PJ2'),\n  ('22222', '44553', 'PJ4'),\n  ('15151', '55739', 'PJ3');\ninsert into er_evaluation values\n  ('EV1', 'A',  'Excellent prototype'),\n  ('EV2', 'B+', 'Good, needs tests'),\n  ('EV3', 'A-', 'Strong analysis'),\n  ('EV4', 'B',  'Mid-term check');\ninsert into er_eval_for values\n  ('45565', '00128', 'PJ1', 'EV1'),\n  ('10101', '12345', 'PJ1', 'EV2'),\n  ('76766', '98988', 'PJ2', 'EV3'),\n  ('76766', '98988', 'PJ2', 'EV4');\n-- ('10101','00128','PJ3'), ('22222','44553','PJ4'), ('15151','55739','PJ3') chưa được đánh giá.\n\n-- ---------------------------------------------------------------- Sports statistics (PE 6.3)\ncreate table er_player (\n  player_id  varchar(5) primary key,\n  name       varchar(20) not null,\n  age        integer\n);\ncreate table er_match (\n  match_id    varchar(5) primary key,\n  match_date  date,\n  stadium     varchar(30),\n  opponent    varchar(30),\n  own_score   integer,\n  opp_score   integer\n);\n-- played(player, match) với thuộc tính score: số điểm cầu thủ ghi trong trận.\ncreate table er_played (\n  match_id   varchar(5) references er_match,\n  player_id  varchar(5) references er_player,\n  score      integer not null default 0,\n  primary key (match_id, player_id)\n);\ninsert into er_player values\n  ('PL1', 'Minh',  24), ('PL2', 'Quang', 27), ('PL3', 'Tuan', 21),\n  ('PL4', 'Hai',   30), ('PL5', 'Long',  19);\ninsert into er_match values\n  ('M1', '2025-09-06', 'My Dinh',   'Thailand',  3, 1),\n  ('M2', '2025-09-13', 'Hang Day',  'Malaysia',  1, 1),\n  ('M3', '2025-10-04', 'Thong Nhat', 'Indonesia', 2, 0),\n  ('M4', '2025-10-11', 'My Dinh',   'Singapore', 0, 2);\ninsert into er_played values\n  ('M1', 'PL1', 2), ('M1', 'PL2', 1), ('M1', 'PL3', 0),\n  ('M2', 'PL1', 0), ('M2', 'PL2', 1), ('M2', 'PL4', 0),\n  ('M3', 'PL1', 1), ('M3', 'PL3', 1), ('M3', 'PL4', 0),\n  ('M4', 'PL2', 0), ('M4', 'PL3', 0), ('M4', 'PL4', 0);\n-- PL5 chưa thi đấu trận nào.\n\n-- ---------------------------------------------------------------- Temporal data (PE 6.13)\n-- Mỗi thuộc tính thay đổi theo thời gian thành một relation (value, start_time,\n-- end_time); end_time = 'infinity' nghĩa là vẫn còn hiệu lực.\ncreate table er_t_student (\n  student_id  varchar(5) primary key\n);\ncreate table er_t_student_name (\n  student_id  varchar(5) references er_t_student,\n  value       varchar(20),\n  start_time  date,\n  end_time    date,\n  primary key (student_id, start_time, end_time)\n);\ncreate table er_t_instructor (\n  instructor_id  varchar(5) primary key\n);\ncreate table er_t_instructor_name (\n  instructor_id  varchar(5) references er_t_instructor,\n  value          varchar(20),\n  start_time     date,\n  end_time       date,\n  primary key (instructor_id, start_time, end_time)\n);\ncreate table er_t_advisor (\n  student_id     varchar(5) references er_t_student,\n  instructor_id  varchar(5) references er_t_instructor,\n  start_time     date,\n  end_time       date,\n  primary key (student_id, instructor_id, start_time, end_time)\n);\ninsert into er_t_student values ('12345'), ('00128'), ('76543');\ninsert into er_t_student_name values\n  ('12345', 'Shankar', '2018-09-01', 'infinity'),\n  ('00128', 'Zhang',   '2015-09-01', '2019-05-31'),\n  ('76543', 'Brown',   '2017-09-01', '2020-12-31'),\n  ('76543', 'Browne',  '2021-01-01', 'infinity');\ninsert into er_t_instructor values ('22222'), ('83821'), ('45565');\ninsert into er_t_instructor_name values\n  ('22222', 'Einstein', '2010-01-01', 'infinity'),\n  ('83821', 'Brandt',   '2012-01-01', 'infinity'),\n  ('45565', 'Katz',     '2014-01-01', 'infinity');\ninsert into er_t_advisor values\n  ('12345', '22222', '2018-05-01', '2018-12-31'),\n  ('12345', '45565', '2019-01-01', '2019-05-31'),\n  ('12345', '22222', '2019-06-01', '2020-01-31'),\n  ('12345', '83821', '2020-02-01', 'infinity'),\n  ('00128', '45565', '2015-09-01', '2019-05-31'),\n  ('76543', '83821', '2017-09-01', '2019-08-31'),\n  ('76543', '22222', '2019-09-01', 'infinity');\n","-- =====================================================================\n-- Bảng cho bài tập Chương 7 (Normalization) — Part 2 và Part 4.\n-- Mọi bảng bắt đầu bằng nf_. Chạy SAU university_data.sql (một số bảng\n-- được sinh từ University database).\n-- =====================================================================\n\ndrop table if exists nf_in_dep, nf_class, nf_employee, nf_enroll_raw, nf_dept_advisor,\n  nf_cust_banker, nf_inst_info, nf_r_abc, nf_pe79_r, nf_pe79_clean, nf_pe71, nf_pe710,\n  nf_pe717, nf_pe720 cascade;\n\n-- Slide 7.3: in_dep = instructor ⋈ department (lặp building, budget)\ncreate table nf_in_dep as\nselect i.ID, i.name, i.salary, i.dept_name, d.building, d.budget\nfrom instructor i join department d on d.dept_name = i.dept_name;\n\n-- Slide 7.58: class = course ⋈ section ⋈ classroom\ncreate table nf_class as\nselect c.course_id, c.title, c.dept_name, c.credits,\n       s.sec_id, s.semester, s.year, s.building, s.room_number, r.capacity, s.time_slot_id\nfrom section s\n     join course c on c.course_id = s.course_id\n     join classroom r on r.building = s.building and r.room_number = s.room_number;\n\n-- Slide 7.5: employee(ID, name, street, city, salary) — có hai nhân viên tên Kim\ncreate table nf_employee (\n  ID      varchar(5) primary key,\n  name    varchar(20),\n  street  varchar(20),\n  city    varchar(20),\n  salary  numeric(8,0)\n);\ninsert into nf_employee values\n  ('57766', 'Kim',   'Main',  'Perryridge', 75000),\n  ('98776', 'Kim',   'North', 'Hampton',    67000),\n  ('11223', 'Lee',   'Oak',   'Brooklyn',   58000),\n  ('33445', 'Patel', 'Elm',   'Rye',        81000);\n\n-- Dữ liệu \"bẩn\" để kiểm tra FD: student_id → student_name, course_id → course_title\ncreate table nf_enroll_raw (\n  student_id    varchar(5),\n  student_name  varchar(20),\n  course_id     varchar(8),\n  course_title  varchar(40),\n  grade         varchar(2)\n);\ninsert into nf_enroll_raw values\n  ('S001', 'An',   'CS-101', 'Intro. to Computer Science', 'A'),\n  ('S001', 'An',   'CS-190', 'Game Design',                'B+'),\n  ('S002', 'Binh', 'CS-101', 'Intro. to Computer Science', 'B'),\n  ('S002', 'Bihn', 'MU-199', 'Music Video Production',     'A-'),\n  ('S003', 'Chi',  'CS-101', 'Intro to CS',                'C'),\n  ('S003', 'Chi',  'BIO-101','Intro. to Biology',          'A'),\n  ('S004', 'Dung', 'BIO-101','Intro. to Biology',          'B');\n\n-- Slide 7.19 / 7.26: dept_advisor(s_ID, i_ID, dept_name)\n--   i_ID → dept_name ;  s_ID, dept_name → i_ID\ncreate table nf_dept_advisor (\n  s_ID       varchar(5),\n  i_ID       varchar(5),\n  dept_name  varchar(20),\n  primary key (s_ID, i_ID)\n);\ninsert into nf_dept_advisor values\n  ('00128', '10101', 'Comp. Sci.'),\n  ('00128', '22222', 'Physics'),\n  ('12345', '45565', 'Comp. Sci.'),\n  ('12345', '32343', 'History'),\n  ('19991', '83821', 'Comp. Sci.'),\n  ('23121', '10101', 'Comp. Sci.'),\n  ('23121', '22222', 'Physics');\n\n-- Slide 7.65: cust_banker_branch(customer_id, employee_id, branch_name, type)\n--   customer_id, employee_id → type ; employee_id → branch_name ;\n--   customer_id, branch_name → employee_id\ncreate table nf_cust_banker (\n  customer_id  varchar(5),\n  employee_id  varchar(5),\n  branch_name  varchar(20),\n  type         varchar(10),\n  primary key (customer_id, employee_id)\n);\ninsert into nf_cust_banker values\n  ('C1', 'E1', 'Downtown', 'checking'),\n  ('C1', 'E3', 'Uptown',   'loan'),\n  ('C2', 'E1', 'Downtown', 'loan'),\n  ('C2', 'E2', 'Brighton', 'savings'),\n  ('C3', 'E3', 'Uptown',   'checking'),\n  ('C3', 'E4', 'Downtown', 'checking');\n\n-- Slide 7.33–7.35: inst_info(ID, child_name, phone) — ID →→ child_name, ID →→ phone.\n-- Instructor 88888 cố ý thiếu một tổ hợp (Ben, 512-555-2222) → MVD bị vi phạm trên instance.\ncreate table nf_inst_info (\n  ID          varchar(5),\n  child_name  varchar(20),\n  phone       varchar(12)\n);\ninsert into nf_inst_info values\n  ('99999', 'David',   '512-555-1234'),\n  ('99999', 'David',   '512-555-4321'),\n  ('99999', 'William', '512-555-1234'),\n  ('99999', 'William', '512-555-4321'),\n  ('88888', 'Anna',    '512-555-1111'),\n  ('88888', 'Anna',    '512-555-2222'),\n  ('88888', 'Ben',     '512-555-1111');\n\n-- PE 7.2 (Figure 7.17): r(A, B, C)\ncreate table nf_r_abc (a varchar(2), b varchar(2), c integer);\ninsert into nf_r_abc values ('a1', 'b1', 1), ('a1', 'b1', 2), ('a2', 'b1', 1), ('a2', 'b1', 3);\n\n-- PE 7.9: r(A, B, C) — nf_pe79_r vi phạm B → C ở b = 'y'; nf_pe79_clean thoả B → C.\ncreate table nf_pe79_r (a integer primary key, b varchar(2), c integer);\ninsert into nf_pe79_r values (1, 'x', 10), (2, 'x', 10), (3, 'y', 20), (4, 'y', 21), (5, 'z', 30);\ncreate table nf_pe79_clean (a integer primary key, b varchar(2), c integer);\ninsert into nf_pe79_clean values (1, 'x', 10), (2, 'x', 10), (3, 'y', 20);\n\n-- PE 7.1 / 7.6 / 7.13: R(A, B, C, D, E), F = {A → BC, CD → E, B → D, E → A}\ncreate table nf_pe71 (a varchar(2) primary key, b varchar(2), c varchar(2), d varchar(2), e varchar(2));\ninsert into nf_pe71 values\n  ('a1', 'b1', 'c1', 'd1', 'e1'),\n  ('a2', 'b2', 'c1', 'd2', 'e2'),\n  ('a3', 'b1', 'c2', 'd1', 'e3'),\n  ('a4', 'b3', 'c3', 'd3', 'e4');\n\n-- PE 7.10: R(A, B, C) với A → B, có null ở A\ncreate table nf_pe710 (a integer, b varchar(2), c varchar(2));\ninsert into nf_pe710 values (1, 'b1', 'c1'), (2, 'b2', 'c2'), (null, 'b3', 'c3'), (null, 'b4', 'c4');\n\n-- PE 7.17: R(A, B, C, D), F = {A → B, C → D, B → C}\ncreate table nf_pe717 (a varchar(2) primary key, b varchar(2), c varchar(2), d varchar(2));\ninsert into nf_pe717 values\n  ('a1', 'b1', 'c1', 'd1'),\n  ('a2', 'b1', 'c1', 'd1'),\n  ('a3', 'b2', 'c2', 'd2'),\n  ('a4', 'b3', 'c2', 'd2');\n\n-- PE 7.20: R(A, B, C) với A →→ B (đủ mọi tổ hợp B × C cho mỗi A)\ncreate table nf_pe720 (a varchar(2), b varchar(2), c varchar(2));\ninsert into nf_pe720 values\n  ('a1', 'b1', 'c1'), ('a1', 'b1', 'c2'), ('a1', 'b2', 'c1'), ('a1', 'b2', 'c2'),\n  ('a2', 'b3', 'c3'), ('a2', 'b3', 'c4');\n","-- =====================================================================\n-- Bảng cho Part 4 (đề thi thử cuối kỳ). Mọi bảng bắt đầu bằng fr_.\n-- Chạy SAU extra_tables.sql (cần hàm try_sql / sql_value).\n--\n--   fr_enrollment  : bảng \"phẳng\" chưa chuẩn hoá — dùng để kiểm tra phụ thuộc\n--                    hàm bằng SQL và thử phân rã lossless / lossy.\n--                    FD dự kiến: student_id → student_name\n--                                course_id  → course_title, instructor\n--                                instructor → office\n--                                student_id, course_id → grade\n--   fr_supply      : bảng có dữ liệu không nhất quán (update anomaly):\n--                    supplier_id → supplier_city lẽ ra phải đúng nhưng bị vi phạm.\n-- =====================================================================\n\ndrop table if exists fr_enrollment cascade;\ndrop table if exists fr_supply cascade;\n\ncreate table fr_enrollment (\n  student_id    varchar(5),\n  student_name  varchar(20),\n  course_id     varchar(8),\n  course_title  varchar(30),\n  instructor    varchar(20),\n  office        varchar(10),\n  grade         varchar(2),\n  primary key (student_id, course_id)\n);\n\ninsert into fr_enrollment values\n  ('S1', 'An',   'DB101', 'Databases',               'Smith', 'R201', 'A'),\n  ('S1', 'An',   'OS201', 'Operating Systems',       'Jones', 'R305', 'B'),\n  ('S2', 'Binh', 'DB101', 'Databases',               'Smith', 'R201', 'B+'),\n  ('S2', 'Binh', 'NW301', 'Networks',                'Smith', 'R201', 'A-'),\n  ('S3', 'Chi',  'OS201', 'Operating Systems',       'Jones', 'R305', 'C'),\n  ('S3', 'Chi',  'DB101', 'Databases',               'Smith', 'R201', 'A'),\n  ('S4', 'Dung', 'NW301', 'Networks',                'Smith', 'R201', 'B'),\n  ('S4', 'Dung', 'AI401', 'Artificial Intelligence', 'Lee',   'R110', 'A'),\n  ('S5', 'Em',   'AI401', 'Artificial Intelligence', 'Lee',   'R110', 'B+'),\n  ('S5', 'Em',   'OS201', 'Operating Systems',       'Jones', 'R305', 'A-');\n\ncreate table fr_supply (\n  supplier_id    varchar(5),\n  supplier_city  varchar(20),\n  part_id        varchar(5),\n  qty            integer,\n  primary key (supplier_id, part_id)\n);\n\ninsert into fr_supply values\n  ('S1', 'Hanoi',  'P1', 300),\n  ('S1', 'Hanoi',  'P2', 200),\n  ('S1', 'Hanoi',  'P3', 400),\n  ('S2', 'Hue',    'P1', 100),\n  ('S2', 'Danang', 'P2', 150),   -- cập nhật thành phố của S2 không đồng bộ\n  ('S3', 'Saigon', 'P2', 500),\n  ('S4', 'Cantho', 'P4', 250),\n  ('S4', 'Cantho', 'P5', 120),\n  ('S4', 'Vinh',   'P1',  80);   -- S4 cũng bị lệch\n"],"setupFiles":["lab/db/university_schema.sql","lab/db/university_data.sql","lab/db/extra_tables.sql","lab/db/practice_datasets.sql","lab/db/er_tables.sql","lab/db/normalization_tables.sql","lab/db/final_tables.sql"],"schemaGroups":[{"title":"University database (theo sách)","note":"","core":true,"tables":[{"table":"classroom","columns":[{"column":"building","type":"character varying(15)","pk":true},{"column":"room_number","type":"character varying(7)","pk":true},{"column":"capacity","type":"numeric(4,0)","pk":false}]},{"table":"department","columns":[{"column":"dept_name","type":"charact false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"ck1","store":"ck1","short":"CK1","label":"Ôn CK · Phần 1","navLabel":"CK1","kind":"Ôn tập","title":"Practice Exercises — Chapter 6","titleVi":"Practice Exercises Chương 6 (E-R)","summary":"\u003ch3>Cách ôn phần này\u003c/h3>\n\u003cp>Đề cuối kỳ phần E-R chủ yếu lấy từ \u003cstrong>Practice Exercises 6.1–6.13\u003c/strong>. Mỗi PE xuất hiện ở \u003cem>Câu hỏi tự luận\u003c/em> (đánh số đúng như sách, có lời giải đầy đủ) và — nếu chạy được — ở \u003cem>Bài tập SQL\u003c/em> (hiện thực thiết kế trên PostgreSQL). Làm tự luận ra giấy trước: \u003cstrong>vẽ diagram → ghi cardinality/participation → viết lược đồ quan hệ\u003c/strong>.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Tự luận\u003c/th>\u003cth>Bài SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>6.1\u003c/td>\u003ctd>E-R công ty bảo hiểm xe (payment là weak entity)\u003c/td>\u003ctd>Câu 1\u003c/td>\u003ctd>CK1.01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.2\u003c/td>\u003ctd>Điểm thi: (a) exam là entity + ternary, (b) chỉ binary student–section\u003c/td>\u003ctd>Câu 2\u003c/td>\u003ctd>CK1.02, CK1.03\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.3\u003c/td>\u003ctd>Thống kê đội bóng, derived attribute season_score\u003c/td>\u003ctd>Câu 3\u003c/td>\u003ctd>CK1.04, CK1.05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.4\u003c/td>\u003ctd>Entity set lặp lại nhiều lần trong diagram\u003c/td>\u003ctd>Câu 4\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.5\u003c/td>\u003ctd>Diagram như đồ thị: không liên thông, có chu trình\u003c/td>\u003ctd>Câu 5\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.6\u003c/td>\u003ctd>Ternary → ba binary + E: instance sai, thêm ràng buộc\u003c/td>\u003ctd>Câu 6\u003c/td>\u003ctd>(xem Part 2, bài 6.19)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.7\u003c/td>\u003ctd>Biến weak entity thành strong → redundancy\u003c/td>\u003ctd>Câu 7\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.8\u003c/td>\u003ctd>PK/FK của sec_course có ép many-to-one không?\u003c/td>\u003ctd>Câu 8\u003c/td>\u003ctd>CK1.06, CK1.10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.9\u003c/td>\u003ctd>advisor one-to-one cần thêm ràng buộc gì\u003c/td>\u003ctd>Câu 9\u003c/td>\u003ctd>CK1.07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.10\u003c/td>\u003ctd>Total participation bằng not null\u003c/td>\u003ctd>Câu 10\u003c/td>\u003ctd>CK1.08\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.11\u003c/td>\u003ctd>Total participation phía \"one\"/many-to-many: vì sao PK/FK không đủ, dùng check/assertion\u003c/td>\u003ctd>Câu 11\u003c/td>\u003ctd>CK1.09, CK1.10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.12\u003c/td>\u003ctd>Lattice generalization: thừa kế từ X và Y, trùng tên thuộc tính\u003c/td>\u003ctd>Câu 12\u003c/td>\u003ctd>CK1.11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.13\u003c/td>\u003ctd>Dữ liệu theo thời gian (valid time)\u003c/td>\u003ctd>Câu 13\u003c/td>\u003ctd>CK1.12–CK1.15\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Cheat sheet Chương 6\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Ký hiệu\u003c/strong>: chữ nhật = entity set; thoi = relationship set; chữ nhật/thoi \u003cstrong>đôi\u003c/strong> = weak entity / identifying relationship; gạch chân liền = PK, gạch nét đứt = discriminator; \u003ccode>{a}\u003c/code> multivalued; \u003ccode>a()\u003c/code> derived; thuộc tính thụt lề = composite; \u003cstrong>mũi tên\u003c/strong> = phía \"one\"; \u003cstrong>đường đôi\u003c/strong> = total participation; \u003ccode>l..h\u003c/code> = min..max lần tham gia.\u003c/li>\u003cli>\u003cstrong>PK của relationship set\u003c/strong>: M:N → PK(A) ∪ PK(B); many-to-one A→B → PK(A); one-to-one → PK(A) hoặc PK(B) (cái còn lại \u003ccode>unique\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Weak entity\u003c/strong>: PK = PK(owner) + discriminator; FK → owner \u003ccode>on delete cascade\u003c/code>; identifying relationship không sinh bảng.\u003c/li>\u003cli>\u003cstrong>Reduction\u003c/strong>: composite → làm phẳng; multivalued → bảng riêng (PK gồm mọi cột); derived → view; many-to-one total phía many → gộp FK vào phía many + \u003ccode>not null\u003c/code>; M:N → bảng riêng.\u003c/li>\u003cli>\u003cstrong>Ép ràng buộc trong SQL\u003c/strong>:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ràng buộc E-R\u003c/th>\u003cth>Ép bằng\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>many-to-one A→B\u003c/td>\u003ctd>PK(A) là khoá của bảng chứa quan hệ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>one-to-one\u003c/td>\u003ctd>thêm \u003ccode>unique\u003c/code> cho FK còn lại\u003c/td>\u003c/tr>\u003ctr>\u003ctd>total participation phía \u003cstrong>many\u003c/strong> (đã gộp)\u003c/td>\u003ctd>\u003ccode>not null\u003c/code> cho FK\u003c/td>\u003c/tr>\u003ctr>\u003ctd>total participation phía \u003cstrong>one\u003c/strong> hoặc của M:N\u003c/td>\u003ctd>\u003cstrong>không\u003c/strong> ép được bằng PK/FK/not null → assertion (chuẩn SQL, không DBMS nào hỗ trợ) hoặc \u003cstrong>trigger\u003c/strong> (PostgreSQL: constraint trigger \u003ccode>deferrable initially deferred\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Specialization\u003c/strong>: overlapping / disjoint; total / partial; method 1 (bảng cha + bảng con chứa PK) vs method 2 (mỗi bảng con chứa đủ thuộc tính). Đa thừa kế (lattice): con thừa kế cả X và Y; trùng tên thì gọi \u003ccode>X.name\u003c/code>, \u003ccode>Y.name\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Aggregation\u003c/strong>: relationship được xem như entity để tham gia relationship khác; bảng gồm PK của relationship được aggregate.\u003c/li>\u003cli>\u003cstrong>Design\u003c/strong>: tránh entity set vẽ lặp có thuộc tính (PE 6.4); đồ thị không liên thông = các phần độc lập, chu trình = hai entity liên quan theo ≥ 2 cách (PE 6.5).\u003c/li>\u003c/ul>","quiz":[{"q":"(PE 6.1) Trong E-R công ty bảo hiểm, vì sao premium_payment được mô hình là weak entity?","options":["Vì payment không có thuộc tính","Vì mỗi payment gắn với một policy cụ thể và payment_no chỉ phân biệt trong phạm vi policy đó","Vì payment là multivalued","Vì payment có quan hệ many-to-many với car"],"answer":1,"explain":"PK(payment) = policy_id + payment_no (discriminator); payment phụ thuộc tồn tại vào policy."},{"q":"(PE 6.1) Vì sao participation của accident trong participated \u003cstrong>không\u003c/strong> total?","options":["Vì một xe có thể không gặp tai nạn","Vì có thể có biên bản tai nạn mà chưa biết xe nào liên quan","Vì accident là weak entity","Vì participated là one-to-one"],"answer":1,"explain":"Theo lời giải của sách: có thể có accident report mà xe tham gia chưa xác định."},{"q":"(PE 6.2b) Khi chỉ dùng binary relationship student–section và vẫn lưu điểm nhiều bài thi, điểm được biểu diễn bằng gì?","options":["Thuộc tính đơn marks","Thuộc tính multivalued composite {exam_marks(exam_id, marks)} trên relationship","Một entity exam bắt buộc","Một ternary relationship"],"answer":1,"explain":"Một cặp (student, section) có nhiều (exam_id, marks)."},{"q":"(PE 6.2b) Nhược điểm của việc đặt tên, địa điểm, giờ thi của exam làm thuộc tính trên relationship?","options":["Không có nhược điểm","Lặp thông tin cho mỗi sinh viên và không lưu được exam khi chưa có sinh viên","Không biểu diễn được điểm","Vi phạm khoá chính"],"answer":1,"explain":"Muốn lưu thông tin exam phải giữ entity exam riêng."},{"q":"(PE 6.3) season_score của player nên được mô hình thế nào?","options":["Thuộc tính lưu sẵn","Derived attribute, tính bằng tổng score qua relationship played","Multivalued attribute","Weak entity"],"answer":1,"explain":"Tóm tắt thống kê nên là derived; trong SQL hiện thực bằng view."},{"q":"(PE 6.4) Nếu một entity set phải vẽ nhiều lần (diagram nhiều trang) thì nên làm gì?","options":["Lặp lại đầy đủ thuộc tính ở mọi chỗ","Chỉ ghi thuộc tính ở một chỗ; các lần xuất hiện khác không ghi thuộc tính","Đổi tên mỗi lần xuất hiện","Không được vẽ lại"],"answer":1,"explain":"Lặp thuộc tính dễ dẫn tới các bản không nhất quán."},{"q":"(PE 6.5) E-R diagram (xem như đồ thị) \u003cstrong>không liên thông\u003c/strong> nghĩa là gì?","options":["Thiết kế sai","Có các phần của doanh nghiệp hoàn toàn độc lập — thực chất là các CSDL riêng","Có weak entity","Có chu trình"],"answer":1,"explain":"Không có đường đi giữa hai entity set nghĩa là chúng không liên quan, kể cả gián tiếp."},{"q":"(PE 6.5) Diagram có \u003cstrong>chu trình\u003c/strong> cho biết điều gì?","options":["Mọi cặp entity trên chu trình liên quan với nhau theo ít nhất hai cách khác nhau","Có recursive relationship","Có lỗi thiết kế bắt buộc phải sửa","Có ternary relationship"],"answer":0,"explain":"Diagram không chu trình thì giữa hai entity set có đúng một đường (một quan hệ duy nhất)."},{"q":"(PE 6.6) Khi thay ternary R(A, B, C) bằng E và R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub>, ràng buộc nào cần thêm để mọi instance ứng với một R hợp lệ?","options":["E total participation vào cả R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub>","A, B, C total vào R","R\u003csub>A\u003c/sub> là many-to-many","Bỏ E"],"answer":0,"explain":"Nếu e chỉ nối với a mà không nối b, c thì không ứng với bộ (a, b, c) nào."},{"q":"(PE 6.7) Thêm PK của owner vào weak entity để biến nó thành strong entity gây ra điều gì?","options":["Mất thông tin","Redundancy: PK owner nằm ở cả entity và relationship, và phải luôn bằng nhau","Không thể tạo PK","Vi phạm 1NF"],"answer":1,"explain":"Thông tin đó đã suy ra được từ identifying relationship."},{"q":"(PE 6.8) PK (course_id, sec_id, semester, year) và FK course_id → course của sec_course đảm bảo điều gì?","options":["Many-to-one: mỗi section thuộc đúng một course","Mỗi course có ít nhất một section","Cả hai","Không đảm bảo gì"],"answer":0,"explain":"Total participation (course phải có section) thì không ép được bằng PK/FK."},{"q":"(PE 6.9) Nếu advisor là one-to-one, bảng advisor(s_ID, i_ID) với PK s_ID cần thêm gì?","options":["not null cho s_ID","unique cho i_ID","PK (s_ID, i_ID)","check (s_ID \u003c> i_ID)"],"answer":1,"explain":"i_ID trở thành superkey: mỗi instructor hướng dẫn tối đa một student."},{"q":"(PE 6.10) R many-to-one từ A tới B được gộp vào bảng A. Total participation của A trong R được ép bằng gì?","options":["unique cho FK tới B","not null cho FK tới B","PK của B","Không ép được"],"answer":1,"explain":"a không liên kết b nào sẽ có FK null — bị cấm."},{"q":"(PE 6.11) Vì sao total participation của B ở phía \"one\" (mỗi b phải được ít nhất một a tham chiếu) không ép được bằng FK?","options":["Vì FK chỉ tham chiếu tới cột primary key/unique, trong khi cột FK ở bảng A không unique","Vì FK không cho null","Vì B không có primary key","Vì SQL không có FK"],"answer":0,"explain":"Muốn \"b phải xuất hiện trong A\" thì cần FK từ B tới cột của A — nhưng cột đó không unique."},{"q":"(PE 6.11) Trong lời giải bằng check/assertion, vì sao ràng buộc phải đặt là \u003cstrong>deferred\u003c/strong>?","options":["Để chạy nhanh hơn","Vì phải chèn cả b và a liên quan trong cùng transaction; kiểm tra ngay sẽ lỗi ở câu chèn đầu tiên","Vì check không hỗ trợ subquery","Vì FK luôn deferred"],"answer":1,"explain":"Chèn b trước → vi phạm total; chèn a trước → vi phạm foreign key. Kiểm tra cuối transaction giải quyết vòng lặp này."},{"q":"(PE 6.12) B là specialization của cả X và Y. X và Y cùng có thuộc tính name. B tham chiếu thế nào?","options":["Không thể","Dùng tên đầy đủ X.name và Y.name","Chỉ giữ X.name","Đổi tên Y"],"answer":1,"explain":"B thừa kế thuộc tính của cả hai; trùng tên thì phân biệt bằng tên định danh đầy đủ."},{"q":"(PE 6.13) Khi chuyển E-R có valid time sang bảng, mỗi thuộc tính thay đổi theo thời gian (ví dụ salary) trở thành gì?","options":["Một cột salary","Một relation instructor_salary(instructor_id, value, start_time, end_time)","Một view","Một weak entity không có thuộc tính"],"answer":1,"explain":"Multivalued composite {salary(value, start_time, end_time)} → bảng riêng."}],"questions":[{"q":"\u003cstrong>PE 6.1.\u003c/strong> Vẽ E-R diagram cho công ty bảo hiểm xe: mỗi customer sở hữu một hoặc nhiều car; mỗi car có 0..nhiều accident được ghi nhận; mỗi policy bảo hiểm một hoặc nhiều car và có một hoặc nhiều premium payment; mỗi payment cho một kỳ, có due date và ngày nhận tiền. Sau đó viết lược đồ quan hệ.","en":"\u003cp>\u003cstrong>Exercise 6.1.\u003c/strong> Construct an E-R diagram for a car-insurance company. Each customer owns one or more cars. Each car has zero or more recorded accidents. Each insurance policy covers one or more cars and has one or more premium payments. Each payment covers a particular period of time and has a due date and the date on which the payment was received.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[customer] ==== &lt;owns&gt; ---- [car] ---- &lt;participated&gt; ---- [accident]\n customer_id                 license_no                     report_id\n name, address               model                          date, place\n                               |\n                             1..1 (mỗi car thuộc đúng 1 policy)\n                            &lt;covers&gt;\n                             1..*  (mỗi policy phủ ≥ 1 car)\n                               |\n                           [policy] ==&lt;&lt;payment&gt;&gt;== [[premium_payment]]\n                            policy_id                 payment_no (discriminator)\n                                                      due_date, amount, received_on\u003c/code>\u003c/pre>\n\u003cul>\u003cli>owns: customer – car, customer \u003cstrong>total\u003c/strong> (mỗi customer có ≥ 1 car); many-to-many (hoặc many-to-one nếu mỗi xe một chủ).\u003c/li>\u003cli>participated: car – accident, many-to-many, \u003cstrong>cả hai partial\u003c/strong> (xe có thể chưa tai nạn; biên bản có thể chưa xác định xe).\u003c/li>\u003cli>covers: car → policy (\u003ccode>1..1\u003c/code> phía car), policy \u003ccode>1..*\u003c/code>.\u003c/li>\u003cli>premium_payment là \u003cstrong>weak entity\u003c/strong> của policy qua identifying relationship payment (đôi, total phía payment).\u003c/li>\u003c/ul>\n\u003cp>Lược đồ:\u003c/p>\n\u003cul>\u003cli>customer(\u003cu>customer_id\u003c/u>, name, address)\u003c/li>\u003cli>car(\u003cu>license_no\u003c/u>, model, policy_id \u003cstrong>not null\u003c/strong> → policy) — covers gộp vào car\u003c/li>\u003cli>policy(\u003cu>policy_id\u003c/u>)\u003c/li>\u003cli>owns(\u003cu>customer_id, license_no\u003c/u>)\u003c/li>\u003cli>accident(\u003cu>report_id\u003c/u>, date, place)\u003c/li>\u003cli>participated(\u003cu>report_id, license_no\u003c/u>)\u003c/li>\u003cli>premium_payment(\u003cu>policy_id, payment_no\u003c/u>, due_date, amount, received_on), FK policy_id → policy on delete cascade.\u003c/li>\u003c/ul>\n\u003cp>Ràng buộc \"mỗi customer có ≥ 1 car\" và \"mỗi policy phủ ≥ 1 car\" không ép được bằng PK/FK (xem PE 6.11).\u003c/p>"},{"q":"\u003cstrong>PE 6.2.\u003c/strong> CSDL gồm student, course, section của University và điểm mà sinh viên đạt trong các bài thi của từng section. (a) Vẽ E-R coi exam là entity và dùng một ternary relationship. (b) Vẽ E-R chỉ dùng binary relationship giữa student và section, mỗi cặp (student, section) chỉ có một relationship nhưng vẫn lưu được điểm nhiều bài thi.","en":"\u003cp>\u003cstrong>Exercise 6.2.\u003c/strong> A database contains the entity sets \u003cem>student\u003c/em>, \u003cem>course\u003c/em>, and \u003cem>section\u003c/em> of the university schema, and in addition records the marks students obtain in the different exams of the different sections.\u003c/p>\n\u003cp>a. Construct an E-R diagram that models exams as entities and uses a ternary relationship in the design.\u003c/p>\n\u003cp>b. Construct an alternative E-R diagram that uses only a binary relationship between \u003cem>student\u003c/em> and \u003cem>section\u003c/em>. There must be only one relationship between a given \u003cem>student\u003c/em> and \u003cem>section\u003c/em> pair, yet it must still be possible to represent the marks a student gets in different exams.\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[student] ---- &lt;exam_marks&gt; ---- [section] ==&lt;&lt;sec_course&gt;&gt;== [course]\n student_id       marks           sec_id, semester, year        course_id, title, credits\n                    |\n                 [exam]\n                  exam_id, name, place, time\u003c/code>\u003c/pre>\n\u003cp>Ternary exam_marks(student, section, exam) có thuộc tính marks. Lược đồ: exam(\u003cu>exam_id\u003c/u>, name, place, time); exam_marks(\u003cu>student_id, course_id, sec_id, semester, year, exam_id\u003c/u>, marks).\u003cbr>Phương án khác: exam là \u003cstrong>weak entity\u003c/strong> của section; khi đó marks là binary relationship student – exam.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[student] ---- &lt;exam_marks&gt; ---- [section]\n                {exam_marks\n                   exam_id\n                   marks }\u003c/code>\u003c/pre>\n\u003cp>Relationship binary có thuộc tính \u003cstrong>multivalued composite\u003c/strong> {exam_marks(exam_id, marks)}. Lược đồ: sec_exam_marks(\u003cu>student_id, course_id, sec_id, semester, year, exam_id\u003c/u>, marks).\u003cbr>Không đặt name/place/time của exam vào relationship: sẽ \u003cstrong>lặp\u003c/strong> cho từng sinh viên và không lưu được exam khi chưa có sinh viên — muốn lưu thì phải giữ entity exam riêng.\u003c/p>"},
