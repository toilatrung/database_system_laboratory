<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* ======================================================================
     CS4420 Practice Lab — "data terminal": a dark console read in long sessions.
     Cards sit darker than the ground; every selection is one 1px PostgreSQL-blue
     line as wide as its label; every figure, ID and query is set in JetBrains Mono.
     Grid: 248px sidebar + fluid canvas, 40px side padding, one 24px gap everywhere.
     ====================================================================== */
  :root {
    --ground: #171719;
    --surface: #131217;
    --raised: #212023;
    --well: #0d0d10;
    --hover: #1d1c21;
    --border: #262529;
    --rule: #1f1e23;
    --control: #3a3a3e;
    --text: #ffffff;
    --text-2: #cfcfd3;
    --muted: #8f9197;
    --accent: #4a8ad6;
    --accent-ink: #8bb6ea;
    --accent-bg: #16202e;
    --positive: #44a282;
    --negative: #e5566f;
    --negative-bg: #2c1a20;
    --warning: #d9a441;
    --warning-bg: #2a2416;
    --cell: #2c2b31;
    --shadow: 0 12px 28px rgba(0,0,0,.2);
    --shadow-menu: 0 16px 40px rgba(0,0,0,.45);
    --font: "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --radius: 6px; --radius-sm: 4px;
    --gap: 24px; --pad: 40px;
    --sidebar: 248px; --control-height: 34px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--text); font: 400 13px/20px var(--font); -webkit-font-smoothing: antialiased; }
  ::selection { background: #2b4f7c; color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--text); }
  h1, h2, h3 { margin: 0; }
  .n, .lx-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lx-mono { font-size: 12px; font-weight: 500; }
  .lx-subtle, .lx-dash { color: var(--muted); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Shell: labelled sidebar on the ground, one rule, canvas beside it ---------- */
  .lx-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .lx-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--ground); }
  .lx-brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 18px; color: var(--text); text-decoration: none; }
  .lx-brand__mark { width: 28px; height: 28px; flex: none; color: var(--accent); }
  .lx-brand__mark svg { width: 100%; height: 100%; display: block; }
  .lx-brand__name { font: 600 14px/18px var(--font); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-nav__group { display: flex; flex-direction: column; }
  .lx-nav__label { padding: 0 8px 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .lx-nav__item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; margin-bottom: 2px; padding: 6px 8px; border-radius: var(--radius-sm);
    color: var(--muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--text); }
  .lx-nav__item.is-active { color: var(--text); }
  .lx-nav__item.is-active::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: var(--accent); }
  .lx-nav__item.is-part.is-current { color: var(--text); font-weight: 600; }
  .lx-nav__k { flex: none; min-width: 34px; font: 500 12px/18px var(--mono); color: var(--muted); white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k, .lx-nav__item.is-current .lx-nav__k { color: var(--text-2); }
  .lx-nav__t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-nav__c { flex: none; font: 400 11px/18px var(--mono); color: var(--muted); }
  .lx-nav__sub { display: flex; flex-direction: column; margin: 0 0 6px 20px; }
  .lx-nav__sub .lx-nav__item { min-height: 30px; padding: 5px 8px; }
  .lx-sidebar__foot { padding: 12px; border-top: 1px solid var(--border); }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- PostgreSQL signal ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 8px;
    border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font: 500 12px/1 var(--font); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--text); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--control); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--positive); }
  [data-state="error"] .lx-signal__dot { background: var(--negative); }
  [data-state="loading"] .lx-signal__dot, [data-state="reloading"] .lx-signal__dot { animation: lx-blink 1.2s ease-in-out infinite; background: var(--warning); }
  @keyframes lx-blink { 50% { opacity: .35; } }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lx-pop { position: absolute; bottom: calc(100% + 8px); left: 0; width: 380px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--raised); color: var(--text); border: 1px solid var(--control); border-radius: var(--radius); box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  .lx-pop__title { font-weight: 600; font-size: 14px; }
  .lx-pop__body { padding: 0 16px 14px; font-size: 13px; line-height: 20px; color: var(--text-2); }
  .lx-pop__body p { margin: 0 0 8px; }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 6px; }
  .lx-pop__body code { font: 500 12px/1 var(--mono); color: var(--text); background: var(--well); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0 0 10px; }
  .lx-pop__body .lx-kv dt { color: var(--muted); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--text); }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }

  /* ---------- Feedback motion only: no entrances ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-tab, .lx-row, .lx-opt, .lx-cellmap a, .lx-week, .lx-exlist a, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .lx-btn:active, .lx-iconbtn:active { transform: translateY(1px); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-in .2s ease-out; }
  @keyframes lx-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- Canvas, title row ---------- */
  .lx-page { max-width: 1320px; padding: 36px var(--pad) 80px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
  .lx-head__text { flex: 1 1 520px; min-width: 0; max-width: 880px; }
  .lx-h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-ctx { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-ctx .n { color: var(--text-2); font-size: 12px; }
  .lx-lead { margin: 10px 0 0; color: var(--text-2); font-size: 14px; line-height: 22px; max-width: 780px; }
  .lx-find { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--text); }
  .lx-find .n { font-size: 13px; }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: 16px; }
  .lx-h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
  .lx-section { font-size: 20px; line-height: 26px; font-weight: 400; color: var(--muted); }
  .lx-section b { color: var(--text); font-weight: 600; }

  /* ---------- Buttons: pills; primary inverted white ---------- */
  .lx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text);
    font: 500 13px/1 var(--font); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--raised); border-color: #55555b; }
  .lx-btn--primary { background: #fff; border-color: #fff; color: #111; font-weight: 600; }
  .lx-btn--primary:hover { background: #dcdce0; border-color: #dcdce0; }
  .lx-btn--ghost { border-color: transparent; color: var(--text-2); padding: 0 12px; }
  .lx-btn--ghost:hover { background: var(--raised); border-color: transparent; color: var(--text); }
  .lx-btn[disabled] { opacity: .5; cursor: progress; }
  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; flex: none; }
  .lx-iconbtn:hover { background: var(--raised); color: var(--text); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: 0; white-space: nowrap; padding: 5px 9px;
    border-radius: var(--radius-sm); background: #f2f2f3; color: #111; font: 500 12px/16px var(--font); opacity: 0; pointer-events: none; z-index: 10; transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; transform: none; }
  .lx-iconbtn.is-off { opacity: .35; pointer-events: none; }
  kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: var(--radius-sm); background: var(--raised); color: var(--text-2); border: 1px solid var(--control); white-space: nowrap; }

  /* ---------- Status: a dot and a word; blue = solved, amber = not yet ---------- */
  .lx-badge { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; font: 500 12px/18px var(--font); color: var(--muted); }
  .lx-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--control); }
  .lx-badge--success { color: var(--accent-ink); } .lx-badge--success::before { background: var(--accent); }
  .lx-badge--info { color: var(--text-2); } .lx-badge--info::before { background: var(--text-2); }
  .lx-badge--warning { color: var(--warning); } .lx-badge--warning::before { background: var(--warning); }
  .lx-badge--danger { color: var(--negative); } .lx-badge--danger::before { background: var(--negative); }
  .lx-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--raised); color: var(--text-2);
    font: 500 12px/1 var(--font); white-space: nowrap; flex: none; text-decoration: none; }
  a.lx-tag:hover { background: #2e2d33; color: var(--text); }

  /* ---------- Cards: darker than the ground ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 20px; }
  .lx-card__head + .lx-card__body { padding-top: 0; }
  .lx-card__meta { font-size: 13px; color: var(--muted); }
  .lx-card__body { padding: 20px; }
  .lx-card__foot { padding: 14px 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }

  /* Tables: rules and alignment */
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 8px 20px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: 11px 20px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table--data { font: 400 12px/18px var(--mono); }
  .lx-table--data th { font: 500 12px/16px var(--mono); color: var(--text-2); position: sticky; top: 0; background: var(--surface); }
  .lx-table--data td, .lx-table--data th { padding: 7px 16px; white-space: pre; }
  .lx-table--data tbody tr:hover td { background: var(--hover); }
  .lx-table--data td:first-child, .lx-table--data th:first-child { padding-left: 20px; }
  .lx-datawrap { max-height: 480px; overflow: auto; border-top: 1px solid var(--rule); }
  .lx-null { color: var(--muted); font-style: italic; }

  /* KPI strip: one container, divided */
  .lx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lx-kpi { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--rule); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-kpi__v { font: 500 22px/28px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .lx-kpi--lead .lx-kpi__v { font-size: 32px; line-height: 38px; font-weight: 600; }
  .lx-kpi__u { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; font-family: var(--font); }
  .lx-kpi__n { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-meter { position: relative; height: 4px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 6px; }
  .lx-meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* ---------- Signature: every SQL exercise as one cell ---------- */
  .lx-map { display: flex; flex-direction: column; }
  .lx-row { display: grid; grid-template-columns: 52px minmax(200px, 1fr) minmax(240px, 380px) 72px 72px 112px 32px; align-items: center; gap: 0 20px;
    padding: 14px 20px; border-top: 1px solid var(--rule); text-decoration: none; color: var(--text); }
  .lx-row:hover { background: var(--hover); }
  .lx-row--head { padding-top: 0; padding-bottom: 10px; border-top: 0; color: var(--muted); font-size: 12px; line-height: 16px; }
  .lx-row--head:hover { background: none; }
  .lx-row--head .r { font-family: var(--font); font-size: 12px; }
  .lx-row__k { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-row__t { min-width: 0; }
  .lx-row__t a { color: var(--text); text-decoration: none; font-weight: 600; }
  .lx-row__t a:hover { color: var(--accent-ink); }
  .lx-row__sub { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-row .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .lx-row .r small { color: var(--muted); font-size: 12px; }
  .lx-cellmap { display: flex; flex-wrap: wrap; gap: 3px; }
  .lx-cellmap a, .lx-cellmap span { display: block; width: 12px; height: 12px; border-radius: 2px; background: var(--cell); }
  .lx-cellmap .is-pass { background: var(--accent); }
  .lx-cellmap .is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-cellmap a:hover { background: var(--text-2); }
  .lx-cellmap--empty { font-size: 12px; color: var(--muted); }
  .lx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .lx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lx-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--cell); }
  .lx-legend i.is-pass { background: var(--accent); }
  .lx-legend i.is-fail { background: transparent; border: 1px solid var(--warning); }

  /* ---------- Fifteen weeks: this part's weeks carry the blue line ---------- */
  .lx-weeks { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 0; padding: 0 20px 20px; }
  .lx-week { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 10px 4px; border-top: 1px solid var(--control); color: var(--muted); font-size: 12px; line-height: 16px; text-decoration: none; }
  .lx-week + .lx-week { border-left: 1px solid var(--rule); }
  .lx-week__n { font: 600 13px/16px var(--mono); color: var(--text-2); }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .lx-week.is-on { color: var(--text-2); }
  .lx-week.is-on::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--text); }
  .lx-week__exam { color: var(--warning); font-weight: 600; }
  .lx-weeks--thin .lx-week { min-height: 56px; }
  .lx-weeklist { list-style: none; margin: 0; padding: 0 20px 12px; }
  .lx-weeklist li { display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 13px; }
  .lx-weeklist .n { color: var(--text-2); font-size: 12px; }
  button.lx-week { appearance: none; background: none; border-right: 0; border-bottom: 0; text-align: left; font: inherit; cursor: pointer; }
  button.lx-week:hover { background: var(--hover); }
  .lx-week.is-now { background: var(--accent-bg); }
  .lx-week.is-now::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent); }

  .lx-callout { border-radius: var(--radius); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--raised); color: var(--text); font-size: 13px; }
  .lx-callout a { color: inherit; }
  .lx-callout--success { background: var(--accent-bg); color: #d6e6fa; }
  .lx-callout--warning { background: var(--warning-bg); color: #f0d49c; }
  .lx-callout--danger { background: var(--negative-bg); color: #f6b8c3; font-family: var(--mono); font-size: 12px; }
  .lx-callout--danger strong { font-family: var(--font); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Step tabs on one rule ---------- */
  .lx-flow { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); }
  .lx-flow__steps { flex: 1; display: flex; gap: 28px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .lx-tab:hover { color: var(--text); }
  .lx-tab .n { font-size: 12px; color: var(--muted); }
  .lx-tab.is-active { color: var(--text); }
  .lx-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); }
  .lx-flow__arrows { display: flex; gap: 4px; padding-bottom: 5px; }
  .lx-flow__arrows .lx-iconbtn::after { bottom: auto; top: calc(100% + 6px); }

  /* ---------- Reading ---------- */
  .lx-prose { color: #ececef; font-size: 14px; line-height: 23px; }
  .lx-prose h3 { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text); margin: 28px 0 8px; }
  .lx-prose h3:first-child { margin-top: 0; }
  .lx-prose p { margin: 8px 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: 8px 0; }
  .lx-prose li { margin: 4px 0; }
  .lx-prose li::marker { color: var(--muted); }
  .lx-prose a { color: var(--accent-ink); }
  .lx-prose code, .lx-code { font: 500 12.5px/1 var(--mono); background: var(--raised); color: #f0f0f2; border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-prose strong { font-weight: 600; color: var(--text); }
  .lx-prose .table-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); }

<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

/*__ENGINE__*/

// ======================================================================
// Data & storage
// ======================================================================
const DATA = JSON.parse(document.getElementById('data').textContent);
const EXERCISES = new Map();
for (const ch of DATA.chapters) for (const ex of ch.exercises) EXERCISES.set(ex.id, { ...ex, chapter: ch.key });
const STORE_PREFIX = DATA.part.storage + ':';
const CORE_COUNT = DATA.schemaGroups.filter(g => g.core).reduce((n, g) => n + g.tables.length, 0);
const TABLE_COUNT = DATA.schemaGroups.reduce((n, g) => n + g.tables.length, 0);
const TOTAL_EXERCISES = EXERCISES.size;

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(STORE_PREFIX + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = sel => document.querySelector(sel);
const LEVELS = ['', 'Cơ bản', 'Trung bình', 'Nâng cao'];
const STEPS = [
  { key: 'summary', label: 'Tóm tắt kiến thức' },
  { key: 'quiz', label: 'Trắc nghiệm' },
  { key: 'questions', label: 'Câu hỏi tự luận' },
  { key: 'ex', label: 'Bài tập SQL' },
];
// A part may reorder or rename the steps (the review parts: essays and SQL first,
// no multiple choice). A section without quiz questions skips that step.
const PART_STEPS = (DATA.part.steps || STEPS.map(s => s.key))
  .map(k => ({ key: k, label: (DATA.part.stepLabels || {})[k] || STEPS.find(s => s.key === k).label }));
const stepsOf = ch => PART_STEPS.filter(s => s.key !== 'quiz' || ch.quiz.length);
const stepHref = (ch, key) => (key === 'ex' ? `#/${ch.key}/ex/${ch.exercises[0].id}` : `#/${ch.key}/${key}`);
const HAS_QUIZ = DATA.chapters.some(ch => ch.quiz.length) && PART_STEPS.some(s => s.key === 'quiz');

// 16px line icons, 1.5px stroke, one icon per meaning.
const ICON = {
  open: '<path d="M3 8h10M9 4l4 4-4 4"/>',
  back: '<path d="M13 8H3M7 4L3 8l4 4"/>',
  chevron: '<path d="M4 6l4 4 4-4"/>',
  caret: '<path d="M6 4l4 4-4 4"/>',
  play: '<path d="M5 3.5v9l7-4.5z"/>',
  check: '<path d="M3 8.5l3 3 7-7"/>',
  terminal: '<path d="M2.5 3.5h11v9h-11z"/><path d="M5 6.5l2 1.5-2 1.5M8.5 10H11"/>',
  table: '<path d="M2.5 3.5h11v9h-11zM2.5 6.5h11M6.5 6.5v6"/>',
  reset: '<path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2.5v3h3"/>',
  eye: '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>',
  key: '<circle cx="5" cy="8" r="2.5"/><path d="M7.5 8h6M11.5 8v2"/>',
  copy: '<path d="M5.5 5.5h8v8h-8z"/><path d="M10.5 5.5v-3h-8v8h3"/>',
  calendar: '<path d="M2.5 4h11v9.5h-11zM2.5 7h11M5.5 2.5v3M10.5 2.5v3"/>',
  menu: '<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>',
};
const icon = name => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICON[name]}</svg>`;

// ======================================================================
// Database
// ======================================================================
// ---- Signal: dot lit when the shared database is ready, off otherwise ----
const signalEl = $('#signal');
const signalBtn = signalEl.querySelector('.lx-signal');
const signalLabel = $('#signalLabel');
const signalPop = $('#signalPop');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const signal = { state: 'loading', startedAt: performance.now(), loadMs: null, error: null };
const SIGNAL_LABEL = {
  loading: 'Đang khởi động PostgreSQL',
  reloading: 'Đang nạp lại dữ liệu',
  ready: 'PostgreSQL sẵn sàng',
  error: 'PostgreSQL không có tín hiệu',
};

const START_STEPS = `<ol>
  <li>Lần mở đầu tiên cần Internet: trình duyệt tải PostgreSQL (khoảng 16 MB) từ <code>cdn.jsdelivr.net</code>, các lần sau dùng cache.</li>
  <li>Nếu trình duyệt chặn trang mở trực tiếp từ ổ đĩa, trong thư mục <code>lab</code> chạy <code>npm run serve</code> rồi mở <code>http://localhost:4420</code>.</li>
  <li>Tải lại trang. Đèn sáng xanh là đã sẵn sàng.</li>
</ol>`;

function signalPopHtml() {
  const s = signal.state;
  if (s === 'ready') {
    return `<div class="lx-pop__head"><span class="lx-pop__title">PostgreSQL đang chạy</span><span class="lx-badge lx-badge--success">Sẵn sàng</span></div>
      <div class="lx-pop__body">
        <dl class="lx-kv"><dt>Engine</dt><dd>PostgreSQL trong trình duyệt (PGlite 0.5.8)</dd>
          <dt>Database</dt><dd>${CORE_COUNT ? `University: ${CORE_COUNT} bảng của sách, ${TABLE_COUNT - CORE_COUNT} bảng phụ` : `${TABLE_COUNT} bảng`}</dd>
          <dt>Khởi động</dt><dd>${(signal.loadMs / 1000).toFixed(1)} giây</dd></dl>
        <p>Không cần cài server. Bài tập chạy trong một transaction rồi <code>rollback</code>, nên dữ liệu gốc không đổi.</p>
        <p style="margin:0">Chạy ngoài trình duyệt: <code>npm run sql</code> mở SQL shell, <code>npm run grade -- ${esc(DATA.chapters[0].key)}</code> chấm file <code>my_answers.sql</code> (trong thư mục <code>lab</code>).</p>
      </div>`;
  }
  if (s === 'error') {
    const offline = navigator.onLine === false;
    return `<div class="lx-pop__head"><span class="lx-pop__title">Chưa kết nối được PostgreSQL</span><span class="lx-badge lx-badge--danger">Không có tín hiệu</span></div>
      <div class="lx-pop__body">
        <p>${offline ? 'Máy đang offline.' : `Lỗi: ${esc(signal.error || 'không tải được PGlite')}`}</p>
        <p style="margin-bottom:4px;color:var(--ink)"><strong>Cách khởi động</strong></p>${START_STEPS}
      </div>
      <div class="lx-pop__foot"><button class="lx-btn lx-btn--primary" type="button" id="signalRetry">${icon('reset')} Thử kết nối lại</button></div>`;
  }
  const secs = Math.round((performance.now() - signal.startedAt) / 1000);
  return `<div class="lx-pop__head"><span class="lx-pop__title">${SIGNAL_LABEL[s]}</span><span class="lx-badge lx-badge--info">Đang tải</span></div>
    <div class="lx-pop__body">
      <p>Đã chờ ${secs} giây. Nếu đèn chưa sáng sau khoảng 30 giây, kiểm tra theo các bước:</p>${START_STEPS}
    </div>`;
}

function setSignal(state, info = {}) {
  const changed = signal.state !== state;
  Object.assign(signal, { state }, info);
  if (state === 'loading' || state === 'reloading') signal.startedAt = performance.now();
  signalEl.classList.toggle('is-ready', state === 'ready');
  signalEl.dataset.state = state;
  signalLabel.textContent = SIGNAL_LABEL[state];
  signalBtn.setAttribute('aria-label', SIGNAL_LABEL[state]);
  if (changed && !reduceMotion.matches) {
    signalLabel.animate([{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  }
  renderSignalPop();
}

// Hover and keyboard focus open the guide via CSS; a click pins it (touch screens).
signalBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = !signalEl.classList.contains('is-open');
  signalEl.classList.toggle('is-open', open);
  signalBtn.setAttribute('aria-expanded', String(open));
});
signalEl.addEventListener('mouseenter', () => { if (signal.state !== 'ready' && signal.state !== 'error') renderSignalPop(); });
document.addEventListener('click', e => {
  if (!signalEl.contains(e.target)) { signalEl.classList.remove('is-open'); signalBtn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && signalEl.classList.contains('is-open')) { signalEl.classList.remove('is-open'); signalBtn.focus(); }
});
setSignal('loading');

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

const num = (n, unit = '') => `<span class="n">${Number(n).toLocaleString('en-US')}</span>${unit}`;

function cell(v) {
  if (v === null || v === undefined) return '<span class="lx-null">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function tableHtml(table, title, limit = 200) {
  const rows = table.rows.slice(0, limit);
  const n = table.rows.length;
  return `<div class="lx-card">
    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-card__meta">${num(n)} dòng · ${num(table.fields.length)} cột</span></div>` : ''}
    <div class="lx-datawrap"><table class="lx-table lx-table--data"><thead><tr>${table.fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${Math.max(1, table.fields.length)}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu trên ${num(n)} dòng</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-callout lx-mono">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const failed = ch.exercises.filter(ex => exStatus(ex.id) === 'fail').length;
  const tried = passed + failed;
  const essays = store.get('essay:' + ch.store, []).filter(i => i < ch.questions.length).length;
  return { passed, failed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null),
    needQuiz: HAS_QUIZ && ch.quiz.length > 0, essays, essayTotal: ch.questions.length };
}
const isDone = p => p.passed === p.total && (p.quiz || !p.needQuiz) && p.essays === p.essayTotal;
function exBadge(id) {
  const s = exStatus(id);
  if (s === 'pass') return '<span class="lx-badge lx-badge--success">Đã đúng</span>';
  if (s === 'fail') return '<span class="lx-badge lx-badge--warning">Chưa đúng</span>';
  return '<span class="lx-badge">Chưa làm</span>';
}
const dotClass = id => ({ pass: ' is-pass', fail: ' is-fail' })[exStatus(id)] || '';
const STATUS_WORD = { pass: 'đã đúng', fail: 'chưa đúng' };
function chapterBadge(p) {
  if (isDone(p)) return '<span class="lx-badge lx-badge--success">Hoàn thành</span>';

  return '<span class="lx-badge">Chưa bắt đầu</span>';

    </div>`;
  $('#resetProgress').addEventListener('click', () => {
    if (!confirm(`Xoá toàn bộ tiến độ và code của ${partLabel(DATA.part)} đã lưu trong trình duyệt?`)) return;
    try { Object.keys(localStorage).filter(k => k.startsWith(STORE_PREFIX)).forEach(k => localStorage.removeItem(k)); } catch { /* ignore */ }
    route();
  });
}

function flowNav(ch, stepKey) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === stepKey);
  const href = s => stepHref(ch, s.key);
  const prev = steps[i - 1], next = steps[i + 1];
  const count = { quiz: ch.quiz.length, questions: ch.questions.length, ex: ch.exercises.length };
  const arrow = (s, dir) => `<a class="lx-iconbtn${s ? '' : ' is-off'}" ${s ? `href="${href(s)}"` : 'aria-disabled="true"'} data-tip="${s ? `${dir}: ${s.label}` : (dir === 'Bước trước' ? 'Đây là bước đầu' : 'Đây là bước cuối')}" aria-label="${s ? `${dir}: ${s.label}` : dir}">${icon(dir === 'Bước trước' ? 'back' : 'open')}</a>`;
  return `<nav class="lx-flow" aria-label="Các bước học ${esc(ch.label)}">
    <ol class="lx-flow__steps">${steps.map((s, j) => `<li><a class="lx-tab${j === i ? ' is-active' : ''}" href="${href(s)}"${j === i ? ' aria-current="step"' : ''}>${s.label}${count[s.key] ? `<span class="n">${count[s.key]}</span>` : ''}</a></li>`).join('')}</ol>
    <div class="lx-flow__arrows">${arrow(prev, 'Bước trước')}${arrow(next, 'Bước sau')}</div>
  </nav>`;
}

function chapterPage(ch, step, lead) {
  const p = chapterProgress(ch);
  return pageHead(esc(ch.titleVi), `${esc(ch.label)} · ${esc(ch.title)} · ${num(p.passed)}/${num(p.total)} bài SQL đúng · ${num(p.essays)}/${num(p.essayTotal)} tự luận đã chấm`, leadP(lead)) + flowNav(ch, step);
}

// Footer link to the step after `key`, or back to the first step at the end.
function nextStepFoot(ch, key) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === key);
  const next = steps[i + 1];
  const count = { quiz: `${ch.quiz.length} câu trắc nghiệm`, questions: `${ch.questions.length} câu tự luận`, ex: `${ch.exercises.length} bài SQL`, summary: 'phần ghi nhớ' };
  return next
    ? `<div class="lx-card__foot"><span>Tiếp theo: ${count[next.key]}</span><a class="lx-btn lx-btn--primary" href="${stepHref(ch, next.key)}">${esc(next.label)} ${icon('open')}</a></div>`
    : `<div class="lx-card__foot"><span>Đây là bước cuối của ${esc(ch.label)}</span><a class="lx-btn" href="${stepHref(ch, steps[0].key)}">Về ${esc(steps[0].label.toLowerCase())}</a></div>`;
}

// A side column that follows the reader: an outline, a score, a checklist.
const split = (mainHtml, asideHtml) => `<div class="lx-split"><div class="lx-stack">${mainHtml}</div><aside class="lx-aside">${asideHtml}</aside></div>`;

function viewSummary(ch) {
  const label = PART_STEPS.find(s => s.key === 'summary').label;
  main.innerHTML = chapterPage(ch, 'summary', stepsOf(ch)[0].key === 'summary' ? 'Đọc kỹ phần này trước khi làm bài.' : 'Tra cứu nhanh kiến thức và các bẫy hay gặp. Đọc lại trước khi thi.') +
    split(`<div class="lx-card"><div class="lx-card__body lx-prose lx-read" id="summaryBody">${ch.summary}</div>${nextStepFoot(ch, 'summary')}</div>`,
      `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${esc(label)}</h2></div><ol class="lx-toc" id="toc"></ol></div>`);
  const heads = [...main.querySelectorAll('#summaryBody h3')];
  $('#toc').innerHTML = heads.length
    ? heads.map((h, i) => `<li><button type="button" data-h="${i}">${esc(h.textContent)}</button></li>`).join('')
    : '<li class="lx-subtle">Một mục duy nhất</li>';
  $('#toc').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) heads[+b.dataset.h].scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' }); });
}

function viewQuiz(ch) {
  const saved = store.get('quiz:' + ch.store, null);
  main.innerHTML = chapterPage(ch, 'quiz', `${ch.quiz.length} câu, mỗi câu một đáp án đúng.`) + `<form id="quiz">` +
    split(ch.quiz.map((q, i) => `
      <fieldset class="lx-card" data-i="${i}" style="margin:0;padding:0">
        <div class="lx-qhead"><legend class="lx-qno" style="float:left;padding:0">Câu ${i + 1}</legend><span class="lx-q__state"></span></div>
        <div class="lx-card__body lx-prose">
          <div>${q.q}</div>
          <div class="lx-q__opts">${q.options.map((o, j) => `
            <label class="lx-opt"><input type="radio" name="q${i}" value="${j}"><span><strong>${'ABCD'[j]}.</strong> ${o}</span></label>`).join('')}
          </div>
          <div class="lx-q__explain" hidden></div>
        </div>
      </fieldset>`).join(''),
      `<div class="lx-card">
        <div class="lx-card__head"><h2 class="lx-h2">Bài làm</h2><span class="lx-card__meta">Cao nhất ${saved ? `${num(saved.best)}/${num(ch.quiz.length)}` : '–'}</span></div>
        <div class="lx-card__body">
          <div class="lx-kpi__v"><span id="answered">0</span><span class="lx-kpi__u"> /${ch.quiz.length} đã chọn</span></div>
          <div class="lx-meter" aria-hidden="true"><i id="answeredBar" style="width:0"></i></div>
          <div class="lx-qgrid" id="quizGrid">${ch.quiz.map((q, i) => `<button type="button" class="lx-qcell" data-go="${i}" aria-label="Câu ${i + 1}">${i + 1}</button>`).join('')}</div>
          <p id="score" role="status" class="lx-aside__note">Chọn đáp án cho từng câu rồi nộp bài.</p>
        </div>
        <div class="lx-card__foot"><button class="lx-btn" type="button" id="retry">${icon('reset')} Làm lại</button><button class="lx-btn lx-btn--primary" type="submit">${icon('check')} Nộp bài</button></div>
      </div>`) + `</form>`;
  const form = $('#quiz');
  form.addEventListener('change', () => {
    const n = form.querySelectorAll('input[type=radio]:checked').length;
    $('#answered').textContent = n;
    $('#answeredBar').style.width = `${(100 * n / ch.quiz.length).toFixed(1)}%`;
    ch.quiz.forEach((q, i) => $(`#quizGrid [data-go="${i}"]`).classList.toggle('is-picked', !!form.querySelector(`input[name="q${i}"]:checked`)));
  });
  $('#quizGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) form.querySelector(`[data-i="${b.dataset.go}"]`).scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    ch.quiz.forEach((q, i) => {
      const box = form.querySelector(`[data-i="${i}"]`);
      const picked = form.querySelector(`input[name="q${i}"]:checked`);
      const ok = picked && Number(picked.value) === q.answer;
      box.querySelectorAll('.lx-opt').forEach((l, j) => {
        l.classList.toggle('is-right', j === q.answer);
        l.classList.toggle('is-wrong', !!picked && Number(picked.value) === j && j !== q.answer);
      });
      if (ok) score++;
      const qc = $(`#quizGrid [data-go="${i}"]`);
      qc.classList.remove('is-picked'); qc.classList.toggle('is-pass', !!ok); qc.classList.toggle('is-fail', !ok);
      qc.setAttribute('aria-label', `Câu ${i + 1}: ${ok ? 'đúng' : picked ? 'sai' : 'bỏ trống'}`);
      box.querySelector('.lx-q__state').innerHTML = ok
        ? '<span class="lx-badge lx-badge--success">Đúng</span>'
        : picked ? '<span class="lx-badge lx-badge--danger">Sai</span>' : '<span class="lx-badge">Bỏ trống</span>';
      const ex = box.querySelector('.lx-q__explain');
      ex.hidden = false;
      ex.innerHTML = `<strong>Đáp án ${'ABCD'[q.answer]}.</strong> ${q.explain}`;
    });
    const best = Math.max(score, saved?.best ?? 0);
    store.set('quiz:' + ch.store, { best, last: score });
    $('#score').innerHTML = `Kết quả: <strong class="n">${score}/${ch.quiz.length}</strong> (${(100 * score / ch.quiz.length).toFixed(1)}%). Điểm cao nhất: <span class="n">${best}/${ch.quiz.length}</span>.`;
    renderContext(ch);
  });
  $('#retry').addEventListener('click', () => viewQuiz(ch));
}

function viewQuestions(ch) {
  const key = 'essay:' + ch.store;
  const done = new Set(store.get(key, []));
  main.innerHTML = chapterPage(ch, 'questions', 'Viết câu trả lời ra giấy như trong phòng thi, rồi mở gợi ý đáp án để so và đánh dấu đã tự chấm.') +
    split(ch.questions.map((q, i) => `<div class="lx-card" id="essay-${i}">
      <div class="lx-qhead"><h2 class="lx-qno">Câu ${i + 1}</h2>
        <label class="lx-check"><input type="checkbox" data-essay="${i}"${done.has(i) ? ' checked' : ''}> Đã tự chấm</label></div>
      <div class="lx-card__body lx-prose">${q.en ? `<blockquote class="lx-en" lang="en">${q.en}</blockquote>` : ''}<p style="margin-top:0">${q.q}</p>
      <details><summary>${icon('caret')} Gợi ý đáp án</summary>${q.answer}</details></div></div>`).join('') +
      `<div class="lx-card">${nextStepFoot(ch, 'questions')}</div>`,
      `<div class="lx-card">
        <div class="lx-card__head"><h2 class="lx-h2">Tự chấm</h2><span class="lx-card__meta"><span id="essayN">${done.size}</span>/${ch.questions.length}</span></div>
        <div class="lx-card__body"><div class="lx-meter" aria-hidden="true"><i id="essayBar" style="width:${(100 * done.size / ch.questions.length).toFixed(1)}%"></i></div>
          <div class="lx-qgrid" id="essayGrid">${ch.questions.map((q, i) => `<button type="button" class="lx-qcell${done.has(i) ? ' is-pass' : ''}" data-go="${i}" aria-label="Câu ${i + 1}${done.has(i) ? ': đã tự chấm' : ''}">${i + 1}</button>`).join('')}</div>
        </div>
      </div>`);
  main.querySelectorAll('[data-essay]').forEach(box => box.addEventListener('change', () => {
    const set = new Set(store.get(key, []));
    if (box.checked) set.add(+box.dataset.essay); else set.delete(+box.dataset.essay);
    store.set(key, [...set].sort((a, b) => a - b));
    $(`[data-go="${box.dataset.essay}"]`).classList.toggle('is-pass', box.checked);
    $('#essayN').textContent = set.size;
    $('#essayBar').style.width = `${(100 * set.size / ch.questions.length).toFixed(1)}%`;
  }));
  $('#essayGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) $(`#essay-${b.dataset.go}`).scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  });
}

const KEYS = '<span class="lx-console__keys"><span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> chạy</span><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd> kiểm tra</span></span>';

function viewExercise(ch, id) {
  const ex = EXERCISES.get(id) && EXERCISES.get(id).chapter === ch.key ? EXERCISES.get(id) : EXERCISES.get(ch.exercises[0].id);
  const idx = ch.exercises.findIndex(e => e.id === ex.id);
  const prev = ch.exercises[idx - 1], next = ch.exercises[idx + 1];
  const code = store.get('code:' + ex.id, '');
  const p = chapterProgress(ch);

  main.innerHTML = chapterPage(ch, 'ex', '') + `
    <div class="lx-work">
      <aside class="lx-card lx-exlist" aria-label="Danh sách bài tập">
        <div class="lx-card__head"><h2 class="lx-h2">Bài tập</h2><span class="lx-card__meta" id="exCount">${num(p.passed)}/${num(p.total)} đúng</span></div>
        <ul id="exList">${ch.exercises.map(e => `
          <li${e.id === ex.id ? ' aria-selected="true"' : ''} data-id="${e.id}"><a href="#/${ch.key}/ex/${e.id}"${e.id === ex.id ? ' aria-current="true"' : ''}>
            <span class="lx-list__id">${e.id}</span><span class="lx-list__t">${esc(e.topic)}</span><span class="lx-dot${dotClass(e.id)}" aria-label="${STATUS_WORD[exStatus(e.id)] || 'chưa làm'}"></span></a></li>`).join('')}
        </ul>
      </aside>
      <section class="lx-stack">
        <div class="lx-card">
          <div class="lx-exhead">
            <h2 class="lx-exhead__id">Bài ${ex.id}</h2>
            <div class="lx-exmeta">
              <span class="lx-tag">${esc(ex.topic)}</span>
              <span class="lx-tag">${LEVELS[ex.level]}</span>
              ${ex.check ? '<span class="lx-tag" title="Chấm bằng một câu truy vấn chạy sau code của bạn">Có câu kiểm tra</span>' : ''}
              ${ex.fresh ? '<span class="lx-tag" title="Chạy trên database mới, được dùng begin/commit/rollback">Database mới</span>' : ''}
              ${ex.ordered ? '<span class="lx-tag" title="Thứ tự dòng được chấm">Chấm thứ tự</span>' : ''}
            </div>
            <span id="exState">${exBadge(ex.id)}</span>
          </div>
          <div class="lx-card__body lx-stack" style="padding-top:0">
            ${ex.en ? `<blockquote class="lx-en" lang="en">${ex.en}</blockquote>` : ''}
            <div class="lx-prose">${ex.prompt}</div>
            ${ex.hint ? `<details><summary>${icon('caret')} Gợi ý</summary><div class="lx-prose">${ex.hint}</div></details>` : ''}
            <div class="lx-console">
              <div class="lx-console__bar"><label for="editor">Câu trả lời</label>${KEYS}</div>
              <textarea class="lx-editor" id="editor" spellcheck="false" placeholder="-- Viết câu SQL của bạn ở đây">${esc(code)}</textarea>
            </div>
          </div>
          <div class="lx-runbar">
            <div class="lx-actions">
              <button class="lx-btn lx-btn--ghost" id="showExpected">${icon('table')} Kết quả mong đợi</button>
              <button class="lx-btn lx-btn--ghost" id="showSolution">${icon('eye')} Xem đáp án</button>
            </div>
            <div class="lx-actions">
              <button class="lx-btn" id="run" title="Ctrl + Enter">${icon('play')} Chạy</button>
              <button class="lx-btn lx-btn--primary" id="check" title="Ctrl + Shift + Enter">${icon('check')} Kiểm tra</button>
            </div>
          </div>
        </div>
        <div id="feedback"></div>
        <div id="output" class="lx-stack"></div>
        <div class="lx-pager">
          ${prev ? `<a class="lx-btn" href="#/${ch.key}/ex/${prev.id}">${icon('back')} Bài ${prev.id}</a>` : '<span></span>'}
          ${next ? `<a class="lx-btn" href="#/${ch.key}/ex/${next.id}">Bài ${next.id} ${icon('open')}</a>` : `<a class="lx-btn" href="${stepHref(ch, stepsOf(ch)[0].key)}">Về đầu ${esc(ch.label)}</a>`}
        </div>
      </section>
    </div>`;

  $('#exList [aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  const editor = $('#editor');
  const feedback = $('#feedback'), output = $('#output');
  const buttons = ['#run', '#check'].map($);
  const busy = on => buttons.forEach(b => (b.disabled = on));
  let saveTimer;
  editor.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('code:' + ex.id, editor.value), 300); });
  bindEditorKeys(editor, () => $('#run').click(), () => $('#check').click());

  $('#run').addEventListener('click', async () => {
    if (!editor.value.trim()) return;
    busy(true);
    feedback.innerHTML = callout('info', 'Đang chạy…');
    try {
      const out = await serial(() => runForDisplay(editor.value, { check: ex.check, fresh: ex.fresh }));
      feedback.innerHTML = ex.fresh ? '' : callout('info', 'Đã chạy trong một transaction và rollback, dữ liệu gốc không đổi.');
      output.innerHTML = resultsHtml(out);
    } catch (e) {
      feedback.innerHTML = callout('danger', esc(e.message));
    }
    busy(false);
  });

  $('#check').addEventListener('click', async () => {
    if (!editor.value.trim()) return;
    store.set('code:' + ex.id, editor.value);
    busy(true);
    feedback.innerHTML = callout('info', 'Đang chấm…');
    try {
      const res = await serial(() => gradeExercise(getDb, ex, editor.value, ex.expected));
      store.set('status:' + ex.id, res.ok ? 'pass' : (exStatus(ex.id) === 'pass' ? 'pass' : 'fail'));
      feedback.innerHTML = res.ok
        ? callout('success', `<strong>Chính xác.</strong> Kết quả khớp với đáp án.${next ? ` <a href="#/${ch.key}/ex/${next.id}">Sang bài ${next.id}</a>` : ''}`)
        : callout('warning', `<strong>Chưa đúng.</strong> ${esc(res.reason)}`);
      output.innerHTML = res.actual ? tableHtml(res.actual, ex.check ? 'Câu kiểm tra với code của bạn (đã chuẩn hoá)' : 'Kết quả của bạn (đã chuẩn hoá)') : '';
      $('#exState').innerHTML = exBadge(ex.id);
      const dot = $(`#exList [data-id="${ex.id}"] .lx-dot`);
      if (dot) { dot.className = 'lx-dot' + dotClass(ex.id); dot.setAttribute('aria-label', STATUS_WORD[exStatus(ex.id)]); }
      const np = chapterProgress(ch);
      $('#exCount').innerHTML = `${num(np.passed)}/${num(np.total)} đúng`;
      renderNav(location.hash.slice(1).split('?')[0]);
      renderContext(ch);
    } catch (e) {
      feedback.innerHTML = callout('danger', esc(e.message));
    }
    busy(false);
  });

  $('#showExpected').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = tableHtml(ex.expected, ex.check ? 'Kết quả mong đợi của câu kiểm tra' : 'Kết quả mong đợi') +
      (ex.check ? `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Câu truy vấn kiểm tra</h3></div><div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.check)}</code></pre></div></div>` : '');
  });

  $('#showSolution').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Đáp án tham khảo</h3>
        <button class="lx-btn lx-btn--ghost" id="useSolution">${icon('copy')} Chép vào ô trả lời</button></div>
      <div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.solution)}</code></pre></div>
      <div class="lx-card__foot">Có thể có nhiều cách viết đúng khác.</div></div>`;
    $('#useSolution').addEventListener('click', () => { editor.value = ex.solution; store.set('code:' + ex.id, editor.value); editor.focus(); });
  });
}

function viewSandbox(initial) {
  const code = initial ?? store.get('sandbox', 'select * from instructor;');
  main.innerHTML = pageHead('SQL tự do', `Công cụ · ${CORE_COUNT ? `University database, ${num(TABLE_COUNT)} bảng` : `${num(TABLE_COUNT)} bảng`} · thay đổi được giữ tới khi tải lại trang`,

        <div class="lx-console__bar"><label for="editor">Câu lệnh SQL</label><span class="lx-console__keys"><span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> chạy</span></span></div>

    feedback.innerHTML = callout('success', 'Đã nạp lại dữ liệu gốc.');

}

    leadP('Cột gạch chân là primary key. Hàm tiện ích: <code class="lx-code">try_sql(text)</code> trả về ok hoặc mã SQLSTATE của lỗi; <code class="lx-code">sql_value(text)</code> trả về giá trị đầu tiên của một truy vấn.')) +
    DATA.schemaGroups.map(g => `<section class="lx-stack"><h2 class="lx-section"><b>${esc(g.title)}</b> · ${num(g.tables.length)} bảng</h2>${g.note ? `<p class="lx-subtle" style="margin:0">${g.note}</p>` : ''}${section(g.tables)}</section>`).join('');
}

// ======================================================================
// Functional-dependency tool (Chapter 7)
// ======================================================================
const FD_PRESETS = [
  { name: 'PE 7.1, 7.6, 7.7, 7.13 — R(A,B,C,D,E)', R: 'ABCDE', F: 'A -> BC\nCD -> E\nB -> D\nE -> A', alpha: 'B', decomp: 'ABC\nADE' },
  { name: 'Slide — R(A,B,C,G,H,I), (AG)⁺', R: 'ABCGHI', F: 'A -> B\nA -> C\nCG -> H\nCG -> I\nB -> H', alpha: 'AG', decomp: '' },
  { name: 'Slide — canonical cover R(A,B,C)', R: 'ABC', F: 'A -> BC\nB -> C\nA -> B\nAB -> C', alpha: '', decomp: '' },
  { name: 'Slide — R = (A,B,C), A→B, B→C', R: 'ABC', F: 'A -> B\nB -> C', alpha: '', decomp: 'AB\nBC' },
  { name: 'PE 7.14 — nhiều canonical cover', R: 'XYZ', F: 'X -> YZ\nY -> XZ\nZ -> XY', alpha: '', decomp: '' },
  { name: 'PE 7.17 — nhiều phân rã BCNF', R: 'ABCD', F: 'A -> B\nC -> D\nB -> C', alpha: '', decomp: 'AB\nCD\nAC' },
  { name: 'in_dep (instructor ⋈ department)', R: 'ID, name, salary, dept_name, building, budget', F: 'ID -> name, salary, dept_name\ndept_name -> building, budget', alpha: 'dept_name', decomp: 'ID, name, salary, dept_name\ndept_name, building, budget' },
  { name: 'Lossy — employee tách theo name', R: 'ID, name, street, city, salary', F: 'ID -> name, street, city, salary', alpha: '', decomp: 'ID, name\nname, street, city, salary' },
  { name: 'dept_advisor — BCNF không bảo toàn FD', R: 's_ID, i_ID, dept_name', F: 'i_ID -> dept_name\ns_ID, dept_name -> i_ID', alpha: '', decomp: 's_ID, i_ID\ni_ID, dept_name' },
  { name: 'class — ví dụ phân rã BCNF', R: 'course_id, title, dept_name, credits, sec_id, semester, year, building, room_number, capacity, time_slot_id', F: 'course_id -> title, dept_name, credits\nbuilding, room_number -> capacity\ncourse_id, sec_id, semester, year -> building, room_number, time_slot_id', alpha: '', decomp: '' },
  { name: 'cust_banker_branch — ví dụ 3NF', R: 'customer_id, employee_id, branch_name, type', F: 'customer_id, employee_id -> type\nemployee_id -> branch_name\ncustomer_id, branch_name -> employee_id', alpha: '', decomp: '' },
];

function fdReport(input) {
  const { R, fds, letters, errors } = fdParse(input.R, input.F);
  if (!R.length) return callout('warning', 'Nhập lược đồ R trước.');
  if (errors.length) return callout('danger', errors.map(esc).join('<br>'));
  const A = xs => `<span class="lx-mono">${esc(fdFormat(xs, letters))}</span>`;
  const FD = f => `<span class="lx-mono">${esc(fdFormatFD(f, letters))}</span>`;
  const card = (title, body, tag = '') => `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${title}</h2>${tag}</div><div class="lx-card__body lx-prose">${body}</div></div>`;
  const ok = (yes, a, b) => `<span class="lx-badge lx-badge--${yes ? 'success' : 'warning'}">${yes ? a : b}</span>`;
  const out = [];

  const alpha = fdParseAttrs(input.alpha || '', letters).filter(a => R.includes(a));
  if (alpha.length) {
    const c = fdClosure(R, fds, alpha);
    out.push(card(`Bao đóng (${esc(fdFormat(alpha, letters))})⁺`, `<ol><li>result := ${A(alpha)}</li>${c.steps.map(s => `<li>Dùng ${FD(s.fd)}: thêm ${A(s.added)} → result = ${A(s.result)}</li>`).join('')}</ol>
      <p>Kết quả: (${A(alpha)})⁺ = ${A(c.result)}. ${c.result.length === R.length ? `${A(alpha)} là <strong>superkey</strong>.` : `Không phải superkey (thiếu ${A(R.filter(a => !c.result.includes(a)))}).`}</p>`));
  }

  const keys = fdCandidateKeys(R, fds);
  const prime = R.filter(a => keys.some(k => k.includes(a)));
  const bcnfBad = fdBcnfViolations(R, fds);
  const nf3Bad = fdThirdNFViolations(R, fds, keys);
  out.push(card('Khoá và dạng chuẩn của R', `<p>Candidate key: ${keys.map(A).join(', ')}.</p>
    <p>Thuộc tính khoá (prime): ${A(prime)}${prime.length < R.length ? `; không khoá: ${A(R.filter(a => !prime.includes(a)))}` : ''}.</p>
    <p>BCNF ${ok(!bcnfBad.length, 'Đạt', 'Không đạt')} ${bcnfBad.length ? `— vi phạm (vế trái không phải superkey): ${bcnfBad.map(FD).join(', ')}` : '— mọi FD không tầm thường trong F có vế trái là superkey.'}</p>
    <p>3NF ${ok(!nf3Bad.length, 'Đạt', 'Không đạt')} ${nf3Bad.length ? `— vi phạm (vế trái không phải superkey và vế phải có thuộc tính không khoá): ${nf3Bad.map(FD).join(', ')}` : '— mỗi FD có vế trái là superkey hoặc vế phải chỉ gồm thuộc tính khoá.'}</p>
    <p class="lx-subtle">Kiểm tra trên F đã cho là đủ cho lược đồ R ban đầu (slide 7.55, 7.62).</p>`));

  const cc = fdCover(R, fds, letters);
  out.push(card('Canonical cover F<sub>c</sub>', `${cc.log.length ? `<ol>${cc.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p>Không có vế trái trùng nhau và không có thuộc tính thừa: F<sub>c</sub> = F.</p>'}
    <p>F<sub>c</sub> = { ${cc.cover.map(FD).join('; ')} }</p><p class="lx-subtle">Canonical cover có thể không duy nhất (PE 7.14): thứ tự xét thuộc tính khác có thể cho kết quả khác nhưng tương đương.</p>`));

  const b = fdBcnfDecompose(R, fds);
  out.push(card('Phân rã BCNF', b.steps.length ? `<ol>${b.steps.map(s => `<li>${A(s.schema)} vi phạm BCNF do ${FD(s.fd)} (${A(s.fd.lhs)} không phải superkey của ${A(s.schema)}) → tách thành ${A(s.r1)} và ${A(s.r2)}</li>`).join('')}</ol>
    <p>Kết quả: ${b.result.map(x => `(${A(x)})`).join(', ')}</p>` : '<p>R đã ở BCNF, không cần tách.</p>',
    ok(b.result.length === 1 || fds.every(f => fdPreserved(R, fds, b.result, f)), 'Bảo toàn FD', 'Mất FD')));

  const t = fdThirdNFDecompose(R, fds, letters);
  const stepText = s => s.kind === 'add' ? `Từ ${FD(s.fd)} tạo lược đồ ${A(s.schema)}`
    : s.kind === 'skip' ? `${FD(s.fd)}: ${A(s.schema)} đã nằm trong một lược đồ có sẵn, bỏ qua`
    : s.kind === 'key' ? `Không lược đồ nào chứa candidate key → thêm ${A(s.schema)}`
    : `Bỏ ${A(s.schema)} vì nằm trọn trong lược đồ khác`;
  out.push(card('Phân rã 3NF (thuật toán tổng hợp)', `<ol>${t.steps.map(s => `<li>${stepText(s)}</li>`).join('')}</ol><p>Kết quả: ${t.result.map(x => `(${A(x)})`).join(', ')}</p>`,
    ok(true, 'Lossless + bảo toàn FD', '')));

  const schemas = fdParseSchemas(input.decomp || '', letters, R);
  if (schemas.length >= 2) {
    const covered = R.every(a => schemas.some(S => S.includes(a)));
    const lossless = fdLosslessChase(R, fds, schemas);
    let body = covered ? '' : callout('warning', `Phân rã chưa phủ hết R (thiếu ${A(R.filter(a => !schemas.some(S => S.includes(a))))}).`);
    body += `<p>Các lược đồ: ${schemas.map((S, i) => `R<sub>${i + 1}</sub> = (${A(S)})`).join(', ')}</p>`;
    if (schemas.length === 2) {
      const l = fdLosslessBinary(R, fds, schemas[0], schemas[1]);
      body += `<p>R<sub>1</sub> ∩ R<sub>2</sub> = ${A(l.common)}; (${A(l.common)})⁺ = ${A(l.closure)} → ${l.lossless ? 'chứa R<sub>1</sub> hoặc R<sub>2</sub>, nên <strong>lossless</strong>' : 'không chứa R<sub>1</sub> lẫn R<sub>2</sub>, nên <strong>lossy</strong>'}.</p>`;
    } else {
      body += `<p>Kiểm tra lossless bằng bảng chase: <strong>${lossless ? 'lossless' : 'lossy'}</strong>.</p>`;
    }
    body += `<p>Bảo toàn phụ thuộc (thuật toán slide 7.53):</p><ul>${fds.map(f => `<li>${FD(f)}: ${fdPreserved(R, fds, schemas, f) ? 'được bảo toàn' : '<strong>không</strong> được bảo toàn'}</li>`).join('')}</ul>
      <p>Dạng chuẩn từng lược đồ: ${schemas.map((S, i) => { const v = fdBcnfViolation(R, fds, S); return `R<sub>${i + 1}</sub> ${v ? `không BCNF (${FD(v)})` : 'BCNF'}`; }).join('; ')}.</p>`;
    out.push(card('Kiểm tra phân rã', body, ok(lossless, 'Lossless', 'Lossy')));
  }
  return out.join('');
}

function viewFd(params) {
  const saved = store.get('fd:input', null);
  const preset = FD_PRESETS[Number(params.get('preset'))];
  const input = preset || saved || FD_PRESETS[0];
  main.innerHTML = pageHead('Phụ thuộc hàm (FD)', `Công cụ · Chương 7 · ${num(FD_PRESETS.length)} ví dụ có sẵn`,
    leadP('Bao đóng thuộc tính, candidate key, canonical cover, kiểm tra BCNF/3NF, phân rã BCNF và 3NF, lossless và bảo toàn phụ thuộc. Hãy làm tay trước, rồi dùng công cụ để đối chiếu từng bước.')) + `
    <div class="lx-fdgrid">
    <div class="lx-card lx-fdin"><div class="lx-card__head"><h2 class="lx-h2">Đầu vào</h2>
      <select class="lx-select" id="fdPreset" aria-label="Ví dụ có sẵn"><option value="">Ví dụ có sẵn…</option>${FD_PRESETS.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="lx-card__body lx-fd-form">
        <label>Lược đồ R <span class="lx-subtle">Viết liền nếu mỗi thuộc tính là một chữ cái (ABCDE), hoặc phân cách bằng dấu phẩy</span>
          <span class="lx-field"><input class="lx-editor" id="fdR" spellcheck="false" value="${esc(input.R)}"></span></label>
        <label>Tập phụ thuộc hàm F <span class="lx-subtle">Mỗi dòng một FD, dạng <code class="lx-code">A -> BC</code> hoặc <code class="lx-code">ID, x -> name</code></span>
          <span class="lx-field"><textarea class="lx-editor" id="fdF" spellcheck="false" style="min-height:132px">${esc(input.F)}</textarea></span></label>
        <label>Tính bao đóng của α <span class="lx-subtle">Tuỳ chọn</span><span class="lx-field"><input class="lx-editor" id="fdAlpha" spellcheck="false" value="${esc(input.alpha || '')}"></span></label>
        <label>Kiểm tra một phân rã <span class="lx-subtle">Tuỳ chọn, mỗi dòng một lược đồ</span><span class="lx-field"><textarea class="lx-editor" id="fdDecomp" spellcheck="false" style="min-height:76px">${esc(input.decomp || '')}</textarea></span></label>
      </div>
      <div class="lx-card__foot"><span>Kết quả cập nhật khi bạn gõ</span><button class="lx-btn lx-btn--primary" id="fdRun" type="button">${icon('play')} Phân tích</button></div></div>
    <div class="lx-stack" id="fdOut" aria-live="polite"></div></div>`;
  const read = () => ({ R: $('#fdR').value, F: $('#fdF').value, alpha: $('#fdAlpha').value, decomp: $('#fdDecomp').value });
  const render = () => {
    const value = read();
    store.set('fd:input', value);
    try { $('#fdOut').innerHTML = fdReport(value); }
    catch (e) { $('#fdOut').innerHTML = callout('danger', esc(e.message)); }
  };
  let timer = null;
  ['#fdR', '#fdF', '#fdAlpha', '#fdDecomp'].forEach(sel => $(sel).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); }));
  $('#fdRun').addEventListener('click', render);
  $('#fdPreset').addEventListener('change', e => {
    const p = FD_PRESETS[Number(e.target.value)];
    if (!p || e.target.value === '') return;
    $('#fdR').value = p.R; $('#fdF').value = p.F; $('#fdAlpha').value = p.alpha || ''; $('#fdDecomp').value = p.decomp || '';
    render();
  });
  render();
}

// Tab inserts spaces; Ctrl+Enter runs; Ctrl+Shift+Enter checks.
function bindEditorKeys(editor, onRun, onCheck) {
  editor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey && onCheck) onCheck(); else onRun();
    } else if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: t } = editor;
      editor.setRangeText('  ', s, t, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  });
}

// ======================================================================
// Router
// ======================================================================
function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, query] = hash.split('?');
  renderNav(path);
  const bare = path.match(/^\/([\w-]+)$/);
  const bareCh = bare && DATA.chapters.find(c => c.key === bare[1]);
  if (bareCh) { location.replace(stepHref(bareCh, stepsOf(bareCh)[0].key)); return; }
  const m = path.match(/^\/([\w-]+)\/(summary|quiz|questions|ex)(?:\/([\w.-]+))?$/);
  const ch = m && DATA.chapters.find(c => c.key === m[1]);
  if (ch && !stepsOf(ch).some(s => s.key === m[2])) { location.replace(stepHref(ch, stepsOf(ch)[0].key)); return; }
  if (ch) {
    renderContext(ch);
    ({ summary: viewSummary, quiz: viewQuiz, questions: viewQuestions, ex: c => viewExercise(c, m[3]) })[m[2]](ch);
  } else if (path === '/sandbox') {
    renderContext(null);
    const table = new URLSearchParams(query || '').get('table');
    viewSandbox(table ? `select * from ${table};` : undefined);
  } else if (path === '/schema') {
    renderContext(null);
    viewSchema();
  } else if (path === '/fd' && DATA.part.fdTool) {
    renderContext(null);
    viewFd(new URLSearchParams(query || ''));
  } else {
    renderContext(null);
    viewHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
getShared().catch(err => console.error(err));
</script>
