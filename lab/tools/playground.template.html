<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* ---------- LabelX design tokens (light) ---------- */
  :root {
    --canvas: #f7f7f8;
    --surface: #ffffff;
    --surface-sunken: #f3f4f6;
    --surface-selected: #eef0f3;
    --hover: rgba(17,24,39,.045);
    --selected: #e8e9ec;
    --accent: #9d2235;
    --accent-soft: #f7ebed;
    --border: #e3e6ea;
    --border-strong: #8c93a0;
    --ink: #1a1d23;
    --ink-muted: #4b5262;
    --ink-subtle: #5f6570;
    --primary: #1f2933;
    --primary-hover: #38424f;
    --on-primary: #ffffff;
    --focus: #1f2933;
    --success: #146c43;
    --success-soft: #e6f4ec;
    --warning: #8a5300;
    --warning-soft: #fdf2d8;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --info: #1d5ea8;
    --info-soft: #e7effa;
    --neutral: #475061;
    --neutral-soft: #eceef2;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 999px;
    --shadow-menu: 0 8px 24px rgba(17,24,39,0.12);
    --sidebar-width: 264px; --control-height: 32px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--ink); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- App shell: sidebar on the page ground, content beside it ---------- */
  .lx-app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
  .lx-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--space-4);
    padding: var(--space-4) var(--space-3) var(--space-3); border-right: 1px solid var(--border); background: var(--canvas); }
  .lx-brand { display: flex; align-items: center; gap: 10px; padding: var(--space-1) var(--space-2); color: var(--ink); text-decoration: none; }
  .lx-brand__mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent); color: #fff; }
  .lx-brand__mark svg { width: 16px; height: 16px; }
  .lx-brand__name { font: 600 14px/18px var(--font-sans); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-4); margin: 0 calc(-1 * var(--space-1)); padding: 0 var(--space-1); }
  .lx-nav__group { display: flex; flex-direction: column; gap: 2px; }
  .lx-nav__label { padding: 0 var(--space-2) var(--space-1); font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav__item { display: flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); border-radius: var(--radius-md);
    color: var(--ink-muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--ink); }
  .lx-nav__item.is-active { background: var(--selected); color: var(--ink); font-weight: 600; }
  .lx-nav__item svg.i { color: var(--ink-subtle); }
  .lx-nav__k { flex: none; width: 44px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k { color: var(--ink-muted); }
  .lx-nav__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart > summary { display: flex; width: 100%; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); margin: 0;
    border-radius: var(--radius-md); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); }
  .lx-navpart > summary:hover { background: var(--hover); color: var(--ink); }
  .lx-navpart.is-current > summary { color: var(--ink); font-weight: 600; }
  .lx-navpart > summary svg.i { margin-left: auto; width: 12px; height: 12px; color: var(--ink-subtle); }
  .lx-navpart[open] > summary { margin-bottom: 2px; }
  .lx-navpart__n { flex: none; width: 44px; }
  .lx-navpart__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart__items { display: flex; flex-direction: column; gap: 2px; margin: 0 0 var(--space-2) var(--space-3); padding-left: var(--space-2); border-left: 1px solid var(--border); }
  .lx-sidebar__foot { border-top: 1px solid var(--border); padding-top: var(--space-3); }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- Database signal: green when PostgreSQL is ready ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 var(--space-2);
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 500 13px/1 var(--font-sans); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--ink); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--border-strong); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--success); }
  [data-state="error"] .lx-signal__dot { background: var(--danger); }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lx-pop { position: absolute; bottom: calc(100% + 6px); left: 0; width: 360px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--surface); color: var(--ink); text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop {
    opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-pop__title { font-weight: 600; }
  .lx-pop__body { padding: var(--space-3) var(--space-4); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
  .lx-pop__body p { margin: 0 0 var(--space-2); }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 var(--space-2); }
  .lx-pop__body code { font: 500 12px/1 var(--font-mono); color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--space-3); margin: 0 0 var(--space-2); }
  .lx-pop__body .lx-kv dt { color: var(--ink-subtle); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--ink); font-weight: 500; }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: 10px var(--space-4); border-top: 1px solid var(--border); }

  /* ---------- Motion ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-navpart > summary, .lx-flow__step a, .lx-flow__n, .lx-list > li > a, .lx-opt,
  .lx-table td, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .lx-iconbtn::after { transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { transform: none; }
  details > summary svg.i { transition: transform .2s ease, opacity .2s ease; }
  .lx-progress > i { transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-fade-up .22s ease-out; }
  .lx-page.is-entering { animation: lx-fade-up .24s ease-out; }
  @keyframes lx-fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- Page ---------- */
  .lx-page { max-width: 1200px; margin: 0 auto; padding: var(--space-8) var(--space-8) 64px; display: flex; flex-direction: column; gap: var(--space-6); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
  .lx-head__text { flex: 1 1 520px; max-width: 840px; }
  .lx-eyebrow { font: 400 13px/18px var(--font-sans); color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .lx-h1 { margin: 0 0 6px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .lx-lead { margin: 0; color: var(--ink-muted); }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .lx-cols { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .lx-main { flex: 999 1 560px; min-width: 0; }
  .lx-side { flex: 1 1 320px; min-width: 0; max-width: 100%; overflow: hidden; }
  .lx-subtle { color: var(--ink-subtle); }
  .lx-mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .lx-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-3);
    border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    font: 500 13px/1 var(--font-sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--surface-sunken); }
  .lx-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-btn--primary:hover { background: var(--primary-hover); }
  .lx-btn--ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .lx-btn--ghost:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-btn[disabled] { opacity: .45; cursor: not-allowed; }
  .lx-btn .lx-kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--ink-muted); cursor: pointer; text-decoration: none; }
  .lx-iconbtn:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 2px); right: 0; white-space: nowrap; padding: 4px 8px;
    border-radius: 4px; background: var(--primary); color: var(--on-primary); font: 500 12px/16px var(--font-sans); opacity: 0; pointer-events: none; z-index: 10; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; }

  /* ---------- Badges & tags ---------- */
  .lx-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-sm);
    font: 500 12px/1 var(--font-sans); white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
  .lx-badge--success { background: var(--success-soft); color: var(--success); }
  .lx-badge--warning { background: var(--warning-soft); color: var(--warning); }
  .lx-badge--danger { background: var(--danger-soft); color: var(--danger); }
  .lx-badge--info { background: var(--info-soft); color: var(--info); }
  .lx-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--neutral-soft);
    color: var(--neutral); font: 500 12px/1 var(--font-sans); white-space: nowrap; }

  /* ---------- Card, table, list ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-card__body { padding: var(--space-4); }
  .lx-card__foot { padding: 10px var(--space-4); border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-subtle); display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }
  .lx-card > .lx-scroll:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 10px var(--space-4) 8px; color: var(--ink-subtle);
    font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table tbody tr:hover td { background: var(--surface-sunken); }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table .act { width: 1%; text-align: right; padding-top: 0; padding-bottom: 0; }
  .lx-cell__main { font-weight: 600; color: var(--ink); text-decoration: none; }
  a.lx-cell__main:hover { text-decoration: underline; }
  .lx-cell__sub { font-size: 12px; line-height: 16px; color: var(--ink-subtle); margin-top: 2px; }
  .lx-table--data td, .lx-table--data th { font-family: var(--font-mono); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: pre; padding: 8px var(--space-4); }
  .lx-table--data th { font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); }
  .lx-null { color: var(--ink-subtle); font-style: italic; }

  .lx-list { list-style: none; margin: 0; padding: 0; }
  .lx-list > li > a { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border); text-decoration: none; color: var(--ink); }
  .lx-list > li:last-child > a { border-bottom: 0; }
  .lx-list > li > a:hover { background: var(--surface-sunken); }
  .lx-list > li[aria-selected="true"] > a { background: var(--selected); font-weight: 600; }
  .lx-list__id { font: 500 12px/16px var(--font-mono); width: 36px; flex: none; }
  .lx-list__t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-list--scroll { max-height: 640px; overflow-y: auto; }

  .lx-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lx-kpi { padding: var(--space-4) var(--space-6) 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--border); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .lx-kpi__v { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .lx-kpi__u { font-size: 15px; font-weight: 500; color: var(--ink-subtle); letter-spacing: 0; }
  .lx-kpi__n { font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-kpi .lx-progress { margin-top: 4px; }
  .lx-dash { color: var(--ink-subtle); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Fifteen weeks of the course: this part's weeks tinted, exam weeks marked */
  .lx-weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: var(--space-4); }
  .lx-week { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 64px; padding: 8px 10px; border-radius: var(--radius-md);
    background: var(--surface-sunken); color: var(--ink-muted); font-size: 12px; line-height: 16px; }
  .lx-week__n { font-weight: 600; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lx-week.is-on { background: var(--accent-soft); color: var(--ink-muted); box-shadow: inset 0 -2px 0 var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--accent); }
  .lx-week.is-exam { background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
  .lx-week.is-exam strong { font-weight: 600; }
  .lx-progress { height: 6px; border-radius: 3px; background: var(--neutral-soft); overflow: hidden; min-width: 96px; }
  .lx-progress > i { display: block; height: 100%; background: var(--accent); }

  .lx-callout { border-radius: var(--radius-lg); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--info-soft); color: var(--ink); }
  .lx-callout--success { background: var(--success-soft); }
  .lx-callout--warning { background: var(--warning-soft); }
  .lx-callout--danger { background: var(--danger-soft); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Flow navigation (Tóm tắt → Trắc nghiệm → Tự luận → Bài tập) ---------- */
  .lx-flow { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3) 0 var(--space-4); min-height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-flow__k { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); padding-right: var(--space-4); border-right: 1px solid var(--border); white-space: nowrap; }
  .lx-flow__arrow { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .lx-flow__arrow.is-off { opacity: .35; pointer-events: none; }
  .lx-flow__arrow::after { bottom: auto; top: calc(100% + 4px); right: auto; left: 0; }
  .lx-flow__arrow--next::after { left: auto; right: 0; }
  .lx-flow__steps { flex: 1; display: flex; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-flow__step a { border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); color: var(--ink-muted); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .lx-flow__step a:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-flow__step.is-active a { background: var(--surface-selected); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
  .lx-flow__n { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: 11px; line-height: 1; }
  .lx-flow__step.is-active .lx-flow__n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-flow__sep { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
  .lx-flow__pos { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }

  /* ---------- Reading content (summaries, answers) ---------- */
  .lx-prose { color: var(--ink); line-height: 22px; }
  .lx-prose h3 { font-size: 15px; line-height: 22px; font-weight: 600; margin: var(--space-6) 0 var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .lx-prose h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .lx-prose p { margin: var(--space-2) 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: var(--space-2) 0; }
  .lx-prose li { margin: var(--space-1) 0; }
  .lx-prose code { font: 500 12.5px/1 var(--font-mono); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-prose strong { font-weight: 600; }
  .lx-prose .table-scroll { overflow-x: auto; margin: var(--space-3) 0; border: 1px solid var(--border); border-radius: var(--radius-md); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px var(--space-3); color: var(--ink-subtle); font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px var(--space-3); border-bottom: 1px solid var(--border); vertical-align: top; }
  .lx-prose tr:last-child td { border-bottom: 0; }
  pre.code { font: 500 12.5px/1.6 var(--font-mono); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); overflow-x: auto; margin: var(--space-3) 0; }
  pre.code code { background: none; border: 0; padding: 0; font: inherit; }
  details > summary { cursor: pointer; font-weight: 600; color: var(--ink); list-style: none; display: inline-flex; align-items: center; gap: var(--space-2); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary svg.i { width: 12px; height: 12px; transition: transform .15s; }
  details[open] > summary svg.i { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: var(--space-2); }

  /* ---------- Quiz ---------- */
  .lx-q__opts { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
  .lx-opt { border-radius: var(--radius-md); display: flex; gap: var(--space-3); align-items: flex-start; padding: 10px var(--space-3); border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .lx-opt:hover { border-color: var(--border-strong); }
  .lx-opt input { margin: 3px 0 0; accent-color: var(--primary); }
  .lx-opt.is-right { border-color: var(--success); background: var(--success-soft); }
  .lx-opt.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
  .lx-q__explain { margin-top: var(--space-3); color: var(--ink-muted); }

  /* ---------- Editor ---------- */
  .lx-editor { width: 100%; min-height: 180px; resize: vertical; display: block;
    font: 500 13px/1.6 var(--font-mono); tab-size: 2; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .lx-editor::placeholder { color: var(--ink-subtle); }
  .lx-editor:focus { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- FD tool ---------- */
  .lx-fd-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-input { min-height: 0; height: 40px; resize: none; }
  .lx-fd-row { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-fd-select { height: 32px; max-width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; padding: 0 8px; }

  /* Phone and narrow tablet: a 48px top bar, the sidebar becomes a full-screen sheet */
  @media (max-width: 900px) {
    .lx-app { display: block; }
    .lx-mbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: var(--space-2); height: 48px; padding: 0 var(--space-2);
      background: var(--canvas); border-bottom: 1px solid var(--border); }
    .lx-mbar .lx-brand__mark { width: 24px; height: 24px; }
    .lx-mbar__title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .lx-sidebar { display: none; position: fixed; inset: 48px 0 0; z-index: 24; height: auto; border-right: 0; padding: var(--space-4); }
    .lx-app.is-navopen .lx-sidebar { display: flex; }
    .lx-app.is-navopen { overflow: hidden; }
    .lx-sidebar > .lx-brand { display: none; }
    .lx-nav__item, .lx-navpart > summary, .lx-signal { min-height: 44px; font-size: 15px; }
    .lx-pop { width: 100%; }
    .lx-page { padding: var(--space-4) var(--space-4) 48px; gap: var(--space-4); }
    .lx-kpi { padding: var(--space-3); }
    .lx-kpi__v { font-size: 22px; line-height: 28px; }
    .lx-kpi__u { font-size: 13px; }
    .lx-kpi__n { display: none; }
    .lx-weeks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lx-flow__k, .lx-flow__pos { display: none; }
  }
</style>
</head>

<div class="lx-app" id="app">
  <header class="lx-mbar">

<script id="data" type="application/json">"__DATA__"</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

/*__ENGINE__*/

// ======================================================================
// Data & storage
// ======================================================================
const DATA = JSON.parse(document.getElementById('data').textContent);
const EXERCISES = new Map();
for (const ch of DATA.chapters) for (const ex of ch.exercises) EXERCISES.set(ex.id, { ...ex, chapter: ch.key });
const STORE_PREFIX = DATA.part.storage + ':';
const CORE_COUNT = DATA.schemaGroups.filter(g => g.core).reduce((n, g) => n + g.tables.length, 0);
const TABLE_COUNT = DATA.schemaGroups.reduce((n, g) => n + g.tables.length, 0);
const TOTAL_EXERCISES = EXERCISES.size;

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(STORE_PREFIX + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = sel => document.querySelector(sel);
const LEVELS = ['', 'Cơ bản', 'Trung bình', 'Nâng cao'];
const STEPS = [
  { key: 'summary', label: 'Tóm tắt kiến thức' },
  { key: 'quiz', label: 'Trắc nghiệm' },
  { key: 'questions', label: 'Câu hỏi tự luận' },
  { key: 'ex', label: 'Bài tập SQL' },
];

// 16px line icons, 1.5px stroke, one icon per meaning.
const ICON = {
  open: '<path d="M3 8h10M9 4l4 4-4 4"/>',
  back: '<path d="M13 8H3M7 4L3 8l4 4"/>',
  chevron: '<path d="M4 6l4 4 4-4"/>',
  caret: '<path d="M6 4l4 4-4 4"/>',
  play: '<path d="M5 3.5v9l7-4.5z"/>',
  check: '<path d="M3 8.5l3 3 7-7"/>',
  terminal: '<path d="M2.5 3.5h11v9h-11z"/><path d="M5 6.5l2 1.5-2 1.5M8.5 10H11"/>',
  table: '<path d="M2.5 3.5h11v9h-11zM2.5 6.5h11M6.5 6.5v6"/>',
  reset: '<path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2.5v3h3"/>',
  eye: '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>',
  key: '<circle cx="5" cy="8" r="2.5"/><path d="M7.5 8h6M11.5 8v2"/>',
  copy: '<path d="M5.5 5.5h8v8h-8z"/><path d="M10.5 5.5v-3h-8v8h3"/>',
  calendar: '<path d="M2.5 4h11v9.5h-11zM2.5 7h11M5.5 2.5v3M10.5 2.5v3"/>',
  menu: '<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>',
};
const icon = name => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICON[name]}</svg>`;

// ======================================================================
// Database
// ======================================================================
// ---- Signal: dot lit when the shared database is ready, off otherwise ----
const signalEl = $('#signal');
const signalBtn = signalEl.querySelector('.lx-signal');
const signalLabel = $('#signalLabel');
const signalPop = $('#signalPop');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const signal = { state: 'loading', startedAt: performance.now(), loadMs: null, error: null };
const SIGNAL_LABEL = {
  loading: 'Đang khởi động PostgreSQL',
  reloading: 'Đang nạp lại dữ liệu',
  ready: 'PostgreSQL sẵn sàng',
  error: 'PostgreSQL không có tín hiệu',
};

const START_STEPS = `<ol>
  <li>Lần mở đầu tiên cần Internet: trình duyệt tải PostgreSQL (khoảng 16 MB) từ <code>cdn.jsdelivr.net</code>, các lần sau dùng cache.</li>
  <li>Nếu trình duyệt chặn trang mở trực tiếp từ ổ đĩa, trong thư mục <code>lab</code> chạy <code>npm run serve</code> rồi mở <code>http://localhost:4420</code>.</li>
  <li>Tải lại trang. Đèn sáng xanh là đã sẵn sàng.</li>
</ol>`;

function signalPopHtml() {
  const s = signal.state;
  if (s === 'ready') {
    return `<div class="lx-pop__head"><span class="lx-pop__title">PostgreSQL đang chạy</span><span class="lx-badge lx-badge--success">Sẵn sàng</span></div>
      <div class="lx-pop__body">
        <dl class="lx-kv"><dt>Engine</dt><dd>PostgreSQL trong trình duyệt (PGlite 0.5.8)</dd>
          <dt>Database</dt><dd>${CORE_COUNT ? `University: ${CORE_COUNT} bảng của sách, ${TABLE_COUNT - CORE_COUNT} bảng phụ` : `${TABLE_COUNT} bảng`}</dd>
          <dt>Khởi động</dt><dd>${(signal.loadMs / 1000).toFixed(1)} giây</dd></dl>
        <p>Không cần cài server. Bài tập chạy trong một transaction rồi <code>rollback</code>, nên dữ liệu gốc không đổi.</p>
        <p style="margin:0">Chạy ngoài trình duyệt: <code>npm run sql</code> mở SQL shell, <code>npm run grade -- ${esc(DATA.chapters[0].key)}</code> chấm file <code>my_answers.sql</code> (trong thư mục <code>lab</code>).</p>
      </div>`;
  }
  if (s === 'error') {
    const offline = navigator.onLine === false;
    return `<div class="lx-pop__head"><span class="lx-pop__title">Chưa kết nối được PostgreSQL</span><span class="lx-badge lx-badge--danger">Không có tín hiệu</span></div>
      <div class="lx-pop__body">
        <p>${offline ? 'Máy đang offline.' : `Lỗi: ${esc(signal.error || 'không tải được PGlite')}`}</p>
        <p style="margin-bottom:4px;color:var(--ink)"><strong>Cách khởi động</strong></p>${START_STEPS}
      </div>
      <div class="lx-pop__foot"><button class="lx-btn lx-btn--primary" type="button" id="signalRetry">${icon('reset')} Thử kết nối lại</button></div>`;
  }
  const secs = Math.round((performance.now() - signal.startedAt) / 1000);
  return `<div class="lx-pop__head"><span class="lx-pop__title">${SIGNAL_LABEL[s]}</span><span class="lx-badge lx-badge--info">Đang tải</span></div>
    <div class="lx-pop__body">
      <p>Đã chờ ${secs} giây. Nếu đèn chưa sáng sau khoảng 30 giây, kiểm tra theo các bước:</p>${START_STEPS}
    </div>`;
}

function renderSignalPop() {
  signalPop.innerHTML = signalPopHtml();
  $('#signalRetry')?.addEventListener('click', e => {
    e.stopPropagation();
    getShared().catch(() => {});
  });
}

function setSignal(state, info = {}) {
  const changed = signal.state !== state;
  Object.assign(signal, { state }, info);
  if (state === 'loading' || state === 'reloading') signal.startedAt = performance.now();
  signalEl.classList.toggle('is-ready', state === 'ready');
  signalEl.dataset.state = state;
  signalLabel.textContent = SIGNAL_LABEL[state];
  signalBtn.setAttribute('aria-label', SIGNAL_LABEL[state]);
  if (changed && !reduceMotion.matches) {
    signalLabel.animate([{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  }
  renderSignalPop();
}

// Hover and keyboard focus open the guide via CSS; a click pins it (touch screens).
signalBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = !signalEl.classList.contains('is-open');
  signalEl.classList.toggle('is-open', open);
  signalBtn.setAttribute('aria-expanded', String(open));
});
signalEl.addEventListener('mouseenter', () => { if (signal.state !== 'ready' && signal.state !== 'error') renderSignalPop(); });
document.addEventListener('click', e => {
  if (!signalEl.contains(e.target)) { signalEl.classList.remove('is-open'); signalBtn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && signalEl.classList.contains('is-open')) { signalEl.classList.remove('is-open'); signalBtn.focus(); }
});
setSignal('loading');

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

// ======================================================================
// Rendering helpers
// ======================================================================
function cell(v) {
  if (v === null || v === undefined) return '<span class="lx-null">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function tableHtml(table, title, limit = 200) {
  const rows = table.rows.slice(0, limit);
  const n = table.rows.length;
  return `<div class="lx-card">
    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-tag">${n.toLocaleString('en-US')} dòng</span></div>` : ''}
    <div class="lx-scroll"><table class="lx-table lx-table--data"><thead><tr>${table.fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${table.fields.length}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-card lx-card__body lx-mono lx-subtle">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

function pageHead(eyebrow, title, lead, actions = '') {
  return `<div class="lx-head"><div class="lx-head__text">${eyebrow ? `<div class="lx-eyebrow">${eyebrow}</div>` : ''}
    <h1 class="lx-h1">${title}</h1>${lead ? `<p class="lx-lead">${lead}</p>` : ''}</div>
    ${actions ? `<div class="lx-actions">${actions}</div>` : ''}</div>`;
}

// ======================================================================
// Progress
// ======================================================================
const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const tried = ch.exercises.filter(ex => exStatus(ex.id)).length;
  return { passed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null) };
}
function exBadge(id) {
  const s = exStatus(id);
  if (s === 'pass') return '<span class="lx-badge lx-badge--success">Đã đúng</span>';
  if (s === 'fail') return '<span class="lx-badge lx-badge--warning">Chưa đúng</span>';
  return '<span class="lx-badge">Chưa làm</span>';
}
function chapterBadge(p) {
  if (p.passed === p.total && p.quiz) return '<span class="lx-badge lx-badge--success">Hoàn thành</span>';
  if (p.tried || p.quiz) return '<span class="lx-badge lx-badge--info">Đang học</span>';
  return '<span class="lx-badge">Chưa bắt đầu</span>';
}

// ======================================================================
// Sidebar: every part with its sections, then the tools
// ======================================================================
const nav = $('#nav');
const app = $('#app');
const menuBtn = $('#menuBtn');
// Same part: a hash route. Another part: its own playground page.
const partHref = (p, hash = '') => (p.number === DATA.part.number ? hash || '#/' : `../${p.slug}/playground.html${hash}`);

function renderNav(path) {
  const chMatch = path.match(/^\/([\w-]+)\/(?:summary|quiz|questions|ex)/);
  const here = chMatch ? chMatch[1] : null;
  const item = (href, html, on, title = '') =>
    `<a class="lx-nav__item${on ? ' is-active' : ''}" href="${href}"${on ? ' aria-current="page"' : ''}${title ? ` title="${esc(title)}"` : ''}>${html}</a>`;
  const parts = DATA.parts.map(p => {
    const cur = p.number === DATA.part.number;
    const items = [
      item(partHref(p), '<span class="lx-nav__t">Tổng quan</span>', cur && path === '/'),
      ...p.chapters.map(c => item(partHref(p, `#/${c.key}/summary`),
        `<span class="lx-nav__k">${esc(c.navLabel.replace(/^Chương /, 'Ch '))}</span><span class="lx-nav__t">${esc(c.titleVi)}</span>`,
        cur && here === c.key, `${c.label} — ${c.titleVi}`)),
    ];
    return `<details class="lx-navpart${cur ? ' is-current' : ''}"${cur ? ' open' : ''}>
      <summary><span class="lx-navpart__n">${esc(p.short)}</span><span class="lx-navpart__t">${esc(p.title.replace(/^Part \d+\s*[—-]\s*/, ''))}</span>${icon('caret')}</summary>
      <div class="lx-navpart__items">${items.join('')}</div></details>`;
  }).join('');
  const tools = [
    item('#/sandbox', `${icon('terminal')}<span class="lx-nav__t">SQL tự do</span>`, path === '/sandbox'),
    item('#/schema', `${icon('table')}<span class="lx-nav__t">Lược đồ cơ sở dữ liệu</span>`, path === '/schema'),
    DATA.part.fdTool ? item('#/fd', `${icon('key')}<span class="lx-nav__t">Phụ thuộc hàm (FD)</span>`, path === '/fd') : '',

function flowNav(ch, stepKey) {
  const i = STEPS.findIndex(s => s.key === stepKey);
  const href = s => s.key === 'ex' ? `#/${ch.key}/ex/${ch.exercises[0].id}` : `#/${ch.key}/${s.key}`;
  const prev = STEPS[i - 1], next = STEPS[i + 1];
  return `<nav class="lx-flow" aria-label="Các bước học ${esc(ch.label)}">
    <span class="lx-flow__k">${esc(ch.label)}</span>
    <a class="lx-iconbtn lx-flow__arrow${prev ? '' : ' is-off'}" ${prev ? `href="${href(prev)}"` : 'aria-disabled="true"'} data-tip="${prev ? `Về bước trước: ${prev.label}` : 'Đây là bước đầu'}" aria-label="${prev ? `Về bước trước: ${prev.label}` : 'Đây là bước đầu'}">${icon('back')}</a>
    <ol class="lx-flow__steps">${STEPS.map((s, j) => `${j ? `<svg class="lx-flow__sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4"/></svg>` : ''}
      <li class="lx-flow__step${j === i ? ' is-active' : ''}"><a href="${href(s)}"${j === i ? ' aria-current="step"' : ''}><span class="lx-flow__n">${j + 1}</span>${s.label}</a></li>`).join('')}</ol>
    <span class="lx-flow__pos">Bước ${i + 1}/${STEPS.length}</span>
    <a class="lx-iconbtn lx-flow__arrow lx-flow__arrow--next${next ? '' : ' is-off'}" ${next ? `href="${href(next)}"` : 'aria-disabled="true"'} data-tip="${next ? `Sang bước sau: ${next.label}` : 'Đây là bước cuối'}" aria-label="${next ? `Sang bước sau: ${next.label}` : 'Đây là bước cuối'}">${icon('open')}</a>
  </nav>`;
}

function chapterPage(ch, step, lead, actions = '') {
  return pageHead(`${esc(ch.label)} · ${esc(ch.title)}`, esc(ch.titleVi), lead, actions) + flowNav(ch, step);
}

}

function viewQuiz(ch) {
  const saved = store.get('quiz:' + ch.store, null);
  main.innerHTML = chapterPage(ch, 'quiz', `${ch.quiz.length} câu, mỗi câu một đáp án đúng. ${saved ? `Điểm cao nhất của bạn: ${saved.best}/${ch.quiz.length}.` : 'Chưa làm lần nào.'}`) + `
    <form id="quiz" class="lx-stack">${ch.quiz.map((q, i) => `
      <fieldset class="lx-card" data-i="${i}" style="margin:0;padding:0">
        <div class="lx-card__head"><legend class="lx-h2" style="float:left;padding:0">Câu ${i + 1}</legend><span class="lx-q__state"></span></div>
        <div class="lx-card__body lx-prose">
          <div>${q.q}</div>
          <div class="lx-q__opts">${q.options.map((o, j) => `
            <label class="lx-opt"><input type="radio" name="q${i}" value="${j}"><span><strong>${'ABCD'[j]}.</strong> ${o}</span></label>`).join('')}
          </div>
          <div class="lx-q__explain" hidden></div>
        </div>
      </fieldset>`).join('')}
      <div class="lx-card"><div class="lx-card__foot" style="border-top:0">
        <span id="score" role="status">Chọn đáp án cho từng câu rồi nộp bài.</span>
        <div class="lx-actions"><button class="lx-btn" type="button" id="retry">${icon('reset')} Làm lại</button><button class="lx-btn lx-btn--primary" type="submit">${icon('check')} Nộp bài</button></div>
      </div></div>
    </form>`;
  const form = $('#quiz');
  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    ch.quiz.forEach((q, i) => {
      const box = form.querySelector(`[data-i="${i}"]`);
      const picked = form.querySelector(`input[name="q${i}"]:checked`);
      const ok = picked && Number(picked.value) === q.answer;
      box.querySelectorAll('.lx-opt').forEach((l, j) => {
        l.classList.toggle('is-right', j === q.answer);
        l.classList.toggle('is-wrong', !!picked && Number(picked.value) === j && j !== q.answer);
      });
      if (ok) score++;
      box.querySelector('.lx-q__state').innerHTML = ok
        ? '<span class="lx-badge lx-badge--success">Đúng</span>'
        : picked ? '<span class="lx-badge lx-badge--danger">Sai</span>' : '<span class="lx-badge">Bỏ trống</span>';
      const ex = box.querySelector('.lx-q__explain');
      ex.hidden = false;
      ex.innerHTML = `<strong>Đáp án ${'ABCD'[q.answer]}.</strong> ${q.explain}`;
    });
    const best = Math.max(score, saved?.best ?? 0);
    store.set('quiz:' + ch.store, { best, last: score });
    $('#score').innerHTML = `Kết quả: <strong>${score}/${ch.quiz.length}</strong> (${(100 * score / ch.quiz.length).toFixed(1)}%). Điểm cao nhất: ${best}/${ch.quiz.length}.`;
    renderContext(ch);
  });
  $('#retry').addEventListener('click', () => viewQuiz(ch));
}

  const code = store.get('code:' + ex.id, '');
  const p = chapterProgress(ch);

  main.innerHTML = chapterPage(ch, 'ex', 'Viết câu SQL, chạy để xem kết quả, rồi kiểm tra với đáp án.') + `
    <div class="lx-cols">
      <section class="lx-main lx-stack">
        <div class="lx-card">
          <div class="lx-card__head">
            <div class="lx-actions">
              <h2 class="lx-h2 lx-mono" style="font-size:15px">Bài ${ex.id}</h2>

              <span class="lx-tag">${LEVELS[ex.level]}</span>

              ${ex.fresh ? '<span class="lx-tag" title="Chạy trên database mới, được dùng begin/commit/rollback">Database mới</span>' : ''}

          </div>
          <div class="lx-card__body lx-stack">
            <div class="lx-prose">${ex.prompt}</div>
            ${ex.hint ? `<details><summary>${icon('caret')} Gợi ý</summary><div class="lx-prose">${ex.hint}</div></details>` : ''}
            <div>
              <label for="editor" class="lx-eyebrow" style="display:block">Câu trả lời</label>
              <textarea class="lx-editor" id="editor" spellcheck="false" placeholder="-- Viết câu SQL của bạn ở đây">${esc(code)}</textarea>
            </div>
          </div>
          <div class="lx-card__foot">
            <div class="lx-actions">
              <button class="lx-btn lx-btn--ghost" id="showExpected">${icon('table')} Kết quả mong đợi</button>

            </div>

              <button class="lx-btn" id="run" title="Ctrl + Enter">${icon('play')} Chạy</button>
              <button class="lx-btn lx-btn--primary" id="check" title="Ctrl + Shift + Enter">${icon('check')} Kiểm tra</button>
            </div>
          </div>
        </div>
        <div id="feedback"></div>
        <div id="output" class="lx-stack"></div>
        <div class="lx-actions">
          ${prev ? `<a class="lx-btn" href="#/${ch.key}/ex/${prev.id}">${icon('back')} Bài ${prev.id}</a>` : ''}
          <span class="lx-spacer"></span>
          ${next ? `<a class="lx-btn" href="#/${ch.key}/ex/${next.id}">Bài ${next.id} ${icon('open')}</a>` : ''}
        </div>
      </section>
      <aside class="lx-side lx-card" aria-label="Danh sách bài tập">
        <div class="lx-card__head"><h2 class="lx-h2">Bài tập · ${esc(ch.label)}</h2><span class="lx-tag" id="exCount">${p.passed}/${p.total} đã đúng</span></div>
        <ul class="lx-list lx-list--scroll" id="exList">${ch.exercises.map(e => `
          <li${e.id === ex.id ? ' aria-selected="true"' : ''} data-id="${e.id}"><a href="#/${ch.key}/ex/${e.id}"${e.id === ex.id ? ' aria-current="true"' : ''}>

        </ul>
      </aside>

  $('#exList [aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  const editor = $('#editor');
  const feedback = $('#feedback'), output = $('#output');
  const buttons = ['#run', '#check'].map($);

  let saveTimer;
  editor.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('code:' + ex.id, editor.value), 300); });

    feedback.innerHTML = callout('info', 'Đang chạy…');

      const np = chapterProgress(ch);
      $('#exCount').textContent = `${np.passed}/${np.total} đã đúng`;
      renderContext(ch);
    } catch (e) {
      feedback.innerHTML = callout('danger', esc(e.message));
    }
    busy(false);
  });

  $('#showExpected').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = tableHtml(ex.expected, ex.check ? 'Kết quả mong đợi của câu kiểm tra' : 'Kết quả mong đợi') +
      (ex.check ? `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Câu truy vấn kiểm tra</h3></div><div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.check)}</code></pre></div></div>` : '');
  });

  $('#showSolution').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Đáp án tham khảo</h3>
        <button class="lx-iconbtn" id="useSolution" data-tip="Chép đáp án vào ô trả lời" aria-label="Chép đáp án vào ô trả lời">${icon('copy')}</button></div>
      <div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.solution)}</code></pre></div>
      <div class="lx-card__foot">Có thể có nhiều cách viết đúng khác.</div></div>`;
    $('#useSolution').addEventListener('click', () => { editor.value = ex.solution; store.set('code:' + ex.id, editor.value); editor.focus(); });
  });
}

    <div class="lx-card">
      <div class="lx-card__body"><label for="editor" class="lx-eyebrow" style="display:block">Câu lệnh SQL</label>
        <textarea class="lx-editor" id="editor" spellcheck="false" style="min-height:220px">${esc(code)}</textarea></div>
      <div class="lx-card__foot">
        <button class="lx-btn lx-btn--ghost" id="tables">${icon('table')} Liệt kê bảng</button>
        <button class="lx-btn lx-btn--primary" id="run" title="Ctrl + Enter">${icon('play')} Chạy</button>
      </div>
    </div>
    <div id="feedback"></div>
    <div id="output" class="lx-stack"></div>`;
  const editor = $('#editor'), output = $('#output'), feedback = $('#feedback');
  const run = async sql => {
    feedback.innerHTML = callout('info', 'Đang chạy…');
    const out = await serial(() => runForDisplay(sql, { persist: true }));
    feedback.innerHTML = '';
    output.innerHTML = resultsHtml(out);
  };
  editor.addEventListener('input', () => store.set('sandbox', editor.value));
  bindEditorKeys(editor, () => run(editor.value));
  $('#run').addEventListener('click', () => run(editor.value));
  $('#tables').addEventListener('click', () => run(`select table_name, table_type from information_schema.tables where table_schema = 'public' order by table_type, table_name;`));
  $('#reset').addEventListener('click', async () => {
    await serial(resetShared);
    feedback.innerHTML = callout('success', 'Đã nạp lại University database.');
    output.innerHTML = '';
  });
  if (initial) run(initial);
}

    DATA.schemaGroups.map(g => `<div class="lx-stack"><h2 class="lx-h2">${esc(g.title)}</h2>${g.note ? `<p class="lx-subtle" style="margin:0">${g.note}</p>` : ''}${section(g.tables)}</div>`).join('');
}

// ======================================================================
// Functional-dependency tool (Chapter 7)
// ======================================================================
const FD_PRESETS = [
  { name: 'PE 7.1, 7.6, 7.7, 7.13 — R(A,B,C,D,E)', R: 'ABCDE', F: 'A -> BC\nCD -> E\nB -> D\nE -> A', alpha: 'B', decomp: 'ABC\nADE' },
  { name: 'Slide — R(A,B,C,G,H,I), (AG)⁺', R: 'ABCGHI', F: 'A -> B\nA -> C\nCG -> H\nCG -> I\nB -> H', alpha: 'AG', decomp: '' },
  { name: 'Slide — canonical cover R(A,B,C)', R: 'ABC', F: 'A -> BC\nB -> C\nA -> B\nAB -> C', alpha: '', decomp: '' },
  { name: 'Slide — R = (A,B,C), A→B, B→C', R: 'ABC', F: 'A -> B\nB -> C', alpha: '', decomp: 'AB\nBC' },
  { name: 'PE 7.14 — nhiều canonical cover', R: 'XYZ', F: 'X -> YZ\nY -> XZ\nZ -> XY', alpha: '', decomp: '' },
  { name: 'PE 7.17 — nhiều phân rã BCNF', R: 'ABCD', F: 'A -> B\nC -> D\nB -> C', alpha: '', decomp: 'AB\nCD\nAC' },
  { name: 'in_dep (instructor ⋈ department)', R: 'ID, name, salary, dept_name, building, budget', F: 'ID -> name, salary, dept_name\ndept_name -> building, budget', alpha: 'dept_name', decomp: 'ID, name, salary, dept_name\ndept_name, building, budget' },
  { name: 'Lossy — employee tách theo name', R: 'ID, name, street, city, salary', F: 'ID -> name, street, city, salary', alpha: '', decomp: 'ID, name\nname, street, city, salary' },
  { name: 'dept_advisor — BCNF không bảo toàn FD', R: 's_ID, i_ID, dept_name', F: 'i_ID -> dept_name\ns_ID, dept_name -> i_ID', alpha: '', decomp: 's_ID, i_ID\ni_ID, dept_name' },
  { name: 'class — ví dụ phân rã BCNF', R: 'course_id, title, dept_name, credits, sec_id, semester, year, building, room_number, capacity, time_slot_id', F: 'course_id -> title, dept_name, credits\nbuilding, room_number -> capacity\ncourse_id, sec_id, semester, year -> building, room_number, time_slot_id', alpha: '', decomp: '' },
  { name: 'cust_banker_branch — ví dụ 3NF', R: 'customer_id, employee_id, branch_name, type', F: 'customer_id, employee_id -> type\nemployee_id -> branch_name\ncustomer_id, branch_name -> employee_id', alpha: '', decomp: '' },
];

function fdReport(input) {
  const { R, fds, letters, errors } = fdParse(input.R, input.F);
  if (!R.length) return callout('warning', 'Nhập lược đồ R trước.');
  if (errors.length) return callout('danger', errors.map(esc).join('<br>'));
  const A = xs => `<span class="lx-mono">${esc(fdFormat(xs, letters))}</span>`;
  const FD = f => `<span class="lx-mono">${esc(fdFormatFD(f, letters))}</span>`;
  const card = (title, body, tag = '') => `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${title}</h2>${tag}</div><div class="lx-card__body lx-prose">${body}</div></div>`;
  const ok = (yes, a, b) => `<span class="lx-badge lx-badge--${yes ? 'success' : 'warning'}">${yes ? a : b}</span>`;
  const out = [];

  const alpha = fdParseAttrs(input.alpha || '', letters).filter(a => R.includes(a));
  if (alpha.length) {
    const c = fdClosure(R, fds, alpha);
    out.push(card(`Bao đóng (${esc(fdFormat(alpha, letters))})⁺`, `<ol><li>result := ${A(alpha)}</li>${c.steps.map(s => `<li>Dùng ${FD(s.fd)}: thêm ${A(s.added)} → result = ${A(s.result)}</li>`).join('')}</ol>
      <p>Kết quả: (${A(alpha)})⁺ = ${A(c.result)}. ${c.result.length === R.length ? `${A(alpha)} là <strong>superkey</strong>.` : `Không phải superkey (thiếu ${A(R.filter(a => !c.result.includes(a)))}).`}</p>`));
  }

  const keys = fdCandidateKeys(R, fds);
  const prime = R.filter(a => keys.some(k => k.includes(a)));
  const bcnfBad = fdBcnfViolations(R, fds);
  const nf3Bad = fdThirdNFViolations(R, fds, keys);
  out.push(card('Khoá và dạng chuẩn của R', `<p>Candidate key: ${keys.map(A).join(', ')}.</p>
    <p>Thuộc tính khoá (prime): ${A(prime)}${prime.length < R.length ? `; không khoá: ${A(R.filter(a => !prime.includes(a)))}` : ''}.</p>
    <p>BCNF ${ok(!bcnfBad.length, 'Đạt', 'Không đạt')} ${bcnfBad.length ? `— vi phạm (vế trái không phải superkey): ${bcnfBad.map(FD).join(', ')}` : '— mọi FD không tầm thường trong F có vế trái là superkey.'}</p>
    <p>3NF ${ok(!nf3Bad.length, 'Đạt', 'Không đạt')} ${nf3Bad.length ? `— vi phạm (vế trái không phải superkey và vế phải có thuộc tính không khoá): ${nf3Bad.map(FD).join(', ')}` : '— mỗi FD có vế trái là superkey hoặc vế phải chỉ gồm thuộc tính khoá.'}</p>
    <p class="lx-subtle">Kiểm tra trên F đã cho là đủ cho lược đồ R ban đầu (slide 7.55, 7.62).</p>`));

  const cc = fdCover(R, fds, letters);
  out.push(card('Canonical cover F<sub>c</sub>', `${cc.log.length ? `<ol>${cc.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p>Không có vế trái trùng nhau và không có thuộc tính thừa: F<sub>c</sub> = F.</p>'}
    <p>F<sub>c</sub> = { ${cc.cover.map(FD).join('; ')} }</p><p class="lx-subtle">Canonical cover có thể không duy nhất (PE 7.14): thứ tự xét thuộc tính khác có thể cho kết quả khác nhưng tương đương.</p>`));

  const b = fdBcnfDecompose(R, fds);
  out.push(card('Phân rã BCNF', b.steps.length ? `<ol>${b.steps.map(s => `<li>${A(s.schema)} vi phạm BCNF do ${FD(s.fd)} (${A(s.fd.lhs)} không phải superkey của ${A(s.schema)}) → tách thành ${A(s.r1)} và ${A(s.r2)}</li>`).join('')}</ol>
    <p>Kết quả: ${b.result.map(x => `(${A(x)})`).join(', ')}</p>` : '<p>R đã ở BCNF, không cần tách.</p>',
    ok(b.result.length === 1 || fds.every(f => fdPreserved(R, fds, b.result, f)), 'Bảo toàn FD', 'Mất FD')));

  const t = fdThirdNFDecompose(R, fds, letters);
  const stepText = s => s.kind === 'add' ? `Từ ${FD(s.fd)} tạo lược đồ ${A(s.schema)}`
    : s.kind === 'skip' ? `${FD(s.fd)}: ${A(s.schema)} đã nằm trong một lược đồ có sẵn, bỏ qua`
    : s.kind === 'key' ? `Không lược đồ nào chứa candidate key → thêm ${A(s.schema)}`
    : `Bỏ ${A(s.schema)} vì nằm trọn trong lược đồ khác`;
  out.push(card('Phân rã 3NF (thuật toán tổng hợp)', `<ol>${t.steps.map(s => `<li>${stepText(s)}</li>`).join('')}</ol><p>Kết quả: ${t.result.map(x => `(${A(x)})`).join(', ')}</p>`,
    ok(true, 'Lossless + bảo toàn FD', '')));

  const schemas = fdParseSchemas(input.decomp || '', letters, R);
  if (schemas.length >= 2) {
    const covered = R.every(a => schemas.some(S => S.includes(a)));
    const lossless = fdLosslessChase(R, fds, schemas);
    let body = covered ? '' : callout('warning', `Phân rã chưa phủ hết R (thiếu ${A(R.filter(a => !schemas.some(S => S.includes(a))))}).`);
    body += `<p>Các lược đồ: ${schemas.map((S, i) => `R<sub>${i + 1}</sub> = (${A(S)})`).join(', ')}</p>`;
    if (schemas.length === 2) {
      const l = fdLosslessBinary(R, fds, schemas[0], schemas[1]);
      body += `<p>R<sub>1</sub> ∩ R<sub>2</sub> = ${A(l.common)}; (${A(l.common)})⁺ = ${A(l.closure)} → ${l.lossless ? 'chứa R<sub>1</sub> hoặc R<sub>2</sub>, nên <strong>lossless</strong>' : 'không chứa R<sub>1</sub> lẫn R<sub>2</sub>, nên <strong>lossy</strong>'}.</p>`;
    } else {
      body += `<p>Kiểm tra lossless bằng bảng chase: <strong>${lossless ? 'lossless' : 'lossy'}</strong>.</p>`;
    }
    body += `<p>Bảo toàn phụ thuộc (thuật toán slide 7.53):</p><ul>${fds.map(f => `<li>${FD(f)}: ${fdPreserved(R, fds, schemas, f) ? 'được bảo toàn' : '<strong>không</strong> được bảo toàn'}</li>`).join('')}</ul>
      <p>Dạng chuẩn từng lược đồ: ${schemas.map((S, i) => { const v = fdBcnfViolation(R, fds, S); return `R<sub>${i + 1}</sub> ${v ? `không BCNF (${FD(v)})` : 'BCNF'}`; }).join('; ')}.</p>`;
    out.push(card('Kiểm tra phân rã', body, ok(lossless, 'Lossless', 'Lossy')));
  }
  return out.join('');
}

function viewFd(params) {
  const saved = store.get('fd:input', null);
  const preset = FD_PRESETS[Number(params.get('preset'))];
  const input = preset || saved || FD_PRESETS[0];
  main.innerHTML = pageHead('Công cụ', 'Phụ thuộc hàm (FD)',
    'Tự kiểm tra bài tập Chương 7: bao đóng thuộc tính, candidate key, canonical cover, kiểm tra BCNF/3NF, phân rã BCNF và 3NF, lossless và bảo toàn phụ thuộc. Hãy làm tay trước, rồi dùng công cụ để đối chiếu từng bước.') + `
    <div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">Đầu vào</h2>
      <select class="lx-fd-select" id="fdPreset" aria-label="Ví dụ có sẵn"><option value="">Ví dụ có sẵn…</option>${FD_PRESETS.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="lx-card__body lx-fd-form">
        <label>Lược đồ R <span class="lx-subtle">— viết liền nếu mỗi thuộc tính là một chữ cái (ABCDE), hoặc phân cách bằng dấu phẩy</span>
          <input class="lx-editor lx-fd-input" id="fdR" spellcheck="false" value="${esc(input.R)}"></label>
        <label>Tập phụ thuộc hàm F <span class="lx-subtle">— mỗi dòng một FD, dạng <code>A -> BC</code> hoặc <code>ID, x -> name</code></span>
          <textarea class="lx-editor" id="fdF" spellcheck="false" style="min-height:120px">${esc(input.F)}</textarea></label>
        <div class="lx-fd-row">
          <label>Tính bao đóng của α <span class="lx-subtle">(tuỳ chọn)</span><input class="lx-editor lx-fd-input" id="fdAlpha" spellcheck="false" value="${esc(input.alpha || '')}"></label>
          <label>Kiểm tra một phân rã <span class="lx-subtle">(tuỳ chọn, mỗi dòng một lược đồ)</span><textarea class="lx-editor" id="fdDecomp" spellcheck="false" style="min-height:64px">${esc(input.decomp || '')}</textarea></label>
        </div>
      </div>
      <div class="lx-card__foot"><span class="lx-subtle">Kết quả cập nhật khi bạn gõ</span><button class="lx-btn lx-btn--primary" id="fdRun" type="button">${icon('play')} Phân tích</button></div></div>
    <div class="lx-stack" id="fdOut" aria-live="polite"></div>`;
  const read = () => ({ R: $('#fdR').value, F: $('#fdF').value, alpha: $('#fdAlpha').value, decomp: $('#fdDecomp').value });
  const render = () => {
    const value = read();
    store.set('fd:input', value);
    try { $('#fdOut').innerHTML = fdReport(value); }
    catch (e) { $('#fdOut').innerHTML = callout('danger', esc(e.message)); }
  };
  let timer = null;
  ['#fdR', '#fdF', '#fdAlpha', '#fdDecomp'].forEach(sel => $(sel).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); }));
  $('#fdRun').addEventListener('click', render);
  $('#fdPreset').addEventListener('change', e => {
    const p = FD_PRESETS[Number(e.target.value)];
    if (!p || e.target.value === '') return;
    $('#fdR').value = p.R; $('#fdF').value = p.F; $('#fdAlpha').value = p.alpha || ''; $('#fdDecomp').value = p.decomp || '';
    render();
  });
  render();
}

// Tab inserts spaces; Ctrl+Enter runs; Ctrl+Shift+Enter checks.
function bindEditorKeys(editor, onRun, onCheck) {
  editor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey && onCheck) onCheck(); else onRun();
    } else if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: t } = editor;
      editor.setRangeText('  ', s, t, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  });
}

// ======================================================================
// Router
// ======================================================================
function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, query] = hash.split('?');
  renderNav(path);
  const m = path.match(/^\/([\w-]+)\/(summary|quiz|questions|ex)(?:\/([\w.-]+))?$/);
  const ch = m && DATA.chapters.find(c => c.key === m[1]);
  if (ch) {
    renderContext(ch);
    ({ summary: viewSummary, quiz: viewQuiz, questions: viewQuestions, ex: c => viewExercise(c, m[3]) })[m[2]](ch);
  } else if (path === '/sandbox') {
    renderContext(null);
    const table = new URLSearchParams(query || '').get('table');
    viewSandbox(table ? `select * from ${table};` : undefined);
  } else if (path === '/schema') {
    renderContext(null);
    viewSchema();
  } else if (path === '/fd' && DATA.part.fdTool) {
    renderContext(null);
    viewFd(new URLSearchParams(query || ''));
  } else {
    renderContext(null);
    viewHome();
  }
  window.scrollTo(0, 0);
  main.classList.remove('is-entering');
  void main.offsetWidth; // restart the entrance animation
  main.classList.add('is-entering');
}
window.addEventListener('hashchange', route);
route();
getShared().catch(err => console.error(err));
</script>
