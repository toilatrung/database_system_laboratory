2","topic":"Q12 phép chia","level":3,"prompt":"\u003cp>Mã và tên các hành khách đã có vé \u003cstrong>mọi\u003c/strong> tuyến \u003cstrong>đến DAD\u003c/strong>. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.pax_id, p.name\nFROM fl_passenger p\nWHERE NOT EXISTS (\n  SELECT route_id FROM fl_route WHERE dest = 'DAD'\n  EXCEPT\n  SELECT b.route_id FROM fl_booking b WHERE b.pax_id = p.pax_id\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P01","An"],["P03","Chau"]]}},{"id":"GK9.13","topic":"Q13 not exists, khoá 2 cột","level":2,"prompt":"\u003cp>Tìm các chuyến bay \u003cstrong>chưa được phân công phi công\u003c/strong>. Kết quả: \u003ccode>route_id, flight_date\u003c/code>.\u003c/p>","en":"","hint":"Một chuyến được xác định bởi cả route_id và flight_date.","solution":"SELECT f.route_id, f.flight_date\nFROM fl_flight f\nWHERE NOT EXISTS (\n  SELECT 1 FROM fl_crew c\n  WHERE c.route_id = f.route_id AND c.flight_date = f.flight_date\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["route_id","flight_date"],"rows":[["R05","2025-02-20"],["R07","2025-03-18"]]}},{"id":"GK9.14","topic":"Q14 so với trung bình","level":3,"prompt":"\u003cp>Tìm hành khách có \u003cstrong>số tuyến khác nhau đã đặt\u003c/strong> lớn hơn \u003cstrong>trung bình\u003c/strong> số tuyến khác nhau của mỗi hành khách (tính \u003cstrong>cả khách chưa đặt vé\u003c/strong>). Kết quả: \u003ccode>pax_id, name, route_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"WITH cnt AS (\n  SELECT p.pax_id, p.name, COUNT(DISTINCT b.route_id) AS route_count\n  FROM fl_passenger p\n  LEFT JOIN fl_booking b ON b.pax_id = p.pax_id\n  GROUP BY p.pax_id, p.name\n)\nSELECT pax_id, name, route_count\nFROM cnt\nWHERE route_count > (SELECT AVG(route_count) FROM cnt);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name","route_count"],"rows":[["P01","An","5"],["P04","David","4"],["P05","Emi","3"]]}},{"id":"GK9.15","topic":"Q15 đếm phân biệt","level":3,"prompt":"\u003cp>Tìm hành khách bay \u003cstrong>cùng một tuyến\u003c/strong> vào \u003cstrong>nhiều hơn một\u003c/strong> ngày khác nhau. Kết quả: \u003ccode>pax_id, name, route_id, trip_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.pax_id, p.name, b.route_id, COUNT(DISTINCT b.flight_date) AS trip_count\nFROM fl_booking b\nJOIN fl_passenger p ON p.pax_id = b.pax_id\nGROUP BY p.pax_id, p.name, b.route_id\nHAVING COUNT(DISTINCT b.flight_date) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name","route_id","trip_count"],"rows":[["P01","An","R01","2"],["P02","Bao","R02","2"],["P04","David","R01","2"]]}},{"id":"GK9.16","topic":"Q16 max kể cả hoà","level":3,"prompt":"\u003cp>Tìm (các) sân bay có \u003cstrong>tổng lương phi công đặt gốc tại đó cao nhất\u003c/strong>, giữ các sân bay \u003cstrong>hoà\u003c/strong>, tính cả sân bay \u003cstrong>không có phi công\u003c/strong> (= 0). Kết quả: \u003ccode>code, total_salary\u003c/code>.\u003c/p>","en":"","hint":"","solution":"WITH tot AS (\n  SELECT a.code, COALESCE(SUM(p.salary), 0) AS total_salary\n  FROM fl_airport a\n  LEFT JOIN fl_pilot p ON p.base = a.code\n  GROUP BY a.code\n)\nSELECT code, total_salary\nFROM tot\nWHERE total_salary = (SELECT MAX(total_salary) FROM tot);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["code","total_salary"],"rows":[["SGN","10200"],["HAN","10200"]]}},{"id":"GK9.17","topic":"Q17 join khoá 2 cột","level":3,"prompt":"\u003cp>Tìm hành khách đã bay với \u003cstrong>ít nhất 3 phi công khác nhau\u003c/strong>; phi công phải lái \u003cstrong>đúng chuyến\u003c/strong> (tuyến và ngày) của vé. Kết quả: \u003ccode>pax_id, name, pilot_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.pax_id, p.name, COUNT(DISTINCT c.pilot_id) AS pilot_count\nFROM fl_booking b\nJOIN fl_crew c      ON c.route_id = b.route_id AND c.flight_date = b.flight_date\nJOIN fl_passenger p ON p.pax_id = b.pax_id\nGROUP BY p.pax_id, p.name\nHAVING COUNT(DISTINCT c.pilot_id) >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name","pilot_count"],"rows":[["P01","An","4"],["P02","Bao","3"],["P04","David","5"]]}},{"id":"GK9.18","topic":"Q18 not exists lồng","level":3,"prompt":"\u003cp>Tìm hành khách đã có vé \u003cstrong>ít nhất một chặng nối\u003c/strong> (tuyến có trong \u003ccode>fl_requires\u003c/code>), và với \u003cstrong>mọi\u003c/strong> chặng nối đã đặt thì cũng có vé (ngày nào cũng được) \u003cstrong>mọi\u003c/strong> tuyến mà chặng đó cần. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.pax_id, p.name\nFROM fl_passenger p\nWHERE EXISTS (\n        SELECT 1 FROM fl_booking b JOIN fl_requires q ON q.route_id = b.route_id\n        WHERE b.pax_id = p.pax_id)\n  AND NOT EXISTS (\n        SELECT 1 FROM fl_booking b JOIN fl_requires q ON q.route_id = b.route_id\n        WHERE b.pax_id = p.pax_id\n          AND NOT EXISTS (SELECT 1 FROM fl_booking b2\n                          WHERE b2.pax_id = p.pax_id AND b2.route_id = q.required_id));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P01","An"],["P04","David"],["P05","Emi"]]}},{"id":"GK9.19","topic":"Q19 phép chia + tập rỗng","level":3,"prompt":"\u003cp>Tìm hành khách đã có vé \u003cstrong>mọi tuyến xuất phát từ HAN có chuyến bay trong năm 2025\u003c/strong> (vé năm 2025). Nếu năm 2025 không có chuyến nào từ HAN thì \u003cstrong>không\u003c/strong> trả về ai. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"WITH need AS (\n  SELECT DISTINCT f.route_id\n  FROM fl_flight f JOIN fl_route r ON r.route_id = f.route_id\n  WHERE r.origin = 'HAN' AND EXTRACT(YEAR FROM f.flight_date) = 2025\n)\nSELECT p.pax_id, p.name\nFROM fl_passenger p\nWHERE EXISTS (SELECT 1 FROM need)\n  AND NOT EXISTS (\n        SELECT route_id FROM need\n        EXCEPT\n        SELECT b.route_id FROM fl_booking b\n        WHERE b.pax_id = p.pax_id AND EXTRACT(YEAR FROM b.flight_date) = 2025);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P01","An"],["P04","David"]]}},{"id":"GK9.20","topic":"Q20 quy đổi + avg","level":3,"prompt":"\u003cp>Tìm phi công có \u003cstrong>hệ số hạng ghế trung bình\u003c/strong> của các vé trên chuyến mình lái lớn hơn \u003cstrong>trung bình chung của mọi vé hợp lệ\u003c/strong>. Hệ số F=3.0, J=2.0, W=1.5, Y=1.0; bỏ \u003ccode>NULL\u003c/code> và mã lạ. Một vé tính cho \u003cstrong>mọi\u003c/strong> phi công của chuyến đó. Kết quả: \u003ccode>pilot_id, name, avg_factor\u003c/code> (không làm tròn).\u003c/p>","en":"","hint":"","solution":"WITH cf(seat_class, factor) AS (\n  VALUES ('F', 3.0), ('J', 2.0), ('W', 1.5), ('Y', 1.0)\n),\nbk AS (\n  SELECT b.route_id, b.flight_date, cf.factor\n  FROM fl_booking b\n  JOIN cf ON cf.seat_class = b.seat_class\n)\nSELECT p.pilot_id, p.name, AVG(bk.factor) AS avg_factor\nFROM bk\nJOIN fl_crew c  ON c.route_id = bk.route_id AND c.flight_date = bk.flight_date\nJOIN fl_pilot p ON p.pilot_id = c.pilot_id\nGROUP BY p.pilot_id, p.name\nHAVING AVG(bk.factor) > (SELECT AVG(factor) FROM bk);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pilot_id","name","avg_factor"],"rows":[["PL1","Hung","1.75"],["PL5","Mai","2.6667"],["PL6","Somchai","2"]]}}]},{"key":"gk10","store":"gk10","short":"GK-M4","label":"Đề mẫu 4 · Thư viện","navLabel":"Đề mẫu 4","kind":"Đề thi","title":"Library Database: 20 SQL Query Exercises","titleVi":"Đề mẫu 4 — 20 truy vấn trên Library database","seed":"","seedFile":"","dbPanel":"lb_","summary":"\u003ch3>1. Đề này là gì\u003c/h3>\n\u003cp>20 truy vấn cùng dạng với \u003cstrong>Đề mẫu (GK7)\u003c/strong> trên lược đồ thư viện. Qn ở đây cùng dạng với Qn của GK7. Bấm \u003cstrong>Database\u003c/strong> để xem bảng, \u003cstrong>Debug\u003c/strong> để chạy từng bước.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bảng\u003c/th>\u003cth>Ý nghĩa (so với University)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lb_branch(branch_name, district, budget)\u003c/code>\u003c/td>\u003ctd>chi nhánh (≈ \u003ccode>department\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_genre(genre, shelf)\u003c/code>\u003c/td>\u003ctd>thể loại (Poetry, Comics \u003cstrong>chưa có sách\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_book(isbn, title, genre, pages)\u003c/code>\u003c/td>\u003ctd>đầu sách (≈ \u003ccode>course\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_series(isbn, prev_isbn)\u003c/code>\u003c/td>\u003ctd>tập sau cần đọc tập trước (≈ \u003ccode>prereq\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_copy(isbn, copy_no, branch_name)\u003c/code>\u003c/td>\u003ctd>bản sách cụ thể, khoá \u003cstrong>2 cột\u003c/strong> (≈ \u003ccode>section\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_librarian\u003c/code>, \u003ccode>lb_handles(lib_id, isbn, copy_no)\u003c/code>\u003c/td>\u003ctd>thủ thư và bản sách họ phụ trách (≈ \u003ccode>instructor\u003c/code>/\u003ccode>teaches\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_member(member_id, name, branch_name, type)\u003c/code>\u003c/td>\u003ctd>bạn đọc, \u003ccode>branch_name\u003c/code> = chi nhánh đăng ký (≈ \u003ccode>student\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lb_loan(member_id, isbn, copy_no, loan_date, return_date, cond)\u003c/code>\u003c/td>\u003ctd>lượt mượn (≈ \u003ccode>takes\u003c/code>); \u003ccode>return_date\u003c/code> NULL = \u003cstrong>chưa trả\u003c/strong>; \u003ccode>cond\u003c/code> = tình trạng lúc trả\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Điểm mới so với GK7\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q16:\u003c/strong> tìm \u003cstrong>ít nhất\u003c/strong> (kể cả hoà) thay vì nhiều nhất; thể loại chưa có lượt mượn nào phải được đếm là 0 → bắt buộc \u003ccode>LEFT JOIN\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q18:\u003c/strong> \"đã đọc xong tập trước\" = đã mượn \u003cstrong>và đã trả\u003c/strong> (\u003ccode>return_date IS NOT NULL\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Q19:\u003c/strong> phép chia trên \u003cstrong>chi nhánh\u003c/strong> (mọi chi nhánh có lượt mượn năm 2025).\u003c/li>\u003c/ul>\n\u003ch3>3. Bẫy hay gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q5, Q8, Q15:\u003c/strong> một người mượn lại cùng cuốn → \u003ccode>DISTINCT\u003c/code>; Q15 đếm \u003cstrong>ngày mượn\u003c/strong> phân biệt.\u003c/li>\u003cli>\u003cstrong>Q13, Q17, Q20:\u003c/strong> \u003ccode>lb_handles\u003c/code> và \u003ccode>lb_loan\u003c/code> khớp \u003cstrong>cả\u003c/strong> \u003ccode>isbn\u003c/code> \u003cstrong>và\u003c/strong> \u003ccode>copy_no\u003c/code>. Chỉ khớp \u003ccode>isbn\u003c/code> thì bản B01-2 bị coi là có thủ thư (Q13), và Kim bị tính làm việc với 4 thủ thư (Q17).\u003c/li>\u003cli>\u003cstrong>Q14:\u003c/strong> trung bình tính cả bạn đọc chưa mượn (Linh, Phuc).\u003c/li>\u003cli>\u003cstrong>Q16:\u003c/strong> \u003ccode>COUNT(l.member_id)\u003c/code> (đếm cột bảng phải) chứ không phải \u003ccode>COUNT(*)\u003c/code> — \u003ccode>COUNT(*)\u003c/code> đếm cả dòng NULL của \u003ccode>LEFT JOIN\u003c/code>, thể loại rỗng thành 1.\u003c/li>\u003cli>\u003cstrong>Q20:\u003c/strong> \u003ccode>NULL\u003c/code> (chưa trả) và \u003ccode>'Lost'\u003c/code> bị bỏ bằng inner join với bảng quy đổi.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>Q16\u003c/strong> — So sánh \u003ccode>COUNT(*)\u003c/code> và \u003ccode>COUNT(l.member_id)\u003c/code> sau \u003ccode>lb_genre LEFT JOIN lb_book LEFT JOIN lb_loan\u003c/code>. Với thể loại Poetry (chưa có sách) mỗi cách cho bao nhiêu? Kết quả Q16 đổi thế nào?","en":"","answer":"\u003cp>Poetry không có sách nên \u003ccode>LEFT JOIN\u003c/code> sinh \u003cstrong>một\u003c/strong> dòng với \u003ccode>b.*\u003c/code> và \u003ccode>l.*\u003c/code> đều NULL.\u003c/p>\n\u003cul>\u003cli>\u003ccode>COUNT(*)\u003c/code> đếm mọi dòng → Poetry = \u003cstrong>1\u003c/strong>.\u003c/li>\u003cli>\u003ccode>COUNT(l.member_id)\u003c/code> bỏ giá trị NULL → Poetry = \u003cstrong>0\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Với \u003ccode>COUNT(*)\u003c/code>, Poetry và Comics thành 1; sách Night Train (Novel) chưa ai mượn cũng thêm 1 dòng NULL cho Novel. Kết quả \"ít nhất\" bị sai (không còn là các thể loại 0 lượt). Đúng: Poetry, Comics với 0 lượt mượn.\u003c/p>"},{"q":"\u003cstrong>Q18\u003c/strong> — Hieu (M05) đã mượn Dragon Gate (B01) và Dragon Gate II (B02). Vì sao Hieu \u003cstrong>không\u003c/strong> thoả Q18, còn Cuong (M03) thì có?","en":"","answer":"\u003cp>B02 là tập sau của B01, nên người mượn B02 phải \u003cstrong>đã đọc xong\u003c/strong> B01 = có lượt mượn B01 với \u003ccode>return_date IS NOT NULL\u003c/code>.\u003c/p>\n\u003cul>\u003cli>Hieu mượn B01 (bản 2) ngày 26/02 nhưng \u003cstrong>chưa trả\u003c/strong> (\u003ccode>return_date\u003c/code> NULL) → điều kiện hỏng → loại.\u003c/li>\u003cli>Cuong mượn B01 ngày 05/02 và trả 25/02 (xong B01, đủ điều kiện cho B02); mượn B02 và trả 15/03 (đủ điều kiện cho B03) → mọi tập sau Cuong mượn đều có tập trước đã xong → thoả.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"GK10.01","topic":"Q1 where","level":1,"prompt":"\u003cp>Cho mã và tên các bạn đọc loại \u003cstrong>Student\u003c/strong>. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT member_id, name\nFROM lb_member\nWHERE type = 'Student';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M01","Anh"],["M03","Cuong"],["M05","Hieu"],["M07","Linh"]]}},{"id":"GK10.02","topic":"Q2 where >=","level":1,"prompt":"\u003cp>Liệt kê các đầu sách \u003cstrong>từ 400 trang trở lên\u003c/strong>. Kết quả: \u003ccode>isbn, title, pages\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT isbn, title, pages\nFROM lb_book\nWHERE pages >= 400;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["isbn","title","pages"],"rows":[["B01","Dragon Gate","420"],["B02","Dragon Gate II","450"],["B03","Dragon Gate III","480"],["B05","Quantum Ideas","520"],["B07","Silk Roads","610"]]}},{"id":"GK10.03","topic":"Q3 where","level":1,"prompt":"\u003cp>Liệt kê tên các sách thể loại \u003cstrong>Science\u003c/strong>. Kết quả: \u003ccode>title\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT title\nFROM lb_book\nWHERE genre = 'Science';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Cosmos Basics"],["Quantum Ideas"],["Stars Above"]]}},{"id":"GK10.04","topic":"Q4 join","level":1,"prompt":"\u003cp>Với mỗi bạn đọc, cho mã, tên, chi nhánh đăng ký và \u003cstrong>quận\u003c/strong> (\u003ccode>district\u003c/code>) của chi nhánh đó. Kết quả: \u003ccode>member_id, name, branch_name, district\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT m.member_id, m.name, m.branch_name, b.district\nFROM lb_member m\nJOIN lb_branch b ON b.branch_name = m.branch_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name","branch_name","district"],"rows":[["M01","Anh","Central","Hoan Kiem"],["M02","Bich","East","Long Bien"],["M03","Cuong","West","Cau Giay"],["M04","Dao","Central","Hoan Kiem"],["M05","Hieu","East","Long Bien"],["M06","Kim","West","Cau Giay"],["M07","Linh","Central","Hoan Kiem"],["M08","Phuc","East","Long Bien"]]}},{"id":"GK10.05","topic":"Q5 join + distinct","level":1,"prompt":"\u003cp>Tên các sách (không trùng) mà bạn đọc \u003cstrong>M01\u003c/strong> đã mượn. Kết quả: \u003ccode>title\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT b.title\nFROM lb_loan l\nJOIN lb_book b ON b.isbn = l.isbn\nWHERE l.member_id = 'M01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Cosmos Basics"],["Dragon Gate"],["Dragon Gate II"],["Dragon Gate III"],["Quantum Ideas"]]}},{"id":"GK10.06","topic":"Q6 join + lọc ngày","level":2,"prompt":"\u003cp>Mã và tên các bạn đọc đã mượn \u003cstrong>Dragon Gate II (B02)\u003c/strong> trong \u003cstrong>tháng 3/2025\u003c/strong>. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT m.member_id, m.name\nFROM lb_member m\nJOIN lb_loan l ON l.member_id = m.member_id\nWHERE l.isbn = 'B02'\n  AND l.loan_date >= '2025-03-01' AND l.loan_date \u003c '2025-04-01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M03","Cuong"],["M05","Hieu"]]}},{"id":"GK10.07","topic":"Q7 3 bảng, so cột","level":2,"prompt":"\u003cp>Tìm thủ thư phụ trách bản sách \u003cstrong>đặt ở chi nhánh khác\u003c/strong> chi nhánh của mình. Kết quả: \u003ccode>name, lib_branch, copy_branch, title\u003c/code> — mỗi bộ một dòng.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT li.name, li.branch_name AS lib_branch, c.branch_name AS copy_branch, b.title\nFROM lb_librarian li\nJOIN lb_handles h ON h.lib_id = li.lib_id\nJOIN lb_copy c    ON c.isbn = h.isbn AND c.copy_no = h.copy_no\nJOIN lb_book b    ON b.isbn = c.isbn\nWHERE c.branch_name \u003c> li.branch_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","lib_branch","copy_branch","title"],"rows":[["Vy","West","East","Quantum Ideas"],["Quang","Central","West","Dragon Gate III"],["Nam","East","West","Cosmos Basics"]]}},{"id":"GK10.08","topic":"Q8 join + distinct","level":1,"prompt":"\u003cp>Tên các bạn đọc (không trùng) đã mượn \u003cstrong>Dragon Gate (B01)\u003c/strong>, bản nào cũng được. Kết quả: \u003ccode>name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT m.name\nFROM lb_member m\nJOIN lb_loan l ON l.member_id = m.member_id\nWHERE l.isbn = 'B01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Anh"],["Cuong"],["Hieu"]]}},{"id":"GK10.09","topic":"Q9 join, so cột","level":2,"prompt":"\u003cp>Mã và tên các bạn đọc đã mượn \u003cstrong>ít nhất một bản sách đặt ở chi nhánh khác\u003c/strong> chi nhánh đăng ký của mình. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT m.member_id, m.name\nFROM lb_member m\nJOIN lb_loan l ON l.member_id = m.member_id\nJOIN lb_copy c ON c.isbn = l.isbn AND c.copy_no = l.copy_no\nWHERE c.branch_name \u003c> m.branch_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M03","Cuong"],["M01","Anh"],["M02","Bich"],["M06","Kim"],["M05","Hieu"]]}},{"id":"GK10.10","topic":"Q10 not exists","level":2,"prompt":"\u003cp>Mã và tên các bạn đọc \u003cstrong>chưa mượn lần nào\u003c/strong>. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT m.member_id, m.name\nFROM lb_member m\nWHERE NOT EXISTS (SELECT 1 FROM lb_loan l WHERE l.member_id = m.member_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M08","Phuc"],["M07","Linh"]]}},{"id":"GK10.11","topic":"Q11 not exists","level":2,"prompt":"\u003cp>Mã và tên các đầu sách \u003cstrong>chưa từng được mượn\u003c/strong>. Kết quả: \u003ccode>isbn, title\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT b.isbn, b.title\nFROM lb_book b\nWHERE NOT EXISTS (SELECT 1 FROM lb_loan l WHERE l.isbn = b.isbn);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["isbn","title"],"rows":[["B10","Stars Above"],["B09","Night Train"]]}},{"id":"GK10.12","topic":"Q12 phép chia","level":3,"prompt":"\u003cp>Mã và tên các bạn đọc đã mượn \u003cstrong>mọi\u003c/strong> sách thể loại \u003cstrong>Fantasy\u003c/strong>. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT m.member_id, m.name\nFROM lb_member m\nWHERE NOT EXISTS (\n  SELECT isbn FROM lb_book WHERE genre = 'Fantasy'\n  EXCEPT\n  SELECT l.isbn FROM lb_loan l WHERE l.member_id = m.member_id\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M01","Anh"],["M03","Cuong"]]}},{"id":"GK10.13","topic":"Q13 not exists, khoá 2 cột","level":2,"prompt":"\u003cp>Tìm các bản sách \u003cstrong>chưa có thủ thư phụ trách\u003c/strong>. Kết quả: \u003ccode>isbn, copy_no, branch_name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT c.isbn, c.copy_no, c.branch_name\nFROM lb_copy c\nWHERE NOT EXISTS (\n  SELECT 1 FROM lb_handles h\n  WHERE h.isbn = c.isbn AND h.copy_no = c.copy_no\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["isbn","copy_no","branch_name"],"rows":[["B01","2","East"],["B10","1","Central"]]}},{"id":"GK10.14","topic":"Q14 so với trung bình","level":3,"prompt":"\u003cp>Tìm bạn đọc có \u003cstrong>số đầu sách khác nhau đã mượn\u003c/strong> lớn hơn \u003cstrong>trung bình\u003c/strong> số đầu sách khác nhau của mỗi bạn đọc (tính \u003cstrong>cả người chưa mượn\u003c/strong>). Kết quả: \u003ccode>member_id, name, book_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"WITH cnt AS (\n  SELECT m.member_id, m.name, COUNT(DISTINCT l.isbn) AS book_count\n  FROM lb_member m\n  LEFT JOIN lb_loan l ON l.member_id = m.member_id\n  GROUP BY m.member_id, m.name\n)\nSELECT member_id, name, book_count\nFROM cnt\nWHERE book_count > (SELECT AVG(book_count) FROM cnt);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name","book_count"],"rows":[["M01","Anh","5"],["M02","Bich","3"],["M03","Cuong","4"],["M05","Hieu","3"]]}},{"id":"GK10.15","topic":"Q15 đếm phân biệt","level":3,"prompt":"\u003cp>Tìm bạn đọc mượn \u003cstrong>cùng một đầu sách\u003c/strong> vào \u003cstrong>nhiều hơn một\u003c/strong> ngày khác nhau. Kết quả: \u003ccode>member_id, name, isbn, loan_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT m.member_id, m.name, l.isbn, COUNT(DISTINCT l.loan_date) AS :3,"prompt":"\u003cp>Tìm bạn đọc đã mượn \u003cstrong>ít nhất một tập sau\u003c/strong> (có trong \u003ccode>lb_series\u003c/code>), và với \u003cstrong>mọi\u003c/strong> tập sau đã mượn thì đã \u003cstrong>đọc xong tập trước\u003c/strong> của nó (có lượt mượn tập trước đã trả, \u003ccode>return_date\u003c/code> khác NULL). Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT m.member_id, m.name\nFROM lb_member m\nWHERE EXISTS (\n        SELECT 1 FROM lb_loan l JOIN lb_series s ON s.isbn = l.isbn\n        WHERE l.member_id = m.member_id)\n  AND NOT EXISTS (\n        SELECT 1 FROM lb_loan l JOIN lb_series s ON s.isbn = l.isbn\n        WHERE l.member_id = m.member_id\n          AND NOT EXISTS (SELECT 1 FROM lb_loan l2\n                          WHERE l2.member_id = m.member_id AND l2.isbn = s.prev_isbn\n                            AND l2.return_date IS NOT NULL));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M01","Anh"],["M03","Cuong"]]}},{"id":"GK10.19","topic":"Q19 phép chia + tập rỗng","level":3,"prompt":"\u003cp>Tìm bạn đọc đã mượn (trong năm 2025) ở \u003cstrong>mọi chi nhánh có lượt mượn trong năm 2025\u003c/strong> — chi nhánh tính theo nơi đặt bản sách. Nếu năm 2025 không có lượt mượn nào thì \u003cstrong>không\u003c/strong> trả về ai. Kết quả: \u003ccode>member_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"WITH y AS (\n  SELECT l.member_id, c.branch_name\n  FROM lb_loan l\n  JOIN lb_copy c ON c.isbn = l.isbn AND c.copy_no = l.copy_no\n  WHERE EXTRACT(YEAR FROM l.loan_date) = 2025\n)\nSELECT m.member_id, m.name\nFROM lb_member m\nWHERE EXISTS (SELECT 1 FROM y)\n  AND NOT EXISTS (\n        SELECT branch_name FROM y\n        EXCEPT\n        SELECT branch_name FROM y WHERE y.member_id = m.member_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["member_id","name"],"rows":[["M01","Anh"],["M03","Cuong"],["M05","Hieu"]]}},{"id":"GK10.20","topic":"Q20 quy đổi + avg","level":3,"prompt":"\u003cp>Tìm thủ thư có \u003cstrong>điểm tình trạng trung bình\u003c/strong> (lúc trả) của các bản mình phụ trách lớn hơn \u003cstrong>trung bình chung của mọi lượt trả hợp lệ\u003c/strong>. Quy đổi New=4, Good=3, Worn=2, Damaged=1; bỏ \u003ccode>NULL\u003c/code> và giá trị lạ. Một lượt mượn tính cho \u003cstrong>mọi\u003c/strong> thủ thư phụ trách bản đó. Kết quả: \u003ccode>lib_id, name, avg_cond\u003c/code> (không làm tròn).\u003c/p>","en":"","hint":"","solution":"WITH cs(cond, score) AS (\n  VALUES ('New', 4), ('Good', 3), ('Worn', 2), ('Damaged', 1)\n),\nrt AS (\n  SELECT l.isbn, l.copy_no, cs.score\n  FROM lb_loan l\n  JOIN cs ON cs.cond = l.cond\n)\nSELECT li.lib_id, li.name, AVG(rt.score) AS avg_cond\nFROM rt\nJOIN lb_handles h    ON h.isbn = rt.isbn AND h.copy_no = rt.copy_no\nJOIN lb_librarian li ON li.lib_id = h.lib_id\nGROUP BY li.lib_id, li.name\nHAVING AVG(rt.score) > (SELECT AVG(score) FROM rt);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["lib_id","name","avg_cond"],"rows":[["L4","Quang","3.5"],["L5","Vy","3.5"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
// `seed` (optional SQL) adds a chapter's own rows first, inside that transaction.
async function produceTable(db, sql, check, fresh, seed) {
  if (fresh) {
    if (seed) await db.exec(seed);
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    if (seed) await db.exec(seed);
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh, ex.seed); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// ======================================================================
// Debug: run a script one step at a time
// ======================================================================
// `planDebug(sql)` cuts a script into the steps a reader can watch: every
// statement, and inside a SELECT its clauses in logical order (FROM, each
// JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY/LIMIT), every WITH table
// and every operand of UNION/INTERSECT/EXCEPT. Steps marked `real` are the
// statements themselves; the others are read-only queries built from a
// prefix of the clauses. `range` is [start, end) in the original text.

// Comments, string literals and quoted identifiers are blanked out so
// keywords and `;` can be found with plain regexes (string bodies become
// '_' so they never read as keywords). `depth[i]` is the parenthesis depth
// before character i.
function maskSql(sql) {
  const out = sql.split('');
  const blank = (a, b, ch) => { for (let k = a; k < b; k++) if (out[k] !== '\n') out[k] = ch; };
  let i = 0;
  while (i < sql.length) {
    const c = sql[i], n = sql[i + 1];
    let e = -1;
    if (c === '-' && n === '-') { e = sql.indexOf('\n', i); if (e < 0) e = sql.length; blank(i, e, ' '); }
    else if (c === '/' && n === '*') { e = sql.indexOf('*/', i + 2); e = e < 0 ? sql.length : e + 2; blank(i, e, ' '); }
    else if (c === "'" || c === '"') {
      e = i + 1;
      while (e < sql.length && !(sql[e] === c && sql[e + 1] !== c)) e += sql[e] === c ? 2 : 1;
      e = Math.min(e + 1, sql.length);
      blank(i, e, '_');
    } else if (c === '$') {
      const tag = /^\$(?:[A-Za-z_]\w*)?\$/.exec(sql.slice(i, i + 64));
      if (tag) { e = sql.indexOf(tag[0], i + tag[0].length); e = e < 0 ? sql.length : e + tag[0].length; blank(i, e, '_'); }
    }
    i = e > i ? e : i + 1;
  }
  const code = out.join('');
  const depth = new Int32Array(code.length + 1);
  let d = 0;
  for (let k = 0; k < code.length; k++) {
    depth[k] = d;
    if (code[k] === '(') d++;
    else if (code[k] === ')') d = Math.max(0, d - 1);
  }
  depth[code.length] = d;
  return { code, depth };
}

// Top-level (depth 0) matches of a global regex whose first group is the keyword.
function topMatches(re, m, from = 0, to = m.code.length) {
  const found = [];
  re.lastIndex = from;
  let x;
  while ((x = re.exec(m.code)) && x.index < to) {
    if (m.depth[x.index] === 0) found.push({ kw: x[1].toLowerCase().replace(/\s+/g, ' '), index: x.index, len: x[0].length });
  }
  return found;
}

function closeParen(m, p) {
  for (let k = p + 1; k < m.code.length; k++) if (m.code[k] === ')' && m.depth[k] === m.depth[p] + 1) return k;
  return -1;
}

// Statements with their offsets, without the `;` and surrounding blanks/comments.
function splitStatements(sql) {
  const m = maskSql(sql);
  const list = [];
  let start = 0;
  for (let k = 0; k <= m.code.length; k++) {
    if (k < m.code.length && !(m.code[k] === ';' && m.depth[k] === 0)) continue;
    const seg = m.code.slice(start, k);
    const a = seg.search(/\S/);
    if (a >= 0) {
      const b = seg.trimEnd().length;
      list.push({ start: start + a, end: start + b, text: sql.slice(start + a, start + b) });
    }
    start = k + 1;
  }
  return list;
}

// `with a as (...), b (x, y) as (...) <main>` -> the WITH tables and where <main> starts.
function parseWith(t, m) {
  const head = /^with\s+(?:recursive\s+)?/i.exec(m.code);
  if (!head) return null;
  let p = head[0].length;
  const ctes = [];
  const skip = () => { p += /^\s*/.exec(m.code.slice(p))[0].length; };
  for (;;) {
    const nm = /^([A-Za-z_][\w$]*)\s*/.exec(m.code.slice(p));
    if (!nm) return null;
    const name = t.slice(p, p + nm[1].length);
    const start = p;
    p += nm[0].length;
    if (m.code[p] === '(') { p = closeParen(m, p) + 1; if (!p) return null; skip(); }
    const as = /^as\s+(?:not\s+)?(?:materialized\s+)?/i.exec(m.code.slice(p));
    if (!as) return null;
    p += as[0].length;
    if (m.code[p] !== '(') return null;
    const close = closeParen(m, p);
    if (close < 0) return null;
    ctes.push({ name, start, end: close + 1 });
    p = close + 1;
    const comma = /^\s*,\s*/.exec(m.code.slice(p));
    if (comma) { p += comma[0].length; continue; }
    skip();
    return { ctes, mainStart: p };
  }
}

const CLAUSE_RE = /\b(select|from|where|group\s+by|having|window|order\s+by|limit|offset|fetch|union|intersect|except)\b/gi;
const JOIN_RE = /(,|\b(?:natural\s+)?(?:(?:left|right|full)(?:\s+outer)?\s+|inner\s+|cross\s+)?join\b)/gi;
const DML_RE = /^(?:insert\s+into|update(?:\s+only)?|delete\s+from(?:\s+only)?|truncate(?:\s+table)?|create\s+(?:temp(?:orary)?\s+|unlogged\s+)?table(?:\s+if\s+not\s+exists)?|alter\s+table(?:\s+if\s+exists)?)\s+([A-Za-z_][\w$.]*)/i;
const GROUP_COUNT_COLUMN = 'số dòng trong nhóm';

// Steps of one statement; offsets are relative to the statement.
function planStatement(t) {
  const m = maskSql(t);
  const steps = [];
  const one = (step, a, b) => steps.push({ ...step, range: [a, b] });
  const trimEnd = (a, b) => a + t.slice(a, b).trimEnd().length;

  const w = parseWith(t, m);
  const ms = w ? w.mainStart : 0;
  const prefix = t.slice(0, ms);
  const marks = topMatches(CLAUSE_RE, m, ms)
    // `a is distinct from b` is not a FROM clause
    .filter(k => !(k.kw === 'from' && /\bdistinct\s+$/i.test(m.code.slice(Math.max(0, k.index - 20), k.index))));
  const isSelect = marks.length && marks[0].kw === 'select' && marks[0].index === ms;

  if (!isSelect) {
    const target = DML_RE.exec(m.code);
    one({ kind: 'stmt', label: (/^\s*([A-Za-z]+)/.exec(t) || ['', 'SQL'])[1].toUpperCase(), sql: t, real: true,
      snapshot: target ? t.slice(target.index + target[0].length - target[1].length, target.index + target[0].length) : '' }, 0, t.length);
    return steps;
  }
  if (w) w.ctes.forEach(c => one({ kind: 'cte', label: 'WITH ' + c.name, sql: `${t.slice(0, c.end)}\nselect * from ${c.name}` }, c.start, c.end));

  const setops = marks.filter(k => ['union', 'intersect', 'except'].includes(k.kw));
  if (setops.length) {
    let a = ms;
    setops.forEach((k, i) => {
      one({ kind: 'setop', label: `Vế ${i + 1}`, sql: prefix + t.slice(a, k.index).trim() }, a, trimEnd(a, k.index));
      a = k.index + k.len + (/^\s+all\b/i.exec(m.code.slice(k.index + k.len)) || [''])[0].length;
      a += /^\s*/.exec(m.code.slice(a))[0].length;
    });
    one({ kind: 'setop', label: `Vế ${setops.length + 1}`, sql: prefix + t.slice(a).trim() }, a, t.length);
    one({ kind: 'final', label: [...new Set(setops.map(k => k.kw.toUpperCase()))].join(' / '), sql: t, real: true }, setops[0].index, t.length);
    return steps;
  }

  const cl = {};
  marks.forEach((k, i) => {
    const key = ['order by', 'limit', 'offset', 'fetch'].includes(k.kw) ? 'order' : k.kw;
    const end = trimEnd(k.index, i + 1 < marks.length ? marks[i + 1].index : t.length);
    if (cl[key]) cl[key].end = end;
    else cl[key] = { start: k.index, end, body: k.index + k.len, kw: k.kw };
  });
  const txt = c => (c ? ' ' + t.slice(c.start, c.end) : '');
  const body = c => t.slice(c.body, c.end).trim();
  const sel = cl.select;

  if (cl.from) {
    const f = cl.from;
    const joins = topMatches(JOIN_RE, m, f.body, f.end).filter(j => j.index < f.end);
    const joinLabel = j => (j.kw === ',' ? ', (tích Descartes)' : j.kw.toUpperCase());
    let a = f.start;
    joins.forEach((j, i) => {
      one({ kind: i ? 'join' : 'from', label: i ? joinLabel(joins[i - 1]) : 'FROM', sql: `${prefix}select * from ${t.slice(f.body, j.index).trim()}` }, a, trimEnd(a, j.index));
      a = j.index;
    });
    const last = joins[joins.length - 1];
    one({ kind: last ? 'join' : 'from', label: last ? joinLabel(last) : 'FROM', sql: `${prefix}select * from ${body(f)}` }, a, f.end);
    if (cl.where) one({ kind: 'where', label: 'WHERE', sql: `${prefix}select * from ${body(f)}${txt(cl.where)}` }, cl.where.start, cl.where.end);
    if (cl['group by']) {
      const g = cl['group by'];
      // `group by 1, 2` means the first SELECT items: show those expressions.
      const items = c => {
        const list = [];
        let a = c.body;
        for (const k of [...topMatches(/(,)/g, m, c.body, c.end), { index: c.end }]) { list.push(t.slice(a, k.index).trim()); a = k.index + 1; }
        return list;
      };
      const picked = items(sel).map(s => s.replace(/^distinct\s+/i, '').replace(/\s+as\s+[\w$"]+$/i, ''));
      const keys = items(g).map(s => (/^\d+$/.test(s) && picked[s - 1] ? picked[s - 1] : s)).join(', ');
      const grouped = `${prefix}select ${keys}, count(*) as "${GROUP_COUNT_COLUMN}" from ${body(f)}${txt(cl.where)}${txt(g)}`;
      one({ kind: 'group', label: 'GROUP BY', sql: grouped }, g.start, g.end);
      if (cl.having) one({ kind: 'having', label: 'HAVING', sql: grouped + txt(cl.having) }, cl.having.start, cl.having.end);
    }
  }
  const selLabel = /^distinct\b/i.test(m.code.slice(sel.body).trimStart()) ? 'SELECT DISTINCT' : 'SELECT';
  if (cl.order) {
    one({ kind: 'select', label: selLabel, sql: t.slice(0, cl.order.start).trim() }, sel.start, sel.end);
    one({ kind: 'order', label: cl.order.kw.toUpperCase(), sql: t, real: true }, cl.order.start, t.length);
  } else one({ kind: 'select', label: selLabel, sql: t, real: true }, sel.start, sel.end);
  return steps;
}

function planDebug(sql) {
  const stmts = splitStatements(sql);
  return stmts.flatMap((s, i) => planStatement(s.text).map(step => ({
    ...step, stmt: i + 1, stmtCount: stmts.length, range: [s.start + step.range[0], s.start + step.range[1]],
  })));
}

// Runs every planned step inside one transaction that is rolled back (unless
// `fresh`), so the database never changes. Clause steps run inside a
// savepoint each and are always undone; a failing statement ends the run,
// as it would in a real script. Scripts with their own BEGIN/COMMIT (or a
// fresh database) get statement steps only, since savepoints need a
// transaction this function controls.
async function runDebug(db, sql, { seed = '', fresh = false } = {}) {
  const own = fresh || hasTxControl(sql);
  const plan = planDebug(sql).filter(s => s.real || !own);
  const steps = [];
  const undo = 'rollback to savepoint lx_debug; release savepoint lx_debug';
  const guarded = async q => {
    if (own) return runScript(db, q);
    await db.exec('savepoint lx_debug');
    try { const r = await runScript(db, q); await db.exec('release savepoint lx_debug'); return r; }
    catch (e) { await db.exec(undo); throw e; }
  };
  if (!fresh) await db.exec('begin');
  try {
    if (seed) await db.exec(seed);
    for (const s of plan) {
      const step = { ...s };
      steps.push(step);
      if (!s.real) {
        await db.exec('savepoint lx_debug');
        try { step.table = lastTable(await runScript(db, s.sql)); }
        catch (e) { step.note = e.message; }
        finally { await db.exec(undo); }
        continue;
      }
      try {
        const res = await guarded(s.sql);
        step.table = lastTable(res);
        step.affected = res.reduce((n, r) => n + (r.affectedRows || 0), 0);
      } catch (e) {
        step.error = e.message;
        break;
      }
      if (s.snapshot) {
        try { step.after = lastTable(await guarded(`select * from ${s.snapshot}`)); } catch { /* dropped or renamed */ }
      }
    }
  } finally {
    if (!fresh) {
      await db.exec('rollback').catch(() => {});
      await db.exec('reset role').catch(() => {});
    }
  }
  return { steps, total: plan.length };
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
  for (let i = start; i <= items.length - (k - acc.length); i++) yield* subsetsOfSize(items, k, i + 1, [...acc, items[i]]);
}

// Candidate keys by increasing size. Attributes that never appear on a right
// side belong to every key; attributes only on right sides belong to none.
function fdCandidateKeys(R, fds) {
  const onRight = new Set(fds.flatMap(f => minus(f.rhs, f.lhs)));
  const onLeft = new Set(fds.flatMap(f => f.lhs));
  const core = R.filter(a => !onRight.has(a));
  const optional = R.filter(a => onRight.has(a) && onLeft.has(a));
  const keys = [];
  for (let k = 0; k <= optional.length; k++) {
    for (const extra of subsetsOfSize(optional, k)) {
      const K = order(R, [...core, ...extra]);
      if (keys.some(key => subset(key, K))) continue;
      if (fdIsSuperkey(R, fds, K)) keys.push(K);
    }
  }
  return keys;
}

// Canonical cover with a log of every change (slides 7.48–7.50): merge equal
// left sides, then delete one extraneous attribute at a time (Exercise 7.15
// shows why deleting two at once is wrong) until nothing changes.
function fdCover(R, fds, letters) {
  const fa = xs => fdFormat(xs, letters);
  const ff = f => fdFormatFD(f, letters);
  let F = fds.map(f => ({ lhs: [...f.lhs], rhs: [...f.rhs] }));
  const log = [];
  const mergeLeft = () => {
    const merged = [];
    for (const f of F) {
      const g = merged.find(x => same(x.lhs, f.lhs));
      if (g) {
        log.push(`Hợp (union rule): ${ff(g)} và ${ff(f)} → ${ff({ lhs: g.lhs, rhs: union(R, g.rhs, f.rhs) })}`);
        g.rhs = union(R, g.rhs, f.rhs);
      } else merged.push({ lhs: [...f.lhs], rhs: [...f.rhs] });
    }
    F = merged;
  };
  const step = () => {
    for (let i = 0; i < F.length; i++) {
      const f = F[i];
      // Left side: A ∈ α is extraneous if (α − A)⁺ under F contains β.
      if (f.lhs.length > 1) {
        for (const A of f.lhs) {
          const rest = minus(f.lhs, [A]);
          if (subset(f.rhs, fdClosure(R, F, rest).result)) {
            log.push(`${A} thừa ở vế trái của ${ff(f)}: (${fa(rest)})⁺ dưới F chứa ${fa(f.rhs)} → thay bằng ${ff({ lhs: rest, rhs: f.rhs })}`);
            F[i] = { lhs: rest, rhs: f.rhs };
            return true;
          }
        }
      }
      // Right side: A ∈ β is extraneous if α⁺ under F' (A removed from β) contains A.
      for (const A of f.rhs) {
        const reduced = { lhs: f.lhs, rhs: minus(f.rhs, [A]) };
        const Fp = F.map((g, j) => (j === i ? reduced : g)).filter(g => g.rhs.length);
        if (fdClosure(R, Fp, f.lhs).result.includes(A)) {
          log.push(`${A} thừa ở vế phải của ${ff(f)}: (${fa(f.lhs)})⁺ dưới F' (đã bỏ ${A}) vẫn chứa ${A} → ${reduced.rhs.length ? ff(reduced) : 'xoá FD này'}`);
          F = Fp;
          return true;
        }
      }
    }
    return false;
  };
  do mergeLeft(); while (step());
  return { cover: F, log };
}

// A BCNF violation on schema Ri (using F⁺ restricted to Ri): a set α ⊆ Ri
// with α⁺ ∩ Ri ⊋ α and α⁺ ⊉ Ri. Small schemas only (exponential search).
function fdBcnfViolation(R, fds, Ri) {
  for (let k = 1; k < Ri.length; k++) {
    for (const alpha of subsetsOfSize(Ri, k)) {
      const cl = fdClosure(R, fds, alpha).result;
      const beta = minus(order(Ri, cl), alpha);
      if (beta.length && !subset(Ri, cl)) return { lhs: alpha, rhs: beta };
    }
  }
  return null;
}

// BCNF decomposition (slide 7.57): replace Ri by (Ri − β) and (α ∪ β).
function fdBcnfDecompose(R, fds) {
  let result = [order(R, R)];
  const steps = [];
  for (let guard = 0; guard < 50; guard++) {
    const idx = result.findIndex(Ri => fdBcnfViolation(R, fds, Ri));
    if (idx < 0) break;
    const Ri = result[idx];
    const v = fdBcnfViolation(R, fds, Ri);
    const r1 = union(R, v.lhs, v.rhs);
    const r2 = minus(Ri, v.rhs);
    steps.push({ schema: Ri, fd: v, r1, r2 });
    result.splice(idx, 1, r1, r2);
  }
  return { result, steps };
}

// 3NF test on the original schema: for each α → A (A ∉ α) in F, α is a
// superkey or A is prime (in some candidate key).
function fdThirdNFViolations(R, fds, keys) {
  const prime = new Set((keys || fdCandidateKeys(R, fds)).flat());
  const out = [];
  for (const f of fds) {
    if (fdIsSuperkey(R, fds, f.lhs)) continue;
    const bad = minus(f.rhs, f.lhs).filter(a => !prime.has(a));
    if (bad.length) out.push({ lhs: f.lhs, rhs: bad });
  }
  return out;
}

function fdBcnfViolations(R, fds) {
  return fds.filter(f => minus(f.rhs, f.lhs).length && !fdIsSuperkey(R, fds, f.lhs));
}

// 3NF synthesis (slide 7.63) from the canonical cover.
function fdThirdNFDecompose(R, fds, letters) {
  const { cover } = fdCover(R, fds, letters);
  const schemas = [];
  const steps = [];
  for (const f of cover) {
    const s = union(R, f.lhs, f.rhs);
    if (schemas.some(x => subset(s, x))) steps.push({ kind: 'skip', fd: f, schema: s });
    else { schemas.push(s); steps.push({ kind: 'add', fd: f, schema: s }); }
  }
  const keys = fdCandidateKeys(R, fds);
  if (!schemas.some(s => keys.some(k => subset(k, s)))) {
    schemas.push(keys[0]);
    steps.push({ kind: 'key', schema: keys[0] });
  }
  // Remove schemas contained in another one.
  const result = schemas.filter((s, i) => !schemas.some((t, j) => j !== i && subset(s, t) && (!same(s, t) || j < i)));
  schemas.filter(s => !result.includes(s)).forEach(s => steps.push({ kind: 'drop', schema: s }));
  return { cover, keys, result, steps };
}

// Lossless test for a binary decomposition: R1 ∩ R2 → R1 or R1 ∩ R2 → R2.
function fdLosslessBinary(R, fds, R1, R2) {
  const common = R1.filter(a => R2.includes(a));
  const cl = fdClosure(R, fds, common).result;
  return { common, closure: cl, lossless: subset(R1, cl) || subset(R2, cl) };
}

// General lossless test (chase / tableau) for any number of schemas.
function fdLosslessChase(R, fds, schemas) {
  const rows = schemas.map((S, i) => R.map(a => (S.includes(a) ? `a:${a}` : `b${i}:${a}`)));
  let changed = true;
  while (changed) {
    changed = false;
    for (const f of fds) {
      const li = f.lhs.map(a => R.indexOf(a));
      for (let x = 0; x < rows.length; x++) {
        for (let y = x + 1; y < rows.length; y++) {
          if (!li.every(i => rows[x][i] === rows[y][i])) continue;
          for (const a of f.rhs) {
            const i = R.indexOf(a);
            const u = rows[x][i], v = rows[y][i];
            if (u === v) continue;
            const keep = u.startsWith('a:') ? u : v.startsWith('a:') ? v : u < v ? u : v;
            const drop = keep === u ? v : u;
            for (const r of rows) for (let j = 0; j < r.length; j++) if (r[j] === drop) r[j] = keep;
            changed = true;
          }
        }
      }
    }
  }
  return rows.some(r => r.every(v => v.startsWith('a:')));
}

// Dependency preservation without computing F⁺ (slide 7.53).
function fdPreserved(R, fds, schemas, f) {
  let result = [...f.lhs];
  let changed = true;
  while (changed) {
    changed = false;
    for (const Ri of schemas) {
      const t = order(Ri, fdClosure(R, fds, result.filter(a => Ri.includes(a))).result);
      const next = union(R, result, t);
      if (next.length > result.length) { result = next; changed = true; }
    }
  }
  return subset(f.rhs, result);
}

function fdParseSchemas(text, letters, R) {
  return String(text).split(/[\n;|]+/).map(s => s.replace(/^\s*R\d*\s*=\s*/i, '').trim()).filter(Boolean)
    .map(s => order(R, [...new Set(fdParseAttrs(s, letters))]));
}

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false, seed = '' } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      if (seed && fresh) await db.exec(seed);
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    if (seed) await db.exec(seed);
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

  return '<span class="lx-badge">Chưa bắt đầu</span>';
}
// Every SQL exercise of a section as one cell: blue solved, amber outline not yet right.
function cellMap(ch) {
  return `<div class="lx-cellmap" role="list" aria-label="Bài SQL của ${esc(ch.label)}">${ch.exercises.map(ex =>
    `<a role="listitem" class="${dotClass(ex.id).trim()}" href="#/${ch.key}/ex/${ex.id}" title="Bài ${esc(ex.id)} · ${esc(ex.topic)}" aria-label="Bài ${esc(ex.id)}: ${STATUS_WORD[exStatus(ex.id)] || 'chưa làm'}"></a>`).join('')}</div>`;
}
const LEGEND = '<div class="lx-legend" aria-hidden="true"><span><i class="is-pass"></i>Đã đúng</span><span><i class="is-fail"></i>Chưa đúng</span><span><i></i>Chưa làm</span></div>';

// ======================================================================
// Sidebar: the book's parts, the exam reviews, then the tools
// ======================================================================
const nav = $('#nav');
const app = $('#app');
const menuBtn = $('#menuBtn');
const partSlug = p => p.slug || 'part_' + p.number;
const PART_SLUG = DATA.part.slug || decodeURIComponent(location.pathname.split('/').slice(-2)[0] || '') || partSlug(DATA.part);
const partGroup = p => p.group || (p.review ? 'exam' : /^part_\d+$/.test(partSlug(p)) ? 'book' : 'exam');
const partLabel = p => p.label || p.short || `Part ${p.number}`;
const partTitle = p => String(p.title || '').replace(/^Part \d+\s*[—-]\s*/, '');
const partKey = p => (partGroup(p) === 'book' ? `P${p.number}` : ({ midterm: 'GK', final: 'CK' })[partSlug(p)] || partLabel(p).slice(0, 3));
const navKey = c => c.navLabel.replace(/^Chương /, 'Ch ');
const isMine = v => v === PART_SLUG || (typeof v === 'number' && v === DATA.part.number);
// Same part: a hash route. Another part: its own playground page.
const partHref = (p, hash = '') => (partSlug(p) === PART_SLUG ? hash || '#/' : `../${partSlug(p)}/playground.html${hash}`);

function renderNav(path) {
  const here = (path.match(/^\/([\w-]+)\/(?:summary|quiz|questions|ex)/) || [])[1];
  const item = (href, html, on, cls = '', title = '') =>
    `<a class="lx-nav__item${cls}${on ? ' is-active' : ''}" href="${href}"${on ? ' aria-current="page"' : ''}${title ? ` title="${esc(title)}"` : ''}>${html}</a>`;
  const navPart = p => {
    const cur = partSlug(p) === PART_SLUG;
    const head = item(partHref(p), `<span class="lx-nav__k">${esc(partKey(p))}</span><span class="lx-nav__t">${esc(partTitle(p))}</span>`,
      cur && path === '/', ` is-part${cur ? ' is-current' : ''}`, `${partLabel(p)} — ${partTitle(p)}`);
    if (!cur) return head;
    return head + `<div class="lx-nav__sub">${DATA.chapters.map(c => {
      const pr = chapterProgress(c);
      return item(`#/${c.key}`, `<span class="lx-nav__k">${esc(navKey(c))}</span><span class="lx-nav__t">${esc(c.titleVi)}</span><span class="lx-nav__c">${pr.passed}/${pr.total}</span>`,
        here === c.key, '', `${c.label} — ${c.titleVi}`);
    }).join('')}</div>`;
  };
  const group = (label, list) => (list.length ? `<div class="lx-nav__group"><div class="lx-nav__label">${label}</div>${list.map(navPart).join('')}</div>` : '');
  const markCount = getMarks().size;
  const tools = [
    item('#/marks', `${icon('star')}<span class="lx-nav__t">Đánh dấu ôn tập</span>${markCount ? `<span class="lx-nav__c">${markCount}</span>` : ''}`, path === '/marks'),
    item('#/sandbox', `${icon('terminal')}<span class="lx-nav__t">SQL tự do</span>`, path === '/sandbox'),
    item('#/schema', `${icon('table')}<span class="lx-nav__t">Lược đồ cơ sở dữ liệu</span>`, path === '/schema'),
    DATA.part.fdTool ? item('#/fd', `${icon('key')}<span class="lx-nav__t">Phụ thuộc hàm (FD)</span>`, path === '/fd') : '',
    item('../index.html', `${icon('calendar')}<span class="lx-nav__t">Lịch học &amp; kế hoạch thi</span>`, false),
  ].join('');
  nav.innerHTML = group('Theo sách', DATA.parts.filter(p => partGroup(p) === 'book')) +
    group('Ôn thi', DATA.parts.filter(p => partGroup(p) === 'exam')) +
    `<div class="lx-nav__group"><div class="lx-nav__label">Công cụ</div>${tools}</div>`;
}

// Phone: the sidebar is a full-screen sheet behind the menu button.
function toggleNav(open) {
  app.classList.toggle('is-navopen', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu');
}
menuBtn.addEventListener('click', () => toggleNav(!app.classList.contains('is-navopen')));
nav.addEventListener('click', e => { if (e.target.closest('a')) toggleNav(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('is-navopen')) { toggleNav(false); menuBtn.focus(); } });

function renderContext(ch) {
  $('#mobileTitle').textContent = ch ? `${ch.navLabel} · ${ch.titleVi}` : `${partLabel(DATA.part)} · ${partTitle(DATA.part)}`;
}

// ======================================================================
// Views
// ======================================================================
const main = $('#main');

// The course's fifteen weeks; this part's weeks carry the blue line, exams are named.
function weekStrip() {
  const mine = DATA.schedule.filter(w => w.parts.some(isMine));
  const examOf = w => (w.exam === 'midterm' ? 'Thi giữa kỳ' : w.exam === 'final' ? 'Thi cuối kỳ' : '');
  return `<div class="lx-card">
    <div class="lx-card__head"><h2 class="lx-h2">Lịch 15 tuần</h2><span class="lx-card__meta">${esc(DATA.part.weeks || '')}${mine.length ? ` · ${mine.length} tuần dùng part này` : ''}</span></div>
    <div class="lx-weeks lx-weeks--thin" role="list">${DATA.schedule.map(w => `<div class="lx-week${w.parts.some(isMine) ? ' is-on' : ''}" role="listitem" title="Tuần ${w.week}: ${esc(w.content)}${w.note ? ` — ${esc(w.note)}` : ''}">
        <span class="lx-week__n">T${w.week}</span>${examOf(w) ? `<span class="lx-week__exam">${examOf(w)}</span>` : ''}</div>`).join('')}</div>
    ${mine.length ? `<ul class="lx-weeklist">${mine.map(w => `<li><span class="n">Tuần ${w.week}</span><span>${esc(examOf(w) || w.content)}</span><span class="lx-subtle">${esc(w.note || '')}</span></li>`).join('')}</ul>`
      : '<p class="lx-subtle" style="margin:0;padding:0 20px 20px">Part này học ngoài lịch 15 tuần.</p>'}</div>`;
}

function viewHome() {
  const progress = DATA.chapters.map(chapterProgress);
  const sum = k => progress.reduce((n, p) => n + p[k], 0);
  const passed = sum('passed'), failed = sum('failed'), essays = sum('essays'), essayTotal = sum('essayTotal');
  const quizChapters = DATA.chapters.filter((ch, i) => progress[i].quiz);
  const quizPct = quizChapters.length
    ? (100 * quizChapters.reduce((n, ch) => n + progress[DATA.chapters.indexOf(ch)].quiz.best, 0) / quizChapters.reduce((n, ch) => n + ch.quiz.length, 0)).toFixed(1)
    : null;
  // Continue where the student left off: the first section not finished yet.
  const nextI = progress.findIndex(p => !isDone(p));
  const next = DATA.chapters[nextI < 0 ? 0 : nextI];
  const started = progress.some(p => p.tried || p.quiz || p.essays);
  const doneCount = progress.filter(isDone).length;
  const pct = (a, b) => (b ? (100 * a / b).toFixed(1) : 0);
  const unit = esc(DATA.part.unit.toLowerCase());
  const failCh = DATA.chapters.find((ch, i) => progress[i].failed);
  const firstFail = failCh && failCh.exercises.find(ex => exStatus(ex.id) === 'fail');
  const find = nextI < 0
    ? `Đã hoàn thành cả ${num(DATA.chapters.length)} ${unit}. Đọc lại phần ghi nhớ trước khi thi.`
    : failed
      ? `${num(failed)} bài SQL đã kiểm tra nhưng chưa đúng. Bài đầu tiên cần làm lại: <a href="#/${failCh.key}/ex/${firstFail.id}">${esc(firstFail.id)}</a>.`
      : started
        ? `Đã đúng ${num(passed)}/${num(TOTAL_EXERCISES)} bài SQL. Tiếp theo là ${esc(next.label)}: ${esc(next.titleVi)}.`
        : `Chưa bắt đầu. Mở ${esc(next.label)} và làm theo thứ tự: ${stepsOf(next).map(s => s.label.toLowerCase()).join(', ')}.`;
  const third = HAS_QUIZ
    ? `<div class="lx-kpi"><div class="lx-kpi__k">Trắc nghiệm đúng</div><div class="lx-kpi__v">${quizPct === null ? '<span class="lx-dash">–</span>' : `${quizPct}<span class="lx-kpi__u">%</span>`}</div>
        <div class="lx-kpi__n">${quizPct === null ? `Chưa làm ${unit} nào` : `${quizChapters.length}/${DATA.chapters.length} ${unit} đã làm, điểm cao nhất`}</div></div>`
    : `<div class="lx-kpi"><div class="lx-kpi__k">${esc(DATA.part.unit)} hoàn thành</div><div class="lx-kpi__v">${doneCount}<span class="lx-kpi__u"> /${DATA.chapters.length}</span></div>
        <div class="lx-kpi__n">Đúng hết bài SQL và tự chấm hết tự luận</div></div>`;
  main.innerHTML = pageHead(esc(partTitle(DATA.part)),
      `${esc(partLabel(DATA.part))}${DATA.part.weeks ? ` · ${esc(DATA.part.weeks)}` : ''} · ${num(DATA.chapters.length)} ${unit} · ${num(TOTAL_EXERCISES)} bài SQL · ${num(essayTotal)} câu tự luận`,
      `<p class="lx-find">${find}</p>`,
      `<a class="lx-btn lx-btn--primary" href="#/${next.key}">${started ? 'Tiếp tục' : 'Bắt đầu'} ${esc(next.label)} ${icon('open')}</a>`) + `
    <div class="lx-card lx-kpis">
      <div class="lx-kpi lx-kpi--lead"><div class="lx-kpi__k">Bài SQL đã đúng</div><div class="lx-kpi__v">${passed}<span class="lx-kpi__u"> /${TOTAL_EXERCISES}</span></div>
        <div class="lx-meter" role="img" aria-label="${pct(passed, TOTAL_EXERCISES)}%"><i style="width:${pct(passed, TOTAL_EXERCISES)}%"></i></div></div>
      <div class="lx-kpi"><div class="lx-kpi__k">Bài chưa đúng</div><div class="lx-kpi__v">${failed}</div>
        <div class="lx-kpi__n">${failed ? 'Đã kiểm tra, kết quả chưa khớp đáp án' : 'Không có bài nào đang sai'}</div></div>
      <div class="lx-kpi"><div class="lx-kpi__k">Tự luận đã tự chấm</div><div class="lx-kpi__v">${essays}<span class="lx-kpi__u"> /${essayTotal}</span></div>
        <div class="lx-kpi__n">Viết ra giấy, so với gợi ý, rồi đánh dấu</div></div>
      ${third}
    </div>
    <div class="lx-card">
      <div class="lx-card__head"><h2 class="lx-h2">Bản đồ bài tập</h2>${LEGEND}</div>
      <div class="lx-map">
        <div class="lx-row lx-row--head" aria-hidden="true"><span></span><span>${esc(DATA.part.unit)}</span><span>Mỗi ô là một bài SQL</span><span class="r">SQL</span><span class="r lx-row__ess">Tự luận</span><span>Trạng thái</span><span></span></div>
        ${DATA.chapters.map((ch, i) => {
          const p = progress[i];
          return `<div class="lx-row">
            <span class="lx-row__k">${esc(navKey(ch))}</span>
            <div class="lx-row__t"><a href="#/${ch.key}">${esc(ch.titleVi)}</a><div class="lx-row__sub">${esc(ch.title)}${ch.source ? ` · ${esc(ch.source)}` : ''}${p.quiz ? ` · trắc nghiệm ${p.quiz.best}/${ch.quiz.length}` : ''}</div></div>
            ${cellMap(ch)}
            <span class="r">${p.passed}<small>/${p.total}</small></span>
            <span class="r lx-row__ess">${p.essays}<small>/${p.essayTotal}</small></span>
            <span class="lx-row__st">${chapterBadge(p)}</span>
            <a class="lx-iconbtn lx-row__go" href="#/${ch.key}" data-tip="Mở ${esc(ch.label)}" aria-label="Mở ${esc(ch.label)}">${icon('open')}</a>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${weekStrip()}
    <div class="lx-card">
      <div class="lx-card__head"><h2 class="lx-h2">Cách dùng</h2><button class="lx-btn lx-btn--ghost" id="resetProgress">${icon('reset')} Xoá tiến độ part này</button></div>
      <div class="lx-card__body lx-howto">
        <dl class="lx-keys">
          <dt><kbd>Ctrl</kbd> + <kbd>Enter</kbd></dt><dd>Chạy câu SQL trong ô trả lời</dd>
          <dt><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd></dt><dd>Kiểm tra với đáp án và lưu kết quả</dd>
          <dt><kbd>Tab</kbd></dt><dd>Thụt lề hai dấu cách trong ô trả lời</dd>
        </dl>
        <ul class="lx-prose">
          <li>Mỗi ${unit} có ${PART_STEPS.length} bước: ${PART_STEPS.map(s => s.label.toLowerCase()).join(', ')}.</li>
          <li>Tự luận: viết ra giấy như trong phòng thi, mở gợi ý để so, rồi đánh dấu “Đã tự chấm”.</li>
          <li>Bấm ngôi sao ở bài SQL hoặc câu hỏi cần xem lại; các mục này nằm trong “Đánh dấu ôn tập” ở sidebar.</li>
          <li>Bài tập chạy trong một transaction rồi <code>rollback</code>, dữ liệu gốc không đổi. Muốn giữ thay đổi, dùng SQL tự do.</li>
          <li>Tiến độ và code được lưu riêng cho từng part trong trình duyệt này, và đồng bộ online khi lưu online được bật (biểu tượng đám mây ở cuối sidebar).</li>
        </ul>
      </div>
    </div>`;
  $('#resetProgress').addEventListener('click', () => {
    if (!confirm(`Xoá toàn bộ tiến độ và code của ${partLabel(DATA.part)} đã lưu trong trình duyệt?`)) return;
    try { Object.keys(localStorage).filter(k => k.startsWith(STORE_PREFIX) && k !== STORE_PREFIX + 'marks').forEach(k => lxStore.remove(k)); } catch { /* ignore */ }
    route();
  });
}

function flowNav(ch, stepKey) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === stepKey);
  const href = s => stepHref(ch, s.key);
  const prev = steps[i - 1], next = steps[i + 1];
  const count = { quiz: ch.quiz.length, questions: ch.questions.length, ex: ch.exercises.length };
  const arrow = (s, dir) => `<a class="lx-iconbtn${s ? '' : ' is-off'}" ${s ? `href="${href(s)}"` : 'aria-disabled="true"'} data-tip="${s ? `${dir}: ${s.label}` : (dir === 'Bước trước' ? 'Đây là bước đầu' : 'Đây là bước cuối')}" aria-label="${s ? `${dir}: ${s.label}` : dir}">${icon(dir === 'Bước trước' ? 'back' : 'open')}</a>`;
  return `<nav class="lx-flow" aria-label="Các bước học ${esc(ch.label)}">
    <ol class="lx-flow__steps">${steps.map((s, j) => `<li><a class="lx-tab${j === i ? ' is-active' : ''}" href="${href(s)}"${j === i ? ' aria-current="step"' : ''}>${s.label}${count[s.key] ? `<span class="n">${count[s.key]}</span>` : ''}</a></li>`).join('')}</ol>
    <div class="lx-flow__arrows">${arrow(prev, 'Bước trước')}${arrow(next, 'Bước sau')}</div>
  </nav>`;
}

function chapterPage(ch, step, lead) {
  const p = chapterProgress(ch);
  return pageHead(esc(ch.titleVi), `${esc(ch.label)} · ${esc(ch.title)} · ${num(p.passed)}/${num(p.total)} bài SQL đúng · ${num(p.essays)}/${num(p.essayTotal)} tự luận đã chấm`, leadP(lead)) + flowNav(ch, step);
}

// Footer link to the step after `key`, or back to the first step at the end.
function nextStepFoot(ch, key) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === key);
  const next = steps[i + 1];
  const count = { quiz: `${ch.quiz.length} câu trắc nghiệm`, questions: `${ch.questions.length} câu tự luận`, ex: `${ch.exercises.length} bài SQL`, summary: 'phần ghi nhớ' };
  return next
    ? `<div class="lx-card__foot"><span>Tiếp theo: ${count[next.key]}</span><a class="lx-btn lx-btn--primary" href="${stepHref(ch, next.key)}">${esc(next.label)} ${icon('open')}</a></div>`
    : `<div class="lx-card__foot"><span>Đây là bước cuối của ${esc(ch.label)}</span><a class="lx-btn" href="${stepHref(ch, steps[0].key)}">Về ${esc(steps[0].label.toLowerCase())}</a></div>`;
}

// A side column that follows the reader: an outline, a score, a checklist.
const split = (mainHtml, asideHtml) => `<div class="lx-split"><div class="lx-stack">${mainHtml}</div><aside class="lx-aside">${asideHtml}</aside></div>`;

function viewSummary(ch) {
  const label = PART_STEPS.find(s => s.key === 'summary').label;
  main.innerHTML = chapterPage(ch, 'summary', stepsOf(ch)[0].key === 'summary' ? 'Đọc kỹ phần này trước khi làm bài.' : 'Tra cứu nhanh kiến thức và các bẫy hay gặp. Đọc lại trước khi thi.') +
    split(`<div class="lx-card"><div class="lx-card__body lx-prose lx-read" id="summaryBody">${ch.summary}</div>${nextStepFoot(ch, 'summary')}</div>`,
      `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${esc(label)}</h2></div><ol class="lx-toc" id="toc"></ol></div>`);
  const heads = [...main.querySelectorAll('#summaryBody h3')];
  $('#toc').innerHTML = heads.length
    ? heads.map((h, i) => `<li><button type="button" data-h="${i}">${esc(h.textContent)}</button></li>`).join('')
    : '<li class="lx-subtle">Một mục duy nhất</li>';
  $('#toc').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) heads[+b.dataset.h].scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' }); });
}

function viewQuiz(ch) {
  const saved = store.get('quiz:' + ch.store, null);
  main.innerHTML = chapterPage(ch, 'quiz', `${ch.quiz.length} câu, mỗi câu một đáp án đúng.`) + `<form id="quiz">` +
    split(ch.quiz.map((q, i) => `
      <fieldset class="lx-card" data-i="${i}" style="margin:0;padding:0">
        <div class="lx-qhead"><legend class="lx-qno" style="float:left;padding:0">Câu ${i + 1}</legend><span class="lx-qhead__end"><span class="lx-q__state"></span>${starBtn(`quiz:${ch.key}:${i}`)}</span></div>
        <div class="lx-card__body lx-prose">
          <div>${q.q}</div>
          <div class="lx-q__opts">${q.options.map((o, j) => `
            <label class="lx-opt"><input type="radio" name="q${i}" value="${j}"><span><strong>${'ABCD'[j]}.</strong> ${o}</span></label>`).join('')}
          </div>
          <div class="lx-q__explain" hidden></div>
        </div>
      </fieldset>`).join(''),
      `<div class="lx-card">
        <div class="lx-card__head"><h2 class="lx-h2">Bài làm</h2><span class="lx-card__meta">Cao nhất ${saved ? `${num(saved.best)}/${num(ch.quiz.length)}` : '–'}</span></div>
        <div class="lx-card__body">
          <div class="lx-kpi__v"><span id="answered">0</span><span class="lx-kpi__u"> /${ch.quiz.length} đã chọn</span></div>
          <div class="lx-meter" aria-hidden="true"><i id="answeredBar" style="width:0"></i></div>
          <div class="lx-qgrid" id="quizGrid">${ch.quiz.map((q, i) => `<button type="button" class="lx-qcell" data-go="${i}" aria-label="Câu ${i + 1}">${i + 1}</button>`).join('')}</div>
          <p id="score" role="status" class="lx-aside__note">Chọn đáp án cho từng câu rồi nộp bài.</p>
        </div>
        <div class="lx-card__foot"><button class="lx-btn" type="button" id="retry">${icon('reset')} Làm lại</button><button class="lx-btn lx-btn--primary" type="submit">${icon('check')} Nộp bài</button></div>
      </div>`) + `</form>`;
  const form = $('#quiz');
  form.addEventListener('change', () => {
    const n = form.querySelectorAll('input[type=radio]:checked').length;
    $('#answered').textContent = n;
    $('#answeredBar').style.width = `${(100 * n / ch.quiz.length).toFixed(1)}%`;
    ch.quiz.forEach((q, i) => $(`#quizGrid [data-go="${i}"]`).classList.toggle('is-picked', !!form.querySelector(`input[name="q${i}"]:checked`)));
  });
  $('#quizGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) form.querySelector(`[data-i="${b.dataset.go}"]`).scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    ch.quiz.forEach((q, i) => {
      const box = form.querySelector(`[data-i="${i}"]`);
      const picked = form.querySelector(`input[name="q${i}"]:checked`);
      const ok = picked && Number(picked.value) === q.answer;
      box.querySelectorAll('.lx-opt').forEach((l, j) => {
        l.classList.toggle('is-right', j === q.answer);
        l.classList.toggle('is-wrong', !!picked && Number(picked.value) === j && j !== q.answer);
      });
      if (ok) score++;
      const qc = $(`#quizGrid [data-go="${i}"]`);
      qc.classList.remove('is-picked'); qc.classList.toggle('is-pass', !!ok); qc.classList.toggle('is-fail', !ok);
      qc.setAttribute('aria-label', `Câu ${i + 1}: ${ok ? 'đúng' : picked ? 'sai' : 'bỏ trống'}`);
      box.querySelector('.lx-q__state').innerHTML = ok
        ? '<span class="lx-badge lx-badge--success">Đúng</span>'
        : picked ? '<span class="lx-badge lx-badge--danger">Sai</span>' : '<span class="lx-badge">Bỏ trống</span>';
      const ex = box.querySelector('.lx-q__explain');
      ex.hidden = false;
      ex.innerHTML = `<strong>Đáp án ${'ABCD'[q.answer]}.</strong> ${q.explain}`;
    });
    const best = Math.max(score, saved?.best ?? 0);
    store.set('quiz:' + ch.store, { best, last: score });
    $('#score').innerHTML = `Kết quả: <strong class="n">${score}/${ch.quiz.length}</strong> (${(100 * score / ch.quiz.length).toFixed(1)}%). Điểm cao nhất: <span class="n">${best}/${ch.quiz.length}</span>.`;
    renderContext(ch);
  });
  $('#retry').addEventListener('click', () => viewQuiz(ch));
}

const KEYS = () => `<span class="lx-console__keys">${AC_TOGGLE()}<span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> chạy</span><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd> kiểm tra</span></span>`;

function viewExercise(ch, id) {
  const ex = EXERCISES.get(id) && EXERCISES.get(id).chapter === ch.key ? EXERCISES.get(id) : EXERCISES.get(ch.exercises[0].id);

  const nextCh = next ? null : DATA.chapters.slice(DATA.chapters.indexOf(ch) + 1).find(c => c.exercises.length);

        <div class="lx-card">

            <h2 class="lx-exhead__id">Bài ${ex.id}</h2>

              <span class="lx-tag">${esc(ex.topic)}</span>
              <span class="lx-tag">${LEVELS[ex.level]}</span>

              ${ex.fresh ? '<span class="lx-tag" title="Chạy trên database mới, được dùng begin/commit/rollback">Database mới</span>' : ''}
              ${ex.ordered ? '<span class="lx-tag" title="Thứ tự dòng được chấm">Chấm thứ tự</span>' : ''}

            ${starBtn('ex:' + ex.id)}
          </div>
          <div class="lx-card__body lx-stack" style="padding-top:0">
            ${ex.en ? `<blockquote class="lx-en" lang="en">${ex.en}</blockquote>` : ''}
            <div class="lx-prose">${ex.prompt}</div>
            ${ex.hint ? `<details><summary>${icon('caret')} Gợi ý</summary><div class="lx-prose">${ex.hint}</div></details>` : ''}
            <div class="lx-console">
              <div class="lx-console__bar"><label for="editor">Câu trả lời</label>${KEYS()}</div>
              ${ch.dbPanel ? '<div class="lx-edwrap"><div class="lx-edhl" id="editorHl" aria-hidden="true" hidden></div>' : ''}
              <textarea class="lx-editor" id="editor" spellcheck="false" placeholder="-- Viết câu SQL của bạn ở đây">${esc(code)}</textarea>

            </div>
            <div class="lx-actions">
              ${ch.dbPanel ? `<button class="lx-btn" id="debug" title="Chạy từng bước, xem bảng trung gian ở khung bên phải (F10: bước sau)">${icon('bug')} Debug</button>` : ''}
              <button class="lx-btn" id="run" title="Ctrl + Enter">${icon('play')} Chạy</button>

  $('#exList [aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  const editor = $('#editor');
  if (ch.dbPanel) bindDbPanel(ch, { editor, ex });

  const busy = on => buttons.forEach(b => (b.disabled = on));
  let saveTimer;
  editor.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('code:' + ex.id, editor.value), 300); });
  let passedCode = null; // the code that just passed; Ctrl+Shift+Enter again on it moves on

    try {
      const out = await serial(() => runForDisplay(editor.value, { check: ex.check, fresh: ex.fresh, seed: ex.seed }));

      feedback.innerHTML = callout('danger', esc(e.message));

    busy(false);

  $('#check').addEventListener('click', async () => {

    try {
      const res = await serial(() => gradeExercise(getDb, ex, editor.value, ex.expected));
