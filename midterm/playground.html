","type":"character varying(10)","pk":false},{"column":"type","type":"character varying(10)","pk":false}]},{"table":"lb_series","columns":[{"column":"isbn","type":"character varying(4)","pk":true},{"column":"prev_isbn","type":"character varying(4)","pk":false}]}]},{"title":"Bảng khác (marks, grade_points, bảng phụ)","note":"","core":false,"tables":[{"table":"account_txn","columns":[{"column":"account_number","type":"character varying(10)","pk":true},{"column":"date_time","type":"timestamp without time zone","pk":true},{"column":"value","type":"numeric(10,2)","pk":false}]},{"table":"daily_sales","columns":[{"column":"sale_date","type":"date","pk":true},{"column":"value","type":"numeric(8,2)","pk":false}]},{"table":"dept_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]},{"table":"emp_salary","columns":[{"column":"name","type":"character varying(20)","pk":false},{"column":"address","type":"character varying(30)","pk":false},{"column":"salary","type":"numeric(10,2)","pk":false}]},{"table":"emp_super","columns":[{"column":"person","type":"character varying(20)","pk":true},{"column":"supervisor","type":"character varying(20)","pk":false}]},{"table":"emp_title","columns":[{"column":"name","type":"character varying(20)","pk":false},{"column":"address","type":"character varying(30)","pk":false},{"column":"title","type":"character varying(20)","pk":false}]},{"table":"grade_points","columns":[{"column":"grade","type":"character varying(2)","pk":true},{"column":"points","type":"numeric(2,1)","pk":false}]},{"table":"itemcategory","columns":[{"column":"item_name","type":"character varying(10)","pk":true},{"column":"category","type":"character varying(15)","pk":false}]},{"table":"marks","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"score","type":"integer(32,0)","pk":false}]},{"table":"sales","columns":[{"column":"item_name","type":"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"gk5","store":"gk5","short":"GK-N","label":"Đề GK · Nguyên bản","navLabel":"GK Nguyên bản","kind":"Đề thi","title":"Midterm Exam — Original Exercises (Questions 1–19, 3.1–3.13)","titleVi":"Đề thi giữa kỳ — Bài tập nguyên bản của bạn","seed":"","seedFile":"","dbPanel":false,"summary":"\u003ch3>1. Phần này là gì\u003c/h3>\n\u003cp>Đây là \u003cstrong>ngân hàng đề nguyên bản\u003c/strong>: đúng các bài trong 4 file Word bài tập của bạn (đề + đáp án trong file Word đã được chạy thử trên dữ liệu mẫu). Đề thi giữa kỳ sẽ lấy từ các bài này, nên mục tiêu là \u003cstrong>tự viết lại được từng câu mà không nhìn đáp án\u003c/strong>. Phần \"Đề GK · Biến tấu\" (GK-B) là các bài đổi lược đồ / điều kiện / bẫy NULL để kiểm tra bạn hiểu chứ không học thuộc.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>File Word\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Bài trong app\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Excercises / Exercise chap 3 part 2 (trùng nội dung)\u003c/td>\u003ctd>Question 1–19: select, where, join kiểu cũ, alias, SOME, LIKE, ORDER BY, NULL, aggregate, GROUP BY\u003c/td>\u003ctd>GK5.01–GK5.19\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exercise chapter 3\u003c/td>\u003ctd>3.1–3.3 (university), 3.4a, 3.5–3.9 (insurance, marks, bank, employee)\u003c/td>\u003ctd>GK5.20 →\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exercise 3 v2\u003c/td>\u003ctd>3.4b–3.13 (insert/update/delete, DDL)\u003c/td>\u003ctd>GK5.xx\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Gợi ý cách thi thử (90 phút)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>A. Tự luận (35 phút):\u003c/strong> làm 4–5 câu trong tab \u003cem>Tự luận lý thuyết\u003c/em> (3.7, 3.2d, 3.12e, NULL, NOT IN…).\u003c/li>\u003cli>\u003cstrong>B. SQL (55 phút):\u003c/strong> bốc ngẫu nhiên khoảng 12 bài, ưu tiên các bài ★★★ (division 3.9e, \u003ccode>&gt;= ALL\u003c/code> 3.9f, outer join 3.1e, CASE update 3.10b).\u003c/li>\u003cli>Mỗi lần làm xong một cụm, mở lại \u003cstrong>Biến tấu\u003c/strong> cùng chủ đề để chắc là hiểu.\u003c/li>\u003c/ul>\n\u003ch3>3. Bẫy hay gặp trong các bài này\u003c/h3>\n\u003cul>\u003cli>\u003ccode>FROM a, b, c\u003c/code> là \u003cstrong>tích Descartes\u003c/strong>: bảng rỗng → kết quả rỗng (3.7).\u003c/li>\u003cli>\u003ccode>grade = NULL\u003c/code> luôn \u003cem>unknown\u003c/em>; phải \u003ccode>IS NULL\u003c/code> (Q16). \u003ccode>NOT IN\u003c/code> gặp NULL trong subquery → không trả dòng nào.\u003c/li>\u003cli>Inner join làm \u003cstrong>mất nhóm 0 phần tử\u003c/strong> (3.1e) → dùng \u003ccode>LEFT OUTER JOIN\u003c/code> + \u003ccode>COUNT(cột bảng phải)\u003c/code>.\u003c/li>\u003cli>\u003ccode>COUNT(*)\u003c/code> đếm cả NULL, \u003ccode>COUNT(col)\u003c/code>/\u003ccode>SUM\u003c/code>/\u003ccode>AVG\u003c/code> bỏ qua NULL.\u003c/li>\u003cli>Ràng buộc FK khi \u003cstrong>delete/insert\u003c/strong> (3.4b, 3.12e): xoá bảng được tham chiếu trước → lỗi nếu không cascade.\u003c/li>\u003cli>Update nhiều mức dùng \u003cstrong>một\u003c/strong> câu \u003ccode>CASE\u003c/code> (3.10b).\u003c/li>\u003cli>\"Tìm người cao nhất, có thể hoà\" → \u003ccode>= (select max ...)\u003c/code> hoặc \u003ccode>&gt;= ALL\u003c/code>.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>N1 · 3.7\u003c/strong> — Khi nào truy vấn trên thật sự trả về các giá trị của p.a1 nằm trong r1 \u003cstrong>hoặc\u003c/strong> r2? Xét kỹ khi r1 hoặc r2 rỗng. Viết lại cho đúng ở mọi trường hợp.","en":"\u003cp>Consider the SQL query: SELECT p.a1 FROM p, r1, r2 WHERE p.a1 = r1.a1 OR p.a1 = r2.a1. Under what conditions does the preceding query select values of p.a1 that are either in r1 or in r2? Examine carefully the cases where either r1 or r2 may be empty. (Exercise 3.7)\u003c/p>","answer":"\u003cp>FROM tạo tích Descartes p × r1 × r2 rồi WHERE lọc từng bộ.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>r1 và r2 đều không rỗng:\u003c/strong> giá trị p.a1 được chọn đúng khi nó có trong r1.a1 \u003cstrong>hoặc\u003c/strong> r2.a1 (có thể bị lặp vì ghép với mọi bộ của bảng kia).\u003c/li>\u003cli>\u003cstrong>r1 hoặc r2 rỗng (hay cả hai):\u003c/strong> tích Descartes \u003cstrong>rỗng\u003c/strong> → kết quả rỗng, dù p.a1 có trong bảng còn lại.\u003c/li>\u003c/ul>\n\u003cp>Vậy truy vấn chỉ đúng khi \u003cstrong>cả hai\u003c/strong> bảng không rỗng. Bản đúng mọi trường hợp:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT a1 FROM p\nWHERE a1 IN (SELECT a1 FROM r1)\n   OR a1 IN (SELECT a1 FROM r2);\u003c/code>\u003c/pre>"},{"q":"\u003cstrong>N2 · 3.2d\u003c/strong> — Nếu có takes.grade = NULL thì các câu tính tổng điểm / GPA (3.2a–c) còn đúng không? Sửa nếu sai.","en":"\u003cp>Given the relation grade_points(grade, points), reconsider queries 3.2(a)–(c) under the assumption that some grades might be null. Explain whether your solutions still work and, if not, provide versions that handle nulls properly. (Exercise 3.2d)\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>(a)\u003c/strong> Vẫn đúng: dòng grade NULL không thoả \u003ccode>takes.grade = grade_points.grade\u003c/code> (unknown) nên bị loại khỏi join. Chỉ có điều nếu SV không có môn nào có điểm thì SUM = NULL → dùng \u003ccode>COALESCE(SUM(...), 0)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>(b)\u003c/strong> Vẫn đúng: môn chưa có điểm bị loại \u003cstrong>trước khi\u003c/strong> tính cả tử số lẫn mẫu số (tín chỉ môn chưa có điểm không bị tính). Không có môn nào có điểm → NULL (hợp lý).\u003c/li>\u003cli>\u003cstrong>(c)\u003c/strong> Đúng với SV có môn có điểm, nhưng SV \u003cstrong>không\u003c/strong> có môn nào có điểm biến mất khỏi kết quả. Giữ mọi SV bằng scalar subquery:\u003c/li>\u003c/ul>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT student.ID,\n       (SELECT SUM(course.credits * grade_points.points) / SUM(course.credits)\n        FROM takes, course, grade_points\n        WHERE takes.ID = student.ID\n          AND takes.course_id = course.course_id\n          AND takes.grade = grade_points.grade) AS GPA\nFROM student;\u003c/code>\u003c/pre>\n\u003cp>Nếu dùng outer join thì mẫu số phải giới hạn rõ: \u003ccode>SUM(CASE WHEN takes.grade IS NOT NULL THEN course.credits END)\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>N3 · 3.12e\u003c/strong> — Xoá course CS-001 mà \u003cstrong>chưa\u003c/strong> xoá các section của nó thì chuyện gì xảy ra? Nếu FK khai báo \u003ccode>on delete cascade\u003c/code> thì sao?","en":"\u003cp>Delete the course CS-001. What will happen if you run this delete statement without first deleting offerings (sections) of this course? (Exercise 3.12e)\u003c/p>","answer":"\u003cp>\u003ccode>section.course_id\u003c/code> là foreign key tham chiếu \u003ccode>course\u003c/code>. Nếu còn section của CS-001 thì \u003ccode>DELETE FROM course WHERE course_id='CS-001'\u003c/code> \u003cstrong>vi phạm toàn vẹn tham chiếu\u003c/strong> → bị từ chối với lỗi (hành động mặc định là restrict / no action) và course \u003cstrong>không\u003c/strong> bị xoá.\u003c/p>\n\u003cp>Nếu FK khai báo \u003ccode>ON DELETE CASCADE\u003c/code>: các section của CS-001 bị xoá theo cùng course (và tiếp tục cascade xuống các dòng \u003ccode>takes\u003c/code> tham chiếu những section đó nếu takes cũng cascade).\u003c/p>"},{"q":"\u003cstrong>N4 · Q16\u003c/strong> — Vì sao \u003ccode>where grade = NULL\u003c/code> không bao giờ trả về dòng nào? Điều kiện đúng là gì? Nêu giá trị của \u003ccode>NULL = NULL\u003c/code>, \u003ccode>NULL &lt;&gt; 1\u003c/code>, \u003ccode>NULL AND FALSE\u003c/code>, \u003ccode>NULL OR TRUE\u003c/code>.","en":"\u003cp>Find the enrollments that have no grade yet (grade is NULL). Why must \"grade = NULL\" not be used? (Question 16)\u003c/p>","answer":"\u003cp>Mọi phép so sánh với NULL cho \u003cstrong>unknown\u003c/strong> (không phải true) và WHERE chỉ giữ dòng có điều kiện \u003cstrong>true\u003c/strong> → \u003ccode>grade = NULL\u003c/code> loại hết. Dùng \u003ccode>WHERE grade IS NULL\u003c/code>.\u003c/p>\n\u003cp>Logic ba giá trị: \u003ccode>NULL = NULL\u003c/code> → unknown; \u003ccode>NULL &lt;&gt; 1\u003c/code> → unknown; \u003ccode>NULL AND FALSE\u003c/code> → \u003cstrong>false\u003c/strong>; \u003ccode>NULL OR TRUE\u003c/code> → \u003cstrong>true\u003c/strong>.\u003cbr>Hệ quả: \u003ccode>COUNT(*)\u003c/code> đếm cả dòng NULL còn \u003ccode>COUNT(grade)\u003c/code> thì không.\u003c/p>"},{"q":"\u003cstrong>N5 · 3.9c\u003c/strong> — So sánh \u003ccode>employee ... NOT IN (select ID from works where ...)\u003c/code> với \u003ccode>select ID from works where company_name &lt;&gt; ...\u003c/code>. Hai câu khác nhau ở đâu?","en":"\u003cp>Find the ID of each employee who does not work for \"First Bank Corporation\". (Exercise 3.9c) Does your answer include employees that have no tuple in works at all? When is SELECT ID FROM works WHERE company_name \u003c> 'First Bank Corporation' equivalent?\u003c/p>","answer":"\u003cul>\u003cli>\u003ccode>SELECT ID FROM employee WHERE ID NOT IN (SELECT ID FROM works WHERE company_name='First Bank Corporation')\u003c/code> trả cả \u003cstrong>nhân viên không có dòng nào trong works\u003c/strong>.\u003c/li>\u003cli>\u003ccode>SELECT ID FROM works WHERE company_name &lt;&gt; 'First Bank Corporation'\u003c/code> chỉ trả người \u003cstrong>có\u003c/strong> dòng works ở công ty khác. Hai câu tương đương \u003cstrong>khi mọi nhân viên đều làm ở đâu đó\u003c/strong> (và mỗi người chỉ làm một công ty).\u003c/li>\u003c/ul>\n\u003cp>Trong dữ liệu mẫu, nhân viên 10012 (Leo Vu) không có trong works nên hai câu cho kết quả khác nhau.\u003c/p>"},{"q":"\u003cstrong>N6 · 3.1e\u003c/strong> — Câu dùng \u003ccode>section natural join takes ... group by\u003c/code> bỏ sót section nào? Sửa thế nào để section 0 sinh viên có enrollment = 0?","en":"\u003cp>Find the enrollment of each section that was offered in Fall 2017. (Exercise 3.1e) Which sections are missing from the result, and how do you list them with enrollment 0?\u003c/p>","answer":"\u003cp>Inner join (natural join) loại các section \u003cstrong>không có dòng takes\u003c/strong> → section 0 SV biến mất.\u003cbr>Sửa: \u003ccode>section LEFT OUTER JOIN takes USING (course_id, sec_id, semester, year)\u003c/code> và đếm \u003ccode>COUNT(takes.ID)\u003c/code> (\u003cstrong>không\u003c/strong> dùng \u003ccode>COUNT(*)\u003c/code> vì dòng NULL-padding vẫn được đếm thành 1).\u003cbr>Hoặc dùng scalar subquery cho mỗi section.\u003c/p>"},{"q":"\u003cstrong>N7 · 3.4b\u003c/strong> — Nếu \u003ccode>owns.license_plate\u003c/code> tham chiếu \u003ccode>car\u003c/code> không có \u003ccode>on delete cascade\u003c/code>, phải làm gì trước khi xoá xe?","en":"\u003cp>Delete all year-2010 cars belonging to the person whose ID is '12345'. What must you take care of if owns references car through a foreign key without ON DELETE CASCADE? (Exercise 3.4b)\u003c/p>","answer":"\u003cp>Phải xoá các dòng \u003ccode>owns\u003c/code> (và \u003ccode>participated\u003c/code>) tham chiếu những xe đó \u003cstrong>trước\u003c/strong>, rồi mới xoá \u003ccode>car\u003c/code>; hoặc khai báo FK với \u003ccode>ON DELETE CASCADE\u003c/code> để các dòng con tự bị xoá. Nếu không, DELETE trên car bị từ chối vì vi phạm FK.\u003c/p>"},{"q":"\u003cstrong>N8 · Q13\u003c/strong> — Viết bằng \u003ccode>&gt; SOME\u003c/code> và bằng self-join; vì sao self-join cần \u003ccode>DISTINCT\u003c/code>? \u003ccode>&gt; ALL\u003c/code> khác gì? Nếu tập con rỗng thì \u003ccode>&gt; SOME\u003c/code> và \u003ccode>&gt; ALL\u003c/code> cho kết quả gì?","en":"\u003cp>Get the names of the instructors whose salary is greater than that of at least one Biology instructor. Write it with SOME and with a self-join. (Question 13)\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT name FROM instructor\nWHERE salary &gt; SOME (SELECT salary FROM instructor WHERE dept_name='Biology');\n\nSELECT DISTINCT T.name FROM instructor AS T, instructor AS S\nWHERE T.salary &gt; S.salary AND S.dept_name = 'Biology';\u003c/code>\u003c/pre>\n\u003cp>Self-join ghép T với \u003cstrong>mọi\u003c/strong> S thoả điều kiện nên một người lương cao có thể xuất hiện nhiều lần → cần DISTINCT.\u003cbr>\u003ccode>&gt; ALL\u003c/code> đòi lớn hơn \u003cstrong>mọi\u003c/strong> phần tử (lớn hơn max). Tập con \u003cstrong>rỗng\u003c/strong>: \u003ccode>&gt; SOME\u003c/code> là \u003cstrong>false\u003c/strong>, \u003ccode>&gt; ALL\u003c/code> là \u003cstrong>true\u003c/strong> (điều kiện \"với mọi\" đúng một cách tầm thường).\u003c/p>"}],"exercises":[{"id":"GK5.01","topic":"Q1 select *","level":1,"prompt":"\u003cp>\u003cstrong>Question 1\u003c/strong> — Get all the information about every department.\u003c/p>","en":"","hint":"","solution":"SELECT * FROM department;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","building","budget"],"rows":[["Biology","Watson","90000"],["Comp. Sci.","Taylor","100000"],["Elec. Eng.","Taylor","85000"],["Finance","Painter","120000"],["History","Painter","50000"],["Music","Packard","80000"],["Physics","Watson","70000"]]}},{"id":"GK5.02","topic":"Q2 projection","level":1,"prompt":"\u003cp>\u003cstrong>Question 2\u003c/strong> — Get the name and salary of every instructor.\u003c/p>","en":"","hint":"","solution":"SELECT name, salary FROM instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","salary"],"rows":[["Srinivasan","65000"],["Wu","90000"],["Mozart","40000"],["Einstein","95000"],["El Said","60000"],["Gold","87000"],["Katz","75000"],["Califieri","62000"],["Singh","80000"],["Crick","72000"],["Brandt","92000"],["Kim","80000"]]}},{"id":"GK5.03","topic":"Q3 distinct","level":1,"prompt":"\u003cp>\u003cstrong>Question 3\u003c/strong> — List the departments that have instructors, showing each department only once.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT dept_name FROM instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Finance"],["History"],["Physics"],["Music"],["Comp. Sci."],["Biology"],["Elec. Eng."]]}},{"id":"GK5.04","topic":"Q4 arithmetic","level":1,"prompt":"\u003cp>\u003cstrong>Question 4\u003c/strong> — Show each instructor's ID, name and salary after a 10% raise.\u003c/p>","en":"","hint":"","solution":"SELECT ID, name, salary * 1.1 AS new_salary FROM instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","new_salary"],"rows":[["10101","Srinivasan","71500"],["12121","Wu","99000"],["15151","Mozart","44000"],["22222","Einstein","104500"],["32343","El Said","66000"],["33456","Gold","95700"],["45565","Katz","82500"],["58583","Califieri","68200"],["76543","Singh","88000"],["76766","Crick","79200"],["83821","Brandt","101200"],["98345","Kim","88000"]]}},{"id":"GK5.05","topic":"Q5 where","level":1,"prompt":"\u003cp>\u003cstrong>Question 5\u003c/strong> — Get the names of the instructors in the Comp. Sci. department.\u003c/p>","en":"","hint":"","solution":"SELECT name FROM instructor WHERE dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Srinivasan"],["Katz"],["Brandt"]]}},{"id":"GK5.06","topic":"Q6 where and","level":1,"prompt":"\u003cp>\u003cstrong>Question 6\u003c/strong> — Get the names of the Comp. Sci. instructors whose salary is greater than 70000.\u003c/p>","en":"","hint":"","solution":"SELECT name FROM instructor WHERE dept_name = 'Comp. Sci.' AND salary > 70000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Katz"],["Brandt"]]}},{"id":"GK5.07","topic":"Q7 in","level":1,"prompt":"\u003cp>\u003cstrong>Question 7\u003c/strong> — Get the name and department of the instructors in Physics or History.\u003c/p>","en":"","hint":"","solution":"SELECT name, dept_name FROM instructor WHERE dept_name IN ('Physics', 'History');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","dept_name"],"rows":[["Einstein","Physics"],["El Said","History"],["Gold","Physics"],["Califieri","History"]]}},{"id":"GK5.08","topic":"Q8 between","level":1,"prompt":"\u003cp>\u003cstrong>Question 8\u003c/strong> — Get the names of the instructors whose salary is between 80000 and 90000.\u003c/p>","en":"","hint":"","solution":"SELECT name FROM instructor WHERE salary BETWEEN 80000 AND 90000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Wu"],["Gold"],["Singh"],["Kim"]]}},{"id":"GK5.09","topic":"Q9 join in where","level":1,"prompt":"\u003cp>\u003cstrong>Question 9\u003c/strong> — Show each instructor's name together with the IDs of the courses they teach, joining the tables in the WHERE clause.\u003c/p>","en":"","hint":"","solution":"SELECT instructor.name, teaches.course_id\nFROM instructor, teaches\nWHERE instructor.ID = teaches.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","course_id"],"rows":[["Srinivasan","CS-101"],["Srinivasan","CS-315"],["Srinivasan","CS-347"],["Wu","FIN-201"],["Mozart","MU-199"],["Einstein","PHY-101"],["El Said","HIS-351"],["Katz","CS-101"],["Katz","CS-319"],["Crick","BIO-101"],["Crick","BIO-301"],["Brandt","CS-190"],["Brandt","CS-190"],["Brandt","CS-319"],["Kim","EE-181"]]}},{"id":"GK5.10","topic":"Q10 join + filter","level":1,"prompt":"\u003cp>\u003cstrong>Question 10\u003c/strong> — Show the name and the course IDs taught by the instructors of the Comp. Sci. department.\u003c/p>","en":"","hint":"","solution":"SELECT instructor.name, teaches.course_id\nFROM instructor, teaches\nWHERE instructor.ID = teaches.ID\n  AND instructor.dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","course_id"],"rows":[["Srinivasan","CS-101"],["Srinivasan","CS-315"],["Srinivasan","CS-347"],["Katz","CS-101"],["Katz","CS-319"],["Brandt","CS-190"],["Brandt","CS-190"],["Brandt","CS-319"]]}},{"id":"GK5.11","topic":"Q11 3-table join","level":2,"prompt":"\u003cp>\u003cstrong>Question 11\u003c/strong> — Show each student's name together with the title of every course they have taken.\u003c/p>","en":"","hint":"","solution":"SELECT student.name, course.title\nFROM student, takes, course\nWHERE student.ID = takes.ID\n  AND takes.course_id = course.course_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","title"],"rows":[["Zhang","Intro. to Computer Science"],["Zhang","Database System Concepts"],["Shankar","Intro. to Computer Science"],["Shankar","Game Design"],["Shankar","Robotics"],["Shankar","Database System Concepts"],["Brandt","World History"],["Chavez","Investment Banking"],["Peltier","Physical Principles"],["Levy","Intro. to Computer Science"],["Levy","Intro. to Computer Science"],["Levy","Image Processing"],["Williams","Intro. to Computer Science"],["Williams","Game Design"],["Sanchez","Music Video Production"],["Brown","Intro. to Computer Science"],["Brown","Image Processing"],["Aoi","Intro. to Digital Systems"],["Bourikas","Intro. to Computer Science"],["Bourikas","Robotics"],["Tanaka","Intro. to Biology"],["Tanaka","Genetics"]]}},{"id":"GK5.12","topic":"Q12 alias","level":1,"prompt":"\u003cp>\u003cstrong>Question 12\u003c/strong> — Get each instructor's name as instructor_name and their monthly salary as monthly_salary.\u003c/p>","en":"","hint":"","solution":"SELECT name AS instructor_name, salary / 12 AS monthly_salary FROM instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["instructor_name","monthly_salary"],"rows":[["Srinivasan","5416.6667"],["Wu","7500"],["Mozart","3333.3333"],["Einstein","7916.6667"],["El Said","5000"],["Gold","7250"],["Katz","6250"],["Califieri","5166.6667"],["Singh","6666.6667"],["Crick","6000"],["Brandt","7666.6667"],["Kim","6666.6667"]]}},{"id":"GK5.13","topic":"Q13 > some","level":2,"prompt":"\u003cp>\u003cstrong>Question 13\u003c/strong> — Get the names of the instructors whose salary is greater than that of at least one Biology instructor.\u003c/p>","en":"","hint":"","solution":"SELECT name FROM instructor\nWHERE salary > SOME (SELECT salary FROM instructor WHERE dept_name = 'Biology');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Wu"],["Einstein"],["Gold"],["Katz"],["Singh"],["Brandt"],["Kim"]]}},{"id":"GK5.14","topic":"Q14 like","level":1,"prompt":"\u003cp>\u003cstrong>Question 14\u003c/strong> — Get the titles of the courses that contain the string 'Comp'.\u003c/p>","en":"","hint":"","solution":"SELECT title FROM course WHERE title LIKE '%Comp%';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Computational Biology"],["Intro. to Computer Science"]]}},{"id":"GK5.15","topic":"Q15 order by","level":1,"prompt":"\u003cp>\u003cstrong>Question 15\u003c/strong> — List the instructors by salary in descending order, and by name in ascending order when salaries are equal.\u003c/p>","en":"","hint":"","solution":"SELECT * FROM instructor ORDER BY salary DESC, name ASC;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["22222","Einstein","Physics","95000"],["83821","Brandt","Comp. Sci.","92000"],["12121","Wu","Finance","90000"],["33456","Gold","Physics","87000"],["98345","Kim","Elec. Eng.","80000"],["76543","Singh","Finance","80000"],["45565","Katz","Comp. Sci.","75000"],["76766","Crick","Biology","72000"],["10101","Srinivasan","Comp. Sci.","65000"],["58583","Califieri","History","62000"],["32343","El Said","History","60000"],["15151","Mozart","Music","40000"]]}},{"id":"GK5.16","topic":"Q16 is null","level":1,"prompt":"\u003cp>\u003cstrong>Question 16\u003c/strong> — Find the enrollments that have no grade yet (grade is NULL).\u003c/p>","en":"","hint":"","solution":"SELECT * FROM takes WHERE grade IS NULL;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","course_id","sec_id","semester","year","grade"],"rows":[["98988","BIO-301","1","Summer","2018",null]]}},{"id":"GK5.17","topic":"Q17 aggregates","level":1,"prompt":"\u003cp>\u003cstrong>Question 17\u003c/strong> — Find the average, maximum and minimum salary and the number of instructors in the Comp. Sci. department.\u003c/p>","en":"","hint":"","solution":"SELECT AVG(salary) AS avg_salary, MAX(salary) AS max_salary,\n       MIN(salary) AS min_salary, COUNT(*) AS num_instructors\nFROM instructor\nWHERE dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["avg_salary","max_salary","min_salary","num_instructors"],"rows":[["77333.3333","92000","65000","3"]]}},{"id":"GK5.18","topic":"Q18 group by avg","level":1,"prompt":"\u003cp>\u003cstrong>Question 18\u003c/strong> — Find the average instructor salary in each department.\u003c/p>","en":"","hint":"","solution":"SELECT dept_name, AVG(salary) AS avg_salary FROM instructor GROUP BY dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","avg_salary"],"rows":[["Finance","85000"],["History","61000"],["Physics","91000"],["Music","40000"],["Comp. Sci.","77333.3333"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"GK5.19","topic":"Q19 group by count","level":1,"prompt":"\u003cp>\u003cstrong>Question 19\u003c/strong> — Count the students in each department.\u003c/p>","en":"","hint":"","solution":"SELECT dept_name, COUNT(*) AS num_students FROM student GROUP BY dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","num_students"],"rows":[["Finance","1"],["History","1"],["Physics","3"],["Music","1"],["Comp. Sci.","4"],["Biology","1"],["Elec. Eng.","2"]]}},{"id":"GK5.20","topic":"3.1a where","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.1a\u003c/strong> — Find the titles of courses in the Comp. Sci. department that have 3 credits.\u003c/p>","en":"","hint":"","solution":"SELECT title FROM course WHERE dept_name = 'Comp. Sci.' AND credits = 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Robotics"],["Image Processing"],["Database System Concepts"]]}},{"id":"GK5.21","topic":"3.1b 3-table join","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.1b\u003c/strong> — Find the IDs of all students who were taught by an instructor named Einstein; make sure there are no duplicates in the result.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT takes.ID\nFROM takes, teaches, instructor\nWHERE takes.course_id = teaches.course_id\n  AND takes.sec_id    = teaches.sec_id\n  AND takes.semester  = teaches.semester\n  AND takes.year      = teaches.year\n  AND teaches.ID      = instructor.ID\n  AND instructor.name = 'Einstein';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["44553"]]}},{"id":"GK5.22","topic":"3.1c max","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.1c\u003c/strong> — Find the highest salary of any instructor.\u003c/p>","en":"","hint":"","solution":"SELECT MAX(salary) FROM instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["95000"]]}},{"id":"GK5.23","topic":"3.1d scalar subquery","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.1d\u003c/strong> — Find all instructors earning the highest salary (there may be more than one with the same salary).\u003c/p>","en":"","hint":"","solution":"SELECT * FROM instructor WHERE salary = (SELECT MAX(salary) FROM instructor);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["22222","Einstein","Physics","95000"]]}},{"id":"GK5.24","topic":"3.1e enrollment","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.1e\u003c/strong> — Find the enrollment of each section that was offered in Fall 2017. (Output course_id, sec_id, enrollment — as in the exercise, sections with no students may be left out.)\u003c/p>","en":"","hint":"","solution":"SELECT course_id, sec_id, COUNT(ID) AS enrollment\nFROM section NATURAL JOIN takes\nWHERE semester = 'Fall' AND year = 2017\nGROUP BY course_id, sec_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-101","1","6"],["CS-347","1","2"],["PHY-101","1","1"]]}},{"id":"GK5.25","topic":"3.1f max of counts","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.1f\u003c/strong> — Find the maximum enrollment, across all sections, in Fall 2017.\u003c/p>","en":"","hint":"","solution":"SELECT MAX(enrollment)\nFROM (SELECT COUNT(ID) AS enrollment\n      FROM section NATURAL JOIN takes\n      WHERE semester = 'Fall' AND year = 2017\n      GROUP BY course_id, sec_id) AS sec_enrollment;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["6"]]}},{"id":"GK5.26","topic":"3.1g with + max","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.1g\u003c/strong> — Find the sections that had the maximum enrollment in Fall 2017.\u003c/p>","en":"","hint":"","solution":"WITH sec_enrollment AS (\n    SELECT course_id, sec_id, COUNT(ID) AS enrollment\n    FROM section NATURAL JOIN takes\n    WHERE semester = 'Fall' AND year = 2017\n    GROUP BY course_id, sec_id\n)\nSELECT course_id, sec_id\nFROM sec_enrollment\nWHERE enrollment = (SELECT MAX(enrollment) FROM sec_enrollment);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id"],"rows":[["CS-101","1"]]}},{"id":"GK5.27","topic":"3.2a sum of products","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.2a\u003c/strong> — Given grade_points(grade, points): find the total grade points earned by the student with ID '12345', across all courses taken by the student.\u003c/p>","en":"","hint":"","solution":"SELECT SUM(course.credits * grade_points.points) AS total_grade_points\nFROM takes, course, grade_points\nWHERE takes.ID = '12345'\n  AND takes.course_id = course.course_id\n  AND takes.grade = grade_points.grade;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["total_grade_points"],"rows":[["48"]]}},{"id":"GK5.28","topic":"3.2b GPA","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.2b\u003c/strong> — Find the grade point average (GPA) for the above student, that is, the total grade points divided by the total credits for the associated courses.\u003c/p>","en":"","hint":"","solution":"SELECT SUM(course.credits * grade_points.points) / SUM(course.credits) AS GPA\nFROM takes, course, grade_points\nWHERE takes.ID = '12345'\n  AND takes.course_id = course.course_id\n  AND takes.grade = grade_points.grade;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["gpa"],"rows":[["3.4286"]]}},{"id":"GK5.29","topic":"3.2c GPA per student","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.2c\u003c/strong> — Find the ID and the grade-point average of each student.\u003c/p>","en":"","hint":"","solution":"SELECT takes.ID,\n       SUM(course.credits * grade_points.points) / SUM(course.credits) AS GPA\nFROM takes, course, grade_points\nWHERE takes.course_id = course.course_id\n  AND takes.grade = grade_points.grade\nGROUP BY takes.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa"],"rows":[["76653","2"],["19991","3"],["76543","4"],["54321","3.5"],["44553","2.7"],["55739","3.7"],["45678","2.0182"],["12345","3.4286"],["98988","4"],["98765","2.2571"],["00128","3.8714"],["23121","2.3"]]}},{"id":"GK5.30","topic":"3.2d GPA keep all (null)","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.2d\u003c/strong> — Reconsider 3.2c when some grades might be null: write the version that keeps \u003cstrong>every\u003c/strong> student (GPA is NULL when undefined). Output ID and GPA.\u003c/p>","en":"","hint":"Scalar subquery trong SELECT (xem câu tự luận N2).","solution":"SELECT student.ID,\n       (SELECT SUM(course.credits * grade_points.points) / SUM(course.credits)\n        FROM takes, course, grade_points\n        WHERE takes.ID = student.ID\n          AND takes.course_id = course.course_id\n          AND takes.grade = grade_points.grade) AS GPA\nFROM student;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa"],"rows":[["00128","3.8714"],["12345","3.4286"],["19991","3"],["23121","2.3"],["44553","2.7"],["45678","2.0182"],["54321","3.5"],["55739","3.7"],["70557",null],["76543","4"],["76653","2"],["98765","2.2571"],["98988","4"]]}},{"id":"GK5.31","topic":"3.3a update","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.3a\u003c/strong> — Increase the salary of each instructor in the Comp. Sci. department by 10%.\u003c/p>","en":"","hint":"","solution":"UPDATE instructor SET salary = salary * 1.10 WHERE dept_name = 'Comp. Sci.';","check":"SELECT ID, salary FROM instructor ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","71500"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","82500"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","101200"],["98345","80000"]]}},{"id":"GK5.32","topic":"3.3b delete not in","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.3b\u003c/strong> — Delete all courses that have never been offered (i.e., do not occur in the section relation).\u003c/p>","en":"","hint":"","solution":"DELETE FROM course WHERE course_id NOT IN (SELECT course_id FROM section);","check":"SELECT course_id FROM course ORDER BY course_id;","ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["BIO-101"],["BIO-301"],["CS-101"],["CS-190"],["CS-315"],["CS-319"],["CS-347"],["EE-181"],["FIN-201"],["HIS-351"],["MU-199"],["PHY-101"]]}},{"id":"GK5.33","topic":"3.3c insert select","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.3c\u003c/strong> — Insert every student whose tot_cred late;","ordered":false,"fresh":false,"expected":{"fields":["license_plate"],"rows":[["CCC333"],["DDD444"],["EEE555"],["FFF666"],["GGG777"]]}},{"id":"GK5.36","topic":"3.5a case","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.5a\u003c/strong> — Relation marks(ID, score): grade F if score \u003c 40, C if 40 \u003c= score \u003c 60, B if 60 \u003c= score \u003c 80, A if 80 \u003c= score. Display the grade for each student.\u003c/p>","en":"","hint":"","solution":"SELECT ID,\n       CASE WHEN score \u003c 40 THEN 'F'\n            WHEN score \u003c 60 THEN 'C'\n            WHEN score \u003c 80 THEN 'B'\n            ELSE 'A' END AS grade\nFROM marks;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","grade"],"rows":[["00128","A"],["12345","B"],["19991","F"],["23121","B"],["44553","C"],["45678","C"],["54321","A"],["55739","C"],["70557","A"],["76543","F"],["76653","B"],["98765","B"],["98988","A"]]}},{"id":"GK5.37","topic":"3.5b with + group","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.5b\u003c/strong> — Find the number of students with each grade (same grading scheme).\u003c/p>","en":"","hint":"","solution":"WITH grades AS (\n    SELECT ID,\n           CASE WHEN score \u003c 40 THEN 'F'\n                WHEN score \u003c 60 THEN 'C'\n                WHEN score \u003c 80 THEN 'B'\n                ELSE 'A' END AS grade\n    FROM marks)\nSELECT grade, COUNT(ID) AS num_students FROM grades GROUP BY grade;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["grade","num_students"],"rows":[["B","4"],["C","3"],["F","2"],["A","4"]]}},{"id":"GK5.38","topic":"3.6 lower like","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.6\u003c/strong> — Find departments whose names contain the string \"sci\" as a substring, regardless of the case (use lower()).\u003c/p>","en":"","hint":"","solution":"SELECT dept_name FROM department WHERE LOWER(dept_name) LIKE '%sci%';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Comp. Sci."]]}},{"id":"GK5.39","topic":"3.8a except","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.8a\u003c/strong> — (Bank database) Find the ID of each customer of the bank who has an account but not a loan.\u003c/p>","en":"","hint":"","solution":"(SELECT ID FROM depositor) EXCEPT (SELECT ID FROM borrower);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["89012"],["93456"],["45678"],["67890"]]}},{"id":"GK5.40","topic":"3.8b self join","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.8b\u003c/strong> — Find the ID of each customer who lives on the same street and in the same city as customer '12345'.\u003c/p>","en":"","hint":"","solution":"SELECT F.ID\nFROM customer AS F, customer AS S\nWHERE S.ID = '12345'\n  AND F.customer_street = S.customer_street\n  AND F.customer_city   = S.customer_city;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["93456"]]}},{"id":"GK5.41","topic":"3.8c join","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.8c\u003c/strong> — Find the name of each branch that has at least one customer who has an account in the bank and who lives in \"Harrison\".\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT account.branch_name\nFROM account, depositor, customer\nWHERE depositor.ID = customer.ID\n  AND depositor.account_number = account.account_number\n  AND customer.customer_city = 'Harrison';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Brighton"],["Perryridge"]]}},{"id":"GK5.42","topic":"3.9a join","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.9a\u003c/strong> — (Employee database) Find the ID, name, and city of residence of each employee who works for \"First Bank Corporation\".\u003c/p>","en":"","hint":"","solution":"SELECT e.ID, e.person_name, e.city\nFROM employee AS e, works AS w\nWHERE e.ID = w.ID AND w.company_name = 'First Bank Corporation';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10002","Bob Tran","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK5.43","topic":"3.9b join + salary","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.9b\u003c/strong> — Find the ID, name, and city of residence of each employee who works for \"First Bank Corporation\" and earns more than $10000.\u003c/p>","en":"","hint":"","solution":"SELECT e.ID, e.person_name, e.city\nFROM employee AS e, works AS w\nWHERE e.ID = w.ID AND w.company_name = 'First Bank Corporation' AND w.salary > 10000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK5.44","topic":"3.9c not in","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.9c\u003c/strong> — Find the ID of each employee who does not work for \"First Bank Corporation\". (Employees with no works tuple count too.)\u003c/p>","en":"","hint":"","solution":"SELECT ID FROM employee\nWHERE ID NOT IN (SELECT ID FROM works WHERE company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10005"],["10006"],["10007"],["10008"],["10009"],["10010"],["10011"],["10012"],["10013"],["12345"]]}},{"id":"GK5.45","topic":"3.9d > all","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.9d\u003c/strong> — Find the ID of each employee who earns more than every employee of \"Small Bank Corporation\".\u003c/p>","en":"","hint":"","solution":"SELECT ID FROM works\nWHERE salary > ALL (SELECT salary FROM works WHERE company_name = 'Small Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10001"],["10003"],["10004"],["10007"],["10008"],["10009"],["10010"]]}},{"id":"GK5.46","topic":"3.9e division","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.9e\u003c/strong> — Assume that companies may be located in several cities. Find the name of each company that is located in every city in which \"Small Bank Corporation\" is located.\u003c/p>","en":"","hint":"not exists ((các city của Small Bank) except (các city của company S)).","solution":"SELECT S.company_name\nFROM company AS S\nWHERE NOT EXISTS (\n    (SELECT city FROM company WHERE company_name = 'Small Bank Corporation')\n    EXCEPT\n    (SELECT T.city FROM company AS T WHERE S.company_name = T.company_name));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["Small Bank Corporation"],["Small Bank Corporation"],["Mega Corp"],["Mega Corp"],["Mega Corp"]]}},{"id":"GK5.47","topic":"3.9f >= all (ties)","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.9f\u003c/strong> — Find the name of the company that has the most employees (or companies, in the case where there is a tie for the most).\u003c/p>","en":"","hint":"","solution":"SELECT company_name\nFROM works\nGROUP BY company_name\nHAVING COUNT(DISTINCT ID) >= ALL (SELECT COUNT(DISTINCT ID) FROM works GROUP BY company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["First Bank Corporation"],["Mega Corp"]]}},{"id":"GK5.48","topic":"3.9g having subquery","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.9g\u003c/strong> — Find the name of each company whose employees earn a higher salary, on average, than the average salary at \"First Bank Corporation\".\u003c/p>","en":"","hint":"","solution":"SELECT company_name\nFROM works\nGROUP BY company_name\nHAVING AVG(salary) > (SELECT AVG(salary) FROM works WHERE company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["BigBank"]]}},{"id":"GK5.49","topic":"3.10a update","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.10a\u003c/strong> — Modify the database so that the employee whose ID is '12345' now lives in \"Newtown\".\u003c/p>","en":"","hint":"","solution":"UPDATE employee SET city = 'Newtown' WHERE ID = '12345';","check":"SELECT ID, city FROM employee ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","city"],"rows":[["10001","Miami"],["10002","Miami"],["10003","Boston"],["10004","New York"],["10005","Miami"],["10006","Chicago"],["10007","Miami"],["10008","New York"],["10009","Chicago"],["10010","Miami"],["10011","Boston"],["10012","Chicago"],["10013","Boston"],["12345","Newtown"]]}},{"id":"GK5.50","topic":"3.10b update case","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.10b\u003c/strong> — Give each manager of \"First Bank Corporation\" a 10 percent raise unless the salary becomes greater than $100000; in such cases, give only a 3 percent raise. (One UPDATE statement.)\u003c/p>","en":"","hint":"","solution":"UPDATE works\nSET salary = salary * CASE WHEN salary * 1.1 > 100000 THEN 1.03 ELSE 1.1 END\nWHERE company_name = 'First Bank Corporation'\n  AND ID IN (SELECT manager_id FROM manages);","check":"SELECT ID, salary FROM works ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","93500"],["10002","9500"],["10003","60000"],["10004","94760"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","58000"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}},{"id":"GK5.51","topic":"3.11a distinct join","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.11a\u003c/strong> — Find the ID and name of each student who has taken at least one Comp. Sci. course; make sure there are no duplicate names in the result.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT student.ID, student.name\nFROM student, takes, course\nWHERE student.ID = takes.ID\n  AND takes.course_id = course.course_id\n  AND course.dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["00128","Zhang"],["12345","Shankar"],["45678","Levy"],["54321","Williams"],["76543","Brown"],["98765","Bourikas"]]}},{"id":"GK5.52","topic":"3.11b not in","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.11b\u003c/strong> — Find the ID and name of each student who has not taken any course offered before 2017.\u003c/p>","en":"","hint":"","solution":"SELECT ID, name FROM student\nWHERE ID NOT IN (SELECT ID FROM takes WHERE year \u003c 2017);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["00128","Zhang"],["12345","Shankar"],["19991","Brandt"],["23121","Chavez"],["44553","Peltier"],["45678","Levy"],["54321","Williams"],["55739","Sanchez"],["70557","Snow"],["76543","Brown"],["76653","Aoi"],["98765","Bourikas"],["98988","Tanaka"]]}},{"id":"GK5.53","topic":"3.11c group max","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.11c\u003c/strong> — For each department, find the maximum salary of instructors in that department.\u003c/p>","en":"","hint":"","solution":"SELECT dept_name, MAX(salary) AS max_salary FROM instructor GROUP BY dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","max_salary"],"rows":[["Finance","90000"],["History","62000"],["Physics","95000"],["Music","40000"],["Comp. Sci.","92000"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"GK5.54","topic":"3.11d min of max","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.11d\u003c/strong> — Find the lowest, across all departments, of the per-department maximum salary computed by the preceding query.\u003c/p>","en":"","hint":"","solution":"SELECT MIN(max_salary)\nFROM (SELECT dept_name, MAX(salary) AS max_salary FROM instructor GROUP BY dept_name) AS dept_max;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["min"],"rows":[["40000"]]}},{"id":"GK5.55","topic":"3.12a insert","level":1,"prompt":"\u003cp>\u003cstrong>Exercise 3.12a\u003c/strong> — Create a new course \"CS-001\", titled \"Weekly Seminar\", with 0 credits (department: Comp. Sci.). \u003cem>(The lab schema has CHECK credits > 0, so use 1 credit.)\u003c/em>\u003c/p>","en":"","hint":"","solution":"INSERT INTO course (course_id, title, dept_name, credits)\nVALUES ('CS-001', 'Weekly Seminar', 'Comp. Sci.', 1);","check":"SELECT * FROM course WHERE course_id = 'CS-001';","ordered":false,"fresh":false,"expected":{"fields":["course_id","title","dept_name","credits"],"rows":[["CS-001","Weekly Seminar","Comp. Sci.","1"]]}},{"id":"GK5.56","topic":"3.12b insert nulls","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.12b\u003c/strong> — (Run (a) first.) Create a section of this course in Fall 2017, with sec_id of 1, and with the location of this section not yet specified.\u003c/p>","en":"","hint":"","solution":"INSERT INTO course (course_id, title, dept_name, credits)\nVALUES ('CS-001', 'Weekly Seminar', 'Comp. Sci.', 1);\nINSERT INTO section (course_id, sec_id, semester, year, building, room_number, time_slot_id)\nVALUES ('CS-001', '1', 'Fall', 2017, NULL, NULL, NULL);","check":"SELECT * FROM section WHERE course_id = 'CS-001';","ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","semester","year","building","room_number","time_slot_id"],"rows":[["CS-001","1","Fall","2017",null,null,null]]}},{"id":"GK5.57","topic":"3.12c insert select","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.12c\u003c/strong> — (Include (a) and (b) in your script.) Enroll every student in the Comp. Sci. department in the above section.\u003c/p>","en":"","hint":"","solution":"INSERT INTO course (course_id, title, dept_name, credits)\nVALUES ('CS-001', 'Weekly Seminar', 'Comp. Sci.', 1);\nINSERT INTO section (course_id, sec_id, semester, year, building, room_number, time_slot_id)\nVALUES ('CS-001', '1', 'Fall', 2017, NULL, NULL, NULL);\nINSERT INTO takes (ID, course_id, sec_id, semester, year, grade)\nSELECT ID, 'CS-001', '1', 'Fall', 2017, NULL FROM student WHERE dept_name = 'Comp. Sci.';","check":"SELECT ID, course_id, sec_id, semester, year, grade FROM takes WHERE course_id = 'CS-001' ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","course_id","sec_id","semester","year","grade"],"rows":[["00128","CS-001","1","Fall","2017",null],["12345","CS-001","1","Fall","2017",null],["54321","CS-001","1","Fall","2017",null],["76543","CS-001","1","Fall","2017",null]]}},{"id":"GK5.58","topic":"3.12d delete","level":2,"prompt":"\u003cp>\u003cstrong>Exercise 3.12d\u003c/strong> — (Include (a)–(c) in your script.) Delete enrollments in the above section where the student's ID is 12345.\u003c/p>","en":"","hint":"","solution":"INSERT INTO course (course_id, title, dept_name, credits)\nVALUES ('CS-001', 'Weekly Seminar', 'Comp. Sci.', 1);\nINSERT INTO section (course_id, sec_id, semester, year, building, room_number, time_slot_id)\nVALUES ('CS-001', '1', 'Fall', 2017, NULL, NULL, NULL);\nINSERT INTO takes (ID, course_id, sec_id, semester, year, grade)\nSELECT ID, 'CS-001', '1', 'Fall', 2017, NULL FROM student WHERE dept_name = 'Comp. Sci.';\nDELETE FROM takes\nWHERE ID = '12345' AND course_id = 'CS-001' AND sec_id = '1' AND semester = 'Fall' AND year = 2017;","check":"SELECT ID FROM takes WHERE course_id = 'CS-001' ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["00128"],["54321"],["76543"]]}},{"id":"GK5.59","topic":"3.12e delete course (FK)","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.12e\u003c/strong> — (Include (a)–(c) in your script.) Delete the course CS-001 \u003cstrong>and make the delete succeed\u003c/strong>: remove the dependent rows in the right order (see written question N3 for what happens otherwise).\u003c/p>","en":"","hint":"takes → section → course (xoá bảng con trước).","solution":"INSERT INTO course (course_id, title, dept_name, credits)\nVALUES ('CS-001', 'Weekly Seminar', 'Comp. Sci.', 1);\nINSERT INTO section (course_id, sec_id, semester, year, building, room_number, time_slot_id)\nVALUES ('CS-001', '1', 'Fall', 2017, NULL, NULL, NULL);\nINSERT INTO takes (ID, course_id, sec_id, semester, year, grade)\nSELECT ID, 'CS-001', '1', 'Fall', 2017, NULL FROM student WHERE dept_name = 'Comp. Sci.';\nDELETE FROM takes   WHERE course_id = 'CS-001';\nDELETE FROM section WHERE course_id = 'CS-001';\nDELETE FROM course  WHERE course_id = 'CS-001';","check":"SELECT (SELECT COUNT(*) FROM course WHERE course_id = 'CS-001') AS c,\n       (SELECT COUNT(*) FROM section WHERE course_id = 'CS-001') AS s,\n       (SELECT COUNT(*) FROM takes WHERE course_id = 'CS-001') AS t,\n       (SELECT COUNT(*) FROM takes) AS all_takes;","ordered":false,"fresh":false,"expected":{"fields":["c","s","t","all_takes"],"rows":[["0","0","0","22"]]}},{"id":"GK5.60","topic":"3.12f delete lower like","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.12f\u003c/strong> — Delete all takes tuples corresponding to any section of any course with the word \"advanced\" as a part of the title; ignore case. \u003cem>(The sample data has no such course, so your script must first insert course 'CS-777' titled 'Advanced Databases' (Comp. Sci., 3 credits), a section of it (sec_id '1', Fall, 2017, no location) and an enrollment of student '12345'; then do the delete.)\u003c/em>\u003c/p>","en":"","hint":"","solution":"INSERT INTO course VALUES ('CS-777', 'Advanced Databases', 'Comp. Sci.', 3);\nINSERT INTO section VALUES ('CS-777', '1', 'Fall', 2017, NULL, NULL, NULL);\nINSERT INTO takes VALUES ('12345', 'CS-777', '1', 'Fall', 2017, NULL);\nDELETE FROM takes\nWHERE course_id IN (SELECT course_id FROM course WHERE LOWER(title) LIKE '%advanced%');","check":"SELECT (SELECT COUNT(*) FROM course WHERE course_id = 'CS-777') AS course_rows,\n       (SELECT COUNT(*) FROM takes WHERE course_id = 'CS-777') AS takes_rows,\n       (SELECT COUNT(*) FROM takes) AS all_takes;","ordered":false,"fresh":false,"expected":{"fields":["course_rows","takes_rows","all_takes"],"rows":[["1","0","22"]]}},{"id":"GK5.61","topic":"3.13 DDL insurance","level":3,"prompt":"\u003cp>\u003cstrong>Exercise 3.13\u003c/strong> — Write SQL DDL corresponding to the insurance schema (Figure 3.17): person(driver_id, name, address); car(license_plate, model, year); accident(report_number, year, location); owns(driver_id, license_plate); participated(report_number, license_plate, driver_id, damage_amount). Declare primary and foreign keys; use INT for report_number and year, NUMERIC for damage_amount. *(These tables already exist in the lab database — start with \u003ccode>DROP TABLE IF EXISTS participated, owns, accident, car, person CASCADE;\u003c/code>.)*\u003c/p>","en":"","hint":"","solution":"DROP TABLE IF EXISTS participated, owns, accident, car, person CASCADE;\nCREATE TABLE person (\n    driver_id  VARCHAR(10),\n    name       VARCHAR(50) NOT NULL,\n    address    VARCHAR(100),\n    PRIMARY KEY (driver_id));\nCREATE TABLE car (\n    license_plate VARCHAR(10),\n    model         VARCHAR(30),\n    year          INT,\n    PRIMARY KEY (license_plate));\nCREATE TABLE accident (\n    report_number INT,\n    year          INT,\n    location      VARCHAR(100),\n    PRIMARY KEY (report_number));\nCREATE TABLE owns (\n    driver_id      VARCHAR(10),\n    license_plate  VARCHAR(10),\n    PRIMARY KEY (driver_id, license_plate),\n    FOREIGN KEY (driver_id)     REFERENCES person (driver_id),\n    FOREIGN KEY (license_plate) REFERENCES car (license_plate));\nCREATE TABLE participated (\n    report_number  INT,\n    license_plate  VARCHAR(10),\n    driver_id      VARCHAR(10),\n    damage_amount  NUMERIC(12,2),\n    PRIMARY KEY (report_number, license_plate),\n    FOREIGN KEY (report_number)  REFERENCES accident (report_number),\n    FOREIGN KEY (license_plate)  REFERENCES car (license_plate),\n    FOREIGN KEY (driver_id)      REFERENCES person (driver_id));","check":"SELECT tc.table_name, tc.constraint_type, COUNT(*) AS n\nFROM information_schema.table_constraints tc\nWHERE tc.table_schema = 'public'\n  AND tc.table_name IN ('person','car','accident','owns','participated')\n  AND tc.constraint_type IN ('PRIMARY KEY','FOREIGN KEY')\nGROUP BY tc.table_name, tc.constraint_type\nUNION ALL\nSELECT 'type:' || table_name || '.' || column_name, data_type, 0\nFROM information_schema.columns\nWHERE table_schema = 'public' AND (table_name, column_name) IN (('accident','report_number'), ('participated','report_number'))\nORDER BY 1, 2;","ordered":false,"fresh":true,"expected":{"fields":["table_name","constraint_type","n"],"rows":[["accident","PRIMARY KEY","1"],["car","PRIMARY KEY","1"],["owns","FOREIGN KEY","2"],["owns","PRIMARY KEY","1"],["participated","FOREIGN KEY","3"],["participated","PRIMARY KEY","1"],["person","PRIMARY KEY","1"],["type:accident.report_number","integer","0"],["type:participated.report_number","integer","0"]]}}]},{"key":"gk6","store":"gk6","short":"GK-B","label":"Đề GK · Biến tấu","navLabel":"GK Biến tấu","kind":"Đề thi","title":"Midterm Exam — Variants of the Original Exercises","titleVi":"Đề thi giữa kỳ — Biến tấu từ bài tập của bạn","seed":"","seedFile":"","dbPanel":false,"summary":"\u003ch3>1. Cách dùng\u003c/h3>\n\u003cp>Mỗi bài ở đây là \u003cstrong>biến thể\u003c/strong> của một bài nguyên bản (ghi rõ \"← Q.. / 3.x\" trong đề): đổi điều kiện, đổi lược đồ, thêm bẫy NULL, nhóm rỗng, hoà (ties), thứ tự xoá theo foreign key. Làm sau khi đã làm được bài gốc ở \u003cstrong>GK Nguyên bản\u003c/strong>.\u003c/p>\n\u003ch3>2. Đề thi thử trọn bộ (90 phút) — gợi ý chọn bài\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phần\u003c/th>\u003cth>Chọn\u003c/th>\u003cth>Điểm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>A. Tự luận (35')\u003c/strong>\u003c/td>\u003ctd>B1, B2, B4, B6 (bốn câu bất kỳ trong 8 câu)\u003c/td>\u003ctd>4,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>B. SQL (55')\u003c/strong>\u003c/td>\u003ctd>GK6.03, .06, .10, .12, .16, .19, .22, .25, .28, .32, .36, .40\u003c/td>\u003ctd>6,0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Quy tắc biến tấu thường gặp (để tự dự đoán đề thật)\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Đổi hằng số/điều kiện\u003c/strong> (khoa, năm, ngưỡng lương) — chỉ sửa WHERE.\u003c/li>\u003cli>**Đổi \u003ccode>SOME\u003c/code> ↔ \u003ccode>ALL\u003c/code>, \u003ccode>MAX\u003c/code> ↔ \u003ccode>MIN\u003c/code>**, \u003ccode>IN\u003c/code> ↔ \u003ccode>NOT IN\u003c/code>, \u003ccode>&gt;\u003c/code> ↔ \u003ccode>&gt;=\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Thêm nhóm 0 phần tử\u003c/strong> (giảng viên chưa dạy gì, section chưa ai học) → outer join.\u003c/li>\u003cli>\u003cstrong>Hoà (ties)\u003c/strong> → \u003ccode>= (select max ..)\u003c/code> hoặc \u003ccode>&gt;= ALL\u003c/code> thay vì \u003ccode>LIMIT 1\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Đổi lược đồ\u003c/strong>: cùng dạng câu hỏi nhưng trên bank / employee / insurance.\u003c/li>\u003cli>\u003cstrong>Thêm ràng buộc\u003c/strong>: xoá/chèn đúng thứ tự vì foreign key.\u003c/li>\u003cli>\u003cstrong>Thêm NULL\u003c/strong>: \u003ccode>= NULL\u003c/code>, \u003ccode>NOT IN\u003c/code> với NULL, \u003ccode>COUNT(*)\u003c/code> vs \u003ccode>COUNT(col)\u003c/code>.\u003c/li>\u003c/ol>","quiz":[],"questions":[{"q":"\u003cstrong>B1 ← 3.7\u003c/strong> — Đổi OR thành \u003cstrong>AND\u003c/strong>: \u003ccode>select p.a1 from p, r1, r2 where p.a1 = r1.a1 and p.a1 = r2.a1\u003c/code>. Truy vấn trả gì khi r1 hoặc r2 rỗng? Có trùng lặp không? Viết lại bằng \u003ccode>INTERSECT\u003c/code>.","en":"\u003cp>Consider SELECT p.a1 FROM p, r1, r2 WHERE p.a1 = r1.a1 AND p.a1 = r2.a1. What does it return when r1 or r2 is empty? Is the result what you would expect for \"values in both r1 and r2\"? (Variant of Exercise 3.7)\u003c/p>","answer":"\u003cp>Tích Descartes p × r1 × r2: nếu r1 \u003cstrong>hoặc\u003c/strong> r2 rỗng thì kết quả \u003cstrong>rỗng\u003c/strong>. Với phép \"có trong cả hai\", kết quả rỗng lại \u003cstrong>đúng\u003c/strong> (giao với tập rỗng là rỗng) — khác với trường hợp OR ở 3.7, nơi rỗng làm mất giá trị hợp lệ.\u003cbr>Nhưng kết quả có thể \u003cstrong>lặp\u003c/strong> dòng: một giá trị a1 xuất hiện k₁ lần trong r1 và k₂ lần trong r2 sẽ được trả k₁·k₂ lần (nhân thêm số lần trong p). Bản gọn, không lặp:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT a1 FROM p INTERSECT SELECT a1 FROM r1 INTERSECT SELECT a1 FROM r2;\u003c/code>\u003c/pre>\n\u003cp>(INTERSECT mặc định loại trùng.)\u003c/p>"},{"q":"\u003cstrong>B2 ← 3.2d\u003c/strong> — Dữ liệu có 22 dòng takes, \u003cstrong>1 dòng\u003c/strong> grade NULL (98988, BIO-301). Với \u003ccode>takes left join grade_points\u003c/code>, hãy cho biết \u003ccode>count(*)\u003c/code>, \u003ccode>count(takes.grade)\u003c/code>, \u003ccode>count(grade_points.points)\u003c/code> lần lượt bằng bao nhiêu và \u003ccode>avg(points)\u003c/code> có tính dòng NULL không? Vì sao?","en":"\u003cp>Consider the query SELECT AVG(points), COUNT(*), COUNT(takes.grade) FROM takes LEFT JOIN grade_points ON takes.grade = grade_points.grade. Explain how NULL grades affect each of the aggregates. (Variant of Exercise 3.2d)\u003c/p>","answer":"\u003cp>Left join giữ cả 22 dòng takes; dòng grade NULL không khớp grade_points nên các cột của grade_points là NULL.\u003c/p>\n\u003cul>\u003cli>\u003ccode>count(*)\u003c/code> = \u003cstrong>22\u003c/strong> (đếm dòng, kể cả NULL).\u003c/li>\u003cli>\u003ccode>count(takes.grade)\u003c/code> = \u003cstrong>21\u003c/strong> (bỏ NULL).\u003c/li>\u003cli>\u003ccode>count(grade_points.points)\u003c/code> = \u003cstrong>21\u003c/strong>.\u003c/li>\u003cli>\u003ccode>avg(points)\u003c/code> \u003cstrong>bỏ qua\u003c/strong> NULL → chia cho 21 chứ không phải 22; \"GPA\" không bị kéo xuống bởi môn chưa có điểm.\u003c/li>\u003c/ul>\n\u003cp>Tổng quát: aggregate (trừ \u003ccode>count(*)\u003c/code>) bỏ qua NULL; nếu mọi giá trị đều NULL thì \u003ccode>sum/avg/min/max\u003c/code> = NULL còn \u003ccode>count\u003c/code> = 0.\u003c/p>"},{"q":"\u003cstrong>B3 ← 3.9c\u003c/strong> — Bảng t(x) = {1, 2} và s(y) = {1, NULL}. (a) \u003ccode>select x from t where x not in (select y from s)\u003c/code> trả gì? (b) Viết lại bằng \u003ccode>not exists\u003c/code> để cho kết quả đúng ý \"x không có trong s\".","en":"\u003cp>Given t(x) = {1, 2} and s(y) = {1, NULL}: what does SELECT x FROM t WHERE x NOT IN (SELECT y FROM s) return? Rewrite it with NOT EXISTS so it means \"x does not occur in s\". (Variant of Exercise 3.9c)\u003c/p>","answer":"\u003cp>(a) \u003ccode>2 NOT IN (1, NULL)\u003c/code> = \u003ccode>2&lt;&gt;1 AND 2&lt;&gt;NULL\u003c/code> = true AND \u003cstrong>unknown\u003c/strong> = \u003cstrong>unknown\u003c/strong> → dòng bị loại. Kết quả \u003cstrong>rỗng\u003c/strong> (x=1 bị loại vì 1 ∈ s, x=2 vì unknown).\u003cbr>(b)\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT x FROM t WHERE NOT EXISTS (SELECT 1 FROM s WHERE s.y = t.x);   -- trả 2\u003c/code>\u003c/pre>\n\u003cp>NOT EXISTS không bị NULL làm hỏng: \u003ccode>s.y = t.x\u003c/code> unknown chỉ làm dòng đó không thoả trong subquery, nên NOT EXISTS vẫn true.\u003c/p>"},{"q":"\u003cstrong>B4 ← 3.12e\u003c/strong> — So sánh 3 cách khai báo FK \u003ccode>section.course_id → course\u003c/code>: (1) mặc định (restrict), (2) \u003ccode>on delete cascade\u003c/code>, (3) \u003ccode>on delete set null\u003c/code>. Khi xoá course CS-101 (đã có section + takes) mỗi cách cho kết quả gì? Cách (3) có dùng được nếu \u003ccode>course_id\u003c/code> là một phần của primary key section không?","en":"\u003cp>Compare three declarations of the foreign key section.course_id → course: default (restrict), ON DELETE CASCADE, ON DELETE SET NULL. What happens when a course with sections is deleted? Can SET NULL be used when course_id is part of the primary key of section? (Variant of Exercise 3.12e)\u003c/p>","answer":"\u003col>\u003cli>\u003cstrong>Restrict/no action:\u003c/strong> DELETE bị từ chối (lỗi vi phạm FK), không có gì bị xoá.\u003c/li>\u003cli>\u003cstrong>Cascade:\u003c/strong> xoá course → xoá mọi section của nó → (nếu takes → section cũng cascade) xoá mọi dòng takes liên quan. Cả dây chuyền trong một transaction.\u003c/li>\u003cli>\u003cstrong>Set null:\u003c/strong> các section giữ lại nhưng \u003ccode>course_id\u003c/code> = NULL.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Cách (3) không dùng được\u003c/strong> khi \u003ccode>course_id\u003c/code> thuộc primary key của section (thuộc tính khoá không được NULL) → phải chọn cascade hoặc restrict. SET NULL chỉ hợp với cột cho phép NULL (ví dụ \u003ccode>advisor.i_ID\u003c/code>).\u003c/p>"},{"q":"\u003cstrong>B5 ← Q13\u003c/strong> — \u003ccode>salary &gt; all (select salary ... where dept_name = 'Astronomy')\u003c/code> và bản \u003ccode>&gt; some\u003c/code> trả về gì khi subquery rỗng? Giải thích bằng logic.","en":"\u003cp>What does SELECT name FROM instructor WHERE salary > ALL (SELECT salary FROM instructor WHERE dept_name = 'Astronomy') return, given that no department Astronomy exists? What if SOME is used instead of ALL? (Variant of Question 13)\u003c/p>","answer":"\u003cp>Khoa Astronomy không tồn tại → subquery rỗng.\u003c/p>\n\u003cul>\u003cli>\u003ccode>&gt; ALL (∅)\u003c/code> là \u003cstrong>true\u003c/strong> cho mọi dòng (\"với mọi phần tử của tập rỗng\" luôn đúng) → trả \u003cstrong>tất cả 12 giảng viên\u003c/strong>.\u003c/li>\u003cli>\u003ccode>&gt; SOME (∅)\u003c/code> là \u003cstrong>false\u003c/strong> (\"tồn tại phần tử\" của tập rỗng sai) → \u003cstrong>rỗng\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Cẩn thận khi câu hỏi \"lương cao hơn mọi giảng viên khoa X\" mà X không có ai: kết quả là tất cả.\u003c/p>"},{"q":"\u003cstrong>B6 ← Q16\u003c/strong> — Với dữ liệu mẫu, \u003ccode>count(*) ... where grade &lt;&gt; 'A'\u003c/code> và \u003ccode>... where grade &lt;&gt; 'A' or grade is null\u003c/code> khác nhau thế nào? Tính ra con số.","en":"\u003cp>For takes with 22 rows, one with a NULL grade, what are the values of (a) SELECT COUNT(*) FROM takes WHERE grade \u003c> 'A' and (b) the same query with OR grade IS NULL? (Variant of Question 16)\u003c/p>","answer":"\u003cp>Có 22 dòng takes; grade = 'A' ở \u003cstrong>7\u003c/strong> dòng (00128 CS-101; 12345 CS-190/2, CS-315, CS-347; 76543 CS-101, CS-319/2; 98988 BIO-101); 1 dòng NULL; còn lại 14 dòng có grade khác A.\u003c/p>\n\u003cul>\u003cli>(a) \u003ccode>grade &lt;&gt; 'A'\u003c/code> loại dòng NULL (unknown) → \u003cstrong>14\u003c/strong>.\u003c/li>\u003cli>(b) thêm \u003ccode>OR grade IS NULL\u003c/code> → \u003cstrong>15\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Bài học: \u003ccode>&lt;&gt;\u003c/code> không bao giờ chọn NULL; muốn \"không phải A kể cả chưa có điểm\" phải viết tường minh.\u003c/p>"},{"q":"\u003cstrong>B7 ← 3.1e\u003c/strong> — Với bài \"mỗi giảng viên dạy bao nhiêu section (0 nếu chưa dạy)\": vì sao \u003ccode>count(*)\u003c/code> sai, \u003ccode>count(teaches.course_id)\u003c/code> đúng? Có cách nào khác ngoài outer join?","en":"\u003cp>For each instructor, find the number of sections taught (0 if none). Why does COUNT(*) give a wrong answer with a LEFT OUTER JOIN? Is there an alternative to the outer join? (Variant of Exercise 3.1e)\u003c/p>","answer":"\u003cp>Left join tạo một dòng \"NULL-padded\" cho giảng viên chưa dạy; \u003ccode>COUNT(*)\u003c/code> đếm dòng đó thành \u003cstrong>1\u003c/strong>, còn \u003ccode>COUNT(teaches.course_id)\u003c/code> bỏ qua NULL → \u003cstrong>0\u003c/strong>.\u003cbr>Cách khác: scalar subquery trong SELECT:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT ID, name, (SELECT COUNT(*) FROM teaches t WHERE t.ID = i.ID) AS n FROM instructor i;\u003c/code>\u003c/pre>"},{"q":"\u003cstrong>B8 ← 3.1d, 3.11c\u003c/strong> — Tìm giảng viên có lương cao nhất \u003cstrong>trong khoa của mình\u003c/strong>: viết bằng (a) correlated subquery, (b) join với bảng max theo khoa. Cách nào xử lý hoà?","en":"\u003cp>Give two different ways to find every instructor who earns the maximum salary of his or her own department, and explain which handles ties. (Variant of Exercises 3.1d and 3.11c)\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- (a)\nSELECT * FROM instructor i\nWHERE salary = (SELECT MAX(salary) FROM instructor WHERE dept_name = i.dept_name);\n-- (b)\nSELECT i.* FROM instructor i\nJOIN (SELECT dept_name, MAX(salary) AS m FROM instructor GROUP BY dept_name) d\n  ON i.dept_name = d.dept_name AND i.salary = d.m;\u003c/code>\u003c/pre>\n\u003cp>Cả hai so bằng (\u003ccode>=\u003c/code>) nên \u003cstrong>trả cả những người hoà\u003c/strong> lương cao nhất. Dùng \u003ccode>LIMIT 1\u003c/code> mới làm mất người hoà.\u003c/p>"}],"exercises":[{"id":"GK6.01","topic":"Q4 ← raise + filter","level":1,"prompt":"\u003cp>\u003cstrong>← Question 4.\u003c/strong> Show ID, name and the salary after a 10% raise, \u003cstrong>only\u003c/strong> for the instructors whose raised salary would exceed 80000.\u003c/p>","en":"","hint":"","solution":"SELECT ID, name, salary * 1.1 AS new_salary FROM instructor WHERE salary * 1.1 > 80000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","new_salary"],"rows":[["12121","Wu","99000"],["22222","Einstein","104500"],["33456","Gold","95700"],["45565","Katz","82500"],["76543","Singh","88000"],["83821","Brandt","101200"],["98345","Kim","88000"]]}},{"id":"GK6.02","topic":"Q7 ← not in","level":1,"prompt":"\u003cp>\u003cstrong>← Question 7.\u003c/strong> Get the name and department of the instructors who are \u003cstrong>not\u003c/strong> in Physics or History.\u003c/p>","en":"","hint":"","solution":"SELECT name, dept_name FROM instructor WHERE dept_name NOT IN ('Physics', 'History');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","dept_name"],"rows":[["Srinivasan","Comp. Sci."],["Wu","Finance"],["Mozart","Music"],["Katz","Comp. Sci."],["Singh","Finance"],["Crick","Biology"],["Brandt","Comp. Sci."],["Kim","Elec. Eng."]]}},{"id":"GK6.03","topic":"Q8 ← not between","level":1,"prompt":"\u003cp>\u003cstrong>← Question 8.\u003c/strong> Get the names and salaries of the instructors whose salary is \u003cstrong>not\u003c/strong> between 60000 and 90000.\u003c/p>","en":"","hint":"","solution":"SELECT name, salary FROM instructor WHERE salary NOT BETWEEN 60000 AND 90000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","salary"],"rows":[["Mozart","40000"],["Einstein","95000"],["Brandt","92000"]]}},{"id":"GK6.04","topic":"Q10 ← join on syntax","level":2,"prompt":"\u003cp>\u003cstrong>← Question 10.\u003c/strong> Re-write it with explicit \u003ccode>JOIN ... ON\u003c/code>: name and course ID taught by instructors of the Comp. Sci. department, for sections taught in \u003cstrong>Spring\u003c/strong> only.\u003c/p>","en":"","hint":"","solution":"SELECT i.name, t.course_id\nFROM instructor i JOIN teaches t ON i.ID = t.ID\nWHERE i.dept_name = 'Comp. Sci.' AND t.semester = 'Spring';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","course_id"],"rows":[["Srinivasan","CS-315"],["Katz","CS-101"],["Katz","CS-319"],["Brandt","CS-190"],["Brandt","CS-190"],["Brandt","CS-319"]]}},{"id":"GK6.05","topic":"Q11 ← filter grade","level":2,"prompt":"\u003cp>\u003cstrong>← Question 11.\u003c/strong> Show each student's name with the title of every course in which they got \u003cstrong>A or A-\u003c/strong>, ordered by student name then title.\u003c/p>","en":"","hint":"","solution":"SELECT student.name, course.title\nFROM student, takes, course\nWHERE student.ID = takes.ID AND takes.course_id = course.course_id\n  AND takes.grade IN ('A', 'A-')\nORDER BY student.name, course.title;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["name","title"],"rows":[["Brown","Image Processing"],["Brown","Intro. to Computer Science"],["Sanchez","Music Video Production"],["Shankar","Database System Concepts"],["Shankar","Game Design"],["Shankar","Robotics"],["Tanaka","Intro. to Biology"],["Williams","Intro. to Computer Science"],["Zhang","Database System Concepts"],["Zhang","Intro. to Computer Science"]]}},{"id":"GK6.06","topic":"Q13 ← > all","level":2,"prompt":"\u003cp>\u003cstrong>← Question 13.\u003c/strong> Get the names of the instructors whose salary is greater than that of \u003cstrong>every\u003c/strong> Finance instructor.\u003c/p>","en":"","hint":"","solution":"SELECT name FROM instructor\nWHERE salary > ALL (SELECT salary FROM instructor WHERE dept_name = 'Finance');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Einstein"],["Brandt"]]}},{"id":"GK6.07","topic":"Q14 ← like variants","level":1,"prompt":"\u003cp>\u003cstrong>← Question 14.\u003c/strong> Get the titles of courses that start with 'Intro' \u003cstrong>or\u003c/strong> end with 'Systems'.\u003c/p>","en":"","hint":"","solution":"SELECT title FROM course WHERE title LIKE 'Intro%' OR title LIKE '%Systems';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Intro. to Biology"],["Intro. to Computer Science"],["Intro. to Digital Systems"]]}},{"id":"GK6.08","topic":"Q15 ← order by 3 keys","level":1,"prompt":"\u003cp>\u003cstrong>← Question 15.\u003c/strong> List ID, name, dept_name, salary of the instructors by department ascending, then salary descending, then name ascending.\u003c/p>","en":"","hint":"","solution":"SELECT ID, name, dept_name, salary FROM instructor ORDER BY dept_name ASC, salary DESC, name ASC;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["76766","Crick","Biology","72000"],["83821","Brandt","Comp. Sci.","92000"],["45565","Katz","Comp. Sci.","75000"],["10101","Srinivasan","Comp. Sci.","65000"],["98345","Kim","Elec. Eng.","80000"],["12121","Wu","Finance","90000"],["76543","Singh","Finance","80000"],["58583","Califieri","History","62000"],["32343","El Said","History","60000"],["15151","Mozart","Music","40000"],["22222","Einstein","Physics","95000"],["33456","Gold","Physics","87000"]]}},{"id":"GK6.09","topic":"Q16 ← not null","level":1,"prompt":"\u003cp>\u003cstrong>← Question 16.\u003c/strong> Find the enrollments that \u003cstrong>do\u003c/strong> have a grade and whose grade is neither 'A' nor 'A-'. Output ID, course_id, grade.\u003c/p>","en":"","hint":"","solution":"SELECT ID, course_id, grade FROM takes WHERE grade IS NOT NULL AND grade NOT IN ('A', 'A-');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","course_id","grade"],"rows":[["12345","CS-101","C"],["19991","HIS-351","B"],["23121","FIN-201","C+"],["44553","PHY-101","B-"],["45678","CS-101","F"],["45678","CS-101","B+"],["45678","CS-319","B"],["54321","CS-190","B+"],["76653","EE-181","C"],["98765","CS-101","C-"],["98765","CS-315","B"]]}},{"id":"GK6.10","topic":"Q17 ← group having","level":2,"prompt":"\u003cp>\u003cstrong>← Question 17/18.\u003c/strong> For every department that has \u003cstrong>at least 2\u003c/strong> instructors, show dept_name, number of instructors, minimum, maximum and average salary.\u003c/p>","en":"","hint":"","solution":"SELECT dept_name, COUNT(*) AS n, MIN(salary) AS min_sal, MAX(salary) AS max_sal, AVG(salary) AS avg_sal\nFROM instructor GROUP BY dept_name HAVING COUNT(*) >= 2;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","n","min_sal","max_sal","avg_sal"],"rows":[["Finance","2","80000","90000","85000"],["History","2","60000","62000","61000"],["Physics","2","87000","95000","91000"],["Comp. Sci.","3","65000","92000","77333.3333"]]}},{"id":"GK6.11","topic":"Q18 ← having avg","level":2,"prompt":"\u003cp>\u003cstrong>← Question 18.\u003c/strong> Show dept_name and average salary only for the departments whose average salary is greater than 70000.\u003c/p>","en":"","hint":"","solution":"SELECT dept_name, AVG(salary) AS avg_salary FROM instructor GROUP BY dept_name HAVING AVG(salary) > 70000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","avg_salary"],"rows":[["Finance","85000"],["Physics","91000"],["Comp. Sci.","77333.3333"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"GK6.12","topic":"Q19 ← left join count","level":2,"prompt":"\u003cp>\u003cstrong>← Question 19 / 3.1e.\u003c/strong> For \u003cstrong>every\u003c/strong> instructor, show ID, name and the number of sections taught (0 if none) as \u003ccode>num_sections\u003c/code>.\u003c/p>","en":"","hint":"left outer join + count(cột bảng phải); count(*) sẽ sai.","solution":"SELECT i.ID, i.name, COUNT(t.course_id) AS num_sections\nFROM instructor i LEFT OUTER JOIN teaches t ON i.ID = t.ID\nGROUP BY i.ID, i.name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","num_sections"],"rows":[["83821","Brandt","3"],["76543","Singh","0"],["33456","Gold","0"],["58583","Califieri","0"],["22222","Einstein","1"],["76766","Crick","2"],["12121","Wu","1"],["98345","Kim","1"],["15151","Mozart","1"],["32343","El Said","1"],["10101","Srinivasan","3"],["45565","Katz","2"]]}},{"id":"GK6.13","topic":"3.1a ← not in dept","level":1,"prompt":"\u003cp>\u003cstrong>← Exercise 3.1a.\u003c/strong> Find the titles of courses with \u003cstrong>4 credits\u003c/strong> that do \u003cstrong>not\u003c/strong> belong to the Comp. Sci. department.\u003c/p>","en":"","hint":"","solution":"SELECT title FROM course WHERE credits = 4 AND dept_name \u003c> 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Intro. to Biology"],["Genetics"],["Physical Principles"]]}},{"id":"GK6.14","topic":"3.1b ← other instructor","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.1b.\u003c/strong> Find the IDs of all students who were taught by an instructor named \u003cstrong>Srinivasan\u003c/strong> (no duplicates).\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT takes.ID\nFROM takes, teaches, instructor\nWHERE takes.course_id = teaches.course_id AND takes.sec_id = teaches.sec_id\n  AND takes.semester = teaches.semester AND takes.year = teaches.year\n  AND teaches.ID = instructor.ID AND instructor.name = 'Srinivasan';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["00128"],["12345"],["45678"],["54321"],["76543"],["98765"]]}},{"id":"GK6.15","topic":"3.1d ← second highest","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.1c/d.\u003c/strong> Find all instructors who earn the \u003cstrong>second highest\u003c/strong> salary (ties included).\u003c/p>","en":"","hint":"","solution":"SELECT * FROM instructor\nWHERE salary = (SELECT MAX(salary) FROM instructor\n                WHERE salary \u003c (SELECT MAX(salary) FROM instructor));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["83821","Brandt","Comp. Sci.","92000"]]}},{"id":"GK6.16","topic":"3.1e ← enrollment incl. 0","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.1e.\u003c/strong> Find the enrollment of \u003cstrong>each\u003c/strong> section offered in \u003cstrong>Spring 2017\u003c/strong>, including sections with no student (enrollment 0). Output course_id, sec_id, enrollment.\u003c/p>","en":"","hint":"","solution":"SELECT s.course_id, s.sec_id, COUNT(t.ID) AS enrollment\nFROM section s LEFT OUTER JOIN takes t\n  ON s.course_id = t.course_id AND s.sec_id = t.sec_id AND s.semester = t.semester AND s.year = t.year\nWHERE s.semester = 'Spring' AND s.year = 2017\nGROUP BY s.course_id, s.sec_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-190","1","0"],["CS-190","2","2"],["EE-181","1","1"]]}},{"id":"GK6.17","topic":"3.1g ← max over all terms","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.1g.\u003c/strong> Find the section(s) with the maximum enrollment over \u003cstrong>all\u003c/strong> semesters and years. Output course_id, sec_id, semester, year.\u003c/p>","en":"","hint":"","solution":"WITH e AS (\n  SELECT course_id, sec_id, semester, year, COUNT(ID) AS n FROM takes GROUP BY course_id, sec_id, semester, year)\nSELECT course_id, sec_id, semester, year FROM e WHERE n = (SELECT MAX(n) FROM e);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","semester","year"],"rows":[["CS-101","1","Fall","2017"]]}},{"id":"GK6.18","topic":"3.2 ← passed credits","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.2.\u003c/strong> For \u003cstrong>every\u003c/strong> student (including those with no course) output ID and \u003ccode>passed_credits\u003c/code>: total credits of courses where the grade is not null and not F (0 if none).\u003c/p>","en":"","hint":"","solution":"SELECT s.ID,\n       COALESCE((SELECT SUM(c.credits) FROM takes t, course c\n                 WHERE t.ID = s.ID AND t.course_id = c.course_id\n                   AND t.grade IS NOT NULL AND t.grade \u003c> 'F'), 0) AS passed_credits\nFROM student s;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","passed_credits"],"rows":[["00128","7"],["12345","14"],["19991","3"],["23121","3"],["44553","4"],["45678","7"],["54321","8"],["55739","3"],["70557","0"],["76543","7"],["76653","3"],["98765","7"],["98988","4"]]}},{"id":"GK6.19","topic":"3.3a ← update case","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.3a.\u003c/strong> In one UPDATE: Comp. Sci. instructors earning less than 70000 get a 15% raise, the other Comp. Sci. instructors get 5%.\u003c/p>","en":"","hint":"","solution":"UPDATE instructor\nSET salary = salary * CASE WHEN salary \u003c 70000 THEN 1.15 ELSE 1.05 END\nWHERE dept_name = 'Comp. Sci.';","check":"SELECT ID, salary FROM instructor ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","74750"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","78750"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","96600"],["98345","80000"]]}},{"id":"GK6.20","topic":"3.3b ← delete idle instructors","level":2,"prompt":"\u003cp>\u003cstrong
