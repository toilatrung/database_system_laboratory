      passedCode = res.ok ? editor.value : null;
      feedback.innerHTML = res.ok
        ? callout('success', `<strong>Chính xác.</strong> Kết quả khớp với đáp án.${advanceHref ? ` <a href="${advanceHref}">Sang ${advanceLabel}</a> (hoặc bấm <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd> lần nữa)` : ''}`)
        : callout('warning', `<strong>Chưa đúng.</strong> ${esc(res.reason)}`);
      output.innerHTML = res.actual ? tableHtml(res.actual, ex.check ? 'Câu kiểm tra với code của bạn (đã chuẩn hoá)' : 'Kết quả của bạn (đã chuẩn hoá)') : '';
      $('#exState').innerHTML = exBadge(ex.id);
      const dot = $(`#exList [data-id="${ex.id}"] .lx-dot`);
      if (dot) { dot.className = 'lx-dot' + dotClass(ex.id); dot.setAttribute('aria-label', STATUS_WORD[exStatus(ex.id)]); }
      const np = chapterProgress(ch);
      $('#exCount').innerHTML = `${num(np.passed)}/${num(np.total)} đúng`;
      renderNav(location.hash.slice(1).split('?')[0]);
      renderContext(ch);
    } catch (e) {
      feedback.innerHTML = callout('danger', esc(e.message));
    }
    busy(false);
  });

  $('#showExpected').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = tableHtml(ex.expected, ex.check ? 'Kết quả mong đợi của câu kiểm tra' : 'Kết quả mong đợi') +
      (ex.check ? `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Câu truy vấn kiểm tra</h3></div><div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.check)}</code></pre></div></div>` : '');
  });

  $('#showSolution').addEventListener('click', () => {
    feedback.innerHTML = '';
    output.innerHTML = `<div class="lx-card"><div class="lx-card__head"><h3 class="lx-h2">Đáp án tham khảo</h3>
        <button class="lx-btn lx-btn--ghost" id="useSolution">${icon('copy')} Chép vào ô trả lời</button></div>
      <div class="lx-card__body"><pre class="code" style="margin:0"><code>${esc(ex.solution)}</code></pre></div>
      <div class="lx-card__foot">Có thể có nhiều cách viết đúng khác.</div></div>`;
    $('#useSolution').addEventListener('click', () => { editor.value = ex.solution; store.set('code:' + ex.id, editor.value); editor.focus(); });
  });
}

  from: 'lấy mọi dòng của bảng nguồn',

  having: 'chỉ giữ các nhóm thoả điều kiện',
  select: 'tính các cột cần lấy',

};
const oneLine = (s, n = 56) => { const t = s.replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

function bindDbPanel(ch, { editor, ex }) {
  const DB_TABLES = dbTablesOf(ch);
  const fab = $('#dbFab'), drawer = $('#dbDrawer'), scrim = $('#dbScrim');
  const tabs = drawer.querySelector('.lx-dbtabs');
  const query = $('#dbQuery'), out = $('#dbOut');
  const setOpen = (open, focus = true) => {
    drawer.hidden = !open; scrim.hidden = !open;
    fab.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('is-dbopen', open);
    store.set('dbOpen', open);
    markEditor();
    if (!focus) return;
    const mode = store.get('dbMode', 'tables');
    if (open) (mode === 'query' ? query : mode === 'debug' ? $('#dbg [aria-current="step"]') || $('#dbClose') : drawer.querySelector('.lx-dbtab[aria-selected="true"]') || $('#dbClose')).focus();
    else fab.focus({ preventScroll: true });
  };
  const setMode = mode => {
    store.set('dbMode', mode);
    drawer.querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('is-active', b.dataset.mode === mode); b.setAttribute('aria-selected', String(b.dataset.mode === mode)); });
    drawer.querySelectorAll('[data-pane]').forEach(p => (p.hidden = p.dataset.pane !== mode));
    markEditor();
  };

  // ---------- Debug ----------
  // One run computes every step (in a transaction that is rolled back); the
  // buttons then only move between the stored results.
  const hl = $('#editorHl'), dbg = $('#dbg');
  let session = null; // { steps, total, sel, code, stale }
  const debugVisible = () => !drawer.hidden && store.get('dbMode', 'tables') === 'debug';
  function markEditor() {
    if (!session || session.stale || !debugVisible()) { hl.hidden = true; return; }
    const [a, b] = session.steps[session.sel].range;
    const text = editor.value;
    hl.innerHTML = `${esc(text.slice(0, a))}<mark>${esc(text.slice(a, b))}</mark>${esc(text.slice(b))}\n`;
    hl.hidden = false;
    hl.style.width = editor.clientWidth + 'px';
    hl.style.height = editor.clientHeight + 'px';
    // Keep the marked lines in view inside the answer box.
    const mark = hl.querySelector('mark');
    const top = mark.offsetTop, bottom = top + mark.offsetHeight;
    if (top < editor.scrollTop || bottom > editor.scrollTop + editor.clientHeight) editor.scrollTop = Math.max(0, top - 24);
    hl.scrollTop = editor.scrollTop;
  }
  editor.addEventListener('scroll', () => { hl.scrollTop = editor.scrollTop; });
  new ResizeObserver(() => { if (!hl.hidden) { hl.style.width = editor.clientWidth + 'px'; hl.style.height = editor.clientHeight + 'px'; } }).observe(editor);
  editor.addEventListener('input', () => {
    if (!session || session.stale || editor.value === session.code) return;
    session.stale = true;
    renderDebug();
  });

  const rowsWord = s => (s.error ? 'lỗi' : s.note ? '—' : s.table ? `${s.table.rows.length} dòng` : s.after ? `${s.after.rows.length} dòng` : 'OK');
  function renderDebug() {
    if (!session) {
      dbg.innerHTML = `<p class="lx-dbg__empty">Bấm <strong>${icon('bug')} Debug</strong> dưới ô trả lời để chạy câu SQL từng bước. Mỗi câu lệnh là một bước; trong một SELECT, các mệnh đề chạy theo đúng thứ tự PostgreSQL xử lý: <code class="lx-code">FROM</code> (từng <code class="lx-code">JOIN</code>) → <code class="lx-code">WHERE</code> → <code class="lx-code">GROUP BY</code> → <code class="lx-code">HAVING</code> → <code class="lx-code">SELECT</code> → <code class="lx-code">ORDER BY</code>, và bảng trung gian của mỗi bước hiện ở đây. Không bước nào làm đổi dữ liệu.</p>`;
      markEditor();
      return;
    }
    const { steps, total } = session;
    let lastStmt = 0;
    dbg.innerHTML = `
      <div class="lx-dbg__bar">
        <button type="button" class="lx-btn lx-btn--ghost" id="dbgPrev" title="Shift + F10">${icon('back')} Trước</button>
        <span class="lx-dbg__pos" aria-live="polite"></span>
        <button type="button" class="lx-btn" id="dbgNext" title="F10">Sau ${icon('open')}</button>
      </div>
      ${session.stale ? `<div class="lx-dbg__stale">${callout('warning', 'Code đã đổi sau lần debug này. Bấm <strong>Debug</strong> để chạy lại.')}</div>` : ''}
      <ol class="lx-dbg__steps" id="dbgSteps" aria-label="Các bước">${steps.map((s, i) => {
        const head = s.stmtCount > 1 && s.stmt !== lastStmt ? `<li class="lx-dbg__grp">Câu lệnh ${s.stmt}</li>` : '';
        lastStmt = s.stmt;
        return `${head}<li><button type="button" class="lx-dbg__step${s.error ? ' is-error' : s.note ? ' is-note' : ''}" data-i="${i}">
          <span class="lx-dbg__no">${i + 1}</span><span class="lx-dbg__kw">${esc(s.label)}</span>
          <span class="lx-dbg__src">${esc(oneLine(session.code.slice(...s.range).replace(new RegExp('^' + s.label.split(/\s+/).map(w => w.replace(/\W/g, '\\$&')).join('\\s+') + '\\s*', 'i'), '')) || '…')}</span><span class="lx-dbg__n">${rowsWord(s)}</span></button></li>`;
      }).join('')}
      ${steps.length < total ? `<li class="lx-dbg__grp">Dừng vì lỗi: ${total - steps.length} bước sau không chạy</li>` : ''}</ol>
      <div class="lx-dbg__cur" id="dbgCur"></div>
      <div class="lx-dbdata" id="dbgOut"></div>`;
    $('#dbgPrev').addEventListener('click', () => selectStep(session.sel - 1));
    $('#dbgNext').addEventListener('click', () => selectStep(session.sel + 1));
    $('#dbgSteps').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) selectStep(+b.dataset.i); });
    selectStep(session.sel, false);
  }
  function selectStep(i, focus = true) {
    if (!session) return;
    const { steps } = session;
    session.sel = Math.max(0, Math.min(steps.length - 1, i));
    const s = steps[session.sel];
    dbg.querySelector('.lx-dbg__pos').innerHTML = `Bước <b>${session.sel + 1}</b> / ${steps.length}`;
    $('#dbgPrev').disabled = session.sel === 0;
    $('#dbgNext').disabled = session.sel === steps.length - 1;
    dbg.querySelectorAll('.lx-dbg__step').forEach(b => b.toggleAttribute('aria-current', false));
    const btn = dbg.querySelector(`.lx-dbg__step[data-i="${session.sel}"]`);
    btn.setAttribute('aria-current', 'step');
    btn.scrollIntoView({ block: 'nearest' });
    if (focus && dbg.contains(document.activeElement)) btn.focus();

    const kind = s.label.startsWith(',') ? 'cross' : s.label === 'SELECT DISTINCT' ? 'distinct' : s.kind;
    const last = s.real && steps.filter(x => x.stmt === s.stmt).pop() === s;
    $('#dbgCur').innerHTML = `<p><b>${esc(s.label)}</b> — ${DBG_WHAT[kind]}${last ? '. Đây là kết quả của câu lệnh' : ''}.</p>
      <details${store.get('dbgSql', false) ? ' open' : ''}><summary>Câu SQL chạy ở bước này</summary><pre class="code"><code>${esc(s.sql)}</code></pre></details>`;
    $('#dbgCur details').addEventListener('toggle', e => store.set('dbgSql', e.target.open));

    const o = $('#dbgOut');
    if (s.error) o.innerHTML = callout('danger', `<strong>Lỗi SQL.</strong> ${esc(s.error)}`);
    else if (s.note) o.innerHTML = callout('warning', `Bước này không tách riêng ra chạy được (${esc(s.note)}). Xem bước sau.`);
    else if (s.table) o.innerHTML = dataTable(s.table);
    else if (s.after) o.innerHTML = `<p class="lx-dbg__sub">OK, ${num(s.affected)} dòng bị ảnh hưởng. Bảng <code class="lx-code">${esc(s.snapshot)}</code> sau câu lệnh:</p>${dataTable(s.after)}`;
    else o.innerHTML = `<p class="lx-dbg__sub">OK${s.affected ? `, ${num(s.affected)} dòng bị ảnh hưởng` : ''}.</p>`;
    markEditor();
  }
  async function startDebug() {
    const code = editor.value;
    if (!code.trim()) return;
    store.set('code:' + ex.id, code);
    setMode('debug');
    if (drawer.hidden) setOpen(true, false);
    dbg.innerHTML = '<p class="lx-dbg__empty">Đang chạy từng bước…</p>';
    $('#debug').disabled = true;
    try {
      const res = await serial(async () => {
        const db = await getDb(ex.fresh);
        try { return await runDebug(db, code, { seed: ex.seed, fresh: ex.fresh }); }
        finally { if (ex.fresh) await db.close(); }
      });
      // Open on the failing step, otherwise on the first one.
      const failed = res.steps.findIndex(s => s.error);
      session = { ...res, code, stale: editor.value !== code, sel: failed >= 0 ? failed : 0 };
      if (!res.steps.length) { session = null; dbg.innerHTML = '<p class="lx-dbg__empty">Không có câu lệnh nào để chạy.</p>'; return; }
      renderDebug();
      dbg.querySelector('[aria-current="step"]')?.focus({ preventScroll: true });
    } catch (e) {
      dbg.innerHTML = callout('danger', esc(e.message));
    } finally {
      $('#debug').disabled = false;
    }
  }
  $('#debug').addEventListener('click', startDebug);
  // Arrow keys in the step list; F10 / Shift+F10 anywhere on the exercise.
  dbg.addEventListener('keydown', e => {
    const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (!d || !session || !e.target.closest('.lx-dbg__steps, .lx-dbg__bar')) return;
    e.preventDefault();
    selectStep(session.sel + d);
    dbg.querySelector('[aria-current="step"]')?.focus();
  });
  drawer.closest('.lx-work').addEventListener('keydown', e => {
    if (e.key !== 'F10') return;
    e.preventDefault();
    if (!session) { if (!e.shiftKey) startDebug(); return; }
    if (!debugVisible()) { setMode('debug'); if (drawer.hidden) setOpen(true, false); }
    selectStep(session.sel + (e.shiftKey ? -1 : 1));
  });
  renderDebug();
  fab.addEventListener('click', () => setOpen(drawer.hidden));
  $('#dbClose').addEventListener('click', () => setOpen(false));
  scrim.addEventListener('click', () => setOpen(false));
  drawer.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); setOpen(false); } });
  drawer.querySelector('.lx-dbmode').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });

  query.value = store.get('dbQuery', '');
  let saveTimer;
  query.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('dbQuery', query.value), 300); });
  const runQuery = async () => {
    if (!query.value.trim()) return;
    store.set('dbQuery', query.value);
    $('#dbRun').disabled = true;
    out.innerHTML = '<p class="lx-subtle" style="margin:0;padding:12px 16px">Đang chạy…</p>';
    const res = await serial(() => runForDisplay(query.value, { seed: ch.seed }));
    const last = res.results.filter(r => r.fields.length).pop();
    out.innerHTML = res.error ? callout('danger', `<strong>Lỗi SQL.</strong> ${esc(res.error)}`)
      : last ? dataTable(last) : '<p class="lx-subtle" style="margin:0;padding:12px 16px">Đã chạy, không có bảng kết quả.</p>';
    $('#dbRun').disabled = false;
  };
  $('#dbRun').addEventListener('click', runQuery);
  query.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runQuery(); } });
  attachAutocomplete(query, DB_TABLES);

  const show = async name => {
    const t = DB_TABLES.find(x => x.table === name) || DB_TABLES[0];
    store.set('dbTable:' + ch.key, t.table);
    tabs.querySelectorAll('.lx-dbtab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t.table)));
    $('#dbCols').innerHTML = `<b>${esc(t.table)}</b>(${t.columns.map(c => `<span${c.pk ? ' class="is-pk"' : ''} title="${esc(c.type)}">${esc(c.column)}</span>`).join(', ')})`;
    const data = $('#dbData');
    const key = ch.key + ':' + t.table;
    if (!dbRows.has(key)) {
      data.innerHTML = '<p class="lx-subtle" style="margin:0;padding:12px 16px">Đang tải…</p>';
      const res = await serial(() => runForDisplay(`select * from ${t.table}`, { seed: ch.seed }));
      if (res.error) { data.innerHTML = callout('danger', esc(res.error)); return; }
      dbRows.set(key, res.results[res.results.length - 1]);
    }
    // The reader may have picked another table (or left the page) while this one loaded.
    if (!data.isConnected || store.get('dbTable:' + ch.key, '') !== t.table) return;
    data.innerHTML = dataTable(dbRows.get(key));
  };
  setMode(store.get('dbMode', 'tables'));
  if (store.get('dbOpen', false)) { drawer.hidden = false; scrim.hidden = false; fab.setAttribute('aria-expanded', 'true'); document.body.classList.add('is-dbopen'); }
  tabs.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) show(b.dataset.t); });
  tabs.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const list = [...tabs.querySelectorAll('.lx-dbtab')];
    const i = list.findIndex(b => b.getAttribute('aria-selected') === 'true');
    const next = list[(i + (e.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length];
    next.focus();
    show(next.dataset.t);
  });
  show(store.get('dbTable:' + ch.key, DB_TABLES.some(t => t.table === 'takes') ? 'takes' : DB_TABLES[0].table));
}

const FD_PRESETS = [
  { name: 'PE 7.1, 7.6, 7.7, 7.13 — R(A,B,C,D,E)', R: 'ABCDE', F: 'A -> BC\nCD -> E\nB -> D\nE -> A', alpha: 'B', decomp: 'ABC\nADE' },
  { name: 'Slide — R(A,B,C,G,H,I), (AG)⁺', R: 'ABCGHI', F: 'A -> B\nA -> C\nCG -> H\nCG -> I\nB -> H', alpha: 'AG', decomp: '' },
  { name: 'Slide — canonical cover R(A,B,C)', R: 'ABC', F: 'A -> BC\nB -> C\nA -> B\nAB -> C', alpha: '', decomp: '' },
  { name: 'Slide — R = (A,B,C), A→B, B→C', R: 'ABC', F: 'A -> B\nB -> C', alpha: '', decomp: 'AB\nBC' },
  { name: 'PE 7.14 — nhiều canonical cover', R: 'XYZ', F: 'X -> YZ\nY -> XZ\nZ -> XY', alpha: '', decomp: '' },
  { name: 'PE 7.17 — nhiều phân rã BCNF', R: 'ABCD', F: 'A -> B\nC -> D\nB -> C', alpha: '', decomp: 'AB\nCD\nAC' },
  { name: 'in_dep (instructor ⋈ department)', R: 'ID, name, salary, dept_name, building, budget', F: 'ID -> name, salary, dept_name\ndept_name -> building, budget', alpha: 'dept_name', decomp: 'ID, name, salary, dept_name\ndept_name, building, budget' },
  { name: 'Lossy — employee tách theo name', R: 'ID, name, street, city, salary', F: 'ID -> name, street, city, salary', alpha: '', decomp: 'ID, name\nname, street, city, salary' },
  { name: 'dept_advisor — BCNF không bảo toàn FD', R: 's_ID, i_ID, dept_name', F: 'i_ID -> dept_name\ns_ID, dept_name -> i_ID', alpha: '', decomp: 's_ID, i_ID\ni_ID, dept_name' },
  { name: 'class — ví dụ phân rã BCNF', R: 'course_id, title, dept_name, credits, sec_id, semester, year, building, room_number, capacity, time_slot_id', F: 'course_id -> title, dept_name, credits\nbuilding, room_number -> capacity\ncourse_id, sec_id, semester, year -> building, room_number, time_slot_id', alpha: '', decomp: '' },
  { name: 'cust_banker_branch — ví dụ 3NF', R: 'customer_id, employee_id, branch_name, type', F: 'customer_id, employee_id -> type\nemployee_id -> branch_name\ncustomer_id, branch_name -> employee_id', alpha: '', decomp: '' },

function fdReport(input) {
  const { R, fds, letters, errors } = fdParse(input.R, input.F);
  if (!R.length) return callout('warning', 'Nhập lược đồ R trước.');
  if (errors.length) return callout('danger', errors.map(esc).join('<br>'));
  const A = xs => `<span class="lx-mono">${esc(fdFormat(xs, letters))}</span>`;
  const FD = f => `<span class="lx-mono">${esc(fdFormatFD(f, letters))}</span>`;
  const card = (title, body, tag = '') => `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${title}</h2>${tag}</div><div class="lx-card__body lx-prose">${body}</div></div>`;
  const ok = (yes, a, b) => `<span class="lx-badge lx-badge--${yes ? 'success' : 'warning'}">${yes ? a : b}</span>`;
  const out = [];

  const alpha = fdParseAttrs(input.alpha || '', letters).filter(a => R.includes(a));
  if (alpha.length) {
    const c = fdClosure(R, fds, alpha);
    out.push(card(`Bao đóng (${esc(fdFormat(alpha, letters))})⁺`, `<ol><li>result := ${A(alpha)}</li>${c.steps.map(s => `<li>Dùng ${FD(s.fd)}: thêm ${A(s.added)} → result = ${A(s.result)}</li>`).join('')}</ol>
      <p>Kết quả: (${A(alpha)})⁺ = ${A(c.result)}. ${c.result.length === R.length ? `${A(alpha)} là <strong>superkey</strong>.` : `Không phải superkey (thiếu ${A(R.filter(a => !c.result.includes(a)))}).`}</p>`));
  }

  const keys = fdCandidateKeys(R, fds);
  const prime = R.filter(a => keys.some(k => k.includes(a)));
  const bcnfBad = fdBcnfViolations(R, fds);
  const nf3Bad = fdThirdNFViolations(R, fds, keys);
  out.push(card('Khoá và dạng chuẩn của R', `<p>Candidate key: ${keys.map(A).join(', ')}.</p>
    <p>Thuộc tính khoá (prime): ${A(prime)}${prime.length < R.length ? `; không khoá: ${A(R.filter(a => !prime.includes(a)))}` : ''}.</p>
    <p>BCNF ${ok(!bcnfBad.length, 'Đạt', 'Không đạt')} ${bcnfBad.length ? `— vi phạm (vế trái không phải superkey): ${bcnfBad.map(FD).join(', ')}` : '— mọi FD không tầm thường trong F có vế trái là superkey.'}</p>
    <p>3NF ${ok(!nf3Bad.length, 'Đạt', 'Không đạt')} ${nf3Bad.length ? `— vi phạm (vế trái không phải superkey và vế phải có thuộc tính không khoá): ${nf3Bad.map(FD).join(', ')}` : '— mỗi FD có vế trái là superkey hoặc vế phải chỉ gồm thuộc tính khoá.'}</p>
    <p class="lx-subtle">Kiểm tra trên F đã cho là đủ cho lược đồ R ban đầu (slide 7.55, 7.62).</p>`));

  const cc = fdCover(R, fds, letters);
  out.push(card('Canonical cover F<sub>c</sub>', `${cc.log.length ? `<ol>${cc.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p>Không có vế trái trùng nhau và không có thuộc tính thừa: F<sub>c</sub> = F.</p>'}
    <p>F<sub>c</sub> = { ${cc.cover.map(FD).join('; ')} }</p><p class="lx-subtle">Canonical cover có thể không duy nhất (PE 7.14): thứ tự xét thuộc tính khác có thể cho kết quả khác nhưng tương đương.</p>`));

  const b = fdBcnfDecompose(R, fds);
  out.push(card('Phân rã BCNF', b.steps.length ? `<ol>${b.steps.map(s => `<li>${A(s.schema)} vi phạm BCNF do ${FD(s.fd)} (${A(s.fd.lhs)} không phải superkey của ${A(s.schema)}) → tách thành ${A(s.r1)} và ${A(s.r2)}</li>`).join('')}</ol>
    <p>Kết quả: ${b.result.map(x => `(${A(x)})`).join(', ')}</p>` : '<p>R đã ở BCNF, không cần tách.</p>',
    ok(b.result.length === 1 || fds.every(f => fdPreserved(R, fds, b.result, f)), 'Bảo toàn FD', 'Mất FD')));

  const t = fdThirdNFDecompose(R, fds, letters);
  const stepText = s => s.kind === 'add' ? `Từ ${FD(s.fd)} tạo lược đồ ${A(s.schema)}`
    : s.kind === 'skip' ? `${FD(s.fd)}: ${A(s.schema)} đã nằm trong một lược đồ có sẵn, bỏ qua`
    : s.kind === 'key' ? `Không lược đồ nào chứa candidate key → thêm ${A(s.schema)}`
    : `Bỏ ${A(s.schema)} vì nằm trọn trong lược đồ khác`;
  out.push(card('Phân rã 3NF (thuật toán tổng hợp)', `<ol>${t.steps.map(s => `<li>${stepText(s)}</li>`).join('')}</ol><p>Kết quả: ${t.result.map(x => `(${A(x)})`).join(', ')}</p>`,
    ok(true, 'Lossless + bảo toàn FD', '')));

  const schemas = fdParseSchemas(input.decomp || '', letters, R);
  if (schemas.length >= 2) {
    const covered = R.every(a => schemas.some(S => S.includes(a)));
    const lossless = fdLosslessChase(R, fds, schemas);
    let body = covered ? '' : callout('warning', `Phân rã chưa phủ hết R (thiếu ${A(R.filter(a => !schemas.some(S => S.includes(a))))}).`);
    body += `<p>Các lược đồ: ${schemas.map((S, i) => `R<sub>${i + 1}</sub> = (${A(S)})`).join(', ')}</p>`;
    if (schemas.length === 2) {
      const l = fdLosslessBinary(R, fds, schemas[0], schemas[1]);
      body += `<p>R<sub>1</sub> ∩ R<sub>2</sub> = ${A(l.common)}; (${A(l.common)})⁺ = ${A(l.closure)} → ${l.lossless ? 'chứa R<sub>1</sub> hoặc R<sub>2</sub>, nên <strong>lossless</strong>' : 'không chứa R<sub>1</sub> lẫn R<sub>2</sub>, nên <strong>lossy</strong>'}.</p>`;
    } else {
      body += `<p>Kiểm tra lossless bằng bảng chase: <strong>${lossless ? 'lossless' : 'lossy'}</strong>.</p>`;
    }
    body += `<p>Bảo toàn phụ thuộc (thuật toán slide 7.53):</p><ul>${fds.map(f => `<li>${FD(f)}: ${fdPreserved(R, fds, schemas, f) ? 'được bảo toàn' : '<strong>không</strong> được bảo toàn'}</li>`).join('')}</ul>
      <p>Dạng chuẩn từng lược đồ: ${schemas.map((S, i) => { const v = fdBcnfViolation(R, fds, S); return `R<sub>${i + 1}</sub> ${v ? `không BCNF (${FD(v)})` : 'BCNF'}`; }).join('; ')}.</p>`;
    out.push(card('Kiểm tra phân rã', body, ok(lossless, 'Lossless', 'Lossy')));
  }
  return out.join('');
}

  const preset = FD_PRESETS[Number(params.get('preset'))];
  const input = preset || saved || FD_PRESETS[0];
  main.innerHTML = pageHead('Phụ thuộc hàm (FD)', `Công cụ · Chương 7 · ${num(FD_PRESETS.length)} ví dụ có sẵn`,
    leadP('Bao đóng thuộc tính, candidate key, canonical cover, kiểm tra BCNF/3NF, phân rã BCNF và 3NF, lossless và bảo toàn phụ thuộc. Hãy làm tay trước, rồi dùng công cụ để đối chiếu từng bước.')) + `
    <div class="lx-fdgrid">
    <div class="lx-card lx-fdin"><div class="lx-card__head"><h2 class="lx-h2">Đầu vào</h2>
      <select class="lx-select" id="fdPreset" aria-label="Ví dụ có sẵn"><option value="">Ví dụ có sẵn…</option>${FD_PRESETS.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="lx-card__body lx-fd-form">
        <label>Lược đồ R <span class="lx-subtle">Viết liền nếu mỗi thuộc tính là một chữ cái (ABCDE), hoặc phân cách bằng dấu phẩy</span>
          <span class="lx-field"><input class="lx-editor" id="fdR" spellcheck="false" value="${esc(input.R)}"></span></label>
        <label>Tập phụ thuộc hàm F <span class="lx-subtle">Mỗi dòng một FD, dạng <code class="lx-code">A -> BC</code> hoặc <code class="lx-code">ID, x -> name</code></span>
          <span class="lx-field"><textarea class="lx-editor" id="fdF" spellcheck="false" style="min-height:132px">${esc(input.F)}</textarea></span></label>
        <label>Tính bao đóng của α <span class="lx-subtle">Tuỳ chọn</span><span class="lx-field"><input class="lx-editor" id="fdAlpha" spellcheck="false" value="${esc(input.alpha || '')}"></span></label>
        <label>Kiểm tra một phân rã <span class="lx-subtle">Tuỳ chọn, mỗi dòng một lược đồ</span><span class="lx-field"><textarea class="lx-editor" id="fdDecomp" spellcheck="false" style="min-height:76px">${esc(input.decomp || '')}</textarea></span></label>
      </div>
      <div class="lx-card__foot"><span>Kết quả cập nhật khi bạn gõ</span><button class="lx-btn lx-btn--primary" id="fdRun" type="button">${icon('play')} Phân tích</button></div></div>
    <div class="lx-stack" id="fdOut" aria-live="polite"></div></div>`;
  const read = () => ({ R: $('#fdR').value, F: $('#fdF').value, alpha: $('#fdAlpha').value, decomp: $('#fdDecomp').value });
  const render = () => {
    const value = read();
    store.set('fd:input', value);
    try { $('#fdOut').innerHTML = fdReport(value); }
    catch (e) { $('#fdOut').innerHTML = callout('danger', esc(e.message)); }
  };
  let timer = null;
  ['#fdR', '#fdF', '#fdAlpha', '#fdDecomp'].forEach(sel => $(sel).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); }));
  $('#fdRun').addEventListener('click', render);
  $('#fdPreset').addEventListener('change', e => {
    const p = FD_PRESETS[Number(e.target.value)];
    if (!p || e.target.value === '') return;
    $('#fdR').value = p.R; $('#fdF').value = p.F; $('#fdAlpha').value = p.alpha || ''; $('#fdDecomp').value = p.decomp || '';
    render();
  });
  render();
}

// Tab inserts spaces; Ctrl+Enter runs; Ctrl+Shift+Enter checks.
let focusEditorOnLoad = false; // set when Ctrl+Shift+Enter moves on to the next exercise
// ======================================================================
// SQL autocomplete: keywords, functions, tables, aliases and columns
// ======================================================================
// Typing two letters ("se") suggests SELECT, SET…; `alias.` or `table.` suggests
// that table's columns. Tab or Enter accepts, ↑/↓ move, Esc closes,
// Ctrl+Space opens the list at any time. Keywords are inserted in UPPER CASE
// and, when "Viết hoa từ khoá" is on, a keyword typed in full is upper-cased
// as soon as it is followed by a space, newline, comma, ( or ;.
const AC_KEYWORDS = ['SELECT', 'FROM', 'WHERE', 'GROUP BY', 'ORDER BY', 'HAVING', 'JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN',
  'FULL OUTER JOIN', 'CROSS JOIN', 'NATURAL JOIN', 'ON', 'USING', 'AND', 'OR', 'NOT', 'AS', 'DISTINCT', 'IN', 'NOT IN', 'EXISTS',
  'NOT EXISTS', 'BETWEEN', 'LIKE', 'ILIKE', 'IS NULL', 'IS NOT NULL', 'NULL', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'UNION',
  'UNION ALL', 'INTERSECT', 'EXCEPT', 'WITH', 'RECURSIVE', 'LIMIT', 'OFFSET', 'ASC', 'DESC', 'ALL', 'ANY', 'SOME', 'VALUES',
  'INSERT INTO', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'CREATE VIEW', 'DROP TABLE', 'ALTER TABLE', 'PRIMARY KEY',
  'FOREIGN KEY', 'REFERENCES', 'CHECK', 'UNIQUE', 'DEFAULT', 'BEGIN', 'COMMIT', 'ROLLBACK', 'TRUE', 'FALSE'];
const AC_FUNCS = ['COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'COALESCE', 'NULLIF', 'EXTRACT', 'CAST', 'ROUND', 'LOWER', 'UPPER',
  'LENGTH', 'SUBSTRING', 'TRIM', 'CONCAT', 'ABS', 'NOW', 'DATE_PART'];
// Words upper-cased as they are typed: reserved words only, never likely column names.
const AC_UPPER = new Set(['select', 'from', 'where', 'group', 'by', 'order', 'having', 'join', 'left', 'right', 'inner', 'outer',
  'full', 'cross', 'natural', 'on', 'using', 'and', 'or', 'not', 'as', 'distinct', 'in', 'exists', 'between', 'like', 'ilike',
  'is', 'null', 'case', 'when', 'then', 'else', 'end', 'union', 'intersect', 'except', 'with', 'recursive', 'limit', 'offset',
  'asc', 'desc', 'all', 'any', 'some', 'values', 'insert', 'into', 'update', 'set', 'delete', 'create', 'drop', 'alter', 'table',
  'view', 'primary', 'foreign', 'references', 'unique', 'default', 'true', 'false', 'count', 'sum', 'avg', 'min', 'max',
  'coalesce', 'nullif', 'extract', 'cast', 'round', 'lower', 'upper']);
const acUpperOn = () => store.get('autoUpper', true);
// Toggle in the editor bar; one delegated listener serves every page.
const AC_TOGGLE = () => `<label class="lx-acopt" title="Tự đổi từ khoá SQL sang chữ hoa khi gõ xong"><input type="checkbox" data-autoupper${acUpperOn() ? ' checked' : ''}> Viết hoa từ khoá</label><button type="button" class="lx-acopt lx-acnorm" data-normalize title="Viết hoa mọi từ khoá trong ô (Shift + Alt + F)">Chuẩn hoá</button>`;
// Upper-cases every keyword outside strings, comments and qualified names (t.name).
function normalizeSql(text) {
  const code = maskSql(text).code;
  return text.replace(/[A-Za-z_][\w$]*/g, (w, i) => (AC_UPPER.has(w.toLowerCase()) && code.slice(i, i + w.length) === w
    && !/[.\w$]$/.test(text.slice(0, i)) && text[i + w.length] !== '.' ? w.toUpperCase() : w));
}
function normalizeEditor(ta) {
  const next = normalizeSql(ta.value);
  if (next === ta.value) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.focus();
  ta.setSelectionRange(0, ta.value.length);
  if (!document.execCommand('insertText', false, next)) { ta.value = next; ta.dispatchEvent(new Event('input')); }
  ta.setSelectionRange(a, b);
}
document.addEventListener('click', e => {
  const ta = e.target.closest('[data-normalize]')?.closest('.lx-console')?.querySelector('textarea');
  if (ta) normalizeEditor(ta);
});
document.addEventListener('change', e => { if (e.target.matches('[data-autoupper]')) store.set('autoUpper', e.target.checked); });

const acMenu = document.createElement('ul');
acMenu.className = 'lx-acmenu';
acMenu.setAttribute('role', 'listbox');
acMenu.hidden = true;
document.body.appendChild(acMenu);

// Pixel position of the caret inside a textarea, through a mirror element.
function caretRect(ta) {
  const cs = getComputedStyle(ta);
  const mirror = document.createElement('div');
  for (const p of ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth',
    'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'fontFamily', 'fontSize', 'fontWeight', 'lineHeight',
    'letterSpacing', 'tabSize', 'textTransform']) mirror.style[p] = cs[p];
  Object.assign(mirror.style, { position: 'absolute', visibility: 'hidden', top: '0', left: '-9999px', whiteSpace: 'pre-wrap', overflowWrap: 'break-word' });
  mirror.textContent = ta.value.slice(0, ta.selectionEnd);
  const mark = document.createElement('span');
  mark.textContent = '​';
  mirror.appendChild(mark);
  document.body.appendChild(mirror);
  const box = ta.getBoundingClientRect();
  const r = { left: box.left + mark.offsetLeft - ta.scrollLeft, top: box.top + mark.offsetTop - ta.scrollTop, height: parseFloat(cs.lineHeight) || 20 };
  mirror.remove();
  return r;
}

// Table names and aliases of the statement around the caret: alias -> table.
function acAliases(text, caret, tables) {
  const stmt = splitStatements(text).find(s => caret >= s.start && caret <= s.end + 1) || { text, start: 0 };
  const known = new Map(tables.map(t => [t.table.toLowerCase(), t]));
  const map = new Map();
  const re = /(?:\bfrom|\bjoin|\bupdate|\binto|,)\s*([A-Za-z_][\w$]*)(?:\s+(?:as\s+)?([A-Za-z_][\w$]*))?/gi;
  const stop = /^(on|where|join|left|right|inner|outer|full|cross|natural|group|order|using|having|limit|set|values|union|except|intersect)$/i;
  let m;
  while ((m = re.exec(stmt.text))) {
    const t = known.get(m[1].toLowerCase());
    if (!t) continue;
    map.set(t.table.toLowerCase(), t);
    if (m[2] && !stop.test(m[2])) map.set(m[2].toLowerCase(), t);
  }
  return map;
}

function attachAutocomplete(ta, tables = ALL_TABLES) {
  let items = [], sel = 0, from = 0;
  const close = () => { if (acMenu.owner === ta) { acMenu.hidden = true; acMenu.owner = null; } items = []; };
  // Inside a string literal or a comment nothing is suggested or upper-cased.
  const inCode = pos => {
    const before = ta.value.slice(0, pos);
    const m = maskSql(before + 'x');
    return m.code[before.length] === 'x';
  };
  function suggest(force) {
    const pos = ta.selectionEnd;
    if (pos !== ta.selectionStart || !inCode(pos)) return close();
    const before = ta.value.slice(0, pos);
    const word = /[A-Za-z_][\w$]*$/.exec(before)?.[0] || '';
    const dot = /([A-Za-z_][\w$]*)\.([A-Za-z_][\w$]*)?$/.exec(before);
    const aliases = acAliases(ta.value, pos, tables);
    const low = word.toLowerCase();
    let list = [];
    if (dot) {
      const t = aliases.get(dot[1].toLowerCase()) || tables.find(x => x.table.toLowerCase() === dot[1].toLowerCase());
      if (!t) return close();
      list = t.columns.filter(c => c.column.toLowerCase().startsWith(low))
        .map(c => ({ text: c.column, kind: c.type.replace(/^(integer|bigint|smallint)\(.*\)$/, '$1') + (c.pk ? ' · khoá' : '') }));
    } else {
      if (!force && word.length < 2) return close();
      const prev = /([A-Za-z_]+)\s+[A-Za-z_]*$/.exec(maskSql(before).code)?.[1]?.toLowerCase();
      const wantTable = ['from', 'join', 'into', 'update', 'table'].includes(prev);
      const starts = s => s.toLowerCase().startsWith(low);
      const kws = AC_KEYWORDS.filter(starts).map(k => ({ text: k, insert: k + ' ', kind: 'từ khoá' }));
      const fns = AC_FUNCS.filter(starts).map(f => ({ text: f + '()', insert: f + '(', kind: 'hàm' }));
      const tbls = tables.filter(t => starts(t.table)).map(t => ({ text: t.table, kind: `bảng · ${t.columns.length} cột` }));
      const used = [...new Set(aliases.values())];
      const als = [...aliases].filter(([a, t]) => a !== t.table.toLowerCase() && a.startsWith(low)).map(([a, t]) => ({ text: a, kind: `alias của ${t.table}` }));
      const cols = [];
      for (const t of [...used, ...tables.filter(t => !used.includes(t))]) for (const c of t.columns) {
        if (starts(c.column) && !cols.some(x => x.text === c.column)) cols.push({ text: c.column, kind: `cột · ${t.table}`, rank: used.includes(t) ? 0 : 1 });
      }
      cols.sort((a, b) => a.rank - b.rank);
      list = wantTable ? [...tbls, ...als, ...kws, ...cols] : [...als, ...kws, ...fns, ...cols.filter(c => c.rank === 0), ...tbls, ...cols.filter(c => c.rank)];
    }
    // Nothing left to complete: the word is already exactly the only choice.
    list = list.filter(it => !(list.length === 1 && (it.insert || it.text).trim().toLowerCase() === low && word === (it.insert || it.text).trim()));
    if (!list.length) return close();
    items = list.slice(0, 8);
    sel = 0;
    from = pos - (dot ? (dot[2] || '').length : word.length);
    render();
  }
  function render() {
    acMenu.owner = ta;
    acMenu.innerHTML = items.map((it, i) => `<li role="option" data-i="${i}"${i === sel ? ' aria-selected="true"' : ''}><span class="lx-acmenu__t">${esc(it.text)}</span><span class="lx-acmenu__k">${esc(it.kind)}</span></li>`).join('')
      + '<li class="lx-acmenu__hint" aria-hidden="true">Tab / Enter chọn · Esc đóng</li>';
    acMenu.hidden = false;
    const r = caretRect(ta);
    const w = acMenu.offsetWidth, h = acMenu.offsetHeight;
    acMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    acMenu.style.top = (r.top + r.height + h > innerHeight - 8 ? r.top - h - 4 : r.top + r.height + 2) + 'px';
  }
  // execCommand keeps the browser's undo history; setRangeText is the fallback.
  const replace = (a, b, text) => {
    ta.setSelectionRange(a, b);
    if (!document.execCommand('insertText', false, text)) ta.setRangeText(text, a, b, 'end');
  };
  function accept(i = sel) {
    const it = items[i];
    if (!it) return;
    let text = it.insert || it.text;
    const after = ta.value.slice(ta.selectionEnd);
    if (text.endsWith(' ') && /^\s/.test(after)) text = text.trimEnd();
    if (text.endsWith('(') && after.startsWith('(')) text = text.slice(0, -1);
    replace(from, ta.selectionEnd, text);
    close();
  }
  ta.addEventListener('keydown', e => {
    if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); suggest(true); return; }
    if (e.code === 'KeyF' && e.shiftKey && e.altKey) { e.preventDefault(); close(); normalizeEditor(ta); return; }
    if (acMenu.hidden || acMenu.owner !== ta) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      render();
    } else if ((e.key === 'Tab' && !e.shiftKey) || (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      accept();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      close();
    }
  });
  ta.addEventListener('input', e => {
    // Upper-case a keyword the moment it is finished.
    if (acUpperOn() && (e.inputType === 'insertText' || e.inputType === 'insertLineBreak') && /^[\s,(;)]?$/.test(e.data ?? '\n')) {
      const end = ta.selectionEnd - 1;
      const m = /([A-Za-z_]+)$/.exec(ta.value.slice(0, end));
      if (m && AC_UPPER.has(m[1].toLowerCase()) && m[1] !== m[1].toUpperCase() && inCode(end - m[1].length)
          && !/[\w$."]$/.test(ta.value.slice(0, end - m[1].length))) {
        const caret = ta.selectionEnd;
        replace(end - m[1].length, end, m[1].toUpperCase());
        ta.setSelectionRange(caret, caret);
      }
    }
    if (e.inputType && (e.inputType.startsWith('insert') || e.inputType.startsWith('delete'))) suggest(false);
    else close();
  });
  ta.addEventListener('blur', () => setTimeout(close, 120));
  ta.addEventListener('scroll', close);
  ta.addEventListener('click', close);
  acMenu.addEventListener('mousedown', e => {
    if (acMenu.owner !== ta) return;
    const li = e.target.closest('[data-i]');
    if (li) { e.preventDefault(); accept(+li.dataset.i); }
  });
}
window.addEventListener('hashchange', () => { acMenu.hidden = true; acMenu.owner = null; });
window.addEventListener('resize', () => { acMenu.hidden = true; });

function bindEditorKeys(editor, onRun, onCheck, tables) {
  attachAutocomplete(editor, tables);
  editor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey && onCheck) onCheck(); else onRun();
    } else if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: t } = editor;
      editor.setRangeText('  ', s, t, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  });
}

// ======================================================================
// Router
// ======================================================================
function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, query] = hash.split('?');
  document.body.classList.remove('is-dbopen'); // the database popup belongs to the exercise view
  renderNav(path);
  const bare = path.match(/^\/([\w-]+)$/);
  const bareCh = bare && DATA.chapters.find(c => c.key === bare[1]);
  if (bareCh) { location.replace(stepHref(bareCh, stepsOf(bareCh)[0].key)); return; }
  const m = path.match(/^\/([\w-]+)\/(summary|quiz|questions|ex)(?:\/([\w.-]+))?$/);
  const ch = m && DATA.chapters.find(c => c.key === m[1]);
  if (ch && !stepsOf(ch).some(s => s.key === m[2])) { location.replace(stepHref(ch, stepsOf(ch)[0].key)); return; }
  if (ch) {
    renderContext(ch);
    ({ summary: viewSummary, quiz: viewQuiz, questions: viewQuestions, ex: c => viewExercise(c, m[3]) })[m[2]](ch);
  } else if (path === '/marks') {
    renderContext(null);
    viewMarks();
  } else if (path === '/sandbox') {
    renderContext(null);
    const table = new URLSearchParams(query || '').get('table');
    viewSandbox(table ? `select * from ${table};` : undefined);
  } else if (path === '/schema') {
    renderContext(null);
    viewSchema();
  } else if (path === '/fd' && DATA.part.fdTool) {
    renderContext(null);
    viewFd(new URLSearchParams(query || ''));
  } else {
    renderContext(null);
    viewHome();
  }
  window.scrollTo(0, 0);
  // #/ch/quiz?q=3 or #/ch/questions?q=3 (from the review list): open at that question.
  const q = new URLSearchParams(query || '').get('q');
  if (ch && q !== null) (m[2] === 'quiz' ? main.querySelector(`[data-i="${CSS.escape(q)}"]`) : document.getElementById('essay-' + q))?.scrollIntoView({ block: 'start' });
}
// A star anywhere on the page toggles that item's review mark.
main.addEventListener('click', e => {
  const b = e.target.closest('[data-mark]');
  if (!b) return;
  e.preventDefault();
  toggleMark(b.dataset.mark);
  const path = (location.hash.slice(1) || '/').split('?')[0];
  if (path === '/marks') { const y = scrollY; viewMarks(); scrollTo(0, y); } else refreshMarks();
  renderNav(path);
});
window.addEventListener('hashchange', route);
// Progress pulled from another device: redraw, unless the user is typing.
window.addEventListener('lx:synced', () => {
  if (document.activeElement && document.activeElement.matches('textarea, input, select')) return;
  const y = scrollY; route(); scrollTo(0, y);
});
route();
getShared().catch(err => console.error(err));
</script>
