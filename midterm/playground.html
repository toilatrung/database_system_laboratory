>← Exercise 3.3b.\u003c/strong> Delete all instructors who have never taught a section (do not occur in teaches).\u003c/p>","en":"","hint":"","solution":"DELETE FROM instructor WHERE ID NOT IN (SELECT ID FROM teaches);","check":"SELECT ID FROM instructor ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10101"],["12121"],["15151"],["22222"],["32343"],["45565"],["76766"],["83821"],["98345"]]}},{"id":"GK6.21","topic":"3.3c ← insert not exists","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.3c.\u003c/strong> Enroll every Physics student in PHY-101, section 1, Fall 2017 with a NULL grade, \u003cstrong>skipping\u003c/strong> students already enrolled in it.\u003c/p>","en":"","hint":"","solution":"INSERT INTO takes\nSELECT s.ID, 'PHY-101', '1', 'Fall', 2017, NULL\nFROM student s\nWHERE s.dept_name = 'Physics'\n  AND NOT EXISTS (SELECT 1 FROM takes t\n                  WHERE t.ID = s.ID AND t.course_id = 'PHY-101' AND t.sec_id = '1'\n                    AND t.semester = 'Fall' AND t.year = 2017);","check":"SELECT ID, grade FROM takes WHERE course_id = 'PHY-101' ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","grade"],"rows":[["44553","B-"],["45678",null],["70557",null]]}},{"id":"GK6.22","topic":"3.4a ← accidents per car","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.4a.\u003c/strong> (Insurance) For \u003cstrong>every\u003c/strong> car show license_plate, model and the number of accidents it participated in (0 if none) as \u003ccode>num_accidents\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT c.license_plate, c.model, COUNT(p.report_number) AS num_accidents\nFROM car c LEFT OUTER JOIN participated p ON c.license_plate = p.license_plate\nGROUP BY c.license_plate, c.model;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["license_plate","model","num_accidents"],"rows":[["FFF666","Tesla Model 3","1"],["CCC333","Ford Focus","0"],["DDD444","Mazda 3","1"],["GGG777","Hyundai i30","1"],["EEE555","Kia Rio","1"],["AAA111","Toyota Camry","2"],["BBB222","Honda Civic","0"]]}},{"id":"GK6.23","topic":"3.4b ← delete FK order","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.4b.\u003c/strong> Delete every 2017 accident whose \u003cstrong>total\u003c/strong> damage_amount is at most 1000. Remember the foreign key from participated.\u003c/p>","en":"","hint":"Xoá participated trước, accident sau.","solution":"DELETE FROM participated\nWHERE report_number IN (SELECT a.report_number FROM accident a, participated p\n                        WHERE a.report_number = p.report_number AND a.year = 2017\n                        GROUP BY a.report_number HAVING SUM(p.damage_amount) \u003c= 1000);\nDELETE FROM accident\nWHERE year = 2017 AND report_number NOT IN (SELECT report_number FROM participated);","check":"SELECT report_number FROM accident ORDER BY report_number;","ordered":false,"fresh":false,"expected":{"fields":["report_number"],"rows":[["AR1001"],["AR1002"],["AR1003"],["AR1005"]]}},{"id":"GK6.24","topic":"3.4 ← owner total damage","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.4.\u003c/strong> For each person who owns a car that took part in an accident, show the person's name and the \u003cstrong>total damage_amount\u003c/strong> of those participations as \u003ccode>total_damage\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT pe.name, SUM(pa.damage_amount) AS total_damage\nFROM person pe, owns o, participated pa\nWHERE pe.driver_id = o.driver_id AND o.license_plate = pa.license_plate\nGROUP BY pe.driver_id, pe.name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","total_damage"],"rows":[["Mary Lee","2500"],["Chloe Park","400"],["Anna Kim","800"],["Brian Cho","3800"],["John Carter","1800"]]}},{"id":"GK6.25","topic":"3.5 ← new scale + count","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.5.\u003c/strong> With a new scale (A if score >= 90, B if >= 80, C if >= 70, D if >= 60, otherwise F) output grade and number of students per grade.\u003c/p>","en":"","hint":"","solution":"WITH g AS (\n  SELECT ID, CASE WHEN score >= 90 THEN 'A' WHEN score >= 80 THEN 'B'\n                  WHEN score >= 70 THEN 'C' WHEN score >= 60 THEN 'D' ELSE 'F' END AS grade\n  FROM marks)\nSELECT grade, COUNT(ID) FROM g GROUP BY grade;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["grade","count"],"rows":[["B","2"],["C","2"],["D","2"],["F","5"],["A","2"]]}},{"id":"GK6.26","topic":"3.6 ← lower like","level":1,"prompt":"\u003cp>\u003cstrong>← Exercise 3.6.\u003c/strong> Find the titles of courses that contain \"comput\" regardless of case.\u003c/p>","en":"","hint":"","solution":"SELECT title FROM course WHERE LOWER(title) LIKE '%comput%';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Computational Biology"],["Intro. to Computer Science"]]}},{"id":"GK6.27","topic":"3.8a ← loan but no account","level":1,"prompt":"\u003cp>\u003cstrong>← Exercise 3.8a.\u003c/strong> (Bank) Find the ID of each customer who has a loan but \u003cstrong>not\u003c/strong> an account.\u003c/p>","en":"","hint":"","solution":"(SELECT ID FROM borrower) EXCEPT (SELECT ID FROM depositor);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["23456"],["34567"],["92345"],["19283"]]}},{"id":"GK6.28","topic":"3.8b ← same city diff street","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.8b.\u003c/strong> Find the ID of each customer who lives in the same city as customer '12345' but on a \u003cstrong>different street\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"SELECT F.ID FROM customer F, customer S\nWHERE S.ID = '12345' AND F.customer_city = S.customer_city AND F.customer_street \u003c> S.customer_street;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["89012"]]}},{"id":"GK6.29","topic":"3.8c ← both loan & account branch","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.8c.\u003c/strong> Find the name of each branch that has \u003cstrong>both\u003c/strong> at least one loan \u003cstrong>and\u003c/strong> at least one account.\u003c/p>","en":"","hint":"","solution":"(SELECT branch_name FROM loan) INTERSECT (SELECT branch_name FROM account);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Mianus"],["Chicago Loop"],["Redwood"],["Round Hill"],["North Town"],["Downtown"],["Perryridge"]]}},{"id":"GK6.30","topic":"3.9a ← miami companies","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.9a.\u003c/strong> (Employee) Find the ID and name of every employee who works for a company that is located in Miami.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT e.ID, e.person_name\nFROM employee e, works w, company c\nWHERE e.ID = w.ID AND w.company_name = c.company_name AND c.city = 'Miami';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name"],"rows":[["10005","Eva Vo"],["10006","Frank Do"],["10007","Grace Ho"],["10008","Henry Bui"],["10009","Ivy Dang"],["10010","Jack Ngo"],["10011","Kim Ly"],["10013","Mia Ta"],["12345","Zoe Mai"]]}},{"id":"GK6.31","topic":"3.9d ← > all (Mega)","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.9d.\u003c/strong> Find the ID of each employee who earns more than every employee of \"Mega Corp\".\u003c/p>","en":"","hint":"","solution":"SELECT ID FROM works WHERE salary > ALL (SELECT salary FROM works WHERE company_name = 'Mega Corp');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10001"],["10004"],["10007"],["10008"]]}},{"id":"GK6.32","topic":"3.9e ← division BigBank","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.9e.\u003c/strong> Find the name of each company that is located in \u003cstrong>every\u003c/strong> city in which \"BigBank\" is located (BigBank itself included).\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT S.company_name FROM company S\nWHERE NOT EXISTS (\n  (SELECT city FROM company WHERE company_name = 'BigBank')\n  EXCEPT\n  (SELECT T.city FROM company T WHERE T.company_name = S.company_name));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["BigBank"],["Mega Corp"]]}},{"id":"GK6.33","topic":"3.9f ← fewest employees","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.9f.\u003c/strong> Find the name of the company that has the \u003cstrong>fewest\u003c/strong> employees (all of them in case of a tie).\u003c/p>","en":"","hint":"","solution":"SELECT company_name FROM works GROUP BY company_name\nHAVING COUNT(DISTINCT ID) \u003c= ALL (SELECT COUNT(DISTINCT ID) FROM works GROUP BY company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["Tiny Tech"]]}},{"id":"GK6.34","topic":"3.9g ← below overall avg","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.9g.\u003c/strong> Find the name of each company whose average salary is \u003cstrong>lower\u003c/strong> than the average salary of \u003cstrong>all\u003c/strong> employees.\u003c/p>","en":"","hint":"","solution":"SELECT company_name FROM works GROUP BY company_name\nHAVING AVG(salary) \u003c (SELECT AVG(salary) FROM works);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["Mega Corp"],["Small Bank Corporation"],["Tiny Tech"],["First Bank Corporation"]]}},{"id":"GK6.35","topic":"3.10a ← update two cond","level":1,"prompt":"\u003cp>\u003cstrong>← Exercise 3.10a.\u003c/strong> Employees of \"Small Bank Corporation\" who live in Miami now live in \"Orlando\".\u003c/p>","en":"","hint":"","solution":"UPDATE employee SET city = 'Orlando'\nWHERE city = 'Miami' AND ID IN (SELECT ID FROM works WHERE company_name = 'Small Bank Corporation');","check":"SELECT ID, city FROM employee ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","city"],"rows":[["10001","Miami"],["10002","Miami"],["10003","Boston"],["10004","New York"],["10005","Orlando"],["10006","Chicago"],["10007","Miami"],["10008","New York"],["10009","Chicago"],["10010","Miami"],["10011","Boston"],["10012","Chicago"],["10013","Boston"],["12345","Boston"]]}},{"id":"GK6.36","topic":"3.10b ← manager raise case","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.10b.\u003c/strong> Give each manager of \"Mega Corp\" an 8 percent raise unless the new salary would exceed 60000; in such cases give only 2 percent. (One UPDATE.)\u003c/p>","en":"","hint":"","solution":"UPDATE works\nSET salary = salary * CASE WHEN salary * 1.08 > 60000 THEN 1.02 ELSE 1.08 END\nWHERE company_name = 'Mega Corp' AND ID IN (SELECT manager_id FROM manages);","check":"SELECT ID, salary FROM works ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","85000"],["10002","9500"],["10003","60000"],["10004","92000"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","59160"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}},{"id":"GK6.37","topic":"3.11a ← division 4-credit CS","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.11a.\u003c/strong> Find the ID and name of each student who has taken \u003cstrong>every\u003c/strong> Comp. Sci. course with 4 credits.\u003c/p>","en":"","hint":"","solution":"SELECT s.ID, s.name FROM student s\nWHERE NOT EXISTS (\n  (SELECT course_id FROM course WHERE dept_name = 'Comp. Sci.' AND credits = 4)\n  EXCEPT\n  (SELECT course_id FROM takes WHERE takes.ID = s.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["12345","Shankar"],["54321","Williams"]]}},{"id":"GK6.38","topic":"3.11b ← only 2018","level":2,"prompt":"\u003cp>\u003cstrong>← Exercise 3.11b.\u003c/strong> Find the ID and name of each student who has \u003cstrong>not\u003c/strong> taken any course offered before 2018.\u003c/p>","en":"","hint":"","solution":"SELECT ID, name FROM student WHERE ID NOT IN (SELECT ID FROM takes WHERE year \u003c 2018);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["19991","Brandt"],["23121","Chavez"],["55739","Sanchez"],["70557","Snow"]]}},{"id":"GK6.39","topic":"3.11d ← dept with min of max","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.11d.\u003c/strong> Find the department(s) whose maximum instructor salary is the \u003cstrong>lowest\u003c/strong> among all departments. Output dept_name and that salary.\u003c/p>","en":"","hint":"","solution":"WITH m AS (SELECT dept_name, MAX(salary) AS mx FROM instructor GROUP BY dept_name)\nSELECT dept_name, mx FROM m WHERE mx = (SELECT MIN(mx) FROM m);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","mx"],"rows":[["Music","40000"]]}},{"id":"GK6.40","topic":"3.12a-c ← chain","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.12a–c.\u003c/strong> In one script: create course \"CS-002\" titled \"Lab Seminar\" (Comp. Sci., 1 credit); create its section 1 in Spring 2019 with no location; enroll \u003cstrong>every student with tot_cred \u003c 50\u003c/strong> (any department) in it.\u003c/p>","en":"","hint":"","solution":"INSERT INTO course VALUES ('CS-002', 'Lab Seminar', 'Comp. Sci.', 1);\nINSERT INTO section VALUES ('CS-002', '1', 'Spring', 2019, NULL, NULL, NULL);\nINSERT INTO takes SELECT ID, 'CS-002', '1', 'Spring', 2019, NULL FROM student WHERE tot_cred \u003c 50;","check":"SELECT ID FROM takes WHERE course_id = 'CS-002' ORDER BY ID;","ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["45678"],["55739"],["70557"]]}},{"id":"GK6.41","topic":"3.12f ← intro delete","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.12f.\u003c/strong> Delete all takes tuples of any section of any course with the word \"intro\" as part of the title, ignoring case.\u003c/p>","en":"","hint":"","solution":"DELETE FROM takes WHERE course_id IN (SELECT course_id FROM course WHERE LOWER(title) LIKE '%intro%');","check":"SELECT COUNT(*) AS remaining FROM takes;","ordered":false,"fresh":false,"expected":{"fields":["remaining"],"rows":[["13"]]}},{"id":"GK6.42","topic":"3.13 ← DDL library","level":3,"prompt":"\u003cp>\u003cstrong>← Exercise 3.13.\u003c/strong> Write DDL for a small library: \u003ccode>lib_book(isbn varchar(13) PK, title varchar(100) not null, year int)\u003c/code>, \u003ccode>lib_member(member_id int PK, name varchar(50) not null, email varchar(80) unique)\u003c/code>, \u003ccode>lib_loan(member_id, isbn, loan_date date, return_date date; PK (member_id, isbn, loan_date); FK member_id → lib_member **on delete cascade**; FK isbn → lib_book)\u003c/code>.\u003c/p>","en":"","hint":"","solution":"CREATE TABLE lib_book (\n  isbn  VARCHAR(13) PRIMARY KEY,\n  title VARCHAR(100) NOT NULL,\n  year  INT);\nCREATE TABLE lib_member (\n  member_id INT PRIMARY KEY,\n  name      VARCHAR(50) NOT NULL,\n  email     VARCHAR(80) UNIQUE);\nCREATE TABLE lib_loan (\n  member_id   INT REFERENCES lib_member ON DELETE CASCADE,\n  isbn        VARCHAR(13) REFERENCES lib_book,\n  loan_date   DATE,\n  return_date DATE,\n  PRIMARY KEY (member_id, isbn, loan_date));","check":"SELECT try_sql($$insert into lib_book values ('111', 'DB Concepts', 2020)$$) AS book,\n       try_sql($$insert into lib_member values (1, 'An', 'an@x.com')$$) AS member,\n       try_sql($$insert into lib_member values (2, 'Binh', 'an@x.com')$$) AS dup_email,\n       try_sql($$insert into lib_loan values (1, '111', date '2024-01-01', null)$$) AS loan_ok,\n       try_sql($$insert into lib_loan values (9, '111', date '2024-01-01', null)$$) AS loan_bad_member,\n       try_sql($$delete from lib_member where member_id = 1$$) AS delete_member,\n       sql_value('select count(*) from lib_loan') AS loans_left;","ordered":false,"fresh":true,"expected":{"fields":["book","member","dup_email","loan_ok","loan_bad_member","delete_member","loans_left"],"rows":[["ok","ok","23505","ok","23503","ok","0"]]}}]},{"key":"gk7","store":"gk7","short":"GK-M","label":"Đề mẫu · 20 truy vấn","navLabel":"Đề mẫu","kind":"Đề thi","title":"University Database: 20 SQL Query Exercises","titleVi":"Đề mẫu — 20 truy vấn trên University database","seed":"-- Dữ liệu bổ sung cho \"Đề mẫu · 20 truy vấn\" (midterm/content/gk7.mjs).\r\n-- Dữ liệu mẫu của sách chỉ có năm 2017–2018, còn đề hỏi Fall 2025 / \"mọi học kỳ năm 2025\".\r\n-- File này chỉ được nạp cho các bài của đề mẫu, bên trong transaction của mỗi lần chạy\r\n-- (chạy xong là rollback), nên không ảnh hưởng các phần khác.\r\ninsert into section values\r\n  ('CS-101',  '1', 'Spring', 2025, 'Packard', '101',  'H'),\r\n  ('CS-347',  '1', 'Summer', 2025, 'Taylor',  '3128', 'A'),\r\n  ('CS-101',  '1', 'Fall',   2025, 'Packard', '101',  'H'),\r\n  ('CS-319',  '1', 'Fall',   2025, 'Watson',  '120',  'D'),\r\n  ('HIS-351', '1', 'Fall',   2025, 'Painter', '514',  'C');   -- chưa phân công giảng viên\r\n\r\ninsert into teaches values\r\n  ('10101', 'CS-101', '1', 'Spring', 2025),\r\n  ('10101', 'CS-347', '1', 'Summer', 2025),\r\n  ('10101', 'CS-101', '1', 'Fall',   2025),\r\n  ('22222', 'CS-101', '1', 'Fall',   2025),   -- Einstein (Physics) cùng dạy CS-101\r\n  ('45565', 'CS-319', '1', 'Fall',   2025);\r\n\r\ninsert into takes values\r\n  ('98765', 'CS-101', '1', 'Fall',   2025, 'B'),    -- học lại CS-101\r\n  ('44553', 'CS-101', '1', 'Fall',   2025, 'A-'),   -- SV Physics học môn Comp. Sci.\r\n  ('12345', 'CS-319', '1', 'Fall',   2025, 'B+'),   -- 12345 đủ mọi môn Comp. Sci.\r\n  ('23121', 'CS-101', '1', 'Spring', 2025, 'W');    -- điểm không nằm trong thang điểm\r\n","seedFile":"lab/db/exam_sample_2025.sql","dbPanel":true,"summary":"\u003ch3>1. Đề này là gì\u003c/h3>\n\u003cp>Đề mẫu gồm \u003cstrong>20 truy vấn\u003c/strong> trên University database của sách, chia 3 mức: cơ bản (Q1–5), trung bình (Q6–13), khó (Q14–20). Đề gốc viết cho MySQL; ở đây chạy trên PostgreSQL, nhưng mọi câu đều viết được bằng SQL chuẩn (join, \u003ccode>not exists\u003c/code>, \u003ccode>group by … having\u003c/code>, subquery, \u003ccode>with\u003c/code>).\u003c/p>\n\u003cp>Khi làm bài, bấm nút \u003cstrong>Database\u003c/strong> ở góc phải dưới để mở popup: xem cột và dữ liệu của 11 bảng, và chạy thử truy vấn bất kỳ (không làm đổi dữ liệu).\u003c/p>\n\u003cp>Bấm \u003cstrong>Debug\u003c/strong> (hoặc \u003ckbd>F10\u003c/kbd>) cạnh nút Chạy để chạy câu trả lời \u003cstrong>từng bước\u003c/strong>: mỗi câu lệnh, và trong một SELECT từng mệnh đề theo thứ tự xử lý (\u003ccode>FROM\u003c/code> → từng \u003ccode>JOIN\u003c/code> → \u003ccode>WHERE\u003c/code> → \u003ccode>GROUP BY\u003c/code> → \u003ccode>HAVING\u003c/code> → \u003ccode>SELECT\u003c/code> → \u003ccode>ORDER BY\u003c/code>, các bảng tạm \u003ccode>WITH\u003c/code> trước). Bảng trung gian hiện ở tab Debug của popup, phần code đang chạy được tô sáng trong ô trả lời; \u003ckbd>F10\u003c/kbd> / \u003ckbd>Shift\u003c/kbd> + \u003ckbd>F10\u003c/kbd> để sang bước sau / trước.\u003c/p>\n\u003ch3>2. Dữ liệu năm 2025\u003c/h3>\n\u003cp>Dữ liệu mẫu của sách chỉ có năm 2017–2018, còn đề hỏi \u003cem>Fall 2025\u003c/em> (Q6) và \u003cem>mọi học kỳ năm 2025\u003c/em> (Q19). Vì vậy đề này nạp thêm [\u003ccode>lab/db/exam_sample_2025.sql\u003c/code>](../../lab/db/exam_sample_2025.sql):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bảng\u003c/th>\u003cth>Dòng thêm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>section\u003c/td>\u003ctd>CS-101 Spring/Fall 2025, CS-347 Summer 2025, CS-319 Fall 2025, HIS-351 Fall 2025 (\u003cstrong>chưa có giảng viên\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>teaches\u003c/td>\u003ctd>10101 dạy cả 3 học kỳ 2025; 22222 (Physics) cùng dạy CS-101 Fall 2025; 45565 dạy CS-319 Fall 2025\u003c/td>\u003c/tr>\u003ctr>\u003ctd>takes\u003c/td>\u003ctd>98765 học lại CS-101; 44553 (Physics) học CS-101; 12345 học CS-319 (đủ mọi môn Comp. Sci.); 23121 có điểm \u003ccode>W\u003c/code> (ngoài thang điểm)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Mẫu lời giải cần thuộc\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dạng\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Cách viết\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\"chưa từng / không có\"\u003c/td>\u003ctd>Q10, Q11, Q13\u003c/td>\u003ctd>\u003ccode>NOT EXISTS (select 1 … where khớp khoá)\u003c/code> hoặc \u003ccode>LEFT JOIN … WHERE phải IS NULL\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Phép chia \"mọi …\"\u003c/td>\u003ctd>Q12, Q19\u003c/td>\u003ctd>\u003ccode>NOT EXISTS (tập cần có EXCEPT tập đã có)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>So với trung bình\u003c/td>\u003ctd>Q14, Q20\u003c/td>\u003ctd>\u003ccode>WITH\u003c/code> tính từng nhóm, rồi \u003ccode>&gt; (select avg … )\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lớn nhất, kể cả hoà\u003c/td>\u003ctd>Q16\u003c/td>\u003ctd>\u003ccode>= (select max …)\u003c/code> hoặc \u003ccode>&gt;= ALL\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đếm phân biệt theo cặp cột\u003c/td>\u003ctd>Q15\u003c/td>\u003ctd>\u003ccode>select distinct\u003c/code> trong subquery rồi \u003ccode>count(*)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Khớp đúng section\u003c/td>\u003ctd>Q17, Q20\u003c/td>\u003ctd>join \u003ccode>takes\u003c/code>–\u003ccode>teaches\u003c/code> trên \u003cstrong>cả 4 cột\u003c/strong> \u003ccode>course_id, sec_id, semester, year\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>4. Bẫy hay gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q5, Q7, Q8, Q9:\u003c/strong> join làm lặp dòng (học lại, dạy nhiều section) → cần \u003ccode>DISTINCT\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q14:\u003c/strong> \"kể cả SV không học môn nào\" → \u003ccode>LEFT JOIN\u003c/code> + \u003ccode>COUNT(DISTINCT t.course_id)\u003c/code> (đếm cột bảng phải, NULL không được đếm).\u003c/li>\u003cli>\u003cstrong>Q16:\u003c/strong> khoa không có giảng viên → \u003ccode>LEFT JOIN\u003c/code> + \u003ccode>COALESCE(SUM(salary), 0)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q17/Q20:\u003c/strong> join \u003ccode>takes\u003c/code>–\u003ccode>teaches\u003c/code> chỉ trên \u003ccode>course_id\u003c/code> là sai: ghép SV với giảng viên của học kỳ khác.\u003c/li>\u003cli>\u003cstrong>Q18:\u003c/strong> \"hoàn thành\" = \u003ccode>grade IS NOT NULL AND grade &lt;&gt; 'F'\u003c/code>; SV không học môn nào có tiên quyết thì \u003cstrong>không\u003c/strong> được chọn.\u003c/li>\u003cli>\u003cstrong>Q19:\u003c/strong> năm 2025 không có section thì phép chia trả về \u003cstrong>mọi\u003c/strong> giảng viên (tập rỗng ⊆ mọi tập) → thêm \u003ccode>EXISTS (select … where year = 2025)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q20:\u003c/strong> bỏ điểm NULL và điểm lạ như \u003ccode>W\u003c/code> bằng \u003cstrong>inner join\u003c/strong> với bảng quy đổi; trung bình chung tính trên từng lượt học có điểm.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>Q10\u003c/strong> — Viết Q10 (\"SV chưa học môn nào\") bằng \u003ccode>NOT IN\u003c/code>, \u003ccode>NOT EXISTS\u003c/code> và \u003ccode>LEFT JOIN\u003c/code>. Cách nào có thể sai khi cột so sánh có NULL?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- NOT IN\nSELECT ID, name FROM student WHERE ID NOT IN (SELECT ID FROM takes);\n-- NOT EXISTS\nSELECT s.ID, s.name FROM student s WHERE NOT EXISTS (SELECT 1 FROM takes t WHERE t.ID = s.ID);\n-- LEFT JOIN\nSELECT s.ID, s.name FROM student s LEFT JOIN takes t ON t.ID = s.ID WHERE t.ID IS NULL;\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>NOT IN\u003c/code> sai khi subquery trả về một giá trị NULL: \u003ccode>x NOT IN (…, NULL)\u003c/code> là \u003cem>unknown\u003c/em> với mọi x → không trả dòng nào. Ở đây \u003ccode>takes.ID\u003c/code> là một phần primary key nên không NULL, cả ba cách cho cùng kết quả; nhưng \u003ccode>NOT EXISTS\u003c/code> an toàn trong mọi trường hợp.\u003c/p>"},{"q":"\u003cstrong>Q12\u003c/strong> — Giải thích vì sao \u003ccode>NOT EXISTS (A EXCEPT B)\u003c/code> biểu diễn được \"đã học \u003cstrong>mọi\u003c/strong> môn của Comp. Sci.\". Nếu khoa Comp. Sci. không có môn nào thì kết quả là gì?","en":"","answer":"\u003cp>Với mỗi SV: A = tập môn của Comp. Sci., B = tập môn SV đã học. \u003ccode>A EXCEPT B\u003c/code> là các môn của khoa mà SV \u003cstrong>chưa\u003c/strong> học. Tập đó rỗng ⇔ A ⊆ B ⇔ SV đã học mọi môn của khoa — đó là phép chia (÷) của đại số quan hệ.\u003c/p>\n\u003cp>Nếu khoa không có môn nào thì A rỗng → \u003ccode>A EXCEPT B\u003c/code> rỗng với mọi SV → \u003cstrong>mọi\u003c/strong> SV được chọn (đúng theo logic \"với mọi phần tử của tập rỗng\"). Muốn tránh thì thêm \u003ccode>EXISTS (select 1 from course where dept_name = 'Comp. Sci.')\u003c/code>, giống cách Q19 xử lý năm không có section.\u003c/p>"},{"q":"\u003cstrong>Q14\u003c/strong> — Vì sao trung bình phải tính trên \u003ccode>student LEFT JOIN takes\u003c/code> chứ không phải trên \u003ccode>takes\u003c/code>? Với dữ liệu của đề, hai cách cho trung bình bao nhiêu?","en":"","answer":"\u003cp>\u003ccode>GROUP BY\u003c/code> trên \u003ccode>takes\u003c/code> chỉ có những SV đã học ít nhất một môn, nên SV 0 môn (Snow) không góp vào mẫu số → trung bình bị đẩy lên. Đề yêu cầu tính cả SV 0 môn, nên phải bắt đầu từ \u003ccode>student\u003c/code> và \u003ccode>LEFT JOIN takes\u003c/code>, đếm \u003ccode>COUNT(DISTINCT t.course_id)\u003c/code> (SV không học môn nào được 0).\u003c/p>\n\u003cp>Với dữ liệu của đề: 13 SV, tổng 24 lượt môn phân biệt → trung bình ≈ \u003cstrong>1.85\u003c/strong> (tính cả Snow); bỏ Snow thì là 24/12 = \u003cstrong>2\u003c/strong>, và khi đó SV học đúng 2 môn sẽ \u003cstrong>không\u003c/strong> còn \"vượt trung bình\" nữa — kết quả chỉ còn Shankar.\u003c/p>"},{"q":"\u003cstrong>Q17 / Q20\u003c/strong> — Join \u003ccode>takes\u003c/code> với \u003ccode>teaches\u003c/code> thế nào là \"khớp đúng section và học kỳ\"? Nêu một ví dụ trong dữ liệu mà join sai cho kết quả sai.","en":"","answer":"\u003cp>Phải khớp \u003cstrong>cả 4 cột\u003c/strong> khoá của section:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>takes t JOIN teaches te\n  ON te.course_id = t.course_id AND te.sec_id = t.sec_id\n AND te.semester  = t.semester  AND te.year   = t.year\u003c/code>\u003c/pre>\n\u003cp>Nếu chỉ join trên \u003ccode>course_id\u003c/code>: CS-101 được dạy ở Fall 2017 (Srinivasan), Spring 2018 (Katz) và Fall 2025 (Srinivasan + Einstein). Khi đó SV học CS-101 Fall 2017 (ví dụ 00128 Zhang) sẽ bị ghép với cả Katz và Einstein dù họ không dạy lớp đó → số giảng viên ở Q17 và điểm trung bình theo giảng viên ở Q20 đều sai.\u003c/p>"}],"exercises":[{"id":"GK7.01","topic":"Q1 where","level":1,"prompt":"\u003cp>Cho ID và tên của mọi sinh viên thuộc khoa \u003cstrong>Comp. Sci.\u003c/strong> Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q1. Find the IDs and names of all students belonging to the Comp. Sci. department.\u003c/p>","hint":"","solution":"SELECT ID, name\nFROM student\nWHERE dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["00128","Zhang"],["12345","Shankar"],["54321","Williams"],["76543","Brown"]]}},{"id":"GK7.02","topic":"Q2 where >=","level":1,"prompt":"\u003cp>Liệt kê các môn có \u003cstrong>ít nhất 3 tín chỉ\u003c/strong>. Kết quả: \u003ccode>course_id, title, credits\u003c/code>.\u003c/p>","en":"\u003cp>Q2. List the course IDs, titles, and credits of all courses worth at least 3 credits.\u003c/p>","hint":"","solution":"SELECT course_id, title, credits\nFROM course\nWHERE credits >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title","credits"],"rows":[["BIO-101","Intro. to Biology","4"],["BIO-301","Genetics","4"],["BIO-399","Computational Biology","3"],["CS-101","Intro. to Computer Science","4"],["CS-190","Game Design","4"],["CS-315","Robotics","3"],["CS-319","Image Processing","3"],["CS-347","Database System Concepts","3"],["EE-181","Intro. to Digital Systems","3"],["FIN-201","Investment Banking","3"],["HIS-351","World History","3"],["MU-199","Music Video Production","3"],["PHY-101","Physical Principles","4"]]}},{"id":"GK7.03","topic":"Q3 where","level":1,"prompt":"\u003cp>Liệt kê tên (\u003ccode>title\u003c/code>) của mọi môn do khoa \u003cstrong>Physics\u003c/strong> mở.\u003c/p>","en":"\u003cp>Q3. List the titles of all courses offered by the Physics department.\u003c/p>","hint":"","solution":"SELECT title\nFROM course\nWHERE dept_name = 'Physics';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Physical Principles"]]}},{"id":"GK7.04","topic":"Q4 join","level":1,"prompt":"\u003cp>Với mỗi sinh viên, cho ID, tên, khoa và toà nhà (\u003ccode>building\u003c/code>) của khoa đó. Kết quả: \u003ccode>ID, name, dept_name, building\u003c/code>.\u003c/p>","en":"\u003cp>Q4. Display each student's ID, name, department name, and the building of that department.\u003c/p>","hint":"","solution":"SELECT s.ID, s.name, s.dept_name, d.building\nFROM student s\nJOIN department d ON d.dept_name = s.dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","building"],"rows":[["00128","Zhang","Comp. Sci.","Taylor"],["12345","Shankar","Comp. Sci.","Taylor"],["19991","Brandt","History","Painter"],["23121","Chavez","Finance","Painter"],["44553","Peltier","Physics","Watson"],["45678","Levy","Physics","Watson"],["54321","Williams","Comp. Sci.","Taylor"],["55739","Sanchez","Music","Packard"],["70557","Snow","Physics","Watson"],["76543","Brown","Comp. Sci.","Taylor"],["76653","Aoi","Elec. Eng.","Taylor"],["98765","Bourikas","Elec. Eng.","Taylor"],["98988","Tanaka","Biology","Watson"]]}},{"id":"GK7.05","topic":"Q5 join + distinct","level":1,"prompt":"\u003cp>Tên các môn (không trùng) mà sinh viên \u003cstrong>12345\u003c/strong> đã học, không kể học kỳ nào. Kết quả: \u003ccode>title\u003c/code>.\u003c/p>","en":"\u003cp>Q5. Find the distinct titles of all courses taken by the student with ID 12345, regardless of semester.\u003c/p>","hint":"takes chỉ có course_id; tên môn nằm trong course.","solution":"SELECT DISTINCT c.title\nFROM takes t\nJOIN course c ON c.course_id = t.course_id\nWHERE t.ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Database System Concepts"],["Game Design"],["Image Processing"],["Intro. to Computer Science"],["Robotics"]]}},{"id":"GK7.06","topic":"Q6 join + filter","level":2,"prompt":"\u003cp>ID và tên các sinh viên học \u003cstrong>CS-101\u003c/strong> ở \u003cstrong>Fall 2025\u003c/strong> (mỗi SV một dòng). Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q6. List the IDs and names of students who took CS-101 in Fall 2025.\u003c/p>","hint":"","solution":"SELECT DISTINCT s.ID, s.name\nFROM student s\nJOIN takes t ON t.ID = s.ID\nWHERE t.course_id = 'CS-101' AND t.semester = 'Fall' AND t.year = 2025;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["44553","Peltier"],["98765","Bourikas"]]}},{"id":"GK7.07","topic":"Q7 3-table join","level":2,"prompt":"\u003cp>Tìm giảng viên đã dạy môn của \u003cstrong>khoa khác\u003c/strong> khoa mình. Kết quả: \u003ccode>name\u003c/code> (giảng viên), \u003ccode>dept_name\u003c/code> (khoa của giảng viên), \u003ccode>title\u003c/code> (tên môn) — mỗi bộ ba một dòng.\u003c/p>","en":"\u003cp>Q7. Find instructors who have taught courses offered by a department other than their own. Show instructor name, instructor department, and course title.\u003c/p>","hint":"So sánh instructor.dept_name với course.dept_name.","solution":"SELECT DISTINCT i.name, i.dept_name, c.title\nFROM instructor i\nJOIN teaches te ON te.ID = i.ID\nJOIN course c   ON c.course_id = te.course_id\nWHERE c.dept_name \u003c> i.dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","dept_name","title"],"rows":[["Einstein","Physics","Intro. to Computer Science"]]}},{"id":"GK7.08","topic":"Q8 join + distinct","level":1,"prompt":"\u003cp>Tên các môn (không trùng) do giảng viên \u003cstrong>10101\u003c/strong> dạy. Kết quả: \u003ccode>title\u003c/code>.\u003c/p>","en":"\u003cp>Q8. Find the distinct titles of courses taught by instructor 10101.\u003c/p>","hint":"","solution":"SELECT DISTINCT c.title\nFROM teaches te\nJOIN course c ON c.course_id = te.course_id\nWHERE te.ID = '10101';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Database System Concepts"],["Intro. to Computer Science"],["Robotics"]]}},{"id":"GK7.09","topic":"Q9 join, so sánh cột","level":2,"prompt":"\u003cp>ID và tên các sinh viên đã học \u003cstrong>ít nhất một môn ngoài khoa của mình\u003c/strong> (mỗi SV một dòng). Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q9. Find the IDs and names of students who have taken at least one course outside their own department.\u003c/p>","hint":"","solution":"SELECT DISTINCT s.ID, s.name\nFROM student s\nJOIN takes t  ON t.ID = s.ID\nJOIN course c ON c.course_id = t.course_id\nWHERE c.dept_name \u003c> s.dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["45678","Levy"],["23121","Chavez"],["98765","Bourikas"],["44553","Peltier"]]}},{"id":"GK7.10","topic":"Q10 not exists","level":2,"prompt":"\u003cp>ID và tên các sinh viên \u003cstrong>chưa từng học môn nào\u003c/strong>. Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q10. Find the IDs and names of students who have never taken any course.\u003c/p>","hint":"NOT EXISTS, hoặc LEFT JOIN takes rồi lọc takes.ID IS NULL.","solution":"SELECT s.ID, s.name\nFROM student s\nWHERE NOT EXISTS (SELECT 1 FROM takes t WHERE t.ID = s.ID);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["70557","Snow"]]}},{"id":"GK7.11","topic":"Q11 not exists","level":2,"prompt":"\u003cp>Mã và tên các môn \u003cstrong>chưa từng có sinh viên nào học\u003c/strong>. Kết quả: \u003ccode>course_id, title\u003c/code>.\u003c/p>","en":"\u003cp>Q11. Find the IDs and titles of courses that have never been taken by any student.\u003c/p>","hint":"","solution":"SELECT c.course_id, c.title\nFROM course c\nWHERE NOT EXISTS (SELECT 1 FROM takes t WHERE t.course_id = c.course_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title"],"rows":[["BIO-399","Computational Biology"]]}},{"id":"GK7.12","topic":"Q12 phép chia","level":3,"prompt":"\u003cp>ID và tên các sinh viên đã học \u003cstrong>mọi\u003c/strong> môn của khoa \u003cstrong>Comp. Sci.\u003c/strong> (học kỳ nào cũng được). Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q12. Find the IDs and names of students who have taken every course offered by the Comp. Sci. department, regardless of semester.\u003c/p>","hint":"NOT EXISTS (các môn của Comp. Sci. EXCEPT các môn SV đã học).","solution":"SELECT s.ID, s.name\nFROM student s\nWHERE NOT EXISTS (\n  SELECT course_id FROM course WHERE dept_name = 'Comp. Sci.'\n  EXCEPT\n  SELECT t.course_id FROM takes t WHERE t.ID = s.ID\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["12345","Shankar"]]}},{"id":"GK7.13","topic":"Q13 not exists, khoá 4 cột","level":2,"prompt":"\u003cp>Tìm các section \u003cstrong>chưa được phân công giảng viên\u003c/strong>. Kết quả: \u003ccode>course_id, sec_id, semester, year\u003c/code>.\u003c/p>","en":"\u003cp>Q13. Find all course sections that have no assigned instructor. Show course ID, section ID, semester, and year.\u003c/p>","hint":"Một section được xác định bởi cả 4 cột; teaches phải khớp cả 4.","solution":"SELECT se.course_id, se.sec_id, se.semester, se.year\nFROM section se\nWHERE NOT EXISTS (\n  SELECT 1 FROM teaches te\n  WHERE te.course_id = se.course_id AND te.sec_id = se.sec_id\n    AND te.semester  = se.semester  AND te.year   = se.year\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","semester","year"],"rows":[["HIS-351","1","Fall","2025"]]}},{"id":"GK7.14","topic":"Q14 so với trung bình","level":3,"prompt":"\u003cp>Tìm sinh viên có \u003cstrong>số môn khác nhau đã học\u003c/strong> lớn hơn \u003cstrong>trung bình\u003c/strong> số môn khác nhau của mỗi sinh viên (trung bình tính \u003cstrong>cả SV chưa học môn nào\u003c/strong>). Kết quả: \u003ccode>ID, name, course_count\u003c/code>.\u003c/p>","en":"\u003cp>Q14. Find students whose number of distinct courses taken exceeds the average number of distinct courses taken per student. Include students with zero courses when calculating the average. Show ID, name, and course count.\u003c/p>","hint":"WITH cnt AS (student LEFT JOIN takes, COUNT(DISTINCT t.course_id)), rồi so với (SELECT AVG(...) FROM cnt).","solution":"WITH cnt AS (\n  SELECT s.ID, s.name, COUNT(DISTINCT t.course_id) AS course_count\n  FROM student s\n  LEFT JOIN takes t ON t.ID = s.ID\n  GROUP BY s.ID, s.name\n)\nSELECT ID, name, course_count\nFROM cnt\nWHERE course_count > (SELECT AVG(course_count) FROM cnt);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","course_count"],"rows":[["00128","Zhang","2"],["12345","Shankar","5"],["23121","Chavez","2"],["44553","Peltier","2"],["45678","Levy","2"],["54321","Williams","2"],["76543","Brown","2"],["98765","Bourikas","2"],["98988","Tanaka","2"]]}},{"id":"GK7.15","topic":"Q15 đếm cặp phân biệt","level":3,"prompt":"\u003cp>Tìm sinh viên học \u003cstrong>cùng một môn\u003c/strong> ở \u003cstrong>nhiều hơn một\u003c/strong> cặp (học kỳ, năm) khác nhau. Kết quả: \u003ccode>ID, name, course_id, term_count\u003c/code>.\u003c/p>","en":"\u003cp>Q15. Find students who took the same course in more than one distinct semester-year combination. Show student ID, name, course ID, and number of distinct terms.\u003c/p>","hint":"Lấy DISTINCT (ID, course_id, semester, year) trước rồi mới đếm.","solution":"SELECT s.ID, s.name, x.course_id, COUNT(*) AS term_count\nFROM (SELECT DISTINCT ID, course_id, semester, year FROM takes) x\nJOIN student s ON s.ID = x.ID\nGROUP BY s.ID, s.name, x.course_id\nHAVING COUNT(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","course_id","term_count"],"rows":[["45678","Levy","CS-101","2"],["98765","Bourikas","CS-101","2"]]}},{"id":"GK7.16","topic":"Q16 max kể cả hoà","level":3,"prompt":"\u003cp>Tìm (các) khoa có \u003cstrong>tổng lương giảng viên cao nhất\u003c/strong>, giữ cả trường hợp \u003cstrong>hoà\u003c/strong>, và tính cả khoa \u003cstrong>không có giảng viên\u003c/strong> (tổng = 0). Kết quả: \u003ccode>dept_name, total_salary\u003c/code>.\u003c/p>","en":"\u003cp>Q16. Find the department(s) with the highest total instructor salary expenditure, including ties and departments with no instructors.\u003c/p>","hint":"department LEFT JOIN instructor, COALESCE(SUM(salary), 0); rồi = (SELECT MAX(...)).","solution":"WITH tot AS (\n  SELECT d.dept_name, COALESCE(SUM(i.salary), 0) AS total_salary\n  FROM department d\n  LEFT JOIN instructor i ON i.dept_name = d.dept_name\n  GROUP BY d.dept_name\n)\nSELECT dept_name, total_salary\nFROM tot\nWHERE total_salary = (SELECT MAX(total_salary) FROM tot);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","total_salary"],"rows":[["Comp. Sci.","232000"]]}},{"id":"GK7.17","topic":"Q17 join takes–teaches","level":3,"prompt":"\u003cp>Tìm sinh viên đã học với \u003cstrong>ít nhất 3 giảng viên khác nhau\u003c/strong>; giảng viên phải dạy \u003cstrong>đúng section và học kỳ\u003c/strong> SV học. Kết quả: \u003ccode>ID, name, instructor_count\u003c/code>.\u003c/p>","en":"\u003cp>Q17. Find students who took courses taught by at least three distinct instructors. Match instructors to the exact course section and academic term. Show student ID, name, and instructor count.\u003c/p>","hint":"Join takes với teaches trên cả 4 cột course_id, sec_id, semester, year.","solution":"SELECT s.ID, s.name, COUNT(DISTINCT te.ID) AS instructor_count\nFROM takes t\nJOIN teaches te ON te.course_id = t.course_id AND te.sec_id = t.sec_id\n               AND te.semester  = t.semester  AND te.year   = t.year\nJOIN student s  ON s.ID = t.ID\nGROUP BY s.ID, s.name\nHAVING COUNT(DISTINCT te.ID) >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","instructor_count"],"rows":[["12345","Shankar","3"]]}},{"id":"GK7.18","topic":"Q18 not exists lồng","level":3,"prompt":"\u003cp>Tìm sinh viên đã học \u003cstrong>ít nhất một môn có môn tiên quyết\u003c/strong>, và đã \u003cstrong>hoàn thành mọi môn tiên quyết\u003c/strong> của \u003cstrong>mọi\u003c/strong> môn mình học. \"Hoàn thành\" = có điểm khác NULL và khác \u003ccode>F\u003c/code>; không cần học môn tiên quyết trước. Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q18. Find students who have taken at least one course with prerequisites and have completed every prerequisite of every course they took. For this question, completion means a non-NULL grade other than F; prerequisite completion need not precede taking the dependent course.\u003c/p>","hint":"EXISTS (môn có prereq) AND NOT EXISTS (một prereq của môn đã học mà không có lượt học đạt).","solution":"SELECT s.ID, s.name\nFROM student s\nWHERE EXISTS (\n        SELECT 1 FROM takes t JOIN prereq p ON p.course_id = t.course_id\n        WHERE t.ID = s.ID)\n  AND NOT EXISTS (\n        SELECT 1 FROM takes t JOIN prereq p ON p.course_id = t.course_id\n        WHERE t.ID = s.ID\n          AND NOT EXISTS (\n                SELECT 1 FROM takes t2\n                WHERE t2.ID = s.ID AND t2.course_id = p.prereq_id\n                  AND t2.grade IS NOT NULL AND t2.grade \u003c> 'F'));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["00128","Zhang"],["12345","Shankar"],["45678","Levy"],["54321","Williams"],["76543","Brown"],["98765","Bourikas"],["98988","Tanaka"]]}},{"id":"GK7.19","topic":"Q19 phép chia + tập rỗng","level":3,"prompt":"\u003cp>Tìm giảng viên đã dạy ít nhất một section ở \u003cstrong>mọi học kỳ có mở lớp trong năm 2025\u003c/strong>. Nếu năm 2025 không có section nào thì \u003cstrong>không\u003c/strong> trả về giảng viên nào. Kết quả: \u003ccode>ID, name\u003c/code>.\u003c/p>","en":"\u003cp>Q19. Find instructors who taught at least one section in every distinct semester offered during 2025. Show instructor ID and name. Return no instructors if there were no sections in 2025.\u003c/p>","hint":"NOT EXISTS (các semester của 2025 EXCEPT các semester GV dạy năm 2025), cộng thêm EXISTS (section năm 2025).","solution":"SELECT i.ID, i.name\nFROM instructor i\nWHERE EXISTS (SELECT 1 FROM section WHERE year = 2025)\n  AND NOT EXISTS (\n        SELECT semester FROM section WHERE year = 2025\n        EXCEPT\n        SELECT te.semester FROM teaches te WHERE te.ID = i.ID AND te.year = 2025);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["10101","Srinivasan"]]}},{"id":"GK7.20","topic":"Q20 quy đổi điểm + avg","level":3,"prompt":"\u003cp>Tìm giảng viên có \u003cstrong>điểm trung bình của SV mình dạy\u003c/strong> lớn hơn \u003cstrong>trung bình chung của mọi lượt học có điểm\u003c/strong>. Quy đổi A=4.0, A-=3.7, B+=3.3, B=3.0, B-=2.7, C+=2.3, C=2.0, C-=1.7, D=1.0, F=0.0; bỏ điểm NULL và điểm lạ. Một lượt học tính cho \u003cstrong>mọi\u003c/strong> giảng viên dạy section đó. Kết quả: \u003ccode>ID, name, avg_grade\u003c/code> (không làm tròn).\u003c/p>","en":"\u003cp>Q20. Find instructors whose average student grade is greater than the average across all graded enrollments. Use A=4.0, A-=3.7, B+=3.3, B=3.0, B-=2.7, C+=2.3, C=2.0, C-=1.7, D=1.0, F=0.0; exclude NULL or unrecognized grades. Count each enrollment for every instructor teaching that section. Show instructor ID, name, and average grade.\u003c/p>","hint":"Bảng quy đổi bằng WITH gp(grade, points) AS (VALUES (...)); inner join với takes tự bỏ NULL và điểm lạ.","solution":"WITH gp(grade, points) AS (\n  VALUES ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n         ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('D', 1.0), ('F', 0.0)\n),\nenr AS (\n  SELECT t.course_id, t.sec_id, t.semester, t.year, gp.points\n  FROM takes t\n  JOIN gp ON gp.grade = t.grade\n)\nSELECT i.ID, i.name, AVG(e.points) AS avg_grade\nFROM enr e\nJOIN teaches te  ON te.course_id = e.course_id AND te.sec_id = e.sec_id\n                AND te.semester  = e.semester  AND te.year   = e.year\nJOIN instructor i ON i.ID = te.ID\nGROUP BY i.ID, i.name\nHAVING AVG(e.points) > (SELECT AVG(points) FROM enr);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","avg_grade"],"rows":[["15151","Mozart","3.7"],["45565","Katz","3.2"],["76766","Crick","4"],["83821","Brandt","3.7667"]]}}]},{"key":"gk8","store":"gk8","short":"GK-M2","label":"Đề mẫu 2 · Cửa hàng","navLabel":"Đề mẫu 2","kind":"Đề thi","title":"Shop Database: 20 SQL Query Exercises","titleVi":"Đề mẫu 2 — 20 truy vấn trên Shop database","seed":"","seedFile":"","dbPanel":"sh_","summary":"\u003ch3>1. Đề này là gì\u003c/h3>\n\u003cp>20 truy vấn luyện \u003cstrong>đúng các dạng của Đề mẫu (GK7)\u003c/strong> nhưng trên một lược đồ khác: cửa hàng trực tuyến. Câu Qn ở đây cùng dạng với Qn của GK7. Bấm \u003cstrong>Database\u003c/strong> để xem bảng, \u003cstrong>Debug\u003c/strong> để chạy từng bước.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bảng\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sh_customer(cust_id, name, city, tier)\u003c/code>\u003c/td>\u003ctd>khách hàng; \u003ccode>city\u003c/code> → \u003ccode>sh_region\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_region(city, region, ship_fee)\u003c/code>\u003c/td>\u003ctd>vùng và phí giao của mỗi thành phố\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_category(category, manager)\u003c/code>\u003c/td>\u003ctd>danh mục (Home \u003cstrong>chưa có sản phẩm\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_product(product_id, name, category, price)\u003c/code>\u003c/td>\u003ctd>sản phẩm, \u003ccode>price\u003c/code> = giá niêm yết\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_requires(product_id, required_id)\u003c/code>\u003c/td>\u003ctd>phụ kiện cần có sản phẩm chính (giống \u003ccode>prereq\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_supplier(supplier_id, name, country, specialty)\u003c/code>, \u003ccode>sh_supplies\u003c/code>\u003c/td>\u003ctd>nhà cung cấp và sản phẩm họ cung cấp (giống \u003ccode>instructor\u003c/code>/\u003ccode>teaches\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_orders(order_id, cust_id, order_date, status)\u003c/code>\u003c/td>\u003ctd>đơn hàng; \u003ccode>status\u003c/code> = delivered / pending / \u003cstrong>cancelled\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_order_item(order_id, line_no, product_id, qty, unit_price)\u003c/code>\u003c/td>\u003ctd>dòng hàng, khoá \u003cstrong>(order_id, line_no)\u003c/strong>; \u003ccode>unit_price\u003c/code> có thể thấp hơn \u003ccode>price\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_shipment(order_id, line_no, carrier, ship_date)\u003c/code>\u003c/td>\u003ctd>mỗi dòng hàng được giao riêng; khớp \u003cstrong>cả 2 cột\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sh_review(cust_id, product_id, rating)\u003c/code>\u003c/td>\u003ctd>Excellent / Good / Average / Poor / Terrible, có \u003ccode>NULL\u003c/code> và \u003ccode>'N/A'\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Dạng ↔ câu\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dạng\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Cách viết\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\"chưa từng\"\u003c/td>\u003ctd>Q10, Q11, Q13\u003c/td>\u003ctd>\u003ccode>NOT EXISTS\u003c/code> hoặc \u003ccode>LEFT JOIN … IS NULL\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Phép chia \"mọi …\"\u003c/td>\u003ctd>Q12, Q19\u003c/td>\u003ctd>\u003ccode>NOT EXISTS (tập cần có EXCEPT tập đã có)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>So với trung bình\u003c/td>\u003ctd>Q14, Q20\u003c/td>\u003ctd>\u003ccode>WITH\u003c/code> tính từng nhóm, rồi so với \u003ccode>(select avg …)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lớn nhất kể cả hoà\u003c/td>\u003ctd>Q16\u003c/td>\u003ctd>\u003ccode>= (select max …)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Khoá nhiều cột\u003c/td>\u003ctd>Q13, Q17\u003c/td>\u003ctd>khớp \u003ccode>order_id\u003c/code> \u003cstrong>và\u003c/strong> \u003ccode>line_no\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Theo tháng\u003c/td>\u003ctd>Q6, Q15, Q19\u003c/td>\u003ctd>\u003ccode>order_date &gt;= '2025-01-01' and order_date &lt; '2025-02-01'\u003c/code>, \u003ccode>extract(month from …)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Bẫy hay gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q5, Q8:\u003c/strong> khách mua lại cùng sản phẩm (C01 mua Earbuds 3 lần, C09 có 2 dòng Headphones trong một đơn) → \u003ccode>DISTINCT\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q13:\u003c/strong> đơn O05 có dòng 1 đã giao, dòng 2 chưa; chỉ so \u003ccode>order_id\u003c/code> sẽ bỏ sót dòng 2.\u003c/li>\u003cli>\u003cstrong>Q14:\u003c/strong> trung bình phải tính cả khách chưa mua gì (C07, C10) → \u003ccode>LEFT JOIN\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q15:\u003c/strong> C09 mua Headphones 2 dòng trong \u003cstrong>cùng\u003c/strong> một đơn → chỉ là 1 tháng; đếm cặp (năm, tháng) phân biệt.\u003c/li>\u003cli>\u003cstrong>Q16:\u003c/strong> bỏ đơn \u003ccode>cancelled\u003c/code>; Phones và Computers \u003cstrong>hoà\u003c/strong> nhau; Home không có sản phẩm → 0.\u003c/li>\u003cli>\u003cstrong>Q18:\u003c/strong> \"đã có\" sản phẩm chính = có mua ở bất kỳ đơn nào \u003cstrong>không bị huỷ\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Q20:\u003c/strong> \u003ccode>NULL\u003c/code> và \u003ccode>'N/A'\u003c/code> bị bỏ bằng \u003cstrong>inner join\u003c/strong> với bảng quy đổi.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>Q13\u003c/strong> — Vì sao \u003ccode>NOT EXISTS (… where s.order_id = i.order_id)\u003c/code> (chỉ so \u003ccode>order_id\u003c/code>) cho kết quả sai? Chỉ ra dòng hàng bị bỏ sót.","en":"","answer":"\u003cp>Khoá của dòng hàng là \u003cstrong>(order_id, line_no)\u003c/strong>; một shipment chỉ giao đúng một dòng. Nếu chỉ so \u003ccode>order_id\u003c/code> thì một dòng được coi là \"đã giao\" khi \u003cstrong>bất kỳ\u003c/strong> dòng nào cùng đơn đã giao.\u003c/p>\n\u003cp>Đơn O05 có dòng 1 (Speaker) đã giao bằng DHL, dòng 2 (Earbuds) chưa giao → chỉ so \u003ccode>order_id\u003c/code> thì O05-2 biến mất khỏi kết quả. Tương tự O13-2. Cách đúng:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>NOT EXISTS (SELECT 1 FROM sh_shipment s\n            WHERE s.order_id = i.order_id AND s.line_no = i.line_no)\u003c/code>\u003c/pre>"},{"q":"\u003cstrong>Q16\u003c/strong> — Nếu quên bỏ các đơn \u003ccode>cancelled\u003c/code> thì kết quả Q16 đổi thế nào? Nếu dùng \u003ccode>ORDER BY … LIMIT 1\u003c/code> thì sai ở đâu?","en":"","answer":"\u003cp>Doanh thu (bỏ đơn huỷ): Phones = 800 + 400 + 780 + 400 = \u003cstrong>2380\u003c/strong>, Computers = 880 + 1500 = \u003cstrong>2380\u003c/strong> → hai danh mục \u003cstrong>hoà\u003c/strong>. Đơn O04 (huỷ) có Laptop Pro 1500; nếu không bỏ thì Computers = 3880 và chỉ còn Computers.\u003c/p>\n\u003cp>\u003ccode>ORDER BY total DESC LIMIT 1\u003c/code> chỉ trả \u003cstrong>một\u003c/strong> dòng nên làm mất danh mục hoà; phải so \u003ccode>= (SELECT MAX(total) FROM …)\u003c/code>.\u003c/p>"}],"exercises":[{"id":"GK8.01","topic":"Q1 where","level":1,"prompt":"\u003cp>Cho mã và tên các khách hàng ở thành phố \u003cstrong>Hanoi\u003c/strong>. Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT cust_id, name\nFROM sh_customer\nWHERE city = 'Hanoi';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C01","An Nguyen"],["C04","Dung Pham"],["C07","Hoa Bui"]]}},{"id":"GK8.02","topic":"Q2 where >=","level":1,"prompt":"\u003cp>Liệt kê các sản phẩm có giá niêm yết \u003cstrong>từ 400 trở lên\u003c/strong>. Kết quả: \u003ccode>product_id, name, price\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT product_id, name, price\nFROM sh_product\nWHERE price >= 400;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["product_id","name","price"],"rows":[["P01","Phone X","800"],["P02","Phone Lite","400"],["P03","Laptop Pro","1500"],["P04","Laptop Air","1000"],["P12","Tablet Mini","600"]]}},{"id":"GK8.03","topic":"Q3 where","level":1,"prompt":"\u003cp>Liệt kê tên các sản phẩm thuộc danh mục \u003cstrong>Audio\u003c/strong>. Kết quả: \u003ccode>name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT name\nFROM sh_product\nWHERE category = 'Audio';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Earbuds"],["Headphones"],["Speaker"]]}},{"id":"GK8.04","topic":"Q4 join","level":1,"prompt":"\u003cp>Với mỗi khách hàng, cho mã, tên, thành phố, vùng (\u003ccode>region\u003c/code>) và phí giao (\u003ccode>ship_fee\u003c/code>) của thành phố đó. Kết quả: \u003ccode>cust_id, name, city, region, ship_fee\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT c.cust_id, c.name, c.city, r.region, r.ship_fee\nFROM sh_customer c\nJOIN sh_region r ON r.city = c.city;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name","city","region","ship_fee"],"rows":[["C01","An Nguyen","Hanoi","North","20"],["C02","Binh Tran","HCMC","South","15"],["C03","Chi Le","Danang","Central","30"],["C04","Dung Pham","Hanoi","North","20"],["C05","Em Vo","HCMC","South","15"],["C06","Giang Ho","Hue","Central","30"],["C07","Hoa Bui","Hanoi","North","20"],["C08","Khanh Do","Cantho","South","35"],["C09","Lan Ngo","HCMC","South","15"],["C10","Minh Ly","Haiphong","North","25"]]}},{"id":"GK8.05","topic":"Q5 join + distinct","level":1,"prompt":"\u003cp>Tên các sản phẩm (không trùng) mà khách \u003cstrong>C01\u003c/strong> đã mua, ở mọi đơn. Kết quả: \u003ccode>name\u003c/code>.\u003c/p>","en":"","hint":"sh_orders → sh_order_item → sh_product; C01 mua Earbuds nhiều lần.","solution":"SELECT DISTINCT p.name\nFROM sh_orders o\nJOIN sh_order_item i ON i.order_id = o.order_id\nJOIN sh_product p    ON p.product_id = i.product_id\nWHERE o.cust_id = 'C01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Audio Adapter"],["Earbuds"],["Headphones"],["Phone X"],["Phone X Case"],["Speaker"]]}},{"id":"GK8.06","topic":"Q6 join + lọc ngày","level":2,"prompt":"\u003cp>Mã và tên các khách đã mua \u003cstrong>Earbuds (P05)\u003c/strong> trong \u003cstrong>tháng 1/2025\u003c/strong> (mỗi khách một dòng). Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"order_date >= '2025-01-01' AND order_date \u003c '2025-02-01'.","solution":"SELECT DISTINCT c.cust_id, c.name\nFROM sh_customer c\nJOIN sh_orders o     ON o.cust_id = c.cust_id\nJOIN sh_order_item i ON i.order_id = o.order_id\nWHERE i.product_id = 'P05'\n  AND o.order_date >= '2025-01-01' AND o.order_date \u003c '2025-02-01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C01","An Nguyen"],["C09","Lan Ngo"]]}},{"id":"GK8.07","topic":"Q7 3 bảng, so cột","level":2,"prompt":"\u003cp>Tìm nhà cung cấp có cung cấp sản phẩm \u003cstrong>thuộc danh mục khác\u003c/strong> với chuyên môn (\u003ccode>specialty\u003c/code>) của mình. Kết quả: \u003ccode>name\u003c/code> (nhà cung cấp), \u003ccode>specialty\u003c/code>, \u003ccode>product\u003c/code> (tên sản phẩm) — mỗi bộ ba một dòng.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT s.name, s.specialty, p.name AS product\nFROM sh_supplier s\nJOIN sh_supplies sp ON sp.supplier_id = s.supplier_id\nJOIN sh_product p   ON p.product_id = sp.product_id\nWHERE p.category \u003c> s.specialty;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","specialty","product"],"rows":[["MegaSupply","Phones","Tablet Mini"],["MegaSupply","Phones","Audio Adapter"],["TechSource","Phones","Phone X Case"],["CompuPlus","Computers","Laptop Pro Dock"],["CompuPlus","Computers","Laptop Air Sleeve"],["AllGoods","Accessories","Earbuds"]]}},{"id":"GK8.08","topic":"Q8 join + distinct","level":1,"prompt":"\u003cp>Tên các khách hàng (không trùng) đã mua \u003cstrong>Headphones (P06)\u003c/strong>. Kết quả: \u003ccode>name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT c.name\nFROM sh_customer c\nJOIN sh_orders o     ON o.cust_id = c.cust_id\nJOIN sh_order_item i ON i.order_id = o.order_id\nWHERE i.product_id = 'P06';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["An Nguyen"],["Lan Ngo"]]}},{"id":"GK8.09","topic":"Q9 join, so cột","level":2,"prompt":"\u003cp>Mã và tên các khách đã mua \u003cstrong>ít nhất một dòng hàng với giá bán thấp hơn giá niêm yết\u003c/strong> (\u003ccode>unit_price &lt; price\u003c/code>), mỗi khách một dòng. Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT c.cust_id, c.name\nFROM sh_customer c\nJOIN sh_orders o     ON o.cust_id = c.cust_id\nJOIN sh_order_item i ON i.order_id = o.order_id\nJOIN sh_product p    ON p.product_id = i.product_id\nWHERE i.unit_price \u003c p.price;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C05","Em Vo"],["C09","Lan Ngo"],["C04","Dung Pham"],["C01","An Nguyen"]]}},{"id":"GK8.10","topic":"Q10 not exists","level":2,"prompt":"\u003cp>Mã và tên các khách \u003cstrong>chưa đặt đơn nào\u003c/strong>. Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT c.cust_id, c.name\nFROM sh_customer c\nWHERE NOT EXISTS (SELECT 1 FROM sh_orders o WHERE o.cust_id = c.cust_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C10","Minh Ly"],["C07","Hoa Bui"]]}},{"id":"GK8.11","topic":"Q11 not exists","level":2,"prompt":"\u003cp>Mã và tên các sản phẩm \u003cstrong>chưa từng xuất hiện trong dòng hàng nào\u003c/strong>. Kết quả: \u003ccode>product_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.product_id, p.name\nFROM sh_product p\nWHERE NOT EXISTS (SELECT 1 FROM sh_order_item i WHERE i.product_id = p.product_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["product_id","name"],"rows":[["P13","Smart Watch"],["P12","Tablet Mini"]]}},{"id":"GK8.12","topic":"Q12 phép chia","level":3,"prompt":"\u003cp>Mã và tên các khách đã mua \u003cstrong>mọi\u003c/strong> sản phẩm của danh mục \u003cstrong>Audio\u003c/strong> (ở đơn nào cũng được). Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"NOT EXISTS (sản phẩm Audio EXCEPT sản phẩm khách đã mua).","solution":"SELECT c.cust_id, c.name\nFROM sh_customer c\nWHERE NOT EXISTS (\n  SELECT product_id FROM sh_product WHERE category = 'Audio'\n  EXCEPT\n  SELECT i.product_id\n  FROM sh_orders o JOIN sh_order_item i ON i.order_id = o.order_id\n  WHERE o.cust_id = c.cust_id\n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C01","An Nguyen"],["C09","Lan Ngo"]]}},{"id":"GK8.13","topic":"Q13 not exists, khoá 2 cột","level":2,"prompt":"\u003cp>Tìm các dòng hàng \u003cstrong>chưa được giao\u003c/strong> (không có shipment) của những đơn \u003cstrong>không bị huỷ\u003c/strong>. Kết quả: \u003ccode>order_id, line_no, product_id\u003c/code>.\u003c/p>","en":"","hint":"Shipment phải khớp cả order_id và line_no.","solution":"SELECT i.order_id, i.line_no, i.product_id\nFROM sh_order_item i\nJOIN sh_orders o ON o.order_id = i.order_id\nWHERE o.status \u003c> 'cancelled'\n  AND NOT EXISTS (\n        SELECT 1 FROM sh_shipment s\n        WHERE s.order_id = i.order_id AND s.line_no = i.line_no);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["order_id","line_no","product_id"],"rows":[["O09","2","P05"],["O15","1","P10"],["O05","2","P05"],["O09","1","P11"],["O13","2","P08"]]}},{"id":"GK8.14","topic":"Q14 so với trung bình","level":3,"prompt":"\u003cp>Tìm khách có \u003cstrong>số sản phẩm khác nhau đã mua\u003c/strong> lớn hơn \u003cstrong>trung bình\u003c/strong> số sản phẩm khác nhau của mỗi khách (trung bình tính \u003cstrong>cả khách chưa mua gì\u003c/strong>; tính mọi đơn). Kết quả: \u003ccode>cust_id, name, product_count\u003c/code>.\u003c/p>","en":"","hint":"sh_customer LEFT JOIN sh_orders LEFT JOIN sh_order_item, COUNT(DISTINCT i.product_id).","solution":"WITH cnt AS (\n  SELECT c.cust_id, c.name, COUNT(DISTINCT i.product_id) AS product_count\n  FROM sh_customer c\n  LEFT JOIN sh_orders o     ON o.cust_id = c.cust_id\n  LEFT JOIN sh_order_item i ON i.order_id = o.order_id\n  GROUP BY c.cust_id, c.name\n)\nSELECT cust_id, name, product_count\nFROM cnt\nWHERE product_count > (SELECT AVG(product_count) FROM cnt);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name","product_count"],"rows":[["C01","An Nguyen","6"],["C02","Binh Tran","3"],["C04","Dung Pham","3"],["C09","Lan Ngo","5"]]}},{"id":"GK8.15","topic":"Q15 đếm cặp phân biệt","level":3,"prompt":"\u003cp>Tìm khách mua \u003cstrong>cùng một sản phẩm\u003c/strong> ở \u003cstrong>nhiều hơn một\u003c/strong> tháng khác nhau (cặp năm, tháng của \u003ccode>order_date\u003c/code>). Kết quả: \u003ccode>cust_id, name, product_id, month_count\u003c/code>.\u003c/p>","en":"","hint":"DISTINCT (cust_id, product_id, năm, tháng) trước, rồi mới đếm.","solution":"SELECT c.cust_id, c.name, x.product_id, COUNT(*) AS month_count\nFROM (SELECT DISTINCT o.cust_id, i.product_id,\n             EXTRACT(YEAR FROM o.order_date) AS y, EXTRACT(MONTH FROM o.order_date) AS m\n      FROM sh_orders o JOIN sh_order_item i ON i.order_id = o.order_id) x\nJOIN sh_customer c ON c.cust_id = x.cust_id\nGROUP BY c.cust_id, c.name, x.product_id\nHAVING COUNT(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name","product_id","month_count"],"rows":[["C02","Binh Tran","P02","2"],["C01","An Nguyen","P05","3"]]}},{"id":"GK8.16","topic":"Q16 max kể cả hoà","level":3,"prompt":"\u003cp>Tìm (các) danh mục có \u003cstrong>doanh thu cao nhất\u003c/strong> (tổng \u003ccode>qty * unit_price\u003c/code>, **bỏ đơn \u003ccode>cancelled\u003c/code>\u003cstrong>), giữ các danh mục \u003c/strong>hoà\u003cstrong>, và tính cả danh mục \u003c/strong>không có doanh thu** (= 0). Kết quả: \u003ccode>category, revenue\u003c/code>.\u003c/p>","en":"","hint":"sh_category LEFT JOIN (dòng hàng của đơn không huỷ, kèm category), COALESCE(SUM(...), 0).","solution":"WITH sold AS (\n  SELECT p.category, i.qty * i.unit_price AS amount\n  FROM sh_order_item i\n  JOIN sh_orders o  ON o.order_id = i.order_id\n  JOIN sh_product p ON p.product_id = i.product_id\n  WHERE o.status \u003c> 'cancelled'\n),\nrev AS (\n  SELECT g.category, COALESCE(SUM(s.amount), 0) AS revenue\n  FROM sh_category g\n  LEFT JOIN sold s ON s.category = g.category\n  GROUP BY g.category\n)\nSELECT category, revenue\nFROM rev\nWHERE revenue = (SELECT MAX(revenue) FROM rev);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["category","revenue"],"rows":[["Phones","2380"],["Computers","2380"]]}},{"id":"GK8.17","topic":"Q17 join khoá 2 cột","level":3,"prompt":"\u003cp>Tìm khách có hàng được giao bởi \u003cstrong>ít nhất 3 hãng vận chuyển khác nhau\u003c/strong>; shipment phải khớp \u003cstrong>đúng dòng hàng\u003c/strong> của khách. Kết quả: \u003ccode>cust_id, name, carrier_count\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT c.cust_id, c.name, COUNT(DISTINCT s.carrier) AS carrier_count\nFROM sh_orders o\nJOIN sh_order_item i ON i.order_id = o.order_id\nJOIN sh_shipment s   ON s.order_id = i.order_id AND s.line_no = i.line_no\nJOIN sh_customer c   ON c.cust_id = o.cust_id\nGROUP BY c.cust_id, c.name\nHAVING COUNT(DISTINCT s.carrier) >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name","carrier_count"],"rows":[["C01","An Nguyen","4"],["C09","Lan Ngo","3"]]}},{"id":"GK8.18","topic":"Q18 not exists lồng","level":3,"prompt":"\u003cp>Tìm khách đã mua \u003cstrong>ít nhất một sản phẩm cần sản phẩm chính\u003c/strong> (có trong \u003ccode>sh_requires\u003c/code>), và với \u003cstrong>mọi\u003c/strong> sản phẩm như vậy đã mua thì cũng đã mua \u003cstrong>mọi\u003c/strong> sản phẩm chính nó cần. Chỉ tính các đơn \u003cstrong>không bị huỷ\u003c/strong>. Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"Tạo bought(cust_id, product_id) từ đơn không huỷ; EXISTS (mua sp có yêu cầu) AND NOT EXISTS (một yêu cầu chưa có trong bought).","solution":"WITH bought AS (\n  SELECT DISTINCT o.cust_id, i.product_id\n  FROM sh_orders o JOIN sh_order_item i ON i.order_id = o.order_id\n  WHERE o.status \u003c> 'cancelled'\n)\nSELECT c.cust_id, c.name\nFROM sh_customer c\nWHERE EXISTS (\n        SELECT 1 FROM bought b JOIN sh_requires r ON r.product_id = b.product_id\n        WHERE b.cust_id = c.cust_id)\n  AND NOT EXISTS (\n        SELECT 1 FROM bought b JOIN sh_requires r ON r.product_id = b.product_id\n        WHERE b.cust_id = c.cust_id\n          AND NOT EXISTS (SELECT 1 FROM bought b2\n                          WHERE b2.cust_id = c.cust_id AND b2.product_id = r.required_id));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C01","An Nguyen"],["C09","Lan Ngo"]]}},{"id":"GK8.19","topic":"Q19 phép chia + tập rỗng","level":3,"prompt":"\u003cp>Tìm khách đã đặt ít nhất một đơn trong \u003cstrong>mọi tháng của năm 2025 có đơn hàng\u003c/strong> (tính mọi đơn). Nếu năm 2025 không có đơn nào thì \u003cstrong>không\u003c/strong> trả về khách nào. Kết quả: \u003ccode>cust_id, name\u003c/code>.\u003c/p>","en":"","hint":"NOT EXISTS (các tháng có đơn năm 2025 EXCEPT các tháng khách đặt năm 2025) cùng EXISTS (đơn năm 2025).","solution":"SELECT c.cust_id, c.name\nFROM sh_customer c\nWHERE EXISTS (SELECT 1 FROM sh_orders WHERE EXTRACT(YEAR FROM order_date) = 2025)\n  AND NOT EXISTS (\n        SELECT EXTRACT(MONTH FROM order_date) FROM sh_orders\n        WHERE EXTRACT(YEAR FROM order_date) = 2025\n        EXCEPT\n        SELECT EXTRACT(MONTH FROM o.order_date) FROM sh_orders o\n        WHERE o.cust_id = c.cust_id AND EXTRACT(YEAR FROM o.order_date) = 2025);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust_id","name"],"rows":[["C01","An Nguyen"],["C09","Lan Ngo"]]}},{"id":"GK8.20","topic":"Q20 quy đổi + avg","level":3,"prompt":"\u003cp>Tìm nhà cung cấp có \u003cstrong>điểm đánh giá trung bình\u003c/strong> của các sản phẩm mình cung cấp lớn hơn \u003cstrong>trung bình chung của mọi đánh giá hợp lệ\u003c/strong>. Quy đổi Excellent=5, Good=4, Average=3, Poor=2, Terrible=1; bỏ \u003ccode>NULL\u003c/code> và giá trị lạ. Một đánh giá tính cho \u003cstrong>mọi\u003c/strong> nhà cung cấp của sản phẩm đó. Kết quả: \u003ccode>supplier_id, name, avg_score\u003c/code> (không làm tròn).\u003c/p>","en":"","hint":"WITH sc(rating, score) AS (VALUES ...); inner join với sh_review tự bỏ NULL và N/A.","solution":"WITH sc(rating, score) AS (\n  VALUES ('Excellent', 5), ('Good', 4), ('Average', 3), ('Poor', 2), ('Terrible', 1)\n),\nrv AS (\n  SELECT r.product_id, sc.score\n  FROM sh_review r\n  JOIN sc ON sc.rating = r.rating\n)\nSELECT s.supplier_id, s.name, AVG(rv.score) AS avg_score\nFROM rv\nJOIN sh_supplies sp ON sp.product_id = rv.product_id\nJOIN sh_supplier s  ON s.supplier_id = sp.supplier_id\nGROUP BY s.supplier_id, s.name\nHAVING AVG(rv.score) > (SELECT AVG(score) FROM rv);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["supplier_id","name","avg_score"],"rows":[["S03","CompuPlus","4.5"],["S02","SoundWorld","4.25"],["S05","MegaSupply","3.6667"]]}}]},{"key":"gk9","store":"gk9","short":"GK-M3","label":"Đề mẫu 3 · Hãng bay","navLabel":"Đề mẫu 3","kind":"Đề thi","title":"Airline Database: 20 SQL Query Exercises","titleVi":"Đề mẫu 3 — 20 truy vấn trên Airline database","seed":"","seedFile":"","dbPanel":"fl_","summary":"\u003ch3>1. Đề này là gì\u003c/h3>\n\u003cp>20 truy vấn cùng dạng với \u003cstrong>Đề mẫu (GK7)\u003c/strong> trên lược đồ hãng bay. Qn ở đây cùng dạng với Qn của GK7. Bấm \u003cstrong>Database\u003c/strong> để xem bảng, \u003cstrong>Debug\u003c/strong> để chạy từng bước.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bảng\u003c/th>\u003cth>Ý nghĩa (so với University)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>fl_airport(code, city, country)\u003c/code>\u003c/td>\u003ctd>sân bay (NRT \u003cstrong>không có phi công\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_route(route_id, origin, dest, distance)\u003c/code>\u003c/td>\u003ctd>tuyến bay; \u003ccode>origin\u003c/code>, \u003ccode>dest\u003c/code> đều trỏ tới \u003ccode>fl_airport\u003c/code> (≈ \u003ccode>course\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_requires(route_id, required_id)\u003c/code>\u003c/td>\u003ctd>chặng nối: muốn bay \u003ccode>route_id\u003c/code> phải có vé \u003ccode>required_id\u003c/code> (≈ \u003ccode>prereq\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_flight(route_id, flight_date)\u003c/code>\u003c/td>\u003ctd>chuyến bay cụ thể, khoá \u003cstrong>2 cột\u003c/strong> (≈ \u003ccode>section\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_pilot(pilot_id, name, base, salary)\u003c/code>, \u003ccode>fl_crew\u003c/code>\u003c/td>\u003ctd>phi công và chuyến họ lái (≈ \u003ccode>instructor\u003c/code>/\u003ccode>teaches\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_passenger(pax_id, name, country, tier)\u003c/code>, \u003ccode>fl_booking\u003c/code>\u003c/td>\u003ctd>hành khách và vé (≈ \u003ccode>student\u003c/code>/\u003ccode>takes\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fl_booking.seat_class\u003c/code>\u003c/td>\u003ctd>F / J / W / Y, có \u003ccode>NULL\u003c/code> và mã lạ \u003ccode>'X'\u003c/code> (≈ \u003ccode>grade\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Điểm mới so với GK7\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q4:\u003c/strong> join \u003cstrong>cùng một bảng hai lần\u003c/strong> (\u003ccode>fl_airport\u003c/code> cho điểm đi và điểm đến) → phải đặt hai alias.\u003c/li>\u003cli>\u003cstrong>Q16:\u003c/strong> tổng lương theo \u003cstrong>sân bay gốc\u003c/strong>, tính cả sân bay không có phi công.\u003c/li>\u003cli>\u003cstrong>Q19:\u003c/strong> phép chia trên \u003cstrong>tuyến\u003c/strong> (mọi tuyến từ HAN có chuyến năm 2025) thay vì học kỳ.\u003c/li>\u003c/ul>\n\u003ch3>3. Bẫy hay gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Q5, Q8:\u003c/strong> một khách bay cùng tuyến nhiều lần, hai tuyến cùng đến Danang → \u003ccode>DISTINCT\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Q13, Q17, Q20:\u003c/strong> \u003ccode>fl_crew\u003c/code> và \u003ccode>fl_booking\u003c/code> phải khớp \u003cstrong>cả\u003c/strong> \u003ccode>route_id\u003c/code> \u003cstrong>và\u003c/strong> \u003ccode>flight_date\u003c/code>. Chỉ khớp \u003ccode>route_id\u003c/code> thì R05 ngày 20/02 bị coi là \"đã có phi công\" (Q13), và Emi bị tính bay với 3 phi công (Q17).\u003c/li>\u003cli>\u003cstrong>Q14:\u003c/strong> trung bình tính cả khách chưa đặt vé (Gia, Hana).\u003c/li>\u003cli>\u003cstrong>Q15:\u003c/strong> đếm \u003cstrong>ngày bay\u003c/strong> phân biệt của cùng một tuyến.\u003c/li>\u003cli>\u003cstrong>Q20:\u003c/strong> \u003ccode>NULL\u003c/code> và \u003ccode>'X'\u003c/code> bị bỏ bằng inner join với bảng hệ số.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>Q4\u003c/strong> — Vì sao cần hai alias cho \u003ccode>fl_airport\u003c/code>? Viết lại Q4 và giải thích chuyện gì xảy ra nếu chỉ join \u003ccode>fl_airport\u003c/code> một lần với điều kiện \u003ccode>a.code = r.origin AND a.code = r.dest\u003c/code>.","en":"","answer":"\u003cp>Mỗi tuyến cần \u003cstrong>hai\u003c/strong> dòng sân bay khác nhau: một cho điểm đi, một cho điểm đến, nên phải join hai bản sao:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>SELECT r.route_id, o.city AS origin_city, d.city AS dest_city\nFROM fl_route r\nJOIN fl_airport o ON o.code = r.origin\nJOIN fl_airport d ON d.code = r.dest;\u003c/code>\u003c/pre>\n\u003cp>Với một alias và điều kiện \u003ccode>a.code = r.origin AND a.code = r.dest\u003c/code>, một dòng sân bay phải vừa là điểm đi vừa là điểm đến → chỉ khớp tuyến có \u003ccode>origin = dest\u003c/code>, ở đây \u003cstrong>không\u003c/strong> có tuyến nào, kết quả rỗng.\u003c/p>"},{"q":"\u003cstrong>Q17\u003c/strong> — Emi (P05) bay R05 ngày 20/01, R03 ngày 01/02 và R07 ngày 18/03. Đếm số phi công của Emi khi join \u003ccode>fl_crew\u003c/code> đúng (2 cột) và sai (chỉ \u003ccode>route_id\u003c/code>).","en":"","answer":"\u003cp>Đúng (khớp \u003ccode>route_id\u003c/code> và \u003ccode>flight_date\u003c/code>): R05 20/01 → PL6; R03 01/02 → PL1; R07 18/03 → chưa có phi công. Tổng \u003cstrong>2\u003c/strong> phi công → Emi \u003cstrong>không\u003c/strong> thoả \"≥ 3\".\u003c/p>\n\u003cp>Sai (chỉ \u003ccode>route_id\u003c/code>): R05 → PL6 (mọi ngày của R05); R03 → PL1 \u003cstrong>và PL4\u003c/strong> (PL4 lái R03 ngày 15/03, không phải chuyến của Emi); R07 → không ai. Tổng \u003cstrong>3\u003c/strong> phi công → Emi bị đưa nhầm vào kết quả.\u003c/p>"}],"exercises":[{"id":"GK9.01","topic":"Q1 where","level":1,"prompt":"\u003cp>Cho mã và tên các hành khách có quốc tịch \u003cstrong>VN\u003c/strong>. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT pax_id, name\nFROM fl_passenger\nWHERE country = 'VN';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P01","An"],["P02","Bao"],["P03","Chau"],["P07","Gia"]]}},{"id":"GK9.02","topic":"Q2 where >=","level":1,"prompt":"\u003cp>Liệt kê các tuyến có cự ly \u003cstrong>từ 1000 km trở lên\u003c/strong>. Kết quả: \u003ccode>route_id, origin, dest, distance\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT route_id, origin, dest, distance\nFROM fl_route\nWHERE distance >= 1000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["route_id","origin","dest","distance"],"rows":[["R01","HAN","SGN","1160"],["R02","SGN","HAN","1160"],["R06","SGN","SIN","1100"],["R07","DAD","SIN","1500"],["R09","PQC","HAN","1200"]]}},{"id":"GK9.03","topic":"Q3 where","level":1,"prompt":"\u003cp>Liệt kê mã sân bay đến (\u003ccode>dest\u003c/code>) của các tuyến \u003cstrong>xuất phát từ SGN\u003c/strong>. Kết quả: \u003ccode>dest\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT dest\nFROM fl_route\nWHERE origin = 'SGN';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dest"],"rows":[["HAN"],["DAD"],["SIN"],["PQC"]]}},{"id":"GK9.04","topic":"Q4 join 2 lần","level":1,"prompt":"\u003cp>Với mỗi tuyến, cho mã tuyến, \u003cstrong>thành phố đi\u003c/strong> và \u003cstrong>thành phố đến\u003c/strong>. Kết quả: \u003ccode>route_id, origin_city, dest_city\u003c/code>.\u003c/p>","en":"","hint":"Join fl_airport hai lần với hai alias.","solution":"SELECT r.route_id, o.city AS origin_city, d.city AS dest_city\nFROM fl_route r\nJOIN fl_airport o ON o.code = r.origin\nJOIN fl_airport d ON d.code = r.dest;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["route_id","origin_city","dest_city"],"rows":[["R01","Hanoi","HCMC"],["R02","HCMC","Hanoi"],["R03","Hanoi","Danang"],["R04","HCMC","Danang"],["R05","Hanoi","Bangkok"],["R06","HCMC","Singapore"],["R07","Danang","Singapore"],["R08","HCMC","Phu Quoc"],["R09","Phu Quoc","Hanoi"]]}},{"id":"GK9.05","topic":"Q5 join + distinct","level":1,"prompt":"\u003cp>Các \u003cstrong>thành phố đến\u003c/strong> (không trùng) mà hành khách \u003cstrong>P01\u003c/strong> đã có vé. Kết quả: \u003ccode>city\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT a.city\nFROM fl_booking b\nJOIN fl_route r   ON r.route_id = b.route_id\nJOIN fl_airport a ON a.code = r.dest\nWHERE b.pax_id = 'P01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["city"],"rows":[["Bangkok"],["Danang"],["HCMC"],["Singapore"]]}},{"id":"GK9.06","topic":"Q6 join + lọc ngày","level":2,"prompt":"\u003cp>Mã và tên các hành khách có vé tuyến \u003cstrong>R01\u003c/strong> trong \u003cstrong>tháng 1/2025\u003c/strong>. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT p.pax_id, p.name\nFROM fl_passenger p\nJOIN fl_booking b ON b.pax_id = p.pax_id\nWHERE b.route_id = 'R01'\n  AND b.flight_date >= '2025-01-01' AND b.flight_date \u003c '2025-02-01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P01","An"],["P04","David"]]}},{"id":"GK9.07","topic":"Q7 3 bảng, so cột","level":2,"prompt":"\u003cp>Tìm phi công đã lái tuyến \u003cstrong>xuất phát từ sân bay khác\u003c/strong> sân bay gốc (\u003ccode>base\u003c/code>) của mình. Kết quả: \u003ccode>name, base, route_id, origin\u003c/code> — mỗi bộ một dòng.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT p.name, p.base, r.route_id, r.origin\nFROM fl_pilot p\nJOIN fl_crew c  ON c.pilot_id = p.pilot_id\nJOIN fl_route r ON r.route_id = c.route_id\nWHERE r.origin \u003c> p.base;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","base","route_id","origin"],"rows":[["Wei","SIN","R06","SGN"],["Somchai","BKK","R05","HAN"],["Tuan","DAD","R03","HAN"]]}},{"id":"GK9.08","topic":"Q8 join + distinct","level":1,"prompt":"\u003cp>Tên các hành khách (không trùng) có vé tuyến \u003cstrong>R01\u003c/strong> (ngày nào cũng được). Kết quả: \u003ccode>name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT p.name\nFROM fl_passenger p\nJOIN fl_booking b ON b.pax_id = p.pax_id\nWHERE b.route_id = 'R01';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["An"],["David"]]}},{"id":"GK9.09","topic":"Q9 join, so cột","level":2,"prompt":"\u003cp>Mã và tên các hành khách đã có vé \u003cstrong>ít nhất một tuyến xuất phát từ nước khác\u003c/strong> quốc tịch của mình. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT DISTINCT p.pax_id, p.name\nFROM fl_passenger p\nJOIN fl_booking b ON b.pax_id = p.pax_id\nJOIN fl_route r   ON r.route_id = b.route_id\nJOIN fl_airport a ON a.code = r.origin\nWHERE a.country \u003c> p.country;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P05","Emi"],["P04","David"],["P06","Fah"]]}},{"id":"GK9.10","topic":"Q10 not exists","level":2,"prompt":"\u003cp>Mã và tên các hành khách \u003cstrong>chưa đặt vé nào\u003c/strong>. Kết quả: \u003ccode>pax_id, name\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT p.pax_id, p.name\nFROM fl_passenger p\nWHERE NOT EXISTS (SELECT 1 FROM fl_booking b WHERE b.pax_id = p.pax_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pax_id","name"],"rows":[["P07","Gia"],["P08","Hana"]]}},{"id":"GK9.11","topic":"Q11 not exists","level":2,"prompt":"\u003cp>Các tuyến \u003cstrong>chưa khai thác chuyến nào\u003c/strong> (không có dòng trong \u003ccode>fl_flight\u003c/code>). Kết quả: \u003ccode>route_id, origin, dest\u003c/code>.\u003c/p>","en":"","hint":"","solution":"SELECT r.route_id, r.origin, r.dest\nFROM fl_route r\nWHERE NOT EXISTS (SELECT 1 FROM fl_flight f WHERE f.route_id = r.route_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["route_id","origin","dest"],"rows":[["R08","SGN","PQC"],["R09","PQC","HAN"]]}},{"id":"GK9.1
