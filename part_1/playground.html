"dark","small","2"],["skirt","pastel","large","15"],["pants","white","medium","0"],["dress","white","medium","3"],["shirt","dark","small","2"],["shirt","dark","medium","6"],["dress","pastel",null,"10"],["pants","white",null,"5"],["pants","dark",null,"20"],["skirt","white",null,"10"],["shirt","pastel",null,"7"],["shirt","white",null,"28"],["dress","white",null,"5"],["pants","pastel",null,"2"],["skirt","pastel",null,"35"],["skirt","dark",null,"8"],["dress","dark",null,"20"],["shirt","dark",null,"14"],["dress",null,null,"35"],["shirt",null,null,"49"],["skirt",null,null,"53"],["pants",null,null,"27"]]}},{"id":"5.29","topic":"rollup + hierarchy","level":2,"prompt":"\u003cp>Kết hợp \u003ccode>sales\u003c/code> với \u003ccode>itemcategory\u003c/code>, dùng \u003cstrong>rollup(category, item_name)\u003c/strong> để có tổng theo từng item, từng category và tổng chung. Trả về category, item_name, total.\u003c/p>","en":"","hint":"","solution":"select category, itemcategory.item_name, sum(quantity) as total\nfrom sales, itemcategory\nwhere sales.item_name = itemcategory.item_name\ngroup by rollup(category, itemcategory.item_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["category","item_name","total"],"rows":[[null,null,"164"],["womenswear","skirt","53"],["womenswear","dress","35"],["menswear","pants","27"],["menswear","shirt","49"],["menswear",null,"76"],["womenswear",null,"88"]]}},{"id":"5.30","topic":"multiple rollups","level":3,"prompt":"\u003cp>\u003ccode>group by rollup(item_name), rollup(color, clothes_size)\u003c/code> sinh ra \u003cstrong>bao nhiêu dòng\u003c/strong> kết quả trên bảng sales? Viết truy vấn đếm (1 cột, 1 dòng).\u003c/p>","en":"","hint":"","solution":"select count(*)\nfrom (select item_name, color, clothes_size, sum(quantity)\n      from sales\n      group by rollup(item_name), rollup(color, clothes_size)) as t;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["65"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
async function produceTable(db, sql, check, fresh) {
  if (fresh) {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
  for (let i = start; i <= items.length - (k - acc.length); i++) yield* subsetsOfSize(items, k, i + 1, [...acc, items[i]]);
}

// Candidate keys by increasing size. Attributes that never appear on a right
// side belong to every key; attributes only on right sides belong to none.
function fdCandidateKeys(R, fds) {
  const onRight = new Set(fds.flatMap(f => minus(f.rhs, f.lhs)));
  const onLeft = new Set(fds.flatMap(f => f.lhs));
  const core = R.filter(a => !onRight.has(a));
  const optional = R.filter(a => onRight.has(a) && onLeft.has(a));
  const keys = [];
  for (let k = 0; k <= optional.length; k++) {
    for (const extra of subsetsOfSize(optional, k)) {
      const K = order(R, [...core, ...extra]);
      if (keys.some(key => subset(key, K))) continue;
      if (fdIsSuperkey(R, fds, K)) keys.push(K);
    }
  }
  return keys;
}

// Canonical cover with a log of every change (slides 7.48–7.50): merge equal
// left sides, then delete one extraneous attribute at a time (Exercise 7.15
// shows why deleting two at once is wrong) until nothing changes.
function fdCover(R, fds, letters) {
  const fa = xs => fdFormat(xs, letters);
  const ff = f => fdFormatFD(f, letters);
  let F = fds.map(f => ({ lhs: [...f.lhs], rhs: [...f.rhs] }));
  const log = [];
  const mergeLeft = () => {
    const merged = [];
    for (const f of F) {
      const g = merged.find(x => same(x.lhs, f.lhs));
      if (g) {
        log.push(`Hợp (union rule): ${ff(g)} và ${ff(f)} → ${ff({ lhs: g.lhs, rhs: union(R, g.rhs, f.rhs) })}`);
        g.rhs = union(R, g.rhs, f.rhs);
      } else merged.push({ lhs: [...f.lhs], rhs: [...f.rhs] });
    }
    F = merged;
  };
  const step = () => {
    for (let i = 0; i < F.length; i++) {
      const f = F[i];
      // Left side: A ∈ α is extraneous if (α − A)⁺ under F contains β.
      if (f.lhs.length > 1) {
        for (const A of f.lhs) {
          const rest = minus(f.lhs, [A]);
          if (subset(f.rhs, fdClosure(R, F, rest).result)) {
            log.push(`${A} thừa ở vế trái của ${ff(f)}: (${fa(rest)})⁺ dưới F chứa ${fa(f.rhs)} → thay bằng ${ff({ lhs: rest, rhs: f.rhs })}`);
            F[i] = { lhs: rest, rhs: f.rhs };
            return true;
          }
        }
      }
      // Right side: A ∈ β is extraneous if α⁺ under F' (A removed from β) contains A.
      for (const A of f.rhs) {
        const reduced = { lhs: f.lhs, rhs: minus(f.rhs, [A]) };
        const Fp = F.map((g, j) => (j === i ? reduced : g)).filter(g => g.rhs.length);
        if (fdClosure(R, Fp, f.lhs).result.includes(A)) {
          log.push(`${A} thừa ở vế phải của ${ff(f)}: (${fa(f.lhs)})⁺ dưới F' (đã bỏ ${A}) vẫn chứa ${A} → ${reduced.rhs.length ? ff(reduced) : 'xoá FD này'}`);
          F = Fp;
          return true;
        }
      }
    }
    return false;
  };
  do mergeLeft(); while (step());
  return { cover: F, log };
}

// A BCNF violation on schema Ri (using F⁺ restricted to Ri): a set α ⊆ Ri
// with α⁺ ∩ Ri ⊋ α and α⁺ ⊉ Ri. Small schemas only (exponential search).
function fdBcnfViolation(R, fds, Ri) {
  for (let k = 1; k < Ri.length; k++) {
    for (const alpha of subsetsOfSize(Ri, k)) {
      const cl = fdClosure(R, fds, alpha).result;
      const beta = minus(order(Ri, cl), alpha);
      if (beta.length && !subset(Ri, cl)) return { lhs: alpha, rhs: beta };
    }
  }
  return null;
}

// BCNF decomposition (slide 7.57): replace Ri by (Ri − β) and (α ∪ β).
function fdBcnfDecompose(R, fds) {
  let result = [order(R, R)];
  const steps = [];
  for (let guard = 0; guard < 50; guard++) {
    const idx = result.findIndex(Ri => fdBcnfViolation(R, fds, Ri));
    if (idx < 0) break;
    const Ri = result[idx];
    const v = fdBcnfViolation(R, fds, Ri);
    const r1 = union(R, v.lhs, v.rhs);
    const r2 = minus(Ri, v.rhs);
    steps.push({ schema: Ri, fd: v, r1, r2 });
    result.splice(idx, 1, r1, r2);
  }
  return { result, steps };
}

// 3NF test on the original schema: for each α → A (A ∉ α) in F, α is a
// superkey or A is prime (in some candidate key).
function fdThirdNFViolations(R, fds, keys) {
  const prime = new Set((keys || fdCandidateKeys(R, fds)).flat());
  const out = [];
  for (const f of fds) {
    if (fdIsSuperkey(R, fds, f.lhs)) continue;
    const bad = minus(f.rhs, f.lhs).filter(a => !prime.has(a));
    if (bad.length) out.push({ lhs: f.lhs, rhs: bad });
  }
  return out;
}

function fdBcnfViolations(R, fds) {
  return fds.filter(f => minus(f.rhs, f.lhs).length && !fdIsSuperkey(R, fds, f.lhs));
}

// 3NF synthesis (slide 7.63) from the canonical cover.
function fdThirdNFDecompose(R, fds, letters) {
  const { cover } = fdCover(R, fds, letters);
  const schemas = [];
  const steps = [];
  for (const f of cover) {
    const s = union(R, f.lhs, f.rhs);
    if (schemas.some(x => subset(s, x))) steps.push({ kind: 'skip', fd: f, schema: s });
    else { schemas.push(s); steps.push({ kind: 'add', fd: f, schema: s }); }
  }
  const keys = fdCandidateKeys(R, fds);
  if (!schemas.some(s => keys.some(k => subset(k, s)))) {
    schemas.push(keys[0]);
    steps.push({ kind: 'key', schema: keys[0] });
  }
  // Remove schemas contained in another one.
  const result = schemas.filter((s, i) => !schemas.some((t, j) => j !== i && subset(s, t) && (!same(s, t) || j < i)));
  schemas.filter(s => !result.includes(s)).forEach(s => steps.push({ kind: 'drop', schema: s }));
  return { cover, keys, result, steps };
}

// Lossless test for a binary decomposition: R1 ∩ R2 → R1 or R1 ∩ R2 → R2.
function fdLosslessBinary(R, fds, R1, R2) {
  const common = R1.filter(a => R2.includes(a));
  const cl = fdClosure(R, fds, common).result;
  return { common, closure: cl, lossless: subset(R1, cl) || subset(R2, cl) };
}

// General lossless test (chase / tableau) for any number of schemas.
function fdLosslessChase(R, fds, schemas) {
  const rows = schemas.map((S, i) => R.map(a => (S.includes(a) ? `a:${a}` : `b${i}:${a}`)));
  let changed = true;
  while (changed) {
    changed = false;
    for (const f of fds) {
      const li = f.lhs.map(a => R.indexOf(a));
      for (let x = 0; x < rows.length; x++) {
        for (let y = x + 1; y < rows.length; y++) {
          if (!li.every(i => rows[x][i] === rows[y][i])) continue;
          for (const a of f.rhs) {
            const i = R.indexOf(a);
            const u = rows[x][i], v = rows[y][i];
            if (u === v) continue;
            const keep = u.startsWith('a:') ? u : v.startsWith('a:') ? v : u < v ? u : v;
            const drop = keep === u ? v : u;
            for (const r of rows) for (let j = 0; j < r.length; j++) if (r[j] === drop) r[j] = keep;
            changed = true;
          }
        }
      }
    }
  }
  return rows.some(r => r.every(v => v.startsWith('a:')));
}

// Dependency preservation without computing F⁺ (slide 7.53).
function fdPreserved(R, fds, schemas, f) {
  let result = [...f.lhs];
  let changed = true;
  while (changed) {
    changed = false;
    for (const Ri of schemas) {
      const t = order(Ri, fdClosure(R, fds, result.filter(a => Ri.includes(a))).result);
      const next = union(R, result, t);
      if (next.length > result.length) { result = next; changed = true; }
    }
  }
  return subset(f.rhs, result);
}

function fdParseSchemas(text, letters, R) {
  return String(text).split(/[\n;|]+/).map(s => s.replace(/^\s*R\d*\s*=\s*/i, '').trim()).filter(Boolean)
    .map(s => order(R, [...new Set(fdParseAttrs(s, letters))]));
}

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-card__meta">${num(n)} dòng · ${num(table.fields.length)} cột</span></div>` : ''}

    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${Math.max(1, table.fields.length)}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu trên ${num(n)} dòng</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-callout lx-mono">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

// Title row: the h1, one grey line of context under it, then the lead or the finding.
function pageHead(title, ctx, lead, actions = '') {
  return `<div class="lx-head"><div class="lx-head__text">
    <h1 class="lx-h1">${title}</h1>${ctx ? `<p class="lx-ctx" style="margin:6px 0 0">${ctx}</p>` : ''}${lead || ''}</div>
    ${actions ? `<div class="lx-actions">${actions}</div>` : ''}</div>`;
}
const leadP = html => (html ? `<p class="lx-lead">${html}</p>` : '');

// ======================================================================
// Progress
// ======================================================================
const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const failed = ch.exercises.filter(ex => exStatus(ex.id) === 'fail').length;
  const tried = passed + failed;
  const essays = store.get('essay:' + ch.store, []).filter(i => i < ch.questions.length).length;
  return { passed, failed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null),
    needQuiz: HAS_QUIZ && ch.quiz.length > 0, essays, essayTotal: ch.questions.length };
}
const isDone = p => p.passed === p.total && (p.quiz || !p.needQuiz) && p.essays === p.essayTotal;
function exBadge(id) {
  const s = exStatus(id);
  if (s === 'pass') return '<span class="lx-badge lx-badge--success">Đã đúng</span>';
  if (s === 'fail') return '<span class="lx-badge lx-badge--warning">Chưa đúng</span>';
  return '<span class="lx-badge">Chưa làm</span>';
}
const dotClass = id => ({ pass: ' is-pass', fail: ' is-fail' })[exStatus(id)] || '';
const STATUS_WORD = { pass: 'đã đúng', fail: 'chưa đúng' };
function chapterBadge(p) {
  if (isDone(p)) return '<span class="lx-badge lx-badge--success">Hoàn thành</span>';
  if (p.tried || p.quiz || p.essays) return '<span class="lx-badge lx-badge--info">Đang học</span>';
  return '<span class="lx-badge">Chưa bắt đầu</span>';
}
// Every SQL exercise of a section as one cell: blue solved, amber outline not yet right.
function cellMap(ch) {
  return `<div class="lx-cellmap" role="list" aria-label="Bài SQL của ${esc(ch.label)}">${ch.exercises.map(ex =>
    `<a role="listitem" class="${dotClass(ex.id).trim()}" href="#/${ch.key}/ex/${ex.id}" title="Bài ${esc(ex.id)} · ${esc(ex.topic)}" aria-label="Bài ${esc(ex.id)}: ${STATUS_WORD[exStatus(ex.id)] || 'chưa làm'}"></a>`).join('')}</div>`;
}
const LEGEND = '<div class="lx-legend" aria-hidden="true"><span><i class="is-pass"></i>Đã đúng</span><span><i class="is-fail"></i>Chưa đúng</span><span><i></i>Chưa làm</span></div>';

// ======================================================================
// Sidebar: the book's parts, the exam reviews, then the tools
// ======================================================================
const nav = $('#nav');
const app = $('#app');
const menuBtn = $('#menuBtn');
const partSlug = p => p.slug || 'part_' + p.number;
const PART_SLUG = DATA.part.slug || decodeURIComponent(location.pathname.split('/').slice(-2)[0] || '') || partSlug(DATA.part);
const partGroup = p => p.group || (p.review ? 'exam' : /^part_\d+$/.test(partSlug(p)) ? 'book' : 'exam');
const partLabel = p => p.label || p.short || `Part ${p.number}`;
const partTitle = p => String(p.title || '').replace(/^Part \d+\s*[—-]\s*/, '');
const partKey = p => (partGroup(p) === 'book' ? `P${p.number}` : ({ midterm: 'GK', final: 'CK' })[partSlug(p)] || partLabel(p).slice(0, 3));
const navKey = c => c.navLabel.replace(/^Chương /, 'Ch ');
const isMine = v => v === PART_SLUG || (typeof v === 'number' && v === DATA.part.number);
// Same part: a hash route. Another part: its own playground page.
const partHref = (p, hash = '') => (partSlug(p) === PART_SLUG ? hash || '#/' : `../${partSlug(p)}/playground.html${hash}`);

function renderNav(path) {
  const here = (path.match(/^\/([\w-]+)\/(?:summary|quiz|questions|ex)/) || [])[1];
  const item = (href, html, on, cls = '', title = '') =>
    `<a class="lx-nav__item${cls}${on ? ' is-active' : ''}" href="${href}"${on ? ' aria-current="page"' : ''}${title ? ` title="${esc(title)}"` : ''}>${html}</a>`;
  const navPart = p => {
    const cur = partSlug(p) === PART_SLUG;
    const head = item(partHref(p), `<span class="lx-nav__k">${esc(partKey(p))}</span><span class="lx-nav__t">${esc(partTitle(p))}</span>`,
      cur && path === '/', ` is-part${cur ? ' is-current' : ''}`, `${partLabel(p)} — ${partTitle(p)}`);
    if (!cur) return head;
    return head + `<div class="lx-nav__sub">${DATA.chapters.map(c => {
      const pr = chapterProgress(c);
      return item(`#/${c.key}`, `<span class="lx-nav__k">${esc(navKey(c))}</span><span class="lx-nav__t">${esc(c.titleVi)}</span><span class="lx-nav__c">${pr.passed}/${pr.total}</span>`,
        here === c.key, '', `${c.label} — ${c.titleVi}`);
    }).join('')}</div>`;
  };
  const group = (label, list) => (list.length ? `<div class="lx-nav__group"><div class="lx-nav__label">${label}</div>${list.map(navPart).join('')}</div>` : '');
  const tools = [
    item('#/sandbox', `${icon('terminal')}<span class="lx-nav__t">SQL tự do</span>`, path === '/sandbox'),
    item('#/schema', `${icon('table')}<span class="lx-nav__t">Lược đồ cơ sở dữ liệu</span>`, path === '/schema'),
    DATA.part.fdTool ? item('#/fd', `${icon('key')}<span class="lx-nav__t">Phụ thuộc hàm (FD)</span>`, path === '/fd') : '',
    item('../index.html', `${icon('calendar')}<span class="lx-nav__t">Lịch học &amp; kế hoạch thi</span>`, false),
  ].join('');
  nav.innerHTML = group('Theo sách', DATA.parts.filter(p => partGroup(p) === 'book')) +
    group('Ôn thi', DATA.parts.filter(p => partGroup(p) === 'exam')) +
    `<div class="lx-nav__group"><div class="lx-nav__label">Công cụ</div>${tools}</div>`;
}

// Phone: the sidebar is a full-screen sheet behind the menu button.
function toggleNav(open) {
  app.classList.toggle('is-navopen', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu');
}
menuBtn.addEventListener('click', () => toggleNav(!app.classList.contains('is-navopen')));
nav.addEventListener('click', e => { if (e.target.closest('a')) toggleNav(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('is-navopen')) { toggleNav(false); menuBtn.focus(); } });

function renderContext(ch) {
  $('#mobileTitle').textContent = ch ? `${ch.navLabel} · ${ch.titleVi}` : `${partLabel(DATA.part)} · ${partTitle(DATA.part)}`;
}

// ======================================================================
// Views
// ======================================================================
const main = $('#main');

// The course's fifteen weeks; this part's weeks carry the blue line, exams are named.
function weekStrip() {
  const mine = DATA.schedule.filter(w => w.parts.some(isMine));
  const examOf = w => (w.exam === 'midterm' ? 'Thi giữa kỳ' : w.exam === 'final' ? 'Thi cuối kỳ' : '');
  return `<div class="lx-card">
    <div class="lx-card__head"><h2 class="lx-h2">Lịch 15 tuần</h2><span class="lx-card__meta">${esc(DATA.part.weeks || '')}${mine.length ? ` · ${mine.length} tuần dùng part này` : ''}</span></div>
    <div class="lx-weeks lx-weeks--thin" role="list">${DATA.schedule.map(w => `<div class="lx-week${w.parts.some(isMine) ? ' is-on' : ''}" role="listitem" title="Tuần ${w.week}: ${esc(w.content)}${w.note ? ` — ${esc(w.note)}` : ''}">
        <span class="lx-week__n">T${w.week}</span>${examOf(w) ? `<span class="lx-week__exam">${examOf(w)}</span>` : ''}</div>`).join('')}</div>
    ${mine.length ? `<ul class="lx-weeklist">${mine.map(w => `<li><span class="n">Tuần ${w.week}</span><span>${esc(examOf(w) || w.content)}</span><span class="lx-subtle">${esc(w.note || '')}</span></li>`).join('')}</ul>`
      : '<p class="lx-subtle" style="margin:0;padding:0 20px 20px">Part này học ngoài lịch 15 tuần.</p>'}</div>`;
}

function viewHome() {
  const progress = DATA.chapters.map(chapterProgress);
  const sum = k => progress.reduce((n, p) => n + p[k], 0);
  const passed = sum('passed'), failed = sum('failed'), essays = sum('essays'), essayTotal = sum('essayTotal');
  const quizChapters = DATA.chapters.filter((ch, i) => progress[i].quiz);
  const quizPct = quizChapters.length
    ? (100 * quizChapters.reduce((n, ch) => n + progress[DATA.chapters.indexOf(ch)].quiz.best, 0) / quizChapters.reduce((n, ch) => n + ch.quiz.length, 0)).toFixed(1)
    : null;
  // Continue where the student left off: the first section not finished yet.
  const nextI = progress.findIndex(p => !isDone(p));
  const next = DATA.chapters[nextI < 0 ? 0 : nextI];
  const started = progress.some(p => p.tried || p.quiz || p.essays);
  const doneCount = progress.filter(isDone).length;
  const pct = (a, b) => (b ? (100 * a / b).toFixed(1) : 0);
  const unit = esc(DATA.part.unit.toLowerCase());
  const failCh = DATA.chapters.find((ch, i) => progress[i].failed);
  const firstFail = failCh && failCh.exercises.find(ex => exStatus(ex.id) === 'fail');
  const find = nextI < 0
    ? `Đã hoàn thành cả ${num(DATA.chapters.length)} ${unit}. Đọc lại phần ghi nhớ trước khi thi.`
    : failed
      ? `${num(failed)} bài SQL đã kiểm tra nhưng chưa đúng. Bài đầu tiên cần làm lại: <a href="#/${failCh.key}/ex/${firstFail.id}">${esc(firstFail.id)}</a>.`
      : started
        ? `Đã đúng ${num(passed)}/${num(TOTAL_EXERCISES)} bài SQL. Tiếp theo là ${esc(next.label)}: ${esc(next.titleVi)}.`
        : `Chưa bắt đầu. Mở ${esc(next.label)} và làm theo thứ tự: ${stepsOf(next).map(s => s.label.toLowerCase()).join(', ')}.`;
  const third = HAS_QUIZ
    ? `<div class="lx-kpi"><div class="lx-kpi__k">Trắc nghiệm đúng</div><div class="lx-kpi__v">${quizPct === null ? '<span class="lx-dash">–</span>' : `${quizPct}<span class="lx-kpi__u">%</span>`}</div>
        <div class="lx-kpi__n">${quizPct === null ? `Chưa làm ${unit} nào` : `${quizChapters.length}/${DATA.chapters.length} ${unit} đã làm, điểm cao nhất`}</div></div>`
    : `<div class="lx-kpi"><div class="lx-kpi__k">${esc(DATA.part.unit)} hoàn thành</div><div class="lx-kpi__v">${doneCount}<span class="lx-kpi__u"> /${DATA.chapters.length}</span></div>
        <div class="lx-kpi__n">Đúng hết bài SQL và tự chấm hết tự luận</div></div>`;
  main.innerHTML = pageHead(esc(partTitle(DATA.part)),
      `${esc(partLabel(DATA.part))}${DATA.part.weeks ? ` · ${esc(DATA.part.weeks)}` : ''} · ${num(DATA.chapters.length)} ${unit} · ${num(TOTAL_EXERCISES)} bài SQL · ${num(essayTotal)} câu tự luận`,
      `<p class="lx-find">${find}</p>`,
      `<a class="lx-btn lx-btn--primary" href="#/${next.key}">${started ? 'Tiếp tục' : 'Bắt đầu'} ${esc(next.label)} ${icon('open')}</a>`) + `
    <div class="lx-card lx-kpis">
      <div class="lx-kpi lx-kpi--lead"><div class="lx-kpi__k">Bài SQL đã đúng</div><div class="lx-kpi__v">${passed}<span class="lx-kpi__u"> /${TOTAL_EXERCISES}</span></div>
        <div class="lx-meter" role="img" aria-label="${pct(passed, TOTAL_EXERCISES)}%"><i style="width:${pct(passed, TOTAL_EXERCISES)}%"></i></div></div>
      <div class="lx-kpi"><div class="lx-kpi__k">Bài chưa đúng</div><div class="lx-kpi__v">${failed}</div>
        <div class="lx-kpi__n">${failed ? 'Đã kiểm tra, kết quả chưa khớp đáp án' : 'Không có bài nào đang sai'}</div></div>
      <div class="lx-kpi"><div class="lx-kpi__k">Tự luận đã tự chấm</div><div class="lx-kpi__v">${essays}<span class="lx-kpi__u"> /${essayTotal}</span></div>
        <div class="lx-kpi__n">Viết ra giấy, so với gợi ý, rồi đánh dấu</div></div>
      ${third}
    </div>
    <div class="lx-card">
      <div class="lx-card__head"><h2 class="lx-h2">Bản đồ bài tập</h2>${LEGEND}</div>
      <div class="lx-map">
        <div class="lx-row lx-row--head" aria-hidden="true"><span></span><span>${esc(DATA.part.unit)}</span><span>Mỗi ô là một bài SQL</span><span class="r">SQL</span><span class="r lx-row__ess">Tự luận</span><span>Trạng thái</span><span></span></div>
        ${DATA.chapters.map((ch, i) => {
          const p = progress[i];
          return `<div class="lx-row">
            <span class="lx-row__k">${esc(navKey(ch))}</span>
            <div class="lx-row__t"><a href="#/${ch.key}">${esc(ch.titleVi)}</a><div class="lx-row__sub">${esc(ch.title)}${ch.source ? ` · ${esc(ch.source)}` : ''}${p.quiz ? ` · trắc nghiệm ${p.quiz.best}/${ch.quiz.length}` : ''}</div></div>
            ${cellMap(ch)}
            <span class="r">${p.passed}<small>/${p.total}</small></span>
            <span class="r lx-row__ess">${p.essays}<small>/${p.essayTotal}</small></span>
            <span class="lx-row__st">${chapterBadge(p)}</span>
            <a class="lx-iconbtn lx-row__go" href="#/${ch.key}" data-tip="Mở ${esc(ch.label)}" aria-label="Mở ${esc(ch.label)}">${icon('open')}</a>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${weekStrip()}
    <div class="lx-card">
      <div class="lx-card__head"><h2 class="lx-h2">Cách dùng</h2><button class="lx-btn lx-btn--ghost" id="resetProgress">${icon('reset')} Xoá tiến độ part này</button></div>
      <div class="lx-card__body lx-howto">
        <dl class="lx-keys">
          <dt><kbd>Ctrl</kbd> + <kbd>Enter</kbd></dt><dd>Chạy câu SQL trong ô trả lời</dd>
          <dt><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd></dt><dd>Kiểm tra với đáp án và lưu kết quả</dd>
          <dt><kbd>Tab</kbd></dt><dd>Thụt lề hai dấu cách trong ô trả lời</dd>
        </dl>
        <ul class="lx-prose">
          <li>Mỗi ${unit} có ${PART_STEPS.length} bước: ${PART_STEPS.map(s => s.label.toLowerCase()).join(', ')}.</li>
          <li>Tự luận: viết ra giấy như trong phòng thi, mở gợi ý để so, rồi đánh dấu “Đã tự chấm”.</li>
          <li>Bài tập chạy trong một transaction rồi <code>rollback</code>, dữ liệu gốc không đổi. Muốn giữ thay đổi, dùng SQL tự do.</li>
          <li>Tiến độ và code được lưu riêng cho từng part, trong trình duyệt này.</li>
        </ul>
      </div>
    </div>`;
  $('#resetProgress').addEventListener('click', () => {
    if (!confirm(`Xoá toàn bộ tiến độ và code của ${partLabel(DATA.part)} đã lưu trong trình duyệt?`)) return;
    try { Object.keys(localStorage).filter(k => k.startsWith(STORE_PREFIX)).forEach(k => localStorage.removeItem(k)); } catch { /* ignore */ }
    route();
  });
}

function flowNav(ch, stepKey) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === stepKey);
  const href = s => stepHref(ch, s.key);
  const prev = steps[i - 1], next = steps[i + 1];
  const count = { quiz: ch.quiz.length, questions: ch.questions.length, ex: ch.exercises.length };
  const arrow = (s, dir) => `<a class="lx-iconbtn${s ? '' : ' is-off'}" ${s ? `href="${href(s)}"` : 'aria-disabled="true"'} data-tip="${s ? `${dir}: ${s.label}` : (dir === 'Bước trước' ? 'Đây là bước đầu' : 'Đây là bước cuối')}" aria-label="${s ? `${dir}: ${s.label}` : dir}">${icon(dir === 'Bước trước' ? 'back' : 'open')}</a>`;
  return `<nav class="lx-flow" aria-label="Các bước học ${esc(ch.label)}">
    <ol class="lx-flow__steps">${steps.map((s, j) => `<li><a class="lx-tab${j === i ? ' is-active' : ''}" href="${href(s)}"${j === i ? ' aria-current="step"' : ''}>${s.label}${count[s.key] ? `<span class="n">${count[s.key]}</span>` : ''}</a></li>`).join('')}</ol>
    <div class="lx-flow__arrows">${arrow(prev, 'Bước trước')}${arrow(next, 'Bước sau')}</div>
  </nav>`;
}

function chapterPage(ch, step, lead) {
  const p = chapterProgress(ch);
  return pageHead(esc(ch.titleVi), `${esc(ch.label)} · ${esc(ch.title)} · ${num(p.passed)}/${num(p.total)} bài SQL đúng · ${num(p.essays)}/${num(p.essayTotal)} tự luận đã chấm`, leadP(lead)) + flowNav(ch, step);
}

// Footer link to the step after `key`, or back to the first step at the end.
function nextStepFoot(ch, key) {
  const steps = stepsOf(ch);
  const i = steps.findIndex(s => s.key === key);
  const next = steps[i + 1];
  const count = { quiz: `${ch.quiz.length} câu trắc nghiệm`, questions: `${ch.questions.length} câu tự luận`, ex: `${ch.exercises.length} bài SQL`, summary: 'phần ghi nhớ' };
  return next
    ? `<div class="lx-card__foot"><span>Tiếp theo: ${count[next.key]}</span><a class="lx-btn lx-btn--primary" href="${stepHref(ch, next.key)}">${esc(next.label)} ${icon('open')}</a></div>`
    : `<div class="lx-card__foot"><span>Đây là bước cuối của ${esc(ch.label)}</span><a class="lx-btn" href="${stepHref(ch, steps[0].key)}">Về ${esc(steps[0].label.toLowerCase())}</a></div>`;
}

// A side column that follows the reader: an outline, a score, a checklist.
const split = (mainHtml, asideHtml) => `<div class="lx-split"><div class="lx-stack">${mainHtml}</div><aside class="lx-aside">${asideHtml}</aside></div>`;

function viewSummary(ch) {
  const label = PART_STEPS.find(s => s.key === 'summary').label;
  main.innerHTML = chapterPage(ch, 'summary', stepsOf(ch)[0].key === 'summary' ? 'Đọc kỹ phần này trước khi làm bài.' : 'Tra cứu nhanh kiến thức và các bẫy hay gặp. Đọc lại trước khi thi.') +
    split(`<div class="lx-card"><div class="lx-card__body lx-prose lx-read" id="summaryBody">${ch.summary}</div>${nextStepFoot(ch, 'summary')}</div>`,
      `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${esc(label)}</h2></div><ol class="lx-toc" id="toc"></ol></div>`);
  const heads = [...main.querySelectorAll('#summaryBody h3')];
  $('#toc').innerHTML = heads.length
    ? heads.map((h, i) => `<li><button type="button" data-h="${i}">${esc(h.textContent)}</button></li>`).join('')
    : '<li class="lx-subtle">Một mục duy nhất</li>';
  $('#toc').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) heads[+b.dataset.h].scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' }); });
}

function viewQuiz(ch) {
  const saved = store.get('quiz:' + ch.store, null);
  main.innerHTML = chapterPage(ch, 'quiz', `${ch.quiz.length} câu, mỗi câu một đáp án đúng.`) + `<form id="quiz">` +
    split(ch.quiz.map((q, i) => `
      <fieldset class="lx-card" data-i="${i}" style="margin:0;padding:0">
        <div class="lx-qhead"><legend class="lx-qno" style="float:left;padding:0">Câu ${i + 1}</legend><span class="lx-q__state"></span></div>
        <div class="lx-card__body lx-prose">
          <div>${q.q}</div>
          <div class="lx-q__opts">${q.options.map((o, j) => `

      `<div class="lx-card">
        <div class="lx-card__head"><h2 class="lx-h2">Bài làm</h2><span class="lx-card__meta">Cao nhất ${saved ? `${num(saved.best)}/${num(ch.quiz.length)}` : '–'}</span></div>
        <div class="lx-card__body">
          <div class="lx-kpi__v"><span id="answered">0</span><span class="lx-kpi__u"> /${ch.quiz.length} đã chọn</span></div>
          <div class="lx-meter" aria-hidden="true"><i id="answeredBar" style="width:0"></i></div>
          <div class="lx-qgrid" id="quizGrid">${ch.quiz.map((q, i) => `<button type="button" class="lx-qcell" data-go="${i}" aria-label="Câu ${i + 1}">${i + 1}</button>`).join('')}</div>
          <p id="score" role="status" class="lx-aside__note">Chọn đáp án cho từng câu rồi nộp bài.</p>
        </div>
        <div class="lx-card__foot"><button class="lx-btn" type="button" id="retry">${icon('reset')} Làm lại</button><button class="lx-btn lx-btn--primary" type="submit">${icon('check')} Nộp bài</button></div>
      </div>`) + `</form>`;
  const form = $('#quiz');
  form.addEventListener('change', () => {
    const n = form.querySelectorAll('input[type=radio]:checked').length;
    $('#answered').textContent = n;
    $('#answeredBar').style.width = `${(100 * n / ch.quiz.length).toFixed(1)}%`;
    ch.quiz.forEach((q, i) => $(`#quizGrid [data-go="${i}"]`).classList.toggle('is-picked', !!form.querySelector(`input[name="q${i}"]:checked`)));
  });
  $('#quizGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) form.querySelector(`[data-i="${b.dataset.go}"]`).scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    ch.quiz.forEach((q, i) => {
      const box = form.querySelector(`[data-i="${i}"]`);
      const picked = form.querySelector(`input[name="q${i}"]:checked`);
      const ok = picked && Number(picked.value) === q.answer;
      box.querySelectorAll('.lx-opt').forEach((l, j) => {
        l.classList.toggle('is-right', j === q.answer);
        l.classList.toggle('is-wrong', !!picked && Number(picked.value) === j && j !== q.answer);
      });
      if (ok) score++;
      const qc = $(`#quizGrid [data-go="${i}"]`);
      qc.classList.remove('is-picked'); qc.classList.toggle('is-pass', !!ok); qc.classList.toggle('is-fail', !ok);
      qc.setAttribute('aria-label', `Câu ${i + 1}: ${ok ? 'đúng' : picked ? 'sai' : 'bỏ trống'}`);
      box.querySelector('.lx-q__state').innerHTML = ok
        ? '<span class="lx-badge lx-badge--success">Đúng</span>'
        : picked ? '<span class="lx-badge lx-badge--danger">Sai</span>' : '<span class="lx-badge">Bỏ trống</span>';
      const ex = box.querySelector('.lx-q__explain');
      ex.hidden = false;
      ex.innerHTML = `<strong>Đáp án ${'ABCD'[q.answer]}.</strong> ${q.explain}`;
    });
    const best = Math.max(score, saved?.best ?? 0);
    store.set('quiz:' + ch.store, { best, last: score });
    $('#score').innerHTML = `Kết quả: <strong class="n">${score}/${ch.quiz.length}</strong> (${(100 * score / ch.quiz.length).toFixed(1)}%). Điểm cao nhất: <span class="n">${best}/${ch.quiz.length}</span>.`;
    renderContext(ch);
  });
  $('#retry').addEventListener('click', () => viewQuiz(ch));
}

function fdReport(input) {
  const { R, fds, letters, errors } = fdParse(input.R, input.F);
  if (!R.length) return callout('warning', 'Nhập lược đồ R trước.');
  if (errors.length) return callout('danger', errors.map(esc).join('<br>'));
  const A = xs => `<span class="lx-mono">${esc(fdFormat(xs, letters))}</span>`;
  const FD = f => `<span class="lx-mono">${esc(fdFormatFD(f, letters))}</span>`;
  const card = (title, body, tag = '') => `<div class="lx-card"><div class="lx-card__head"><h2 class="lx-h2">${title}</h2>${tag}</div><div class="lx-card__body lx-prose">${body}</div></div>`;
  const ok = (yes, a, b) => `<span class="lx-badge lx-badge--${yes ? 'success' : 'warning'}">${yes ? a : b}</span>`;
  const out = [];

  const alpha = fdParseAttrs(input.alpha || '', letters).filter(a => R.includes(a));
  if (alpha.length) {
    const c = fdClosure(R, fds, alpha);
    out.push(card(`Bao đóng (${esc(fdFormat(alpha, letters))})⁺`, `<ol><li>result := ${A(alpha)}</li>${c.steps.map(s => `<li>Dùng ${FD(s.fd)}: thêm ${A(s.added)} → result = ${A(s.result)}</li>`).join('')}</ol>
      <p>Kết quả: (${A(alpha)})⁺ = ${A(c.result)}. ${c.result.length === R.length ? `${A(alpha)} là <strong>superkey</strong>.` : `Không phải superkey (thiếu ${A(R.filter(a => !c.result.includes(a)))}).`}</p>`));
  }

  const keys = fdCandidateKeys(R, fds);
  const prime = R.filter(a => keys.some(k => k.includes(a)));
  const bcnfBad = fdBcnfViolations(R, fds);
  const nf3Bad = fdThirdNFViolations(R, fds, keys);
  out.push(card('Khoá và dạng chuẩn của R', `<p>Candidate key: ${keys.map(A).join(', ')}.</p>
    <p>Thuộc tính khoá (prime): ${A(prime)}${prime.length < R.length ? `; không khoá: ${A(R.filter(a => !prime.includes(a)))}` : ''}.</p>
    <p>BCNF ${ok(!bcnfBad.length, 'Đạt', 'Không đạt')} ${bcnfBad.length ? `— vi phạm (vế trái không phải superkey): ${bcnfBad.map(FD).join(', ')}` : '— mọi FD không tầm thường trong F có vế trái là superkey.'}</p>
    <p>3NF ${ok(!nf3Bad.length, 'Đạt', 'Không đạt')} ${nf3Bad.length ? `— vi phạm (vế trái không phải superkey và vế phải có thuộc tính không khoá): ${nf3Bad.map(FD).join(', ')}` : '— mỗi FD có vế trái là superkey hoặc vế phải chỉ gồm thuộc tính khoá.'}</p>
    <p class="lx-subtle">Kiểm tra trên F đã cho là đủ cho lược đồ R ban đầu (slide 7.55, 7.62).</p>`));

  const cc = fdCover(R, fds, letters);
  out.push(card('Canonical cover F<sub>c</sub>', `${cc.log.length ? `<ol>${cc.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '<p>Không có vế trái trùng nhau và không có thuộc tính thừa: F<sub>c</sub> = F.</p>'}
    <p>F<sub>c</sub> = { ${cc.cover.map(FD).join('; ')} }</p><p class="lx-subtle">Canonical cover có thể không duy nhất (PE 7.14): thứ tự xét thuộc tính khác có thể cho kết quả khác nhưng tương đương.</p>`));

  const b = fdBcnfDecompose(R, fds);
  out.push(card('Phân rã BCNF', b.steps.length ? `<ol>${b.steps.map(s => `<li>${A(s.schema)} vi phạm BCNF do ${FD(s.fd)} (${A(s.fd.lhs)} không phải superkey của ${A(s.schema)}) → tách thành ${A(s.r1)} và ${A(s.r2)}</li>`).join('')}</ol>
    <p>Kết quả: ${b.result.map(x => `(${A(x)})`).join(', ')}</p>` : '<p>R đã ở BCNF, không cần tách.</p>',
    ok(b.result.length === 1 || fds.every(f => fdPreserved(R, fds, b.result, f)), 'Bảo toàn FD', 'Mất FD')));

  const t = fdThirdNFDecompose(R, fds, letters);
  const stepText = s => s.kind === 'add' ? `Từ ${FD(s.fd)} tạo lược đồ ${A(s.schema)}`
    : s.kind === 'skip' ? `${FD(s.fd)}: ${A(s.schema)} đã nằm trong một lược đồ có sẵn, bỏ qua`
    : s.kind === 'key' ? `Không lược đồ nào chứa candidate key → thêm ${A(s.schema)}`
    : `Bỏ ${A(s.schema)} vì nằm trọn trong lược đồ khác`;
  out.push(card('Phân rã 3NF (thuật toán tổng hợp)', `<ol>${t.steps.map(s => `<li>${stepText(s)}</li>`).join('')}</ol><p>Kết quả: ${t.result.map(x => `(${A(x)})`).join(', ')}</p>`,
    ok(true, 'Lossless + bảo toàn FD', '')));

  const schemas = fdParseSchemas(input.decomp || '', letters, R);
  if (schemas.length >= 2) {
    const covered = R.every(a => schemas.some(S => S.includes(a)));
    const lossless = fdLosslessChase(R, fds, schemas);
    let body = covered ? '' : callout('warning', `Phân rã chưa phủ hết R (thiếu ${A(R.filter(a => !schemas.some(S => S.includes(a))))}).`);
    body += `<p>Các lược đồ: ${schemas.map((S, i) => `R<sub>${i + 1}</sub> = (${A(S)})`).join(', ')}</p>`;
    if (schemas.length === 2) {
      const l = fdLosslessBinary(R, fds, schemas[0], schemas[1]);
      body += `<p>R<sub>1</sub> ∩ R<sub>2</sub> = ${A(l.common)}; (${A(l.common)})⁺ = ${A(l.closure)} → ${l.lossless ? 'chứa R<sub>1</sub> hoặc R<sub>2</sub>, nên <strong>lossless</strong>' : 'không chứa R<sub>1</sub> lẫn R<sub>2</sub>, nên <strong>lossy</strong>'}.</p>`;
    } else {
      body += `<p>Kiểm tra lossless bằng bảng chase: <strong>${lossless ? 'lossless' : 'lossy'}</strong>.</p>`;
    }
    body += `<p>Bảo toàn phụ thuộc (thuật toán slide 7.53):</p><ul>${fds.map(f => `<li>${FD(f)}: ${fdPreserved(R, fds, schemas, f) ? 'được bảo toàn' : '<strong>không</strong> được bảo toàn'}</li>`).join('')}</ul>
      <p>Dạng chuẩn từng lược đồ: ${schemas.map((S, i) => { const v = fdBcnfViolation(R, fds, S); return `R<sub>${i + 1}</sub> ${v ? `không BCNF (${FD(v)})` : 'BCNF'}`; }).join('; ')}.</p>`;
    out.push(card('Kiểm tra phân rã', body, ok(lossless, 'Lossless', 'Lossy')));
  }
  return out.join('');
}

function viewFd(params) {
  const saved = store.get('fd:input', null);
  const preset = FD_PRESETS[Number(params.get('preset'))];
  const input = preset || saved || FD_PRESETS[0];
  main.innerHTML = pageHead('Phụ thuộc hàm (FD)', `Công cụ · Chương 7 · ${num(FD_PRESETS.length)} ví dụ có sẵn`,
    leadP('Bao đóng thuộc tính, candidate key, canonical cover, kiểm tra BCNF/3NF, phân rã BCNF và 3NF, lossless và bảo toàn phụ thuộc. Hãy làm tay trước, rồi dùng công cụ để đối chiếu từng bước.')) + `
    <div class="lx-fdgrid">
    <div class="lx-card lx-fdin"><div class="lx-card__head"><h2 class="lx-h2">Đầu vào</h2>
      <select class="lx-select" id="fdPreset" aria-label="Ví dụ có sẵn"><option value="">Ví dụ có sẵn…</option>${FD_PRESETS.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="lx-card__body lx-fd-form">
        <label>Lược đồ R <span class="lx-subtle">Viết liền nếu mỗi thuộc tính là một chữ cái (ABCDE), hoặc phân cách bằng dấu phẩy</span>
          <span class="lx-field"><input class="lx-editor" id="fdR" spellcheck="false" value="${esc(input.R)}"></span></label>
        <label>Tập phụ thuộc hàm F <span class="lx-subtle">Mỗi dòng một FD, dạng <code class="lx-code">A -> BC</code> hoặc <code class="lx-code">ID, x -> name</code></span>
          <span class="lx-field"><textarea class="lx-editor" id="fdF" spellcheck="false" style="min-height:132px">${esc(input.F)}</textarea></span></label>
        <label>Tính bao đóng của α <span class="lx-subtle">Tuỳ chọn</span><span class="lx-field"><input class="lx-editor" id="fdAlpha" spellcheck="false" value="${esc(input.alpha || '')}"></span></label>
        <label>Kiểm tra một phân rã <span class="lx-subtle">Tuỳ chọn, mỗi dòng một lược đồ</span><span class="lx-field"><textarea class="lx-editor" id="fdDecomp" spellcheck="false" style="min-height:76px">${esc(input.decomp || '')}</textarea></span></label>
      </div>
      <div class="lx-card__foot"><span>Kết quả cập nhật khi bạn gõ</span><button class="lx-btn lx-btn--primary" id="fdRun" type="button">${icon('play')} Phân tích</button></div></div>
    <div class="lx-stack" id="fdOut" aria-live="polite"></div></div>`;
  const read = () => ({ R: $('#fdR').value, F: $('#fdF').value, alpha: $('#fdAlpha').value, decomp: $('#fdDecomp').value });
  const render = () => {
    const value = read();
    store.set('fd:input', value);
    try { $('#fdOut').innerHTML = fdReport(value); }
    catch (e) { $('#fdOut').innerHTML = callout('danger', esc(e.message)); }
  };
  let timer = null;
  ['#fdR', '#fdF', '#fdAlpha', '#fdDecomp'].forEach(sel => $(sel).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); }));
  $('#fdRun').addEventListener('click', render);
  $('#fdPreset').addEventListener('change', e => {
    const p = FD_PRESETS[Number(e.target.value)];
    if (!p || e.target.value === '') return;
    $('#fdR').value = p.R; $('#fdF').value = p.F; $('#fdAlpha').value = p.alpha || ''; $('#fdDecomp').value = p.decomp || '';
    render();
  });
  render();
}

// Tab inserts spaces; Ctrl+Enter runs; Ctrl+Shift+Enter checks.
function bindEditorKeys(editor, onRun, onCheck) {
  editor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey && onCheck) onCheck(); else onRun();
    } else if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: t } = editor;
      editor.setRangeText('  ', s, t, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  });
}

// ======================================================================
// Router
// ======================================================================
function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, query] = hash.split('?');
  renderNav(path);
  const bare = path.match(/^\/([\w-]+)$/);
  const bareCh = bare && DATA.chapters.find(c => c.key === bare[1]);
  if (bareCh) { location.replace(stepHref(bareCh, stepsOf(bareCh)[0].key)); return; }
  const m = path.match(/^\/([\w-]+)\/(summary|quiz|questions|ex)(?:\/([\w.-]+))?$/);
  const ch = m && DATA.chapters.find(c => c.key === m[1]);
  if (ch && !stepsOf(ch).some(s => s.key === m[2])) { location.replace(stepHref(ch, stepsOf(ch)[0].key)); return; }
  if (ch) {
    renderContext(ch);
    ({ summary: viewSummary, quiz: viewQuiz, questions: viewQuestions, ex: c => viewExercise(c, m[3]) })[m[2]](ch);
  } else if (path === '/sandbox') {
    renderContext(null);
    const table = new URLSearchParams(query || '').get('table');
    viewSandbox(table ? `select * from ${table};` : undefined);
  } else if (path === '/schema') {
    renderContext(null);
    viewSchema();
  } else if (path === '/fd' && DATA.part.fdTool) {
    renderContext(null);
    viewFd(new URLSearchParams(query || ''));
  } else {
    renderContext(null);
    viewHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
getShared().catch(err => console.error(err));
</script>
