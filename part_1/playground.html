:numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-01-07 11:00', 1000),\n  ('A-215', '2018-01-30 08:20', -400),\n  ('A-215', '2018-03-02 13:10', 250);\n"],"setupFiles":["lab/db/university_schema.sql","lab/db/university_data.sql","lab/db/extra_tables.sql"],"schemaGroups":[{"title":"University database (theo sách)","note":"","core":true,"tables":[{"table":"classroom","columns":[{"column":"building","type":"character varying(15)","pk":true},{"column":"room_number","type":"character varying(7)","pk":true},{"column":"capacity","type":"numeric(4,0)","pk":false}]},{"table":"department","columns":[{"column":"dept_name","type":"character varying(20)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"budget","type":"numeric(12,2)","pk":false}]},{"table":"course","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"title","type":"character varying(50)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"credits","type":"numeric(2,0)","pk":false}]},{"table":"instructor","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"name","type":"character varying(20)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"salary","type":"numeric(8,2)","pk":false}]},{"table":"section","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"sec_id","type":"character varying(8)","pk":true},{"column":"semester","type":"character varying(6)","pk":true},{"column":"year","type":"numeric(4,0)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"room_number","type":"character varying(7)","pk":false},{"column":"time_slot_id","type":"character varying(4)","pk":false}]},{"table":"teaches","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"course_id","type":"character varying(8)","pk":true},{"column":"sec_id","type":"character varying(8)","pk":true},{"column":"semester","type":"character varying(6)","pk":true},{"column":"year","type":"numeric(4,0)","pk":true}]},{"table":"student","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"name","type":"character varying(20)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"tot_cred","type":"numeric(3,0)","pk":false}]},{"table":"takes","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"course_id","type":"character varying(8)","pk":true},{"column":"sec_id","type":"character varying(8)","pk":true},{"column":"semester","type":"character varying(6)","pk":true},{"column":"year","type":"numeric(4,0)","pk":true},{"column":"grade","type":"character varying(2)","pk":false}]},{"table":"advisor","columns":[{"column":"s_id","type":"character varying(5)","pk":true},{"column":"i_id","type":"character varying(5)","pk":false}]},{"table":"time_slot","columns":[{"column":"time_slot_id","type":"character varying(4)","pk":true},{"column":"day","type":"character varying(1)","pk":true},{"column":"start_hr","type":"numeric(2,0)","pk":true},{"column":"start_min","type":"numeric(2,0)","pk":true},{"column":"end_hr","type":"numeric(2,0)","pk":false},{"column":"end_min","type":"numeric(2,0)","pk":false}]},{"table":"prereq","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"prereq_id","type":"character varying(8)","pk":true}]}]},{"title":"Bảng phụ cho bài tập chương 3–5","note":"","core":false,"tables":[{"table":"account_txn","columns":[{"column":"account_number","type":"character varying(10)","pk":true},{"column":"date_time","type":"timestamp without time zone","pk":true},{"column":"value","type":"numeric(10,2)","pk":false}]},{"table":"daily_sales","columns":[{"column":"sale_date","type":"date","pk":true},{"column":"value","type":"numeric(8,2)","pk":false}]},{"table":"dept_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]},{"table":"emp_super","columns":[{"column":"person","type":"character varying(20)","pk":true},{"column":"supervisor","type":"character varying(20)","pk":false}]},{"table":"grade_points","columns":[{"column":"grade","type":"character varying(2)","pk":true},{"column":"points","type":"numeric(2,1)","pk":false}]},{"table":"itemcategory","columns":[{"column":"item_name","type":"character varying(10)","pk":true},{"column":"category","type":"character varying(15)","pk":false}]},{"table":"sales","columns":[{"column":"item_name","type":"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"ch1","store":"1","short":"1","label":"Chương 1","navLabel":"Chương 1","kind":"Chương","title":"Introduction","titleVi":"Giới thiệu về hệ cơ sở dữ liệu","summary":"\u003ch3>1. Vì sao cần DBMS thay vì file system?\u003c/h3>\n\u003cp>Các vấn đề khi lưu dữ liệu trực tiếp trên file:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Vấn đề\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Data redundancy & inconsistency\u003c/td>\u003ctd>Cùng dữ liệu lưu ở nhiều file, sửa chỗ này quên chỗ kia\u003c/td>\u003ctd>Địa chỉ sinh viên ở cả file Đào tạo và file Học phí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Difficulty in accessing data\u003c/td>\u003ctd>Mỗi yêu cầu mới phải viết chương trình mới\u003c/td>\u003ctd>\"Liệt kê SV có > 60 tín chỉ\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data isolation\u003c/td>\u003ctd>Dữ liệu nằm rải rác nhiều file, nhiều định dạng\u003c/td>\u003ctd>CSV, Excel, text…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity problems\u003c/td>\u003ctd>Ràng buộc bị \"chôn\" trong code, khó thêm/sửa\u003c/td>\u003ctd>\u003ccode>balance &gt; 0\u003c/code> viết trong 10 chương trình\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atomicity of updates\u003c/td>\u003ctd>Lỗi giữa chừng để lại trạng thái dở dang\u003c/td>\u003ctd>Chuyển tiền: đã trừ A nhưng chưa cộng B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concurrent access anomalies\u003c/td>\u003ctd>Nhiều người cùng cập nhật gây sai lệch\u003c/td>\u003ctd>Hai người cùng rút 50 từ tài khoản 100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security problems\u003c/td>\u003ctd>Khó cấp quyền cho một phần dữ liệu\u003c/td>\u003ctd>Nhân viên chỉ được xem lương phòng mình\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>2. Data models\u003c/h3>\n\u003cp>Tập công cụ mô tả \u003cstrong>data, relationships, semantics, constraints\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Relational model\u003c/strong> (Ted Codd, Turing Award 1981) — dữ liệu ở dạng bảng.\u003c/li>\u003cli>\u003cstrong>Entity-Relationship (E-R)\u003c/strong> — chủ yếu dùng để thiết kế.\u003c/li>\u003cli>\u003cstrong>Object-based\u003c/strong> (object-oriented, object-relational), \u003cstrong>Semi-structured\u003c/strong> (XML, JSON).\u003c/li>\u003cli>Mô hình cũ: \u003cstrong>Network\u003c/strong>, \u003cstrong>Hierarchical\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>3. Schema vs Instance — Data independence\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Schema\u003c/strong> ~ kiểu của biến (cấu trúc, ít thay đổi). Gồm \u003cem>logical schema\u003c/em> và \u003cem>physical schema\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Instance\u003c/strong> ~ giá trị của biến (nội dung tại một thời điểm).\u003c/li>\u003cli>\u003cstrong>Physical data independence\u003c/strong>: sửa physical schema mà không phải sửa logical schema (ứng dụng chỉ phụ thuộc logical schema).\u003c/li>\u003cli>Ba mức trừu tượng: \u003cstrong>physical level → logical level → view level\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>4. Ngôn ngữ\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>DDL\u003c/strong> (Data Definition Language): định nghĩa schema — \u003ccode>create table\u003c/code>… DDL compiler ghi metadata vào \u003cstrong>data dictionary\u003c/strong> (schema, integrity constraints, authorization).\u003c/li>\u003cli>\u003cstrong>DML\u003c/strong> (Data Manipulation Language / query language): truy vấn & cập nhật.\u003c/li>\u003cli>\u003cem>Procedural DML\u003c/em>: chỉ ra cần dữ liệu gì \u003cstrong>và cách lấy\u003c/strong>.\u003c/li>\u003cli>\u003cem>Declarative (non-procedural) DML\u003c/em>: chỉ ra cần dữ liệu gì — ví dụ SQL.\u003c/li>\u003cli>Ngôn ngữ \"pure\": relational algebra, tuple relational calculus, domain relational calculus.\u003c/li>\u003cli>SQL \u003cstrong>không\u003c/strong> Turing-complete → nhúng vào host language (C/Java/Python) qua \u003cstrong>embedded SQL\u003c/strong> hoặc \u003cstrong>API (ODBC/JDBC)\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>5. Database design\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Logical design\u003c/strong>: chọn các relation schema \"tốt\" (quyết định nghiệp vụ + quyết định khoa học máy tính).\u003c/li>\u003cli>\u003cstrong>Physical design\u003c/strong>: bố trí lưu trữ vật lý.\u003c/li>\u003c/ul>\n\u003ch3>6. Database engine\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Storage manager\u003c/strong>: authorization & integrity manager, transaction manager, file manager, buffer manager. Quản lý \u003cem>data files, data dictionary, indices\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Query processor\u003c/strong>: DDL interpreter, DML compiler (có \u003cstrong>query optimization\u003c/strong> — chọn evaluation plan chi phí thấp nhất), query evaluation engine. Các bước: \u003cem>parsing & translation → optimization → evaluation\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Transaction management\u003c/strong>: đảm bảo CSDL nhất quán dù hệ thống/giao dịch lỗi; \u003cstrong>concurrency-control manager\u003c/strong> điều phối các transaction đồng thời.\u003c/li>\u003c/ul>\n\u003ch3>7. Kiến trúc & người dùng\u003c/h3>\n\u003cul>\u003cli>Kiến trúc: centralized, client-server, parallel (shared memory / shared disk / shared nothing), distributed.\u003c/li>\u003cli>Ứng dụng \u003cstrong>two-tier\u003c/strong> (client gọi DB trực tiếp) vs \u003cstrong>three-tier\u003c/strong> (client → application server → DB).\u003c/li>\u003cli>Người dùng: \u003cstrong>naive users\u003c/strong>, \u003cstrong>application programmers\u003c/strong>, \u003cstrong>sophisticated users\u003c/strong>, \u003cstrong>specialized users\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>DBA\u003c/strong>: định nghĩa schema, cấu trúc lưu trữ & access method, sửa schema/tổ chức vật lý, cấp quyền, bảo trì (backup, dung lượng, giám sát hiệu năng).\u003c/li>\u003c/ul>\n\u003ch3>8. Lịch sử (mốc chính)\u003c/h3>\n\u003cp>1950s–60s: băng từ, thẻ đục lỗ → late 60s–70s: đĩa cứng, network/hierarchical; Codd đề xuất relational model; System R (IBM), Ingres (Berkeley), Oracle → 1980s: SQL thành chuẩn, parallel/distributed, OODB → 1990s: data warehouse, data mining, web → 2000s: big data, NoSQL, MapReduce → 2010s: \"SQL reloaded\", main-memory DB.\u003c/p>","quiz":[{"q":"Hai người cùng đọc số dư 100 rồi mỗi người rút 50 cùng lúc, cuối cùng số dư còn 50. Đây là vấn đề nào của file system?","options":["Data isolation","Concurrent access anomalies","Atomicity of updates","Data redundancy"],"answer":1,"explain":"Truy cập đồng thời không được kiểm soát → lost update. DBMS giải quyết bằng concurrency-control manager."},{"q":"Chuyển tiền: hệ thống mất điện sau khi đã trừ tài khoản A nhưng chưa cộng vào B. Đây là vấn đề gì?","options":["Atomicity of updates","Security problems","Integrity problems","Difficulty in accessing data"],"answer":0,"explain":"Atomicity: cập nhật phải xảy ra trọn vẹn hoặc không xảy ra."},{"q":"Ràng buộc \"balance > 0\" được viết rải rác trong code của nhiều chương trình. Đây là vấn đề gì?","options":["Data isolation","Integrity problems","Concurrent access","Redundancy"],"answer":1,"explain":"Integrity constraints bị \"buried\" trong program code thay vì khai báo tường minh."},{"q":"Schema tương tự với khái niệm nào trong ngôn ngữ lập trình?","options":["Giá trị của biến","Kiểu (type) của biến","Một hàm","Một vòng lặp"],"answer":1,"explain":"Schema ~ type; instance ~ value của biến tại một thời điểm."},{"q":"Physical data independence là gì?","options":["Có thể sửa logical schema mà không cần sửa ứng dụng","Có thể sửa physical schema mà không cần sửa logical schema","Dữ liệu được lưu độc lập trên nhiều máy","Mỗi bảng được lưu thành một file riêng"],"answer":1,"explain":"Ứng dụng chỉ phụ thuộc logical schema, nên thay đổi cách lưu vật lý (index, file…) không ảnh hưởng ứng dụng."},{"q":"Data dictionary chứa gì?","options":["Dữ liệu người dùng","Metadata: schema, integrity constraints, authorization","Log của transaction","Kết quả truy vấn được cache"],"answer":1,"explain":"Data dictionary = \"data about data\"."},{"q":"SQL thuộc loại DML nào?","options":["Procedural","Declarative (non-procedural)","Hierarchical","Object-oriented"],"answer":1,"explain":"SQL chỉ mô tả CẦN dữ liệu gì, không mô tả CÁCH lấy."},{"q":"Thành phần nào chọn evaluation plan có chi phí thấp nhất?","options":["DDL interpreter","Buffer manager","DML compiler (query optimizer)","File manager"],"answer":2,"explain":"DML compiler dịch câu truy vấn thành evaluation plan và thực hiện query optimization."},{"q":"Buffer manager thuộc thành phần nào của database engine?","options":["Query processor","Storage manager","Transaction manager","Application server"],"answer":1,"explain":"Storage manager gồm: authorization & integrity manager, transaction manager, file manager, buffer manager."},{"q":"Trong kiến trúc three-tier, client giao tiếp trực tiếp với ai?","options":["Database server","Application server","Data dictionary","Storage manager"],"answer":1,"explain":"Client không chứa lệnh gọi DB trực tiếp; application server mới làm việc với DB."},{"q":"Nhân viên ngân hàng dùng một form có sẵn để rút tiền cho khách thuộc loại người dùng nào?","options":["Naive user","Application programmer","Sophisticated user","Specialized user"],"answer":0,"explain":"Naive users dùng các ứng dụng đã được viết sẵn."},{"q":"Nhà phân tích viết trực tiếp câu SQL để làm báo cáo thuộc loại người dùng nào?","options":["Naive user","Application programmer","Sophisticated user","DBA"],"answer":2,"explain":"Sophisticated users tương tác bằng query language hoặc công cụ phân tích, không viết chương trình."},{"q":"Việc nào KHÔNG phải nhiệm vụ của DBA?","options":["Schema definition","Granting authorization","Periodically backing up","Viết giao diện web cho khách hàng"],"answer":3,"explain":"Viết ứng dụng là việc của application programmer."},{"q":"Ai đề xuất relational model?","options":["Michael Stonebraker","Ted Codd","Jim Gray","Peter Chen"],"answer":1,"explain":"Ted Codd (IBM), nhận Turing Award năm 1981. Stonebraker làm Ingres; Peter Chen đề xuất E-R model."},{"q":"Kiến trúc parallel nào mà mỗi node có CPU, RAM và đĩa riêng?","options":["Shared memory","Shared disk","Shared nothing","Centralized"],"answer":2,"explain":"Shared nothing: các node chỉ giao tiếp qua mạng."}],"questions":[{"q":"Liệt kê 7 nhược điểm của việc dùng file system để quản lý dữ liệu, mỗi nhược điểm cho một ví dụ trong hệ thống quản lý đại học.","en":"","answer":"\u003col>\u003cli>\u003cstrong>Redundancy & inconsistency\u003c/strong> — tên khoa của sinh viên lưu ở file đăng ký môn và file học phí, đổi tên khoa chỉ sửa một file.\u003c/li>\u003cli>\u003cstrong>Difficulty in accessing data\u003c/strong> — muốn \"danh sách SV khoa CS có > 100 tín chỉ\" phải viết chương trình mới.\u003c/li>\u003cli>\u003cstrong>Data isolation\u003c/strong> — dữ liệu điểm ở Excel, dữ liệu học phí ở CSV.\u003c/li>\u003cli>\u003cstrong>Integrity problems\u003c/strong> — \"tot_cred >= 0\" kiểm tra trong từng chương trình.\u003c/li>\u003cli>\u003cstrong>Atomicity\u003c/strong> — đăng ký môn: đã ghi vào file lớp nhưng chưa ghi vào file sinh viên thì máy sập.\u003c/li>\u003cli>\u003cstrong>Concurrent access\u003c/strong> — hai SV cùng đăng ký chỗ cuối cùng của một lớp.\u003c/li>\u003cli>\u003cstrong>Security\u003c/strong> — giảng viên chỉ được xem điểm lớp mình dạy.\u003c/li>\u003c/ol>"},{"q":"Phân biệt schema và instance. Cho ví dụ với bảng instructor.","en":"","answer":"\u003cul>\u003cli>\u003cstrong>Schema\u003c/strong>: \u003ccode>instructor(ID, name, dept_name, salary)\u003c/code> — cấu trúc, gần như không đổi.\u003c/li>\u003cli>\u003cstrong>Instance\u003c/strong>: tập các dòng hiện có, ví dụ \u003ccode>(10101, Srinivasan, Comp. Sci., 65000)\u003c/code>… — thay đổi mỗi khi insert/update/delete.\u003c/li>\u003c/ul>"},{"q":"Phân biệt procedural DML và declarative DML. Relational algebra thuộc loại nào? SQL thuộc loại nào?","en":"","answer":"\u003cp>Procedural: người dùng chỉ ra dữ liệu cần \u003cstrong>và cách lấy\u003c/strong>. Declarative: chỉ ra dữ liệu cần.\u003cbr>Relational algebra mang tính \u003cstrong>procedural\u003c/strong> (biểu thức chỉ rõ thứ tự phép toán), còn tuple/domain relational calculus và SQL là \u003cstrong>declarative\u003c/strong>.\u003c/p>"},{"q":"Vì sao SQL thường được nhúng trong một host language? Hai cách nào để ứng dụng truy cập CSDL?","en":"","answer":"\u003cp>SQL không Turing-complete và không làm được nhập/xuất với người dùng, hiển thị, giao tiếp mạng.\u003cbr>Hai cách: (1) \u003cstrong>embedded SQL\u003c/strong> (language extension, tiền xử lý \u003ccode>EXEC SQL\u003c/code>), (2) \u003cstrong>API\u003c/strong> như ODBC/JDBC gửi câu SQL tới server.\u003c/p>"},{"q":"Vẽ (mô tả) luồng xử lý một câu truy vấn trong query processor.","en":"","answer":"\u003cp>Query → \u003cstrong>parser & translator\u003c/strong> → relational-algebra expression → \u003cstrong>optimizer\u003c/strong> (dùng statistics về dữ liệu) → execution plan → \u003cstrong>evaluation engine\u003c/strong> (đọc dữ liệu) → query output.\u003c/p>"},{"q":"So sánh kiến trúc two-tier và three-tier. Ứng dụng web ngày nay thường dùng kiến trúc nào? Vì sao?","en":"","answer":"\u003cp>Two-tier: ứng dụng ở client gọi trực tiếp DB server (qua ODBC/JDBC).\u003cbr>Three-tier: client (browser) → application server (business logic) → DB.\u003cbr>Web dùng \u003cstrong>three-tier\u003c/strong>: bảo mật tốt hơn (client không có quyền DB trực tiếp), dễ mở rộng, business logic tập trung một chỗ.\u003c/p>"}],"exercises":[{"id":"1.01","topic":"warm-up","level":1,"prompt":"\u003cp>Câu truy vấn đầu tiên trong slide: tìm \u003cstrong>name\u003c/strong> của tất cả instructor thuộc khoa \u003ccode>Comp. Sci.\u003c/code>\u003c/p>","en":"","hint":"select ... from instructor where dept_name = ...","solution":"select name\nfrom instructor\nwhere dept_name = 'Comp. Sci.';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Srinivasan"],["Katz"],["Brandt"]]}},{"id":"1.02","topic":"warm-up","level":1,"prompt":"\u003cp>Xem toàn bộ \u003cstrong>instance\u003c/strong> hiện tại của bảng \u003ccode>department\u003c/code> (mọi cột, mọi dòng).\u003c/p>","en":"","hint":"Dấu * nghĩa là \"all attributes\".","solution":"select * from department;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","building","budget"],"rows":[["Biology","Watson","90000"],["Comp. Sci.","Taylor","100000"],["Elec. Eng.","Taylor","85000"],["Finance","Painter","120000"],["History","Painter","50000"],["Music","Packard","80000"],["Physics","Watson","70000"]]}},{"id":"1.03","topic":"data dictionary","level":2,"prompt":"\u003cp>Data dictionary lưu metadata. Trong PostgreSQL có thể đọc nó qua \u003ccode>information_schema\u003c/code>. Liệt kê \u003cstrong>column_name\u003c/strong> và \u003cstrong>data_type\u003c/strong> của bảng \u003ccode>instructor\u003c/code>, theo đúng thứ tự cột (\u003ccode>ordinal_position\u003c/code>).\u003c/p>","en":"","hint":"Bảng information_schema.columns, lọc table_name = 'instructor'.","solution":"select column_name, data_type\nfrom information_schema.columns\nwhere table_name = 'instructor'\norder by ordinal_position;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["column_name","data_type"],"rows":[["id","character varying"],["name","character varying"],["dept_name","character varying"],["salary","numeric"]]}}]},{"key":"ch2","store":"2","short":"2","label":"Chương 2","navLabel":"Chương 2","kind":"Chương","title":"Intro to Relational Model","titleVi":"Mô hình quan hệ & Đại số quan hệ","summary":"\u003ch3>1. Cấu trúc\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Relation\u003c/strong> = bảng; \u003cstrong>tuple\u003c/strong> = dòng; \u003cstrong>attribute\u003c/strong> = cột.\u003c/li>\u003cli>\u003cstrong>Domain\u003c/strong>: tập giá trị hợp lệ của một attribute. Giá trị phải \u003cstrong>atomic\u003c/strong> (không chia nhỏ được).\u003c/li>\u003cli>\u003cstrong>null\u003c/strong>: thuộc mọi domain, nghĩa là \"unknown\"/\"không tồn tại\" → gây phức tạp cho nhiều phép toán.\u003c/li>\u003cli>Relation là \u003cstrong>tập hợp\u003c/strong> → thứ tự các tuple \u003cstrong>không quan trọng\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Database schema\u003c/strong> = cấu trúc logic, ví dụ \u003ccode>instructor(ID, name, dept_name, salary)\u003c/code>; \u003cstrong>database instance\u003c/strong> = snapshot dữ liệu tại một thời điểm.\u003c/li>\u003c/ul>\n\u003ch3>2. Keys (K ⊆ R)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Khái niệm\u003c/th>\u003cth>Định nghĩa\u003c/th>\u003cth>Ví dụ với instructor\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Superkey\u003c/strong>\u003c/td>\u003ctd>Giá trị của K đủ xác định duy nhất một tuple\u003c/td>\u003ctd>{ID}, {ID, name}\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Candidate key\u003c/strong>\u003c/td>\u003ctd>Superkey \u003cstrong>tối thiểu\u003c/strong> (bỏ bớt thuộc tính nào cũng không còn là superkey)\u003c/td>\u003ctd>{ID}\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Primary key\u003c/strong>\u003c/td>\u003ctd>Candidate key được chọn làm khoá chính\u003c/td>\u003ctd>ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Foreign key\u003c/strong>\u003c/td>\u003ctd>Giá trị ở relation này phải xuất hiện ở relation kia\u003c/td>\u003ctd>instructor.dept_name → department\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Foreign key: \u003cstrong>referencing relation\u003c/strong> (instructor) tham chiếu tới \u003cstrong>referenced relation\u003c/strong> (department).\u003c/p>\n\u003ch3>3. Relational query languages\u003c/h3>\n\u003cp>\"Pure\" languages có sức mạnh tương đương: \u003cstrong>relational algebra\u003c/strong>, \u003cstrong>tuple relational calculus\u003c/strong>, \u003cstrong>domain relational calculus\u003c/strong>.\u003c/p>\n\u003ch3>4. Relational algebra — 6 phép cơ bản\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phép\u003c/th>\u003cth>Ký hiệu\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>SQL tương ứng\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>select\u003c/td>\u003ctd>σ\u003csub>p\u003c/sub>(r)\u003c/td>\u003ctd>lọc tuple thoả predicate p (∧, ∨, ¬, =, ≠, \u003c, ≤, >, ≥)\u003c/td>\u003ctd>\u003ccode>where\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>project\u003c/td>\u003ctd>Π\u003csub>A1,…,Ak\u003c/sub>(r)\u003c/td>\u003ctd>giữ lại một số cột, \u003cstrong>loại trùng\u003c/strong>\u003c/td>\u003ctd>\u003ccode>select distinct\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>union\u003c/td>\u003ctd>r ∪ s\u003c/td>\u003ctd>hợp (cần cùng arity & domain tương thích)\u003c/td>\u003ctd>\u003ccode>union\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set difference\u003c/td>\u003ctd>r − s\u003c/td>\u003ctd>có trong r mà không có trong s\u003c/td>\u003ctd>\u003ccode>except\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cartesian product\u003c/td>\u003ctd>r × s\u003c/td>\u003ctd>ghép mọi cặp tuple\u003c/td>\u003ctd>\u003ccode>from r, s\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rename\u003c/td>\u003ctd>ρ\u003csub>x\u003c/sub>(E), ρ\u003csub>x(A1..An)\u003c/sub>(E)\u003c/td>\u003ctd>đặt tên cho kết quả\u003c/td>\u003ctd>\u003ccode>as\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Phép mở rộng:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Set intersection\u003c/strong>: r ∩ s (\u003ccode>intersect\u003c/code>) = r − (r − s).\u003c/li>\u003cli>\u003cstrong>Join\u003c/strong>: r ⋈\u003csub>θ\u003c/sub> s = σ\u003csub>θ\u003c/sub>(r × s).\u003c/li>\u003cli>\u003cstrong>Assignment\u003c/strong>: temp ← E, giúp viết truy vấn như một chương trình tuần tự.\u003c/li>\u003cli>\u003cstrong>Aggregation\u003c/strong>: \u003csub>G\u003c/sub>𝒢\u003csub>F(A)\u003c/sub>(r), F ∈ {avg, min, max, sum, count}; G là thuộc tính group by.\u003c/li>\u003c/ul>\n\u003ch3>5. Equivalent queries\u003c/h3>\n\u003cp>Hai biểu thức \u003cstrong>equivalent\u003c/strong> nếu cho cùng kết quả trên \u003cstrong>mọi\u003c/strong> database, ví dụ:\u003c/p>\n\u003cul>\u003cli>σ\u003csub>p1 ∧ p2\u003c/sub>(r) ≡ σ\u003csub>p1\u003c/sub>(σ\u003csub>p2\u003c/sub>(r))\u003c/li>\u003cli>σ\u003csub>dept='Physics'\u003c/sub>(instructor ⋈ teaches) ≡ σ\u003csub>dept='Physics'\u003c/sub>(instructor) ⋈ teaches (đẩy selection xuống trước join → nhanh hơn).\u003c/li>\u003c/ul>","quiz":[{"q":"Relation r có schema R(A, B, C). {A} là candidate key. Khẳng định nào ĐÚNG?","options":["{A, B} là candidate key","{A, B} là superkey","{B} chắc chắn là superkey","{A, B, C} không phải superkey"],"answer":1,"explain":"Mọi tập chứa một superkey đều là superkey, nhưng {A,B} không tối thiểu nên không phải candidate key."},{"q":"Trong instructor(ID, name, dept_name, salary), dept_name là foreign key tham chiếu department. Relation nào là referencing relation?","options":["department","instructor","Cả hai","Không có"],"answer":1,"explain":"instructor chứa foreign key nên là referencing; department là referenced."},{"q":"Phép nào KHÔNG thuộc 6 phép cơ bản của relational algebra?","options":["Select σ","Rename ρ","Set intersection ∩","Cartesian product ×"],"answer":2,"explain":"∩ có thể biểu diễn bằng phép trừ: r ∩ s = r − (r − s)."},{"q":"Kết quả của Π\u003csub>dept_name\u003c/sub>(instructor) có bao nhiêu tuple với dữ liệu mẫu (12 instructor, 7 khoa, mỗi khoa đều có giảng viên)?","options":["12","7","1","Không xác định"],"answer":1,"explain":"Project loại bỏ dòng trùng vì relation là tập hợp."},{"q":"Điều kiện để r ∪ s hợp lệ là gì?","options":["r và s có cùng tên thuộc tính","r và s có cùng arity và domain các cột tương thích","r và s có cùng số tuple","r và s có chung primary key"],"answer":1,"explain":"Cần cùng số cột và cột thứ i của hai bên cùng loại giá trị."},{"q":"|r| = 12 tuple, |s| = 15 tuple. |r × s| = ?","options":["27","180","12","15"],"answer":1,"explain":"Cartesian product ghép mọi cặp: 12 × 15 = 180."},{"q":"r ⋈\u003csub>θ\u003c/sub> s được định nghĩa bằng?","options":["σ\u003csub>θ\u003c/sub>(r × s)","Π\u003csub>θ\u003c/sub>(r × s)","r × σ\u003csub>θ\u003c/sub>(s)","σ\u003csub>θ\u003c/sub>(r) ∪ σ\u003csub>θ\u003c/sub>(s)"],"answer":0,"explain":"Join = Cartesian product rồi select theo điều kiện θ."},{"q":"Vì sao primary key không nên là thuộc tính có thể null hoặc hay thay đổi?","options":["Vì DBMS không cho phép index trên cột đó","Vì key dùng để xác định tuple duy nhất và được foreign key khác tham chiếu","Vì null chiếm nhiều bộ nhớ","Không có lý do gì"],"answer":1,"explain":"Khoá thay đổi thì mọi foreign key tham chiếu tới nó phải sửa theo; null thì không xác định được tuple."},{"q":"σ\u003csub>dept_name=\"Physics\" ∧ salary>90000\u003c/sub>(instructor) và σ\u003csub>dept_name=\"Physics\"\u003c/sub>(σ\u003csub>salary>90000\u003c/sub>(instructor)) là hai biểu thức…","options":["Identical","Equivalent","Khác nhau về kết quả","Một trong hai không hợp lệ"],"answer":1,"explain":"Không giống hệt nhau về cách viết nhưng luôn cho cùng kết quả → equivalent."},{"q":"Kết quả của \u003csub>dept_name\u003c/sub>𝒢\u003csub>avg(salary)\u003c/sub>(instructor) có bao nhiêu tuple trên dữ liệu mẫu?","options":["1","7","12","84"],"answer":1,"explain":"Một tuple cho mỗi nhóm dept_name — có 7 khoa đều có giảng viên."}],"questions":[{"q":"Cho student(ID, name, dept_name, tot_cred) và takes(ID, course_id, sec_id, semester, year, grade). Liệt kê các superkey và candidate key của takes. Primary key nên là gì?","en":"","answer":"\u003cp>Một sinh viên có thể học lại cùng một môn ở học kỳ khác, nên cần cả 5 thuộc tính:\u003c/p>\n\u003cul>\u003cli>Candidate key: \u003cstrong>{ID, course_id, sec_id, semester, year}\u003c/strong> → chọn làm primary key.\u003c/li>\u003cli>Superkey: candidate key đó và mọi tập chứa nó, ví dụ {ID, course_id, sec_id, semester, year, grade}.\u003c/li>\u003cli>{ID, course_id} \u003cstrong>không\u003c/strong> là superkey vì Levy (45678) học CS-101 hai lần.\u003c/li>\u003c/ul>"},{"q":"Viết biểu thức relational algebra: tên các instructor khoa Physics có lương > 90 000.","en":"","answer":"\u003cp>Π\u003csub>name\u003c/sub>(σ\u003csub>dept_name=\"Physics\" ∧ salary>90000\u003c/sub>(instructor))  → kết quả: Einstein.\u003c/p>"},{"q":"Viết biểu thức relational algebra: các course_id được dạy ở Fall 2017 nhưng KHÔNG được dạy ở Spring 2018.","en":"","answer":"\u003cp>Π\u003csub>course_id\u003c/sub>(σ\u003csub>semester=\"Fall\" ∧ year=2017\u003c/sub>(section)) − Π\u003csub>course_id\u003c/sub>(σ\u003csub>semester=\"Spring\" ∧ year=2018\u003c/sub>(section))\u003cbr>→ CS-347, PHY-101.\u003c/p>"},{"q":"Viết biểu thức relational algebra (dùng join): tên instructor và course_id các môn họ dạy, chỉ với instructor khoa Comp. Sci. Viết 2 cách tương đương, cách nào hiệu quả hơn?","en":"","answer":"\u003cp>Cách 1: Π\u003csub>name, course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(instructor ⋈\u003csub>instructor.ID=teaches.ID\u003c/sub> teaches))\u003cbr>Cách 2: Π\u003csub>name, course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(instructor) ⋈\u003csub>instructor.ID=teaches.ID\u003c/sub> teaches)\u003cbr>Cách 2 thường hiệu quả hơn vì lọc bớt instructor \u003cstrong>trước\u003c/strong> khi join (selection pushdown).\u003c/p>"},{"q":"Dùng rename và Cartesian product: tìm lương lớn nhất của instructor \u003cstrong>mà không dùng hàm max\u003c/strong>.","en":"","answer":"\u003cp>Lấy các mức lương \u003cstrong>không\u003c/strong> phải lớn nhất (có ai đó lương cao hơn) rồi trừ đi:\u003cbr>Π\u003csub>salary\u003c/sub>(instructor) − Π\u003csub>instructor.salary\u003c/sub>(σ\u003csub>instructor.salary \u003c d.salary\u003c/sub>(instructor × ρ\u003csub>d\u003c/sub>(instructor)))\u003cbr>→ 95000.\u003c/p>"},{"q":"Dùng assignment: tìm ID những instructor khoa Physics HOẶC Music.","en":"","answer":"\u003cp>Physics ← σ\u003csub>dept_name=\"Physics\"\u003c/sub>(instructor)\u003cbr>Music ← σ\u003csub>dept_name=\"Music\"\u003c/sub>(instructor)\u003cbr>Π\u003csub>ID\u003c/sub>(Physics ∪ Music)\u003c/p>"},{"q":"Viết biểu thức aggregation: số section mở trong năm 2018; và lương trung bình theo từng khoa.","en":"","answer":"\u003cp>𝒢\u003csub>count(course_id)\u003c/sub>(σ\u003csub>year=2018\u003c/sub>(section))\u003cbr>\u003csub>dept_name\u003c/sub>𝒢\u003csub>avg(salary)\u003c/sub>(instructor)\u003c/p>"}],"exercises":[{"id":"2.01","topic":"σ select","level":1,"prompt":"\u003cp>Viết SQL tương đương với σ\u003csub>dept_name=\"Physics\"\u003c/sub>(instructor).\u003c/p>","en":"","hint":"σ ứng với mệnh đề where; lấy mọi cột.","solution":"select * from instructor where dept_name = 'Physics';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["22222","Einstein","Physics","95000"],["33456","Gold","Physics","87000"]]}},{"id":"2.02","topic":"σ select","level":1,"prompt":"\u003cp>σ\u003csub>dept_name=\"Physics\" ∧ salary>90000\u003c/sub>(instructor)\u003c/p>","en":"","hint":"∧ là and.","solution":"select * from instructor where dept_name = 'Physics' and salary > 90000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["22222","Einstein","Physics","95000"]]}},{"id":"2.03","topic":"σ select","level":1,"prompt":"\u003cp>σ\u003csub>dept_name=building\u003c/sub>(department) — khoa có tên trùng với tên toà nhà (so sánh 2 thuộc tính).\u003c/p>","en":"","hint":"Kết quả có thể rỗng — vẫn đúng!","solution":"select * from department where dept_name = building;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","building","budget"],"rows":[]}},{"id":"2.04","topic":"Π project","level":1,"prompt":"\u003cp>Π\u003csub>ID, name, salary\u003c/sub>(instructor). Nhớ rằng project trong relational algebra loại bỏ dòng trùng.\u003c/p>","en":"","hint":"select distinct ...","solution":"select distinct ID, name, salary from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","salary"],"rows":[["22222","Einstein","95000"],["45565","Katz","75000"],["83821","Brandt","92000"],["15151","Mozart","40000"],["98345","Kim","80000"],["10101","Srinivasan","65000"],["58583","Califieri","62000"],["12121","Wu","90000"],["33456","Gold","87000"],["76543","Singh","80000"],["76766","Crick","72000"],["32343","El Said","60000"]]}},{"id":"2.05","topic":"composition","level":1,"prompt":"\u003cp>Π\u003csub>name\u003c/sub>(σ\u003csub>dept_name=\"Physics\"\u003c/sub>(instructor))\u003c/p>","en":"","hint":"","solution":"select distinct name from instructor where dept_name = 'Physics';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Einstein"],["Gold"]]}},{"id":"2.06","topic":"× product","level":2,"prompt":"\u003cp>Đếm số tuple của instructor × teaches (trả về 1 cột, 1 dòng).\u003c/p>","en":"","hint":"from instructor, teaches; dùng count(*).","solution":"select count(*) from instructor, teaches;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["180"]]}},{"id":"2.07","topic":"⋈ join","level":2,"prompt":"\u003cp>σ\u003csub>instructor.ID = teaches.ID\u003c/sub>(instructor × teaches) — trả về tất cả cột của cả hai bảng.\u003c/p>","en":"","hint":"Cartesian product + điều kiện where.","solution":"select * from instructor, teaches where instructor.ID = teaches.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary","id","course_id","sec_id","semester","year"],"rows":[["10101","Srinivasan","Comp. Sci.","65000","10101","CS-101","1","Fall","2017"],["10101","Srinivasan","Comp. Sci.","65000","10101","CS-315","1","Spring","2018"],["10101","Srinivasan","Comp. Sci.","65000","10101","CS-347","1","Fall","2017"],["12121","Wu","Finance","90000","12121","FIN-201","1","Spring","2018"],["15151","Mozart","Music","40000","15151","MU-199","1","Spring","2018"],["22222","Einstein","Physics","95000","22222","PHY-101","1","Fall","2017"],["32343","El Said","History","60000","32343","HIS-351","1","Spring","2018"],["45565","Katz","Comp. Sci.","75000","45565","CS-101","1","Spring","2018"],["45565","Katz","Comp. Sci.","75000","45565","CS-319","1","Spring","2018"],["76766","Crick","Biology","72000","76766","BIO-101","1","Summer","2017"],["76766","Crick","Biology","72000","76766","BIO-301","1","Summer","2018"],["83821","Brandt","Comp. Sci.","92000","83821","CS-190","1","Spring","2017"],["83821","Brandt","Comp. Sci.","92000","83821","CS-190","2","Spring","2017"],["83821","Brandt","Comp. Sci.","92000","83821","CS-319","2","Spring","2018"],["98345","Kim","Elec. Eng.","80000","98345","EE-181","1","Spring","2017"]]}},{"id":"2.08","topic":"∪ union","level":2,"prompt":"\u003cp>Π\u003csub>course_id\u003c/sub>(σ\u003csub>semester=\"Fall\" ∧ year=2017\u003c/sub>(section)) ∪ Π\u003csub>course_id\u003c/sub>(σ\u003csub>semester=\"Spring\" ∧ year=2018\u003c/sub>(section))\u003c/p>","en":"","hint":"","solution":"select course_id from section where semester = 'Fall' and year = 2017\nunion\nselect course_id from section where semester = 'Spring' and year = 2018;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-101"],["CS-315"],["CS-319"],["CS-347"],["FIN-201"],["HIS-351"],["MU-199"],["PHY-101"]]}},{"id":"2.09","topic":"∩ intersection","level":2,"prompt":"\u003cp>Các course_id được dạy ở \u003cstrong>cả\u003c/strong> Fall 2017 \u003cstrong>và\u003c/strong> Spring 2018.\u003c/p>","en":"","hint":"","solution":"select course_id from section where semester = 'Fall' and year = 2017\nintersect\nselect course_id from section where semester = 'Spring' and year = 2018;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-101"]]}},{"id":"2.10","topic":"− difference","level":2,"prompt":"\u003cp>Các course_id dạy ở Fall 2017 nhưng \u003cstrong>không\u003c/strong> dạy ở Spring 2018.\u003c/p>","en":"","hint":"","solution":"select course_id from section where semester = 'Fall' and year = 2017\nexcept\nselect course_id from section where semester = 'Spring' and year = 2018;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-347"],["PHY-101"]]}},{"id":"2.11","topic":"ρ rename","level":3,"prompt":"\u003cp>Không dùng max: tìm lương cao nhất bằng cách lấy tất cả mức lương trừ đi các mức lương nhỏ hơn một mức lương khác (xem câu hỏi tự luận cùng chương).\u003c/p>","en":"","hint":"instructor × ρ_d(instructor) ⇒ from instructor, instructor as d","solution":"select salary from instructor\nexcept\nselect instructor.salary\nfrom instructor, instructor as d\nwhere instructor.salary \u003c d.salary;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["salary"],"rows":[["95000"]]}},{"id":"2.12","topic":"𝒢 aggregation","level":2,"prompt":"\u003cp>\u003csub>dept_name\u003c/sub>𝒢\u003csub>avg(salary)\u003c/sub>(instructor) — trả về dept_name và lương trung bình.\u003c/p>","en":"","hint":"","solution":"select dept_name, avg(salary) from instructor group by dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","avg"],"rows":[["Finance","85000"],["History","61000"],["Physics","91000"],["Music","40000"],["Comp. Sci.","77333.3333"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"2.13","topic":"𝒢 aggregation","level":2,"prompt":"\u003cp>𝒢\u003csub>count(course_id)\u003c/sub>(σ\u003csub>year=2018\u003c/sub>(section)) — số section trong năm 2018.\u003c/p>","en":"","hint":"","solution":"select count(course_id) from section where year = 2018;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["8"]]}},{"id":"2.14","topic":"keys","level":3,"prompt":"\u003cp>Kiểm tra bằng dữ liệu: {ID, course_id} có phải superkey của takes không? Liệt kê các cặp (ID, course_id) xuất hiện \u003cstrong>nhiều hơn 1 lần\u003c/strong> trong takes, kèm số lần.\u003c/p>","en":"","hint":"group by ID, course_id having count(*) > 1","solution":"select ID, course_id, count(*)\nfrom takes\ngroup by ID, course_id\nhaving count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","course_id","count"],"rows":[["45678","CS-101","2"]]}}]},{"key":"ch3","store":"3","short":"3","label":"Chương 3","navLabel":"Chương 3","kind":"Chương","title":"Introduction to SQL","titleVi":"Nhập môn SQL","summary":"\u003ch3>1. Các phần của SQL\u003c/h3>\n\u003cp>DML · DDL (schema, integrity, view) · transaction control · embedded/dynamic SQL · authorization.\u003c/p>\n\u003ch3>2. DDL & kiểu dữ liệu\u003c/h3>\n\u003cp>\u003ccode>char(n)\u003c/code>, \u003ccode>varchar(n)\u003c/code>, \u003ccode>int\u003c/code>, \u003ccode>smallint\u003c/code>, \u003ccode>numeric(p,d)\u003c/code> (p chữ số, d chữ số sau dấu phẩy — numeric(3,1) lưu được 44.5 nhưng không lưu được 444.5), \u003ccode>real\u003c/code>, \u003ccode>double precision\u003c/code>, \u003ccode>float(n)\u003c/code>.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table instructor (\n  ID        char(5),\n  name      varchar(20) not null,\n  dept_name varchar(20),\n  salary    numeric(8,2),\n  primary key (ID),\n  foreign key (dept_name) references department);\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>insert into r values (...)\u003c/code>, \u003ccode>delete from r\u003c/code> (xoá dữ liệu, giữ bảng), \u003ccode>drop table r\u003c/code> (xoá cả bảng).\u003c/li>\u003cli>\u003ccode>alter table r add A D\u003c/code> (dòng cũ nhận null), \u003ccode>alter table r drop A\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>3. Cấu trúc truy vấn cơ bản\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select A1, ..., An      -- Π (project) — KHÔNG tự loại trùng\nfrom   r1, ..., rm      -- × (Cartesian product)\nwhere  P                -- σ (select)\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>distinct\u003c/code> loại trùng; \u003ccode>all\u003c/code> giữ trùng (mặc định); \u003ccode>*\u003c/code> mọi cột; có thể dùng biểu thức \u003ccode>salary/12 as monthly_salary\u003c/code>.\u003c/li>\u003cli>Logic: \u003ccode>and\u003c/code>, \u003ccode>or\u003c/code>, \u003ccode>not\u003c/code>; so sánh \u003ccode>&lt; &lt;= &gt; &gt;= = &lt;&gt;\u003c/code>; \u003ccode>between ... and ...\u003c/code> (bao gồm 2 đầu); tuple comparison \u003ccode>(a, b) = (x, y)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Rename\u003c/strong>: \u003ccode>instructor as T\u003c/code> (từ khoá as có thể bỏ) — cần cho \u003cstrong>self join\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>String\u003c/strong>: \u003ccode>like\u003c/code> với \u003ccode>%\u003c/code> (chuỗi bất kỳ) và \u003ccode>_\u003c/code> (đúng 1 ký tự); \u003ccode>escape '\\'\u003c/code>; phân biệt hoa thường; \u003ccode>||\u003c/code> nối chuỗi, \u003ccode>upper\u003c/code>, \u003ccode>lower\u003c/code>, \u003ccode>length\u003c/code>, \u003ccode>substring\u003c/code>.\u003c/li>\u003cli>\u003ccode>order by A [asc|desc], B ...\u003c/code>\u003c/li>\u003c/ul>\n\u003ch3>4. Set operations\u003c/h3>\n\u003cp>\u003ccode>union\u003c/code>, \u003ccode>intersect\u003c/code>, \u003ccode>except\u003c/code> — \u003cstrong>tự loại trùng\u003c/strong>; thêm \u003ccode>all\u003c/code> để giữ trùng (\u003ccode>union all\u003c/code>…).\u003c/p>\n\u003ch3>5. Null\u003c/h3>\n\u003cul>\u003cli>Phép toán số học với null → null.\u003c/li>\u003cli>So sánh với null → \u003cstrong>unknown\u003c/strong>. Dùng \u003ccode>is null\u003c/code> / \u003ccode>is not null\u003c/code>.\u003c/li>\u003cli>Logic 3 giá trị: true \u003cstrong>and\u003c/strong> unknown = unknown; false \u003cstrong>and\u003c/strong> unknown = false; true \u003cstrong>or\u003c/strong> unknown = true; false \u003cstrong>or\u003c/strong> unknown = unknown; \u003cstrong>not\u003c/strong> unknown = unknown.\u003c/li>\u003cli>where coi unknown như \u003cstrong>false\u003c/strong>.\u003c/li>\u003cli>Aggregate bỏ qua null (trừ \u003ccode>count(*)\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3>6. Aggregate functions\u003c/h3>\n\u003cp>\u003ccode>avg\u003c/code>, \u003ccode>min\u003c/code>, \u003ccode>max\u003c/code>, \u003ccode>sum\u003c/code>, \u003ccode>count\u003c/code> · \u003ccode>count(distinct ID)\u003c/code> · \u003ccode>count(*)\u003c/code>.\u003c/p>\n\u003cul>\u003cli>Thuộc tính trong select \u003cstrong>không nằm trong aggregate\u003c/strong> phải có trong \u003ccode>group by\u003c/code>.\u003c/li>\u003cli>\u003ccode>where\u003c/code> lọc \u003cstrong>trước\u003c/strong> khi nhóm; \u003ccode>having\u003c/code> lọc \u003cstrong>sau\u003c/strong> khi nhóm.\u003c/li>\u003c/ul>\n\u003ch3>7. Nested subqueries\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cấu trúc\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>A in (subquery)\u003c/code> / \u003ccode>not in\u003c/code>\u003c/td>\u003ctd>set membership\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>A &gt; some (subquery)\u003c/code>\u003c/td>\u003ctd>lớn hơn \u003cstrong>ít nhất một\u003c/strong> giá trị (= some ≡ in, nhưng ≠ some ≢ not in)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>A &gt; all (subquery)\u003c/code>\u003c/td>\u003ctd>lớn hơn \u003cstrong>mọi\u003c/strong> giá trị (≠ all ≡ not in, nhưng = all ≢ in)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>exists (subquery)\u003c/code> / \u003ccode>not exists\u003c/code>\u003c/td>\u003ctd>subquery khác rỗng / rỗng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>unique (subquery)\u003c/code>\u003c/td>\u003ctd>không có tuple trùng — \u003cem>PostgreSQL không hỗ trợ\u003c/em>, thay bằng \u003ccode>group by ... having count(*) &lt;= 1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>subquery trong \u003ccode>from\u003c/code>\u003c/td>\u003ctd>phải đặt alias trong PostgreSQL: \u003ccode>(select ...) as t\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>with name(cols) as (...)\u003c/code>\u003c/td>\u003ctd>bảng tạm chỉ dùng trong một câu truy vấn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scalar subquery\u003c/td>\u003ctd>subquery trả về \u003cstrong>đúng 1 giá trị\u003c/strong>, dùng ở select/where\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Correlated subquery\u003c/strong>: subquery dùng biến (correlation name) của truy vấn ngoài, ví dụ \u003ccode>where S.ID = T.ID\u003c/code>.\u003c/p>\n\u003cp>\"Sinh viên học \u003cstrong>tất cả\u003c/strong> môn khoa Biology\" ⇒ \u003ccode>not exists (X except Y)\u003c/code> vì X − Y = ∅ ⇔ X ⊆ Y.\u003c/p>\n\u003ch3>8. Modification\u003c/h3>\n\u003cul>\u003cli>\u003ccode>delete from r where P\u003c/code> — điều kiện được tính \u003cstrong>trước\u003c/strong> rồi mới xoá (avg không bị tính lại giữa chừng).\u003c/li>\u003cli>\u003ccode>insert into r [ (cols) ] values (...)\u003c/code> hoặc \u003ccode>insert into r select ...\u003c/code> (select được tính xong trước khi chèn).\u003c/li>\u003cli>\u003ccode>update r set A = ... where P\u003c/code>; thứ tự các update quan trọng → dùng \u003ccode>case when ... then ... else ... end\u003c/code>.\u003c/li>\u003cli>Update dùng scalar subquery: \u003ccode>update student S set tot_cred = (select ... where S.ID = takes.ID)\u003c/code>.\u003c/li>\u003c/ul>","quiz":[{"q":"\u003ccode>select dept_name from instructor\u003c/code> trả về bao nhiêu dòng trên dữ liệu mẫu (12 instructor)?","options":["7","12","1","Lỗi cú pháp"],"answer":1,"explain":"SQL giữ dòng trùng theo mặc định (multiset). Cần distinct mới còn 7."},{"q":"Pattern nào khớp với MỌI chuỗi có ÍT NHẤT 3 ký tự?","options":["'___'","'___%'","'_%'","'%_%'"],"answer":1,"explain":"'___' khớp ĐÚNG 3 ký tự; '___%' là 3 ký tự bất kỳ rồi thêm chuỗi tuỳ ý (có thể rỗng) → ít nhất 3."},{"q":"Giá trị của \u003ccode>(5 &lt; null) or (1 = 1)\u003c/code>?","options":["true","false","unknown","null"],"answer":0,"explain":"unknown or true = true."},{"q":"Giá trị của \u003ccode>(null = null)\u003c/code>?","options":["true","false","unknown","Lỗi"],"answer":2,"explain":"Mọi so sánh với null (trừ is null / is not null) đều là unknown."},{"q":"Câu nào sai cú pháp/ngữ nghĩa?","options":["select dept_name, avg(salary) from instructor group by dept_name","select dept_name, ID, avg(salary) from instructor group by dept_name","select count(*) from course","select avg(salary) from instructor where dept_name = 'Physics'"],"answer":1,"explain":"ID không nằm trong aggregate và không có trong group by."},{"q":"Điểm khác nhau giữa where và having?","options":["Không khác nhau","where lọc tuple trước khi nhóm, having lọc nhóm sau khi nhóm","having lọc trước, where lọc sau","having chỉ dùng được với order by"],"answer":1,"explain":"Predicate trong having được áp dụng sau khi hình thành nhóm."},{"q":"\u003ccode>(5 &lt; some {0, 5, 6})\u003c/code> = ?","options":["true","false","unknown","Lỗi"],"answer":0,"explain":"5 \u003c 6 nên tồn tại một phần tử thoả."},{"q":"\u003ccode>(5 &lt; all {6, 10})\u003c/code> và \u003ccode>(5 = all {4, 5})\u003c/code> lần lượt là?","options":["true, true","true, false","false, true","false, false"],"answer":1,"explain":"5 \u003c 6 và 5 \u003c 10 → true; 5 ≠ 4 → false."},{"q":"Cặp nào TƯƠNG ĐƯƠNG?","options":["= some ≡ in","≠ some ≡ not in","= all ≡ in","not exists ≡ in"],"answer":0,"explain":"= some ≡ in và ≠ all ≡ not in; còn ≠ some ≢ not in và = all ≢ in."},{"q":"Nếu bảng instructor rỗng, \u003ccode>select count(*), sum(salary) from instructor\u003c/code> trả về?","options":["0 dòng","1 dòng: (0, 0)","1 dòng: (0, null)","1 dòng: (null, null)"],"answer":2,"explain":"count trên tập rỗng = 0; các aggregate khác trên tập rỗng = null."},{"q":"\u003ccode>delete from instructor where salary &lt; (select avg(salary) from instructor)\u003c/code> — SQL xử lý thế nào?","options":["Tính lại avg sau mỗi dòng bị xoá","Tính avg một lần, tìm tất cả dòng cần xoá, rồi mới xoá","Báo lỗi vì subquery cùng bảng","Chỉ xoá dòng đầu tiên"],"answer":1,"explain":"Để kết quả không phụ thuộc thứ tự xử lý."},{"q":"Hai câu update tăng 3% cho lương > 100000 và 5% cho phần còn lại. Thứ tự nào đúng?","options":["Câu 5% (salary \u003c= 100000) chạy trước","Câu 3% (salary > 100000) chạy trước","Thứ tự không quan trọng","Phải chạy song song"],"answer":1,"explain":"Nếu tăng 5% trước, người 99 000 lên 103 950 rồi lại bị tăng thêm 3%. Tốt nhất dùng case."},{"q":"\u003ccode>union\u003c/code> khác \u003ccode>union all\u003c/code> thế nào?","options":["union all loại trùng","union loại trùng, union all giữ trùng","Không khác","union all chỉ dùng cho 2 bảng giống hệt nhau"],"answer":1,"explain":"Các phép set mặc định loại trùng."},{"q":"Scalar subquery trả về 2 dòng thì sao?","options":["Lấy dòng đầu tiên","Trả về null","Runtime error","Tự động dùng in"],"answer":2,"explain":"Scalar subquery phải trả về đúng một giá trị."}],"questions":[{"q":"Giải thích vì sao truy vấn \"sinh viên đã học TẤT CẢ các môn của khoa Biology\" không viết được bằng \u003ccode>= all\u003c/code> mà phải dùng \u003ccode>not exists (... except ...)\u003c/code>.","en":"","answer":"\u003cp>Ta cần kiểm tra \u003cstrong>quan hệ bao hàm tập hợp\u003c/strong>: tập môn Biology ⊆ tập môn sinh viên đã học.\u003cbr>\u003ccode>= all\u003c/code> so sánh \u003cstrong>một giá trị\u003c/strong> với mọi phần tử của tập — không so sánh được tập với tập.\u003cbr>X ⊆ Y ⇔ X − Y = ∅ ⇔ \u003ccode>not exists (X except Y)\u003c/code>.\u003c/p>"},{"q":"Hãy dự đoán kết quả của \u003ccode>select name from instructor where salary &gt; 70000 or salary &lt;= 70000\u003c/code> nếu có một instructor có salary = null. Người đó có xuất hiện không? Vì sao?","en":"","answer":"\u003cp>Không. Với null: (null > 70000) = unknown, (null \u003c= 70000) = unknown, unknown or unknown = unknown → where coi là false.\u003c/p>"},{"q":"PostgreSQL không hỗ trợ \u003ccode>unique (subquery)\u003c/code>. Viết lại truy vấn \"các môn được mở nhiều nhất một lần trong năm 2017\" theo 2 cách khác.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- Cách 1: not exists hai section khác nhau\nselect T.course_id from course T\nwhere not exists (select 1 from section R1, section R2\n                  where R1.course_id = T.course_id and R2.course_id = T.course_id\n                    and R1.year = 2017 and R2.year = 2017\n                    and (R1.sec_id, R1.semester) &lt;&gt; (R2.sec_id, R2.semester));\n-- Cách 2: đếm\nselect T.course_id from course T\nwhere (select count(*) from section R\n       where R.course_id = T.course_id and R.year = 2017) &lt;= 1;\u003c/code>\u003c/pre>"},{"q":"Phân biệt \u003ccode>delete from student\u003c/code> và \u003ccode>drop table student\u003c/code>.","en":"","answer":"\u003cp>\u003ccode>delete from student\u003c/code> xoá \u003cstrong>mọi tuple\u003c/strong> nhưng giữ lại bảng (schema). \u003ccode>drop table student\u003c/code> xoá cả dữ liệu lẫn schema — bảng không còn tồn tại.\u003c/p>"}],"exercises":[{"id":"3.01","topic":"select","level":1,"prompt":"\u003cp>Tìm tên của tất cả instructor.\u003c/p>","en":"","hint":"","solution":"select name from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Srinivasan"],["Wu"],["Mozart"],["Einstein"],["El Said"],["Gold"],["Katz"],["Califieri"],["Singh"],["Crick"],["Brandt"],["Kim"]]}},{"id":"3.02","topic":"distinct","level":1,"prompt":"\u003cp>Tìm tên các khoa (dept_name) có giảng viên, \u003cstrong>không lặp lại\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"select distinct dept_name from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Finance"],["History"],["Physics"],["Music"],["Comp. Sci."],["Biology"],["Elec. Eng."]]}},{"id":"3.03","topic":"arithmetic","level":1,"prompt":"\u003cp>Liệt kê ID, name và \u003cstrong>lương tháng\u003c/strong> (salary / 12) của mỗi instructor, đặt tên cột là \u003ccode>monthly_salary\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select ID, name, salary / 12 as monthly_salary from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","monthly_salary"],"rows":[["10101","Srinivasan","5416.6667"],["12121","Wu","7500"],["15151","Mozart","3333.3333"],["22222","Einstein","7916.6667"],["32343","El Said","5000"],["33456","Gold","7250"],["45565","Katz","6250"],["58583","Califieri","5166.6667"],["76543","Singh","6666.6667"],["76766","Crick","6000"],["83821","Brandt","7666.6667"],["98345","Kim","6666.6667"]]}},{"id":"3.04","topic":"where","level":1,"prompt":"\u003cp>Tên các instructor khoa \u003ccode>Comp. Sci.\u003c/code> có lương lớn hơn 70000.\u003c/p>","en":"","hint":"","solution":"select name from instructor where dept_name = 'Comp. Sci.' and salary > 70000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Katz"],["Brandt"]]}},{"id":"3.05","topic":"between","level":1,"prompt":"\u003cp>Tên các instructor có lương từ 90000 đến 100000 (bao gồm cả hai đầu).\u003c/p>","en":"","hint":"","solution":"select name from instructor where salary between 90000 and 100000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Wu"],["Einstein"],["Brandt"]]}},{"id":"3.06","topic":"order by","level":1,"prompt":"\u003cp>Liệt kê dept_name, name, salary của in },{"id":"3.27","topic":"in","level":2,"prompt":"\u003cp>Dùng \u003cstrong>in\u003c/strong>: các course_id (không lặp) mở ở Fall 2017 \u003cstrong>và\u003c/strong> Spring 2018.\u003c/p>","en":"","hint":"","solution":"select distinct course_id\nfrom section\nwhere semester = 'Fall' and year = 2017\n  and course_id in (select course_id from section\n                    where semester = 'Spring' and year = 2018);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-101"]]}},{"id":"3.28","topic":"not in","level":2,"prompt":"\u003cp>Dùng \u003cstrong>not in\u003c/strong>: các course_id mở ở Fall 2017 nhưng \u003cstrong>không\u003c/strong> mở ở Spring 2018.\u003c/p>","en":"","hint":"","solution":"select distinct course_id\nfrom section\nwhere semester = 'Fall' and year = 2017\n  and course_id not in (select course_id from section\n                        where semester = 'Spring' and year = 2018);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-347"],["PHY-101"]]}},{"id":"3.29","topic":"in (tuple)","level":2,"prompt":"\u003cp>Đếm số sinh viên (khác nhau) đã học các section do instructor \u003ccode>10101\u003c/code> dạy — dùng \u003ccode>(course_id, sec_id, semester, year) in (...)\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select count(distinct ID)\nfrom takes\nwhere (course_id, sec_id, semester, year) in\n      (select course_id, sec_id, semester, year\n       from teaches\n       where teaches.ID = '10101');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["6"]]}},{"id":"3.30","topic":"some","level":2,"prompt":"\u003cp>Dùng \u003cstrong>> some\u003c/strong>: tên instructor có lương lớn hơn lương của \u003cstrong>ít nhất một\u003c/strong> instructor khoa \u003ccode>Biology\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select name\nfrom instructor\nwhere salary > some (select salary from instructor where dept_name = 'Biology');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Wu"],["Einstein"],["Gold"],["Katz"],["Singh"],["Brandt"],["Kim"]]}},{"id":"3.31","topic":"all","level":2,"prompt":"\u003cp>Dùng \u003cstrong>> all\u003c/strong>: tên instructor có lương lớn hơn lương của \u003cstrong>tất cả\u003c/strong> instructor khoa \u003ccode>Finance\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select name\nfrom instructor\nwhere salary > all (select salary from instructor where dept_name = 'Finance');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name"],"rows":[["Einstein"],["Brandt"]]}},{"id":"3.32","topic":"all","level":3,"prompt":"\u003cp>Tìm (các) khoa có lương trung bình \u003cstrong>cao nhất\u003c/strong> — dùng \u003ccode>&gt;= all\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select dept_name\nfrom instructor\ngroup by dept_name\nhaving avg(salary) >= all (select avg(salary) from instructor group by dept_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Physics"]]}},{"id":"3.33","topic":"exists","level":2,"prompt":"\u003cp>Dùng \u003cstrong>exists\u003c/strong> (correlated subquery): các course_id mở ở Fall 2017 và Spring 2018.\u003c/p>","en":"","hint":"","solution":"select course_id\nfrom section as S\nwhere semester = 'Fall' and year = 2017\n  and exists (select *\n              from section as T\n              where semester = 'Spring' and year = 2018\n                and S.course_id = T.course_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["CS-101"]]}},{"id":"3.34","topic":"not exists","level":3,"prompt":"\u003cp>ID và name của các sinh viên đã học \u003cstrong>tất cả\u003c/strong> các môn của khoa \u003ccode>Biology\u003c/code> \u003cem>đã từng mở lớp\u003c/em> (course_id xuất hiện trong section). Dùng \u003ccode>not exists (... except ...)\u003c/code>.\u003c/p>","en":"","hint":"X = các môn Biology có trong section; Y = các môn sinh viên S đã học. X ⊆ Y.","solution":"select S.ID, S.name\nfrom student as S\nwhere not exists ((select course_id from course\n                   where dept_name = 'Biology'\n                     and course_id in (select course_id from section))\n                  except\n                  (select T.course_id from takes as T where S.ID = T.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["98988","Tanaka"]]}},{"id":"3.35","topic":"not exists","level":3,"prompt":"\u003cp>ID và name các sinh viên đã học \u003cstrong>tất cả\u003c/strong> các môn khoa \u003ccode>Biology\u003c/code> (kể cả môn chưa mở — đúng như slide). Kết quả rỗng có hợp lý không?\u003c/p>","en":"","hint":"","solution":"select distinct S.ID, S.name\nfrom student as S\nwhere not exists ((select course_id from course where dept_name = 'Biology')\n                  except\n                  (select T.course_id from takes as T where S.ID = T.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[]}},{"id":"3.36","topic":"\"unique\"","level":3,"prompt":"\u003cp>Các course_id được mở \u003cstrong>nhiều nhất một lần\u003c/strong> trong năm 2017 (gồm cả môn không mở lần nào). PostgreSQL không có \u003ccode>unique (subquery)\u003c/code> — hãy dùng scalar subquery đếm.\u003c/p>","en":"","hint":"","solution":"select T.course_id\nfrom course as T\nwhere (select count(*) from section as R\n       where T.course_id = R.course_id and R.year = 2017) \u003c= 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["BIO-101"],["BIO-301"],["BIO-399"],["CS-101"],["CS-315"],["CS-319"],["CS-347"],["EE-181"],["FIN-201"],["HIS-351"],["MU-199"],["PHY-101"]]}},{"id":"3.37","topic":"from subquery","level":2,"prompt":"\u003cp>Không dùng having: dept_name và avg_salary của các khoa có lương trung bình > 42000 (subquery trong from).\u003c/p>","en":"","hint":"","solution":"select dept_name, avg_salary\nfrom (select dept_name, avg(salary) as avg_salary\n      from instructor\n      group by dept_name) as dept_avg\nwhere avg_salary > 42000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","avg_salary"],"rows":[["Finance","85000"],["History","61000"],["Physics","91000"],["Comp. Sci.","77333.3333"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"3.38","topic":"with","level":2,"prompt":"\u003cp>Dùng \u003cstrong>with\u003c/strong>: tìm dept_name của (các) khoa có budget lớn nhất.\u003c/p>","en":"","hint":"","solution":"with max_budget (value) as\n  (select max(budget) from department)\nselect department.dept_name\nfrom department, max_budget\nwhere department.budget = max_budget.value;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Finance"]]}},{"id":"3.39","topic":"with","level":3,"prompt":"\u003cp>Dùng \u003cstrong>with\u003c/strong> 2 bảng tạm: các khoa có \u003cstrong>tổng lương\u003c/strong> lớn hơn \u003cstrong>trung bình của tổng lương\u003c/strong> các khoa.\u003c/p>","en":"","hint":"","solution":"with dept_total (dept_name, value) as\n  (select dept_name, sum(salary) from instructor group by dept_name),\ndept_total_avg (value) as\n  (select avg(value) from dept_total)\nselect dept_name\nfrom dept_total, dept_total_avg\nwhere dept_total.value > dept_total_avg.value;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Finance"],["Physics"],["Comp. Sci."]]}},{"id":"3.40","topic":"scalar subquery","level":2,"prompt":"\u003cp>Liệt kê \u003cstrong>mọi\u003c/strong> khoa cùng số instructor của khoa đó (\u003ccode>num_instructors\u003c/code>) — dùng scalar subquery trong select.\u003c/p>","en":"","hint":"","solution":"select dept_name,\n       (select count(*) from instructor\n        where department.dept_name = instructor.dept_name) as num_instructors\nfrom department;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","num_instructors"],"rows":[["Biology","1"],["Comp. Sci.","3"],["Elec. Eng.","1"],["Finance","2"],["History","2"],["Music","1"],["Physics","2"]]}},{"id":"3.41","topic":"insert","level":1,"prompt":"\u003cp>Thêm môn \u003ccode>CS-437\u003c/code>, title \u003ccode>Database Systems\u003c/code>, khoa \u003ccode>Comp. Sci.\u003c/code>, 4 tín chỉ. (Hệ thống sẽ kiểm tra bảng course sau khi chạy.)\u003c/p>","en":"","hint":"","solution":"insert into course values ('CS-437', 'Database Systems', 'Comp. Sci.', 4);","check":"select * from course order by course_id;","ordered":false,"fresh":false,"expected":{"fields":["course_id","title","dept_name","credits"],"rows":[["BIO-101","Intro. to Biology","Biology","4"],["BIO-301","Genetics","Biology","4"],["BIO-399","Computational Biology","Biology","3"],["CS-101","Intro. to Computer Science","Comp. Sci.","4"],["CS-190","Game Design","Comp. Sci.","4"],["CS-315","Robotics","Comp. Sci.","3"],["CS-319","Image Processing","Comp. Sci.","3"],["CS-347","Database System Concepts","Comp. Sci.","3"],["CS-437","Database Systems","Comp. Sci.","4"],["EE-181","Intro. to Digital Systems","Elec. Eng.","3"],["FIN-201","Investment Banking","Finance","3"],["HIS-351","World History","History","3"],["MU-199","Music Video Production","Music","3"],["PHY-101","Physical Principles","Physics","4"]]}},{"id":"3.42","topic":"insert null","level":1,"prompt":"\u003cp>Thêm sinh viên \u003ccode>3003\u003c/code>, tên \u003ccode>Green\u003c/code>, khoa \u003ccode>Finance\u003c/code>, tot_cred \u003cstrong>null\u003c/strong> — chỉ liệt kê các cột cần thiết.\u003c/p>","en":"","hint":"","solution":"insert into student (ID, name, dept_name) values ('3003', 'Green', 'Finance');","check":"select * from student order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred"],"rows":[["00128","Zhang","Comp. Sci.","102"],["12345","Shankar","Comp. Sci.","32"],["19991","Brandt","History","80"],["23121","Chavez","Finance","110"],["3003","Green","Finance",null],["44553","Peltier","Physics","56"],["45678","Levy","Physics","46"],["54321","Williams","Comp. Sci.","54"],["55739","Sanchez","Music","38"],["70557","Snow","Physics","0"],["76543","Brown","Comp. Sci.","58"],["76653","Aoi","Elec. Eng.","60"],["98765","Bourikas","Elec. Eng.","98"],["98988","Tanaka","Biology","120"]]}},{"id":"3.43","topic":"insert ... select","level":2,"prompt":"\u003cp>Biến mọi sinh viên khoa \u003ccode>Comp. Sci.\u003c/code> có \u003cstrong>tot_cred > 100\u003c/strong> thành instructor cùng khoa với lương 30000 (insert … select).\u003c/p>","en":"","hint":"","solution":"insert into instructor\nselect ID, name, dept_name, 30000\nfrom student\nwhere dept_name = 'Comp. Sci.' and tot_cred > 100;","check":"select * from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["00128","Zhang","Comp. Sci.","30000"],["10101","Srinivasan","Comp. Sci.","65000"],["12121","Wu","Finance","90000"],["15151","Mozart","Music","40000"],["22222","Einstein","Physics","95000"],["32343","El Said","History","60000"],["33456","Gold","Physics","87000"],["45565","Katz","Comp. Sci.","75000"],["58583","Califieri","History","62000"],["76543","Singh","Finance","80000"],["76766","Crick","Biology","72000"],["83821","Brandt","Comp. Sci.","92000"],["98345","Kim","Elec. Eng.","80000"]]}},{"id":"3.44","topic":"delete","level":2,"prompt":"\u003cp>Xoá mọi instructor thuộc các khoa đặt ở toà nhà \u003ccode>Watson\u003c/code>.\u003c/p>","en":"","hint":"","solution":"delete from instructor\nwhere dept_name in (select dept_name from department where building = 'Watson');","check":"select * from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["10101","Srinivasan","Comp. Sci.","65000"],["12121","Wu","Finance","90000"],["15151","Mozart","Music","40000"],["32343","El Said","History","60000"],["45565","Katz","Comp. Sci.","75000"],["58583","Califieri","History","62000"],["76543","Singh","Finance","80000"],["83821","Brandt","Comp. Sci.","92000"],["98345","Kim","Elec. Eng.","80000"]]}},{"id":"3.45","topic":"delete","level":2,"prompt":"\u003cp>Xoá mọi instructor có lương \u003cstrong>thấp hơn lương trung bình\u003c/strong> của tất cả instructor.\u003c/p>","en":"","hint":"","solution":"delete from instructor\nwhere salary \u003c (select avg(salary) from instructor);","check":"select * from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["12121","Wu","Finance","90000"],["22222","Einstein","Physics","95000"],["33456","Gold","Physics","87000"],["45565","Katz","Comp. Sci.","75000"],["76543","Singh","Finance","80000"],["83821","Brandt","Comp. Sci.","92000"],["98345","Kim","Elec. Eng.","80000"]]}},{"id":"3.46","topic":"update","level":1,"prompt":"\u003cp>Tăng 5% lương cho các instructor có lương \u003cstrong>dưới 70000\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"update instructor set salary = salary * 1.05 where salary \u003c 70000;","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","68250"],["12121","90000"],["15151","42000"],["22222","95000"],["32343","63000"],["33456","87000"],["45565","75000"],["58583","65100"],["76543","80000"],["76766","72000"],["83821","92000"],["98345","80000"]]}},{"id":"3.47","topic":"update case","level":2,"prompt":"\u003cp>Dùng \u003cstrong>một\u003c/strong> câu update với \u003ccode>case\u003c/code>: lương > 90000 tăng 3%, còn lại tăng 5%.\u003c/p>","en":"","hint":"","solution":"update instructor\nset salary = case\n               when salary \u003c= 90000 then salary * 1.05\n               else salary * 1.03\n             end;","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","68250"],["12121","94500"],["15151","42000"],["22222","97850"],["32343","63000"],["33456","91350"],["45565","78750"],["58583","65100"],["76543","84000"],["76766","75600"],["83821","94760"],["98345","84000"]]}},{"id":"3.48","topic":"update scalar subquery","level":3,"prompt":"\u003cp>Tính lại \u003ccode>tot_cred\u003c/code> cho \u003cstrong>mọi\u003c/strong> sinh viên = tổng credits các môn đã \u003cstrong>qua\u003c/strong> (grade khác F và khác null). Sinh viên chưa qua môn nào thì tot_cred = \u003cstrong>0\u003c/strong> (không phải null).\u003c/p>","en":"","hint":"coalesce(sum(credits), 0) hoặc case when sum(credits) is not null then ... else 0 end","solution":"update student S\nset tot_cred = (select coalesce(sum(credits), 0)\n                from takes, course\n                where takes.course_id = course.course_id\n                  and S.ID = takes.ID\n                  and takes.grade \u003c> 'F'\n                  and takes.grade is not null);","check":"select ID, tot_cred from student order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","tot_cred"],"rows":[["00128","7"],["12345","14"],["19991","3"],["23121","3"],["44553","4"],["45678","7"],["54321","8"],["55739","3"],["70557","0"],["76543","7"],["76653","3"],["98765","7"],["98988","4"]]}},{"id":"3.49","topic":"alter table","level":2,"prompt":"\u003cp>Thêm cột \u003ccode>email varchar(50)\u003c/code> vào bảng student. Sau đó gán email \u003ccode>zhang@uni.edu\u003c/code> cho sinh viên \u003ccode>00128\u003c/code>.\u003c/p>","en":"","hint":"","solution":"alter table student add email varchar(50);\nupdate student set email = 'zhang@uni.edu' where ID = '00128';","check":"select ID, email from student order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","email"],"rows":[["00128","zhang@uni.edu"],["12345",null],["19991",null],["23121",null],["44553",null],["45678",null],["54321",null],["55739",null],["70557",null],["76543",null],["76653",null],["98765",null],["98988",null]]}},{"id":"3.50","topic":"create table","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>club(club_id char(4), name varchar(30) not null, dept_name varchar(20))\u003c/code> với primary key club_id và foreign key dept_name tham chiếu department. Thêm câu lạc bộ \u003ccode>C001\u003c/code>, \u003ccode>Robotics Club\u003c/code>, \u003ccode>Comp. Sci.\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create table club (\n  club_id   char(4),\n  name      varchar(30) not null,\n  dept_name varchar(20),\n  primary key (club_id),\n  foreign key (dept_name) references department);\ninsert into club values ('C001', 'Robotics Club', 'Comp. Sci.');","check":"select c.column_name, c.data_type, c.is_nullable,\n       (select count(*) from information_schema.table_constraints tc\n        where tc.table_name = 'club' and tc.constraint_type in ('PRIMARY KEY', 'FOREIGN KEY')) as key_constraints,\n       (select count(*) from club) as num_rows\nfrom information_schema.columns c\nwhere c.table_name = 'club'\norder by c.ordinal_position;","ordered":false,"fresh":false,"expected":{"fields":["column_name","data_type","is_nullable","key_constraints","num_rows"],"rows":[["club_id","character","NO","2","1"],["name","character varying","NO","2","1"],["dept_name","character varying","YES","2","1"]]}}]},{"key":"ch4","store":"4","short":"4","label":"Chương 4","navLabel":"Chương 4","kind":"Chương","title":"Intermediate SQL","titleVi":"SQL trung cấp","summary":"\u003ch3>1. Join expressions\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cú pháp\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>r natural join s\u003c/code>\u003c/td>\u003ctd>ghép theo \u003cstrong>mọi\u003c/strong> thuộc tính trùng tên, giữ 1 bản của cột chung\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>r join s using (A)\u003c/code>\u003c/td>\u003ctd>ghép theo các cột được liệt kê\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>r [inner] join s on P\u003c/code>\u003c/td>\u003ctd>ghép theo điều kiện P (giữ cả 2 cột chung)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>r left outer join s ...\u003c/code>\u003c/td>\u003ctd>như inner + các tuple của \u003cstrong>r\u003c/strong> không khớp (cột của s = null)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>r right outer join s ...\u003c/code>\u003c/td>\u003ctd>như inner + các tuple của \u003cstrong>s\u003c/strong> không khớp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>r full outer join s ...\u003c/code>\u003c/td>\u003ctd>như inner + tuple không khớp của \u003cstrong>cả hai\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Nguy hiểm của natural join\u003c/strong>: \u003ccode>student natural join takes natural join course\u003c/code> ghép thêm theo \u003cstrong>dept_name\u003c/strong> (vì student và course đều có dept_name) → mất các cặp mà sinh viên học môn của khoa khác. Cách đúng: \u003ccode>student natural join takes join course using (course_id)\u003c/code>.\u003c/p>\n\u003cp>\u003cem>Join condition\u003c/em> quyết định tuple nào khớp; \u003cem>join type\u003c/em> quyết định xử lý tuple \u003cstrong>không\u003c/strong> khớp.\u003c/p>\n\u003ch3>2. Views\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create view faculty as select ID, name, dept_name from instructor;\ncreate view departments_total_salary (dept_name, total_salary) as\n  select dept_name, sum(salary) from instructor group by dept_name;\u003c/code>\u003c/pre>\n\u003cul>\u003cli>View là \u003cstrong>virtual relation\u003c/strong>: chỉ lưu biểu thức, khi dùng thì được \u003cstrong>view expansion\u003c/strong> (thay tên view bằng định nghĩa, lặp lại tới khi hết view; dừng được nếu không recursive).\u003c/li>\u003cli>View có thể định nghĩa từ view khác (depend directly / depend on / recursive).\u003c/li>\u003cli>\u003cstrong>Materialized view\u003c/strong>: lưu kết quả vật lý → nhanh nhưng phải \u003cstrong>maintain\u003c/strong> khi bảng gốc đổi (PostgreSQL: \u003ccode>refresh materialized view\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Update qua view\u003c/strong> chỉ được với \u003cem>simple view\u003c/em>: from 1 bảng, select chỉ là tên cột (không biểu thức/aggregate/distinct), không group by/having; cột không có trong view sẽ là null.\u003c/li>\u003cli>\u003ccode>with check option\u003c/code>: cấm insert/update tạo ra dòng không thoả where của view.\u003c/li>\u003c/ul>\n\u003ch3>3. Transactions\u003c/h3>\n\u003cul>\u003cli>Một dãy câu lệnh là một \u003cstrong>đơn vị công việc\u003c/strong>; bắt đầu ngầm định, kết thúc bằng \u003cstrong>commit work\u003c/strong> (lưu vĩnh viễn) hoặc \u003cstrong>rollback work\u003c/strong> (huỷ tất cả).\u003c/li>\u003cli>\u003cstrong>Atomic\u003c/strong> (thực hiện hết hoặc như chưa từng xảy ra) và \u003cstrong>isolated\u003c/strong> khỏi các transaction đồng thời.\u003c/li>\u003cli>PostgreSQL: \u003ccode>begin; ... commit;\u003c/code> / \u003ccode>rollback;\u003c/code> / \u003ccode>savepoint s; rollback to s;\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>4. Integrity constraints\u003c/h3>\n\u003cul>\u003cli>Trên 1 relation: \u003ccode>not null\u003c/code>, \u003ccode>primary key\u003c/code>, \u003ccode>unique (A1..Am)\u003c/code> (candidate key, \u003cstrong>được phép null\u003c/strong>), \u003ccode>check (P)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Referential integrity\u003c/strong>: \u003ccode>foreign key (A) references r [(cols)]\u003c/code>, mặc định tham chiếu primary key.\u003c/li>\u003cli>Hành động khi vi phạm: mặc định \u003cstrong>reject\u003c/strong>; hoặc \u003ccode>on delete/on update\u003c/code> \u003cstrong>cascade | set null | set default\u003c/strong>.\u003c/li>\u003cli>Vòng tham chiếu (person.mother → person): chèn cha mẹ trước, hoặc để null rồi update, hoặc \u003cstrong>defer constraint checking\u003c/strong> (\u003ccode>deferrable initially deferred\u003c/code> — kiểm tra lúc commit).\u003c/li>\u003cli>\u003ccode>check\u003c/code> có subquery và \u003ccode>create assertion\u003c/code> là chuẩn SQL nhưng hầu như \u003cstr
