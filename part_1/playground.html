ong>không DBMS nào hỗ trợ\u003c/strong> (PostgreSQL cũng không) → dùng trigger.\u003c/li>\u003c/ul>\n\u003ch3>5. Kiểu dữ liệu & schema\u003c/h3>\n\u003cul>\u003cli>\u003ccode>date '2005-7-27'\u003c/code>, \u003ccode>time '09:00:30'\u003c/code>, \u003ccode>timestamp '2005-7-27 09:00:30.75'\u003c/code>, \u003ccode>interval '1' day\u003c/code>. Trừ hai date/time → interval; cộng interval vào date/time.\u003c/li>\u003cli>\u003cstrong>Large objects\u003c/strong>: \u003ccode>blob\u003c/code> (binary), \u003ccode>clob\u003c/code> (character) — truy vấn trả về con trỏ (PostgreSQL: \u003ccode>bytea\u003c/code>, \u003ccode>text\u003c/code>).\u003c/li>\u003cli>\u003ccode>create type Dollars as numeric(12,2) final\u003c/code> (chuẩn SQL) ~ PostgreSQL dùng \u003ccode>create domain\u003c/code>.\u003c/li>\u003cli>\u003ccode>create domain degree_level varchar(10) constraint degree_level_test check (value in ('Bachelors', 'Masters', 'Doctorate'))\u003c/code> — domain có thể có ràng buộc.\u003c/li>\u003c/ul>\n\u003ch3>6. Index\u003c/h3>\n\u003cp>\u003ccode>create index &lt;name&gt; on &lt;relation&gt; (attribute)\u003c/code> — tìm tuple theo giá trị mà không phải quét cả bảng.\u003c/p>\n\u003ch3>7. Authorization\u003c/h3>\n\u003cul>\u003cli>Privilege trên dữ liệu: \u003cstrong>select (read), insert, update, delete\u003c/strong>, \u003ccode>all privileges\u003c/code>. Trên schema: index, resources, alteration, drop.\u003c/li>\u003cli>\u003ccode>grant &lt;privileges&gt; on &lt;relation|view&gt; to &lt;user|public|role&gt;\u003c/code>; \u003ccode>revoke &lt;privileges&gt; on ... from ...\u003c/code> (\u003ccode>cascade\u003c/code> mặc định / \u003ccode>restrict\u003c/code>).\u003c/li>\u003cli>Grant trên view \u003cstrong>không\u003c/strong> kéo theo quyền trên bảng gốc. Người grant phải có quyền đó (hoặc là DBA).\u003c/li>\u003cli>\u003cstrong>Role\u003c/strong>: \u003ccode>create role instructor; grant instructor to Amit; grant select on takes to instructor;\u003c/code> Role có thể grant cho role khác → chuỗi kế thừa (teaching_assistant → instructor → dean).\u003c/li>\u003cli>\u003ccode>grant references (dept_name) on department to Mariano\u003c/code> — quyền tạo foreign key (vì FK hạn chế việc xoá/sửa bảng được tham chiếu).\u003c/li>\u003cli>\u003ccode>with grant option\u003c/code> — cho phép người nhận grant tiếp.\u003c/li>\u003c/ul>","quiz":[{"q":"Khác biệt giữa \u003ccode>course inner join prereq on course.course_id = prereq.course_id\u003c/code> và \u003ccode>course natural join prereq\u003c/code>?","options":["Không khác gì cả","Inner join on giữ 2 cột course_id; natural join chỉ giữ 1","Natural join giữ lại tuple không khớp","Inner join on không được dùng điều kiện bằng"],"answer":1,"explain":"Kết quả tương ứng cùng các cặp tuple, nhưng natural join gộp cột chung thành một cột."},{"q":"\u003ccode>student natural join takes natural join course\u003c/code> sai ở đâu?","options":["Không sai","Ghép thêm theo dept_name nên mất các môn học ngoài khoa của sinh viên","Sinh ra Cartesian product","Lỗi cú pháp"],"answer":1,"explain":"student và course đều có cột dept_name nên natural join so sánh luôn cột này."},{"q":"\u003ccode>course left outer join prereq\u003c/code> trả về course không có prereq như thế nào?","options":["Bị loại bỏ","Có mặt, các cột của prereq là null","Có mặt, cột prereq_id = course_id","Báo lỗi"],"answer":1,"explain":"Outer join tránh mất thông tin bằng cách điền null."},{"q":"View nào sau đây có thể update được trong hầu hết DBMS?","options":["select dept_name, avg(salary) from instructor group by dept_name","select ID, name, dept_name from instructor","select distinct dept_name from instructor","select ID, name, building from instructor, department where ..."],"answer":1,"explain":"Simple view: một bảng, chỉ tên cột, không aggregate/distinct/group by."},{"q":"Materialized view khác view thường ở điểm nào?","options":["Không thể truy vấn","Kết quả được lưu vật lý và cần được maintain khi bảng gốc thay đổi","Không thể định nghĩa bằng select","Tự động cho phép update"],"answer":1,"explain":"View thường chỉ lưu biểu thức và được expand khi dùng."},{"q":"Khác biệt giữa unique và primary key?","options":["Unique không xác định candidate key","Thuộc tính unique được phép null, primary key thì không","Một bảng chỉ có 1 unique constraint","Không có khác biệt"],"answer":1,"explain":"Candidate key khai báo bằng unique được phép null."},{"q":"Bảng course có \u003ccode>foreign key (dept_name) references department on delete cascade\u003c/code>. Xoá khoa Biology thì?","options":["Bị từ chối","Các course của Biology bị xoá theo","dept_name của các course đó thành null","Không ảnh hưởng gì"],"answer":1,"explain":"cascade lan truyền việc xoá sang bảng tham chiếu. (set null mới đặt null.)"},{"q":"Làm sao chèn người mà cha mẹ chưa có trong bảng person khi father/mother là foreign key NOT NULL?","options":["Không thể","Defer constraint checking tới cuối transaction","Dùng on delete cascade","Dùng unique"],"answer":1,"explain":"Với not null thì không thể chèn null trước; phải defer (deferrable initially deferred)."},{"q":"Kết quả của \u003ccode>timestamp '2018-03-02 10:00' - timestamp '2018-03-01 08:00'\u003c/code> có kiểu gì?","options":["date","integer","interval","timestamp"],"answer":2,"explain":"Hiệu hai giá trị thời gian là interval (ở đây 1 day 02:00:00)."},{"q":"Domain khác type (trong chuẩn SQL) ở điểm nào?","options":["Domain có thể có ràng buộc như not null, check","Type có thể có check","Domain chỉ dùng cho số","Không khác"],"answer":0,"explain":"Domain có thể khai báo constraint; type (strongly typed) thì không."},{"q":"User U có quyền select trên view geo_instructor nhưng không có quyền trên instructor. U chạy \u003ccode>select * from geo_instructor\u003c/code>?","options":["Bị từ chối","Thành công (nếu người tạo view có quyền trên instructor)","Chỉ thấy cột ID","View bị xoá"],"answer":1,"explain":"Grant trên view không cần quyền trên bảng gốc; nhưng người tạo view phải có quyền đó."},{"q":"\u003ccode>revoke select on department from Amit cascade\u003c/code> khi Amit đã grant tiếp cho Satoshi (with grant option)?","options":["Satoshi vẫn giữ quyền","Satoshi cũng mất quyền (nếu không được ai khác cấp)","Lỗi","Amit vẫn giữ quyền"],"answer":1,"explain":"Mọi privilege phụ thuộc privilege bị revoke cũng bị revoke. restrict thì báo lỗi thay vì cascade."},{"q":"Vì sao cần privilege references để tạo foreign key?","options":["Vì FK làm chậm truy vấn","Vì FK có thể hạn chế việc xoá/cập nhật trên bảng được tham chiếu của người khác","Vì FK tạo index","Không cần"],"answer":1,"explain":"Ai đó tạo FK tới bảng department sẽ ngăn chủ bảng xoá khoa đang được tham chiếu."}],"questions":[{"q":"View \u003ccode>instructor_info(ID, name, building)\u003c/code> = instructor ⋈ department. Vì sao \u003ccode>insert into instructor_info values ('69987', 'White', 'Taylor')\u003c/code> không dịch được một cách duy nhất?","en":"","answer":"\u003cp>Phải chèn vào instructor một dept_name — nhưng toà Taylor có \u003cstrong>nhiều khoa\u003c/strong> (Comp. Sci., Elec. Eng.) → không biết chọn khoa nào; nếu \u003cstrong>không\u003c/strong> khoa nào ở Taylor thì không thể chèn sao cho tuple xuất hiện trong view.\u003c/p>"},{"q":"Chèn \u003ccode>('25566', 'Brown', 'Biology', 100000)\u003c/code> vào view \u003ccode>history_instructors\u003c/code> (where dept_name = 'History') thì sao? Làm cách nào để chặn?","en":"","answer":"\u003cp>Mặc định tuple được chèn vào instructor nhưng \u003cstrong>không xuất hiện\u003c/strong> trong view (vì không thoả where). Thêm \u003ccode>with check option\u003c/code> vào định nghĩa view để DBMS từ chối.\u003c/p>"},{"q":"Viết lại (view expansion) \u003ccode>physics_fall_2017_watson\u003c/code> thành một câu không còn dùng view nào.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select course_id, room_number\nfrom (select course.course_id, building, room_number\n      from course, section\n      where course.course_id = section.course_id\n        and course.dept_name = 'Physics'\n        and section.semester = 'Fall'\n        and section.year = 2017) as t\nwhere building = 'Watson';\u003c/code>\u003c/pre>"},{"q":"Một transaction gồm 2 câu update chuyển 10 000 budget từ Finance sang History. Câu thứ 2 vi phạm check constraint. Điều gì xảy ra với câu thứ nhất?","en":"","answer":"\u003cp>Transaction là atomic: khi một câu lỗi, transaction phải \u003cstrong>rollback\u003c/strong> toàn bộ, nên câu thứ nhất cũng bị huỷ — database như chưa từng có transaction. (Trong PostgreSQL, sau lỗi transaction ở trạng thái aborted, \u003ccode>commit\u003c/code> cũng chỉ thực hiện rollback.)\u003c/p>"},{"q":"Viết assertion (chuẩn SQL): tot_cred của mỗi sinh viên bằng tổng credits các môn đã qua. Vì sao thực tế ít DBMS hỗ trợ?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create assertion credits_earned_constraint check (\n  not exists (select ID from student\n              where tot_cred &lt;&gt; (select coalesce(sum(credits), 0)\n                                 from takes natural join course\n                                 where student.ID = takes.ID\n                                   and grade is not null and grade &lt;&gt; 'F')));\u003c/code>\u003c/pre>\n\u003cp>Kiểm tra assertion sau \u003cstrong>mọi\u003c/strong> thay đổi trên student, takes, course rất tốn kém → hầu hết DBMS không hỗ trợ; thay bằng trigger.\u003c/p>"},{"q":"Phân biệt 4 loại privilege thay đổi schema (index, resources, alteration, drop).","en":"","answer":"\u003cp>\u003cstrong>index\u003c/strong>: tạo/xoá index · \u003cstrong>resources\u003c/strong>: tạo relation mới · \u003cstrong>alteration\u003c/strong>: thêm/xoá thuộc tính · \u003cstrong>drop\u003c/strong>: xoá relation.\u003c/p>"}],"exercises":[{"id":"4.01","topic":"natural join","level":1,"prompt":"\u003cp>Dùng \u003cstrong>natural join\u003c/strong>: name của sinh viên và course_id các môn họ đã học.\u003c/p>","en":"","hint":"","solution":"select name, course_id from student natural join takes;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","course_id"],"rows":[["Zhang","CS-101"],["Zhang","CS-347"],["Shankar","CS-101"],["Shankar","CS-190"],["Shankar","CS-315"],["Shankar","CS-347"],["Brandt","HIS-351"],["Chavez","FIN-201"],["Peltier","PHY-101"],["Levy","CS-101"],["Levy","CS-101"],["Levy","CS-319"],["Williams","CS-101"],["Williams","CS-190"],["Sanchez","MU-199"],["Brown","CS-101"],["Brown","CS-319"],["Aoi","EE-181"],["Bourikas","CS-101"],["Bourikas","CS-315"],["Tanaka","BIO-101"],["Tanaka","BIO-301"]]}},{"id":"4.02","topic":"natural join (đúng)","level":2,"prompt":"\u003cp>name của sinh viên và \u003cstrong>title\u003c/strong> các môn họ đã học — cách \u003cstrong>đúng\u003c/strong>, tránh bẫy natural join với dept_name.\u003c/p>","en":"","hint":"student natural join takes, rồi join course using (course_id) (hoặc where takes.course_id = course.course_id)","solution":"select name, title\nfrom student natural join takes join course using (course_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","title"],"rows":[["Zhang","Intro. to Computer Science"],["Zhang","Database System Concepts"],["Shankar","Intro. to Computer Science"],["Shankar","Game Design"],["Shankar","Robotics"],["Shankar","Database System Concepts"],["Brandt","World History"],["Chavez","Investment Banking"],["Peltier","Physical Principles"],["Levy","Intro. to Computer Science"],["Levy","Intro. to Computer Science"],["Levy","Image Processing"],["Williams","Intro. to Computer Science"],["Williams","Game Design"],["Sanchez","Music Video Production"],["Brown","Intro. to Computer Science"],["Brown","Image Processing"],["Aoi","Intro. to Digital Systems"],["Bourikas","Intro. to Computer Science"],["Bourikas","Robotics"],["Tanaka","Intro. to Biology"],["Tanaka","Genetics"]]}},{"id":"4.03","topic":"natural join (bẫy)","level":2,"prompt":"\u003cp>Đếm số dòng của cách \u003cstrong>sai\u003c/strong> \u003ccode>student natural join takes natural join course\u003c/code>. So sánh với số dòng của 4.02 để thấy bao nhiêu cặp bị mất.\u003c/p>","en":"","hint":"","solution":"select count(*) from student natural join takes natural join course;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["17"]]}},{"id":"4.04","topic":"join using","level":1,"prompt":"\u003cp>Dùng \u003ccode>join ... using\u003c/code>: ID instructor, course_id và \u003cstrong>building\u003c/strong> nơi section đó học (instructor dạy section).\u003c/p>","en":"","hint":"","solution":"select ID, course_id, building\nfrom teaches join section using (course_id, sec_id, semester, year);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","course_id","building"],"rows":[["10101","CS-101","Packard"],["10101","CS-315","Watson"],["10101","CS-347","Taylor"],["12121","FIN-201","Packard"],["15151","MU-199","Packard"],["22222","PHY-101","Watson"],["32343","HIS-351","Painter"],["45565","CS-101","Packard"],["45565","CS-319","Watson"],["76766","BIO-101","Painter"],["76766","BIO-301","Painter"],["83821","CS-190","Taylor"],["83821","CS-190","Taylor"],["83821","CS-319","Taylor"],["98345","EE-181","Taylor"]]}},{"id":"4.05","topic":"inner join on","level":1,"prompt":"\u003cp>Dùng \u003ccode>inner join ... on\u003c/code>: tất cả cột của course và prereq ghép theo course_id.\u003c/p>","en":"","hint":"","solution":"select * from course inner join prereq on course.course_id = prereq.course_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title","dept_name","credits","course_id","prereq_id"],"rows":[["BIO-301","Genetics","Biology","4","BIO-301","BIO-101"],["BIO-399","Computational Biology","Biology","3","BIO-399","BIO-101"],["CS-190","Game Design","Comp. Sci.","4","CS-190","CS-101"],["CS-315","Robotics","Comp. Sci.","3","CS-315","CS-101"],["CS-319","Image Processing","Comp. Sci.","3","CS-319","CS-101"],["CS-347","Database System Concepts","Comp. Sci.","3","CS-347","CS-101"],["EE-181","Intro. to Digital Systems","Elec. Eng.","3","EE-181","PHY-101"]]}},{"id":"4.06","topic":"left outer join","level":2,"prompt":"\u003cp>Mọi course cùng prereq_id của nó (course không có prereq vẫn xuất hiện với prereq_id = null). Trả về course_id, title, prereq_id.\u003c/p>","en":"","hint":"","solution":"select course_id, title, prereq_id\nfrom course natural left outer join prereq;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title","prereq_id"],"rows":[["BIO-301","Genetics","BIO-101"],["BIO-399","Computational Biology","BIO-101"],["CS-190","Game Design","CS-101"],["CS-315","Robotics","CS-101"],["CS-319","Image Processing","CS-101"],["CS-347","Database System Concepts","CS-101"],["EE-181","Intro. to Digital Systems","PHY-101"],["MU-199","Music Video Production",null],["HIS-351","World History",null],["FIN-201","Investment Banking",null],["PHY-101","Physical Principles",null],["BIO-101","Intro. to Biology",null],["CS-101","Intro. to Computer Science",null]]}},{"id":"4.07","topic":"left outer join","level":2,"prompt":"\u003cp>Dùng \u003cstrong>left outer join\u003c/strong> (không dùng except/not in): ID và name của sinh viên \u003cstrong>chưa học\u003c/strong> môn nào.\u003c/p>","en":"","hint":"","solution":"select student.ID, name\nfrom student left outer join takes on student.ID = takes.ID\nwhere takes.ID is null;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["70557","Snow"]]}},{"id":"4.08","topic":"right outer join","level":2,"prompt":"\u003cp>Dùng \u003cstrong>right outer join\u003c/strong> giữa section và course: liệt kê course_id, title, semester, year của mọi course, kể cả course chưa từng mở section.\u003c/p>","en":"","hint":"","solution":"select course.course_id, title, semester, year\nfrom section right outer join course on section.course_id = course.course_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","title","semester","year"],"rows":[["BIO-101","Intro. to Biology","Summer","2017"],["BIO-301","Genetics","Summer","2018"],["CS-101","Intro. to Computer Science","Fall","2017"],["CS-101","Intro. to Computer Science","Spring","2018"],["CS-190","Game Design","Spring","2017"],["CS-190","Game Design","Spring","2017"],["CS-315","Robotics","Spring","2018"],["CS-319","Image Processing","Spring","2018"],["CS-319","Image Processing","Spring","2018"],["CS-347","Database System Concepts","Fall","2017"],["EE-181","Intro. to Digital Systems","Spring","2017"],["FIN-201","Investment Banking","Spring","2018"],["HIS-351","World History","Spring","2018"],["MU-199","Music Video Production","Spring","2018"],["PHY-101","Physical Principles","Fall","2017"],["BIO-399","Computational Biology",null,null]]}},{"id":"4.09","topic":"full outer join","level":3,"prompt":"\u003cp>Dùng \u003cstrong>full outer join\u003c/strong> hai tập course_id (không trùng): mở ở Fall 2017 và mở ở Spring 2018. Trả về 2 cột \u003ccode>fall_2017\u003c/code>, \u003ccode>spring_2018\u003c/code>; môn chỉ mở một kỳ thì cột kia là null.\u003c/p>","en":"","hint":"","solution":"select f.course_id as fall_2017, s.course_id as spring_2018\nfrom (select distinct course_id from section where semester = 'Fall' and year = 2017) as f\n     full outer join\n     (select distinct course_id from section where semester = 'Spring' and year = 2018) as s\n     on f.course_id = s.course_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["fall_2017","spring_2018"],"rows":[["CS-101","CS-101"],[null,"CS-315"],[null,"CS-319"],["CS-347",null],[null,"FIN-201"],[null,"HIS-351"],[null,"MU-199"],["PHY-101",null]]}},{"id":"4.10","topic":"outer join + count","level":2,"prompt":"\u003cp>Với \u003cstrong>mọi\u003c/strong> instructor: ID, name và số section đã dạy (\u003ccode>num_sections\u003c/code>, bằng \u003cstrong>0\u003c/strong> nếu chưa dạy).\u003c/p>","en":"","hint":"count(teaches.course_id) — count bỏ qua null, còn count(*) thì không!","solution":"select instructor.ID, name, count(teaches.course_id) as num_sections\nfrom instructor left outer join teaches on instructor.ID = teaches.ID\ngroup by instructor.ID, name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","num_sections"],"rows":[["83821","Brandt","3"],["76543","Singh","0"],["33456","Gold","0"],["58583","Califieri","0"],["22222","Einstein","1"],["76766","Crick","2"],["12121","Wu","1"],["98345","Kim","1"],["15151","Mozart","1"],["32343","El Said","1"],["10101","Srinivasan","3"],["45565","Katz","2"]]}},{"id":"4.11","topic":"create view","level":1,"prompt":"\u003cp>Tạo view \u003ccode>faculty\u003c/code> gồm ID, name, dept_name của instructor (ẩn salary). Sau đó dùng view tìm tên giảng viên khoa \u003ccode>Biology\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create view faculty as\n  select ID, name, dept_name from instructor;\nselect name from faculty where dept_name = 'Biology';","check":"select * from faculty;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name"],"rows":[["10101","Srinivasan","Comp. Sci."],["12121","Wu","Finance"],["15151","Mozart","Music"],["22222","Einstein","Physics"],["32343","El Said","History"],["33456","Gold","Physics"],["45565","Katz","Comp. Sci."],["58583","Califieri","History"],["76543","Singh","Finance"],["76766","Crick","Biology"],["83821","Brandt","Comp. Sci."],["98345","Kim","Elec. Eng."]]}},{"id":"4.12","topic":"create view","level":1,"prompt":"\u003cp>Tạo view \u003ccode>departments_total_salary(dept_name, total_salary)\u003c/code> chứa tổng lương mỗi khoa.\u003c/p>","en":"","hint":"","solution":"create view departments_total_salary (dept_name, total_salary) as\n  select dept_name, sum(salary) from instructor group by dept_name;","check":"select * from departments_total_salary;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","total_salary"],"rows":[["Finance","170000"],["History","122000"],["Physics","182000"],["Music","40000"],["Comp. Sci.","232000"],["Biology","72000"],["Elec. Eng.","80000"]]}},{"id":"4.13","topic":"view of view","level":2,"prompt":"\u003cp>Tạo view \u003ccode>physics_fall_2017(course_id, sec_id, building, room_number)\u003c/code> — các section của khoa Physics mở ở Fall 2017; rồi view \u003ccode>physics_fall_2017_watson(course_id, room_number)\u003c/code> dựa trên view thứ nhất, chỉ lấy building \u003ccode>Watson\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create view physics_fall_2017 as\n  select course.course_id, sec_id, building, room_number\n  from course, section\n  where course.course_id = section.course_id\n    and course.dept_name = 'Physics'\n    and section.semester = 'Fall'\n    and section.year = 2017;\ncreate view physics_fall_2017_watson as\n  select course_id, room_number\n  from physics_fall_2017\n  where building = 'Watson';","check":"select * from physics_fall_2017_watson;","ordered":false,"fresh":false,"expected":{"fields":["course_id","room_number"],"rows":[["PHY-101","100"]]}},{"id":"4.14","topic":"update view","level":2,"prompt":"\u003cp>Tạo view \u003ccode>faculty\u003c/code> (như 4.11) rồi \u003cstrong>insert qua view\u003c/strong> giảng viên \u003ccode>('30765', 'Green', 'Music')\u003c/code>. Salary trong bảng instructor sẽ là gì?\u003c/p>","en":"","hint":"","solution":"create view faculty as\n  select ID, name, dept_name from instructor;\ninsert into faculty values ('30765', 'Green', 'Music');","check":"select * from instructor where ID = '30765';","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["30765","Green","Music",null]]}},{"id":"4.15","topic":"with check option","level":2,"prompt":"\u003cp>Tạo view \u003ccode>history_instructors\u003c/code> (mọi cột của instructor khoa History) \u003cstrong>with check option\u003c/strong>, để chèn giảng viên khoa khác qua view sẽ bị từ chối.\u003c/p>","en":"","hint":"","solution":"create view history_instructors as\n  select * from instructor where dept_name = 'History'\n  with check option;","check":"select (select count(*) from history_instructors) as num_rows,\n       try_sql($$insert into history_instructors values ('25566', 'Brown', 'Biology', 100000)$$) as insert_biology,\n       try_sql($$insert into history_instructors values ('25567', 'Ng', 'History', 70000)$$) as insert_history;","ordered":false,"fresh":false,"expected":{"fields":["num_rows","insert_biology","insert_history"],"rows":[["2","44000","ok"]]}},{"id":"4.16","topic":"materialized view","level":3,"prompt":"\u003cp>Tạo \u003cstrong>materialized view\u003c/strong> \u003ccode>dept_stats(dept_name, num_instructors)\u003c/code>. Sau đó chèn instructor \u003ccode>('99999', 'Lee', 'Music', 50000)\u003c/code> và \u003cstrong>refresh\u003c/strong> view để số liệu được cập nhật.\u003c/p>","en":"","hint":"create materialized view ... ; insert ...; refresh materialized view dept_stats;","solution":"create materialized view dept_stats (dept_name, num_instructors) as\n  select dept_name, count(*) from instructor group by dept_name;\ninsert into instructor values ('99999', 'Lee', 'Music', 50000);\nrefresh materialized view dept_stats;","check":"select * from dept_stats;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","num_instructors"],"rows":[["Finance","2"],["History","2"],["Physics","2"],["Music","2"],["Comp. Sci.","3"],["Biology","1"],["Elec. Eng.","1"]]}},{"id":"4.17","topic":"commit","level":2,"prompt":"\u003cp>Viết \u003cstrong>một transaction\u003c/strong> chuyển 10000 budget từ khoa \u003ccode>Finance\u003c/code> sang khoa \u003ccode>History\u003c/code> rồi commit. \u003cem>(Bài này chạy trên CSDL mới, được phép dùng begin/commit.)\u003c/em>\u003c/p>","en":"","hint":"","solution":"begin;\nupdate department set budget = budget - 10000 where dept_name = 'Finance';\nupdate department set budget = budget + 10000 where dept_name = 'History';\ncommit;","check":"select dept_name, budget from department order by dept_name;","ordered":false,"fresh":true,"expected":{"fields":["dept_name","budget"],"rows":[["Biology","90000"],["Comp. Sci.","100000"],["Elec. Eng.","85000"],["Finance","110000"],["History","60000"],["Music","80000"],["Physics","70000"]]}},{"id":"4.18","topic":"rollback","level":1,"prompt":"\u003cp>Mở transaction, \u003cstrong>xoá toàn bộ\u003c/strong> takes, đếm số dòng của takes (trong transaction), rồi \u003cstrong>rollback\u003c/strong>. Câu lệnh \u003cstrong>cuối cùng\u003c/strong> của bạn: đếm lại số dòng của takes sau khi rollback.\u003c/p>","en":"","hint":"","solution":"begin;\ndelete from takes;\nselect count(*) from takes;   -- 0 dòng, nhưng chưa commit\nrollback;\nselect count(*) from takes;   -- dữ liệu đã trở lại","check":null,"ordered":false,"fresh":true,"expected":{"fields":["count"],"rows":[["22"]]}},{"id":"4.19","topic":"savepoint","level":3,"prompt":"\u003cp>Trong một transaction: tăng 10% lương khoa \u003ccode>Comp. Sci.\u003c/code>; tạo \u003ccode>savepoint s1\u003c/code>; xoá instructor khoa \u003ccode>Music\u003c/code>; quay lại \u003ccode>s1\u003c/code> (huỷ việc xoá); commit.\u003c/p>","en":"","hint":"","solution":"begin;\nupdate instructor set salary = salary * 1.10 where dept_name = 'Comp. Sci.';\nsavepoint s1;\ndelete from instructor where dept_name = 'Music';\nrollback to savepoint s1;\ncommit;","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":true,"expected":{"fields":["id","salary"],"rows":[["10101","71500"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","82500"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","101200"],["98345","80000"]]}},{"id":"4.20","topic":"check / pk / fk","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>scholarship\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>student_id varchar(5)\u003c/code> tham chiếu student (xoá sinh viên thì xoá học bổng — \u003cstrong>on delete cascade\u003c/strong>)\u003c/li>\u003cli>\u003ccode>semester varchar(6)\u003c/code> chỉ nhận Fall, Winter, Spring, Summer\u003c/li>\u003cli>\u003ccode>year numeric(4,0)\u003c/code>\u003c/li>\u003cli>\u003ccode>amount numeric(8,2)\u003c/code> \u003cstrong>not null\u003c/strong>, phải \u003cstrong>> 0\u003c/strong>\u003c/li>\u003cli>primary key (student_id, semester, year)\u003c/li>\u003c/ul>","en":"","hint":"","solution":"create table scholarship (\n  student_id varchar(5),\n  semester   varchar(6) check (semester in ('Fall', 'Winter', 'Spring', 'Summer')),\n  year       numeric(4,0),\n  amount     numeric(8,2) not null check (amount > 0),\n  primary key (student_id, semester, year),\n  foreign key (student_id) references student (ID) on delete cascade\n);","check":"select try_sql($$insert into scholarship values ('12345', 'Fall', 2018, 500)$$)    as valid,\n       try_sql($$insert into scholarship values ('12345', 'Fall', 2018, 700)$$)    as dup_pk,\n       try_sql($$insert into scholarship values ('12345', 'Autumn', 2018, 500)$$)  as bad_semester,\n       try_sql($$insert into scholarship values ('12345', 'Spring', 2019, -1)$$)   as bad_amount,\n       try_sql($$insert into scholarship values ('12345', 'Spring', 2019, null)$$) as null_amount,\n       try_sql($$insert into scholarship values ('99999', 'Spring', 2019, 100)$$)  as bad_student,\n       sql_value($$select count(*) from scholarship$$)                             as rows_before,\n       try_sql($$delete from student where ID = '12345'$$)                        as delete_student,\n       sql_value($$select count(*) from scholarship$$)                             as rows_after;","ordered":false,"fresh":false,"expected":{"fields":["valid","dup_pk","bad_semester","bad_amount","null_amount","bad_student","rows_before","delete_student","rows_after"],"rows":[["ok","23505","23514","23514","23502","23503","1","ok","0"]]}},{"id":"4.21","topic":"unique","level":2,"prompt":"\u003cp>Thêm cột \u003ccode>email varchar(50)\u003c/code> vào instructor với ràng buộc \u003cstrong>unique\u003c/strong>. (Hệ thống sẽ thử: gán cùng một email cho 2 người phải lỗi, nhưng nhiều người cùng email null thì được.)\u003c/p>","en":"","hint":"","solution":"alter table instructor add column email varchar(50) unique;","check":"select try_sql($$update instructor set email = 'a@uni.edu' where ID = '10101'$$) as first_email,\n       try_sql($$update instructor set email = 'a@uni.edu' where ID = '12121'$$) as duplicate_email,\n       sql_value($$select count(*) from instructor where email is null$$)       as null_emails;","ordered":false,"fresh":false,"expected":{"fields":["first_email","duplicate_email","null_emails"],"rows":[["ok","23505","11"]]}},{"id":"4.22","topic":"on delete set null","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>lab(lab_id varchar(5) primary key, dept_name varchar(20))\u003c/code> với foreign key dept_name → department \u003cstrong>on delete set null\u003c/strong>. Chèn \u003ccode>('L1', 'Physics')\u003c/code>, \u003ccode>('L2', 'Music')\u003c/code>, rồi xoá khoa \u003ccode>Music\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create table lab (\n  lab_id    varchar(5) primary key,\n  dept_name varchar(20) references department on delete set null\n);\ninsert into lab values ('L1', 'Physics'), ('L2', 'Music');\ndelete from department where dept_name = 'Music';","check":"select lab_id, dept_name,\n       (select delete_rule from information_schema.referential_constraints rc\n        join information_schema.table_constraints tc on tc.constraint_name = rc.constraint_name\n        where tc.table_name = 'lab') as delete_rule\nfrom lab order by lab_id;","ordered":false,"fresh":false,"expected":{"fields":["lab_id","dept_name","delete_rule"],"rows":[["L1","Physics","SET NULL"],["L2",null,"SET NULL"]]}},{"id":"4.23","topic":"deferred constraint","level":3,"prompt":"\u003cp>Tạo bảng \u003ccode>person(ID char(10) primary key, name char(40), mother char(10), father char(10))\u003c/code>, mother và father là foreign key tham chiếu chính person và là \u003cstrong>deferrable initially deferred\u003c/strong>.\u003cbr>Trong \u003cstrong>một transaction\u003c/strong>, chèn con \u003ccode>('P3', 'Child', 'P1', 'P2')\u003c/code> \u003cstrong>trước\u003c/strong>, rồi mới chèn \u003ccode>('P1', 'Mom', null, null)\u003c/code>, \u003ccode>('P2', 'Dad', null, null)\u003c/code>, rồi commit.\u003c/p>","en":"","hint":"","solution":"create table person (\n  ID     char(10) primary key,\n  name   char(40),\n  mother char(10) references person deferrable initially deferred,\n  father char(10) references person deferrable initially deferred\n);\nbegin;\ninsert into person values ('P3', 'Child', 'P1', 'P2');\ninsert into person values ('P1', 'Mom', null, null);\ninsert into person values ('P2', 'Dad', null, null);\ncommit;","check":"select trim(ID), trim(name), trim(mother), trim(father) from person order by ID;","ordered":false,"fresh":true,"expected":{"fields":["btrim","btrim","btrim","btrim"],"rows":[["P1","Mom",null,null],["P2","Dad",null,null],["P3","Child","P1","P2"]]}},{"id":"4.24","topic":"timestamp / interval","level":2,"prompt":"\u003cp>Bảng \u003ccode>account_txn(account_number, date_time, value)\u003c/code>: với mỗi tài khoản, trả về account_number và \u003cstrong>khoảng thời gian\u003c/strong> giữa giao dịch đầu tiên và cuối cùng (\u003ccode>span\u003c/code>, kiểu interval).\u003c/p>","en":"","hint":"","solution":"select account_number, max(date_time) - min(date_time) as span\nfrom account_txn\ngroup by account_number;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["account_number","span"],"rows":[["A-215","54 days 02:10:00"],["A-101","46 days 07:45:00"]]}},{"id":"4.25","topic":"date + interval","level":2,"prompt":"\u003cp>Từ \u003ccode>daily_sales\u003c/code>: trả về sale_date và ngày \u003cstrong>sau đó 1 tuần\u003c/strong> (\u003ccode>one_week_later\u003c/code>), chỉ cho các ngày có value > 100, sắp theo sale_date.\u003c/p>","en":"","hint":"sale_date + interval '7 day'","solution":"select sale_date, sale_date + interval '7 day' as one_week_later\nfrom daily_sales\nwhere value > 100\norder by sale_date;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["sale_date","one_week_later"],"rows":[["2018-03-01","2018-03-08 00:00:00"],["2018-03-03","2018-03-10 00:00:00"],["2018-03-04","2018-03-11 00:00:00"],["2018-03-06","2018-03-13 00:00:00"]]}},{"id":"4.26","topic":"domain","level":2,"prompt":"\u003cp>Tạo domain \u003ccode>degree_level varchar(10)\u003c/code> chỉ nhận \u003ccode>Bachelors\u003c/code>, \u003ccode>Masters\u003c/code>, \u003ccode>Doctorate\u003c/code> (đặt tên constraint \u003ccode>degree_level_test\u003c/code>). Thêm cột \u003ccode>degree degree_level\u003c/code> vào student.\u003c/p>","en":"","hint":"","solution":"create domain degree_level varchar(10)\n  constraint degree_level_test\n  check (value in ('Bachelors', 'Masters', 'Doctorate'));\nalter table student add column degree degree_level;","check":"select try_sql($$update student set degree = 'Masters' where ID = '00128'$$) as masters,\n       try_sql($$update student set degree = 'PhD' where ID = '00128'$$)     as phd,\n       sql_value($$select degree from student where ID = '00128'$$)         as zhang_degree;","ordered":false,"fresh":false,"expected":{"fields":["masters","phd","zhang_degree"],"rows":[["ok","23514","Masters"]]}},{"id":"4.27","topic":"domain as type","level":2,"prompt":"\u003cp>Chuẩn SQL viết \u003ccode>create type Dollars as numeric(12,2) final\u003c/code>. Trong PostgreSQL hãy tạo \u003cstrong>domain\u003c/strong> \u003ccode>dollars\u003c/code> là numeric(12,2) và \u003cstrong>không âm\u003c/strong>, rồi tạo bảng \u003ccode>donation(donor varchar(30), amount dollars)\u003c/code> và chèn \u003ccode>('Alice', 1500.5)\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create domain dollars as numeric(12,2) check (value >= 0);\ncreate table donation (donor varchar(30), amount dollars);\ninsert into donation values ('Alice', 1500.5);","check":"select (select amount from donation where donor = 'Alice') as alice,\n       try_sql($$insert into donation values ('Bob', -10)$$) as negative;","ordered":false,"fresh":false,"expected":{"fields":["alice","negative"],"rows":[["1500.5","23514"]]}},{"id":"4.28","topic":"index","level":1,"prompt":"\u003cp>Tạo index tên \u003ccode>instructor_dept_idx\u003c/code> trên cột dept_name của instructor.\u003c/p>","en":"","hint":"","solution":"create index instructor_dept_idx on instructor (dept_name);","check":"select indexname from pg_indexes where tablename = 'instructor' and indexname = 'instructor_dept_idx';","ordered":false,"fresh":false,"expected":{"fields":["indexname"],"rows":[["instructor_dept_idx"]]}},{"id":"4.29","topic":"grant","level":2,"prompt":"\u003cp>Tạo role \u003ccode>grader\u003c/code>. Cấp cho grader quyền \u003cstrong>select\u003c/strong> trên takes và quyền \u003cstrong>update chỉ trên cột grade\u003c/strong> của takes.\u003c/p>","en":"","hint":"grant update (grade) on takes to grader","solution":"create role grader;\ngrant select on takes to grader;\ngrant update (grade) on takes to grader;","check":"select has_table_privilege('grader', 'takes', 'select')            as can_select,\n       has_table_privilege('grader', 'takes', 'insert')            as can_insert,\n       has_column_privilege('grader', 'takes', 'grade', 'update') as can_update_grade,\n       has_column_privilege('grader', 'takes', 'id', 'update')    as can_update_id;","ordered":false,"fresh":false,"expected":{"fields":["can_select","can_insert","can_update_grade","can_update_id"],"rows":[["true","false","true","false"]]}},{"id":"4.30","topic":"revoke","level":2,"prompt":"\u003cp>Tạo role \u003ccode>clerk\u003c/code>, cấp \u003cstrong>select, insert, update\u003c/strong> trên department; sau đó \u003cstrong>thu hồi\u003c/strong> insert và update.\u003c/p>","en":"","hint":"","solution":"create role clerk;\ngrant select, insert, update on department to clerk;\nrevoke insert, update on department from clerk;","check":"select has_table_privilege('clerk', 'department', 'select') as s,\n       has_table_privilege('clerk', 'department', 'insert') as i,\n       has_table_privilege('clerk', 'department', 'update') as u;","ordered":false,"fresh":false,"expected":{"fields":["s","i","u"],"rows":[["true","false","false"]]}},{"id":"4.31","topic":"roles chain","level":3,"prompt":"\u003cp>Tạo chuỗi role như slide: \u003ccode>teaching_assistant\u003c/code>, \u003ccode>instructor_role\u003c/code>, \u003ccode>dean\u003c/code>. Grant select trên takes cho teaching_assistant; grant teaching_assistant cho instructor_role; grant instructor_role cho dean. (dean phải \u003cstrong>kế thừa\u003c/strong> quyền select trên takes.)\u003c/p>","en":"","hint":"","solution":"create role teaching_assistant;\ncreate role instructor_role;\ncreate role dean;\ngrant select on takes to teaching_assistant;\ngrant teaching_assistant to instructor_role;\ngrant instructor_role to dean;","check":"select has_table_privilege('dean', 'takes', 'select')               as dean_can_read_takes,\n       pg_has_role('dean', 'teaching_assistant', 'member')              as dean_is_ta,\n       has_table_privilege('teaching_assistant', 'instructor', 'select') as ta_can_read_instructor;","ordered":false,"fresh":false,"expected":{"fields":["dean_can_read_takes","dean_is_ta","ta_can_read_instructor"],"rows":[["true","true","false"]]}},{"id":"4.32","topic":"authorization on views","level":3,"prompt":"\u003cp>Tạo view \u003ccode>physics_instructor\u003c/code> (mọi cột instructor khoa Physics) và role \u003ccode>phys_staff\u003c/code>; chỉ grant select trên \u003cstrong>view\u003c/strong> cho phys_staff. (Hệ thống sẽ \u003ccode>set role phys_staff\u003c/code> rồi đọc view: phải đọc được view nhưng không đọc được bảng instructor.)\u003c/p>","en":"","hint":"","solution":"create view physics_instructor as\n  select * from instructor where dept_name = 'Physics';\ncreate role phys_staff;\ngrant select on physics_instructor to phys_staff;","check":"set role phys_staff;\nselect ID, name,\n       try_sql($$select * from instructor$$) as read_base_table\nfrom physics_instructor;","ordered":false,"fresh":false,"expected":{"fields":["id","name","read_base_table"],"rows":[["22222","Einstein","42501"],["33456","Gold","42501"]]}},{"id":"4.33","topic":"with grant option","level":3,"prompt":"\u003cp>Tạo role \u003ccode>amit\u003c/code>, \u003ccode>satoshi\u003c/code>. Grant select trên department cho amit \u003cstrong>with grant option\u003c/strong>. Sau đó đóng vai amit (\u003ccode>set role amit\u003c/code>) grant select tiếp cho satoshi, rồi \u003ccode>reset role\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create role amit;\ncreate role satoshi;\ngrant select on department to amit with grant option;\nset role amit;\ngrant select on department to satoshi;\nreset role;","check":"select grantor, grantee, privilege_type, is_grantable\nfrom information_schema.table_privileges\nwhere table_name = 'department' and grantee in ('amit', 'satoshi');","ordered":false,"fresh":false,"expected":{"fields":["grantor","grantee","privilege_type","is_grantable"],"rows":[["postgres","amit","SELECT","YES"],["amit","satoshi","SELECT","NO"]]}},{"id":"4.34","topic":"revoke cascade","level":3,"prompt":"\u003cp>Làm lại toàn bộ 4.33, sau đó \u003cstrong>revoke\u003c/strong> quyền select của amit với \u003cstrong>cascade\u003c/strong>. Quyền mà amit đã cấp cho satoshi cũng phải biến mất. (Thử đổi cascade thành restrict xem lỗi gì!)\u003c/p>","en":"","hint":"","solution":"create role amit;\ncreate role satoshi;\ngrant select on department to amit with grant option;\nset role amit;\ngrant select on department to satoshi;\nreset role;\nrevoke select on department from amit cascade;","check":"select (select count(*) from pg_roles where rolname in ('amit', 'satoshi')) as num_roles,\n       has_table_privilege('amit', 'department', 'select')                  as amit_select,\n       has_table_privilege('satoshi', 'department', 'select')               as satoshi_select;","ordered":false,"fresh":false,"expected":{"fields":["num_roles","amit_select","satoshi_select"],"rows":[["2","false","false"]]}}]},{"key":"ch5","store":"5","short":"5","label":"Chương 5","navLabel":"Chương 5","kind":"Chương","title":"Advanced SQL","titleVi":"SQL nâng cao","summary":"\u003ch3>1. Truy cập SQL từ ngôn ngữ lập trình\u003c/h3>\n\u003cp>Lý do: SQL không đủ sức biểu diễn mọi tính toán, và không làm được các việc \u003cem>non-declarative\u003c/em> (in báo cáo, tương tác người dùng, GUI).\u003cbr>Hai cách: \u003cstrong>API\u003c/strong> (JDBC, ODBC, Python DB-API…) hoặc \u003cstrong>embedded SQL\u003c/strong> (tiền xử lý lúc biên dịch thành lời gọi hàm).\u003c/p>\n\u003cp>\u003cstrong>JDBC\u003c/strong> — mô hình: mở \u003cem>connection\u003c/em> → tạo \u003cem>statement\u003c/em> → thực thi & lấy kết quả → xử lý \u003cem>exception\u003c/em>.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>try (Connection conn = DriverManager.getConnection(url, userid, passwd);\n     Statement stmt = conn.createStatement()) {\n    stmt.executeUpdate(\"insert into instructor values ('77987','Kim','Physics',98000)\");\n    ResultSet rset = stmt.executeQuery(\n        \"select dept_name, avg(salary) from instructor group by dept_name\");\n    while (rset.next())\n        System.out.println(rset.getString(\"dept_name\") + \" \" + rset.getFloat(2));\n} catch (SQLException sqle) { System.out.println(\"SQLException : \" + sqle); }\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>rs.getString(\"dept_name\")\u003c/code> ≡ \u003ccode>rs.getString(1)\u003c/code> nếu là cột đầu; null: \u003ccode>rs.getInt(\"a\"); if (rs.wasNull()) ...\u003c/code>\u003c/li>\u003cli>\u003cstrong>PreparedStatement\u003c/strong> với \u003ccode>?\u003c/code> + \u003ccode>setString/setInt\u003c/code> — \u003cstrong>luôn\u003c/strong> dùng khi nhận input từ người dùng; \u003cstrong>không bao giờ\u003c/strong> ghép chuỗi.\u003c/li>\u003cli>\u003cstrong>SQL injection\u003c/strong>: nhập \u003ccode>X' or 'Y' = 'Y\u003c/code> → \u003ccode>where name = 'X' or 'Y' = 'Y'\u003c/code> trả về mọi dòng; hoặc \u003ccode>X'; update instructor set salary = salary + 10000; --\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Metadata\u003c/strong>: \u003ccode>ResultSetMetaData\u003c/code> (getColumnCount, getColumnName, getColumnTypeName), \u003ccode>DatabaseMetaData\u003c/code> (getColumns, getTables, getPrimaryKeys) → viết code tổng quát không cần biết trước schema.\u003c/li>\u003cli>\u003cstrong>Transaction\u003c/strong>: mặc định \u003cem>auto-commit\u003c/em> mỗi câu; \u003ccode>conn.setAutoCommit(false)\u003c/code> rồi \u003ccode>conn.commit()\u003c/code> / \u003ccode>conn.rollback()\u003c/code>.\u003c/li>\u003cli>\u003ccode>CallableStatement\u003c/code>: \u003ccode>{? = call f(?)}\u003c/code>, \u003ccode>{call p(?,?)}\u003c/code>; large objects: \u003ccode>getBlob()\u003c/code>, \u003ccode>getClob()\u003c/code>.\u003c/li>\u003cli>\u003cstrong>SQLJ\u003c/strong>: embedded SQL trong Java — kiểm tra lỗi lúc biên dịch. \u003cstrong>ODBC\u003c/strong>: chuẩn API cho C, GUI, spreadsheet.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Embedded SQL\u003c/strong>: \u003ccode>EXEC SQL &lt;statement&gt;;\u003c/code> · host variable có dấu \u003ccode>:\u003c/code> (\u003ccode>:credit_amount\u003c/code>), khai báo trong \u003ccode>BEGIN/END DECLARE SECTION\u003c/code>.\u003cbr>Cursor: \u003ccode>declare c cursor for &lt;query&gt;\u003c/code> → \u003ccode>open c\u003c/code> (thực thi, lưu kết quả tạm) → \u003ccode>fetch c into :si, :sn\u003c/code> (lặp) → \u003ccode>SQLSTATE = '02000'\u003c/code> là hết dữ liệu → \u003ccode>close c\u003c/code>.\u003cbr>Cập nhật qua cursor: \u003ccode>declare c cursor for ... for update\u003c/code> rồi \u003ccode>update instructor set salary = salary + 1000 where current of c\u003c/code>.\u003c/p>\n\u003ch3>2. Functions & Procedures\u003c/h3>\n\u003cp>Lưu \u003cstrong>business logic\u003c/strong> trong DB. Cú pháp chuẩn SQL vs PostgreSQL (PL/pgSQL):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Chuẩn SQL (slide)\u003c/th>\u003cth>PostgreSQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>create function f(...) returns integer begin ... end\u003c/code>\u003c/td>\u003ctd>\u003ccode>create function f(...) returns integer language plpgsql as $$ begin ... end $$;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>declare d_count integer;\u003c/code>\u003c/td>\u003ctd>\u003ccode>declare d_count integer;\u003c/code> (đặt \u003cstrong>trước\u003c/strong> begin)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>select count(*) into d_count ...\u003c/code>\u003c/td>\u003ctd>giống\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>returns table (...)\u003c/code> + \u003ccode>return table (select ...)\u003c/code>\u003c/td>\u003ctd>\u003ccode>returns table (...) language sql as $$ select ... $$\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>select * from table(instructor_of('Music'))\u003c/code>\u003c/td>\u003ctd>\u003ccode>select * from instructor_of('Music')\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>create procedure p(in a ..., out b ...)\u003c/code>\u003c/td>\u003ctd>giống, gọi bằng \u003ccode>call p(...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>for r as select ... do ... end for\u003c/code>\u003c/td>\u003ctd>\u003ccode>for r in select ... loop ... end loop;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>set n = n + 1\u003c/code>\u003c/td>\u003ctd>\u003ccode>n := n + 1;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Các cấu trúc khác: \u003ccode>while ... do\u003c/code>, \u003ccode>repeat ... until\u003c/code>, \u003ccode>if ... then ... elseif ... else ... end if\u003c/code>, \u003ccode>case\u003c/code>, \u003ccode>signal\u003c/code> / \u003ccode>raise exception\u003c/code>.\u003cbr>\u003cstrong>External language routines\u003c/strong> (C, Java…): nhanh hơn nhưng rủi ro → chạy trong \u003cstrong>sandbox\u003c/strong> (ngôn ngữ an toàn như Java) hoặc \u003cstrong>process riêng\u003c/strong> (giao tiếp IPC) — cả hai đều tốn chi phí.\u003c/p>\n\u003ch3>3. Triggers\u003c/h3>\n\u003cp>Câu lệnh được hệ thống \u003cstrong>tự động thực thi\u003c/strong> khi DB thay đổi. Thiết kế trigger = (1) điều kiện kích hoạt, (2) hành động.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- Chuẩn SQL (slide)\ncreate trigger credits_earned after update of takes on (grade)\nreferencing new row as nrow referencing old row as orow\nfor each row\nwhen nrow.grade &lt;&gt; 'F' and nrow.grade is not null\n     and (orow.grade = 'F' or orow.grade is null)\nbegin atomic\n  update student set tot_cred = tot_cred +\n    (select credits from course where course.course_id = nrow.course_id)\n  where student.id = nrow.id;\nend;\u003c/code>\u003c/pre>\n\u003cp>PostgreSQL: viết \u003cstrong>trigger function\u003c/strong> \u003ccode>returns trigger\u003c/code> (dùng \u003ccode>new\u003c/code>, \u003ccode>old\u003c/code>) rồi \u003ccode>create trigger ... after update of grade on takes for each row when (...) execute function f();\u003c/code>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Row-level\u003c/strong> (\u003ccode>for each row\u003c/code>) vs \u003cstrong>statement-level\u003c/strong> (\u003ccode>for each statement\u003c/code> + \u003ccode>referencing old table / new table\u003c/code> = \u003cem>transition tables\u003c/em>).\u003c/li>\u003cli>\u003cstrong>before\u003c/strong> trigger có thể sửa \u003ccode>new\u003c/code> trước khi ghi (ví dụ đổi grade '' thành null).\u003c/li>\u003cli>\u003cstrong>Khi không nên dùng\u003c/strong>: duy trì dữ liệu tổng hợp (→ materialized view), replication (→ built-in), có thể dùng encapsulation (method cập nhật). Rủi ro: chạy ngoài ý muốn khi load backup/replicate, lỗi trigger làm hỏng transaction quan trọng, \u003cstrong>cascading\u003c/strong> triggers.\u003c/li>\u003c/ul>\n\u003ch3>4. Recursive queries\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>with recursive rec_prereq(course_id, prereq_id) as (\n    select course_id, prereq_id from prereq          -- base query\n  union\n    select rec_prereq.course_id, prereq.prereq_id    -- recursive query\n    from rec_prereq, prereq\n    where rec_prereq.prereq_id = prereq.course_id\n)\nselect * from rec_prereq;\u003c/code>\u003c/pre>\n\u003cp>= \u003cstrong>transitive closure\u003c/strong> của prereq. Tính bằng \u003cstrong>fixed-point iteration\u003c/strong>: lặp tới khi không thêm tuple mới. Truy vấn không đệ quy chỉ join được một số mức cố định. Recursive view phải \u003cstrong>monotonic\u003c/strong> (không dùng not exists/except/aggregate trên chính nó).\u003c/p>\n\u003ch3>5. Ranking\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select ID, rank() over (order by GPA desc nulls last) as s_rank\nfrom student_grades order by s_rank;\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>rank()\u003c/code> để lại khoảng trống (1, 1, 3); \u003ccode>dense_rank()\u003c/code> không (1, 1, 2).\u003c/li>\u003cli>\u003ccode>partition by dept_name\u003c/code> — xếp hạng trong từng nhóm → top-n mỗi nhóm.\u003c/li>\u003cli>\u003ccode>percent_rank()\u003c/code>, \u003ccode>cume_dist()\u003c/code>, \u003ccode>row_number()\u003c/code> (không xác định khi có trùng), \u003ccode>ntile(n)\u003c/code> (chia n bucket đều).\u003c/li>\u003cli>Ranking thực hiện \u003cstrong>sau\u003c/strong> group by. Cần \u003ccode>order by\u003c/code> ngoài cùng để kết quả được sắp.\u003c/li>\u003c/ul>\n\u003ch3>6. Windowing\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select date, avg(value) over (order by date rows between 1 preceding and 1 following)\nfrom sales;\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>rows unbounded preceding\u003c/code>, \u003ccode>rows between unbounded preceding and current row\u003c/code>, \u003ccode>range between 10 preceding and current row\u003c/code>, \u003ccode>range between interval '10' day preceding and current row\u003c/code>. Có thể kết hợp \u003ccode>partition by\u003c/code> (ví dụ số dư tài khoản sau mỗi giao dịch).\u003c/p>\n\u003ch3>7. OLAP\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Measure attributes\u003c/strong> (đo được, aggregate được: quantity) vs \u003cstrong>dimension attributes\u003c/strong> (item_name, color, size).\u003c/li>\u003cli>\u003cstrong>Cross-tab / pivot table\u003c/strong>: giá trị một dimension làm header dòng, một dimension làm header cột. \u003cstrong>Data cube\u003c/strong>: tổng quát hoá n chiều.\u003c/li>\u003cli>Biểu diễn quan hệ: dùng giá trị \u003ccode>all\u003c/code> (SQL dùng \u003cstrong>null\u003c/strong>) cho dòng tổng.\u003c/li>\u003cli>\u003ccode>group by cube(a, b, c)\u003c/code> → \u003cstrong>2ⁿ\u003c/strong> grouping: mọi tập con. \u003ccode>group by rollup(a, b, c)\u003c/code> → các \u003cstrong>prefix\u003c/strong>: (a,b,c), (a,b), (a), ().\u003c/li>\u003cli>\u003ccode>rollup(a), rollup(b, c)\u003c/code> → tích Descartes các grouping.\u003c/li>\u003cli>\u003ccode>grouping(a)\u003c/code> = 1 nếu null ở đó là null \"all\". \u003ccode>decode(grouping(a), 1, 'all', a)\u003c/code> (Oracle) ~ \u003ccode>case when grouping(a) = 1 then 'all' else a end\u003c/code>.\u003c/li>\u003cli>Thao tác: \u003cstrong>pivoting\u003c/strong>, \u003cstrong>slicing\u003c/strong> (cố định 1 dimension), \u003cstrong>dicing\u003c/strong> (cố định nhiều), \u003cstrong>rollup\u003c/strong> (mịn → thô), \u003cstrong>drill down\u003c/strong> (thô → mịn).\u003c/li>\u003cli>Cài đặt: \u003cstrong>MOLAP\u003c/strong> (mảng đa chiều trong bộ nhớ), \u003cstrong>ROLAP\u003c/strong> (chỉ dùng relational DB), \u003cstrong>HOLAP\u003c/strong> (lai). Chỉ cần precompute một số aggregate; aggregate (item, color) tính được từ (item, color, size) — trừ aggregate \u003cem>non-decomposable\u003c/em> như median.\u003c/li>\u003c/ul>","quiz":[{"q":"Vì sao phải luôn dùng PreparedStatement khi nhận input từ người dùng?","options":["Vì nhanh hơn Statement","Để chống SQL injection và xử lý đúng ký tự đặc biệt (D'Souza)","Vì Statement không hỗ trợ insert","Vì JDBC bắt buộc"],"answer":1,"explain":"Tham số được truyền riêng, không bao giờ bị hiểu thành một phần câu SQL."},{"q":"Người dùng nhập \u003ccode>X' or 'Y' = 'Y\u003c/code> vào câu \u003ccode>\"select * from instructor where name = '\" + name + \"'\"\u003c/code>. Kết quả?","options":["Không trả về gì","Trả về instructor tên X","Trả về MỌI instructor","Lỗi cú pháp"],"answer":2,"explain":"Câu trở thành where name = 'X' or 'Y' = 'Y' — luôn đúng."},{"q":"Mặc định JDBC xử lý transaction thế nào?","options":["Mỗi câu SQL là một transaction tự commit","Mọi câu nằm chung 1 transaction","Phải gọi begin","Không hỗ trợ transaction"],"answer":0,"explain":"Auto-commit bật mặc định; dùng setAutoCommit(false) cho transaction nhiều câu."},{"q":"Trong embedded SQL, \u003ccode>SQLSTATE = '02000'\u003c/code> nghĩa là?","options":["Lỗi kết nối","Không còn tuple để fetch","Vi phạm khoá chính","Transaction bị rollback"],"answer":1,"explain":"No data — cursor đã hết kết quả."},{"q":"Host variable trong embedded SQL được viết thế nào?","options":["$credit_amount",":credit_amount","@credit_amount","?credit_amount"],"answer":1,"explain":"Dấu hai chấm phân biệt biến host với tên trong SQL."},{"q":"Trigger statement-level dùng gì để tham chiếu các dòng bị ảnh hưởng?","options":["new row / old row","transition tables: referencing new table / old table","cursor","không tham chiếu được"],"answer":1,"explain":"Row-level dùng new/old row; statement-level dùng transition tables."},{"q":"Tình huống nào KHÔNG nên dùng trigger theo slide?","options":["Kiểm tra ràng buộc phức tạp","Duy trì dữ liệu tổng hợp như tổng lương mỗi khoa","Ghi log thay đổi","Chuẩn hoá giá trị trước khi insert"],"answer":1,"explain":"Nên dùng materialized view có sẵn trong DBMS."},{"q":"GPA: 4.0, 4.0, 3.9. rank() và dense_rank() của sinh viên 3.9 lần lượt là?","options":["2 và 2","3 và 2","3 và 3","2 và 3"],"answer":1,"explain":"rank để lại khoảng trống, dense_rank thì không."},{"q":"\u003ccode>group by cube(item_name, color, size)\u003c/code> tạo ra bao nhiêu grouping?","options":["3","4","6","8"],"answer":3,"explain":"2³ = 8 tập con."},{"q":"\u003ccode>group by rollup(item_name, color, size)\u003c/code> tạo ra bao nhiêu grouping?","options":["3","4","7","8"],"answer":1,"explain":"Các prefix: (i,c,s), (i,c), (i), () → 4."},{"q":"\u003ccode>grouping(color)\u003c/code> trả về 1 khi nào?","options":["color có giá trị null thật trong dữ liệu","null ở cột color đại diện cho \"all\"","color là khoá","Luôn trả về 1 với cube"],"answer":1,"explain":"Dùng để phân biệt null \"all\" với null thật."},{"q":"Đi từ doanh số theo (item, color, size) lên doanh số theo item gọi là?","options":["Drill down","Rollup","Slicing","Pivoting"],"answer":1,"explain":"Rollup: mịn → thô. Drill down ngược lại."},{"q":"Hệ OLAP chỉ dùng tính năng của relational DB gọi là?","options":["MOLAP","ROLAP","HOLAP","NoSQL"],"answer":1,"explain":"Relational OLAP."},{"q":"Aggregate nào KHÔNG tính được từ aggregate mịn hơn (non-decomposable)?","options":["sum","count","max","median"],"answer":3,"explain":"Không thể suy median tổng từ median từng nhóm con."},{"q":"Vì sao cần recursive query cho \"mọi môn tiên quyết trực tiếp hoặc gián tiếp\"?","options":["Vì SQL không có join","Truy vấn không đệ quy chỉ join được một số mức cố định, trong khi số mức phụ thuộc dữ liệu","Để chạy nhanh hơn","Vì prereq có khoá chính phức hợp"],"answer":1,"explain":"Luôn có thể tạo dữ liệu có nhiều mức hơn số join cố định."}],"questions":[{"q":"Viết đoạn Java (JDBC) dùng PreparedStatement để chèn instructor (88877, Perry, Finance, 125000), rồi chèn tiếp 88878 chỉ bằng cách đổi tham số thứ nhất.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>PreparedStatement pStmt = conn.prepareStatement(\n    \"insert into instructor values(?,?,?,?)\");\npStmt.setString(1, \"88877\");\npStmt.setString(2, \"Perry\");\npStmt.setString(3, \"Finance\");\npStmt.setInt(4, 125000);\npStmt.executeUpdate();\npStmt.setString(1, \"88878\");   // các tham số còn lại giữ nguyên\npStmt.executeUpdate();\u003c/code>\u003c/pre>"},{"q":"Viết đoạn JDBC chuyển 10000 budget từ Finance sang History thành một transaction an toàn.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>conn.setAutoCommit(false);\ntry (PreparedStatement p = conn.prepareStatement(\n        \"update department set budget = budget + ? where dept_name = ?\")) {\n    p.setInt(1, -10000); p.setString(2, \"Finance\"); p.executeUpdate();\n    p.setInt(1,  10000); p.setString(2, \"History\"); p.executeUpdate();\n    conn.commit();\n} catch (SQLException e) {\n    conn.rollback();\n} finally {\n    conn.setAutoCommit(true);\n}\u003c/code>\u003c/pre>"},{"q":"Viết đoạn embedded SQL (C) in ra ID, name của sinh viên có tot_cred > :credit_amount bằng cursor.","en":"","answer":"\u003cpre class=\"code\" data-lang=\"c\">\u003ccode>EXEC SQL BEGIN DECLARE SECTION;\n  int credit_amount; char si[6]; char sn[21];\nEXEC SQL END DECLARE SECTION;\n\nEXEC SQL declare c cursor for\n  select ID, name from student where tot_cred &gt; :credit_amount;\nEXEC SQL open c;\nfor (;;) {\n  EXEC SQL fetch c into :si, :sn;\n  if (strcmp(SQLSTATE, \"02000\") == 0) break;   /* hết dữ liệu */\n  printf(\"%s %s\\n\", si, sn);\n}\nEXEC SQL close c;\u003c/code>\u003c/pre>"},{"q":"ResultSetMetaData và DatabaseMetaData hữu ích ở đâu?","en":"","answer":"\u003cp>Khi viết chương trình \u003cstrong>tổng quát\u003c/strong> không biết trước schema: ví dụ công cụ hiển thị kết quả của câu truy vấn bất kỳ (lấy số cột, tên & kiểu cột), công cụ quản trị liệt kê bảng/cột/khoá chính (như pgAdmin, DBeaver), sinh form nhập liệu tự động.\u003c/p>"},{"q":"Liệt kê các grouping mà \u003ccode>group by rollup(item_name), rollup(color, size)\u003c/code> tạo ra.","en":"","answer":"\u003cp>{(item_name), ()} × {(color, size), (color), ()} = (item_name, color, size), (item_name, color), (item_name), (color, size), (color), () — 6 grouping.\u003c/p>"},{"q":"Mô tả quá trình fixed-point khi tính rec_prereq nếu prereq = {(C3, C2), (C2, C1)}.","en":"","answer":"\u003cp>Vòng 0: rec = ∅. Vòng 1 (base): rec = {(C3,C2), (C2,C1)}. Vòng 2: join rec với prereq: (C3,C2) ⋈ (C2,C1) → thêm (C3,C1). Vòng 3: không có tuple mới → \u003cstrong>fixed point\u003c/strong>, dừng. Kết quả {(C3,C2), (C2,C1), (C3,C1)}.\u003c/p>"}],"exercises":[{"id":"5.01","topic":"function","level":2,"prompt":"\u003cp>Tạo function \u003ccode>dept_count(dname varchar(20)) returns integer\u003c/code> (PL/pgSQL) trả về số instructor của khoa. Sau đó dùng nó tìm dept_name, budget của các khoa có \u003cstrong>hơn 2\u003c/strong> instructor.\u003c/p>","en":"","hint":"Đặt tên tham số là dname (không phải dept_name) để khỏi nhầm với tên cột.","solution":"create function dept_count(dname varchar(20))\nreturns integer\nlanguage plpgsql as $$\ndeclare\n  d_count integer;\nbegin\n  select count(*) into d_count\n  from instructor\n  where instructor.dept_name = dname;\n  return d_count;\nend $$;\n\nselect dept_name, budget\nfrom department\nwhere dept_count(dept_name) > 2;","check":"select dept_name, dept_count(dept_name) from department;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","dept_count"],"rows":[["Biology","1"],["Comp. Sci.","3"],["Elec. Eng.","1"],["Finance","2"],["History","2"],["Music","1"],["Physics","2"]]}},{"id":"5.02","topic":"table function","level":2,"prompt":"\u003cp>Tạo \u003cstrong>table function\u003c/strong> \u003ccode>instructor_of(dname varchar(20))\u003c/code> trả về bảng (ID, name, dept_name, salary) gồm instructor của khoa dname.\u003c/p>","en":"","hint":"returns table (...) language sql as $$ select ... $$; dùng: select * from instructor_of('Music')","solution":"create function instructor_of(dname varchar(20))\nreturns table (ID varchar(5), name varchar(20), dept_name varchar(20), salary numeric(8,2))\nlanguage sql as $$\n  select ID, name, dept_name, salary\n  from instructor\n  where instructor.dept_name = dname;\n$$;","check":"select * from instructor_of('Comp. Sci.');","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["10101","Srinivasan","Comp. Sci.","65000"],["45565","Katz","Comp. Sci.","75000"],["83821","Brandt","Comp. Sci.","92000"]]}},{"id":"5.03","topic":"procedure","level":2,"prompt":"\u003cp>Tạo \u003cstrong>procedure\u003c/strong> \u003ccode>dept_count_proc(in dname varchar(20), out d_count integer)\u003c/code>. Gọi thử bằng \u003ccode>call dept_count_proc('Physics', null);\u003c/code>\u003c/p>","en":"","hint":"","solution":"create procedure dept_count_proc(in dname varchar(20), out d_count integer)\nlanguage plpgsql as $$\nbegin\n  select count(*) into d_count\n  from instructor\n  where instructor.dept_name = dname;\nend $$;","check":"call dept_count_proc('Comp. Sci.', null);","ordered":false,"fresh":false,"expected":{"fields":["d_count"],"rows":[["3"]]}},{"id":"5.04","topic":"for loop","level":2,"prompt":"\u003cp>Tạo function \u003ccode>building_budget(bldg varchar(15)) returns numeric\u003c/code> tính \u003cstrong>tổng budget\u003c/strong> các khoa đặt ở toà nhà bldg bằng vòng lặp \u003cstrong>for\u003c/strong> (không dùng sum).\u003c/p>","en":"","hint":"","solution":"create function building_budget(bldg varchar(15))\nreturns numeric\nlanguage plpgsql as $$\ndeclare\n  n numeric := 0;\n  r record;\nbegin\n  for r in select budget from department where building = bldg loop\n    n := n + r.budget;\n  end loop;\n  return n;\nend $$;","check":"select building, building_budget(building) from (select distinct building from department) as b;","ordered":false,"fresh":false,"expected":{"fields":["building","building_budget"],"rows":[["Taylor","185000"],["Packard","80000"],["Painter","170000"],["Watson","160000"]]}},{"id":"5.05","topic":"if / elsif","level":1,"prompt":"\u003cp>Tạo function \u003ccode>salary_level(sal numeric) returns varchar\u003c/code> trả về \u003ccode>'high'\u003c/code> nếu sal ≥ 90000, \u003ccode>'medium'\u003c/code> nếu sal ≥ 70000, ngược lại \u003ccode>'low'\u003c/code>.\u003c/p>","en":"","hint":"","solution":"create function salary_level(sal numeric)\nreturns varchar\nlanguage plpgsql as $$\nbegin\n  if sal >= 90000 then\n    return 'high';\n  elsif sal >= 70000 then\n    return 'medium';\n  else\n    return 'low';\n  end if;\nend $$;","check":"select ID, salary_level(salary) from instructor;","ordered":false,"fresh":false,"expected":{"fields":["id","salary_level"],"rows":[["10101","low"],["12121","high"],["15151","low"],["22222","high"],["32343","low"],["33456","medium"],["45565","medium"],["58583","low"],["76543","medium"],["76766","medium"],["83821","high"],["98345","medium"]]}},{"id":"5.06","topic":"procedure + update","level":2,"prompt":"\u003cp>Tạo procedure \u003ccode>give_raise(dname varchar(20), pct numeric)\u003c/code> tăng lương pct% cho instructor khoa dname. Gọi \u003ccode>call give_raise('Comp. Sci.', 10);\u003c/code>\u003c/p>","en":"","hint":"","solution":"create procedure give_raise(dname varchar(20), pct numeric)\nlanguage plpgsql as $$\nbegin\n  update instructor\n  set salary = salary * (1 + pct / 100)\n  where dept_name = dname;\nend $$;\n\ncall give_raise('Comp. Sci.', 10);","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","71500"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","82500"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","101200"],["98345","80000"]]}},{"id":"5.07","topic":"row trigger","level":3,"prompt":"\u003cp>Cài trigger \u003ccode>credits_earned\u003c/code> như slide bằng PostgreSQL: khi grade của takes được update từ \u003cstrong>F hoặc null\u003c/strong> sang \u003cstrong>điểm qua\u003c/strong> (khác F, không null) thì cộng credits của môn vào tot_cred của sinh viên.\u003cbr>Hệ thống sẽ thử: Tanaka BIO-301 null → B (cộng 4), rồi B → A (không cộng), Levy CS-101 Fall F → B (cộng 4).\u003c/p>","en":"","hint":"create function ... returns trigger (dùng new, old) + create trigger ... after update of grade on takes for each row when (...) execute function ...","solution":"create function credits_earned_fn() returns trigger\nlanguage plpgsql as $$\nbegin\n  update student\n  set tot_cred = tot_cred + (select credits from course\n                             where course.course_id = new.course_id)\n  where student.ID = new.ID;\n  return new;\nend $$;\n\ncreate trigger credits_earned\nafter update of grade on takes\nfor each row\nwhen (new.grade \u003c> 'F' and new.grade is not null\n      and (old.grade = 'F' or old.grade is null))\nexecute function credits_earned_fn();","check":"update takes set grade = 'B' where ID = '98988' and course_id = 'BIO-301';\nupdate takes set grade = 'A' where ID = '98988' and course_id = 'BIO-301';\nupdate takes set grade = 'B' where ID = '45678' and course_id = 'CS-101' and semester = 'Fall';\nselect ID, tot_cred from student where ID in ('98988', '45678');","ordered":false,"fresh":false,"expected":{"fields":["id","tot_cred"],"rows":[["45678","50"],["98988","124"]]}},{"id":"5.08","topic":"before trigger","level":2,"prompt":"\u003cp>Tạo trigger \u003cstrong>before insert or update\u003c/strong> trên takes: nếu grade là chuỗi rỗng \u003ccode>''\u003c/code> hoặc chỉ toàn khoảng trắng thì đổi thành \u003cstrong>null\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"create function setnull_fn() returns trigger\nlanguage plpgsql as $$\nbegin\n  if trim(new.grade) = '' then\n    new.grade := null;\n  end if;\n  return new;\nend $$;\n\ncreate trigger setnull_trigger\nbefore insert or update on takes\nfor each row\nexecute function setnull_fn();","check":"insert into takes values ('70557', 'PHY-101', '1', 'Fall', 2017, '');\nupdate takes set grade = ' ' where ID = '00128' and course_id = 'CS-347';\nselect ID, course_id, grade from takes where ID in ('70557', '00128');","ordered":false,"fresh":false,"expected":{"fields":["id","course_id","grade"],"rows":[["00128","CS-101","A"],["00128","CS-347",null],["70557","PHY-101",null]]}},{"id":"5.09","topic":"audit trigger","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>salary_audit(ID varchar(5), old_salary numeric(8,2), new_salary numeric(8,2))\u003c/code> và trigger ghi lại mỗi lần \u003cstrong>salary\u003c/strong> của instructor thay đổi (chỉ khi giá trị thực sự khác).\u003c/p>","en":"","hint":"when (old.salary is distinct from new.salary)","solution":"create table salary_audit (\n  ID         varchar(5),\n  old_salary numeric(8,2),\n  new_salary numeric(8,2)\n);\n\ncreate function salary_audit_fn() returns trigger\nlanguage plpgsql as $$\nbegin\n  insert into salary_audit values (new.ID, old.salary, new.salary);\n  return new;\nend $$;\n\ncreate trigger salary_audit_trigger\nafter update of salary on instructor\nfor each row\nwhen (old.salary is distinct from new.salary)\nexecute function salary_audit_fn();","check":"update instructor set salary = salary + 1000 where dept_name = 'History';\nupdate instructor set salary = salary where dept_name = 'Music';\nselect * from salary_audit;","ordered":false,"fresh":false,"expected":{"fields":["id","old_salary","new_salary"],"rows":[["32343","60000","61000"],["58583","62000","63000"]]}},{"id":"5.10","topic":"statement trigger","level":3,"prompt":"\u003cp>Tạo bảng \u003ccode>update_log(table_name text, num_rows integer)\u003c/code> và một trigger \u003cstrong>statement-level\u003c/strong> (\u003ccode>for each statement\u003c/code>) dùng \u003cstrong>transition table\u003c/strong> (\u003ccode>referencing new table as ...\u003c/code>) để ghi số dòng bị update mỗi khi chạy update trên instructor.\u003c/p>","en":"","hint":"","solution":"create table update_log (table_name text, num_rows integer);\n\ncreate function log_update_fn() returns trigger\nlanguage plpgsql as $$\nbegin\n  insert into update_log select 'instructor', count(*) from new_rows;\n  return null;\nend $$;\n\ncreate trigger log_instructor_update\nafter update on instructor\nreferencing new table as new_rows\nfor each statement\nexecute function log_update_fn();","check":"update instructor set salary = salary * 1.01 where dept_name = 'Comp. Sci.';\nupdate instructor set salary = salary * 1.01 where dept_name = 'Nowhere';\nselect * from update_log;","ordered":false,"fresh":false,"expected":{"fields":["table_name","num_rows"],"rows":[["instructor","3"],["instructor","0"]]}},{"id":"5.11","topic":"with recursive","level":2,"prompt":"\u003cp>Dùng \u003cstrong>with recursive\u003c/strong> trên emp_super: tìm \u003cstrong>tất cả\u003c/strong> supervisor (trực tiếp và gián tiếp) của \u003ccode>Bob\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with recursive sup(person, supervisor) as (\n    select person, supervisor from emp_super\n  union\n    select sup.person, emp_super.supervisor\n    from sup, emp_super\n    where sup.supervisor = emp_super.person\n)\nselect supervisor from sup where person = 'Bob';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["supervisor"],"rows":[["Alice"],["David"],["Mary"],["Susan"]]}},{"id":"5.12","topic":"transitive closure","level":2,"prompt":"\u003cp>Trước tiên thêm 2 dòng prereq \u003ccode>('CS-319', 'CS-190')\u003c/code> và \u003ccode>('BIO-399', 'BIO-301')\u003c/code> để có chuỗi nhiều mức. Sau đó tính \u003cstrong>rec_prereq(course_id, prereq_id)\u003c/strong> — transitive closure của prereq.\u003c/p>","en":"","hint":"","solution":"insert into prereq values ('CS-319', 'CS-190'), ('BIO-399', 'BIO-301');\n\nwith recursive rec_prereq(course_id, prereq_id) as (\n    select course_id, prereq_id from prereq\n  union\n    select rec_prereq.course_id, prereq.prereq_id\n    from rec_prereq, prereq\n    where rec_prereq.prereq_id = prereq.course_id\n)\nselect * from rec_prereq;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","prereq_id"],"rows":[["BIO-301","BIO-101"],["BIO-399","BIO-101"],["CS-190","CS-101"],["CS-315","CS-101"],["CS-319","CS-101"],["CS-347","CS-101"],["EE-181","PHY-101"],["CS-319","CS-190"],["BIO-399","BIO-301"]]}},{"id":"5.13","topic":"recursion + depth","level":3,"prompt":"\u003cp>Tìm mọi cấp dưới (trực tiếp và gián tiếp) của \u003ccode>Mary\u003c/code> cùng \u003cstrong>cấp độ\u003c/strong> (\u003ccode>level\u003c/code>: cấp dưới trực tiếp = 1, cấp dưới của họ = 2, …). Trả về person, level.\u003c/p>","en":"","hint":"","solution":"with recursive sub(person, level) as (\n    select person, 1 from emp_super where supervisor = 'Mary'\n  union all\n    select e.person, sub.level + 1\n    from emp_super e, sub\n    where e.supervisor = sub.person\n)\nselect person, level from sub;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person","level"],"rows":[["David","1"],["Alice","2"],["Bob","3"],["Eve","3"],["Tom","4"]]}},{"id":"5.14","topic":"rank","level":1,"prompt":"\u003cp>Xếp hạng sinh viên theo GPA giảm dần từ \u003ccode>student_grades\u003c/code>, sinh viên GPA null xếp \u003cstrong>cuối\u003c/strong>. Trả về ID, GPA, s_rank.\u003c/p>","en":"","hint":"","solution":"select ID, GPA, rank() over (order by GPA desc nulls last) as s_rank\nfrom student_grades\norder by s_rank;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa","s_rank"],"rows":[["76543","4","1"],["00128","3.87","2"],["55739","3.7","3"],["54321","3.5","4"],["12345","3.43","5"],["19991","3","6"],["44553","2.7","7"],["23121","2.3","8"],["98765","2.26","9"],["45678","2.02","10"],["98988","2","11"],["76653","2","11"],["70557",null,"13"]]}},{"id":"5.15","topic":"dense_rank","level":1,"prompt":"\u003cp>Như 5.14 (bỏ qua sinh viên GPA null) nhưng trả về cả \u003ccode>rank()\u003c/code> và \u003ccode>dense_rank()\u003c/code> để so sánh: ID, GPA, r, dr.\u003c/p>","en":"","hint":"","solution":"select ID, GPA,\n       rank()       over (order by GPA desc) as r,\n       dense_rank() over (order by GPA desc) as dr\nfrom student_grades\nwhere GPA is not null;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa","r","dr"],"rows":[["76543","4","1","1"],["00128","3.87","2","2"],["55739","3.7","3","3"],["54321","3.5","4","4"],["12345","3.43","5","5"],["19991","3","6","6"],["44553","2.7","7","7"],["23121","2.3","8","8"],["98765","2.26","9","9"],["45678","2.02","10","10"],["98988","2","11","11"],["76653","2","11","11"]]}},{"id":"5.16","topic":"rank without window","level":3,"prompt":"\u003cp>Tính hạng như 5.15 (cột r) \u003cstrong>không dùng\u003c/strong> window function: hạng = 1 + số sinh viên có GPA cao hơn. Bỏ qua GPA null. Trả về ID, s_rank.\u003c/p>","en":"","hint":"","solution":"select ID, (1 + (select count(*)\n                 from student_grades B\n                 where B.GPA > A.GPA)) as s_rank\nfrom student_grades A\nwhere A.GPA is not null\norder by s_rank;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","s_rank"],"rows":[["76543","1"],["00128","2"],["55739","3"],["54321","4"],["12345","5"],["19991","6"],["44553","7"],["23121","8"],["98765","9"],["45678","10"],["98988","11"],["76653","11"]]}},{"id":"5.17","topic":"partition by","level":2,"prompt":"\u003cp>Xếp hạng sinh viên \u003cstrong>trong từng khoa\u003c/strong> theo GPA giảm dần (\u003ccode>dept_grades\u003c/code>, bỏ GPA null). Trả về ID, dept_name, dept_rank.\u003c/p>","en":"","hint":"","solution":"select ID, dept_name,\n       rank() over (partition by dept_name order by GPA desc) as dept_rank\nfrom dept_grades\nwhere GPA is not null\norder by dept_name, dept_rank;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","dept_name","dept_rank"],"rows":[["98988","Biology","1"],["76543","Comp. Sci.","1"],["00128","Comp. Sci.","2"],["54321","Comp. Sci.","3"],["12345","Comp. Sci.","4"],["98765","Elec. Eng.","1"],["76653","Elec. Eng.","2"],["23121","Finance","1"],["19991","History","1"],["55739","Music","1"],["44553","Physics","1"],["45678","Physics","2"]]}},{"id":"5.18","topic":"top-n per group","level":3,"prompt":"\u003cp>Sinh viên có GPA \u003cstrong>cao nhất mỗi khoa\u003c/strong> (nếu bằng nhau lấy hết). Trả về dept_name, ID, GPA.\u003c/p>","en":"","hint":"","solution":"select dept_name, ID, GPA\nfrom (select dept_name, ID, GPA,\n             rank() over (partition by dept_name order by GPA desc) as r\n      from dept_grades\n      where GPA is not null) as t\nwhere r = 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","id","gpa"],"rows":[["Biology","98988","2"],["Comp. Sci.","76543","4"],["Elec. Eng.","98765","2.26"],["Finance","23121","2.3"],["History","19991","3"],["Music","55739","3.7"],["Physics","44553","2.7"]]}},{"id":"5.19","topic":"ntile","level":2,"prompt":"\u003cp>Chia sinh viên (GPA không null) thành \u003cstrong>4 nhóm\u003c/strong> (quartile) theo GPA giảm dần. Trả về ID, GPA, quartile. *(Lưu ý: ntile với giá trị trùng có thể không xác định — ở đây hãy thêm ID vào order by để cố định: \u003ccode>order by GPA desc, ID\u003c/code>.)*\u003c/p>","en":"","hint":"","solution":"select ID, GPA, ntile(4) over (order by GPA desc, ID) as quartile\nfrom student_grades\nwhere GPA is not null;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa","quartile"],"rows":[["76543","4","1"],["00128","3.87","1"],["55739","3.7","1"],["54321","3.5","2"],["12345","3.43","2"],["19991","3","2"],["44553","2.7","3"],["23121","2.3","3"],["98765","2.26","3"],["45678","2.02","4"],["76653","2","4"],["98988","2","4"]]}},{"id":"5.20","topic":"percent_rank / cume_dist","level":2,"prompt":"\u003cp>Với sinh viên có GPA: ID, GPA, \u003ccode>percent_rank()\u003c/code> và \u003ccode>cume_dist()\u003c/code> theo GPA \u003cstrong>tăng dần\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"select ID, GPA,\n       percent_rank() over (order by GPA) as pr,\n       cume_dist()    over (order by GPA) as cd\nfrom student_grades\nwhere GPA is not null;
