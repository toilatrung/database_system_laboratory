<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Part 2 — Chương 6 và 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* ---------- LabelX design tokens (light) ---------- */
  :root {
    --canvas: #f7f7f8;
    --surface: #ffffff;
    --surface-sunken: #f3f4f6;
    --surface-selected: #eef0f3;
    --hover: rgba(17,24,39,.045);
    --selected: #e8e9ec;
    --accent: #9d2235;
    --accent-soft: #f7ebed;
    --border: #e3e6ea;
    --border-strong: #8c93a0;
    --ink: #1a1d23;
    --ink-muted: #4b5262;
    --ink-subtle: #5f6570;
    --primary: #1f2933;
    --primary-hover: #38424f;
    --on-primary: #ffffff;
    --focus: #1f2933;
    --success: #146c43;
    --success-soft: #e6f4ec;
    --warning: #8a5300;
    --warning-soft: #fdf2d8;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --info: #1d5ea8;
    --info-soft: #e7effa;
    --neutral: #475061;
    --neutral-soft: #eceef2;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 999px;
    --shadow-menu: 0 8px 24px rgba(17,24,39,0.12);
    --sidebar-width: 264px; --control-height: 32px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--ink); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- App shell: sidebar on the page ground, content beside it ---------- */
  .lx-app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
  .lx-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--space-4);
    padding: var(--space-4) var(--space-3) var(--space-3); border-right: 1px solid var(--border); background: var(--canvas); }
  .lx-brand { display: flex; align-items: center; gap: 10px; padding: var(--space-1) var(--space-2); color: var(--ink); text-decoration: none; }
  .lx-brand__mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent); color: #fff; }
  .lx-brand__mark svg { width: 16px; height: 16px; }
  .lx-brand__name { font: 600 14px/18px var(--font-sans); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-4); margin: 0 calc(-1 * var(--space-1)); padding: 0 var(--space-1); }
  .lx-nav__group { display: flex; flex-direction: column; gap: 2px; }
  .lx-nav__label { padding: 0 var(--space-2) var(--space-1); font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav__item { display: flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); border-radius: var(--radius-md);
    color: var(--ink-muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--ink); }
  .lx-nav__item.is-active { background: var(--selected); color: var(--ink); font-weight: 600; }
  .lx-nav__item svg.i { color: var(--ink-subtle); }
  .lx-nav__k { flex: none; width: 44px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k { color: var(--ink-muted); }
  .lx-nav__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart > summary { display: flex; width: 100%; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); margin: 0;
    border-radius: var(--radius-md); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); }
  .lx-navpart > summary:hover { background: var(--hover); color: var(--ink); }
  .lx-navpart.is-current > summary { color: var(--ink); font-weight: 600; }
  .lx-navpart > summary svg.i { margin-left: auto; width: 12px; height: 12px; color: var(--ink-subtle); }
  .lx-navpart[open] > summary { margin-bottom: 2px; }
  .lx-navpart__n { flex: none; width: 44px; }
  .lx-navpart__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart__items { display: flex; flex-direction: column; gap: 2px; margin: 0 0 var(--space-2) var(--space-3); padding-left: var(--space-2); border-left: 1px solid var(--border); }
  .lx-sidebar__foot { border-top: 1px solid var(--border); padding-top: var(--space-3); }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- Database signal: green when PostgreSQL is ready ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 var(--space-2);
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 500 13px/1 var(--font-sans); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--ink); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--border-strong); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--success); }
  [data-state="error"] .lx-signal__dot { background: var(--danger); }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lx-pop { position: absolute; bottom: calc(100% + 6px); left: 0; width: 360px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--surface); color: var(--ink); text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop {
    opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-pop__title { font-weight: 600; }
  .lx-pop__body { padding: var(--space-3) var(--space-4); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
  .lx-pop__body p { margin: 0 0 var(--space-2); }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 var(--space-2); }
  .lx-pop__body code { font: 500 12px/1 var(--font-mono); color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--space-3); margin: 0 0 var(--space-2); }
  .lx-pop__body .lx-kv dt { color: var(--ink-subtle); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--ink); font-weight: 500; }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: 10px var(--space-4); border-top: 1px solid var(--border); }

  /* ---------- Motion ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-navpart > summary, .lx-flow__step a, .lx-flow__n, .lx-list > li > a, .lx-opt,
  .lx-table td, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .lx-iconbtn::after { transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { transform: none; }
  details > summary svg.i { transition: transform .2s ease, opacity .2s ease; }
  .lx-progress > i { transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-fade-up .22s ease-out; }
  .lx-page.is-entering { animation: lx-fade-up .24s ease-out; }
  @keyframes lx-fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- Page ---------- */
  .lx-page { max-width: 1200px; margin: 0 auto; padding: var(--space-8) var(--space-8) 64px; display: flex; flex-direction: column; gap: var(--space-6); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
  .lx-head__text { flex: 1 1 520px; max-width: 840px; }
  .lx-eyebrow { font: 400 13px/18px var(--font-sans); color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .lx-h1 { margin: 0 0 6px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .lx-lead { margin: 0; color: var(--ink-muted); }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .lx-cols { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .lx-main { flex: 999 1 560px; min-width: 0; }
  .lx-side { flex: 1 1 320px; min-width: 0; max-width: 100%; overflow: hidden; }
  .lx-subtle { color: var(--ink-subtle); }
  .lx-mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .lx-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-3);
    border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    font: 500 13px/1 var(--font-sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--surface-sunken); }
  .lx-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-btn--primary:hover { background: var(--primary-hover); }
  .lx-btn--ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .lx-btn--ghost:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-btn[disabled] { opacity: .45; cursor: not-allowed; }
  .lx-btn .lx-kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--ink-muted); cursor: pointer; text-decoration: none; }
  .lx-iconbtn:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 2px); right: 0; white-space: nowrap; padding: 4px 8px;
    border-radius: 4px; background: var(--primary); color: var(--on-primary); font: 500 12px/16px var(--font-sans); opacity: 0; pointer-events: none; z-index: 10; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; }

  /* ---------- Badges & tags ---------- */
  .lx-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-sm);
    font: 500 12px/1 var(--font-sans); white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
  .lx-badge--success { background: var(--success-soft); color: var(--success); }
  .lx-badge--warning { background: var(--warning-soft); color: var(--warning); }
  .lx-badge--danger { background: var(--danger-soft); color: var(--danger); }
  .lx-badge--info { background: var(--info-soft); color: var(--info); }
  .lx-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--neutral-soft);
    color: var(--neutral); font: 500 12px/1 var(--font-sans); white-space: nowrap; }

  /* ---------- Card, table, list ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-card__body { padding: var(--space-4); }
  .lx-card__foot { padding: 10px var(--space-4); border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-subtle); display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }
  .lx-card > .lx-scroll:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 10px var(--space-4) 8px; color: var(--ink-subtle);
    font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table tbody tr:hover td { background: var(--surface-sunken); }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table .act { width: 1%; text-align: right; padding-top: 0; padding-bottom: 0; }
  .lx-cell__main { font-weight: 600; color: var(--ink); text-decoration: none; }
  a.lx-cell__main:hover { text-decoration: underline; }
  .lx-cell__sub { font-size: 12px; line-height: 16px; color: var(--ink-subtle); margin-top: 2px; }
  .lx-table--data td, .lx-table--data th { font-family: var(--font-mono); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: pre; padding: 8px var(--space-4); }
  .lx-table--data th { font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); }
  .lx-null { color: var(--ink-subtle); font-style: italic; }

  .lx-list { list-style: none; margin: 0; padding: 0; }
  .lx-list > li > a { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border); text-decoration: none; color: var(--ink); }
  .lx-list > li:last-child > a { border-bottom: 0; }
  .lx-list > li > a:hover { background: var(--surface-sunken); }
  .lx-list > li[aria-selected="true"] > a { background: var(--selected); font-weight: 600; }
  .lx-list__id { font: 500 12px/16px var(--font-mono); width: 36px; flex: none; }
  .lx-list__t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-list--scroll { max-height: 640px; overflow-y: auto; }

  .lx-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lx-kpi { padding: var(--space-4) var(--space-6) 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--border); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .lx-kpi__v { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .lx-kpi__u { font-size: 15px; font-weight: 500; color: var(--ink-subtle); letter-spacing: 0; }
  .lx-kpi__n { font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-kpi .lx-progress { margin-top: 4px; }
  .lx-dash { color: var(--ink-subtle); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Fifteen weeks of the course: this part's weeks tinted, exam weeks marked */
  .lx-weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: var(--space-4); }
  .lx-week { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 64px; padding: 8px 10px; border-radius: var(--radius-md);
    background: var(--surface-sunken); color: var(--ink-muted); font-size: 12px; line-height: 16px; }
  .lx-week__n { font-weight: 600; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lx-week.is-on { background: var(--accent-soft); color: var(--ink-muted); box-shadow: inset 0 -2px 0 var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--accent); }
  .lx-week.is-exam { background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
  .lx-week.is-exam strong { font-weight: 600; }
  .lx-progress { height: 6px; border-radius: 3px; background: var(--neutral-soft); overflow: hidden; min-width: 96px; }
  .lx-progress > i { display: block; height: 100%; background: var(--accent); }

  .lx-callout { border-radius: var(--radius-lg); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--info-soft); color: var(--ink); }
  .lx-callout--success { background: var(--success-soft); }
  .lx-callout--warning { background: var(--warning-soft); }
  .lx-callout--danger { background: var(--danger-soft); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Flow navigation (Tóm tắt → Trắc nghiệm → Tự luận → Bài tập) ---------- */
  .lx-flow { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3) 0 var(--space-4); min-height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-flow__k { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); padding-right: var(--space-4); border-right: 1px solid var(--border); white-space: nowrap; }
  .lx-flow__arrow { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .lx-flow__arrow.is-off { opacity: .35; pointer-events: none; }
  .lx-flow__arrow::after { bottom: auto; top: calc(100% + 4px); right: auto; left: 0; }
  .lx-flow__arrow--next::after { left: auto; right: 0; }
  .lx-flow__steps { flex: 1; display: flex; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-flow__step a { border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); color: var(--ink-muted); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .lx-flow__step a:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-flow__step.is-active a { background: var(--surface-selected); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
  .lx-flow__n { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: 11px; line-height: 1; }
  .lx-flow__step.is-active .lx-flow__n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-flow__sep { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
  .lx-flow__pos { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }

  /* ---------- Reading content (summaries, answers) ---------- */
  .lx-prose { color: var(--ink); line-height: 22px; }
  .lx-prose h3 { font-size: 15px; line-height: 22px; font-weight: 600; margin: var(--space-6) 0 var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .lx-prose h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .lx-prose p { margin: var(--space-2) 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: var(--space-2) 0; }
  .lx-prose li { margin: var(--space-1) 0; }
  .lx-prose code { font: 500 12.5px/1 var(--font-mono); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-prose strong { font-weight: 600; }
  .lx-prose .table-scroll { overflow-x: auto; margin: var(--space-3) 0; border: 1px solid var(--border); border-radius: var(--radius-md); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px var(--space-3); color: var(--ink-subtle); font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px var(--space-3); border-bottom: 1px solid var(--border); vertical-align: top; }
  .lx-prose tr:last-child td { border-bottom: 0; }

  .lx-en p { margin: 0; }

  /* ---------- FD tool ---------- */
  .lx-fd-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-input { min-height: 0; height: 40px; resize: none; }
  .lx-fd-row { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-fd-select { height: 32px; max-width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; padding: 0 8px; }

  @media (max-width: 900px) {
    .lx-app { display: block; }

    .lx-pop { width: 100%; }
    .lx-page { padding: var(--space-4) var(--space-4) 48px; gap: var(--space-4); }

,"content":"Final Exam","note":"Chương 6–7 (+ SQL nền tảng)","exam":"final","parts":[4]}],"setup":["-- =====================================================================\n-- University database — schema (Database System Concepts, 7th Ed.)\n-- Dialect: PostgreSQL (chạy được trên PostgreSQL 12+ và PGlite)\n-- File này xoá và tạo lại toàn bộ bảng, nên có thể chạy lại bất cứ lúc nào.\n-- =====================================================================\n\ndrop table if exists prereq cascade;\ndrop table if exists time_slot cascade;\ndrop table if exists advisor cascade;\ndrop table if exists takes cascade;\ndrop table if exists student cascade;\ndrop table if exists teaches cascade;\ndrop table if exists section cascade;\ndrop table if exists instructor cascade;\ndrop table if exists course cascade;\ndrop table if exists department cascade;\ndrop table if exists classroom cascade;\n\ncreate table classroom (\n  building      varchar(15),\n  room_number   varchar(7),\n  capacity      numeric(4,0),\n  primary key (building, room_number)\n);\n\ncreate table department (\n  dept_name     varchar(20),\n  building      varchar(15),\n  budget        numeric(12,2) check (budget > 0),\n  primary key (dept_name)\n);\n\ncreate table course (\n  course_id     varchar(8),\n  title         varchar(50),\n  dept_name     varchar(20),\n  credits       numeric(2,0) check (credits > 0),\n  primary key (course_id),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table instructor (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  salary        numeric(8,2) check (salary > 29000),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table section (\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6) check (semester in ('Fall', 'Winter', 'Spring', 'Summer')),\n  year          numeric(4,0) check (year > 1701 and year \u003c 2100),\n  building      varchar(15),\n  room_number   varchar(7),\n  time_slot_id  varchar(4),\n  primary key (course_id, sec_id, semester, year),\n  foreign key (course_id) references course (course_id)\n    on delete cascade,\n  foreign key (building, room_number) references classroom (building, room_number)\n    on delete set null\n);\n\ncreate table teaches (\n  ID            varchar(5),\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6),\n  year          numeric(4,0),\n  primary key (ID, course_id, sec_id, semester, year),\n  foreign key (course_id, sec_id, semester, year)\n    references section (course_id, sec_id, semester, year)\n    on delete cascade,\n  foreign key (ID) references instructor (ID)\n    on delete cascade\n);\n\ncreate table student (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  tot_cred      numeric(3,0) check (tot_cred >= 0),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table takes (\n  ID            varchar(5),\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6),\n  year          numeric(4,0),\n  grade         varchar(2),\n  primary key (ID, course_id, sec_id, semester, year),\n  foreign key (course_id, sec_id, semester, year)\n    references section (course_id, sec_id, semester, year)\n    on delete cascade,\n  foreign key (ID) references student (ID)\n    on delete cascade\n);\n\ncreate table advisor (\n  s_ID          varchar(5),\n  i_ID          varchar(5),\n  primary key (s_ID),\n  foreign key (i_ID) references instructor (ID)\n    on delete set null,\n  foreign key (s_ID) references student (ID)\n    on delete cascade\n);\n\ncreate table time_slot (\n  time_slot_id  varchar(4),\n  day           varchar(1),\n  start_hr      numeric(2) check (start_hr >= 0 and start_hr \u003c 24),\n  start_min     num , 'CS-315',  '1', 'Spring', 2018, 'B'),\n  ('98988', 'BIO-101', '1', 'Summer', 2017, 'A'),\n  ('98988', 'BIO-301', '1', 'Summer', 2018, null);\n\ninsert into advisor values\n  ('00128', '45565'),\n  ('12345', '10101'),\n  ('23121', '76543'),\n  ('44553', '22222'),\n  ('45678', '22222'),\n  ('76543', '45565'),\n  ('76653', '98345'),\n  ('98765', '98345'),\n  ('98988', '76766');\n\ninsert into time_slot values\n  ('A', 'M', 8,  0,  8,  50),\n  ('A', 'W', 8,  0,  8,  50),\n  ('A', 'F', 8,  0,  8,  50),\n  ('B', 'M', 9,  0,  9,  50),\n  ('B', 'W', 9,  0,  9,  50),\n  ('B', 'F', 9,  0,  9,  50),\n  ('C', 'M', 11, 0,  11, 50),\n  ('C', 'W', 11, 0,  11, 50),\n  ('C', 'F', 11, 0,  11, 50),\n  ('D', 'M', 13, 0,  13, 50),\n  ('D', 'W', 13, 0,  13, 50),\n  ('D', 'F', 13, 0,  13, 50),\n  ('E', 'T', 10, 30, 11, 45),\n  ('E', 'R', 10, 30, 11, 45),\n  ('F', 'T', 14, 30, 15, 45),\n  ('F', 'R', 14, 30, 15, 45),\n  ('G', 'M', 16, 0,  16, 50),\n  ('G', 'W', 16, 0,  16, 50),\n  ('G', 'F', 16, 0,  16, 50),\n  ('H', 'W', 10, 0,  12, 30);\n\ninsert into prereq values\n  ('BIO-301', 'BIO-101'),\n  ('BIO-399', 'BIO-101'),\n  ('CS-190',  'CS-101'),\n  ('CS-315',  'CS-101'),\n  ('CS-319',  'CS-101'),\n  ('CS-347',  'CS-101'),\n  ('EE-181',  'PHY-101');\n","-- =====================================================================\n-- Các bảng phụ dùng cho bài tập (self join, recursion, ranking,\n-- windowing, OLAP). Chạy SAU university_data.sql.\n-- =====================================================================\n\ndrop table if exists emp_super cascade;\ndrop table if exists grade_points cascade;\ndrop table if exists student_grades cascade;\ndrop table if exists dept_grades cascade;\ndrop table if exists sales cascade;\ndrop table if exists itemcategory cascade;\ndrop table if exists daily_sales cascade;\ndrop table if exists account_txn cascade;\n\n-- Slide 3: \"Self Join Example\" — relation emp-super(person, supervisor)\ncreate table emp_super (\n  person      varchar(20) primary key,\n  supervisor  varchar(20)\n);\ninsert into emp_super values\n  ('Bob',   'Alice'),\n  ('Mary',  'Susan'),\n  ('Alice', 'David'),\n  ('David', 'Mary'),\n  ('Tom',   'Bob'),\n  ('Eve',   'Alice');\n\n-- Điểm số quy đổi của từng letter grade\ncreate table grade_points (\n  grade   varchar(2) primary key,\n  points  numeric(2,1)\n);\ninsert into grade_points values\n  ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n  ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('F', 0.0);\n\n-- Slide 5: student_grades(ID, GPA) và dept_grades(ID, dept_name, GPA)\n-- GPA = sum(points * credits) / sum(credits), bỏ qua môn chưa có điểm.\n-- Sinh viên chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-01-07 11:00', 1000),\n  ('A-215', '2018-01-30 08:20', -400),\n  ('A-215', '2018-03-02 13:10', 250);\n","-- =====================================================================\n-- Bảng cho bài tập Chương 6 (E-R) — Part 2 (ch6) và Part 4 (ck1).\n-- Mọi bảng đều có prefix er_. Chạy SAU university_data.sql.\n--\n--   Specialization, method 1 (slide 6.56):   er_person, er_employee, er_student\n--   Aggregation (slide 6.61–6.64):           er_project, er_proj_guide, er_evaluation, er_eval_for\n--   Sports statistics (Practice Ex. 6.3):    er_player, er_match, er_played\n--   Temporal data (Practice Ex. 6.13):       er_t_student, er_t_student_name, er_t_instructor,\n--                                            er_t_instructor_name, er_t_advisor\n-- =====================================================================\n\ndrop table if exists er_employee, er_student, er_person cascade;\ndrop table if exists er_eval_for, er_evaluation, er_proj_guide, er_project cascade;\ndrop table if exists er_played, er_match, er_player cascade;\ndrop table if exists er_t_advisor, er_t_student_name, er_t_instructor_name, er_t_student, er_t_instructor cascade;\n\n-- ---------------------------------------------------------------- Specialization (method 1)\n-- person là entity cấp cao; employee và student là specialization\n-- **overlapping** (một người có thể vừa là employee vừa là student).\ncreate table er_person (\n  ID      varchar(5) primary key,\n  name    varchar(20) not null,\n  street  varchar(30),\n  city    varchar(20)\n);\ncreate table er_employee (\n  ID      varchar(5) primary key references er_person on delete cascade,\n  salary  numeric(8,2)\n);\ncreate table er_student (\n  ID           varchar(5) primary key references er_person on delete cascade,\n  tot_credits  numeric(3,0)\n);\ninsert into er_person values\n  ('P01', 'An',    '1 Le Loi',      'Hue'),\n  ('P02', 'Binh',  '5 Tran Phu',    'Danang'),\n  ('P03', 'Chi',   '9 Hai Ba Trung', 'Hanoi'),\n  ('P04', 'Dung',  '2 Nguyen Hue',  'Saigon'),\n  ('P05', 'Giang', '7 Ly Thuong Kiet', 'Hue'),\n  ('P06', 'Hoa',   '3 Bach Dang',   'Danang');\ninsert into er_employee values\n  ('P01', 52000), ('P02', 61000), ('P05', 45000);\ninsert into er_student values\n  ('P02', 30), ('P03', 85), ('P04', 112), ('P05', 12);\n-- P06 không thuộc specialization nào (partial specialization).\n\n-- ---------------------------------------------------------------- Aggregation\ncreate table er_project (\n  project_id  varchar(5) primary key,\n  title       varchar(40) not null\n);\n-- Quan hệ ba ngôi proj_guide(instructor, student, project).\ncreate table er_proj_guide (\n  i_ID        varchar(5) references instructor (ID),\n  s_ID        varchar(5) references student (ID),\n  project_id  varchar(5) references er_project,\n  primary key (i_ID, s_ID, project_id)\n);\ncreate table er_evaluation (\n  evaluation_id  varchar(5) primary key,\n  grade          varchar(2),\n  comments       varchar(60)\n);\n-- eval_for: quan hệ giữa aggregation proj_guide và entity evaluation.\ncreate table er_eval_for (\n  i_ID           varchar(5),\n  s_ID           varchar(5),\n  project_id     varchar(5),\n  evaluation_id  varchar(5) references er_evaluation,\n  primary key (i_ID, s_ID, project_id, evaluation_id),\n  foreign key (i_ID, s_ID, project_id) references er_proj_guide\n);\ninsert into er_project values\n  ('PJ1', 'Robot Soccer'),\n  ('PJ2', 'Genome Search'),\n  ('PJ3', 'Music Recommender'),\n  ('PJ4', 'Quantum Simulator');\ninsert into er_proj_guide values\n  ('45565', '00128', 'PJ1'),\n  ('10101', '12345', 'PJ1'),\n  ('10101', '00128', 'PJ3'),\n  ('76766', '98988', 'PJ2'),\n  ('22222', '44553', 'PJ4'),\n  ('15151', '55739', 'PJ3');\ninsert into er_evaluation values\n  ('EV1', 'A',  'Excellent prototype'),\n  ('EV2', 'B+', 'Good, needs tests'),\n  ('EV3', 'A-', 'Strong analysis'),\n  ('EV4', 'B',  'Mid-term check');\ninsert into er_eval_for values\n  ('45565', '00128', 'PJ1', 'EV1'),\n  ('10101', '12345', 'PJ1', 'EV2'),\n  ('76766', '98988', 'PJ2', 'EV3'),\n  ('76766', '98988', 'PJ2', 'EV4');\n-- ('10101','00128','PJ3'), ('22222','44553','PJ4'), ('15151','55739','PJ3') chưa được đánh giá.\n\n-- ---------------------------------------------------------------- Sports statistics (PE 6.3)\ncreate table er_player (\n  player_id  varchar(5) primary key,\n  name       varchar(20) not null,\n  age        integer\n);\ncreate table er_match (\n  match_id    varchar(5) primary key,\n  match_date  date,\n  stadium     varchar(30),\n  opponent    varchar(30),\n  own_score   integer,\n  opp_score   integer\n);\n-- played(player, match) với thuộc tính score: số điểm cầu thủ ghi trong trận.\ncreate table er_played (\n  match_id   varchar(5) references er_match,\n  player_id  varchar(5) references er_player,\n  score      integer not null default 0,\n  primary key (match_id, player_id)\n);\ninsert into er_player values\n  ('PL1', 'Minh',  24), ('PL2', 'Quang', 27), ('PL3', 'Tuan', 21),\n  ('PL4', 'Hai',   30), ('PL5', 'Long',  19);\ninsert into er_match values\n  ('M1', '2025-09-06', 'My Dinh',   'Thailand',  3, 1),\n  ('M2', '2025-09-13', 'Hang Day',  'Malaysia',  1, 1),\n  ('M3', '2025-10-04', 'Thong Nhat', 'Indonesia', 2, 0),\n  ('M4', '2025-10-11', 'My Dinh',   'Singapore', 0, 2);\ninsert into er_played values\n  ('M1', 'PL1', 2), ('M1', 'PL2', 1), ('M1', 'PL3', 0),\n  ('M2', 'PL1', 0), ('M2', 'PL2', 1), ('M2', 'PL4', 0),\n  ('M3', 'PL1', 1), ('M3', 'PL3', 1), ('M3', 'PL4', 0),\n  ('M4', 'PL2', 0), ('M4', 'PL3', 0), ('M4', 'PL4', 0);\n-- PL5 chưa thi đấu trận nào.\n\n-- ---------------------------------------------------------------- Temporal data (PE 6.13)\n-- Mỗi thuộc tính thay đổi theo thời gian thành một relation (value, start_time,\n-- end_time); end_time = 'infinity' nghĩa là vẫn còn hiệu lực.\ncreate table er_t_student (\n  student_id  varchar(5) primary key\n);\ncreate table er_t_student_name (\n  student_id  varchar(5) references er_t_student,\n  value       varchar(20),\n  start_time  date,\n  end_time    date,\n  primary key (student_id, start_time, end_time)\n);\ncreate table er_t_instructor (\n  instructor_id  varchar(5) primary key\n);\ncreate table er_t_instructor_name (\n  instructor_id  varchar(5) references er_t_instructor,\n  value          varchar(20),\n  start_time     date,\n  end_time       date,\n  primary key (instructor_id, start_time, end_time)\n);\ncreate table er_t_advisor (\n  student_id     varchar(5) references er_t_student,\n  instructor_id  varchar(5) references er_t_instructor,\n  start_time     date,\n  end_time       date,\n  primary key (student_id, instructor_id, start_time, end_time)\n);\ninsert into er_t_student values ('12345'), ('00128'), ('76543');\ninsert into er_t_student_name values\n  ('12345', 'Shankar', '2018-09-01', 'infinity'),\n  ('00128', 'Zhang',   '2015-09-01', '2019-05-31'),\n  ('76543', 'Brown',   '2017-09-01', '2020-12-31'),\n  ('76543', 'Browne',  '2021-01-01', 'infinity');\ninsert into er_t_instructor values ('22222'), ('83821'), ('45565');\ninsert into er_t_instructor_name values\n  ('22222', 'Einstein', '2010-01-01', 'infinity'),\n  ('83821', 'Brandt',   '2012-01-01', 'infinity'),\n  ('45565', 'Katz',     '2014-01-01', 'infinity');\ninsert into er_t_advisor values\n  ('12345', '22222', '2018-05-01', '2018-12-31'),\n  ('12345', '45565', '2019-01-01', '2019-05-31'),\n  ('12345', '22222', '2019-06-01', '2020-01-31'),\n  ('12345', '83821', '2020-02-01', 'infinity'),\n  ('00128', '45565', '2015-09-01', '2019-05-31'),\n  ('76543', '83821', '2017-09-01', '2019-08-31'),\n  ('76543', '22222', '2019-09-01', 'infinity');\n","-- =====================================================================\n-- Bảng cho bài tập Chương 7 (Normalization) — Part 2 và Part 4.\n-- Mọi bảng bắt đầu bằng nf_. Chạy SAU university_data.sql (một số bảng\n-- được sinh từ University database).\n-- =====================================================================\n\ndrop table if exists nf_in_dep, nf_class, nf_employee, nf_enroll_raw, nf_dept_advisor,\n  nf_cust_banker, nf_inst_info, nf_r_abc, nf_pe79_r, nf_pe79_clean, nf_pe71, nf_pe710,\n  nf_pe717, nf_pe720 cascade;\n\n-- Slide 7.3: in_dep = instructor ⋈ department (lặp building, budget)\ncreate table nf_in_dep as\nselect i.ID, i.name, i.salary, i.dept_name, d.building, d.budget\nfrom instructor i join department d on d.dept_name = i.dept_name;\n\n-- Slide 7.58: class = course ⋈ section ⋈ classroom\ncreate table nf_class as\nselect c.course_id, c.title, c.dept_name, c.credits,\n       s.sec_id, s.semester, s.year, s.building, s.room_number, r.capacity, s.time_slot_id\nfrom section s\n     join course c on c.course_id = s.course_id\n     join classroom r on r.building = s.building and r.room_number = s.room_number;\n\n-- Slide 7.5: employee(ID, name, street, city, salary) — có hai nhân viên tên Kim\ncreate table nf_employee (\n  ID      varchar(5) primary key,\n  name    varchar(20),\n  street  varchar(20),\n  city    varchar(20),\n  salary  numeric(8,0)\n);\ninsert into nf_employee values\n  ('57766', 'Kim',   'Main',  'Perryridge', 75000),\n  ('98776', 'Kim',   'North', 'Hampton',    67000),\n  ('11223', 'Lee',   'Oak',   'Brooklyn',   58000),\n  ('33445', 'Patel', 'Elm',   'Rye',        81000);\n\n-- Dữ liệu \"bẩn\" để kiểm tra FD: student_id → student_name, course_id → course_title\ncreate table nf_enroll_raw (\n  student_id    varchar(5),\n  student_name  varchar(20),\n  course_id     varchar(8),\n  course_title  varchar(40),\n  grade         varchar(2)\n);\ninsert into nf_enroll_raw values\n  ('S001', 'An',   'CS-101', 'Intro. to Computer Science', 'A'),\n  ('S001', 'An',   'CS-190', 'Game Design',                'B+'),\n  ('S002', 'Binh', 'CS-101', 'Intro. to Computer Science', 'B'),\n  ('S002', 'Bihn', 'MU-199', 'Music Video Production',     'A-'),\n  ('S003', 'Chi',  'CS-101', 'Intro to CS',                'C'),\n  ('S003', 'Chi',  'BIO-101','Intro. to Biology',          'A'),\n  ('S004', 'Dung', 'BIO-101','Intro. to Biology',          'B');\n\n-- Slide 7.19 / 7.26: dept_advisor(s_ID, i_ID, dept_name)\n--   i_ID → dept_name ;  s_ID, dept_name → i_ID\ncreate table nf_dept_advisor (\n  s_ID       varchar(5),\n  i_ID       varchar(5),\n  dept_name  varchar(20),\n  primary key (s_ID, i_ID)\n);\ninsert into nf_dept_advisor values\n  ('00128', '10101', 'Comp. Sci.'),\n  ('00128', '22222', 'Physics'),\n  ('12345', '45565', 'Comp. Sci.'),\n  ('12345', '32343', 'History'),\n  ('19991', '83821', 'Comp. Sci.'),\n  ('23121', '10101', 'Comp. Sci.'),\n  ('23121', '22222', 'Physics');\n\n-- Slide 7.65: cust_banker_branch(customer_id, employee_id, branch_name, type)\n--   customer_id, employee_id → type ; employee_id → branch_name ;\n--   customer_id, branch_name → employee_id\ncreate table nf_cust_banker (\n  customer_id  varchar(5),\n  employee_id  varchar(5),\n  branch_name  varchar(20),\n  type         varchar(10),\n  primary key (customer_id, employee_id)\n);\ninsert into nf_cust_banker values\n  ('C1', 'E1', 'Downtown', 'checking'),\n  ('C1', 'E3', 'Uptown',   'loan'),\n  ('C2', 'E1', 'Downtown', 'loan'),\n  ('C2', 'E2', 'Brighton', 'savings'),\n  ('C3', 'E3', 'Uptown',   'checking'),\n  ('C3', 'E4', 'Downtown', 'checking');\n\n-- Slide 7.33–7.35: inst_info(ID, child_name, phone) — ID →→ child_name, ID →→ phone.\n-- Instructor 88888 cố ý thiếu một tổ hợp (Ben, 512-555-2222) → MVD bị vi phạm trên instance.\ncreate table nf_inst_info (\n  ID          varchar(5),\n  child_name  varchar(20),\n  phone       varchar(12)\n);\ninsert into nf_inst_info values\n  ('99999', 'David',   '512-555-1234'),\n  ('99999', 'David',   '512-555-4321'),\n  ('99999', 'William', '512-555-1234'),\n  ('99999', 'William', '512-555-4321'),\n  ('88888', 'Anna',    '512-555-1111'),\n  ('88888', 'Anna',    '512-555-2222'),\n  ('88888', 'Ben',     '512-555-1111');\n\n-- PE 7.2 (Figure 7.17): r(A, B, C)\ncreate table nf_r_abc (a varchar(2), b varchar(2), c integer);\ninsert into nf_r_abc values ('a1', 'b1', 1), ('a1', 'b1', 2), ('a2', 'b1', 1), ('a2', 'b1', 3);\n\n-- PE 7.9: r(A, B, C) — nf_pe79_r vi phạm B → C ở b = 'y'; nf_pe79_clean thoả B → C.\ncreate table nf_pe79_r (a integer primary key, b varchar(2), c integer);\ninsert into nf_pe79_r values (1, 'x', 10), (2, 'x', 10), (3, 'y', 20), (4, 'y', 21), (5, 'z', 30);\ncreate table nf_pe79_clean (a integer primary key, b varchar(2), c integer);\ninsert into nf_pe79_clean values (1, 'x', 10), (2, 'x', 10), (3, 'y', 20);\n\n-- PE 7.1 / 7.6 / 7.13: R(A, B, C, D, E), F = {A → BC, CD → E, B → D, E → A}\ncreate table nf_pe71 (a varchar(2) primary key, b varchar(2), c varchar(2), d varchar(2), e varchar(2));\ninsert into nf_pe71 values\n  ('a1', 'b1', 'c1', 'd1', 'e1'),\n  ('a2', 'b2', 'c1', 'd2', 'e2'),\n  ('a3', 'b1', 'c2', 'd1', 'e3'),\n  ('a4', 'b3', 'c3', 'd3', 'e4');\n\n-- PE 7.10: R(A, B, C) với A → B, có null ở A\ncreate table nf_pe710 (a integer, b varchar(2), c varchar(2));\ninsert into nf_pe710 values (1, 'b1', 'c1'), (2, 'b2', 'c2'), (null, 'b3', 'c3'), (null, 'b4', 'c4');\n\n-- PE 7.17: R(A, B, C, D), F = {A → B, C → D, B → C}\ncreate table nf_pe717 (a varchar(2) primary key, b varchar(2), c varchar(2), d varchar(2));\ninsert into nf_pe717 values\n  ('a1', 'b1', 'c1', 'd1'),\n  ('a2', 'b1', 'c1', 'd1'),\n  ('a3', 'b2', 'c2', 'd2'),\n  ('a4', 'b3', 'c2', 'd2');\n\n-- PE 7.20: R(A, B, C) với A →→ B (đủ mọi tổ hợp B × C cho mỗi A)\ncreate table nf_pe720 (a varchar(2), b varchar(2), c varchar(2));\ninsert into nf_pe720 values\n  ('a1', 'b1', 'c1'), ('a1', 'b1', 'c2'), ('a1', 'b2', 'c1'), ('a1', 'b2', 'c2'),\n  ('a2', 'b3', 'c3'), ('a2', 'b3', 'c4');\n"],"setupFiles":["lab/db/university_schema.sql","lab/db/university_data.sql","lab/db/extra_tables.sql","lab/db/er_tables.sql","lab/db/normalization_tables.sql"],"schemaGroups":[{"title":"University database (theo sách)","note":"","core":true,"tables":[{"table":"classroom","columns":[{"column":"building","type":"character varying(15)","pk":true},{"column":"room_number","type":"character varying(7)","pk":true},{"column":"capacity","type":"numeric(4,0)","pk":false}]},{"table":"department","columns":[{"column":"dept_name","type":"character varying(20)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"budget","type":"numeric(12,2)","pk":false}]},{"table":"course","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"title","type":"character varying(50)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"credits","type":"numeric(2,0)","pk":false}]},{"table":"instructor","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"name","type":"character varying(20)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"salary","type":"numeric(8,2)","pk":false}]},{"table":"section","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"sec_id","type":"character varying(8)","pk":true},{"column":"semester","type":"character varying(6)","pk":true},{"column":"year","type":"numeric(4,0)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"room_number","type":"character varying(7)","pk":false},{"column":"time_slot_id","type":"character varying(4)","pk":false}]},{"table":"teaches","columns":[{"column":"id","type": ic(2,1)","pk":false}]},{"table":"itemcategory","columns":[{"column":"item_name","type":"character varying(10)","pk":true},{"column":"category","type":"character varying(15)","pk":false}]},{"table":"sales","columns":[{"column":"item_name","type":"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"ch6","store":"6","short":"6","label":"Chương 6","navLabel":"Chương 6","kind":"Chương","title":"Database Design Using the E-R Model","titleVi":"Thiết kế CSDL bằng mô hình E-R","summary":"\u003ch3>0. Phạm vi theo lịch học\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tuần\u003c/th>\u003cth>Slide (số ở chân trang)\u003c/th>\u003cth>Nội dung\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>6.1 – 6.43\u003c/td>\u003ctd>Design phases, entity set, relationship set, attribute (simple/composite, single/multivalued, derived), mapping cardinality, participation, primary key, weak entity set, redundant attribute, E-R diagram của University\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>6.44 – 6.73\u003c/td>\u003ctd>\u003cstrong>Reduction to relation schemas\u003c/strong>, extended E-R (specialization, generalization, completeness constraint, aggregation), design issues (lỗi thường gặp, entity vs attribute, entity vs relationship, binary vs n-ary), E-R design decisions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>(đọc thêm)\u003c/td>\u003ctd>6.74 – 6.84\u003c/td>\u003ctd>Bảng ký hiệu, ký hiệu Chen / crow's foot, UML class diagram\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>1. Các pha thiết kế\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Requirements\u003c/strong>: mô tả đầy đủ nhu cầu dữ liệu của người dùng.\u003c/li>\u003cli>\u003cstrong>Conceptual design\u003c/strong>: chọn data model (ở đây là E-R) và dịch yêu cầu thành \u003cem>conceptual schema\u003c/em>; mô tả cả các thao tác (functional requirements).\u003c/li>\u003cli>\u003cstrong>Logical design\u003c/strong>: chuyển sang lược đồ quan hệ (bài toán \"chia thuộc tính vào các relation\" — Khoa học máy tính) và quyết định lưu thuộc tính nào (bài toán nghiệp vụ).\u003c/li>\u003cli>\u003cstrong>Physical design\u003c/strong>: tổ chức lưu trữ vật lý.\u003c/li>\u003c/ol>\n\u003cp>Hai cạm bẫy cần tránh: \u003cstrong>redundancy\u003c/strong> (lặp thông tin → không nhất quán) và \u003cstrong>incompleteness\u003c/strong> (không mô hình hoá được một khía cạnh của doanh nghiệp).\u003c/p>\n\u003ch3>2. Entity set, relationship set, attribute\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Entity\u003c/strong> = đối tượng phân biệt được; \u003cstrong>entity set\u003c/strong> = tập các entity cùng loại (hình chữ nhật). Thuộc tính khoá gạch chân.\u003c/li>\u003cli>\u003cstrong>Relationship set\u003c/strong> (hình thoi) = quan hệ toán học trên ≥ 2 entity set: {(e\u003csub>1\u003c/sub>, …, e\u003csub>n\u003c/sub>) | e\u003csub>i\u003c/sub> ∈ E\u003csub>i\u003c/sub>}. Relationship set có thể có \u003cstrong>thuộc tính riêng\u003c/strong> (ví dụ \u003ccode>date\u003c/code> của advisor) — vẽ trong hình chữ nhật nối nét đứt.\u003c/li>\u003cli>\u003cstrong>Role\u003c/strong>: khi một entity set xuất hiện nhiều lần trong cùng relationship set (prereq: course_id và prereq_id).\u003c/li>\u003cli>\u003cstrong>Degree\u003c/strong>: binary (phổ biến), ternary (ví dụ proj_guide(instructor, student, project)).\u003c/li>\u003cli>Thuộc tính: \u003cstrong>simple / composite\u003c/strong> (name → first_name, middle_initial, last_name), \u003cstrong>single-valued / multivalued\u003c/strong> \u003ccode>{phone_number}\u003c/code>, \u003cstrong>derived\u003c/strong> \u003ccode>age()\u003c/code> (tính từ date_of_birth). \u003cstrong>Domain\u003c/strong> = tập giá trị cho phép.\u003c/li>\u003c/ul>\n\u003ch3>3. Ràng buộc\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ràng buộc\u003c/th>\u003cth>Ký hiệu\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>one-to-one\u003c/td>\u003ctd>mũi tên ở cả hai phía\u003c/td>\u003ctd>mỗi A ↔ tối đa một B và ngược lại\u003c/td>\u003c/tr>\u003ctr>\u003ctd>one-to-many (instructor → student)\u003c/td>\u003ctd>mũi tên về phía \"one\" (instructor)\u003c/td>\u003ctd>một instructor nhiều student, mỗi student ≤ 1 instructor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>many-to-many\u003c/td>\u003ctd>không mũi tên\u003c/td>\u003ctd>không giới hạn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>total participation\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>đường đôi\u003c/strong>\u003c/td>\u003ctd>mọi entity phải tham gia ít nhất một relationship\u003c/td>\u003c/tr>\u003ctr>\u003ctd>partial participation\u003c/td>\u003ctd>đường đơn\u003c/td>\u003ctd>có thể không tham gia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>l..h\u003c/code>\u003c/td>\u003ctd>ghi trên đường nối\u003c/td>\u003ctd>min..max số relationship mà mỗi entity tham gia; \u003ccode>1..1\u003c/code> = total + tối đa 1; \u003ccode>0..*\u003c/code> = không ràng buộc\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Với quan hệ \u003cstrong>ternary\u003c/strong>, chỉ cho phép \u003cstrong>tối đa một mũi tên\u003c/strong> (nhiều mũi tên có thể hiểu theo hai cách khác nhau).\u003c/p>\n\u003ch3>4. Primary key\u003c/h3>\n\u003cul>\u003cli>Entity set: một superkey tối thiểu được chọn.\u003c/li>\u003cli>Relationship set R giữa E\u003csub>1\u003c/sub>…E\u003csub>n\u003c/sub>: hợp các primary key của E\u003csub>i\u003c/sub> là superkey. Chọn primary key theo cardinality:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cardinality của R(A, B)\u003c/th>\u003cth>Primary key của R\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>many-to-many\u003c/td>\u003ctd>PK(A) ∪ PK(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>one-to-many (A \"one\", B \"many\")\u003c/td>\u003ctd>PK(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>many-to-one (A \"many\")\u003c/td>\u003ctd>PK(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>one-to-one\u003c/td>\u003ctd>PK(A) hoặc PK(B)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>5. Weak entity set\u003c/h3>\n\u003cul>\u003cli>Không có đủ thuộc tính để tạo primary key; tồn tại \u003cstrong>phụ thuộc\u003c/strong> vào một \u003cstrong>identifying (owner) entity set\u003c/strong> qua \u003cstrong>identifying relationship\u003c/strong> (many-to-one, \u003cstrong>total\u003c/strong> từ phía weak).\u003c/li>\u003cli>Ký hiệu: hình chữ nhật \u003cstrong>đôi\u003c/strong>, hình thoi đôi; \u003cstrong>discriminator\u003c/strong> (partial key) gạch chân \u003cstrong>nét đứt\u003c/strong>.\u003c/li>\u003cli>PK(weak) = PK(owner) ∪ discriminator. Ví dụ section(\u003cu>sec_id, semester, year\u003c/u>) phụ thuộc course → PK = (course_id, sec_id, semester, year).\u003c/li>\u003cli>\u003cstrong>Redundant attribute\u003c/strong>: nếu student có thuộc tính dept_name và cũng có relationship stud_dept tới department thì dept_name là thừa → bỏ khỏi entity (nó sẽ quay lại khi chuyển sang bảng).\u003c/li>\u003c/ul>\n\u003ch3>6. Reduction to relation schemas (slide 6.44–6.52)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Thành phần E-R\u003c/th>\u003cth>Lược đồ quan hệ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Strong entity set\u003c/td>\u003ctd>cùng tên, cùng thuộc tính đơn: student(\u003cu>ID\u003c/u>, name, tot_cred)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Composite attribute\u003c/td>\u003ctd>\u003cstrong>làm phẳng\u003c/strong>: name.first_name → \u003ccode>first_name\u003c/code> (bỏ thuộc tính cha)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multivalued attribute M của E\u003c/td>\u003ctd>bảng riêng EM(PK(E), M), PK = tất cả; FK → E. Ví dụ inst_phone(\u003cu>ID, phone_number\u003c/u>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Derived attribute\u003c/td>\u003ctd>không lưu; tính bằng view/hàm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weak entity set\u003c/td>\u003ctd>bảng gồm PK(owner) + discriminator + thuộc tính; FK → owner (\u003cstrong>on delete cascade\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relationship many-to-many\u003c/td>\u003ctd>bảng gồm PK các bên + thuộc tính của relationship\u003c/td>\u003c/tr>\u003ctr>\u003ctd>many-to-one / one-to-many, \u003cstrong>total\u003c/strong> phía many\u003c/td>\u003ctd>\u003cstrong>không\u003c/strong> tạo bảng riêng: thêm PK phía \"one\" vào bảng phía \"many\" (inst_dept → cột dept_name trong instructor)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>many-to-one, partial phía many\u003c/td>\u003ctd>vẫn có thể gộp, giá trị null cho entity không tham gia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>one-to-one\u003c/td>\u003ctd>gộp vào bên nào cũng được; thêm \u003ccode>unique\u003c/code> để giữ đúng one-to-one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identifying relationship của weak entity\u003c/td>\u003ctd>thừa — đã nằm trong bảng weak entity\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Ràng buộc trong SQL\u003c/strong>: many-to-one được ép bởi PK; one-to-one cần thêm \u003ccode>unique\u003c/code>; total participation của phía many (sau khi gộp) ép bằng \u003ccode>not null\u003c/code>; total participation phía \"one\" hoặc của many-to-many \u003cstrong>không\u003c/strong> ép được bằng PK/FK/not null (cần assertion/trigger).\u003c/p>\n\u003ch3>7. Extended E-R features\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Specialization\u003c/strong> (top-down, ISA, tam giác): entity con thừa kế thuộc tính + relationship của cha. \u003cstrong>Overlapping\u003c/strong> (employee & student; mũi tên riêng) vs \u003cstrong>disjoint\u003c/strong> (instructor | secretary; mũi tên chung). \u003cstrong>Generalization\u003c/strong> = bottom-up, cùng ký hiệu.\u003c/li>\u003cli>\u003cstrong>Completeness constraint\u003c/strong>: \u003cstrong>total\u003c/strong> (mọi entity cha phải thuộc ít nhất một entity con) vs \u003cstrong>partial\u003c/strong> (mặc định).\u003c/li>\u003cli>Chuyển specialization thành bảng:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cách\u003c/th>\u003cth>Bảng\u003c/th>\u003cth>Ưu / nhược\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Method 1\u003c/td>\u003ctd>person(\u003cu>ID\u003c/u>, name, street, city), employee(\u003cu>ID\u003c/u>, salary), student(\u003cu>ID\u003c/u>, tot_cred); ID con là FK → cha\u003c/td>\u003ctd>Không lặp dữ liệu; lấy đủ thông tin employee phải \u003cstrong>join\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Method 2\u003c/td>\u003ctd>employee(\u003cu>ID\u003c/u>, name, street, city, salary), student(\u003cu>ID\u003c/u>, name, street, city, tot_cred)\u003c/td>\u003ctd>Không cần join; nếu \u003cstrong>overlapping\u003c/strong> thì name/street/city bị \u003cstrong>lặp\u003c/strong>; nếu specialization partial thì cần bảng person cho entity không thuộc con nào; FK tới \"person\" khó\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Aggregation\u003c/strong>: coi một relationship (proj_guide) như một entity trừu tượng để nó tham gia relationship khác (eval_for với evaluation). Bảng eval_for(\u003cu>PK(proj_guide), evaluation_id\u003c/u>), FK → proj_guide. Tránh được việc tạo ternary eval_for(instructor, student, project, evaluation) lặp thông tin với proj_guide.\u003c/li>\u003c/ul>\n\u003ch3>8. Design issues\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Lỗi thường gặp\u003c/strong>: dùng PK của entity khác làm thuộc tính (dept_name trong student khi đã có stud_dept); dùng thuộc tính relationship sai chỗ (gán \u003ccode>assignment_marks\u003c/code> single-valued vào takes thay vì multivalued/entity riêng).\u003c/li>\u003cli>\u003cstrong>Entity hay attribute?\u003c/strong> phone là attribute nếu chỉ lưu số; là entity nếu cần thêm thông tin (location, loại) hoặc dùng chung.\u003c/li>\u003cli>\u003cstrong>Entity hay relationship?\u003c/strong> Một hành động giữa các entity thường là relationship; tách thành entity (registration) khi nó có thuộc tính/quan hệ riêng.\u003c/li>\u003cli>\u003cstrong>Binary hay n-ary?\u003c/strong> n-ary thể hiện rõ việc nhiều entity cùng tham gia (proj_guide). Có thể thay R(A, B, C) bằng entity E + ba relationship R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub> (E có thuộc tính định danh riêng), nhưng phải dịch cả ràng buộc và có thể sinh ra instance không ứng với R nào.\u003c/li>\u003cli>\u003cstrong>Design decisions\u003c/strong>: attribute hay entity; relationship hay entity; binary hay n-ary; có dùng weak entity/specialization/aggregation không.\u003c/li>\u003c/ul>\n\u003ch3>9. Ký hiệu (đọc đề)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ý nghĩa\u003c/th>\u003cth>Sách (Chen cải tiến)\u003c/th>\u003cth>Crow's foot\u003c/th>\u003cth>UML\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Many\u003c/td>\u003ctd>không mũi tên\u003c/td>\u003ctd>chân chim\u003c/td>\u003ctd>\u003ccode>*\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One\u003c/td>\u003ctd>mũi tên\u003c/td>\u003ctd>gạch đứng\u003c/td>\u003ctd>\u003ccode>1\u003c/code> / \u003ccode>0..1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Total\u003c/td>\u003ctd>đường đôi\u003c/td>\u003ctd>gạch đứng ở phía đối diện (\"ít nhất một\")\u003c/td>\u003ctd>\u003ccode>1..*\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weak entity\u003c/td>\u003ctd>chữ nhật đôi\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Lưu ý: UML ghi cardinality ở \u003cstrong>phía ngược\u003c/strong> so với \u003ccode>l..h\u003c/code> của sách.\u003c/p>","quiz":[{"q":"Trong E-R diagram của sách, \u003cstrong>đường đôi\u003c/strong> nối entity set với relationship set biểu diễn điều gì?","options":["Many-to-many","Total participation","Weak entity set","Derived attribute"],"answer":1,"explain":"Đường đôi = mọi entity của entity set phải tham gia ít nhất một relationship."},{"q":"advisor là one-to-many từ instructor tới student (một instructor nhiều student). Mũi tên được vẽ ở đâu?","options":["Từ advisor tới student","Từ advisor tới instructor","Cả hai phía","Không có mũi tên"],"answer":1,"explain":"Mũi tên chỉ về phía \"one\": mỗi student có tối đa một instructor."},{"q":"Nhãn \u003ccode>1..1\u003c/code> trên đường nối student — advisor nghĩa là gì?","options":["Mỗi student có đúng một advisor","Mỗi student có tối đa một advisor","Mỗi instructor có đúng một student","Advisor là quan hệ one-to-one"],"answer":0,"explain":"min = 1 (total participation) và max = 1."},{"q":"Primary key của relationship set many-to-many R giữa A và B là gì?","options":["PK(A)","PK(B)","PK(A) ∪ PK(B)","Một thuộc tính mới"],"answer":2,"explain":"Một cặp (a, b) chỉ xuất hiện một lần; mỗi a có thể đi với nhiều b và ngược lại."},{"q":"R là many-to-one từ A tới B. Primary key của R là?","options":["PK(A)","PK(B)","PK(A) ∪ PK(B)","Không xác định được"],"answer":0,"explain":"Mỗi a liên kết tối đa một b nên PK(A) đã xác định duy nhất relationship."},{"q":"Discriminator của weak entity set được vẽ thế nào?","options":["Gạch chân nét liền","Gạch chân nét đứt","Trong ngoặc nhọn {}","Kèm dấu ()"],"answer":1,"explain":"Gạch chân nét đứt = partial key; {} là multivalued; () là derived."},{"q":"Primary key của bảng sinh ra từ weak entity set section (discriminator sec_id, semester, year; owner course) là?","options":["(sec_id, semester, year)","(course_id)","(course_id, sec_id, semester, year)","(sec_id)"],"answer":2,"explain":"PK(weak) = PK(owner) ∪ discriminator."},{"q":"Identifying relationship của một weak entity set có đặc điểm nào?","options":["Many-to-many, partial","Many-to-one từ weak tới owner, total phía weak","One-to-one, partial","Luôn có thuộc tính riêng"],"answer":1,"explain":"Mỗi entity yếu thuộc đúng một owner và phải có owner."},{"q":"Thuộc tính multivalued \u003ccode>{phone_number}\u003c/code> của instructor được chuyển thành gì?","options":["Cột phone_number trong instructor","Bảng inst_phone(ID, phone_number) với PK (ID, phone_number)","Bảng inst_phone(phone_number) với PK phone_number","Không lưu"],"answer":1,"explain":"Mỗi giá trị là một dòng; PK gồm cả hai cột; ID là FK → instructor."},{"q":"Composite attribute \u003ccode>address(street, city, zip)\u003c/code> được chuyển thành bảng thế nào?","options":["Một cột address kiểu text","Bảng riêng address","Các cột street, city, zip (làm phẳng)","Một cột JSON"],"answer":2,"explain":"Làm phẳng: mỗi thành phần đơn thành một cột, bỏ thuộc tính cha."},{"q":"inst_dept là many-to-one từ instructor tới department, total phía instructor. Cách chuyển hợp lý nhất?","options":["Tạo bảng inst_dept(ID, dept_name)","Thêm dept_name vào instructor (not null), không tạo bảng riêng","Thêm ID vào department","Gộp instructor và department"],"answer":1,"explain":"Bảng inst_dept sẽ có PK = ID trùng với instructor → gộp vào instructor; total → not null."},{"q":"Với relationship one-to-one giữa A và B được gộp vào bảng của A (thêm cột b_id), cần thêm ràng buộc gì để giữ đúng one-to-one?","options":["primary key (b_id)","unique (b_id)","not null (b_id)","check (b_id > 0)"],"answer":1,"explain":"Không có unique thì nhiều a có thể trỏ tới cùng một b → many-to-one."},{"q":"Specialization person → {employee, student} là \u003cstrong>overlapping\u003c/strong> nghĩa là?","options":["Một person có thể vừa là employee vừa là student","Mỗi person phải thuộc ít nhất một entity con","Một person chỉ thuộc tối đa một entity con","employee và student có cùng thuộc tính"],"answer":0,"explain":"Overlapping vẽ hai mũi tên riêng; disjoint vẽ một mũi tên chung."},{"q":"Total generalization (completeness constraint) nghĩa là?","options":["Mỗi entity cha phải thuộc ít nhất một entity con","Entity con có mọi thuộc tính của cha","Các entity con rời nhau","Có tối đa hai entity con"],"answer":0,"explain":"Partial là mặc định; total vẽ bằng nét đôi / ghi \"total\"."},{"q":"Nhược điểm của \u003cstrong>method 2\u003c/strong> (mỗi entity con một bảng chứa cả thuộc tính của cha) khi specialization là overlapping?","options":["Phải join để lấy thông tin","Thuộc tính của cha bị lặp ở nhiều bảng","Không biểu diễn được entity con","Không có primary key"],"answer":1,"explain":"Một người vừa là employee vừa là student có name/street/city ở cả hai bảng."},{"q":"Aggregation được dùng khi nào?","options":["Khi cần tính tổng (sum)","Khi một relationship cần tham gia vào một relationship khác","Khi entity có thuộc tính multivalued","Khi có specialization"],"answer":1,"explain":"Ví dụ eval_for nối proj_guide (relationship) với evaluation."},{"q":"Trong quan hệ ternary, vì sao sách chỉ cho phép tối đa một mũi tên?","options":["Vì SQL không hỗ trợ","Vì nhiều mũi tên có thể hiểu theo hai nghĩa khác nhau","Vì ternary luôn là many-to-many","Vì mũi tên chỉ dùng cho weak entity"],"answer":1,"explain":"A→, B→ có thể là \"mỗi (A,C) có một B và mỗi (B,C) có một A\" hoặc \"mỗi C có một (A,B)\"..."},{"q":"student có thuộc tính dept_name và đồng thời có relationship stud_dept tới department. Đây là lỗi gì?","options":["Weak entity","Redundant attribute","Composite attribute","Role"],"answer":1,"explain":"dept_name lặp thông tin của stud_dept → bỏ khỏi entity student."},{"q":"Phone nên được mô hình là \u003cstrong>entity\u003c/strong> thay vì attribute khi nào?","options":["Khi mỗi người chỉ có một số","Khi cần lưu thêm thông tin về số điện thoại (loại, vị trí) hoặc nhiều người dùng chung","Khi số điện thoại là số nguyên","Không bao giờ"],"answer":1,"explain":"Entity cho phép có thuộc tính và relationship riêng."}],"questions":[{"q":"Phân biệt redundancy và incompleteness trong thiết kế. Cho ví dụ mỗi loại với University database.","en":"","answer":"\u003cul>\u003cli>\u003cstrong>Redundancy\u003c/strong>: một thông tin được lưu nhiều lần, ví dụ gộp instructor và department thành in_dep → building, budget của khoa lặp ở mỗi giảng viên; sửa một bản sẽ không nhất quán.\u003c/li>\u003cli>\u003cstrong>Incompleteness\u003c/strong>: thiết kế không biểu diễn được một khía cạnh, ví dụ chỉ có bảng section chứa cả thông tin course → không lưu được một course chưa mở section nào.\u003c/li>\u003c/ul>"},{"q":"Đọc diagram: \u003ccode>[instructor] &lt;---- &lt;advisor&gt; ==== [student]\u003c/code> — instructor(ID, name), student(ID, name), relationship advisor có thuộc tính \u003ccode>date\u003c/code>; mũi tên chỉ về instructor, đường đôi ở phía student. Cho biết cardinality, participation, rồi viết các lược đồ quan hệ.","en":"","answer":"\u003cul>\u003cli>Mũi tên về instructor → mỗi student có \u003cstrong>tối đa một\u003c/strong> advisor: \u003cstrong>many-to-one\u003c/strong> từ student tới instructor (one-to-many từ instructor).\u003c/li>\u003cli>Đường đôi phía student → \u003cstrong>total\u003c/strong>: mỗi student phải có advisor. Phía instructor partial.\u003c/li>\u003cli>Lược đồ: instructor(\u003cu>ID\u003c/u>, name), student(\u003cu>ID\u003c/u>, name), và do total + many-to-one có thể gộp: student(\u003cu>ID\u003c/u>, name, advisor_id \u003cstrong>not null\u003c/strong> → instructor, advisor_date). Nếu để bảng riêng: advisor(\u003cu>s_ID\u003c/u>, i_ID, date).\u003c/li>\u003c/ul>"},{"q":"Vì sao section được mô hình là weak entity set? Nêu một cách khác tránh weak entity và nhược điểm của nó.","en":"","answer":"\u003cp>section không có course_id thì không định danh được (sec_id 1 của Fall 2017 có ở nhiều course). Thay vì lưu course_id trong section (trùng với relationship sec_course), ta coi section là weak, phụ thuộc course qua sec_course.\u003c/p>\n\u003cp>Cách khác: cho section một thuộc tính định danh riêng \u003ccode>section_id\u003c/code> (strong entity). Nhược điểm: mất ràng buộc tự nhiên (course_id, sec_id, semester, year) phải unique — phải khai báo thêm; khoá nhân tạo khó đọc.\u003c/p>"},{"q":"Cho entity set instructor(ID, name(first_name, last_name), address(street(street_number, street_name), city), {phone_number}, date_of_birth, age()). Viết các lược đồ quan hệ.","en":"","answer":"\u003cul>\u003cli>instructor(\u003cu>ID\u003c/u>, first_name, last_name, street_number, street_name, city, date_of_birth) — composite làm phẳng; age() là derived nên không lưu.\u003c/li>\u003cli>instructor_phone(\u003cu>ID, phone_number\u003c/u>), ID → instructor.\u003c/li>\u003cli>age tính bằng view, ví dụ \u003ccode>extract(year from age(date_of_birth))\u003c/code>.\u003c/li>\u003c/ul>"},{"q":"Một relationship many-to-one R từ A tới B. Khi nào nên gộp R vào bảng A, khi nào giữ bảng riêng?","en":"","answer":"\u003cp>Gộp (thêm PK(B) vào A) khi A tham gia \u003cstrong>total\u003c/strong> hoặc hầu hết a đều có b — tránh join, PK vẫn là PK(A). Nếu participation của A rất partial, cột FK sẽ nhiều null; khi đó có thể giữ bảng R(\u003cu>PK(A)\u003c/u>, PK(B), thuộc tính của R). Cả hai đều đúng về mặt logic.\u003c/p>"},{"q":"Specialization person → employee, student (overlapping, partial). So sánh method 1 và method 2 khi chuyển sang bảng; với dữ liệu nào thì method 2 không đủ?","en":"","answer":"\u003cul>\u003cli>\u003cstrong>Method 1\u003c/strong>: person(ID, name, street, city), employee(ID, salary), student(ID, tot_cred); không lặp; lấy thông tin đầy đủ employee cần join với person.\u003c/li>\u003cli>\u003cstrong>Method 2\u003c/strong>: employee(ID, name, street, city, salary), student(ID, name, street, city, tot_cred); không join, nhưng người vừa là employee vừa là student bị lặp name/street/city.\u003c/li>\u003cli>Vì là \u003cstrong>partial\u003c/strong>, một person không phải employee hay student (ví dụ khách) \u003cstrong>không có chỗ\u003c/strong> lưu trong method 2 → phải thêm bảng person (hoặc dùng method 1). Method 2 chỉ thật sự phù hợp khi specialization \u003cstrong>disjoint và total\u003c/strong>.\u003c/li>\u003c/ul>"},{"q":"Vẽ (dạng chữ) và giải thích aggregation cho bài toán: instructor hướng dẫn student làm project (proj_guide), và mỗi lần hướng dẫn có các evaluation. Vì sao không dùng ternary eval_for(instructor, student, project, evaluation)?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>+------------------------------------------+\n| [instructor] -- &lt;proj_guide&gt; -- [student]|\n|                      |                   |\n|                  [project]               |\n+------------------------------------------+\n                  |\n              &lt;eval_for&gt; ---- [evaluation]\u003c/code>\u003c/pre>\n\u003cp>Hộp ngoài là aggregation (proj_guide xem như entity). Bảng: eval_for(\u003cu>i_ID, s_ID, project_id, evaluation_id\u003c/u>), FK (i_ID, s_ID, project_id) → proj_guide.\u003c/p>\n\u003cp>Nếu dùng quan hệ 4 ngôi: mỗi tuple eval_for chứa lại (i, s, p) đã có trong proj_guide → \u003cstrong>lặp thông tin\u003c/strong>, và không biểu diễn được ràng buộc \"chỉ đánh giá những bộ (i, s, p) có tồn tại trong proj_guide\".\u003c/p>"},{"q":"Giải thích cách thay ternary R(A, B, C) bằng entity set E và ba binary relationship. Những vấn đề nào phát sinh?","en":"","answer":"\u003cp>Tạo E với thuộc tính định danh mới; với mỗi (a, b, c) ∈ R tạo e mới và thêm (e, a) vào R\u003csub>A\u003c/sub>, (e, b) vào R\u003csub>B\u003c/sub>, (e, c) vào R\u003csub>C\u003c/sub>. Vấn đề:\u003c/p>\n\u003cul>\u003cli>Phải tạo thuộc tính định danh cho E.\u003c/li>\u003cli>Phải dịch cả ràng buộc của R (ví dụ \"mỗi (b, c) có tối đa một a\") — không phải lúc nào cũng dịch được bằng cardinality của binary.\u003c/li>\u003cli>Có những instance của E, R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub> không tương ứng với R nào (e chỉ nối với a) → cần total participation của E vào cả ba.\u003c/li>\u003c/ul>"},{"q":"Hãy chỉ ra lỗi trong thiết kế: entity takes có thuộc tính đơn \u003ccode>assignment_marks\u003c/code>; student có thuộc tính \u003ccode>dept_name\u003c/code> trong khi đã có relationship stud_dept. Sửa thế nào?","en":"","answer":"\u003cul>\u003cli>\u003ccode>assignment_marks\u003c/code> single-valued chỉ lưu được một điểm cho mọi bài tập → dùng thuộc tính multivalued {assignment_marks(assignment_no, marks)} hoặc entity assignment + relationship marks(student, assignment) có thuộc tính marks.\u003c/li>\u003cli>\u003ccode>dept_name\u003c/code> trong student là thuộc tính thừa (đã có stud_dept) → bỏ; khi chuyển sang bảng, dept_name sẽ xuất hiện lại trong student vì stud_dept là many-to-one và được gộp.\u003c/li>\u003c/ul>"},{"q":"Đọc ký hiệu crow's foot: \u003ccode>[department] ||----o&lt; [instructor]\u003c/code>. Cardinality và participation là gì? Viết lại bằng \u003ccode>l..h\u003c/code> của sách.","en":"","answer":"\u003cp>Phía department \"||\" = đúng một: mỗi instructor thuộc \u003cstrong>đúng một\u003c/strong> department (total phía instructor). Phía instructor \"o\u003c\" = không hoặc nhiều: một department có 0..nhiều instructor.\u003c/p>\n\u003cp>Ký hiệu sách: đường instructor — inst_dept ghi \u003ccode>1..1\u003c/code>, đường department — inst_dept ghi \u003ccode>0..*\u003c/code>. Bảng: instructor(..., dept_name \u003cstrong>not null\u003c/strong> → department).\u003c/p>"}],"exercises":[{"id":"6.01","topic":"strong entity","level":1,"prompt":"\u003cp>Entity set \u003ccode>lecturer\u003c/code> có thuộc tính \u003cu>ID\u003c/u> (khoá), \u003ccode>name\u003c/code> (bắt buộc), \u003ccode>salary\u003c/code>. Tạo bảng \u003ccode>lecturer(ID varchar(5), name varchar(20), salary numeric(8,2))\u003c/code> với primary key và not null phù hợp.\u003c/p>","en":"","hint":"","solution":"create table lecturer (\n  ID      varchar(5) primary key,\n  name    varchar(20) not null,\n  salary  numeric(8,2)\n);","check":"select try_sql($$insert into lecturer values ('L1', 'Ann', 50000)$$)   as first_insert,\n       try_sql($$insert into lecturer values ('L1', 'Bob', 60000)$$)   as duplicate_id,\n       try_sql($$insert into lecturer values ('L2', null, 60000)$$)    as null_name,\n       try_sql($$insert into lecturer values ('L3', 'Cid', null)$$)    as null_salary;","ordered":false,"fresh":false,"expected":{"fields":["first_insert","duplicate_id","null_name","null_salary"],"rows":[["ok","23505","23502","ok"]]}},{"id":"6.02","topic":"composite attribute","level":1,"prompt":"\u003cp>Entity set \u003ccode>applicant\u003c/code>:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>applicant\n  ID\n  name (first_name, middle_initial, last_name)\n  address (street (street_number, street_name, apt_number), city, state, zip)\u003c/code>\u003c/pre>\n\u003cp>Tạo bảng \u003ccode>applicant\u003c/code> bằng cách \u003cstrong>làm phẳng\u003c/strong> các composite attribute (mọi cột kiểu varchar(20), ID là primary key).\u003c/p>","en":"","hint":"Chỉ giữ các thuộc tính đơn ở mức lá; không có cột name, address, street.","solution":"create table applicant (\n  ID              varchar(20) primary key,\n  first_name      varchar(20),\n  middle_initial  varchar(20),\n  last_name       varchar(20),\n  street_number   varchar(20),\n  street_name     varchar(20),\n  apt_number      varchar(20),\n  city            varchar(20),\n  state           varchar(20),\n  zip             varchar(20)\n);","check":"select string_agg(column_name, ', ' order by column_name) as columns\nfrom information_schema.columns where table_name = 'applicant';","ordered":false,"fresh":false,"expected":{"fields":["columns"],"rows":[["apt_number, city, first_name, id, last_name, middle_initial, state, street_name, street_number, zip"]]}},{"id":"6.03","topic":"multivalued attribute","level":2,"prompt":"\u003cp>instructor có thuộc tính multivalued \u003ccode>{phone_number}\u003c/code>. Tạo bảng \u003ccode>instructor_phone(ID varchar(5), phone_number varchar(15))\u003c/code>: một giảng viên có nhiều số, không lặp cùng một số, ID tham chiếu instructor và tự xoá
