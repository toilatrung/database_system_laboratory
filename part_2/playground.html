 khi giảng viên bị xoá.\u003c/p>","en":"","hint":"","solution":"create table instructor_phone (\n  ID            varchar(5) references instructor on delete cascade,\n  phone_number  varchar(15),\n  primary key (ID, phone_number)\n);","check":"select try_sql($$insert into instructor_phone values ('83821', '555-1234')$$) as phone_1,\n       try_sql($$insert into instructor_phone values ('83821', '555-9999')$$) as phone_2,\n       try_sql($$insert into instructor_phone values ('83821', '555-1234')$$) as duplicate,\n       try_sql($$insert into instructor_phone values ('00000', '555-0000')$$) as bad_instructor,\n       try_sql($$insert into instructor_phone values ('83821', null)$$)       as null_phone,\n       try_sql($$delete from instructor where ID = '83821'$$)                 as delete_instructor,\n       sql_value($$select count(*) from instructor_phone$$)                   as phones_left;","ordered":false,"fresh":false,"expected":{"fields":["phone_1","phone_2","duplicate","bad_instructor","null_phone","delete_instructor","phones_left"],"rows":[["ok","ok","23505","23503","23502","ok","0"]]}},{"id":"6.04","topic":"derived attribute","level":2,"prompt":"\u003cp>Thuộc tính derived \u003ccode>num_advisees()\u003c/code> của instructor = số sinh viên mà giảng viên đó hướng dẫn (bảng advisor). Không lưu cột này; hãy tạo view \u003ccode>instructor_advisees(ID, name, num_advisees)\u003c/code> cho \u003cstrong>mọi\u003c/strong> instructor (kể cả người có 0 advisee).\u003c/p>","en":"","hint":"left outer join advisor on advisor.i_ID = instructor.ID; count(advisor.s_ID).","solution":"create view instructor_advisees (ID, name, num_advisees) as\n  select i.ID, i.name, count(a.s_ID)\n  from instructor i left outer join advisor a on a.i_ID = i.ID\n  group by i.ID, i.name;","check":"select * from instructor_advisees;","ordered":false,"fresh":false,"expected":{"fields":["id","name","num_advisees"],"rows":[["83821","Brandt","0"],["76543","Singh","1"],["33456","Gold","0"],["58583","Califieri","0"],["22222","Einstein","2"],["76766","Crick","1"],["12121","Wu","0"],["98345","Kim","2"],["15151","Mozart","0"],["32343","El Said","0"],["10101","Srinivasan","1"],["45565","Katz","2"]]}},{"id":"6.05","topic":"weak entity","level":2,"prompt":"\u003cp>Weak entity set \u003ccode>course_assignment\u003c/code> phụ thuộc \u003cstrong>course\u003c/strong> qua identifying relationship; discriminator là \u003ccode>assign_no\u003c/code>, thêm thuộc tính \u003ccode>title\u003c/code>. Tạo bảng \u003ccode>course_assignment(course_id varchar(8), assign_no integer, title varchar(30))\u003c/code> với primary key đúng của weak entity, foreign key tới owner, và xoá theo owner.\u003c/p>","en":"","hint":"PK = PK(owner) ∪ discriminator; on delete cascade.","solution":"create table course_assignment (\n  course_id  varchar(8) references course on delete cascade,\n  assign_no  integer,\n  title      varchar(30),\n  primary key (course_id, assign_no)\n);","check":"select try_sql($$insert into course_assignment values ('CS-101', 1, 'Hello world')$$) as a1,\n       try_sql($$insert into course_assignment values ('CS-347', 1, 'ER diagram')$$)  as same_no_other_course,\n       try_sql($$insert into course_assignment values ('CS-101', 1, 'Again')$$)       as duplicate,\n       try_sql($$insert into course_assignment values ('XX-000', 1, 'No owner')$$)    as no_owner,\n       try_sql($$insert into course_assignment values ('CS-101', null, 'No disc')$$)  as null_discriminator,\n       try_sql($$delete from course where course_id = 'CS-347'$$)                    as delete_owner,\n       sql_value($$select count(*) from course_assignment$$)                         as rows_left;","ordered":false,"fresh":false,"expected":{"fields":["a1","same_no_other_course","duplicate","no_owner","null_discriminator","delete_owner","rows_left"],"rows":[["ok","ok","23505","23503","23502","ok","1"]]}},{"id":"6.06","topic":"M:N + attribute","level":2,"prompt":"\u003cp>Relationship set \u003cstrong>many-to-many\u003c/strong> \u003ccode>mentors\u003c/code> giữa instructor và student, có thuộc tính \u003ccode>start_date date\u003c/code>. Tạo bảng \u003ccode>mentors(i_ID, s_ID, start_date)\u003c/code> (kiểu varchar(5) cho ID) với primary key và các foreign key đúng.\u003c/p>","en":"","hint":"","solution":"create table mentors (\n  i_ID        varchar(5) references instructor (ID),\n  s_ID        varchar(5) references student (ID),\n  start_date  date,\n  primary key (i_ID, s_ID)\n);","check":"select try_sql($$insert into mentors values ('10101', '00128', '2024-01-10')$$) as m1,\n       try_sql($$insert into mentors values ('10101', '12345', '2024-02-01')$$) as same_instructor,\n       try_sql($$insert into mentors values ('45565', '00128', '2024-03-01')$$) as same_student,\n       try_sql($$insert into mentors values ('10101', '00128', '2025-01-01')$$) as duplicate_pair,\n       try_sql($$insert into mentors values ('10101', '99999', '2025-01-01')$$) as bad_student;","ordered":false,"fresh":false,"expected":{"fields":["m1","same_instructor","same_student","duplicate_pair","bad_student"],"rows":[["ok","ok","ok","23505","23503"]]}},{"id":"6.07","topic":"many-to-one gộp","level":2,"prompt":"\u003cp>Entity \u003ccode>laptop(serial_no, model)\u003c/code> và relationship \u003cstrong>many-to-one\u003c/strong> \u003ccode>assigned_to\u003c/code> từ laptop tới student (mỗi laptop giao cho tối đa một sinh viên, một sinh viên có thể giữ nhiều laptop; laptop có thể chưa giao). \u003cstrong>Không tạo bảng riêng\u003c/strong> cho relationship: tạo bảng \u003ccode>laptop(serial_no varchar(10), model varchar(20), owner_id varchar(5))\u003c/code>.\u003c/p>","en":"","hint":"owner_id là FK → student, cho phép null (partial).","solution":"create table laptop (\n  serial_no  varchar(10) primary key,\n  model      varchar(20),\n  owner_id   varchar(5) references student (ID)\n);","check":"select try_sql($$insert into laptop values ('S1', 'XPS', '00128')$$)   as l1,\n       try_sql($$insert into laptop values ('S2', 'Mac', '00128')$$)   as same_owner,\n       try_sql($$insert into laptop values ('S3', 'ThinkPad', null)$$) as unassigned,\n       try_sql($$insert into laptop values ('S1', 'Dup', '12345')$$)   as duplicate_serial,\n       try_sql($$insert into laptop values ('S4', 'Bad', '99999')$$)   as bad_owner,\n       (select count(*) from information_schema.tables where table_name = 'assigned_to') as extra_table;","ordered":false,"fresh":false,"expected":{"fields":["l1","same_owner","unassigned","duplicate_serial","bad_owner","extra_table"],"rows":[["ok","ok","ok","23505","23503","0"]]}},{"id":"6.08","topic":"one-to-one","level":2,"prompt":"\u003cp>Relationship \u003cstrong>one-to-one\u003c/strong> giữa \u003ccode>parking_permit\u003c/code> và instructor: mỗi permit cấp cho \u003cstrong>đúng một\u003c/strong> instructor, mỗi instructor có \u003cstrong>tối đa một\u003c/strong> permit. Tạo bảng \u003ccode>parking_permit(permit_no varchar(6), i_ID varchar(5), zone varchar(2))\u003c/code>.\u003c/p>","en":"","hint":"i_ID: not null (total phía permit) + unique (one-to-one) + FK.","solution":"create table parking_permit (\n  permit_no  varchar(6) primary key,\n  i_ID       varchar(5) not null unique references instructor (ID),\n  zone       varchar(2)\n);","check":"select try_sql($$insert into parking_permit values ('P1', '10101', 'A')$$) as p1,\n       try_sql($$insert into parking_permit values ('P2', '10101', 'B')$$) as second_permit_same_instructor,\n       try_sql($$insert into parking_permit values ('P3', null, 'B')$$)    as no_instructor,\n       try_sql($$insert into parking_permit values ('P4', '12121', 'B')$$) as other_instructor,\n       try_sql($$insert into parking_permit values ('P5', '00000', 'B')$$) as bad_instructor;","ordered":false,"fresh":false,"expected":{"fields":["p1","second_permit_same_instructor","no_instructor","other_instructor","bad_instructor"],"rows":[["ok","23505","23502","ok","23503"]]}},{"id":"6.09","topic":"total participation","level":2,"prompt":"\u003cp>Entity \u003ccode>textbook(isbn, title)\u003c/code> và relationship many-to-one \u003ccode>used_in\u003c/code> tới course, với \u003cstrong>total participation\u003c/strong> của textbook (mỗi sách phải dùng cho đúng một course). Tạo bảng \u003ccode>textbook(isbn varchar(13), title varchar(40), course_id varchar(8))\u003c/code> ép được cả cardinality lẫn total participation.\u003c/p>","en":"","hint":"","solution":"create table textbook (\n  isbn       varchar(13) primary key,\n  title      varchar(40),\n  course_id  varchar(8) not null references course\n);","check":"select try_sql($$insert into textbook values ('978-1', 'DB Concepts', 'CS-347')$$) as t1,\n       try_sql($$insert into textbook values ('978-2', 'Genetics', 'BIO-301')$$)    as t2,\n       try_sql($$insert into textbook values ('978-3', 'Orphan', null)$$)          as no_course,\n       try_sql($$insert into textbook values ('978-4', 'Ghost', 'XX-000')$$)       as bad_course;","ordered":false,"fresh":false,"expected":{"fields":["t1","t2","no_course","bad_course"],"rows":[["ok","ok","23502","23503"]]}},{"id":"6.10","topic":"role / recursive","level":2,"prompt":"\u003cp>Relationship \u003ccode>coreq\u003c/code> trên \u003cstrong>cùng\u003c/strong> entity set course với hai role \u003ccode>course_id\u003c/code> và \u003ccode>coreq_id\u003c/code> (môn phải học song song). Tạo bảng \u003ccode>coreq(course_id varchar(8), coreq_id varchar(8))\u003c/code>: cả hai là course hợp lệ, không lặp cặp, và một môn không thể là coreq của chính nó.\u003c/p>","en":"","hint":"","solution":"create table coreq (\n  course_id  varchar(8) references course,\n  coreq_id   varchar(8) references course,\n  primary key (course_id, coreq_id),\n  check (course_id \u003c> coreq_id)\n);","check":"select try_sql($$insert into coreq values ('CS-315', 'CS-319')$$) as c1,\n       try_sql($$insert into coreq values ('CS-319', 'CS-315')$$) as reverse_pair,\n       try_sql($$insert into coreq values ('CS-315', 'CS-319')$$) as duplicate,\n       try_sql($$insert into coreq values ('CS-315', 'CS-315')$$) as self,\n       try_sql($$insert into coreq values ('CS-315', 'XX-000')$$) as bad_course;","ordered":false,"fresh":false,"expected":{"fields":["c1","reverse_pair","duplicate","self","bad_course"],"rows":[["ok","ok","23505","23514","23503"]]}},{"id":"6.11","topic":"cardinality từ dữ liệu","level":2,"prompt":"\u003cp>Trong bảng \u003ccode>advisor\u003c/code>, primary key là s_ID nên advisor là many-to-one từ student tới instructor. Kiểm tra trên dữ liệu: liệt kê \u003ccode>i_ID\u003c/code> và số advisee của các instructor hướng dẫn \u003cstrong>nhiều hơn một\u003c/strong> sinh viên (chứng tỏ phía instructor là \"many\").\u003c/p>","en":"","hint":"","solution":"select i_ID, count(*) as num_advisees\nfrom advisor\ngroup by i_ID\nhaving count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["i_id","num_advisees"],"rows":[["98345","2"],["22222","2"],["45565","2"]]}},{"id":"6.12","topic":"specialization M1 (DDL)","level":2,"prompt":"\u003cp>Chuyển specialization person → {employee, student} theo \u003cstrong>method 1\u003c/strong>: tạo\u003c/p>\n\u003cul>\u003cli>\u003ccode>p_person(ID varchar(5) primary key, name varchar(20), street varchar(30), city varchar(20))\u003c/code>\u003c/li>\u003cli>\u003ccode>p_employee(ID, salary numeric(8,2))\u003c/code> và \u003ccode>p_student(ID, tot_cred numeric(3,0))\u003c/code>, trong đó ID của bảng con vừa là primary key vừa là foreign key tới p_person, xoá theo cha.\u003c/li>\u003c/ul>","en":"","hint":"","solution":"create table p_person (\n  ID      varchar(5) primary key,\n  name    varchar(20),\n  street  varchar(30),\n  city    varchar(20)\n);\ncreate table p_employee (\n  ID      varchar(5) primary key references p_person on delete cascade,\n  salary  numeric(8,2)\n);\ncreate table p_student (\n  ID        varchar(5) primary key references p_person on delete cascade,\n  tot_cred  numeric(3,0)\n);","check":"select try_sql($$insert into p_person values ('X1', 'An', '1 A', 'Hue')$$) as person,\n       try_sql($$insert into p_employee values ('X1', 50000)$$)              as employee,\n       try_sql($$insert into p_student values ('X1', 30)$$)                  as also_student,\n       try_sql($$insert into p_employee values ('X9', 1)$$)                  as employee_without_person,\n       try_sql($$insert into p_employee values ('X1', 2)$$)                  as duplicate_employee,\n       try_sql($$delete from p_person where ID = 'X1'$$)                     as delete_person,\n       sql_value($$select count(*) from p_employee$$)                        as employees_left,\n       sql_value($$select count(*) from p_student$$)                         as students_left;","ordered":false,"fresh":false,"expected":{"fields":["person","employee","also_student","employee_without_person","duplicate_employee","delete_person","employees_left","students_left"],"rows":[["ok","ok","ok","23503","23505","ok","0","0"]]}},{"id":"6.13","topic":"specialization M1 (query)","level":1,"prompt":"\u003cp>Với các bảng method 1 có sẵn \u003ccode>er_person\u003c/code>, \u003ccode>er_employee\u003c/code>, \u003ccode>er_student\u003c/code>: liệt kê ID, name, city, salary của \u003cstrong>mọi employee\u003c/strong>. (Nhược điểm method 1: phải join để có đủ thuộc tính.)\u003c/p>","en":"","hint":"","solution":"select p.ID, p.name, p.city, e.salary\nfrom er_person p join er_employee e on e.ID = p.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","city","salary"],"rows":[["P01","An","Hue","52000"],["P02","Binh","Danang","61000"],["P05","Giang","Hue","45000"]]}},{"id":"6.14","topic":"overlapping / partial","level":2,"prompt":"\u003cp>Trên \u003ccode>er_person\u003c/code>, \u003ccode>er_employee\u003c/code>, \u003ccode>er_student\u003c/code>: trả về hai cột \u003ccode>ID, kind\u003c/code>, với kind là \u003ccode>both\u003c/code> cho người vừa là employee vừa là student, \u003ccode>none\u003c/code> cho người không thuộc entity con nào (partial specialization).\u003c/p>","en":"","hint":"Dùng exists / not exists hoặc left join + case.","solution":"select ID, 'both' as kind from er_person p\nwhere exists (select 1 from er_employee e where e.ID = p.ID)\n  and exists (select 1 from er_student s where s.ID = p.ID)\nunion\nselect ID, 'none' from er_person p\nwhere not exists (select 1 from er_employee e where e.ID = p.ID)\n  and not exists (select 1 from er_student s where s.ID = p.ID);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","kind"],"rows":[["P02","both"],["P06","none"],["P05","both"]]}},{"id":"6.15","topic":"specialization M2","level":3,"prompt":"\u003cp>Chuyển dữ liệu của \u003ccode>er_person/er_employee/er_student\u003c/code> sang \u003cstrong>method 2\u003c/strong>:\u003c/p>\n\u003col>\u003cli>Tạo bảng \u003ccode>m2_employee(ID, name, street, city, salary)\u003c/code> và \u003ccode>m2_student(ID, name, street, city, tot_credits)\u003c/code> (cùng kiểu với bảng gốc, ID là primary key) và nạp dữ liệu từ các bảng er_.\u003c/li>\u003cli>Tạo view \u003ccode>m2_person(ID, name, street, city)\u003c/code> = hợp của hai bảng.\u003c/li>\u003c/ol>\n\u003cp>Hệ thống sẽ đếm số dòng mỗi bảng, số người bị \u003cstrong>lặp\u003c/strong> name/street/city ở cả hai bảng, và số người trong view.\u003c/p>","en":"","hint":"insert into m2_employee select p.ID, name, street, city, salary from er_person p join er_employee ...; view dùng union (loại trùng).","solution":"create table m2_employee (\n  ID varchar(5) primary key, name varchar(20), street varchar(30), city varchar(20), salary numeric(8,2)\n);\ncreate table m2_student (\n  ID varchar(5) primary key, name varchar(20), street varchar(30), city varchar(20), tot_credits numeric(3,0)\n);\ninsert into m2_employee select p.ID, p.name, p.street, p.city, e.salary from er_person p join er_employee e on e.ID = p.ID;\ninsert into m2_student select p.ID, p.name, p.street, p.city, s.tot_credits from er_person p join er_student s on s.ID = p.ID;\ncreate view m2_person (ID, name, street, city) as\n  select ID, name, street, city from m2_employee\n  union\n  select ID, name, street, city from m2_student;","check":"select (select count(*) from m2_employee) as employees,\n       (select count(*) from m2_student) as students,\n       (select count(*) from m2_employee e join m2_student s on s.ID = e.ID) as duplicated_people,\n       (select count(*) from m2_person) as people_in_view,\n       (select count(*) from er_person) as people_total;","ordered":false,"fresh":false,"expected":{"fields":["employees","students","duplicated_people","people_in_view","people_total"],"rows":[["3","4","2","5","6"]]}},{"id":"6.16","topic":"aggregation (DDL)","level":3,"prompt":"\u003cp>Bảng \u003ccode>er_proj_guide(i_ID, s_ID, project_id)\u003c/code> (primary key cả ba cột) và \u003ccode>er_evaluation(evaluation_id, ...)\u003c/code> đã có. Tạo bảng \u003ccode>eval_for(i_ID varchar(5), s_ID varchar(5), project_id varchar(5), evaluation_id varchar(5))\u003c/code> biểu diễn relationship giữa \u003cstrong>aggregation\u003c/strong> proj_guide và evaluation.\u003c/p>","en":"","hint":"FK nhiều cột (i_ID, s_ID, project_id) → er_proj_guide; FK evaluation_id → er_evaluation.","solution":"create table eval_for (\n  i_ID           varchar(5),\n  s_ID           varchar(5),\n  project_id     varchar(5),\n  evaluation_id  varchar(5) references er_evaluation,\n  primary key (i_ID, s_ID, project_id, evaluation_id),\n  foreign key (i_ID, s_ID, project_id) references er_proj_guide\n);","check":"select try_sql($$insert into eval_for values ('10101', '00128', 'PJ3', 'EV1')$$) as guided_triple,\n       try_sql($$insert into eval_for values ('10101', '00128', 'PJ2', 'EV1')$$) as not_guided,\n       try_sql($$insert into eval_for values ('10101', '00128', 'PJ3', 'EVX')$$) as bad_evaluation,\n       try_sql($$insert into eval_for values ('10101', '00128', 'PJ3', 'EV1')$$) as duplicate;","ordered":false,"fresh":false,"expected":{"fields":["guided_triple","not_guided","bad_evaluation","duplicate"],"rows":[["ok","23503","23503","23505"]]}},{"id":"6.17","topic":"aggregation (query)","level":2,"prompt":"\u003cp>Với \u003ccode>er_proj_guide\u003c/code>, \u003ccode>er_project\u003c/code>, \u003ccode>er_eval_for\u003c/code>, \u003ccode>er_evaluation\u003c/code>: liệt kê mọi bộ hướng dẫn (i_ID, s_ID, project title) kèm grade của evaluation; bộ chưa được đánh giá vẫn xuất hiện với grade null.\u003c/p>","en":"","hint":"","solution":"select g.i_ID, g.s_ID, p.title, ev.grade\nfrom er_proj_guide g\n     join er_project p on p.project_id = g.project_id\n     left join er_eval_for f on f.i_ID = g.i_ID and f.s_ID = g.s_ID and f.project_id = g.project_id\n     left join er_evaluation ev on ev.evaluation_id = f.evaluation_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["i_id","s_id","title","grade"],"rows":[["45565","00128","Robot Soccer","A"],["10101","12345","Robot Soccer","B+"],["76766","98988","Genome Search","A-"],["76766","98988","Genome Search","B"],["15151","55739","Music Recommender",null],["10101","00128","Music Recommender",null],["22222","44553","Quantum Simulator",null]]}},{"id":"6.18","topic":"ternary + arrow","level":3,"prompt":"\u003cp>Ternary relationship \u003ccode>proj_guide_t(instructor, student, project)\u003c/code> có \u003cstrong>một mũi tên tới instructor\u003c/strong>: mỗi cặp (student, project) có tối đa một instructor hướng dẫn. Tạo bảng \u003ccode>proj_guide_t(i_ID varchar(5), s_ID varchar(5), project_id varchar(5))\u003c/code> với primary key phản ánh đúng ràng buộc đó (FK: i_ID → instructor, s_ID → student, project_id → er_project).\u003c/p>","en":"","hint":"Phía có mũi tên không nằm trong primary key.","solution":"create table proj_guide_t (\n  i_ID        varchar(5) not null references instructor (ID),\n  s_ID        varchar(5) references student (ID),\n  project_id  varchar(5) references er_project,\n  primary key (s_ID, project_id)\n);","check":"select try_sql($$insert into proj_guide_t values ('10101', '00128', 'PJ1')$$) as g1,\n       try_sql($$insert into proj_guide_t values ('45565', '00128', 'PJ1')$$) as second_instructor_same_pair,\n       try_sql($$insert into proj_guide_t values ('10101', '00128', 'PJ2')$$) as same_student_other_project,\n       try_sql($$insert into proj_guide_t values ('10101', '12345', 'PJ1')$$) as other_student_same_project;","ordered":false,"fresh":false,"expected":{"fields":["g1","second_instructor_same_pair","same_student_other_project","other_student_same_project"],"rows":[["ok","23505","ok","ok"]]}},{"id":"6.19","topic":"ternary → binary","level":3,"prompt":"\u003cp>Thay ternary proj_guide bằng entity set \u003ccode>guide_e\u003c/code> (thuộc tính định danh \u003ccode>e_id\u003c/code>) và ba relationship R\u003csub>A\u003c/sub>, R\u003csub>B\u003c/sub>, R\u003csub>C\u003c/sub> many-to-one, \u003cstrong>total\u003c/strong> từ phía E (gộp vào bảng E). Tạo bảng \u003ccode>guide_e(e_id integer, i_ID varchar(5), s_ID varchar(5), project_id varchar(5))\u003c/code> sao cho: mỗi e nối đúng một instructor, một student, một project, và không có hai e cho cùng bộ (i_ID, s_ID, project_id).\u003c/p>","en":"","hint":"not null cho cả ba FK (total participation của E), unique (i_ID, s_ID, project_id).","solution":"create table guide_e (\n  e_id        integer primary key,\n  i_ID        varchar(5) not null references instructor (ID),\n  s_ID        varchar(5) not null references student (ID),\n  project_id  varchar(5) not null references er_project,\n  unique (i_ID, s_ID, project_id)\n);","check":"select try_sql($$insert into guide_e values (1, '10101', '00128', 'PJ1')$$) as e1,\n       try_sql($$insert into guide_e values (2, '10101', '00128', 'PJ1')$$) as same_triple,\n       try_sql($$insert into guide_e values (3, '10101', null, 'PJ1')$$)    as missing_student,\n       try_sql($$insert into guide_e values (4, '45565', '00128', 'PJ1')$$) as other_instructor;","ordered":false,"fresh":false,"expected":{"fields":["e1","same_triple","missing_student","other_instructor"],"rows":[["ok","23505","23502","ok"]]}},{"id":"6.20","topic":"reduction tổng hợp","level":3,"prompt":"\u003cp>Chuyển đoạn E-R sau thành bảng (kiểu: varchar(10) cho mọi khoá/chuỗi, numeric(10,2) cho tiền, date cho ngày):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>[hotel] hotel_id, name, {phone}\n[room]  (weak, owner = hotel) room_no (discriminator), rate\n[guest] guest_id, name\n&lt;stay&gt;  many-to-many giữa guest và room, thuộc tính check_in\u003c/code>\u003c/pre>\n\u003cp>Tạo các bảng \u003ccode>hotel(hotel_id, name)\u003c/code>, \u003ccode>hotel_phone(hotel_id, phone)\u003c/code>, \u003ccode>room(hotel_id, room_no, rate)\u003c/code>, \u003ccode>guest(guest_id, name)\u003c/code>, \u003ccode>stay(guest_id, hotel_id, room_no, check_in)\u003c/code> với đủ primary key, foreign key (room và hotel_phone xoá theo hotel). Một khách có thể ở cùng phòng nhiều lần ở các ngày check_in khác nhau.\u003c/p>","en":"","hint":"stay: PK (guest_id, hotel_id, room_no, check_in); FK (hotel_id, room_no) → room.","solution":"create table hotel (\n  hotel_id  varchar(10) primary key,\n  name      varchar(10)\n);\ncreate table hotel_phone (\n  hotel_id  varchar(10) references hotel on delete cascade,\n  phone     varchar(10),\n  primary key (hotel_id, phone)\n);\ncreate table room (\n  hotel_id  varchar(10) references hotel on delete cascade,\n  room_no   varchar(10),\n  rate      numeric(10,2),\n  primary key (hotel_id, room_no)\n);\ncreate table guest (\n  guest_id  varchar(10) primary key,\n  name      varchar(10)\n);\ncreate table stay (\n  guest_id  varchar(10) references guest,\n  hotel_id  varchar(10),\n  room_no   varchar(10),\n  check_in  date,\n  primary key (guest_id, hotel_id, room_no, check_in),\n  foreign key (hotel_id, room_no) references room\n);","check":"select try_sql($$insert into hotel values ('H1', 'Sea')$$)                      as hotel,\n       try_sql($$insert into hotel_phone values ('H1', '111'), ('H1', '222')$$)     as two_phones,\n       try_sql($$insert into room values ('H1', '101', 50), ('H1', '102', 60)$$)    as rooms,\n       try_sql($$insert into room values ('H9', '101', 50)$$)                       as room_no_hotel,\n       try_sql($$insert into guest values ('G1', 'An')$$)                           as guest,\n       try_sql($$insert into stay values ('G1', 'H1', '101', '2025-01-01')$$)       as stay_1,\n       try_sql($$insert into stay values ('G1', 'H1', '101', '2025-02-01')$$)       as stay_again,\n       try_sql($$insert into stay values ('G1', 'H1', '999', '2025-03-01')$$)       as bad_room,\n       try_sql($$delete from hotel where hotel_id = 'H1'$$)                          as delete_hotel_with_stays;","ordered":false,"fresh":false,"expected":{"fields":["hotel","two_phones","rooms","room_no_hotel","guest","stay_1","stay_again","bad_room","delete_hotel_with_stays"],"rows":[["ok","ok","ok","23503","ok","ok","ok","23503","23503"]]}}]},{"key":"ch7","store":"7","short":"7","label":"Chương 7","navLabel":"Chương 7","kind":"Chương","title":"Normalization","titleVi":"Chuẩn hoá (Relational Database Design)","summary":"\u003ch3>Phạm vi theo lịch học (số slide in ở chân trang)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tuần\u003c/th>\u003cth>Slide\u003c/th>\u003cth>Nội dung\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>7.1 – 7.21\u003c/td>\u003ctd>Thiết kế tốt/xấu (in_dep), decomposition, lossy vs lossless, normalization theory, functional dependency, legal instance, key qua FD, FD tầm thường, kiểm tra lossless bằng FD, dependency preservation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>7.21 – 7.35\u003c/td>\u003ctd>BCNF, phân rã BCNF, BCNF vs bảo toàn phụ thuộc, 3NF, dư thừa trong 3NF, so sánh BCNF/3NF, mục tiêu chuẩn hoá, \"BCNF đã đủ tốt chưa?\" → multivalued dependency (inst_info)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mở rộng\u003c/td>\u003ctd>7.37 trở đi\u003c/td>\u003ctd>F⁺, Armstrong, bao đóng thuộc tính, canonical cover, thuật toán BCNF/3NF, 4NF, 1NF — \u003cstrong>không nằm trong slide 35 nhưng Practice Exercises cần tới\u003c/strong>, nên phải học\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Tự kiểm tra mọi bài tính tay bằng \u003cstrong>Công cụ › Phụ thuộc hàm (FD)\u003c/strong> (có sẵn các ví dụ của slide và Practice Exercises).\u003c/p>\n\u003ch3>1. Thiết kế xấu: dư thừa (slide 7.3)\u003c/h3>\n\u003cp>Gộp instructor và department thành \u003ccode>in_dep(ID, name, salary, dept_name, building, budget)\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lặp thông tin\u003c/strong>: building, budget của một khoa lặp lại ở mọi giảng viên của khoa.\u003c/li>\u003cli>\u003cstrong>Update anomaly\u003c/strong>: đổi budget ở một dòng mà quên dòng khác → dữ liệu mâu thuẫn.\u003c/li>\u003cli>\u003cstrong>Insertion anomaly\u003c/strong>: không thể ghi một khoa mới chưa có giảng viên (trừ khi dùng null).\u003c/li>\u003cli>\u003cstrong>Deletion anomaly\u003c/strong>: xoá giảng viên cuối cùng của khoa thì mất luôn thông tin khoa.\u003c/li>\u003c/ul>\n\u003ch3>2. Decomposition, lossy và lossless (slide 7.4–7.7)\u003c/h3>\n\u003cul>\u003cli>Phân rã R thành R₁, R₂ với R = R₁ ∪ R₂.\u003c/li>\u003cli>\u003cstrong>Lossless (lossless-join)\u003c/strong>: với mọi instance hợp lệ r, Π\u003csub>R1\u003c/sub>(r) ⋈ Π\u003csub>R2\u003c/sub>(r) = r.\u003c/li>\u003cli>\u003cstrong>Lossy\u003c/strong>: phép join cho ra \u003cstrong>nhiều tuple hơn\u003c/strong> (tuple giả — spurious tuples), nên ta \u003cem>mất thông tin\u003c/em> tuple nào là thật. Ví dụ: employee(ID, name, street, city, salary) tách thành (ID, name) và (name, street, city, salary): hai nhân viên cùng tên Kim sinh ra 4 tổ hợp.\u003c/li>\u003cli>Luôn có r ⊆ Π\u003csub>R1\u003c/sub>(r) ⋈ Π\u003csub>R2\u003c/sub>(r) (PE 7.12): phân rã không bao giờ làm \u003cem>mất\u003c/em> tuple, chỉ có thể \u003cem>thêm\u003c/em> tuple.\u003c/li>\u003c/ul>\n\u003ch3>3. Functional dependency (slide 7.9–7.15)\u003c/h3>\n\u003cul>\u003cli>α → β đúng trên R nếu với mọi instance hợp lệ: t₁[α] = t₂[α] ⇒ t₁[β] = t₂[β].\u003c/li>\u003cli>FD là ràng buộc trên \u003cstrong>mọi instance hợp lệ (legal instance)\u003c/strong>; một instance cụ thể có thể \u003cem>thoả\u003c/em> một FD một cách tình cờ (ví dụ name → ID đúng trên dữ liệu mẫu nhưng không phải FD).\u003c/li>\u003cli>\u003cstrong>K là superkey ⇔ K → R\u003c/strong>. \u003cstrong>K là candidate key ⇔ K → R và không tập con thực sự nào của K → R\u003c/strong>.\u003c/li>\u003cli>FD dùng để: kiểm tra một instance có hợp lệ không; \u003cem>đặc tả\u003c/em> ràng buộc trên lược đồ.\u003c/li>\u003cli>\u003cstrong>FD tầm thường (trivial)\u003c/strong>: α → β với β ⊆ α (ví dụ ID, name → ID).\u003c/li>\u003cli>\u003cstrong>F⁺\u003c/strong> (bao đóng của F): mọi FD được suy ra từ F.\u003c/li>\u003c/ul>\n\u003cp>Kiểm tra một FD trên dữ liệu bằng SQL (PE 7.9):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select B from r group by B having count(distinct C) &gt; 1;  -- rỗng ⇔ B → C đúng trên r\u003c/code>\u003c/pre>\n\u003ch3>4. Kiểm tra lossless bằng FD (slide 7.16–7.17)\u003c/h3>\n\u003cp>Phân rã R thành R₁, R₂ là lossless nếu \u003cstrong>ít nhất một\u003c/strong> trong hai FD sau thuộc F⁺:\u003c/p>\n\u003cul>\u003cli>R₁ ∩ R₂ → R₁, hoặc\u003c/li>\u003cli>R₁ ∩ R₂ → R₂\u003c/li>\u003c/ul>\n\u003cp>(tức là phần chung là superkey của R₁ hoặc của R₂). Ví dụ R = (A, B, C), F = {A → B, B → C}: (A, B), (B, C) lossless vì B → BC; (A, B), (A, C) cũng lossless vì A → AB.\u003c/p>\n\u003ch3>5. Dependency preservation (slide 7.18–7.21)\u003c/h3>\n\u003cul>\u003cli>F\u003csub>i\u003c/sub> = các FD trong F⁺ chỉ chứa thuộc tính của R\u003csub>i\u003c/sub>. Phân rã \u003cstrong>bảo toàn phụ thuộc\u003c/strong> nếu (F₁ ∪ … ∪ F\u003csub>n\u003c/sub>)⁺ = F⁺.\u003c/li>\u003cli>Ý nghĩa: kiểm tra mọi FD chỉ cần nhìn \u003cstrong>từng bảng riêng lẻ\u003c/strong>, không phải join.\u003c/li>\u003cli>Ví dụ \u003ccode>dept_advisor(s_ID, i_ID, dept_name)\u003c/code> với i_ID → dept_name và s_ID, dept_name → i_ID: tách (s_ID, i_ID), (i_ID, dept_name) làm mất s_ID, dept_name → i_ID.\u003c/li>\u003c/ul>\n\u003ch3>6. BCNF (slide 7.23–7.27)\u003c/h3>\n\u003cp>R ở \u003cstrong>BCNF\u003c/strong> nếu với mọi α → β trong F⁺ (α, β ⊆ R), ít nhất một điều sau đúng:\u003c/p>\n\u003cul>\u003cli>α → β tầm thường (β ⊆ α), hoặc\u003c/li>\u003cli>α là \u003cstrong>superkey\u003c/strong> của R.\u003c/li>\u003c/ul>\n\u003cp>in_dep không ở BCNF vì dept_name → building, budget mà dept_name không phải superkey.\u003c/p>\n\u003cp>\u003cstrong>Phân rã khi vi phạm\u003c/strong> bởi α → β: thay R bằng \u003cstrong>(α ∪ β)\u003c/strong> và \u003cstrong>(R − (β − α))\u003c/strong>. Ví dụ in_dep → (dept_name, building, budget) và (ID, name, salary, dept_name). Phần chung dept_name là key của bảng thứ nhất → lossless.\u003c/p>\n\u003cp>\u003cstrong>BCNF và bảo toàn phụ thuộc\u003c/strong>: không phải lúc nào cũng đạt cả hai (dept_advisor: không có phân rã BCNF nào bảo toàn s_ID, dept_name → i_ID).\u003c/p>\n\u003ch3>7. 3NF (slide 7.28–7.31)\u003c/h3>\n\u003cp>R ở \u003cstrong>3NF\u003c/strong> nếu với mọi α → β trong F⁺, ít nhất một điều đúng:\u003c/p>\n\u003cul>\u003cli>α → β tầm thường, hoặc\u003c/li>\u003cli>α là superkey, hoặc\u003c/li>\u003cli>mỗi thuộc tính A ∈ β − α nằm trong \u003cstrong>một candidate key\u003c/strong> nào đó (A là \u003cem>prime\u003c/em>; có thể mỗi A thuộc một key khác nhau).\u003c/li>\u003c/ul>\n\u003cp>BCNF ⇒ 3NF (3NF nới lỏng thêm điều kiện thứ ba). dept_advisor ở 3NF vì dept_name là prime (thuộc key {s_ID, dept_name}).\u003c/p>\n\u003cp>\u003cstrong>Dư thừa trong 3NF\u003c/strong> (slide 7.30): vẫn lặp (i_ID, dept_name) và có thể phải dùng null.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>BCNF\u003c/th>\u003cth>3NF\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dư thừa do FD\u003c/td>\u003ctd>không\u003c/td>\u003ctd>có thể còn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Luôn có phân rã lossless\u003c/td>\u003ctd>có\u003c/td>\u003ctd>có\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Luôn bảo toàn phụ thuộc\u003c/td>\u003ctd>\u003cstrong>không\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>có\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Mục tiêu thiết kế\u003c/strong> (slide 7.32): BCNF + lossless + bảo toàn phụ thuộc; nếu không được thì chấp nhận \u003cem>hoặc\u003c/em> mất bảo toàn phụ thuộc \u003cem>hoặc\u003c/em> dư thừa của 3NF. (SQL chỉ kiểm tra hiệu quả superkey qua primary key/unique; FD khác cần assertion — đắt và không được hỗ trợ — hoặc trigger.)\u003c/p>\n\u003ch3>8. BCNF đã đủ tốt chưa? (slide 7.33–7.35)\u003c/h3>\n\u003cp>\u003ccode>inst_info(ID, child_name, phone)\u003c/code>: một giảng viên có nhiều con, nhiều số điện thoại, hai thông tin độc lập. Không có FD không tầm thường → \u003cstrong>đã ở BCNF\u003c/strong>, nhưng phải lưu \u003cstrong>mọi tổ hợp\u003c/strong> con × số điện thoại (thêm một số điện thoại phải chèn nhiều dòng). Tách thành inst_child(ID, child_name) và inst_phone(ID, phone) tốt hơn → cần dạng chuẩn cao hơn: \u003cstrong>4NF\u003c/strong> dựa trên \u003cstrong>multivalued dependency\u003c/strong>.\u003c/p>\n\u003ch3>Mở rộng — cần cho Practice Exercises\u003c/h3>\n\u003ch4>9. F⁺ và Armstrong's axioms (slide 7.37–7.41)\u003c/h4>\n\u003cul>\u003cli>\u003cstrong>Reflexivity\u003c/strong>: β ⊆ α ⇒ α → β\u003c/li>\u003cli>\u003cstrong>Augmentation\u003c/strong>: α → β ⇒ γα → γβ\u003c/li>\u003cli>\u003cstrong>Transitivity\u003c/strong>: α → β, β → γ ⇒ α → γ\u003c/li>\u003c/ul>\n\u003cp>Ba tiên đề \u003cstrong>sound\u003c/strong> (chỉ sinh FD đúng) và \u003cstrong>complete\u003c/strong> (sinh ra toàn bộ F⁺). Luật suy ra:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Union\u003c/strong>: α → β, α → γ ⇒ α → βγ (PE 7.4)\u003c/li>\u003cli>\u003cstrong>Decomposition\u003c/strong>: α → βγ ⇒ α → β và α → γ\u003c/li>\u003cli>\u003cstrong>Pseudotransitivity\u003c/strong>: α → β, γβ → δ ⇒ αγ → δ (PE 7.5)\u003c/li>\u003c/ul>\n\u003cp>Ví dụ R = (A, B, C, G, H, I), F = {A → B, A → C, CG → H, CG → I, B → H}: A → H (bắc cầu A → B → H); AG → I (augment A → C thành AG → CG, rồi bắc cầu với CG → I); CG → HI (union).\u003c/p>\n\u003ch4>10. Bao đóng thuộc tính α⁺ (slide 7.42–7.44)\u003c/h4>\n\u003cpre class=\"code\" data-lang=\"text\">\u003ccode>result := α\nwhile (result thay đổi) do\n  for each β → γ in F do\n    if β ⊆ result then result := result ∪ γ\u003c/code>\u003c/pre>\n\u003cp>Ví dụ trên: (AG)⁺: AG → ABG (A → B) → ABCG (A → C) → ABCGH (CG → H) → ABCGHI (CG → I). Vậy AG là superkey; A⁺ = ABCH, G⁺ = G nên AG là \u003cstrong>candidate key\u003c/strong>.\u003c/p>\n\u003cp>Công dụng: kiểm tra \u003cstrong>superkey\u003c/strong> (α⁺ ⊇ R); kiểm tra α → β ∈ F⁺ (β ⊆ α⁺); tính F⁺ (với mọi γ ⊆ R, γ → S cho mọi S ⊆ γ⁺).\u003c/p>\n\u003cp>\u003cstrong>Tìm candidate key nhanh\u003c/strong>: thuộc tính không xuất hiện ở vế phải nào phải có trong \u003cstrong>mọi\u003c/strong> key; thuộc tính chỉ xuất hiện ở vế phải thì \u003cstrong>không\u003c/strong> thuộc key nào.\u003c/p>\n\u003ch4>11. Canonical cover F\u003csub>c\u003c/sub> (slide 7.45–7.53)\u003c/h4>\n\u003cul>\u003cli>A \u003cstrong>thừa ở vế trái\u003c/strong> của α → β nếu F ⇒ (α − A) → β: kiểm tra (α − A)⁺ dưới \u003cstrong>F\u003c/strong> có chứa β.\u003c/li>\u003cli>A \u003cstrong>thừa ở vế phải\u003c/strong> nếu F' = (F − {α → β}) ∪ {α → (β − A)} ⇒ F: kiểm tra α⁺ dưới \u003cstrong>F'\u003c/strong> có chứa A.\u003c/li>\u003cli>F\u003csub>c\u003c/sub>: tương đương F, không thuộc tính thừa, vế trái không trùng nhau.\u003c/li>\u003c/ul>\n\u003cp>Thuật toán: lặp { gộp các FD cùng vế trái (union); tìm \u003cstrong>một\u003c/strong> thuộc tính thừa rồi xoá } cho tới khi không đổi.\u003c/p>\n\u003cp>Ví dụ F = {A → BC, B → C, A → B, AB → C}: gộp A → BC, A → B thành A → BC; A thừa trong AB → C (B⁺ = BC chứa C) → B → C; C thừa trong A → BC (A⁺ dưới {A → B, B → C} chứa C) → \u003cstrong>F\u003csub>c\u003c/sub> = {A → B, B → C}\u003c/strong>. Canonical cover có thể không duy nhất (PE 7.14).\u003c/p>\n\u003ch4>12. Kiểm tra BCNF / 3NF (slide 7.55–7.62)\u003c/h4>\n\u003cul>\u003cli>Trên \u003cstrong>lược đồ ban đầu R\u003c/strong>: chỉ cần xét các FD trong F (không cần F⁺): mỗi α → β không tầm thường phải có α⁺ ⊇ R.\u003c/li>\u003cli>Trên một \u003cstrong>bảng con R\u003csub>i\u003c/sub>\u003c/strong> sau phân rã, xét F thôi là \u003cstrong>sai\u003c/strong> (ví dụ R = (A, B, C, D, E), F = {A → B, BC → D}, R₁ = (A, C, D, E): F không có FD nào nằm trong R₁ nhưng AC → D ∈ F⁺ vi phạm). Phải kiểm tra: với mọi α ⊆ R\u003csub>i\u003c/sub>, α⁺ ∩ (R\u003csub>i\u003c/sub> − α) rỗng hoặc chứa hết R\u003csub>i\u003c/sub>.\u003c/li>\u003cli>3NF: mỗi α → β ∈ F, α superkey hoặc mọi thuộc tính trong β − α là prime (cần biết các candidate key).\u003c/li>\u003c/ul>\n\u003ch4>13. Thuật toán phân rã BCNF (slide 7.57–7.59)\u003c/h4>\n\u003cpre class=\"code\" data-lang=\"text\">\u003ccode>result := {R}\nwhile (có R_i trong result không ở BCNF) do\n  chọn α → β vi phạm trên R_i (α → R_i ∉ F⁺, α ∩ β = ∅)\n  result := (result − R_i) ∪ {R_i − β} ∪ {(α, β)}\u003c/code>\u003c/pre>\n\u003cp>Ví dụ class(course_id, title, dept_name, credits, sec_id, semester, year, building, room_number, capacity, time_slot_id) với course_id → title, dept_name, credits; building, room_number → capacity; course_id, sec_id, semester, year → building, room_number, time_slot_id. Key: {course_id, sec_id, semester, year}. Tách theo course_id → course(course_id, title, dept_name, credits); phần còn lại tách theo building, room_number → classroom(building, room_number, capacity) và section(course_id, sec_id, semester, year, building, room_number, time_slot_id). Kết quả lossless và ở BCNF.\u003c/p>\n\u003ch4>14. Thuật toán tổng hợp 3NF (slide 7.63–7.66)\u003c/h4>\n\u003cpre class=\"code\" data-lang=\"text\">\u003ccode>F_c := canonical cover của F; i := 0\nfor each α → β in F_c: nếu chưa R_j nào chứa αβ thì i++, R_i := αβ\nnếu chưa R_j nào chứa một candidate key của R thì i++, R_i := một candidate key\n(tuỳ chọn) bỏ R_j nằm trọn trong R_k khác\u003c/code>\u003c/pre>\n\u003cp>Kết quả luôn: mỗi R\u003csub>i\u003c/sub> ở 3NF, \u003cstrong>lossless\u003c/strong> và \u003cstrong>bảo toàn phụ thuộc\u003c/strong>. Ví dụ cust_banker_branch(customer_id, employee_id, branch_name, type), F\u003csub>c\u003c/sub> = {customer_id, employee_id → type; employee_id → branch_name; customer_id, branch_name → employee_id} → (customer_id, employee_id, type), (employee_id, branch_name), (customer_id, branch_name, employee_id); bỏ (employee_id, branch_name) vì nằm trong lược đồ thứ ba. Key {customer_id, employee_id} đã có trong lược đồ đầu nên không cần thêm.\u003c/p>\n\u003ch4>15. Multivalued dependency và 4NF (slide 7.69–7.79)\u003c/h4>\n\u003cul>\u003cli>α →→ β: với mọi t₁, t₂ cùng α, tồn tại t₃, t₄ sao cho t₃ = (α, β của t₁, phần còn lại của t₂), t₄ = (α, β của t₂, phần còn lại của t₁). Nghĩa: với mỗi giá trị α, tập β \u003cstrong>độc lập\u003c/strong> với phần còn lại → lưu đủ mọi tổ hợp.\u003c/li>\u003cli>Mọi FD là MVD: α → β ⇒ α →→ β. Nếu α →→ β thì α →→ R − α − β.\u003c/li>\u003cli>\u003cstrong>4NF\u003c/strong>: mọi α →→ β không tầm thường (β ⊄ α và α ∪ β ≠ R) có α là superkey. 4NF ⇒ BCNF.\u003c/li>\u003cli>inst_info: ID →→ child_name, ID →→ phone; ID không phải superkey → tách inst_child, inst_phone.\u003c/li>\u003c/ul>\n\u003ch4>16. 1NF và 2NF\u003c/h4>\n\u003cul>\u003cli>\u003cstrong>1NF\u003c/strong>: mọi domain \u003cstrong>atomic\u003c/strong> (không có thuộc tính đa trị/composite, không mã hoá nhiều thông tin trong một chuỗi như \"CS0012\").\u003c/li>\u003cli>\u003cstrong>2NF\u003c/strong> (PE 7.19): không thuộc tính không khoá nào \u003cstrong>phụ thuộc bộ phận\u003c/strong> vào một candidate key (phụ thuộc vào tập con thực sự của key). Ví dụ (student_id, course_id, student_name, grade) với student_id → student_name: không 2NF. Mọi lược đồ 3NF đều ở 2NF.\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dạng chuẩn\u003c/th>\u003cth>Điều kiện cho α → A không tầm thường\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2NF\u003c/td>\u003ctd>A prime, hoặc A không phụ thuộc vào tập con thực sự của một candidate key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3NF\u003c/td>\u003ctd>α superkey, hoặc A prime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BCNF\u003c/td>\u003ctd>α superkey\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4NF\u003c/td>\u003ctd>(cho cả MVD) α superkey\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Lược đồ in_dep(ID, name, salary, dept_name, building, budget) có vấn đề gì?","options":["Không có primary key","building, budget của một khoa bị lặp ở mọi giảng viên của khoa","Không thể join","Vi phạm 1NF"],"answer":1,"explain":"dept_name → building, budget nhưng dept_name không phải key → lặp thông tin, gây update/insert/delete anomaly."},{"q":"Phân rã lossy nghĩa là gì?","options":["Join các bảng con mất một số tuple gốc","Join các bảng con cho ra thêm tuple không có trong bảng gốc","Bảng con không có primary key","Một FD không được bảo toàn"],"answer":1,"explain":"r luôn ⊆ join các projection; lossy là join có tuple giả → không biết tuple nào là thật."},{"q":"R = (A, B, C), F = {A → B}. Phân rã nào lossless?","options":["(A, B), (B, C)","(A, B), (A, C)","(A, C), (B, C)","Không phân rã nào"],"answer":1,"explain":"R₁ ∩ R₂ = A và A → AB = R₁. Với (A, B), (B, C): phần chung B không xác định A hay C."},{"q":"Trên một instance, mọi giảng viên có tên khác nhau. Có thể kết luận name → ID là FD của lược đồ instructor?","options":["Có","Không — FD phải đúng trên mọi instance hợp lệ","Có, nếu bảng có trên 10 dòng","Chỉ khi name là unique"],"answer":1,"explain":"Một instance chỉ có thể chứng minh FD \u003cem>không\u003c/em> đúng, không thể chứng minh FD đúng."},{"q":"FD nào là tầm thường (trivial)?","options":["ID → name","ID, name → name","name → ID","dept_name → building"],"answer":1,"explain":"β ⊆ α: {name} ⊆ {ID, name}."},{"q":"K là superkey của R khi và chỉ khi:","options":["K → R","R → K","K có một thuộc tính","K là primary key"],"answer":0,"explain":"K xác định mọi thuộc tính của R. Candidate key: thêm điều kiện tối thiểu."},{"q":"R ở BCNF nếu mọi α → β không tầm thường trong F⁺ có:","options":["α là candidate key","α là superkey","β là prime","α là superkey hoặc β prime"],"answer":1,"explain":"Superkey (không nhất thiết tối thiểu). \"β − α prime\" là điều kiện nới lỏng của 3NF."},{"q":"Phân rã R theo FD vi phạm BCNF α → β cho ra:","options":["(α ∪ β) và (R − (β − α))","(α) và (β)","(α ∪ β) và (R − α)","(R − α) và (R − β)"],"answer":0,"explain":"Phần chung là α, là superkey của (α ∪ β) → lossless."},{"q":"dept_advisor(s_ID, i_ID, dept_name), F = {i_ID → dept_name; s_ID, dept_name → i_ID}. Khẳng định nào đúng?","options":["Ở BCNF","Ở 3NF nhưng không ở BCNF","Không ở 3NF","Không có candidate key"],"answer":1,"explain":"i_ID không phải superkey (vi phạm BCNF), nhưng dept_name thuộc key {s_ID, dept_name} nên vẫn 3NF."},{"q":"Ưu điểm của 3NF so với BCNF là:","options":["Không bao giờ dư thừa","Luôn tìm được phân rã 3NF lossless và bảo toàn phụ thuộc","Ít bảng hơn","Không cần FD"],"answer":1,"explain":"BCNF không phải lúc nào cũng bảo toàn phụ thuộc được (ví dụ dept_advisor)."},{"q":"Phân rã bảo toàn phụ thuộc có lợi gì?","options":["Join nhanh hơn","Kiểm tra mọi FD chỉ cần xét từng bảng riêng, không cần join","Luôn lossless","Không cần primary key"],"answer":1,"explain":"Nếu một FD bị mất, mỗi lần update phải join các bảng để kiểm tra."},{"q":"inst_info(ID, child_name, phone) không có FD không tầm thường. Khẳng định nào đúng?","options":["Không ở BCNF","Ở BCNF nhưng vẫn dư thừa → cần 4NF","Ở 4NF","Vi phạm 1NF"],"answer":1,"explain":"ID →→ child_name là MVD không tầm thường, ID không phải superkey → không 4NF."},{"q":"Luật nào KHÔNG phải tiên đề Armstrong?","options":["Reflexivity","Augmentation","Transitivity","Union"],"answer":3,"explain":"Union được suy ra từ augmentation + transitivity (PE 7.4)."},{"q":"R = (A, B, C, G, H, I), F = {A → B, A → C, CG → H, CG → I, B → H}. (AG)⁺ = ?","options":["ABCG","ABCGH","ABCGHI","AG"],"answer":2,"explain":"AG → +B, +C (A), +H, +I (CG) → ABCGHI, nên AG là superkey."},{"q":"Kiểm tra A có thừa ở VẾ TRÁI của α → β, ta tính:","options":["(α − A)⁺ dưới F, xem có chứa β","α⁺ dưới F, xem có chứa A","(α − A)⁺ dưới F − {α → β}","β⁺ dưới F"],"answer":0,"explain":"Vế phải thì ngược lại: tính α⁺ dưới F' (đã bỏ A khỏi β) xem còn chứa A không."},{"q":"F = {A → BC, B → C, A → B, AB → C}. Canonical cover là:","options":["{A → BC, B → C}","{A → B, B → C}","{A → B, AB → C}","{A → C, B → C}"],"answer":1,"explain":"Gộp A → BC; A thừa trong AB → C; C thừa trong A → BC."},{"q":"Bước cuối của thuật toán 3NF: nếu không lược đồ nào chứa candidate key thì thêm một lược đồ là candidate key. Mục đích?","options":["Bảo toàn phụ thuộc","Đảm bảo lossless","Đảm bảo BCNF","Giảm số bảng"],"answer":1,"explain":"Bảo toàn phụ thuộc đã có nhờ mỗi FD trong F_c thành một bảng; key đảm bảo lossless (PE 7.16)."},{"q":"Lược đồ (student_id, course_id, student_name, grade), F = {student_id → student_name; student_id, course_id → grade}. Dạng chuẩn cao nhất?","options":["1NF (không 2NF)","2NF","3NF","BCNF"],"answer":0,"explain":"student_name (không khoá) phụ thuộc bộ phận vào key {student_id, course_id}."}],"questions":[{"q":"Cho R = (A, B, C, D, E), F = {AB → C, C → D, D → E}. Tính (AB)⁺, C⁺, tìm mọi candidate key.","en":"","answer":"\u003cul>\u003cli>(AB)⁺: AB → ABC (AB → C) → ABCD (C → D) → ABCDE (D → E). AB là superkey.\u003c/li>\u003cli>C⁺ = CDE, A⁺ = A, B⁺ = B → AB tối thiểu.\u003c/li>\u003cli>A và B không xuất hiện ở vế phải nào → phải có trong mọi key; AB đã là superkey → \u003cstrong>candidate key duy nhất: AB\u003c/strong>.\u003c/li>\u003c/ul>"},{"q":"Tiếp tục bài trên: R có ở BCNF/3NF không? Phân rã R về BCNF; phân rã có bảo toàn phụ thuộc không?","en":"","answer":"\u003cul>\u003cli>C → D: C không phải superkey, D không prime → vi phạm cả BCNF và 3NF (tương tự D → E).\u003c/li>\u003cli>Tách theo C → D: dùng C⁺ = CDE, ta có (C, D, E) và (A, B, C).\u003c/li>\u003cli>(C, D, E): D → E, D không phải superkey của CDE → tách (D, E) và (C, D).\u003c/li>\u003cli>Kết quả: \u003cstrong>(A, B, C), (C, D), (D, E)\u003c/strong>. Mọi FD AB → C, C → D, D → E đều nằm trọn trong một bảng → \u003cstrong>bảo toàn phụ thuộc\u003c/strong>. Mỗi bước tách có phần chung là key của một bên → lossless.\u003c/li>\u003c/ul>"},{"q":"R = (A, B, C, D), F = {AB → C, C → D, D → A}. Tìm candidate key; R có ở 3NF? BCNF?","en":"","answer":"\u003cul>\u003cli>B không ở vế phải nào → B thuộc mọi key. B⁺ = B.\u003c/li>\u003cli>(AB)⁺ = ABCD; (BC)⁺: C → D → A → ABCD; (BD)⁺: D → A, AB → C → ABCD. \u003cstrong>Key: AB, BC, BD\u003c/strong> (đều tối thiểu).\u003c/li>\u003cli>Mọi thuộc tính A, B, C, D đều prime → mọi FD thoả điều kiện thứ ba → \u003cstrong>3NF\u003c/strong>.\u003c/li>\u003cli>C → D, D → A có vế trái không phải superkey → \u003cstrong>không BCNF\u003c/strong>.\u003c/li>\u003cli>Phân rã BCNF (một cách): theo C → D → (C, D) và (A, B, C); trong (A, B, C) có C → A (suy ra qua C → D → A) vi phạm → (A, C), (B, C). Kết quả (C, D), (A, C), (B, C) — \u003cstrong>mất AB → C\u003c/strong> và D → A. Đây là lý do có lúc ta chọn dừng ở 3NF.\u003c/li>\u003c/ul>"},{"q":"Tính canonical cover của F = {A → BD, B → C, AB → C, D → C, A → C} trên R = (A, B, C, D).","en":"","answer":"\u003col>\u003cli>Gộp A → BD và A → C: \u003cstrong>A → BCD\u003c/strong>.\u003c/li>\u003cli>Vế phải của A → BCD: bỏ C, F' = {A → BD, B → C, AB → C, D → C}; A⁺ dưới F' = ABCD chứa C → \u003cstrong>C thừa\u003c/strong> → A → BD.\u003c/li>\u003cli>Vế trái của AB → C: B⁺ = BC chứa C → \u003cstrong>A thừa\u003c/strong> → B → C (trùng FD đã có, gộp lại).\u003c/li>\u003cli>Kiểm tra tiếp: B và D trong A → BD không thừa (bỏ B: A⁺ = ACD thiếu B; bỏ D: A⁺ = ABC thiếu D).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>F\u003csub>c\u003c/sub> = {A → BD, B → C, D → C}\u003c/strong>.\u003c/p>"},{"q":"R = (A, B, C, D), F = {A → B, C → D}. Phân rã nào lossless: (a) (A, B), (C, D); (b) (A, B, C), (C, D); (c) (A, B), (A, C, D)?","en":"","answer":"\u003cul>\u003cli>(a) R₁ ∩ R₂ = ∅ → không xác định gì → \u003cstrong>lossy\u003c/strong> (join là Cartesian product).\u003c/li>\u003cli>(b) Phần chung C, C⁺ = CD = R₂ → \u003cstrong>lossless\u003c/strong>.\u003c/li>\u003cli>(c) Phần chung A, A⁺ = AB = R₁ → \u003cstrong>lossless\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Chú ý (b), (c) vẫn chưa ở BCNF: (A, B, C) có A → B với key AC; phân rã BCNF hoàn chỉnh là (A, B), (C, D), (A, C).\u003c/p>"},{"q":"R = (A, B, C), F = {A → B, B → C}. So sánh hai phân rã (A, B), (A, C) và (A, B), (B, C).","en":"","answer":"\u003cul>\u003cli>Cả hai đều \u003cstrong>lossless\u003c/strong> (phần chung A → AB; phần chung B → BC).\u003c/li>\u003cli>(A, B), (A, C): F₁ = {A → B}, F₂ = {A → C}; B → C \u003cstrong>không\u003c/strong> suy ra được từ F₁ ∪ F₂ → \u003cstrong>không bảo toàn phụ thuộc\u003c/strong>: muốn kiểm tra B → C phải join.\u003c/li>\u003cli>(A, B), (B, C): A → B nằm trong R₁, B → C nằm trong R₂ → \u003cstrong>bảo toàn phụ thuộc\u003c/strong>, và cả hai bảng ở BCNF → phân rã tốt hơn.\u003c/li>\u003c/ul>"},{"q":"Dùng Armstrong's axioms chứng minh: từ F = {A → B, B → C, CD → E} suy ra AD → E.","en":"","answer":"\u003col>\u003cli>A → B (cho), B → C (cho) ⇒ \u003cstrong>A → C\u003c/strong> (transitivity).\u003c/li>\u003cli>Augmentation với D: \u003cstrong>AD → CD\u003c/strong>.\u003c/li>\u003cli>AD → CD, CD → E ⇒ \u003cstrong>AD → E\u003c/strong> (transitivity).\u003c/li>\u003c/ol>\n\u003cp>(Hoặc dùng pseudotransitivity: A → C và CD → E ⇒ AD → E.) Kiểm tra bằng bao đóng: (AD)⁺ = ABCDE chứa E.\u003c/p>"},{"q":"R = (A, B, C, D, E, F), F = {A → B, B → C, CD → E, E → F}. Tìm key và phân rã 3NF bằng thuật toán tổng hợp.","en":"","answer":"\u003cul>\u003cli>A, D không ở vế phải nào → thuộc mọi key; (AD)⁺: A → B → C, CD → E → F → \u003cstrong>ABCDEF\u003c/strong>. Key duy nhất: \u003cstrong>AD\u003c/strong>.\u003c/li>\u003cli>F đã là canonical cover (vế trái khác nhau, không thuộc tính thừa).\u003c/li>\u003cli>Mỗi FD một lược đồ: (A, B), (B, C), (C, D, E), (E, F).\u003c/li>\u003cli>Chưa lược đồ nào chứa key AD → thêm \u003cstrong>(A, D)\u003c/strong>.\u003c/li>\u003cli>Kết quả: (A, B), (B, C), (C, D, E), (E, F), (A, D) — 3NF, lossless, bảo toàn phụ thuộc.\u003c/li>\u003c/ul>"},{"q":"Phân rã class(course_id, title, dept_name, credits, sec_id, semester, year, building, room_number, capacity, time_slot_id) về BCNF (FD như slide 7.58). Giải thích vì sao kết quả lossless.","en":"","answer":"\u003cul>\u003cli>Key: {course_id, sec_id, semester, year}.\u003c/li>\u003cli>course_id → title, dept_name, credits vi phạm → \u003cstrong>course(course_id, title, dept_name, credits)\u003c/strong> và class-1(course_id, sec_id, semester, year, building, room_number, capacity, time_slot_id). Phần chung course_id là key của course → lossless.\u003c/li>\u003cli>Trong class-1: building, room_number → capacity vi phạm → \u003cstrong>classroom(building, room_number, capacity)\u003c/strong> và \u003cstrong>section(course_id, sec_id, semester, year, building, room_number, time_slot_id)\u003c/strong>. Phần chung (building, room_number) là key của classroom → lossless.\u003c/li>\u003cli>Ba bảng đều ở BCNF (vế trái mỗi FD còn lại là key của bảng chứa nó) và mọi FD đều nằm trong một bảng → bảo toàn phụ thuộc.\u003c/li>\u003c/ul>"},{"q":"Vì sao dept_advisor(s_ID, i_ID, dept_name) không thể vừa BCNF vừa bảo toàn phụ thuộc? Nếu giữ ở 3NF thì phải chịu dư thừa gì?","en":"","answer":"\u003cul>\u003cli>Vi phạm BCNF là i_ID → dept_name → tách (i_ID, dept_name), (s_ID, i_ID). FD s_ID, dept_name → i_ID cần cả ba thuộc tính, không nằm trong bảng nào → mất. Mọi phân rã thực sự khác cũng tách rời ba thuộc tính này.\u003c/li>\u003cli>Giữ nguyên 3NF: (i_ID, dept_name) bị lặp cho mỗi sinh viên mà giảng viên đó hướng dẫn; muốn ghi một giảng viên thuộc khoa nào mà chưa có sinh viên thì phải để s_ID null. Đổi lại, s_ID, dept_name → i_ID kiểm tra được bằng \u003ccode>unique (s_ID, dept_name)\u003c/code>.\u003c/li>\u003c/ul>"},{"q":"Cho inst_info(ID, child_name, phone). Giải thích ID →→ child_name bằng định nghĩa t₁, t₂, t₃, t₄; vì sao không ở 4NF và phân rã thế nào?","en":"","answer":"\u003cul>\u003cli>Với t₁ = (99999, David, 512-555-1234) và t₂ = (99999, William, 512-555-4321), MVD đòi hỏi tồn tại t₃ = (99999, David, 512-555-4321) và t₄ = (99999, William, 512-555-1234): con và số điện thoại độc lập nên phải có đủ mọi tổ hợp.\u003c/li>\u003cli>ID →→ child_name không tầm thường (child_name ⊄ ID và ID ∪ child_name ≠ R), ID không phải superkey → \u003cstrong>không 4NF\u003c/strong> (dù ở BCNF vì không có FD không tầm thường).\u003c/li>\u003cli>Phân rã: \u003cstrong>inst_child(ID, child_name)\u003c/strong>, \u003cstrong>inst_phone(ID, phone)\u003c/strong>. Lossless vì phần chung ID →→ child_name. Thêm một số điện thoại giờ chỉ là một dòng.\u003c/li>\u003c/ul>"},{"q":"Cho R(student_id, course_id, student_name, grade), F = {student_id → student_name; student_id, course_id → grade}. Xác định dạng chuẩn và đưa về BCNF.","en":"","answer":"\u003cul>\u003cli>Key: {student_id, course_id}. student_name không khoá, phụ thuộc vào student_id ⊂ key → \u003cstrong>phụ thuộc bộ phận → không 2NF\u003c/strong> (do đó không 3NF, không BCNF). Chỉ ở 1NF.\u003c/li>\u003cli>Tách theo student_id → student_name: \u003cstrong>(student_id, student_name)\u003c/strong> và \u003cstrong>(student_id, course_id, grade)\u003c/strong>. Cả hai ở BCNF, lossless (phần chung student_id là key của bảng đầu), bảo toàn phụ thuộc.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"7.01","topic":"redundancy","level":1,"prompt":"\u003cp>Bảng \u003ccode>nf_in_dep(ID, name, salary, dept_name, building, budget)\u003c/code> là instructor ⋈ department (slide 7.3). Liệt kê các bộ (dept_name, building, budget) bị \u003cstrong>lặp lại\u003c/strong>, kèm số lần lặp \u003ccode>copies\u003c/code> (chỉ những bộ xuất hiện từ 2 lần).\u003c/p>","en":"","hint":"","solution":"select dept_name, building, budget, count(*) as copies\nfrom nf_in_dep\ngroup by dept_name, building, budget\nhaving count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","building","budget","copies"],"rows":[["Physics","Watson","70000","2"],["History","Painter","50000","2"],["Finance","Painter","120000","2"],["Comp. Sci.","Taylor","100000","3"]]}},{"id":"7.02","topic":"update anomaly","level":1,"prompt":"\u003cp>Mô phỏng \u003cstrong>update anomaly\u003c/strong>: đổi budget của khoa Physics thành 95000 nhưng \u003cstrong>chỉ\u003c/strong> ở dòng của giảng viên ID \u003ccode>22222\u003c/code> trong \u003ccode>nf_in_dep\u003c/code>. (Hệ thống sẽ kiểm tra các khoa giờ có nhiều hơn một budget.)\u003c/p>","en":"","hint":"","solution":"update nf_in_dep set budget = 95000 where ID = '22222';","check":"select dept_name, count(distinct budget) as n_budgets\nfrom nf_in_dep group by dept_name having count(distinct budget) > 1;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","n_budgets"],"rows":[["Physics","2"]]}},{"id":"7.03","topic":"test FD","level":1,"prompt":"\u003cp>Bảng \u003ccode>nf_enroll_raw(student_id, student_name, course_id, course_title, grade)\u003c/code> có dữ liệu \"bẩn\". Trả về các \u003ccode>student_id\u003c/code> \u003cstrong>vi phạm\u003c/strong> FD student_id → student_name.\u003c/p>","en":"","hint":"group by student_id having count(distinct student_name) > 1","solution":"select student_id\nfrom nf_enroll_raw\ngroup by student_id\nhaving count(distinct student_name) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["student_id"],"rows":[["S002"]]}},{"id":"7.04","topic":"FD violation tuples","level":2,"prompt":"\u003cp>Liệt kê \u003cstrong>mọi dòng\u003c/strong> (mọi cột) của \u003ccode>nf_enroll_raw\u003c/code> tham gia vi phạm FD course_id → course_title.\u003c/p>","en":"","hint":"","solution":"select *\nfrom nf_enroll_raw\nwhere course_id in (select course_id from nf_enroll_raw\n                    group by course_id\n                    having count(distinct course_title) > 1);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["student_id","student_name","course_id","course_title","grade"],"rows":[["S001","An","CS-101","Intro. to Computer Science","A"],["S002","Binh","CS-101","Intro. to Computer Science","B"],["S003","Chi","CS-101","Intro to CS","C"]]}},{"id":"7.05","topic":"test FD","level":2,"prompt":"\u003cp>Bảng \u003ccode>nf_class\u003c/code> là course ⋈ section ⋈ classroom (slide 7.58). Trả về \u003cstrong>một dòng, hai cột boolean\u003c/strong>: \u003ccode>room_capacity\u003c/code> — FD building, room_number → capacity có đúng trên instance không; \u003ccode>course_title\u003c/code> — FD course_id → title có đúng không.\u003c/p>","en":"","hint":"not exists (select ... group by ... having count(distinct ...) > 1)","solution":"select not exists (select building, room_number from nf_class\n                   group by building, room_number\n                   having count(distinct capacity) > 1) as room_capacity,\n       not exists (select course_id from nf_class\n                   group by course_id\n                   having count(distinct title) > 1) as course_title;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["room_capacity","course_title"],"rows":[["true","true"]]}},{"id":"7.06","topic":"superkey on instance","level":2,"prompt":"\u003cp>Trên \u003ccode>nf_class\u003c/code>, kiểm tra hai tập thuộc tính có xác định duy nhất mỗi dòng không. Trả về một dòng hai cột boolean: \u003ccode>k1\u003c/code> cho {course_id, sec_id, semester, year}, \u003ccode>k2\u003c/code> cho {course_id, semester, year}.\u003c/p>","en":"","hint":"count(*) = count(distinct (a, b, ...))","solution":"select count(*) = count(distinct (course_id, sec_id, semester, year)) as k1,\n       count(*) = count(distinct (course_id, semester, year)) as k2\nfrom nf_class;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["k1","k2"],"rows":[["true","false"]]}},{"id":"7.07","topic":"not a key","level":1,"prompt":"\u003cp>Vì sao không được dùng name làm khoá khi phân rã \u003ccode>nf_employee(ID, name, street, city, salary)\u003c/code>? Trả về các name bị trùng và số nhân viên mang tên đó (\u003ccode>n\u003c/code>).\u003c/p>","en":"","hint":"","solution":"select name, count(*) as n from nf_employee group by name having count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","n"],"rows":[["Kim","2"]]}},{"id":"7.08","topic":"lossy decomposition","level":2,"prompt":"\u003cp>Phân rã \u003ccode>nf_employee\u003c/code> thành R₁(ID, name) và R₂(name, street, city, salary) (slide 7.5). Trả về các \u003cstrong>tuple giả\u003c/strong>: có trong Π\u003csub>R1\u003c/sub> ⋈ Π\u003csub>R2\u003c/sub> nhưng không có trong bảng gốc, theo thứ tự cột ID, name, street, city, salary.\u003c/p>","en":"","hint":"(select ID, name, street, city, salary from (...) r1 natural join (...) r2) except (select * from nf_employee)","solution":"select ID, name, street, city, salary\nfrom (select ID, name from nf_employee) r1\n     natural join (select name, street, city, salary from nf_employee) r2\nexcept\nselect ID, name, street, city, salary from nf_employee;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","street","city","salary"],"rows":[["98776","Kim","Main","Perryridge","75000"],["57766","Kim","North","Hampton","67000"]]}},{"id":"7.09","topic":"lossy decomposition","level":1,"prompt":"\u003cp>Cùng phân rã như 7.08: trả về một dòng hai cột \u003ccode>original_rows\u003c/code> (số dòng của nf_employee) và \u003ccode>joined_rows\u003c/code> (số dòng của R₁ ⋈ R₂).\u003c/p>","en":"","hint":"","solution":"select (select count(*) from nf_employee) as original_rows,\n       (select count(*)\n        from (select ID, name from nf_employee) r1\n             natural join (select name, street, city, salary from nf_employee) r2) as joined_rows;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["original_rows","joined_rows"],"rows":[["4","6"]]}},{"id":"7.10","topic":"lossless decomposition","level":2,"prompt":"\u003cp>Phân rã \u003ccode>nf_in_dep\u003c/code> thành (ID, name, salary, dept_name) và (dept_name, building, budget). Chứng minh trên dữ liệu là lossless: trả về một dòng ba cột \u003ccode>joined_rows\u003c/code>, \u003ccode>extra\u003c/code> (số tuple có trong join mà không có trong bảng gốc), \u003ccode>missing\u003c/code> (số tuple có trong bảng gốc mà không có trong join).\u003c/p>","en":"","hint":"","solution":"with j as (\n  select ID, name, salary, dept_name, building, budget\n  from (select ID, name, salary, dept_name from nf_in_dep) r1\n       natural join (select distinct dept_name, building, budget from nf_in_dep) r2\n)\nselect (select count(*) from j) as joined_rows,\n       (select count(*) from (select * from j except select * from nf_in_dep) x) as extra,\n       (select count(*) from (select * from nf_in_dep except select * from j) y) as missing;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["joined_rows","extra","missing"],"rows":[["12","0","0"]]}},{"id":"7.11","topic":"BCNF decomposition","level":2,"prompt":"\u003cp>Đưa \u003ccode>nf_in_dep\u003c/code> về BCNF theo FD dept_name → building, budget. Tạo:\u003c/p>\n\u003cul>\u003cli>\u003ccode>nf_department_part(dept_name primary key, building, budget)\u003c/code>\u003c/li>\u003cli>\u003ccode>nf_instructor_part(ID primary key, name, salary, dept_name)\u003c/code> với dept_name là \u003cstrong>foreign key\u003c/strong> tham chiếu nf_department_part\u003c/li>\u003c/ul>\n\u003cp>rồi chép dữ liệu từ nf_in_dep sang (không lặp).\u003c/p>","en":"","hint":"insert into ... select distinct ...; tạo bảng department trước bảng instructor.","solution":"create table nf_department_part (\n  dept_name  varchar(20) primary key,\n  building   varchar(15),\n  budget     numeric(12,2)\n);\ncreate table nf_instructor_part (\n  ID         varchar(5) primary key,\n  name       varchar(20),\n  salary     numeric(8,2),\n  dept_name  varchar(20) references nf_department_part\n);\ninsert into nf_department_part select distinct dept_name, building, budget from nf_in_dep;\ninsert into nf_instructor_part select ID, name, salary, dept_name from nf_in_dep;","check":"select (select count(*) from nf_department_part) as depts,\n       (select count(*) from nf_instructor_part) as instructors,\n       (select count(*) from information_schema.table_constraints\n        where table_name in ('nf_department_part', 'nf_instructor_part')\n          and constraint_type in ('PRIMARY KEY', 'FOREIGN KEY')) as key_constraints;","ordered":false,"fresh":false,"expected":{"fields":["depts","instructors","key_constraints"],"rows":[["7","12","3"]]}},{"id":"7.12","topic":"BCNF decomposition","level":3,"prompt":"\u003cp>Phân rã \u003ccode>nf_class\u003c/code> về BCNF như slide 7.58–7.59, dùng \u003ccode>create table ... as select distinct\u003c/code>: \u003ccode>nf_c_course(course_id, title, dept_name, credits)\u003c/code>, \u003ccode>nf_c_room(building, room_number, capacity)\u003c/code>, \u003ccode>nf_c_section(course_id, sec_id, semester, year, building, room_number, time_slot_id)\u003c/code>. (Hệ thống đếm số dòng mỗi bảng và số dòng của natural join ba bảng.)\u003c/p>","en":"","hint":"","solution":"create table nf_c_course as\n  select distinct course_id, title, dept_name, credits from nf_class;\ncreate table nf_c_room as\n  select distinct building, room_number, capacity from nf_class;\ncreate table nf_c_section as\n  select distinct course_id, sec_id, semester, year, building, room_number, time_slot_id from nf_class;","check":"select (select count(*) from nf_c_course) as courses,\n       (select count(*) from nf_c_room) as rooms,\n       (select count(*) from nf_c_section) as sections,\n       (select count(*) from nf_c_section natural join nf_c_course natural join nf_c_room) as joined;","ordered":false,"fresh":false,"expected":{"fields":["courses","rooms","sections","joined"],"rows":[["12","5","15","15"]]}},{"id":"7.13","topic":"test FD (3NF)","level":1,"prompt":"\u003cp>Bảng \u003ccode>nf_dept_advisor(s_ID, i_ID, dept_name)\u003c/code>. Trả về một dòng hai cột boolean: \u003ccode>fd1\u003c/code> — i_ID → dept_name có đúng; \u003ccode>fd2\u003c/code> — s_ID, dept_name → i_ID có đúng.\u003c/p>","en":"","hint":"","solution":"select not exists (select i_ID from nf_dept_advisor group by i_ID\n                   having count(distinct dept_name) > 1) as fd1,\n       not exists (select s_ID, dept_name from nf_dept_advisor group by s_ID, dept_name\n                   having count(distinct i_ID) > 1) as fd2;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["fd1","fd2"],"rows":[["true","true"]]}},{"id":"7.14","topic":"lost dependency","level":3,"prompt":"\u003cp>Phân rã BCNF của dept_advisor: tạo \u003ccode>nf_da_instr(i_ID primary key, dept_name)\u003c/code> và \u003ccode>nf_da_student(s_ID, i_ID, primary key (s_ID, i_ID))\u003c/code> từ nf_dept_advisor. Sau đó chèn \u003ccode>('00128', '45565')\u003c/code> vào nf_da_student — không có ràng buộc nào của từng bảng bị vi phạm.\u003cbr>(Hệ thống join hai bảng để tìm vi phạm s_ID, dept_name → i_ID: đó chính là FD bị mất.)\u003c/p>","en":"","hint":"","solution":"create table nf_da_instr (\n  i_ID       varchar(5) primary key,\n  dept_name  varchar(20)\n);\ncreate table nf_da_student (\n  s_ID  varchar(5),\n  i_ID  varchar(5),\n  primary key (s_ID, i_ID)\n);\ninsert into nf_da_instr select distinct i_ID, dept_name from nf_dept_advisor;\ninsert into nf_da_student select s_ID, i_ID from nf_dept_advisor;\ninsert into nf_da_student values ('00128', '45565');","check":"select s_ID, dept_name, count(distinct i_ID) as advisors\nfrom nf_da_student na
