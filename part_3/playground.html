u003c/sub>[S] = t\u003csub>s\u003c/sub>[S]\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[R − S] = t\u003c/li>\u003c/ul>\n\u003cp>Given the above definition:\u003c/p>\n\u003cp>a. Write a relational algebra expression using the division operator to find the IDs of all students who have taken all Comp. Sci. courses. (Hint: project \u003cem>takes\u003c/em> to just ID and \u003cem>course_id\u003c/em>, and generate the set of all Comp. Sci. *course_id*s using a select expression, before doing the division.)\u003c/p>\n\u003cp>b. Show how to write the above query in relational algebra, without using division. (By doing so, you would have shown how to define the division operation using the other relational algebra operations.)\u003c/p>","hint":"Chỉ đếm các course nằm trong tập của Zhang.","solution":"select ID\nfrom takes\nwhere course_id in (select course_id from takes where ID = '00128')\ngroup by ID\nhaving count(distinct course_id) = (select count(distinct course_id) from takes where ID = '00128');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["00128"],["12345"]]}}]},{"key":"gk2","store":"gk2","short":"GK2","label":"Ôn GK · Phần 2","navLabel":"GK2","kind":"Ôn tập","title":"Practice Exercises — Chapter 3","titleVi":"Practice Exercises Chương 3 (Introduction to SQL)","summary":"\u003ch3>Cách dùng phần này\u003c/h3>\n\u003cp>Toàn bộ Practice Exercises Chương 3 (3.1–3.10, mọi câu a, b, c…) đều có bài SQL \u003cstrong>tự chấm\u003c/strong> trên dữ liệu mẫu: University, Employee database (Figure 3.19), Bank database (Figure 3.18), Insurance database (Figure 3.17), \u003ccode>grade_points\u003c/code>, \u003ccode>marks\u003c/code>. Xem cột/khoá ở \u003cem>Công cụ › Lược đồ cơ sở dữ liệu\u003c/em>. Mỗi bài ghi rõ số PE của sách.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Bài SQL\u003c/th>\u003cth>Tự luận\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3.1 a–g\u003c/td>\u003ctd>University: credits, Einstein, max salary, enrollment\u003c/td>\u003ctd>GK2.01–GK2.08\u003c/td>\u003ctd>Câu 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.2 a–d\u003c/td>\u003ctd>grade_points, tổng điểm, GPA, null grade\u003c/td>\u003ctd>GK2.09–GK2.13\u003c/td>\u003ctd>Câu 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.3 a–c\u003c/td>\u003ctd>update / delete / insert … select\u003c/td>\u003ctd>GK2.14–GK2.16\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.4 a–b\u003c/td>\u003ctd>Insurance database\u003c/td>\u003ctd>GK2.17–GK2.18\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.5 a–b\u003c/td>\u003ctd>\u003ccode>case\u003c/code> chấm điểm theo marks\u003c/td>\u003ctd>GK2.19–GK2.20\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.6\u003c/td>\u003ctd>\u003ccode>lower(...) like\u003c/code>\u003c/td>\u003ctd>GK2.21–GK2.22\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.7\u003c/td>\u003ctd>\u003ccode>from p, r1, r2 where ... or ...\u003c/code> khi r1/r2 rỗng\u003c/td>\u003ctd>GK2.23\u003c/td>\u003ctd>Câu 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.8 a–c\u003c/td>\u003ctd>Bank database\u003c/td>\u003ctd>GK2.24–GK2.26\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.9 a–g\u003c/td>\u003ctd>Employee database: all, not exists/except, having\u003c/td>\u003ctd>GK2.27–GK2.33\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.10 a–b\u003c/td>\u003ctd>update, \u003ccode>case\u003c/code> trong update\u003c/td>\u003ctd>GK2.34–GK2.36\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Mẫu câu hay thi\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Yêu cầu trong đề\u003c/th>\u003cth>Mẫu SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\"Find all ... earning the highest\"\u003c/td>\u003ctd>\u003ccode>where salary = (select max(salary) from ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"... of each section, show 0 if none\"\u003c/td>\u003ctd>\u003cstrong>scalar subquery\u003c/strong> \u003ccode>(select count(*) ... where ... = section....)\u003c/code> hoặc outer join (Ch.4)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"maximum of an aggregate\"\u003c/td>\u003ctd>\u003ccode>select max(x) from (select ... count(...) as x ... group by ...) t\u003c/code> hoặc \u003ccode>with\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"the ... that had the maximum ...\"\u003c/td>\u003ctd>\u003ccode>with t as (...) select ... from t where x = (select max(x) from t)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"more than every ...\"\u003c/td>\u003ctd>\u003ccode>&gt; all (subquery)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"located in every city where ...\"\u003c/td>\u003ctd>\u003ccode>not exists ((A) except (B))\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"the company with the most employees (ties)\"\u003c/td>\u003ctd>\u003ccode>having count(...) &gt;= all (select count(...) ... group by ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"average higher than ...\"\u003c/td>\u003ctd>\u003ccode>group by ... having avg(...) &gt; (select avg(...) ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"has X but not Y\"\u003c/td>\u003ctd>\u003ccode>(select ...) except (select ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"case-insensitive\"\u003c/td>\u003ctd>\u003ccode>lower(col) like '%sci%'\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"raise 10% unless ..., then 3%\"\u003c/td>\u003ctd>\u003cstrong>một\u003c/strong> \u003ccode>update ... set x = x * case when ... then 1.03 else 1.1 end\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Bẫy thường gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>count(*) vs count(col)\u003c/strong>: với outer join, \u003ccode>count(*)\u003c/code> đếm cả dòng null → section không có ai vẫn ra 1.\u003c/li>\u003cli>\u003cstrong>Join + group by làm mất nhóm rỗng\u003c/strong> (PE 3.1e): section không có sinh viên không có dòng nào để group.\u003c/li>\u003cli>\u003cstrong>Aggregate trên tập rỗng\u003c/strong>: \u003ccode>count\u003c/code> → 0, nhưng \u003ccode>sum/max/avg\u003c/code> → \u003cstrong>null\u003c/strong>; max của kết quả rỗng là \u003cem>rỗng\u003c/em>, không phải 0 (PE 3.1f).\u003c/li>\u003cli>\u003cstrong>Chia cho 0\u003c/strong> khi tính GPA của sinh viên chưa học môn nào (PE 3.2b) → GPA nên là null.\u003c/li>\u003cli>\u003cstrong>null grade\u003c/strong> tự bị loại bởi điều kiện \u003ccode>takes.grade = grade_points.grade\u003c/code> (PE 3.2d) — cả credits lẫn points của môn đó đều không được tính.\u003c/li>\u003cli>\u003cstrong>Cartesian product với bảng rỗng là rỗng\u003c/strong> (PE 3.7): \u003ccode>from p, r1, r2\u003c/code> trả về rỗng nếu r1 \u003cem>hoặc\u003c/em> r2 rỗng, dù điều kiện là \u003ccode>or\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Đếm người, không đếm sự kiện\u003c/strong> (PE 3.4a): \u003ccode>count(distinct ...)\u003c/code>; và đề hỏi \u003cstrong>chủ xe\u003c/strong> (owns), không phải \u003cstrong>người lái\u003c/strong> (participated.driver_id).\u003c/li>\u003cli>\u003cstrong>Thứ tự hai lệnh update\u003c/strong> (PE 3.10b): làm 10% trước rồi 3% sẽ tăng lương hai lần cho một số người.\u003c/li>\u003cli>Schema mẫu có \u003ccode>check (salary &gt; 29000)\u003c/code> trên instructor → lệnh của PE 3.3c (salary 10000) bị \u003cstrong>từ chối\u003c/strong> (SQLSTATE 23514).\u003c/li>\u003cli>Lời giải sách PE 3.8b viết \u003ccode>S.customer_id\u003c/code> — cột đúng là \u003ccode>S.ID\u003c/code>.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>PE 3.1e\u003c/strong> — Câu trả lời của sách dùng scalar subquery. Vì sao cách viết \u003ccode>section, takes ... group by\u003c/code> \"trông có vẻ đúng\" lại sai? Sửa thế nào?","en":"\u003cp>\u003cstrong>Exercise 3.1 (e).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>e. Find the enrollment of each section that was offered in Fall 2017.\u003c/p>","answer":"\u003cp>Cách join rồi group by:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select takes.course_id, takes.sec_id, count(ID)\nfrom section, takes\nwhere takes.course_id = section.course_id and takes.sec_id = section.sec_id\n  and takes.semester = section.semester and takes.year = section.year\n  and takes.semester = 'Fall' and takes.year = 2017\ngroup by takes.course_id, takes.sec_id\u003c/code>\u003c/pre>\n\u003cp>Section \u003cstrong>không có sinh viên\u003c/strong> sẽ không có dòng nào trong join nên \u003cstrong>không xuất hiện\u003c/strong> (lẽ ra phải có enrollment 0). Sửa: dùng scalar subquery (count trên tập rỗng = 0) như lời giải, hoặc \u003ccode>section left outer join takes\u003c/code> với \u003ccode>count(takes.ID)\u003c/code> (Chương 4). Bài GK2.06 kiểm tra đúng tình huống này.\u003c/p>"},{"q":"\u003cstrong>PE 3.2d\u003c/strong> — Nếu một số grade là null, các lời giải ở 3.2 còn đúng không?","en":"\u003cp>\u003cstrong>Exercise 3.2 (d).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>d. Now reconsider your answers to the earlier parts of this exercise under the assumption that some grades might be null. Explain whether your solutions still work and, if not, provide versions that handle nulls properly.\u003c/p>","answer":"\u003cp>\u003cstrong>Vẫn đúng.\u003c/strong> Mọi truy vấn đều có điều kiện \u003ccode>takes.grade = grade_points.grade\u003c/code>; với grade null, so sánh cho \u003cem>unknown\u003c/em> nên dòng takes đó bị loại \u003cstrong>trước khi\u003c/strong> aggregate — cả points lẫn \u003cstrong>credits\u003c/strong> của môn đó đều không được cộng. Vì vậy GPA chỉ tính trên các môn đã có điểm. (Nếu dùng outer join với grade_points thì phải tự loại credits của môn có grade null — xem PE 4.6.)\u003c/p>"},{"q":"\u003cstrong>PE 3.7\u003c/strong> — Với \u003ccode>select p.a1 from p, r1, r2 where p.a1 = r1.a1 or p.a1 = r2.a1\u003c/code>, khi nào câu truy vấn chọn đúng các giá trị p.a1 nằm trong r1 hoặc r2? Xét kỹ trường hợp r1 hoặc r2 rỗng.","en":"\u003cp>\u003cstrong>Exercise 3.7.\u003c/strong> Consider the SQL query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select p.a1\nfrom p, r1, r2\nwhere p.a1 = r1.a1 or p.a1 = r2.a1\u003c/code>\u003c/pre>\n\u003cp>Under what conditions does the preceding query select values of p.a1 that are either in r1 or in r2? Examine carefully the cases where either r1 or r2 may be empty.\u003c/p>","answer":"\u003cp>Câu truy vấn chọn đúng các p.a1 bằng một giá trị nào đó của r1.a1 hoặc r2.a1 \u003cstrong>khi và chỉ khi cả r1 và r2 đều khác rỗng\u003c/strong>. Nếu r1 hoặc r2 (hoặc p) rỗng thì tích Descartes p × r1 × r2 rỗng → kết quả rỗng, dù điều kiện dùng \u003ccode>or\u003c/code>.\u003c/p>\n\u003cp>Cách viết đúng: \u003ccode>select a1 from p where a1 in (select a1 from r1) or a1 in (select a1 from r2)\u003c/code> hoặc \u003ccode>select a1 from p where a1 in (select a1 from r1 union select a1 from r2)\u003c/code> (bài GK2.23). Ngoài ra bản gốc còn trả về \u003cstrong>trùng lặp\u003c/strong> (mỗi cặp khớp một dòng).\u003c/p>"}],"exercises":[{"id":"GK2.01","topic":"PE 3.1a where","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1a\u003c/strong> — Title các course của khoa Comp. Sci. có 3 credits.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (a).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>a. Find the titles of courses in the Comp. Sci. department that have 3 credits.\u003c/p>","hint":"","solution":"select title from course where dept_name = 'Comp. Sci.' and credits = 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Robotics"],["Image Processing"],["Database System Concepts"]]}},{"id":"GK2.02","topic":"PE 3.1b join, distinct","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1b\u003c/strong> — ID của mọi sinh viên được dạy bởi một instructor tên Einstein, \u003cstrong>không trùng lặp\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (b).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>b. Find the IDs of all students who were taught by an instructor named Einstein; make sure there are no duplicates in the result.\u003c/p>","hint":"takes khớp teaches trên (course_id, sec_id, semester, year); teaches.ID = instructor.ID.","solution":"select distinct takes.ID\nfrom takes, instructor, teaches\nwhere takes.course_id = teaches.course_id\n  and takes.sec_id = teaches.sec_id\n  and takes.semester = teaches.semester\n  and takes.year = teaches.year\n  and teaches.ID = instructor.ID\n  and instructor.name = 'Einstein';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["44553"]]}},{"id":"GK2.03","topic":"PE 3.1c max","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1c\u003c/strong> — Lương cao nhất của một instructor.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (c).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>c. Find the highest salary of any instructor.\u003c/p>","hint":"","solution":"select max(salary) from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["95000"]]}},{"id":"GK2.04","topic":"PE 3.1d subquery","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1d\u003c/strong> — ID, name của mọi instructor có lương cao nhất (có thể nhiều người).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (d).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>d. Find all instructors earning the highest salary (there may be more than one with the same salary).\u003c/p>","hint":"","solution":"select ID, name from instructor where salary = (select max(salary) from instructor);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["22222","Einstein"]]}},{"id":"GK2.05","topic":"PE 3.1e scalar subquery","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1e\u003c/strong> — Enrollment (số sinh viên) của mỗi section mở ở Fall 2017: course_id, sec_id, enrollment. Section không có sinh viên phải có enrollment 0.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (e).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>e. Find the enrollment of each section that was offered in Fall 2017.\u003c/p>","hint":"Scalar subquery trong select.","solution":"select course_id, sec_id,\n       (select count(ID) from takes\n        where takes.year = section.year and takes.semester = section.semester\n          and takes.course_id = section.course_id and takes.sec_id = section.sec_id) as enrollment\nfrom section\nwhere semester = 'Fall' and year = 2017;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-101","1","6"],["CS-347","1","2"],["PHY-101","1","1"]]}},{"id":"GK2.06","topic":"PE 3.1e empty section","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1e (bẫy section rỗng)\u003c/strong> — Tạo view \u003ccode>gk_fall2017_enrollment(course_id, sec_id, enrollment)\u003c/code> chứa enrollment của mỗi section Fall 2017. Khi chấm, hệ thống \u003cstrong>thêm một section Fall 2017 không có sinh viên\u003c/strong> rồi đọc view: section đó phải có enrollment 0.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (e).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>e. Find the enrollment of each section that was offered in Fall 2017.\u003c/p>","hint":"Cách join + group by sẽ làm mất section mới.","solution":"create view gk_fall2017_enrollment (course_id, sec_id, enrollment) as\nselect course_id, sec_id,\n       (select count(ID) from takes\n        where takes.year = section.year and takes.semester = section.semester\n          and takes.course_id = section.course_id and takes.sec_id = section.sec_id)\nfrom section\nwhere semester = 'Fall' and year = 2017;","check":"insert into section values ('CS-190', '3', 'Fall', 2017, 'Taylor', '3128', 'B');\nselect * from gk_fall2017_enrollment;","ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-101","1","6"],["CS-347","1","2"],["PHY-101","1","1"],["CS-190","3","0"]]}},{"id":"GK2.07","topic":"PE 3.1f max of aggregate","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1f\u003c/strong> — Enrollment \u003cstrong>lớn nhất\u003c/strong> trên mọi section ở Fall 2017 (một giá trị).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (f).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>f. Find the maximum enrollment, across all sections, in Fall 2017.\u003c/p>","hint":"","solution":"select max(enrollment)\nfrom (select count(ID) as enrollment\n      from section, takes\n      where takes.year = section.year and takes.semester = section.semester\n        and takes.course_id = section.course_id and takes.sec_id = section.sec_id\n        and takes.semester = 'Fall' and takes.year = 2017\n      group by takes.course_id, takes.sec_id) as t;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["6"]]}},{"id":"GK2.08","topic":"PE 3.1g with","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1g\u003c/strong> — Các section (course_id, sec_id) có enrollment lớn nhất ở Fall 2017. Dùng \u003ccode>with\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.1 (g).\u003c/strong> Write the following queries in SQL, using the university schema. (We suggest you actually run these queries on a database, using the sample data that we provide on the web site of the book, db-book.com. Instructions for setting up a database, and loading sample data, are provided on the above web site.)\u003c/p>\n\u003cp>g. Find the sections that had the maximum enrollment in Fall 2017.\u003c/p>","hint":"","solution":"with sec_enrollment as (\n  select takes.course_id, takes.sec_id, count(ID) as enrollment\n  from section, takes\n  where takes.year = section.year and takes.semester = section.semester\n    and takes.course_id = section.course_id and takes.sec_id = section.sec_id\n    and takes.semester = 'Fall' and takes.year = 2017\n  group by takes.course_id, takes.sec_id)\nselect course_id, sec_id\nfrom sec_enrollment\nwhere enrollment = (select max(enrollment) from sec_enrollment);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id"],"rows":[["CS-101","1"]]}},{"id":"GK2.09","topic":"PE 3.2a grade points","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2a\u003c/strong> — Tổng grade points (credits × points) mà sinh viên \u003ccode>12345\u003c/code> đạt được qua mọi course đã học. Bảng \u003ccode>grade_points(grade, points)\u003c/code> có sẵn.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.2 (a).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>a. Find the total grade points earned by the student with ID '12345', across all courses taken by the student.\u003c/p>","hint":"","solution":"select sum(credits * points)\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\n  and ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sum"],"rows":[["48"]]}},{"id":"GK2.10","topic":"PE 3.2b GPA","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2b\u003c/strong> — GPA của sinh viên \u003ccode>12345\u003c/code>: tổng grade points chia tổng credits của các course tương ứng. Đặt tên cột \u003ccode>GPA\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.2 (b).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>b. Find the grade point average (\u003cem>GPA\u003c/em>) for the above student, that is, the total grade points divided by the total credits for the associated courses.\u003c/p>","hint":"","solution":"select sum(credits * points) / sum(credits) as GPA\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\n  and ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["gpa"],"rows":[["3.4286"]]}},{"id":"GK2.11","topic":"PE 3.2c group by","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2c\u003c/strong> — ID và GPA của mỗi sinh viên (chỉ những sinh viên có ít nhất một môn đã có điểm).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.2 (c).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>c. Find the ID and the grade-point average of each student.\u003c/p>","hint":"","solution":"select ID, sum(credits * points) / sum(credits) as GPA\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\ngroup by ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa"],"rows":[["76653","2"],["19991","3"],["76543","4"],["54321","3.5"],["44553","2.7"],["55739","3.7"],["45678","2.0182"],["12345","3.4286"],["98988","4"],["98765","2.2571"],["00128","3.8714"],["23121","2.3"]]}},{"id":"GK2.12","topic":"PE 3.2c union null","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.2c (đầy đủ)\u003c/strong> — Như GK2.11 nhưng sinh viên \u003cstrong>chưa học môn nào\u003c/strong> cũng xuất hiện với GPA = null. Không dùng outer join (dùng \u003ccode>union\u003c/code> như lời giải sách).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.2 (c).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>c. Find the ID and the grade-point average of each student.\u003c/p>","hint":"","solution":"select ID, sum(credits * points) / sum(credits) as GPA\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\ngroup by ID\nunion\nselect ID, null\nfrom student\nwhere not exists (select * from takes where takes.ID = student.ID);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","gpa"],"rows":[["23121","2.3"],["54321","3.5"],["98988","4"],["19991","3"],["12345","3.4286"],["76543","4"],["76653","2"],["00128","3.8714"],["98765","2.2571"],["44553","2.7"],["70557",null],["45678","2.0182"],["55739","3.7"]]}},{"id":"GK2.13","topic":"PE 3.2d null grade","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.2d\u003c/strong> — Sinh viên \u003ccode>98988\u003c/code> (Tanaka) có một môn \u003cstrong>chưa có điểm\u003c/strong> (grade null). Trả về \u003cstrong>hai cột\u003c/strong>: \u003ccode>naive_gpa\u003c/code> = sum(credits × points) / sum(credits) tính trên \u003ccode>takes natural join course left join grade_points using (grade)\u003c/code> (không lọc gì), và \u003ccode>correct_gpa\u003c/code> = GPA chỉ tính các môn đã có điểm.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.2 (d).\u003c/strong> Suppose you are given a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) that provides a conversion from letter grades in the \u003cem>takes\u003c/em> relation to numeric scores; for example, an “A” grade could be specified to correspond to 4 points, an “A−” to 3.7 points, a “B+” to 3.3 points, a “B” to 3 points, and so on. The grade points earned by a student for a course offering (section) is defined as the number of credits for the course multiplied by the numeric points for the grade that the student received.\u003c/p>\n\u003cp>Given the preceding relation, and our university schema, write each of the following queries in SQL. You may assume for simplicity that no \u003cem>takes\u003c/em> tuple has the \u003cem>null\u003c/em> value for \u003cem>grade\u003c/em>.\u003c/p>\n\u003cp>d. Now reconsider your answers to the earlier parts of this exercise under the assumption that some grades might be null. Explain whether your solutions still work and, if not, provide versions that handle nulls properly.\u003c/p>","hint":"Ở cách naive, credits của môn null vẫn bị cộng vào mẫu số (vì sum(credits) không bỏ qua dòng có points null). Dùng case when grade is null then 0 else credits end.","solution":"select sum(credits * points) / sum(credits) as naive_gpa,\n       sum(credits * points) / sum(case when grade is null then 0 else credits end) as correct_gpa\nfrom takes natural join course left join grade_points using (grade)\nwhere ID = '98988';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["naive_gpa","correct_gpa"],"rows":[["2","4"]]}},{"id":"GK2.14","topic":"PE 3.3a update","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.3a\u003c/strong> — Tăng 10% lương của mỗi instructor khoa Comp. Sci.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.3 (a).\u003c/strong> Write the following inserts, deletes, or updates in SQL, using the university schema.\u003c/p>\n\u003cp>a. Increase the salary of each instructor in the Comp. Sci. department by 10%.\u003c/p>","hint":"","solution":"update instructor set salary = salary * 1.10 where dept_name = 'Comp. Sci.';","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","71500"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","82500"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","101200"],["98345","80000"]]}},{"id":"GK2.15","topic":"PE 3.3b delete","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.3b\u003c/strong> — Xoá mọi course chưa bao giờ được mở (không xuất hiện trong section).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.3 (b).\u003c/strong> Write the following inserts, deletes, or updates in SQL, using the university schema.\u003c/p>\n\u003cp>b. Delete all courses that have never been offered (i.e., do not occur in the \u003cem>section\u003c/em> relation).\u003c/p>","hint":"","solution":"delete from course where course_id not in (select course_id from section);","check":"select course_id from course order by course_id;","ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["BIO-101"],["BIO-301"],["CS-101"],["CS-190"],["CS-315"],["CS-319"],["CS-347"],["EE-181"],["FIN-201"],["HIS-351"],["MU-199"],["PHY-101"]]}},{"id":"GK2.16","topic":"PE 3.3c insert select","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.3c\u003c/strong> — Chèn mọi student có \u003ccode>tot_cred &gt; 100\u003c/code> làm instructor cùng khoa. Sách dùng lương 10000, nhưng schema có \u003ccode>check (salary &gt; 29000)\u003c/code> nên lệnh đó bị từ chối (23514) — hãy dùng lương \u003cstrong>30000\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.3 (c).\u003c/strong> Write the following inserts, deletes, or updates in SQL, using the university schema.\u003c/p>\n\u003cp>c. Insert every student whose \u003cem>tot_cred\u003c/em> attribute is greater than 100 as an instructor in the same department, with a salary of $10,000.\u003c/p>","hint":"","solution":"insert into instructor\nselect ID, name, dept_name, 30000\nfrom student\nwhere tot_cred > 100;","check":"select ID, name, dept_name, salary from instructor where salary = 30000 order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["00128","Zhang","Comp. Sci.","30000"],["23121","Chavez","Finance","30000"],["98988","Tanaka","Biology","30000"]]}},{"id":"GK2.17","topic":"PE 3.4a count distinct","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.4a\u003c/strong> (Insurance database) — Tổng số người \u003cstrong>sở hữu\u003c/strong> xe có dính tai nạn năm 2017.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.4 (a).\u003c/strong> Consider the insurance database of Figure 3.17, where the primary keys are underlined. Construct the following SQL queries for this relational database.\u003c/p>\n\u003cp>a. Find the total number of people who owned cars that were involved in accidents in 2017.\u003c/p>\n\u003cp>\u003cem>Figure 3.17 — Insurance database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>person (\u003cu>driver_id\u003c/u>, name, address)\u003c/li>\u003cli>car (\u003cu>license_plate\u003c/u>, model, year)\u003c/li>\u003cli>accident (\u003cu>report_number\u003c/u>, year, location)\u003c/li>\u003cli>owns (\u003cu>driver_id, license_plate\u003c/u>)\u003c/li>\u003cli>participated (\u003cu>report_number, license_plate\u003c/u>, driver_id, damage_amount)\u003c/li>\u003c/ul>","hint":"accident → participated → owns (theo license_plate); count(distinct ...).","solution":"select count(distinct owns.driver_id)\nfrom accident, participated, owns\nwhere accident.report_number = participated.report_number\n  and owns.license_plate = participated.license_plate\n  and accident.year = 2017;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["4"]]}},{"id":"GK2.18","topic":"PE 3.4b delete in","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.4b\u003c/strong> — Xoá mọi xe đời 2010 thuộc về người có driver_id \u003ccode>12345\u003c/code>. (owns và participated khai báo \u003ccode>on delete cascade\u003c/code> tới car.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.4 (b).\u003c/strong> Consider the insurance database of Figure 3.17, where the primary keys are underlined. Construct the following SQL queries for this relational database.\u003c/p>\n\u003cp>b. Delete all year-2010 cars belonging to the person whose ID is '12345'.\u003c/p>\n\u003cp>\u003cem>Figure 3.17 — Insurance database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>person (\u003cu>driver_id\u003c/u>, name, address)\u003c/li>\u003cli>car (\u003cu>license_plate\u003c/u>, model, year)\u003c/li>\u003cli>accident (\u003cu>report_number\u003c/u>, year, location)\u003c/li>\u003cli>owns (\u003cu>driver_id, license_plate\u003c/u>)\u003c/li>\u003cli>participated (\u003cu>report_number, license_plate\u003c/u>, driver_id, damage_amount)\u003c/li>\u003c/ul>","hint":"","solution":"delete from car\nwhere year = 2010\n  and license_plate in (select license_plate from owns where driver_id = '12345');","check":"select license_plate, year,\n       (select count(*) from owns o where o.license_plate = car.license_plate) as num_owners\nfrom car order by license_plate;","ordered":false,"fresh":false,"expected":{"fields":["license_plate","year","num_owners"],"rows":[["CCC333","2015","1"],["DDD444","2010","1"],["EEE555","2018","2"],["FFF666","2020","1"],["GGG777","2012","1"]]}},{"id":"GK2.19","topic":"PE 3.5a case","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.5a\u003c/strong> — Hiển thị ID và grade của mỗi sinh viên trong \u003ccode>marks(ID, score)\u003c/code>: F nếu score \u003c 40, C nếu 40 ≤ score \u003c 60, B nếu 60 ≤ score \u003c 80, A nếu score ≥ 80.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.5 (a).\u003c/strong> Suppose that we have a relation \u003cem>marks\u003c/em>(\u003cem>ID\u003c/em>, \u003cem>score\u003c/em>) and we wish to assign grades to students based on the score as follows: grade F if score \u003c 40, grade C if 40 ≤ score \u003c 60, grade B if 60 ≤ score \u003c 80, and grade A if 80 ≤ score. Write SQL queries to do the following:\u003c/p>\n\u003cp>a. Display the grade for each student, based on the \u003cem>marks\u003c/em> relation.\u003c/p>","hint":"","solution":"select ID,\n       case\n         when score \u003c 40 then 'F'\n         when score \u003c 60 then 'C'\n         when score \u003c 80 then 'B'\n         else 'A'\n       end as grade\nfrom marks;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","grade"],"rows":[["00128","A"],["12345","B"],["19991","F"],["23121","B"],["44553","C"],["45678","C"],["54321","A"],["55739","C"],["70557","A"],["76543","F"],["76653","B"],["98765","B"],["98988","A"]]}},{"id":"GK2.20","topic":"PE 3.5b group by case","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.5b\u003c/strong> — Số sinh viên đạt mỗi grade (grade, count).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.5 (b).\u003c/strong> Suppose that we have a relation \u003cem>marks\u003c/em>(\u003cem>ID\u003c/em>, \u003cem>score\u003c/em>) and we wish to assign grades to students based on the score as follows: grade F if score \u003c 40, grade C if 40 ≤ score \u003c 60, grade B if 60 ≤ score \u003c 80, and grade A if 80 ≤ score. Write SQL queries to do the following:\u003c/p>\n\u003cp>b. Find the number of students with each grade.\u003c/p>","hint":"","solution":"with grades as (\n  select ID,\n         case\n           when score \u003c 40 then 'F'\n           when score \u003c 60 then 'C'\n           when score \u003c 80 then 'B'\n           else 'A'\n         end as grade\n  from marks)\nselect grade, count(ID)\nfrom grades\ngroup by grade;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["grade","count"],"rows":[["B","4"],["C","3"],["F","2"],["A","4"]]}},{"id":"GK2.21","topic":"PE 3.6 lower like","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.6\u003c/strong> — Tên các department có chứa chuỗi \u003ccode>sci\u003c/code> (không phân biệt hoa thường).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.6.\u003c/strong> The SQL \u003cstrong>like\u003c/strong> operator is case sensitive (in most systems), but the \u003cstrong>lower()\u003c/strong> function on strings can be used to perform case-insensitive matching. To show how, write a query that finds departments whose names contain the string “sci” as a substring, regardless of the case.\u003c/p>","hint":"","solution":"select dept_name from department where lower(dept_name) like '%sci%';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name"],"rows":[["Comp. Sci."]]}},{"id":"GK2.22","topic":"PE 3.6 lower like","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.6 (biến thể)\u003c/strong> — Title các course chứa chuỗi \u003ccode>INTRO\u003c/code> không phân biệt hoa thường. (Thử \u003ccode>like '%INTRO%'\u003c/code> trước để thấy like phân biệt hoa thường.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.6.\u003c/strong> The SQL \u003cstrong>like\u003c/strong> operator is case sensitive (in most systems), but the \u003cstrong>lower()\u003c/strong> function on strings can be used to perform case-insensitive matching. To show how, write a query that finds departments whose names contain the string “sci” as a substring, regardless of the case.\u003c/p>","hint":"","solution":"select title from course where lower(title) like '%intro%';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Intro. to Biology"],["Intro. to Computer Science"],["Intro. to Digital Systems"]]}},{"id":"GK2.23","topic":"PE 3.7 empty relation","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.7\u003c/strong> — Tạo bảng \u003ccode>gk_p(a1 int)\u003c/code> = {1, 2, 3}, \u003ccode>gk_r1(a1 int)\u003c/code> = {1, 2} và \u003ccode>gk_r2(a1 int)\u003c/code> \u003cstrong>rỗng\u003c/strong>. Câu của sách \u003ccode>select gk_p.a1 from gk_p, gk_r1, gk_r2 where gk_p.a1 = gk_r1.a1 or gk_p.a1 = gk_r2.a1\u003c/code> trả về rỗng. Viết câu \u003cstrong>đúng\u003c/strong> trả về các giá trị của gk_p có trong gk_r1 hoặc gk_r2.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.7.\u003c/strong> Consider the SQL query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select p.a1\nfrom p, r1, r2\nwhere p.a1 = r1.a1 or p.a1 = r2.a1\u003c/code>\u003c/pre>\n\u003cp>Under what conditions does the preceding query select values of p.a1 that are either in r1 or in r2? Examine carefully the cases where either r1 or r2 may be empty.\u003c/p>","hint":"in (select ... union select ...).","solution":"create table gk_p (a1 int);\ncreate table gk_r1 (a1 int);\ncreate table gk_r2 (a1 int);\ninsert into gk_p values (1), (2), (3);\ninsert into gk_r1 values (1), (2);\nselect a1 from gk_p\nwhere a1 in (select a1 from gk_r1 union select a1 from gk_r2);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a1"],"rows":[["1"],["2"]]}},{"id":"GK2.24","topic":"PE 3.8a except","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.8a\u003c/strong> (Bank database) — ID của mỗi khách hàng có account nhưng \u003cstrong>không\u003c/strong> có loan.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.8 (a).\u003c/strong> Consider the bank database of Figure 3.18, where the primary keys are underlined. Construct the following SQL queries for this relational database.\u003c/p>\n\u003cp>a. Find the ID of each customer of the bank who has an account but not a loan.\u003c/p>\n\u003cp>\u003cem>Figure 3.18 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"(select ID from depositor)\nexcept\n(select ID from borrower);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["89012"],["93456"],["45678"],["67890"]]}},{"id":"GK2.25","topic":"PE 3.8b self join","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.8b\u003c/strong> — ID của mỗi khách hàng sống \u003cstrong>cùng street và cùng city\u003c/strong> với khách hàng \u003ccode>12345\u003c/code> (kể cả chính 12345). Lưu ý: lời giải sách viết \u003ccode>S.customer_id\u003c/code> — cột đúng là \u003ccode>ID\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.8 (b).\u003c/strong> Consider the bank database of Figure 3.18, where the primary keys are underlined. Construct the following SQL queries for this relational database.\u003c/p>\n\u003cp>b. Find the ID of each customer who lives on the same street and in the same city as customer '12345'.\u003c/p>\n\u003cp>\u003cem>Figure 3.18 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"select F.ID\nfrom customer as F, customer as S\nwhere F.customer_street = S.customer_street\n  and F.customer_city = S.customer_city\n  and S.ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["93456"]]}},{"id":"GK2.26","topic":"PE 3.8c join","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.8c\u003c/strong> — Tên mỗi branch có ít nhất một khách hàng có account ở đó và sống ở Harrison.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.8 (c).\u003c/strong> Consider the bank database of Figure 3.18, where the primary keys are underlined. Construct the following SQL queries for this relational database.\u003c/p>\n\u003cp>c. Find the name of each branch that has at least one customer who has an account in the bank and who lives in “Harrison”.\u003c/p>\n\u003cp>\u003cem>Figure 3.18 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"select distinct branch_name\nfrom account, depositor, customer\nwhere customer.ID = depositor.ID\n  and depositor.account_number = account.account_number\n  and customer_city = 'Harrison';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Brighton"],["Perryridge"]]}},{"id":"GK2.27","topic":"PE 3.9a join","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.9a\u003c/strong> (Employee database) — ID, tên và thành phố cư trú của mỗi nhân viên làm cho First Bank Corporation.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (a).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>a. Find the ID, name, and city of residence of each employee who works for “First Bank Corporation”.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select e.ID, e.person_name, e.city\nfrom employee as e, works as w\nwhere w.company_name = 'First Bank Corporation' and w.ID = e.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10002","Bob Tran","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK2.28","topic":"PE 3.9b in","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.9b\u003c/strong> — ID, tên, thành phố của mỗi nhân viên làm cho First Bank Corporation \u003cstrong>và\u003c/strong> có lương > 10000.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (b).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>b. Find the ID, name, and city of residence of each employee who works for “First Bank Corporation” and earns more than $10000.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select ID, person_name, city\nfrom employee\nwhere ID in (select ID from works\n             where company_name = 'First Bank Corporation' and salary > 10000);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK2.29","topic":"PE 3.9c not in","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9c\u003c/strong> — ID của mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho First Bank Corporation, kể cả người không có trong works.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (c).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>c. Find the ID of each employee who does not work for “First Bank Corporation”.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"company_name \u003c> ... trên works sẽ bỏ sót người không có trong works.","solution":"select ID from employee\nwhere ID not in (select ID from works where company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10005"],["10006"],["10007"],["10008"],["10009"],["10010"],["10011"],["10012"],["10013"],["12345"]]}},{"id":"GK2.30","topic":"PE 3.9d > all","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9d\u003c/strong> — ID của mỗi nhân viên có lương cao hơn \u003cstrong>mọi\u003c/strong> nhân viên của Small Bank Corporation.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (d).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>d. Find the ID of each employee who earns more than every employee of “Small Bank Corporation”.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select ID from works\nwhere salary > all (select salary from works where company_name = 'Small Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10001"],["10003"],["10004"],["10007"],["10008"],["10009"],["10010"]]}},{"id":"GK2.31","topic":"PE 3.9e not exists except","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.9e\u003c/strong> — Một công ty có thể đặt ở nhiều thành phố (\u003ccode>company(company_name, city)\u003c/code>). Tên mỗi công ty đặt ở \u003cstrong>mọi\u003c/strong> thành phố mà Small Bank Corporation có mặt.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (e).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>e. Assume that companies may be located in several cities. Find the name of each company that is located in every city in which “Small Bank Corporation” is located.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select distinct S.company_name\nfrom company as S\nwhere not exists ((select city from company where company_name = 'Small Bank Corporation')\n                  except\n                  (select city from company as T where S.company_name = T.company_name));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["Mega Corp"],["Small Bank Corporation"]]}},{"id":"GK2.32","topic":"PE 3.9f having >= all","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.9f\u003c/strong> — Tên công ty có \u003cstrong>nhiều nhân viên nhất\u003c/strong> (trả về tất cả nếu hoà).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (f).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>f. Find the name of the company that has the most employees (or companies, in the case where there is a tie for the most).\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select company_name\nfrom works\ngroup by company_name\nhaving count(distinct ID) >= all (select count(distinct ID) from works group by company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["First Bank Corporation"],["Mega Corp"]]}},{"id":"GK2.33","topic":"PE 3.9g having avg","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9g\u003c/strong> — Tên mỗi công ty có lương trung bình của nhân viên \u003cstrong>cao hơn\u003c/strong> lương trung bình ở First Bank Corporation.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.9 (g).\u003c/strong> Consider the relational database of Figure 3.19, where the primary keys are underlined. Give an expression in SQL for each of the following queries.\u003c/p>\n\u003cp>g. Find the name of each company whose employees earn a higher salary, on average, than the average salary at “First Bank Corporation”.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"select company_name\nfrom works\ngroup by company_name\nhaving avg(salary) > (select avg(salary) from works where company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["BigBank"]]}},{"id":"GK2.34","topic":"PE 3.10a update","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.10a\u003c/strong> — Nhân viên có ID \u003ccode>12345\u003c/code> nay sống ở Newtown.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.10 (a).\u003c/strong> Consider the relational database of Figure 3.19. Give an expression in SQL for each of the following:\u003c/p>\n\u003cp>a. Modify the database so that the employee whose ID is '12345' now lives in “Newtown”.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"update employee set city = 'Newtown' where ID = '12345';","check":"select ID, city from employee order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","city"],"rows":[["10001","Miami"],["10002","Miami"],["10003","Boston"],["10004","New York"],["10005","Miami"],["10006","Chicago"],["10007","Miami"],["10008","New York"],["10009","Chicago"],["10010","Miami"],["10011","Boston"],["10012","Chicago"],["10013","Boston"],["12345","Newtown"]]}},{"id":"GK2.35","topic":"PE 3.10b update case","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.10b\u003c/strong> — Tăng 10% lương cho mỗi \u003cstrong>manager\u003c/strong> (xuất hiện trong \u003ccode>manages.manager_id\u003c/code>) làm cho First Bank Corporation, trừ khi lương sau khi tăng vượt 100000 — khi đó chỉ tăng 3%. Viết \u003cstrong>một\u003c/strong> lệnh update dùng \u003ccode>case\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.10 (b).\u003c/strong> Consider the relational database of Figure 3.19. Give an expression in SQL for each of the following:\u003c/p>\n\u003cp>b. Give each manager of “First Bank Corporation” a 10 percent raise unless the salary becomes greater than $100000; in such cases, give only a 3 percent raise.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"","solution":"update works as T\nset salary = T.salary * (case when T.salary * 1.1 > 100000 then 1.03 else 1.1 end)\nwhere T.ID in (select manager_id from manages)\n  and T.company_name = 'First Bank Corporation';","check":"select ID, salary from works order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","93500"],["10002","9500"],["10003","60000"],["10004","94760"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","58000"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}},{"id":"GK2.36","topic":"PE 3.10b two updates","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.10b (hai lệnh)\u003c/strong> — Viết lại GK2.35 bằng \u003cstrong>hai\u003c/strong> lệnh update không dùng case, theo \u003cstrong>đúng thứ tự\u003c/strong> để không ai bị tăng hai lần. Kết quả phải giống GK2.35.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 3.10 (b).\u003c/strong> Consider the relational database of Figure 3.19. Give an expression in SQL for each of the following:\u003c/p>\n\u003cp>b. Give each manager of “First Bank Corporation” a 10 percent raise unless the salary becomes greater than $100000; in such cases, give only a 3 percent raise.\u003c/p>\n\u003cp>\u003cem>Figure 3.19 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"Lệnh 3% (salary * 1.1 > 100000) chạy trước.","solution":"update works as T\nset salary = T.salary * 1.03\nwhere T.ID in (select manager_id from manages)\n  and T.salary * 1.1 > 100000\n  and T.company_name = 'First Bank Corporation';\nupdate works as T\nset salary = T.salary * 1.1\nwhere T.ID in (select manager_id from manages)\n  and T.salary * 1.1 \u003c= 100000\n  and T.company_name = 'First Bank Corporation';","check":"select ID, salary from works order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","93500"],["10002","9500"],["10003","60000"],["10004","94760"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","58000"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}}]},{"key":"gk3","store":"gk3","short":"GK3","label":"Ôn GK · Phần 3","navLabel":"GK3","kind":"Ôn tập","title":"Practice Exercises — Chapter 4","titleVi":"Practice Exercises Chương 4 (Intermediate SQL)","summary":"\u003ch3>Cách dùng phần này\u003c/h3>\n\u003cp>Toàn bộ Practice Exercises Chương 4 (4.1–4.13). Nhiều câu Chương 4 hỏi về \u003cstrong>trường hợp biên\u003c/strong> (section không có giảng viên, khoa không có giảng viên, giá trị null…) mà dữ liệu mẫu không có sẵn. Vì vậy một số bài yêu cầu bạn \u003cstrong>tạo view\u003c/strong> với tên cho trước; khi chấm, hệ thống \u003cstrong>chèn thêm dữ liệu biên\u003c/strong> rồi mới đọc view — câu sai (ví dụ dùng inner join, \u003ccode>count(*)\u003c/code>) sẽ lộ ra ngay.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Bài SQL\u003c/th>\u003cth>Tự luận\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4.1\u003c/td>\u003ctd>Lỗi natural join qua dept_name\u003c/td>\u003ctd>GK3.01\u003c/td>\u003ctd>Câu 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.2 a–d\u003c/td>\u003ctd>Outer join, scalar subquery, coalesce, đếm 0\u003c/td>\u003ctd>GK3.02–GK3.05\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.3 a–b\u003c/td>\u003ctd>Viết outer join không dùng outer join\u003c/td>\u003ctd>GK3.06–GK3.07\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.4 a–b\u003c/td>\u003ctd>Thứ tự left outer join và null\u003c/td>\u003ctd>GK3.08\u003c/td>\u003ctd>Câu 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.5 a–c\u003c/td>\u003ctd>Thiết kế dữ liệu test cho truy vấn\u003c/td>\u003ctd>GK3.09\u003c/td>\u003ctd>Câu 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.6\u003c/td>\u003ctd>View student_grades xử lý null\u003c/td>\u003ctd>GK3.10\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.7\u003c/td>\u003ctd>DDL + referential integrity cho Employee database\u003c/td>\u003ctd>GK3.11\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.8 a–b\u003c/td>\u003ctd>Giảng viên dạy 2 phòng cùng time slot; assertion\u003c/td>\u003ctd>GK3.12\u003c/td>\u003ctd>Câu 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.9\u003c/td>\u003ctd>Foreign key tự tham chiếu + on delete cascade\u003c/td>\u003ctd>GK3.13\u003c/td>\u003ctd>Câu 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.10\u003c/td>\u003ctd>natural full outer join bằng \u003ccode>on\u003c/code> + coalesce\u003c/td>\u003ctd>GK3.14\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.11\u003c/td>\u003ctd>Vì sao DB có nhiều loại quyền\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Câu 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.12\u003c/td>\u003ctd>\u003ccode>granted by current_role\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Câu 7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.13\u003c/td>\u003ctd>Quyền trên view; insert qua view mà không thấy\u003c/td>\u003ctd>GK3.15–GK3.16\u003c/td>\u003ctd>Câu 8\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Outer join — cheat sheet\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Yêu cầu\u003c/th>\u003cth>Mẫu\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Đếm, hiện 0 cho nhóm rỗng\u003c/td>\u003ctd>\u003ccode>r left outer join s ... group by ... count(s.col)\u003c/code> — \u003cstrong>không\u003c/strong> \u003ccode>count(*)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đếm không dùng outer join\u003c/td>\u003ctd>scalar subquery \u003ccode>(select count(*) from s where s.k = r.k)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thay null bằng ký hiệu\u003c/td>\u003ctd>\u003ccode>coalesce(name, '-')\u003c/code> (Oracle: \u003ccode>decode(name, null, '-', name)\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⟕ s không dùng outer join\u003c/td>\u003ctd>\u003ccode>r ⋈ s union (r không khớp, null cho các cột của s)\u003c/code> với \u003ccode>not exists\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⟗ s\u003c/td>\u003ctd>r ⋈ s ∪ (r không khớp) ∪ (s không khớp)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>natural full outer join bằng \u003ccode>on\u003c/code>\u003c/td>\u003ctd>\u003ccode>coalesce(a.k, b.k) as k\u003c/code> cho cột chung\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Chọn cột để count:\u003c/strong> cột của bảng bên phải mà \u003cstrong>không\u003c/strong> có ở bảng bên trái (ví dụ \u003ccode>sec_id\u003c/code> của teaches) — cột chung như \u003ccode>ID\u003c/code> không bao giờ null trong natural left outer join.\u003c/p>\n\u003ch3>Ràng buộc & quyền\u003c/h3>\n\u003cul>\u003cli>Foreign key tự tham chiếu + \u003ccode>on delete cascade\u003c/code> → xoá \u003cstrong>dây chuyền\u003c/strong> toàn bộ cây cấp dưới (PE 4.9).\u003c/li>\u003cli>\u003ccode>create assertion\u003c/code> có trong chuẩn SQL nhưng \u003cstrong>không DBMS phổ biến nào hỗ trợ\u003c/strong> (PE 4.8b) → dùng trigger hoặc truy vấn kiểm tra.\u003c/li>\u003cli>Quyền trên view \u003cstrong>không\u003c/strong> cần quyền select trên bảng gốc → che giấu một phần dữ liệu (PE 4.13).\u003c/li>\u003cli>Insert qua view có thể tạo tuple \u003cstrong>không nhìn thấy\u003c/strong> qua view (không thoả where) — trừ khi \u003ccode>with check option\u003c/code>.\u003c/li>\u003cli>\u003ccode>granted by current_role\u003c/code>: quyền gắn với \u003cstrong>role\u003c/strong>, vẫn còn khi tài khoản người cấp bị xoá (PE 4.12).\u003c/li>\u003c/ul>\n\u003ch3>Bẫy & lỗi trong lời giải sách\u003c/h3>\n\u003cul>\u003cli>PE 4.1: \u003ccode>instructor natural join teaches natural join section natural join course\u003c/code> ghép thêm theo \u003cstrong>dept_name\u003c/strong> (instructor và course đều có) → mất các môn giảng viên dạy ngoài khoa mình.\u003c/li>\u003cli>PE 4.2a: dùng \u003ccode>count(*)\u003c/code> sẽ cho 1 thay vì 0.\u003c/li>\u003cli>PE 4.6: sách dùng \u003ccode>decode\u003c/code> (Oracle) → PostgreSQL dùng \u003ccode>case\u003c/code>.\u003c/li>\u003cli>PE 4.7: lời giải viết \u003ccode>manager_iid\u003c/code> — là lỗi gõ của \u003ccode>manager_id\u003c/code>.\u003c/li>\u003cli>PE 4.8a: \u003ccode>count(distinct building, room_number)\u003c/code> không hợp lệ trong PostgreSQL → \u003ccode>count(distinct (building, room_number))\u003c/code>. Ngoài ra lời giải group by cả \u003ccode>sec_id\u003c/code> — mỗi section chỉ có một phòng nên \u003cstrong>không bao giờ\u003c/strong> phát hiện được vi phạm; phải bỏ sec_id khỏi group by.\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>PE 4.1\u003c/strong> — Truy vấn \u003ccode>select name, title from instructor natural join teaches natural join section natural join course where semester = 'Spring' and year = 2017\u003c/code> muốn liệt kê title của mọi course dạy ở Spring 2017 cùng tên instructor. Sai ở đâu?","en":"\u003cp>\u003cstrong>Exercise 4.1.\u003c/strong> Consider the following SQL query that seeks to find a list of titles of all courses taught in Spring 2017 along with the name of the instructor.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select name, title\nfrom instructor natural join teaches natural join section natural join course\nwhere semester = 'Spring' and year = 2017\u003c/code>\u003c/pre>\n\u003cp>What is wrong with this query?\u003c/p>","answer":"\u003cp>Cú pháp đúng nhưng \u003cstrong>ý nghĩa sai\u003c/strong>: \u003ccode>dept_name\u003c/code> là attribute của cả \u003cstrong>course\u003c/strong> và \u003cstrong>instructor\u003c/strong>, nên natural join ghép thêm điều kiện instructor.dept_name = course.dept_name. Kết quả chỉ còn các trường hợp giảng viên dạy môn \u003cstrong>thuộc khoa của mình\u003c/strong>. Sửa: \u003ccode>instructor natural join teaches natural join section join course using (course_id)\u003c/code> (bài GK3.01).\u003c/p>"},{"q":"\u003cstrong>PE 4.4\u003c/strong> — r(A, B), s(B, C), t(B, D), mọi attribute not null. (a) Cho instance để trong (r natural left outer join s) natural left outer join t, C null nhưng D khác null. (b) Có instance nào để r natural left outer join (s natural left outer join t) có C null mà D khác null không?","en":"\u003cp>\u003cstrong>Exercise 4.4.\u003c/strong> Suppose we have three relations r(A, B), s(B, C), and t(B, D), with all attributes declared as \u003cstrong>not null\u003c/strong>.\u003c/p>\n\u003cp>a. Give instances of relations r, s, and t such that in the result of\u003c/p>\n\u003cp>(r \u003cstrong>natural left outer join\u003c/strong> s) \u003cstrong>natural left outer join\u003c/strong> t\u003c/p>\n\u003cp>attribute C has a null value but attribute D has a non-null value.\u003c/p>\n\u003cp>b. Are there instances of r, s, and t such that the result of\u003c/p>\n\u003cp>r \u003cstrong>natural left outer join\u003c/strong> (s \u003cstrong>natural left outer join\u003c/strong> t)\u003c/p>\n\u003cp>has a null value for C but a non-null value for D? Explain why or why not.\u003c/p>","answer":"\u003cp>a. r = {(a, b)}, s = {(b1, c1)}, t = {(b, d)}. r ⟕ s = (a, b, null) vì không có s với B = b; rồi ⟕ t khớp B = b → \u003cstrong>(a, b, null, d)\u003c/strong>.\u003c/p>\n\u003cp>b. \u003cstrong>Không.\u003c/strong> s ⟕ t được tính trước; s không có null nên mọi dòng của nó có C khác null (D có thể null). Khi ghép r ⟕ (…): dòng r khớp thì C lấy từ s (khác null); dòng r không khớp thì \u003cstrong>cả C lẫn D\u003c/strong> đều null. Vậy không thể có C null mà D khác null. (Bài GK3.08.)\u003c/p>"},{"q":"\u003cstrong>PE 4.5\u003c/strong> — Kiểm thử truy vấn SQL: (a) cho dataset bắt được lỗi natural join instructor–teaches–course của Section 4.1.1; (b) vì sao dữ liệu test cần tuple ở referenced relation không có tuple tham chiếu tới nó; (c) vì sao cần tuple có foreign key \u003cstrong>null\u003c/strong> (nếu cột cho phép)?","en":"\u003cp>\u003cstrong>Exercise 4.5.\u003c/strong> Testing SQL queries: To test if a query specified in English has been correctly written in SQL, the SQL query is typically executed on multiple test databases, and a human checks if the SQL query result on each test database matches the intention of the specification in English.\u003c/p>\n\u003cp>a. In Section 4.1.1 we saw an example of an erroneous SQL query which was intended to find which courses had been taught by each instructor; the query computed the natural join of \u003cem>instructor\u003c/em>, \u003cem>teaches\u003c/em>, and \u003cem>course\u003c/em>, and as a result it unintentionally equated the \u003cem>dept_name\u003c/em> attribute of \u003cem>instructor\u003c/em> and \u003cem>course\u003c/em>. Give an example of a dataset that would help catch this particular error.\u003c/p>\n\u003cp>b. When creating test databases, it is important to create tuples in referenced relations that do not have any matching tuple in the referencing relation for each foreign key. Explain why, using an example query on the university database.\u003c/p>\n\u003cp>c. When creating test databases, it is important to create tuples with null values for foreign-key attributes, provided the attribute is nullable (SQL allows foreign-key attributes to take on null values, as long as they are not part of the primary key and have not been declared as \u003cstrong>not null\u003c/strong>). Explain why, using an example query on the university database.\u003c/p>\n\u003cp>Hint: Use the queries from Exercise 4.2.\u003c/p>","answer":"\u003cp>a. Một giảng viên Physics dạy môn Elec. Eng.:\u003c/p>\n\u003cul>\u003cli>instructor = {(12345, 'Gauss', 'Physics', 10000)}\u003c/li>\u003cli>teaches = {(12345, 'EE321', 1, 'Spring', 2017)}\u003c/li>\u003cli>course = {('EE321', 'Magnetism', 'Elec. Eng.', 6)}\u003c/li>\u003c/ul>\n\u003cp>Natural join ba bảng ra \u003cstrong>rỗng\u003c/strong> (dept_name khác nhau) trong khi kết quả đúng có một dòng. (Bài GK3.09.)\u003c/p>\n\u003cp>b. Ví dụ PE 4.2a: giảng viên \u003cstrong>chưa dạy section nào\u003c/strong> phải hiện số section 0. Nếu mọi instructor đều có trong teaches, câu sai dùng inner join (hoặc count(*)) vẫn cho kết quả đúng → không phát hiện được lỗi.\u003c/p>\n\u003cp>c. Ví dụ \u003ccode>select * from teaches natural join instructor\u003c/code>: nếu teaches.ID được phép null và có tuple như vậy thì join làm \u003cstrong>mất\u003c/strong> các section đó. Nếu chỉ vì teaches.ID là foreign key mà ta không tạo tuple null, lỗi này không bao giờ lộ ra khi test.\u003c/p>"},{"q":"\u003cstrong>PE 4.8\u003c/strong> — Ràng buộc: một instructor không thể dạy các section ở \u003cstrong>hai phòng khác nhau\u003c/strong> trong cùng semester, cùng time slot. (a) Viết truy vấn trả về các (instructor, section) vi phạm. (b) Viết assertion ép ràng buộc này.","en":"\u003cp>\u003cstrong>Exercise 4.8.\u003c/strong> As discussed in Section 4.4.8, we expect the constraint “an instructor cannot teach sections in two different classrooms in a semester in the same time slot” to hold.\u003c/p>\n\u003cp>a. Write an SQL query that returns all (\u003cem>instructor\u003c/em>, \u003cem>section\u003c/em>) combinations that violate this constraint.\u003c/p>\n\u003cp>b. Write an SQL assertion to enforce this constraint (as discussed in Section 4.4.8, current generation database systems do not support such assertions, although they are part of the SQL standard).\u003c/p>","answer":"\u003cp>a. Lời giải sách:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select ID, name, sec_id, semester, year, time_slot_id, count(distinct building, room_number)\nfrom instructor natural join teaches natural join section\ngroup by (ID, name, sec_id, semester, year, time_slot_id)\nhaving count(building, room_number) &gt; 1\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>distinct\u003c/code> cần thiết để hai section dạy \u003cstrong>cùng phòng\u003c/strong> cùng lúc (ghép lớp) không bị báo vi phạm. Tuy nhiên có hai vấn đề: PostgreSQL không cho \u003ccode>count(distinct a, b)\u003c/code> → viết \u003ccode>count(distinct (building, room_number))\u003c/code>; và group by \u003cstrong>sec_id\u003c/strong> khiến mỗi nhóm chỉ là một section (một phòng) nên không bao giờ > 1. Bản đúng:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select ID, name, semester, year, time_slot_id, count(distinct (building, room_number)) as num_rooms\nfrom instructor natural join teaches natural join section\ngroup by ID, name, semester, year, time_slot_id\nhaving count(distinct (building, room_number)) &gt; 1;\u003c/code>\u003c/pre>\n\u003cp>b. \u003ccode>create assertion check not exists (&lt;truy vấn trên&gt;)\u003c/code>. Assertion có trong chuẩn SQL nhưng \u003cstrong>không\u003c/strong> DBMS phổ biến nào hỗ trợ → trong thực tế dùng trigger trên teaches/section. (Bài GK3.12.)\u003c/p>"},{"q":"\u003cstrong>PE 4.9\u003c/strong> — Cho bảng manager(employee_ID, manager_ID) với foreign key (manager_ID) references manager(employee_ID) on delete cascade. Giải thích chính xác điều gì xảy ra khi xoá một tuple.","en":"\u003cp>\u003cstrong>Exercise 4.9.\u003c/strong> SQL allows a foreign-key dependency to refer to the same relation, as in the following example:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table manager\n  (employee_ID char(20),\n   manager_ID  char(20),\n   primary key employee_ID,\n   foreign key (manager_ID) references manager(employee_ID)\n     on delete cascade )\u003c/code>\u003c/pre>\n\u003cp>Here, \u003cem>employee_ID\u003c/em> is a key to the table \u003cem>manager\u003c/em>, meaning that each employee has at most one manager. The foreign-key clause requires that every manager also be an employee. Explain exactly what happens when a tuple in the relation \u003cem>manager\u003c/em> is deleted.\u003c/p>","answer":"\u003cp>\u003cstrong>Toàn bộ nhân viên dưới quyền manager đó, ở mọi cấp, đều bị xoá.\u003c/strong> Xoá tuple ban đầu kích hoạt xoá các tuple của nhân viên \u003cstrong>trực tiếp\u003c/strong> (manager_ID = người bị xoá); các lần xoá này lại kích hoạt xoá nhân viên cấp hai, và cứ thế cho tới khi hết nhân viên trực tiếp lẫn gián tiếp. (Bài GK3.13.)\u003c/p>"},{"q":"\u003cstrong>PE 4.11\u003c/strong> — Hệ điều hành thường chỉ có quyền read và write trên file. Vì sao database có nhiều loại quyền?","en":"\u003cp>\u003cstrong>Exercise 4.11.\u003c/strong> Operating systems usually offer only two types of authorization control for data files: read access and write access. Why do database systems offer so many kinds of authorization?\u003c/p>","answer":"\u003cp>Có nhiều lý do, ví dụ:\u003c/p>\n\u003cul>\u003cli>Cho user chỉ \u003cstrong>thêm\u003c/strong> dữ liệu mới (insert) mà không sửa dữ liệu cũ.\u003c/li>\u003cli>Cho user truy cập relation nhưng \u003cstrong>không đổi schema\u003c/strong> (alter, drop).\u003c/li>\u003cli>Hạn chế những thao tác không hẳn là truy cập dữ liệu nhưng ảnh hưởng tài nguyên, như \u003cstrong>tạo index\u003c/strong>.\u003c/li>\u003cli>Phân quyền chi tiết tới \u003cstrong>cột\u003c/strong> (update(grade)), quyền \u003cstrong>references\u003c/strong> (tạo foreign key), quyền trên \u003cstrong>view\u003c/strong>…\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 4.12\u003c/strong> — Khi grant select cho user khác, vì sao nên (hoặc không nên) thêm \u003ccode>granted by current_role\u003c/code>?","en":"\u003cp>\u003cstrong>Exercise 4.12.\u003c/strong> Suppose a user wants to grant \u003cstrong>select\u003c/strong> access on a relation to another user. Why should the user include (or not include) the clause \u003cstrong>granted by current role\u003c/strong> in the \u003cstrong>grant\u003c/strong> statement?\u003c/p>","answer":"\u003cp>Cả hai cách cho cùng quyền \u003cstrong>tại thời điểm\u003c/strong> grant, nhưng hiệu ứng lâu dài khác nhau. Nếu grant dựa trên \u003cstrong>role\u003c/strong>, quyền vẫn còn hiệu lực ngay cả khi user thực hiện grant rời tổ chức và tài khoản bị xoá (khi xoá user, các quyền do user đó cấp sẽ bị thu hồi dây chuyền). Tốt hay xấu tuỳ tình huống, nhưng thường grant qua role phù hợp hơn với một tổ chức vận hành tốt.\u003c/p>"},{"q":"\u003cstrong>PE 4.13\u003c/strong> — View v chỉ tham chiếu relation r. (1) User được grant select trên v có cần select trên r? (2) User được grant update trên v có cần update trên r? (3) Cho ví dụ insert vào v một tuple t không thấy trong \u003ccode>select * from v\u003c/code>.","en":"\u003cp>\u003cstrong>Exercise 4.13.\u003c/strong> Consider a view v whose definition references only relation r.\u003c/p>\n\u003cul>\u003cli>If a user is granted \u003cstrong>select\u003c/strong> authorization on v, does that user need to have \u003cstrong>select\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>If a user is granted \u003cstrong>update\u003c/strong> authorization on v, does that user need to have \u003cstrong>update\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>Give an example of an \u003cstrong>insert\u003c/strong> operation on a view v to add a tuple t that is not visible in the result of \u003cstrong>select\u003c/strong> * \u003cstrong>from\u003c/strong> v. Explain your answer.\u003c/li>\u003c/ul>","answer":"\u003col>\u003cli>\u003cstrong>Không.\u003c/strong> Nhờ vậy có thể cho user truy cập \u003cstrong>một phần\u003c/strong> của r (bài GK3.15).\u003c/li>\u003cli>Theo sách: \u003cstrong>có\u003c/strong> — update hợp lệ qua v phải cập nhật r thì mới được lưu. \u003cem>(Ghi chú PostgreSQL: view được thực thi với quyền của \u003cstrong>chủ view\u003c/strong>, nên user chỉ cần quyền update trên view; người tạo view phải có quyền trên r.)\u003c/em>\u003c/li>\u003cli>Bất kỳ tuple nào hợp schema của v nhưng \u003cstrong>không thoả where\u003c/strong> của v. Ví dụ view history_instructors = instructor của khoa History (không có \u003ccode>with check option\u003c/code>): insert ('25566', 'Brown', 'Biology', 100000) qua view thành công, tuple vào instructor nhưng không hiện trong view (bài GK3.16).\u003c/li>\u003c/ol>"}],"exercises":[{"id":"GK3.01","topic":"PE 4.1 natural join trap","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.1\u003c/strong> — Tạo view \u003ccode>gk_spring2017_titles(name, title)\
