y = S.customer_city\n  and S.ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["93456"]]}},{"id":"GK2.26","topic":"PE 3.8c join","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.8c\u003c/strong> — Tên mỗi branch có ít nhất một khách hàng có account ở đó và sống ở Harrison.\u003c/p>","hint":"","solution":"select distinct branch_name\nfrom account, depositor, customer\nwhere customer.ID = depositor.ID\n  and depositor.account_number = account.account_number\n  and customer_city = 'Harrison';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Brighton"],["Perryridge"]]}},{"id":"GK2.27","topic":"PE 3.9a join","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.9a\u003c/strong> (Employee database) — ID, tên và thành phố cư trú của mỗi nhân viên làm cho First Bank Corporation.\u003c/p>","hint":"","solution":"select e.ID, e.person_name, e.city\nfrom employee as e, works as w\nwhere w.company_name = 'First Bank Corporation' and w.ID = e.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10002","Bob Tran","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK2.28","topic":"PE 3.9b in","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.9b\u003c/strong> — ID, tên, thành phố của mỗi nhân viên làm cho First Bank Corporation \u003cstrong>và\u003c/strong> có lương > 10000.\u003c/p>","hint":"","solution":"select ID, person_name, city\nfrom employee\nwhere ID in (select ID from works\n             where company_name = 'First Bank Corporation' and salary > 10000);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","city"],"rows":[["10001","Alice Nguyen","Miami"],["10003","Carol Le","Boston"],["10004","David Pham","New York"]]}},{"id":"GK2.29","topic":"PE 3.9c not in","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9c\u003c/strong> — ID của mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho First Bank Corporation, kể cả người không có trong works.\u003c/p>","hint":"company_name \u003c> ... trên works sẽ bỏ sót người không có trong works.","solution":"select ID from employee\nwhere ID not in (select ID from works where company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10005"],["10006"],["10007"],["10008"],["10009"],["10010"],["10011"],["10012"],["10013"],["12345"]]}},{"id":"GK2.30","topic":"PE 3.9d > all","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9d\u003c/strong> — ID của mỗi nhân viên có lương cao hơn \u003cstrong>mọi\u003c/strong> nhân viên của Small Bank Corporation.\u003c/p>","hint":"","solution":"select ID from works\nwhere salary > all (select salary from works where company_name = 'Small Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10001"],["10003"],["10004"],["10007"],["10008"],["10009"],["10010"]]}},{"id":"GK2.31","topic":"PE 3.9e not exists except","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.9e\u003c/strong> — Một công ty có thể đặt ở nhiều thành phố (\u003ccode>company(company_name, city)\u003c/code>). Tên mỗi công ty đặt ở \u003cstrong>mọi\u003c/strong> thành phố mà Small Bank Corporation có mặt.\u003c/p>","hint":"","solution":"select distinct S.company_name\nfrom company as S\nwhere not exists ((select city from company where company_name = 'Small Bank Corporation')\n                  except\n                  (select city from company as T where S.company_name = T.company_name));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["Mega Corp"],["Small Bank Corporation"]]}},{"id":"GK2.32","topic":"PE 3.9f having >= all","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.9f\u003c/strong> — Tên công ty có \u003cstrong>nhiều nhân viên nhất\u003c/strong> (trả về tất cả nếu hoà).\u003c/p>","hint":"","solution":"select company_name\nfrom works\ngroup by company_name\nhaving count(distinct ID) >= all (select count(distinct ID) from works group by company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["First Bank Corporation"],["Mega Corp"]]}},{"id":"GK2.33","topic":"PE 3.9g having avg","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.9g\u003c/strong> — Tên mỗi công ty có lương trung bình của nhân viên \u003cstrong>cao hơn\u003c/strong> lương trung bình ở First Bank Corporation.\u003c/p>","hint":"","solution":"select company_name\nfrom works\ngroup by company_name\nhaving avg(salary) > (select avg(salary) from works where company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["company_name"],"rows":[["BigBank"]]}},{"id":"GK2.34","topic":"PE 3.10a update","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.10a\u003c/strong> — Nhân viên có ID \u003ccode>12345\u003c/code> nay sống ở Newtown.\u003c/p>","hint":"","solution":"update employee set city = 'Newtown' where ID = '12345';","check":"select ID, city from employee order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","city"],"rows":[["10001","Miami"],["10002","Miami"],["10003","Boston"],["10004","New York"],["10005","Miami"],["10006","Chicago"],["10007","Miami"],["10008","New York"],["10009","Chicago"],["10010","Miami"],["10011","Boston"],["10012","Chicago"],["10013","Boston"],["12345","Newtown"]]}},{"id":"GK2.35","topic":"PE 3.10b update case","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.10b\u003c/strong> — Tăng 10% lương cho mỗi \u003cstrong>manager\u003c/strong> (xuất hiện trong \u003ccode>manages.manager_id\u003c/code>) làm cho First Bank Corporation, trừ khi lương sau khi tăng vượt 100000 — khi đó chỉ tăng 3%. Viết \u003cstrong>một\u003c/strong> lệnh update dùng \u003ccode>case\u003c/code>.\u003c/p>","hint":"","solution":"update works as T\nset salary = T.salary * (case when T.salary * 1.1 > 100000 then 1.03 else 1.1 end)\nwhere T.ID in (select manager_id from manages)\n  and T.company_name = 'First Bank Corporation';","check":"select ID, salary from works order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","93500"],["10002","9500"],["10003","60000"],["10004","94760"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","58000"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}},{"id":"GK2.36","topic":"PE 3.10b two updates","level":3,"prompt":"\u003cp>\u003cstrong>PE 3.10b (hai lệnh)\u003c/strong> — Viết lại GK2.35 bằng \u003cstrong>hai\u003c/strong> lệnh update không dùng case, theo \u003cstrong>đúng thứ tự\u003c/strong> để không ai bị tăng hai lần. Kết quả phải giống GK2.35.\u003c/p>","hint":"Lệnh 3% (salary * 1.1 > 100000) chạy trước.","solution":"update works as T\nset salary = T.salary * 1.03\nwhere T.ID in (select manager_id from manages)\n  and T.salary * 1.1 > 100000\n  and T.company_name = 'First Bank Corporation';\nupdate works as T\nset salary = T.salary * 1.1\nwhere T.ID in (select manager_id from manages)\n  and T.salary * 1.1 \u003c= 100000\n  and T.company_name = 'First Bank Corporation';","check":"select ID, salary from works order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10001","93500"],["10002","9500"],["10003","60000"],["10004","94760"],["10005","45000"],["10006","52000"],["10007","120000"],["10008","105000"],["10009","58000"],["10010","61000"],["10011","40000"],["10013","47000"],["12345","50000"]]}}]},{"key":"gk3","store":"gk3","short":"GK3","label":"Ôn GK · Phần 3","navLabel":"GK3","kind":"Ôn tập","title":"Practice Exercises — Chapter 4","titleVi":"Practice Exercises Chương 4 (Intermediate SQL)","summary":"\u003ch3>Cách dùng phần này\u003c/h3>\n\u003cp>Toàn bộ Practice Exercises Chương 4 (4.1–4.13). Nhiều câu Chương 4 hỏi về \u003cstrong>trường hợp biên\u003c/strong> (section không có giảng viên, khoa không có giảng viên, giá trị null…) mà dữ liệu mẫu không có sẵn. Vì vậy một số bài yêu cầu bạn \u003cstrong>tạo view\u003c/strong> với tên cho trước; khi chấm, hệ thống \u003cstrong>chèn thêm dữ liệu biên\u003c/strong> rồi mới đọc view — câu sai (ví dụ dùng inner join, \u003ccode>count(*)\u003c/code>) sẽ lộ ra ngay.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Bài SQL\u003c/th>\u003cth>Tự luận\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4.1\u003c/td>\u003ctd>Lỗi natural join qua dept_name\u003c/td>\u003ctd>GK3.01\u003c/td>\u003ctd>Câu 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.2 a–d\u003c/td>\u003ctd>Outer join, scalar subquery, coalesce, đếm 0\u003c/td>\u003ctd>GK3.02–GK3.05\u003c/td>\u003ctd>Câu 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.3 a–b\u003c/td>\u003ctd>Viết outer join không dùng outer join\u003c/td>\u003ctd>GK3.06–GK3.07\u003c/td>\u003ctd>Câu 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.4 a–b\u003c/td>\u003ctd>Thứ tự left outer join và null\u003c/td>\u003ctd>GK3.08\u003c/td>\u003ctd>Câu 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.5 a–c\u003c/td>\u003ctd>Thiết kế dữ liệu test cho truy vấn\u003c/td>\u003ctd>GK3.09\u003c/td>\u003ctd>Câu 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.6\u003c/td>\u003ctd>View student_grades xử lý null\u003c/td>\u003ctd>GK3.10\u003c/td>\u003ctd>Câu 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.7\u003c/td>\u003ctd>DDL + referential integrity cho Employee database\u003c/td>\u003ctd>GK3.11\u003c/td>\u003ctd>Câu 7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.8 a–b\u003c/td>\u003ctd>Giảng viên dạy 2 phòng cùng time slot; assertion\u003c/td>\u003ctd>GK3.12\u003c/td>\u003ctd>Câu 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.9\u003c/td>\u003ctd>Foreign key tự tham chiếu + on delete cascade\u003c/td>\u003ctd>GK3.13\u003c/td>\u003ctd>Câu 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.10\u003c/td>\u003ctd>natural full outer join bằng \u003ccode>on\u003c/code> + coalesce\u003c/td>\u003ctd>GK3.14\u003c/td>\u003ctd>Câu 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.11\u003c/td>\u003ctd>Vì sao DB có nhiều loại quyền\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Câu 11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.12\u003c/td>\u003ctd>\u003ccode>granted by current_role\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Câu 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4.13\u003c/td>\u003ctd>Quyền trên view; insert qua view mà không thấy\u003c/td>\u003ctd>GK3.15–GK3.16\u003c/td>\u003ctd>Câu 13\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Outer join — cheat sheet\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Yêu cầu\u003c/th>\u003cth>Mẫu\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Đếm, hiện 0 cho nhóm rỗng\u003c/td>\u003ctd>\u003ccode>r left outer join s ... group by ... count(s.col)\u003c/code> — \u003cstrong>không\u003c/strong> \u003ccode>count(*)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đếm không dùng outer join\u003c/td>\u003ctd>scalar subquery \u003ccode>(select count(*) from s where s.k = r.k)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thay null bằng ký hiệu\u003c/td>\u003ctd>\u003ccode>coalesce(name, '-')\u003c/code> (Oracle: \u003ccode>decode(name, null, '-', name)\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⟕ s không dùng outer join\u003c/td>\u003ctd>\u003ccode>r ⋈ s union (r không khớp, null cho các cột của s)\u003c/code> với \u003ccode>not exists\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⟗ s\u003c/td>\u003ctd>r ⋈ s ∪ (r không khớp) ∪ (s không khớp)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>natural full outer join bằng \u003ccode>on\u003c/code>\u003c/td>\u003ctd>\u003ccode>coalesce(a.k, b.k) as k\u003c/code> cho cột chung\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Chọn cột để count:\u003c/strong> cột của bảng bên phải mà \u003cstrong>không\u003c/strong> có ở bảng bên trái (ví dụ \u003ccode>sec_id\u003c/code> của teaches) — cột chung như \u003ccode>ID\u003c/code> không bao giờ null trong natural left outer join.\u003c/p>\n\u003ch3>Ràng buộc & quyền\u003c/h3>\n\u003cul>\u003cli>Foreign key tự tham chiếu + \u003ccode>on delete cascade\u003c/code> → xoá \u003cstrong>dây chuyền\u003c/strong> toàn bộ cây cấp dưới (PE 4.9).\u003c/li>\u003cli>\u003ccode>create assertion\u003c/code> có trong chuẩn SQL nhưng \u003cstrong>không DBMS phổ biến nào hỗ trợ\u003c/strong> (PE 4.8b) → dùng trigger hoặc truy vấn kiểm tra.\u003c/li>\u003cli>Quyền trên view \u003cstrong>không\u003c/strong> cần quyền select trên bảng gốc → che giấu một phần dữ liệu (PE 4.13).\u003c/li>\u003cli>Insert qua view có thể tạo tuple \u003cstrong>không nhìn thấy\u003c/strong> qua view (không thoả where) — trừ khi \u003ccode>with check option\u003c/code>.\u003c/li>\u003cli>\u003ccode>granted by current_role\u003c/code>: quyền gắn với \u003cstrong>role\u003c/strong>, vẫn còn khi tài khoản người cấp bị xoá (PE 4.12).\u003c/li>\u003c/ul>\n\u003ch3>Bẫy & lỗi trong lời giải sách\u003c/h3>\n\u003cul>\u003cli>PE 4.1: \u003ccode>instructor natural join teaches natural join section natural join course\u003c/code> ghép thêm theo \u003cstrong>dept_name\u003c/strong> (instructor và course đều có) → mất các môn giảng viên dạy ngoài khoa mình.\u003c/li>\u003cli>PE 4.2a: dùng \u003ccode>count(*)\u003c/code> sẽ cho 1 thay vì 0.\u003c/li>\u003cli>PE 4.6: sách dùng \u003ccode>decode\u003c/code> (Oracle) → PostgreSQL dùng \u003ccode>case\u003c/code>.\u003c/li>\u003cli>PE 4.7: lời giải viết \u003ccode>manager_iid\u003c/code> — là lỗi gõ của \u003ccode>manager_id\u003c/code>.\u003c/li>\u003cli>PE 4.8a: \u003ccode>count(distinct building, room_number)\u003c/code> không hợp lệ trong PostgreSQL → \u003ccode>count(distinct (building, room_number))\u003c/code>. Ngoài ra lời giải group by cả \u003ccode>sec_id\u003c/code> — mỗi section chỉ có một phòng nên \u003cstrong>không bao giờ\u003c/strong> phát hiện được vi phạm; phải bỏ sec_id khỏi group by.\u003c/li>\u003c/ul>","quiz":[{"q":"PE 4.1 — Câu \u003ccode>select name, title from instructor natural join teaches natural join section natural join course where semester = 'Spring' and year = 2017\u003c/code> sai vì sao?","options":["Lỗi cú pháp","dept_name có ở cả instructor và course nên chỉ giữ môn giảng viên dạy trong khoa mình","Thiếu distinct","section không có cột year"],"answer":1,"explain":"Natural join so sánh mọi cột trùng tên, kể cả dept_name."},{"q":"PE 4.2a — Trong \u003ccode>select ID, count(sec_id) from instructor natural left outer join teaches group by ID\u003c/code>, vì sao không dùng count(*)?","options":["count(*) chậm hơn","count(*) đếm cả dòng có null → giảng viên không dạy gì ra 1","count(*) không dùng được với group by","Không khác nhau"],"answer":1,"explain":"Dòng do outer join thêm vào vẫn là một dòng; count(sec_id) bỏ qua null nên ra 0."},{"q":"PE 4.2a — Dùng cột nào trong count thì SAI?","options":["count(sec_id)","count(course_id)","count(ID)","count(semester)"],"answer":2,"explain":"ID là cột chung lấy từ instructor nên không bao giờ null."},{"q":"PE 4.2c — Hàm PostgreSQL thay cho \u003ccode>decode(name, null, '-', name)\u003c/code>?","options":["nvl(name)","coalesce(name, '-')","ifnull('-')","nullif(name, '-')"],"answer":1,"explain":"coalesce trả về đối số khác null đầu tiên."},{"q":"PE 4.3a — Phần \"không khớp\" khi viết student natural left outer join takes không dùng outer join là gì?","options":["select * from takes where ID not in (select ID from student)","select ID, name, dept_name, tot_cred, null, null, null, null, null from student S where not exists (select * from takes T where T.ID = S.ID)","select * from student natural join takes","select * from student, takes"],"answer":1,"explain":"Sinh viên không có dòng takes, các cột của takes điền null; union với natural join."},{"q":"PE 4.4 — r(A,B), s(B,C), t(B,D), mọi cột not null. Với r ⟕ (s ⟕ t), khẳng định nào đúng?","options":["C có thể null còn D khác null","Không thể có C null mà D khác null","D không bao giờ null","Kết quả luôn rỗng"],"answer":1,"explain":"s ⟕ t tính trước: mọi dòng có C khác null. Khi r không khớp, cả C và D cùng null."},{"q":"PE 4.5b — Vì sao dữ liệu test nên có tuple ở referenced relation không được tham chiếu (ví dụ instructor không dạy section nào)?","options":["Để test hiệu năng","Để phát hiện truy vấn dùng inner join thay vì outer join (mất dòng có count = 0)","Để vi phạm foreign key","Không cần thiết"],"answer":1,"explain":"Ví dụ PE 4.2a: thiếu tuple như vậy thì câu sai vẫn cho kết quả đúng."},{"q":"PE 4.6 — View student_grades nên trả về gì cho sinh viên chưa có môn nào có điểm?","options":["GPA = 0","GPA = null (tránh chia cho 0)","Không có dòng","Lỗi"],"answer":1,"explain":"credit_sum = 0 → chia cho null thay vì 0."},{"q":"PE 4.8b — \u003ccode>create assertion\u003c/code> trong PostgreSQL?","options":["Được hỗ trợ đầy đủ","Có trong chuẩn SQL nhưng không được hỗ trợ","Chỉ hỗ trợ trên view","Là tên khác của check"],"answer":1,"explain":"Không DBMS phổ biến nào hỗ trợ; thay bằng trigger."},{"q":"PE 4.9 — Bảng manager(employee_ID, manager_ID) với foreign key (manager_ID) references manager on delete cascade. Xoá một manager thì sao?","options":["Chỉ xoá dòng đó","Xoá dòng đó và toàn bộ cấp dưới trực tiếp lẫn gián tiếp","Bị từ chối","manager_ID của cấp dưới thành null"],"answer":1,"explain":"Xoá dây chuyền: cấp dưới trực tiếp bị xoá kéo theo cấp dưới của họ…"},{"q":"PE 4.10 — Khi viết a natural full outer join b bằng \u003ccode>on a.name = b.name and a.address = b.address\u003c/code>, làm sao để chỉ có một cột name?","options":["select a.name","select coalesce(a.name, b.name) as name","select distinct name","Không thể"],"answer":1,"explain":"a.name null với dòng chỉ có ở b và ngược lại; coalesce lấy giá trị khác null."},{"q":"PE 4.13 — User được grant select trên view v (định nghĩa từ r). User có cần select trên r không?","options":["Có","Không — cho phép chỉ lộ một phần của r","Chỉ khi v có where","Chỉ với materialized view"],"answer":1,"explain":"Đây chính là mục đích dùng view để phân quyền."},{"q":"PE 4.13 — Ví dụ insert qua view mà tuple không thấy trong \u003ccode>select * from v\u003c/code>?","options":["Tuple vi phạm primary key","Tuple hợp schema của v nhưng không thoả điều kiện where của v","Tuple có null","Không thể xảy ra"],"answer":1,"explain":"Ví dụ chèn giảng viên Biology qua view history_instructors (không có with check option)."},{"q":"PE 4.12 — Lợi ích của \u003ccode>granted by current_role\u003c/code>?","options":["Quyền mạnh hơn","Quyền vẫn còn khi tài khoản người cấp bị xoá","Không cần with grant option","Tự động revoke sau một thời gian"],"answer":1,"explain":"Grantor là role chứ không phải user cá nhân."}],"questions":[{"q":"\u003cstrong>PE 4.1\u003c/strong> — Truy vấn \u003ccode>select name, title from instructor natural join teaches natural join section natural join course where semester = 'Spring' and year = 2017\u003c/code> muốn liệt kê title của mọi course dạy ở Spring 2017 cùng tên instructor. Sai ở đâu?","answer":"\u003cp>Cú pháp đúng nhưng \u003cstrong>ý nghĩa sai\u003c/strong>: \u003ccode>dept_name\u003c/code> là attribute của cả \u003cstrong>course\u003c/strong> và \u003cstrong>instructor\u003c/strong>, nên natural join ghép thêm điều kiện instructor.dept_name = course.dept_name. Kết quả chỉ còn các trường hợp giảng viên dạy môn \u003cstrong>thuộc khoa của mình\u003c/strong>. Sửa: \u003ccode>instructor natural join teaches natural join section join course using (course_id)\u003c/code> (bài GK3.01).\u003c/p>"},{"q":"\u003cstrong>PE 4.2\u003c/strong> — Viết: (a) mỗi instructor và số section đã dạy, hiện 0 nếu chưa dạy — dùng outer join, không subquery; (b) như (a) nhưng dùng scalar subquery, không outer join; (c) mọi section Spring 2018 cùng ID, tên instructor (section có nhiều instructor xuất hiện nhiều lần, không có instructor thì tên là \"−\"); (d) mọi department và số instructor, kể cả khoa không có ai, không dùng subquery.","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- a\nselect ID, count(sec_id) as number_of_sections\nfrom instructor natural left outer join teaches\ngroup by ID;\n-- b\nselect ID, (select count(*) from teaches T where T.ID = I.ID) as number_of_sections\nfrom instructor I;\n-- c\nselect course_id, sec_id, ID, coalesce(name, '-') as name\nfrom (section natural left outer join teaches) natural left outer join instructor\nwhere semester = 'Spring' and year = 2018;\n-- d\nselect dept_name, count(ID)\nfrom department natural left outer join instructor\ngroup by dept_name;\u003c/code>\u003c/pre>\n\u003cp>(a) không được dùng \u003ccode>count(*)\u003c/code> vì nó đếm cả dòng null; có thể dùng bất kỳ cột nào của teaches \u003cstrong>không\u003c/strong> có trong instructor. (c) sách dùng \u003ccode>decode\u003c/code> (Oracle); PostgreSQL dùng \u003ccode>coalesce\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 4.3\u003c/strong> — Viết lại không dùng outer join: (a) \u003ccode>select * from student natural left outer join takes\u003c/code>; (b) \u003ccode>select * from student natural full outer join takes\u003c/code>.","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- a\nselect * from student natural join takes\nunion\nselect ID, name, dept_name, tot_cred, null, null, null, null, null\nfrom student S1\nwhere not exists (select ID from takes T1 where T1.ID = S1.ID);\n\n-- b: thêm phần takes không khớp\n(select * from student natural join takes)\nunion\n(select ID, name, dept_name, tot_cred, null, null, null, null, null\n from student S1 where not exists (select ID from takes T1 where T1.ID = S1.ID))\nunion\n(select ID, null, null, null, course_id, sec_id, semester, year, grade\n from takes T1 where not exists (select ID from student S1 where T1.ID = S1.ID));\u003c/code>\u003c/pre>\n\u003cp>Trong PostgreSQL, \u003ccode>null\u003c/code> trong union được suy ra kiểu từ nhánh đầu; nếu báo lỗi kiểu hãy ép \u003ccode>null::varchar\u003c/code>. Vì takes.ID có foreign key tới student, phần thứ ba của (b) luôn rỗng trên dữ liệu hợp lệ.\u003c/p>"},{"q":"\u003cstrong>PE 4.4\u003c/strong> — r(A, B), s(B, C), t(B, D), mọi attribute not null. (a) Cho instance để trong (r natural left outer join s) natural left outer join t, C null nhưng D khác null. (b) Có instance nào để r natural left outer join (s natural left outer join t) có C null mà D khác null không?","answer":"\u003cp>a. r = {(a, b)}, s = {(b1, c1)}, t = {(b, d)}. r ⟕ s = (a, b, null) vì không có s với B = b; rồi ⟕ t khớp B = b → \u003cstrong>(a, b, null, d)\u003c/strong>.\u003c/p>\n\u003cp>b. \u003cstrong>Không.\u003c/strong> s ⟕ t được tính trước; s không có null nên mọi dòng của nó có C khác null (D có thể null). Khi ghép r ⟕ (…): dòng r khớp thì C lấy từ s (khác null); dòng r không khớp thì \u003cstrong>cả C lẫn D\u003c/strong> đều null. Vậy không thể có C null mà D khác null. (Bài GK3.08.)\u003c/p>"},{"q":"\u003cstrong>PE 4.5\u003c/strong> — Kiểm thử truy vấn SQL: (a) cho dataset bắt được lỗi natural join instructor–teaches–course của Section 4.1.1; (b) vì sao dữ liệu test cần tuple ở referenced relation không có tuple tham chiếu tới nó; (c) vì sao cần tuple có foreign key \u003cstrong>null\u003c/strong> (nếu cột cho phép)?","answer":"\u003cp>a. Một giảng viên Physics dạy môn Elec. Eng.:\u003c/p>\n\u003cul>\u003cli>instructor = {(12345, 'Gauss', 'Physics', 10000)}\u003c/li>\u003cli>teaches = {(12345, 'EE321', 1, 'Spring', 2017)}\u003c/li>\u003cli>course = {('EE321', 'Magnetism', 'Elec. Eng.', 6)}\u003c/li>\u003c/ul>\n\u003cp>Natural join ba bảng ra \u003cstrong>rỗng\u003c/strong> (dept_name khác nhau) trong khi kết quả đúng có một dòng. (Bài GK3.09.)\u003c/p>\n\u003cp>b. Ví dụ PE 4.2a: giảng viên \u003cstrong>chưa dạy section nào\u003c/strong> phải hiện số section 0. Nếu mọi instructor đều có trong teaches, câu sai dùng inner join (hoặc count(*)) vẫn cho kết quả đúng → không phát hiện được lỗi.\u003c/p>\n\u003cp>c. Ví dụ \u003ccode>select * from teaches natural join instructor\u003c/code>: nếu teaches.ID được phép null và có tuple như vậy thì join làm \u003cstrong>mất\u003c/strong> các section đó. Nếu chỉ vì teaches.ID là foreign key mà ta không tạo tuple null, lỗi này không bao giờ lộ ra khi test.\u003c/p>"},{"q":"\u003cstrong>PE 4.6\u003c/strong> — Định nghĩa view student_grades(ID, GPA) dựa trên PE 3.2, xử lý đúng grade null.","answer":"\u003cp>Không cộng credits của môn có grade null; sinh viên chưa có môn nào (tổng credits = 0) phải có GPA \u003cstrong>null\u003c/strong> chứ không chia cho 0.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create view student_grades (ID, GPA) as\nselect ID, credit_points / (case when credit_sum = 0 then null else credit_sum end)\nfrom ((select ID,\n              sum(case when grade is null then 0 else credits end) as credit_sum,\n              sum(case when grade is null then 0 else credits * points end) as credit_points\n       from (takes natural join course) natural left outer join grade_points\n       group by ID)\n      union\n      select ID, null, null from student where ID not in (select ID from takes)) as t;\u003c/code>\u003c/pre>\n\u003cp>Sách viết bằng \u003ccode>decode\u003c/code> (Oracle); bản trên dùng \u003ccode>case\u003c/code> cho PostgreSQL (và subquery trong from phải có alias). Có thể thay phần union bằng \u003ccode>student natural left outer join ...\u003c/code>. (Bài GK3.10.)\u003c/p>"},{"q":"\u003cstrong>PE 4.7\u003c/strong> — Viết DDL cho Employee database (employee, works, company, manages), xác định và khai báo các ràng buộc referential integrity.","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table employee\n  (ID numeric(6,0), person_name char(20), street char(30), city char(30),\n   primary key (ID));\ncreate table company\n  (company_name char(15), city char(30),\n   primary key (company_name));\ncreate table works\n  (ID numeric(6,0), company_name char(15), salary integer,\n   primary key (ID),\n   foreign key (ID) references employee,\n   foreign key (company_name) references company);\ncreate table manages\n  (ID numeric(6,0), manager_id numeric(6,0),\n   primary key (ID),\n   foreign key (ID) references employee,\n   foreign key (manager_id) references employee (ID));\u003c/code>\u003c/pre>\n\u003cp>Bốn foreign key: works.ID → employee, works.company_name → company, manages.ID → employee, manages.manager_id → employee. Lời giải sách viết \u003ccode>manager_iid\u003c/code> (lỗi gõ). Kiểu dữ liệu và not null có thể chọn khác. Lưu ý company phải được tạo \u003cstrong>trước\u003c/strong> works. (Bài GK3.11.)\u003c/p>"},{"q":"\u003cstrong>PE 4.8\u003c/strong> — Ràng buộc: một instructor không thể dạy các section ở \u003cstrong>hai phòng khác nhau\u003c/strong> trong cùng semester, cùng time slot. (a) Viết truy vấn trả về các (instructor, section) vi phạm. (b) Viết assertion ép ràng buộc này.","answer":"\u003cp>a. Lời giải sách:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select ID, name, sec_id, semester, year, time_slot_id, count(distinct building, room_number)\nfrom instructor natural join teaches natural join section\ngroup by (ID, name, sec_id, semester, year, time_slot_id)\nhaving count(building, room_number) &gt; 1\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>distinct\u003c/code> cần thiết để hai section dạy \u003cstrong>cùng phòng\u003c/strong> cùng lúc (ghép lớp) không bị báo vi phạm. Tuy nhiên có hai vấn đề: PostgreSQL không cho \u003ccode>count(distinct a, b)\u003c/code> → viết \u003ccode>count(distinct (building, room_number))\u003c/code>; và group by \u003cstrong>sec_id\u003c/strong> khiến mỗi nhóm chỉ là một section (một phòng) nên không bao giờ > 1. Bản đúng:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select ID, name, semester, year, time_slot_id, count(distinct (building, room_number)) as num_rooms\nfrom instructor natural join teaches natural join section\ngroup by ID, name, semester, year, time_slot_id\nhaving count(distinct (building, room_number)) &gt; 1;\u003c/code>\u003c/pre>\n\u003cp>b. \u003ccode>create assertion check not exists (&lt;truy vấn trên&gt;)\u003c/code>. Assertion có trong chuẩn SQL nhưng \u003cstrong>không\u003c/strong> DBMS phổ biến nào hỗ trợ → trong thực tế dùng trigger trên teaches/section. (Bài GK3.12.)\u003c/p>"},{"q":"\u003cstrong>PE 4.9\u003c/strong> — Cho bảng manager(employee_ID, manager_ID) với foreign key (manager_ID) references manager(employee_ID) on delete cascade. Giải thích chính xác điều gì xảy ra khi xoá một tuple.","answer":"\u003cp>\u003cstrong>Toàn bộ nhân viên dưới quyền manager đó, ở mọi cấp, đều bị xoá.\u003c/strong> Xoá tuple ban đầu kích hoạt xoá các tuple của nhân viên \u003cstrong>trực tiếp\u003c/strong> (manager_ID = người bị xoá); các lần xoá này lại kích hoạt xoá nhân viên cấp hai, và cứ thế cho tới khi hết nhân viên trực tiếp lẫn gián tiếp. (Bài GK3.13.)\u003c/p>"},{"q":"\u003cstrong>PE 4.10\u003c/strong> — Cho a(name, address, title) và b(name, address, salary). Viết a natural full outer join b bằng full outer join với điều kiện on và coalesce, không có hai bản sao name/address, đúng cả khi name/address có null.","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select coalesce(a.name, b.name) as name,\n       coalesce(a.address, b.address) as address,\n       a.title, b.salary\nfrom a full outer join b on a.name = b.name and a.address = b.address;\u003c/code>\u003c/pre>\n\u003cp>Dòng có null ở name hoặc address không bao giờ khớp (null = … là unknown), nên xuất hiện như dòng chỉ có ở một bên — giống hệt natural full outer join. coalesce lấy giá trị từ bên có dữ liệu. (Bài GK3.14 dùng emp_title, emp_salary.)\u003c/p>"},{"q":"\u003cstrong>PE 4.11\u003c/strong> — Hệ điều hành thường chỉ có quyền read và write trên file. Vì sao database có nhiều loại quyền?","answer":"\u003cp>Có nhiều lý do, ví dụ:\u003c/p>\n\u003cul>\u003cli>Cho user chỉ \u003cstrong>thêm\u003c/strong> dữ liệu mới (insert) mà không sửa dữ liệu cũ.\u003c/li>\u003cli>Cho user truy cập relation nhưng \u003cstrong>không đổi schema\u003c/strong> (alter, drop).\u003c/li>\u003cli>Hạn chế những thao tác không hẳn là truy cập dữ liệu nhưng ảnh hưởng tài nguyên, như \u003cstrong>tạo index\u003c/strong>.\u003c/li>\u003cli>Phân quyền chi tiết tới \u003cstrong>cột\u003c/strong> (update(grade)), quyền \u003cstrong>references\u003c/strong> (tạo foreign key), quyền trên \u003cstrong>view\u003c/strong>…\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 4.12\u003c/strong> — Khi grant select cho user khác, vì sao nên (hoặc không nên) thêm \u003ccode>granted by current_role\u003c/code>?","answer":"\u003cp>Cả hai cách cho cùng quyền \u003cstrong>tại thời điểm\u003c/strong> grant, nhưng hiệu ứng lâu dài khác nhau. Nếu grant dựa trên \u003cstrong>role\u003c/strong>, quyền vẫn còn hiệu lực ngay cả khi user thực hiện grant rời tổ chức và tài khoản bị xoá (khi xoá user, các quyền do user đó cấp sẽ bị thu hồi dây chuyền). Tốt hay xấu tuỳ tình huống, nhưng thường grant qua role phù hợp hơn với một tổ chức vận hành tốt.\u003c/p>"},{"q":"\u003cstrong>PE 4.13\u003c/strong> — View v chỉ tham chiếu relation r. (1) User được grant select trên v có cần select trên r? (2) User được grant update trên v có cần update trên r? (3) Cho ví dụ insert vào v một tuple t không thấy trong \u003ccode>select * from v\u003c/code>.","answer":"\u003col>\u003cli>\u003cstrong>Không.\u003c/strong> Nhờ vậy có thể cho user truy cập \u003cstrong>một phần\u003c/strong> của r (bài GK3.15).\u003c/li>\u003cli>Theo sách: \u003cstrong>có\u003c/strong> — update hợp lệ qua v phải cập nhật r thì mới được lưu. \u003cem>(Ghi chú PostgreSQL: view được thực thi với quyền của \u003cstrong>chủ view\u003c/strong>, nên user chỉ cần quyền update trên view; người tạo view phải có quyền trên r.)\u003c/em>\u003c/li>\u003cli>Bất kỳ tuple nào hợp schema của v nhưng \u003cstrong>không thoả where\u003c/strong> của v. Ví dụ view history_instructors = instructor của khoa History (không có \u003ccode>with check option\u003c/code>): insert ('25566', 'Brown', 'Biology', 100000) qua view thành công, tuple vào instructor nhưng không hiện trong view (bài GK3.16).\u003c/li>\u003c/ol>"}],"exercises":[{"id":"GK3.01","topic":"PE 4.1 natural join trap","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.1\u003c/strong> — Tạo view \u003ccode>gk_spring2017_titles(name, title)\u003c/code>: tên instructor và title của mỗi course họ dạy ở Spring 2017, \u003cstrong>sửa lỗi\u003c/strong> natural join của sách. Khi chấm, hệ thống cho Einstein (Physics) dạy thêm CS-190 section 1 Spring 2017 rồi đọc view.\u003c/p>","hint":"join course using (course_id) thay vì natural join course.","solution":"create view gk_spring2017_titles (name, title) as\nselect name, title\nfrom instructor natural join teaches natural join section join course using (course_id)\nwhere semester = 'Spring' and year = 2017;","check":"insert into teaches values ('22222', 'CS-190', '1', 'Spring', 2017);\nselect * from gk_spring2017_titles;","ordered":false,"fresh":false,"expected":{"fields":["name","title"],"rows":[["Einstein","Game Design"],["Brandt","Game Design"],["Brandt","Game Design"],["Kim","Intro. to Digital Systems"]]}},{"id":"GK3.02","topic":"PE 4.2a left outer join","level":1,"prompt":"\u003cp>\u003cstrong>PE 4.2a\u003c/strong> — ID của mỗi instructor và số section đã dạy (0 nếu chưa dạy). Dùng outer join, không dùng subquery.\u003c/p>","hint":"","solution":"select ID, count(sec_id) as number_of_sections\nfrom instructor natural left outer join teaches\ngroup by ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","number_of_sections"],"rows":[["83821","3"],["76543","0"],["33456","0"],["58583","0"],["22222","1"],["76766","2"],["12121","1"],["98345","1"],["15151","1"],["32343","1"],["10101","3"],["45565","2"]]}},{"id":"GK3.03","topic":"PE 4.2b scalar subquery","level":1,"prompt":"\u003cp>\u003cstrong>PE 4.2b\u003c/strong> — Như PE 4.2a nhưng dùng \u003cstrong>scalar subquery\u003c/strong>, không dùng outer join.\u003c/p>","hint":"","solution":"select ID, (select count(*) from teaches T where T.ID = I.ID) as number_of_sections\nfrom instructor I;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","number_of_sections"],"rows":[["10101","3"],["12121","1"],["15151","1"],["22222","1"],["32343","1"],["33456","0"],["45565","2"],["58583","0"],["76543","0"],["76766","2"],["83821","3"],["98345","1"]]}},{"id":"GK3.04","topic":"PE 4.2c coalesce","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.2c\u003c/strong> — Tạo view \u003ccode>gk_spring2018_sections(course_id, sec_id, ID, name)\u003c/code>: mọi section mở ở Spring 2018 cùng ID và tên instructor; section nhiều instructor xuất hiện nhiều lần; section \u003cstrong>không có instructor\u003c/strong> vẫn xuất hiện với name = \u003ccode>-\u003c/code>. Khi chấm, hệ thống thêm một section Spring 2018 chưa có ai dạy.\u003c/p>","hint":"(section natural left outer join teaches) natural left outer join instructor; coalesce(name, '-').","solution":"create view gk_spring2018_sections (course_id, sec_id, ID, name) as\nselect course_id, sec_id, ID, coalesce(name, '-')\nfrom (section natural left outer join teaches) natural left outer join instructor\nwhere semester = 'Spring' and year = 2018;","check":"insert into section values ('BIO-399', '1', 'Spring', 2018, 'Watson', '100', 'E');\nselect * from gk_spring2018_sections;","ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","id","name"],"rows":[["CS-101","1","45565","Katz"],["CS-315","1","10101","Srinivasan"],["CS-319","1","45565","Katz"],["CS-319","2","83821","Brandt"],["FIN-201","1","12121","Wu"],["HIS-351","1","32343","El Said"],["MU-199","1","15151","Mozart"],["BIO-399","1",null,"-"]]}},{"id":"GK3.05","topic":"PE 4.2d count zero","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.2d\u003c/strong> — Tạo view \u003ccode>gk_dept_instructors(dept_name, num_instructors)\u003c/code>: mọi department với tổng số instructor, khoa không có ai phải hiện 0. Không dùng subquery. Khi chấm, hệ thống thêm khoa \u003ccode>Statistics\u003c/code> chưa có instructor.\u003c/p>","hint":"","solution":"create view gk_dept_instructors (dept_name, num_instructors) as\nselect dept_name, count(ID)\nfrom department natural left outer join instructor\ngroup by dept_name;","check":"insert into department values ('Statistics', 'Taylor', 60000);\nselect * from gk_dept_instructors;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","num_instructors"],"rows":[["Finance","2"],["Physics","2"],["Statistics","0"],["Comp. Sci.","3"],["History","2"],["Music","1"],["Biology","1"],["Elec. Eng.","1"]]}},{"id":"GK3.06","topic":"PE 4.3a left join rewrite","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.3a\u003c/strong> — Viết \u003ccode>select * from student natural left outer join takes\u003c/code> \u003cstrong>không dùng outer join\u003c/strong> (natural join + union + not exists).\u003c/p>","hint":"","solution":"select * from student natural join takes\nunion\nselect ID, name, dept_name, tot_cred, null, null, null, null, null\nfrom student S1\nwhere not exists (select ID from takes T1 where T1.ID = S1.ID);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","course_id","sec_id","semester","year","grade"],"rows":[["76543","Brown","Comp. Sci.","58","CS-101","1","Fall","2017","A"],["12345","Shankar","Comp. Sci.","32","CS-315","1","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-347","1","Fall","2017","A"],["55739","Sanchez","Music","38","MU-199","1","Spring","2018","A-"],["44553","Peltier","Physics","56","PHY-101","1","Fall","2017","B-"],["19991","Brandt","History","80","HIS-351","1","Spring","2018","B"],["76653","Aoi","Elec. Eng.","60","EE-181","1","Spring","2017","C"],["00128","Zhang","Comp. Sci.","102","CS-101","1","Fall","2017","A"],["76543","Brown","Comp. Sci.","58","CS-319","2","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-190","2","Spring","2017","A"],["23121","Chavez","Finance","110","FIN-201","1","Spring","2018","C+"],["12345","Shankar","Comp. Sci.","32","CS-101","1","Fall","2017","C"],["98765","Bourikas","Elec. Eng.","98","CS-101","1","Fall","2017","C-"],["54321","Williams","Comp. Sci.","54","CS-101","1","Fall","2017","A-"],["70557","Snow","Physics","0",null,null,null,null,null],["45678","Levy","Physics","46","CS-101","1","Fall","2017","F"],["45678","Levy","Physics","46","CS-319","1","Spring","2018","B"],["98765","Bourikas","Elec. Eng.","98","CS-315","1","Spring","2018","B"],["98988","Tanaka","Biology","120","BIO-101","1","Summer","2017","A"],["98988","Tanaka","Biology","120","BIO-301","1","Summer","2018",null],["45678","Levy","Physics","46","CS-101","1","Spring","2018","B+"],["00128","Zhang","Comp. Sci.","102","CS-347","1","Fall","2017","A-"],["54321","Williams","Comp. Sci.","54","CS-190","2","Spring","2017","B+"]]}},{"id":"GK3.07","topic":"PE 4.3b full join rewrite","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.3b\u003c/strong> — Viết \u003ccode>select * from student natural full outer join takes\u003c/code> \u003cstrong>không dùng outer join\u003c/strong>.\u003c/p>","hint":"Thêm nhánh thứ ba cho takes không khớp student (trên dữ liệu hợp lệ nhánh này rỗng vì foreign key).","solution":"(select * from student natural join takes)\nunion\n(select ID, name, dept_name, tot_cred, null, null, null, null, null\n from student S1\n where not exists (select ID from takes T1 where T1.ID = S1.ID))\nunion\n(select ID, null, null, null, course_id, sec_id, semester, year, grade\n from takes T1\n where not exists (select ID from student S1 where T1.ID = S1.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","course_id","sec_id","semester","year","grade"],"rows":[["76543","Brown","Comp. Sci.","58","CS-101","1","Fall","2017","A"],["12345","Shankar","Comp. Sci.","32","CS-315","1","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-347","1","Fall","2017","A"],["55739","Sanchez","Music","38","MU-199","1","Spring","2018","A-"],["44553","Peltier","Physics","56","PHY-101","1","Fall","2017","B-"],["19991","Brandt","History","80","HIS-351","1","Spring","2018","B"],["76653","Aoi","Elec. Eng.","60","EE-181","1","Spring","2017","C"],["00128","Zhang","Comp. Sci.","102","CS-101","1","Fall","2017","A"],["76543","Brown","Comp. Sci.","58","CS-319","2","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-190","2","Spring","2017","A"],["23121","Chavez","Finance","110","FIN-201","1","Spring","2018","C+"],["12345","Shankar","Comp. Sci.","32","CS-101","1","Fall","2017","C"],["98765","Bourikas","Elec. Eng.","98","CS-101","1","Fall","2017","C-"],["54321","Williams","Comp. Sci.","54","CS-101","1","Fall","2017","A-"],["70557","Snow","Physics","0",null,null,null,null,null],["45678","Levy","Physics","46","CS-101","1","Fall","2017","F"],["45678","Levy","Physics","46","CS-319","1","Spring","2018","B"],["98765","Bourikas","Elec. Eng.","98","CS-315","1","Spring","2018","B"],["98988","Tanaka","Biology","120","BIO-101","1","Summer","2017","A"],["98988","Tanaka","Biology","120","BIO-301","1","Summer","2018",null],["45678","Levy","Physics","46","CS-101","1","Spring","2018","B+"],["00128","Zhang","Comp. Sci.","102","CS-347","1","Fall","2017","A-"],["54321","Williams","Comp. Sci.","54","CS-190","2","Spring","2017","B+"]]}},{"id":"GK3.08","topic":"PE 4.4 outer join order","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.4\u003c/strong> — Tạo \u003ccode>gk_r(a, b)\u003c/code>, \u003ccode>gk_s(b, c)\u003c/code>, \u003ccode>gk_t(b, d)\u003c/code> (mọi cột \u003ccode>not null\u003c/code>) và chèn dữ liệu sao cho trong \u003ccode>(gk_r natural left outer join gk_s) natural left outer join gk_t\u003c/code> có dòng với \u003cstrong>c null nhưng d khác null\u003c/strong>. Hệ thống kiểm tra điều đó, và kiểm tra rằng với \u003ccode>gk_r natural left outer join (gk_s natural left outer join gk_t)\u003c/code> thì không có dòng như vậy (PE 4.4b).\u003c/p>","hint":"r = {(a, b)}, s = {(b1, c1)}, t = {(b, d)}.","solution":"create table gk_r (a varchar(5) not null, b varchar(5) not null);\ncreate table gk_s (b varchar(5) not null, c varchar(5) not null);\ncreate table gk_t (b varchar(5) not null, d varchar(5) not null);\ninsert into gk_r values ('a', 'b');\ninsert into gk_s values ('b1', 'c1');\ninsert into gk_t values ('b', 'd');","check":"select\n  (select count(*) > 0 from ((gk_r natural left outer join gk_s) natural left outer join gk_t) x\n   where x.c is null and x.d is not null) as case_a_c_null_d_not_null,\n  (select count(*) > 0 from (gk_r natural left outer join (gk_s natural left outer join gk_t)) y\n   where y.c is null and y.d is not null) as case_b_c_null_d_not_null,\n  (select count(*) from information_schema.columns\n   where table_name in ('gk_r', 'gk_s', 'gk_t') and is_nullable = 'NO') as not_null_columns;","ordered":false,"fresh":false,"expected":{"fields":["case_a_c_null_d_not_null","case_b_c_null_d_not_null","not_null_columns"],"rows":[["true","false","6"]]}},{"id":"GK3.09","topic":"PE 4.5a test data","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.5a\u003c/strong> — Tạo bộ dữ liệu test \u003cstrong>bắt được\u003c/strong> lỗi natural join của Section 4.1.1: các bảng \u003ccode>gk_instructor(ID, name, dept_name, salary)\u003c/code>, \u003ccode>gk_teaches(ID, course_id, sec_id, semester, year)\u003c/code>, \u003ccode>gk_course(course_id, title, dept_name, credits)\u003c/code> sao cho \u003ccode>gk_instructor natural join gk_teaches natural join gk_course\u003c/code> có \u003cstrong>ít dòng hơn\u003c/strong> \u003ccode>gk_instructor natural join gk_teaches join gk_course using (course_id)\u003c/code>.\u003c/p>","hint":"Một giảng viên Physics dạy môn Elec. Eng.","solution":"create table gk_instructor (ID varchar(5), name varchar(20), dept_name varchar(20), salary numeric(8,2));\ncreate table gk_teaches (ID varchar(5), course_id varchar(8), sec_id varchar(8), semester varchar(6), year numeric(4,0));\ncreate table gk_course (course_id varchar(8), title varchar(50), dept_name varchar(20), credits numeric(2,0));\ninsert into gk_instructor values ('12345', 'Gauss', 'Physics', 10000);\ninsert into gk_teaches values ('12345', 'EE321', '1', 'Spring', 2017);\ninsert into gk_course values ('EE321', 'Magnetism', 'Elec. Eng.', 6);","check":"select (select count(*) from gk_instructor natural join gk_teaches natural join gk_course)\n     \u003c (select count(*) from gk_instructor natural join gk_teaches join gk_course using (course_id)) as test_catches_bug;","ordered":false,"fresh":false,"expected":{"fields":["test_catches_bug"],"rows":[["true"]]}},{"id":"GK3.10","topic":"PE 4.6 view with nulls","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.6\u003c/strong> — Tạo view \u003ccode>gk_student_grades(ID, GPA)\u003c/code> cho \u003cstrong>mọi\u003c/strong> sinh viên: môn có grade null không tính vào cả tử số lẫn mẫu số; sinh viên chưa có môn nào có điểm (hoặc chưa học môn nào) có GPA = null. Dùng \u003ccode>case\u003c/code> thay cho \u003ccode>decode\u003c/code> của sách.\u003c/p>","hint":"","solution":"create view gk_student_grades (ID, GPA) as\nselect ID, credit_points / (case when credit_sum = 0 then null else credit_sum end)\nfrom ((select ID,\n              sum(case when grade is null then 0 else credits end) as credit_sum,\n              sum(case when grade is null then 0 else credits * points end) as credit_points\n       from (takes natural join course) natural left outer join grade_points\n       group by ID)\n      union\n      select ID, null, null from student where ID not in (select ID from takes)) as t;","check":"select ID, round(GPA, 4) from gk_student_grades;","ordered":false,"fresh":false,"expected":{"fields":["id","round"],"rows":[["76543","4"],["55739","3.7"],["00128","3.8714"],["76653","2"],["45678","2.0182"],["70557",null],["12345","3.4286"],["54321","3.5"],["44553","2.7"],["98765","2.2571"],["23121","2.3"],["19991","3"],["98988","4"]]}},{"id":"GK3.11","topic":"PE 4.7 DDL foreign keys","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.7\u003c/strong> — Viết DDL cho Employee database với tên \u003ccode>gk_employee(ID, person_name, street, city)\u003c/code>, \u003ccode>gk_company(company_name, city)\u003c/code>, \u003ccode>gk_works(ID, company_name, salary)\u003c/code>, \u003ccode>gk_manages(ID, manager_id)\u003c/code>: primary key như PE 2.1 (gk_manages: ID) và \u003cstrong>đủ bốn foreign key\u003c/strong>.\u003c/p>","hint":"works.ID, works.company_name, manages.ID, manages.manager_id. Tạo gk_company trước gk_works.","solution":"create table gk_employee (ID numeric(6,0), person_name char(20), street char(30), city char(30), primary key (ID));\ncreate table gk_company (company_name char(15), city char(30), primary key (company_name));\ncreate table gk_works (ID numeric(6,0), company_name char(15), salary integer,\n  primary key (ID),\n  foreign key (ID) references gk_employee,\n  foreign key (company_name) references gk_company);\ncreate table gk_manages (ID numeric(6,0), manager_id numeric(6,0),\n  primary key (ID),\n  foreign key (ID) references gk_employee,\n  foreign key (manager_id) references gk_employee (ID));","check":"select c.conrelid::regclass::text as table_name,\n       case c.contype when 'p' then 'primary key' else 'foreign key' end as kind,\n       a.attname as column_name,\n       coalesce(c.confrelid::regclass::text, '') as referenced_table\nfrom pg_constraint c\njoin pg_attribute a on a.attrelid = c.conrelid and a.attnum = any (c.conkey)\nwhere c.contype in ('p', 'f')\n  and c.conrelid::regclass::text in ('gk_employee', 'gk_company', 'gk_works', 'gk_manages')\norder by 1, 2, 3;","ordered":false,"fresh":false,"expected":{"fields":["table_name","kind","column_name","referenced_table"],"rows":[["gk_company","primary key","company_name","-"],["gk_employee","primary key","id","-"],["gk_manages","foreign key","id","gk_employee"],["gk_manages","foreign key","manager_id","gk_employee"],["gk_manages","primary key","id","-"],["gk_works","foreign key","company_name","gk_company"],["gk_works","foreign key","id","gk_employee"],["gk_works","primary key","id","-"]]}},{"id":"GK3.12","topic":"PE 4.8a constraint query","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.8a\u003c/strong> — Tạo view \u003ccode>gk_room_conflicts(ID, name, semester, year, time_slot_id, num_rooms)\u003c/code>: các instructor dạy section ở \u003cstrong>nhiều hơn một phòng\u003c/strong> trong cùng semester, year và time slot. (Sửa hai lỗi của lời giải sách: bỏ sec_id khỏi group by; viết \u003ccode>count(distinct (building, room_number))\u003c/code>.) Khi chấm, hệ thống cho Katz dạy thêm một section ở phòng khác cùng time slot F, Spring 2018.\u003c/p>","hint":"","solution":"create view gk_room_conflicts (ID, name, semester, year, time_slot_id, num_rooms) as\nselect ID, name, semester, year, time_slot_id, count(distinct (building, room_number))\nfrom instructor natural join teaches natural join section\ngroup by ID, name, semester, year, time_slot_id\nhaving count(distinct (building, room_number)) > 1;","check":"insert into section values ('CS-315', '2', 'Spring', 2018, 'Watson', '120', 'F');\ninsert into teaches values ('45565', 'CS-315', '2', 'Spring', 2018);\nselect * from gk_room_conflicts;","ordered":false,"fresh":false,"expected":{"fields":["id","name","semester","year","time_slot_id","num_rooms"],"rows":[["45565","Katz","Spring","2018","F","2"]]}},{"id":"GK3.13","topic":"PE 4.9 cascade chain","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.9\u003c/strong> — Tạo \u003ccode>gk_manager(employee_id varchar(20) primary key, manager_id varchar(20))\u003c/code> với foreign key (manager_id) tham chiếu \u003ccode>gk_manager(employee_id)\u003c/code> \u003cstrong>on delete cascade\u003c/strong>. Chèn: (Alice, null), (Bob, Alice), (Carol, Alice), (Dave, Bob), (Eve, Dave), (Frank, null), (Grace, Frank). Sau đó xoá \u003cstrong>Bob\u003c/strong> và trả về các dòng còn lại.\u003c/p>","hint":"","solution":"create table gk_manager (\n  employee_id varchar(20) primary key,\n  manager_id  varchar(20),\n  foreign key (manager_id) references gk_manager (employee_id) on delete cascade);\ninsert into gk_manager values ('Alice', null), ('Bob', 'Alice'), ('Carol', 'Alice'),\n  ('Dave', 'Bob'), ('Eve', 'Dave'), ('Frank', null), ('Grace', 'Frank');\ndelete from gk_manager where employee_id = 'Bob';\nselect * from gk_manager;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["employee_id","manager_id"],"rows":[["Alice",null],["Carol","Alice"],["Frank",null],["Grace","Frank"]]}},{"id":"GK3.14","topic":"PE 4.10 full outer join on","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.10\u003c/strong> — Với \u003ccode>emp_title(name, address, title)\u003c/code> và \u003ccode>emp_salary(name, address, salary)\u003c/code> (có null ở name/address), viết tương đương \u003ccode>emp_title natural full outer join emp_salary\u003c/code> bằng \u003cstrong>full outer join ... on\u003c/strong> và \u003cstrong>coalesce\u003c/strong>: cột name, address, title, salary (mỗi cột chung chỉ một bản).\u003c/p>","hint":"","solution":"select coalesce(a.name, b.name) as name,\n       coalesce(a.address, b.address) as address,\n       a.title, b.salary\nfrom emp_title as a full outer join emp_salary as b\n  on a.name = b.name and a.address = b.address;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","address","title","salary"],"rows":[["An","Hanoi","Engineer","70000"],["Binh","Hue","Manager",null],["Binh","Saigon",null,"90000"],["Dung",null,null,"20000"],["Chi","Danang","Analyst",null],["Dung",null,"Intern",null],[null,"Saigon","Designer",null],["Em","Cantho",null,"50000"],[null,"Saigon",null,"65000"]]}},{"id":"GK3.15","topic":"PE 4.13 view authorization","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.13 (1)\u003c/strong> — Tạo view \u003ccode>gk_physics_staff(ID, name)\u003c/code> (instructor khoa Physics) và role \u003ccode>gk_viewer\u003c/code>; grant select \u003cstrong>chỉ trên view\u003c/strong> cho gk_viewer. Hệ thống sẽ \u003ccode>set role gk_viewer\u003c/code>: đọc được view nhưng không đọc được bảng instructor.\u003c/p>","hint":"","solution":"create view gk_physics_staff as\n  select ID, name from instructor where dept_name = 'Physics';\ncreate role gk_viewer;\ngrant select on gk_physics_staff to gk_viewer;","check":"set role gk_viewer;\nselect ID, name, try_sql($$select * from instructor$$) as read_instructor\nfrom gk_physics_staff;","ordered":false,"fresh":false,"expected":{"fields":["id","name","read_instructor"],"rows":[["22222","Einstein","42501"],["33456","Gold","42501"]]}},{"id":"GK3.16","topic":"PE 4.13 invisible insert","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.13 (3)\u003c/strong> — Tạo view \u003ccode>gk_history_instructors\u003c/code> (mọi cột của instructor khoa History, \u003cstrong>không\u003c/strong> có with check option), rồi insert \u003cstrong>qua view\u003c/strong> giảng viên \u003ccode>('25566', 'Brown', 'Biology', 100000)\u003c/code>. Hệ thống kiểm tra: tuple có trong instructor nhưng không thấy qua view.\u003c/p>","hint":"","solution":"create view gk_history_instructors as\n  select * from instructor where dept_name = 'History';\ninsert into gk_history_instructors values ('25566', 'Brown', 'Biology', 100000);","check":"select (select count(*) from instructor where ID = '25566') as in_instructor,\n       (select count(*) from gk_history_instructors where ID = '25566') as visible_in_view,\n       (select count(*) from gk_history_instructors) as view_rows;","ordered":false,"fresh":false,"expected":{"fields":["in_instructor","visible_in_view","view_rows"],"rows":[["1","0","2"]]}}]},{"key":"gk4","store":"gk4","short":"Đề GK","label":"Đề thi thử GK","navLabel":"Đề GK","kind":"Đề thi thử","title":"Mock Midterm (Chapters 1–4)","titleVi":"Đề thi thử giữa kỳ — Chương 1–4","summary":"\u003ch3>1. Cách làm đề thi thử\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Thời gian gợi ý: 90 phút\u003c/strong>, làm liền một mạch, không mở slide.\u003c/li>\u003cli>Làm \u003cstrong>Trắc nghiệm\u003c/strong> và \u003cstrong>Tự luận\u003c/strong> ra giấy trước (khoảng 45 phút), sau đó mới làm \u003cstrong>Bài tập SQL\u003c/strong> (khoảng 45 phút). Trong phòng thi thật thường phải viết SQL trên giấy — hãy viết nháp trước khi bấm chạy.\u003c/li>\u003cli>Các câu ở đây là \u003cstrong>biến thể\u003c/strong> của Practice Exercises (đổi lược đồ, đổi hằng số, thêm \"bẫy\") để kiểm tra bạn hiểu chứ không phải nhớ đáp án. Nếu sai câu nào, quay lại phần ôn tương ứng (GK1–GK3).\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phần\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Điểm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A. Trắc nghiệm\u003c/td>\u003ctd>25 câu × 0,2\u003c/td>\u003ctd>5,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B. Tự luận\u003c/td>\u003ctd>5 câu\u003c/td>\u003ctd>2,5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C. SQL\u003c/td>\u003ctd>12 bài\u003c/td>\u003ctd>2,5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tổng\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>10\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Tự chấm: trắc nghiệm chấm tự động; tự luận so với \u003cem>gợi ý đáp án\u003c/em> (mỗi ý in đậm là một ý chấm điểm); SQL chấm tự động bằng nút \u003cstrong>Kiểm tra\u003c/strong>.\u003c/p>\n\u003ch3>2. Kế hoạch 7 ngày (tuần 7 → thi tuần 8)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ngày\u003c/th>\u003cth>Việc cần làm\u003c/th>\u003cth>Ở đâu\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Ôn Chương 1–2: keys, foreign key, 6 phép đại số quan hệ + join, division\u003c/td>\u003ctd>Part 1 · Chương 1, 2 → \u003cstrong>GK1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Practice Exercises 3.1–3.4 (select/aggregate/subquery, insert/delete/update)\u003c/td>\u003ctd>Part 1 · Chương 3 → \u003cstrong>GK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Practice Exercises 3.5–3.10 (case, like, bank, employee: all/some, not exists, having)\u003c/td>\u003ctd>\u003cstrong>GK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Practice Exercises 4.1–4.6 (natural join trap, outer join, view GPA)\u003c/td>\u003ctd>Part 1 · Chương 4 → \u003cstrong>GK3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Practice Exercises 4.7–4.13 (DDL + FK, assertion, cascade, coalesce, authorization)\u003c/td>\u003ctd>\u003cstrong>GK3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Làm đề thi thử này trong 90 phút, chấm điểm, ghi lại câu sai\u003c/td>\u003ctd>\u003cstrong>Đề GK\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Làm lại các câu sai + bài ★★★ của GK1–GK3; đọc lại bảng \"phải thuộc\" bên dưới\u003c/td>\u003ctd>GK1–GK3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Checklist \"phải thuộc\"\u003c/h3>\n\u003cul>\u003cli>Superkey ⊇ candidate key (tối thiểu) ⊇ primary key (được chọn); foreign key: referencing → referenced; insert vào referencing / delete ở referenced có thể vi phạm.\u003c/li>\u003cli>σ, Π (loại trùng), ∪, −, ×, ρ là 6 phép cơ bản; ∩, ⋈, ÷, ← suy ra được. Division \"\u003cstrong>với mọi\u003c/strong>\" ↔ SQL \u003ccode>not exists (A except B)\u003c/code>.\u003c/li>\u003cli>\u003ccode>from r1, r2\u003c/code> là tích Descartes: nếu một bảng rỗng thì kết quả rỗng (PE 3.7).\u003c/li>\u003cli>Aggregate bỏ qua null, trừ \u003ccode>count(*)\u003c/code>; \u003ccode>count\u003c/code> trên tập rỗng = 0, \u003ccode>sum/avg/max\u003c/code> = null.\u003c/li>\u003cli>\"Tìm X có giá trị lớn nhất (có thể hoà)\": \u003ccode>with t as (...) select ... where v = (select max(v) from t)\u003c/code> hoặc \u003ccode>having ... &gt;= all (...)\u003c/code>.\u003c/li>\u003cli>Cột trong \u003ccode>select\u003c/code> không nằm trong aggregate phải có trong \u003ccode>group by\u003c/code>; điều kiện trên nhóm đặt ở \u003ccode>having\u003c/code>.\u003c/li>\u003cli>Đếm cả nhóm 0 phần tử: \u003cstrong>left outer join\u003c/strong> + \u003ccode>count(cột của bảng bên phải)\u003c/code> hoặc \u003cstrong>scalar subquery\u003c/strong>.\u003c/li>\u003cli>Bẫy natural join: \u003ccode>instructor natural join teaches natural join course\u003c/code> ghép thêm theo dept_name.\u003c/li>\u003cli>\u003ccode>update\u003c/code> theo nhiều mức: dùng \u003ccode>case\u003c/code> trong một câu (thứ tự 2 câu update có thể làm sai kết quả).\u003c/li>\u003cli>View đơn giản mới update được; \u003ccode>with check option\u003c/code> chặn dòng không thoả where. Quyền select trên view không cần quyền trên bảng gốc.\u003c/li>\u003cli>\u003ccode>on delete cascade\u003c/code> trên FK tự tham chiếu xoá \u003cstrong>toàn bộ cây\u003c/strong> cấp dưới (PE 4.9).\u003c/li>\u003c/ul>","quiz":[{"q":"Relation account(account_number, branch_name, balance) có primary key account_number. Tập nào là superkey nhưng KHÔNG phải candidate key?","options":["{account_number}","{account_number, balance}","{branch_name}","{branch_name, balance}"],"answer":1,"explain":"Chứa candidate key {account_number} nên là superkey, nhưng không tối thiểu."},{"q":"Bank database: loan.branch_name là foreign key tham chiếu branch. Thao tác nào CÓ THỂ vi phạm ràng buộc này?","options":["Insert một branch mới","Delete một loan","Delete một branch đang có loan","Update amount của một loan"],"answer":2,"explain":"Xoá tuple ở referenced relation (branch) mà vẫn còn tuple referencing (loan) trỏ tới."},{"q":"Bảng takes có primary key (ID, course_id, sec_id, semester, year). Vì sao grade KHÔNG nằm trong khoá?","options":["Vì grade có thể null","Vì một sinh viên học một section chỉ có một điểm — grade được xác định bởi khoá","Vì grade là chuỗi","Vì SQL cấm"],"answer":1,"explain":"Giống lý luận end_time trong time_slot (PE 2.3): thuộc tính được xác định duy nhất bởi các thuộc tính khoá thì không cần đưa vào khoá."},{"q":"Kết quả của σ\u003csub>borrower.loan_number = loan.loan_number\u003c/sub>(borrower × loan) chứa những customer nào?","options":["Mọi customer","Chỉ customer có ít nhất một loan; customer có 2 loan xuất hiện 2 lần","Chỉ customer có đúng một loan","Customer không có loan với cột loan = null"],"answer":1,"explain":"Giống PE 2.5: tích + chọn = join; tuple không khớp bị loại, mỗi cặp khớp sinh một dòng."},{"q":"Biểu thức nào tìm ID khách hàng có account nhưng KHÔNG có loan?","options":["Π\u003csub>ID\u003c/sub>(depositor) ∩ Π\u003csub>ID\u003c/sub>(borrower)","Π\u003csub>ID\u003c/sub>(depositor) − Π\u003csub>ID\u003c/sub>(borrower)","Π\u003csub>ID\u003c/sub>(borrower) − Π\u003csub>ID\u003c/sub>(depositor)","Π\u003csub>ID\u003c/sub>(depositor × borrower)"],"answer":1,"explain":"Set difference: có trong depositor mà không có trong borrower."},{"q":"r(A,B) ÷ s(B) trả về gì?","options":["Các A xuất hiện với ít nhất một B của s","Các A xuất hiện với MỌI B của s","Các B không có trong r","r × s"],"answer":1,"explain":"Division là phép \"với mọi\" (PE 2.9)."},{"q":"Muốn tìm nhân viên lương cao nhất bằng đại số quan hệ chỉ dùng 6 phép cơ bản, ta cần phép nào để so sánh hai bản sao của works?","options":["Union","Rename ρ","Projection","Không cần phép nào"],"answer":1,"explain":"PE 2.8b: ρ\u003csub>A\u003c/sub>(works) và ρ\u003csub>B\u003c/sub>(works), tìm người có A.salary \u003c B.salary rồi lấy phần bù."},{"q":"Câu \u003ccode>select p.a from p, r1, r2 where p.a = r1.a or p.a = r2.a\u003c/code> trả về rỗng khi nào dù p và r1 đều có giá trị khớp?","options":["Khi r2 rỗng","Khi p có null","Khi r1 có trùng lặp","Không bao giờ"],"answer":0,"explain":"PE 3.7: from p, r1, r2 là tích Descartes; một bảng rỗng → tích rỗng."},{"q":"\u003ccode>select count(grade) from takes where ID = '98988'\u003c/code> trả về gì nếu sinh viên này có 2 dòng takes, một dòng grade = null?","options":["0","1","2","null"],"answer":1,"explain":"count(cột) bỏ qua null; count(*) mới đếm 2."},{"q":"Cho branch có 9 dòng và loan chỉ tham chiếu 7 branch. \u003ccode>select branch_name, count(*) from branch natural left outer join loan group by branch_name\u003c/code> sai ở đâu?","options":["Thiếu branch","Branch không có loan được đếm là 1 thay vì 0","Lỗi cú pháp","Đếm trùng loan"],"answer":1,"explain":"Dòng bù null vẫn là một dòng: phải dùng count(loan_number) (PE 4.2a)."},{"q":"Điều kiện nào đúng cho \"ID nhân viên lương cao hơn MỌI nhân viên của Small Bank Corporation\"?","options":["salary > some (select salary ... )","salary > all (select salary ... )","salary in (select salary ...)","exists (select salary ...)"],"answer":1,"explain":"> all = lớn hơn giá trị lớn nhất (PE 3.9d)."},{"q":"Nếu subquery của \u003ccode>salary &gt; all (subquery)\u003c/code> trả về tập rỗng thì điều kiện có giá trị gì?","options":["false","unknown","true","Lỗi"],"answer":2,"explain":"\"Lớn hơn mọi phần tử của tập rỗng\" luôn đúng (vacuous truth)."},{"q":"Truy vấn \"công ty đặt ở MỌI thành phố mà Small Bank Corporation đặt\" thường viết bằng cấu trúc nào?","options":["group by ... having count(*) > 1","not exists ((thành phố của Small Bank) except (thành phố của công ty S))","in (select city ...)","left outer join"],"answer":1,"explain":"PE 3.9e: A ⊆ B ⇔ A − B = ∅."},{"q":"\u003ccode>where name like '%sci%'\u003c/code> không khớp \"Comp. Sci.\" vì sao, và sửa thế nào?","options":["like không hỗ trợ dấu chấm; dùng =","like phân biệt hoa thường; dùng lower(name) like '%sci%'","Phải dùng _ thay vì %","Thiếu escape"],"answer":1,"explain":"PE 3.6."},{"q":"Lệnh nào tăng 10% cho lương ≤ 50000 và 4% cho phần còn lại mà KHÔNG phụ thuộc thứ tự thực hiện?","options":["Hai câu update, câu 10% trước","Hai câu update, câu 4% trước","Một câu update với set salary = salary * case when salary \u003c= 50000 then 1.10 else 1.04 end","Không thể làm được"],"answer":2,"explain":"PE 3.10b: hai câu update riêng có thể \"tăng hai lần\" cho dòng vượt ngưỡng sau câu đầu."},{"q":"\u003ccode>instructor natural join teaches natural join section natural join course\u003c/code> (PE 4.1) bị sai vì?","options":["section và course không có cột chung","Ghép thêm theo dept_name nên mất các môn dạy ngoài khoa của giảng viên","Natural join không kết hợp được","Thiếu group by"],"answer":1,"explain":"instructor và course đều có dept_name."},{"q":"r(A,B), s(B,C), t(B,D), mọi thuộc tính not null. Trong r ⟕ (s ⟕ t), cột nào có thể null?","options":["Chỉ C","Chỉ D; nếu C null thì D cũng null","Cả hai, độc lập nhau","Không cột nào"],"answer":1,"explain":"PE 4.4b: s ⟕ t tính trước nên C luôn có giá trị khi tuple s tồn tại."},{"q":"Viết a ⟗ b (natural) bằng \u003ccode>full outer join ... on\u003c/code> mà không có hai bản cột name: cần hàm nào?","options":["nullif","coalesce(a.name, b.name)","cast","decode(a.name)"],"answer":1,"explain":"PE 4.10."},{"q":"View \u003ccode>v\u003c/code> định nghĩa \u003ccode>select * from branch where branch_city = 'Brooklyn'\u003c/code> (không check option). Insert qua v tuple có branch_city = 'Rye' thì sao?","options":["Bị từ chối","Được chèn vào branch nhưng không thấy khi select * from v","Chèn với branch_city = null","Chèn vào cả hai"],"answer":1,"explain":"PE 4.13 ý 3; with check option mới chặn."},{"q":"User được grant select trên view v (định nghĩa trên r). User có cần quyền select trên r?","options":["Có","Không — đó chính là lợi ích của view","Chỉ khi v là materialized","Chỉ với update"],"answer":1,"explain":"PE 4.13 ý 1."},{"q":"Bảng manager(employee_ID PK, manager_ID FK → manager on delete cascade). Xoá một giám đốc cấp cao nhất thì?","options":["Chỉ xoá giám đốc","Xoá giám đốc và nhân viên trực tiếp","Xoá toàn bộ nhân viên cấp dưới ở mọi cấp","Báo lỗi"],"answer":2,"explain":"PE 4.9: cascade lan dần theo từng cấp."},{"q":"\u003ccode>grant select on works to amit granted by current_role\u003c/code> khác gì so với không có mệnh đề granted by?","options":["Không khác","Quyền gắn với role, còn hiệu lực khi người cấp bị xoá tài khoản","Amit được cấp lại quyền cho người khác","Chỉ áp dụng trong transaction hiện tại"],"answer":1,"explain":"PE 4.12."},{"q":"Ràng buộc \"instructor không dạy hai phòng khác nhau trong cùng time slot và học kỳ\" — PostgreSQL hiện thực thế nào thay cho create assertion?","options":["check với subquery","Trigger (hoặc truy vấn kiểm tra định kỳ)","unique","not null"],"answer":1,"explain":"PE 4.8: assertion và check có subquery không được hỗ trợ."},{"q":"Vì sao test database cần có tuple ở referenced relation KHÔNG được tham chiếu (ví dụ department không có instructor)?","options":["Để tăng tốc","Để phát hiện truy vấn quên outer join (department có 0 giảng viên bị mất)","Bắt buộc bởi SQL","Để kiểm tra primary key"],"answer":1,"explain":"PE 4.5b."},{"q":"So với một ngôn ngữ lập trình, DDL của DBMS KHÔNG có đặc điểm nào sau đây?","options":["Khai báo ràng buộc toàn vẹn (FK, check)","Tạo đối tượng tồn tại lâu dài trong database","Hệ kiểu phong phú hơn kiểu của Java/C++","Hỗ trợ phân quyền"],"answer":2,"explain":"PE 1.2: hệ kiểu của ngôn ngữ lập trình thường phong phú hơn SQL."}],"questions":[{"q":"(0,5đ) Cho bank database. (a) Chỉ ra primary key và mọi foreign key của borrower và depositor. (b) Cho một ví dụ insert và một ví dụ delete vi phạm FK depositor.account_number → account.","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> borrower(\u003cstrong>ID, loan_number\u003c/strong>): FK ID → customer, loan_number → loan. depositor(\u003cstrong>ID, account_number\u003c/strong>): FK ID → customer, account_number → account. Khoá gồm cả hai cột vì quan hệ nhiều–nhiều (một khách nhiều tài khoản, tài khoản đứng tên chung).\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Insert \u003ccode>('12345', 'A-999')\u003c/code> vào depositor khi account không có A-999. Delete \u003ccode>A-101\u003c/code> khỏi account khi depositor còn \u003ccode>('67890', 'A-101')\u003c/code> (nếu FK không có on delete cascade).\u003c/p>"},{"q":"(0,5đ) Viết đại số quan hệ trên bank database: (a) tên các branch ở thành phố Horseneck có assets > 1.000.000; (b) ID khách có loan ở \u003cstrong>mọi\u003c/strong> branch của thành phố Brooklyn.","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city = \"Horseneck\" ∧ assets > 1000000\u003c/sub>(branch))\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Dùng division: r ← Π\u003csub>ID, branch_name\u003c/sub>(borrower ⋈ loan), s ← Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city = \"Brooklyn\"\u003c/sub>(branch)); kết quả \u003cstrong>r ÷ s\u003c/strong>.\u003c/p>\n\u003cp>Không dùng ÷: Π\u003csub>ID\u003c/sub>(r) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(r) × s) − r).\u003c/p>"},{"q":"(0,5đ) Giải thích vì sao truy vấn sau cho kết quả sai khi một section chưa có sinh viên, và sửa lại: \u003ccode>select course_id, sec_id, count(*) from section natural join takes where semester = 'Fall' and year = 2017 group by course_id, sec_id\u003c/code>.","answer":"\u003cp>\u003cstrong>Lỗi:\u003c/strong> inner join loại các section không có dòng takes → section 0 sinh viên \u003cstrong>biến mất\u003c/strong> (PE 3.1e). (Ngoài ra nếu đổi sang outer join thì phải dùng \u003ccode>count(takes.ID)\u003c/code>, không dùng \u003ccode>count(*)\u003c/code>.)\u003c/p>\n\u003cp>\u003cstrong>Sửa 1 — scalar subquery:\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select course_id, sec_id,\n       (select count(ID) from takes t\n        where t.course_id = s.course_id and t.sec_id = s.sec_id\n          and t.semester = s.semester and t.year = s.year) as enrollment\nfrom section s where semester = 'Fall' and year = 2017;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Sửa 2 — outer join:\u003c/strong> \u003ccode>section left outer join takes using (course_id, sec_id, semester, year)\u003c/code> + \u003ccode>count(takes.ID)\u003c/code>.\u003c/p>"},{"q":"(0,5đ) Viết DDL cho insurance database (person, car, accident, owns, participated) với đầy đủ primary key, foreign key. Khi xoá một car, ta muốn các dòng owns của xe đó bị xoá theo — khai báo thế nào?","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table person (driver_id varchar(5) primary key, name varchar(30) not null, address varchar(50));\ncreate table car (license_plate varchar(10) primary key, model varchar(30), year integer);\ncreate table accident (report_number varchar(10) primary key, year integer, location varchar(50));\ncreate table owns (\n  driver_id varchar(5) references person,\n  license_plate varchar(10) references car on delete cascade,\n  primary key (driver_id, license_plate));\ncreate table participated (\n  report_number varchar(10) references accident,\n  license_plate varchar(10) references car,\n  driver_id varchar(5) references person,\n  damage_amount numeric(10,2),\n  primary key (report_number, license_plate));\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ý chấm:\u003c/strong> khoá kép của owns và participated; FK đủ chiều; \u003ccode>on delete cascade\u003c/code> đặt ở \u003cstrong>owns.license_plate\u003c/strong> (bảng referencing). Nếu participated không cascade, xoá xe đã gặp tai nạn sẽ bị từ chối — phải quyết định có giữ lịch sử tai nạn hay không.\u003c/p>"},{"q":"(0,5đ) Định nghĩa view \u003ccode>customer_balance(ID, total_balance)\u003c/code> cho tổng số dư mỗi khách, \u003cstrong>kể cả khách không có tài khoản (tổng = 0)\u003c/strong>. View này có update được không? User chỉ có quyền select trên view thì có đọc được bảng account không?","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create view customer_balance (ID, total_balance) as\nselect c.ID, coalesce(sum(a.balance), 0)\nfrom customer c left outer join depositor d on c.ID = d.ID\n                left outer join account a on a.account_number = d.account_number\ngroup by c.ID;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ý chấm:\u003c/strong> cần \u003cstrong>left outer join\u003c/strong> + \u003ccode>coalesce\u003c/code> (sum trên tập rỗng = null). View có join và aggregate nên \u003cstrong>không\u003c/strong> updatable. Quyền select trên view \u003cstrong>không\u003c/strong> cho đọc account (PE 4.13) — chỉ thấy dữ liệu đã tổng hợp.\u003c/p>"}],"exercises":[{"id":"GK4.01","topic":"outer join + count","level":2,"prompt":"\u003cp>Bank database. Với \u003cstrong>mọi\u003c/strong> branch: branch_name và số loan của branch đó (\u003ccode>num_loans\u003c/code>, bằng 0 nếu không có). Không dùng subquery.\u003c/p>","hint":"Biến thể PE 4.2d: left outer join + count(cột của loan).","solution":"select branch_name, count(loan_number) as num_loans\nfrom branch natural left outer join loan\ngroup by branch_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","num_loans"],"rows":[["North Town","1"],["Downtown","2"],["Perryridge","2"],["Mianus","1"],["Chicago Loop","1"],["Round Hill","1"],["Lakeview","0"],["Brighton","0"],["Redwood","1"]]}},{"id":"GK4.02","topic":"intersect","level":1,"prompt":"\u003cp>ID các khách hàng \u003cstrong>vừa\u003c/strong> có account \u003cstrong>vừa\u003c/strong> có loan.\u003c/p>","hint":"","solution":"(select ID from depositor)\nintersect\n(select ID from borrower);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["56789"],["90123"],["12345"],["91234"],["78901"]]}},{"id":"GK4.03","topic":"division (for all)","level":3,"prompt":"\u003cp>ID và customer_name của khách có account ở \u003cstrong>mọi\u003c/strong> branch đặt tại thành phố \u003ccode>Brooklyn\u003c/code>.\u003c/p>","hint":"not exists ((branch ở Brooklyn) except (branch mà khách C có account)).","solution":"select C.ID, C.customer_name\nfrom customer as C\nwhere not exists (\n  (select branch_name from branch where branch_city = 'Brooklyn')\n  except\n  (select a.branch_name\n   from depositor d join account a on a.account_number = d.account_number\n   where d.ID = C.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","customer_name"],"rows":[["67890","Johnson"]]}},{"id":"GK4.04","topic":"with + max (ties)","level":2,"prompt":"\u003cp>Branch có \u003cstrong>tổng số tiền cho vay\u003c/strong> (sum amount của loan) lớn nhất — nếu hoà thì trả về tất cả. Trả về branch_name và total_amount.\u003c/p>","hint":"Biến thể PE 3.1g.","solution":"with branch_total as (\n  select branch_name, sum(amount) as total_amount\n  from loan group by branch_name)\nselect branch_name, total_amount\nfrom branch_total\nwhere total_amount = (select max(total_amount) from branch_total);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","total_amount"],"rows":[["North Town","7500"]]}},{"id":"GK4.05","topic":"having + subquery","level":2,"prompt":"\u003cp>Các branch có \u003cstrong>số dư trung bình\u003c/strong> (avg balance của account) lớn hơn số dư trung bình của \u003cstrong>toàn bộ\u003c/strong> account. Trả về branch_name.\u003c/p>","hint":"Biến thể PE 3.9g.","solution":"select branch_name\nfrom account\ngroup by branch_name\nhaving avg(balance) > (select avg(balance) from account);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Mianus"],["Chicago Loop"],["Brighton"],["Redwood"]]}},{"id":"GK4.06","topic":"correlated subquery","level":2,"prompt":"\u003cp>Employee database. ID, person_name và salary của nhân viên có lương \u003cstrong>cao hơn lương trung bình của chính công ty mình\u003c/strong>.\u003c/p>","hint":"","solution":"select e.ID, e.person_name, w.salary\nfrom employee e join works w on w.ID = e.ID\nwhere w.salary > (select avg(w2.salary) from works w2\n                  where w2.company_name = w.company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","salary"],"rows":[["10001","Alice Nguyen","85000"],["10004","David Pham","92000"],["10006","Frank Do","52000"],["10007","Grace Ho","120000"],["10009","Ivy Dang","58000"],["10010","Jack Ngo","61000"]]}},{"id":"GK4.07","topic":"update + case","level":2,"prompt":"\u003cp>Nhân viên của \u003ccode>Mega Corp\u003c/code>: lương \u003cst
