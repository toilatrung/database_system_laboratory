ying(10)","pk":true},{"column":"branch_name","type":"character varying(20)","pk":false},{"column":"balance","type":"numeric(12,2)","pk":false}]},{"table":"depositor","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"account_number","type":"character varying(10)","pk":true}]}]},{"title":"Insurance database (Figure 3.17)","note":"","core":false,"tables":[{"table":"person","columns":[{"column":"driver_id","type":"character varying(5)","pk":true},{"column":"name","type":"character varying(30)","pk":false},{"column":"address","type":"character varying(50)","pk":false}]},{"table":"car","columns":[{"column":"license_plate","type":"character varying(10)","pk":true},{"column":"model","type":"character varying(30)","pk":false},{"column":"year","type":"integer(32,0)","pk":false}]},{"table":"accident","columns":[{"column":"report_number","type":"character varying(10)","pk":true},{"column":"year","type":"integer(32,0)","pk":false},{"column":"location","type":"character varying(50)","pk":false}]},{"table":"owns","columns":[{"column":"driver_id","type":"character varying(5)","pk":true},{"column":"license_plate","type":"character varying(10)","pk":true}]},{"table":"participated","columns":[{"column":"report_number","type":"character varying(10)","pk":true},{"column":"license_plate","type":"character varying(10)","pk":true},{"column":"driver_id","type":"character varying(5)","pk":false},{"column":"damage_amount","type":"numeric(10,2)","pk":false}]}]},{"title":"Bảng khác (marks, grade_points, Exercise 4.10, bảng phụ)","note":"","core":false,"tables":[{"table":"account_txn","columns":[{"column":"account_number","type":"character varying(10)","pk":true},{"column":"date_time","type":"timestamp without time zone","pk":true},{"column":"value","type":"numeric(10,2)","pk":false}]},{"table":"daily_sales","columns":[{"column":"sale_date","type":"date","pk":true},{"column":"value","type":"numeric(8,2)","pk":false}]},{"table":"dept_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]},{"table":"emp_salary","columns":[{"column":"name","type":"character varying(20)","pk":false},{"column":"address","type":"character varying(30)","pk":false},{"column":"salary","type":"numeric(10,2)","pk":false}]},{"table":"emp_super","columns":[{"column":"person","type":"character varying(20)","pk":true},{"column":"supervisor","type":"character varying(20)","pk":false}]},{"table":"emp_title","columns":[{"column":"name","type":"character varying(20)","pk":false},{"column":"address","type":"character varying(30)","pk":false},{"column":"title","type":"character varying(20)","pk":false}]},{"table":"grade_points","columns":[{"column":"grade","type":"character varying(2)","pk":true},{"column":"points","type":"numeric(2,1)","pk":false}]},{"table":"itemcategory","columns":[{"column":"item_name","type":"character varying(10)","pk":true},{"column":"category","type":"character varying(15)","pk":false}]},{"table":"marks","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"score","type":"integer(32,0)","pk":false}]},{"table":"sales","columns":[{"column":"item_name","type":"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"gk1","store":"gk1","short":"GK1","label":"Ôn GK · Phần 1","navLabel":"GK1","kind":"Ôn tập","title":"Practice Exercises — Chapters 1–2","titleVi":"Practice Exercises Chương 1–2 (Introduction, Relational Model)","summary":"\u003ch3>Cách dùng phần này\u003c/h3>\n\u003cp>Đề giữa kỳ chủ yếu lấy từ \u003cstrong>Practice Exercises\u003c/strong> của sách. Phần này đi qua \u003cstrong>toàn bộ\u003c/strong> Practice Exercises (PE) Chương 1 và 2, đánh số đúng như sách. Câu lý thuyết nằm ở \u003cem>Câu hỏi tự luận\u003c/em>; câu đại số quan hệ có \u003cstrong>cả\u003c/strong> đáp án đại số (tự luận) \u003cstrong>và\u003c/strong> bài SQL tương đương chạy trên dữ liệu mẫu (Employee database, Bank database, University).\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Tự luận\u003c/th>\u003cth>Bài SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1.1\u003c/td>\u003ctd>Hai nhược điểm của DBMS\u003c/td>\u003ctd>Câu 1\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.2\u003c/td>\u003ctd>5 điểm khác nhau giữa type declaration (Java/C++) và DDL\u003c/td>\u003ctd>Câu 2\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.3\u003c/td>\u003ctd>6 bước xây dựng database cho một doanh nghiệp\u003c/td>\u003ctd>Câu 3\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.4\u003c/td>\u003ctd>Video site kiểu YouTube vs file-processing system\u003c/td>\u003ctd>Câu 4\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.5\u003c/td>\u003ctd>Keyword query (web search) vs database query\u003c/td>\u003ctd>Câu 5\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.1\u003c/td>\u003ctd>Primary key của Employee database\u003c/td>\u003ctd>Câu 6\u003c/td>\u003ctd>GK1.01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.2\u003c/td>\u003ctd>Insert/delete vi phạm foreign key\u003c/td>\u003ctd>Câu 7\u003c/td>\u003ctd>GK1.02\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.3\u003c/td>\u003ctd>Vì sao day, start_time thuộc khoá của time_slot, end_time thì không\u003c/td>\u003ctd>Câu 8\u003c/td>\u003ctd>GK1.03\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.4\u003c/td>\u003ctd>name có là superkey của instructor không?\u003c/td>\u003ctd>Câu 9\u003c/td>\u003ctd>GK1.04\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.5\u003c/td>\u003ctd>σ\u003csub>s_id=ID\u003c/sub>(student × advisor)\u003c/td>\u003ctd>Câu 10\u003c/td>\u003ctd>GK1.05, GK1.06\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.6 a–c\u003c/td>\u003ctd>Đại số quan hệ trên Employee database\u003c/td>\u003ctd>Câu 11\u003c/td>\u003ctd>GK1.07–GK1.09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.7 a–b\u003c/td>\u003ctd>Đại số quan hệ trên Bank database\u003c/td>\u003ctd>Câu 12\u003c/td>\u003ctd>GK1.10–GK1.11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.8 a–b\u003c/td>\u003ctd>Set difference, rename\u003c/td>\u003ctd>Câu 13\u003c/td>\u003ctd>GK1.12–GK1.13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.9 a–b\u003c/td>\u003ctd>Phép chia (division)\u003c/td>\u003ctd>Câu 14\u003c/td>\u003ctd>GK1.14–GK1.16\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Chương 1 — ý chính hay thi\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Nhược điểm của file-processing system\u003c/strong> (Section 1.2): data redundancy & inconsistency, difficulty in accessing data, data isolation, integrity problems, atomicity problems, concurrent-access anomalies, security problems. PE 1.4 bắt bạn đánh giá \u003cem>từng\u003c/em> điểm cho một ứng dụng cụ thể.\u003c/li>\u003cli>\u003cstrong>Nhược điểm của DBMS\u003c/strong> (PE 1.1): tốn chi phí/kiến thức/thời gian cài đặt; độ phức tạp có thể làm hiệu năng kém (với ứng dụng đơn giản).\u003c/li>\u003cli>\u003cstrong>DDL ≠ type declaration\u003c/strong> (PE 1.2): DDL \u003cem>tạo object thật\u003c/em> trong database, khai báo được \u003cstrong>constraint\u003c/strong> (domain, referential integrity), có \u003cstrong>authorization\u003c/strong>; hệ kiểu của ngôn ngữ lập trình \u003cem>giàu hơn\u003c/em> nhưng chỉ là trừu tượng trong chương trình.\u003c/li>\u003cli>\u003cstrong>Database query vs keyword query\u003c/strong> (PE 1.5): SQL có cú pháp chặt, diễn đạt truy vấn phức tạp, \u003cstrong>kết quả luôn là một bảng\u003c/strong>; web search nhận danh sách từ khoá, trả về danh sách URL \u003cstrong>xếp hạng\u003c/strong> kèm snippet.\u003c/li>\u003c/ul>\n\u003ch3>Chương 2 — keys\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Khái niệm\u003c/th>\u003cth>Định nghĩa\u003c/th>\u003cth>Bẫy hay gặp\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Superkey\u003c/td>\u003ctd>K xác định duy nhất mỗi tuple\u003c/td>\u003ctd>Mọi tập chứa superkey cũng là superkey\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Candidate key\u003c/td>\u003ctd>Superkey tối thiểu\u003c/td>\u003ctd>{A, B} chứa key {A} thì \u003cstrong>không\u003c/strong> là candidate key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Primary key\u003c/td>\u003ctd>Candidate key được chọn\u003c/td>\u003ctd>Không suy ra từ \u003cstrong>một instance\u003c/strong> (PE 2.4)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foreign key\u003c/td>\u003ctd>Giá trị phải có ở relation được tham chiếu\u003c/td>\u003ctd>Vi phạm khi \u003cstrong>insert\u003c/strong> vào referencing hoặc \u003cstrong>delete\u003c/strong> ở referenced (PE 2.2)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Key là ràng buộc trên \u003cstrong>schema\u003c/strong> (mọi instance hợp lệ), không phải nhận xét về dữ liệu hiện tại.\u003c/p>\n\u003ch3>Chương 2 — relational algebra ↔ SQL\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Đại số\u003c/th>\u003cth>SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>σ\u003csub>p\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select * from r where p\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Π\u003csub>A,B\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select distinct A, B from r\u003c/code> (đại số \u003cstrong>loại trùng\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r × s\u003c/td>\u003ctd>\u003ccode>from r, s\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈\u003csub>θ\u003c/sub> s\u003c/td>\u003ctd>\u003ccode>from r join s on θ\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ∪ s, r − s, r ∩ s\u003c/td>\u003ctd>\u003ccode>union\u003c/code>, \u003ccode>except\u003c/code>, \u003ccode>intersect\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ρ\u003csub>A\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>from r as A\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ÷ s\u003c/td>\u003ctd>\u003cem>không có trong SQL\u003c/em> → \u003ccode>not exists (... except ...)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Phép chia (PE 2.9)\u003c/h3>\n\u003cp>r(R) ÷ s(S), S ⊆ R: các tuple t trên R − S sao cho \u003cstrong>với mọi\u003c/strong> t\u003csub>s\u003c/sub> ∈ s, (t, t\u003csub>s\u003c/sub>) ∈ r.\u003c/p>\n\u003cp>r ÷ s = Π\u003csub>R−S\u003c/sub>(r) − Π\u003csub>R−S\u003c/sub>((Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r))\u003c/p>\n\u003cp>Đọc: lấy mọi ứng viên, ghép với \u003cstrong>mọi\u003c/strong> phần tử của s, trừ đi những cặp thật sự có trong r → còn lại các cặp \u003cem>thiếu\u003c/em>; ứng viên nào có cặp thiếu thì bị loại.\u003c/p>\n\u003ch3>Bẫy thường gặp\u003c/h3>\n\u003cul>\u003cli>Dùng σ cho \"\u003cstrong>mọi\u003c/strong>\" (every employee, all courses) — phải dùng \u003cstrong>set difference\u003c/strong> hoặc \u003cstrong>division\u003c/strong>.\u003c/li>\u003cli>Quên \u003cstrong>rename\u003c/strong> khi so sánh relation với chính nó (PE 2.8b: ρ\u003csub>A\u003c/sub>, ρ\u003csub>B\u003c/sub>).\u003c/li>\u003cli>PE 2.6b/2.8b: salary nằm ở \u003cstrong>works\u003c/strong>, không phải employee → phải join. (Lời giải trong sách của 2.8b viết A.salary trên employee — xem Câu 13.)\u003c/li>\u003cli>σ trên × chỉ giữ những cặp khớp: sinh viên \u003cstrong>không có\u003c/strong> advisor biến mất khỏi kết quả (PE 2.5).\u003c/li>\u003c/ul>","quiz":[{"q":"PE 1.1 — Đâu là một nhược điểm của việc dùng hệ quản trị CSDL (so với file)?","options":["Dữ liệu dư thừa nhiều hơn","Chi phí, kiến thức và thời gian cài đặt cao hơn","Khó truy cập dữ liệu hơn","Không hỗ trợ truy cập đồng thời"],"answer":1,"explain":"Hai nhược điểm sách nêu: chi phí/kỹ năng/thời gian cài đặt và độ phức tạp có thể làm hiệu năng kém. Các phương án khác là nhược điểm của file system."},{"q":"PE 1.2 — Điều nào DDL của database làm được mà hệ kiểu của Java/C++ thường KHÔNG làm được?","options":["Khai báo kiểu số nguyên","Khai báo ràng buộc toàn vẹn (foreign key, check) và phân quyền","Tạo collection lồng nhau","Định nghĩa phương thức"],"answer":1,"explain":"DDL khai báo constraint và authorization; ngược lại hệ kiểu của ngôn ngữ lập trình giàu hơn (mảng, object...)."},{"q":"PE 1.4 — Với video site, vấn đề nào của file-processing system QUAN TRỌNG nhất khi upload video?","options":["Concurrent-access anomalies","Atomicity: video và metadata phải được thêm cùng nhau","Data redundancy của dữ liệu video","Data isolation"],"answer":1,"explain":"Upload phải atomic: nếu chỉ có metadata mà không có video (hoặc ngược lại) dữ liệu sẽ không nhất quán. Dữ liệu chủ yếu append-only nên concurrent anomalies ít xảy ra."},{"q":"PE 1.5 — Kết quả của một truy vấn trên relational database luôn là gì?","options":["Danh sách URL xếp hạng","Một bảng (relation)","Một giá trị đơn","Một file văn bản"],"answer":1,"explain":"Trong mô hình quan hệ, kết quả truy vấn luôn là một relation."},{"q":"PE 2.1 — Primary key của works(ID, company_name, salary) trong Employee database là gì (mỗi người làm cho một công ty)?","options":["(ID, company_name)","ID","company_name","(ID, salary)"],"answer":1,"explain":"Mỗi nhân viên làm cho đúng một công ty nên ID đủ xác định một tuple của works."},{"q":"PE 2.2 — Thao tác nào CÓ THỂ vi phạm foreign key instructor.dept_name → department?","options":["Insert một department mới","Delete một instructor","Delete một department đang có instructor","Update salary của instructor"],"answer":2,"explain":"Vi phạm xảy ra khi insert vào referencing relation một giá trị không tồn tại, hoặc delete/update ở referenced relation một giá trị đang được tham chiếu."},{"q":"PE 2.3 — Vì sao end_time KHÔNG nằm trong primary key của time_slot?","options":["Vì end_time có thể null","Vì một slot bắt đầu vào một ngày, một giờ thì chỉ kết thúc vào một thời điểm","Vì end_time không phải số","Vì end_time luôn bằng start_time + 50 phút"],"answer":1,"explain":"(time_slot_id, day, start_time) đã xác định end_time; thêm end_time vào sẽ không còn tối thiểu."},{"q":"PE 2.4 — Trong instance hiện tại không có hai instructor trùng tên. Kết luận nào đúng?","options":["name là primary key","name là superkey","Không thể kết luận name là superkey","name là foreign key"],"answer":2,"explain":"Key là ràng buộc trên mọi instance hợp lệ, không suy ra từ một instance cụ thể."},{"q":"PE 2.5 — Trong σ\u003csub>s_id=ID\u003c/sub>(student × advisor), sinh viên có 2 advisor xuất hiện mấy lần?","options":["0","1","2","Tuỳ DBMS"],"answer":2,"explain":"Mỗi cặp (student, advisor) khớp tạo một tuple. Sinh viên không có advisor thì không xuất hiện."},{"q":"PE 2.6b — Vì sao biểu thức tìm nhân viên có salary > 100000 cần phép join?","options":["Vì cần loại trùng","Vì person_name ở employee còn salary ở works","Vì σ không dùng được với số","Không cần join"],"answer":1,"explain":"Π\u003csub>person_name\u003c/sub>(σ\u003csub>salary>100000\u003c/sub>(employee ⋈ works))."},{"q":"PE 2.8a — Cách đúng để tìm nhân viên KHÔNG làm cho BigBank?","options":["σ\u003csub>company_name≠\"BigBank\"\u003c/sub>(works)","Π\u003csub>ID,person_name\u003c/sub>(employee) − Π\u003csub>ID,person_name\u003c/sub>(employee ⋈ σ\u003csub>company_name=\"BigBank\"\u003c/sub>(works))","Π\u003csub>ID\u003c/sub>(employee) ∩ Π\u003csub>ID\u003c/sub>(works)","employee × σ\u003csub>company_name=\"BigBank\"\u003c/sub>(works)"],"answer":1,"explain":"Lấy tất cả trừ những người làm cho BigBank. Phương án A bỏ sót người không có trong works."},{"q":"PE 2.8b — Vì sao cần phép rename ρ khi tìm người lương cao nhất?","options":["Để đổi tên cột kết quả","Vì phải so sánh salary của hai tuple khác nhau trong cùng relation","Vì đại số không cho so sánh số","Không cần"],"answer":1,"explain":"ρ\u003csub>A\u003c/sub>(…) ⋈\u003csub>A.salary \u003c B.salary\u003c/sub> ρ\u003csub>B\u003c/sub>(…) tìm những người có ai đó lương cao hơn, rồi lấy phần bù."},{"q":"PE 2.9 — Với r(ID, course_id) và s(course_id), r ÷ s có schema nào?","options":["(ID, course_id)","(course_id)","(ID)","Rỗng"],"answer":2,"explain":"r ÷ s có schema R − S = {ID}."},{"q":"PE 2.9b — Trong r ÷ s = Π\u003csub>R−S\u003c/sub>(r) − Π\u003csub>R−S\u003c/sub>((Π\u003csub>R−S\u003c/sub>(r) × s) − r), phần (Π\u003csub>R−S\u003c/sub>(r) × s) − r là gì?","options":["Các cặp có thật trong r","Các cặp (ứng viên, phần tử của s) KHÔNG có trong r","Kết quả của phép chia","Luôn rỗng"],"answer":1,"explain":"Đó là các cặp còn thiếu; ứng viên nào có cặp thiếu thì không thoả \"với mọi\" nên bị loại."}],"questions":[{"q":"\u003cstrong>PE 1.1\u003c/strong> — Chương 1 nêu nhiều ưu điểm của database system. Hãy nêu \u003cstrong>hai nhược điểm\u003c/strong>.","answer":"\u003col>\u003cli>Việc cài đặt (setup) database system đòi hỏi nhiều \u003cstrong>kiến thức, tiền bạc, kỹ năng và thời gian\u003c/strong> hơn.\u003c/li>\u003cli>\u003cstrong>Độ phức tạp\u003c/strong> của database có thể dẫn tới \u003cstrong>hiệu năng kém\u003c/strong> (overhead không cần thiết với ứng dụng nhỏ, đơn giản).\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.2\u003c/strong> — Nêu \u003cstrong>năm\u003c/strong> điểm khác nhau giữa hệ thống khai báo kiểu (type declaration) của Java/C++ và data-definition language (DDL) của database.","answer":"\u003col>\u003cli>Thực thi lệnh DDL \u003cstrong>tạo ra object thật\u003c/strong> trong database; khai báo kiểu trong ngôn ngữ lập trình chỉ là \u003cstrong>trừu tượng\u003c/strong> dùng trong chương trình.\u003c/li>\u003cli>DDL cho phép khai báo \u003cstrong>consistency constraints\u003c/strong> (domain constraint, referential integrity…); hệ kiểu của ngôn ngữ lập trình thường không có.\u003c/li>\u003cli>DDL hỗ trợ \u003cstrong>authorization\u003c/strong> — cấp quyền truy cập khác nhau cho từng user; ngôn ngữ lập trình không có (cùng lắm là private/protected giữa các class).\u003c/li>\u003cli>Hệ kiểu của ngôn ngữ lập trình thường \u003cstrong>giàu hơn\u003c/strong> nhiều so với SQL (SQL chủ yếu có số, chuỗi; một số DB có array, object).\u003c/li>\u003cli>DDL tập trung vào \u003cstrong>kiểu của các attribute của relation\u003c/strong>; ngôn ngữ lập trình cho phép tạo \u003cstrong>object và collection of objects\u003c/strong>.\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.3\u003c/strong> — Liệt kê \u003cstrong>sáu bước chính\u003c/strong> khi xây dựng một database cho một doanh nghiệp cụ thể.","answer":"\u003col>\u003cli>Xác định \u003cstrong>yêu cầu mức cao\u003c/strong> của doanh nghiệp → tài liệu \u003cem>system requirements specification\u003c/em>.\u003c/li>\u003cli>Xác định \u003cstrong>model\u003c/strong> chứa mọi loại dữ liệu và mối quan hệ cần thiết (ví dụ E-R model).\u003c/li>\u003cli>Xác định \u003cstrong>integrity constraints\u003c/strong> trên dữ liệu.\u003c/li>\u003cli>Xác định \u003cstrong>mức vật lý\u003c/strong> (physical level).\u003c/li>\u003cli>Với mỗi bài toán thường xuyên (công việc của nhân viên, người dùng web), thiết kế \u003cstrong>giao diện người dùng\u003c/strong> và viết \u003cstrong>application programs\u003c/strong> thực hiện nó.\u003c/li>\u003cli>\u003cstrong>Tạo và khởi tạo\u003c/strong> (create/initialize) database.\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.4\u003c/strong> — Xây dựng một video site kiểu YouTube. Với \u003cstrong>từng\u003c/strong> nhược điểm của file-processing system ở Section 1.2, hãy bàn xem nó có liên quan tới việc lưu \u003cstrong>dữ liệu video\u003c/strong> và \u003cstrong>metadata\u003c/strong> (title, người upload, tag, ai đã xem) hay không.","answer":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nhược điểm\u003c/th>\u003cth>Đánh giá\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Data redundancy & inconsistency\u003c/td>\u003ctd>Liên quan phần nào tới \u003cstrong>metadata\u003c/strong>; không liên quan tới video (video không bị cập nhật). Ít mối quan hệ nên ít dư thừa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Difficulty in accessing data\u003c/td>\u003ctd>Nếu chỉ truy cập qua vài giao diện định sẵn thì không sao; nhưng muốn tìm theo điều kiện phức tạp trên metadata thì lưu trong file sẽ phải viết chương trình riêng → cần database.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data isolation\u003c/td>\u003ctd>Không lớn: dữ liệu chủ yếu được \u003cstrong>tạo mới\u003c/strong> chứ không sửa; lịch sử xem cũng append-only. Có thể có vấn đề nếu có thêm phân quyền.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity problems\u003c/td>\u003ctd>Ít ràng buộc ngoài primary key; nếu dữ liệu phân tán thì khó bảo đảm primary key. Không phải vấn đề lớn.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atomicity problems\u003c/td>\u003ctd>\u003cstrong>Quan trọng\u003c/strong>: upload video thì video và metadata phải được thêm \u003cstrong>cùng lúc\u003c/strong> (atomic), cần cơ chế recovery khi lỗi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concurrent-access anomalies\u003c/td>\u003ctd>Ít xảy ra vì dữ liệu không bị cập nhật.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security problems\u003c/td>\u003ctd>Liên quan nếu hệ thống có phân quyền (video riêng tư…).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"q":"\u003cstrong>PE 1.5\u003c/strong> — Keyword query của web search khác database query thế nào, về \u003cstrong>cách đặc tả\u003c/strong> truy vấn và về \u003cstrong>kết quả\u003c/strong>?","answer":"\u003cul>\u003cli>\u003cstrong>Đặc tả\u003c/strong>: web search chỉ là danh sách từ khoá, \u003cstrong>không có cú pháp\u003c/strong> cụ thể; database query có \u003cstrong>cú pháp chặt chẽ\u003c/strong> (SQL), cho phép diễn đạt truy vấn phức tạp (join, aggregate, subquery…).\u003c/li>\u003cli>\u003cstrong>Kết quả\u003c/strong>: web search trả về \u003cstrong>danh sách URL có xếp hạng\u003c/strong> kèm đoạn trích nội dung; trong mô hình quan hệ kết quả \u003cstrong>luôn là một bảng\u003c/strong> (relation).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 2.1\u003c/strong> — Với Employee database (Figure 2.17): employee(ID, person_name, street, city), works(ID, company_name, salary), company(company_name, city). Primary key thích hợp là gì?","answer":"\u003cul>\u003cli>employee(\u003cstrong>ID\u003c/strong>, person_name, street, city)\u003c/li>\u003cli>works(\u003cstrong>ID\u003c/strong>, company_name, salary) — mỗi người làm cho một công ty\u003c/li>\u003cli>company(\u003cstrong>company_name\u003c/strong>, city)\u003c/li>\u003c/ul>\n\u003cp>\u003cem>Lưu ý dữ liệu mẫu:\u003c/em> bảng \u003ccode>company\u003c/code> trong Practice Lab dùng khoá (company_name, city) vì PE 3.9e giả sử một công ty có thể ở nhiều thành phố.\u003c/p>"},{"q":"\u003cstrong>PE 2.2\u003c/strong> — Xét foreign key từ instructor.dept_name tới department. Cho ví dụ một \u003cstrong>insert\u003c/strong> và một \u003cstrong>delete\u003c/strong> có thể vi phạm ràng buộc này.","answer":"\u003cul>\u003cli>\u003cstrong>Insert\u003c/strong> tuple (10111, Ostrom, Economics, 110000) vào \u003cstrong>instructor\u003c/strong> khi bảng department không có khoa Economics → vi phạm.\u003c/li>\u003cli>\u003cstrong>Delete\u003c/strong> tuple (Biology, Watson, 90000) khỏi \u003cstrong>department\u003c/strong> khi vẫn còn instructor (hoặc student) có dept_name = Biology → vi phạm.\u003c/li>\u003c/ul>\n\u003cp>Trong schema của Practice Lab, các foreign key tới department khai báo \u003ccode>on delete set null\u003c/code> nên delete Biology \u003cstrong>không\u003c/strong> bị từ chối mà dept_name của Crick bị đặt thành null (xem bài GK1.02). Với foreign key không có hành động kèm theo, delete sẽ bị từ chối.\u003c/p>"},{"q":"\u003cstrong>PE 2.3\u003c/strong> — Một time slot có thể họp nhiều lần trong tuần. Giải thích vì sao \u003cstrong>day\u003c/strong> và \u003cstrong>start_time\u003c/strong> thuộc primary key của time_slot còn \u003cstrong>end_time\u003c/strong> thì không.","answer":"\u003cul>\u003cli>Một lớp (cùng time_slot_id) thường học \u003cstrong>nhiều ngày\u003c/strong> khác nhau trong tuần, thậm chí nhiều lần một ngày → chỉ time_slot_id không đủ phân biệt, cần thêm \u003cstrong>day\u003c/strong> và \u003cstrong>start_time\u003c/strong>.\u003c/li>\u003cli>Một lớp bắt đầu vào một thời điểm cụ thể của một ngày thì \u003cstrong>chỉ kết thúc vào một thời điểm\u003c/strong> → end_time bị xác định bởi (time_slot_id, day, start_time), thêm vào sẽ làm key không còn tối thiểu.\u003c/li>\u003c/ul>\n\u003cp>(Trong dữ liệu mẫu, start_time được tách thành start_hr, start_min.)\u003c/p>"},{"q":"\u003cstrong>PE 2.4\u003c/strong> — Trong instance của instructor (Figure 2.1) không có hai instructor trùng tên. Có thể kết luận name là superkey (hoặc primary key) của instructor không?","answer":"\u003cp>\u003cstrong>Không.\u003c/strong> Với instance này tên là duy nhất, nhưng nói chung không đảm bảo (trừ khi trường có quy định không ai được trùng tên — rất khó xảy ra). Key là ràng buộc phải đúng với \u003cstrong>mọi instance hợp lệ\u003c/strong>, không suy ra từ một instance. Bài GK1.04 chèn thêm một \"Einstein\" thứ hai — database chấp nhận, chứng tỏ name không phải key.\u003c/p>"},{"q":"\u003cstrong>PE 2.5\u003c/strong> — Kết quả của σ\u003csub>s_id=ID\u003c/sub>(student × advisor) là gì?","answer":"\u003cp>Schema kết quả gồm \u003cstrong>mọi attribute của student rồi tới mọi attribute của advisor\u003c/strong> (ID, name, dept_name, tot_cred, s_id, i_id).\u003c/p>\n\u003cul>\u003cli>Với mỗi sinh viên \u003cstrong>có advisor\u003c/strong>: một dòng gồm thông tin sinh viên, s_id (bằng ID) và i_id (ID của advisor).\u003c/li>\u003cli>Sinh viên \u003cstrong>không có advisor\u003c/strong> không xuất hiện.\u003c/li>\u003cli>Sinh viên có \u003cstrong>nhiều advisor\u003c/strong> xuất hiện nhiều lần tương ứng.\u003c/li>\u003c/ul>\n\u003cp>SQL: \u003ccode>select * from student, advisor where s_id = student.ID\u003c/code> (GK1.05).\u003c/p>"},{"q":"\u003cstrong>PE 2.6\u003c/strong> — Viết biểu thức đại số quan hệ trên Employee database: (a) tên nhân viên sống ở Miami; (b) tên nhân viên có salary > 100000; (c) tên nhân viên sống ở Miami \u003cstrong>và\u003c/strong> salary > 100000.","answer":"\u003cp>a. Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\"\u003c/sub>(employee))\u003cbr>b. Π\u003csub>person_name\u003c/sub>(σ\u003csub>salary>100000\u003c/sub>(employee ⋈ works))\u003cbr>c. Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\" ∧ salary>100000\u003c/sub>(employee ⋈ works))\u003c/p>\n\u003cp>SQL tương ứng: GK1.07, GK1.08, GK1.09. Nhớ Π loại trùng → \u003ccode>select distinct\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 2.7\u003c/strong> — Bank database: (a) tên các branch ở Chicago; (b) ID những borrower có loan ở branch Downtown.","answer":"\u003cp>a. Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city=\"Chicago\"\u003c/sub>(branch))\u003cbr>b. Π\u003csub>ID\u003c/sub>(σ\u003csub>branch_name=\"Downtown\"\u003c/sub>(borrower ⋈\u003csub>borrower.loan_number=loan.loan_number\u003c/sub> loan))\u003c/p>\n\u003cp>SQL: GK1.10, GK1.11.\u003c/p>"},{"q":"\u003cstrong>PE 2.8\u003c/strong> — Employee database: (a) ID và tên mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho BigBank; (b) ID và tên mỗi nhân viên có lương \u003cstrong>ít nhất bằng mọi\u003c/strong> nhân viên khác.","answer":"\u003cp>a. Tìm những người làm cho BigBank rồi lấy phần bù:\u003c/p>\n\u003cp>Π\u003csub>ID,person_name\u003c/sub>(employee) − Π\u003csub>ID,person_name\u003c/sub>(employee ⋈\u003csub>employee.ID=works.ID\u003c/sub> σ\u003csub>company_name=\"BigBank\"\u003c/sub>(works))\u003c/p>\n\u003cp>b. Tìm những người \u003cstrong>có ai đó lương cao hơn\u003c/strong> (so sánh hai tuple của cùng relation → rename), rồi lấy phần bù:\u003c/p>\n\u003cp>Π\u003csub>ID,person_name\u003c/sub>(employee ⋈ works) − Π\u003csub>A.ID,A.person_name\u003c/sub>(ρ\u003csub>A\u003c/sub>(employee ⋈ works) ⋈\u003csub>A.salary\u003cB.salary\u003c/sub> ρ\u003csub>B\u003c/sub>(employee ⋈ works))\u003c/p>\n\u003cp>\u003cem>Lưu ý:\u003c/em> lời giải của sách viết ρ\u003csub>A\u003c/sub>(employee) và A.salary, nhưng salary nằm trong works nên phải join với works. Nếu dùng Π(employee) ở vế trái, người \u003cstrong>không có trong works\u003c/strong> (không có lương, như Leo Vu trong dữ liệu mẫu) cũng lọt vào kết quả — vì vậy vế trái cũng phải là employee ⋈ works.\u003c/p>\n\u003cp>SQL: GK1.12, GK1.13.\u003c/p>"},{"q":"\u003cstrong>PE 2.9\u003c/strong> — Định nghĩa phép chia r ÷ s. (a) Dùng phép chia tìm ID các sinh viên đã học \u003cstrong>tất cả\u003c/strong> course của khoa Comp. Sci. (b) Viết lại không dùng phép chia.","answer":"\u003cp>a. Π\u003csub>ID,course_id\u003c/sub>(takes) ÷ Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(course))\u003c/p>\n\u003cp>b. Đặt r ← Π\u003csub>ID,course_id\u003c/sub>(takes), s ← Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(course)):\u003c/p>\n\u003cp>Π\u003csub>ID\u003c/sub>(takes) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(takes) × s) − r)\u003c/p>\n\u003cp>Tổng quát: r ÷ s = Π\u003csub>R−S\u003c/sub>(r) − Π\u003csub>R−S\u003c/sub>((Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r)).\u003c/p>\n\u003cp>Giải thích: Π\u003csub>R−S\u003c/sub>(r) cho mọi tuple thoả điều kiện 1 của định nghĩa. (Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r) là các cặp (ứng viên, phần tử của s) \u003cstrong>không có\u003c/strong> trong r; ứng viên xuất hiện trong đó vi phạm điều kiện \"với mọi t\u003csub>s\u003c/sub> ∈ s\" nên bị trừ đi.\u003c/p>\n\u003cp>\u003cem>Trên dữ liệu mẫu\u003c/em>, không sinh viên nào học đủ 5 course Comp. Sci. nên kết quả (a) \u003cstrong>rỗng\u003c/strong>. Bài GK1.14 vì vậy chấm phiên bản khoa \u003cstrong>Physics\u003c/strong>; GK1.15–GK1.16 luyện công thức (b) với một divisor cho kết quả khác rỗng.\u003c/p>"}],"exercises":[{"id":"GK1.01","topic":"PE 2.1 primary key","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.1\u003c/strong> — Tạo ba bảng \u003ccode>gk_employee(ID, person_name, street, city)\u003c/code>, \u003ccode>gk_works(ID, company_name, salary)\u003c/code>, \u003ccode>gk_company(company_name, city)\u003c/code> với \u003cstrong>primary key đúng như lời giải PE 2.1\u003c/strong> (kiểu dữ liệu tuỳ chọn).\u003c/p>","hint":"employee: ID; works: ID; company: company_name.","solution":"create table gk_employee (ID varchar(5) primary key, person_name varchar(30), street varchar(30), city varchar(30));\ncreate table gk_works (ID varchar(5) primary key, company_name varchar(30), salary numeric(10,2));\ncreate table gk_company (company_name varchar(30) primary key, city varchar(30));","check":"select k.table_name, k.column_name\nfrom information_schema.table_constraints t\njoin information_schema.key_column_usage k on k.constraint_name = t.constraint_name and k.table_name = t.table_name\nwhere t.constraint_type = 'PRIMARY KEY' and t.table_name in ('gk_employee', 'gk_works', 'gk_company')\norder by k.table_name, k.column_name;","ordered":false,"fresh":false,"expected":{"fields":["table_name","column_name"],"rows":[["gk_company","company_name"],["gk_employee","id"],["gk_works","id"]]}},{"id":"GK1.02","topic":"PE 2.2 foreign key","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.2\u003c/strong> — Viết \u003cstrong>một câu select\u003c/strong> trả về 3 cột: (1) kết quả \u003ccode>try_sql\u003c/code> khi insert \u003ccode>('10111', 'Ostrom', 'Economics', 110000)\u003c/code> vào instructor; (2) kết quả \u003ccode>try_sql\u003c/code> khi delete khoa \u003ccode>Biology\u003c/code> khỏi department; (3) số instructor có \u003ccode>dept_name is null\u003c/code> \u003cstrong>sau\u003c/strong> lệnh delete (dùng \u003ccode>sql_value\u003c/code>).\u003c/p>","hint":"try_sql trả về 'ok' hoặc SQLSTATE (23503 = foreign key). Schema khai báo on delete set null nên delete không lỗi.","solution":"select try_sql($$insert into instructor values ('10111', 'Ostrom', 'Economics', 110000)$$) as insert_economics,\n       try_sql($$delete from department where dept_name = 'Biology'$$) as delete_biology,\n       sql_value($$select count(*) from instructor where dept_name is null$$) as instructors_without_dept;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["insert_economics","delete_biology","instructors_without_dept"],"rows":[["23503","ok","1"]]}},{"id":"GK1.03","topic":"PE 2.3 time_slot key","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.3\u003c/strong> — Minh hoạ vì sao time_slot_id không đủ làm khoá: liệt kê các \u003ccode>time_slot_id\u003c/code> họp \u003cstrong>nhiều hơn một lần\u003c/strong> trong tuần cùng số lần họp (\u003ccode>num_meetings\u003c/code>).\u003c/p>","hint":"","solution":"select time_slot_id, count(*) as num_meetings\nfrom time_slot\ngroup by time_slot_id\nhaving count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["time_slot_id","num_meetings"],"rows":[["B","3"],["C","3"],["D","3"],["E","2"],["F","2"],["G","3"],["A","3"]]}},{"id":"GK1.04","topic":"PE 2.4 superkey","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.4\u003c/strong> — Chèn instructor \u003ccode>('99001', 'Einstein', 'Comp. Sci.', 70000)\u003c/code> rồi trả về các instructor tên \u003ccode>Einstein\u003c/code> (ID, name, dept_name). Database chấp nhận → name \u003cstrong>không\u003c/strong> phải superkey.\u003c/p>","hint":"","solution":"insert into instructor values ('99001', 'Einstein', 'Comp. Sci.', 70000);\nselect ID, name, dept_name from instructor where name = 'Einstein';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name"],"rows":[["22222","Einstein","Physics"],["99001","Einstein","Comp. Sci."]]}},{"id":"GK1.05","topic":"PE 2.5 σ over ×","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.5\u003c/strong> — Viết SQL cho σ\u003csub>s_id=ID\u003c/sub>(student × advisor) (giữ mọi cột của cả hai bảng).\u003c/p>","hint":"","solution":"select * from student, advisor where advisor.s_id = student.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","s_id","i_id"],"rows":[["00128","Zhang","Comp. Sci.","102","00128","45565"],["12345","Shankar","Comp. Sci.","32","12345","10101"],["23121","Chavez","Finance","110","23121","76543"],["44553","Peltier","Physics","56","44553","22222"],["45678","Levy","Physics","46","45678","22222"],["76543","Brown","Comp. Sci.","58","76543","45565"],["76653","Aoi","Elec. Eng.","60","76653","98345"],["98765","Bourikas","Elec. Eng.","98","98765","98345"],["98988","Tanaka","Biology","120","98988","76766"]]}},{"id":"GK1.06","topic":"PE 2.5 missing tuples","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.5 (mở rộng)\u003c/strong> — Những sinh viên nào \u003cstrong>không xuất hiện\u003c/strong> trong kết quả của σ\u003csub>s_id=ID\u003c/sub>(student × advisor)? Trả về ID, name.\u003c/p>","hint":"Sinh viên không có advisor: dùng except hoặc not in.","solution":"select ID, name from student\nexcept\nselect student.ID, student.name from student, advisor where advisor.s_id = student.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["55739","Sanchez"],["19991","Brandt"],["54321","Williams"],["70557","Snow"]]}},{"id":"GK1.07","topic":"PE 2.6a σ, Π","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6a\u003c/strong> — Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\"\u003c/sub>(employee)).\u003c/p>","hint":"","solution":"-- Π_person_name(σ_city='Miami'(employee))\nselect distinct person_name from employee where city = 'Miami';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Alice Nguyen"],["Bob Tran"],["Eva Vo"],["Grace Ho"],["Jack Ngo"]]}},{"id":"GK1.08","topic":"PE 2.6b join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6b\u003c/strong> — Tên mỗi nhân viên có salary > 100000: Π\u003csub>person_name\u003c/sub>(σ\u003csub>salary>100000\u003c/sub>(employee ⋈ works)).\u003c/p>","hint":"","solution":"-- Π_person_name(σ_salary>100000(employee ⋈ works))\nselect distinct person_name\nfrom employee natural join works\nwhere salary > 100000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Grace Ho"],["Henry Bui"]]}},{"id":"GK1.09","topic":"PE 2.6c join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6c\u003c/strong> — Tên mỗi nhân viên sống ở Miami \u003cstrong>và\u003c/strong> có salary > 100000.\u003c/p>","hint":"","solution":"-- Π_person_name(σ_city='Miami' ∧ salary>100000(employee ⋈ works))\nselect distinct person_name\nfrom employee natural join works\nwhere city = 'Miami' and salary > 100000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Grace Ho"]]}},{"id":"GK1.10","topic":"PE 2.7a σ, Π","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.7a\u003c/strong> (Bank database) — Tên mỗi branch ở Chicago.\u003c/p>","hint":"","solution":"-- Π_branch_name(σ_branch_city='Chicago'(branch))\nselect distinct branch_name from branch where branch_city = 'Chicago';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Chicago Loop"],["Lakeview"]]}},{"id":"GK1.11","topic":"PE 2.7b θ-join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.7b\u003c/strong> — ID mỗi borrower có loan ở branch Downtown.\u003c/p>","hint":"","solution":"-- Π_ID(σ_branch_name='Downtown'(borrower ⋈_{borrower.loan_number=loan.loan_number} loan))\nselect distinct borrower.ID\nfrom borrower join loan on borrower.loan_number = loan.loan_number\nwhere loan.branch_name = 'Downtown';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["19283"],["78901"],["92345"]]}},{"id":"GK1.12","topic":"PE 2.8a set difference","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.8a\u003c/strong> — ID và tên mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho BigBank (kể cả người không có trong works). Viết theo đúng cấu trúc đại số: tất cả \u003cstrong>trừ\u003c/strong> (\u003ccode>except\u003c/code>) những người làm cho BigBank.\u003c/p>","hint":"","solution":"-- Π_ID,person_name(employee) − Π_ID,person_name(employee ⋈ σ_company_name='BigBank'(works))\nselect ID, person_name from employee\nexcept\nselect employee.ID, person_name\nfrom employee join works on employee.ID = works.ID\nwhere company_name = 'BigBank';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name"],"rows":[["10009","Ivy Dang"],["10012","Leo Vu"],["10003","Carol Le"],["10006","Frank Do"],["10001","Alice Nguyen"],["10010","Jack Ngo"],["10005","Eva Vo"],["10013","Mia Ta"],["10004","David Pham"],["10011","Kim Ly"],["12345","Zoe Mai"],["10002","Bob Tran"]]}},{"id":"GK1.13","topic":"PE 2.8b rename","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.8b\u003c/strong> — ID và tên mỗi nhân viên có lương \u003cstrong>ít nhất bằng mọi\u003c/strong> nhân viên. Viết theo cấu trúc đại số: (người có lương) \u003cstrong>trừ\u003c/strong> (người mà có ai đó lương cao hơn — dùng hai bí danh A, B của \u003ccode>employee natural join works\u003c/code>). Không dùng \u003ccode>max\u003c/code>.\u003c/p>","hint":"from (employee natural join works) as A, (employee natural join works) as B where A.salary \u003c B.salary","solution":"-- Π_ID,person_name(employee ⋈ works)\n--   − Π_A.ID,A.person_name(ρ_A(employee ⋈ works) ⋈_{A.salary \u003c B.salary} ρ_B(employee ⋈ works))\nselect ID, person_name from employee natural join works\nexcept\nselect A.ID, A.person_name\nfrom (employee natural join works) as A, (employee natural join works) as B\nwhere A.salary \u003c B.salary;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name"],"rows":[["10007","Grace Ho"]]}},{"id":"GK1.14","topic":"PE 2.9a division","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.9a (biến thể)\u003c/strong> — ID các sinh viên đã học \u003cstrong>tất cả\u003c/strong> course của khoa \u003cstrong>Physics\u003c/strong>: Π\u003csub>ID,course_id\u003c/sub>(takes) ÷ Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Physics\"\u003c/sub>(course)). (Với Comp. Sci. như trong sách, kết quả trên dữ liệu mẫu là rỗng.) Dùng \u003ccode>not exists (... except ...)\u003c/code>.\u003c/p>","hint":"Với mỗi sinh viên S: không tồn tại course Physics nào mà S chưa học.","solution":"select distinct S.ID\nfrom takes as S\nwhere not exists (\n  (select course_id from course where dept_name = 'Physics')\n  except\n  (select T.course_id from takes as T where T.ID = S.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["44553"]]}},{"id":"GK1.15","topic":"PE 2.9b division by formula","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.9b\u003c/strong> — Viết phép chia \u003cstrong>bằng công thức\u003c/strong> Π\u003csub>ID\u003c/sub>(r) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(r) × s) − r) với r = Π\u003csub>ID,course_id\u003c/sub>(takes) và s = các course mà sinh viên \u003ccode>00128\u003c/code> (Zhang) đã học. Kết quả: ID các sinh viên đã học \u003cstrong>mọi\u003c/strong> course của Zhang.\u003c/p>","hint":"Dùng with r as (...), s as (...); phép × là cross join; − là except.","solution":"with r as (select distinct ID, course_id from takes),\n     s as (select distinct course_id from takes where ID = '00128')\nselect ID from r\nexcept\nselect ID from (\n  select c.ID, s.course_id from (select distinct ID from r) as c cross join s\n  except\n  select ID, course_id from r) as missing;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["00128"]]}},{"id":"GK1.16","topic":"PE 2.9 division check","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.9 (kiểm tra lại)\u003c/strong> — Cùng truy vấn với GK1.15 nhưng viết bằng \u003ccode>group by ... having count(distinct course_id) = (select count(*) ...)\u003c/code>: ID các sinh viên đã học mọi course mà \u003ccode>00128\u003c/code> đã học.\u003c/p>","hint":"Chỉ đếm các course nằm trong tập của Zhang.","solution":"select ID\nfrom takes\nwhere course_id in (select course_id from takes where ID = '00128')\ngroup by ID\nhaving count(distinct course_id) = (select count(distinct course_id) from takes where ID = '00128');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["00128"],["12345"]]}}]},{"key":"gk2","store":"gk2","short":"GK2","label":"Ôn GK · Phần 2","navLabel":"GK2","kind":"Ôn tập","title":"Practice Exercises — Chapter 3","titleVi":"Practice Exercises Chương 3 (Introduction to SQL)","summary":"\u003ch3>Cách dùng phần này\u003c/h3>\n\u003cp>Toàn bộ Practice Exercises Chương 3 (3.1–3.10, mọi câu a, b, c…) đều có bài SQL \u003cstrong>tự chấm\u003c/strong> trên dữ liệu mẫu: University, Employee database (Figure 3.19), Bank database (Figure 3.18), Insurance database (Figure 3.17), \u003ccode>grade_points\u003c/code>, \u003ccode>marks\u003c/code>. Xem cột/khoá ở \u003cem>Công cụ › Lược đồ cơ sở dữ liệu\u003c/em>. Mỗi bài ghi rõ số PE của sách.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PE\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Bài SQL\u003c/th>\u003cth>Tự luận\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3.1 a–g\u003c/td>\u003ctd>University: credits, Einstein, max salary, enrollment\u003c/td>\u003ctd>GK2.01–GK2.08\u003c/td>\u003ctd>Câu 1, 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.2 a–d\u003c/td>\u003ctd>grade_points, tổng điểm, GPA, null grade\u003c/td>\u003ctd>GK2.09–GK2.13\u003c/td>\u003ctd>Câu 3, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.3 a–c\u003c/td>\u003ctd>update / delete / insert … select\u003c/td>\u003ctd>GK2.14–GK2.16\u003c/td>\u003ctd>Câu 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.4 a–b\u003c/td>\u003ctd>Insurance database\u003c/td>\u003ctd>GK2.17–GK2.18\u003c/td>\u003ctd>Câu 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.5 a–b\u003c/td>\u003ctd>\u003ccode>case\u003c/code> chấm điểm theo marks\u003c/td>\u003ctd>GK2.19–GK2.20\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.6\u003c/td>\u003ctd>\u003ccode>lower(...) like\u003c/code>\u003c/td>\u003ctd>GK2.21–GK2.22\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.7\u003c/td>\u003ctd>\u003ccode>from p, r1, r2 where ... or ...\u003c/code> khi r1/r2 rỗng\u003c/td>\u003ctd>GK2.23\u003c/td>\u003ctd>Câu 7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.8 a–c\u003c/td>\u003ctd>Bank database\u003c/td>\u003ctd>GK2.24–GK2.26\u003c/td>\u003ctd>Câu 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.9 a–g\u003c/td>\u003ctd>Employee database: all, not exists/except, having\u003c/td>\u003ctd>GK2.27–GK2.33\u003c/td>\u003ctd>Câu 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.10 a–b\u003c/td>\u003ctd>update, \u003ccode>case\u003c/code> trong update\u003c/td>\u003ctd>GK2.34–GK2.36\u003c/td>\u003ctd>Câu 10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Mẫu câu hay thi\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Yêu cầu trong đề\u003c/th>\u003cth>Mẫu SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\"Find all ... earning the highest\"\u003c/td>\u003ctd>\u003ccode>where salary = (select max(salary) from ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"... of each section, show 0 if none\"\u003c/td>\u003ctd>\u003cstrong>scalar subquery\u003c/strong> \u003ccode>(select count(*) ... where ... = section....)\u003c/code> hoặc outer join (Ch.4)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"maximum of an aggregate\"\u003c/td>\u003ctd>\u003ccode>select max(x) from (select ... count(...) as x ... group by ...) t\u003c/code> hoặc \u003ccode>with\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"the ... that had the maximum ...\"\u003c/td>\u003ctd>\u003ccode>with t as (...) select ... from t where x = (select max(x) from t)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"more than every ...\"\u003c/td>\u003ctd>\u003ccode>&gt; all (subquery)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"located in every city where ...\"\u003c/td>\u003ctd>\u003ccode>not exists ((A) except (B))\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"the company with the most employees (ties)\"\u003c/td>\u003ctd>\u003ccode>having count(...) &gt;= all (select count(...) ... group by ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"average higher than ...\"\u003c/td>\u003ctd>\u003ccode>group by ... having avg(...) &gt; (select avg(...) ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"has X but not Y\"\u003c/td>\u003ctd>\u003ccode>(select ...) except (select ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"case-insensitive\"\u003c/td>\u003ctd>\u003ccode>lower(col) like '%sci%'\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"raise 10% unless ..., then 3%\"\u003c/td>\u003ctd>\u003cstrong>một\u003c/strong> \u003ccode>update ... set x = x * case when ... then 1.03 else 1.1 end\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Bẫy thường gặp\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>count(*) vs count(col)\u003c/strong>: với outer join, \u003ccode>count(*)\u003c/code> đếm cả dòng null → section không có ai vẫn ra 1.\u003c/li>\u003cli>\u003cstrong>Join + group by làm mất nhóm rỗng\u003c/strong> (PE 3.1e): section không có sinh viên không có dòng nào để group.\u003c/li>\u003cli>\u003cstrong>Aggregate trên tập rỗng\u003c/strong>: \u003ccode>count\u003c/code> → 0, nhưng \u003ccode>sum/max/avg\u003c/code> → \u003cstrong>null\u003c/strong>; max của kết quả rỗng là \u003cem>rỗng\u003c/em>, không phải 0 (PE 3.1f).\u003c/li>\u003cli>\u003cstrong>Chia cho 0\u003c/strong> khi tính GPA của sinh viên chưa học môn nào (PE 3.2b) → GPA nên là null.\u003c/li>\u003cli>\u003cstrong>null grade\u003c/strong> tự bị loại bởi điều kiện \u003ccode>takes.grade = grade_points.grade\u003c/code> (PE 3.2d) — cả credits lẫn points của môn đó đều không được tính.\u003c/li>\u003cli>\u003cstrong>Cartesian product với bảng rỗng là rỗng\u003c/strong> (PE 3.7): \u003ccode>from p, r1, r2\u003c/code> trả về rỗng nếu r1 \u003cem>hoặc\u003c/em> r2 rỗng, dù điều kiện là \u003ccode>or\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Đếm người, không đếm sự kiện\u003c/strong> (PE 3.4a): \u003ccode>count(distinct ...)\u003c/code>; và đề hỏi \u003cstrong>chủ xe\u003c/strong> (owns), không phải \u003cstrong>người lái\u003c/strong> (participated.driver_id).\u003c/li>\u003cli>\u003cstrong>Thứ tự hai lệnh update\u003c/strong> (PE 3.10b): làm 10% trước rồi 3% sẽ tăng lương hai lần cho một số người.\u003c/li>\u003cli>Schema mẫu có \u003ccode>check (salary &gt; 29000)\u003c/code> trên instructor → lệnh của PE 3.3c (salary 10000) bị \u003cstrong>từ chối\u003c/strong> (SQLSTATE 23514).\u003c/li>\u003cli>Lời giải sách PE 3.8b viết \u003ccode>S.customer_id\u003c/code> — cột đúng là \u003ccode>S.ID\u003c/code>.\u003c/li>\u003c/ul>","quiz":[{"q":"PE 3.1e — Câu \u003ccode>select course_id, sec_id, count(ID) from section natural join takes where semester='Fall' and year=2017 group by course_id, sec_id\u003c/code> sai trong trường hợp nào?","options":["Khi một section có 2 instructor","Khi một section không có sinh viên nào — section đó không xuất hiện","Khi grade là null","Không bao giờ sai"],"answer":1,"explain":"Join không tạo dòng nào cho section rỗng nên nó biến mất; scalar subquery với count trả về 0."},{"q":"PE 3.1e — Scalar subquery \u003ccode>(select count(ID) from takes where ...)\u003c/code> trả về gì cho section không có sinh viên?","options":["null","0","Lỗi","Không có dòng"],"answer":1,"explain":"count trên tập rỗng trả về 0."},{"q":"PE 3.1f — Nếu không section nào ở Fall 2017 có sinh viên, \u003ccode>select max(enrollment) from (... join ... group by ...)\u003c/code> trả về gì?","options":["0","null (một dòng null)","Lỗi","Hai dòng"],"answer":1,"explain":"Subquery rỗng; max trên tập rỗng là null. Sách gọi là \"empty, not 0\"."},{"q":"PE 3.2b — GPA của sinh viên chưa học môn nào nên được định nghĩa thế nào?","options":["0","null","4.0","Bỏ sinh viên đó khỏi mọi báo cáo"],"answer":1,"explain":"sum(credits) = 0 → chia cho 0; cách định nghĩa có nghĩa duy nhất là null."},{"q":"PE 3.2d — Môn có grade null ảnh hưởng thế nào tới truy vấn GPA dùng \u003ccode>takes.grade = grade_points.grade\u003c/code>?","options":["Làm GPA thành null","Môn đó bị loại khỏi cả tử số lẫn mẫu số → GPA vẫn đúng","Gây lỗi chia cho 0","Được tính 0 điểm"],"answer":1,"explain":"null = ... cho unknown nên dòng bị loại trước khi aggregate."},{"q":"PE 3.3b — Câu nào xoá các course chưa bao giờ được mở?","options":["delete from course where course_id in (select course_id from section)","delete from course where course_id not in (select course_id from section)","delete from section where course_id not in (select course_id from course)","delete course where exists (select * from section)"],"answer":1,"explain":"Chưa mở = không xuất hiện trong section."},{"q":"PE 3.3c chạy trên schema của sách (\u003ccode>check (salary &gt; 29000)\u003c/code>) với salary 10000 thì sao?","options":["Chèn thành công","Bị từ chối do vi phạm check constraint","Chèn với salary null","Chỉ chèn sinh viên đầu tiên"],"answer":1,"explain":"Check constraint làm cả câu insert ... select thất bại (SQLSTATE 23514)."},{"q":"PE 3.4a — Vì sao phải dùng \u003ccode>count(distinct ...)\u003c/code> và lấy người từ bảng owns?","options":["Để đếm số vụ tai nạn","Một người có thể dính nhiều vụ (đếm một lần) và đề hỏi chủ xe chứ không phải người lái","Vì owns không có khoá","Không cần distinct"],"answer":1,"explain":"Đề: \"total number of people who OWNED cars that were involved in accidents\"."},{"q":"PE 3.7 — \u003ccode>select p.a1 from p, r1, r2 where p.a1 = r1.a1 or p.a1 = r2.a1\u003c/code> trả về gì khi r2 rỗng?","options":["Các giá trị của p có trong r1","Rỗng","Toàn bộ p","Lỗi"],"answer":1,"explain":"p × r1 × r2 rỗng khi một thừa số rỗng, nên where không còn dòng nào để xét."},{"q":"PE 3.8a — \"customer có account nhưng không có loan\" dùng phép nào?","options":["union","intersect","except","natural join"],"answer":2,"explain":"(select ID from depositor) except (select ID from borrower)."},{"q":"PE 3.9d — \"ID of each employee who earns more than every employee of Small Bank Corporation\" dùng gì?","options":["> some","> all","= any","in"],"answer":1,"explain":"salary > all (select salary from works where company_name = ...)."},{"q":"PE 3.9e — Cấu trúc nào diễn đạt \"located in every city in which Small Bank is located\"?","options":["where city in (select city ...)","where not exists ((cities of Small Bank) except (cities of S))","where exists (cities of Small Bank)","group by city having count(*) > 1"],"answer":1,"explain":"A ⊆ B ⇔ not exists (A except B)."},{"q":"PE 3.9f — Vì sao dùng \u003ccode>having count(distinct ID) &gt;= all (...)\u003c/code> thay vì \u003ccode>order by ... limit 1\u003c/code>?","options":["Nhanh hơn","Để trả về TẤT CẢ công ty khi có hoà","limit không có trong SQL","Vì cần distinct"],"answer":1,"explain":"Đề yêu cầu \"or companies, in the case where there is a tie\"."},{"q":"PE 3.10b — Viết hai lệnh update (3% cho người sẽ vượt 100000, 10% cho người còn lại) thì thứ tự nào an toàn?","options":["10% trước rồi 3%","3% trước rồi 10%","Thứ tự nào cũng được","Phải chạy đồng thời"],"answer":1,"explain":"Nếu tăng 10% trước, một người vừa được tăng có thể thoả điều kiện của lệnh 3% và bị tăng tiếp. An toàn nhất: một lệnh với case."}],"questions":[{"q":"\u003cstrong>PE 3.1e\u003c/strong> — Câu trả lời của sách dùng scalar subquery. Vì sao cách viết \u003ccode>section, takes ... group by\u003c/code> \"trông có vẻ đúng\" lại sai? Sửa thế nào?","answer":"\u003cp>Cách join rồi group by:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select takes.course_id, takes.sec_id, count(ID)\nfrom section, takes\nwhere takes.course_id = section.course_id and takes.sec_id = section.sec_id\n  and takes.semester = section.semester and takes.year = section.year\n  and takes.semester = 'Fall' and takes.year = 2017\ngroup by takes.course_id, takes.sec_id\u003c/code>\u003c/pre>\n\u003cp>Section \u003cstrong>không có sinh viên\u003c/strong> sẽ không có dòng nào trong join nên \u003cstrong>không xuất hiện\u003c/strong> (lẽ ra phải có enrollment 0). Sửa: dùng scalar subquery (count trên tập rỗng = 0) như lời giải, hoặc \u003ccode>section left outer join takes\u003c/code> với \u003ccode>count(takes.ID)\u003c/code> (Chương 4). Bài GK2.06 kiểm tra đúng tình huống này.\u003c/p>"},{"q":"\u003cstrong>PE 3.1f, 3.1g\u003c/strong> — Có bẫy gì khi tìm enrollment lớn nhất, và vì sao nên dùng with clause cho 3.1g?","answer":"\u003cul>\u003cli>3.1f: nếu không section nào có sinh viên, subquery group by rỗng → \u003ccode>max\u003c/code> trả về \u003cstrong>null\u003c/strong> chứ không phải 0. Dùng phiên bản scalar subquery của 3.1e làm subquery thì sẽ ra 0.\u003c/li>\u003cli>3.1g: cần dùng kết quả enrollment \u003cstrong>hai lần\u003c/strong> (lọc và tính max). \u003ccode>with sec_enrollment as (...)\u003c/code> đặt tên cho nó, tránh lặp lại subquery. \u003ccode>count(distinct ID)\u003c/code> không cần vì (ID, course_id, sec_id, semester, year) là khoá của takes.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 3.2a, 3.2b, 3.2c\u003c/strong> — Sinh viên chưa học môn nào được xử lý thế nào trong các truy vấn tổng điểm và GPA?","answer":"\u003cul>\u003cli>3.2a: truy vấn join không có dòng nào cho sinh viên đó → kết quả rỗng thay vì 0. Thêm:\u003c/li>\u003c/ul>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>union\nselect 0 from student\nwhere ID = '12345' and not exists (select * from takes where ID = '12345')\u003c/code>\u003c/pre>\n\u003cul>\u003cli>3.2b: thêm nữa là \u003cstrong>chia cho 0\u003c/strong> (tổng credits = 0) → GPA hợp lý nhất là \u003cstrong>null\u003c/strong>: \u003ccode>union select null as GPA from student where ... not exists ...\u003c/code>.\u003c/li>\u003cli>3.2c: \u003ccode>union select ID, null as GPA from student where not exists (select * from takes where takes.ID = student.ID)\u003c/code> (bài GK2.12).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 3.2d\u003c/strong> — Nếu một số grade là null, các lời giải ở 3.2 còn đúng không?","answer":"\u003cp>\u003cstrong>Vẫn đúng.\u003c/strong> Mọi truy vấn đều có điều kiện \u003ccode>takes.grade = grade_points.grade\u003c/code>; với grade null, so sánh cho \u003cem>unknown\u003c/em> nên dòng takes đó bị loại \u003cstrong>trước khi\u003c/strong> aggregate — cả points lẫn \u003cstrong>credits\u003c/strong> của môn đó đều không được cộng. Vì vậy GPA chỉ tính trên các môn đã có điểm. (Nếu dùng outer join với grade_points thì phải tự loại credits của môn có grade null — xem PE 4.6.)\u003c/p>"},{"q":"\u003cstrong>PE 3.3\u003c/strong> — Viết các lệnh: (a) tăng 10% lương instructor khoa Comp. Sci.; (b) xoá course chưa bao giờ mở; (c) chèn mọi student có tot_cred > 100 làm instructor cùng khoa, lương 10000. Điều gì xảy ra với (c) trên schema của sách?","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>update instructor set salary = salary * 1.10 where dept_name = 'Comp. Sci.';\ndelete from course where course_id not in (select course_id from section);\ninsert into instructor select ID, name, dept_name, 10000 from student where tot_cred &gt; 100;\u003c/code>\u003c/pre>\n\u003cp>Schema DDL của sách khai báo \u003ccode>salary numeric(8,2) check (salary &gt; 29000)\u003c/code> → lệnh (c) vi phạm check constraint và \u003cstrong>cả câu\u003c/strong> bị huỷ (SQLSTATE 23514). Bài GK2.16 dùng lương 30000. Với (b), xoá course có thể kéo theo xoá prereq (\u003ccode>on delete cascade\u003c/code>).\u003c/p>"},{"q":"\u003cstrong>PE 3.4\u003c/strong> — (a) Tổng số người sở hữu xe dính tai nạn năm 2017; (b) xoá mọi xe đời 2010 của người có ID 12345. Lưu ý gì?","answer":"\u003cp>a. Không phải tổng số vụ tai nạn: người dính nhiều vụ chỉ đếm \u003cstrong>một lần\u003c/strong> (\u003ccode>count(distinct ...)\u003c/code>), và phải lấy \u003cstrong>chủ xe\u003c/strong> qua owns — chủ xe có thể không phải người lái.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select count(distinct owns.driver_id)\nfrom accident, participated, owns\nwhere accident.report_number = participated.report_number\n  and owns.license_plate = participated.license_plate\n  and accident.year = 2017;\u003c/code>\u003c/pre>\n\u003cp>b.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>delete from car\nwhere year = 2010 and license_plate in (select license_plate from owns where driver_id = '12345');\u003c/code>\u003c/pre>\n\u003cp>Sách lưu ý: các dòng owns/participated của xe đã xoá \u003cstrong>vẫn còn\u003c/strong> (sách không khai báo foreign key). Trong Practice Lab, owns và participated khai báo \u003ccode>references car on delete cascade\u003c/code> nên chúng bị xoá theo; không có cascade thì PostgreSQL từ chối lệnh delete.\u003c/p>"},{"q":"\u003cstrong>PE 3.7\u003c/strong> — Với \u003ccode>select p.a1 from p, r1, r2 where p.a1 = r1.a1 or p.a1 = r2.a1\u003c/code>, khi nào câu truy vấn chọn đúng các giá trị p.a1 nằm trong r1 hoặc r2? Xét kỹ trường hợp r1 hoặc r2 rỗng.","answer":"\u003cp>Câu truy vấn chọn đúng các p.a1 bằng một giá trị nào đó của r1.a1 hoặc r2.a1 \u003cstrong>khi và chỉ khi cả r1 và r2 đều khác rỗng\u003c/strong>. Nếu r1 hoặc r2 (hoặc p) rỗng thì tích Descartes p × r1 × r2 rỗng → kết quả rỗng, dù điều kiện dùng \u003ccode>or\u003c/code>.\u003c/p>\n\u003cp>Cách viết đúng: \u003ccode>select a1 from p where a1 in (select a1 from r1) or a1 in (select a1 from r2)\u003c/code> hoặc \u003ccode>select a1 from p where a1 in (select a1 from r1 union select a1 from r2)\u003c/code> (bài GK2.23). Ngoài ra bản gốc còn trả về \u003cstrong>trùng lặp\u003c/strong> (mỗi cặp khớp một dòng).\u003c/p>"},{"q":"\u003cstrong>PE 3.8\u003c/strong> — Bank database: (a) ID khách có account nhưng không có loan; (b) ID khách sống cùng street và city với khách 12345; (c) tên branch có ít nhất một khách có account và sống ở Harrison. Có lỗi gì trong lời giải của sách?","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- a\n(select ID from depositor) except (select ID from borrower);\n-- b\nselect F.ID from customer as F, customer as S\nwhere F.customer_street = S.customer_street and F.customer_city = S.customer_city\n  and S.ID = '12345';\n-- c\nselect distinct branch_name\nfrom account, depositor, customer\nwhere customer.ID = depositor.ID and depositor.account_number = account.account_number\n  and customer_city = 'Harrison';\u003c/code>\u003c/pre>\n\u003cp>Lời giải (b) của sách viết \u003ccode>S.customer_id = 12345\u003c/code> nhưng schema chỉ có cột \u003cstrong>ID\u003c/strong> → phải là \u003ccode>S.ID\u003c/code>. Kết quả (b) có cả chính khách 12345; thêm \u003ccode>and F.ID &lt;&gt; S.ID\u003c/code> nếu muốn loại.\u003c/p>"},{"q":"\u003cstrong>PE 3.9\u003c/strong> — Employee database: tóm tắt cách giải a–g và những biến thể cần lưu ý.","answer":"\u003cul>\u003cli>a, b: join employee với works (hoặc \u003ccode>ID in (select ID from works where ...)\u003c/code>).\u003c/li>\u003cli>c: \u003ccode>select ID from works where company_name &lt;&gt; 'First Bank Corporation'\u003c/code> chỉ đúng nếu mọi employee đều có trong works. Nếu có người không làm ở đâu (Leo Vu trong dữ liệu mẫu), dùng \u003ccode>select ID from employee where ID not in (select ID from works where company_name = 'First Bank Corporation')\u003c/code> hoặc outer join.\u003c/li>\u003cli>d: \u003ccode>salary &gt; all (select salary from works where company_name = 'Small Bank Corporation')\u003c/code>. Nếu một người làm nhiều công ty và cần tổng thu nhập thì phức tạp hơn — nhưng ID là khoá của works nên không xảy ra.\u003c/li>\u003cli>e: \u003ccode>not exists ((cities of Small Bank) except (cities of S))\u003c/code> — tập con.\u003c/li>\u003cli>f: \u003ccode>group by company_name having count(distinct ID) &gt;= all (select count(distinct ID) from works group by company_name)\u003c/code> — trả về mọi công ty hoà nhau.\u003c/li>\u003cli>g: \u003ccode>group by company_name having avg(salary) &gt; (select avg(salary) from works where company_name = 'First Bank Corporation')\u003c/code>.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 3.10\u003c/strong> — (a) Nhân viên 12345 chuyển tới Newtown; (b) tăng 10% lương cho mỗi manager của First Bank Corporation, trừ khi lương sau tăng vượt 100000 thì chỉ tăng 3%. Vì sao lời giải hai lệnh update của sách phải chạy đúng thứ tự?","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>update employee set city = 'Newtown' where ID = '12345';\n\nupdate works T\nset salary = T.salary * (case when T.salary * 1.1 &gt; 100000 then 1.03 else 1.1 end)\nwhere T.ID in (select manager_id from manages)\n  and T.company_name = 'First Bank Corporation';\u003c/code>\u003c/pre>\n\u003cp>Bản hai lệnh: lệnh 3% (điều kiện \u003ccode>salary * 1.1 &gt; 100000\u003c/code>) phải chạy \u003cstrong>trước\u003c/strong> lệnh 10% (\u003ccode>salary * 1.1 &lt;= 100000\u003c/code>). Nếu chạy 10% trước, một manager vừa được tăng 10% có thể thoả điều kiện của lệnh 3% và \u003cstrong>bị tăng hai lần\u003c/strong>. Một lệnh với \u003ccode>case\u003c/code> tránh hẳn vấn đề này. (Lời giải in trong sách có ký hiệu \u003ccode>&lt;\u003c/code> và \u003ccode>1:1\u003c/code> do lỗi font — ý là \u003ccode>*\u003c/code> và \u003ccode>1.1\u003c/code>.)\u003c/p>\n\u003cp>Dữ liệu mẫu: manager của First Bank là 10001 (85000 → 93500, tăng 10%) và 10004 (92000 → 94760, tăng 3% vì 92000 × 1.1 > 100000).\u003c/p>"}],"exercises":[{"id":"GK2.01","topic":"PE 3.1a where","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1a\u003c/strong> — Title các course của khoa Comp. Sci. có 3 credits.\u003c/p>","hint":"","solution":"select title from course where dept_name = 'Comp. Sci.' and credits = 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["title"],"rows":[["Robotics"],["Image Processing"],["Database System Concepts"]]}},{"id":"GK2.02","topic":"PE 3.1b join, distinct","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1b\u003c/strong> — ID của mọi sinh viên được dạy bởi một instructor tên Einstein, \u003cstrong>không trùng lặp\u003c/strong>.\u003c/p>","hint":"takes khớp teaches trên (course_id, sec_id, semester, year); teaches.ID = instructor.ID.","solution":"select distinct takes.ID\nfrom takes, instructor, teaches\nwhere takes.course_id = teaches.course_id\n  and takes.sec_id = teaches.sec_id\n  and takes.semester = teaches.semester\n  and takes.year = teaches.year\n  and teaches.ID = instructor.ID\n  and instructor.name = 'Einstein';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["44553"]]}},{"id":"GK2.03","topic":"PE 3.1c max","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1c\u003c/strong> — Lương cao nhất của một instructor.\u003c/p>","hint":"","solution":"select max(salary) from instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["95000"]]}},{"id":"GK2.04","topic":"PE 3.1d subquery","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.1d\u003c/strong> — ID, name của mọi instructor có lương cao nhất (có thể nhiều người).\u003c/p>","hint":"","solution":"select ID, name from instructor where salary = (select max(salary) from instructor);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["22222","Einstein"]]}},{"id":"GK2.05","topic":"PE 3.1e scalar subquery","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1e\u003c/strong> — Enrollment (số sinh viên) của mỗi section mở ở Fall 2017: course_id, sec_id, enrollment. Section không có sinh viên phải có enrollment 0.\u003c/p>","hint":"Scalar subquery trong select.","solution":"select course_id, sec_id,\n       (select count(ID) from takes\n        where takes.year = section.year and takes.semester = section.semester\n          and takes.course_id = section.course_id and takes.sec_id = section.sec_id) as enrollment\nfrom section\nwhere semester = 'Fall' and year = 2017;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-101","1","6"],["CS-347","1","2"],["PHY-101","1","1"]]}},{"id":"GK2.06","topic":"PE 3.1e empty section","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1e (bẫy section rỗng)\u003c/strong> — Tạo view \u003ccode>gk_fall2017_enrollment(course_id, sec_id, enrollment)\u003c/code> chứa enrollment của mỗi section Fall 2017. Khi chấm, hệ thống \u003cstrong>thêm một section Fall 2017 không có sinh viên\u003c/strong> rồi đọc view: section đó phải có enrollment 0.\u003c/p>","hint":"Cách join + group by sẽ làm mất section mới.","solution":"create view gk_fall2017_enrollment (course_id, sec_id, enrollment) as\nselect course_id, sec_id,\n       (select count(ID) from takes\n        where takes.year = section.year and takes.semester = section.semester\n          and takes.course_id = section.course_id and takes.sec_id = section.sec_id)\nfrom section\nwhere semester = 'Fall' and year = 2017;","check":"insert into section values ('CS-190', '3', 'Fall', 2017, 'Taylor', '3128', 'B');\nselect * from gk_fall2017_enrollment;","ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","enrollment"],"rows":[["CS-101","1","6"],["CS-347","1","2"],["PHY-101","1","1"],["CS-190","3","0"]]}},{"id":"GK2.07","topic":"PE 3.1f max of aggregate","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1f\u003c/strong> — Enrollment \u003cstrong>lớn nhất\u003c/strong> trên mọi section ở Fall 2017 (một giá trị).\u003c/p>","hint":"","solution":"select max(enrollment)\nfrom (select count(ID) as enrollment\n      from section, takes\n      where takes.year = section.year and takes.semester = section.semester\n        and takes.course_id = section.course_id and takes.sec_id = section.sec_id\n        and takes.semester = 'Fall' and takes.year = 2017\n      group by takes.course_id, takes.sec_id) as t;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max"],"rows":[["6"]]}},{"id":"GK2.08","topic":"PE 3.1g with","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.1g\u003c/strong> — Các section (course_id, sec_id) có enrollment lớn nhất ở Fall 2017. Dùng \u003ccode>with\u003c/code>.\u003c/p>","hint":"","solution":"with sec_enrollment as (\n  select takes.course_id, takes.sec_id, count(ID) as enrollment\n  from section, takes\n  where takes.year = section.year and takes.semester = section.semester\n    and takes.course_id = section.course_id and takes.sec_id = section.sec_id\n    and takes.semester = 'Fall' and takes.year = 2017\n  group by takes.course_id, takes.sec_id)\nselect course_id, sec_id\nfrom sec_enrollment\nwhere enrollment = (select max(enrollment) from sec_enrollment);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id"],"rows":[["CS-101","1"]]}},{"id":"GK2.09","topic":"PE 3.2a grade points","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2a\u003c/strong> — Tổng grade points (credits × points) mà sinh viên \u003ccode>12345\u003c/code> đạt được qua mọi course đã học. Bảng \u003ccode>grade_points(grade, points)\u003c/code> có sẵn.\u003c/p>","hint":"","solution":"select sum(credits * points)\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\n  and ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sum"],"rows":[["48"]]}},{"id":"GK2.10","topic":"PE 3.2b GPA","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2b\u003c/strong> — GPA của sinh viên \u003ccode>12345\u003c/code>: tổng grade points chia tổng credits của các course tương ứng. Đặt tên cột \u003ccode>GPA\u003c/code>.\u003c/p>","hint":"","solution":"select sum(credits * points) / sum(credits) as GPA\nfrom takes, course, grade_points\nwhere takes.grade = grade_points.grade\n  and takes.course_id = course.course_id\n  and ID = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["gpa"],"rows":[["3.4286"]]}},{"id":"GK2.11","topic":"PE 3.2c group by","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.2c\u003c/strong> — ID và GPA của mỗi sinh viên (chỉ những sinh viên có ít nhất một môn đã có điểm).\u003c/p>","hint":"","solution":"select ID, sum(credits * points) / sum(credits) as GPA\nfro e is null then 0 else credits end.","solution":"select sum(credits * points) / sum(credits) as naive_gpa,\n       sum(credits * points) / sum(case when grade is null then 0 else credits end) as correct_gpa\nfrom takes natural join course left join grade_points using (grade)\nwhere ID = '98988';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["naive_gpa","correct_gpa"],"rows":[["2","4"]]}},{"id":"GK2.14","topic":"PE 3.3a update","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.3a\u003c/strong> — Tăng 10% lương của mỗi instructor khoa Comp. Sci.\u003c/p>","hint":"","solution":"update instructor set salary = salary * 1.10 where dept_name = 'Comp. Sci.';","check":"select ID, salary from instructor order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10101","71500"],["12121","90000"],["15151","40000"],["22222","95000"],["32343","60000"],["33456","87000"],["45565","82500"],["58583","62000"],["76543","80000"],["76766","72000"],["83821","101200"],["98345","80000"]]}},{"id":"GK2.15","topic":"PE 3.3b delete","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.3b\u003c/strong> — Xoá mọi course chưa bao giờ được mở (không xuất hiện trong section).\u003c/p>","hint":"","solution":"delete from course where course_id not in (select course_id from section);","check":"select course_id from course order by course_id;","ordered":false,"fresh":false,"expected":{"fields":["course_id"],"rows":[["BIO-101"],["BIO-301"],["CS-101"],["CS-190"],["CS-315"],["CS-319"],["CS-347"],["EE-181"],["FIN-201"],["HIS-351"],["MU-199"],["PHY-101"]]}},{"id":"GK2.16","topic":"PE 3.3c insert select","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.3c\u003c/strong> — Chèn mọi student có \u003ccode>tot_cred &gt; 100\u003c/code> làm instructor cùng khoa. Sách dùng lương 10000, nhưng schema có \u003ccode>check (salary &gt; 29000)\u003c/code> nên lệnh đó bị từ chối (23514) — hãy dùng lương \u003cstrong>30000\u003c/strong>.\u003c/p>","hint":"","solution":"insert into instructor\nselect ID, name, dept_name, 30000\nfrom student\nwhere tot_cred > 100;","check":"select ID, name, dept_name, salary from instructor where salary = 30000 order by ID;","ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","salary"],"rows":[["00128","Zhang","Comp. Sci.","30000"],["23121","Chavez","Finance","30000"],["98988","Tanaka","Biology","30000"]]}},{"id":"GK2.17","topic":"PE 3.4a count distinct","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.4a\u003c/strong> (Insurance database) — Tổng số người \u003cstrong>sở hữu\u003c/strong> xe có dính tai nạn năm 2017.\u003c/p>","hint":"accident → participated → owns (theo license_plate); count(distinct ...).","solution":"select count(distinct owns.driver_id)\nfrom accident, participated, owns\nwhere accident.report_number = participated.report_number\n  and owns.license_plate = participated.license_plate\n  and accident.year = 2017;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["count"],"rows":[["4"]]}},{"id":"GK2.18","topic":"PE 3.4b delete in","level":2,"prompt":"\u003cp>\u003cstrong>PE 3.4b\u003c/strong> — Xoá mọi xe đời 2010 thuộc về người có driver_id \u003ccode>12345\u003c/code>. (owns và participated khai báo \u003ccode>on delete cascade\u003c/code> tới car.)\u003c/p>","hint":"","solution":"delete from car\nwhere year = 2010\n  and license_plate in (select license_plate from owns where driver_id = '12345');","check":"select license_plate, year,\n       (select count(*) from owns o where o.license_plate = car.license_plate) as num_owners\nfrom car order by license_plate;","ordered":false,"fresh":false,"expected":{"fields":["license_plate","year","num_owners"],"rows":[["CCC333","2015","1"],["DDD444","2010","1"],["EEE555","2018","2"],["FFF666","2020","1"],["GGG777","2012","1"]]}},{"id":"GK2.19","topic":"PE 3.5a case","level":1,"prompt":"\u003cp>\u003cstrong>PE 3.5a\u003c/strong> — Hiển thị ID và grade của mỗi sinh viên trong \u003ccode>marks(ID, score)\u003c/code>: F nếu sc
