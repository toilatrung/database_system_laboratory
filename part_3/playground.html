<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Part 3 — Ôn tập giữa kỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* ---------- LabelX design tokens (light) ---------- */
  :root {
    --canvas: #f7f7f8;
    --surface: #ffffff;
    --surface-sunken: #f3f4f6;
    --surface-selected: #eef0f3;
    --hover: rgba(17,24,39,.045);
    --selected: #e8e9ec;
    --accent: #9d2235;
    --accent-soft: #f7ebed;
    --border: #e3e6ea;
    --border-strong: #8c93a0;
    --ink: #1a1d23;
    --ink-muted: #4b5262;
    --ink-subtle: #5f6570;
    --primary: #1f2933;
    --primary-hover: #38424f;
    --on-primary: #ffffff;
    --focus: #1f2933;
    --success: #146c43;
    --success-soft: #e6f4ec;
    --warning: #8a5300;
    --warning-soft: #fdf2d8;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --info: #1d5ea8;
    --info-soft: #e7effa;
    --neutral: #475061;
    --neutral-soft: #eceef2;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 999px;
    --shadow-menu: 0 8px 24px rgba(17,24,39,0.12);
    --sidebar-width: 264px; --control-height: 32px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--ink); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- App shell: sidebar on the page ground, content beside it ---------- */
  .lx-app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
  .lx-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--space-4);
    padding: var(--space-4) var(--space-3) var(--space-3); border-right: 1px solid var(--border); background: var(--canvas); }
  .lx-brand { display: flex; align-items: center; gap: 10px; padding: var(--space-1) var(--space-2); color: var(--ink); text-decoration: none; }
  .lx-brand__mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent); color: #fff; }
  .lx-brand__mark svg { width: 16px; height: 16px; }
  .lx-brand__name { font: 600 14px/18px var(--font-sans); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-4); margin: 0 calc(-1 * var(--space-1)); padding: 0 var(--space-1); }
  .lx-nav__group { display: flex; flex-direction: column; gap: 2px; }
  .lx-nav__label { padding: 0 var(--space-2) var(--space-1); font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-nav__item { display: flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); border-radius: var(--radius-md);
    color: var(--ink-muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--ink); }
  .lx-nav__item.is-active { background: var(--selected); color: var(--ink); font-weight: 600; }
  .lx-nav__item svg.i { color: var(--ink-subtle); }
  .lx-nav__k { flex: none; width: 44px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k { color: var(--ink-muted); }
  .lx-nav__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart > summary { display: flex; width: 100%; align-items: center; gap: var(--space-2); min-height: 32px; padding: 6px var(--space-2); margin: 0;
    border-radius: var(--radius-md); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); }
  .lx-navpart > summary:hover { background: var(--hover); color: var(--ink); }
  .lx-navpart.is-current > summary { color: var(--ink); font-weight: 600; }
  .lx-navpart > summary svg.i { margin-left: auto; width: 12px; height: 12px; color: var(--ink-subtle); }
  .lx-navpart[open] > summary { margin-bottom: 2px; }
  .lx-navpart__n { flex: none; width: 44px; }
  .lx-navpart__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-navpart__items { display: flex; flex-direction: column; gap: 2px; margin: 0 0 var(--space-2) var(--space-3); padding-left: var(--space-2); border-left: 1px solid var(--border); }
  .lx-sidebar__foot { border-top: 1px solid var(--border); padding-top: var(--space-3); }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- Database signal: green when PostgreSQL is ready ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 var(--space-2);
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 500 13px/1 var(--font-sans); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--ink); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--border-strong); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--success); }
  [data-state="error"] .lx-signal__dot { background: var(--danger); }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lx-pop { position: absolute; bottom: calc(100% + 6px); left: 0; width: 360px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--surface); color: var(--ink); text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop {
    opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-pop__title { font-weight: 600; }
  .lx-pop__body { padding: var(--space-3) var(--space-4); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
  .lx-pop__body p { margin: 0 0 var(--space-2); }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 var(--space-2); }
  .lx-pop__body code { font: 500 12px/1 var(--font-mono); color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--space-3); margin: 0 0 var(--space-2); }
  .lx-pop__body .lx-kv dt { color: var(--ink-subtle); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--ink); font-weight: 500; }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: 10px var(--space-4); border-top: 1px solid var(--border); }

  /* ---------- Motion ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-navpart > summary, .lx-flow__step a, .lx-flow__n, .lx-list > li > a, .lx-opt,
  .lx-table td, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .lx-iconbtn::after { transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { transform: none; }
  details > summary svg.i { transition: transform .2s ease, opacity .2s ease; }
  .lx-progress > i { transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-fade-up .22s ease-out; }
  .lx-page.is-entering { animation: lx-fade-up .24s ease-out; }
  @keyframes lx-fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- Page ---------- */
  .lx-page { max-width: 1200px; margin: 0 auto; padding: var(--space-8) var(--space-8) 64px; display: flex; flex-direction: column; gap: var(--space-6); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
  .lx-head__text { flex: 1 1 520px; max-width: 840px; }
  .lx-eyebrow { font: 400 13px/18px var(--font-sans); color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .lx-h1 { margin: 0 0 6px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .lx-lead { margin: 0; color: var(--ink-muted); }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .lx-cols { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .lx-main { flex: 999 1 560px; min-width: 0; }
  .lx-side { flex: 1 1 320px; min-width: 0; max-width: 100%; overflow: hidden; }
  .lx-subtle { color: var(--ink-subtle); }
  .lx-mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .lx-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-3);
    border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    font: 500 13px/1 var(--font-sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--surface-sunken); }
  .lx-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-btn--primary:hover { background: var(--primary-hover); }
  .lx-btn--ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .lx-btn--ghost:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-btn[disabled] { opacity: .45; cursor: not-allowed; }
  .lx-btn .lx-kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--ink-muted); cursor: pointer; text-decoration: none; }
  .lx-iconbtn:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 2px); right: 0; white-space: nowrap; padding: 4px 8px;
    border-radius: 4px; background: var(--primary); color: var(--on-primary); font: 500 12px/16px var(--font-sans); opacity: 0; pointer-events: none; z-index: 10; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; }

  /* ---------- Badges & tags ---------- */
  .lx-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-sm);
    font: 500 12px/1 var(--font-sans); white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
  .lx-badge--success { background: var(--success-soft); color: var(--success); }
  .lx-badge--warning { background: var(--warning-soft); color: var(--warning); }
  .lx-badge--danger { background: var(--danger-soft); color: var(--danger); }
  .lx-badge--info { background: var(--info-soft); color: var(--info); }
  .lx-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--neutral-soft);
    color: var(--neutral); font: 500 12px/1 var(--font-sans); white-space: nowrap; }

  /* ---------- Card, table, list ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-card__body { padding: var(--space-4); }
  .lx-card__foot { padding: 10px var(--space-4); border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-subtle); display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }
  .lx-card > .lx-scroll:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 10px var(--space-4) 8px; color: var(--ink-subtle);
    font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table tbody tr:hover td { background: var(--surface-sunken); }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table .act { width: 1%; text-align: right; padding-top: 0; padding-bottom: 0; }
  .lx-cell__main { font-weight: 600; color: var(--ink); text-decoration: none; }
  a.lx-cell__main:hover { text-decoration: underline; }
  .lx-cell__sub { font-size: 12px; line-height: 16px; color: var(--ink-subtle); margin-top: 2px; }
  .lx-table--data td, .lx-table--data th { font-family: var(--font-mono); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: pre; padding: 8px var(--space-4); }
  .lx-table--data th { font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); }
  .lx-null { color: var(--ink-subtle); font-style: italic; }

  .lx-list { list-style: none; margin: 0; padding: 0; }
  .lx-list > li > a { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border); text-decoration: none; color: var(--ink); }
  .lx-list > li:last-child > a { border-bottom: 0; }
  .lx-list > li > a:hover { background: var(--surface-sunken); }
  .lx-list > li[aria-selected="true"] > a { background: var(--selected); font-weight: 600; }
  .lx-list__id { font: 500 12px/16px var(--font-mono); width: 36px; flex: none; }
  .lx-list__t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-list--scroll { max-height: 640px; overflow-y: auto; }

  .lx-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lx-kpi { padding: var(--space-4) var(--space-6) 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--border); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .lx-kpi__v { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .lx-kpi__u { font-size: 15px; font-weight: 500; color: var(--ink-subtle); letter-spacing: 0; }
  .lx-kpi__n { font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-kpi .lx-progress { margin-top: 4px; }
  .lx-dash { color: var(--ink-subtle); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Fifteen weeks of the course: this part's weeks tinted, exam weeks marked */
  .lx-weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: var(--space-4); }
  .lx-week { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 64px; padding: 8px 10px; border-radius: var(--radius-md);
    background: var(--surface-sunken); color: var(--ink-muted); font-size: 12px; line-height: 16px; }
  .lx-week__n { font-weight: 600; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lx-week.is-on { background: var(--accent-soft); color: var(--ink-muted); box-shadow: inset 0 -2px 0 var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--accent); }
  .lx-week.is-exam { background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
  .lx-week.is-exam strong { font-weight: 600; }
  .lx-progress { height: 6px; border-radius: 3px; background: var(--neutral-soft); overflow: hidden; min-width: 96px; }
  .lx-progress > i { display: block; height: 100%; background: var(--accent); }

  .lx-callout { border-radius: var(--radius-lg); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--info-soft); color: var(--ink); }
  .lx-callout--success { background: var(--success-soft); }
  .lx-callout--warning { background: var(--warning-soft); }
  .lx-callout--danger { background: var(--danger-soft); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Flow navigation (Tóm tắt → Trắc nghiệm → Tự luận → Bài tập) ---------- */
  .lx-flow { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3) 0 var(--space-4); min-height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-flow__k { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); padding-right: var(--space-4); border-right: 1px solid var(--border); white-space: nowrap; }
  .lx-flow__arrow { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .lx-flow__arrow.is-off { opacity: .35; pointer-events: none; }
  .lx-flow__arrow::after { bottom: auto; top: calc(100% + 4px); right: auto; left: 0; }
  .lx-flow__arrow--next::after { left: auto; right: 0; }
  .lx-flow__steps { flex: 1; display: flex; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-flow__step a { border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); color: var(--ink-muted); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .lx-flow__step a:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-flow__step.is-active a { background: var(--surface-selected); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
  .lx-flow__n { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: 11px; line-height: 1; }
  .lx-flow__step.is-active .lx-flow__n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-flow__sep { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
  .lx-flow__pos { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }

  /* ---------- Reading content (summaries, answers) ---------- */
  .lx-prose { color: var(--ink); line-height: 22px; }
  .lx-prose h3 { font-size: 15px; line-height: 22px; font-weight: 600; margin: var(--space-6) 0 var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .lx-prose h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .lx-prose p { margin: var(--space-2) 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: var(--space-2) 0; }
  .lx-prose li { margin: var(--space-1) 0; }
  .lx-prose code { font: 500 12.5px/1 var(--font-mono); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-prose strong { font-weight: 600; }
  .lx-prose .table-scroll { overflow-x: auto; margin: var(--space-3) 0; border: 1px solid var(--border); border-radius: var(--radius-md); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px var(--space-3); color: var(--ink-subtle); font: 500 12px/16px var(--font-sans); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px var(--space-3); border-bottom: 1px solid var(--border); vertical-align: top; }

  pre.code { font: 500 12.5px/1.6 var(--font-mono); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); overflow-x: auto; margin: var(--space-3) 0; }
  pre.code code { background: none; border: 0; padding: 0; font: inherit; }

  details[open] > summary svg.i { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: var(--space-2); }

  /* ---------- Quiz ---------- */
  .lx-q__opts { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
  .lx-opt { border-radius: var(--radius-md); display: flex; gap: var(--space-3); align-items: flex-start; padding: 10px var(--space-3); border: 1px solid var(--border); background: var(--surface); cursor: pointer; }

  /* ---------- Editor ---------- */
  .lx-editor { width: 100%; min-height: 180px; resize: vertical; display: block;
    font: 500 13px/1.6 var(--font-mono); tab-size: 2; color: var(--ink); background: var(--surface);

  .lx-editor::placeholder { color: var(--ink-subtle); }
  .lx-editor:focus { outline: 2px solid var(--focus); outline-offset: 2px; }

  .lx-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted); cursor: pointer; }
  .lx-check input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
  .lx-en { margin: 0 0 var(--space-3); padding: var(--space-2) var(--space-3); border-left: 2px solid var(--border-strong); background: var(--surface-sunken); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--ink); }
  .lx-en p { margin: 0; }

  /* ---------- FD tool ---------- */
  .lx-fd-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-input { min-height: 0; height: 40px; resize: none; }
  .lx-fd-row { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-fd-select { height: 32px; max-width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; padding: 0 8px; }

  /* Phone and narrow tablet: a 48px top bar, the sidebar becomes a full-screen sheet */
  @media (max-width: 900px) {
    .lx-app { display: block; }
    .lx-mbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: var(--space-2); height: 48px; padding: 0 var(--space-2);
      background: var(--canvas); border-bottom: 1px solid var(--border); }
    .lx-mbar .lx-brand__mark { width: 24px; height: 24px; }
    .lx-mbar__title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lx-mbar .lx-iconbtn { width: 40px; height: 40px; }

    .lx-sidebar { display: none; position: fixed; inset: 48px 0 0; z-index: 24; height: auto; border-right: 0; padding: var(--space-4); }
    .lx-app.is-navopen .lx-sidebar { display: flex; }

    .lx-sidebar > .lx-brand { display: none; }
    .lx-nav__item, .lx-navpart > summary, .lx-signal { min-height: 44px; font-size: 15px; }
    .lx-pop { width: 100%; }
    .lx-page { padding: var(--space-4) var(--space-4) 48px; gap: var(--space-4); }
    .lx-kpi { padding: var(--space-3); }
    .lx-kpi__v { font-size: 22px; line-height: 28px; }

    .lx-kpi__n { display: none; }
    .lx-weeks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lx-flow__k, .lx-flow__pos { display: none; }

am Project Presentation","note":"Song song: ôn cuối kỳ","exam":"","parts":[4]},{"week":15,"content":"Final Exam","note":"Chương 6–7 (+ SQL nền tảng)","exam":"final","parts":[4]}],"setup":["-- =====================================================================\n-- University database — schema (Database System Concepts, 7th Ed.)\n-- Dialect: PostgreSQL (chạy được trên PostgreSQL 12+ và PGlite)\n-- File này xoá và tạo lại toàn bộ bảng, nên có thể chạy lại bất cứ lúc nào.\n-- =====================================================================\n\ndrop table if exists prereq cascade;\ndrop table if exists time_slot cascade;\ndrop table if exists advisor cascade;\ndrop table if exists takes cascade;\ndrop table if exists student cascade;\ndrop table if exists teaches cascade;\ndrop table if exists section cascade;\ndrop table if exists instructor cascade;\ndrop table if exists course cascade;\ndrop table if exists department cascade;\ndrop table if exists classroom cascade;\n\ncreate table classroom (\n  building      varchar(15),\n  room_number   varchar(7),\n  capacity      numeric(4,0),\n  primary key (building, room_number)\n);\n\ncreate table department (\n  dept_name     varchar(20),\n  building      varchar(15),\n  budget        numeric(12,2) check (budget > 0),\n  primary key (dept_name)\n);\n\ncreate table course (\n  course_id     varchar(8),\n  title         varchar(50),\n  dept_name     varchar(20),\n  credits       numeric(2,0) check (credits > 0),\n  primary key (course_id),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table instructor (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  salary        numeric(8,2) check (salary > 29000),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table section (\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar( uper(person, supervisor)\ncreate table emp_super (\n  person      varchar(20) primary key,\n  supervisor  varchar(20)\n);\ninsert into emp_super values\n  ('Bob',   'Alice'),\n  ('Mary',  'Susan'),\n  ('Alice', 'David'),\n  ('David', 'Mary'),\n  ('Tom',   'Bob'),\n  ('Eve',   'Alice');\n\n-- Điểm số quy đổi của từng letter grade\ncreate table grade_points (\n  grade   varchar(2) primary key,\n  points  numeric(2,1)\n);\ninsert into grade_points values\n  ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n  ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('F', 0.0);\n\n-- Slide 5: student_grades(ID, GPA) và dept_grades(ID, dept_name, GPA)\n-- GPA = sum(points * credits) / sum(credits), bỏ qua môn chưa có điểm.\n-- Sinh viên chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ( td>\u003c/tr>\u003ctr>\u003ctd>1.2\u003c/td>\u003ctd>5 điểm khác nhau giữa type declaration (Java/C++) và DDL\u003c/td>\u003ctd>Câu 2\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.3\u003c/td>\u003ctd>6 bước xây dựng database cho một doanh nghiệp\u003c/td>\u003ctd>Câu 3\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.4\u003c/td>\u003ctd>Video site kiểu YouTube vs file-processing system\u003c/td>\u003ctd>Câu 4\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.5\u003c/td>\u003ctd>Keyword query (web search) vs database query\u003c/td>\u003ctd>Câu 5\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.1\u003c/td>\u003ctd>Primary key của Employee database\u003c/td>\u003ctd>Câu 6\u003c/td>\u003ctd>GK1.01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.2\u003c/td>\u003ctd>Insert/delete vi phạm foreign key\u003c/td>\u003ctd>Câu 7\u003c/td>\u003ctd>GK1.02\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.3\u003c/td>\u003ctd>Vì sao day, start_time thuộc khoá của time_slot, end_time thì không\u003c/td>\u003ctd>Câu 8\u003c/td>\u003ctd>GK1.03\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.4\u003c/td>\u003ctd>name có là superkey của instructor không?\u003c/td>\u003ctd>Câu 9\u003c/td>\u003ctd>GK1.04\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.5\u003c/td>\u003ctd>σ\u003csub>s_id=ID\u003c/sub>(student × advisor)\u003c/td>\u003ctd>Câu 10\u003c/td>\u003ctd>GK1.05, GK1.06\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.6 a–c\u003c/td>\u003ctd>Đại số quan hệ trên Employee database\u003c/td>\u003ctd>Câu 11\u003c/td>\u003ctd>GK1.07–GK1.09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.7 a–b\u003c/td>\u003ctd>Đại số quan hệ trên Bank database\u003c/td>\u003ctd>Câu 12\u003c/td>\u003ctd>GK1.10–GK1.11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.8 a–b\u003c/td>\u003ctd>Set difference, rename\u003c/td>\u003ctd>Câu 13\u003c/td>\u003ctd>GK1.12–GK1.13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.9 a–b\u003c/td>\u003ctd>Phép chia (division)\u003c/td>\u003ctd>Câu 14\u003c/td>\u003ctd>GK1.14–GK1.16\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Chương 1 — ý chính hay thi\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Nhược điểm của file-processing system\u003c/strong> (Section 1.2): data redundancy & inconsistency, difficulty in accessing data, data isolation, integrity problems, atomicity problems, concurrent-access anomalies, security problems. PE 1.4 bắt bạn đánh giá \u003cem>từng\u003c/em> điểm cho một ứng dụng cụ thể.\u003c/li>\u003cli>\u003cstrong>Nhược điểm của DBMS\u003c/strong> (PE 1.1): tốn chi phí/kiến thức/thời gian cài đặt; độ phức tạp có thể làm hiệu năng kém (với ứng dụng đơn giản).\u003c/li>\u003cli>\u003cstrong>DDL ≠ type declaration\u003c/strong> (PE 1.2): DDL \u003cem>tạo object thật\u003c/em> trong database, khai báo được \u003cstrong>constraint\u003c/strong> (domain, referential integrity), có \u003cstrong>authorization\u003c/strong>; hệ kiểu của ngôn ngữ lập trình \u003cem>giàu hơn\u003c/em> nhưng chỉ là trừu tượng trong chương trình.\u003c/li>\u003cli>\u003cstrong>Database query vs keyword query\u003c/strong> (PE 1.5): SQL có cú pháp chặt, diễn đạt truy vấn phức tạp, \u003cstrong>kết quả luôn là một bảng\u003c/strong>; web search nhận danh sách từ khoá, trả về danh sách URL \u003cstrong>xếp hạng\u003c/strong> kèm snippet.\u003c/li>\u003c/ul>\n\u003ch3>Chương 2 — keys\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Khái niệm\u003c/th>\u003cth>Định nghĩa\u003c/th>\u003cth>Bẫy hay gặp\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Superkey\u003c/td>\u003ctd>K xác định duy nhất mỗi tuple\u003c/td>\u003ctd>Mọi tập chứa superkey cũng là superkey\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Candidate key\u003c/td>\u003ctd>Superkey tối thiểu\u003c/td>\u003ctd>{A, B} chứa key {A} thì \u003cstrong>không\u003c/strong> là candidate key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Primary key\u003c/td>\u003ctd>Candidate key được chọn\u003c/td>\u003ctd>Không suy ra từ \u003cstrong>một instance\u003c/strong> (PE 2.4)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foreign key\u003c/td>\u003ctd>Giá trị phải có ở relation được tham chiếu\u003c/td>\u003ctd>Vi phạm khi \u003cstrong>insert\u003c/strong> vào referencing hoặc \u003cstrong>delete\u003c/strong> ở referenced (PE 2.2)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Key là ràng buộc trên \u003cstrong>schema\u003c/strong> (mọi instance hợp lệ), không phải nhận xét về dữ liệu hiện tại.\u003c/p>\n\u003ch3>Chương 2 — relational algebra ↔ SQL\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Đại số\u003c/th>\u003cth>SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>σ\u003csub>p\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select * from r where p\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Π\u003csub>A,B\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>select distinct A, B from r\u003c/code> (đại số \u003cstrong>loại trùng\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r × s\u003c/td>\u003ctd>\u003ccode>from r, s\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈\u003csub>θ\u003c/sub> s\u003c/td>\u003ctd>\u003ccode>from r join s on θ\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ∪ s, r − s, r ∩ s\u003c/td>\u003ctd>\u003ccode>union\u003c/code>, \u003ccode>except\u003c/code>, \u003ccode>intersect\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ρ\u003csub>A\u003c/sub>(r)\u003c/td>\u003ctd>\u003ccode>from r as A\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ÷ s\u003c/td>\u003ctd>\u003cem>không có trong SQL\u003c/em> → \u003ccode>not exists (... except ...)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Phép chia (PE 2.9)\u003c/h3>\n\u003cp>r(R) ÷ s(S), S ⊆ R: các tuple t trên R − S sao cho \u003cstrong>với mọi\u003c/strong> t\u003csub>s\u003c/sub> ∈ s, (t, t\u003csub>s\u003c/sub>) ∈ r.\u003c/p>\n\u003cp>r ÷ s = Π\u003csub>R−S\u003c/sub>(r) − Π\u003csub>R−S\u003c/sub>((Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r))\u003c/p>\n\u003cp>Đọc: lấy mọi ứng viên, ghép với \u003cstrong>mọi\u003c/strong> phần tử của s, trừ đi những cặp thật sự có trong r → còn lại các cặp \u003cem>thiếu\u003c/em>; ứng viên nào có cặp thiếu thì bị loại.\u003c/p>\n\u003ch3>Bẫy thường gặp\u003c/h3>\n\u003cul>\u003cli>Dùng σ cho \"\u003cstrong>mọi\u003c/strong>\" (every employee, all courses) — phải dùng \u003cstrong>set difference\u003c/strong> hoặc \u003cstrong>division\u003c/strong>.\u003c/li>\u003cli>Quên \u003cstrong>rename\u003c/strong> khi so sánh relation với chính nó (PE 2.8b: ρ\u003csub>A\u003c/sub>, ρ\u003csub>B\u003c/sub>).\u003c/li>\u003cli>PE 2.6b/2.8b: salary nằm ở \u003cstrong>works\u003c/strong>, không phải employee → phải join. (Lời giải trong sách của 2.8b viết A.salary trên employee — xem Câu 13.)\u003c/li>\u003cli>σ trên × chỉ giữ những cặp khớp: sinh viên \u003cstrong>không có\u003c/strong> advisor biến mất khỏi kết quả (PE 2.5).\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>PE 1.1\u003c/strong> — Chương 1 nêu nhiều ưu điểm của database system. Hãy nêu \u003cstrong>hai nhược điểm\u003c/strong>.","en":"\u003cp>\u003cstrong>Exercise 1.1.\u003c/strong> This chapter has described several major advantages of a database system. What are two disadvantages?\u003c/p>","answer":"\u003col>\u003cli>Việc cài đặt (setup) database system đòi hỏi nhiều \u003cstrong>kiến thức, tiền bạc, kỹ năng và thời gian\u003c/strong> hơn.\u003c/li>\u003cli>\u003cstrong>Độ phức tạp\u003c/strong> của database có thể dẫn tới \u003cstrong>hiệu năng kém\u003c/strong> (overhead không cần thiết với ứng dụng nhỏ, đơn giản).\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.2\u003c/strong> — Nêu \u003cstrong>năm\u003c/strong> điểm khác nhau giữa hệ thống khai báo kiểu (type declaration) của Java/C++ và data-definition language (DDL) của database.","en":"\u003cp>\u003cstrong>Exercise 1.2.\u003c/strong> List five ways in which the type declaration system of a language such as Java or C++ differs from the data definition language used in a database.\u003c/p>","answer":"\u003col>\u003cli>Thực thi lệnh DDL \u003cstrong>tạo ra object thật\u003c/strong> trong database; khai báo kiểu trong ngôn ngữ lập trình chỉ là \u003cstrong>trừu tượng\u003c/strong> dùng trong chương trình.\u003c/li>\u003cli>DDL cho phép khai báo \u003cstrong>consistency constraints\u003c/strong> (domain constraint, referential integrity…); hệ kiểu của ngôn ngữ lập trình thường không có.\u003c/li>\u003cli>DDL hỗ trợ \u003cstrong>authorization\u003c/strong> — cấp quyền truy cập khác nhau cho từng user; ngôn ngữ lập trình không có (cùng lắm là private/protected giữa các class).\u003c/li>\u003cli>Hệ kiểu của ngôn ngữ lập trình thường \u003cstrong>giàu hơn\u003c/strong> nhiều so với SQL (SQL chủ yếu có số, chuỗi; một số DB có array, object).\u003c/li>\u003cli>DDL tập trung vào \u003cstrong>kiểu của các attribute của relation\u003c/strong>; ngôn ngữ lập trình cho phép tạo \u003cstrong>object và collection of objects\u003c/strong>.\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.3\u003c/strong> — Liệt kê \u003cstrong>sáu bước chính\u003c/strong> khi xây dựng một database cho một doanh nghiệp cụ thể.","en":"\u003cp>\u003cstrong>Exercise 1.3.\u003c/strong> List six major steps that you would take in setting up a database for a particular enterprise.\u003c/p>","answer":"\u003col>\u003cli>Xác định \u003cstrong>yêu cầu mức cao\u003c/strong> của doanh nghiệp → tài liệu \u003cem>system requirements specification\u003c/em>.\u003c/li>\u003cli>Xác định \u003cstrong>model\u003c/strong> chứa mọi loại dữ liệu và mối quan hệ cần thiết (ví dụ E-R model).\u003c/li>\u003cli>Xác định \u003cstrong>integrity constraints\u003c/strong> trên dữ liệu.\u003c/li>\u003cli>Xác định \u003cstrong>mức vật lý\u003c/strong> (physical level).\u003c/li>\u003cli>Với mỗi bài toán thường xuyên (công việc của nhân viên, người dùng web), thiết kế \u003cstrong>giao diện người dùng\u003c/strong> và viết \u003cstrong>application programs\u003c/strong> thực hiện nó.\u003c/li>\u003cli>\u003cstrong>Tạo và khởi tạo\u003c/strong> (create/initialize) database.\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 1.4\u003c/strong> — Xây dựng một video site kiểu YouTube. Với \u003cstrong>từng\u003c/strong> nhược điểm của file-processing system ở Section 1.2, hãy bàn xem nó có liên quan tới việc lưu \u003cstrong>dữ liệu video\u003c/strong> và \u003cstrong>metadata\u003c/strong> (title, người upload, tag, ai đã xem) hay không.","en":"\u003cp>\u003cstrong>Exercise 1.4.\u003c/strong> Suppose you want to build a video site similar to YouTube. Consider each of the points listed in Section 1.2 as disadvantages of keeping data in a file-processing system. Discuss the relevance of each of these points to the storage of actual video data, and to metadata about the video, such as title, the user who uploaded it, tags, and which users viewed it.\u003c/p>","answer":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nhược điểm\u003c/th>\u003cth>Đánh giá\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Data redundancy & inconsistency\u003c/td>\u003ctd>Liên quan phần nào tới \u003cstrong>metadata\u003c/strong>; không liên quan tới video (video không bị cập nhật). Ít mối quan hệ nên ít dư thừa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Difficulty in accessing data\u003c/td>\u003ctd>Nếu chỉ truy cập qua vài giao diện định sẵn thì không sao; nhưng muốn tìm theo điều kiện phức tạp trên metadata thì lưu trong file sẽ phải viết chương trình riêng → cần database.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data isolation\u003c/td>\u003ctd>Không lớn: dữ liệu chủ yếu được \u003cstrong>tạo mới\u003c/strong> chứ không sửa; lịch sử xem cũng append-only. Có thể có vấn đề nếu có thêm phân quyền.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity problems\u003c/td>\u003ctd>Ít ràng buộc ngoài primary key; nếu dữ liệu phân tán thì khó bảo đảm primary key. Không phải vấn đề lớn.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atomicity problems\u003c/td>\u003ctd>\u003cstrong>Quan trọng\u003c/strong>: upload video thì video và metadata phải được thêm \u003cstrong>cùng lúc\u003c/strong> (atomic), cần cơ chế recovery khi lỗi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concurrent-access anomalies\u003c/td>\u003ctd>Ít xảy ra vì dữ liệu không bị cập nhật.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security problems\u003c/td>\u003ctd>Liên quan nếu hệ thống có phân quyền (video riêng tư…).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"q":"\u003cstrong>PE 1.5\u003c/strong> — Keyword query của web search khác database query thế nào, về \u003cstrong>cách đặc tả\u003c/strong> truy vấn và về \u003cstrong>kết quả\u003c/strong>?","en":"\u003cp>\u003cstrong>Exercise 1.5.\u003c/strong> Keyword queries used in web search are quite different from database queries. List key differences between the two, in terms of the way the queries are specified and in terms of what is the result of a query.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Đặc tả\u003c/strong>: web search chỉ là danh sách từ khoá, \u003cstrong>không có cú pháp\u003c/strong> cụ thể; database query có \u003cstrong>cú pháp chặt chẽ\u003c/strong> (SQL), cho phép diễn đạt truy vấn phức tạp (join, aggregate, subquery…).\u003c/li>\u003cli>\u003cstrong>Kết quả\u003c/strong>: web search trả về \u003cstrong>danh sách URL có xếp hạng\u003c/strong> kèm đoạn trích nội dung; trong mô hình quan hệ kết quả \u003cstrong>luôn là một bảng\u003c/strong> (relation).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 2.1\u003c/strong> — Với Employee database (Figure 2.17): employee(ID, person_name, street, city), works(ID, company_name, salary), company(company_name, city). Primary key thích hợp là gì?","en":"\u003cp>\u003cstrong>Exercise 2.1.\u003c/strong> Consider the employee database of Figure 2.17. What are the appropriate primary keys?\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","answer":"\u003cul>\u003cli>employee(\u003cstrong>ID\u003c/strong>, person_name, street, city)\u003c/li>\u003cli>works(\u003cstrong>ID\u003c/strong>, company_name, salary) — mỗi người làm cho một công ty\u003c/li>\u003cli>company(\u003cstrong>company_name\u003c/strong>, city)\u003c/li>\u003c/ul>\n\u003cp>\u003cem>Lưu ý dữ liệu mẫu:\u003c/em> bảng \u003ccode>company\u003c/code> trong Practice Lab dùng khoá (company_name, city) vì PE 3.9e giả sử một công ty có thể ở nhiều thành phố.\u003c/p>"},{"q":"\u003cstrong>PE 2.2\u003c/strong> — Xét foreign key từ instructor.dept_name tới department. Cho ví dụ một \u003cstrong>insert\u003c/strong> và một \u003cstrong>delete\u003c/strong> có thể vi phạm ràng buộc này.","en":"\u003cp>\u003cstrong>Exercise 2.2.\u003c/strong> Consider the foreign-key constraint from the \u003cem>dept_name\u003c/em> attribute of \u003cem>instructor\u003c/em> to the \u003cem>department\u003c/em> relation. Give examples of inserts and deletes to these relations that can cause a violation of the foreign-key constraint.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Insert\u003c/strong> tuple (10111, Ostrom, Economics, 110000) vào \u003cstrong>instructor\u003c/strong> khi bảng department không có khoa Economics → vi phạm.\u003c/li>\u003cli>\u003cstrong>Delete\u003c/strong> tuple (Biology, Watson, 90000) khỏi \u003cstrong>department\u003c/strong> khi vẫn còn instructor (hoặc student) có dept_name = Biology → vi phạm.\u003c/li>\u003c/ul>\n\u003cp>Trong schema của Practice Lab, các foreign key tới department khai báo \u003ccode>on delete set null\u003c/code> nên delete Biology \u003cstrong>không\u003c/strong> bị từ chối mà dept_name của Crick bị đặt thành null (xem bài GK1.02). Với foreign key không có hành động kèm theo, delete sẽ bị từ chối.\u003c/p>"},{"q":"\u003cstrong>PE 2.3\u003c/strong> — Một time slot có thể họp nhiều lần trong tuần. Giải thích vì sao \u003cstrong>day\u003c/strong> và \u003cstrong>start_time\u003c/strong> thuộc primary key của time_slot còn \u003cstrong>end_time\u003c/strong> thì không.","en":"\u003cp>\u003cstrong>Exercise 2.3.\u003c/strong> Consider the \u003cem>time_slot\u003c/em> relation. Given that a particular time slot can meet more than once in a week, explain why \u003cem>day\u003c/em> and \u003cem>start_time\u003c/em> are part of the primary key of this relation, while \u003cem>end_time\u003c/em> is not.\u003c/p>","answer":"\u003cul>\u003cli>Một lớp (cùng time_slot_id) thường học \u003cstrong>nhiều ngày\u003c/strong> khác nhau trong tuần, thậm chí nhiều lần một ngày → chỉ time_slot_id không đủ phân biệt, cần thêm \u003cstrong>day\u003c/strong> và \u003cstrong>start_time\u003c/strong>.\u003c/li>\u003cli>Một lớp bắt đầu vào một thời điểm cụ thể của một ngày thì \u003cstrong>chỉ kết thúc vào một thời điểm\u003c/strong> → end_time bị xác định bởi (time_slot_id, day, start_time), thêm vào sẽ làm key không còn tối thiểu.\u003c/li>\u003c/ul>\n\u003cp>(Trong dữ liệu mẫu, start_time được tách thành start_hr, start_min.)\u003c/p>"},{"q":"\u003cstrong>PE 2.4\u003c/strong> — Trong instance của instructor (Figure 2.1) không có hai instructor trùng tên. Có thể kết luận name là superkey (hoặc primary key) của instructor không?","en":"\u003cp>\u003cstrong>Exercise 2.4.\u003c/strong> In the instance of \u003cem>instructor\u003c/em> shown in Figure 2.1, no two instructors have the same name. From this, can we conclude that \u003cem>name\u003c/em> can be used as a superkey (or primary key) of \u003cem>instructor\u003c/em>?\u003c/p>","answer":"\u003cp>\u003cstrong>Không.\u003c/strong> Với instance này tên là duy nhất, nhưng nói chung không đảm bảo (trừ khi trường có quy định không ai được trùng tên — rất khó xảy ra). Key là ràng buộc phải đúng với \u003cstrong>mọi instance hợp lệ\u003c/strong>, không suy ra từ một instance. Bài GK1.04 chèn thêm một \"Einstein\" thứ hai — database chấp nhận, chứng tỏ name không phải key.\u003c/p>"},{"q":"\u003cstrong>PE 2.5\u003c/strong> — Kết quả của σ\u003csub>s_id=ID\u003c/sub>(student × advisor) là gì?","en":"\u003cp>\u003cstrong>Exercise 2.5.\u003c/strong> What is the result of first performing the Cartesian product of \u003cem>student\u003c/em> and \u003cem>advisor\u003c/em>, and then performing a selection operation on the result with the predicate \u003cem>s_id\u003c/em> = \u003cem>ID\u003c/em>? (Using the symbolic notation of relational algebra, this query can be written as σ\u003csub>s_id=ID\u003c/sub>(\u003cem>student\u003c/em> × \u003cem>advisor\u003c/em>).)\u003c/p>","answer":"\u003cp>Schema kết quả gồm \u003cstrong>mọi attribute của student rồi tới mọi attribute của advisor\u003c/strong> (ID, name, dept_name, tot_cred, s_id, i_id).\u003c/p>\n\u003cul>\u003cli>Với mỗi sinh viên \u003cstrong>có advisor\u003c/strong>: một dòng gồm thông tin sinh viên, s_id (bằng ID) và i_id (ID của advisor).\u003c/li>\u003cli>Sinh viên \u003cstrong>không có advisor\u003c/strong> không xuất hiện.\u003c/li>\u003cli>Sinh viên có \u003cstrong>nhiều advisor\u003c/strong> xuất hiện nhiều lần tương ứng.\u003c/li>\u003c/ul>\n\u003cp>SQL: \u003ccode>select * from student, advisor where s_id = student.ID\u003c/code> (GK1.05).\u003c/p>"},{"q":"\u003cstrong>PE 2.6\u003c/strong> — Viết biểu thức đại số quan hệ trên Employee database: (a) tên nhân viên sống ở Miami; (b) tên nhân viên có salary > 100000; (c) tên nhân viên sống ở Miami \u003cstrong>và\u003c/strong> salary > 100000.","en":"\u003cp>\u003cstrong>Exercise 2.6.\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>a. Find the name of each employee who lives in city “Miami”.\u003c/p>\n\u003cp>b. Find the name of each employee whose salary is greater than $100000.\u003c/p>\n\u003cp>c. Find the name of each employee who lives in “Miami” and whose salary is greater than $100000.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","answer":"\u003cp>a. Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\"\u003c/sub>(employee))\u003cbr>b. Π\u003csub>person_name\u003c/sub>(σ\u003csub>salary>100000\u003c/sub>(employee ⋈ works))\u003cbr>c. Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\" ∧ salary>100000\u003c/sub>(employee ⋈ works))\u003c/p>\n\u003cp>SQL tương ứng: GK1.07, GK1.08, GK1.09. Nhớ Π loại trùng → \u003ccode>select distinct\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 2.7\u003c/strong> — Bank database: (a) tên các branch ở Chicago; (b) ID những borrower có loan ở branch Downtown.","en":"\u003cp>\u003cstrong>Exercise 2.7.\u003c/strong> Consider the bank database of Figure 2.18. Give an expression in the relational algebra for each of the following queries:\u003c/p>\n\u003cp>a. Find the name of each branch located in “Chicago”.\u003c/p>\n\u003cp>b. Find the ID of each borrower who has a loan in branch “Downtown”.\u003c/p>\n\u003cp>\u003cem>Figure 2.18 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","answer":"\u003cp>a. Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city=\"Chicago\"\u003c/sub>(branch))\u003cbr>b. Π\u003csub>ID\u003c/sub>(σ\u003csub>branch_name=\"Downtown\"\u003c/sub>(borrower ⋈\u003csub>borrower.loan_number=loan.loan_number\u003c/sub> loan))\u003c/p>\n\u003cp>SQL: GK1.10, GK1.11.\u003c/p>"},{"q":"\u003cstrong>PE 2.8\u003c/strong> — Employee database: (a) ID và tên mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho BigBank; (b) ID và tên mỗi nhân viên có lương \u003cstrong>ít nhất bằng mọi\u003c/strong> nhân viên khác.","en":"\u003cp>\u003cstrong>Exercise 2.8.\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>a. Find the ID and name of each employee who does not work for “BigBank”.\u003c/p>\n\u003cp>b. Find the ID and name of each employee who earns at least as much as every employee in the database.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","answer":"\u003cp>a. Tìm những người làm cho BigBank rồi lấy phần bù:\u003c/p>\n\u003cp>Π\u003csub>ID,person_name\u003c/sub>(employee) − Π\u003csub>ID,person_name\u003c/sub>(employee ⋈\u003csub>employee.ID=works.ID\u003c/sub> σ\u003csub>company_name=\"BigBank\"\u003c/sub>(works))\u003c/p>\n\u003cp>b. Tìm những người \u003cstrong>có ai đó lương cao hơn\u003c/strong> (so sánh hai tuple của cùng relation → rename), rồi lấy phần bù:\u003c/p>\n\u003cp>Π\u003csub>ID,person_name\u003c/sub>(employee ⋈ works) − Π\u003csub>A.ID,A.person_name\u003c/sub>(ρ\u003csub>A\u003c/sub>(employee ⋈ works) ⋈\u003csub>A.salary\u003cB.salary\u003c/sub> ρ\u003csub>B\u003c/sub>(employee ⋈ works))\u003c/p>\n\u003cp>\u003cem>Lưu ý:\u003c/em> lời giải của sách viết ρ\u003csub>A\u003c/sub>(employee) và A.salary, nhưng salary nằm trong works nên phải join với works. Nếu dùng Π(employee) ở vế trái, người \u003cstrong>không có trong works\u003c/strong> (không có lương, như Leo Vu trong dữ liệu mẫu) cũng lọt vào kết quả — vì vậy vế trái cũng phải là employee ⋈ works.\u003c/p>\n\u003cp>SQL: GK1.12, GK1.13.\u003c/p>"},{"q":"\u003cstrong>PE 2.9\u003c/strong> — Định nghĩa phép chia r ÷ s. (a) Dùng phép chia tìm ID các sinh viên đã học \u003cstrong>tất cả\u003c/strong> course của khoa Comp. Sci. (b) Viết lại không dùng phép chia.","en":"\u003cp>\u003cstrong>Exercise 2.9.\u003c/strong> The division operator of relational algebra, “÷”, is defined as follows. Let r(R) and s(S) be relations, and let S ⊆ R; that is, every attribute of schema S is also in schema R. Given a tuple t, let t[S] denote the projection of tuple t on the attributes in S. Then r ÷ s is a relation on schema R − S (that is, on the schema containing all attributes of schema R that are not in schema S). A tuple t is in r ÷ s if and only if both of two conditions hold:\u003c/p>\n\u003cul>\u003cli>t is in Π\u003csub>R−S\u003c/sub>(r)\u003c/li>\u003cli>For every tuple t\u003csub>s\u003c/sub> in s, there is a tuple t\u003csub>r\u003c/sub> in r satisfying both of the following:\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[S] = t\u003csub>s\u003c/sub>[S]\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[R − S] = t\u003c/li>\u003c/ul>\n\u003cp>Given the above definition:\u003c/p>\n\u003cp>a. Write a relational algebra expression using the division operator to find the IDs of all students who have taken all Comp. Sci. courses. (Hint: project \u003cem>takes\u003c/em> to just ID and \u003cem>course_id\u003c/em>, and generate the set of all Comp. Sci. *course_id*s using a select expression, before doing the division.)\u003c/p>\n\u003cp>b. Show how to write the above query in relational algebra, without using division. (By doing so, you would have shown how to define the division operation using the other relational algebra operations.)\u003c/p>","answer":"\u003cp>a. Π\u003csub>ID,course_id\u003c/sub>(takes) ÷ Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(course))\u003c/p>\n\u003cp>b. Đặt r ← Π\u003csub>ID,course_id\u003c/sub>(takes), s ← Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Comp. Sci.\"\u003c/sub>(course)):\u003c/p>\n\u003cp>Π\u003csub>ID\u003c/sub>(takes) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(takes) × s) − r)\u003c/p>\n\u003cp>Tổng quát: r ÷ s = Π\u003csub>R−S\u003c/sub>(r) − Π\u003csub>R−S\u003c/sub>((Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r)).\u003c/p>\n\u003cp>Giải thích: Π\u003csub>R−S\u003c/sub>(r) cho mọi tuple thoả điều kiện 1 của định nghĩa. (Π\u003csub>R−S\u003c/sub>(r) × s) − Π\u003csub>R−S,S\u003c/sub>(r) là các cặp (ứng viên, phần tử của s) \u003cstrong>không có\u003c/strong> trong r; ứng viên xuất hiện trong đó vi phạm điều kiện \"với mọi t\u003csub>s\u003c/sub> ∈ s\" nên bị trừ đi.\u003c/p>\n\u003cp>\u003cem>Trên dữ liệu mẫu\u003c/em>, không sinh viên nào học đủ 5 course Comp. Sci. nên kết quả (a) \u003cstrong>rỗng\u003c/strong>. Bài GK1.14 vì vậy chấm phiên bản khoa \u003cstrong>Physics\u003c/strong>; GK1.15–GK1.16 luyện công thức (b) với một divisor cho kết quả khác rỗng.\u003c/p>"}],"exercises":[{"id":"GK1.01","topic":"PE 2.1 primary key","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.1\u003c/strong> — Tạo ba bảng \u003ccode>gk_employee(ID, person_name, street, city)\u003c/code>, \u003ccode>gk_works(ID, company_name, salary)\u003c/code>, \u003ccode>gk_company(company_name, city)\u003c/code> với \u003cstrong>primary key đúng như lời giải PE 2.1\u003c/strong> (kiểu dữ liệu tuỳ chọn).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.1.\u003c/strong> Consider the employee database of Figure 2.17. What are the appropriate primary keys?\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"employee: ID; works: ID; company: company_name.","solution":"create table gk_employee (ID varchar(5) primary key, person_name varchar(30), street varchar(30), city varchar(30));\ncreate table gk_works (ID varchar(5) primary key, company_name varchar(30), salary numeric(10,2));\ncreate table gk_company (company_name varchar(30) primary key, city varchar(30));","check":"select k.table_name, k.column_name\nfrom information_schema.table_constraints t\njoin information_schema.key_column_usage k on k.constraint_name = t.constraint_name and k.table_name = t.table_name\nwhere t.constraint_type = 'PRIMARY KEY' and t.table_name in ('gk_employee', 'gk_works', 'gk_company')\norder by k.table_name, k.column_name;","ordered":false,"fresh":false,"expected":{"fields":["table_name","column_name"],"rows":[["gk_company","company_name"],["gk_employee","id"],["gk_works","id"]]}},{"id":"GK1.02","topic":"PE 2.2 foreign key","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.2\u003c/strong> — Viết \u003cstrong>một câu select\u003c/strong> trả về 3 cột: (1) kết quả \u003ccode>try_sql\u003c/code> khi insert \u003ccode>('10111', 'Ostrom', 'Economics', 110000)\u003c/code> vào instructor; (2) kết quả \u003ccode>try_sql\u003c/code> khi delete khoa \u003ccode>Biology\u003c/code> khỏi department; (3) số instructor có \u003ccode>dept_name is null\u003c/code> \u003cstrong>sau\u003c/strong> lệnh delete (dùng \u003ccode>sql_value\u003c/code>).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.2.\u003c/strong> Consider the foreign-key constraint from the \u003cem>dept_name\u003c/em> attribute of \u003cem>instructor\u003c/em> to the \u003cem>department\u003c/em> relation. Give examples of inserts and deletes to these relations that can cause a violation of the foreign-key constraint.\u003c/p>","hint":"try_sql trả về 'ok' hoặc SQLSTATE (23503 = foreign key). Schema khai báo on delete set null nên delete không lỗi.","solution":"select try_sql($$insert into instructor values ('10111', 'Ostrom', 'Economics', 110000)$$) as insert_economics,\n       try_sql($$delete from department where dept_name = 'Biology'$$) as delete_biology,\n       sql_value($$select count(*) from instructor where dept_name is null$$) as instructors_without_dept;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["insert_economics","delete_biology","instructors_without_dept"],"rows":[["23503","ok","1"]]}},{"id":"GK1.03","topic":"PE 2.3 time_slot key","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.3\u003c/strong> — Minh hoạ vì sao time_slot_id không đủ làm khoá: liệt kê các \u003ccode>time_slot_id\u003c/code> họp \u003cstrong>nhiều hơn một lần\u003c/strong> trong tuần cùng số lần họp (\u003ccode>num_meetings\u003c/code>).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.3.\u003c/strong> Consider the \u003cem>time_slot\u003c/em> relation. Given that a particular time slot can meet more than once in a week, explain why \u003cem>day\u003c/em> and \u003cem>start_time\u003c/em> are part of the primary key of this relation, while \u003cem>end_time\u003c/em> is not.\u003c/p>","hint":"","solution":"select time_slot_id, count(*) as num_meetings\nfrom time_slot\ngroup by time_slot_id\nhaving count(*) > 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["time_slot_id","num_meetings"],"rows":[["B","3"],["C","3"],["D","3"],["E","2"],["F","2"],["G","3"],["A","3"]]}},{"id":"GK1.04","topic":"PE 2.4 superkey","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.4\u003c/strong> — Chèn instructor \u003ccode>('99001', 'Einstein', 'Comp. Sci.', 70000)\u003c/code> rồi trả về các instructor tên \u003ccode>Einstein\u003c/code> (ID, name, dept_name). Database chấp nhận → name \u003cstrong>không\u003c/strong> phải superkey.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.4.\u003c/strong> In the instance of \u003cem>instructor\u003c/em> shown in Figure 2.1, no two instructors have the same name. From this, can we conclude that \u003cem>name\u003c/em> can be used as a superkey (or primary key) of \u003cem>instructor\u003c/em>?\u003c/p>","hint":"","solution":"insert into instructor values ('99001', 'Einstein', 'Comp. Sci.', 70000);\nselect ID, name, dept_name from instructor where name = 'Einstein';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name"],"rows":[["22222","Einstein","Physics"],["99001","Einstein","Comp. Sci."]]}},{"id":"GK1.05","topic":"PE 2.5 σ over ×","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.5\u003c/strong> — Viết SQL cho σ\u003csub>s_id=ID\u003c/sub>(student × advisor) (giữ mọi cột của cả hai bảng).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.5.\u003c/strong> What is the result of first performing the Cartesian product of \u003cem>student\u003c/em> and \u003cem>advisor\u003c/em>, and then performing a selection operation on the result with the predicate \u003cem>s_id\u003c/em> = \u003cem>ID\u003c/em>? (Using the symbolic notation of relational algebra, this query can be written as σ\u003csub>s_id=ID\u003c/sub>(\u003cem>student\u003c/em> × \u003cem>advisor\u003c/em>).)\u003c/p>","hint":"","solution":"select * from student, advisor where advisor.s_id = student.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","s_id","i_id"],"rows":[["00128","Zhang","Comp. Sci.","102","00128","45565"],["12345","Shankar","Comp. Sci.","32","12345","10101"],["23121","Chavez","Finance","110","23121","76543"],["44553","Peltier","Physics","56","44553","22222"],["45678","Levy","Physics","46","45678","22222"],["76543","Brown","Comp. Sci.","58","76543","45565"],["76653","Aoi","Elec. Eng.","60","76653","98345"],["98765","Bourikas","Elec. Eng.","98","98765","98345"],["98988","Tanaka","Biology","120","98988","76766"]]}},{"id":"GK1.06","topic":"PE 2.5 missing tuples","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.5 (mở rộng)\u003c/strong> — Những sinh viên nào \u003cstrong>không xuất hiện\u003c/strong> trong kết quả của σ\u003csub>s_id=ID\u003c/sub>(student × advisor)? Trả về ID, name.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.5.\u003c/strong> What is the result of first performing the Cartesian product of \u003cem>student\u003c/em> and \u003cem>advisor\u003c/em>, and then performing a selection operation on the result with the predicate \u003cem>s_id\u003c/em> = \u003cem>ID\u003c/em>? (Using the symbolic notation of relational algebra, this query can be written as σ\u003csub>s_id=ID\u003c/sub>(\u003cem>student\u003c/em> × \u003cem>advisor\u003c/em>).)\u003c/p>","hint":"Sinh viên không có advisor: dùng except hoặc not in.","solution":"select ID, name from student\nexcept\nselect student.ID, student.name from student, advisor where advisor.s_id = student.ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name"],"rows":[["55739","Sanchez"],["19991","Brandt"],["54321","Williams"],["70557","Snow"]]}},{"id":"GK1.07","topic":"PE 2.6a σ, Π","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6a\u003c/strong> — Π\u003csub>person_name\u003c/sub>(σ\u003csub>city=\"Miami\"\u003c/sub>(employee)).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.6 (a).\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>a. Find the name of each employee who lives in city “Miami”.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_person_name(σ_city='Miami'(employee))\nselect distinct person_name from employee where city = 'Miami';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Alice Nguyen"],["Bob Tran"],["Eva Vo"],["Grace Ho"],["Jack Ngo"]]}},{"id":"GK1.08","topic":"PE 2.6b join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6b\u003c/strong> — Tên mỗi nhân viên có salary > 100000: Π\u003csub>person_name\u003c/sub>(σ\u003csub>salary>100000\u003c/sub>(employee ⋈ works)).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.6 (b).\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>b. Find the name of each employee whose salary is greater than $100000.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_person_name(σ_salary>100000(employee ⋈ works))\nselect distinct person_name\nfrom employee natural join works\nwhere salary > 100000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Grace Ho"],["Henry Bui"]]}},{"id":"GK1.09","topic":"PE 2.6c join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.6c\u003c/strong> — Tên mỗi nhân viên sống ở Miami \u003cstrong>và\u003c/strong> có salary > 100000.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.6 (c).\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>c. Find the name of each employee who lives in “Miami” and whose salary is greater than $100000.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_person_name(σ_city='Miami' ∧ salary>100000(employee ⋈ works))\nselect distinct person_name\nfrom employee natural join works\nwhere city = 'Miami' and salary > 100000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_name"],"rows":[["Grace Ho"]]}},{"id":"GK1.10","topic":"PE 2.7a σ, Π","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.7a\u003c/strong> (Bank database) — Tên mỗi branch ở Chicago.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.7 (a).\u003c/strong> Consider the bank database of Figure 2.18. Give an expression in the relational algebra for each of the following queries:\u003c/p>\n\u003cp>a. Find the name of each branch located in “Chicago”.\u003c/p>\n\u003cp>\u003cem>Figure 2.18 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_branch_name(σ_branch_city='Chicago'(branch))\nselect distinct branch_name from branch where branch_city = 'Chicago';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Chicago Loop"],["Lakeview"]]}},{"id":"GK1.11","topic":"PE 2.7b θ-join","level":1,"prompt":"\u003cp>\u003cstrong>PE 2.7b\u003c/strong> — ID mỗi borrower có loan ở branch Downtown.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.7 (b).\u003c/strong> Consider the bank database of Figure 2.18. Give an expression in the relational algebra for each of the following queries:\u003c/p>\n\u003cp>b. Find the ID of each borrower who has a loan in branch “Downtown”.\u003c/p>\n\u003cp>\u003cem>Figure 2.18 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>ID\u003c/u>, customer_name, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>ID, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>ID, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_ID(σ_branch_name='Downtown'(borrower ⋈_{borrower.loan_number=loan.loan_number} loan))\nselect distinct borrower.ID\nfrom borrower join loan on borrower.loan_number = loan.loan_number\nwhere loan.branch_name = 'Downtown';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["19283"],["78901"],["92345"]]}},{"id":"GK1.12","topic":"PE 2.8a set difference","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.8a\u003c/strong> — ID và tên mỗi nhân viên \u003cstrong>không\u003c/strong> làm cho BigBank (kể cả người không có trong works). Viết theo đúng cấu trúc đại số: tất cả \u003cstrong>trừ\u003c/strong> (\u003ccode>except\u003c/code>) những người làm cho BigBank.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.8 (a).\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>a. Find the ID and name of each employee who does not work for “BigBank”.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"","solution":"-- Π_ID,person_name(employee) − Π_ID,person_name(employee ⋈ σ_company_name='BigBank'(works))\nselect ID, person_name from employee\nexcept\nselect employee.ID, person_name\nfrom employee join works on employee.ID = works.ID\nwhere company_name = 'BigBank';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name"],"rows":[["10009","Ivy Dang"],["10012","Leo Vu"],["10003","Carol Le"],["10006","Frank Do"],["10001","Alice Nguyen"],["10010","Jack Ngo"],["10005","Eva Vo"],["10013","Mia Ta"],["10004","David Pham"],["10011","Kim Ly"],["12345","Zoe Mai"],["10002","Bob Tran"]]}},{"id":"GK1.13","topic":"PE 2.8b rename","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.8b\u003c/strong> — ID và tên mỗi nhân viên có lương \u003cstrong>ít nhất bằng mọi\u003c/strong> nhân viên. Viết theo cấu trúc đại số: (người có lương) \u003cstrong>trừ\u003c/strong> (người mà có ai đó lương cao hơn — dùng hai bí danh A, B của \u003ccode>employee natural join works\u003c/code>). Không dùng \u003ccode>max\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.8 (b).\u003c/strong> Consider the employee database of Figure 2.17. Give an expression in the relational algebra to express each of the following queries:\u003c/p>\n\u003cp>b. Find the ID and name of each employee who earns at least as much as every employee in the database.\u003c/p>\n\u003cp>\u003cem>Figure 2.17 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003c/ul>","hint":"from (employee natural join works) as A, (employee natural join works) as B where A.salary \u003c B.salary","solution":"-- Π_ID,person_name(employee ⋈ works)\n--   − Π_A.ID,A.person_name(ρ_A(employee ⋈ works) ⋈_{A.salary \u003c B.salary} ρ_B(employee ⋈ works))\nselect ID, person_name from employee natural join works\nexcept\nselect A.ID, A.person_name\nfrom (employee natural join works) as A, (employee natural join works) as B\nwhere A.salary \u003c B.salary;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name"],"rows":[["10007","Grace Ho"]]}},{"id":"GK1.14","topic":"PE 2.9a division","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.9a (biến thể)\u003c/strong> — ID các sinh viên đã học \u003cstrong>tất cả\u003c/strong> course của khoa \u003cstrong>Physics\u003c/strong>: Π\u003csub>ID,course_id\u003c/sub>(takes) ÷ Π\u003csub>course_id\u003c/sub>(σ\u003csub>dept_name=\"Physics\"\u003c/sub>(course)). (Với Comp. Sci. như trong sách, kết quả trên dữ liệu mẫu là rỗng.) Dùng \u003ccode>not exists (... except ...)\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.9 (a).\u003c/strong> The division operator of relational algebra, “÷”, is defined as follows. Let r(R) and s(S) be relations, and let S ⊆ R; that is, every attribute of schema S is also in schema R. Given a tuple t, let t[S] denote the projection of tuple t on the attributes in S. Then r ÷ s is a relation on schema R − S (that is, on the schema containing all attributes of schema R that are not in schema S). A tuple t is in r ÷ s if and only if both of two conditions hold:\u003c/p>\n\u003cul>\u003cli>t is in Π\u003csub>R−S\u003c/sub>(r)\u003c/li>\u003cli>For every tuple t\u003csub>s\u003c/sub> in s, there is a tuple t\u003csub>r\u003c/sub> in r satisfying both of the following:\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[S] = t\u003csub>s\u003c/sub>[S]\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[R − S] = t\u003c/li>\u003c/ul>\n\u003cp>Given the above definition:\u003c/p>\n\u003cp>a. Write a relational algebra expression using the division operator to find the IDs of all students who have taken all Comp. Sci. courses. (Hint: project \u003cem>takes\u003c/em> to just ID and \u003cem>course_id\u003c/em>, and generate the set of all Comp. Sci. *course_id*s using a select expression, before doing the division.)\u003c/p>","hint":"Với mỗi sinh viên S: không tồn tại course Physics nào mà S chưa học.","solution":"select distinct S.ID\nfrom takes as S\nwhere not exists (\n  (select course_id from course where dept_name = 'Physics')\n  except\n  (select T.course_id from takes as T where T.ID = S.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["44553"]]}},{"id":"GK1.15","topic":"PE 2.9b division by formula","level":3,"prompt":"\u003cp>\u003cstrong>PE 2.9b\u003c/strong> — Viết phép chia \u003cstrong>bằng công thức\u003c/strong> Π\u003csub>ID\u003c/sub>(r) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(r) × s) − r) với r = Π\u003csub>ID,course_id\u003c/sub>(takes) và s = các course mà sinh viên \u003ccode>00128\u003c/code> (Zhang) đã học. Kết quả: ID các sinh viên đã học \u003cstrong>mọi\u003c/strong> course của Zhang.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.9.\u003c/strong> The division operator of relational algebra, “÷”, is defined as follows. Let r(R) and s(S) be relations, and let S ⊆ R; that is, every attribute of schema S is also in schema R. Given a tuple t, let t[S] denote the projection of tuple t on the attributes in S. Then r ÷ s is a relation on schema R − S (that is, on the schema containing all attributes of schema R that are not in schema S). A tuple t is in r ÷ s if and only if both of two conditions hold:\u003c/p>\n\u003cul>\u003cli>t is in Π\u003csub>R−S\u003c/sub>(r)\u003c/li>\u003cli>For every tuple t\u003csub>s\u003c/sub> in s, there is a tuple t\u003csub>r\u003c/sub> in r satisfying both of the following:\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[S] = t\u003csub>s\u003c/sub>[S]\u003c/li>\u003cli>t\u003csub>r\u003c/sub>[R − S] = t\u003c/li>\u003c/ul>\n\u003cp>Given the above definition:\u003c/p>\n\u003cp>a. Write a relational algebra expression using the division operator to find the IDs of all students who have taken all Comp. Sci. courses. (Hint: project \u003cem>takes\u003c/em> to just ID and \u003cem>course_id\u003c/em>, and generate the set of all Comp. Sci. *course_id*s using a select expression, before doing the division.)\u003c/p>\n\u003cp>b. Show how to write the above query in relational algebra, without using division. (By doing so, you would have shown how to define the division operation using the other relational algebra operations.)\u003c/p>","hint":"Dùng with r as (...), s as (...); phép × là cross join; − là except.","solution":"with r as (select distinct ID, course_id from takes),\n     s as (select distinct course_id from takes where ID = '00128')\nselect ID from r\nexcept\nselect ID from (\n  select c.ID, s.course_id from (select distinct ID from r) as c cross join s\n  except\n  select ID, course_id from r) as missing;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["12345"],["00128"]]}},{"id":"GK1.16","topic":"PE 2.9 division check","level":2,"prompt":"\u003cp>\u003cstrong>PE 2.9 (kiểm tra lại)\u003c/strong> — Cùng truy vấn với GK1.15 nhưng viết bằng \u003ccode>group by ... having count(distinct course_id) = (select count(*) ...)\u003c/code>: ID các sinh viên đã học mọi course mà \u003ccode>00128\u003c/code> đã học.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 2.9.\u003c/strong> The division operator of relational algebra, “÷”, is defined as follows. Let r(R) and s(S) be relations, and let S ⊆ R; that is, every attribute of schema S is also in schema R. Given a tuple t, let t[S] denote the projection of tuple t on the attributes in S. Then r ÷ s is a relation on schema R − S (that is, on the schema containing all attributes of schema R that are not in schema S). A tuple t is in r ÷ s if and only if both of two conditions hold:\u003c/p>\n\u003cul>\u003cli>t is in Π\u003csub>R−S\u003c/sub>(r)\u003c/li>\u003cli>For every tuple t\u003csub>s\u003c/sub> in s, there is a tuple t\u003csub>r\u003c/sub> in r satisfying both of the following:\u003c/li>\u003cli>t\u003csub>r\
