u003c/code>: tên instructor và title của mỗi course họ dạy ở Spring 2017, \u003cstrong>sửa lỗi\u003c/strong> natural join của sách. Khi chấm, hệ thống cho Einstein (Physics) dạy thêm CS-190 section 1 Spring 2017 rồi đọc view.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.1.\u003c/strong> Consider the following SQL query that seeks to find a list of titles of all courses taught in Spring 2017 along with the name of the instructor.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select name, title\nfrom instructor natural join teaches natural join section natural join course\nwhere semester = 'Spring' and year = 2017\u003c/code>\u003c/pre>\n\u003cp>What is wrong with this query?\u003c/p>","hint":"join course using (course_id) thay vì natural join course.","solution":"create view gk_spring2017_titles (name, title) as\nselect name, title\nfrom instructor natural join teaches natural join section join course using (course_id)\nwhere semester = 'Spring' and year = 2017;","check":"insert into teaches values ('22222', 'CS-190', '1', 'Spring', 2017);\nselect * from gk_spring2017_titles;","ordered":false,"fresh":false,"expected":{"fields":["name","title"],"rows":[["Einstein","Game Design"],["Brandt","Game Design"],["Brandt","Game Design"],["Kim","Intro. to Digital Systems"]]}},{"id":"GK3.02","topic":"PE 4.2a left outer join","level":1,"prompt":"\u003cp>\u003cstrong>PE 4.2a\u003c/strong> — ID của mỗi instructor và số section đã dạy (0 nếu chưa dạy). Dùng outer join, không dùng subquery.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.2 (a).\u003c/strong> Write the following queries in SQL:\u003c/p>\n\u003cp>a. Display a list of all instructors, showing each instructor’s ID and the number of sections taught. Make sure to show the number of sections as 0 for instructors who have not taught any section. Your query should use an outer join, and should not use subqueries.\u003c/p>","hint":"","solution":"select ID, count(sec_id) as number_of_sections\nfrom instructor natural left outer join teaches\ngroup by ID;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","number_of_sections"],"rows":[["83821","3"],["76543","0"],["33456","0"],["58583","0"],["22222","1"],["76766","2"],["12121","1"],["98345","1"],["15151","1"],["32343","1"],["10101","3"],["45565","2"]]}},{"id":"GK3.03","topic":"PE 4.2b scalar subquery","level":1,"prompt":"\u003cp>\u003cstrong>PE 4.2b\u003c/strong> — Như PE 4.2a nhưng dùng \u003cstrong>scalar subquery\u003c/strong>, không dùng outer join.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.2 (a, b).\u003c/strong> Write the following queries in SQL:\u003c/p>\n\u003cp>a. Display a list of all instructors, showing each instructor’s ID and the number of sections taught. Make sure to show the number of sections as 0 for instructors who have not taught any section. Your query should use an outer join, and should not use subqueries.\u003c/p>\n\u003cp>b. Write the same query as in part a, but using a scalar subquery and not using outer join.\u003c/p>","hint":"","solution":"select ID, (select count(*) from teaches T where T.ID = I.ID) as number_of_sections\nfrom instructor I;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","number_of_sections"],"rows":[["10101","3"],["12121","1"],["15151","1"],["22222","1"],["32343","1"],["33456","0"],["45565","2"],["58583","0"],["76543","0"],["76766","2"],["83821","3"],["98345","1"]]}},{"id":"GK3.04","topic":"PE 4.2c coalesce","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.2c\u003c/strong> — Tạo view \u003ccode>gk_spring2018_sections(course_id, sec_id, ID, name)\u003c/code>: mọi section mở ở Spring 2018 cùng ID và tên instructor; section nhiều instructor xuất hiện nhiều lần; section \u003cstrong>không có instructor\u003c/strong> vẫn xuất hiện với name = \u003ccode>-\u003c/code>. Khi chấm, hệ thống thêm một section Spring 2018 chưa có ai dạy.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.2 (c).\u003c/strong> Write the following queries in SQL:\u003c/p>\n\u003cp>c. Display the list of all course sections offered in Spring 2018, along with the ID and name of each instructor teaching the section. If a section has more than one instructor, that section should appear as many times in the result as it has instructors. If a section does not have any instructor, it should still appear in the result with the instructor name set to “−”.\u003c/p>","hint":"(section natural left outer join teaches) natural left outer join instructor; coalesce(name, '-').","solution":"create view gk_spring2018_sections (course_id, sec_id, ID, name) as\nselect course_id, sec_id, ID, coalesce(name, '-')\nfrom (section natural left outer join teaches) natural left outer join instructor\nwhere semester = 'Spring' and year = 2018;","check":"insert into section values ('BIO-399', '1', 'Spring', 2018, 'Watson', '100', 'E');\nselect * from gk_spring2018_sections;","ordered":false,"fresh":false,"expected":{"fields":["course_id","sec_id","id","name"],"rows":[["CS-101","1","45565","Katz"],["CS-315","1","10101","Srinivasan"],["CS-319","1","45565","Katz"],["CS-319","2","83821","Brandt"],["FIN-201","1","12121","Wu"],["HIS-351","1","32343","El Said"],["MU-199","1","15151","Mozart"],["BIO-399","1",null,"-"]]}},{"id":"GK3.05","topic":"PE 4.2d count zero","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.2d\u003c/strong> — Tạo view \u003ccode>gk_dept_instructors(dept_name, num_instructors)\u003c/code>: mọi department với tổng số instructor, khoa không có ai phải hiện 0. Không dùng subquery. Khi chấm, hệ thống thêm khoa \u003ccode>Statistics\u003c/code> chưa có instructor.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.2 (d).\u003c/strong> Write the following queries in SQL:\u003c/p>\n\u003cp>d. Display the list of all departments, with the total number of instructors in each department, without using subqueries. Make sure to show departments that have no instructors, and list those departments with an instructor count of zero.\u003c/p>","hint":"","solution":"create view gk_dept_instructors (dept_name, num_instructors) as\nselect dept_name, count(ID)\nfrom department natural left outer join instructor\ngroup by dept_name;","check":"insert into department values ('Statistics', 'Taylor', 60000);\nselect * from gk_dept_instructors;","ordered":false,"fresh":false,"expected":{"fields":["dept_name","num_instructors"],"rows":[["Finance","2"],["Physics","2"],["Statistics","0"],["Comp. Sci.","3"],["History","2"],["Music","1"],["Biology","1"],["Elec. Eng.","1"]]}},{"id":"GK3.06","topic":"PE 4.3a left join rewrite","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.3a\u003c/strong> — Viết \u003ccode>select * from student natural left outer join takes\u003c/code> \u003cstrong>không dùng outer join\u003c/strong> (natural join + union + not exists).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.3 (a).\u003c/strong> Outer join expressions can be computed in SQL without using the SQL \u003cstrong>outer join\u003c/strong> operation. To illustrate this fact, show how to rewrite each of the following SQL queries without using the \u003cstrong>outer join\u003c/strong> expression.\u003c/p>\n\u003cp>a. \u003ccode>select * from student natural left outer join takes\u003c/code>\u003c/p>","hint":"","solution":"select * from student natural join takes\nunion\nselect ID, name, dept_name, tot_cred, null, null, null, null, null\nfrom student S1\nwhere not exists (select ID from takes T1 where T1.ID = S1.ID);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","course_id","sec_id","semester","year","grade"],"rows":[["76543","Brown","Comp. Sci.","58","CS-101","1","Fall","2017","A"],["12345","Shankar","Comp. Sci.","32","CS-315","1","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-347","1","Fall","2017","A"],["55739","Sanchez","Music","38","MU-199","1","Spring","2018","A-"],["44553","Peltier","Physics","56","PHY-101","1","Fall","2017","B-"],["19991","Brandt","History","80","HIS-351","1","Spring","2018","B"],["76653","Aoi","Elec. Eng.","60","EE-181","1","Spring","2017","C"],["00128","Zhang","Comp. Sci.","102","CS-101","1","Fall","2017","A"],["76543","Brown","Comp. Sci.","58","CS-319","2","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-190","2","Spring","2017","A"],["23121","Chavez","Finance","110","FIN-201","1","Spring","2018","C+"],["12345","Shankar","Comp. Sci.","32","CS-101","1","Fall","2017","C"],["98765","Bourikas","Elec. Eng.","98","CS-101","1","Fall","2017","C-"],["54321","Williams","Comp. Sci.","54","CS-101","1","Fall","2017","A-"],["70557","Snow","Physics","0",null,null,null,null,null],["45678","Levy","Physics","46","CS-101","1","Fall","2017","F"],["45678","Levy","Physics","46","CS-319","1","Spring","2018","B"],["98765","Bourikas","Elec. Eng.","98","CS-315","1","Spring","2018","B"],["98988","Tanaka","Biology","120","BIO-101","1","Summer","2017","A"],["98988","Tanaka","Biology","120","BIO-301","1","Summer","2018",null],["45678","Levy","Physics","46","CS-101","1","Spring","2018","B+"],["00128","Zhang","Comp. Sci.","102","CS-347","1","Fall","2017","A-"],["54321","Williams","Comp. Sci.","54","CS-190","2","Spring","2017","B+"]]}},{"id":"GK3.07","topic":"PE 4.3b full join rewrite","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.3b\u003c/strong> — Viết \u003ccode>select * from student natural full outer join takes\u003c/code> \u003cstrong>không dùng outer join\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.3 (b).\u003c/strong> Outer join expressions can be computed in SQL without using the SQL \u003cstrong>outer join\u003c/strong> operation. To illustrate this fact, show how to rewrite each of the following SQL queries without using the \u003cstrong>outer join\u003c/strong> expression.\u003c/p>\n\u003cp>b. \u003ccode>select * from student natural full outer join takes\u003c/code>\u003c/p>","hint":"Thêm nhánh thứ ba cho takes không khớp student (trên dữ liệu hợp lệ nhánh này rỗng vì foreign key).","solution":"(select * from student natural join takes)\nunion\n(select ID, name, dept_name, tot_cred, null, null, null, null, null\n from student S1\n where not exists (select ID from takes T1 where T1.ID = S1.ID))\nunion\n(select ID, null, null, null, course_id, sec_id, semester, year, grade\n from takes T1\n where not exists (select ID from student S1 where T1.ID = S1.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","dept_name","tot_cred","course_id","sec_id","semester","year","grade"],"rows":[["76543","Brown","Comp. Sci.","58","CS-101","1","Fall","2017","A"],["12345","Shankar","Comp. Sci.","32","CS-315","1","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-347","1","Fall","2017","A"],["55739","Sanchez","Music","38","MU-199","1","Spring","2018","A-"],["44553","Peltier","Physics","56","PHY-101","1","Fall","2017","B-"],["19991","Brandt","History","80","HIS-351","1","Spring","2018","B"],["76653","Aoi","Elec. Eng.","60","EE-181","1","Spring","2017","C"],["00128","Zhang","Comp. Sci.","102","CS-101","1","Fall","2017","A"],["76543","Brown","Comp. Sci.","58","CS-319","2","Spring","2018","A"],["12345","Shankar","Comp. Sci.","32","CS-190","2","Spring","2017","A"],["23121","Chavez","Finance","110","FIN-201","1","Spring","2018","C+"],["12345","Shankar","Comp. Sci.","32","CS-101","1","Fall","2017","C"],["98765","Bourikas","Elec. Eng.","98","CS-101","1","Fall","2017","C-"],["54321","Williams","Comp. Sci.","54","CS-101","1","Fall","2017","A-"],["70557","Snow","Physics","0",null,null,null,null,null],["45678","Levy","Physics","46","CS-101","1","Fall","2017","F"],["45678","Levy","Physics","46","CS-319","1","Spring","2018","B"],["98765","Bourikas","Elec. Eng.","98","CS-315","1","Spring","2018","B"],["98988","Tanaka","Biology","120","BIO-101","1","Summer","2017","A"],["98988","Tanaka","Biology","120","BIO-301","1","Summer","2018",null],["45678","Levy","Physics","46","CS-101","1","Spring","2018","B+"],["00128","Zhang","Comp. Sci.","102","CS-347","1","Fall","2017","A-"],["54321","Williams","Comp. Sci.","54","CS-190","2","Spring","2017","B+"]]}},{"id":"GK3.08","topic":"PE 4.4 outer join order","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.4\u003c/strong> — Tạo \u003ccode>gk_r(a, b)\u003c/code>, \u003ccode>gk_s(b, c)\u003c/code>, \u003ccode>gk_t(b, d)\u003c/code> (mọi cột \u003ccode>not null\u003c/code>) và chèn dữ liệu sao cho trong \u003ccode>(gk_r natural left outer join gk_s) natural left outer join gk_t\u003c/code> có dòng với \u003cstrong>c null nhưng d khác null\u003c/strong>. Hệ thống kiểm tra điều đó, và kiểm tra rằng với \u003ccode>gk_r natural left outer join (gk_s natural left outer join gk_t)\u003c/code> thì không có dòng như vậy (PE 4.4b).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.4.\u003c/strong> Suppose we have three relations r(A, B), s(B, C), and t(B, D), with all attributes declared as \u003cstrong>not null\u003c/strong>.\u003c/p>\n\u003cp>a. Give instances of relations r, s, and t such that in the result of\u003c/p>\n\u003cp>(r \u003cstrong>natural left outer join\u003c/strong> s) \u003cstrong>natural left outer join\u003c/strong> t\u003c/p>\n\u003cp>attribute C has a null value but attribute D has a non-null value.\u003c/p>\n\u003cp>b. Are there instances of r, s, and t such that the result of\u003c/p>\n\u003cp>r \u003cstrong>natural left outer join\u003c/strong> (s \u003cstrong>natural left outer join\u003c/strong> t)\u003c/p>\n\u003cp>has a null value for C but a non-null value for D? Explain why or why not.\u003c/p>","hint":"r = {(a, b)}, s = {(b1, c1)}, t = {(b, d)}.","solution":"create table gk_r (a varchar(5) not null, b varchar(5) not null);\ncreate table gk_s (b varchar(5) not null, c varchar(5) not null);\ncreate table gk_t (b varchar(5) not null, d varchar(5) not null);\ninsert into gk_r values ('a', 'b');\ninsert into gk_s values ('b1', 'c1');\ninsert into gk_t values ('b', 'd');","check":"select\n  (select count(*) > 0 from ((gk_r natural left outer join gk_s) natural left outer join gk_t) x\n   where x.c is null and x.d is not null) as case_a_c_null_d_not_null,\n  (select count(*) > 0 from (gk_r natural left outer join (gk_s natural left outer join gk_t)) y\n   where y.c is null and y.d is not null) as case_b_c_null_d_not_null,\n  (select count(*) from information_schema.columns\n   where table_name in ('gk_r', 'gk_s', 'gk_t') and is_nullable = 'NO') as not_null_columns;","ordered":false,"fresh":false,"expected":{"fields":["case_a_c_null_d_not_null","case_b_c_null_d_not_null","not_null_columns"],"rows":[["true","false","6"]]}},{"id":"GK3.09","topic":"PE 4.5a test data","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.5a\u003c/strong> — Tạo bộ dữ liệu test \u003cstrong>bắt được\u003c/strong> lỗi natural join của Section 4.1.1: các bảng \u003ccode>gk_instructor(ID, name, dept_name, salary)\u003c/code>, \u003ccode>gk_teaches(ID, course_id, sec_id, semester, year)\u003c/code>, \u003ccode>gk_course(course_id, title, dept_name, credits)\u003c/code> sao cho \u003ccode>gk_instructor natural join gk_teaches natural join gk_course\u003c/code> có \u003cstrong>ít dòng hơn\u003c/strong> \u003ccode>gk_instructor natural join gk_teaches join gk_course using (course_id)\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.5 (a).\u003c/strong> Testing SQL queries: To test if a query specified in English has been correctly written in SQL, the SQL query is typically executed on multiple test databases, and a human checks if the SQL query result on each test database matches the intention of the specification in English.\u003c/p>\n\u003cp>a. In Section 4.1.1 we saw an example of an erroneous SQL query which was intended to find which courses had been taught by each instructor; the query computed the natural join of \u003cem>instructor\u003c/em>, \u003cem>teaches\u003c/em>, and \u003cem>course\u003c/em>, and as a result it unintentionally equated the \u003cem>dept_name\u003c/em> attribute of \u003cem>instructor\u003c/em> and \u003cem>course\u003c/em>. Give an example of a dataset that would help catch this particular error.\u003c/p>","hint":"Một giảng viên Physics dạy môn Elec. Eng.","solution":"create table gk_instructor (ID varchar(5), name varchar(20), dept_name varchar(20), salary numeric(8,2));\ncreate table gk_teaches (ID varchar(5), course_id varchar(8), sec_id varchar(8), semester varchar(6), year numeric(4,0));\ncreate table gk_course (course_id varchar(8), title varchar(50), dept_name varchar(20), credits numeric(2,0));\ninsert into gk_instructor values ('12345', 'Gauss', 'Physics', 10000);\ninsert into gk_teaches values ('12345', 'EE321', '1', 'Spring', 2017);\ninsert into gk_course values ('EE321', 'Magnetism', 'Elec. Eng.', 6);","check":"select (select count(*) from gk_instructor natural join gk_teaches natural join gk_course)\n     \u003c (select count(*) from gk_instructor natural join gk_teaches join gk_course using (course_id)) as test_catches_bug;","ordered":false,"fresh":false,"expected":{"fields":["test_catches_bug"],"rows":[["true"]]}},{"id":"GK3.10","topic":"PE 4.6 view with nulls","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.6\u003c/strong> — Tạo view \u003ccode>gk_student_grades(ID, GPA)\u003c/code> cho \u003cstrong>mọi\u003c/strong> sinh viên: môn có grade null không tính vào cả tử số lẫn mẫu số; sinh viên chưa có môn nào có điểm (hoặc chưa học môn nào) có GPA = null. Dùng \u003ccode>case\u003c/code> thay cho \u003ccode>decode\u003c/code> của sách.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.6.\u003c/strong> Show how to define the view \u003cem>student_grades\u003c/em> (\u003cem>ID\u003c/em>, \u003cem>GPA\u003c/em>) giving the grade-point average of each student, based on the query in Exercise 3.2; recall that we used a relation \u003cem>grade_points\u003c/em>(\u003cem>grade\u003c/em>, \u003cem>points\u003c/em>) to get the numeric points associated with a letter grade. Make sure your view definition correctly handles the case of \u003cem>null\u003c/em> values for the \u003cem>grade\u003c/em> attribute of the \u003cem>takes\u003c/em> relation.\u003c/p>","hint":"","solution":"create view gk_student_grades (ID, GPA) as\nselect ID, credit_points / (case when credit_sum = 0 then null else credit_sum end)\nfrom ((select ID,\n              sum(case when grade is null then 0 else credits end) as credit_sum,\n              sum(case when grade is null then 0 else credits * points end) as credit_points\n       from (takes natural join course) natural left outer join grade_points\n       group by ID)\n      union\n      select ID, null, null from student where ID not in (select ID from takes)) as t;","check":"select ID, round(GPA, 4) from gk_student_grades;","ordered":false,"fresh":false,"expected":{"fields":["id","round"],"rows":[["76543","4"],["55739","3.7"],["00128","3.8714"],["76653","2"],["45678","2.0182"],["70557",null],["12345","3.4286"],["54321","3.5"],["44553","2.7"],["98765","2.2571"],["23121","2.3"],["19991","3"],["98988","4"]]}},{"id":"GK3.11","topic":"PE 4.7 DDL foreign keys","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.7\u003c/strong> — Viết DDL cho Employee database với tên \u003ccode>gk_employee(ID, person_name, street, city)\u003c/code>, \u003ccode>gk_company(company_name, city)\u003c/code>, \u003ccode>gk_works(ID, company_name, salary)\u003c/code>, \u003ccode>gk_manages(ID, manager_id)\u003c/code>: primary key như PE 2.1 (gk_manages: ID) và \u003cstrong>đủ bốn foreign key\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.7.\u003c/strong> Consider the employee database of Figure 4.12. Give an SQL DDL definition of this database. Identify referential-integrity constraints that should hold, and include them in the DDL definition.\u003c/p>\n\u003cp>\u003cem>Figure 4.12 — Employee database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>employee (\u003cu>ID\u003c/u>, person_name, street, city)\u003c/li>\u003cli>works (\u003cu>ID\u003c/u>, company_name, salary)\u003c/li>\u003cli>company (\u003cu>company_name\u003c/u>, city)\u003c/li>\u003cli>manages (\u003cu>ID\u003c/u>, manager_id)\u003c/li>\u003c/ul>","hint":"works.ID, works.company_name, manages.ID, manages.manager_id. Tạo gk_company trước gk_works.","solution":"create table gk_employee (ID numeric(6,0), person_name char(20), street char(30), city char(30), primary key (ID));\ncreate table gk_company (company_name char(15), city char(30), primary key (company_name));\ncreate table gk_works (ID numeric(6,0), company_name char(15), salary integer,\n  primary key (ID),\n  foreign key (ID) references gk_employee,\n  foreign key (company_name) references gk_company);\ncreate table gk_manages (ID numeric(6,0), manager_id numeric(6,0),\n  primary key (ID),\n  foreign key (ID) references gk_employee,\n  foreign key (manager_id) references gk_employee (ID));","check":"select c.conrelid::regclass::text as table_name,\n       case c.contype when 'p' then 'primary key' else 'foreign key' end as kind,\n       a.attname as column_name,\n       coalesce(c.confrelid::regclass::text, '') as referenced_table\nfrom pg_constraint c\njoin pg_attribute a on a.attrelid = c.conrelid and a.attnum = any (c.conkey)\nwhere c.contype in ('p', 'f')\n  and c.conrelid::regclass::text in ('gk_employee', 'gk_company', 'gk_works', 'gk_manages')\norder by 1, 2, 3;","ordered":false,"fresh":false,"expected":{"fields":["table_name","kind","column_name","referenced_table"],"rows":[["gk_company","primary key","company_name","-"],["gk_employee","primary key","id","-"],["gk_manages","foreign key","id","gk_employee"],["gk_manages","foreign key","manager_id","gk_employee"],["gk_manages","primary key","id","-"],["gk_works","foreign key","company_name","gk_company"],["gk_works","foreign key","id","gk_employee"],["gk_works","primary key","id","-"]]}},{"id":"GK3.12","topic":"PE 4.8a constraint query","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.8a\u003c/strong> — Tạo view \u003ccode>gk_room_conflicts(ID, name, semester, year, time_slot_id, num_rooms)\u003c/code>: các instructor dạy section ở \u003cstrong>nhiều hơn một phòng\u003c/strong> trong cùng semester, year và time slot. (Sửa hai lỗi của lời giải sách: bỏ sec_id khỏi group by; viết \u003ccode>count(distinct (building, room_number))\u003c/code>.) Khi chấm, hệ thống cho Katz dạy thêm một section ở phòng khác cùng time slot F, Spring 2018.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.8.\u003c/strong> As discussed in Section 4.4.8, we expect the constraint “an instructor cannot teach sections in two different classrooms in a semester in the same time slot” to hold.\u003c/p>\n\u003cp>a. Write an SQL query that returns all (\u003cem>instructor\u003c/em>, \u003cem>section\u003c/em>) combinations that violate this constraint.\u003c/p>\n\u003cp>b. Write an SQL assertion to enforce this constraint (as discussed in Section 4.4.8, current generation database systems do not support such assertions, although they are part of the SQL standard).\u003c/p>","hint":"","solution":"create view gk_room_conflicts (ID, name, semester, year, time_slot_id, num_rooms) as\nselect ID, name, semester, year, time_slot_id, count(distinct (building, room_number))\nfrom instructor natural join teaches natural join section\ngroup by ID, name, semester, year, time_slot_id\nhaving count(distinct (building, room_number)) > 1;","check":"insert into section values ('CS-315', '2', 'Spring', 2018, 'Watson', '120', 'F');\ninsert into teaches values ('45565', 'CS-315', '2', 'Spring', 2018);\nselect * from gk_room_conflicts;","ordered":false,"fresh":false,"expected":{"fields":["id","name","semester","year","time_slot_id","num_rooms"],"rows":[["45565","Katz","Spring","2018","F","2"]]}},{"id":"GK3.13","topic":"PE 4.9 cascade chain","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.9\u003c/strong> — Tạo \u003ccode>gk_manager(employee_id varchar(20) primary key, manager_id varchar(20))\u003c/code> với foreign key (manager_id) tham chiếu \u003ccode>gk_manager(employee_id)\u003c/code> \u003cstrong>on delete cascade\u003c/strong>. Chèn: (Alice, null), (Bob, Alice), (Carol, Alice), (Dave, Bob), (Eve, Dave), (Frank, null), (Grace, Frank). Sau đó xoá \u003cstrong>Bob\u003c/strong> và trả về các dòng còn lại.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.9.\u003c/strong> SQL allows a foreign-key dependency to refer to the same relation, as in the following example:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table manager\n  (employee_ID char(20),\n   manager_ID  char(20),\n   primary key employee_ID,\n   foreign key (manager_ID) references manager(employee_ID)\n     on delete cascade )\u003c/code>\u003c/pre>\n\u003cp>Here, \u003cem>employee_ID\u003c/em> is a key to the table \u003cem>manager\u003c/em>, meaning that each employee has at most one manager. The foreign-key clause requires that every manager also be an employee. Explain exactly what happens when a tuple in the relation \u003cem>manager\u003c/em> is deleted.\u003c/p>","hint":"","solution":"create table gk_manager (\n  employee_id varchar(20) primary key,\n  manager_id  varchar(20),\n  foreign key (manager_id) references gk_manager (employee_id) on delete cascade);\ninsert into gk_manager values ('Alice', null), ('Bob', 'Alice'), ('Carol', 'Alice'),\n  ('Dave', 'Bob'), ('Eve', 'Dave'), ('Frank', null), ('Grace', 'Frank');\ndelete from gk_manager where employee_id = 'Bob';\nselect * from gk_manager;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["employee_id","manager_id"],"rows":[["Alice",null],["Carol","Alice"],["Frank",null],["Grace","Frank"]]}},{"id":"GK3.14","topic":"PE 4.10 full outer join on","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.10\u003c/strong> — Với \u003ccode>emp_title(name, address, title)\u003c/code> và \u003ccode>emp_salary(name, address, salary)\u003c/code> (có null ở name/address), viết tương đương \u003ccode>emp_title natural full outer join emp_salary\u003c/code> bằng \u003cstrong>full outer join ... on\u003c/strong> và \u003cstrong>coalesce\u003c/strong>: cột name, address, title, salary (mỗi cột chung chỉ một bản).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.10.\u003c/strong> Given the relations a(\u003cem>name\u003c/em>, \u003cem>address\u003c/em>, \u003cem>title\u003c/em>) and b(\u003cem>name\u003c/em>, \u003cem>address\u003c/em>, \u003cem>salary\u003c/em>), show how to express a \u003cstrong>natural full outer join\u003c/strong> b using the \u003cstrong>full outer-join\u003c/strong> operation with an \u003cstrong>on\u003c/strong> condition rather than using the \u003cstrong>natural join\u003c/strong> syntax. This can be done using the \u003cstrong>coalesce\u003c/strong> operation. Make sure that the result relation does not contain two copies of the attributes \u003cem>name\u003c/em> and \u003cem>address\u003c/em> and that the solution is correct even if some tuples in a and b have null values for attributes \u003cem>name\u003c/em> or \u003cem>address\u003c/em>.\u003c/p>","hint":"","solution":"select coalesce(a.name, b.name) as name,\n       coalesce(a.address, b.address) as address,\n       a.title, b.salary\nfrom emp_title as a full outer join emp_salary as b\n  on a.name = b.name and a.address = b.address;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","address","title","salary"],"rows":[["An","Hanoi","Engineer","70000"],["Binh","Hue","Manager",null],["Binh","Saigon",null,"90000"],["Dung",null,null,"20000"],["Chi","Danang","Analyst",null],["Dung",null,"Intern",null],[null,"Saigon","Designer",null],["Em","Cantho",null,"50000"],[null,"Saigon",null,"65000"]]}},{"id":"GK3.15","topic":"PE 4.13 view authorization","level":3,"prompt":"\u003cp>\u003cstrong>PE 4.13 (1)\u003c/strong> — Tạo view \u003ccode>gk_physics_staff(ID, name)\u003c/code> (instructor khoa Physics) và role \u003ccode>gk_viewer\u003c/code>; grant select \u003cstrong>chỉ trên view\u003c/strong> cho gk_viewer. Hệ thống sẽ \u003ccode>set role gk_viewer\u003c/code>: đọc được view nhưng không đọc được bảng instructor.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.13.\u003c/strong> Consider a view v whose definition references only relation r.\u003c/p>\n\u003cul>\u003cli>If a user is granted \u003cstrong>select\u003c/strong> authorization on v, does that user need to have \u003cstrong>select\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>If a user is granted \u003cstrong>update\u003c/strong> authorization on v, does that user need to have \u003cstrong>update\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>Give an example of an \u003cstrong>insert\u003c/strong> operation on a view v to add a tuple t that is not visible in the result of \u003cstrong>select\u003c/strong> * \u003cstrong>from\u003c/strong> v. Explain your answer.\u003c/li>\u003c/ul>","hint":"","solution":"create view gk_physics_staff as\n  select ID, name from instructor where dept_name = 'Physics';\ncreate role gk_viewer;\ngrant select on gk_physics_staff to gk_viewer;","check":"set role gk_viewer;\nselect ID, name, try_sql($$select * from instructor$$) as read_instructor\nfrom gk_physics_staff;","ordered":false,"fresh":false,"expected":{"fields":["id","name","read_instructor"],"rows":[["22222","Einstein","42501"],["33456","Gold","42501"]]}},{"id":"GK3.16","topic":"PE 4.13 invisible insert","level":2,"prompt":"\u003cp>\u003cstrong>PE 4.13 (3)\u003c/strong> — Tạo view \u003ccode>gk_history_instructors\u003c/code> (mọi cột của instructor khoa History, \u003cstrong>không\u003c/strong> có with check option), rồi insert \u003cstrong>qua view\u003c/strong> giảng viên \u003ccode>('25566', 'Brown', 'Biology', 100000)\u003c/code>. Hệ thống kiểm tra: tuple có trong instructor nhưng không thấy qua view.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 4.13.\u003c/strong> Consider a view v whose definition references only relation r.\u003c/p>\n\u003cul>\u003cli>If a user is granted \u003cstrong>select\u003c/strong> authorization on v, does that user need to have \u003cstrong>select\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>If a user is granted \u003cstrong>update\u003c/strong> authorization on v, does that user need to have \u003cstrong>update\u003c/strong> authorization on r as well? Why or why not?\u003c/li>\u003cli>Give an example of an \u003cstrong>insert\u003c/strong> operation on a view v to add a tuple t that is not visible in the result of \u003cstrong>select\u003c/strong> * \u003cstrong>from\u003c/strong> v. Explain your answer.\u003c/li>\u003c/ul>","hint":"","solution":"create view gk_history_instructors as\n  select * from instructor where dept_name = 'History';\ninsert into gk_history_instructors values ('25566', 'Brown', 'Biology', 100000);","check":"select (select count(*) from instructor where ID = '25566') as in_instructor,\n       (select count(*) from gk_history_instructors where ID = '25566') as visible_in_view,\n       (select count(*) from gk_history_instructors) as view_rows;","ordered":false,"fresh":false,"expected":{"fields":["in_instructor","visible_in_view","view_rows"],"rows":[["1","0","2"]]}}]},{"key":"gk4","store":"gk4","short":"Đề GK","label":"Đề thi thử GK","navLabel":"Đề GK","kind":"Đề thi thử","title":"Mock Midterm (Chapters 1–4)","titleVi":"Đề thi thử giữa kỳ — Chương 1–4","summary":"\u003ch3>1. Cách làm đề thi thử\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Thời gian gợi ý: 90 phút\u003c/strong>, làm liền một mạch, không mở slide.\u003c/li>\u003cli>Đề có \u003cstrong>hai phần giống đề thật\u003c/strong>: \u003cstrong>A. Tự luận lý thuyết\u003c/strong> (viết ra giấy, khoảng 35 phút) và \u003cstrong>B. SQL\u003c/strong> (khoảng 55 phút). Không có trắc nghiệm. Trong phòng thi phải viết SQL trên giấy — hãy viết nháp hết rồi mới gõ vào máy để chạy kiểm tra.\u003c/li>\u003cli>Các câu là Practice Exercises của sách hoặc \u003cstrong>biến thể\u003c/strong> của chúng (đổi lược đồ, đổi hằng số, thêm \"bẫy\"). Câu nào sai thì quay lại phần ôn tương ứng (GK1–GK3).\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phần\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Điểm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A. Tự luận lý thuyết\u003c/td>\u003ctd>8 câu × 0,5\u003c/td>\u003ctd>4,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B. SQL\u003c/td>\u003ctd>12 bài × 0,5\u003c/td>\u003ctd>6,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tổng\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>10\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Tự chấm: tự luận so với \u003cem>gợi ý đáp án\u003c/em> (mỗi ý in đậm là một ý chấm điểm), rồi đánh dấu \"Đã tự chấm\"; SQL chấm tự động bằng nút \u003cstrong>Kiểm tra\u003c/strong>.\u003c/p>\n\u003ch3>2. Kế hoạch 7 ngày (tuần 7 → thi tuần 8)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ngày\u003c/th>\u003cth>Việc cần làm\u003c/th>\u003cth>Ở đâu\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Ôn Chương 1–2: keys, foreign key, 6 phép đại số quan hệ + join, division\u003c/td>\u003ctd>Part 1 · Chương 1, 2 → \u003cstrong>GK1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Practice Exercises 3.1–3.4 (select/aggregate/subquery, insert/delete/update)\u003c/td>\u003ctd>Part 1 · Chương 3 → \u003cstrong>GK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Practice Exercises 3.5–3.10 (case, like, bank, employee: all/some, not exists, having)\u003c/td>\u003ctd>\u003cstrong>GK2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Practice Exercises 4.1–4.6 (natural join trap, outer join, view GPA)\u003c/td>\u003ctd>Part 1 · Chương 4 → \u003cstrong>GK3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Practice Exercises 4.7–4.13 (DDL + FK, assertion, cascade, coalesce, authorization)\u003c/td>\u003ctd>\u003cstrong>GK3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Làm đề thi thử này trong 90 phút, chấm điểm, ghi lại câu sai\u003c/td>\u003ctd>\u003cstrong>Đề GK\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Làm lại các câu sai + bài ★★★ của GK1–GK3; đọc lại bảng \"phải thuộc\" bên dưới\u003c/td>\u003ctd>GK1–GK3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>3. Checklist \"phải thuộc\"\u003c/h3>\n\u003cul>\u003cli>Superkey ⊇ candidate key (tối thiểu) ⊇ primary key (được chọn); foreign key: referencing → referenced; insert vào referencing / delete ở referenced có thể vi phạm.\u003c/li>\u003cli>σ, Π (loại trùng), ∪, −, ×, ρ là 6 phép cơ bản; ∩, ⋈, ÷, ← suy ra được. Division \"\u003cstrong>với mọi\u003c/strong>\" ↔ SQL \u003ccode>not exists (A except B)\u003c/code>.\u003c/li>\u003cli>\u003ccode>from r1, r2\u003c/code> là tích Descartes: nếu một bảng rỗng thì kết quả rỗng (PE 3.7).\u003c/li>\u003cli>Aggregate bỏ qua null, trừ \u003ccode>count(*)\u003c/code>; \u003ccode>count\u003c/code> trên tập rỗng = 0, \u003ccode>sum/avg/max\u003c/code> = null.\u003c/li>\u003cli>\"Tìm X có giá trị lớn nhất (có thể hoà)\": \u003ccode>with t as (...) select ... where v = (select max(v) from t)\u003c/code> hoặc \u003ccode>having ... &gt;= all (...)\u003c/code>.\u003c/li>\u003cli>Cột trong \u003ccode>select\u003c/code> không nằm trong aggregate phải có trong \u003ccode>group by\u003c/code>; điều kiện trên nhóm đặt ở \u003ccode>having\u003c/code>.\u003c/li>\u003cli>Đếm cả nhóm 0 phần tử: \u003cstrong>left outer join\u003c/strong> + \u003ccode>count(cột của bảng bên phải)\u003c/code> hoặc \u003cstrong>scalar subquery\u003c/strong>.\u003c/li>\u003cli>Bẫy natural join: \u003ccode>instructor natural join teaches natural join course\u003c/code> ghép thêm theo dept_name.\u003c/li>\u003cli>\u003ccode>update\u003c/code> theo nhiều mức: dùng \u003ccode>case\u003c/code> trong một câu (thứ tự 2 câu update có thể làm sai kết quả).\u003c/li>\u003cli>View đơn giản mới update được; \u003ccode>with check option\u003c/code> chặn dòng không thoả where. Quyền select trên view không cần quyền trên bảng gốc.\u003c/li>\u003cli>\u003ccode>on delete cascade\u003c/code> trên FK tự tham chiếu xoá \u003cstrong>toàn bộ cây\u003c/strong> cấp dưới (PE 4.9).\u003c/li>\u003c/ul>","quiz":[],"questions":[{"q":"\u003cstrong>A1\u003c/strong> — Cho bank database. (a) Chỉ ra primary key và mọi foreign key của borrower và depositor. (b) Cho một ví dụ insert và một ví dụ delete vi phạm FK depositor.account_number → account.","en":"","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> borrower(\u003cstrong>ID, loan_number\u003c/strong>): FK ID → customer, loan_number → loan. depositor(\u003cstrong>ID, account_number\u003c/strong>): FK ID → customer, account_number → account. Khoá gồm cả hai cột vì quan hệ nhiều–nhiều (một khách nhiều tài khoản, tài khoản đứng tên chung).\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Insert \u003ccode>('12345', 'A-999')\u003c/code> vào depositor khi account không có A-999. Delete \u003ccode>A-101\u003c/code> khỏi account khi depositor còn \u003ccode>('67890', 'A-101')\u003c/code> (nếu FK không có on delete cascade).\u003c/p>"},{"q":"\u003cstrong>A2\u003c/strong> — Viết đại số quan hệ trên bank database: (a) tên các branch ở thành phố Horseneck có assets > 1.000.000; (b) ID khách có loan ở \u003cstrong>mọi\u003c/strong> branch của thành phố Brooklyn.","en":"","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city = \"Horseneck\" ∧ assets > 1000000\u003c/sub>(branch))\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Dùng division: r ← Π\u003csub>ID, branch_name\u003c/sub>(borrower ⋈ loan), s ← Π\u003csub>branch_name\u003c/sub>(σ\u003csub>branch_city = \"Brooklyn\"\u003c/sub>(branch)); kết quả \u003cstrong>r ÷ s\u003c/strong>.\u003c/p>\n\u003cp>Không dùng ÷: Π\u003csub>ID\u003c/sub>(r) − Π\u003csub>ID\u003c/sub>((Π\u003csub>ID\u003c/sub>(r) × s) − r).\u003c/p>"},{"q":"\u003cstrong>A3\u003c/strong> — Giải thích vì sao truy vấn sau cho kết quả sai khi một section chưa có sinh viên, và sửa lại: \u003ccode>select course_id, sec_id, count(*) from section natural join takes where semester = 'Fall' and year = 2017 group by course_id, sec_id\u003c/code>.","en":"","answer":"\u003cp>\u003cstrong>Lỗi:\u003c/strong> inner join loại các section không có dòng takes → section 0 sinh viên \u003cstrong>biến mất\u003c/strong> (PE 3.1e). (Ngoài ra nếu đổi sang outer join thì phải dùng \u003ccode>count(takes.ID)\u003c/code>, không dùng \u003ccode>count(*)\u003c/code>.)\u003c/p>\n\u003cp>\u003cstrong>Sửa 1 — scalar subquery:\u003c/strong>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select course_id, sec_id,\n       (select count(ID) from takes t\n        where t.course_id = s.course_id and t.sec_id = s.sec_id\n          and t.semester = s.semester and t.year = s.year) as enrollment\nfrom section s where semester = 'Fall' and year = 2017;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Sửa 2 — outer join:\u003c/strong> \u003ccode>section left outer join takes using (course_id, sec_id, semester, year)\u003c/code> + \u003ccode>count(takes.ID)\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>A4\u003c/strong> — Viết DDL cho insurance database (person, car, accident, owns, participated) với đầy đủ primary key, foreign key. Khi xoá một car, ta muốn các dòng owns của xe đó bị xoá theo — khai báo thế nào?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table person (driver_id varchar(5) primary key, name varchar(30) not null, address varchar(50));\ncreate table car (license_plate varchar(10) primary key, model varchar(30), year integer);\ncreate table accident (report_number varchar(10) primary key, year integer, location varchar(50));\ncreate table owns (\n  driver_id varchar(5) references person,\n  license_plate varchar(10) references car on delete cascade,\n  primary key (driver_id, license_plate));\ncreate table participated (\n  report_number varchar(10) references accident,\n  license_plate varchar(10) references car,\n  driver_id varchar(5) references person,\n  damage_amount numeric(10,2),\n  primary key (report_number, license_plate));\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ý chấm:\u003c/strong> khoá kép của owns và participated; FK đủ chiều; \u003ccode>on delete cascade\u003c/code> đặt ở \u003cstrong>owns.license_plate\u003c/strong> (bảng referencing). Nếu participated không cascade, xoá xe đã gặp tai nạn sẽ bị từ chối — phải quyết định có giữ lịch sử tai nạn hay không.\u003c/p>"},{"q":"\u003cstrong>A5\u003c/strong> — Định nghĩa view \u003ccode>customer_balance(ID, total_balance)\u003c/code> cho tổng số dư mỗi khách, \u003cstrong>kể cả khách không có tài khoản (tổng = 0)\u003c/strong>. View này có update được không? User chỉ có quyền select trên view thì có đọc được bảng account không?","en":"","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create view customer_balance (ID, total_balance) as\nselect c.ID, coalesce(sum(a.balance), 0)\nfrom customer c left outer join depositor d on c.ID = d.ID\n                left outer join account a on a.account_number = d.account_number\ngroup by c.ID;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ý chấm:\u003c/strong> cần \u003cstrong>left outer join\u003c/strong> + \u003ccode>coalesce\u003c/code> (sum trên tập rỗng = null). View có join và aggregate nên \u003cstrong>không\u003c/strong> updatable. Quyền select trên view \u003cstrong>không\u003c/strong> cho đọc account (PE 4.13) — chỉ thấy dữ liệu đã tổng hợp.\u003c/p>"},{"q":"\u003cstrong>A6 · biến thể PE 1.1/1.4\u003c/strong> — Trường muốn làm hệ thống đăng ký môn học. Với \u003cstrong>từng\u003c/strong> nhược điểm của file-processing system (Section 1.2), nêu một tình huống cụ thể của hệ thống này mà nhược điểm đó gây ra. Sau đó nêu \u003cstrong>hai nhược điểm\u003c/strong> khi dùng DBMS thay cho file.","en":"\u003cp>Suppose you want to build a course-registration system for a university. Consider each of the points listed in Section 1.2 as disadvantages of keeping data in a file-processing system. Discuss the relevance of each point to this application. (Variant of Exercise 1.4)\u003c/p>","answer":"\u003cp>\u003cstrong>Nhược điểm của file-processing (mỗi ý một tình huống):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Data redundancy & inconsistency:\u003c/strong> địa chỉ sinh viên lưu ở file phòng đào tạo và file thư viện → sửa một nơi, nơi kia sai.\u003c/li>\u003cli>\u003cstrong>Difficulty in accessing data:\u003c/strong> muốn \"sinh viên đăng ký trên 18 tín chỉ\" phải viết chương trình mới.\u003c/li>\u003cli>\u003cstrong>Data isolation:\u003c/strong> dữ liệu rải nhiều file, nhiều định dạng → khó viết chương trình lấy dữ liệu.\u003c/li>\u003cli>\u003cstrong>Integrity problems:\u003c/strong> \"lớp không quá sức chứa phòng\", \"tot_cred ≥ 0\" bị chôn trong code, khó thêm/sửa.\u003c/li>\u003cli>\u003cstrong>Atomicity problems:\u003c/strong> chuyển lớp = huỷ lớp cũ + đăng ký lớp mới; máy hỏng giữa chừng → mất chỗ cả hai lớp.\u003c/li>\u003cli>\u003cstrong>Concurrent-access anomalies:\u003c/strong> hai sinh viên cùng lấy chỗ cuối cùng → lớp vượt sĩ số.\u003c/li>\u003cli>\u003cstrong>Security problems:\u003c/strong> giảng viên chỉ được xem điểm lớp mình, khó phân quyền trên file.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Nhược điểm DBMS (PE 1.1):\u003c/strong> cài đặt tốn \u003cstrong>chi phí, kiến thức, thời gian\u003c/strong>; độ \u003cstrong>phức tạp\u003c/strong> có thể làm hiệu năng kém với ứng dụng đơn giản.\u003c/p>"},{"q":"\u003cstrong>A7 · biến thể PE 2.3/2.4\u003c/strong> — Bảng takes(ID, course_id, sec_id, semester, year, grade). (a) Vì sao grade \u003cstrong>không\u003c/strong> thuộc primary key? (b) {ID, course_id} có làm primary key được không? (c) Trong dữ liệu mẫu hiện tại không có hai dòng trùng (ID, course_id). Điều đó có chứng minh được (b) không?","en":"\u003cp>Consider the relation takes(ID, course_id, sec_id, semester, year, grade). Explain why grade is not part of the primary key. Could {ID, course_id} alone be a primary key? (Variant of Exercises 2.3 and 2.4)\u003c/p>","answer":"\u003cp>\u003cstrong>(a)\u003c/strong> Mỗi sinh viên học một section (course_id, sec_id, semester, year) chỉ có \u003cstrong>một\u003c/strong> grade → grade \u003cstrong>được xác định\u003c/strong> bởi các cột khoá, đưa vào khoá là thừa và cho phép hai điểm khác nhau cho cùng một lần học (giống lý luận end_time của time_slot, PE 2.3).\u003c/p>\n\u003cp>\u003cstrong>(b) Không:\u003c/strong> sinh viên có thể \u003cstrong>học lại\u003c/strong> cùng course ở học kỳ khác → hai dòng trùng (ID, course_id). Khoá phải gồm cả section: (ID, course_id, sec_id, semester, year).\u003c/p>\n\u003cp>\u003cstrong>(c) Không\u003c/strong> (PE 2.4): key là ràng buộc trên \u003cstrong>schema\u003c/strong>, áp cho \u003cstrong>mọi\u003c/strong> instance hợp lệ; một instance cụ thể không trùng không chứng minh được gì.\u003c/p>"},{"q":"\u003cstrong>A8 · biến thể PE 4.9, 4.13\u003c/strong> — (a) Bảng emp_tree(employee_id primary key, manager_id) với manager_id là foreign key tham chiếu emp_tree(employee_id) \u003cstrong>on delete cascade\u003c/strong>. Giải thích chính xác điều gì xảy ra khi xoá một nhân viên; nếu đổi thành \u003cstrong>on delete set null\u003c/strong> thì sao? (b) User được grant \u003cstrong>select\u003c/strong> trên một view v (chỉ dựa trên bảng r) có cần quyền select trên r không? Còn \u003cstrong>update\u003c/strong> trên v thì sao?","en":"\u003cp>Explain exactly what happens when a tuple is deleted from emp_tree(employee_id primary key, manager_id references emp_tree(employee_id) on delete cascade). What changes if the clause is on delete set null instead? (Variant of Exercise 4.9)\u003c/p>","answer":"\u003cp>\u003cstrong>(a) on delete cascade:\u003c/strong> xoá nhân viên X → mọi dòng có manager_id = X bị xoá, rồi \u003cstrong>đệ quy\u003c/strong> xoá cấp dưới của những người đó… → \u003cstrong>toàn bộ cây\u003c/strong> dưới X biến mất (PE 4.9). Cả dây chuyền nằm trong cùng một transaction: một bước lỗi thì không dòng nào bị xoá.\u003cbr>\u003cstrong>on delete set null:\u003c/strong> chỉ xoá X; cấp dưới \u003cstrong>trực tiếp\u003c/strong> của X có manager_id = null, cấp dưới gián tiếp không đổi.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong> Select trên v: \u003cstrong>không cần\u003c/strong> quyền trên r — view là cách cấp quyền chỉ trên một phần dữ liệu (PE 4.13). Update trên v: theo sách \u003cstrong>có cần\u003c/strong> — update qua v thực chất là update r, nên phải được phép cập nhật r. \u003cem>(PostgreSQL chạy view bằng quyền của chủ view, nên trên thực tế user chỉ cần quyền update trên view.)\u003c/em>\u003c/p>"}],"exercises":[{"id":"GK4.01","topic":"outer join + count","level":2,"prompt":"\u003cp>Bank database. Với \u003cstrong>mọi\u003c/strong> branch: branch_name và số loan của branch đó (\u003ccode>num_loans\u003c/code>, bằng 0 nếu không có). Không dùng subquery.\u003c/p>","en":"","hint":"Biến thể PE 4.2d: left outer join + count(cột của loan).","solution":"select branch_name, count(loan_number) as num_loans\nfrom branch natural left outer join loan\ngroup by branch_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","num_loans"],"rows":[["North Town","1"],["Downtown","2"],["Perryridge","2"],["Mianus","1"],["Chicago Loop","1"],["Round Hill","1"],["Lakeview","0"],["Brighton","0"],["Redwood","1"]]}},{"id":"GK4.02","topic":"intersect","level":1,"prompt":"\u003cp>ID các khách hàng \u003cstrong>vừa\u003c/strong> có account \u003cstrong>vừa\u003c/strong> có loan.\u003c/p>","en":"","hint":"","solution":"(select ID from depositor)\nintersect\n(select ID from borrower);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["56789"],["90123"],["12345"],["91234"],["78901"]]}},{"id":"GK4.03","topic":"division (for all)","level":3,"prompt":"\u003cp>ID và customer_name của khách có account ở \u003cstrong>mọi\u003c/strong> branch đặt tại thành phố \u003ccode>Brooklyn\u003c/code>.\u003c/p>","en":"","hint":"not exists ((branch ở Brooklyn) except (branch mà khách C có account)).","solution":"select C.ID, C.customer_name\nfrom customer as C\nwhere not exists (\n  (select branch_name from branch where branch_city = 'Brooklyn')\n  except\n  (select a.branch_name\n   from depositor d join account a on a.account_number = d.account_number\n   where d.ID = C.ID));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","customer_name"],"rows":[["67890","Johnson"]]}},{"id":"GK4.04","topic":"with + max (ties)","level":2,"prompt":"\u003cp>Branch có \u003cstrong>tổng số tiền cho vay\u003c/strong> (sum amount của loan) lớn nhất — nếu hoà thì trả về tất cả. Trả về branch_name và total_amount.\u003c/p>","en":"","hint":"Biến thể PE 3.1g.","solution":"with branch_total as (\n  select branch_name, sum(amount) as total_amount\n  from loan group by branch_name)\nselect branch_name, total_amount\nfrom branch_total\nwhere total_amount = (select max(total_amount) from branch_total);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","total_amount"],"rows":[["North Town","7500"]]}},{"id":"GK4.05","topic":"having + subquery","level":2,"prompt":"\u003cp>Các branch có \u003cstrong>số dư trung bình\u003c/strong> (avg balance của account) lớn hơn số dư trung bình của \u003cstrong>toàn bộ\u003c/strong> account. Trả về branch_name.\u003c/p>","en":"","hint":"Biến thể PE 3.9g.","solution":"select branch_name\nfrom account\ngroup by branch_name\nhaving avg(balance) > (select avg(balance) from account);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Mianus"],["Chicago Loop"],["Brighton"],["Redwood"]]}},{"id":"GK4.06","topic":"correlated subquery","level":2,"prompt":"\u003cp>Employee database. ID, person_name và salary của nhân viên có lương \u003cstrong>cao hơn lương trung bình của chính công ty mình\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"select e.ID, e.person_name, w.salary\nfrom employee e join works w on w.ID = e.ID\nwhere w.salary > (select avg(w2.salary) from works w2\n                  where w2.company_name = w.company_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","person_name","salary"],"rows":[["10001","Alice Nguyen","85000"],["10004","David Pham","92000"],["10006","Frank Do","52000"],["10007","Grace Ho","120000"],["10009","Ivy Dang","58000"],["10010","Jack Ngo","61000"]]}},{"id":"GK4.07","topic":"update + case","level":2,"prompt":"\u003cp>Nhân viên của \u003ccode>Mega Corp\u003c/code>: lương \u003cstrong>dưới 50000\u003c/strong> tăng 8%, còn lại tăng 4%. Viết \u003cstrong>một\u003c/strong> câu update (an toàn với thứ tự).\u003c/p>","en":"","hint":"Biến thể PE 3.10b.","solution":"update works\nset salary = salary * (case when salary \u003c 50000 then 1.08 else 1.04 end)\nwhere company_name = 'Mega Corp';","check":"select ID, salary from works where company_name = 'Mega Corp';","ordered":false,"fresh":false,"expected":{"fields":["id","salary"],"rows":[["10009","60320"],["10010","63440"],["10013","50760"],["12345","52000"]]}},{"id":"GK4.08","topic":"insert ... select","level":3,"prompt":"\u003cp>Mỗi khách có **loan ở branch \u003ccode>Downtown\u003c/code>** được mở một account mới tại Downtown: account_number là \u003ccode>'A-9' || ID\u003c/code>, balance 100; đồng thời thêm dòng depositor tương ứng.\u003c/p>","en":"","hint":"Hai câu insert ... select: account trước (vì FK), depositor sau.","solution":"insert into account\nselect distinct 'A-9' || b.ID, 'Downtown', 100\nfrom borrower b join loan l on l.loan_number = b.loan_number\nwhere l.branch_name = 'Downtown';\ninsert into depositor\nselect distinct b.ID, 'A-9' || b.ID\nfrom borrower b join loan l on l.loan_number = b.loan_number\nwhere l.branch_name = 'Downtown';","check":"select ID, account_number, balance\nfrom depositor natural join account\nwhere branch_name = 'Downtown';","ordered":false,"fresh":false,"expected":{"fields":["id","account_number","balance"],"rows":[["12345","A-101","500"],["67890","A-101","500"],["19283","A-919283","100"],["78901","A-978901","100"],["92345","A-992345","100"]]}},{"id":"GK4.09","topic":"view with check option","level":2,"prompt":"\u003cp>Tạo view \u003ccode>brooklyn_branches\u003c/code> gồm mọi cột của branch ở thành phố \u003ccode>Brooklyn\u003c/code>, \u003cstrong>with check option\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"create view brooklyn_branches as\n  select * from branch where branch_city = 'Brooklyn'\n  with check option;","check":"select try_sql($$insert into brooklyn_branches values ('Bay Ridge', 'Brooklyn', 100000)$$) as insert_brooklyn,\n       try_sql($$insert into brooklyn_branches values ('Harlem', 'New York', 100000)$$) as insert_other_city,\n       sql_value('select count(*) from brooklyn_branches') as rows_in_view;","ordered":false,"fresh":false,"expected":{"fields":["insert_brooklyn","insert_other_city","rows_in_view"],"rows":[["ok","44000","3"]]}},{"id":"GK4.10","topic":"FK self cascade","level":3,"prompt":"\u003cp>Tạo bảng \u003ccode>emp_tree(employee_id varchar(5) primary key, manager_id varchar(5))\u003c/code> với manager_id là \u003cstrong>foreign key tham chiếu chính emp_tree, on delete cascade\u003c/strong>. Nạp mọi nhân viên của employee (manager_id lấy từ manages, null nếu không có quản lý), rồi **xoá nhân viên \u003ccode>'10004'\u003c/code>**.\u003c/p>","en":"","hint":"Insert tất cả với manager_id null trước, rồi update từ manages — để FK không bị vi phạm khi chèn. Biến thể PE 4.9.","solution":"create table emp_tree (\n  employee_id varchar(5) primary key,\n  manager_id  varchar(5) references emp_tree (employee_id) on delete cascade);\ninsert into emp_tree select ID, null from employee;\nupdate emp_tree t set manager_id = m.manager_id\nfrom manages m where m.ID = t.employee_id;\ndelete from emp_tree where employee_id = '10004';","check":"select employee_id, manager_id from emp_tree;","ordered":false,"fresh":false,"expected":{"fields":["employee_id","manager_id"],"rows":[["10005",null],["10007",null],["10009",null],["10011",null],["10012",null],["10006","10005"],["10008","10007"],["10010","10009"],["10013","10009"],["12345","10009"]]}},{"id":"GK4.11","topic":"grant on view","level":2,"prompt":"\u003cp>Tạo view \u003ccode>small_bank_staff(ID, person_name, city)\u003c/code> — nhân viên của \u003ccode>Small Bank Corporation\u003c/code>. Tạo role \u003ccode>hr_clerk\u003c/code>, cấp quyền \u003cstrong>select trên view\u003c/strong> (không cấp gì trên employee/works).\u003c/p>","en":"","hint":"","solution":"create view small_bank_staff (ID, person_name, city) as\n  select e.ID, e.person_name, e.city\n  from employee e join works w on w.ID = e.ID\n  where w.company_name = 'Small Bank Corporation';\ncreate role hr_clerk;\ngrant select on small_bank_staff to hr_clerk;","check":"select has_table_privilege('hr_clerk', 'small_bank_staff', 'select') as view_select,\n       has_table_privilege('hr_clerk', 'works', 'select') as works_select,\n       (select count(*) from small_bank_staff) as staff;","ordered":false,"fresh":false,"expected":{"fields":["view_select","works_select","staff"],"rows":[["true","false","2"]]}},{"id":"GK4.12","topic":"RA → SQL","level":1,"prompt":"\u003cp>Viết SQL cho Π\u003csub>ID\u003c/sub>(σ\u003csub>city = \"Miami\"\u003c/sub>(employee)) − Π\u003csub>ID\u003c/sub>(σ\u003csub>company_name = \"First Bank Corporation\"\u003c/sub>(works)).\u003c/p>","en":"","hint":"","solution":"(select ID from employee where city = 'Miami')\nexcept\n(select ID from works where company_name = 'First Bank Corporation');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["10005"],["10007"],["10010"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
async function produceTable(db, sql, check, fresh) {
  if (fresh) {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
  for (let i = start; i <= items.length - (k - acc.length); i++) yield* subsetsOfSize(items, k, i + 1, [...acc, items[i]]);
}

// Candidate keys by increasing size. Attributes that never appear on a right
// side belong to every key; attributes only on right sides belong to none.
function fdCandidateKeys(R, fds) {
  const onRight = new Set(fds.flatMap(f => minus(f.rhs, f.lhs)));
  const onLeft = new Set(fds.flatMap(f => f.lhs));
  const core = R.filter(a => !onRight.has(a));
  const optional = R.filter(a => onRight.has(a) && onLeft.has(a));
  const keys = [];
  for (let k = 0; k <= optional.length; k++) {
    for (const extra of subsetsOfSize(optional, k)) {
      const K = order(R, [...core, ...extra]);
      if (keys.some(key => subset(key, K))) continue;
      if (fdIsSuperkey(R, fds, K)) keys.push(K);
    }
  }
  return keys;
}

// Canonical cover with a log of every change (slides 7.48–7.50): merge equal
// left sides, then delete one extraneous attribute at a time (Exercise 7.15
// shows why deleting two at once is wrong) until nothing changes.
function fdCover(R, fds, letters) {
  const fa = xs => fdFormat(xs, letters);
  const ff = f => fdFormatFD(f, letters);
  let F = fds.map(f => ({ lhs: [...f.lhs], rhs: [...f.rhs] }));
  const log = [];
  const mergeLeft = () => {
    const merged = [];
    for (const f of F) {
      const g = merged.find(x => same(x.lhs, f.lhs));
      if (g) {
        log.push(`Hợp (union rule): ${ff(g)} và ${ff(f)} → ${ff({ lhs: g.lhs, rhs: union(R, g.rhs, f.rhs) })}`);
        g.rhs = union(R, g.rhs, f.rhs);
      } else merged.push({ lhs: [...f.lhs], rhs: [...f.rhs] });
    }
    F = merged;
  };
  const step = () => {
    for (let i = 0; i < F.length; i++) {
      const f = F[i];
      // Left side: A ∈ α is extraneous if (α − A)⁺ under F contains β.
      if (f.lhs.length > 1) {
        for (const A of f.lhs) {
          const rest = minus(f.lhs, [A]);
          if (subset(f.rhs, fdClosure(R, F, rest).result)) {
            log.push(`${A} thừa ở vế trái của ${ff(f)}: (${fa(rest)})⁺ dưới F chứa ${fa(f.rhs)} → thay bằng ${ff({ lhs: rest, rhs: f.rhs })}`);
            F[i] = { lhs: rest, rhs: f.rhs };
            return true;
          }
        }
      }
      // Right side: A ∈ β is extraneous if α⁺ under F' (A removed from β) contains A.
      for (const A of f.rhs) {
        const reduced = { lhs: f.lhs, rhs: minus(f.rhs, [A]) };
        const Fp = F.map((g, j) => (j === i ? reduced : g)).filter(g => g.rhs.length);
        if (fdClosure(R, Fp, f.lhs).result.includes(A)) {
          log.push(`${A} thừa ở vế phải của ${ff(f)}: (${fa(f.lhs)})⁺ dưới F' (đã bỏ ${A}) vẫn chứa ${A} → ${reduced.rhs.length ? ff(reduced) : 'xoá FD này'}`);
          F = Fp;
          return true;
        }
      }
    }
    return false;
  };
  do mergeLeft(); while (step());
  return { cover: F, log };
}

// A BCNF violation on schema Ri (using F⁺ restricted to Ri): a set α ⊆ Ri
// with α⁺ ∩ Ri ⊋ α and α⁺ ⊉ Ri. Small schemas only (exponential search).
function fdBcnfViolation(R, fds, Ri) {
  for (let k = 1; k < Ri.length; k++) {
    for (const alpha of subsetsOfSize(Ri, k)) {
      const cl = fdClosure(R, fds, alpha).result;
      const beta = minus(order(Ri, cl), alpha);
      if (beta.length && !subset(Ri, cl)) return { lhs: alpha, rhs: beta };
    }
  }
  return null;
}

// BCNF decomposition (slide 7.57): replace Ri by (Ri − β) and (α ∪ β).
function fdBcnfDecompose(R, fds) {
  let result = [order(R, R)];
  const steps = [];
  for (let guard = 0; guard < 50; guard++) {
    const idx = result.findIndex(Ri => fdBcnfViolation(R, fds, Ri));
    if (idx < 0) break;
    const Ri = result[idx];
    const v = fdBcnfViolation(R, fds, Ri);
    const r1 = union(R, v.lhs, v.rhs);
    const r2 = minus(Ri, v.rhs);
    steps.push({ schema: Ri, fd: v, r1, r2 });
    result.splice(idx, 1, r1, r2);
  }
  return { result, steps };
}

// 3NF test on the original schema: for each α → A (A ∉ α) in F, α is a
// superkey or A is prime (in some candidate key).
function fdThirdNFViolations(R, fds, keys) {
  const prime = new Set((keys || fdCandidateKeys(R, fds)).flat());
  const out = [];
  for (const f of fds) {
    if (fdIsSuperkey(R, fds, f.lhs)) continue;
    const bad = minus(f.rhs, f.lhs).filter(a => !prime.has(a));
    if (bad.length) out.push({ lhs: f.lhs, rhs: bad });
  }
  return out;
}

function fdBcnfViolations(R, fds) {
  return fds.filter(f => minus(f.rhs, f.lhs).length && !fdIsSuperkey(R, fds, f.lhs));
}

// 3NF synthesis (slide 7.63) from the canonical cover.
function fdThirdNFDecompose(R, fds, letters) {
  const { cover } = fdCover(R, fds, letters);
  const schemas = [];
  const steps = [];
  for (const f of cover) {
    const s = union(R, f.lhs, f.rhs);
    if (schemas.some(x => subset(s, x))) steps.push({ kind: 'skip', fd: f, schema: s });
    else { schemas.push(s); steps.push({ kind: 'add', fd: f, schema: s }); }
  }
  const keys = fdCandidateKeys(R, fds);
  if (!schemas.some(s => keys.some(k => subset(k, s)))) {
    schemas.push(keys[0]);
    steps.push({ kind: 'key', schema: keys[0] });
  }
  // Remove schemas contained in another one.
  const result = schemas.filter((s, i) => !schemas.some((t, j) => j !== i && subset(s, t) && (!same(s, t) || j < i)));
  schemas.filter(s => !result.includes(s)).forEach(s => steps.push({ kind: 'drop', schema: s }));
  return { cover, keys, result, steps };
}

// Lossless test for a binary decomposition: R1 ∩ R2 → R1 or R1 ∩ R2 → R2.
function fdLosslessBinary(R, fds, R1, R2) {
  const common = R1.filter(a => R2.includes(a));
  const cl = fdClosure(R, fds, common).result;
  return { common, closure: cl, lossless: subset(R1, cl) || subset(R2, cl) };
}

// General lossless test (chase / tableau) for any number of schemas.
function fdLosslessChase(R, fds, schemas) {
  const rows = schemas.map((S, i) => R.map(a => (S.includes(a) ? `a:${a}` : `b${i}:${a}`)));
  let changed = true;
  while (changed) {
    changed = false;
    for (const f of fds) {
      const li = f.lhs.map(a => R.indexOf(a));
      for (let x = 0; x < rows.length; x++) {
        for (let y = x + 1; y < rows.length; y++) {
          if (!li.every(i => rows[x][i] === rows[y][i])) continue;
          for (const a of f.rhs) {
            const i = R.indexOf(a);
            const u = rows[x][i], v = rows[y][i];
            if (u === v) continue;
            const keep = u.startsWith('a:') ? u : v.startsWith('a:') ? v : u < v ? u : v;
            const drop = keep === u ? v : u;
            for (const r of rows) for (let j = 0; j < r.length; j++) if (r[j] === drop) r[j] = keep;
            changed = true;
          }
        }
      }
    }
  }
  return rows.some(r => r.every(v => v.startsWith('a:')));
}

// Dependency preservation without computing F⁺ (slide 7.53).
function fdPreserved(R, fds, schemas, f) {
  let result = [...f.lhs];
  let changed = true;
  while (changed) {
    changed = false;
    for (const Ri of schemas) {
      const t = order(Ri, fdClosure(R, fds, result.filter(a => Ri.includes(a))).result);
      const next = union(R, result, t);
      if (next.length > result.length) { result = next; changed = true; }
    }
  }
  return subset(f.rhs, result);
}

function fdParseSchemas(text, letters, R) {
  return String(text).split(/[\n;|]+/).map(s => s.replace(/^\s*R\d*\s*=\s*/i, '').trim()).filter(Boolean)
    .map(s => order(R, [...new Set(fdParseAttrs(s, letters))]));
}

signalEl.addEventListener('mouseenter', () => { if (signal.state !== 'ready' && signal.state !== 'error') renderSignalPop(); });
document.addEventListener('click', e => {
  if (!signalEl.contains(e.target)) { signalEl.classList.remove('is-open'); signalBtn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && signalEl.classList.contains('is-open')) { signalEl.classList.remove('is-open'); signalBtn.focus(); }
});
setSignal('loading');

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

// Rendering helpers
// ======================================================================
function cell(v) {
  if (v === null || v === undefined) return '<span class="lx-null">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function tableHtml(table, title, limit = 200) {
  const rows = table.rows.slice(0, limit);
  const n = table.rows.length;
  return `<div class="lx-card">
    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-tag">${n.toLocaleString('en-US')} dòng</span></div>` : ''}
    <div class="lx-scroll"><table class="lx-table lx-table--data"><thead><tr>${table.fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${table.fields.length}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-card lx-card__body lx-mono lx-subtle">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

function pageHead(eyebrow, title, lead, actions = '') {
  return `<div class="lx-head"><div class="lx-head__text">${eyebrow ? `<div class="lx-eyebrow">${eyebrow}</div>` : ''}
    <h1 class="lx-h1">${title}</h1>${lead ? `<p class="lx-lead">${lead}</p>` : ''}</div>
    ${actions ? `<div class="lx-actions">${actions}</div>` : ''}</div>`;
}

const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const tried = ch.exercises.filter(ex => exStatus(ex.id)).length;
  const essays = store.get('essay:' + ch.store, []).filter(i => i < ch.questions.length).length;
  return { passed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null),
    needQuiz: HAS_QUIZ && ch.quiz.length > 0, essays, essayTotal: ch.questions.length };
}
function exBadge(id) {
  const s = exStatus(id);
  if (s === 'pass') return '<span class="lx-badge lx-badge--success">Đã đúng</span>';
  if (s === 'fail') return '<span class="lx-badge lx-badge--warning">Chưa đúng</span>';
  return '<span class="lx-badge">Chưa làm</span>';
}
function chapterBadge(p) {
  if (p.passed === p.total && (p.quiz || !p.needQuiz) && p.essays === p.essayTotal) return '<span class="lx-badge lx-badge--success">Hoàn thành</span>';
  if (p.tried || p.quiz || p.essays) return '<span class="lx-badge lx-badge--info">Đang học</span>';
  return '<span class="lx-badge">Chưa bắt đầu</span>';
}

      if (ok) score++;
      box.querySelector('.lx-q__state').innerHTML = ok
        ? '<span class="lx-badge lx-badge--success">Đúng</span>'
        : picked ? '<span class="lx-badge lx-badge--danger">Sai</span>' : '<span class="lx-badge">Bỏ trống</span>';
      const ex = box.querySelector('.lx-q__explain');
      ex.hidden = false;
      ex.innerHTML = `<strong>Đáp án ${'ABCD'[q.answer]}.</strong> ${q.explain}`;
    });
    const best = Math.max(score, saved?.best ?? 0);
    store.set('quiz:' + ch.store, { best, last: score });
    $('#score').innerHTML = `Kết quả: <strong>${score}/${ch.quiz.length}</strong> (${(100 * score / ch.quiz.length).toFixed(1)}%). Điểm cao nhất: ${best}/${ch.quiz.length}.`;
    renderContext(ch);
  });
  $('#retry').addEventListener('click', () => viewQuiz(ch));
}
