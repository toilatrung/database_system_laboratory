 students whose locations are less than 200 meters apart.\u003c/p>","hint":"","solution":"(select 'nearest' as kind, a.ID as id1, b.ID as id2\n from cx_student_loc a, cx_student_loc b\n where a.ID = '12345' and b.ID \u003c> a.ID\n order by a.location \u003c-> b.location\n limit 1)\nunion all\nselect 'pair', a.ID, b.ID\nfrom cx_student_loc a, cx_student_loc b\nwhere a.ID \u003c b.ID and a.location \u003c-> b.location \u003c 200;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["kind","id1","id2"],"rows":[["nearest","12345","44553"],["pair","00128","12345"],["pair","00128","19991"],["pair","00128","23121"],["pair","00128","44553"],["pair","00128","54321"],["pair","00128","76543"],["pair","12345","19991"],["pair","12345","23121"],["pair","12345","44553"],["pair","12345","54321"],["pair","12345","76543"],["pair","19991","23121"],["pair","19991","44553"],["pair","19991","54321"],["pair","19991","76543"],["pair","23121","44553"],["pair","23121","54321"],["pair","23121","76543"],["pair","44553","54321"],["pair","44553","76543"],["pair","54321","76543"]]}}]},{"key":"ch9","store":"9","short":"9","label":"Chương 9","navLabel":"Chương 9","kind":"Chương","title":"Application Development","titleVi":"Phát triển ứng dụng","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 9 không nằm trong lịch học CS4420 (Chương 5 đã học JDBC/Python và SQL injection). Slide gồm:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slide\u003c/th>\u003cth>Nội dung\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>9.2 – 9.12\u003c/td>\u003ctd>Giao diện ứng dụng, Web cơ bản: URL, HTML, HTTP, session, cookie\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9.13 – 9.25\u003c/td>\u003ctd>Servlet, JSP/PHP, kiến trúc ứng dụng (presentation – business logic – data access), ORM, web service, REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9.26 – 9.33\u003c/td>\u003ctd>Phía client: JavaScript, Ajax, mobile app; tăng hiệu năng: \u003cstrong>caching\u003c/strong>, connection pooling\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9.34 – 9.50\u003c/td>\u003ctd>\u003cstrong>Bảo mật ứng dụng\u003c/strong>: SQL injection, XSS, CSRF, password leakage, xác thực (2-factor, single sign-on), phân quyền ở mức ứng dụng, audit trail, \u003cstrong>mã hoá\u003c/strong> và chứng chỉ số\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Bài SQL của chương mô phỏng phần \u003cstrong>CSDL phía sau một web app\u003c/strong>: những câu SQL mà ứng dụng gửi cho mỗi request.\u003c/p>\n\u003ch3>1. Web và HTTP (slide 9.5–9.12)\u003c/h3>\n\u003cul>\u003cli>Trình duyệt gửi \u003cstrong>HTTP request\u003c/strong> (GET/POST) tới URL; server trả về HTML/JSON.\u003c/li>\u003cli>HTTP là giao thức \u003cstrong>connectionless / stateless\u003c/strong>: mỗi request độc lập. Ưu: server phục vụ được nhiều client, dễ cân bằng tải, một server hỏng thì server khác thay. Nhược: phải thiết lập lại kết nối và gửi lại thông tin phiên mỗi lần (PE 9.2).\u003c/li>\u003cli>\u003cstrong>Session\u003c/strong> được duy trì bằng \u003cstrong>cookie\u003c/strong> (session id) hoặc hidden field; server lưu trạng thái phiên (thường trong bảng session).\u003c/li>\u003c/ul>\n\u003ch3>2. Phía server (slide 9.13–9.25)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>CGI\u003c/strong>: mỗi request khởi động một process mới → tốn kém. \u003cstrong>Servlet\u003c/strong> chạy như thread trong process của web/application server → rẻ hơn nhiều dù Java chậm hơn C (PE 9.1).\u003c/li>\u003cli>Server-side scripting: JSP, PHP, ASP.NET; framework (Django, Rails, Spring, Node.js).\u003c/li>\u003cli>Kiến trúc ba tầng: \u003cstrong>presentation\u003c/strong> (HTML, MVC) → \u003cstrong>business logic\u003c/strong> → \u003cstrong>data access\u003c/strong> (JDBC, ORM như Hibernate).\u003c/li>\u003cli>\u003cstrong>Web service\u003c/strong>: ứng dụng gọi nhau qua HTTP, dữ liệu JSON/XML; \u003cstrong>REST\u003c/strong> dùng URL + GET/POST/PUT/DELETE.\u003c/li>\u003c/ul>\n\u003ch3>3. SQL mà ứng dụng gửi\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kỹ thuật\u003c/th>\u003cth>Mục đích\u003c/th>\u003cth>SQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Prepared statement\u003c/strong>\u003c/td>\u003ctd>biên dịch một lần, chạy nhiều lần; tham số được truyền riêng → chống injection\u003c/td>\u003ctd>\u003ccode>prepare q(int) as select ... where id = $1; execute q(5);\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Phân trang offset\u003c/strong>\u003c/td>\u003ctd>trang k, n dòng/trang\u003c/td>\u003ctd>\u003ccode>order by created_at desc limit n offset (k-1)*n\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Phân trang keyset\u003c/strong>\u003c/td>\u003ctd>trang sau, không quét lại các dòng trước, ổn định khi có dòng mới\u003c/td>\u003ctd>\u003ccode>where created_at &lt; :last_seen order by created_at desc limit n\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Upsert\u003c/strong>\u003c/td>\u003ctd>đếm lượt xem, lưu cấu hình\u003c/td>\u003ctd>\u003ccode>insert ... on conflict (key) do update set views = t.views + 1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Giao dịch cho một request\u003c/strong>\u003c/td>\u003ctd>chuyển tiền, đặt hàng: tất cả hoặc không\u003c/td>\u003ctd>\u003ccode>begin; ...; commit;\u003c/code> (hoặc một hàm — chạy nguyên tử)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>View + grant\u003c/strong>\u003c/td>\u003ctd>ứng dụng chỉ thấy cột cần thiết\u003c/td>\u003ctd>\u003ccode>create view ...; grant select on view to app_role\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Row-level security\u003c/strong>\u003c/td>\u003ctd>mỗi người chỉ thấy dòng của mình\u003c/td>\u003ctd>\u003ccode>alter table t enable row level security; create policy ... using (owner = current_user)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>4. Hiệu năng (slide 9.30–9.33, PE 9.6, 9.7)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Connection pooling\u003c/strong>: mở sẵn một nhóm kết nối, request mượn rồi \u003cstrong>trả lại\u003c/strong> thay vì mở/đóng mỗi lần. Nếu code quên trả (không đóng trong \u003ccode>finally\u003c/code> / try-with-resources), số kết nối \u003cstrong>tăng mãi\u003c/strong> → hết kết nối (PE 9.5, 9.7). Kiểm tra bằng \u003ccode>netstat\u003c/code>: truy cập trang nhiều lần; với pool, số kết nối tăng tới một mức rồi \u003cstrong>dừng\u003c/strong>; nếu tiếp tục tăng là rò rỉ.\u003c/li>\u003cli>\u003cstrong>Caching\u003c/strong>: (1) pool kết nối; (2) cache \u003cstrong>kết quả truy vấn\u003c/strong> (query result / materialized view); (3) cache \u003cstrong>trang HTML\u003c/strong> đã sinh. Cache phải được \u003cstrong>làm mới (invalidate)\u003c/strong> khi dữ liệu thay đổi.\u003c/li>\u003cli>Materialized view trong PostgreSQL: \u003ccode>create materialized view v as ...\u003c/code>, dữ liệu \u003cstrong>cũ\u003c/strong> cho tới khi \u003ccode>refresh materialized view v\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>5. Bảo mật ứng dụng (slide 9.34–9.50)\u003c/h3>\n\u003cp>\u003cstrong>SQL injection\u003c/strong> (PE 9.8):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>\"select * from app_user where username = '\" + name + \"'\"\nname = x' or '1'='1   →   ... where username = 'x' or '1'='1'   -- trả về mọi user\u003c/code>\u003c/pre>\n\u003cp>Phòng chống: \u003cstrong>prepared statement / tham số\u003c/strong> (\u003ccode>?\u003c/code>, \u003ccode>$1\u003c/code>); trong PL/pgSQL dynamic SQL dùng \u003ccode>execute ... using\u003c/code> hoặc \u003ccode>format('%L', x)\u003c/code>. Kiểm thử: nhập chuỗi có dấu nháy đơn vào \u003cstrong>mọi\u003c/strong> ô nhập (kể cả dropdown, hidden field, cookie — người dùng sửa được DOM/request).\u003c/p>\n\u003cp>\u003cstrong>Các lỗi kinh điển\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>Tin dữ liệu từ client: giá trong \u003cstrong>hidden field\u003c/strong> (PE 9.3) — người dùng sửa HTML là đổi được giá. Luôn lấy giá từ CSDL.\u003c/li>\u003cli>Chỉ \"giấu link\" thay vì \u003cstrong>kiểm tra quyền\u003c/strong> ở mỗi trang (PE 9.4): ai biết URL là vào được. Mọi request phải kiểm tra cả session \u003cstrong>và\u003c/strong> quyền (bảng ACL theo role).\u003c/li>\u003cli>\u003cstrong>XSS\u003c/strong>: chèn script vào dữ liệu hiển thị lại → escape khi xuất HTML. \u003cstrong>CSRF\u003c/strong>: trang khác lừa trình duyệt gửi request kèm cookie → token chống CSRF, kiểm tra referer (có thể bị giả).\u003c/li>\u003cli>\u003cstrong>Lộ mật khẩu\u003c/strong>: không lưu mật khẩu dạng rõ. Lưu \u003cstrong>hash(salt || password)\u003c/strong> với salt ngẫu nhiên riêng cho từng user (PE 9.12); khi đăng nhập tính lại và so sánh. Salt làm hai người cùng mật khẩu có hash khác nhau, chống \u003cem>dictionary/rainbow table\u003c/em>. (Thực tế dùng hàm băm chậm: bcrypt, scrypt, Argon2.)\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Xác thực và phân quyền\u003c/strong>: 2-factor, single sign-on (SAML, OAuth/OpenID), phân quyền ở mức ứng dụng vì CSDL thường chỉ thấy một user chung của ứng dụng → \u003cstrong>row-level security\u003c/strong> / view theo người dùng; \u003cstrong>audit trail\u003c/strong> ghi lại ai làm gì.\u003c/p>\n\u003cp>\u003cstrong>Mã hoá\u003c/strong> (PE 9.9–9.11):\u003c/p>\n\u003cul>\u003cli>Mã hoá đối xứng (AES) và khoá công khai (RSA); chữ ký số; \u003cstrong>chứng chỉ số\u003c/strong> do CA ký, tạo thành \u003cstrong>chuỗi tin cậy\u003c/strong> tới root CA.\u003c/li>\u003cli>Mã hoá \u003cstrong>từng thuộc tính\u003c/strong>: nếu mã hoá tất định (cùng giá trị → cùng bản mã) thì chỉ hỗ trợ so sánh bằng và dễ bị phân tích tần suất; thêm salt ngẫu nhiên thì không index/so sánh được → CSDL \u003cstrong>không cho mã hoá khoá chính/khoá ngoại\u003c/strong> (không kiểm tra được trùng khoá).\u003c/li>\u003cli>Mã hoá \u003cstrong>toàn bộ CSDL\u003c/strong>: dữ liệu mã hoá trên đĩa, giải mã khi đọc vào bộ nhớ → index, khoá chính, khoá ngoại hoạt động bình thường; chỉ tầng truy cập dữ liệu phải sửa.\u003c/li>\u003cli>Chứng chỉ bị cấp nhầm cho kẻ mạo danh (PE 9.11): mọi thứ \"ký bởi\" công ty bị mạo danh đều không còn đáng tin (chỉ kiểm tra được nếu client tra danh sách thu hồi); chứng chỉ của công ty khác \u003cstrong>không\u003c/strong> bị ảnh hưởng — trừ khi bên bị mạo danh là một CA, khi đó cả nhánh dưới nó bị ảnh hưởng.\u003c/li>\u003c/ul>\n\u003ch3>Mẹo làm bài\u003c/h3>\n\u003cul>\u003cli>Hàm \u003ccode>sha256(bytea)\u003c/code> của PostgreSQL: \u003ccode>encode(sha256(convert_to(salt || pw, 'UTF8')), 'hex')\u003c/code>.\u003c/li>\u003cli>\u003ccode>try_sql($$...$$)\u003c/code> trả về \u003ccode>ok\u003c/code> hoặc SQLSTATE (23514 vi phạm check, 42501 không có quyền) — dùng để thấy một lệnh bị từ chối mà không làm hỏng cả bài.\u003c/li>\u003cli>Prepared statement không bị rollback cùng giao dịch, nên bài prepare chạy trên database mới.\u003c/li>\u003c/ul>","quiz":[{"q":"Vì sao servlet nhanh hơn CGI dù Java thường chậm hơn C?","options":["Servlet được biên dịch sang mã máy","CGI tạo một process mới cho mỗi request; servlet chạy dưới dạng thread trong process có sẵn","Servlet không dùng HTTP","CGI không hỗ trợ cookie"],"answer":1,"explain":"Chi phí tạo process và giao tiếp giữa các process lớn hơn chênh lệch tốc độ ngôn ngữ (PE 9.1)."},{"q":"HTTP là giao thức connectionless. Hệ quả nào \u003cstrong>không\u003c/strong> đúng?","options":["Server phục vụ được nhiều client hơn","Dễ chuyển request sang server khác khi một server hỏng","Không cần gửi lại thông tin phiên ở mỗi request","Phải thiết lập kết nối lại cho mỗi request"],"answer":2,"explain":"Ngược lại: thông tin phiên phải đi kèm mỗi request (cookie/hidden field) — PE 9.2."},{"q":"Lỗ hổng khi ứng dụng lấy giá sản phẩm từ hidden form field để tính tiền?","options":["Trình duyệt không gửi hidden field","Người dùng sửa HTML/request để đổi giá","Hidden field làm trang chậm","Không có lỗ hổng"],"answer":1,"explain":"Mọi thứ từ client đều sửa được; giá phải lấy từ CSDL phía server (PE 9.3)."},{"q":"Cách đúng nhất chống SQL injection?","options":["Xoá mọi dấu nháy đơn khỏi đầu vào","Dùng prepared statement / tham số hoá truy vấn","Chỉ cho nhập từ dropdown","Kiểm tra độ dài chuỗi"],"answer":1,"explain":"Tham số được truyền tách khỏi câu SQL nên không thể đổi cấu trúc câu lệnh. Dropdown vẫn bị sửa được (PE 9.8b)."},{"q":"Trong lược đồ lưu mật khẩu của PE 9.12, salt dùng để làm gì?","options":["Giải mã mật khẩu khi cần","Hai người cùng mật khẩu có hash khác nhau, chống tấn công từ điển/bảng tra sẵn","Tăng tốc đăng nhập","Thay cho hàm băm"],"answer":1,"explain":"Salt ngẫu nhiên lưu cùng user; hash(salt || password) không giải mã được, chỉ tính lại để so sánh."},{"q":"Phân trang \u003cstrong>keyset\u003c/strong> (\u003ccode>where created_at &lt; :last order by created_at desc limit 10\u003c/code>) hơn \u003cstrong>offset\u003c/strong> ở điểm nào?","options":["Nhảy tới trang bất kỳ dễ hơn","Không phải quét và bỏ qua các dòng của những trang trước; ổn định khi có dòng mới","Không cần index","Trả về nhiều dòng hơn"],"answer":1,"explain":"Offset lớn vẫn phải đọc rồi bỏ đi offset dòng, và dòng mới chèn vào làm lệch trang."},{"q":"\u003ccode>refresh materialized view\u003c/code> cần thiết vì?","options":["Materialized view tự cập nhật khi bảng gốc đổi","Materialized view lưu kết quả tại lúc refresh; bảng gốc đổi thì nó vẫn giữ dữ liệu cũ","Để tạo index","Để đổi tên view"],"answer":1,"explain":"Đó là một dạng cache kết quả truy vấn (PE 9.6) — phải làm mới."},{"q":"Dùng netstat với connection pooling: dấu hiệu trang \u003cstrong>không trả kết nối\u003c/strong> về pool là?","options":["Số kết nối bằng 0 sau mỗi request","Số kết nối tăng tới một mức rồi đứng yên","Số kết nối tiếp tục tăng khi truy cập trang lặp lại","Số kết nối dao động quanh một giá trị"],"answer":2,"explain":"Với pool, kết nối không đóng ngay nhưng phải ổn định; tăng mãi là rò rỉ (PE 9.7)."},{"q":"Vì sao CSDL không cho mã hoá thuộc tính khoá chính (mã hoá có salt)?","options":["Khoá chính quá ngắn","Không kiểm tra được trùng khoá và không index được trên bản mã","Mã hoá làm mất kiểu dữ liệu","Luật pháp cấm"],"answer":1,"explain":"Cùng giá trị cho bản mã khác nhau → không phát hiện vi phạm primary key (PE 9.9)."},{"q":"Mã hoá toàn bộ CSDL tránh được vấn đề của mã hoá từng thuộc tính vì?","options":["Dữ liệu không bao giờ được giải mã","Dữ liệu chỉ được mã hoá trên đĩa, giải mã khi đọc vào bộ nhớ nên index và ràng buộc khoá vẫn chạy bình thường","Không cần khoá mã hoá","Mọi giá trị dùng chung một bản mã"],"answer":1,"explain":"Chỉ tầng truy cập dữ liệu phải sửa (PE 9.10)."},{"q":"Row-level security giải quyết vấn đề gì của web app?","options":["Ứng dụng kết nối bằng một user chung nên CSDL không phân biệt người dùng cuối; policy giới hạn dòng mỗi người thấy","Mã hoá dữ liệu trên đĩa","Tăng tốc truy vấn","Chống XSS"],"answer":0,"explain":"Policy \u003ccode>using (owner = current_user)\u003c/code> (hoặc biến phiên) lọc dòng ngay trong CSDL."}],"questions":[{"q":"Vì sao servlet cho hiệu năng tốt hơn chương trình CGI, dù Java thường chạy chậm hơn C/C++?","en":"\u003cp>\u003cstrong>Exercise 9.1.\u003c/strong> Java programs usually run more slowly than C or C++ programs. Why, then, do servlets perform better than programs that use the common gateway interface (CGI)? Give the main reason.\u003c/p>","answer":"\u003cp>CGI khởi động \u003cstrong>một process mới cho mỗi request\u003c/strong> — chi phí hệ điều hành lớn (tạo process, nạp chương trình, mở kết nối CSDL lại từ đầu). Servlet chạy như \u003cstrong>thread\u003c/strong> trong một process đã có sẵn (thường chính là web/application server), nên không tốn chi phí tạo process và giao tiếp giữa các process; servlet còn giữ được tài nguyên dùng chung (pool kết nối CSDL, cache) giữa các request. Với tác vụ nhỏ/vừa, phần tiết kiệm này lớn hơn chênh lệch tốc độ của Java. Với tác vụ nặng CPU, CGI + C/C++ có thể vẫn nhanh hơn.\u003c/p>"},{"q":"Nêu ưu và nhược điểm của giao thức connectionless so với giao thức duy trì kết nối.","en":"\u003cp>\u003cstrong>Exercise 9.2.\u003c/strong> List some advantages and disadvantages of connectionless protocols compared with protocols that keep connections open.\u003c/p>","answer":"\u003cp>\u003cstrong>Ưu\u003c/strong>: máy tính giới hạn số kết nối đồng thời; kết nối được đóng ngay khi xong request nên \u003cstrong>nhiều client\u003c/strong> được phục vụ hơn. Mỗi request có thể chuyển tới \u003cstrong>bất kỳ server nào\u003c/strong> → cân bằng tải; server hỏng thì server khác tiếp quản mà client không nhận ra.\u003c/p>\n\u003cp>\u003cstrong>Nhược\u003c/strong>: phải \u003cstrong>thiết lập lại kết nối\u003c/strong> cho mỗi request; thông tin phiên phải \u003cstrong>gửi lại mỗi lần\u003c/strong> (cookie, hidden field) và server phải tra lại trạng thái → chậm hơn giao thức có kết nối khi cần nhiều trạng thái.\u003c/p>"},{"q":"Ứng dụng bán hàng lưu giá sản phẩm trong hidden form field rồi dùng giá trị gửi lên để tính hoá đơn. Lỗ hổng là gì?","en":"\u003cp>\u003cstrong>Exercise 9.3.\u003c/strong> A carelessly written online-shopping web application puts the price of each item in a hidden form variable on the page sent to the customer; when the customer submits the form, the value of that hidden variable is used to compute the customer’s bill. What is the loophole in this design? (Customers of a real online-shopping site actually exploited such a loophole before it was noticed and fixed.)\u003c/p>","answer":"\u003cp>Hidden field chỉ \"ẩn\" khi hiển thị; người dùng có thể \u003cstrong>sửa mã HTML\u003c/strong> (hoặc DOM, hoặc request HTTP bằng công cụ) để đổi giá trị \u003ccode>price\u003c/code>, rồi gửi form — ứng dụng dùng luôn giá đã bị sửa để tính tiền. Sửa: chỉ gửi \u003cstrong>product_id và số lượng\u003c/strong>, giá luôn lấy từ CSDL phía server (bài CH9.03–CH9.04 phát hiện các dòng bị sửa giá và tính lại hoá đơn đúng). Nguyên tắc chung: \u003cstrong>không tin bất cứ dữ liệu nào từ client\u003c/strong>.\u003c/p>"},{"q":"Servlet chỉ kiểm tra có session hợp lệ, không kiểm tra người dùng có quyền xem trang, vì link chỉ hiện cho người có quyền. Rủi ro là gì?","en":"\u003cp>\u003cstrong>Exercise 9.4.\u003c/strong> Another carelessly written web application uses a servlet that checks whether there is an active session, but does not check whether the user is authorized to access the page; it relies on the fact that the link to the page is displayed only to authorized users. What is the risk in this approach? (In a real case, applicants to a college-admissions site logged in and used this loophole to view information they were not authorized to see; the access was detected, and those who did it were punished by being denied admission.)\u003c/p>","answer":"\u003cp>Người không có quyền có thể \u003cstrong>biết URL\u003c/strong> bằng cách khác (người khác cho biết, lịch sử/proxy log, đoán đường dẫn). Họ đăng nhập (session hợp lệ) rồi gõ thẳng URL → servlet chỉ kiểm tra session nên \u003cstrong>trả về trang\u003c/strong>. Kiểm tra HTTP referer chặn được cách khai thác ngây thơ nhưng referer do trình duyệt đặt nên \u003cstrong>giả được\u003c/strong>. Sửa đúng: \u003cstrong>mọi\u003c/strong> trang kiểm tra quyền phía server (ví dụ bảng ACL page–role, bài CH9.05–CH9.06), không dựa vào giao diện.\u003c/p>"},{"q":"Vì sao nên mở kết nối JDBC bằng try-with-resources?","en":"\u003cp>\u003cstrong>Exercise 9.5.\u003c/strong> Why is it important to open JDBC connections with the try-with-resources syntax, \u003ccode>try (…) { … }\u003c/code>?\u003c/p>","answer":"\u003cp>try-with-resources tự động gọi \u003ccode>close()\u003c/code> cho Connection/Statement/ResultSet khi khối kết thúc — \u003cstrong>kể cả khi có exception\u003c/strong>. Nếu tự đóng mà quên, hoặc exception xảy ra trước lệnh close, kết nối bị rò rỉ: CSDL (hoặc pool) cạn kết nối và ứng dụng treo/lỗi. Với connection pool, \u003ccode>close()\u003c/code> là \u003cstrong>trả kết nối về pool\u003c/strong>.\u003c/p>"},{"q":"Nêu ba cách dùng caching để tăng hiệu năng web server.","en":"\u003cp>\u003cstrong>Exercise 9.6.\u003c/strong> List three ways in which caching can be used to improve the performance of a web server.\u003c/p>","answer":"\u003col>\u003cli>\u003cstrong>Connection pooling\u003c/strong>: mở sẵn các kết nối CSDL, mỗi request mượn một kết nối thay vì mở mới (mở kết nối rất tốn thời gian).\u003c/li>\u003cli>\u003cstrong>Cache kết quả truy vấn\u003c/strong>: request lặp lại cùng truy vấn thì dùng kết quả đã lưu (trong bộ nhớ, hoặc materialized view) thay vì truy vấn lại CSDL.\u003c/li>\u003cli>\u003cstrong>Cache trang web đã sinh\u003c/strong>: request giống hệt thì trả lại trang HTML đã sinh.\u003c/li>\u003c/ol>\n\u003cp>Cả ba phải xử lý \u003cstrong>làm mới cache\u003c/strong> khi dữ liệu đổi. Bài CH9.15 dùng materialized view làm cache; CH9.16 dùng nhật ký truy vấn để chọn truy vấn đáng cache.\u003c/p>"},{"q":"Dùng netstat thế nào để phát hiện một trang web không đóng kết nối (hoặc không trả kết nối về pool), biết rằng với pool kết nối có thể không đóng ngay?","en":"\u003cp>\u003cstrong>Exercise 9.7.\u003c/strong> The netstat command (on Linux and Windows) lists the active network connections of a computer. Explain how it can be used to discover whether a particular web page fails to close the connections it opens — or, when connection pooling is used, fails to return connections to the pool. Take into account that, with connection pooling, a connection may not be closed right away.\u003c/p>","answer":"\u003col>\u003cli>Chạy netstat để đếm các kết nối tới máy/cổng của CSDL (chạy ở máy ứng dụng hoặc máy CSDL).\u003c/li>\u003cli>Truy cập trang cần kiểm tra \u003cstrong>lặp đi lặp lại\u003c/strong> (tự động bằng công cụ như JMeter).\u003c/li>\u003cli>Theo dõi số kết nối: với pool, số kết nối tăng từ 0 lên một mức (số kết nối pool giữ lại) rồi \u003cstrong>ngừng tăng\u003c/strong>. Nếu số kết nối \u003cstrong>tiếp tục tăng\u003c/strong> theo số lần truy cập thì code của trang không đóng/không trả kết nối.\u003c/li>\u003c/ol>\n\u003cp>Bài CH9.17 làm phân tích này trên bảng mẫu \u003ccode>app_netstat\u003c/code>.\u003c/p>"},{"q":"(a) Đề xuất cách kiểm thử ứng dụng có bị SQL injection qua ô nhập text. (b) SQL injection có xảy ra với kiểu input HTML khác không? Kiểm thử thế nào?","en":"\u003cp>\u003cstrong>Exercise 9.8.\u003c/strong> Testing for SQL-injection vulnerability:\u003c/p>\n\u003cp>a. Propose an approach to test whether an application is vulnerable to SQL-injection attacks through text input.\u003c/p>\n\u003cp>b. Can SQL injection happen through kinds of HTML input other than text boxes? If so, how would you test for that vulnerability?\u003c/p>","answer":"\u003cp>a. Nhập chuỗi chứa \u003cstrong>dấu nháy đơn\u003c/strong> (ví dụ \u003ccode>O'Brien\u003c/code>, hoặc \u003ccode>x' or '1'='1\u003c/code>) vào \u003cstrong>từng\u003c/strong> ô text của \u003cstrong>từng\u003c/strong> form. Nếu giá trị không được lưu/tìm đúng, hoặc ứng dụng báo lỗi SQL, hoặc trả về nhiều dữ liệu hơn mong đợi → có lỗ hổng.\u003c/p>\n\u003cp>b. \u003cstrong>Có\u003c/strong>. Dropdown, radio, checkbox, hidden field, cookie, tham số URL đều do trình duyệt gửi lên; người dùng sửa được giá trị (sửa trang, sửa cây DOM bằng công cụ của trình duyệt, hoặc tự tạo request). Kiểm thử: sửa giá trị gửi lên của các input đó thành chuỗi có dấu nháy đơn và quan sát như (a). Phòng chống ở mọi trường hợp: prepared statement. Bài CH9.07–CH9.08.\u003c/p>"},{"q":"Vì sao CSDL không hỗ trợ index trên thuộc tính được mã hoá? Từ đó giải thích vì sao không cho mã hoá thuộc tính khoá chính.","en":"\u003cp>\u003cstrong>Exercise 9.9.\u003c/strong> The values of some attributes of a database relation may be stored encrypted for security. Why do database systems not support indexes on encrypted attributes? Using your answer, explain why database systems do not allow primary-key attributes to be encrypted.\u003c/p>","answer":"\u003cp>Index cần so sánh/sắp xếp giá trị. Bản mã không giữ thứ tự nên \u003cstrong>không\u003c/strong> hỗ trợ truy vấn khoảng. Chỉ khi mọi lần xuất hiện của một giá trị được mã hoá thành \u003cstrong>cùng\u003c/strong> một bản mã thì mới so sánh bằng được — nhưng như vậy kẻ tấn công \u003cstrong>phân tích tần suất\u003c/strong> đoán được giá trị phổ biến. Thêm salt ngẫu nhiên chống được phân tích nhưng khiến index (kể cả so sánh bằng) không thể dùng. Lưu index không mã hoá thì lộ dữ liệu; mã hoá index thì CSDL phải biết khoá và giải mã từng phần index khi chạy — phải sửa rất nhiều mã nguồn nên thường không hỗ trợ.\u003c/p>\n\u003cp>Khoá chính phải được \u003cstrong>kiểm tra không trùng\u003c/strong> mỗi lần chèn (và khoá ngoại phải tra được); với giá trị mã hoá kiểu trên thì CSDL không phát hiện được vi phạm, nên CSDL không cho mã hoá khoá chính (và khoá ngoại). Bài CH9.19 minh hoạ: băm tất định so khớp được, băm có salt thì không.\u003c/p>"},{"q":"Một số CSDL mã hoá toàn bộ cơ sở dữ liệu. Vì sao cách này tránh được các vấn đề của PE 9.9?","en":"\u003cp>\u003cstrong>Exercise 9.10.\u003c/strong> Exercise 9.9 deals with encrypting particular attributes. Some database systems, however, can encrypt the whole database. Explain how encrypting the entire database avoids the problems raised in Exercise 9.9.\u003c/p>","answer":"\u003cp>Khi mã hoá toàn bộ, CSDL \u003cstrong>giải mã khi đọc dữ liệu từ đĩa vào bộ nhớ\u003c/strong> và mã hoá khi ghi xuống; trong bộ nhớ dữ liệu ở dạng rõ. Mọi thứ trên đĩa (bảng, \u003cstrong>index\u003c/strong>, log) đều được mã hoá, nhưng các tầng phía trên làm việc với dữ liệu rõ như bình thường: index dùng được nguyên vẹn, ràng buộc khoá chính/khoá ngoại được kiểm tra không cần thay đổi. Chỉ \u003cstrong>tầng truy cập dữ liệu\u003c/strong> (đọc/ghi trang) phải sửa. Đổi lại, nó bảo vệ dữ liệu khi bị lấy cắp đĩa/bản sao lưu, không bảo vệ trước người dùng có quyền truy cập CSDL.\u003c/p>"},{"q":"Kẻ mạo danh một công ty và được CA cấp chứng chỉ. Ảnh hưởng tới những thứ (đơn đặt hàng, chương trình) được \"chứng thực\" bởi công ty bị mạo danh và bởi các công ty khác?","en":"\u003cp>\u003cstrong>Exercise 9.11.\u003c/strong> Suppose someone pretends to be a company and obtains a certificate from a certificate-issuing authority. What is the effect on items (such as purchase orders or programs) certified by the company that was impersonated, and on items certified by other companies?\u003c/p>","answer":"\u003cp>Kẻ mạo danh C có chứng chỉ chứa \u003cstrong>khoá công khai của C\u003c/strong> nhưng mang tên công ty X. Bên Y kiểm tra chứng chỉ thấy hợp lệ nên tin mọi thứ C ký là của X: có thể tiết lộ thông tin mật cho C, nhận đơn đặt hàng giả, chạy chương trình độc hại \"của X\". Vấn đề cốt lõi: chứng chỉ dùng offline \u003cstrong>không thu hồi được\u003c/strong> — dù CA phát hiện, Y vẫn bị lừa nếu không tra danh sách thu hồi (giao thức không bắt buộc).\u003c/p>\n\u003cp>Những thứ do X thật ký (bằng khoá thật) vẫn đúng, nhưng Y không còn phân biệt được với đồ giả mang tên X. Chứng chỉ và chữ ký của \u003cstrong>các công ty khác không bị ảnh hưởng\u003c/strong> — trừ khi X là một CA: kẻ mạo danh có thể cấp tiếp chứng chỉ giả, nên cả \u003cstrong>nhánh\u003c/strong> dưới X trong chuỗi chứng chỉ bị ảnh hưởng; chứng chỉ ngoài nhánh đó vẫn an toàn (bài CH9.18).\u003c/p>"},{"q":"Đề xuất lược đồ lưu mật khẩu an toàn mà vẫn kiểm tra được mật khẩu người dùng nhập khi đăng nhập.","en":"\u003cp>\u003cstrong>Exercise 9.12.\u003c/strong> The passwords that control access to a database are arguably its most important data items. Propose a scheme for storing passwords securely. The scheme must still let the system check the passwords that users supply when they try to log in.\u003c/p>","answer":"\u003cul>\u003cli>Khi đăng ký: sinh \u003cstrong>salt ngẫu nhiên\u003c/strong> cho từng user, lưu \u003ccode>(user_id, salt, hash(salt || password))\u003c/code> với hash là hàm băm một chiều an toàn (SHA-2; tốt hơn nữa là hàm chậm như bcrypt/scrypt/Argon2). Không lưu mật khẩu rõ, không cần (và không có) mã giải mã.\u003c/li>\u003cli>Khi đăng nhập: tìm user (index trên user_id/username), lấy salt, tính \u003ccode>hash(salt || mật khẩu nhập)\u003c/code> và \u003cstrong>so với hash đã lưu\u003c/strong>.\u003c/li>\u003cli>Salt khiến hai người cùng mật khẩu có hash khác nhau và vô hiệu hoá bảng tra sẵn (dictionary/rainbow table); kẻ lấy được bảng phải dò từng user một.\u003c/li>\u003cli>Bảo vệ thêm: quyền đọc bảng mật khẩu chỉ cho dịch vụ xác thực (view không có cột hash cho phần còn lại của ứng dụng — bài CH9.20), giới hạn số lần thử.\u003c/li>\u003c/ul>\n\u003cp>Bài CH9.01–CH9.02 hiện thực đăng nhập và đăng ký với \u003ccode>sha256\u003c/code>.\u003c/p>"}],"exercises":[{"id":"CH9.01","topic":"PE 9.12 kiểm tra đăng nhập","level":2,"prompt":"\u003cp>\u003ccode>app_user(user_id, username, role, salt, pw_hash)\u003c/code> lưu \u003ccode>pw_hash = encode(sha256(convert_to(salt || password, 'UTF8')), 'hex')\u003c/code>. Cho các lần thử đăng nhập\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>(values ('alice', 'secret1'), ('bob', 'wrong'), ('dave', 'secret1'), ('zed', 'secret1')) as a(username, password)\u003c/code>\u003c/pre>\n\u003cp>trả về \u003ccode>username\u003c/code> và \u003ccode>login_ok\u003c/code> (boolean; username không tồn tại → false) cho từng lần thử.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.12.\u003c/strong> The passwords that control access to a database are arguably its most important data items. Propose a scheme for storing passwords securely. The scheme must still let the system check the passwords that users supply when they try to log in.\u003c/p>","hint":"","solution":"select a.username,\n       coalesce(u.pw_hash = encode(sha256(convert_to(u.salt || a.password, 'UTF8')), 'hex'), false) as login_ok\nfrom (values ('alice', 'secret1'), ('bob', 'wrong'), ('dave', 'secret1'), ('zed', 'secret1')) as a(username, password)\n     left join app_user u on u.username = a.username;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["username","login_ok"],"rows":[["alice","true"],["bob","false"],["dave","true"],["zed","false"]]}},{"id":"CH9.02","topic":"PE 9.12 đăng ký, salt","level":2,"prompt":"\u003cp>Đăng ký user mới: \u003ccode>user_id\u003c/code> 6, username \u003ccode>frank\u003c/code>, role \u003ccode>customer\u003c/code>, salt \u003ccode>Ab12c\u003c/code>, mật khẩu \u003ccode>qwerty\u003c/code> — lưu đúng \u003cstrong>hash\u003c/strong>, không lưu mật khẩu rõ. Hệ thống kiểm tra đăng nhập đúng/sai cho frank và so sánh hash của alice và dave (cùng mật khẩu \u003ccode>secret1\u003c/code>).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.12.\u003c/strong> The passwords that control access to a database are arguably its most important data items. Propose a scheme for storing passwords securely. The scheme must still let the system check the passwords that users supply when they try to log in.\u003c/p>","hint":"","solution":"insert into app_user (user_id, username, role, salt, pw_hash)\nvalues (6, 'frank', 'customer', 'Ab12c', encode(sha256(convert_to('Ab12c' || 'qwerty', 'UTF8')), 'hex'));","check":"select\n  (select pw_hash = encode(sha256(convert_to(salt || 'qwerty', 'UTF8')), 'hex') from app_user where username = 'frank') as right_pw,\n  (select pw_hash = encode(sha256(convert_to(salt || 'qwerty1', 'UTF8')), 'hex') from app_user where username = 'frank') as wrong_pw,\n  (select count(*) from app_user where pw_hash like '%qwerty%') as plaintext_rows,\n  (select a.pw_hash = d.pw_hash from app_user a, app_user d where a.username = 'alice' and d.username = 'dave') as alice_dave_same_hash;","ordered":false,"fresh":false,"expected":{"fields":["right_pw","wrong_pw","plaintext_rows","alice_dave_same_hash"],"rows":[["true","false","0","false"]]}},{"id":"CH9.03","topic":"PE 9.3 phát hiện giá bị sửa","level":1,"prompt":"\u003cp>\u003ccode>app_cart_submission(submission_id, user_id, product_id, qty, submitted_price)\u003c/code> là dữ liệu form gửi lên (giá lấy từ hidden field). Liệt kê các dòng có giá gửi lên \u003cstrong>khác\u003c/strong> giá trong \u003ccode>app_product\u003c/code>: submission_id, username, product name, submitted_price, price.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.3.\u003c/strong> A carelessly written online-shopping web application puts the price of each item in a hidden form variable on the page sent to the customer; when the customer submits the form, the value of that hidden variable is used to compute the customer’s bill. What is the loophole in this design? (Customers of a real online-shopping site actually exploited such a loophole before it was noticed and fixed.)\u003c/p>","hint":"","solution":"select c.submission_id, u.username, p.name, c.submitted_price, p.price\nfrom app_cart_submission c\n     join app_product p on p.product_id = c.product_id\n     join app_user u on u.user_id = c.user_id\nwhere c.submitted_price \u003c> p.price;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["submission_id","username","name","submitted_price","price"],"rows":[["2","bob","Monitor","1.8","180"],["3","dave","Keyboard","4.5","45"]]}},{"id":"CH9.04","topic":"PE 9.3 tính hoá đơn phía server","level":2,"prompt":"\u003cp>Với mỗi submission: \u003ccode>submission_id\u003c/code>, \u003ccode>client_total\u003c/code> (tính theo giá gửi lên) và \u003ccode>server_total\u003c/code> (tính theo giá trong CSDL) — số tiền mà ứng dụng \u003cstrong>đúng ra\u003c/strong> phải thu.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.3.\u003c/strong> A carelessly written online-shopping web application puts the price of each item in a hidden form variable on the page sent to the customer; when the customer submits the form, the value of that hidden variable is used to compute the customer’s bill. What is the loophole in this design? (Customers of a real online-shopping site actually exploited such a loophole before it was noticed and fixed.)\u003c/p>","hint":"","solution":"select c.submission_id,\n       sum(c.qty * c.submitted_price) as client_total,\n       sum(c.qty * p.price) as server_total\nfrom app_cart_submission c join app_product p on p.product_id = c.product_id\ngroup by c.submission_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["submission_id","client_total","server_total"],"rows":[["3","364.5","405"],["2","41.8","220"],["1","56","56"]]}},{"id":"CH9.05","topic":"PE 9.4 request trái quyền","level":2,"prompt":"\u003cp>Servlet đã phục vụ các request trong \u003ccode>app_request(request_id, session_id, page, requested_at)\u003c/code> mà chỉ kiểm tra session. Dựa trên \u003ccode>app_session\u003c/code> → \u003ccode>app_user.role\u003c/code> và \u003ccode>app_page_acl(page, role)\u003c/code>, liệt kê các request mà người dùng \u003cstrong>không có quyền\u003c/strong> xem trang: request_id, username, role, page.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.4.\u003c/strong> Another carelessly written web application uses a servlet that checks whether there is an active session, but does not check whether the user is authorized to access the page; it relies on the fact that the link to the page is displayed only to authorized users. What is the risk in this approach? (In a real case, applicants to a college-admissions site logged in and used this loophole to view information they were not authorized to see; the access was detected, and those who did it were punished by being denied admission.)\u003c/p>","hint":"","solution":"select r.request_id, u.username, u.role, r.page\nfrom app_request r\n     join app_session s on s.session_id = r.session_id\n     join app_user u on u.user_id = s.user_id\nwhere not exists (select * from app_page_acl a where a.page = r.page and a.role = u.role);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["request_id","username","role","page"],"rows":[["2","alice","customer","/reports"],["8","bob","customer","/admin"],["5","carol","staff","/admin"]]}},{"id":"CH9.06","topic":"PE 9.4 hàm kiểm tra quyền","level":3,"prompt":"\u003cp>Viết hàm \u003ccode>app_can_access(p_session varchar, p_page varchar, p_at timestamp) returns boolean\u003c/code>: true khi và chỉ khi session tồn tại, \u003cstrong>chưa hết hạn\u003c/strong> tại p_at (\u003ccode>p_at &lt; expires_at\u003c/code>) \u003cstrong>và\u003c/strong> role của user được phép xem p_page. Hệ thống gọi hàm cho mọi request trong app_request.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.4.\u003c/strong> Another carelessly written web application uses a servlet that checks whether there is an active session, but does not check whether the user is authorized to access the page; it relies on the fact that the link to the page is displayed only to authorized users. What is the risk in this approach? (In a real case, applicants to a college-admissions site logged in and used this loophole to view information they were not authorized to see; the access was detected, and those who did it were punished by being denied admission.)\u003c/p>","hint":"","solution":"create function app_can_access(p_session varchar, p_page varchar, p_at timestamp) returns boolean as $$\n  select exists (\n    select *\n    from app_session s\n         join app_user u on u.user_id = s.user_id\n         join app_page_acl a on a.role = u.role\n    where s.session_id = p_session and p_at \u003c s.expires_at and a.page = p_page)\n$$ language sql;","check":"select request_id, app_can_access(session_id, page, requested_at) as allowed from app_request;","ordered":false,"fresh":false,"expected":{"fields":["request_id","allowed"],"rows":[["1","true"],["2","false"],["3","true"],["4","true"],["5","false"],["6","false"],["7","true"],["8","false"]]}},{"id":"CH9.07","topic":"PE 9.8 khai thác injection","level":2,"prompt":"\u003cp>Hàm có sẵn \u003ccode>app_find_user_unsafe(name text)\u003c/code> ghép thẳng \u003ccode>name\u003c/code> vào câu SQL: \u003ccode>... where username = '\u003c/code> || name || \u003ccode>'\u003c/code>. Đóng vai người kiểm thử: viết một câu \u003ccode>select count(*) as n from app_find_user_unsafe(...)\u003c/code> với một đầu vào khiến hàm trả về \u003cstrong>mọi\u003c/strong> user (chỉ đổi chuỗi đầu vào).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.8 (a).\u003c/strong> Testing for SQL-injection vulnerability:\u003c/p>\n\u003cp>a. Propose an approach to test whether an application is vulnerable to SQL-injection attacks through text input.\u003c/p>","hint":"Đầu vào kết thúc chuỗi bằng dấu nháy rồi thêm \u003ccode>or '1'='1\u003c/code>. Dùng $$...$$ để khỏi phải nhân đôi dấu nháy.","solution":"select count(*) as n from app_find_user_unsafe($$x' or '1'='1$$);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["n"],"rows":[["5"]]}},{"id":"CH9.08","topic":"PE 9.8 sửa injection","level":2,"prompt":"\u003cp>Viết hàm an toàn \u003ccode>app_find_user(name text) returns table (user_id integer, username varchar)\u003c/code> — vẫn dùng PL/pgSQL \u003ccode>return query execute\u003c/code> (dynamic SQL) nhưng \u003cstrong>truyền tham số\u003c/strong> bằng \u003ccode>using\u003c/code> (hoặc \u003ccode>format('%L')\u003c/code>). Hệ thống gọi với \u003ccode>bob\u003c/code>, với chuỗi tấn công của CH9.07 và với \u003ccode>O'Brien\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.8.\u003c/strong> Testing for SQL-injection vulnerability:\u003c/p>\n\u003cp>a. Propose an approach to test whether an application is vulnerable to SQL-injection attacks through text input.\u003c/p>\n\u003cp>b. Can SQL injection happen through kinds of HTML input other than text boxes? If so, how would you test for that vulnerability?\u003c/p>","hint":"","solution":"create function app_find_user(name text)\nreturns table (user_id integer, username varchar) language plpgsql as $$\nbegin\n  return query execute\n    'select user_id, username from app_user where username = $1' using name;\nend $$;","check":"select (select count(*) from app_find_user('bob')) as bob,\n       (select count(*) from app_find_user($$x' or '1'='1$$)) as attack,\n       (select count(*) from app_find_user($$O'Brien$$)) as quote_name;","ordered":false,"fresh":false,"expected":{"fields":["bob","attack","quote_name"],"rows":[["1","0","0"]]}},{"id":"CH9.09","topic":"prepared statement","level":2,"prompt":"\u003cp>Tạo prepared statement \u003ccode>cart_of(integer)\u003c/code> trả về \u003ccode>product_id\u003c/code>, \u003ccode>qty\u003c/code>, \u003ccode>price\u003c/code> (giá trong app_product) của các dòng trong app_cart_submission thuộc user có id là tham số; rồi \u003cstrong>execute\u003c/strong> nó với user 4. (Chạy trên database mới vì prepared statement không bị rollback.)\u003c/p>","en":"","hint":"","solution":"prepare cart_of(integer) as\n  select c.product_id, c.qty, p.price\n  from app_cart_submission c join app_product p on p.product_id = c.product_id\n  where c.user_id = $1;\nexecute cart_of(4);","check":null,"ordered":false,"fresh":true,"expected":{"fields":["product_id","qty","price"],"rows":[["101","1","45"],["103","2","180"]]}},{"id":"CH9.10","topic":"phân trang offset","level":1,"prompt":"\u003cp>Trang danh sách bài viết hiển thị 10 bài/trang, mới nhất trước (\u003ccode>created_at desc\u003c/code>). Trả về \u003ccode>post_id\u003c/code>, \u003ccode>title\u003c/code> của \u003cstrong>trang 3\u003c/strong> bằng \u003ccode>limit/offset\u003c/code>. (Thứ tự được chấm.)\u003c/p>","en":"","hint":"","solution":"select post_id, title from app_post order by created_at desc limit 10 offset 20;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["post_id","title"],"rows":[["5","Post 5"],["4","Post 4"],["3","Post 3"],["2","Post 2"],["1","Post 1"]]}},{"id":"CH9.11","topic":"phân trang keyset","level":2,"prompt":"\u003cp>Phân trang \u003cstrong>keyset\u003c/strong>: người dùng đang ở trang 1 và bài cuối cùng họ thấy là \u003ccode>post_id = 16\u003c/code>. Trả về 10 bài kế tiếp (post_id, title) \u003cstrong>không dùng offset\u003c/strong>, dựa trên created_at của bài 16. (Thứ tự được chấm.)\u003c/p>","en":"","hint":"","solution":"select post_id, title from app_post\nwhere created_at \u003c (select created_at from app_post where post_id = 16)\norder by created_at desc\nlimit 10;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["post_id","title"],"rows":[["15","Post 15"],["14","Post 14"],["13","Post 13"],["12","Post 12"],["11","Post 11"],["10","Post 10"],["9","Post 9"],["8","Post 8"],["7","Post 7"],["6","Post 6"]]}},{"id":"CH9.12","topic":"upsert on conflict","level":2,"prompt":"\u003cp>Mỗi lượt xem trang tăng bộ đếm trong \u003ccode>app_page_view(page primary key, views)\u003c/code>; trang chưa có thì tạo với views = 1. Viết \u003cstrong>một\u003c/strong> câu \u003ccode>insert ... on conflict\u003c/code> ghi nhận một lượt xem cho mỗi trang \u003ccode>/shop\u003c/code>, \u003ccode>/admin\u003c/code>, \u003ccode>/orders\u003c/code>. Hệ thống đọc lại bảng.\u003c/p>","en":"","hint":"","solution":"insert into app_page_view (page, views)\nvalues ('/shop', 1), ('/admin', 1), ('/orders', 1)\non conflict (page) do update set views = app_page_view.views + 1;","check":"select page, views from app_page_view;","ordered":false,"fresh":false,"expected":{"fields":["page","views"],"rows":[["/shop","121"],["/admin","1"],["/orders","46"]]}},{"id":"CH9.13","topic":"giao dịch nguyên tử cho một request","level":3,"prompt":"\u003cp>Viết hàm \u003ccode>app_transfer(p_from integer, p_to integer, p_amount numeric) returns void\u003c/code> trừ tiền ví p_from và cộng ví p_to trong \u003ccode>app_wallet\u003c/code> (balance có \u003ccode>check (balance &gt;= 0)\u003c/code>). Vì cả hàm chạy như một đơn vị, nếu trừ tiền vi phạm check thì cộng tiền cũng không được giữ lại. Hệ thống thử chuyển 50 từ user 2 sang 1 (không đủ tiền) và 40 từ user 4 sang 3, rồi đọc mọi ví.\u003c/p>","en":"","hint":"Thứ tự hai lệnh update quan trọng: cộng trước rồi trừ sau thì lệnh trừ lỗi cũng huỷ lệnh cộng — vì lỗi huỷ cả lời gọi hàm.","solution":"create function app_transfer(p_from integer, p_to integer, p_amount numeric) returns void as $$\n  update app_wallet set balance = balance + p_amount where user_id = p_to;\n  update app_wallet set balance = balance - p_amount where user_id = p_from;\n$$ language sql;","check":"select try_sql('select app_transfer(2, 1, 50)') as t1, try_sql('select app_transfer(4, 3, 40)') as t2,\n       sql_value('select string_agg(user_id || ''='' || balance, '', '' order by user_id) from app_wallet') as wallets;","ordered":false,"fresh":false,"expected":{"fields":["t1","t2","wallets"],"rows":[["23514","ok","1=100.00, 2=30.00, 3=40.00, 4=210.00, 5=10.00"]]}},{"id":"CH9.14","topic":"row-level security","level":3,"prompt":"\u003cp>Web app dùng chung bảng \u003ccode>app_note(note_id, owner, body)\u003c/code>. Bật \u003cstrong>row-level security\u003c/strong> cho app_note với policy: mỗi người chỉ thấy dòng có \u003ccode>owner = current_user\u003c/code>. Tạo role \u003ccode>alice\u003c/code> và \u003ccode>bob\u003c/code>, cấp quyền select trên app_note cho cả hai. Hệ thống \u003ccode>set role bob\u003c/code> rồi đọc app_note.\u003c/p>","en":"","hint":"","solution":"alter table app_note enable row level security;\ncreate policy app_note_owner on app_note using (owner = current_user);\ncreate role alice;\ncreate role bob;\ngrant select on app_note to alice, bob;","check":"set role bob;\nselect note_id, body from app_note;","ordered":false,"fresh":false,"expected":{"fields":["note_id","body"],"rows":[["3","Return policy question"]]}},{"id":"CH9.15","topic":"PE 9.6 cache bằng materialized view","level":2,"prompt":"\u003cp>Cache danh mục sản phẩm: tạo materialized view \u003ccode>app_product_cache(product_id, name, price)\u003c/code> từ app_product. Hệ thống đổi giá Keyboard (101) thành 50, đọc giá trong cache, refresh, rồi đọc lại.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.6.\u003c/strong> List three ways in which caching can be used to improve the performance of a web server.\u003c/p>","hint":"","solution":"create materialized view app_product_cache as\nselect product_id, name, price from app_product;","check":"update app_product set price = 50 where product_id = 101;\nselect sql_value('select price from app_product_cache where product_id = 101') as cached_before,\n       try_sql('refresh materialized view app_product_cache') as refresh,\n       sql_value('select price from app_product_cache where product_id = 101') as cached_after;","ordered":false,"fresh":false,"expected":{"fields":["cached_before","refresh","cached_after"],"rows":[["45.00","ok","50.00"]]}},{"id":"CH9.16","topic":"PE 9.6 chọn truy vấn để cache","level":1,"prompt":"\u003cp>\u003ccode>app_query_log(log_id, query_text, ms)\u003c/code> ghi lại các truy vấn ứng dụng đã chạy. Truy vấn nào đáng cache? Trả về \u003ccode>query_text\u003c/code>, \u003ccode>runs\u003c/code> (số lần chạy) và \u003ccode>total_ms\u003c/code> cho các truy vấn chạy \u003cstrong>ít nhất 3 lần\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.6.\u003c/strong> List three ways in which caching can be used to improve the performance of a web server.\u003c/p>","hint":"","solution":"select query_text, count(*) as runs, sum(ms) as total_ms\nfrom app_query_log\ngroup by query_text\nhaving count(*) >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["query_text","runs","total_ms"],"rows":[["select * from app_post order by created_at desc limit 10","4","159"],["select * from app_product","4","48"]]}},{"id":"CH9.17","topic":"PE 9.7 netstat, window lag","level":3,"prompt":"\u003cp>\u003ccode>app_netstat(page, sample_no, open_conns)\u003c/code>: số kết nối CSDL đang mở sau mỗi lô truy cập một trang (có connection pool). Trang bị \u003cstrong>rò rỉ kết nối\u003c/strong> nếu số kết nối vẫn \u003cstrong>tăng ngặt\u003c/strong> ở \u003cstrong>mọi\u003c/strong> lần đo từ lần 4 trở đi (so với lần đo liền trước). Trả về page và \u003ccode>last_conns\u003c/code> (số kết nối ở lần đo cuối) của các trang rò rỉ.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.7.\u003c/strong> The netstat command (on Linux and Windows) lists the active network connections of a computer. Explain how it can be used to discover whether a particular web page fails to close the connections it opens — or, when connection pooling is used, fails to return connections to the pool. Take into account that, with connection pooling, a connection may not be closed right away.\u003c/p>","hint":"lag(open_conns) over (partition by page order by sample_no)","solution":"with d as (\n  select page, sample_no, open_conns,\n         open_conns - lag(open_conns) over (partition by page order by sample_no) as delta\n  from app_netstat\n)\nselect page, max(open_conns) filter (where sample_no = (select max(sample_no) from app_netstat n where n.page = d.page)) as last_conns\nfrom d\ngroup by page\nhaving bool_and(delta > 0) filter (where sample_no >= 4);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["page","last_conns"],"rows":[["/reports","18"]]}},{"id":"CH9.18","topic":"PE 9.11 chuỗi chứng chỉ, recursive","level":3,"prompt":"\u003cp>\u003ccode>app_cert(cert_id, subject, issued_by)\u003c/code>: chứng chỉ và chứng chỉ của bên đã ký nó. Giả sử chứng chỉ \u003ccode>C1\u003c/code> (IntermediateCA) bị cấp cho kẻ mạo danh. Liệt kê mọi chứng chỉ \u003cstrong>không còn đáng tin\u003c/strong>: C1 và mọi chứng chỉ nằm dưới nó trong chuỗi (cert_id, subject, \u003ccode>depth\u003c/code> — C1 có depth 0).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.11.\u003c/strong> Suppose someone pretends to be a company and obtains a certificate from a certificate-issuing authority. What is the effect on items (such as purchase orders or programs) certified by the company that was impersonated, and on items certified by other companies?\u003c/p>","hint":"","solution":"with recursive affected(cert_id, subject, depth) as (\n  select cert_id, subject, 0 from app_cert where cert_id = 'C1'\n  union all\n  select c.cert_id, c.subject, a.depth + 1\n  from app_cert c join affected a on c.issued_by = a.cert_id\n)\nselect cert_id, subject, depth from affected;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cert_id","subject","depth"],"rows":[["C1","IntermediateCA","0"],["C2","X Corp","1"],["C5","Y Inc","1"],["C3","X Corp Payroll","2"],["C4","X Corp Updater","2"]]}},{"id":"CH9.19","topic":"PE 9.9 băm tất định vs có salt","level":2,"prompt":"\u003cp>\u003ccode>app_card\u003c/code> lưu số thẻ dưới hai dạng: \u003ccode>det_hash\u003c/code> (băm tất định: cùng số thẻ → cùng giá trị) và \u003ccode>salted_hash\u003c/code> (băm kèm salt riêng mỗi dòng). Tìm các cặp thẻ (card_id1 \u003c card_id2) \u003cstrong>trùng số thẻ\u003c/strong> bằng det_hash, và cho biết \u003ccode>salted_equal\u003c/code> — salted_hash của hai thẻ có bằng nhau không.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 9.9.\u003c/strong> The values of some attributes of a database relation may be stored encrypted for security. Why do database systems not support indexes on encrypted attributes? Using your answer, explain why database systems do not allow primary-key attributes to be encrypted.\u003c/p>","hint":"","solution":"select a.card_id as card_id1, b.card_id as card_id2, a.salted_hash = b.salted_hash as salted_equal\nfrom app_card a join app_card b on a.det_hash = b.det_hash and a.card_id \u003c b.card_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["card_id1","card_id2","salted_equal"],"rows":[["1","3","false"]]}},{"id":"CH9.20","topic":"view + grant cho role ứng dụng","level":2,"prompt":"\u003cp>Phần lớn ứng dụng không được thấy salt và hash mật khẩu. Tạo view \u003ccode>app_public_user(user_id, username, role)\u003c/code> từ app_user, role \u003ccode>app_web\u003c/code>, và chỉ cấp \u003cstrong>select trên view\u003c/strong> cho app_web. Hệ thống \u003ccode>set role app_web\u003c/code>, đếm dòng qua view và thử đọc app_user.\u003c/p>","en":"","hint":"","solution":"create view app_public_user as select user_id, username, role from app_user;\ncreate role app_web;\ngrant select on app_public_user to app_web;","check":"set role app_web;\nselect (select count(*) from app_public_user) as visible_users,\n       try_sql('select * from app_user') as read_app_user;","ordered":false,"fresh":false,"expected":{"fields":["visible_users","read_app_user"],"rows":[["5","42501"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
async function produceTable(db, sql, check, fresh) {
  if (fresh) {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
  for (let i = start; i <= items.length - (k - acc.length); i++) yield* subsetsOfSize(items, k, i + 1, [...acc, items[i]]);
}

// Candidate keys by increasing size. Attributes that never appear on a right
// side belong to every key; attributes only on right sides belong to none.
function fdCandidateKeys(R, fds) {
  const onRight = new Set(fds.flatMap(f => minus(f.rhs, f.lhs)));
  const onLeft = new Set(fds.flatMap(f => f.lhs));
  const core = R.filter(a => !onRight.has(a));
  const optional = R.filter(a => onRight.has(a) && onLeft.has(a));
  const keys = [];
  for (let k = 0; k <= optional.length; k++) {
    for (const extra of subsetsOfSize(optional, k)) {
      const K = order(R, [...core, ...extra]);
      if (keys.some(key => subset(key, K))) continue;
      if (fdIsSuperkey(R, fds, K)) keys.push(K);
    }
  }
  return keys;
}

// Canonical cover with a log of every change (slides 7.48–7.50): merge equal
// left sides, then delete one extraneous attribute at a time (Exercise 7.15
// shows why deleting two at once is wrong) until nothing changes.
function fdCover(R, fds, letters) {
  const fa = xs => fdFormat(xs, letters);
  const ff = f => fdFormatFD(f, letters);
  let F = fds.map(f => ({ lhs: [...f.lhs], rhs: [...f.rhs] }));
  const log = [];
  const mergeLeft = () => {
    const merged = [];
    for (const f of F) {
      const g = merged.find(x => same(x.lhs, f.lhs));
      if (g) {
        log.push(`Hợp (union rule): ${ff(g)} và ${ff(f)} → ${ff({ lhs: g.lhs, rhs: union(R, g.rhs, f.rhs) })}`);
        g.rhs = union(R, g.rhs, f.rhs);
      } else merged.push({ lhs: [...f.lhs], rhs: [...f.rhs] });
    }
    F = merged;
  };
  const step = () => {
    for (let i = 0; i < F.length; i++) {
      const f = F[i];
      // Left side: A ∈ α is extraneous if (α − A)⁺ under F contains β.
      if (f.lhs.length > 1) {
        for (const A of f.lhs) {
          const rest = minus(f.lhs, [A]);
          if (subset(f.rhs, fdClosure(R, F, rest).result)) {
            log.push(`${A} thừa ở vế trái của ${ff(f)}: (${fa(rest)})⁺ dưới F chứa ${fa(f.rhs)} → thay bằng ${ff({ lhs: rest, rhs: f.rhs })}`);
            F[i] = { lhs: rest, rhs: f.rhs };
            return true;
          }
        }
      }
      // Right side: A ∈ β is extraneous if α⁺ under F' (A removed from β) contains A.
      for (const A of f.rhs) {
        const reduced = { lhs: f.lhs, rhs: minus(f.rhs, [A]) };
        const Fp = F.map((g, j) => (j === i ? reduced : g)).filter(g => g.rhs.length);
        if (fdClosure(R, Fp, f.lhs).result.includes(A)) {
          log.push(`${A} thừa ở vế phải của ${ff(f)}: (${fa(f.lhs)})⁺ dưới F' (đã bỏ ${A}) vẫn chứa ${A} → ${reduced.rhs.length ? ff(reduced) : 'xoá FD này'}`);
          F = Fp;
          return true;
        }
      }
    }
    return false;
  };
  do mergeLeft(); while (step());
  return { cover: F, log };
}

// A BCNF violation on schema Ri (using F⁺ restricted to Ri): a set α ⊆ Ri
// with α⁺ ∩ Ri ⊋ α and α⁺ ⊉ Ri. Small schemas only (exponential search).
function fdBcnfViolation(R, fds, Ri) {
  for (let k = 1; k < Ri.length; k++) {
    for (const alpha of subsetsOfSize(Ri, k)) {
      const cl = fdClosure(R, fds, alpha).result;
      const beta = minus(order(Ri, cl), alpha);
      if (beta.length && !subset(Ri, cl)) return { lhs: alpha, rhs: beta };
    }
  }
  return null;
}

// BCNF decomposition (slide 7.57): replace Ri by (Ri − β) and (α ∪ β).
function fdBcnfDecompose(R, fds) {
  let result = [order(R, R)];
  const steps = [];
  for (let guard = 0; guard < 50; guard++) {
    const idx = result.findIndex(Ri => fdBcnfViolation(R, fds, Ri));
    if (idx < 0) break;
    const Ri = result[idx];
    const v = fdBcnfViolation(R, fds, Ri);
    const r1 = union(R, v.lhs, v.rhs);
    const r2 = minus(Ri, v.rhs);
    steps.push({ schema: Ri, fd: v, r1, r2 });
    result.splice(idx, 1, r1, r2);
  }
  return { result, steps };
}

// 3NF test on the original schema: for each α → A (A ∉ α) in F, α is a
// superkey or A is prime (in some candidate key).
function fdThirdNFViolations(R, fds, keys) {
  const prime = new Set((keys || fdCandidateKeys(R, fds)).flat());
  const out = [];
  for (const f of fds) {
    if (fdIsSuperkey(R, fds, f.lhs)) continue;
    const bad = minus(f.rhs, f.lhs).filter(a => !prime.has(a));
    if (bad.length) out.push({ lhs: f.lhs, rhs: bad });
  }
  return out;
}

function fdBcnfViolations(R, fds) {
  return fds.filter(f => minus(f.rhs, f.lhs).length && !fdIsSuperkey(R, fds, f.lhs));
}

// 3NF synthesis (slide 7.63) from the canonical cover.
function fdThirdNFDecompose(R, fds, letters) {
  const { cover } = fdCover(R, fds, letters);
  const schemas = [];
  const steps = [];
  for (const f of cover) {
    const s = union(R, f.lhs, f.rhs);
    if (schemas.some(x => subset(s, x))) steps.push({ kind: 'skip', fd: f, schema: s });
    else { schemas.push(s); steps.push({ kind: 'add', fd: f, schema: s }); }
  }
  const keys = fdCandidateKeys(R, fds);
  if (!schemas.some(s => keys.some(k => subset(k, s)))) {
    schemas.push(keys[0]);
    steps.push({ kind: 'key', schema: keys[0] });
  }
  // Remove schemas contained in another one.
  const result = schemas.filter((s, i) => !schemas.some((t, j) => j !== i && subset(s, t) && (!same(s, t) || j < i)));
  schemas.filter(s => !result.includes(s)).forEach(s => steps.push({ kind: 'drop', schema: s }));
  return { cover, keys, result, steps };
}

// Lossless test for a binary decomposition: R1 ∩ R2 → R1 or R1 ∩ R2 → R2.
function fdLosslessBinary(R, fds, R1, R2) {
  const common = R1.filter(a => R2.includes(a));
  const cl = fdClosure(R, fds, common).result;
  return { common, closure: cl, lossless: subset(R1, cl) || subset(R2, cl) };
}

// General lossless test (chase / tableau) for any number of schemas.
function fdLosslessChase(R, fds, schemas) {
  const rows = schemas.map((S, i) => R.map(a => (S.includes(a) ? `a:${a}` : `b${i}:${a}`)));
  let changed = true;
  while (changed) {
    changed = false;
    for (const f of fds) {
      const li = f.lhs.map(a => R.indexOf(a));
      for (let x = 0; x < rows.length; x++) {
        for (let y = x + 1; y < rows.length; y++) {
          if (!li.every(i => rows[x][i] === rows[y][i])) continue;
          for (const a of f.rhs) {
            const i = R.indexOf(a);
            const u = rows[x][i], v = rows[y][i];
            if (u === v) continue;
            const keep = u.startsWith('a:') ? u : v.startsWith('a:') ? v : u < v ? u : v;
            const drop = keep === u ? v : u;
            for (const r of rows) for (let j = 0; j < r.length; j++) if (r[j] === drop) r[j] = keep;
            changed = true;
          }
        }
      }
    }
  }
  return rows.some(r => r.every(v => v.startsWith('a:')));
}

// Dependency preservation without computing F⁺ (slide 7.53).
function fdPreserved(R, fds, schemas, f) {
  let result = [...f.lhs];
  let changed = true;
  while (changed) {
    changed = false;
    for (const Ri of schemas) {
      const t = order(Ri, fdClosure(R, fds, result.filter(a => Ri.includes(a))).result);
      const next = union(R, result, t);
      if (next.length > result.length) { result = next; changed = true; }
    }
  }
  return subset(f.rhs, result);
}

function fdParseSchemas(text, letters, R) {
  return String(text).split(/[\n;|]+/).map(s => s.replace(/^\s*R\d*\s*=\s*/i, '').trim()).filter(Boolean)
    .map(s => order(R, [...new Set(fdParseAttrs(s, letters))]));
}

    return `<div class="lx-pop__head"><span class="lx-pop__title">PostgreSQL đang chạy</span><span class="lx-badge lx-badge--success">Sẵn sàng</span></div>
      <div class="lx-pop__body">
        <dl class="lx-kv"><dt>Engine</dt><dd>PostgreSQL trong trình duyệt (PGlite 0.5.8)</dd>
          <dt>Database</dt><dd>${CORE_COUNT ? `University: ${CORE_COUNT} bảng của sách, ${TABLE_COUNT - CORE_COUNT} bảng phụ` : `${TABLE_COUNT} bảng`}</dd>
          <dt>Khởi động</dt><dd>${(signal.loadMs / 1000).toFixed(1)} giây</dd></dl>
        <p>Không cần cài server. Bài tập chạy trong một transaction rồi <code>rollback</code>, nên dữ liệu gốc không đổi.</p>
        <p style="margin:0">Chạy ngoài trình duyệt: <code>npm run sql</code> mở SQL shell, <code>npm run grade -- ${esc(DATA.chapters[0].key)}</code> chấm file <code>my_answers.sql</code> (trong thư mục <code>lab</code>).</p>
      </div>`;
  }
  if (s === 'error') {
    const offline = navigator.onLine === false;
    return `<div class="lx-pop__head"><span class="lx-pop__title">Chưa kết nối được PostgreSQL</span><span class="lx-badge lx-badge--danger">Không có tín hiệu</span></div>
      <div class="lx-pop__body">
        <p>${offline ? 'Máy đang offline.' : `Lỗi: ${esc(signal.error || 'không tải được PGlite')}`}</p>
        <p style="margin-bottom:4px;color:var(--ink)"><strong>Cách khởi động</strong></p>${START_STEPS}
      </div>
      <div class="lx-pop__foot"><button class="lx-btn lx-btn--primary" type="button" id="signalRetry">${icon('reset')} Thử kết nối lại</button></div>`;
  }
  const secs = Math.round((performance.now() - signal.startedAt) / 1000);
  return `<div class="lx-pop__head"><span class="lx-pop__title">${SIGNAL_LABEL[s]}</span><span class="lx-badge lx-badge--info">Đang tải</span></div>
    <div class="lx-pop__body">
      <p>Đã chờ ${secs} giây. Nếu đèn chưa sáng sau khoảng 30 giây, kiểm tra theo các bước:</p>${START_STEPS}
    </div>`;
}

function setSignal(state, info = {}) {
  const changed = signal.state !== state;
  Object.assign(signal, { state }, info);
  if (state === 'loading' || state === 'reloading') signal.startedAt = performance.now();
  signalEl.classList.toggle('is-ready', state === 'ready');
  signalEl.dataset.state = state;
  signalLabel.textContent = SIGNAL_LABEL[state];
  signalBtn.setAttribute('aria-label', SIGNAL_LABEL[state]);
  if (changed && !reduceMotion.matches) {
    signalLabel.animate([{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  }
  renderSignalPop();
}

// Hover and keyboard focus open the guide via CSS; a click pins it (touch screens).
signalBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = !signalEl.classList.contains('is-open');
  signalEl.classList.toggle('is-open', open);
  signalBtn.setAttribute('aria-expanded', String(open));
});
signalEl.addEventListener('mouseenter', () => { if (signal.state !== 'ready' && signal.state !== 'error') renderSignalPop(); });
document.addEventListener('click', e => {
  if (!signalEl.contains(e.target)) { signalEl.classList.remove('is-open'); signalBtn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && signalEl.classList.contains('is-open')) { signalEl.classList.remove('is-open'); signalBtn.focus(); }
});
setSignal('loading');

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

const num = (n, unit = '') => `<span class="n">${Number(n).toLocaleString('en-US')}</span>${unit}`;

function cell(v) {
  if (v === null || v === undefined) return '<span class="lx-null">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function tableHtml(table, title, limit = 200) {
  const rows = table.rows.slice(0, limit);
  const n = table.rows.length;
  return `<div class="lx-card">
    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-card__meta">${num(n)} dòng · ${num(table.fields.length)} cột</span></div>` : ''}
    <div class="lx-datawrap"><table class="lx-table lx-table--data"><thead><tr>${table.fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${Math.max(1, table.fields.length)}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu trên ${num(n)} dòng</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-callout lx-mono">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const failed = ch.exercises.filter(ex => exStatus(ex.id) === 'fail').length;
  const tried = passed + failed;
  const essays = store.get('essay:' + ch.store, []).filter(i => i < ch.questions.length).length;
  return { passed, failed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null),
    needQuiz: HAS_QUIZ && ch.quiz.length > 0, essays, essayTotal: ch.questions.length };
}
const isDone = p => p.passed === p.total && (p.quiz || !p.needQuiz) && p.essays === p.essayTotal;
function exBadge(id) {

  if (s === 'fail') return '<span class="lx-badge lx-badge--warning">Chưa đúng</span>';
  return '<span class="lx-badge">Chưa làm</span>';
