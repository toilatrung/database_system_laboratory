<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Part 3 — Ôn tập giữa kỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* ---------- LabelX design tokens (light) ---------- */
  :root {
    --canvas: #f6f7f9;
    --surface: #ffffff;
    --surface-sunken: #f3f4f6;
    --surface-selected: #eef1f5;
    --border: #e3e6ea;
    --border-strong: #8c93a0;
    --ink: #1a1d23;
    --ink-muted: #4b5262;
    --ink-subtle: #6b7280;
    --primary: #1f2933;
    --primary-hover: #38424f;
    --on-primary: #ffffff;
    --focus: #1f2933;
    --success: #146c43;
    --success-soft: #e6f4ec;
    --warning: #8a5300;
    --warning-soft: #fdf2d8;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --info: #1d5ea8;
    --info-soft: #e7effa;
    --neutral: #475061;
    --neutral-soft: #eceef2;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 999px;
    --shadow-menu: 0 4px 16px rgba(17,24,39,0.12);
    --topnav-height: 56px; --contextbar-height: 44px; --control-height: 32px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--ink); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Top navigation ---------- */
  .lx-topnav { position: sticky; top: 0; z-index: 20; height: var(--topnav-height); display: flex; align-items: center; gap: var(--space-8);
    padding: 0 var(--space-6); background: var(--primary); }
  .lx-logo { font: 600 18px/1 var(--font-sans); letter-spacing: -.02em; color: #fff; text-decoration: none; white-space: nowrap; }
  .lx-logo span { color: rgba(255,255,255,.66); font-weight: 500; }
  .lx-nav { display: flex; align-items: stretch; height: 100%; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .lx-nav::-webkit-scrollbar { display: none; }
  .lx-nav > a, .lx-navbtn { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 16px; height: 100%;
    color: rgba(255,255,255,.74); font: 500 14px/20px var(--font-sans); text-decoration: none; white-space: nowrap;
    background: none; border: 0; cursor: pointer; }
  .lx-nav > a:hover, .lx-navbtn:hover { color: #fff; background: rgba(255,255,255,.07); }
  .lx-nav > a[aria-current="page"], .lx-navbtn.is-active { color: #fff; font-weight: 600; }
  .lx-nav > a[aria-current="page"]::after, .lx-navbtn.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #fff; }
  .lx-navbtn[aria-expanded="true"] { background: rgba(255,255,255,.12); color: #fff; }
  .lx-navbtn svg.i { width: 12px; height: 12px; opacity: .7; }
  .lx-navbtn[aria-expanded="true"] svg.i { transform: rotate(180deg); opacity: 1; }
  .lx-topnav__status { margin-left: auto; }

  /* ---------- Database signal: lit when PostgreSQL is ready, off otherwise ---------- */
  .lx-signalwrap { position: relative; align-self: stretch; display: flex; align-items: center; }
  .lx-signal { appearance: none; display: inline-flex; align-items: center; gap: 10px; height: var(--control-height); padding: 0 var(--space-3);
    border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-md); background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.74); font: 500 13px/1 var(--font-sans); cursor: help; white-space: nowrap;
    transition: background-color .2s ease, border-color .2s ease, color .2s ease; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); color: #fff; }
  .lx-signal__dot { position: relative; width: 10px; height: 10px; flex: none; border-radius: 50%;
    background: #59616d; box-shadow: inset 0 1px 2px rgba(0,0,0,.55);
    transition: background-color .5s ease, box-shadow .5s ease; }
  .lx-signal__dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; }
  .is-ready .lx-signal { color: #fff; }
  .is-ready .lx-signal__dot { background: #3fd87f; box-shadow: 0 0 3px 1px rgba(63,216,127,.85), 0 0 10px 3px rgba(63,216,127,.4);
    animation: signal-breathe 2.8s ease-in-out infinite; }
  .is-ready .lx-signal__dot::after { animation: signal-ring 2.8s ease-out infinite; }
  @keyframes signal-breathe {
    0%, 100% { box-shadow: 0 0 3px 1px rgba(63,216,127,.8), 0 0 8px 2px rgba(63,216,127,.3); }
    50%      { box-shadow: 0 0 5px 1px rgba(63,216,127,1),  0 0 16px 5px rgba(63,216,127,.55); }
  }
  @keyframes signal-ring {
    0%       { opacity: .9; box-shadow: 0 0 0 0 rgba(63,216,127,.6); }
    70%, 100% { opacity: 0; box-shadow: 0 0 0 9px rgba(63,216,127,0); }
  }
  .lx-signal__label { display: inline-block; }

  .lx-pop { position: absolute; top: calc(100% - 2px); right: 0; width: 360px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--surface); color: var(--ink); text-align: left; border: 1px solid rgba(17,24,39,.06); border-radius: var(--radius-md);
    box-shadow: 0 6px 20px rgba(17,24,39,.16);
    opacity: 0; visibility: hidden; transform: translateY(6px) scale(.98); transform-origin: top right;
    transition: opacity .18s ease, transform .2s cubic-bezier(.2,.7,.3,1), visibility 0s linear .2s; }
  .lx-pop::before { content: ""; position: absolute; top: -6px; right: 28px; width: 10px; height: 10px; background: var(--surface);
    border-left: 1px solid rgba(17,24,39,.06); border-top: 1px solid rgba(17,24,39,.06); transform: rotate(45deg); }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop {
    opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-pop__title { font-weight: 600; }
  .lx-pop__body { padding: var(--space-3) var(--space-4); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
  .lx-pop__body p { margin: 0 0 var(--space-2); }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 var(--space-2); }
  .lx-pop__body code { font: 500 12px/1 var(--font-mono); color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 4px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--space-3); margin: 0 0 var(--space-2); }
  .lx-pop__body .lx-kv dt { color: var(--ink-subtle); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--ink); font-weight: 500; }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: 10px var(--space-4); border-top: 1px solid var(--border); }

  /* ---------- Motion ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav > a, .lx-navbtn, .lx-flow__step a, .lx-flow__n, .lx-list > li > a, .lx-opt, .lx-menu__item,
  .lx-table td, .lx-chip, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .lx-iconbtn::after { transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { transform: none; }
  .lx-nav > a::after, .lx-navbtn::after { transition: transform .2s ease; }
  .lx-navbtn svg.i, details > summary svg.i { transition: transform .2s ease, opacity .2s ease; }
  .lx-progress > i { transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .lx-menu:not([hidden]) { animation: lx-pop-in .18s cubic-bezier(.2,.7,.3,1); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-fade-up .22s ease-out; }
  .lx-page.is-entering { animation: lx-fade-up .24s ease-out; }
  @keyframes lx-pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes lx-fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Dropdown card (the only element with a shadow and soft corners) */
  .lx-menu { position: fixed; min-width: 272px; display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid rgba(17,24,39,.06); border-radius: 6px; box-shadow: 0 6px 20px rgba(17,24,39,.16); z-index: 30; }
  .lx-menu[hidden] { display: none; }
  .lx-menu::before { content: ""; position: absolute; top: -6px; left: 24px; width: 10px; height: 10px; background: var(--surface);
    border-left: 1px solid rgba(17,24,39,.06); border-top: 1px solid rgba(17,24,39,.06); transform: rotate(45deg); }
  .lx-menu__item { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    padding: 14px 18px; color: var(--ink-muted); text-decoration: none; font-size: 15px; font-weight: 500; line-height: 20px; }
  .lx-menu__item + .lx-menu__item { border-top: 1px solid var(--border); }
  .lx-menu__item:first-of-type { border-radius: 6px 6px 0 0; }
  .lx-menu__item:last-of-type { border-radius: 0 0 6px 6px; }
  .lx-menu__item:hover, .lx-menu__item:focus-visible { background: var(--surface-sunken); color: var(--ink); }
  .lx-menu__item.is-active { background: var(--surface-selected); color: var(--ink); font-weight: 600; }
  .lx-menu__item svg.i { color: var(--ink-subtle); }
  .lx-menu__item:hover svg.i, .lx-menu__item.is-active svg.i { color: var(--ink); }
  .lx-menu__d { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); padding: 5px 10px; background: var(--primary);
    color: var(--on-primary); font: 500 12px/16px var(--font-sans); white-space: nowrap; opacity: 0; pointer-events: none; }
  .lx-menu__item:hover .lx-menu__d, .lx-menu__item:focus-visible .lx-menu__d { opacity: 1; }

  /* ---------- Context bar ---------- */
  .lx-ctxbar { min-height: var(--contextbar-height); display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2);
    padding: 6px var(--space-6); background: var(--canvas); border-bottom: 1px solid var(--border); }
  .lx-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-full);
    border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--ink); white-space: nowrap; }
  .lx-chip__k { color: var(--ink-subtle); }
  .lx-chip__v { font-weight: 600; }

  /* ---------- Page ---------- */
  .lx-page { max-width: 1440px; margin: 0 auto; padding: var(--space-6) var(--space-6) 48px; display: flex; flex-direction: column; gap: var(--space-6); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
  .lx-head__text { flex: 1 1 520px; max-width: 840px; }
  .lx-eyebrow { font: 600 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .lx-h1 { margin: 0 0 6px; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
  .lx-h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .lx-lead { margin: 0; color: var(--ink-muted); }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .lx-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .lx-cols { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .lx-main { flex: 999 1 560px; min-width: 0; }
  .lx-side { flex: 1 1 320px; min-width: 0; max-width: 100%; overflow: hidden; }
  .lx-subtle { color: var(--ink-subtle); }
  .lx-mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .lx-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-3);
    border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    font: 500 13px/1 var(--font-sans); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--surface-sunken); }
  .lx-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-btn--primary:hover { background: var(--primary-hover); }
  .lx-btn--ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .lx-btn--ghost:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-btn[disabled] { opacity: .45; cursor: not-allowed; }
  .lx-btn .lx-kbd { font: 500 11px/1 var(--font-mono); opacity: .7; }

  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--ink-muted); cursor: pointer; text-decoration: none; }
  .lx-iconbtn:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 2px); right: 0; white-space: nowrap; padding: 4px 8px;
    border-radius: 4px; background: var(--primary); color: var(--on-primary); font: 500 12px/16px var(--font-sans); opacity: 0; pointer-events: none; z-index: 10; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; }

  /* ---------- Badges & tags ---------- */
  .lx-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-sm);
    font: 600 11px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
  .lx-badge--success { background: var(--success-soft); color: var(--success); }
  .lx-badge--warning { background: var(--warning-soft); color: var(--warning); }
  .lx-badge--danger { background: var(--danger-soft); color: var(--danger); }
  .lx-badge--info { background: var(--info-soft); color: var(--info); }
  .lx-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--neutral-soft);
    color: var(--neutral); font: 500 12px/1 var(--font-sans); white-space: nowrap; }

  /* ---------- Card, table, list ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .lx-card__body { padding: var(--space-4); }
  .lx-card__foot { padding: 10px var(--space-4); border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-subtle); display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }
  .lx-card > .lx-scroll:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 10px var(--space-4); background: var(--surface-sunken); color: var(--ink-subtle);
    font: 600 11px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table tbody tr:hover td { background: var(--surface-sunken); }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table .act { width: 1%; text-align: right; padding-top: 0; padding-bottom: 0; }
  .lx-cell__main { font-weight: 600; color: var(--ink); }
  .lx-cell__sub { font-size: 12px; line-height: 16px; color: var(--ink-subtle); margin-top: 2px; }
  .lx-table--data td, .lx-table--data th { font-family: var(--font-mono); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: pre; padding: 8px var(--space-4); }
  .lx-table--data th { font-weight: 600; color: var(--ink-muted); }
  .lx-null { color: var(--ink-subtle); font-style: italic; }

  .lx-list { list-style: none; margin: 0; padding: 0; }
  .lx-list > li > a { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border); text-decoration: none; color: var(--ink); }
  .lx-list > li:last-child > a { border-bottom: 0; }
  .lx-list > li > a:hover { background: var(--surface-sunken); }
  .lx-list > li[aria-selected="true"] > a { background: var(--surface-selected); box-shadow: inset 3px 0 0 var(--primary); }
  .lx-list__id { font: 500 12px/16px var(--font-mono); width: 36px; flex: none; }
  .lx-list__t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-list--scroll { max-height: 640px; overflow-y: auto; }

  .lx-metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
  .lx-metric__k { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
  .lx-metric__v { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .lx-metric__n { font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
  .lx-progress { height: 6px; border-radius: 3px; background: var(--neutral-soft); overflow: hidden; min-width: 96px; }
  .lx-progress > i { display: block; height: 100%; background: var(--primary); }

  .lx-callout { border-radius: var(--radius-lg); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--info-soft); color: var(--ink); }
  .lx-callout--success { background: var(--success-soft); }
  .lx-callout--warning { background: var(--warning-soft); }
  .lx-callout--danger { background: var(--danger-soft); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Flow navigation (Tóm tắt → Trắc nghiệm → Tự luận → Bài tập) ---------- */
  .lx-flow { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3) 0 var(--space-4); min-height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lx-flow__k { font: 600 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding-right: var(--space-4); border-right: 1px solid var(--border); white-space: nowrap; }
  .lx-flow__arrow { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .lx-flow__arrow.is-off { opacity: .35; pointer-events: none; }
  .lx-flow__arrow::after { bottom: auto; top: calc(100% + 4px); right: auto; left: 0; }
  .lx-flow__arrow--next::after { left: auto; right: 0; }
  .lx-flow__steps { flex: 1; display: flex; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-flow__step a { border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); color: var(--ink-muted); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .lx-flow__step a:hover { background: var(--surface-sunken); color: var(--ink); }
  .lx-flow__step.is-active a { background: var(--surface-selected); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); }
  .lx-flow__n { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: 11px; line-height: 1; }
  .lx-flow__step.is-active .lx-flow__n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .lx-flow__sep { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
  .lx-flow__pos { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }

  /* ---------- Reading content (summaries, answers) ---------- */
  .lx-prose { color: var(--ink); line-height: 22px; }
  .lx-prose h3 { font-size: 15px; line-height: 22px; font-weight: 600; margin: var(--space-6) 0 var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .lx-prose h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

<script id="data" type="application/json">{"part":{"number":3,"title":"Part 3 — Ôn tập giữa kỳ","subtitle":"Chương 1–4 theo Practice Exercises của sách + đề thi thử","lead":"Thi giữa kỳ ở tuần 8, phạm vi Chương 1–4 (Introduction, Relational Model, Intro SQL, Intermediate SQL). Đề chủ yếu lấy từ Practice Exercises của sách, nên mỗi phần dưới đây đi qua TOÀN BỘ Practice Exercises của từng chương (đánh số đúng như sách) và chạy được trên dữ liệu mẫu. Phần cuối là đề thi thử có giới hạn thời gian.","unit":"Phần","storage":"cs4420p3","fdTool":false,"weeks":"Tuần 7–8"},"parts":[{"number":1,"slug":"part_1","title":"Part 1 — Chương 1 đến 5","short":"Part 1"},{"number":2,"slug":"part_2","title":"Part 2 — Chương 6 và 7","short":"Part 2"},{"number":3,"slug":"part_3","title":"Part 3 — Ôn tập giữa kỳ","short":"Part 3"},{"number":4,"slug":"part_4","title":"Part 4 — Ôn tập cuối kỳ","short":"Part 4"}],"setup":["-- =====================================================================\n-- University database — schema (Database System Concepts, 7th Ed.)\n-- Dialect: PostgreSQL (chạy được trên PostgreSQL 12+ và PGlite)\n-- File này xoá và tạo lại toàn bộ bảng, nên có thể chạy lại bất cứ lúc nào.\n-- =====================================================================\n\ndrop table if exists prereq cascade;\ndrop table if exists time_slot cascade;\ndrop table if exists advisor cascade;\ndrop table if exists takes cascade;\ndrop table if exists student cascade;\ndrop table if exists teaches cascade;\ndrop table if exists section cascade;\ndrop table if exists instructor cascade;\ndrop table if exists course cascade;\ndrop table if exists department cascade;\ndrop table if exists classroom cascade;\n\ncreate table classroom (\n  building      varchar(15),\n  room_number   varchar(7),\n  capacity      numeric(4,0),\n  primary key (building, room_number)\n);\n\ncreate table department (\n  dept_name     varchar(20),\n  building      varchar(15),\n  budget        numeric(12,2) check (budget > 0),\n  primary key (dept_name)\n);\n\ncreate table course (\n  course_id     varchar(8),\n  title         varchar(50),\n  dept_name     varchar(20),\n  credits       numeric(2,0) check (credits > 0),\n  primary key (course_id),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table instructor (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  salary        numeric(8,2) check (salary > 29000),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table section (\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6) check (semester in ('Fall', 'Winter', 'Spring', 'Summer')),\n  year          numeric(4,0) check (year > 1701 and year \u003c 2100),\n  building      varchar(15),\n  room_number   varchar(7),\n  time_slot_id  varchar(4),\n  primary key (course_id, sec_id, semester, year),\n  foreign key (course_id) references course (course_id)\n    on delete cascade,\n  foreign key (building, room_number) references classroom (building, room_number)\n    on delete set null\n);\n\ncreate table teaches (\n  ID            varchar(5),\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6),\n  year          numeric(4,0),\n  primary key (ID, course_id, sec_id, semester, year),\n  foreign key (course_id, sec_id, semester, year)\n    references section (course_id, sec_id, semester, year)\n    on delete cascade,\n  foreign key (ID) references instructor (ID)\n    on delete cascade\n);\n\ncreate table student (\n  ID            varchar(5),\n  name          varchar(20) not null,\n  dept_name     varchar(20),\n  tot_cred      numeric(3,0) check (tot_cred >= 0),\n  primary key (ID),\n  foreign key (dept_name) references department (dept_name)\n    on delete set null\n);\n\ncreate table takes (\n  ID            varchar(5),\n  course_id     varchar(8),\n  sec_id        varchar(8),\n  semester      varchar(6),\n  year          numeric(4,0),\n  grade         varchar(2),\n  primary key (ID, course_id, sec_id, semester, year),\n  foreign key (course_id, sec_id, semester, year)\n    references section (course_id, sec_id, semester, year)\n    on delete cascade,\n  foreign key (ID) references student (ID)\n    on delete cascade\n);\n\ncreate table advisor (\n  s_ID          varchar(5),\n  i_ID          varchar(5),\n  primary key (s_ID),\n  foreign key (i_ID) references instructor (ID)\n    on delete set null,\n  foreign key (s_ID) references student (ID)\n    on delete cascade\n);\n\ncreate table time_slot (\n  time_slot_id  varchar(4),\n  day           varchar(1),\n  start_hr      numeric(2) check (start_hr >= 0 and start_hr \u003c 24),\n  start_min     numeric(2) check (start_min >= 0 and start_min \u003c 60),\n  end_hr        numeric(2) check (end_hr >= 0 and end_hr \u003c 24),\n  end_min       numeric(2) check (end_min >= 0 and end_min \u003c 60),\n  primary key (time_slot_id, day, start_hr, start_min)\n);\n\ncreate table prereq (\n  course_id     varchar(8),\n  prereq_id     varchar(8),\n  primary key (course_id, prereq_id),\n  foreign key (course_id) references course (course_id)\n    on delete cascade,\n  foreign key (prereq_id) references course (course_id)\n);\n","-- =====================================================================\n-- University database — dữ liệu mẫu nhỏ (giống các hình trong slide)\n-- Chạy SAU university_schema.sql\n-- =====================================================================\n\ninsert into classroom values\n  ('Packard', '101',  500),\n  ('Painter', '514',  10),\n  ('Taylor',  '3128', 70),\n  ('Watson',  '100',  30),\n  ('Watson',  '120',  50);\n\ninsert into department values\n  ('Biology',    'Watson',  90000),\n  ('Comp. Sci.', 'Taylor',  100000),\n  ('Elec. Eng.', 'Taylor',  85000),\n  ('Finance',    'Painter', 120000),\n  ('History',    'Painter', 50000),\n  ('Music',      'Packard', 80000),\n  ('Physics',    'Watson',  70000);\n\ninsert into course values\n  ('BIO-101', 'Intro. to Biology',          'Biology',    4),\n  ('BIO-301', 'Genetics',                   'Biology',    4),\n  ('BIO-399', 'Computational Biology',      'Biology',    3),\n  ('CS-101',  'Intro. to Computer Science', 'Comp. Sci.', 4),\n  ('CS-190',  'Game Design',                'Comp. Sci.', 4),\n  ('CS-315',  'Robotics',                   'Comp. Sci.', 3),\n  ('CS-319',  'Image Processing',           'Comp. Sci.', 3),\n  ('CS-347',  'Database System Concepts',   'Comp. Sci.', 3),\n  ('EE-181',  'Intro. to Digital Systems',  'Elec. Eng.', 3),\n  ('FIN-201', 'Investment Banking',         'Finance',    3),\n  ('HIS-351', 'World History',              'History',    3),\n  ('MU-199',  'Music Video Production',     'Music',      3),\n  ('PHY-101', 'Physical Principles',        'Physics',    4);\n\ninsert into instructor values\n  ('10101', 'Srinivasan', 'Comp. Sci.', 65000),\n  ('12121', 'Wu',         'Finance',    90000),\n  ('15151', 'Mozart',     'Music',      40000),\n  ('22222', 'Einstein',   'Physics',    95000),\n  ('32343', 'El Said',    'History',    60000),\n  ('33456', 'Gold',       'Physics',    87000),\n  ('45565', 'Katz',       'Comp. Sci.', 75000),\n  ('58583', 'Califieri',  'History',    62000),\n  ('76543', 'Singh',      'Finance',    80000),\n  ('76766', 'Crick',      'Biology',    72000),\n  ('83821', 'Brandt',     'Comp. Sci.', 92000),\n  ('98345', 'Kim',        'Elec. Eng.', 80000);\n\ninsert into section values\n  ('BIO-101', '1', 'Summer', 2017, 'Painter', '514',  'B'),\n  ('BIO-301', '1', 'Summer', 2018, 'Painter', '514',  'A'),\n  ('CS-101',  '1', 'Fall',   2017, 'Packard', '101',  'H'),\n  ('CS-101',  '1', 'Spring', 2018, 'Packard', '101',  'F'),\n  ('CS-190',  '1', 'Spring', 2017, 'Taylor',  '3128', 'E'),\n  ('CS-190',  '2', 'Spring', 2017, 'Taylor',  '3128', 'A'),\n  ('CS-315',  '1', 'Spring', 2018, 'Watson',  '120',  'D'),\n  ('CS-319',  '1', 'Spring', 2018, 'Watson',  '100',  'B'),\n  ('CS-319',  '2', 'Spring', 2018, 'Taylor',  '3128', 'C'),\n  ('CS-347',  '1', 'Fall',   2017, 'Taylor',  '3128', 'A'),\n  ('EE-181',  '1', 'Spring', 2017, 'Taylor',  '3128', 'C'),\n  ('FIN-201', '1', 'Spring', 2018, 'Packard', '101',  'B'),\n  ('HIS-351', '1', 'Spring', 2018, 'Painter', '514',  'C'),\n  ('MU-199',  '1', 'Spring', 2018, 'Packard', '101',  'D'),\n  ('PHY-101', '1', 'Fall',   2017, 'Watson',  '100',  'A');\n\ninsert into teaches values\n  ('10101', 'CS-101',  '1', 'Fall',   2017),\n  ('10101', 'CS-315',  '1', 'Spring', 2018),\n  ('10101', 'CS-347',  '1', 'Fall',   2017),\n  ('12121', 'FIN-201', '1', 'Spring', 2018),\n  ('15151', 'MU-199',  '1', 'Spring', 2018),\n  ('22222', 'PHY-101', '1', 'Fall',   2017),\n  ('32343', 'HIS-351', '1', 'Spring', 2018),\n  ('45565', 'CS-101',  '1', 'Spring', 2018),\n  ('45565', 'CS-319',  '1', 'Spring', 2018),\n  ('76766', 'BIO-101', '1', 'Summer', 2017),\n  ('76766', 'BIO-301', '1', 'Summer', 2018),\n  ('83821', 'CS-190',  '1', 'Spring', 2017),\n  ('83821', 'CS-190',  '2', 'Spring', 2017),\n  ('83821', 'CS-319',  '2', 'Spring', 2018),\n  ('98345', 'EE-181',  '1', 'Spring', 2017);\n\ninsert into student values\n  ('00128', 'Zhang',    'Comp. Sci.', 102),\n  ('12345', 'Shankar',  'Comp. Sci.', 32),\n  ('19991', 'Brandt',   'History',    80),\n  ('23121', 'Chavez',   'Finance',    110),\n  ('44553', 'Peltier',  'Physics',    56),\n  ('45678', 'Levy',     'Physics',    46),\n  ('54321', 'Williams', 'Comp. Sci.', 54),\n  ('55739', 'Sanchez',  'Music',      38),\n  ('70557', 'Snow',     'Physics',    0),\n  ('76543', 'Brown',    'Comp. Sci.', 58),\n  ('76653', 'Aoi',      'Elec. Eng.', 60),\n  ('98765', 'Bourikas', 'Elec. Eng.', 98),\n  ('98988', 'Tanaka',   'Biology',    120);\n\ninsert into takes values\n  ('00128', 'CS-101',  '1', 'Fall',   2017, 'A'),\n  ('00128', 'CS-347',  '1', 'Fall',   2017, 'A-'),\n  ('12345', 'CS-101',  '1', 'Fall',   2017, 'C'),\n  ('12345', 'CS-190',  '2', 'Spring', 2017, 'A'),\n  ('12345', 'CS-315',  '1', 'Spring', 2018, 'A'),\n  ('12345', 'CS-347',  '1', 'Fall',   2017, 'A'),\n  ('19991', 'HIS-351', '1', 'Spring', 2018, 'B'),\n  ('23121', 'FIN-201', '1', 'Spring', 2018, 'C+'),\n  ('44553', 'PHY-101', '1', 'Fall',   2017, 'B-'),\n  ('45678', 'CS-101',  '1', 'Fall',   2017, 'F'),\n  ('45678', 'CS-101',  '1', 'Spring', 2018, 'B+'),\n  ('45678', 'CS-319',  '1', 'Spring', 2018, 'B'),\n  ('54321', 'CS-101',  '1', 'Fall',   2017, 'A-'),\n  ('54321', 'CS-190',  '2', 'Spring', 2017, 'B+'),\n  ('55739', 'MU-199',  '1', 'Spring', 2018, 'A-'),\n  ('76543', 'CS-101',  '1', 'Fall',   2017, 'A'),\n  ('76543', 'CS-319',  '2', 'Spring', 2018, 'A'),\n  ('76653', 'EE-181',  '1', 'Spring', 2017, 'C'),\n  ('98765', 'CS-101',  '1', 'Fall',   2017, 'C-'),\n  ('98765', 'CS-315',  '1', 'Spring', 2018, 'B'),\n  ('98988', 'BIO-101', '1', 'Summer', 2017, 'A'),\n  ('98988', 'BIO-301', '1', 'Summer', 2018, null);\n\ninsert into advisor values\n  ('00128', '45565'),\n  ('12345', '10101'),\n  ('23121', '76543'),\n  ('44553', '22222'),\n  ('45678', '22222'),\n  ('76543', '45565'),\n  ('76653', '98345'),\n  ('98765', '98345'),\n  ('98988', '76766');\n\ninsert into time_slot values\n  ('A', 'M', 8,  0,  8,  50),\n  ('A', 'W', 8,  0,  8,  50),\n  ('A', 'F', 8,  0,  8,  50),\n  ('B', 'M', 9,  0,  9,  50),\n  ('B', 'W', 9,  0,  9,  50),\n  ('B', 'F', 9,  0,  9,  50),\n  ('C', 'M', 11, 0,  11, 50),\n  ('C', 'W', 11, 0,  11, 50),\n  ('C', 'F', 11, 0,  11, 50),\n  ('D', 'M', 13, 0,  13, 50),\n  ('D', 'W', 13, 0,  13, 50),\n  ('D', 'F', 13, 0,  13, 50),\n  ('E', 'T', 10, 30, 11, 45),\n  ('E', 'R', 10, 30, 11, 45),\n  ('F', 'T', 14, 30, 15, 45),\n  ('F', 'R', 14, 30, 15, 45),\n  ('G', 'M', 16, 0,  16, 50),\n  ('G', 'W', 16, 0,  16, 50),\n  ('G', 'F', 16, 0,  16, 50),\n  ('H', 'W', 10, 0,  12, 30);\n\ninsert into prereq values\n  ('BIO-301', 'BIO-101'),\n  ('BIO-399', 'BIO-101'),\n  ('CS-190',  'CS-101'),\n  ('CS-315',  'CS-101'),\n  ('CS-319',  'CS-101'),\n  ('CS-347',  'CS-101'),\n  ('EE-181',  'PHY-101');\n","-- =====================================================================\n-- Các bảng phụ dùng cho bài tập (self join, recursion, ranking,\n-- windowing, OLAP). Chạy SAU university_data.sql.\n-- =====================================================================\n\ndrop table if exists emp_super cascade;\ndrop table if exists grade_points cascade;\ndrop table if exists student_grades cascade;\ndrop table if exists dept_grades cascade;\ndrop table if exists sales cascade;\ndrop table if exists itemcategory cascade;\ndrop table if exists daily_sales cascade;\ndrop table if exists account_txn cascade;\n\n-- Slide 3: \"Self Join Example\" — relation emp-super(person, supervisor)\ncreate table emp_super (\n  person      varchar(20) primary key,\n  supervisor  varchar(20)\n);\ninsert into emp_super values\n  ('Bob',   'Alice'),\n  ('Mary',  'Susan'),\n  ('Alice', 'David'),\n  ('David', 'Mary'),\n  ('Tom',   'Bob'),\n  ('Eve',   'Alice');\n\n-- Điểm số quy đổi của từng letter grade\ncreate table grade_points (\n  grade   varchar(2) primary key,\n  points  numeric(2,1)\n);\ninsert into grade_points values\n  ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n  ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('F', 0.0);\n\n-- Slide 5: student_grades(ID, GPA) và dept_grades(ID, dept_name, GPA)\n-- GPA = sum(points * credits) / sum(credits), bỏ qua môn chưa có điểm.\n-- Sinh viên chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-01-07 11:00', 1000),\n  ('A-215', '2018-01-30 08:20', -400),\n  ('A-215', '2018-03-02 13:10', 250);\n","-- =====================================================================\n-- Các lược đồ dùng trong Practice Exercises của sách (chương 2–4).\n-- Sách không kèm dữ liệu cho các lược đồ này; dữ liệu dưới đây được\n-- thiết kế để mỗi câu Practice Exercise cho ra kết quả có ý nghĩa\n-- (có hoà, có null, có giá trị biên). Chạy SAU extra_tables.sql.\n--\n--   Employee database  (Figure 2.17, 3.19, 4.12): employee, works, company, manages\n--   Bank database      (Figure 2.18, 3.18):       branch, customer, loan, borrower, account, depositor\n--   Insurance database (Figure 3.17):             person, car, accident, owns, participated\n--   marks(ID, score)   (Exercise 3.5)\n--   emp_title, emp_salary (Exercise 4.10: a(name, address, title), b(name, address, salary))\n-- =====================================================================\n\ndrop table if exists manages, works, company, employee cascade;\ndrop table if exists depositor, account, borrower, loan, customer, branch cascade;\ndrop table if exists participated, owns, accident, car, person cascade;\ndrop table if exists marks, emp_title, emp_salary cascade;\n\n-- ---------------------------------------------------------------- Employee database\ncreate table employee (\n  ID           varchar(5) primary key,\n  person_name  varchar(30) not null,\n  street       varchar(30),\n  city         varchar(30)\n);\n\n-- Exercise 3.9e giả sử một công ty có thể đặt ở nhiều thành phố,\n-- nên khoá của company là (company_name, city).\ncreate table company (\n  company_name  varchar(30),\n  city          varchar(30),\n  primary key (company_name, city)\n);\n\n-- ID là khoá: mỗi người làm cho đúng một công ty.\ncreate table works (\n  ID            varchar(5) primary key references employee,\n  company_name  varchar(30) not null,\n  salary        numeric(10,2)\n);\n\ncreate table manages (\n  ID          varchar(5) primary key references employee,\n  manager_id  varchar(5) references employee (ID)\n);\n\ninsert into employee values\n  ('10001', 'Alice Nguyen', '12 Oak St',    'Miami'),\n  ('10002', 'Bob Tran',     '45 Pine Ave',  'Miami'),\n  ('10003', 'Carol Le',     '9 Elm Rd',     'Boston'),\n  ('10004', 'David Pham',   '77 Main St',   'New York'),\n  ('10005', 'Eva Vo',       '3 Lake Dr',    'Miami'),\n  ('10006', 'Frank Do',     '21 Hill St',   'Chicago'),\n  ('10007', 'Grace Ho',     '8 River Rd',   'Miami'),\n  ('10008', 'Henry Bui',    '50 Bay St', de,\n  driver_id      varchar(5) references person,\n  damage_amount  numeric(10,2),\n  primary key (report_number, license_plate)\n);\n\ninsert into person values\n  ('12345', 'John Carter', '12 Maple St'),\n  ('22222', 'Mary Lee',    '40 Cedar Ave'),\n  ('33333', 'Anna Kim',    '7 Birch Rd'),\n  ('44444', 'Brian Cho',   '19 Willow Ln'),\n  ('55555', 'Chloe Park',  '3 Aspen Ct'),\n  ('66666', 'Daniel Wu',   '88 Spruce Dr');\n\ninsert into car values\n  ('AAA111', 'Toyota Camry',  2010),\n  ('BBB222', 'Honda Civic',   2010),\n  ('CCC333', 'Ford Focus',    2015),\n  ('DDD444', 'Mazda 3',       2010),\n  ('EEE555', 'Kia Rio',       2018),\n  ('FFF666', 'Tesla Model 3', 2020),\n  ('GGG777', 'Hyundai i30',   2012);\n\ninsert into accident values\n  ('AR1001', 2017, 'Main St'),\n  ('AR1002', 2017, 'Highway 1'),\n  ('AR1003', 2018, 'Downtown'),\n  ('AR1004', 2017, 'Airport Rd'),\n  ('AR1005', 2016, 'Old Bridge');\n\ninsert into owns values\n  ('12345', 'AAA111'),\n  ('12345', 'BBB222'),\n  ('12345', 'CCC333'),\n  ('22222', 'DDD444'),\n  ('33333', 'EEE555'),\n  ('44444', 'EEE555'),   -- EEE555 có hai chủ\n  ('44444', 'FFF666'),\n  ('55555', 'GGG777');\n\ninsert into participated values\n  ('AR1001', 'AAA111', '12345', 1200),\n  ('AR1001', 'EEE555', '33333',  800),\n  ('AR1002', 'DDD444', '55555', 2500),   -- người lái không phải chủ xe\n  ('AR1004', 'AAA111', '12345',  600),   -- 12345 dính hai vụ năm 2017\n  ('AR1003', 'FFF666', '44444', 3000),\n  ('AR1005', 'GGG777', '55555',  400);\n\n-- ---------------------------------------------------------------- Exercise 3.5\n-- Điểm số của sinh viên (ID lấy từ bảng student); có các giá trị biên 40, 60, 80.\ncreate table marks (\n  ID     varchar(5) primary key,\n  score  integer\n);\ninsert into marks values\n  ('00128', 92), ('12345', 78), ('19991', 39), ('23121', 60), ('44553', 55),\n  ('45678', 40), ('54321', 85), ('55739', 59), ('70557', 80), ('76543', 20),\n  ('76653', 61), ('98765', 79), ('98988', 100);\n\n-- --------------
