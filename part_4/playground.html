es của rất nhiều sinh viên trong document store (MongoDB) sao cho lấy toàn bộ dữ liệu của một sinh viên hiệu quả. Biểu diễn thế nào? Cho ví dụ.","en":"\u003cp>\u003cstrong>Exercise 10.2.\u003c/strong> Data about a very large number of students is to be kept in a distributed document store such as MongoDB, where each student’s data corresponds to the data in the \u003cem>student\u003c/em> and \u003cem>takes\u003c/em> relations. How would you represent this data so that all the data of one particular student can be accessed efficiently? Show an example of the representation for one student.\u003c/p>","answer":"\u003cp>Mỗi sinh viên là \u003cstrong>một document JSON\u003c/strong>, khoá là ID; các tuple takes của sinh viên đó \u003cstrong>lồng\u003c/strong> bên trong thành một mảng object. Một lần get theo ID trả về mọi thứ, không cần join, và toàn bộ document nằm trên cùng một máy.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"json\">\u003ccode>{\n  \"ID\": \"12345\", \"name\": \"Shankar\", \"dept_name\": \"Comp. Sci.\", \"tot_cred\": 32,\n  \"takes\": [\n    { \"course_id\": \"CS-101\", \"sec_id\": \"1\", \"semester\": \"Fall\",   \"year\": 2017, \"grade\": \"C\" },\n    { \"course_id\": \"CS-347\", \"sec_id\": \"1\", \"semester\": \"Fall\",   \"year\": 2017, \"grade\": \"A\" },\n    { \"course_id\": \"CS-190\", \"sec_id\": \"2\", \"semester\": \"Spring\", \"year\": 2017, \"grade\": \"A\" },\n    { \"course_id\": \"CS-315\", \"sec_id\": \"1\", \"semester\": \"Spring\", \"year\": 2018, \"grade\": \"A\" }\n  ]\n}\u003c/code>\u003c/pre>\n\u003cp>Bảng \u003ccode>bd_student_doc\u003c/code> trong lab chứa đúng các document như vậy (bài CH10.07–CH10.10). Đổi lại, truy vấn \"mọi sinh viên học CS-101\" phải quét mọi document (hoặc cần index trên \u003ccode>takes.course_id\u003c/code>).\u003c/p>"},{"q":"\u003cstrong>PE 10.3.\u003c/strong> Lưu hoá đơn (định danh bằng customer ID và ngày) trong key-value store hỗ trợ range query, khi truy vấn hỏi hoá đơn của một khách trong một khoảng ngày.","en":"\u003cp>\u003cstrong>Exercise 10.3.\u003c/strong> Utility bills of a large number of users are to be stored; each bill is identified by a customer ID and a date. Queries ask for the bills of a given customer within a given date range. How would you store the bills in a key-value store that supports range queries?\u003c/p>","answer":"\u003cp>Dùng khoá \u003cstrong>ghép\u003c/strong>: customer ID nối với ngày ở dạng \u003cstrong>năm/tháng/ngày\u003c/strong> (để thứ tự chuỗi trùng thứ tự thời gian), ví dụ \u003ccode>C1/2018/02/28\u003c/code>. Các hoá đơn của một khách nằm liền nhau và theo thứ tự ngày, nên \"C1 từ 2018-02-01 tới 2018-03-31\" là range query \u003ccode>key between 'C1/2018/02/01' and 'C1/2018/03/31'\u003c/code>.\u003c/p>\n\u003cp>Lưu ý: cần dấu phân cách (hoặc độ dài ID cố định) để khoá của C10 không xen vào giữa các khoá của C1; với \u003ccode>/\u003c/code> thì \u003ccode>'C1/…' &lt; 'C10…'\u003c/code> vì \u003ccode>/\u003c/code> đứng trước chữ số. Bài CH10.11.\u003c/p>"},{"q":"\u003cstrong>PE 10.4.\u003c/strong> Viết pseudocode tính r ⋈\u003csub>r.A=s.A\u003c/sub> s bằng một bước MapReduce, map() được gọi trên mọi tuple của r và s, lấy tên relation bằng context.relname().","en":"\u003cp>\u003cstrong>Exercise 10.4.\u003c/strong> Give pseudocode that computes the join r ⋈\u003csub>r.A=s.A\u003c/sub> s in a single MapReduce step. Assume map() is called on every tuple of both r and s, and that map() can obtain the name of the relation of its input via context.relname().\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>map(key, t):\n    rel = context.relname()          // \"r\" hoặc \"s\"\n    emit(t.A, (rel, t))              // khoá reduce = giá trị thuộc tính join\n\nreduce(a, values):                   // mọi tuple của r và s có A = a\n    rs = [t for (rel, t) in values if rel == \"r\"]\n    ss = [t for (rel, t) in values if rel == \"s\"]\n    for tr in rs:\n        for ts in ss:\n            emit(null, concat(tr, ts))\u003c/code>\u003c/pre>\n\u003cp>Shuffle đưa mọi tuple cùng giá trị A về cùng một reduce, nên reduce chỉ cần ghép chéo hai nhóm. Đây là \u003cstrong>repartition (hash) join\u003c/strong>. Bài CH10.12 mô phỏng đúng hai bước này bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 10.5.\u003c/strong> Đoạn Spark \u003ccode>lines.collect().map(s -&gt; s.length()).reduce(0, (a,b) -&gt; a+b)\u003c/code> có vấn đề khái niệm gì?","en":"\u003cp>\u003cstrong>Exercise 10.5.\u003c/strong> The following Apache Spark snippet is meant to process very large data. What is the conceptual problem with it? (collect() returns a Java collection, and Java collections — from Java 8 on — support map and reduce.)\u003c/p>\n\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>JavaRDD&lt;String&gt; lines = sc.textFile(\"logDirectory\");\nint totalLength = lines.collect().map(s -&gt; s.length())\n                       .reduce(0, (a, b) -&gt; a + b);\u003c/code>\u003c/pre>","answer":"\u003cp>\u003ccode>collect()\u003c/code> là một \u003cstrong>action\u003c/strong> gom \u003cstrong>toàn bộ\u003c/strong> RDD về \u003cstrong>một\u003c/strong> máy (driver) thành Java collection. Sau đó map và reduce chạy trên collection đó, tức là \u003cstrong>tuần tự trên một máy\u003c/strong> chứ không song song trên cluster như mong muốn — và với dữ liệu rất lớn sẽ tràn bộ nhớ. Đúng: \u003ccode>lines.map(s -&gt; s.length()).reduce((a, b) -&gt; a + b)\u003c/code> trên RDD; chỉ kết quả cuối (một số) về driver. Tương đương SQL: \u003ccode>select sum(length(line)) from bd_log\u003c/code> (bài CH10.06).\u003c/p>"},{"q":"\u003cstrong>PE 10.6.\u003c/strong> (a) Spark tính song song thế nào? (b) \"Spark áp dụng transformation trên RDD một cách lazy\" nghĩa là gì? (c) Lợi ích của lazy evaluation?","en":"\u003cp>\u003cstrong>Exercise 10.6.\u003c/strong> Apache Spark:\u003c/p>\n\u003cp>a. How does Apache Spark carry out computations in parallel?\u003c/p>\n\u003cp>b. Explain what is meant by saying that Spark applies transformations on RDDs lazily.\u003c/p>\n\u003cp>c. What benefits does lazy evaluation of operations bring in Apache Spark?\u003c/p>","answer":"\u003cp>a. RDD được \u003cstrong>chia partition\u003c/strong> trên nhiều máy; mỗi transformation (map, filter, join, reduceByKey…) chạy song song trên các partition, dữ liệu được chia lại (shuffle) khi cần.\u003c/p>\n\u003cp>b. Gọi transformation \u003cstrong>không thực thi ngay\u003c/strong>: Spark chỉ ghi lại phép toán vào một cây (lineage/DAG). Việc tính chỉ xảy ra khi cần kết quả bởi một \u003cstrong>action\u003c/strong> như \u003ccode>collect()\u003c/code>, \u003ccode>count()\u003c/code>, \u003ccode>saveAsTextFile()\u003c/code>.\u003c/p>\n\u003cp>c. Lợi ích:\u003c/p>\n\u003cul>\u003cli>Có cả cây phép toán nên \u003cstrong>tối ưu hoá\u003c/strong> được (gộp phép, đổi thứ tự, đẩy filter xuống) giống query optimizer.\u003c/li>\u003cli>\u003cstrong>Pipeline\u003c/strong>: kết quả của phép này chuyển thẳng sang phép sau trong bộ nhớ, không ghi đĩa giữa các bước (khác MapReduce).\u003c/li>\u003cli>Không tính những gì không bao giờ được dùng; khi mất partition có thể tính lại từ lineage (fault tolerance).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 10.7.\u003c/strong> Viết chương trình Spark tính N, mọi (w\u003csub>i\u003c/sub>, n\u003csub>i\u003c/sub>), mọi ((w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>), n\u003csub>i,j\u003c/sub>) rồi xuất các cặp từ có n\u003csub>i,j\u003c/sub>/N ≥ 10 · (n\u003csub>i\u003c/sub>/N) · (n\u003csub>j\u003c/sub>/N).","en":"\u003cp>\u003cstrong>Exercise 10.7.\u003c/strong> For a collection of documents, let n\u003csub>i\u003c/sub> be the number of occurrences of word w\u003csub>i\u003c/sub> in the whole collection and N the total number of word occurrences over all documents. For every pair of consecutive words (w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>) in a document, let n\u003csub>i,j\u003c/sub> be the number of occurrences of that pair over all documents.\u003c/p>\n\u003cp>Write an Apache Spark program that, for a collection of documents in a directory, computes N, all pairs (w\u003csub>i\u003c/sub>, n\u003csub>i\u003c/sub>), and all pairs ((w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>), n\u003csub>i,j\u003c/sub>). Then output every word pair with n\u003csub>i,j\u003c/sub>/N ≥ 10 × (n\u003csub>i\u003c/sub>/N) × (n\u003csub>j\u003c/sub>/N) — pairs that occur at least 10 times as often as expected if the two words occurred independently.\u003c/p>\n\u003cp>The join operation on RDDs is useful in the last step to bring the related counts together. To keep it simple, ignore word pairs that span lines, and assume words are lowercase only and there is no punctuation.\u003c/p>","answer":"\u003cp>Ý tưởng (Java, Spark):\u003c/p>\n\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>JavaRDD&lt;String&gt; lines = sc.textFile(\"docDirectory\");\nJavaRDD&lt;String[]&gt; words = lines.map(l -&gt; l.split(\" \"));\n\n// n_i và N\nJavaPairRDD&lt;String, Long&gt; wordCounts = words\n    .flatMap(ws -&gt; Arrays.asList(ws).iterator())\n    .mapToPair(w -&gt; new Tuple2&lt;&gt;(w, 1L))\n    .reduceByKey(Long::sum);\nlong N = wordCounts.values().reduce(Long::sum);\n\n// n_ij cho cặp từ liên tiếp trong cùng một dòng\nJavaPairRDD&lt;Tuple2&lt;String, String&gt;, Long&gt; pairCounts = words\n    .flatMap(ws -&gt; { List&lt;Tuple2&lt;String, String&gt;&gt; p = new ArrayList&lt;&gt;();\n                     for (int k = 0; k + 1 &lt; ws.length; k++) p.add(new Tuple2&lt;&gt;(ws[k], ws[k + 1]));\n                     return p.iterator(); })\n    .mapToPair(p -&gt; new Tuple2&lt;&gt;(p, 1L))\n    .reduceByKey(Long::sum);\n\n// join để mang n_i rồi n_j tới mỗi cặp\nJavaPairRDD&lt;String, Tuple2&lt;String, Long&gt;&gt; byFirst =\n    pairCounts.mapToPair(e -&gt; new Tuple2&lt;&gt;(e._1()._1(), new Tuple2&lt;&gt;(e._1()._2(), e._2())));\nJavaPairRDD&lt;String, Tuple2&lt;Tuple2&lt;String, Long&gt;, Long&gt;&gt; withNi = byFirst.join(wordCounts);\n// (wi, ((wj, nij), ni)) -&gt; (wj, (wi, nij, ni))\nJavaPairRDD&lt;String, Tuple3&lt;String, Long, Long&gt;&gt; bySecond = withNi.mapToPair(e -&gt;\n    new Tuple2&lt;&gt;(e._2()._1()._1(), new Tuple3&lt;&gt;(e._1(), e._2()._1()._2(), e._2()._2())));\nJavaPairRDD&lt;String, Tuple2&lt;Tuple3&lt;String, Long, Long&gt;, Long&gt;&gt; withNj = bySecond.join(wordCounts);\n\nwithNj.filter(e -&gt; { double nij = e._2()._1()._2(), ni = e._2()._1()._3(), nj = e._2()._2();\n                     return nij / N &gt;= 10 * (ni / N) * (nj / N); })\n      .map(e -&gt; e._2()._1()._1() + \" \" + e._1())\n      .saveAsTextFile(\"output\");\u003c/code>\u003c/pre>\n\u003cp>Tách theo dòng nên tự động không có cặp vắt qua hai dòng. Điều kiện tương đương n\u003csub>i,j\u003c/sub> · N ≥ 10 · n\u003csub>i\u003c/sub> · n\u003csub>j\u003c/sub> (tránh chia). Bài CH10.05 làm đúng phép tính này bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 10.8.\u003c/strong> Viết lại truy vấn dùng \u003ccode>tumblingwindow(hour, 1)\u003c/code> bằng SQL thông thường, với to_seconds(timestamp) và floor(a).","en":"\u003cp>\u003cstrong>Exercise 10.8.\u003c/strong> Consider this query that uses the tumbling-window operator:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select item, System.Timestamp as window_end, sum(amount)\nfrom order timestamp by datetime\ngroup by itemid, tumblingwindow(hour, 1)\u003c/code>\u003c/pre>\n\u003cp>Write an equivalent query with ordinary SQL constructs, without the tumbling-window operator. You may assume a function to_seconds(timestamp) that converts a timestamp to the integer number of seconds since midnight, January 1, 1970, the usual arithmetic functions, and floor(a), which returns the largest integer ≤ a.\u003c/p>","answer":"\u003cp>Mỗi giờ là một cửa sổ: số thứ tự cửa sổ = \u003ccode>floor(to_seconds(datetime) / 3600)\u003c/code>; điểm cuối cửa sổ = \u003ccode>(số thứ tự + 1) * 3600\u003c/code>.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select itemid, (floor(to_seconds(datetime) / 3600) + 1) * 3600 as window_end, sum(amount)\nfrom order\ngroup by itemid, floor(to_seconds(datetime) / 3600)\u003c/code>\u003c/pre>\n\u003cp>(window_end ở đây là số giây; đổi lại thành timestamp nếu cần.) Trong PostgreSQL: \u003ccode>to_seconds\u003c/code> ≈ \u003ccode>extract(epoch from datetime)\u003c/code>, đổi ngược bằng \u003ccode>to_timestamp(...)\u003c/code> — bài CH10.15. Lưu ý sự kiện lúc đúng 10:00:00 thuộc cửa sổ 10:00–11:00, không thuộc cửa sổ kết thúc lúc 10:00.\u003c/p>"},{"q":"\u003cstrong>PE 10.9.\u003c/strong> Mô hình University thành đồ thị: student, instructor, course, section, takes, teaches là node hay edge? Có biểu diễn được liên kết section–course không?","en":"\u003cp>\u003cstrong>Exercise 10.9.\u003c/strong> The university schema is to be modeled as a graph. For each relation below, explain whether it would become a node or an edge: (i) \u003cem>student\u003c/em>, (ii) \u003cem>instructor\u003c/em>, (iii) \u003cem>course\u003c/em>, (iv) \u003cem>section\u003c/em>, (v) \u003cem>takes\u003c/em>, (vi) \u003cem>teaches\u003c/em>. Does the model capture the connections between sections and courses?\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Node\u003c/strong>: (i) student, (ii) instructor, (iii) course, (iv) section — đều là entity.\u003c/li>\u003cli>\u003cstrong>Edge\u003c/strong>: (v) takes (student → section, thuộc tính grade), (vi) teaches (instructor → section).\u003c/li>\u003cli>Liên kết section–course: trong lược đồ quan hệ, relationship sec_course đã được \u003cstrong>gộp vào bảng section\u003c/strong> (cột course_id là một phần khoá), nên với cách chuyển trên nó \u003cstrong>không\u003c/strong> trở thành edge. Muốn có cạnh section → course phải tách sec_course thành relation riêng (hoặc khai báo course_id của section là một edge). Bài CH10.18.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"CH10.01","topic":"MapReduce word count","level":1,"prompt":"\u003cp>Bảng \u003ccode>bd_doc(doc_id, body)\u003c/code> chứa văn bản chữ thường, các từ cách nhau đúng một dấu cách. Viết \u003cstrong>word count\u003c/strong> kiểu MapReduce bằng SQL: map = tách mỗi body thành các từ (\u003ccode>regexp_split_to_table(body, ' ')\u003c/code>), reduce = đếm. Trả về \u003ccode>word\u003c/code> và \u003ccode>n\u003c/code> (số lần xuất hiện trong toàn bộ tập văn bản).\u003c/p>","en":"","hint":"\u003ccode>from bd_doc, regexp_split_to_table(body, ' ') as word group by word\u003c/code>","solution":"select word, count(*) as n\nfrom bd_doc, regexp_split_to_table(body, ' ') as word\ngroup by word;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["word","n"],"rows":[["reduce","1"],["parallel","2"],["keeps","1"],["a","2"],["systems","1"],["model","1"],["processing","2"],["scales","1"],["is","1"],["key","1"],["spark","1"],["memory","1"],["value","1"],["needs","1"],["data","4"],["big","4"],["store","1"],["map","1"],["for","1"],["of","1"],["in","1"],["out","1"]]}},{"id":"CH10.02","topic":"top-k words","level":1,"prompt":"\u003cp>Tiếp CH10.01: chỉ trả về các từ xuất hiện \u003cstrong>ít nhất 2 lần\u003c/strong>, sắp theo \u003ccode>n\u003c/code> giảm dần, cùng \u003ccode>n\u003c/code> thì theo \u003ccode>word\u003c/code> tăng dần.\u003c/p>","en":"","hint":"","solution":"select word, count(*) as n\nfrom bd_doc, regexp_split_to_table(body, ' ') as word\ngroup by word\nhaving count(*) >= 2\norder by n desc, word;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["word","n"],"rows":[["big","4"],["data","4"],["a","2"],["parallel","2"],["processing","2"]]}},{"id":"CH10.03","topic":"inverted index","level":2,"prompt":"\u003cp>\u003cstrong>Inverted index\u003c/strong> (chỉ mục ngược, dùng trong search engine) ánh xạ mỗi từ tới danh sách document chứa nó. Trả về \u003ccode>word\u003c/code> và \u003ccode>docs\u003c/code> — mảng các doc_id \u003cstrong>không trùng, tăng dần\u003c/strong> — chỉ cho các từ có mặt trong \u003cstrong>ít nhất 2 document\u003c/strong>.\u003c/p>","en":"","hint":"\u003ccode>array_agg(distinct doc_id order by doc_id)\u003c/code>; điều kiện đặt ở having với \u003ccode>count(distinct doc_id)\u003c/code>.","solution":"select word, array_agg(distinct doc_id order by doc_id) as docs\nfrom bd_doc, regexp_split_to_table(body, ' ') as word\ngroup by word\nhaving count(distinct doc_id) >= 2;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["word","docs"],"rows":[["a","[2,4]"],["big","[1,2,5]"],["data","[1,2,3,5]"],["parallel","[1,2]"],["processing","[1,2]"]]}},{"id":"CH10.04","topic":"PE 10.7 N","level":1,"prompt":"\u003cp>Phần đầu của PE 10.7 trên \u003ccode>bd_doc\u003c/code>: trả về \u003cstrong>một dòng hai cột\u003c/strong> \u003ccode>total_words\u003c/code> = N (tổng số lần xuất hiện của mọi từ) và \u003ccode>distinct_words\u003c/code> (số từ khác nhau).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.7.\u003c/strong> For a collection of documents, let n\u003csub>i\u003c/sub> be the number of occurrences of word w\u003csub>i\u003c/sub> in the whole collection and N the total number of word occurrences over all documents. For every pair of consecutive words (w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>) in a document, let n\u003csub>i,j\u003c/sub> be the number of occurrences of that pair over all documents.\u003c/p>\n\u003cp>Write an Apache Spark program that, for a collection of documents in a directory, computes N, all pairs (w\u003csub>i\u003c/sub>, n\u003csub>i\u003c/sub>), and all pairs ((w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>), n\u003csub>i,j\u003c/sub>). Then output every word pair with n\u003csub>i,j\u003c/sub>/N ≥ 10 × (n\u003csub>i\u003c/sub>/N) × (n\u003csub>j\u003c/sub>/N) — pairs that occur at least 10 times as often as expected if the two words occurred independently.\u003c/p>\n\u003cp>The join operation on RDDs is useful in the last step to bring the related counts together. To keep it simple, ignore word pairs that span lines, and assume words are lowercase only and there is no punctuation.\u003c/p>","hint":"","solution":"select count(*) as total_words, count(distinct word) as distinct_words\nfrom bd_doc, regexp_split_to_table(body, ' ') as word;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["total_words","distinct_words"],"rows":[["31","22"]]}},{"id":"CH10.05","topic":"PE 10.7 word pairs","level":3,"prompt":"\u003cp>PE 10.7 bằng SQL trên \u003ccode>bd_doc\u003c/code> (mỗi body là một dòng; không có cặp vắt qua hai document). Gọi n\u003csub>i\u003c/sub> là số lần xuất hiện của từ w\u003csub>i\u003c/sub>, N là tổng số lần xuất hiện, n\u003csub>i,j\u003c/sub> là số lần cặp \u003cstrong>liên tiếp\u003c/strong> (w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>) xuất hiện. Trả về \u003ccode>w1\u003c/code>, \u003ccode>w2\u003c/code>, \u003ccode>n\u003c/code> (= n\u003csub>i,j\u003c/sub>) của mọi cặp thoả n\u003csub>i,j\u003c/sub>/N ≥ 10 · (n\u003csub>i\u003c/sub>/N) · (n\u003csub>j\u003c/sub>/N).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.7.\u003c/strong> For a collection of documents, let n\u003csub>i\u003c/sub> be the number of occurrences of word w\u003csub>i\u003c/sub> in the whole collection and N the total number of word occurrences over all documents. For every pair of consecutive words (w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>) in a document, let n\u003csub>i,j\u003c/sub> be the number of occurrences of that pair over all documents.\u003c/p>\n\u003cp>Write an Apache Spark program that, for a collection of documents in a directory, computes N, all pairs (w\u003csub>i\u003c/sub>, n\u003csub>i\u003c/sub>), and all pairs ((w\u003csub>i\u003c/sub>, w\u003csub>j\u003c/sub>), n\u003csub>i,j\u003c/sub>). Then output every word pair with n\u003csub>i,j\u003c/sub>/N ≥ 10 × (n\u003csub>i\u003c/sub>/N) × (n\u003csub>j\u003c/sub>/N) — pairs that occur at least 10 times as often as expected if the two words occurred independently.\u003c/p>\n\u003cp>The join operation on RDDs is useful in the last step to bring the related counts together. To keep it simple, ignore word pairs that span lines, and assume words are lowercase only and there is no punctuation.\u003c/p>","hint":"\u003ccode>regexp_split_to_table(body, ' ') with ordinality as t(word, pos)\u003c/code> cho vị trí từ; cặp liên tiếp: self-join cùng doc_id và \u003ccode>b.pos = a.pos + 1\u003c/code>. Ép numeric để không chia nguyên.","solution":"with w as (\n  select doc_id, pos, word\n  from bd_doc, regexp_split_to_table(body, ' ') with ordinality as t(word, pos)),\ntot as (select count(*)::numeric as n from w),\nuni as (select word, count(*) as n from w group by word),\nbi  as (select a.word as w1, b.word as w2, count(*) as n\n        from w a join w b on a.doc_id = b.doc_id and b.pos = a.pos + 1\n        group by a.word, b.word)\nselect bi.w1, bi.w2, bi.n\nfrom bi\njoin uni u1 on u1.word = bi.w1\njoin uni u2 on u2.word = bi.w2,\ntot\nwhere bi.n / tot.n >= 10 * (u1.n / tot.n) * (u2.n / tot.n);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["w1","w2","n"],"rows":[["map","reduce","1"],["needs","parallel","1"],["for","parallel","1"],["spark","keeps","1"],["is","a","1"],["a","model","1"],["parallel","processing","2"],["store","scales","1"],["reduce","is","1"],["a","key","1"],["in","memory","1"],["key","value","1"],["value","store","1"],["model","for","1"],["processing","of","1"],["scales","out","1"]]}},{"id":"CH10.06","topic":"PE 10.5 parallel sum","level":1,"prompt":"\u003cp>Phiên bản \u003cstrong>đúng\u003c/strong> của đoạn Spark trong PE 10.5: tính tổng độ dài (số ký tự) của mọi dòng trong \u003ccode>bd_log(line_no, line)\u003c/code> bằng một phép aggregate (mỗi dòng map thành độ dài, reduce bằng cộng). Trả về một cột \u003ccode>total_length\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.5.\u003c/strong> The following Apache Spark snippet is meant to process very large data. What is the conceptual problem with it? (collect() returns a Java collection, and Java collections — from Java 8 on — support map and reduce.)\u003c/p>\n\u003cpre class=\"code\" data-lang=\"java\">\u003ccode>JavaRDD&lt;String&gt; lines = sc.textFile(\"logDirectory\");\nint totalLength = lines.collect().map(s -&gt; s.length())\n                       .reduce(0, (a, b) -&gt; a + b);\u003c/code>\u003c/pre>","hint":"","solution":"select sum(length(line)) as total_length from bd_log;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["total_length"],"rows":[["91"]]}},{"id":"CH10.07","topic":"PE 10.2 jsonb access","level":1,"prompt":"\u003cp>\u003ccode>bd_student_doc(id, doc jsonb)\u003c/code> lưu mỗi sinh viên thành một document như PE 10.2: \u003ccode>{\"ID\", \"name\", \"dept_name\", \"tot_cred\", \"takes\": [{course_id, sec_id, semester, year, grade}, …]}\u003c/code>. Lấy \u003ccode>name\u003c/code> (text) và \u003ccode>num_takes\u003c/code> (số phần tử của mảng takes) của sinh viên \u003ccode>12345\u003c/code> — \u003cstrong>chỉ dùng bd_student_doc\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.2.\u003c/strong> Data about a very large number of students is to be kept in a distributed document store such as MongoDB, where each student’s data corresponds to the data in the \u003cem>student\u003c/em> and \u003cem>takes\u003c/em> relations. How would you represent this data so that all the data of one particular student can be accessed efficiently? Show an example of the representation for one student.\u003c/p>","hint":"\u003ccode>doc-&gt;&gt;'name'\u003c/code>, \u003ccode>jsonb_array_length(doc-&gt;'takes')\u003c/code>.","solution":"select doc->>'name' as name, jsonb_array_length(doc->'takes') as num_takes\nfrom bd_student_doc\nwhere id = '12345';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","num_takes"],"rows":[["Shankar","4"]]}},{"id":"CH10.08","topic":"jsonb unnest","level":2,"prompt":"\u003cp>Từ \u003ccode>bd_student_doc\u003c/code>, \"bung\" mảng takes thành dòng: trả về \u003ccode>id\u003c/code>, \u003ccode>course_id\u003c/code>, \u003ccode>year\u003c/code> (integer) của mọi môn mà sinh viên đạt điểm \u003ccode>A\u003c/code>.\u003c/p>","en":"","hint":"\u003ccode>cross join lateral jsonb_array_elements(doc-&gt;'takes') as t(e)\u003c/code>; \u003ccode>(e-&gt;&gt;'year')::int\u003c/code>.","solution":"select d.id, t.e->>'course_id' as course_id, (t.e->>'year')::int as year\nfrom bd_student_doc d\ncross join lateral jsonb_array_elements(d.doc->'takes') as t(e)\nwhere t.e->>'grade' = 'A';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","course_id","year"],"rows":[["00128","CS-101","2017"],["12345","CS-347","2017"],["12345","CS-190","2017"],["12345","CS-315","2018"],["76543","CS-101","2017"],["76543","CS-319","2018"],["98988","BIO-101","2017"]]}},{"id":"CH10.09","topic":"build a document","level":2,"prompt":"\u003cp>Tạo view \u003ccode>bd_student_summary(id, doc)\u003c/code> từ bảng \u003cstrong>student\u003c/strong> và \u003cstrong>takes\u003c/strong> (không dùng bd_student_doc): với mỗi sinh viên, \u003ccode>doc\u003c/code> là jsonb \u003ccode>{\"name\": …, \"courses\": [...]}\u003c/code> trong đó courses là mảng các course_id \u003cstrong>không trùng, tăng dần\u003c/strong> sinh viên đã học (mảng rỗng \u003ccode>[]\u003c/code> nếu chưa học môn nào). Hệ thống đọc document của 45678 và 70557.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.2.\u003c/strong> Data about a very large number of students is to be kept in a distributed document store such as MongoDB, where each student’s data corresponds to the data in the \u003cem>student\u003c/em> and \u003cem>takes\u003c/em> relations. How would you represent this data so that all the data of one particular student can be accessed efficiently? Show an example of the representation for one student.\u003c/p>","hint":"\u003ccode>jsonb_build_object\u003c/code>, \u003ccode>coalesce((select jsonb_agg(distinct course_id order by course_id) from takes where ...), '[]'::jsonb)\u003c/code>.","solution":"create view bd_student_summary (id, doc) as\nselect s.ID,\n       jsonb_build_object(\n         'name', s.name,\n         'courses', coalesce((select jsonb_agg(distinct t.course_id order by t.course_id)\n                              from takes t where t.ID = s.ID), '[]'::jsonb))\nfrom student s;","check":"select id, doc::text as doc from bd_student_summary where id in ('45678', '70557') order by id;","ordered":false,"fresh":false,"expected":{"fields":["id","doc"],"rows":[["45678","{\"name\": \"Levy\", \"courses\": [\"CS-101\", \"CS-319\"]}"],["70557","{\"name\": \"Snow\", \"courses\": []}"]]}},{"id":"CH10.10","topic":"jsonb containment","level":2,"prompt":"\u003cp>Dùng toán tử chứa \u003ccode>@&gt;\u003c/code> của jsonb để tìm \u003ccode>id\u003c/code> của mọi sinh viên trong \u003ccode>bd_student_doc\u003c/code> có học course \u003ccode>CS-101\u003c/code> (ở bất kỳ học kỳ nào).\u003c/p>","en":"","hint":"\u003ccode>doc-&gt;'takes' @&gt; '[{\"course_id\": \"CS-101\"}]'\u003c/code>","solution":"select id from bd_student_doc\nwhere doc->'takes' @> '[{\"course_id\": \"CS-101\"}]';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id"],"rows":[["00128"],["12345"],["45678"],["54321"],["76543"],["98765"]]}},{"id":"CH10.11","topic":"PE 10.3 composite key","level":2,"prompt":"\u003cp>Mô phỏng key-value store của PE 10.3. Tạo view \u003ccode>bd_bill_kv(key, amount)\u003c/code> từ \u003ccode>bd_bill(customer_id, bill_date, amount)\u003c/code>, với \u003ccode>key\u003c/code> = customer_id + \u003ccode>'/'\u003c/code> + ngày dạng \u003ccode>YYYY/MM/DD\u003c/code> (ví dụ \u003ccode>C1/2018/02/28\u003c/code>). Hệ thống chạy \u003cstrong>range query trên key\u003c/strong>: hoá đơn của C1 từ 2018/02/01 đến 2018/03/31 — kết quả không được lẫn hoá đơn của C10.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.3.\u003c/strong> Utility bills of a large number of users are to be stored; each bill is identified by a customer ID and a date. Queries ask for the bills of a given customer within a given date range. How would you store the bills in a key-value store that supports range queries?\u003c/p>","hint":"\u003ccode>customer_id || '/' || to_char(bill_date, 'YYYY/MM/DD')\u003c/code>","solution":"create view bd_bill_kv (key, amount) as\nselect customer_id || '/' || to_char(bill_date, 'YYYY/MM/DD'), amount\nfrom bd_bill;","check":"select key, amount from bd_bill_kv\nwhere key between 'C1/2018/02/01' and 'C1/2018/03/31' order by key;","ordered":false,"fresh":false,"expected":{"fields":["key","amount"],"rows":[["C1/2018/02/28","48.75"],["C1/2018/03/31","61.2"]]}},{"id":"CH10.12","topic":"PE 10.4 MapReduce join","level":3,"prompt":"\u003cp>Tính \u003ccode>bd_r ⋈ bd_s\u003c/code> theo r.a = s.a \u003cstrong>theo đúng hai bước MapReduce\u003c/strong> của PE 10.4 (không join thẳng hai bảng):\u003c/p>\n\u003col>\u003cli>\u003cem>map\u003c/em>: một CTE \u003ccode>map_out(key, rel, val)\u003c/code> = các tuple của bd_r thành (a, 'r', b) \u003cstrong>union all\u003c/strong> các tuple của bd_s thành (a, 's', c);\u003c/li>\u003cli>\u003cem>reduce\u003c/em>: với mỗi key, ghép mọi val của 'r' với mọi val của 's'.\u003c/li>\u003c/ol>\n\u003cp>Trả về \u003ccode>a\u003c/code>, \u003ccode>b\u003c/code>, \u003ccode>c\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.4.\u003c/strong> Give pseudocode that computes the join r ⋈\u003csub>r.A=s.A\u003c/sub> s in a single MapReduce step. Assume map() is called on every tuple of both r and s, and that map() can obtain the name of the relation of its input via context.relname().\u003c/p>","hint":"Self-join map_out m1, m2 trên key với m1.rel = 'r' và m2.rel = 's'.","solution":"with map_out (key, rel, val) as (\n  select a, 'r', b from bd_r\n  union all\n  select a, 's', c from bd_s)\nselect m1.key as a, m1.val as b, m2.val as c\nfrom map_out m1 join map_out m2\n  on m1.key = m2.key and m1.rel = 'r' and m2.rel = 's';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a","b","c"],"rows":[["20","r2","s1"],["20","r3","s1"],["30","r4","s3"],["30","r4","s2"]]}},{"id":"CH10.13","topic":"range partitioning","level":2,"prompt":"\u003cp>Mô phỏng \u003cstrong>sharding theo range\u003c/strong> bằng declarative partitioning. Tạo bảng \u003ccode>bd_bill_month(customer_id varchar(5), bill_date date, amount numeric(8,2))\u003c/code> \u003cstrong>partition by range (bill_date)\u003c/strong> với 4 partition theo tháng của năm 2018: \u003ccode>bd_bill_m1\u003c/code> (tháng 1), \u003ccode>bd_bill_m2\u003c/code>, \u003ccode>bd_bill_m3\u003c/code>, \u003ccode>bd_bill_m4\u003c/code>; rồi chép toàn bộ bd_bill vào. Hệ thống đếm số dòng trong từng partition.\u003c/p>","en":"","hint":"\u003ccode>create table bd_bill_m1 partition of bd_bill_month for values from ('2018-01-01') to ('2018-02-01');\u003c/code>","solution":"create table bd_bill_month (\n  customer_id varchar(5), bill_date date, amount numeric(8,2)\n) partition by range (bill_date);\ncreate table bd_bill_m1 partition of bd_bill_month for values from ('2018-01-01') to ('2018-02-01');\ncreate table bd_bill_m2 partition of bd_bill_month for values from ('2018-02-01') to ('2018-03-01');\ncreate table bd_bill_m3 partition of bd_bill_month for values from ('2018-03-01') to ('2018-04-01');\ncreate table bd_bill_m4 partition of bd_bill_month for values from ('2018-04-01') to ('2018-05-01');\ninsert into bd_bill_month select customer_id, bill_date, amount from bd_bill;","check":"select tableoid::regclass::text as partition, count(*) as num_rows\nfrom bd_bill_month group by 1 order by 1;","ordered":false,"fresh":false,"expected":{"fields":["partition","num_rows"],"rows":[["bd_bill_m1","2"],["bd_bill_m2","3"],["bd_bill_m3","3"],["bd_bill_m4","1"]]}},{"id":"CH10.14","topic":"hash partitioning","level":2,"prompt":"\u003cp>Mô phỏng \u003cstrong>sharding theo hash\u003c/strong> của customer_id: tạo \u003ccode>bd_bill_hash(customer_id varchar(5), bill_date date, amount numeric(8,2))\u003c/code> \u003cstrong>partition by hash (customer_id)\u003c/strong> với 3 partition \u003ccode>bd_bill_h0\u003c/code>, \u003ccode>bd_bill_h1\u003c/code>, \u003ccode>bd_bill_h2\u003c/code> (modulus 3, remainder 0/1/2), rồi chép bd_bill vào. Hệ thống kiểm tra: tổng số dòng, và mọi hoá đơn của một khách nằm trong \u003cstrong>cùng một\u003c/strong> partition.\u003c/p>","en":"","hint":"","solution":"create table bd_bill_hash (\n  customer_id varchar(5), bill_date date, amount numeric(8,2)\n) partition by hash (customer_id);\ncreate table bd_bill_h0 partition of bd_bill_hash for values with (modulus 3, remainder 0);\ncreate table bd_bill_h1 partition of bd_bill_hash for values with (modulus 3, remainder 1);\ncreate table bd_bill_h2 partition of bd_bill_hash for values with (modulus 3, remainder 2);\ninsert into bd_bill_hash select customer_id, bill_date, amount from bd_bill;","check":"select count(*) as total_rows,\n       (select count(*) from (select customer_id from bd_bill_hash\n                              group by customer_id having count(distinct tableoid) > 1) x) as split_customers,\n       count(distinct tableoid) \u003c= 3 as at_most_3_partitions\nfrom bd_bill_hash;","ordered":false,"fresh":false,"expected":{"fields":["total_rows","split_customers","at_most_3_partitions"],"rows":[["9","0","true"]]}},{"id":"CH10.15","topic":"PE 10.8 tumbling window","level":2,"prompt":"\u003cp>PE 10.8 trên \u003ccode>bd_order(order_id, itemid, datetime, amount)\u003c/code>: tổng \u003ccode>amount\u003c/code> của mỗi item trong mỗi \u003cstrong>tumbling window 1 giờ\u003c/strong>. Trả về \u003ccode>itemid\u003c/code>, \u003ccode>window_end\u003c/code> (timestamp — thời điểm \u003cstrong>kết thúc\u003c/strong> cửa sổ, ví dụ đơn lúc 09:20 thuộc cửa sổ kết thúc 10:00, đơn lúc đúng 10:00:00 thuộc cửa sổ kết thúc 11:00) và \u003ccode>total\u003c/code>. Không dùng date_trunc/date_bin: dùng số giây \u003ccode>extract(epoch from datetime)\u003c/code> và \u003ccode>floor\u003c/code> như đề.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.8.\u003c/strong> Consider this query that uses the tumbling-window operator:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select item, System.Timestamp as window_end, sum(amount)\nfrom order timestamp by datetime\ngroup by itemid, tumblingwindow(hour, 1)\u003c/code>\u003c/pre>\n\u003cp>Write an equivalent query with ordinary SQL constructs, without the tumbling-window operator. You may assume a function to_seconds(timestamp) that converts a timestamp to the integer number of seconds since midnight, January 1, 1970, the usual arithmetic functions, and floor(a), which returns the largest integer ≤ a.\u003c/p>","hint":"Group by \u003ccode>itemid, floor(extract(epoch from datetime) / 3600)\u003c/code>; \u003ccode>to_timestamp((floor(...) + 1) * 3600) at time zone 'UTC'\u003c/code> đổi về timestamp.","solution":"select itemid,\n       to_timestamp((floor(extract(epoch from datetime) / 3600) + 1) * 3600) at time zone 'UTC' as window_end,\n       sum(amount) as total\nfrom bd_order\ngroup by itemid, floor(extract(epoch from datetime) / 3600);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["itemid","window_end","total"],"rows":[["I3","2019-05-01 12:00:00","7"],["I3","2019-05-01 13:00:00","1"],["I2","2019-05-01 12:00:00","2"],["I1","2019-05-01 11:00:00","6"],["I1","2019-05-01 13:00:00","6"],["I1","2019-05-01 10:00:00","5"],["I2","2019-05-01 11:00:00","4"],["I2","2019-05-01 10:00:00","1"]]}},{"id":"CH10.16","topic":"stream: 30-min windows","level":2,"prompt":"\u003cp>Đếm số đơn hàng (mọi item) trong mỗi tumbling window \u003cstrong>30 phút\u003c/strong> tính từ \u003ccode>2019-05-01 00:00\u003c/code>. Trả về \u003ccode>window_start\u003c/code> (timestamp) và \u003ccode>num_orders\u003c/code>, chỉ các cửa sổ có đơn.\u003c/p>","en":"","hint":"\u003ccode>date_bin('30 minutes', datetime, timestamp '2019-05-01')\u003c/code>","solution":"select date_bin('30 minutes', datetime, timestamp '2019-05-01') as window_start,\n       count(*) as num_orders\nfrom bd_order\ngroup by 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["window_start","num_orders"],"rows":[["2019-05-01 11:00:00","2"],["2019-05-01 12:30:00","1"],["2019-05-01 10:00:00","1"],["2019-05-01 09:30:00","1"],["2019-05-01 10:30:00","2"],["2019-05-01 09:00:00","2"],["2019-05-01 12:00:00","1"]]}},{"id":"CH10.17","topic":"sliding window","level":3,"prompt":"\u003cp>\u003cstrong>Sliding window\u003c/strong> quanh mỗi sự kiện: với mỗi đơn trong bd_order, trả về \u003ccode>order_id\u003c/code>, \u003ccode>itemid\u003c/code> và \u003ccode>last_hour\u003c/code> = tổng amount của \u003cstrong>cùng item\u003c/strong> trong khoảng 1 giờ \u003cstrong>tính tới thời điểm đơn đó\u003c/strong> (gồm cả đơn đó, tức các đơn có datetime trong (datetime − 1 giờ, datetime]).\u003c/p>","en":"","hint":"Window function với frame theo thời gian: \u003ccode>sum(amount) over (partition by itemid order by datetime range between interval '1 hour' preceding and current row)\u003c/code> — lưu ý frame range lấy cả mốc đúng 1 giờ trước; dùng \u003ccode>interval '59 minutes 59 seconds'\u003c/code> hoặc subquery.","solution":"select o.order_id, o.itemid,\n       (select sum(p.amount) from bd_order p\n        where p.itemid = o.itemid\n          and p.datetime >  o.datetime - interval '1 hour'\n          and p.datetime \u003c= o.datetime) as last_hour\nfrom bd_order o;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["order_id","itemid","last_hour"],"rows":[["1","I1","3"],["2","I2","1"],["3","I1","5"],["4","I1","10"],["5","I2","4"],["6","I1","8"],["7","I3","7"],["8","I2","6"],["9","I1","6"],["10","I3","1"]]}},{"id":"CH10.18","topic":"PE 10.9 graph edges","level":2,"prompt":"\u003cp>Mô hình University thành đồ thị như PE 10.9. Tạo view \u003ccode>bd_univ_edge(src, label, dst)\u003c/code>: mỗi tuple \u003cstrong>takes\u003c/strong> thành cạnh (student ID, \u003ccode>'takes'\u003c/code>, section_key) và mỗi tuple \u003cstrong>teaches\u003c/strong> thành cạnh (instructor ID, \u003ccode>'teaches'\u003c/code>, section_key), với section_key = course_id-sec_id-semester-year nối bằng dấu \u003ccode>-\u003c/code> (ví dụ \u003ccode>CS-101-1-Fall-2017\u003c/code>). Hệ thống đếm số cạnh theo label và liệt kê các cạnh tới section \u003ccode>CS-190-2-Spring-2017\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 10.9.\u003c/strong> The university schema is to be modeled as a graph. For each relation below, explain whether it would become a node or an edge: (i) \u003cem>student\u003c/em>, (ii) \u003cem>instructor\u003c/em>, (iii) \u003cem>course\u003c/em>, (iv) \u003cem>section\u003c/em>, (v) \u003cem>takes\u003c/em>, (vi) \u003cem>teaches\u003c/em>. Does the model capture the connections between sections and courses?\u003c/p>","hint":"","solution":"create view bd_univ_edge (src, label, dst) as\nselect ID, 'takes', course_id || '-' || sec_id || '-' || semester || '-' || year from takes\nunion all\nselect ID, 'teaches', course_id || '-' || sec_id || '-' || semester || '-' || year from teaches;","check":"select label, count(*)::text as info from bd_univ_edge group by label\nunion all\nselect label, src from bd_univ_edge where dst = 'CS-190-2-Spring-2017'\norder by 1, 2;","ordered":false,"fresh":false,"expected":{"fields":["label","info"],"rows":[["takes","12345"],["takes","22"],["takes","54321"],["teaches","15"],["teaches","83821"]]}},{"id":"CH10.19","topic":"degree","level":1,"prompt":"\u003cp>Đồ thị trang web \u003ccode>bd_node(node, label)\u003c/code>, \u003ccode>bd_edge(src, dst)\u003c/code>. Với \u003cstrong>mọi\u003c/strong> node, trả về \u003ccode>node\u003c/code>, \u003ccode>out_degree\u003c/code> (số cạnh đi ra) và \u003ccode>in_degree\u003c/code> (số cạnh đi vào), 0 nếu không có.\u003c/p>","en":"","hint":"","solution":"select n.node,\n       (select count(*) from bd_edge e where e.src = n.node) as out_degree,\n       (select count(*) from bd_edge e where e.dst = n.node) as in_degree\nfrom bd_node n;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["node","out_degree","in_degree"],"rows":[["A","2","2"],["B","1","1"],["C","1","2"],["D","2","1"],["E","0","0"]]}},{"id":"CH10.20","topic":"reachability","level":3,"prompt":"\u003cp>Từ node \u003ccode>A\u003c/code>, tìm mọi node \u003cstrong>khác A\u003c/strong> đến được theo các cạnh của bd_edge cùng số bước ngắn nhất \u003ccode>hops\u003c/code>. Đồ thị có \u003cstrong>chu trình\u003c/strong> (A → B → C → A) nên phải giới hạn độ sâu (ví dụ tối đa 5 bước) hoặc chặn lặp.\u003c/p>","en":"","hint":"\u003ccode>with recursive r(node, hops)\u003c/code> bắt đầu từ các cạnh đi ra của A; điều kiện dừng \u003ccode>r.hops &lt; 5\u003c/code>; cuối cùng \u003ccode>min(hops)\u003c/code> theo node.","solution":"with recursive r (node, hops) as (\n  select dst, 1 from bd_edge where src = 'A'\n  union all\n  select e.dst, r.hops + 1\n  from r join bd_edge e on e.src = r.node\n  where r.hops \u003c 5)\nselect node, min(hops) as hops\nfrom r\nwhere node \u003c> 'A'\ngroup by node;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["node","hops"],"rows":[["B","1"],["C","2"],["D","1"]]}},{"id":"CH10.21","topic":"PageRank iteration","level":3,"prompt":"\u003cp>Một vòng lặp \u003cstrong>PageRank\u003c/strong> trên bd_node/bd_edge, bắt đầu từ rank đều 1/N (N = số node, kể cả node không có cạnh). Với d = 0.85:\u003c/p>\n\u003cp>rank(v) = (1 − d)/N + d · Σ\u003csub>u→v\u003c/sub> rank(u)/outdeg(u)\u003c/p>\n\u003cp>Trả về \u003ccode>node\u003c/code> và \u003ccode>rank\u003c/code> làm tròn 4 chữ số cho \u003cstrong>mọi\u003c/strong> node.\u003c/p>","en":"","hint":"outdeg bằng một CTE \u003ccode>group by src\u003c/code>; node không có cạnh vào có tổng = 0 (coalesce).","solution":"with n as (select count(*)::numeric as n from bd_node),\nod as (select src, count(*) as k from bd_edge group by src)\nselect v.node,\n       round((1 - 0.85) / n.n + 0.85 * coalesce(sum((1 / n.n) / od.k), 0), 4) as rank\nfrom bd_node v\ncross join n\nleft join bd_edge e on e.dst = v.node\nleft join od on od.src = e.src\ngroup by v.node, n.n;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["node","rank"],"rows":[["E","0.03"],["A","0.285"],["B","0.115"],["C","0.285"],["D","0.115"]]}}]},{"key":"ch11","store":"11","short":"11","label":"Chương 11","navLabel":"Chương 11","kind":"Chương","title":"Data Analytics","titleVi":"Phân tích dữ liệu (Data Warehouse, OLAP, Data Mining)","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 11 không nằm trong lịch thi CS4420, nhưng các phép OLAP (\u003ccode>cube\u003c/code>, \u003ccode>rollup\u003c/code>, window function) đã xuất hiện ở Chương 5 nên rất hợp để ôn lại SQL nâng cao. Slide: \u003cem>Chapter 11 — Data Analytics\u003c/em> (db-book.com). Dữ liệu lab: star schema \u003ccode>olap_*\u003c/code> theo Figure 11.2.\u003c/p>\n\u003ch3>1. Data analytics là gì (slide 11.2–11.4)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>OLTP\u003c/strong> (online transaction processing): nhiều giao dịch nhỏ, cập nhật thường xuyên, truy cập ít dòng — database nghiệp vụ.\u003c/li>\u003cli>\u003cstrong>Data analytics\u003c/strong>: xử lý dữ liệu để suy ra \u003cstrong>mẫu, xu hướng, quyết định\u003c/strong>: báo cáo tổng hợp, OLAP, thống kê, machine learning / data mining.\u003c/li>\u003cli>Quy trình: thu thập dữ liệu từ nhiều nguồn → \u003cstrong>data warehouse\u003c/strong> → phân tích (OLAP, mining) → hỗ trợ quyết định (\u003cem>business intelligence\u003c/em>, \u003cem>decision support\u003c/em>).\u003c/li>\u003c/ul>\n\u003ch3>2. Data warehouse (slide 11.5–11.15)\u003c/h3>\n\u003cp>Kho lưu trữ dữ liệu \u003cstrong>lịch sử, đã tích hợp\u003c/strong> từ nhiều nguồn, dưới một lược đồ thống nhất, đặt ở một nơi để phân tích không ảnh hưởng tới hệ OLTP.\u003c/p>\n\u003cp>Các vấn đề thiết kế:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Khi nào và cách nào thu thập dữ liệu\u003c/strong>:\u003c/li>\u003cli>\u003cstrong>Source-driven\u003c/strong>: nguồn tự đẩy dữ liệu (liên tục hoặc định kỳ) sang warehouse.\u003c/li>\u003cli>\u003cstrong>Destination-driven\u003c/strong>: warehouse định kỳ gửi yêu cầu lấy dữ liệu mới từ nguồn.\u003c/li>\u003cli>So sánh ở PE 11.1.\u003c/li>\u003cli>\u003cstrong>Schema nào\u003c/strong>: các nguồn có lược đồ khác nhau → phải \u003cstrong>schema integration\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Data cleansing\u003c/strong>: sửa lỗi nhập liệu, địa chỉ sai chính tả, gộp các bản ghi trùng (\u003cem>merge–purge\u003c/em>, \u003cem>householding\u003c/em>).\u003c/li>\u003cli>\u003cstrong>Cập nhật\u003c/strong> sự thay đổi từ nguồn: giống bài toán bảo trì materialized view.\u003c/li>\u003cli>\u003cstrong>Tóm tắt\u003c/strong>: có thể chỉ lưu dữ liệu tổng hợp thay vì chi tiết.\u003c/li>\u003cli>Quy trình \u003cstrong>ETL\u003c/strong>: Extract – Transform – Load (hoặc ELT: nạp trước rồi biến đổi trong warehouse).\u003c/li>\u003cli>\u003cstrong>Data lake\u003c/strong>: lưu dữ liệu thô nhiều dạng, chưa tích hợp — rẻ và linh hoạt hơn nhưng truy vấn phức tạp hơn.\u003c/li>\u003c/ul>\n\u003ch3>3. Multidimensional data và star schema (slide 11.9–11.12)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Measure attribute\u003c/strong>: giá trị đo được, có thể aggregate (number, price).\u003c/li>\u003cli>\u003cstrong>Dimension attribute\u003c/strong>: chiều để nhóm và xem measure (item, store, date, customer).\u003c/li>\u003cli>\u003cstrong>Fact table\u003c/strong>: bảng lớn chứa measure và khoá ngoại tới các \u003cstrong>dimension table\u003c/strong> (thường nhỏ).\u003c/li>\u003cli>\u003cstrong>Star schema\u003c/strong>: một fact table + các dimension table nối trực tiếp (Figure 11.2: sales + item_info, store, customer, date_info).\u003c/li>\u003cli>\u003cstrong>Snowflake schema\u003c/strong>: dimension table được chuẩn hoá tiếp thành nhiều bảng (ví dụ store → city → state).\u003c/li>\u003cli>Dimension thường có \u003cstrong>hierarchy\u003c/strong>: date → month → quarter → year; store → city → state → country.\u003c/li>\u003c/ul>\n\u003ch3>4. Lưu trữ cho warehouse — column-oriented storage (slide 11.13–11.15)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Row store\u003c/strong>: mỗi tuple lưu liền nhau — tốt cho OLTP (đọc/ghi cả dòng).\u003c/li>\u003cli>\u003cstrong>Column store\u003c/strong>: mỗi \u003cstrong>cột\u003c/strong> lưu thành một file/mảng riêng; tuple thứ i = phần tử thứ i của mỗi cột (PE 11.2).\u003c/li>\u003cli>Ưu: truy vấn phân tích chỉ đọc vài cột → giảm I/O; dữ liệu cùng kiểu nên \u003cstrong>nén\u003c/strong> tốt; tận dụng CPU cache, xử lý vector.\u003c/li>\u003cli>Nhược: lấy/sửa một tuple đầy đủ phải đọc nhiều chỗ; insert/update đắt.\u003c/li>\u003cli>Ví dụ: Vertica, Amazon Redshift, Google BigQuery, Parquet/ORC (định dạng file).\u003c/li>\u003c/ul>\n\u003ch3>5. OLAP (slide 11.16–11.35)\u003c/h3>\n\u003cp>\u003cstrong>Online analytical processing\u003c/strong>: phân tích tương tác dữ liệu đa chiều.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Cross-tabulation (pivot table)\u003c/strong>: giá trị của một chiều làm tiêu đề cột, chiều kia làm tiêu đề dòng, ô là aggregate; thêm dòng/cột \u003cstrong>all\u003c/strong> cho tổng.\u003c/li>\u003cli>\u003cstrong>Data cube\u003c/strong>: tổng quát của cross-tab cho n chiều — mọi tổ hợp nhóm theo tập con của các chiều (2\u003csup>n\u003c/sup> group by).\u003c/li>\u003cli>Thao tác:\u003c/li>\u003cli>\u003cstrong>Pivoting\u003c/strong>: đổi chiều nào làm dòng/cột.\u003c/li>\u003cli>\u003cstrong>Slicing\u003c/strong>: cố định một chiều ở một giá trị (ví dụ chỉ năm 2018). \u003cstrong>Dicing\u003c/strong>: cố định nhiều chiều / một khoảng giá trị.\u003c/li>\u003cli>\u003cstrong>Rollup\u003c/strong>: đi lên mức thô hơn của hierarchy (ngày → tháng → năm). \u003cstrong>Drill down\u003c/strong>: ngược lại, xuống mức chi tiết.\u003c/li>\u003cli>Hiện thực: \u003cstrong>MOLAP\u003c/strong> (mảng đa chiều trong bộ nhớ), \u003cstrong>ROLAP\u003c/strong> (trên database quan hệ), \u003cstrong>HOLAP\u003c/strong> (lai).\u003c/li>\u003c/ul>\n\u003cp>OLAP trong SQL:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- mọi tập con của {item_name, color, clothes_size}: 8 nhóm\nselect item_name, color, clothes_size, sum(quantity)\nfrom sales group by cube (item_name, color, clothes_size);\n\n-- chỉ các tiền tố: (a, b, c), (a, b), (a), ()\ngroup by rollup (a, b, c)\n\n-- hierarchy trên hai chiều độc lập (PE 11.4): tích của hai rollup\ngroup by rollup (country, state, city, store_id), rollup (year, quarter, month, date)\n\n-- tuỳ chọn tập nhóm\ngroup by grouping sets ((color, clothes_size), (clothes_size, item_name))\u003c/code>\u003c/pre>\n\u003cul>\u003cli>Dòng tổng hợp có \u003cstrong>null\u003c/strong> ở cột không tham gia nhóm. Hàm \u003ccode>grouping(col)\u003c/code> trả 1 khi null đó là \"all\" (không phải null thật trong dữ liệu) → \u003ccode>case when grouping(item_name) = 1 then 'all' else item_name end\u003c/code>.\u003c/li>\u003cli>Pivot thủ công: \u003ccode>count(*) filter (where year = 2017)\u003c/code> hoặc \u003ccode>sum(case when ... then ... end)\u003c/code>; SQL Server/Oracle có \u003ccode>pivot\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Window function (Chương 5, rất hay dùng trong phân tích):\u003c/p>\n\u003cul>\u003cli>\u003ccode>rank()\u003c/code>, \u003ccode>dense_rank()\u003c/code>, \u003ccode>row_number()\u003c/code>, \u003ccode>ntile(n)\u003c/code>, \u003ccode>percent_rank()\u003c/code>.\u003c/li>\u003cli>Tổng luỹ kế: \u003ccode>sum(x) over (order by date)\u003c/code>; trung bình trượt: \u003ccode>avg(x) over (order by date rows between 1 preceding and current row)\u003c/code>; theo nhóm: \u003ccode>partition by\u003c/code>.\u003c/li>\u003cli>Tỉ lệ trong nhóm: \u003ccode>x / sum(x) over (partition by category)\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>6. Data mining (slide 11.36–11.55)\u003c/h3>\n\u003cp>Tìm mẫu hữu ích từ dữ liệu lớn một cách (bán) tự động.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Prediction / classification\u003c/strong>: dự đoán lớp của một đối tượng từ các thuộc tính, học từ \u003cstrong>training set\u003c/strong> có nhãn.\u003c/li>\u003cli>\u003cstrong>Decision tree\u003c/strong>: mỗi node trong là một điều kiện trên thuộc tính, mỗi lá là một lớp (có thể kèm confidence) — PE 11.5. Chọn thuộc tính tách bằng độ đo \u003cem>purity\u003c/em> (Gini, entropy / information gain).\u003c/li>\u003cli>\u003cstrong>Bayesian classifier\u003c/strong> (naive Bayes: giả định các thuộc tính độc lập), \u003cstrong>SVM\u003c/strong>, \u003cstrong>neural network / deep learning\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Regression\u003c/strong>: dự đoán giá trị số (linear regression).\u003c/li>\u003cli>Đánh giá: \u003cstrong>accuracy\u003c/strong> = (tp + tn)/tổng; \u003cstrong>recall / sensitivity\u003c/strong> = tp/pos; \u003cstrong>precision\u003c/strong> = tp/(tp + fp); \u003cstrong>specificity\u003c/strong> = tn/neg (PE 11.6). Với lớp mất cân bằng (bệnh hiếm), accuracy cao có thể vô nghĩa — classifier luôn đoán \"âm tính\" vẫn đạt 95%.\u003c/li>\u003cli>Tránh \u003cstrong>overfitting\u003c/strong>: đánh giá trên tập test tách riêng, \u003cstrong>cross-validation\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Association rules\u003c/strong>: luật dạng \u003cem>bread ⇒ milk\u003c/em> trên dữ liệu giỏ hàng.\u003c/li>\u003cli>\u003cstrong>Support\u003c/strong> của tập I = tỉ lệ giao dịch chứa mọi phần tử của I.\u003c/li>\u003cli>\u003cstrong>Confidence\u003c/strong> của A ⇒ B = support(A ∪ B) / support(A) = P(B | A).\u003c/li>\u003cli>Tìm \u003cem>large itemsets\u003c/em> (support ≥ ngưỡng) bằng thuật toán \u003cstrong>a priori\u003c/strong>: một tập chỉ có thể large nếu mọi tập con của nó large.\u003c/li>\u003cli>\u003cstrong>Clustering\u003c/strong>: nhóm các điểm gần nhau (k-means, hierarchical clustering) — không cần nhãn.\u003c/li>\u003cli>Khác: text mining, sentiment analysis, phát hiện bất thường, \u003cstrong>collaborative filtering\u003c/strong> cho recommendation.\u003c/li>\u003c/ul>\n\u003ch3>7. Ghi nhớ nhanh\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câu hỏi\u003c/th>\u003cth>Trả lời ngắn\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fact vs dimension?\u003c/td>\u003ctd>Fact: measure + FK, rất lớn. Dimension: mô tả chiều, nhỏ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cube(a, b) sinh mấy nhóm?\u003c/td>\u003ctd>4: (a, b), (a), (b), ()\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rollup(a, b, c)?\u003c/td>\u003ctd>(a, b, c), (a, b), (a), ()\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Phân biệt null \"all\" với null thật?\u003c/td>\u003ctd>\u003ccode>grouping(col)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Column store tốt khi nào?\u003c/td>\u003ctd>Truy vấn aggregate đọc ít cột trên nhiều dòng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confidence của A ⇒ B?\u003c/td>\u003ctd>support(A ∪ B) / support(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Classifier luôn đoán âm tính?\u003c/td>\u003ctd>Accuracy cao nhưng recall = 0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Trong star schema của Figure 11.2, bảng nào là fact table?","options":["item_info","store","sales","date_info"],"answer":2,"explain":"sales chứa measure (number, price) và khoá ngoại tới các dimension."},{"q":"\u003ccode>group by cube (a, b, c)\u003c/code> tạo ra bao nhiêu nhóm (grouping)?","options":["3","4","6","8"],"answer":3,"explain":"Mọi tập con của {a, b, c}: 2³ = 8."},{"q":"\u003ccode>group by rollup (country, state, city)\u003c/code> KHÔNG chứa nhóm nào?","options":["(country, state, city)","(country, state)","(state)","()"],"answer":2,"explain":"rollup chỉ sinh các tiền tố: (country, state, city), (country, state), (country), ()."},{"q":"Hàm \u003ccode>grouping(color)\u003c/code> trả về 1 khi nào?","options":["color là null trong dữ liệu","Dòng là dòng tổng hợp trên mọi giá trị color","color có giá trị lớn nhất","Không bao giờ"],"answer":1,"explain":"Phân biệt null \"all\" của cube/rollup với null thật."},{"q":"Đi từ doanh số theo ngày lên doanh số theo quý là thao tác OLAP nào?","options":["Drill down","Rollup","Slicing","Pivoting"],"answer":1,"explain":"Rollup = lên mức thô hơn của hierarchy."},{"q":"Vì sao column store hợp với truy vấn phân tích?","options":["Insert một tuple nhanh hơn","Chỉ đọc các cột cần dùng và nén tốt","Không cần index","Hỗ trợ transaction tốt hơn"],"answer":1,"explain":"Truy vấn aggregate thường chỉ đụng vài cột trên rất nhiều dòng."},{"q":"Kiến trúc thu thập dữ liệu nào cho phép đẩy dữ liệu mới sang warehouse ngay khi có?","options":["Destination-driven","Source-driven","Snowflake","MOLAP"],"answer":1,"explain":"Source-driven: nguồn chủ động gửi (PE 11.1)."},{"q":"Có 5 giao dịch; {diaper, beer} xuất hiện ở 3, {diaper} ở 4. Confidence của diaper ⇒ beer?","options":["0.6","0.75","0.8","1.0"],"answer":1,"explain":"support(diaper, beer)/support(diaper) = (3/5)/(4/5) = 0.75."},{"q":"Bệnh có ở 5% người được test. Classifier luôn đoán \"không bệnh\" có accuracy và recall bao nhiêu?","options":["95% và 0","5% và 100%","50% và 50%","95% và 95%"],"answer":0,"explain":"Đúng với 95% người không bệnh, nhưng không phát hiện được ai có bệnh (PE 11.6)."},{"q":"Muốn sàng lọc để xét nghiệm thêm (bỏ sót người bệnh là tệ nhất), nên ưu tiên chỉ số nào?","options":["Precision","Recall","Specificity","Accuracy"],"answer":1,"explain":"Recall cao = ít bỏ sót người thật sự có bệnh."},{"q":"Thuật toán a priori dựa trên tính chất nào?","options":["Mọi tập con của một large itemset đều large","Mọi tập cha của một large itemset đều large","Support tăng khi thêm phần tử","Confidence luôn bằng support"],"answer":0,"explain":"Nên chỉ cần mở rộng các tập đã large ở bước trước."}],"questions":[{"q":"\u003cstrong>PE 11.1.\u003c/strong> So với kiến trúc destination-driven, kiến trúc source-driven để thu thập dữ liệu vào data warehouse có ưu, nhược điểm gì?","en":"\u003cp>\u003cstrong>Exercise 11.1.\u003c/strong> Compared with a destination-driven architecture, what are the benefits and drawbacks of a source-driven architecture for gathering data into a data warehouse?\u003c/p>","answer":"\u003cp>Source-driven: \u003cstrong>nguồn\u003c/strong> chủ động gửi dữ liệu; destination-driven: \u003cstrong>warehouse\u003c/strong> định kỳ hỏi nguồn.\u003c/p>\n\u003cp>Ưu điểm của source-driven:\u003c/p>\n\u003cul>\u003cli>Dữ liệu được chuyển \u003cstrong>ngay khi có\u003c/strong>; destination-driven muốn vậy phải hỏi nguồn rất thường xuyên → overhead lớn.\u003c/li>\u003cli>Nguồn \u003cstrong>không cần giữ lịch sử\u003c/strong> thay đổi: cập nhật xong gửi đi là xong. Với destination-driven, nguồn phải lưu mọi thay đổi chưa được warehouse lấy → tốn bộ nhớ ở nguồn.\u003c/li>\u003c/ul>\n\u003cp>Nhược điểm (= ưu điểm của destination-driven):\u003c/p>\n\u003cul>\u003cli>Nguồn phải \u003cstrong>chủ động\u003c/strong> và tự xử lý lỗi (ví dụ không liên lạc được warehouse một thời gian). Destination-driven chỉ cần nguồn trả lời truy vấn — nguồn thụ động, đơn giản; chỉ warehouse chủ động.\u003c/li>\u003cli>Warehouse \u003cstrong>khó kiểm soát\u003c/strong> thời điểm nạp dữ liệu; destination-driven cho phép warehouse chọn lúc nạp dữ liệu và lúc phục vụ truy vấn, tránh làm cùng lúc (xung đột lock).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 11.2.\u003c/strong> Vẽ cách relation classroom (building, room_number, capacity) được lưu theo column-oriented storage.","en":"\u003cp>\u003cstrong>Exercise 11.2.\u003c/strong> Draw a diagram showing how the \u003cem>classroom\u003c/em> relation of the university example (Appendix A) would be stored using a column-oriented storage structure.\u003c/p>","answer":"\u003cp>Mỗi thuộc tính một file (mảng); tuple thứ i gồm phần tử thứ i của mỗi file. Nếu mỗi giá trị có kích thước cố định thì số thứ tự dòng suy ra từ vị trí; nếu không phải lưu kèm row number.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>building\u003c/th>\u003cth>\u003c/th>\u003cth>#\u003c/th>\u003cth>room_number\u003c/th>\u003cth>\u003c/th>\u003cth>#\u003c/th>\u003cth>capacity\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Packard\u003c/td>\u003ctd>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>101\u003c/td>\u003ctd>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Painter\u003c/td>\u003ctd>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>514\u003c/td>\u003ctd>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Taylor\u003c/td>\u003ctd>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>3128\u003c/td>\u003ctd>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Watson\u003c/td>\u003ctd>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>100\u003c/td>\u003ctd>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Watson\u003c/td>\u003ctd>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>120\u003c/td>\u003ctd>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Truy vấn \u003ccode>select avg(capacity) from classroom\u003c/code> chỉ đọc file capacity. Cột building có giá trị lặp (Watson, Watson) → nén được (run-length encoding). Bài CH11.18 mô phỏng cách lưu này.\u003c/p>"},{"q":"\u003cstrong>PE 11.3.\u003c/strong> Viết SQL tính cross-tab trên takes: cột 2017, 2018 và all; mỗi course một dòng và một dòng all; ô = số sinh viên học course đó trong năm đó.","en":"\u003cp>\u003cstrong>Exercise 11.3.\u003c/strong> For the \u003cem>takes\u003c/em> relation, write an SQL query computing a cross-tab with one column for each of the years 2017 and 2018 plus a column “all”, and one row for each course plus a row “all”. Each cell holds the number of students who took that course in that year; the “all” column aggregates over all years and the “all” row aggregates over all courses.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select coalesce(course_id, 'all') as course_id,\n       count(distinct ID) filter (where year = 2017) as y2017,\n       count(distinct ID) filter (where year = 2018) as y2018,\n       count(distinct ID) as \"all\"\nfrom takes\ngroup by rollup (course_id);\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>rollup (course_id)\u003c/code> thêm dòng tổng (course_id = null → hiển thị 'all'); an toàn vì course_id của takes không bao giờ null (dùng \u003ccode>grouping(course_id)\u003c/code> cho chắc).\u003c/li>\u003cli>Cột năm dùng \u003ccode>filter\u003c/code> (hoặc \u003ccode>sum(case when year = 2017 then 1 else 0 end)\u003c/code>).\u003c/li>\u003cli>\u003ccode>count(distinct ID)\u003c/code>: một sinh viên học lại cùng course (45678 học CS-101 năm 2017 và 2018) chỉ tính một lần ở cột all; ô all–all là số sinh viên khác nhau đã học bất kỳ môn nào. Nếu đếm số lần đăng ký thì dùng count(*). Bài CH11.01.\u003c/li>\u003c/ul>\n\u003cp>Cách khác: \u003ccode>group by cube (course_id, year)\u003c/code> rồi pivot; với SQL Server/Oracle có \u003ccode>pivot\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 11.4.\u003c/strong> Với lược đồ Figure 11.2, viết SQL tóm tắt number và price theo store và date, kèm hierarchy trên store và date.","en":"\u003cp>\u003cstrong>Exercise 11.4.\u003c/strong> For the data-warehouse schema of Figure 11.2, write an SQL query that summarizes sales numbers and price by store and by date, together with the hierarchies on store and on date.\u003c/p>\n\u003cp>\u003cem>Figure 11.2 — Star schema for a data warehouse:\u003c/em>\u003c/p>\n\u003cul>\u003cli>fact table sales (item_id, store_id, customer_id, date, number, price)\u003c/li>\u003cli>item_info (item_id, itemname, color, size, category)\u003c/li>\u003cli>store (store_id, city, state, country)\u003c/li>\u003cli>customer (customer_id, name, street, city, state, zipcode, country)\u003c/li>\u003cli>date_info (date, month, quarter, year)\u003c/li>\u003c/ul>","answer":"\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select st.store_id, st.city, st.state, st.country,\n       d.date, d.month, d.quarter, d.year,\n       sum(s.number), sum(s.price)\nfrom sales s\njoin store st on s.store_id = st.store_id\njoin date_info d on s.date = d.date\ngroup by rollup (st.country, st.state, st.city, st.store_id),\n         rollup (d.year, d.quarter, d.month, d.date);\u003c/code>\u003c/pre>\n\u003cp>Mỗi \u003ccode>rollup\u003c/code> liệt kê hierarchy từ thô tới chi tiết; hai rollup đặt cạnh nhau sinh \u003cstrong>tích\u003c/strong> các mức (5 × 5 = 25 tổ hợp nhóm), tức tổng theo mọi cặp (mức store, mức date) — từ (store, ngày) tới (toàn quốc, toàn thời gian). Bài CH11.02.\u003c/p>"},{"q":"\u003cstrong>PE 11.5.\u003c/strong> Vẽ decision tree tương ứng ba luật xếp hạng tín dụng (salary 30k–50k & graduate → good 80%; salary 30k–50k & high-school → satisfactory 80%; salary > 50k → excellent 90%), và mở rộng để ghi confidence.","en":"\u003cp>\u003cstrong>Exercise 11.5.\u003c/strong> Classification can use classification rules, each with a condition, a class, and a confidence — the percentage of inputs satisfying the condition that belong to that class.\u003c/p>\n\u003cp>For example, one credit-rating rule could have the condition “salary between $30,000 and $50,000 and education level graduate”, class \u003cem>good\u003c/em>, and confidence 80%. A second rule could have the condition “salary between $30,000 and $50,000 and education level high-school”, class \u003cem>satisfactory\u003c/em>, confidence 80%. A third rule could have the condition “salary above $50,001”, class \u003cem>excellent\u003c/em>, confidence 90%. Show a decision-tree classifier corresponding to these rules.\u003c/p>\n\u003cp>Show how the decision-tree classifier can be extended to record the confidence values.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>                 salary?\n        /           |              \\\n  &lt; 30,000    30,000–50,000      &gt; 50,000\n  (không có         |           excellent (90%)\n    luật)      education?\n               /         \\\n         graduate     high-school\n        good (80%)   satisfactory (80%)\u003c/code>\u003c/pre>\n\u003cul>\u003cli>Node gốc tách theo salary; nhánh 30k–50k tách tiếp theo education; các lá là lớp.\u003c/li>\u003cli>Ghi confidence: mỗi \u003cstrong>lá\u003c/strong> lưu thêm confidence của lớp (80%, 80%, 90%) — hoặc tổng quát hơn, lưu \u003cstrong>phân bố\u003c/strong> các lớp ở lá (ví dụ good 80%, satisfactory 15%, poor 5%), từ đó lớp dự đoán là lớp có tỉ lệ cao nhất và confidence là tỉ lệ đó.\u003c/li>\u003cli>Nhánh salary \u003c 30,000 (và nhánh education khác) không có luật → lá \"unknown\" hoặc lớp mặc định.\u003c/li>\u003c/ul>\n\u003cp>Bài CH11.15 hiện thực cây bằng \u003ccode>case\u003c/code>, CH11.16 đo confidence thực tế của từng luật trên dữ liệu.\u003c/p>"},{"q":"\u003cstrong>PE 11.6.\u003c/strong> Tính accuracy, recall, precision, specificity cho C1 (luôn âm tính), C2 (80% / 5%), C3 (95% / 20%); chọn classifier cho (b) sàng lọc tiếp, (c) bắt đầu dùng thuốc có hại nếu không bệnh.","en":"\u003cp>\u003cstrong>Exercise 11.6.\u003c/strong> A classifier predicts whether a person has a particular disease. 95% of the people tested do not have it. Let \u003cem>pos\u003c/em> be the fraction of actual positives (5% of the test cases) and \u003cem>neg\u003c/em> the fraction of actual negatives (95% of the test cases). Consider these classifiers:\u003c/p>\n\u003cul>\u003cli>C\u003csub>1\u003c/sub> always predicts negative (a rather useless classifier).\u003c/li>\u003cli>C\u003csub>2\u003c/sub> predicts positive for 80% of the people who actually have the disease, but also for 5% of the people who do not.\u003c/li>\u003cli>C\u003csub>3\u003c/sub> predicts positive for 95% of the people who actually have the disease, but also for 20% of the people who do not.\u003c/li>\u003c/ul>\n\u003cp>For each classifier, \u003cem>t_pos\u003c/em> is the true-positive fraction (prediction positive and the person has the disease) and \u003cem>f_pos\u003c/em> the false-positive fraction (prediction positive but the person does not have the disease); \u003cem>t_neg\u003c/em> and \u003cem>f_neg\u003c/em> are the true-negative and false-negative fractions, defined in the same way for negative predictions.\u003c/p>\n\u003cp>a. Compute these metrics for each classifier:\u003c/p>\n\u003cul>\u003cli>Accuracy = (t_pos + t_neg)/(pos + neg): the fraction of cases the classifier classifies correctly.\u003c/li>\u003cli>Recall (sensitivity) = t_pos/pos: how many of the actual positives are classified positive.\u003c/li>\u003cli>Precision = t_pos/(t_pos + f_pos): how often a positive prediction is right.\u003c/li>\u003cli>Specificity = t_neg/neg.\u003c/li>\u003c/ul>\n\u003cp>b. If the classification results will be used to select people for further screening for the disease, how would you choose among the classifiers?\u003c/p>\n\u003cp>c. If instead the results will be used to start medication, and the medication could be harmful to someone without the disease, how would you choose among the classifiers?\u003c/p>","answer":"\u003cp>pos = 0.05, neg = 0.95.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>t_pos\u003c/th>\u003cth>f_pos\u003c/th>\u003cth>t_neg\u003c/th>\u003cth>f_neg\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0.95\u003c/td>\u003ctd>0.05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C2\u003c/td>\u003ctd>0.8 × 0.05 = 0.04\u003c/td>\u003ctd>0.05 × 0.95 = 0.0475\u003c/td>\u003ctd>0.9025\u003c/td>\u003ctd>0.01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C3\u003c/td>\u003ctd>0.95 × 0.05 = 0.0475\u003c/td>\u003ctd>0.2 × 0.95 = 0.19\u003c/td>\u003ctd>0.76\u003c/td>\u003ctd>0.0025\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>a.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Accuracy\u003c/th>\u003cth>Recall\u003c/th>\u003cth>Precision\u003c/th>\u003cth>Specificity\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>0.95\u003c/td>\u003ctd>0\u003c/td>\u003ctd>không xác định (0/0)\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C2\u003c/td>\u003ctd>0.9425\u003c/td>\u003ctd>0.80\u003c/td>\u003ctd>0.04/0.0875 ≈ 0.457\u003c/td>\u003ctd>0.95\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C3\u003c/td>\u003ctd>0.8075\u003c/td>\u003ctd>0.95\u003c/td>\u003ctd>0.0475/0.2375 = 0.20\u003c/td>\u003ctd>0.80\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C1 có accuracy cao nhất nhưng vô dụng: accuracy gây hiểu lầm khi lớp mất cân bằng.\u003c/p>\n\u003cp>b. Sàng lọc để xét nghiệm thêm: bỏ sót người bệnh là tệ nhất, dương tính giả chỉ tốn thêm một lần xét nghiệm → chọn \u003cstrong>recall cao nhất: C3\u003c/strong>.\u003c/p>\n\u003cp>c. Dùng thuốc có hại cho người không bệnh: dương tính giả là tệ nhất → cần \u003cstrong>precision (và specificity) cao: C2\u003c/strong> (dương tính đúng ≈ 46% so với 20% của C3). Thực tế nên kết hợp: C3 để sàng lọc, rồi một xét nghiệm chính xác hơn trước khi điều trị.\u003c/p>\n\u003cp>Bài CH11.17 tính các chỉ số này trên tập 2000 ca \u003ccode>olap_test\u003c/code>.\u003c/p>"}],"exercises":[{"id":"CH11.01","topic":"PE 11.3 cross-tab","level":2,"prompt":"\u003cp>PE 11.3 trên \u003cstrong>takes\u003c/strong>: một dòng cho mỗi course_id và một dòng \u003ccode>all\u003c/code>; các cột \u003ccode>course_id\u003c/code>, \u003ccode>y2017\u003c/code>, \u003ccode>y2018\u003c/code>, \u003ccode>all\u003c/code>. Mỗi ô là \u003cstrong>số sinh viên khác nhau\u003c/strong> (count distinct ID) học course đó trong năm đó; cột \u003ccode>all\u003c/code> gộp mọi năm, dòng \u003ccode>all\u003c/code> gộp mọi course. Ô không có ai là 0.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 11.3.\u003c/strong> For the \u003cem>takes\u003c/em> relation, write an SQL query computing a cross-tab with one column for each of the years 2017 and 2018 plus a column “all”, and one row for each course plus a row “all”. Each cell holds the number of students who took that course in that year; the “all” column aggregates over all years and the “all” row aggregates over all courses.\u003c/p>","hint":"\u003ccode>count(distinct ID) filter (where year = 2017)\u003c/code>; \u003ccode>group by rollup (course_id)\u003c/code>; \u003ccode>coalesce(course_id, 'all')\u003c/code>.","solution":"select coalesce(course_id, 'all') as course_id,\n       count(distinct ID) filter (where year = 2017) as y2017,\n       count(distinct ID) filter (where year = 2018) as y2018,\n       count(distinct ID) as \"all\"\nfrom takes\ngroup by rollup (course_id);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["course_id","y2017","y2018","all"],"rows":[["BIO-101","1","0","1"],["BIO-301","0","1","1"],["CS-101","6","1","6"],["CS-190","2","0","2"],["CS-315","0","2","2"],["CS-319","0","2","2"],["CS-347","2","0","2"],["EE-181","1","0","1"],["FIN-201","0","1","1"],["HIS-351","0","1","1"],["MU-199","0","1","1"],["PHY-101","1","0","1"],["all","9","8","12"]]}},{"id":"CH11.02","topic":"PE 11.4 rollup hierarchies","level":3,"prompt":"\u003cp>PE 11.4 trên star schema lab: fact \u003ccode>olap_sales(sale_id, item_id, store_id, customer_id, date, number, price)\u003c/code>, dimension \u003ccode>olap_store(store_id, city, state, country)\u003c/code> và \u003ccode>olap_date_info(date, month, quarter, year)\u003c/code>. Tóm tắt \u003ccode>sum(number)\u003c/code> và \u003ccode>sum(price)\u003c/code> theo store và date \u003cstrong>kèm hierarchy\u003c/strong> store → city → state → country và date → month → quarter → year. Trả về các cột theo thứ tự: country, state, city, store_id, year, quarter, month, date, total_number, total_price.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 11.4.\u003c/strong> For the data-warehouse schema of Figure 11.2, write an SQL query that summarizes sales numbers and price by store and by date, together with the hierarchies on store and on date.\u003c/p>\n\u003cp>\u003cem>Figure 11.2 — Star schema for a data warehouse:\u003c/em>\u003c/p>\n\u003cul>\u003cli>fact table sales (item_id, store_id, customer_id, date, number, price)\u003c/li>\u003cli>item_info (item_id, itemname, color, size, category)\u003c/li>\u003cli>store (store_id, city, state, country)\u003c/li>\u003cli>customer (customer_id, name, street, city, state, zipcode, country)\u003c/li>\u003cli>date_info (date, month, quarter, year)\u003c/li>\u003c/ul>","hint":"Hai rollup trong cùng group by: \u003ccode>rollup (country, state, city, store_id), rollup (year, quarter, month, date)\u003c/code>.","solution":"select st.country, st.state, st.city, s.store_id,\n       d.year, d.quarter, d.month, d.date,\n       sum(s.number) as total_number, sum(s.price) as total_price\nfrom olap_sales s\njoin olap_store st on st.store_id = s.store_id\njoin olap_date_info d on d.date = s.date\ngroup by rollup (st.country, st.state, st.city, s.store_id),\n         rollup (d.year, d.quarter, d.month, d.date);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["country","state","city","store_id","year","quarter","month","date","total_number","total_price"],"rows":[["Canada","ON","Toronto",null,"2018","2","4","2018-04-05","2","50"],["Canada","ON","Toronto",null,"2018","2","4",null,"2","50"],["Canada","ON","Toronto",null,"2018","4","11","2018-11-20","2","160"],["Canada","ON","Toronto",null,"2018","4","11",null,"2","160"],["Canada","ON","Toronto",null,"2018",null,null,null,"4","210"],["Canada","ON",null,null,"2018",null,null,null,"4","210"],["Canada",null,null,null,"2018",null,null,null,"4","210"],["Canada","ON","Toronto",null,"2019","1","3","2019-03-03","2","80"],["Canada","ON","Toronto",null,"2019","1","3",null,"2","80"],["Canada","ON","Toronto",null,"2019",null,null,null,"2","80"],["Canada","ON",null,null,"2019",null,null,null,"2","80"],["Canada",null,null,null,"2019",null,null,null,"2","80"],["Canada",null,null,null,null,null,null,null,"6","290"],["USA","MA","Boston",null,"2018","
