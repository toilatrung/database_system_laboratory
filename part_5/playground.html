sub> là parity của B\u003csub>4i−3\u003c/sub>…B\u003csub>4i\u003c/sub>). Có vấn đề gì?","en":"\u003cp>\u003cstrong>Exercise 12.4.\u003c/strong> Data and parity blocks are arranged on four disks as shown in Figure 12.4. The B\u003csub>i\u003c/sub> are data blocks and the P\u003csub>i\u003c/sub> are parity blocks; parity block P\u003csub>i\u003c/sub> is the parity block for data blocks B\u003csub>4i−3\u003c/sub> to B\u003csub>4i\u003c/sub>. What problem, if any, can this arrangement cause?\u003c/p>\n\u003cp>\u003cem>Figure 12.4 — Block arrangement for Exercise 12.4\u003c/em> (each column is a disk, rows go down the disk):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Disk 1\u003c/th>\u003cth>Disk 2\u003c/th>\u003cth>Disk 3\u003c/th>\u003cth>Disk 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>B1\u003c/td>\u003ctd>B2\u003c/td>\u003ctd>B3\u003c/td>\u003ctd>B4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P1\u003c/td>\u003ctd>B5\u003c/td>\u003ctd>B6\u003c/td>\u003ctd>B7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B8\u003c/td>\u003ctd>P2\u003c/td>\u003ctd>B9\u003c/td>\u003ctd>B10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answer":"\u003cp>P\u003csub>i\u003c/sub> nằm \u003cstrong>cùng đĩa\u003c/strong> với B\u003csub>4i−3\u003c/sub>: P1 và B1 cùng ở đĩa 1, P2 và B5 cùng ở đĩa 2, … Nếu đĩa đó hỏng thì \u003cstrong>mất cả block dữ liệu lẫn parity của nó\u003c/strong>, nên không khôi phục được B\u003csub>4i−3\u003c/sub>. (Ngoài ra mỗi parity phủ 4 block dữ liệu trong khi chỉ có 4 đĩa — một nhóm parity phải trải trên n − 1 = 3 đĩa dữ liệu và parity ở đĩa còn lại.) Bài CH12.09 tìm các cặp vi phạm bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 12.5\u003c/strong> — Số đĩa trong một mảng RAID 5: ít đĩa và nhiều đĩa đánh đổi gì về chi phí, độ tin cậy, hiệu năng khi có đĩa hỏng và khi rebuild?","en":"\u003cp>\u003cstrong>Exercise 12.5.\u003c/strong> A database administrator can decide how many disks go into one RAID 5 array. What are the trade-offs between using fewer disks and using more disks, with respect to cost, reliability, performance while a disk has failed, and performance while the failed disk is rebuilt?\u003c/p>","answer":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Ít đĩa\u003c/th>\u003cth>Nhiều đĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Chi phí\u003c/strong>\u003c/td>\u003ctd>cao hơn: tỉ lệ dung lượng dành cho parity là 1/n lớn\u003c/td>\u003ctd>rẻ hơn trên mỗi GB hữu ích\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Độ tin cậy\u003c/strong>\u003c/td>\u003ctd>tốt hơn\u003c/td>\u003ctd>xác suất \u003cstrong>hai đĩa hỏng\u003c/strong> cùng lúc (trong lúc rebuild) cao hơn → mất dữ liệu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Khi có đĩa hỏng\u003c/strong>\u003c/td>\u003ctd>đọc một block của đĩa hỏng cần đọc ít block ở đĩa khác\u003c/td>\u003ctd>phải đọc block tương ứng từ \u003cstrong>mọi\u003c/strong> đĩa còn lại → chậm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Khi rebuild\u003c/strong>\u003c/td>\u003ctd>ít đĩa phải đọc\u003c/td>\u003ctd>phải đọc toàn bộ n − 1 đĩa → lâu hơn, tải nặng hơn\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"q":"\u003cstrong>PE 12.6\u003c/strong> — Đề xuất cách đạt hiệu quả \u003cstrong>atomic block write\u003c/strong> (ghi trọn hoặc không ghi gì) với (a) RAID 1, (b) RAID 5, kể cả việc phải làm khi khôi phục sau sự cố.","en":"\u003cp>\u003cstrong>Exercise 12.6.\u003c/strong> If power fails while a disk block is being written, the block may end up only partially written. Assume partially written blocks can be detected. An \u003cem>atomic block write\u003c/em> is one in which either the whole block is written or nothing is written (no partial writes). Propose schemes that achieve the effect of atomic block writes with each of the following RAID schemes; your schemes should include what is done during recovery from a failure.\u003c/p>\n\u003cp>a. RAID level 1 (mirroring)\u003c/p>\n\u003cp>b. RAID level 5 (block-interleaved, distributed parity)\u003c/p>","answer":"\u003cp>a. \u003cstrong>RAID 1\u003c/strong>:\u003c/p>\n\u003col>\u003cli>Ghi lên block vật lý thứ nhất.\u003c/li>\u003cli>Ghi xong thành công mới ghi cùng nội dung lên block thứ hai.\u003c/li>\u003cli>Chỉ báo hoàn tất khi lần ghi thứ hai xong.\u003c/li>\u003c/ol>\n\u003cp>Khôi phục: xét từng cặp block. Giống nhau và không có ghi dở → không làm gì. Một block bị ghi dở → chép nội dung block kia đè lên. Không có ghi dở nhưng khác nhau → chép block thứ nhất sang block thứ hai (hoặc ngược lại, nhất quán một chiều). Kết quả: lần ghi hoặc thành công hoàn toàn hoặc như chưa xảy ra.\u003c/p>\n\u003cp>So sánh mọi cặp block khi khôi phục rất tốn → ghi lại danh sách các block \u003cstrong>đang được ghi\u003c/strong> vào một ít \u003cstrong>NV-RAM\u003c/strong>; khi khôi phục chỉ so sánh các block đó.\u003c/p>\n\u003cp>b. \u003cstrong>RAID 5\u003c/strong>: tương tự — ghi block dữ liệu trước, rồi mới ghi parity tương ứng. Khôi phục: xét từng nhóm gồm block thứ n của mọi đĩa. Không có block ghi dở và parity khớp → không làm gì. Có block ghi dở → dựng lại nó từ các block còn lại (kể cả parity). Không có block ghi dở nhưng parity không khớp → tính lại parity. (Cũng dùng NV-RAM để chỉ kiểm tra các nhóm đang ghi.)\u003c/p>"},{"q":"\u003cstrong>PE 12.7\u003c/strong> — Vì sao không thực tế khi đặt mọi block của một file lớn trên các block liên tiếp? Hệ điều hành làm gì thay vào đó?","en":"\u003cp>\u003cstrong>Exercise 12.7.\u003c/strong> Placing all blocks of a large file on consecutive disk blocks would minimize seeks during sequential reads of the file. Why is this impractical? What do operating systems do instead to keep the number of seeks low during sequential reads?\u003c/p>","answer":"\u003cp>Nếu cả file nằm liên tiếp thì đọc tuần tự chỉ cần \u003cstrong>một lần seek\u003c/strong>. Nhưng file liên tục được tạo, xoá, mở rộng → vùng trống trên đĩa bị \u003cstrong>phân mảnh\u003c/strong>, khó tìm được một dải rất dài block trống liên tiếp (và file lớn lên thì không có chỗ nối tiếp).\u003c/p>\n\u003cp>Hệ điều hành cấp phát theo \u003cstrong>extent\u003c/strong>: các đoạn \u003cstrong>lớn nhưng kích thước cố định\u003c/strong> gồm nhiều block liên tiếp. Đọc tuần tự chỉ cần \u003cstrong>một seek cho mỗi extent\u003c/strong>. Có thể chạy công cụ \u003cstrong>defragment\u003c/strong> để gom lại.\u003c/p>"}],"exercises":[{"id":"CH12.01","topic":"access time","level":1,"prompt":"\u003cp>Với mỗi \u003cstrong>ổ đĩa từ\u003c/strong> (\u003ccode>kind = 'HDD'\u003c/code>) trong \u003ccode>st_disk\u003c/code>: disk_id, \u003ccode>latency_ms\u003c/code> = rotational latency trung bình, \u003ccode>access_ms\u003c/code> = avg_seek_ms + latency_ms. Làm tròn 2 chữ số.\u003c/p>","en":"","hint":"Latency trung bình là nửa vòng quay: 0.5 × 60000 / rpm.","solution":"select disk_id,\n       round(0.5 * 60000 / rpm, 2) as latency_ms,\n       round(avg_seek_ms + 0.5 * 60000 / rpm, 2) as access_ms\nfrom st_disk\nwhere kind = 'HDD';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["disk_id","latency_ms","access_ms"],"rows":[["D1","4.17","8.17"],["D2","5.56","13.56"],["D3","2","5"]]}},{"id":"CH12.02","topic":"IOPS","level":2,"prompt":"\u003cp>Ước lượng số lần đọc \u003cstrong>block 4 KB ngẫu nhiên\u003c/strong> mỗi giây (\u003ccode>iops\u003c/code>, lấy phần nguyên) của \u003cstrong>mọi\u003c/strong> thiết bị trong st_disk. Thời gian một lần đọc = avg_seek_ms + latency (0 với SSD) + thời gian truyền 4 KB (coi 1 MB = 1024 KB). Trả về disk_id, \u003ccode>read_ms\u003c/code> (làm tròn 4 chữ số), iops; sắp theo iops giảm dần.\u003c/p>","en":"","hint":"Thời gian truyền (ms) = 4 / 1024 / transfer_mb_s × 1000. \u003ccode>coalesce(0.5 * 60000 / rpm, 0)\u003c/code>.","solution":"select disk_id,\n       round(t, 4) as read_ms,\n       floor(1000 / t) as iops\nfrom (select disk_id,\n             avg_seek_ms + coalesce(0.5 * 60000 / rpm, 0) + 4.0 / 1024 / transfer_mb_s * 1000 as t\n      from st_disk) as d\norder by iops desc;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["disk_id","read_ms","iops"],"rows":[["D5","0.0213","46943"],["D4","0.1071","9336"],["D3","5.0156","199"],["D1","8.1862","122"],["D2","13.58","73"]]}},{"id":"CH12.03","topic":"sequential vs random","level":2,"prompt":"\u003cp>Đọc một file \u003cstrong>10 GB\u003c/strong> (1 GB = 1024 MB, 1 MB = 1024 KB) trên mỗi thiết bị: \u003ccode>seq_s\u003c/code> = đọc tuần tự (chỉ tính thời gian truyền), \u003ccode>random_s\u003c/code> = đọc thành các block 4 KB ngẫu nhiên (mỗi block tốn một lần access đầy đủ như CH12.02). Trả về disk_id, seq_s và random_s làm tròn 1 chữ số, và \u003ccode>ratio\u003c/code> = random_s / seq_s làm tròn 0 chữ số.\u003c/p>","en":"","hint":"","solution":"select disk_id,\n       round(seq, 1) as seq_s,\n       round(rnd, 1) as random_s,\n       round(rnd / seq, 0) as ratio\nfrom (select disk_id,\n             10 * 1024 / transfer_mb_s as seq,\n             (10 * 1024 * 1024 / 4) * (avg_seek_ms + coalesce(0.5 * 60000 / rpm, 0) + 4.0 / 1024 / transfer_mb_s * 1000) / 1000 as rnd\n      from st_disk) as d;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["disk_id","seq_s","random_s","ratio"],"rows":[["D1","51.2","21459.6","419"],["D2","64","35599.1","556"],["D3","41","13148.2","321"],["D4","18.6","280.8","15"],["D5","3.4","55.8","16"]]}},{"id":"CH12.04","topic":"RAID capacity","level":1,"prompt":"\u003cp>Với mỗi mảng trong \u003ccode>st_raid_array\u003c/code>: array_id, raid_level, \u003ccode>raw_gb\u003c/code> (tổng dung lượng các đĩa) và \u003ccode>usable_gb\u003c/code> — RAID 0: n·c, RAID 1: n·c/2, RAID 5: (n−1)·c, RAID 6: (n−2)·c, với c = capacity_gb của loại đĩa dùng trong mảng.\u003c/p>","en":"","hint":"","solution":"select a.array_id, a.raid_level,\n       a.num_disks * d.capacity_gb as raw_gb,\n       case a.raid_level\n         when 0 then a.num_disks * d.capacity_gb\n         when 1 then a.num_disks * d.capacity_gb / 2\n         when 5 then (a.num_disks - 1) * d.capacity_gb\n         when 6 then (a.num_disks - 2) * d.capacity_gb\n       end as usable_gb\nfrom st_raid_array a join st_disk d on d.disk_id = a.disk_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["array_id","raid_level","raw_gb","usable_gb"],"rows":[["A1","0","16000","16000"],["A2","1","16000","8000"],["A3","5","20000","16000"],["A4","6","64000","48000"],["A5","1","4000","2000"],["A6","5","8100","7200"]]}},{"id":"CH12.05","topic":"MTTF of many disks","level":1,"prompt":"\u003cp>Với mỗi mảng RAID: array_id và thời gian trung bình tới khi \u003cstrong>một đĩa nào đó\u003c/strong> trong mảng hỏng: \u003ccode>hours_to_first_failure\u003c/code> = MTTF của đĩa / num_disks (phần nguyên) và \u003ccode>days\u003c/code> (làm tròn 1 chữ số).\u003c/p>","en":"","hint":"","solution":"select a.array_id,\n       floor(d.mttf_hours::numeric / a.num_disks) as hours_to_first_failure,\n       round(d.mttf_hours::numeric / a.num_disks / 24, 1) as days\nfrom st_raid_array a join st_disk d on d.disk_id = a.disk_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["array_id","hours_to_first_failure","days"],"rows":[["A1","250000","10416.7"],["A2","600000","25000"],["A3","200000","8333.3"],["A4","150000","6250"],["A5","500000","20833.3"],["A6","166666","6944.4"]]}},{"id":"CH12.06","topic":"mean time to data loss","level":2,"prompt":"\u003cp>Với các mảng \u003cstrong>RAID 1\u003c/strong> (mỗi cặp đĩa mirror): array_id và mean time to data loss của \u003cstrong>một cặp\u003c/strong> theo công thức MTTF² / (2 × MTTR), tính bằng \u003cstrong>năm\u003c/strong> (8760 giờ/năm), làm tròn tới hàng đơn vị (\u003ccode>years\u003c/code>).\u003c/p>","en":"","hint":"Ép kiểu numeric trước khi bình phương để không tràn integer.","solution":"select a.array_id,\n       round(power(d.mttf_hours::numeric, 2) / (2 * a.mttr_hours) / 8760, 0) as years\nfrom st_raid_array a join st_disk d on d.disk_id = a.disk_id\nwhere a.raid_level = 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["array_id","years"],"rows":[["A2","8219178"],["A5","45662100"]]}},{"id":"CH12.07","topic":"PE 12.3b flash table","level":2,"prompt":"\u003cp>Với mỗi thiết bị trong \u003ccode>st_flash\u003c/code>: device, \u003ccode>pages\u003c/code> = số page (1 GB = 2³⁰ byte) và \u003ccode>table_mb\u003c/code> = kích thước flash translation table dạng mảng, mỗi phần tử address_bits bit (1 MB = 2²⁰ byte). Dòng F64 phải ra 64 MB như lời giải PE 12.3b.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 12.3 (b).\u003c/strong> Flash storage:\u003c/p>\n\u003cp>b. A flash storage system holds 64 gigabytes and uses a 4096-byte page. If each page has a 32-bit address and the table is stored as an array, how large is the flash translation table?\u003c/p>","hint":"","solution":"select device,\n       capacity_gb::bigint * 1073741824 / page_bytes as pages,\n       capacity_gb::bigint * 1073741824 / page_bytes * address_bits / 8 / 1048576 as table_mb\nfrom st_flash;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["device","pages","table_mb"],"rows":[["F64","16777216","64"],["F512","134217728","512"],["F2T","268435456","1024"],["F4T","268435456","2048"]]}},{"id":"CH12.08","topic":"PE 12.3c run mapping","level":2,"prompt":"\u003cp>Với thiết bị \u003cstrong>F64\u003c/strong>, giả sử mỗi dải p page logic liên tiếp được ánh xạ tới p page vật lý liên tiếp nên chỉ cần lưu một phần tử cho mỗi dải. Trả về p và \u003ccode>table_kb\u003c/code> (kích thước bảng, KB = 1024 byte) cho p ∈ {1, 8, 64, 512}.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 12.3 (c).\u003c/strong> Flash storage:\u003c/p>\n\u003cp>c. Suggest how to shrink the translation table when long ranges of consecutive logical page numbers are very often mapped to consecutive physical page numbers.\u003c/p>","hint":"\u003ccode>generate_series\u003c/code> hoặc \u003ccode>values (1), (8), (64), (512)\u003c/code>.","solution":"select p,\n       f.capacity_gb::bigint * 1073741824 / f.page_bytes / p * f.address_bits / 8 / 1024 as table_kb\nfrom st_flash f, (values (1), (8), (64), (512)) as r(p)\nwhere f.device = 'F64';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["p","table_kb"],"rows":[["1","65536"],["8","8192"],["64","1024"],["512","128"]]}},{"id":"CH12.09","topic":"PE 12.4 parity placement","level":3,"prompt":"\u003cp>\u003ccode>st_raid_layout(disk_no, stripe, label)\u003c/code> chứa bố trí của PE 12.4 (mở rộng thêm vài stripe). Parity P\u003csub>i\u003c/sub> bảo vệ B\u003csub>4i−3\u003c/sub> … B\u003csub>4i\u003c/sub>. Tìm mọi cặp (parity, data_block, disk_no) mà block dữ liệu nằm \u003cstrong>cùng đĩa\u003c/strong> với parity bảo vệ nó.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 12.4.\u003c/strong> Data and parity blocks are arranged on four disks as shown in Figure 12.4. The B\u003csub>i\u003c/sub> are data blocks and the P\u003csub>i\u003c/sub> are parity blocks; parity block P\u003csub>i\u003c/sub> is the parity block for data blocks B\u003csub>4i−3\u003c/sub> to B\u003csub>4i\u003c/sub>. What problem, if any, can this arrangement cause?\u003c/p>\n\u003cp>\u003cem>Figure 12.4 — Block arrangement for Exercise 12.4\u003c/em> (each column is a disk, rows go down the disk):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Disk 1\u003c/th>\u003cth>Disk 2\u003c/th>\u003cth>Disk 3\u003c/th>\u003cth>Disk 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>B1\u003c/td>\u003ctd>B2\u003c/td>\u003ctd>B3\u003c/td>\u003ctd>B4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P1\u003c/td>\u003ctd>B5\u003c/td>\u003ctd>B6\u003c/td>\u003ctd>B7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B8\u003c/td>\u003ctd>P2\u003c/td>\u003ctd>B9\u003c/td>\u003ctd>B10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003ctd>…\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"Lấy số sau ký tự đầu: \u003ccode>substr(label, 2)::int\u003c/code>. Block B\u003csub>k\u003c/sub> thuộc parity i khi 4i − 3 ≤ k ≤ 4i.","solution":"select p.label as parity, b.label as data_block, p.disk_no\nfrom st_raid_layout p join st_raid_layout b on b.disk_no = p.disk_no\nwhere p.label like 'P%' and b.label like 'B%'\n  and substr(b.label, 2)::int between 4 * substr(p.label, 2)::int - 3 and 4 * substr(p.label, 2)::int;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["parity","data_block","disk_no"],"rows":[["P1","B1","1"],["P2","B5","2"],["P3","B9","3"],["P4","B13","4"]]}},{"id":"CH12.10","topic":"cost per GB","level":1,"prompt":"\u003cp>Xếp hạng thiết bị theo giá mỗi GB: disk_id, kind, \u003ccode>usd_per_gb\u003c/code> (làm tròn 4 chữ số), sắp tăng dần theo usd_per_gb.\u003c/p>","en":"","hint":"","solution":"select disk_id, kind, round(price_usd / capacity_gb, 4) as usd_per_gb\nfrom st_disk\norder by usd_per_gb;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["disk_id","kind","usd_per_gb"],"rows":[["D2","HDD","0.0175"],["D1","HDD","0.0225"],["D5","SSD","0.09"],["D4","SSD","0.1"],["D3","HDD","0.2333"]]}},{"id":"CH12.11","topic":"RAID write penalty","level":3,"prompt":"\u003cp>Ứng dụng tạo \u003cstrong>1000 lần ghi block nhỏ ngẫu nhiên mỗi giây\u003c/strong> lên từng mảng. Số I/O vật lý cho mỗi lần ghi logic: RAID 0 → 1, RAID 1 → 2, RAID 5 → 4, RAID 6 → 6. Trả về array_id, raid_level, \u003ccode>physical_iops\u003c/code> và \u003ccode>per_disk_iops\u003c/code> (= physical_iops / num_disks, làm tròn 1 chữ số).\u003c/p>","en":"","hint":"","solution":"select array_id, raid_level,\n       1000 * f as physical_iops,\n       round(1000.0 * f / num_disks, 1) as per_disk_iops\nfrom (select array_id, raid_level, num_disks,\n             case raid_level when 0 then 1 when 1 then 2 when 5 then 4 when 6 then 6 end as f\n      from st_raid_array) as a;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["array_id","raid_level","physical_iops","per_disk_iops"],"rows":[["A1","0","1000","250"],["A2","1","2000","1000"],["A3","5","4000","800"],["A4","6","6000","750"],["A5","1","2000","500"],["A6","5","4000","444.4"]]}}]},{"key":"ch13","store":"13","short":"13","label":"Chương 13","navLabel":"Chương 13","kind":"Chương","title":"Data Storage Structures","titleVi":"Cấu trúc lưu trữ dữ liệu","summary":"\u003ch3>1. File organization (slide 13.3)\u003c/h3>\n\u003cp>CSDL được lưu thành tập các \u003cstrong>file\u003c/strong>; mỗi file là một dãy \u003cstrong>record\u003c/strong>, được chia thành các \u003cstrong>block\u003c/strong> cố định (đơn vị chuyển giữa đĩa và bộ nhớ, 4–8 KB). Giả định đơn giản: mỗi file chỉ chứa record của một relation, record nhỏ hơn block.\u003c/p>\n\u003ch3>2. Record độ dài cố định (slide 13.4–13.8)\u003c/h3>\n\u003cp>Ví dụ \u003ccode>instructor(ID varchar(5), name varchar(20), dept_name varchar(20), salary numeric(8,2))\u003c/code> coi như cố định: 5 + 20 + 20 + 8 = \u003cstrong>53 byte\u003c/strong>. Record i bắt đầu ở byte n × (i − 1).\u003c/p>\n\u003cul>\u003cli>Không để record vắt qua hai block: mỗi block chứa ⌊block_size / record_size⌋ record, phần dư bỏ trống.\u003c/li>\u003cli>\u003cstrong>Xoá record i\u003c/strong> — ba cách (PE 13.1):\u003c/li>\u003cli>dời các record i + 1, …, n lên một chỗ (giữ thứ tự, tốn nhiều I/O nhất);\u003c/li>\u003cli>dời \u003cstrong>record cuối\u003c/strong> vào chỗ trống (ít dời, nhưng phá thứ tự);\u003c/li>\u003cli>\u003cstrong>không dời\u003c/strong>, nối chỗ trống vào \u003cstrong>free list\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Free list\u003c/strong>: \u003cstrong>file header\u003c/strong> chứa địa chỉ record trống đầu tiên; mỗi record trống chứa con trỏ tới record trống kế tiếp. \u003cstrong>Insert\u003c/strong> lấy chỗ đầu tiên trong free list (header trỏ sang chỗ kế tiếp); \u003cstrong>delete\u003c/strong> đẩy chỗ vừa trống lên đầu danh sách (PE 13.2, bài CH13.04–06).\u003c/li>\u003c/ul>\n\u003ch3>3. Record độ dài thay đổi (slide 13.9–13.12)\u003c/h3>\n\u003cp>Phát sinh do: kiểu dữ liệu độ dài thay đổi (varchar), nhiều loại record trong một file, trường lặp (mảng).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Biểu diễn\u003c/strong>: các thuộc tính cố định trước; mỗi thuộc tính độ dài thay đổi được thay bằng cặp \u003cstrong>(offset, length)\u003c/strong> ở phần cố định, dữ liệu thật nằm sau. \u003cstrong>Null bitmap\u003c/strong> cho biết thuộc tính nào null.\u003c/li>\u003cli>PostgreSQL: varchar ngắn có header 1 byte (\u003ccode>pg_column_size('Wu'::varchar)\u003c/code> = 3), còn \u003ccode>char(20)\u003c/code> luôn chiếm đủ 20 ký tự + header (bài CH13.02–03).\u003c/li>\u003c/ul>\n\u003ch3>4. Slotted page (slide 13.11–13.12)\u003c/h3>\n\u003cp>Header của mỗi block chứa: \u003cstrong>số record\u003c/strong>, \u003cstrong>cuối vùng trống\u003c/strong>, và \u003cstrong>vị trí + kích thước\u003c/strong> của từng record (mảng slot). Record được xếp từ cuối block ngược lên, mảng slot mọc từ đầu xuống, vùng trống ở giữa.\u003c/p>\n\u003cul>\u003cli>Record có thể được dời trong block để dồn chỗ trống; chỉ cần sửa entry trong header.\u003c/li>\u003cli>Con trỏ từ bên ngoài \u003cstrong>trỏ tới entry trong header\u003c/strong> (block, slot) chứ không trỏ thẳng tới record. PostgreSQL gọi địa chỉ này là \u003cstrong>ctid = (block, slot)\u003c/strong> (bài CH13.14).\u003c/li>\u003c/ul>\n\u003ch3>5. Lưu đối tượng lớn (slide 13.13)\u003c/h3>\n\u003cp>blob/clob rất lớn: lưu thành file riêng trong hệ thống file, hoặc chia nhỏ thành nhiều tuple trong một relation riêng (PostgreSQL: \u003cstrong>TOAST\u003c/strong>).\u003c/p>\n\u003ch3>6. Tổ chức record trong file (slide 13.14–13.25)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tổ chức\u003c/th>\u003cth>Ý tưởng\u003c/th>\u003cth>Ghi chú\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Heap\u003c/strong>\u003c/td>\u003ctd>record đặt ở bất kỳ chỗ trống nào\u003c/td>\u003ctd>cần \u003cstrong>free-space map\u003c/strong> để tìm block còn chỗ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sequential\u003c/strong>\u003c/td>\u003ctd>sắp theo \u003cstrong>search key\u003c/strong>\u003c/td>\u003ctd>tốt cho truy cập tuần tự/khoảng; insert: chèn vào chỗ trống hoặc \u003cstrong>overflow block\u003c/strong>, thỉnh thoảng phải \u003cstrong>reorganize\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Multitable clustering\u003c/strong>\u003c/td>\u003ctd>record của \u003cstrong>nhiều relation\u003c/strong> đặt chung file, ví dụ mỗi department theo sau là các instructor của nó\u003c/td>\u003ctd>join nhanh; truy vấn chỉ một relation chậm hơn (PE 13.3, bài CH13.12)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>B+-tree file organization\u003c/strong>\u003c/td>\u003ctd>record lưu trong lá của B+-tree\u003c/td>\u003ctd>giữ thứ tự cả khi insert/delete nhiều (Chương 14)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hashing\u003c/strong>\u003c/td>\u003ctd>hàm băm trên một thuộc tính quyết định block\u003c/td>\u003ctd>Chương 14\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Free-space map\u003c/strong>: mảng có một phần tử cho mỗi block, ghi mức đầy của block (ví dụ 3 bit: tỉ lệ đầy theo phần tám). Có thể làm map \u003cstrong>hai cấp\u003c/strong> (mỗi phần tử cấp 2 là giá trị lớn nhất của nhiều phần tử cấp 1) để tìm nhanh. Ghi xuống đĩa định kỳ; sai lệch nhỏ được sửa dần. PE 13.4 dùng \u003cstrong>2 bit\u003c/strong>/block (bài CH13.07–08).\u003c/p>\n\u003ch3>7. Partitioning (slide 13.26)\u003c/h3>\n\u003cp>Chia relation lớn thành các relation nhỏ hơn theo giá trị một thuộc tính, ví dụ \u003ccode>transaction\u003c/code> theo năm → \u003ccode>transaction_2018\u003c/code>, \u003ccode>transaction_2019\u003c/code>, … Lợi ích: truy vấn chỉ một năm đọc ít dữ liệu hơn; có thể đặt partition cũ trên đĩa rẻ, partition mới trên SSD; quản lý (xoá dữ liệu cũ) dễ hơn. Nhược điểm: truy vấn trải nhiều partition tốn hơn (PE 13.6, bài CH13.11 dùng \u003cstrong>declarative partitioning\u003c/strong> của PostgreSQL).\u003c/p>\n\u003ch3>8. Data dictionary (system catalog) (slide 13.27–13.29)\u003c/h3>\n\u003cp>Lưu \u003cstrong>metadata\u003c/strong>: tên relation, thuộc tính (tên, kiểu, độ dài), view, ràng buộc toàn vẹn, người dùng và quyền, thống kê (số tuple, phân bố giá trị), index, cách lưu trữ vật lý. Bản thân catalog thường cũng là các relation (PostgreSQL: \u003ccode>pg_class\u003c/code>, \u003ccode>pg_attribute\u003c/code>, \u003ccode>pg_index\u003c/code>…).\u003c/p>\n\u003ch3>9. Buffer manager (slide 13.30–13.39)\u003c/h3>\n\u003cp>\u003cstrong>Buffer\u003c/strong>: vùng bộ nhớ chứa bản sao các block của đĩa. Khi chương trình cần một block:\u003c/p>\n\u003col>\u003cli>Block đã có trong buffer → trả địa chỉ (tìm bằng \u003cstrong>hash table\u003c/strong>, PE 13.5).\u003c/li>\u003cli>Chưa có → chọn một block để \u003cstrong>thay thế\u003c/strong> (nếu block bị thay đã sửa thì ghi xuống đĩa trước), đọc block cần vào chỗ đó.\u003c/li>\u003c/ol>\n\u003cp>Khái niệm:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Pinned block\u003c/strong>: đang được dùng, không được thay (pin count).\u003c/li>\u003cli>\u003cstrong>Shared / exclusive lock\u003c/strong> trên buffer: đọc song song nhiều, ghi một.\u003c/li>\u003cli>\u003cstrong>Replacement policy\u003c/strong>:\u003c/li>\u003cli>\u003cstrong>LRU\u003c/strong> (least recently used): thay block lâu nhất chưa dùng — dựa trên quá khứ để đoán tương lai.\u003c/li>\u003cli>\u003cstrong>MRU\u003c/strong> (most recently used): thay block vừa dùng xong — tốt cho \u003cstrong>nested-loop join\u003c/strong>, khi block vừa quét xong sẽ là block cần lại muộn nhất (PE 13.7).\u003c/li>\u003cli>\u003cstrong>Toss-immediate\u003c/strong>: giải phóng block ngay khi xử lý xong tuple cuối của nó.\u003c/li>\u003cli>\u003cstrong>Clock\u003c/strong>: xấp xỉ LRU rẻ hơn (mỗi block có bit \"vừa dùng\").\u003c/li>\u003cli>Block của catalog/index (dùng nhiều) nên được giữ lại.\u003c/li>\u003cli>\u003cstrong>Forced output\u003c/strong>: ghi block xuống đĩa ngay (cần cho recovery, Chương 19).\u003c/li>\u003cli>Hệ điều hành cũng có buffer riêng; PostgreSQL dùng buffer nhỏ và dựa vào bộ đệm file của hệ điều hành (PE 13.8).\u003c/li>\u003c/ul>\n\u003ch3>10. Lưu trữ theo cột (columnar storage) (slide 13.40–13.44)\u003c/h3>\n\u003cp>Mỗi thuộc tính lưu riêng (mảng giá trị theo cột); tuple thứ i lấy phần tử thứ i của mỗi cột.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Ưu\u003c/strong>: truy vấn chỉ đọc vài cột thì chỉ đọc các cột đó (giảm I/O); \u003cstrong>nén\u003c/strong> tốt (giá trị cùng kiểu, lặp nhiều); \u003cstrong>vector processing\u003c/strong> trên CPU hiện đại.\u003c/li>\u003cli>\u003cstrong>Nhược\u003c/strong>: dựng lại tuple tốn; cập nhật/xoá/insert từng tuple tốn; giải nén tốn.\u003c/li>\u003cli>Phù hợp \u003cstrong>decision support/analytics\u003c/strong>; row store phù hợp \u003cstrong>xử lý giao dịch\u003c/strong>. Định dạng file: \u003cstrong>ORC, Parquet\u003c/strong> (lưu theo cột trong từng stripe/row group). Một số hệ thống \u003cstrong>hybrid\u003c/strong> (row cho dữ liệu mới, column cho dữ liệu cũ).\u003c/li>\u003cli>\u003cstrong>Main-memory database\u003c/strong>: không cần buffer manager, dùng con trỏ trực tiếp, tối ưu cho cache CPU.\u003c/li>\u003c/ul>\n\u003ch3>Mẹo làm bài\u003c/h3>\n\u003cul>\u003cli>Câu hỏi về xoá record: luôn so sánh \u003cstrong>số record phải dời / số I/O\u003c/strong>, \u003cstrong>giữ thứ tự hay không\u003c/strong>, \u003cstrong>chi phí quản lý chỗ trống\u003c/strong>.\u003c/li>\u003cli>Vẽ file sau insert/delete: insert lấy \u003cstrong>đầu\u003c/strong> free list, delete đẩy chỗ trống lên \u003cstrong>đầu\u003c/strong> free list.\u003c/li>\u003cli>LRU vs MRU: nghĩ về \u003cstrong>mẫu truy cập lặp lại\u003c/strong> của nested-loop join.\u003c/li>\u003c/ul>","quiz":[{"q":"Record instructor cố định 53 byte, block 4096 byte, record không vắt qua block. Mỗi block chứa bao nhiêu record?","options":["77","78","76","53"],"answer":0,"explain":"⌊4096 / 53⌋ = 77; 4096 − 77 × 53 = 15 byte bỏ trống."},{"q":"Trong file có free list, một record mới được insert vào đâu?","options":["Cuối file","Chỗ trống mà file header đang trỏ tới","Chỗ trống cuối cùng của danh sách","Chỗ trống có số nhỏ nhất"],"answer":1,"explain":"Lấy chỗ đầu tiên của free list; header được cập nhật trỏ sang chỗ trống kế tiếp."},{"q":"Trong slotted page, con trỏ từ bên ngoài (ví dụ từ index) trỏ tới đâu?","options":["Byte đầu tiên của record","Entry của record trong header của block","Cuối vùng trống","Block kế tiếp"],"answer":1,"explain":"Nhờ vậy record có thể được dời trong block mà không phải sửa con trỏ bên ngoài."},{"q":"Biểu diễn record độ dài thay đổi: thuộc tính varchar được lưu thế nào ở phần cố định?","options":["Lưu đủ độ dài tối đa","Cặp (offset, length)","Con trỏ tới file khác","Không lưu"],"answer":1,"explain":"Dữ liệu thật nằm sau phần cố định; null bitmap cho biết thuộc tính null."},{"q":"Multitable clustering file organization có lợi cho truy vấn nào?","options":["Đếm số tuple của một relation","Join department với instructor của nó","Quét toàn bộ instructor","Cập nhật salary"],"answer":1,"explain":"Các record join với nhau nằm chung block. Truy vấn chỉ một relation phải đọc qua record của relation kia nên chậm hơn."},{"q":"Cấu trúc dữ liệu thường dùng để tìm nhanh một block có trong buffer không?","options":["Danh sách liên kết","Hash table theo địa chỉ block","B+-tree trên đĩa","Mảng sắp xếp"],"answer":1,"explain":"PE 13.5: buffer rất lớn, hash table cho phép tra cứu O(1)."},{"q":"Khi tính nested-loop join r ⋈ s (với mỗi tuple của r quét lại toàn bộ s), chính sách thay block nào phù hợp cho các block của s?","options":["LRU","MRU","FIFO","Random"],"answer":1,"explain":"Block vừa quét xong sẽ được cần lại muộn nhất trong lần quét kế tiếp, nên thay nó (MRU). LRU sẽ thay đúng block sắp cần."},{"q":"\u003cstrong>Pinned block\u003c/strong> trong buffer là gì?","options":["Block đã bị sửa","Block đang được dùng nên không được phép thay","Block của catalog","Block đã ghi xuống đĩa"],"answer":1,"explain":"Pin count > 0 thì buffer manager không chọn block đó để thay."},{"q":"Lưu trữ theo cột (columnar) phù hợp nhất với loại công việc nào?","options":["Xử lý giao dịch cập nhật từng tuple","Truy vấn phân tích đọc vài cột trên rất nhiều dòng","Insert liên tục","Lấy toàn bộ một tuple theo khoá"],"answer":1,"explain":"Chỉ đọc cột cần, nén tốt, xử lý vector."},{"q":"Partitioning relation takes theo year có nhược điểm gì?","options":["Không truy vấn được năm cũ","Truy vấn trải nhiều năm phải đọc nhiều partition, tốn hơn","Không thể tạo index","Mất ràng buộc khoá chính"],"answer":1,"explain":"PE 13.6. Ưu điểm: truy vấn một năm chỉ đọc partition đó, có thể đặt dữ liệu cũ trên đĩa rẻ."}],"questions":[{"q":"\u003cstrong>PE 13.1\u003c/strong> — Xoá record 5 khỏi file ở Figure 13.3: so sánh ưu nhược điểm của (a) dời 6 → 5, 7 → 6; (b) dời 7 → 5; (c) đánh dấu xoá, không dời gì.","en":"\u003cp>\u003cstrong>Exercise 13.1.\u003c/strong> Record 5 is to be deleted from the file of Figure 13.3. Compare the relative merits of the following ways of implementing the deletion:\u003c/p>\n\u003cp>a. Move record 6 into the space of record 5, then move record 7 into the space of record 6.\u003c/p>\n\u003cp>b. Move record 7 into the space of record 5.\u003c/p>\n\u003cp>c. Mark record 5 as deleted and move no records.\u003c/p>\n\u003cp>\u003cem>Figure 13.3 — File of instructor records (Figure 13.1) after record 3 was deleted and the final record moved into its place:\u003c/em>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slot\u003c/th>\u003cth>ID\u003c/th>\u003cth>name\u003c/th>\u003cth>dept_name\u003c/th>\u003cth>salary\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>record 0\u003c/td>\u003ctd>10101\u003c/td>\u003ctd>Srinivasan\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>65000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 1\u003c/td>\u003ctd>12121\u003c/td>\u003ctd>Wu\u003c/td>\u003ctd>Finance\u003c/td>\u003ctd>90000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 2\u003c/td>\u003ctd>15151\u003c/td>\u003ctd>Mozart\u003c/td>\u003ctd>Music\u003c/td>\u003ctd>40000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 3\u003c/td>\u003ctd>98345\u003c/td>\u003ctd>Kim\u003c/td>\u003ctd>Elec. Eng.\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 4\u003c/td>\u003ctd>32343\u003c/td>\u003ctd>El Said\u003c/td>\u003ctd>History\u003c/td>\u003ctd>60000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 5\u003c/td>\u003ctd>33456\u003c/td>\u003ctd>Gold\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>87000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 6\u003c/td>\u003ctd>45565\u003c/td>\u003ctd>Katz\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>75000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 7\u003c/td>\u003ctd>58583\u003c/td>\u003ctd>Califieri\u003c/td>\u003ctd>History\u003c/td>\u003ctd>62000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 8\u003c/td>\u003ctd>76543\u003c/td>\u003ctd>Singh\u003c/td>\u003ctd>Finance\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 9\u003c/td>\u003ctd>76766\u003c/td>\u003ctd>Crick\u003c/td>\u003ctd>Biology\u003c/td>\u003ctd>72000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 10\u003c/td>\u003ctd>83821\u003c/td>\u003ctd>Brandt\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>92000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answer":"\u003cp>a. Đơn giản nhất và \u003cstrong>giữ thứ tự\u003c/strong>, nhưng phải \u003cstrong>dời nhiều record nhất\u003c/strong> → nhiều lần truy cập (với file lớn có thể là rất nhiều block).\u003c/p>\n\u003cp>b. Chỉ dời \u003cstrong>một\u003c/strong> record nên ít truy cập hơn, nhưng \u003cstrong>phá thứ tự\u003c/strong> của file (nếu file đang sắp theo khoá).\u003c/p>\n\u003cp>c. \u003cstrong>Giữ thứ tự\u003c/strong>, \u003cstrong>không dời\u003c/strong> record nào, nhưng cần thêm chi phí \u003cstrong>quản lý chỗ trống\u003c/strong> (free list). File có thể có nhiều \"lỗ\" — nếu không thỉnh thoảng dồn lại (compaction) thì hiệu năng giảm vì ít chỗ trống liên tục.\u003c/p>"},{"q":"\u003cstrong>PE 13.2\u003c/strong> — Vẽ file Figure 13.4 sau mỗi bước: (a) insert (24556, Turnamian, Finance, 98000); (b) xoá record 2; (c) insert (34556, Thompson, Music, 67000).","en":"\u003cp>\u003cstrong>Exercise 13.2.\u003c/strong> Show the structure of the file of Figure 13.4 after each of the following steps:\u003c/p>\n\u003cp>a. Insert (24556, Turnamian, Finance, 98000).\u003c/p>\n\u003cp>b. Delete record 2.\u003c/p>\n\u003cp>c. Insert (34556, Thompson, Music, 67000).\u003c/p>\n\u003cp>\u003cem>Figure 13.4 — File of instructor records (Figure 13.1) after deleting records 1, 4, and 6.\u003c/em> Deleted slots form a free list: the header points to record 1, record 1 points to record 4, record 4 points to record 6, and record 6 ends the list.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slot\u003c/th>\u003cth>ID\u003c/th>\u003cth>name\u003c/th>\u003cth>dept_name\u003c/th>\u003cth>salary\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>header\u003c/td>\u003ctd>→ 1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 0\u003c/td>\u003ctd>10101\u003c/td>\u003ctd>Srinivasan\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>65000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 1\u003c/td>\u003ctd>→ 4\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 2\u003c/td>\u003ctd>15151\u003c/td>\u003ctd>Mozart\u003c/td>\u003ctd>Music\u003c/td>\u003ctd>40000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 3\u003c/td>\u003ctd>22222\u003c/td>\u003ctd>Einstein\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>95000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 4\u003c/td>\u003ctd>→ 6\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 5\u003c/td>\u003ctd>33456\u003c/td>\u003ctd>Gold\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>87000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 6\u003c/td>\u003ctd>(end)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 7\u003c/td>\u003ctd>58583\u003c/td>\u003ctd>Califieri\u003c/td>\u003ctd>History\u003c/td>\u003ctd>62000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 8\u003c/td>\u003ctd>76543\u003c/td>\u003ctd>Singh\u003c/td>\u003ctd>Finance\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 9\u003c/td>\u003ctd>76766\u003c/td>\u003ctd>Crick\u003c/td>\u003ctd>Biology\u003c/td>\u003ctd>72000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 10\u003c/td>\u003ctd>83821\u003c/td>\u003ctd>Brandt\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>92000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 11\u003c/td>\u003ctd>98345\u003c/td>\u003ctd>Kim\u003c/td>\u003ctd>Elec. Eng.\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answer":"\u003cp>Ban đầu: header → 1 → 4 → 6 (hết).\u003c/p>\n\u003cp>a. Insert lấy chỗ đầu free list là \u003cstrong>record 1\u003c/strong>: record 1 = (24556, Turnamian, Finance, 98000); header → \u003cstrong>4\u003c/strong> → 6.\u003c/p>\n\u003cp>b. Xoá record 2: record 2 được đẩy lên đầu free list: header → \u003cstrong>2\u003c/strong> → 4 → 6. (Cũng có thể nối chuỗi khác, ví dụ header → 4 → 2 → 6, miễn là đủ các chỗ trống.)\u003c/p>\n\u003cp>c. Insert lấy \u003cstrong>record 2\u003c/strong>: record 2 = (34556, Thompson, Music, 67000); header → 4 → 6.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slot\u003c/th>\u003cth>Sau (a)\u003c/th>\u003cth>Sau (b)\u003c/th>\u003cth>Sau (c)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>header\u003c/td>\u003ctd>→ 4\u003c/td>\u003ctd>→ 2\u003c/td>\u003ctd>→ 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>24556 Turnamian\u003c/td>\u003ctd>24556 Turnamian\u003c/td>\u003ctd>24556 Turnamian\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>15151 Mozart\u003c/td>\u003ctd>→ 4\u003c/td>\u003ctd>34556 Thompson\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>→ 6\u003c/td>\u003ctd>→ 6\u003c/td>\u003ctd>→ 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>(hết)\u003c/td>\u003ctd>(hết)\u003c/td>\u003ctd>(hết)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Bài CH13.04 và CH13.05 thực hiện đúng các bước này trên bảng \u003ccode>st_file\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 13.3\u003c/strong> — Cho ví dụ instance của section và takes với 3 section, mỗi section 5 sinh viên, và một cấu trúc file dùng multitable clustering.","en":"\u003cp>\u003cstrong>Exercise 13.3.\u003c/strong> Consider the relations \u003cem>section\u003c/em> and \u003cem>takes\u003c/em>. Give an example instance of the two relations with three sections, each having five students. Then give a file structure for these relations that uses multitable clustering.\u003c/p>","answer":"\u003cp>section:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>course_id\u003c/th>\u003cth>sec_id\u003c/th>\u003cth>semester\u003c/th>\u003cth>year\u003c/th>\u003cth>building\u003c/th>\u003cth>room\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>BIO-301\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Summer\u003c/td>\u003ctd>2010\u003c/td>\u003ctd>Painter\u003c/td>\u003ctd>514\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CS-101\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fall\u003c/td>\u003ctd>2009\u003c/td>\u003ctd>Packard\u003c/td>\u003ctd>101\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CS-347\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fall\u003c/td>\u003ctd>2009\u003c/td>\u003ctd>Taylor\u003c/td>\u003ctd>3128\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>takes (5 sinh viên mỗi section): BIO-301: 17968, 59762, 78546, 89729, 98988 (grade null); CS-101: 00128 A, 12345 C, 45678 F, 54321 A−, 76543 A; CS-347: 00128 A−, 12345 A, 23856 A, 54321 A, 76543 A.\u003c/p>\n\u003cp>\u003cstrong>Multitable clustering\u003c/strong>: trong file, mỗi record section được đặt ngay trước các record takes của nó:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>BIO-301 1 Summer 2010 Painter 514\n   17968 BIO-301 1 Summer 2010 null\n   59762 ... 78546 ... 89729 ... 98988 ...\nCS-101 1 Fall 2009 Packard 101\n   00128 CS-101 1 Fall 2009 A\n   12345 ... C,  45678 ... F,  54321 ... A-,  76543 ... A\nCS-347 1 Fall 2009 Taylor 3128\n   00128 CS-347 1 Fall 2009 A-\n   12345 ... A,  23856 ... A,  54321 ... A,  76543 ... A\u003c/code>\u003c/pre>\n\u003cp>Join section ⋈ takes chỉ cần đọc tuần tự. Bài CH13.12 sinh bố cục này từ dữ liệu mẫu.\u003c/p>"},{"q":"\u003cstrong>PE 13.4\u003c/strong> — Free-space map 2 bit/block (00: 0–30%, 01: 30–60%, 10: 60–90%, 11: > 90% đầy). (a) Hai lợi ích, một nhược điểm so với 1 byte/block; (b) cập nhật bitmap khi insert/delete; (c) lợi ích so với free list.","en":"\u003cp>\u003cstrong>Exercise 13.4.\u003c/strong> Consider a free-space map kept as a bitmap with two bits per block of the file: the bits are 00 if the block is 0–30 percent full, 01 if 30–60 percent full, 10 if 60–90 percent full, and 11 if more than 90 percent full. Such bitmaps fit in memory even for very large files.\u003c/p>\n\u003cp>a. Give two benefits and one drawback of using two bits per block instead of one byte per block as described earlier in the chapter.\u003c/p>\n\u003cp>b. Explain how the bitmap is kept up to date when records are inserted and deleted.\u003c/p>\n\u003cp>c. Explain the advantage of the bitmap technique over free lists, both for searching for free space and for updating free-space information.\u003c/p>","answer":"\u003cp>a. Lợi ích: (1) \u003cstrong>tốn ít chỗ\u003c/strong> hơn (4 block mỗi byte), dễ giữ cả trong bộ nhớ; (2) \u003cstrong>ít phải cập nhật\u003c/strong> hơn — phần lớn insert/delete không làm block đổi mức. Nhược điểm: chỉ biết \u003cstrong>xấp xỉ\u003c/strong> chỗ trống → có thể lãng phí chỗ, hoặc phải đọc block lên rồi mới biết không đủ chỗ (tăng chi phí tìm).\u003c/p>\n\u003cp>b. Mỗi lần insert/delete, tính lại mức đầy của block; \u003cstrong>chỉ khi vượt qua ranh giới\u003c/strong> 30/60/90% mới sửa 2 bit tương ứng. Phần lớn trường hợp không phải chạm vào bitmap.\u003c/p>\n\u003cp>c. Free list: tìm chỗ cho record lớn (hoặc nhiều record) có thể phải duyệt nhiều phần tử trong danh sách (mỗi phần tử có thể là một I/O) mới gặp chỗ đủ lớn. Bitmap: một page bitmap mô tả rất nhiều block → tìm chỗ trống tốn rất ít I/O. Khi xoá cả block hoặc một phần lớn của nó, cập nhật bitmap cũng đơn giản hơn. Bài CH13.07–08.\u003c/p>"},{"q":"\u003cstrong>PE 13.5\u003c/strong> — Dùng cấu trúc dữ liệu (trong bộ nhớ) nào để biết nhanh một block có trong buffer không và nằm ở đâu?","en":"\u003cp>\u003cstrong>Exercise 13.5.\u003c/strong> We must be able to determine quickly whether a block is in the buffer and, if it is, where in the buffer it is. Since database buffers are very large, which in-memory data structure would you use for this?\u003c/p>","answer":"\u003cp>\u003cstrong>Hash table\u003c/strong> với khoá là định danh block (file, số block). Hàm băm chỉ tới một bucket, rồi tìm tuần tự trong bucket (rất ngắn). Thời gian tra cứu gần như hằng số dù buffer rất lớn.\u003c/p>"},{"q":"\u003cstrong>PE 13.6\u003c/strong> — Partition relation takes rất lớn thế nào, lợi ích gì, nhược điểm gì?","en":"\u003cp>\u003cstrong>Exercise 13.6.\u003c/strong> Suppose your university has accumulated a very large number of \u003cem>takes\u003c/em> records over many years. Explain how the \u003cem>takes\u003c/em> relation could be partitioned and what benefits partitioning could bring. Also explain one possible drawback of the technique.\u003c/p>","answer":"\u003cp>Partition theo \u003cstrong>(year, semester)\u003c/strong> (hoặc theo year): mỗi năm/học kỳ một partition.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lợi ích\u003c/strong>: truy vấn chỉ định năm chỉ đọc partition đó; record cũ ít dùng có thể đặt trên đĩa từ rẻ, record mới trên SSD; xoá/lưu trữ dữ liệu cũ chỉ là thao tác trên cả partition.\u003c/li>\u003cli>\u003cstrong>Nhược điểm\u003c/strong>: truy vấn lấy dữ liệu \u003cstrong>nhiều năm\u003c/strong> tốn hơn vì record nằm ở nhiều relation và nhiều block khác nhau.\u003c/li>\u003c/ul>\n\u003cp>Bài CH13.11 tạo partition bằng \u003ccode>partition by range (year)\u003c/code> của PostgreSQL.\u003c/p>"},{"q":"\u003cstrong>PE 13.7\u003c/strong> — Cho ví dụ biểu thức đại số quan hệ và chiến lược xử lý khi (a) MRU tốt hơn LRU, (b) LRU tốt hơn MRU.","en":"\u003cp>\u003cstrong>Exercise 13.7.\u003c/strong> Give a relational-algebra expression and a query-processing strategy for each of these situations:\u003c/p>\n\u003cp>a. MRU is preferable to LRU.\u003c/p>\n\u003cp>b. LRU is preferable to MRU.\u003c/p>","answer":"\u003cp>a. \u003cstrong>MRU tốt hơn\u003c/strong>: r₁ ⋈ r₂ tính bằng \u003cstrong>nested-loop\u003c/strong>: với mỗi tuple của r₂ quét lại mọi block của r₁. Xử lý xong một tuple của r₂, block cần tiếp theo là \u003cstrong>block đầu tiên\u003c/strong> của r₁ — chính là block \u003cstrong>lâu nhất chưa dùng\u003c/strong>, nên LRU sẽ thay đúng nó khi cần chỗ. MRU thay block vừa dùng (block cuối của r₁, sẽ cần lại muộn nhất).\u003c/p>\n\u003cp>b. \u003cstrong>LRU tốt hơn\u003c/strong>: r₁ ⋈ r₂ tính bằng \u003cstrong>sort-merge\u003c/strong>: sắp hai relation theo thuộc tính join rồi duyệt song song. Khi có giá trị join trùng, có thể phải \u003cstrong>lùi lại\u003c/strong> trong một relation, vượt qua ranh giới block về block \u003cstrong>vừa dùng gần nhất\u003c/strong> — MRU sẽ đã thay chính block đó.\u003c/p>\n\u003cp>Ngoài ra với MRU, một số block không dùng nữa có thể nằm mãi trong bộ nhớ; thực tế MRU chỉ dùng cho tình huống đặc biệt như nested-loop.\u003c/p>"},{"q":"\u003cstrong>PE 13.8\u003c/strong> — PostgreSQL dùng buffer nhỏ, để phần bộ nhớ còn lại cho buffer file của hệ điều hành. (a) Lợi ích, (b) hạn chế chính?","en":"\u003cp>\u003cstrong>Exercise 13.8.\u003c/strong> PostgreSQL usually keeps a small buffer of its own and leaves the rest of main memory to the operating system’s buffer manager for file-system buffering. Explain (a) the benefit of this approach and (b) one key limitation of it.\u003c/p>","answer":"\u003cp>a. CSDL không biết nhu cầu bộ nhớ của các tiến trình khác; buffer nhỏ giúp PostgreSQL \u003cstrong>không chiếm quá nhiều bộ nhớ\u003c/strong>. Đồng thời, block bị đẩy ra khỏi buffer của CSDL \u003cstrong>vẫn có thể còn trong buffer file\u003c/strong> của hệ điều hành, nên một lần buffer miss của CSDL thường không đắt (không phải đọc đĩa).\u003c/p>\n\u003cp>b. CSDL \u003cstrong>không điều khiển được chính sách thay thế\u003c/strong> của buffer hệ điều hành (và không ép được thứ tự ghi), nên hệ điều hành có thể chọn đẩy ra những block không tối ưu (ví dụ không biết mẫu truy cập của nested-loop). Ngoài ra một block có thể nằm hai lần trong bộ nhớ (double buffering).\u003c/p>"}],"exercises":[{"id":"CH13.01","topic":"fixed-length records","level":1,"prompt":"\u003cp>Record instructor độ dài cố định 53 byte (5 + 20 + 20 + 8), record \u003cstrong>không\u003c/strong> được vắt qua hai block. Với các kích thước block 2048, 4096 và 8192 byte, trả về \u003ccode>block_bytes\u003c/code>, \u003ccode>records_per_block\u003c/code>, \u003ccode>wasted_bytes\u003c/code> (phần dư mỗi block), và \u003ccode>blocks_for_10000\u003c/code> = số block cần để lưu 10 000 record instructor.\u003c/p>","en":"","hint":"","solution":"select b as block_bytes,\n       b / 53 as records_per_block,\n       b - (b / 53) * 53 as wasted_bytes,\n       ceil(10000.0 / (b / 53)) as blocks_for_10000\nfrom (values (2048), (4096), (8192)) as t(b);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["block_bytes","records_per_block","wasted_bytes","blocks_for_10000"],"rows":[["2048","38","34","264"],["4096","77","15","130"],["8192","154","30","65"]]}},{"id":"CH13.02","topic":"variable-length storage","level":1,"prompt":"\u003cp>Trong PostgreSQL varchar là kiểu độ dài thay đổi: giá trị ngắn được lưu bằng 1 byte header + nội dung. Với mỗi instructor trả về ID, name, \u003ccode>chars\u003c/code> = octet_length(name) và \u003ccode>stored_bytes\u003c/code> = \u003ccode>pg_column_size(name)\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select ID, name, octet_length(name) as chars, pg_column_size(name) as stored_bytes\nfrom instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","name","chars","stored_bytes"],"rows":[["10101","Srinivasan","10","11"],["12121","Wu","2","3"],["15151","Mozart","6","7"],["22222","Einstein","8","9"],["32343","El Said","7","8"],["33456","Gold","4","5"],["45565","Katz","4","5"],["58583","Califieri","9","10"],["76543","Singh","5","6"],["76766","Crick","5","6"],["83821","Brandt","6","7"],["98345","Kim","3","4"]]}},{"id":"CH13.03","topic":"char vs varchar","level":2,"prompt":"\u003cp>So sánh tổng số byte để lưu \u003cstrong>tên của mọi instructor\u003c/strong> nếu cột name là \u003ccode>char(20)\u003c/code> (độ dài cố định) và nếu là \u003ccode>varchar(20)\u003c/code>: trả về một dòng hai cột \u003ccode>as_char\u003c/code>, \u003ccode>as_varchar\u003c/code> (dùng \u003ccode>pg_column_size\u003c/code>).\u003c/p>","en":"","hint":"","solution":"select sum(pg_column_size(name::char(20))) as as_char,\n       sum(pg_column_size(name::varchar(20))) as as_varchar\nfrom instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["as_char","as_varchar"],"rows":[["288","81"]]}},{"id":"CH13.04","topic":"PE 13.2a free list insert","level":2,"prompt":"\u003cp>\u003ccode>st_file(slot, id, name, dept_name, salary, next_free)\u003c/code> là file của Figure 13.4: slot −1 là \u003cstrong>header\u003c/strong>; slot trống có id null và next_free trỏ tới slot trống kế tiếp. Viết lệnh \u003cstrong>insert (24556, Turnamian, Finance, 98000)\u003c/strong> đúng theo free list: ghi vào slot mà header trỏ tới (đặt next_free của slot đó thành null) và cho header trỏ sang slot trống kế tiếp. Không được viết cứng số slot. Hệ thống đọc lại toàn bộ st_file.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.2 (a).\u003c/strong> Show the structure of the file of Figure 13.4 after each of the following steps:\u003c/p>\n\u003cp>a. Insert (24556, Turnamian, Finance, 98000).\u003c/p>\n\u003cp>\u003cem>Figure 13.4 — File of instructor records (Figure 13.1) after deleting records 1, 4, and 6.\u003c/em> Deleted slots form a free list: the header points to record 1, record 1 points to record 4, record 4 points to record 6, and record 6 ends the list.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slot\u003c/th>\u003cth>ID\u003c/th>\u003cth>name\u003c/th>\u003cth>dept_name\u003c/th>\u003cth>salary\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>header\u003c/td>\u003ctd>→ 1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 0\u003c/td>\u003ctd>10101\u003c/td>\u003ctd>Srinivasan\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>65000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 1\u003c/td>\u003ctd>→ 4\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 2\u003c/td>\u003ctd>15151\u003c/td>\u003ctd>Mozart\u003c/td>\u003ctd>Music\u003c/td>\u003ctd>40000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 3\u003c/td>\u003ctd>22222\u003c/td>\u003ctd>Einstein\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>95000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 4\u003c/td>\u003ctd>→ 6\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 5\u003c/td>\u003ctd>33456\u003c/td>\u003ctd>Gold\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>87000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 6\u003c/td>\u003ctd>(end)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 7\u003c/td>\u003ctd>58583\u003c/td>\u003ctd>Califieri\u003c/td>\u003ctd>History\u003c/td>\u003ctd>62000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 8\u003c/td>\u003ctd>76543\u003c/td>\u003ctd>Singh\u003c/td>\u003ctd>Finance\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 9\u003c/td>\u003ctd>76766\u003c/td>\u003ctd>Crick\u003c/td>\u003ctd>Biology\u003c/td>\u003ctd>72000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 10\u003c/td>\u003ctd>83821\u003c/td>\u003ctd>Brandt\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>92000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 11\u003c/td>\u003ctd>98345\u003c/td>\u003ctd>Kim\u003c/td>\u003ctd>Elec. Eng.\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"Một câu \u003ccode>with old as (select ...), h as (update st_file set next_free = ... where slot = -1 returning 1) update st_file ... where slot = (select s from old);\u003c/code> — mọi phần của câu nhìn cùng một trạng thái ban đầu.","solution":"with old as (\n  select h.next_free as s, f.next_free as nxt\n  from st_file h join st_file f on f.slot = h.next_free\n  where h.slot = -1),\nhdr as (\n  update st_file set next_free = (select nxt from old) where slot = -1 returning 1)\nupdate st_file\nset id = '24556', name = 'Turnamian', dept_name = 'Finance', salary = 98000, next_free = null\nwhere slot = (select s from old);","check":"select * from st_file order by slot;","ordered":false,"fresh":false,"expected":{"fields":["slot","id","name","dept_name","salary","next_free"],"rows":[["-1",null,null,null,null,"4"],["0","10101","Srinivasan","Comp. Sci.","65000",null],["1","24556","Turnamian","Finance","98000",null],["2","15151","Mozart","Music","40000",null],["3","22222","Einstein","Physics","95000",null],["4",null,null,null,null,"6"],["5","33456","Gold","Physics","87000",null],["6",null,null,null,null,null],["7","58583","Califieri","History","62000",null],["8","76543","Singh","Finance","80000",null],["9","76766","Crick","Biology","72000",null],["10","83821","Brandt","Comp. Sci.","92000",null],["11","98345","Kim","Elec. Eng.","80000",null]]}},{"id":"CH13.05","topic":"PE 13.2 insert, delete, insert","level":3,"prompt":"\u003cp>Thực hiện \u003cstrong>cả ba bước\u003c/strong> của PE 13.2 trên \u003ccode>st_file\u003c/code>, mỗi bước theo đúng quy tắc free list (insert lấy slot ở đầu free list; delete đẩy slot vừa trống lên đầu free list và xoá nội dung của nó): (a) insert (24556, Turnamian, Finance, 98000); (b) delete record ở slot 2; (c) insert (34556, Thompson, Music, 67000). Hệ thống đọc lại toàn bộ st_file.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.2.\u003c/strong> Show the structure of the file of Figure 13.4 after each of the following steps:\u003c/p>\n\u003cp>a. Insert (24556, Turnamian, Finance, 98000).\u003c/p>\n\u003cp>b. Delete record 2.\u003c/p>\n\u003cp>c. Insert (34556, Thompson, Music, 67000).\u003c/p>\n\u003cp>\u003cem>Figure 13.4 — File of instructor records (Figure 13.1) after deleting records 1, 4, and 6.\u003c/em> Deleted slots form a free list: the header points to record 1, record 1 points to record 4, record 4 points to record 6, and record 6 ends the list.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Slot\u003c/th>\u003cth>ID\u003c/th>\u003cth>name\u003c/th>\u003cth>dept_name\u003c/th>\u003cth>salary\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>header\u003c/td>\u003ctd>→ 1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 0\u003c/td>\u003ctd>10101\u003c/td>\u003ctd>Srinivasan\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>65000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 1\u003c/td>\u003ctd>→ 4\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 2\u003c/td>\u003ctd>15151\u003c/td>\u003ctd>Mozart\u003c/td>\u003ctd>Music\u003c/td>\u003ctd>40000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 3\u003c/td>\u003ctd>22222\u003c/td>\u003ctd>Einstein\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>95000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 4\u003c/td>\u003ctd>→ 6\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 5\u003c/td>\u003ctd>33456\u003c/td>\u003ctd>Gold\u003c/td>\u003ctd>Physics\u003c/td>\u003ctd>87000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 6\u003c/td>\u003ctd>(end)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 7\u003c/td>\u003ctd>58583\u003c/td>\u003ctd>Califieri\u003c/td>\u003ctd>History\u003c/td>\u003ctd>62000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 8\u003c/td>\u003ctd>76543\u003c/td>\u003ctd>Singh\u003c/td>\u003ctd>Finance\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 9\u003c/td>\u003ctd>76766\u003c/td>\u003ctd>Crick\u003c/td>\u003ctd>Biology\u003c/td>\u003ctd>72000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 10\u003c/td>\u003ctd>83821\u003c/td>\u003ctd>Brandt\u003c/td>\u003ctd>Comp. Sci.\u003c/td>\u003ctd>92000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record 11\u003c/td>\u003ctd>98345\u003c/td>\u003ctd>Kim\u003c/td>\u003ctd>Elec. Eng.\u003c/td>\u003ctd>80000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"Delete slot k: next_free của k = next_free hiện tại của header; header trỏ tới k.","solution":"with old as (\n  select h.next_free as s, f.next_free as nxt\n  from st_file h join st_file f on f.slot = h.next_free where h.slot = -1),\nhdr as (update st_file set next_free = (select nxt from old) where slot = -1 returning 1)\nupdate st_file set id = '24556', name = 'Turnamian', dept_name = 'Finance', salary = 98000, next_free = null\nwhere slot = (select s from old);\n\nwith h as (select next_free as s from st_file where slot = -1),\nhdr as (update st_file set next_free = 2 where slot = -1 returning 1)\nupdate st_file set id = null, name = null, dept_name = null, salary = null, next_free = (select s from h)\nwhere slot = 2;\n\nwith old as (\n  select h.next_free as s, f.next_free as nxt\n  from st_file h join st_file f on f.slot = h.next_free where h.slot = -1),\nhdr as (update st_file set next_free = (select nxt from old) where slot = -1 returning 1)\nupdate st_file set id = '34556', name = 'Thompson', dept_name = 'Music', salary = 67000, next_free = null\nwhere slot = (select s from old);","check":"select * from st_file order by slot;","ordered":false,"fresh":false,"expected":{"fields":["slot","id","name","dept_name","salary","next_free"],"rows":[["-1",null,null,null,null,"4"],["0","10101","Srinivasan","Comp. Sci.","65000",null],["1","24556","Turnamian","Finance","98000",null],["2","34556","Thompson","Music","67000",null],["3","22222","Einstein","Physics","95000",null],["4",null,null,null,null,"6"],["5","33456","Gold","Physics","87000",null],["6",null,null,null,null,null],["7","58583","Califieri","History","62000",null],["8","76543","Singh","Finance","80000",null],["9","76766","Crick","Biology","72000",null],["10","83821","Brandt","Comp. Sci.","92000",null],["11","98345","Kim","Elec. Eng.","80000",null]]}},{"id":"CH13.06","topic":"walk the free list","level":2,"prompt":"\u003cp>Liệt kê các slot trống của \u003ccode>st_file\u003c/code> \u003cstrong>theo thứ tự trong free list\u003c/strong>, bắt đầu từ slot mà header trỏ tới: cột \u003ccode>pos\u003c/code> (1, 2, …) và \u003ccode>slot\u003c/code>.\u003c/p>","en":"","hint":"\u003ccode>with recursive\u003c/code> đi theo next_free.","solution":"with recursive fl (pos, slot) as (\n  select 1, next_free from st_file where slot = -1 and next_free is not null\n  union all\n  select fl.pos + 1, f.next_free\n  from fl join st_file f on f.slot = fl.slot\n  where f.next_free is not null)\nselect pos, slot from fl order by pos;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["pos","slot"],"rows":[["1","1"],["2","4"],["3","6"]]}},{"id":"CH13.07","topic":"PE 13.4 2-bit free-space map","level":2,"prompt":"\u003cp>\u003ccode>st_block(block_no, used_bytes)\u003c/code> cho biết số byte đã dùng của mỗi block 8192 byte. Tính free-space map 2 bit của PE 13.4: \u003ccode>pct\u003c/code> = tỉ lệ đầy (%, làm tròn 1 chữ số) và \u003ccode>bits\u003c/code>: '00' nếu dưới 30%, '01' nếu từ 30% tới dưới 60%, '10' nếu từ 60% tới dưới 90%, '11' nếu từ 90% trở lên. Trả về block_no, pct, bits.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.4.\u003c/strong> Consider a free-space map kept as a bitmap with two bits per block of the file: the bits are 00 if the block is 0–30 percent full, 01 if 30–60 percent full, 10 if 60–90 percent full, and 11 if more than 90 percent full. Such bitmaps fit in memory even for very large files.\u003c/p>\n\u003cp>a. Give two benefits and one drawback of using two bits per block instead of one byte per block as described earlier in the chapter.\u003c/p>\n\u003cp>b. Explain how the bitmap is kept up to date when records are inserted and deleted.\u003c/p>\n\u003cp>c. Explain the advantage of the bitmap technique over free lists, both for searching for free space and for updating free-space information.\u003c/p>","hint":"So sánh trên giá trị chưa làm tròn: block 7 dùng 2457 byte = 29.99% → 00.","solution":"select block_no,\n       round(100.0 * used_bytes / 8192, 1) as pct,\n       case when 100.0 * used_bytes / 8192 \u003c 30 then '00'\n            when 100.0 * used_bytes / 8192 \u003c 60 then '01'\n            when 100.0 * used_bytes / 8192 \u003c 90 then '10'\n            else '11' end as bits\nfrom st_block;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["block_no","pct","bits"],"rows":[["0","98.9","11"],["1","24.4","00"],["2","54.9","01"],["3","85.4","10"],["4","3.7","00"],["5","100","11"],["6","61","10"],["7","30","00"],["8","90.3","11"],["9","0","00"]]}},{"id":"CH13.08","topic":"search with the bitmap","level":3,"prompt":"\u003cp>Chỉ nhìn \u003cstrong>bitmap 2 bit\u003c/strong> (không biết used_bytes chính xác), những block nào \u003cstrong>chắc chắn\u003c/strong> còn ít nhất \u003cstrong>3000 byte\u003c/strong> trống? Mã 00 bảo đảm còn ≥ 70% trống, 01 bảo đảm ≥ 40%, 10 bảo đảm ≥ 10%, 11 không bảo đảm gì. Trả về block_no và \u003ccode>guaranteed_free\u003c/code> (số byte trống tối thiểu được bảo đảm, lấy phần nguyên) của các block đó.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.4.\u003c/strong> Consider a free-space map kept as a bitmap with two bits per block of the file: the bits are 00 if the block is 0–30 percent full, 01 if 30–60 percent full, 10 if 60–90 percent full, and 11 if more than 90 percent full. Such bitmaps fit in memory even for very large files.\u003c/p>\n\u003cp>a. Give two benefits and one drawback of using two bits per block instead of one byte per block as described earlier in the chapter.\u003c/p>\n\u003cp>b. Explain how the bitmap is kept up to date when records are inserted and deleted.\u003c/p>\n\u003cp>c. Explain the advantage of the bitmap technique over free lists, both for searching for free space and for updating free-space information.\u003c/p>","hint":"","solution":"with m as (\n  select block_no,\n         case when 100.0 * used_bytes / 8192 \u003c 30 then 0.70\n              when 100.0 * used_bytes / 8192 \u003c 60 then 0.40\n              when 100.0 * used_bytes / 8192 \u003c 90 then 0.10\n              else 0 end as free_frac\n  from st_block)\nselect block_no, floor(free_frac * 8192) as guaranteed_free\nfrom m\nwhere free_frac * 8192 >= 3000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["block_no","guaranteed_free"],"rows":[["1","5734"],["2","3276"],["4","5734"],["7","5734"],["9","5734"]]}},{"id":"CH13.09","topic":"LRU simulation","level":3,"prompt":"\u003cp>\u003ccode>st_buffer_trace(seq, block_id)\u003c/code> là chuỗi yêu cầu block. Buffer có \u003cstrong>3 frame\u003c/strong>, dùng \u003cstrong>LRU\u003c/strong>. Lần truy cập ở vị trí s là \u003cstrong>hit\u003c/strong> khi và chỉ khi block đó đã được truy cập trước, ở lần gần nhất p, và số block \u003cstrong>khác nhau\u003c/strong> được truy cập giữa p và s (không kể hai đầu) nhỏ hơn 3. Trả về seq, block_id, \u003ccode>hit\u003c/code> (boolean), sắp theo seq.\u003c/p>","en":"","hint":"Với mỗi s: p = max(seq) \u003c s cùng block; đếm \u003ccode>count(distinct block_id)\u003c/code> trong (p, s).","solution":"select t.seq, t.block_id,\n       prev.p is not null\n         and (select count(distinct m.block_id) from st_buffer_trace m\n              where m.seq > prev.p and m.seq \u003c t.seq) \u003c 3 as hit\nfrom st_buffer_trace t\ncross join lateral (select max(seq) as p from st_buffer_trace x\n                    where x.block_id = t.block_id and x.seq \u003c t.seq) as prev\norder by t.seq;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["seq","block_id","hit"],"rows":[["1","A","false"],["2","B","false"],["3","C","false"],["4","A","true"],["5","D","false"],["6","B","false"],["7","A","true"],["8","E","false"],["9","C","false"],["10","A","true"],["11","B","false"],["12","D","false"],["13","A","true"],["14","E","false"]]}},{"id":"CH13.10","topic":"buffer size vs hits","level":3,"prompt":"\u003cp>Dùng cùng quy tắc LRU như CH13.09, đếm số \u003cstrong>hit\u003c/strong> trên st_buffer_trace với buffer \u003cstrong>2, 3, 4 và 5\u003c/strong> frame. Trả về \u003ccode>frames\u003c/code>, \u003ccode>hits\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select k as frames,\n       count(*) filter (where prev.p is not null\n                        and (select count(distinct m.block_id) from st_buffer_trace m\n                             where m.seq > prev.p and m.seq \u003c t.seq) \u003c k) as hits\nfrom (values (2), (3), (4), (5)) as f(k)\ncross join st_buffer_trace t\ncross join lateral (select max(seq) as p from st_buffer_trace x\n                    where x.block_id = t.block_id and x.seq \u003c t.seq) as prev\ngroup by k;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["frames","hits"],"rows":[["2","0"],["3","4"],["4","6"],["5","9"]]}},{"id":"CH13.11","topic":"PE 13.6 partitioning","level":2,"prompt":"\u003cp>Tạo bảng \u003ccode>st_takes_part\u003c/code> có cùng các cột như takes (ID, course_id, sec_id, semester, year, grade), \u003cstrong>partition by range (year)\u003c/strong>, với hai partition \u003ccode>st_takes_2017\u003c/code> (year từ 2017 tới trước 2018) và \u003ccode>st_takes_2018\u003c/code> (từ 2018 tới trước 2019). Chép mọi dòng của takes vào st_takes_part. Hệ thống đếm số dòng của mỗi partition.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.6.\u003c/strong> Suppose your university has accumulated a very large number of \u003cem>takes\u003c/em> records over many years. Explain how the \u003cem>takes\u003c/em> relation could be partitioned and what benefits partitioning could bring. Also explain one possible drawback of the technique.\u003c/p>","hint":"","solution":"create table st_takes_part (\n  ID varchar(5), course_id varchar(8), sec_id varchar(8),\n  semester varchar(6), year numeric(4,0), grade varchar(2)\n) partition by range (year);\ncreate table st_takes_2017 partition of st_takes_part for values from (2017) to (2018);\ncreate table st_takes_2018 partition of st_takes_part for values from (2018) to (2019);\ninsert into st_takes_part select ID, course_id, sec_id, semester, year, grade from takes;","check":"select tableoid::regclass::text as partition, count(*) as num_rows\nfrom st_takes_part group by tableoid order by 1;","ordered":false,"fresh":false,"expected":{"fields":["partition","num_rows"],"rows":[["st_takes_2017","13"],["st_takes_2018","9"]]}},{"id":"CH13.12","topic":"PE 13.3 multitable clustering","level":3,"prompt":"\u003cp>Sinh bố cục file \u003cstrong>multitable clustering\u003c/strong> của section và takes cho các section \u003cstrong>Fall 2017\u003c/strong>: mỗi record section, ngay sau là các record takes của nó. Cột: course_id, sec_id, \u003ccode>rec_type\u003c/code> ('section' hoặc 'takes'), \u003ccode>info\u003c/code> (với section: building || ' ' || room_number; với takes: ID). Sắp theo course_id, sec_id, section trước takes, rồi theo ID.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 13.3.\u003c/strong> Consider the relations \u003cem>section\u003c/em> and \u003cem>takes\u003c/em>. Give an example instance of the two relations with three sections, each having five students. Then give a file structure for these relations that uses multitable clustering.\u003c/p>","hint":"","solution":"select course_id, sec_id, rec_type, info\nfrom (select course_id, sec_id, 'section' as rec_type, building || ' ' || room_number as info, 0 as k\n      from section where semester = 'Fall' and year = 2017\n      union all\n      select course_id, sec_id, 'takes', ID, 1\n      from takes where semester = 'Fall' and year = 2017) as f\norder by course_id, sec_id, k, info;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["course_id","sec_id","rec_type","info"],"rows":[["CS-101","1","section","Packard 101"],["CS-101","1","takes","00128"],["CS-101","1","takes","12345"],["CS-101","1","takes","45678"],["CS-101","1","takes","54321"],["CS-101","1","takes","76543"],["CS-101","1","takes","98765"],["CS-347","1","section","Taylor 3128"],["CS-347","1","takes","00128"],["CS-347","1","takes","12345"],["PHY-101","1","section","Watson 100"],["PHY-101","1","takes","44553"]]}},{"id":"CH13.13","topic":"row vs column store","level":2,"prompt":"\u003cp>\u003ccode>st_column_spec(column_name, bytes)\u003c/code> là các cột của một bảng sales có \u003cstrong>1 000 000\u003c/strong> dòng. Truy vấn phân tích chỉ cần các cột sale_date, quantity, unit_price. Trả về một dòng: \u003ccode>row_store_mb\u003c/code> (row store phải đọc cả tuple), \u003ccode>column_store_mb\u003c/code> (chỉ đọc 3 cột), làm tròn 1 chữ số với 1 MB = 1 048 576 byte, và \u003ccode>ratio\u003c/code> = row_store / column_store làm tròn 1 chữ số.\u003c/p>","en":"","hint":"","solution":"select round(sum(bytes) * 1000000.0 / 1048576, 1) as row_store_mb,\n       round(sum(bytes) filter (where column_name in ('sale_date', 'quantity', 'unit_price')) * 1000000.0 / 1048576, 1) as column_store_mb,\n       round(sum(bytes)::numeric / sum(bytes) filter (where column_name in ('sale_date', 'quantity', 'unit_price')), 1) as ratio\nfrom st_column_spec;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["row_store_mb","column_store_mb","ratio"],"rows":[["122.1","15.3","8"]]}},{"id":"CH13.14","topic":"slotted page, ctid","level":2,"prompt":"\u003cp>PostgreSQL định danh mỗi tuple bằng \u003ccode>ctid = (block, slot)\u003c/code> của slotted page. Tạo bảng \u003ccode>st_slot_demo(name varchar(10))\u003c/code>, chèn lần lượt 'a', 'b', 'c'; xoá 'b'; cập nhật 'c' thành 'c2'; chèn 'd'. Trả về name và \u003ccode>ctid::text\u003c/code> của các tuple còn lại, sắp theo name. (Quan sát: slot của 'b' không được dùng lại ngay, và update tạo một \u003cstrong>phiên bản tuple mới\u003c/strong> ở slot mới.)\u003c/p>","en":"","hint":"","solution":"create table st_slot_demo (name varchar(10));\ninsert into st_slot_demo values ('a');\ninsert into st_slot_demo values ('b');\ninsert into st_slot_demo values ('c');\ndelete from st_slot_demo where name = 'b';\nupdate st_slot_demo set name = 'c2' where name = 'c';\ninsert into st_slot_demo values ('d');\nselect name, ctid::text as ctid from st_slot_demo order by name;","check":null,"ordered":false,"fresh":true,"expected":{"fields":["name","ctid"],"rows":[["a","(0,1)"],["c2","(0,4)"],["d","(0,5)"]]}}]},{"key":"ch14","store":"14","short":"14","label":"Chương 14","navLabel":"Chương 14","kind":"Chương","title":"Indexing","titleVi":"Index","summary":"\u003ch3>1. Khái niệm cơ bản (slide 14.3–14.5)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Search key\u003c/strong>: thuộc tính (hoặc tập thuộc tính) dùng để tìm record. Index file gồm các \u003cstrong>index entry\u003c/strong> (search-key, pointer).\u003c/li>\u003cli>Hai loại chính: \u003cstrong>ordered index\u003c/strong> (khoá được sắp) và \u003cstrong>hash index\u003c/strong> (khoá phân phối vào bucket bằng hàm băm).\u003c/li>\u003cli>Tiêu chí đánh giá: kiểu truy cập hỗ trợ (tìm theo giá trị / theo \u003cstrong>khoảng\u003c/strong>), thời gian truy cập, thời gian insert, thời gian delete, chi phí chỗ.\u003c/li>\u003c/ul>\n\u003ch3>2. Ordered index (slide 14.6–14.17)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Loại\u003c/th>\u003cth>Định nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Clustering index\u003c/strong> (primary index)\u003c/td>\u003ctd>thứ tự search key của index \u003cstrong>trùng\u003c/strong> thứ tự lưu record trong file (file tuần tự); search key thường (không bắt buộc) là primary key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Secondary index\u003c/strong> (nonclustering)\u003c/td>\u003ctd>thứ tự khác thứ tự file; \u003cstrong>phải dense\u003c/strong>; mỗi entry trỏ tới một \u003cstrong>bucket\u003c/strong> chứa con trỏ tới mọi record có giá trị đó\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Dense index\u003c/strong>\u003c/td>\u003ctd>mỗi giá trị search key trong file có một entry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sparse index\u003c/strong>\u003c/td>\u003ctd>chỉ một số giá trị có entry (thường là record \u003cstrong>đầu mỗi block\u003c/strong>); chỉ dùng được khi file được sắp theo search key. Tìm k: lấy entry có khoá \u003cstrong>lớn nhất ≤ k\u003c/strong>, rồi quét tuần tự từ đó\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Một relation chỉ có \u003cstrong>một clustering index\u003c/strong> (record chỉ sắp theo một thứ tự được — PE 14.2), nhưng nhiều secondary index.\u003c/li>\u003cli>Quét tuần tự theo secondary index rất tốn: mỗi record có thể nằm ở một block khác → một I/O cho mỗi record.\u003c/li>\u003cli>\u003cstrong>Multilevel index\u003c/strong>: index quá lớn thì coi nó như file tuần tự và lập \u003cstrong>sparse index\u003c/strong> trên nó (outer index trên inner index), lặp lại tới khi vừa bộ nhớ.\u003c/li>\u003cli>Cập nhật index: insert/delete phải sửa mọi index của relation → \u003cstrong>không nên tạo index trên mọi thuộc tính\u003c/strong> (PE 14.1).\u003c/li>\u003cli>\u003cstrong>Composite search key\u003c/strong> (a₁, a₂): sắp theo \u003cstrong>thứ tự từ điển\u003c/strong> — index (dept_name, salary) dùng được cho điều kiện trên dept_name, hoặc dept_name = … and salary \u003c …, nhưng \u003cstrong>không\u003c/strong> hiệu quả cho chỉ điều kiện trên salary.\u003c/li>\u003c/ul>\n\u003ch3>3. B+-tree (slide 14.18–14.45)\u003c/h3>\n\u003cp>Cây cân bằng, mọi đường từ gốc tới lá dài bằng nhau. Với \u003cstrong>n\u003c/strong> = số con trỏ tối đa trong một nút:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nút\u003c/th>\u003cth>Số con trỏ / khoá\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Nút trong (không phải gốc)\u003c/td>\u003ctd>từ ⌈n/2⌉ tới n \u003cstrong>con trỏ\u003c/strong> con\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lá\u003c/td>\u003ctd>từ ⌈(n−1)/2⌉ tới n − 1 \u003cstrong>khoá\u003c/strong> (mỗi khoá kèm con trỏ tới record), con trỏ thứ n nối sang lá kế tiếp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gốc\u003c/td>\u003ctd>nếu không là lá: ít nhất 2 con; nếu là lá: 0 tới n − 1 khoá\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Nút trong: P₁, K₁, P₂, …, K\u003csub>n−1\u003c/sub>, P\u003csub>n\u003c/sub>; cây con P\u003csub>i\u003c/sub> chứa khoá ≥ K\u003csub>i−1\u003c/sub> và \u003c K\u003csub>i\u003c/sub>.\u003c/li>\u003cli>\u003cstrong>Chiều cao\u003c/strong>: với K khoá, đường từ gốc tới lá dài không quá \u003cstrong>⌈log\u003csub>⌈n/2⌉\u003c/sub>(K)⌉\u003c/strong>. Ví dụ: nút 4 KB, n ≈ 100, 1 triệu khoá → tối đa log₅₀(10⁶) ≈ 4 nút được truy cập; cây nhị phân cân bằng cần khoảng 20.\u003c/li>\u003cli>\u003cstrong>Fan-out\u003c/strong>: với block B byte, khoá k byte, con trỏ p byte: n·p + (n − 1)·k ≤ B → n = ⌊(B + k)/(k + p)⌋.\u003c/li>\u003cli>\u003cstrong>Tìm kiếm\u003c/strong> (find): từ gốc, ở mỗi nút chọn con trỏ theo khoá, tới lá. \u003cstrong>Range query\u003c/strong> (findRange / iterator): tới lá đầu tiên rồi đi theo con trỏ nối các lá (PE 14.6).\u003c/li>\u003cli>\u003cstrong>Insert\u003c/strong>: chèn vào lá; nếu lá đầy (n khoá) → \u003cstrong>split\u003c/strong>: ⌈n/2⌉ khoá đầu ở lại, phần còn lại sang lá mới; chèn (khoá nhỏ nhất của lá mới, con trỏ) vào nút cha; cha đầy thì split tiếp, có thể lan tới gốc (cây cao thêm một mức).\u003c/li>\u003cli>\u003cstrong>Delete\u003c/strong>: xoá khỏi lá; nếu lá quá vơi → \u003cstrong>merge\u003c/strong> với anh em (nếu vừa một nút) hoặc \u003cstrong>redistribute\u003c/strong> (mượn khoá); xoá entry ở cha, có thể lan lên; gốc chỉ còn một con thì bỏ gốc.\u003c/li>\u003cli>\u003cstrong>Chèn theo thứ tự sắp xếp\u003c/strong>: mỗi lá bị tách chỉ còn \u003cstrong>khoảng 50%\u003c/strong> và không được chèn thêm (PE 14.7) → dùng \u003cstrong>bulk loading\u003c/strong>: sắp các entry rồi xây cây \u003cstrong>từ dưới lên\u003c/strong> (bottom-up), lấp đầy từng lá (PE 14.8).\u003c/li>\u003cli>\u003cstrong>Search key không unique\u003c/strong>: thêm thuộc tính duy nhất (ví dụ primary key) vào search key để thành unique (record ID).\u003c/li>\u003cli>\u003cstrong>B+-tree file organization\u003c/strong>: lá chứa chính record. \u003cstrong>Secondary index trỏ tới search key của clustering index\u003c/strong> thay vì địa chỉ record để không phải sửa khi record bị dời (split lá).\u003c/li>\u003cli>\u003cstrong>Khoá chuỗi độ dài thay đổi\u003c/strong>: \u003cstrong>prefix compression\u003c/strong> — nút trong chỉ lưu tiền tố đủ phân biệt.\u003c/li>\u003cli>\u003cstrong>B-tree\u003c/strong> (không có dấu +): khoá chỉ xuất hiện một lần, nút trong cũng chứa con trỏ record — ít lợi hơn trong thực tế.\u003c/li>\u003c/ul>\n\u003ch3>4. Hash index (slide 14.46–14.57)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Bucket\u003c/strong>: đơn vị lưu (một hoặc vài block). Hàm băm h: khoá → bucket. Hàm băm tốt: \u003cstrong>uniform\u003c/strong> và \u003cstrong>random\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Bucket overflow\u003c/strong> do skew hoặc quá ít bucket → \u003cstrong>overflow chaining\u003c/strong> (closed addressing).\u003c/li>\u003cli>\u003cstrong>Static hashing\u003c/strong>: số bucket cố định → khi dữ liệu tăng sẽ nhiều overflow; \u003cstrong>dynamic hashing\u003c/strong> (linear hashing, extendable hashing) tăng số bucket dần.\u003c/li>\u003cli>Hash index chỉ tốt cho \u003cstrong>so sánh bằng\u003c/strong>, không hỗ trợ \u003cstrong>range query\u003c/strong>. PostgreSQL có \u003ccode>using hash\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3>5. Index nhiều khoá (slide 14.58–14.64)\u003c/h3>\n\u003cul>\u003cli>Điều kiện dept_name = 'Finance' and salary = 80000: dùng index dept_name rồi lọc; dùng index salary rồi lọc; hoặc \u003cstrong>giao hai tập con trỏ\u003c/strong> từ hai index.\u003c/li>\u003cli>\u003cstrong>Composite index\u003c/strong> (dept_name, salary) hiệu quả cho dept_name = … and salary \u003c … nhưng không cho dept_name \u003c … and salary \u003c ….\u003c/li>\u003cli>\u003cstrong>Covering index\u003c/strong>: lưu thêm thuộc tính (không thuộc search key) trong index để trả lời truy vấn \u003cstrong>không cần đọc relation\u003c/strong> (PostgreSQL: \u003ccode>include (...)\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3>6. Tạo index trong SQL (slide 14.65)\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create index dept_index on instructor (dept_name);\ncreate unique index ... ;          -- đồng thời ép ràng buộc unique\ncreate index ... on instructor (dept_name, salary);        -- composite\ncreate index ... on instructor (salary) where salary &gt; 80000; -- partial (PostgreSQL)\ncreate index ... on student (lower(name));                 -- expression index\ncreate index ... on takes (course_id) include (grade);     -- covering\ncreate index ... using hash (name);\ndrop index dept_index;\u0
