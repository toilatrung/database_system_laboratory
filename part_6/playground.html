<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Part 6 — Chương 15 và 16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script>
// Theme: the saved choice, else the OS setting; applied before first paint. Any [data-theme-toggle] flips it.
(() => {
  const KEY = 'cs4420:theme', root = document.documentElement;
  const saved = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  const system = () => (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const label = t => (t === 'light' ? 'Chuyển sang giao diện tối' : 'Chuyển sang giao diện sáng');
  const apply = t => {
    root.dataset.theme = t;
    document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.setAttribute('aria-label', label(t)); b.dataset.tip = label(t); });
  };
  apply(saved() || system());
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!saved()) apply(system()); });
  addEventListener('storage', e => { if (e.key === KEY) apply(saved() || system()); });
  document.addEventListener('DOMContentLoaded', () => apply(root.dataset.theme));
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-theme-toggle]')) return;
    const t = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(KEY, JSON.stringify(t)); } catch { /* storage unavailable */ }
    apply(t);
  });
})();

// Online sync: every cs4420* key (except the per-device theme) is mirrored to /api/sync (api/sync.js).
// Pages write through lxStore so each change is stamped and queued; the newest write per key wins.
// Without the API (local serve, or Redis not configured) everything stays in this browser only.
(() => {
  const API = '/api/sync', PENDING = 'lxsync:pending', STAMPS = 'lxsync:stamps', INIT = 'lxsync:init';
  const syncable = k => k.startsWith('cs4420') && k !== 'cs4420:theme';
  const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } };
  let state = 'busy', lastSync = 0, lastPull = 0, disabled = false, pushing = false, timer = 0;

  const TEXT = {
    busy: ['Đang đồng bộ…', 'Đang đồng bộ tiến độ lên online…'],
    ok: ['Đã lưu online', 'Đã lưu online lúc '],
    err: ['Lỗi đồng bộ', 'Chưa lưu online được, sẽ thử lại. Bấm để thử ngay.'],
    local: ['Chỉ lưu trên máy này', 'Chỉ lưu trong trình duyệt này: lưu online chưa được bật.'],
  };
  const show = s => {
    state = s;
    const [short, long] = TEXT[s];
    const tip = s === 'ok' ? long + new Date(lastSync).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + '. Bấm để đồng bộ ngay.' : long;
    document.querySelectorAll('[data-sync]').forEach(b => { b.className = b.className.replace(/\bis-(busy|ok|err|local)\b/g, '').trim() + ' is-' + s; b.dataset.tip = tip; b.setAttribute('aria-label', tip); });
    document.querySelectorAll('[data-sync-text]').forEach(el => { el.textContent = short; });
  };

  const record = (k, v) => {
    if (!syncable(k)) return;
    const pending = load(PENDING), stamps = load(STAMPS);
    const t = Math.max(Date.now(), (stamps[k] || 0) + 1);
    pending[k] = { v, t }; stamps[k] = t;
    save(PENDING, pending); save(STAMPS, stamps);
    if (disabled) return;
    show('busy');
    clearTimeout(timer); timer = setTimeout(push, 1500);
  };
  window.lxStore = {
    set(k, raw) { try { localStorage.setItem(k, raw); } catch { return; } record(k, raw); },
    remove(k) { try { localStorage.removeItem(k); } catch { return; } record(k, null); },
  };

  async function push(keepalive = false) {
    clearTimeout(timer);
    if (disabled || pushing) return;
    const sent = load(PENDING);
    if (!Object.keys(sent).length) { if (state === 'busy') show('ok'); return; }
    pushing = true;
    try {
      const body = JSON.stringify({ changes: sent });
      const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: keepalive && body.length < 60000 });
      if (res.status === 404 || res.status === 503) { disabled = true; show('local'); return; }
      if (!res.ok) throw new Error('sync ' + res.status);
      const pending = load(PENDING);
      for (const k of Object.keys(sent)) if (pending[k] && pending[k].t === sent[k].t) delete pending[k];
      save(PENDING, pending);
      lastSync = Date.now();
      if (Object.keys(pending).length) timer = setTimeout(push, 1500); else show('ok');
    } catch (err) {
      console.warn(err);
      show('err');
      timer = setTimeout(push, 30000);
    } finally { pushing = false; }
  }

  async function pull() {
    if (disabled) return;
    lastPull = Date.now();
    show('busy');
    try {
      const res = await fetch(API, { headers: { accept: 'application/json' } });
      if (res.status === 404 || res.status === 503) { disabled = true; show('local'); return; }
      if (!res.ok) throw new Error('sync ' + res.status);
      const { data } = await res.json();
      const pending = load(PENDING), stamps = load(STAMPS), changed = [];
      for (const [k, e] of Object.entries(data || {})) {
        if (!syncable(k) || !(e.t > (stamps[k] || 0))) continue;
        try { if (e.v === null) localStorage.removeItem(k); else localStorage.setItem(k, e.v); } catch { continue; }
        stamps[k] = e.t;
        if (pending[k] && pending[k].t < e.t) delete pending[k];
        changed.push(k);
      }
      save(STAMPS, stamps); save(PENDING, pending);
      lastSync = Date.now();
      if (changed.length) dispatchEvent(new CustomEvent('lx:synced', { detail: { keys: changed } }));
      await push();
    } catch (err) {
      console.warn(err);
      show('err');
      timer = setTimeout(push, 30000);
    }
  }

  // First run on this device: queue what is already stored with the oldest stamp,
  // so it fills gaps online but never overrides progress saved from another device.
  if (!localStorage.getItem(INIT)) {
    const pending = load(PENDING), stamps = load(STAMPS);
    try { Object.keys(localStorage).filter(k => syncable(k) && !(k in stamps)).forEach(k => { pending[k] = { v: localStorage.getItem(k), t: 1 }; stamps[k] = 1; }); } catch { /* ignore */ }
    save(PENDING, pending); save(STAMPS, stamps); save(INIT, true);
  }

  document.addEventListener('DOMContentLoaded', () => { show(state); pull(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') push(true);
    else if (Date.now() - lastPull > 60000) pull();
  });
  addEventListener('pagehide', () => push(true));
  document.addEventListener('click', e => { if (e.target.closest('[data-sync]') && !disabled) pull(); });
})();
</script>
<style>
  /* ======================================================================
     CS4420 Practice Lab — "data terminal": a dark console read in long sessions.
     Cards sit darker than the ground; every selection is one 1px PostgreSQL-blue
     line as wide as its label; every figure, ID and query is set in JetBrains Mono.
     Grid: 248px sidebar + fluid canvas, 40px side padding, one 24px gap everywhere.
     ====================================================================== */
  :root {
    --ground: #171719;
    --surface: #131217;
    --raised: #212023;
    --well: #0d0d10;
    --hover: #1d1c21;
    --border: #262529;
    --rule: #1f1e23;
    --control: #3a3a3e;
    --text: #ffffff;
    --text-2: #cfcfd3;
    --muted: #8f9197;
    --accent: #4a8ad6;
    --accent-ink: #8bb6ea;
    --accent-bg: #16202e;
    --positive: #44a282;
    --negative: #e5566f;
    --negative-bg: #2c1a20;
    --warning: #d9a441;
    --warning-bg: #2a2416;
    --cell: #2c2b31;
    --selection: #2b4f7c;
    --control-hover: #55555b;
    --invert: #ffffff; --invert-ink: #111111; --invert-hover: #dcdce0;
    --tag-hover: #2e2d33;
    --accent-bg-ink: #d6e6fa; --warning-bg-ink: #f0d49c; --negative-bg-ink: #f6b8c3;
    --prose: #ececef; --code: #f0f0f2;
    --focus-line: #3d5f8a; --placeholder: #6f7177;
    --shadow: 0 12px 28px rgba(0,0,0,.2);
    --shadow-menu: 0 16px 40px rgba(0,0,0,.45);
    --font: "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --radius: 6px; --radius-sm: 4px;
    --gap: 24px; --pad: 40px;
    --sidebar: 248px; --control-height: 34px;
    color-scheme: dark;
  }
  /* Light: the same terminal printed on paper — white cards on a pale ground, ink text, deeper blue. */
  :root[data-theme="light"] {
    --ground: #f6f6f7;
    --surface: #ffffff;
    --raised: #eeeef0;
    --well: #f9f9fa;
    --hover: #ececee;
    --border: #e2e2e5;
    --rule: #ececee;
    --control: #cfcfd4;
    --text: #17171a;
    --text-2: #3c3c42;
    --muted: #6b6d73;
    --accent: #2f6fbf;
    --accent-ink: #235a9e;
    --accent-bg: #e8f0fa;
    --positive: #2b8a69;
    --negative: #c8354f;
    --negative-bg: #fbebee;
    --warning: #a87412;
    --warning-bg: #fbf3e2;
    --cell: #e4e4e8;
    --selection: #cfe0f5;
    --control-hover: #a9a9b0;
    --invert: #17171a; --invert-ink: #ffffff; --invert-hover: #3a3a40;
    --tag-hover: #e2e2e6;
    --accent-bg-ink: #1d4f8c; --warning-bg-ink: #7a5208; --negative-bg-ink: #9c2238;
    --prose: #222226; --code: #1f1f23;
    --focus-line: #8fb3e0; --placeholder: #9a9ca2;
    --shadow: 0 12px 28px rgba(20,20,30,.08);
    --shadow-menu: 0 16px 40px rgba(20,20,30,.16);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--text); font: 400 13px/20px var(--font); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--selection); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--text); }
  h1, h2, h3 { margin: 0; }
  .n, .lx-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lx-mono { font-size: 12px; font-weight: 500; }
  .lx-subtle, .lx-dash { color: var(--muted); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Shell: labelled sidebar on the ground, one rule, canvas beside it ---------- */

  .lx-brand__mark { width: 28px; height: 28px; flex: none; color: var(--accent); }
  .lx-brand__mark svg { width: 100%; height: 100%; display: block; }
  .lx-brand__name { font: 600 14px/18px var(--font); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-nav__group { display: flex; flex-direction: column; }
  .lx-nav__label { padding: 0 8px 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .lx-nav__item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; margin-bottom: 2px; padding: 6px 8px; border-radius: var(--radius-sm);
    color: var(--muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--text); }
  .lx-nav__item.is-active { color: var(--text); }

  .lx-nav__item.is-part.is-current { color: var(--text); font-weight: 600; }
  .lx-nav__k { flex: none; min-width: 34px; font: 500 12px/18px var(--mono); color: var(--muted); white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k, .lx-nav__item.is-current .lx-nav__k { color: var(--text-2); }
  .lx-nav__t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-nav__c { flex: none; font: 400 11px/18px var(--mono); color: var(--muted); }
  .lx-nav__sub { display: flex; flex-direction: column; margin: 0 0 6px 20px; }
  .lx-nav__sub .lx-nav__item { min-height: 30px; padding: 5px 8px; }
  .lx-sidebar__foot { display: flex; align-items: center; gap: 4px; padding: 12px; border-top: 1px solid var(--border); }
  .lx-sidebar__foot > .lx-signalwrap { flex: 1; min-width: 0; }
  .lx-sidebar__foot > .lx-iconbtn::after { right: auto; left: 50%; transform: translate(-50%, 2px); }
  .lx-sidebar__foot > .lx-iconbtn:hover::after, .lx-sidebar__foot > .lx-iconbtn:focus-visible::after { transform: translate(-50%, 0); }
  .lx-sidebar__foot > .lx-sync::after { left: 0; transform: translateY(2px); }
  .lx-sidebar__foot > .lx-sync:hover::after, .lx-sidebar__foot > .lx-sync:focus-visible::after { transform: none; }
  .lx-sync .lx-sync__ok, .lx-sync .lx-sync__off { display: none; }
  .lx-sync.is-ok { color: var(--positive); } .lx-sync.is-ok .lx-sync__ok { display: block; }
  .lx-sync.is-err { color: var(--negative); } .lx-sync.is-local .lx-sync__off { display: block; }
  .lx-sync.is-busy svg { animation: lx-blink 1.2s ease-in-out infinite; }
  .lx-theme .lx-theme__sun, :root[data-theme="light"] .lx-theme .lx-theme__moon { display: none; }
  :root[data-theme="light"] .lx-theme .lx-theme__sun { display: block; }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- PostgreSQL signal ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 8px;
    border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font: 500 12px/1 var(--font); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--text); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--control); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--positive); }
  [data-state="error"] .lx-signal__dot { background: var(--negative); }
  [data-state="loading"] .lx-signal__dot, [data-state="reloading"] .lx-signal__dot { animation: lx-blink 1.2s ease-in-out infinite; background: var(--warning); }
  @keyframes lx-blink { 50% { opacity: .35; } }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lx-pop { position: absolute; bottom: calc(100% + 8px); left: 0; width: 380px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--raised); color: var(--text); border: 1px solid var(--control); border-radius: var(--radius); box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  .lx-pop__title { font-weight: 600; font-size: 14px; }
  .lx-pop__body { padding: 0 16px 14px; font-size: 13px; line-height: 20px; color: var(--text-2); }
  .lx-pop__body p { margin: 0 0 8px; }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 6px; }
  .lx-pop__body code { font: 500 12px/1 var(--mono); color: var(--text); background: var(--well); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0 0 10px; }
  .lx-pop__body .lx-kv dt { color: var(--muted); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--text); }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }

  /* ---------- Feedback motion only: no entrances ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-tab, .lx-row, .lx-opt, .lx-cellmap a, .lx-week, .lx-exlist a, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .lx-btn:active, .lx-iconbtn:active { transform: translateY(1px); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-in .2s ease-out; }
  @keyframes lx-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- Canvas, title row ---------- */
  .lx-page { max-width: 1320px; padding: 36px var(--pad) 80px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
  .lx-head__text { flex: 1 1 520px; min-width: 0; max-width: 880px; }
  .lx-h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-ctx { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-ctx .n { color: var(--text-2); font-size: 12px; }
  .lx-lead { margin: 10px 0 0; color: var(--text-2); font-size: 14px; line-height: 22px; max-width: 780px; }
  .lx-find { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--text); }
  .lx-find .n { font-size: 13px; }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: 16px; }
  .lx-h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
  .lx-section { font-size: 20px; line-height: 26px; font-weight: 400; color: var(--muted); }
  .lx-section b { color: var(--text); font-weight: 600; }

  /* ---------- Buttons: pills; primary inverted white ---------- */
  .lx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text);
    font: 500 13px/1 var(--font); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--raised); border-color: var(--control-hover); }
  .lx-btn--primary { background: var(--invert); border-color: var(--invert); color: var(--invert-ink); font-weight: 600; }
  .lx-btn--primary:hover { background: var(--invert-hover); border-color: var(--invert-hover); }
  .lx-btn--ghost { border-color: transparent; color: var(--text-2); padding: 0 12px; }
  .lx-btn--ghost:hover { background: var(--raised); border-color: transparent; color: var(--text); }
  .lx-btn[disabled] { opacity: .5; cursor: progress; }
  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; flex: none; }
  .lx-iconbtn:hover { background: var(--raised); color: var(--text); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: 0; white-space: nowrap; padding: 5px 9px;
    border-radius: var(--radius-sm); background: var(--invert); color: var(--invert-ink); font: 500 12px/16px var(--font); opacity: 0; pointer-events: none; z-index: 10; transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; transform: none; }
  .lx-iconbtn.is-off { opacity: .35; pointer-events: none; }
  kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: var(--radius-sm); background: var(--raised); color: var(--text-2); border: 1px solid var(--control); white-space: nowrap; }

  /* ---------- Status: a dot and a word; blue = solved, amber = not yet ---------- */
  .lx-badge { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; font: 500 12px/18px var(--font); color: var(--muted); }
  .lx-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--control); }
  .lx-badge--success { color: var(--accent-ink); } .lx-badge--success::before { background: var(--accent); }
  .lx-badge--info { color: var(--text-2); } .lx-badge--info::before { background: var(--text-2); }
  .lx-badge--warning { color: var(--warning); } .lx-badge--warning::before { background: var(--warning); }
  .lx-badge--danger { color: var(--negative); } .lx-badge--danger::before { background: var(--negative); }
  .lx-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--raised); color: var(--text-2);
    font: 500 12px/1 var(--font); white-space: nowrap; flex: none; text-decoration: none; }
  a.lx-tag:hover { background: var(--tag-hover); color: var(--text); }

  /* ---------- Cards: darker than the ground ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 20px; }
  .lx-card__head + .lx-card__body { padding-top: 0; }
  .lx-card__meta { font-size: 13px; color: var(--muted); }
  .lx-card__body { padding: 20px; }
  .lx-card__foot { padding: 14px 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }

  /* Tables: rules and alignment */
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 8px 20px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: 11px 20px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table--data { font: 400 12px/18px var(--mono); }
  .lx-table--data th { font: 500 12px/16px var(--mono); color: var(--text-2); position: sticky; top: 0; background: var(--surface); }
  .lx-table--data td, .lx-table--data th { padding: 7px 16px; white-space: pre; }
  .lx-table--data tbody tr:hover td { background: var(--hover); }
  .lx-table--data td:first-child, .lx-table--data th:first-child { padding-left: 20px; }
  .lx-datawrap { max-height: 480px; overflow: auto; border-top: 1px solid var(--rule); }
  .lx-null { color: var(--muted); font-style: italic; }

  /* KPI strip: one container, divided */
  .lx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lx-kpi { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--rule); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-kpi__v { font: 500 22px/28px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .lx-kpi--lead .lx-kpi__v { font-size: 32px; line-height: 38px; font-weight: 600; }
  .lx-kpi__u { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; font-family: var(--font); }
  .lx-kpi__n { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-meter { position: relative; height: 4px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 6px; }
  .lx-meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* ---------- Signature: every SQL exercise as one cell ---------- */
  .lx-map { display: flex; flex-direction: column; }
  .lx-row { display: grid; grid-template-columns: 52px minmax(200px, 1fr) minmax(240px, 380px) 72px 72px 112px 32px; align-items: center; gap: 0 20px;
    padding: 14px 20px; border-top: 1px solid var(--rule); text-decoration: none; color: var(--text); }
  .lx-row:hover { background: var(--hover); }
  .lx-row--head { padding-top: 0; padding-bottom: 10px; border-top: 0; color: var(--muted); font-size: 12px; line-height: 16px; }
  .lx-row--head:hover { background: none; }
  .lx-row--head .r { font-family: var(--font); font-size: 12px; }
  .lx-row__k { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-row__t { min-width: 0; }
  .lx-row__t a { color: var(--text); text-decoration: none; font-weight: 600; }
  .lx-row__t a:hover { color: var(--accent-ink); }
  .lx-row__sub { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-row .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .lx-row .r small { color: var(--muted); font-size: 12px; }
  .lx-cellmap { display: flex; flex-wrap: wrap; gap: 3px; }
  .lx-cellmap a, .lx-cellmap span { display: block; width: 12px; height: 12px; border-radius: 2px; background: var(--cell); }
  .lx-cellmap .is-pass { background: var(--accent); }
  .lx-cellmap .is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-cellmap a:hover { background: var(--text-2); }
  .lx-cellmap--empty { font-size: 12px; color: var(--muted); }
  .lx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .lx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lx-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--cell); }
  .lx-legend i.is-pass { background: var(--accent); }
  .lx-legend i.is-fail { background: transparent; border: 1px solid var(--warning); }

  /* ---------- Fifteen weeks: this part's weeks carry the blue line ---------- */
  .lx-weeks { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 0; padding: 0 20px 20px; }
  .lx-week { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 10px 4px; border-top: 1px solid var(--control); color: var(--muted); font-size: 12px; line-height: 16px; text-decoration: none; }
  .lx-week + .lx-week { border-left: 1px solid var(--rule); }
  .lx-week__n { font: 600 13px/16px var(--mono); color: var(--text-2); }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .lx-week.is-on { color: var(--text-2); }
  .lx-week.is-on::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--text); }
  .lx-week__exam { color: var(--warning); font-weight: 600; }
  .lx-weeks--thin .lx-week { min-height: 56px; }
  .lx-weeklist { list-style: none; margin: 0; padding: 0 20px 12px; }
  .lx-weeklist li { display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 13px; }
  .lx-weeklist .n { color: var(--text-2); font-size: 12px; }
  button.lx-week { appearance: none; background: none; border-right: 0; border-bottom: 0; text-align: left; font: inherit; cursor: pointer; }
  button.lx-week:hover { background: var(--hover); }
  .lx-week.is-now { background: var(--accent-bg); }
  .lx-week.is-now::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent); }

  .lx-callout { border-radius: var(--radius); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--raised); color: var(--text); font-size: 13px; }
  .lx-callout a { color: inherit; }
  .lx-callout--success { background: var(--accent-bg); color: var(--accent-bg-ink); }
  .lx-callout--warning { background: var(--warning-bg); color: var(--warning-bg-ink); }
  .lx-callout--danger { background: var(--negative-bg); color: var(--negative-bg-ink); font-family: var(--mono); font-size: 12px; }
  .lx-callout--danger strong { font-family: var(--font); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Step tabs on one rule ---------- */
  .lx-flow { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); }
  .lx-flow__steps { flex: 1; display: flex; gap: 28px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .lx-tab:hover { color: var(--text); }
  .lx-tab .n { font-size: 12px; color: var(--muted); }
  .lx-tab.is-active { color: var(--text); }
  .lx-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); }
  .lx-flow__arrows { display: flex; gap: 4px; padding-bottom: 5px; }
  .lx-flow__arrows .lx-iconbtn::after { bottom: auto; top: calc(100% + 6px); }

  /* ---------- Reading ---------- */
  .lx-prose { color: var(--prose); font-size: 14px; line-height: 23px; }
  .lx-prose h3 { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text); margin: 28px 0 8px; }
  .lx-prose h3:first-child { margin-top: 0; }
  .lx-prose p { margin: 8px 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: 8px 0; }
  .lx-prose li { margin: 4px 0; }
  .lx-prose li::marker { color: var(--muted); }
  .lx-prose a { color: var(--accent-ink); }
  .lx-prose code, .lx-code { font: 500 12.5px/1 var(--mono); background: var(--raised); color: var(--code); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-prose strong { font-weight: 600; color: var(--text); }
  .lx-prose .table-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px 12px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .lx-prose tr:last-child td { border-bottom: 0; }
  pre.code { font: 400 12.5px/1.65 var(--mono); background: var(--well); color: var(--code); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 12px 0; }
  pre.code code { background: none; padding: 0; font: inherit; color: inherit; }
  details > summary { cursor: pointer; font-weight: 600; color: var(--text); list-style: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary svg.i { width: 12px; height: 12px; color: var(--muted); transition: transform .15s ease; }
  details > summary:hover { color: var(--accent-ink); }
  details[open] > summary svg.i { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: 8px; }
  .lx-en { margin: 0 0 14px; padding: 12px 16px; background: var(--raised); border-radius: var(--radius); color: var(--text-2); font-size: 13px; line-height: 21px; }
  .lx-en::before { content: "Đề gốc"; display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lx-en p { margin: 0; }

  /* ---------- Quiz & essays ---------- */
  .lx-qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .lx-qno { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-q__opts { display: grid; gap: 8px; margin-top: 14px; }
  .lx-opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--ground); border: 1px solid var(--border); cursor: pointer; }
  .lx-opt:hover { border-color: var(--control); background: var(--hover); }
  .lx-opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .lx-opt.is-right { border-color: var(--accent); background: var(--accent-bg); }
  .lx-opt.is-wrong { border-color: var(--negative); background: var(--negative-bg); }
  .lx-q__explain { margin-top: 12px; color: var(--text-2); }
  .lx-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .lx-check input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- Exercise: list beside the console ---------- */
  .lx-work { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-exlist { position: sticky; top: 24px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .lx-exlist ul { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-exlist a { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 8px; align-items: center; gap: 10px; min-height: 32px; padding: 6px 16px 6px 20px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .lx-exlist a:hover { background: var(--hover); color: var(--text); }
  .lx-exlist li[aria-selected="true"] a { color: var(--text); }
  .lx-exlist li[aria-selected="true"] a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--accent); }
  .lx-exlist .lx-list__id { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-exlist .lx-list__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cell); }
  .lx-dot.is-pass { background: var(--accent); }
  .lx-dot.is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-exhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 18px 20px 14px; }
  .lx-exhead__id { font: 600 18px/24px var(--mono); letter-spacing: -.01em; }
  .lx-exmeta { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .lx-console { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lx-console:focus-within { border-color: var(--focus-line); }
  .lx-console__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
  .lx-console__bar label { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-console__keys { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .lx-editor { width: 100%; min-height: 220px; resize: vertical; display: block; margin: 0;
    font: 400 13.5px/1.65 var(--mono); tab-size: 2; color: var(--code); caret-color: var(--accent); background: transparent;
    border: 0; border-radius: 0; padding: 14px 16px; }
  .lx-editor::placeholder { color: var(--placeholder); }
  .lx-editor:focus { outline: none; }
  input.lx-editor { min-height: 0; height: 40px; resize: none; }
  .lx-field { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-field:focus-within { border-color: var(--focus-line); }
  .lx-runbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; }
  .lx-pager { display: flex; justify-content: space-between; gap: 12px; }

  /* ---------- Schema & FD ---------- */
  .lx-tables { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); align-items: start; }
  .lx-tables .lx-card__head { padding: 14px 16px 10px 20px; }
  .lx-tables h3 { font: 600 14px/20px var(--mono); }
  .lx-cols-list { list-style: none; margin: 0; padding: 0 0 12px; }
  .lx-cols-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 20px; font: 400 13px/18px var(--mono); }
  .lx-cols-list li + li { border-top: 1px solid var(--rule); }
  .lx-cols-list .is-pk { color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .lx-cols-list .lx-subtle { text-align: right; }
  .lx-fd-form { display: flex; flex-direction: column; gap: 16px; }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 8px; font-weight: 500; font-size: 13px; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-select { height: var(--control-height); max-width: 100%; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; padding: 0 14px; }

  /* ---------- Reading columns with a side panel ---------- */
  .lx-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
  .lx-aside { position: sticky; top: 24px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-aside .lx-kpi__v { margin-bottom: 4px; }
  .lx-aside__note { margin: 12px 0 0; font-size: 13px; color: var(--text-2); }
  .lx-read { max-width: 860px; }
  .lx-toc { list-style: none; margin: 0; padding: 0 8px 12px; counter-reset: toc; max-height: calc(100vh - 140px); overflow-y: auto; }
  .lx-toc li { margin: 0; }
  .lx-toc button { appearance: none; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font: 400 13px/18px var(--font); padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer; }
  .lx-toc button:hover { background: var(--hover); color: var(--text); }
  .lx-qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; margin-top: 16px; }
  .lx-qcell { appearance: none; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--ground); color: var(--text-2); font: 500 12px/1 var(--mono); cursor: pointer; }
  .lx-qcell:hover { border-color: var(--control); color: var(--text); }
  .lx-qcell.is-pass { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lx-qcell.is-fail { border-color: var(--warning); color: var(--warning); }
  .lx-qcell.is-picked { border-color: var(--placeholder); color: var(--text); background: var(--raised); }
  .lx-howto { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gap); }
  .lx-howto ul { margin: 0; padding-left: 18px; }
  .lx-keys { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; margin: 0; align-items: center; }
  .lx-keys dt { white-space: nowrap; color: var(--muted); }
  .lx-keys dd { margin: 0; color: var(--text-2); }
  .lx-fdgrid { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-fdin { position: sticky; top: 24px; }
  .lx-fdin .lx-select { max-width: 100%; }

  /* ---------- Tablet & phone: the sidebar folds into a 48px bar and a sheet ---------- */
  @media (max-width: 1100px) {
    .lx-split, .lx-fdgrid { grid-template-columns: minmax(0, 1fr); }
    .lx-aside, .lx-fdin { position: static; }
    .lx-work { grid-template-columns: 232px minmax(0, 1fr); }
    .lx-row { grid-template-columns: 48px minmax(160px, 1fr) minmax(160px, 240px) 64px 96px 32px; }
    .lx-row > .lx-row__ess { display: none; }
    .lx-weeks { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 0; }
  }
  @media (max-width: 900px) {
    :root { --pad: 16px; --gap: 16px; }
    .lx-app { display: block; }
    .lx-mbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 4px;
      background: var(--ground); border-bottom: 1px solid var(--border); }
    .lx-mbar .lx-brand__mark { width: 22px; height: 22px; }
    .lx-mbar__title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lx-mbar .lx-iconbtn { width: 44px; height: 44px; color: var(--text); }
    .lx-mbar .lx-iconbtn svg.i { width: 20px; height: 20px; }
    .lx-sidebar { display: none; position: fixed; inset: 52px 0 0; z-index: 24; height: auto; border-right: 0; }
    .lx-app.is-navopen .lx-sidebar { display: flex; }
    .lx-app.is-navopen { overflow: hidden; }
    .lx-sidebar > .lx-brand { display: none; }
    .lx-nav { padding-top: 16px; }
    .lx-nav__item, .lx-signal { min-height: 44px; font-size: 15px; }
    .lx-nav__sub .lx-nav__item { min-height: 44px; }
    .lx-pop { width: 100%; }
    .lx-page { padding: 20px var(--pad) 56px; }
    .lx-h1 { font-size: 22px; line-height: 28px; }
    .lx-head .lx-actions, .lx-head .lx-btn--primary { width: 100%; }
    .lx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lx-kpi { padding: 14px 16px; }
    .lx-kpi:nth-child(3) { border-left: 0; }
    .lx-kpi:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .lx-kpi--lead .lx-kpi__v { font-size: 26px; line-height: 32px; }
    .lx-row { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "k t s" "c c c"; gap: 10px 12px; padding: 14px 16px; }
    .lx-row--head { display: none; }
    .lx-row__k { grid-area: k; } .lx-row__t { grid-area: t; } .lx-row .lx-cellmap { grid-area: c; } .lx-row > .lx-row__st { grid-area: s; }
    .lx-row > .r, .lx-row > .lx-row__go { display: none; }
    .lx-weeks { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 16px 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 1px solid var(--rule); }
    .lx-week:nth-child(3n + 1) { border-left: 0; }
    .lx-work { grid-template-columns: minmax(0, 1fr); }
    .lx-weeklist li { grid-template-columns: 72px minmax(0, 1fr); }

M', 8,  0,  8,  50),\n  ('A', 'W', 8,  0,  8,  50),\n  ('A', 'F', 8,  0,  8,  50),\n  ('B', 'M', 9,  0,  9,  50),\n  ('B', 'W', 9,  0,  9,  50),\n  ('B', 'F', 9,  0,  9,  50),\n  ('C', 'M', 11, 0,  11, 50),\n  ('C', 'W', 11, 0,  11, 50),\n  ('C', 'F', 11, 0,  11, 50),\n  ('D', 'M', 13, 0,  13, 50),\n  ('D', 'W', 13, 0,  13, 50),\n  ('D', 'F', 13, 0,  13, 50),\n  ('E', 'T', 10, 30, 11, 45),\n  ('E', 'R', 10, 30, 11, 45),\n  ('F', 'T', 14, 30, 15, 45),\n  ('F', 'R', 14, 30, 15, 45),\n  ('G', 'M', 16, 0,  16, 50),\n  ('G', 'W', 16, 0,  16, 50),\n  ('G', 'F', 16, 0,  16, 50),\n  ('H', 'W', 10, 0,  12, 30);\n\ninsert into prereq values\n  ('BIO-301', 'BIO-101'),\n  ('BIO-399', 'BIO-101'),\n  ('CS-190',  'CS-101'),\n  ('CS-315',  'CS-101'),\n  ('CS-319',  'CS-101'),\n  ('CS-347',  'CS-101'),\n  ('EE-181',  'PHY-101');\n","-- =====================================================================\n-- Các bảng phụ dùng cho bài tập (self join, recursion, ranking,\n-- windowing, OLAP). Chạy SAU university_data.sql.\n-- =====================================================================\n\ndrop table if exists emp_super cascade;\ndrop table if exists grade_points cascade;\ndrop table if exists student_grades cascade;\ndrop table if exists dept_grades cascade;\ndrop table if exists sales cascade;\ndrop table if exists itemcategory cascade;\ndrop table if exists daily_sales cascade;\ndrop table if exists account_txn cascade;\n\n-- Slide 3: \"Self Join Example\" — relation emp-super(person, supervisor)\ncreate table emp_super (\n  person      varchar(20) primary key,\n  supervisor  varchar(20)\n);\ninsert into emp_super values\n  ('Bob',   'Alice'),\n  ('Mary',  'Susan'),\n  ('Alice', 'David'),\n  ('David', 'Mary'),\n  ('Tom',   'Bob'),\n  ('Eve',   'Alice');\n\n-- Điểm số quy đổi của từng letter grade\ncreate table grade_points (\n  grade   varchar(2) primary key,\n  points  numeric(2,1)\n);\ninsert into grade_points values\n  ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n  ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('F', 0.0);\n\n-- Slide 5: student_grades(ID, GPA) và dept_grades(ID, dept_name, GPA)\n-- GPA = sum(points * credits) / sum(credits), bỏ qua môn chưa có điểm.\n-- Sinh viên chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-01-07 11:00', 1000),\n  ('A-215', '2018-01-30 08:20', -400),\n  ('A-215', '2018-03-02 13:10', 250);\n","-- =====================================================================\n-- Bảng cho bài tập Part 6 — Chương 15 (Query Processing), 16 (Query Optimization).\n-- Mọi bảng đều có prefix qp_. Chạy SAU university_data.sql.\n--\n--   External sort-merge (PE 15.1):         qp_sort_input, qp_sort_params\n--   Cost model / join cost (PE 15.3):      qp_rel_stats, qp_memory\n--   Bank database (Figure 15.14 / 16.9):   qp_branch, qp_account\n--   Semijoin / anti-semijoin (PE 15.10):   qp_orders, qp_vip, qp_blocked\n--   Division (PE 15.8):                    qp_supply, qp_req_part\n--   Keyword index (PE 15.13):              qp_doc_kw, qp_query_kw\n--   Size estimation (PE 16.5, 16.6):       qp_card, qp_vstats\n--   Histogram / selectivity:               qp_emp\n--   Join ordering (PE 16.12–16.14):        qp_jrel, qp_jpred\n--   upper() join (PE 16.8):                qp_names_r, qp_names_s\n-- =====================================================================\n\ndrop table if exists qp_sort_input, qp_sort_params, qp_rel_stats, qp_memory cascade;\ndrop table if exists qp_account, qp_branch cascade;\ndrop table if exists qp_orders, qp_vip, qp_blocked, qp_supply, qp_req_part cascade;\ndrop table if exists qp_doc_kw, qp_query_kw, qp_card, qp_vstats, qp_emp cascade;\ndrop table if exists qp_jrel, qp_jpred, qp_names_r, qp_names_s cascade;\n\n-- ---------------------------------------------------------------- External sort-merge\n-- PE 15.1: one tuple per block, memory holds 3 blocks. pos = position in the input file.\ncreate table qp_sort_input (\n  pos   integer primary key,\n  name  varchar(20) not null,\n  num   integer not null\n);\ninsert into qp_sort_input values\n  (1, 'kangaroo', 17), (2, 'wallaby', 21), (3, 'emu', 1), (4, 'wombat', 13),\n  (5, 'platypus', 3), (6, 'lion', 8), (7, 'warthog', 4), (8, 'zebra', 11),\n  (9, 'meerkat', 6), (10, 'hyena', 9), (11, 'hornbill', 2), (12, 'baboon', 12);\n\n-- b_r = blocks of the relation, m = memory blocks, bb = buffer blocks per run.\ncreate table qp_sort_params (\n  case_id  integer primary key,\n  b_r      integer not null,\n  m        integer not null,\n  bb       integer not null\n);\ninsert into qp_sort_params values\n  (1, 12, 3, 1),        -- PE 15.1\n  (2, 800, 25, 1),\n  (3, 1500, 25, 1),\n  (4, 10000, 11, 1),\n  (5, 100000, 101, 1),\n  (6, 100000, 101, 10); -- 10 buffer blocks per run: fewer seeks, smaller fan-in\n\n-- ---------------------------------------------------------------- Cost model\n-- PE 15.3: r1 has 20,000 tuples, 25 per block; r2 has 45,000 tuples, 30 per block.\ncreate table qp_rel_stats (\n  rel                varchar(10) primary key,\n  n_tuples           integer not null,\n  tuples_per_block   integer not null\n);\ninsert into qp_rel_stats values ('r1', 20000, 25), ('r2', 45000, 30);\n\ncreate table qp_memory (m integer primary key);   -- memory sizes (blocks) to compare\ninsert into qp_memory values (12), (52), (102), (802);\n\n-- ---------------------------------------------------------------- Bank database\ncreate table qp_branch (\n  branch_name  varchar(20) primary key,\n  branch_city  varchar(20) not null,\n  assets       numeric(12,2) not null\n);\ninsert into qp_branch values\n  ('Brighton',   'Brooklyn',  7100000),\n  ('Bronx Main', 'Bronx',      300000),\n  ('Downtown',   'Brooklyn',  9000000),\n  ('Mianus',     'Horseneck',  400000),\n  ('North Town', 'Rye',       3700000),\n  ('Perryridge', 'Horseneck', 1700000),\n  ('Pownal',     'Bennington', 300000),\n  ('Redwood',    'Palo Alto', 2100000),\n  ('Round Hill', 'Horseneck', 8000000),\n  ('Bay Ridge',  'Brooklyn',     4000),\n  ('Austin',     'Austin',       3000);\n\ncreate table qp_account (\n  account_number  varchar(10) primary key,\n  branch_name     varchar(20) not null references qp_branch,\n  balance         numeric(12,2) not null\n);\ninsert into qp_account values\n  ('A-101', 'Downtown',   500), ('A-102', 'Perryridge', 400), ('A-201', 'Brighton',   900),\n  ('A-215', 'Mianus',     700), ('A-217', 'Brighton',   750), ('A-218', 'Brighton',   900),\n  ('A-222', 'Redwood',    700), ('A-305', 'Round Hill', 350), ('A-310', 'Bronx Main', 820),\n  ('A-311', 'Bronx Main', 610), ('A-401', 'Bay Ridge',  120), ('A-402', 'Bay Ridge',  120),\n  ('A-501', 'Downtown',   950);\n\n-- ---------------------------------------------------------------- Semijoin / anti-semijoin\n-- qp_orders has duplicate rows on purpose (multiset semantics).\ncreate table qp_orders (cust varchar(10), item varchar(10));\ninsert into qp_orders values\n  ('ann', 'pen'), ('ann', 'pen'), ('ann', 'ink'), ('bob', 'pad'),\n  ('cid', 'pen'), ('dan', 'cup'), ('dan', 'cup'), (null, 'box');\ncreate table qp_vip (cust varchar(10));              -- duplicates on purpose\ninsert into qp_vip values ('ann'), ('ann'), ('dan'), ('eve');\ncreate table qp_blocked (cust varchar(10));          -- contains a null on purpose\ninsert into qp_blocked values ('bob'), (null);\n\n-- ---------------------------------------------------------------- Division\ncreate table qp_supply (supplier varchar(10), part varchar(10));   -- duplicates on purpose\ninsert into qp_supply values\n  ('s1', 'p1'), ('s1', 'p2'), ('s1', 'p3'), ('s1', 'p3'),\n  ('s2', 'p1'), ('s2', 'p2'),\n  ('s3', 'p1'), ('s3', 'p2'), ('s3', 'p3'), ('s3', 'p4'),\n  ('s4', 'p3'), ('s4', 'p3'), ('s4', 'p3');\ncreate table qp_req_part (part varchar(10) primary key);\ninsert into qp_req_part values ('p1'), ('p2'), ('p3');\n\n-- ---------------------------------------------------------------- Keyword index\ncreate table qp_doc_kw (doc_id integer, keyword varchar(20), primary key (doc_id, keyword));\ninsert into qp_doc_kw values\n  (1, 'database'), (1, 'index'), (1, 'query'),\n  (2, 'database'), (2, 'recovery'), (2, 'hash'),\n  (3, 'index'), (3, 'btree'), (3, 'query'), (3, 'hash'),\n  (4, 'query'),\n  (5, 'hash'), (5, 'join'), (5, 'database'), (5, 'index'),\n  (6, 'recovery'), (6, 'log');\ncreate table qp_query_kw (keyword varchar(20) primary key);\ninsert into qp_query_kw values ('database'), ('index'), ('query'), ('hash');\n\n-- ---------------------------------------------------------------- Size estimation\n-- PE 16.5/16.6: r1(A, B, C), r2(C, D, E), r3(E, F).\ncreate table qp_card (rel varchar(5) primary key, n integer not null);\ninsert into qp_card values ('r1', 1000), ('r2', 1500), ('r3', 750);\ncreate table qp_vstats (rel varchar(5), attr varchar(5), v integer not null, primary key (rel, attr));\ninsert into qp_vstats values ('r1', 'C', 900), ('r2', 'C', 1100), ('r2', 'E', 50), ('r3', 'E', 100);\n\n-- ---------------------------------------------------------------- Histogram\ncreate table qp_emp (id integer primary key, dept varchar(10) not null, salary integer not null);\ninsert into qp_emp\nselect g,\n       (array['sales', 'it', 'hr', 'ops'])[1 + g % 4],\n       20000 + ((g * 7919) % 80000)\nfrom generate_series(1, 200) as g;\n\n-- ---------------------------------------------------------------- Join ordering\n-- Four relations with sizes; qp_jpred lists join predicates and their selectivity.\n-- A pair of relations without a predicate is a Cartesian product (selectivity 1).\ncreate table qp_jrel (id integer primary key, name varchar(5) not null, n integer not null);\ninsert into qp_jrel values (0, 'A', 1000), (1, 'B', 100), (2, 'C', 5000), (3, 'D', 20);\ncreate table qp_jpred (r1 integer, r2 integer, sel numeric not null, primary key (r1, r2));\ninsert into qp_jpred values (0, 1, 0.01), (1, 2, 0.001), (2, 3, 0.05);\n\n-- ---------------------------------------------------------------- upper() join\ncreate table qp_names_r (id integer primary key, name varchar(20));\ninsert into qp_names_r values (1, 'alice'), (2, 'Bob'), (3, 'CAROL'), (4, 'dave');\ncreate table qp_names_s (code varchar(5) primary key, name varchar(20));\ninsert into qp_names_s values ('x1', 'ALICE'), ('x2', 'bob'), ('x3', 'Carol'), ('x4', 'erin'), ('x5', 'Alice');\n"],"setupFiles":["lab/db/university_schema.sql","lab/db/university_data.sql","lab/db/extra_tables.sql","lab/db/p6_query_tables.sql"],"schemaGroups":[{"title":"University database (theo sách)","note":"","core":true,"tables":[{"table":"classroom","columns":[{"column":"building","type":"character varying(15)","pk":true},{"column":"room_number","type":"character varying(7)","pk":true},{"column":"capacity","type":"numeric(4,0)","pk":false}]},{"table":"department","columns":[{"column":"dept_name","type":"character varying(20)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"budget","type":"numeric(12,2)","pk":false}]},{"table":"course","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"title","type":"character varying(50)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"credits","type":"numeric(2,0)","pk":false}]},{"table":"instructor","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column":"name","type":"character varying(20)","pk":false},{"column":"dept_name","type":"character varying(20)","pk":false},{"column":"salary","type":"numeric(8,2)","pk":false}]},{"table":"section","columns":[{"column":"course_id","type":"character varying(8)","pk":true},{"column":"sec_id","type":"character varying(8)","pk":true},{"column":"semester","type":"character varying(6)","pk":true},{"column":"year","type":"numeric(4,0)","pk":true},{"column":"building","type":"character varying(15)","pk":false},{"column":"room_number","type":"character varying(7)","pk":false},{"column":"time_slot_id","type":"character varying(4)","pk":false}]},{"table":"teaches","columns":[{"column":"id","type":"character varying(5)","pk":true},{"column :"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"ch15","store":"15","short":"15","label":"Chương 15","navLabel":"Chương 15","kind":"Chương","title":"Query Processing","titleVi":"Xử lý truy vấn","summary":"\u003ch3>1. Các bước xử lý truy vấn (slide 15.3–15.6)\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Parsing & translation\u003c/strong>: kiểm tra cú pháp, tên bảng/cột, dịch SQL sang biểu thức đại số quan hệ.\u003c/li>\u003cli>\u003cstrong>Optimization\u003c/strong>: trong rất nhiều biểu thức tương đương và nhiều thuật toán cho mỗi phép toán, chọn \u003cstrong>evaluation plan\u003c/strong> có chi phí ước lượng thấp nhất (Chương 16).\u003c/li>\u003cli>\u003cstrong>Evaluation\u003c/strong>: query-execution engine chạy plan và trả kết quả.\u003c/li>\u003c/ol>\n\u003cp>Một \u003cstrong>evaluation plan\u003c/strong> = cây biểu thức đại số + chỉ rõ thuật toán cho từng nút (ví dụ \"dùng index trên salary\", \"hash join\") + cách các nút truyền dữ liệu (materialize hay pipeline). Trong PostgreSQL, \u003ccode>explain\u003c/code> in ra plan đã chọn.\u003c/p>\n\u003ch3>2. Mô hình chi phí (slide 15.7–15.9)\u003c/h3>\n\u003cp>Chi phí chủ yếu là I/O đĩa, đo bằng hai đại lượng:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>t\u003csub>T\u003c/sub>\u003c/strong> — thời gian truyền một block (block transfer), \u003cstrong>t\u003csub>S\u003c/sub>\u003c/strong> — thời gian một lần seek (định vị đầu đọc + rotational latency).\u003c/li>\u003cli>Chi phí của b block transfer và S seek: \u003cstrong>b · t\u003csub>T\u003c/sub> + S · t\u003csub>S\u003c/sub>\u003c/strong>. Ổ cứng: t\u003csub>S\u003c/sub> ≈ 4 ms, t\u003csub>T\u003c/sub> ≈ 0.1 ms (block 4 KB); SSD: t\u003csub>S\u003c/sub> ≈ 20–90 µs, t\u003csub>T\u003c/sub> ≈ 2–10 µs.\u003c/li>\u003cli>Bỏ qua chi phí CPU và chi phí \u003cstrong>ghi kết quả cuối\u003c/strong> ra đĩa (giống nhau giữa các plan).\u003c/li>\u003cli>Thường tính \u003cstrong>trường hợp xấu nhất\u003c/strong>: buffer chỉ có số block tối thiểu thuật toán cần. Ký hiệu: \u003cstrong>n\u003csub>r\u003c/sub>\u003c/strong> số tuple, \u003cstrong>b\u003csub>r\u003c/sub>\u003c/strong> số block của r, \u003cstrong>M\u003c/strong> số block bộ nhớ, \u003cstrong>h\u003csub>i\u003c/sub>\u003c/strong> chiều cao B⁺-tree.\u003c/li>\u003c/ul>\n\u003ch3>3. Selection (slide 15.10–15.20)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Thuật toán\u003c/th>\u003cth>Điều kiện\u003c/th>\u003cth>Chi phí (transfer, seek)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>A1\u003c/strong> linear scan\u003c/td>\u003ctd>mọi điều kiện\u003c/td>\u003ctd>b\u003csub>r\u003c/sub> transfer + 1 seek; nếu so sánh bằng trên khoá: trung bình b\u003csub>r\u003c/sub>/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A2\u003c/strong> primary B⁺-tree, bằng trên khoá\u003c/td>\u003ctd>\u003ccode>A = v\u003c/code>, A là khoá\u003c/td>\u003ctd>(h\u003csub>i\u003c/sub> + 1)(t\u003csub>T\u003c/sub> + t\u003csub>S\u003c/sub>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A3\u003c/strong> primary index, bằng trên không-khoá\u003c/td>\u003ctd>\u003ccode>A = v\u003c/code>\u003c/td>\u003ctd>h\u003csub>i\u003c/sub>(t\u003csub>T\u003c/sub> + t\u003csub>S\u003c/sub>) + t\u003csub>S\u003c/sub> + b · t\u003csub>T\u003c/sub> (b = số block chứa tuple khớp, nằm liên tiếp)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A4\u003c/strong> secondary index, bằng\u003c/td>\u003ctd>\u003ccode>A = v\u003c/code>\u003c/td>\u003ctd>khoá: (h\u003csub>i\u003c/sub> + 1)(t\u003csub>T\u003c/sub> + t\u003csub>S\u003c/sub>); không-khoá: (h\u003csub>i\u003c/sub> + n)(t\u003csub>T\u003c/sub> + t\u003csub>S\u003c/sub>) — \u003cstrong>mỗi tuple khớp có thể ở một block khác\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A5\u003c/strong> primary index, so sánh\u003c/td>\u003ctd>\u003ccode>A ≥ v\u003c/code> / \u003ccode>A ≤ v\u003c/code>\u003c/td>\u003ctd>≥: dùng index tìm v rồi scan tuần tự; ≤: scan từ đầu file tới khi > v, không cần index\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A6\u003c/strong> secondary index, so sánh\u003c/td>\u003ctd>\u003ccode>A ≥ v\u003c/code>\u003c/td>\u003ctd>duyệt lá của index; mỗi tuple một lần I/O — nhiều tuple thì \u003cstrong>linear scan rẻ hơn\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Điều kiện phức:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Conjunction\u003c/strong> \u003ccode>θ₁ ∧ θ₂ ∧ …\u003c/code>: (A7) dùng index cho một θᵢ rẻ nhất rồi kiểm tra phần còn lại trong bộ nhớ; (A8) composite index; (A9) \u003cstrong>giao các tập record pointer\u003c/strong> từ nhiều index rồi mới đọc tuple.\u003c/li>\u003cli>\u003cstrong>Disjunction\u003c/strong> \u003ccode>θ₁ ∨ θ₂\u003c/code>: (A10) \u003cstrong>hợp\u003c/strong> các tập pointer — chỉ được khi \u003cstrong>mọi\u003c/strong> θᵢ đều có index, nếu không thì linear scan.\u003c/li>\u003cli>\u003cstrong>Negation\u003c/strong> \u003ccode>¬θ\u003c/code>: thường linear scan; nếu ít tuple thoả ¬θ và có index thì dùng index (ví dụ \u003ccode>¬(A &lt; v)\u003c/code> ≡ \u003ccode>A ≥ v\u003c/code> — PE 15.6).\u003c/li>\u003cli>\u003cstrong>Bitmap index scan\u003c/strong> (PostgreSQL): lấy tập pointer từ index, sắp theo địa chỉ vật lý thành bitmap, rồi đọc các block theo thứ tự — tránh lỗi \"mỗi tuple một seek\" của A6.\u003c/li>\u003c/ul>\n\u003ch3>4. Sorting — external sort-merge (slide 15.21–15.27)\u003c/h3>\n\u003cp>Khi quan hệ không vừa bộ nhớ (M block):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Tạo run\u003c/strong>: đọc M block, sắp trong bộ nhớ, ghi ra thành một \u003cstrong>run\u003c/strong>. Được ⌈b\u003csub>r\u003c/sub>/M⌉ run.\u003c/li>\u003cli>\u003cstrong>Merge\u003c/strong>: mỗi pass trộn tối đa \u003cstrong>M − 1\u003c/strong> run (M − 1 block input + 1 block output). Lặp tới khi còn một run.\u003c/li>\u003c/ol>\n\u003cp>Với b\u003csub>b\u003c/sub> block buffer cho mỗi run (để giảm seek), fan-in là ⌊M/b\u003csub>b\u003c/sub>⌋ − 1:\u003c/p>\n\u003cul>\u003cli>Số pass merge: \u003cstrong>⌈log\u003csub>⌊M/bb⌋−1\u003c/sub>(b\u003csub>r\u003c/sub>/M)⌉\u003c/strong>.\u003c/li>\u003cli>Block transfer: \u003cstrong>b\u003csub>r\u003c/sub>(2⌈log\u003csub>⌊M/bb⌋−1\u003c/sub>(b\u003csub>r\u003c/sub>/M)⌉ + 1)\u003c/strong> (không tính ghi kết quả cuối).\u003c/li>\u003cli>Seek: \u003cstrong>2⌈b\u003csub>r\u003c/sub>/M⌉ + ⌈b\u003csub>r\u003c/sub>/b\u003csub>b\u003c/sub>⌉(2⌈log\u003csub>⌊M/bb⌋−1\u003c/sub>(b\u003csub>r\u003c/sub>/M)⌉ − 1)\u003c/strong>.\u003c/li>\u003cli>Tăng b\u003csub>b\u003c/sub>: ít seek hơn nhưng fan-in nhỏ đi → có thể thêm pass (PE 15.9).\u003c/li>\u003c/ul>\n\u003ch3>5. Join (slide 15.28–15.50) — r là outer, s là inner\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Thuật toán\u003c/th>\u003cth>Block transfer\u003c/th>\u003cth>Seek\u003c/th>\u003cth>Ghi chú\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Nested-loop\u003c/strong> (xấu nhất)\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> · b\u003csub>s\u003c/sub> + b\u003csub>r\u003c/sub>\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> + b\u003csub>r\u003c/sub>\u003c/td>\u003ctd>mọi điều kiện join; nếu bảng nhỏ vừa bộ nhớ: b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>, 2 seek\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Block nested-loop\u003c/strong>\u003c/td>\u003ctd>⌈b\u003csub>r\u003c/sub>/(M − 2)⌉ · b\u003csub>s\u003c/sub> + b\u003csub>r\u003c/sub>\u003c/td>\u003ctd>2⌈b\u003csub>r\u003c/sub>/(M − 2)⌉\u003c/td>\u003ctd>M − 2 block cho outer, 1 cho inner, 1 cho output; chọn \u003cstrong>bảng nhỏ làm outer\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Indexed nested-loop\u003c/strong>\u003c/td>\u003ctd>b\u003csub>r\u003c/sub>(t\u003csub>T\u003c/sub> + t\u003csub>S\u003c/sub>) + n\u003csub>r\u003c/sub> · c\u003c/td>\u003ctd>\u003c/td>\u003ctd>c = chi phí một lần tra index trên s; chỉ cho equi-join/natural join\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Merge join\u003c/strong>\u003c/td>\u003ctd>b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub> (+ chi phí sort)\u003c/td>\u003ctd>⌈b\u003csub>r\u003c/sub>/b\u003csub>b\u003c/sub>⌉ + ⌈b\u003csub>s\u003c/sub>/b\u003csub>b\u003c/sub>⌉\u003c/td>\u003ctd>hai bảng đã sắp theo thuộc tính join; equi/natural join\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hash join\u003c/strong> (không đệ quy)\u003c/td>\u003ctd>3(b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>) + 4n\u003csub>h\u003c/sub>\u003c/td>\u003ctd>2(⌈b\u003csub>r\u003c/sub>/b\u003csub>b\u003c/sub>⌉ + ⌈b\u003csub>s\u003c/sub>/b\u003csub>b\u003c/sub>⌉) + 2n\u003csub>h\u003c/sub>\u003c/td>\u003ctd>s là \u003cstrong>build\u003c/strong> (nhỏ hơn), r là \u003cstrong>probe\u003c/strong>; cần M > n\u003csub>h\u003c/sub> + 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hash join\u003c/strong> (đệ quy)\u003c/td>\u003ctd>2(b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>)⌈log\u003csub>M−1\u003c/sub>(b\u003csub>s\u003c/sub>) − 1⌉ + b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>\u003c/td>\u003ctd>\u003c/td>\u003ctd>khi build không chia vừa bộ nhớ trong một lần\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Hash join\u003c/strong>: dùng hàm băm h chia r và s thành n\u003csub>h\u003c/sub> partition theo thuộc tính join; tuple của rᵢ chỉ có thể khớp với sᵢ. Với mỗi i: nạp sᵢ, dựng hash index trong bộ nhớ, đọc rᵢ và probe. \u003cstrong>Overflow\u003c/strong> khi một partition quá lớn (skew) → chia tiếp hoặc dùng fudge factor ~1.2.\u003c/li>\u003cli>\u003cstrong>Hybrid hash join\u003c/strong>: giữ partition s₀ trong bộ nhớ ngay ở pha chia, tiết kiệm ghi/đọc lại s₀ và r₀.\u003c/li>\u003cli>\u003cstrong>Hybrid merge join\u003c/strong>: một bảng đã sắp, bảng kia có secondary B⁺-tree: merge bảng đã sắp với \u003cstrong>lá\u003c/strong> của index, rồi sắp kết quả theo địa chỉ để đọc tuple (giống ý của PE 15.4).\u003c/li>\u003cli>Điều kiện phức: conjunction → join theo một điều kiện rồi lọc phần còn lại; disjunction → hợp kết quả từng điều kiện.\u003c/li>\u003c/ul>\n\u003ch3>6. Các phép toán khác (slide 15.51–15.57)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Loại trùng (distinct)\u003c/strong>: sort rồi bỏ các tuple liền kề giống nhau, hoặc hash (tuple trùng rơi vào cùng bucket). Có thể loại trùng ngay khi tạo run/merge.\u003c/li>\u003cli>\u003cstrong>Projection\u003c/strong>: chiếu từng tuple rồi loại trùng.\u003c/li>\u003cli>\u003cstrong>Union / intersect / except\u003c/strong>: sort hai bảng rồi duyệt song song, hoặc chia partition bằng hash rồi xử lý từng cặp.\u003c/li>\u003cli>\u003cstrong>Outer join\u003c/strong>: biến thể của merge/hash join, thêm tuple không khớp kèm null; hoặc join + phần anti-join.\u003c/li>\u003cli>\u003cstrong>Aggregation\u003c/strong> (\u003ccode>group by\u003c/code>): giống loại trùng — sort/hash theo thuộc tính nhóm, gộp \u003cstrong>từng phần\u003c/strong> (partial aggregate: count, sum, min, max; avg = sum/count) ngay khi tạo run.\u003c/li>\u003cli>\u003cstrong>Semijoin r ⋉\u003csub>θ\u003c/sub> s / anti-semijoin\u003c/strong> (PE 15.10): giữ tuple của r có (không có) tuple khớp trong s — đúng ngữ nghĩa \u003ccode>exists\u003c/code> / \u003ccode>not exists\u003c/code>, \u003cstrong>giữ nguyên số lần lặp của r\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>7. Đánh giá biểu thức: materialization và pipelining (slide 15.58–15.68)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Materialization\u003c/strong>: tính từng phép toán, ghi kết quả trung gian ra đĩa, phép trên đọc lại. Luôn dùng được; tốn thêm chi phí ghi/đọc.\u003c/li>\u003cli>\u003cstrong>Pipelining\u003c/strong>: chuyển tuple sang phép trên ngay khi sinh ra, không ghi tạm. Không dùng được với phép \u003cstrong>blocking\u003c/strong> (sort, hash join cần đọc hết build trước khi probe, aggregation).\u003c/li>\u003cli>\u003cstrong>Demand-driven (lazy, pull)\u003c/strong>: phép trên gọi \u003ccode>next()\u003c/code> của phép dưới; mỗi phép là một \u003cstrong>iterator\u003c/strong> với \u003ccode>open()\u003c/code>, \u003ccode>next()\u003c/code>, \u003ccode>close()\u003c/code> và lưu \u003cstrong>trạng thái\u003c/strong> giữa các lần gọi. Tốt cho top-K (PE 15.11).\u003c/li>\u003cli>\u003cstrong>Producer-driven (eager, push)\u003c/strong>: phép dưới chủ động sinh tuple vào buffer cho phép trên; dừng khi buffer đầy. Hit rate của instruction cache tốt hơn (PE 15.12).\u003c/li>\u003cli>\u003cstrong>Double buffering\u003c/strong>: dùng hai buffer để vừa xử lý vừa đọc trước.\u003c/li>\u003c/ul>\n\u003ch3>8. Truy vấn trong bộ nhớ và column store (slide 15.69+)\u003c/h3>\n\u003cul>\u003cli>Khi dữ liệu nằm sẵn trong bộ nhớ, chi phí chính là \u003cstrong>cache miss\u003c/strong> của CPU: dùng thuật toán cache-conscious (sort/hash theo khối vừa cache), \u003cstrong>query compilation\u003c/strong> (biên dịch plan thành mã máy) thay vì thông dịch.\u003c/li>\u003cli>\u003cstrong>Column store\u003c/strong>: mỗi cột lưu riêng → hợp với truy vấn đọc ít cột trên nhiều dòng (aggregation, phân tích); không hợp với truy vấn đọc trọn một dòng (PE 15.16). Join nên làm trên \u003cstrong>cột join\u003c/strong> trước rồi mới ghép tuple (PE 15.15).\u003c/li>\u003c/ul>\n\u003ch3>Công thức hay thi\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câu hỏi\u003c/th>\u003cth>Công thức\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Số block\u003c/td>\u003ctd>b\u003csub>r\u003c/sub> = ⌈n\u003csub>r\u003c/sub> / f\u003csub>r\u003c/sub>⌉ (f\u003csub>r\u003c/sub> tuple/block)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nested-loop\u003c/td>\u003ctd>n\u003csub>r\u003c/sub>·b\u003csub>s\u003c/sub> + b\u003csub>r\u003c/sub> transfer, n\u003csub>r\u003c/sub> + b\u003csub>r\u003c/sub> seek\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Block nested-loop\u003c/td>\u003ctd>⌈b\u003csub>r\u003c/sub>/(M−2)⌉·b\u003csub>s\u003c/sub> + b\u003csub>r\u003c/sub>; xấu nhất (M = 3): b\u003csub>r\u003c/sub>·b\u003csub>s\u003c/sub> + b\u003csub>r\u003c/sub>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merge join (chưa sort)\u003c/td>\u003ctd>sort(r) + sort(s) + b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hash join\u003c/td>\u003ctd>3(b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>) + 4n\u003csub>h\u003c/sub>, cần M > n\u003csub>h\u003c/sub> + 1 với n\u003csub>h\u003c/sub> ≈ ⌈b\u003csub>s\u003c/sub>/M⌉\u003c/td>\u003c/tr>\u003ctr>\u003ctd>External sort\u003c/td>\u003ctd>b\u003csub>r\u003c/sub>(2⌈log\u003csub>M−1\u003c/sub>(b\u003csub>r\u003c/sub>/M)⌉ + 1)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Lưu ý: lời giải PE 15.3 trong sách dùng \u003cstrong>M − 1\u003c/strong> cho block nested-loop và gộp seek với transfer thành \"disk access\"; slide và bài tập ở đây dùng \u003cstrong>M − 2\u003c/strong> và tách riêng seek như sách bản 7.\u003c/p>","quiz":[{"q":"Chi phí của một plan được đo bằng gì trong mô hình của sách?","options":["Số tuple kết quả","Số block transfer và số seek","Thời gian CPU","Số phép so sánh"],"answer":1,"explain":"b · t_T + S · t_S; CPU và chi phí ghi kết quả cuối được bỏ qua."},{"q":"Selection \u003ccode>salary &gt; 50000\u003c/code> dùng secondary B⁺-tree trên salary. Khi nào linear scan lại rẻ hơn?","options":["Khi bảng nhỏ","Khi có nhiều tuple thoả điều kiện","Khi index là clustered","Không bao giờ"],"answer":1,"explain":"Mỗi tuple khớp qua secondary index có thể cần một seek + transfer riêng; nhiều tuple thì tốn hơn đọc tuần tự cả bảng."},{"q":"Disjunction \u003ccode>θ₁ ∨ θ₂\u003c/code> dùng được phép hợp các tập record pointer (A10) khi nào?","options":["Khi có index cho ít nhất một θᵢ","Khi có index cho mọi θᵢ","Khi bảng đã sắp","Luôn luôn"],"answer":1,"explain":"Thiếu index cho một θᵢ thì vẫn phải linear scan để tìm tuple thoả θᵢ đó, nên scan luôn cả bảng."},{"q":"External sort-merge với M block bộ nhớ: mỗi pass merge trộn được tối đa bao nhiêu run?","options":["M","M − 1","M − 2","2"],"answer":1,"explain":"M − 1 block làm input (mỗi run một block), 1 block làm output."},{"q":"Block nested-loop join: nên chọn bảng nào làm outer?","options":["Bảng có nhiều tuple hơn","Bảng có ít block hơn","Bảng có index","Không quan trọng"],"answer":1,"explain":"Chi phí ⌈b_r/(M−2)⌉·b_s + b_r: outer nhỏ thì inner bị quét ít lần hơn."},{"q":"Merge join và hash join dùng được cho loại điều kiện join nào?","options":["Mọi điều kiện θ","Chỉ equi-join và natural join","Chỉ điều kiện \u003c","Chỉ cross join"],"answer":1,"explain":"Cả hai dựa trên việc tuple khớp có cùng giá trị thuộc tính join (cùng vị trí khi sắp, cùng partition khi băm)."},{"q":"Trong hash join, quan hệ build nên là quan hệ nào?","options":["Quan hệ lớn hơn","Quan hệ nhỏ hơn","Quan hệ đã sắp","Quan hệ có index"],"answer":1,"explain":"Mỗi partition của build phải vừa bộ nhớ để dựng hash index; build nhỏ thì ít partition, ít khả năng phải chia đệ quy."},{"q":"Phép toán nào là blocking, không pipeline trọn vẹn được?","options":["Selection","Projection không loại trùng","Sort","Indexed nested-loop join với outer được pipeline"],"answer":2,"explain":"Sort phải đọc hết input mới sinh được tuple đầu tiên của kết quả."},{"q":"Truy vấn chỉ cần K kết quả đầu tiên: nên dùng kiểu pipelining nào?","options":["Producer-driven","Demand-driven","Materialization","Không khác nhau"],"answer":1,"explain":"Demand-driven chỉ sinh tuple khi được gọi next(); producer-driven có thể sinh rất nhiều tuple không dùng (PE 15.11)."},{"q":"Multiset semijoin r ⋉ s: tuple xuất hiện 2 lần trong r và khớp 3 tuple của s thì xuất hiện bao nhiêu lần trong kết quả?","options":["1","2","3","6"],"answer":1,"explain":"Semijoin giữ đúng số lần lặp của r (giống where exists); join thường mới cho 6."},{"q":"Vì sao column store hợp với truy vấn \"tổng số sinh viên theo (year, course_id) trên takes\"?","options":["Vì cần đọc trọn từng dòng","Vì chỉ đọc vài cột trên rất nhiều dòng","Vì có index","Vì takes nhỏ"],"answer":1,"explain":"Chỉ cần cột year, course_id (và ID): column store đọc ít dữ liệu hơn hẳn và nén tốt (PE 15.16b)."}],"questions":[{"q":"\u003cstrong>PE 15.1\u003c/strong> — Mỗi block một tuple, bộ nhớ 3 block. Liệt kê các run sau từng pass của external sort-merge khi sắp 12 tuple theo thuộc tính đầu.","en":"\u003cp>\u003cstrong>Exercise 15.1.\u003c/strong> For simplicity, assume that a block holds exactly one tuple and that memory can hold at most three blocks. Sort the following tuples on their first attribute with the external sort-merge algorithm, and show the runs produced in every pass: (kangaroo, 17), (wallaby, 21), (emu, 1), (wombat, 13), (platypus, 3), (lion, 8), (warthog, 4), (zebra, 11), (meerkat, 6), (hyena, 9), (hornbill, 2), (baboon, 12).\u003c/p>","answer":"\u003cp>Đánh số t₁ = (kangaroo, 17) … t₁₂ = (baboon, 12) theo thứ tự đọc.\u003c/p>\n\u003cp>\u003cstrong>Tạo run\u003c/strong> (mỗi lần đọc M = 3 block, sắp trong bộ nhớ):\u003c/p>\n\u003cul>\u003cli>r₁₁ = ⟨emu, kangaroo, wallaby⟩ (t₃, t₁, t₂)\u003c/li>\u003cli>r₁₂ = ⟨lion, platypus, wombat⟩ (t₆, t₅, t₄)\u003c/li>\u003cli>r₁₃ = ⟨meerkat, warthog, zebra⟩ (t₉, t₇, t₈)\u003c/li>\u003cli>r₁₄ = ⟨baboon, hornbill, hyena⟩ (t₁₂, t₁₁, t₁₀)\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Merge\u003c/strong> — theo thuật toán của sách, mỗi pass trộn M − 1 = \u003cstrong>2\u003c/strong> run (1 block làm output):\u003c/p>\n\u003cul>\u003cli>Pass 1: r₂₁ = ⟨emu, kangaroo, lion, platypus, wallaby, wombat⟩, r₂₂ = ⟨baboon, hornbill, hyena, meerkat, warthog, zebra⟩\u003c/li>\u003cli>Pass 2: r₃₁ = ⟨baboon, emu, hornbill, hyena, kangaroo, lion, meerkat, platypus, wallaby, warthog, wombat, zebra⟩\u003c/li>\u003c/ul>\n\u003cp>Lời giải in của sách trộn \u003cstrong>3\u003c/strong> run mỗi pass (
