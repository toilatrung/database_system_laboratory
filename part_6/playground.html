không dành block cho output): pass 1 cho r₂₁ = 9 tuple đầu đã sắp (t₃, t₁, t₆, t₉, t₅, t₂, t₇, t₄, t₈) và r₂₂ = r₁₄; pass 2 cho run cuối. Cả hai cách đều \u003cstrong>2 pass merge\u003c/strong>. Bài CH15.01–CH15.02 tái hiện các run này bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 15.2\u003c/strong> — Viết biểu thức đại số quan hệ hiệu quả cho truy vấn tìm branch có assets lớn hơn assets của một branch nào đó ở Brooklyn.","en":"\u003cp>\u003cstrong>Exercise 15.2.\u003c/strong> Using the bank database of Figure 15.14 (primary keys underlined), consider the SQL query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select T.branch_name\nfrom branch T, branch S\nwhere T.assets &gt; S.assets and S.branch_city = 'Brooklyn'\u003c/code>\u003c/pre>\n\u003cp>Give an efficient relational-algebra expression equivalent to this query, and justify why you chose it.\u003c/p>\n\u003cp>\u003cem>Figure 15.14 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","answer":"\u003cp>Đẩy selection và projection xuống trước theta join:\u003c/p>\n\u003cp>Π\u003csub>T.branch_name\u003c/sub>( (Π\u003csub>branch_name, assets\u003c/sub>(ρ\u003csub>T\u003c/sub>(branch))) ⋈\u003csub>T.assets > S.assets\u003c/sub> (Π\u003csub>assets\u003c/sub>(σ\u003csub>branch_city = 'Brooklyn'\u003c/sub>(ρ\u003csub>S\u003c/sub>(branch)))) )\u003c/p>\n\u003cp>Lý do: theta join là phép đắt nhất (không dùng được hash/merge join, thường là nested-loop) nên phải chạy trên \u003cstrong>ít dữ liệu nhất\u003c/strong>: vế phải chỉ còn các branch ở Brooklyn và chỉ cột assets; vế trái chỉ hai cột cần.\u003c/p>\n\u003cp>Tốt hơn nữa: \"assets lớn hơn \u003cstrong>một\u003c/strong> branch Brooklyn nào đó\" ⇔ assets > \u003cstrong>min\u003c/strong> assets ở Brooklyn, nên thay join bằng một aggregate:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select branch_name from branch\nwhere assets &gt; (select min(assets) from branch where branch_city = 'Brooklyn');\u003c/code>\u003c/pre>\n\u003cp>Một lần quét lấy min, một lần quét lọc — tuyến tính thay vì bình phương (CH15.07). Lưu ý câu SQL gốc trả về một branch \u003cstrong>nhiều lần\u003c/strong> (mỗi branch Brooklyn nhỏ hơn một lần); biểu thức đại số (tập hợp) thì không.\u003c/p>"},{"q":"\u003cstrong>PE 15.3\u003c/strong> — r₁: 20 000 tuple, 25 tuple/block; r₂: 45 000 tuple, 30 tuple/block. Ước lượng block transfer và seek cho r₁ ⋈ r₂ bằng nested-loop, block nested-loop, merge join, hash join.","en":"\u003cp>\u003cstrong>Exercise 15.3.\u003c/strong> Relations r\u003csub>1\u003c/sub>(A, B, C) and r\u003csub>2\u003c/sub>(C, D, E) have these properties: r\u003csub>1\u003c/sub> contains 20,000 tuples and r\u003csub>2\u003c/sub> contains 45,000 tuples; one block holds 25 tuples of r\u003csub>1\u003c/sub> or 30 tuples of r\u003csub>2\u003c/sub>. For r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub>, estimate the number of block transfers and seeks needed by each join strategy below:\u003c/p>\n\u003cp>a. Nested-loop join.\u003c/p>\n\u003cp>b. Block nested-loop join.\u003c/p>\n\u003cp>c. Merge join.\u003c/p>\n\u003cp>d. Hash join.\u003c/p>","answer":"\u003cp>b\u003csub>r1\u003c/sub> = 20000/25 = \u003cstrong>800\u003c/strong>, b\u003csub>r2\u003c/sub> = 45000/30 = \u003cstrong>1500\u003c/strong>. Nếu M > 800 + 2 thì mọi cách đều chỉ đọc mỗi bảng một lần: 2300 transfer. Xét M nhỏ hơn.\u003c/p>\n\u003cp>\u003cstrong>a. Nested-loop\u003c/strong> (xấu nhất):\u003c/p>\n\u003cul>\u003cli>r₁ outer: 20000 × 1500 + 800 = \u003cstrong>30 000 800\u003c/strong> transfer, 20000 + 800 = 20 800 seek.\u003c/li>\u003cli>r₂ outer: 45000 × 800 + 1500 = \u003cstrong>36 001 500\u003c/strong> transfer, 46 500 seek. → chọn r₁ làm outer.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>b. Block nested-loop\u003c/strong>: r₁ outer: ⌈800/(M−2)⌉ × 1500 + 800 transfer, 2⌈800/(M−2)⌉ seek. Xấu nhất M = 3: 800 × 1500 + 800 = 1 200 800. Với M = 52: 16 × 1500 + 800 = 24 800. (r₂ outer: ⌈1500/(M−2)⌉ × 800 + 1500, tệ hơn.)\u003c/p>\n\u003cp>\u003cstrong>c. Merge join\u003c/strong> (hai bảng chưa sắp): sort mỗi bảng tốn b(2⌈log\u003csub>M−1\u003c/sub>(b/M)⌉ + 1) transfer (cộng thêm b nếu tính ghi kết quả sort ra đĩa), rồi merge 800 + 1500 = 2300 transfer (giả sử các tuple cùng giá trị join vừa bộ nhớ). Ví dụ M = 52: sort r₁ cần ⌈log₅₁(800/52)⌉ = 1 pass → 800 × 3 = 2400 (+800 ghi), r₂: ⌈log₅₁(1500/52)⌉ = 1 → 4500 (+1500); tổng ≈ 2400 + 800 + 4500 + 1500 + 2300 = 11 500.\u003c/p>\n\u003cp>\u003cstrong>d. Hash join\u003c/strong>: r₁ nhỏ hơn làm build. n\u003csub>h\u003c/sub> ≈ ⌈800/M⌉. Không cần chia đệ quy khi M > n\u003csub>h\u003c/sub> + 1 (khoảng M ≥ 30): 3(1500 + 800) + 4n\u003csub>h\u003c/sub> ≈ \u003cstrong>6900\u003c/strong> transfer (sách bỏ qua 4n\u003csub>h\u003c/sub>); seek 2(800 + 1500) + 2n\u003csub>h\u003c/sub> nếu b\u003csub>b\u003c/sub> = 1. Nếu M nhỏ (ví dụ 12): 2(2300)⌈log₁₁(800) − 1⌉ + 2300 = 4600 × 2 + 2300 = 11 500.\u003c/p>\n\u003cp>Các bài CH15.04–CH15.06 tính các số này bằng SQL từ bảng \u003ccode>qp_rel_stats\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 15.4\u003c/strong> — Vì sao indexed nested-loop join kém hiệu quả với secondary index khi nhiều tuple cùng giá trị join? Cách cải thiện bằng sort, và khi nào nó tốt hơn hybrid merge join?","en":"\u003cp>\u003cstrong>Exercise 15.4.\u003c/strong> The indexed nested-loop join of Section 15.5.3 may perform poorly when the index is a secondary index and many tuples share the same join-attribute value. Explain why it is inefficient. Describe a technique based on sorting that lowers the cost of fetching the tuples of the inner relation. Under which conditions would this technique beat hybrid merge join?\u003c/p>","answer":"\u003cp>Với secondary index, các tuple của inner có cùng giá trị join nằm rải rác: mỗi tuple của outer có thể kéo theo \u003cstrong>một seek + một transfer cho mỗi tuple khớp\u003c/strong> của inner, và cùng một block inner bị đọc đi đọc lại cho nhiều tuple outer.\u003c/p>\n\u003cp>Cải thiện: join outer với \u003cstrong>lá của secondary index\u003c/strong> (chỉ lấy record pointer của inner), hoãn việc đọc tuple inner. Kết quả trung gian (tuple outer, pointer) được \u003cstrong>sắp theo địa chỉ vật lý\u003c/strong> của pointer, rồi đọc các block inner \u003cstrong>theo thứ tự vật lý\u003c/strong> — mỗi block chỉ đọc một lần, seek ít.\u003c/p>\n\u003cp>So với hybrid merge join: hybrid merge join đòi outer \u003cstrong>đã sắp\u003c/strong> theo thuộc tính join (hoặc phải sort outer). Cách trên không cần outer sắp, nhưng mỗi tuple outer phải tra index một lần. Khi \u003cstrong>outer nhỏ hơn nhiều so với inner\u003c/strong> (hoặc outer chưa sắp và việc sort tốn kém), tổng chi phí tra index nhỏ hơn chi phí sort → cách trên tốt hơn.\u003c/p>"},{"q":"\u003cstrong>PE 15.5\u003c/strong> — r, s không index, chưa sắp, bộ nhớ vô hạn: cách nào rẻ nhất để tính r ⋈ s, và cần bao nhiêu bộ nhớ?","en":"\u003cp>\u003cstrong>Exercise 15.5.\u003c/strong> Relations r and s have no indices and are not sorted. If memory were unlimited, what would be the cheapest way (counting I/O operations) to compute r ⋈ s, and how much memory would that algorithm need?\u003c/p>","answer":"\u003cp>Đọc \u003cstrong>toàn bộ bảng nhỏ hơn\u003c/strong> vào bộ nhớ (có thể dựng hash index trên nó), rồi đọc bảng lớn từng block và join với bảng trong bộ nhớ (nested-loop với bảng lớn làm outer, hoặc probe hash).\u003c/p>\n\u003cul>\u003cli>I/O: \u003cstrong>b\u003csub>r\u003c/sub> + b\u003csub>s\u003c/sub>\u003c/strong> block transfer (mỗi bảng đọc đúng một lần) — đây là cận dưới, vì mọi thuật toán đều phải đọc cả hai bảng ít nhất một lần. Seek: khoảng 2.\u003c/li>\u003cli>Bộ nhớ: \u003cstrong>min(b\u003csub>r\u003c/sub>, b\u003csub>s\u003c/sub>) + 2\u003c/strong> block — bảng nhỏ, một block input cho bảng lớn, một block output.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 15.6\u003c/strong> — branch có B⁺-tree trên branch_city. Các cách xử lý selection có phủ định: (a) ¬(city \u003c Brooklyn), (b) ¬(city = Brooklyn), (c) ¬(city \u003c Brooklyn ∨ assets \u003c 5000).","en":"\u003cp>\u003cstrong>Exercise 15.6.\u003c/strong> Using the bank database of Figure 15.14 (primary keys underlined), suppose relation \u003cem>branch\u003c/em> has a B\u003csup>+\u003c/sup>-tree index on \u003cem>branch_city\u003c/em> and no other index. List the different ways of evaluating each of the following selections that contain negation:\u003c/p>\n\u003cp>a. σ\u003csub>¬(branch_city \u003c “Brooklyn”)\u003c/sub>(\u003cem>branch\u003c/em>)\u003c/p>\n\u003cp>b. σ\u003csub>¬(branch_city = “Brooklyn”)\u003c/sub>(\u003cem>branch\u003c/em>)\u003c/p>\n\u003cp>c. σ\u003csub>¬(branch_city \u003c “Brooklyn” ∨ assets \u003c 5000)\u003c/sub>(\u003cem>branch\u003c/em>)\u003c/p>\n\u003cp>\u003cem>Figure 15.14 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","answer":"\u003cp>a. ¬(branch_city \u003c 'Brooklyn') ≡ \u003cstrong>branch_city ≥ 'Brooklyn'\u003c/strong>: dùng index tìm entry đầu tiên có giá trị 'Brooklyn', rồi đi theo lá (hoặc file nếu index là primary) tới cuối. Hoặc linear scan nếu phần lớn tuple thoả.\u003c/p>\n\u003cp>b. ¬(branch_city = 'Brooklyn') ≡ \u003cstrong>branch_city ≠ 'Brooklyn'\u003c/strong>: gần như mọi tuple thoả, index không giúp gì → \u003cstrong>linear scan\u003c/strong>. (Có thể dùng index cho hai khoảng \u003c và > rồi hợp, nhưng chỉ đáng nếu rất ít tuple khác Brooklyn — vô lý trong thực tế.)\u003c/p>\n\u003cp>c. Theo De Morgan: ¬(A ∨ B) ≡ ¬A ∧ ¬B → \u003cstrong>branch_city ≥ 'Brooklyn' ∧ assets ≥ 5000\u003c/strong>. Dùng index trên branch_city lấy các tuple có city ≥ 'Brooklyn' (như câu a), kiểm tra thêm assets ≥ 5000 trên từng tuple (A7). Hoặc linear scan nếu điều kiện city không chọn lọc.\u003c/p>\n\u003cp>(Lời giải sách viết \"assets \u003c 5000\" ở phần kiểm tra — nhầm dấu; phủ định của assets \u003c 5000 là assets ≥ 5000.) Bài CH15.08 viết lại câu c không dùng \u003ccode>not\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 15.7\u003c/strong> — Viết pseudocode iterator cho indexed nested-loop join với outer được pipeline: open(), next(), close() và trạng thái cần lưu.","en":"\u003cp>\u003cstrong>Exercise 15.7.\u003c/strong> Write pseudocode for an iterator implementing indexed nested-loop join in which the outer relation is pipelined. The pseudocode must define the standard iterator functions \u003cem>open\u003c/em>(), \u003cem>next\u003c/em>(), and \u003cem>close\u003c/em>(), and must show which state the iterator keeps between calls.\u003c/p>","answer":"\u003cp>Trạng thái giữa các lần gọi: iterator \u003cstrong>outer\u003c/strong> (input pipeline), iterator \u003cstrong>inner\u003c/strong> (tra index trên s theo giá trị join), tuple outer hiện tại \u003cstrong>t\u003csub>r\u003c/sub>\u003c/strong>, cờ \u003cstrong>done\u003csub>r\u003c/sub>\u003c/strong> (outer đã hết chưa).\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>open():\n  outer.open(); inner.open()\n  if outer.next() then t_r := tuple vừa lấy; done_r := false\n  else done_r := true\n  if not done_r then inner.lookup(t_r[JoinAttrs])   -- định vị các tuple khớp\n\nnext():\n  while not done_r:\n    if inner.next() then                 -- còn tuple s khớp với t_r\n      t_s := tuple vừa lấy\n      return t_r ⋈ t_s\n    else if outer.next() then            -- hết khớp: sang tuple outer kế tiếp\n      t_r := tuple vừa lấy\n      inner.lookup(t_r[JoinAttrs])       -- tra index lại với giá trị mới\n    else\n      done_r := true\n  return \"hết dữ liệu\"\n\nclose():\n  outer.close(); inner.close()\u003c/code>\u003c/pre>\n\u003cp>Điểm mấu chốt: \u003ccode>next()\u003c/code> trả về \u003cstrong>đúng một\u003c/strong> tuple rồi dừng, nên phải nhớ t\u003csub>r\u003c/sub> và vị trí của inner để lần gọi sau tiếp tục từ đó.\u003c/p>"},{"q":"\u003cstrong>PE 15.8\u003c/strong> — Thiết kế thuật toán dựa trên sort và dựa trên hash cho phép chia r(T ∪ S) ÷ s(S).","en":"\u003cp>\u003cstrong>Exercise 15.8.\u003c/strong> Design one sorting-based and one hashing-based algorithm for computing the relational division operation (Practice Exercise 2.9 defines division).\u003c/p>","answer":"\u003cp>\u003cstrong>Sort-based\u003c/strong>: sắp s theo S; sắp r theo (T, S). Duyệt r theo nhóm cùng giá trị T; với mỗi nhóm, duyệt song song nhóm đó với s (như merge join) và kiểm tra \u003cstrong>mọi\u003c/strong> tuple của s đều xuất hiện làm phần S của nhóm. Nếu đúng, xuất giá trị T. Bỏ qua tuple trùng (r có thể có trùng). Sau khi sắp: r đọc một lần, s đọc lại một lần cho mỗi nhóm: |r| + N·|s| với N = số giá trị T khác nhau (s thường nhỏ, giữ trong bộ nhớ thì chỉ |r| + |s|).\u003c/p>\n\u003cp>\u003cstrong>Hash-based\u003c/strong>: giả sử mọi tuple r cùng một giá trị T vừa bộ nhớ. Chia r thành partition theo \u003cstrong>hash(T)\u003c/strong> sao cho mỗi partition vừa bộ nhớ. Với mỗi partition: dựng hash table trên các cặp (T, S) và một tập các giá trị T khác nhau. Với mỗi giá trị v\u003csub>T\u003c/sub> và mỗi tuple của s, probe (v\u003csub>T\u003c/sub>, s); thiếu bất kỳ cặp nào thì loại v\u003csub>T\u003c/sub>, ngược lại xuất v\u003csub>T\u003c/sub>. Tương đương: đếm số giá trị S khác nhau (thuộc s) của mỗi T và so với |s| — chính là \u003ccode>group by T having count(distinct S) = (select count(*) from s)\u003c/code> (CH15.11).\u003c/p>\n\u003cp>Nếu một nhóm T không vừa bộ nhớ: chia cả r và s theo hash(S) thành cặp (rᵢ, sᵢ), chạy thuật toán trên từng cặp, rồi lấy \u003cstrong>giao\u003c/strong> các tập T kết quả của mọi cặp.\u003c/p>"},{"q":"\u003cstrong>PE 15.9\u003c/strong> — Bộ nhớ dành cho merge cố định, tăng số buffer block cho mỗi run thì chi phí merge thay đổi thế nào?","en":"\u003cp>\u003cstrong>Exercise 15.9.\u003c/strong> Suppose the total memory available for buffering runs stays the same, but the number of buffer blocks given to each run is increased. How does this affect the cost of merging runs?\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Seek giảm\u003c/strong>: mỗi lần đọc một run ta đọc b\u003csub>b\u003c/sub> block liên tiếp với một seek, nên số seek mỗi pass ≈ 2⌈b\u003csub>r\u003c/sub>/b\u003csub>b\u003c/sub>⌉.\u003c/li>\u003cli>\u003cstrong>Fan-in giảm\u003c/strong>: số run trộn được mỗi pass là ⌊M/b\u003csub>b\u003c/sub>⌋ − 1, nên số pass ⌈log\u003csub>⌊M/bb⌋−1\u003c/sub>(b\u003csub>r\u003c/sub>/M)⌉ có thể \u003cstrong>tăng\u003c/strong>, mỗi pass thêm 2b\u003csub>r\u003c/sub> block transfer.\u003c/li>\u003c/ul>\n\u003cp>Vì vậy phải chọn b\u003csub>b\u003c/sub> cân bằng giữa seek và số pass để tổng chi phí nhỏ nhất. Ví dụ trong bảng \u003ccode>qp_sort_params\u003c/code>: b\u003csub>r\u003c/sub> = 100 000, M = 101 — b\u003csub>b\u003c/sub> = 1 cho 2 pass, 301 982 seek; b\u003csub>b\u003c/sub> = 10 cho 4 pass (900 000 transfer thay vì 500 000) nhưng chỉ 71 982 seek (CH15.03).\u003c/p>"},{"q":"\u003cstrong>PE 15.10\u003c/strong> — Hiện thực multiset semijoin và anti-semijoin bằng sort và bằng hash.","en":"\u003cp>\u003cstrong>Exercise 15.10.\u003c/strong> Consider the extended relational-algebra operators below. For each one, explain how it can be implemented with sorting and with hashing.\u003c/p>\n\u003cp>a. Semijoin (⋉\u003csub>θ\u003c/sub>): in the multiset semijoin r ⋉\u003csub>θ\u003c/sub> s, a tuple r\u003csub>i\u003c/sub> occurring n times in r occurs n times in the result if at least one tuple s\u003csub>j\u003c/sub> exists such that r\u003csub>i\u003c/sub> and s\u003csub>j\u003c/sub> satisfy θ; otherwise r\u003csub>i\u003c/sub> does not occur in the result.\u003c/p>\n\u003cp>b. Anti-semijoin (⊳̄\u003csub>θ\u003c/sub>): in the multiset anti-semijoin of r and s, a tuple r\u003csub>i\u003c/sub> occurring n times in r occurs n times in the result if no tuple s\u003csub>j\u003c/sub> of s satisfies θ together with r\u003csub>i\u003c/sub>; otherwise r\u003csub>i\u003c/sub> does not occur in the result.\u003c/p>","answer":"\u003cp>Với điều kiện θ tuỳ ý thì không dùng được sort/hash — phải (block) nested-loop. Với \u003cstrong>equi-join\u003c/strong>:\u003c/p>\n\u003cp>\u003cstrong>Semijoin r ⋉ s\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Sort: sắp r và s theo thuộc tính join, duyệt song song như merge join; khi giá trị của tuple r hiện tại có trong s thì xuất tuple r — \u003cstrong>mỗi tuple r một lần\u003c/strong>, không lặp theo số tuple khớp của s.\u003c/li>\u003cli>Hash: dựng hash index trên thuộc tính join của s (chỉ cần tập giá trị khác nhau). Duyệt r, mỗi tuple tra hash: có thì xuất. Nếu s nhỏ hơn r thì ngược lại cũng được: dựng index trên r, probe bằng s, khi tuple r khớp thì xuất và \u003cstrong>xoá\u003c/strong> nó khỏi index (để không xuất lại).\u003c/li>\u003cli>r, s lớn: chia partition theo hash của thuộc tính join rồi làm từng cặp.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Anti-semijoin\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Sort: như trên nhưng xuất tuple r khi \u003cstrong>không\u003c/strong> có giá trị khớp trong s.\u003c/li>\u003cli>Hash: tra hash index trên s, \u003cstrong>không\u003c/strong> tìm thấy thì xuất. Hoặc dựng index trên r, probe bằng s và xoá các tuple r khớp; cuối cùng xuất những tuple \u003cstrong>còn lại\u003c/strong> trong index.\u003c/li>\u003c/ul>\n\u003cp>Tuple r trùng nhau xuất đúng số lần của nó (multiset) — tương ứng \u003ccode>where exists\u003c/code> / \u003ccode>where not exists\u003c/code> trong SQL. Chú ý null: tuple r có giá trị join null không khớp gì nên \u003cstrong>có\u003c/strong> trong anti-semijoin; \u003ccode>not in\u003c/code> trong SQL lại cho rỗng khi s chứa null (CH15.09–CH15.10).\u003c/p>"},{"q":"\u003cstrong>PE 15.11\u003c/strong> — Truy vấn chỉ lấy K kết quả đầu: chọn demand-driven hay producer-driven pipelining?","en":"\u003cp>\u003cstrong>Exercise 15.11.\u003c/strong> A query needs only the first K results of an operation and stops after that. Which is the better choice for it: demand-driven pipelining or producer-driven pipelining (with buffering)? Explain.\u003c/p>","answer":"\u003cp>\u003cstrong>Demand-driven\u003c/strong>: tuple chỉ được sinh khi phép trên gọi \u003ccode>next()\u003c/code>, nên sau K lần gọi là dừng, không tốn công cho phần còn lại. Producer-driven sinh tuple liên tục vào buffer (tới khi buffer đầy) — có thể sinh nhiều tuple không bao giờ dùng. (Nếu kết quả phải sắp — \u003ccode>order by … limit K\u003c/code> — thì phép sort vẫn blocking, nhưng có thể dùng top-K heap.)\u003c/p>"},{"q":"\u003cstrong>PE 15.12\u003c/strong> — Vì sao producer-driven có instruction-cache hit rate tốt hơn demand-driven; và vì sao next() trả về nhiều tuple một lần giúp cải thiện?","en":"\u003cp>\u003cstrong>Exercise 15.12.\u003c/strong> Modern CPUs have an instruction cache holding recently executed instructions. A function call is therefore expensive, because the set of instructions being executed changes and causes misses in the instruction cache.\u003c/p>\n\u003cp>a. Explain why producer-driven pipelining with buffering probably gives a better instruction-cache hit rate than demand-driven pipelining.\u003c/p>\n\u003cp>b. Explain why changing demand-driven pipelining so that one call to \u003cem>next\u003c/em>() produces several results and returns them together can improve the instruction-cache hit rate.\u003c/p>","answer":"\u003cp>a. Producer-driven: mỗi phép toán chạy \u003cstrong>một vòng lặp\u003c/strong> sinh nhiều tuple liên tiếp từ input đã có trong buffer — cùng một đoạn mã được thực thi lặp lại nên nằm sẵn trong instruction cache. Demand-driven chuyển qua lại giữa mã của các phép toán \u003cstrong>với mỗi tuple\u003c/strong> (gọi next() của con, trả về cha…), mỗi lần chuyển có thể gây cache miss.\u003c/p>\n\u003cp>b. Nếu \u003ccode>next()\u003c/code> trả về một \u003cstrong>lô\u003c/strong> tuple (vectorized/batch execution), mỗi phép toán xử lý cả lô trong một vòng lặp trước khi trả quyền điều khiển — số lần chuyển giữa các hàm giảm theo kích thước lô, nên hit rate tăng.\u003c/p>"},{"q":"\u003cstrong>PE 15.13\u003c/strong> — Có keyword index trả về danh sách document id đã sắp cho mỗi keyword. Thuật toán hiệu quả tìm document chứa ít nhất k trong n keyword cho trước?","en":"\u003cp>\u003cstrong>Exercise 15.13.\u003c/strong> You need the documents that contain at least k of a given set of n keywords. A keyword index is available that returns, for a given keyword, a sorted list of the identifiers of the documents containing it. Give an efficient algorithm that finds the required documents.\u003c/p>","answer":"\u003cp>Duy trì danh sách L (sắp theo document id) các bản ghi (doc_id, count), ban đầu rỗng. Với mỗi keyword trong n keyword: lấy danh sách D của nó và \u003cstrong>merge\u003c/strong> D vào L (cả hai đã sắp): doc có trong L thì count + 1, chưa có thì thêm với count = 1. Cuối cùng xuất các doc có count ≥ k.\u003c/p>\n\u003cp>Mỗi lần merge tốn thời gian tỉ lệ |L| + |D|, nên tổng thời gian tỉ lệ khoảng n × (tổng độ dài các danh sách). Cách khác: merge \u003cstrong>đồng thời\u003c/strong> n danh sách bằng heap (n-way merge), mỗi doc id được đếm khi nó xuất hiện ở đầu các danh sách — O(N log n) với N là tổng độ dài.\u003c/p>\n\u003cp>Trong SQL: \u003ccode>group by doc_id having count(distinct keyword) &gt;= k\u003c/code> sau khi lọc các keyword cần tìm (CH15.13).\u003c/p>"},{"q":"\u003cstrong>PE 15.14\u003c/strong> — Đánh index cho document chứa từ \"leopard\" để truy vấn bằng khái niệm tổng quát (\"carnivore\", \"mammal\") tìm được hiệu quả; và truy vấn khái niệm cụ thể dùng khái niệm tổng quát thế nào?","en":"\u003cp>\u003cstrong>Exercise 15.14.\u003c/strong> Suggest a way to index a document that contains a word (for example “leopard”) so that it is found efficiently by queries that use a more general concept (such as “carnivore” or “mammal”). You may assume the concept hierarchy is shallow, so each concept has only a few generalizations (although a concept may have many specializations), and that a function is available that returns the concept of each word in a document. Also suggest how a query that uses a specialized concept can retrieve documents through a more general concept.\u003c/p>","answer":"\u003cp>Khi đánh index một document, với mỗi từ, ngoài entry cho chính từ (và khái niệm của nó, ví dụ leopard) còn thêm document vào \u003cstrong>danh sách index của mọi khái niệm tổng quát hơn\u003c/strong> (carnivore, mammal, animal). Vì hệ phân cấp nông, mỗi khái niệm chỉ có vài tổ tiên → index chỉ to thêm một hằng số lần. Khi đó truy vấn \"carnivore\" chỉ cần đọc một danh sách, không phải hợp hàng nghìn danh sách của mọi loài ăn thịt.\u003c/p>\n\u003cp>Ngược lại, truy vấn bằng khái niệm \u003cstrong>cụ thể\u003c/strong> (leopard) có thể dùng danh sách của khái niệm tổng quát hơn (carnivore) làm tập ứng viên khi danh sách cụ thể quá ít kết quả, rồi lọc/xếp hạng lại các document ứng viên theo mức liên quan tới leopard. (Không nên đánh index xuống mọi khái niệm con vì một khái niệm có thể có rất nhiều con.)\u003c/p>"},{"q":"\u003cstrong>PE 15.15\u003c/strong> — Vì sao nested-loops join chạy kém trên column store? Thuật toán thay thế và vì sao tốt hơn?","en":"\u003cp>\u003cstrong>Exercise 15.15.\u003c/strong> Explain why the nested-loops join algorithm (Section 15.5.1) performs badly on a database stored column-wise. Describe an alternative algorithm that works better, and explain why it is better.\u003c/p>","answer":"\u003cp>Nested-loops join như mô tả cần \u003cstrong>tuple hoàn chỉnh\u003c/strong> của hai bảng; trong column store mỗi cột ở một vùng đĩa khác nhau nên ghép tuple rất đắt, và phí công cho phần lớn cặp tuple không thoả điều kiện join.\u003c/p>\n\u003cp>Tốt hơn: chỉ đọc \u003cstrong>cột join\u003c/strong> (kèm record id) của hai bảng và join chúng bằng hash join, sort-merge join hoặc indexed nested-loop join. Sau khi biết các cặp (rid\u003csub>r\u003c/sub>, rid\u003csub>s\u003c/sub>) khớp, mới ghép các cột còn lại: sắp kết quả theo rid của r để đọc các cột của r tuần tự, rồi sắp lại theo rid của s để đọc các cột của s. Như vậy chỉ ghép tuple cho các dòng \u003cstrong>thực sự có trong kết quả\u003c/strong>, và đọc cột theo thứ tự vật lý.\u003c/p>"},{"q":"\u003cstrong>PE 15.16\u003c/strong> — Column store có lợi không cho: (a) lấy ID, name, dept_name của sinh viên 12345; (b) nhóm takes theo (year, course_id) và đếm sinh viên?","en":"\u003cp>\u003cstrong>Exercise 15.16.\u003c/strong> For each query below, say whether column-oriented storage is likely to help, and explain why.\u003c/p>\n\u003cp>a. Retrieve the ID, name and dept_name of the student whose ID is 12345.\u003c/p>\n\u003cp>b. Group the \u003cem>takes\u003c/em> relation by \u003cem>year\u003c/em> and \u003cem>course_id\u003c/em> and find the total number of students for each (\u003cem>year\u003c/em>, \u003cem>course_id\u003c/em>) combination.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Không có lợi\u003c/strong>: truy vấn lấy (gần như) trọn một dòng theo khoá. Row store đọc một block; column store phải đọc ở ba vùng cột khác nhau (ít nhất ba lần I/O) rồi ghép lại. Đây là kiểu truy vấn OLTP.\u003c/p>\n\u003cp>b. \u003cstrong>Có lợi\u003c/strong>: chỉ cần cột year, course_id (và ID/đếm) trên \u003cstrong>mọi\u003c/strong> dòng của takes. Column store chỉ đọc những cột này (bỏ qua sec_id, semester, grade), các cột lặp giá trị nhiều nên nén rất tốt, và aggregate có thể chạy vectorized. Đây là kiểu truy vấn phân tích.\u003c/p>"}],"exercises":[{"id":"CH15.01","topic":"PE 15.1 tạo run","level":2,"prompt":"\u003cp>Bảng \u003ccode>qp_sort_input(pos, name, num)\u003c/code> chứa 12 tuple của PE 15.1, \u003ccode>pos\u003c/code> là thứ tự trong file. Mỗi block một tuple, \u003cstrong>M = 3\u003c/strong>. Mô phỏng bước \u003cstrong>tạo run\u003c/strong>: mỗi lần đọc 3 tuple liên tiếp (pos 1–3, 4–6, …), sắp theo \u003ccode>name\u003c/code>.\u003c/p>\n\u003cp>Trả về \u003ccode>run\u003c/code> (1, 2, …), \u003ccode>k\u003c/code> (vị trí trong run, từ 1) và \u003ccode>name\u003c/code>, sắp theo run, k.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.1.\u003c/strong> For simplicity, assume that a block holds exactly one tuple and that memory can hold at most three blocks. Sort the following tuples on their first attribute with the external sort-merge algorithm, and show the runs produced in every pass: (kangaroo, 17), (wallaby, 21), (emu, 1), (wombat, 13), (platypus, 3), (lion, 8), (warthog, 4), (zebra, 11), (meerkat, 6), (hyena, 9), (hornbill, 2), (baboon, 12).\u003c/p>","hint":"Run của tuple là (pos − 1) / 3 + 1 (chia nguyên); vị trí trong run: row_number() over (partition by … order by name).","solution":"select (pos - 1) / 3 + 1 as run,\n       row_number() over (partition by (pos - 1) / 3 order by name) as k,\n       name\nfrom qp_sort_input\norder by run, k;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["run","k","name"],"rows":[["1","1","emu"],["1","2","kangaroo"],["1","3","wallaby"],["2","1","lion"],["2","2","platypus"],["2","3","wombat"],["3","1","meerkat"],["3","2","warthog"],["3","3","zebra"],["4","1","baboon"],["4","2","hornbill"],["4","3","hyena"]]}},{"id":"CH15.02","topic":"PE 15.1 pass merge","level":2,"prompt":"\u003cp>Tiếp CH15.01. Pass merge thứ nhất trộn \u003cstrong>M − 1 = 2\u003c/strong> run liên tiếp (run 1 với 2, run 3 với 4) thành một run mới. Trả về \u003ccode>run\u003c/code>, \u003ccode>k\u003c/code>, \u003ccode>name\u003c/code> của các run \u003cstrong>sau pass 1\u003c/strong>, sắp theo run, k.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.1.\u003c/strong> For simplicity, assume that a block holds exactly one tuple and that memory can hold at most three blocks. Sort the following tuples on their first attribute with the external sort-merge algorithm, and show the runs produced in every pass: (kangaroo, 17), (wallaby, 21), (emu, 1), (wombat, 13), (platypus, 3), (lion, 8), (warthog, 4), (zebra, 11), (meerkat, 6), (hyena, 9), (hornbill, 2), (baboon, 12).\u003c/p>","hint":"Run sau pass 1 = ((pos − 1) / 3) / 2 + 1.","solution":"select ((pos - 1) / 3) / 2 + 1 as run,\n       row_number() over (partition by ((pos - 1) / 3) / 2 order by name) as k,\n       name\nfrom qp_sort_input\norder by run, k;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["run","k","name"],"rows":[["1","1","emu"],["1","2","kangaroo"],["1","3","lion"],["1","4","platypus"],["1","5","wallaby"],["1","6","wombat"],["2","1","baboon"],["2","2","hornbill"],["2","3","hyena"],["2","4","meerkat"],["2","5","warthog"],["2","6","zebra"]]}},{"id":"CH15.03","topic":"chi phí external sort","level":3,"prompt":"\u003cp>Bảng \u003ccode>qp_sort_params(case_id, b_r, m, bb)\u003c/code>. Với mỗi case tính chi phí external sort-merge:\u003c/p>\n\u003cul>\u003cli>\u003ccode>initial_runs\u003c/code> = ⌈b_r / m⌉\u003c/li>\u003cli>\u003ccode>merge_passes\u003c/code>: số pass cần để còn 1 run, mỗi pass trộn tối đa ⌊m / bb⌋ − 1 run (tính \u003cstrong>chính xác\u003c/strong> bằng cách lặp, không dùng log số thực)\u003c/li>\u003cli>\u003ccode>transfers\u003c/code> = b_r · (2 · merge_passes + 1)\u003c/li>\u003cli>\u003ccode>seeks\u003c/code> = 2 · ⌈b_r / m⌉ + ⌈b_r / bb⌉ · (2 · merge_passes − 1)\u003c/li>\u003c/ul>\n\u003cp>Trả về case_id, initial_runs, merge_passes, transfers, seeks.\u003c/p>","en":"","hint":"with recursive: bắt đầu với số run ban đầu, mỗi bước runs := ⌈runs / fan_in⌉ cho tới khi runs = 1; merge_passes = số bước.","solution":"with recursive merge(case_id, pass, runs, fan_in) as (\n  select case_id, 0, ceil(b_r::numeric / m)::int, m / bb - 1 from qp_sort_params\n  union all\n  select case_id, pass + 1, ceil(runs::numeric / fan_in)::int, fan_in from merge where runs > 1\n)\nselect p.case_id,\n       ceil(p.b_r::numeric / p.m)::int as initial_runs,\n       max(g.pass) as merge_passes,\n       p.b_r * (2 * max(g.pass) + 1) as transfers,\n       2 * ceil(p.b_r::numeric / p.m)::int + ceil(p.b_r::numeric / p.bb)::int * (2 * max(g.pass) - 1) as seeks\nfrom qp_sort_params p join merge g using (case_id)\ngroup by p.case_id, p.b_r, p.m, p.bb;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["case_id","initial_runs","merge_passes","transfers","seeks"],"rows":[["2","32","2","4000","2464"],["5","991","2","500000","301982"],["4","910","3","70000","51820"],["6","991","4","900000","71982"],["3","60","2","7500","4620"],["1","4","2","60","44"]]}},{"id":"CH15.04","topic":"PE 15.3a nested-loop","level":1,"prompt":"\u003cp>Bảng \u003ccode>qp_rel_stats(rel, n_tuples, tuples_per_block)\u003c/code> chứa r1, r2 của PE 15.3. Với \u003cstrong>cả hai\u003c/strong> cách chọn outer, tính chi phí nested-loop join trường hợp xấu nhất: \u003ccode>transfers\u003c/code> = n\u003csub>outer\u003c/sub> · b\u003csub>inner\u003c/sub> + b\u003csub>outer\u003c/sub>, \u003ccode>seeks\u003c/code> = n\u003csub>outer\u003c/sub> + b\u003csub>outer\u003c/sub>, với b = ⌈n_tuples / tuples_per_block⌉.\u003c/p>\n\u003cp>Trả về outer_rel, inner_rel, transfers, seeks (kiểu số nguyên).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.3 (a).\u003c/strong> Relations r\u003csub>1\u003c/sub>(A, B, C) and r\u003csub>2\u003c/sub>(C, D, E) have these properties: r\u003csub>1\u003c/sub> contains 20,000 tuples and r\u003csub>2\u003c/sub> contains 45,000 tuples; one block holds 25 tuples of r\u003csub>1\u003c/sub> or 30 tuples of r\u003csub>2\u003c/sub>. For r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub>, estimate the number of block transfers and seeks needed by each join strategy below:\u003c/p>\n\u003cp>a. Nested-loop join.\u003c/p>","hint":"","solution":"select o.rel as outer_rel, i.rel as inner_rel,\n       (o.n_tuples::bigint * ceil(i.n_tuples::numeric / i.tuples_per_block)\n          + ceil(o.n_tuples::numeric / o.tuples_per_block))::bigint as transfers,\n       (o.n_tuples + ceil(o.n_tuples::numeric / o.tuples_per_block))::bigint as seeks\nfrom qp_rel_stats o join qp_rel_stats i on o.rel \u003c> i.rel;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["outer_rel","inner_rel","transfers","seeks"],"rows":[["r1","r2","30000800","20800"],["r2","r1","36001500","46500"]]}},{"id":"CH15.05","topic":"PE 15.3b block nested-loop","level":2,"prompt":"\u003cp>Với r1 làm outer, r2 làm inner (bảng \u003ccode>qp_rel_stats\u003c/code>) và mỗi kích thước bộ nhớ M trong \u003ccode>qp_memory(m)\u003c/code>, tính chi phí block nested-loop join: \u003ccode>transfers\u003c/code> = ⌈b\u003csub>r1\u003c/sub> / (M − 2)⌉ · b\u003csub>r2\u003c/sub> + b\u003csub>r1\u003c/sub>, \u003ccode>seeks\u003c/code> = 2 · ⌈b\u003csub>r1\u003c/sub> / (M − 2)⌉.\u003c/p>\n\u003cp>Trả về m, transfers, seeks (số nguyên).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.3 (b).\u003c/strong> Relations r\u003csub>1\u003c/sub>(A, B, C) and r\u003csub>2\u003c/sub>(C, D, E) have these properties: r\u003csub>1\u003c/sub> contains 20,000 tuples and r\u003csub>2\u003c/sub> contains 45,000 tuples; one block holds 25 tuples of r\u003csub>1\u003c/sub> or 30 tuples of r\u003csub>2\u003c/sub>. For r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub>, estimate the number of block transfers and seeks needed by each join strategy below:\u003c/p>\n\u003cp>b. Block nested-loop join.\u003c/p>","hint":"","solution":"with b as (\n  select max(ceil(n_tuples::numeric / tuples_per_block)) filter (where rel = 'r1') as b1,\n         max(ceil(n_tuples::numeric / tuples_per_block)) filter (where rel = 'r2') as b2\n  from qp_rel_stats)\nselect m,\n       (ceil(b1 / (m - 2)) * b2 + b1)::bigint as transfers,\n       (2 * ceil(b1 / (m - 2)))::bigint as seeks\nfrom qp_memory, b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["m","transfers","seeks"],"rows":[["12","120800","160"],["52","24800","32"],["102","12800","16"],["802","2300","2"]]}},{"id":"CH15.06","topic":"PE 15.3d hash join","level":3,"prompt":"\u003cp>Hash join r1 ⋈ r2 với \u003cstrong>r1 làm build\u003c/strong> (nhỏ hơn). Với mỗi M trong \u003ccode>qp_memory\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>n_h\u003c/code> = ⌈b\u003csub>r1\u003c/sub> / M⌉\u003c/li>\u003cli>\u003ccode>recursive\u003c/code> = true nếu n_h + 1 > M (phải chia partition đệ quy)\u003c/li>\u003cli>\u003ccode>transfers\u003c/code>: nếu không đệ quy = 3(b\u003csub>r1\u003c/sub> + b\u003csub>r2\u003c/sub>) + 4·n_h; nếu đệ quy = 2(b\u003csub>r1\u003c/sub> + b\u003csub>r2\u003c/sub>)·⌈log\u003csub>M−1\u003c/sub>(b\u003csub>r1\u003c/sub>) − 1⌉ + b\u003csub>r1\u003c/sub> + b\u003csub>r2\u003c/sub>\u003c/li>\u003c/ul>\n\u003cp>Trả về m, n_h, recursive, transfers (số nguyên).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.3 (d).\u003c/strong> Relations r\u003csub>1\u003c/sub>(A, B, C) and r\u003csub>2\u003c/sub>(C, D, E) have these properties: r\u003csub>1\u003c/sub> contains 20,000 tuples and r\u003csub>2\u003c/sub> contains 45,000 tuples; one block holds 25 tuples of r\u003csub>1\u003c/sub> or 30 tuples of r\u003csub>2\u003c/sub>. For r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub>, estimate the number of block transfers and seeks needed by each join strategy below:\u003c/p>\n\u003cp>d. Hash join.\u003c/p>","hint":"log cơ số M − 1 của x = ln(x) / ln(M − 1).","solution":"with b as (\n  select max(ceil(n_tuples::numeric / tuples_per_block)) filter (where rel = 'r1') as b1,\n         max(ceil(n_tuples::numeric / tuples_per_block)) filter (where rel = 'r2') as b2\n  from qp_rel_stats),\nh as (select m, ceil(b1 / m)::int as n_h, b1, b2 from qp_memory, b)\nselect m, n_h, n_h + 1 > m as recursive,\n       case when n_h + 1 > m\n            then 2 * (b1 + b2) * ceil(ln(b1) / ln(m - 1) - 1) + b1 + b2\n            else 3 * (b1 + b2) + 4 * n_h end::bigint as transfers\nfrom h;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["m","n_h","recursive","transfers"],"rows":[["12","67","true","11500"],["52","16","false","6964"],["102","8","false","6932"],["802","1","false","6904"]]}},{"id":"CH15.07","topic":"PE 15.2 bỏ theta join","level":2,"prompt":"\u003cp>Bảng \u003ccode>qp_branch(branch_name, branch_city, assets)\u003c/code>. Viết truy vấn tương đương PE 15.2 nhưng \u003cstrong>không dùng self-join\u003c/strong>: tên các branch có assets lớn hơn assets của \u003cstrong>ít nhất một\u003c/strong> branch ở Brooklyn, mỗi tên một lần.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.2.\u003c/strong> Using the bank database of Figure 15.14 (primary keys underlined), consider the SQL query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select T.branch_name\nfrom branch T, branch S\nwhere T.assets &gt; S.assets and S.branch_city = 'Brooklyn'\u003c/code>\u003c/pre>\n\u003cp>Give an efficient relational-algebra expression equivalent to this query, and justify why you chose it.\u003c/p>\n\u003cp>\u003cem>Figure 15.14 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"Lớn hơn ít nhất một giá trị ⇔ lớn hơn giá trị nhỏ nhất.","solution":"select branch_name from qp_branch\nwhere assets > (select min(assets) from qp_branch where branch_city = 'Brooklyn');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name"],"rows":[["Brighton"],["Bronx Main"],["Downtown"],["Mianus"],["North Town"],["Perryridge"],["Pownal"],["Redwood"],["Round Hill"]]}},{"id":"CH15.08","topic":"PE 15.6c phủ định","level":1,"prompt":"\u003cp>Viết σ\u003csub>¬(branch_city \u003c 'Brooklyn' ∨ assets \u003c 5000)\u003c/sub>(qp_branch) **không dùng \u003ccode>not\u003c/code>** (áp dụng De Morgan để điều kiện trên branch_city có dạng dùng được B⁺-tree). Trả về branch_name, branch_city, assets.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.6 (c).\u003c/strong> Using the bank database of Figure 15.14 (primary keys underlined), suppose relation \u003cem>branch\u003c/em> has a B\u003csup>+\u003c/sup>-tree index on \u003cem>branch_city\u003c/em> and no other index. List the different ways of evaluating each of the following selections that contain negation:\u003c/p>\n\u003cp>c. σ\u003csub>¬(branch_city \u003c “Brooklyn” ∨ assets \u003c 5000)\u003c/sub>(\u003cem>branch\u003c/em>)\u003c/p>\n\u003cp>\u003cem>Figure 15.14 — Bank database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"select branch_name, branch_city, assets\nfrom qp_branch\nwhere branch_city >= 'Brooklyn' and assets >= 5000;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","branch_city","assets"],"rows":[["Brighton","Brooklyn","7100000"],["Downtown","Brooklyn","9000000"],["Mianus","Horseneck","400000"],["North Town","Rye","3700000"],["Perryridge","Horseneck","1700000"],["Redwood","Palo Alto","2100000"],["Round Hill","Horseneck","8000000"]]}},{"id":"CH15.09","topic":"PE 15.10a semijoin","level":2,"prompt":"\u003cp>Multiset semijoin \u003ccode>qp_orders ⋉ qp_vip\u003c/code> theo điều kiện \u003ccode>qp_orders.cust = qp_vip.cust\u003c/code>. Cả hai bảng có \u003cstrong>dòng trùng\u003c/strong>: kết quả phải giữ đúng số lần lặp của mỗi dòng qp_orders (không bị nhân lên theo số dòng khớp của qp_vip). Trả về cust, item.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.10 (a).\u003c/strong> Consider the extended relational-algebra operators below. For each one, explain how it can be implemented with sorting and with hashing.\u003c/p>\n\u003cp>a. Semijoin (⋉\u003csub>θ\u003c/sub>): in the multiset semijoin r ⋉\u003csub>θ\u003c/sub> s, a tuple r\u003csub>i\u003c/sub> occurring n times in r occurs n times in the result if at least one tuple s\u003csub>j\u003c/sub> exists such that r\u003csub>i\u003c/sub> and s\u003csub>j\u003c/sub> satisfy θ; otherwise r\u003csub>i\u003c/sub> does not occur in the result.\u003c/p>","hint":"Join thường nhân dòng; where exists thì không.","solution":"select o.cust, o.item\nfrom qp_orders o\nwhere exists (select * from qp_vip v where v.cust = o.cust);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust","item"],"rows":[["ann","pen"],["ann","pen"],["ann","ink"],["dan","cup"],["dan","cup"]]}},{"id":"CH15.10","topic":"PE 15.10b anti-semijoin","level":2,"prompt":"\u003cp>Multiset anti-semijoin của \u003ccode>qp_orders\u003c/code> với \u003ccode>qp_blocked\u003c/code> theo điều kiện \u003ccode>qp_orders.cust = qp_blocked.cust\u003c/code>: giữ (đúng số lần) mọi dòng qp_orders mà \u003cstrong>không có\u003c/strong> dòng nào của qp_blocked thoả điều kiện. Lưu ý qp_blocked chứa null và qp_orders có một dòng cust null. Trả về cust, item.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.10 (b).\u003c/strong> Consider the extended relational-algebra operators below. For each one, explain how it can be implemented with sorting and with hashing.\u003c/p>\n\u003cp>b. Anti-semijoin (⊳̄\u003csub>θ\u003c/sub>): in the multiset anti-semijoin of r and s, a tuple r\u003csub>i\u003c/sub> occurring n times in r occurs n times in the result if no tuple s\u003csub>j\u003c/sub> of s satisfies θ together with r\u003csub>i\u003c/sub>; otherwise r\u003csub>i\u003c/sub> does not occur in the result.\u003c/p>","hint":"Thử \u003ccode>cust not in (select cust from qp_blocked)\u003c/code> để thấy vì sao sai.","solution":"select o.cust, o.item\nfrom qp_orders o\nwhere not exists (select * from qp_blocked b where b.cust = o.cust);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust","item"],"rows":[["ann","pen"],["ann","pen"],["ann","ink"],["cid","pen"],["dan","cup"],["dan","cup"],[null,"box"]]}},{"id":"CH15.11","topic":"PE 15.8 division (hash)","level":2,"prompt":"\u003cp>Phép chia \u003ccode>qp_supply(supplier, part) ÷ qp_req_part(part)\u003c/code>: các supplier cung cấp \u003cstrong>mọi\u003c/strong> part trong qp_req_part. qp_supply có dòng trùng và có part ngoài danh sách. Viết theo kiểu hash-based: nhóm theo supplier và đếm số part khác nhau thuộc danh sách.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.8.\u003c/strong> Design one sorting-based and one hashing-based algorithm for computing the relational division operation (Practice Exercise 2.9 defines division).\u003c/p>","hint":"","solution":"select supplier\nfrom qp_supply\nwhere part in (select part from qp_req_part)\ngroup by supplier\nhaving count(distinct part) = (select count(*) from qp_req_part);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["supplier"],"rows":[["s1"],["s3"]]}},{"id":"CH15.12","topic":"loại trùng bằng sort","level":2,"prompt":"\u003cp>Loại trùng theo kiểu sort-based: trả về các cặp (cust, item) \u003cstrong>khác nhau\u003c/strong> của \u003ccode>qp_orders\u003c/code> (kể cả dòng cust null) \u003cstrong>không dùng\u003c/strong> \u003ccode>distinct\u003c/code>, \u003ccode>group by\u003c/code> hay \u003ccode>union\u003c/code> — sắp theo (cust, item) và chỉ giữ dòng đầu tiên của mỗi nhóm giống nhau.\u003c/p>","en":"","hint":"row_number() over (partition by cust, item) = 1. partition by coi các null là bằng nhau.","solution":"select cust, item\nfrom (select cust, item,\n             row_number() over (partition by cust, item order by cust, item) as k\n      from qp_orders) t\nwhere k = 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["cust","item"],"rows":[["ann","ink"],["ann","pen"],["bob","pad"],["cid","pen"],["dan","cup"],[null,"box"]]}},{"id":"CH15.13","topic":"PE 15.13 ≥ k keyword","level":2,"prompt":"\u003cp>\u003ccode>qp_doc_kw(doc_id, keyword)\u003c/code> là keyword index, \u003ccode>qp_query_kw(keyword)\u003c/code> là n keyword cần tìm. Tìm các document chứa \u003cstrong>ít nhất k = 3\u003c/strong> keyword trong qp_query_kw. Trả về doc_id và \u003ccode>matched\u003c/code> (số keyword khớp).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 15.13.\u003c/strong> You need the documents that contain at least k of a given set of n keywords. A keyword index is available that returns, for a given keyword, a sorted list of the identifiers of the documents containing it. Give an efficient algorithm that finds the required documents.\u003c/p>","hint":"","solution":"select d.doc_id, count(*) as matched\nfrom qp_doc_kw d join qp_query_kw q on q.keyword = d.keyword\ngroup by d.doc_id\nhaving count(*) >= 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["doc_id","matched"],"rows":[["3","3"],["5","3"],["1","3"]]}},{"id":"CH15.14","topic":"top-K với hoà","level":1,"prompt":"\u003cp>Lấy các account có balance thuộc \u003cstrong>2 giá trị cao nhất đầu tiên theo thứ tự\u003c/strong> của \u003ccode>qp_account\u003c/code> — tức 2 dòng balance cao nhất, nhưng nếu dòng cuối hoà với các dòng sau thì lấy cả các dòng hoà đó. Trả về account_number, balance. (Dùng cú pháp chuẩn SQL cho top-K có hoà.)\u003c/p>","en":"","hint":"order by balance desc fetch first 2 rows with ties.","solution":"select account_number, balance\nfrom qp_account\norder by balance desc\nfetch first 2 rows with ties;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["account_number","balance"],"rows":[["A-501","950"],["A-218","900"],["A-201","900"]]}},{"id":"CH15.15","topic":"indexed nested-loop","level":1,"prompt":"\u003cp>Indexed nested-loop join r1 ⋈ r2 với r1 làm outer; r2 có B⁺-tree \u003cstrong>primary\u003c/strong> index trên thuộc tính join (mỗi tuple r1 khớp tối đa một tuple r2), chiều cao h = 3, nên mỗi lần tra c = h + 1 = 4 block transfer và 4 seek. Từ \u003ccode>qp_rel_stats\u003c/code>, tính \u003ccode>transfers\u003c/code> = b\u003csub>r1\u003c/sub> + n\u003csub>r1\u003c/sub> · 4 và \u003ccode>seeks\u003c/code> = b\u003csub>r1\u003c/sub> + n\u003csub>r1\u003c/sub> · 4 (đọc mỗi block outer cũng tốn một seek trong trường hợp xấu nhất). Trả về một dòng hai cột.\u003c/p>","en":"","hint":"","solution":"select (ceil(n_tuples::numeric / tuples_per_block) + n_tuples * 4)::bigint as transfers,\n       (ceil(n_tuples::numeric / tuples_per_block) + n_tuples * 4)::bigint as seeks\nfrom qp_rel_stats where rel = 'r1';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["transfers","seeks"],"rows":[["80800","80800"]]}}]},{"key":"ch16","store":"16","short":"16","label":"Chương 16","navLabel":"Chương 16","kind":"Chương","title":"Query Optimization","titleVi":"Tối ưu truy vấn","summary":"\u003ch3>1. Tối ưu truy vấn là gì (slide 16.2–16.6)\u003c/h3>\n\u003cp>Một truy vấn có nhiều \u003cstrong>evaluation plan\u003c/strong> tương đương — khác nhau ở biểu thức đại số (thứ tự join, vị trí selection…) và thuật toán cho từng phép toán. Chi phí giữa các plan có thể chênh \u003cstrong>nhiều bậc độ lớn\u003c/strong>. \u003cstrong>Cost-based optimization\u003c/strong> gồm ba bước:\u003c/p>\n\u003col>\u003cli>Sinh các biểu thức tương đương bằng \u003cstrong>luật tương đương\u003c/strong>.\u003c/li>\u003cli>Gắn thuật toán cho từng phép toán để được các plan.\u003c/li>\u003cli>\u003cstrong>Ước lượng chi phí\u003c/strong> mỗi plan (dựa vào thống kê) và chọn plan rẻ nhất.\u003c/li>\u003c/ol>\n\u003cp>PostgreSQL: \u003ccode>explain &lt;query&gt;\u003c/code> cho plan + chi phí ước lượng, \u003ccode>explain analyze\u003c/code> chạy thật và in thời gian/số dòng thực tế.\u003c/p>\n\u003ch3>2. Luật tương đương (slide 16.7–16.20)\u003c/h3>\n\u003cp>Hai biểu thức tương đương nếu cho \u003cstrong>cùng tập tuple trên mọi instance hợp lệ\u003c/strong> (với SQL: cùng multiset).\u003c/p>\n\u003col>\u003cli>σ\u003csub>θ₁∧θ₂\u003c/sub>(E) ≡ σ\u003csub>θ₁\u003c/sub>(σ\u003csub>θ₂\u003c/sub>(E)) — tách conjunction.\u003c/li>\u003cli>σ\u003csub>θ₁\u003c/sub>(σ\u003csub>θ₂\u003c/sub>(E)) ≡ σ\u003csub>θ₂\u003c/sub>(σ\u003csub>θ₁\u003c/sub>(E)) — selection giao hoán.\u003c/li>\u003cli>Π\u003csub>L₁\u003c/sub>(Π\u003csub>L₂\u003c/sub>(…(E))) ≡ Π\u003csub>L₁\u003c/sub>(E) với L₁ ⊆ L₂ ⊆ … — chỉ giữ projection ngoài cùng.\u003c/li>\u003cli>σ\u003csub>θ\u003c/sub>(E₁ × E₂) ≡ E₁ ⋈\u003csub>θ\u003c/sub> E₂ và σ\u003csub>θ₁\u003c/sub>(E₁ ⋈\u003csub>θ₂\u003c/sub> E₂) ≡ E₁ ⋈\u003csub>θ₁∧θ₂\u003c/sub> E₂.\u003c/li>\u003cli>Theta join (và natural join) \u003cstrong>giao hoán\u003c/strong>: E₁ ⋈\u003csub>θ\u003c/sub> E₂ ≡ E₂ ⋈\u003csub>θ\u003c/sub> E₁.\u003c/li>\u003cli>Natural join \u003cstrong>kết hợp\u003c/strong>: (E₁ ⋈ E₂) ⋈ E₃ ≡ E₁ ⋈ (E₂ ⋈ E₃); theta join kết hợp khi điều kiện chỉ dùng thuộc tính phù hợp.\u003c/li>\u003cli>\u003cstrong>Đẩy selection xuống join\u003c/strong>: σ\u003csub>θ₀\u003c/sub>(E₁ ⋈ E₂) ≡ σ\u003csub>θ₀\u003c/sub>(E₁) ⋈ E₂ nếu θ₀ chỉ dùng thuộc tính của E₁; σ\u003csub>θ₁∧θ₂\u003c/sub>(E₁ ⋈ E₂) ≡ σ\u003csub>θ₁\u003c/sub>(E₁) ⋈ σ\u003csub>θ₂\u003c/sub>(E₂).\u003c/li>\u003cli>\u003cstrong>Đẩy projection xuống join\u003c/strong>: giữ lại các thuộc tính cần cho điều kiện join và cho kết quả.\u003c/li>\u003cli>∪, ∩ giao hoán và kết hợp; − thì không.\u003c/li>\u003cli>σ phân phối qua ∪, ∩, −: σ\u003csub>θ\u003c/sub>(E₁ − E₂) ≡ σ\u003csub>θ\u003c/sub>(E₁) − E₂.\u003c/li>\u003cli>Π phân phối qua ∪ (nhưng \u003cstrong>không\u003c/strong> qua − : PE 16.3a).\u003c/li>\u003cli>Aggregation: σ\u003csub>θ\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(E)) ≡ \u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(σ\u003csub>θ\u003c/sub>(E)) khi θ chỉ dùng thuộc tính nhóm A (PE 16.2b) — tức chuyển \u003ccode>having\u003c/code> trên cột nhóm thành \u003ccode>where\u003c/code>.\u003c/li>\u003cli>Outer join: \u003cstrong>không giao hoán/kết hợp tuỳ ý\u003c/strong>. σ\u003csub>θ\u003c/sub>(E₁ ⟕ E₂) ≡ σ\u003csub>θ\u003c/sub>(E₁) ⟕ E₂ khi θ chỉ dùng thuộc tính E₁ (PE 16.2c); nhưng đẩy θ trên E₂ xuống E₂ thì \u003cstrong>sai\u003c/strong> (PE 16.3e). Khi θ loại bỏ null của E₂ (null-rejecting), σ\u003csub>θ\u003c/sub>(E₁ ⟕ E₂) ≡ σ\u003csub>θ\u003c/sub>(E₁ ⋈ E₂).\u003c/li>\u003c/ol>\n\u003cp>Ví dụ kinh điển (slide 16.15): \u003ccode>Π name, title (σ dept_name='Music' ∧ year=2017 (instructor ⋈ (teaches ⋈ course)))\u003c/code> → đẩy σ dept_name xuống instructor, σ year xuống teaches, và join instructor với teaches \u003cstrong>trước\u003c/strong> vì kết quả nhỏ.\u003c/p>\n\u003cp>Thuật toán sinh mọi biểu thức tương đương tốn rất nhiều bộ nhớ → dùng \u003cstrong>chia sẻ biểu thức con\u003c/strong> và các heuristic.\u003c/p>\n\u003ch3>3. Thống kê và ước lượng kích thước (slide 16.21–16.40)\u003c/h3>\n\u003cp>Catalog lưu: \u003cstrong>n\u003csub>r\u003c/sub>\u003c/strong> (số tuple), \u003cstrong>b\u003csub>r\u003c/sub>\u003c/strong> (số block), \u003cstrong>l\u003csub>r\u003c/sub>\u003c/strong> (kích thước tuple), \u003cstrong>f\u003csub>r\u003c/sub>\u003c/strong> (blocking factor), \u003cstrong>V(A, r)\u003c/strong> (số giá trị khác nhau của A = kích thước Π\u003csub>A\u003c/sub>(r)), và \u003cstrong>histogram\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Histogram equi-width\u003c/strong>: chia miền giá trị thành các khoảng đều nhau, lưu số tuple mỗi khoảng. \u003cstrong>Equi-depth\u003c/strong>: mỗi bucket cùng số tuple, lưu biên. Giả sử phân bố đều \u003cstrong>trong\u003c/strong> mỗi bucket. PostgreSQL lưu equi-depth histogram + danh sách giá trị phổ biến nhất (most common values) trong \u003ccode>pg_stats\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Ước lượng selection:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Biểu thức\u003c/th>\u003cth>Số tuple ước lượng\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>σ\u003csub>A=v\u003c/sub>(r)\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> / V(A, r) (dùng histogram nếu có); A là khoá → 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>σ\u003csub>A≤v\u003c/sub>(r)\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> · (v − min(A, r)) / (max(A, r) − min(A, r)); v \u003c min → 0; v ≥ max → n\u003csub>r\u003c/sub>; không biết v → n\u003csub>r\u003c/sub>/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conjunction θ₁ ∧ … ∧ θₙ\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> · (s₁ · s₂ ⋯ sₙ) / n\u003csub>r\u003c/sub>\u003csup>n\u003c/sup> (giả sử độc lập; sᵢ là kích thước của σ\u003csub>θᵢ\u003c/sub>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>disjunction θ₁ ∨ … ∨ θₙ\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> · (1 − (1 − s₁/n\u003csub>r\u003c/sub>)(1 − s₂/n\u003csub>r\u003c/sub>)⋯)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>negation ¬θ\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> − kích thước(σ\u003csub>θ\u003c/sub>(r))\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ước lượng join r(R) ⋈ s(S):\u003c/p>\n\u003cul>\u003cli>R ∩ S = ∅: n\u003csub>r\u003c/sub> · n\u003csub>s\u003c/sub> (tích Descartes).\u003c/li>\u003cli>R ∩ S là \u003cstrong>khoá của R\u003c/strong>: mỗi tuple s khớp tối đa một tuple r → \u003cstrong>≤ n\u003csub>s\u003c/sub>\u003c/strong>; nếu thêm là foreign key từ S tham chiếu R (và not null) → \u003cstrong>đúng n\u003csub>s\u003c/sub>\u003c/strong>.\u003c/li>\u003cli>R ∩ S = {A} không là khoá: \u003cstrong>n\u003csub>r\u003c/sub> · n\u003csub>s\u003c/sub> / max(V(A, r), V(A, s))\u003c/strong> (lấy ước lượng nhỏ hơn trong hai cách n\u003csub>r\u003c/sub>·n\u003csub>s\u003c/sub>/V(A, s) và n\u003csub>r\u003c/sub>·n\u003csub>s\u003c/sub>/V(A, r)).\u003c/li>\u003cli>Các phép khác: projection Π\u003csub>A\u003c/sub>(r) → V(A, r); aggregation \u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(r) → V(A, r); r ∪ s ≤ n\u003csub>r\u003c/sub> + n\u003csub>s\u003c/sub>; r ∩ s ≤ min(n\u003csub>r\u003c/sub>, n\u003csub>s\u003c/sub>); r − s ≤ n\u003csub>r\u003c/sub>; left outer join = kích thước join + n\u003csub>r\u003c/sub>.\u003c/li>\u003cli>Ước lượng V(A, kết quả): selection A = v → 1; join → min(V(A, r), V(A, s)) …\u003c/li>\u003c/ul>\n\u003ch3>4. Chọn evaluation plan (slide 16.41–16.58)\u003c/h3>\n\u003cul>\u003cli>Không thể chọn thuật toán rẻ nhất cho từng phép toán một cách độc lập: merge join có thể đắt hơn hash join nhưng tạo kết quả \u003cstrong>đã sắp\u003c/strong>, giúp phép trên rẻ hơn (\u003cstrong>interesting sort order\u003c/strong>, PE 16.10).\u003c/li>\u003cli>\u003cstrong>Số thứ tự join\u003c/strong>: với n quan hệ có \u003cstrong>(2(n − 1))! / (n − 1)!\u003c/strong> cây join (PE 16.12): n = 3 → 12, n = 7 → 665 280, n = 10 → > 17,6 tỉ. Chỉ xét \u003cstrong>left-deep\u003c/strong> (vế phải mỗi join là một quan hệ gốc): n! thứ tự.\u003c/li>\u003cli>\u003cstrong>Dynamic programming\u003c/strong> (\u003cem>FindBestPlan\u003c/em>): với mỗi tập con S của các quan hệ, tính plan tốt nhất một lần rồi ghi nhớ; plan của S được ghép từ plan tốt nhất của S₁ và S − S₁. Thời gian \u003cstrong>O(3ⁿ)\u003c/strong>, bộ nhớ O(2ⁿ) (PE 16.13). Chỉ xét left-deep: \u003cstrong>O(n · 2ⁿ)\u003c/strong> (PE 16.14, System R). Với interesting orders: lưu plan tốt nhất cho \u003cstrong>mỗi (tập con, thứ tự)\u003c/strong> (PE 16.11).\u003c/li>\u003cli>\u003cstrong>Heuristic\u003c/strong>: đẩy selection xuống sớm nhất; đẩy projection xuống; thực hiện selection/join hạn chế nhất (cho kết quả nhỏ nhất) trước; tránh tích Descartes. Nhiều optimizer kết hợp: heuristic để thu hẹp, cost-based cho thứ tự join và thuật toán.\u003c/li>\u003cli>Optimizer thực tế: System R (left-deep, DP, interesting order), PostgreSQL (DP tới ~12 bảng, sau đó \u003cstrong>genetic algorithm\u003c/strong> GEQO), SQL Server (Cascades/Volcano: biến đổi + memoization). \u003cstrong>Plan caching\u003c/strong> cho truy vấn tham số hoá; dừng tối ưu khi chi phí tối ưu vượt chi phí thực thi ước lượng.\u003c/li>\u003c/ul>\n\u003ch3>5. Truy vấn lồng và khử tương quan (slide 16.59–16.64)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Correlated evaluation\u003c/strong>: chạy subquery một lần cho \u003cstrong>mỗi tuple\u003c/strong> của truy vấn ngoài — rất chậm khi bảng ngoài lớn.\u003c/li>\u003cli>\u003cstrong>Decorrelation\u003c/strong>: viết lại thành join. \u003ccode>exists\u003c/code> → \u003cstrong>semijoin\u003c/strong> (⋉), \u003ccode>not exists\u003c/code> → \u003cstrong>anti-semijoin\u003c/strong>; subquery có aggregate (ví dụ so với max theo nhóm) → tính aggregate \u003cstrong>một lần\u003c/strong> bằng \u003ccode>group by\u003c/code> (bảng tạm/derived table) rồi join (PE 16.15).\u003c/li>\u003cli>Ví dụ:\u003c/li>\u003c/ul>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>-- lồng, có tương quan\nselect name from instructor\nwhere exists (select * from teaches where teaches.ID = instructor.ID and teaches.year = 2019);\n-- khử tương quan: semijoin\nselect name from instructor\nwhere ID in (select ID from teaches where year = 2019);   -- PostgreSQL chạy bằng Hash Semi Join\u003c/code>\u003c/pre>\n\u003cul>\u003cli>Cẩn thận \u003ccode>not in\u003c/code> với null; \u003ccode>not exists\u003c/code> ⇔ anti-semijoin luôn đúng.\u003c/li>\u003c/ul>\n\u003ch3>6. Materialized view (slide 16.65–16.75)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Materialized view\u003c/strong>: kết quả view được tính và \u003cstrong>lưu\u003c/strong>; truy vấn đọc thẳng, nhưng phải \u003cstrong>bảo trì\u003c/strong> khi bảng gốc đổi.\u003c/li>\u003cli>\u003cstrong>Incremental view maintenance\u003c/strong>: tính phần thay đổi (differential) thay vì tính lại toàn bộ. Với v = r ⋈ s, chèn i\u003csub>r\u003c/sub> vào r: v\u003csup>new\u003c/sup> = v\u003csup>old\u003c/sup> ∪ (i\u003csub>r\u003c/sub> ⋈ s); xoá d\u003csub>r\u003c/sub>: v\u003csup>new\u003c/sup> = v\u003csup>old\u003c/sup> − (d\u003csub>r\u003c/sub> ⋈ s).\u003c/li>\u003cli>Selection/projection: projection cần \u003cstrong>đếm số lần\u003c/strong> mỗi tuple được suy ra (count) để biết khi nào xoá. Aggregate: count, sum bảo trì được bằng cộng/trừ; avg = sum/count; min/max khi xoá đúng giá trị min/max phải tính lại từ nhóm.\u003c/li>\u003cli>\u003cstrong>Immediate\u003c/strong> (cùng giao dịch, bằng trigger) vs \u003cstrong>deferred\u003c/strong> (định kỳ, \u003ccode>refresh materialized view\u003c/code> trong PostgreSQL — PostgreSQL không tự bảo trì incremental).\u003c/li>\u003cli>\u003cstrong>Query optimization với materialized view\u003c/strong>: viết lại truy vấn để dùng view đã có (view matching), hoặc ngược lại thay view bằng định nghĩa nếu rẻ hơn; \u003cstrong>chọn view nên materialize\u003c/strong> dựa trên workload.\u003c/li>\u003c/ul>\n\u003ch3>7. Các kỹ thuật nâng cao (slide 16.76+)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Top-K optimization\u003c/strong> (\u003ccode>order by … limit K\u003c/code>), \u003cstrong>join minimization\u003c/strong> (bỏ join thừa qua foreign key), \u003cstrong>halloween problem\u003c/strong> khi update dùng index trên chính cột bị update, \u003cstrong>multiquery optimization\u003c/strong> (chia sẻ biểu thức con giữa nhiều truy vấn), \u003cstrong>parametric/adaptive optimization\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>Công thức hay thi\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câu hỏi\u003c/th>\u003cth>Trả lời\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>σ\u003csub>A=v\u003c/sub>\u003c/td>\u003ctd>n\u003csub>r\u003c/sub> / V(A, r)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>σ\u003csub>A≤v\u003c/sub>\u003c/td>\u003ctd>n\u003csub>r\u003c/sub>(v − min)/(max − min)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈ s trên A, không khoá\u003c/td>\u003ctd>n\u003csub>r\u003c/sub>n\u003csub>s\u003c/sub> / max(V(A, r), V(A, s))\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r ⋈ s, A là khoá của r, FK từ s\u003c/td>\u003ctd>n\u003csub>s\u003c/sub>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Số cây join\u003c/td>\u003ctd>(2(n−1))!/(n−1)! ; left-deep: n!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DP tìm thứ tự join\u003c/td>\u003ctd>O(3ⁿ); left-deep O(n2ⁿ)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Hai biểu thức đại số được gọi là tương đương khi nào?","options":["Cho cùng kết quả trên dữ liệu hiện tại","Cho cùng kết quả trên mọi instance hợp lệ","Có cùng chi phí","Dùng cùng các bảng"],"answer":1,"explain":"Tương đương phải đúng với mọi instance hợp lệ, không chỉ dữ liệu hiện có."},{"q":"σ\u003csub>θ\u003c/sub>(E₁ ⟕ E₂) ≡ E₁ ⟕ σ\u003csub>θ\u003c/sub>(E₂) đúng không, với θ chỉ dùng thuộc tính của E₂?","options":["Luôn đúng","Sai — vế phải giữ tuple E₁ không khớp với null, vế trái có thể loại chúng","Chỉ đúng khi E₂ rỗng","Đúng với natural join"],"answer":1,"explain":"PE 16.3e. Đẩy selection xuống chỉ an toàn ở phía được bảo toàn (E₁)."},{"q":"Đẩy \u003ccode>having dept_name = 'Physics'\u003c/code> thành \u003ccode>where\u003c/code> trước \u003ccode>group by dept_name\u003c/code> có đúng không?","options":["Có, vì điều kiện chỉ dùng thuộc tính nhóm","Không bao giờ","Chỉ khi có index","Chỉ với count"],"answer":0,"explain":"PE 16.2b: σ_θ(Aγ_F(E)) ≡ Aγ_F(σ_θ(E)) khi θ chỉ dùng thuộc tính của A."},{"q":"n\u003csub>r\u003c/sub> = 10 000, V(A, r) = 50. Ước lượng kích thước σ\u003csub>A=v\u003c/sub>(r)?","options":["50","200","10 000","1"],"answer":1,"explain":"n_r / V(A, r) = 10000 / 50."},{"q":"r ⋈ s trên A; n\u003csub>r\u003c/sub> = 1000, n\u003csub>s\u003c/sub> = 2000, V(A, r) = 100, V(A, s) = 400; A không là khoá. Ước lượng?","options":["5 000","20 000","2 000 000","2 000"],"answer":0,"explain":"n_r·n_s / max(V) = 2 000 000 / 400 = 5 000."},{"q":"takes ⋈ student trên ID (ID là khoá của student, takes.ID là foreign key not null). Kích thước kết quả?","options":["n_student","n_takes","n_takes · n_student","n_student / V(ID, takes)"],"answer":1,"explain":"Mỗi tuple takes khớp đúng một student."},{"q":"Có bao nhiêu thứ tự join (cây join bất kỳ) cho 4 quan hệ?","options":["24","120","12","6"],"answer":1,"explain":"(2(n−1))!/(n−1)! = 6!/3! = 120; left-deep chỉ 4! = 24."},{"q":"Thuật toán dynamic programming tìm thứ tự join tối ưu (cây bất kỳ) chạy trong thời gian nào?","options":["O(n!)","O(3ⁿ)","O(n²)","O(2ⁿ)"],"answer":1,"explain":"Mỗi tập con S xét mọi cách chia thành S₁, S − S₁; tổng Σ C(n,k)·2ᵏ = 3ⁿ (PE 16.13)."},{"q":"Vì sao optimizer có thể chọn merge join dù hash join rẻ hơn cho riêng phép join đó?","options":["Merge join dùng ít bộ nhớ","Kết quả đã sắp (interesting order) giúp phép phía trên rẻ hơn","Hash join không hỗ trợ equi-join","Merge join không cần sort"],"answer":1,"explain":"Ví dụ phép trên là order by / group by / merge join khác trên cùng thuộc tính."},{"q":"Khử tương quan \u003ccode>where exists (select … where s.A = r.A)\u003c/code> cho ra phép toán nào?","options":["Natural join","Semijoin","Anti-semijoin","Outer join"],"answer":1,"explain":"exists → semijoin (giữ tuple r một lần); not exists → anti-semijoin."},{"q":"Materialized view v = sum(amount) group by branch. Khi xoá một tuple, cập nhật incremental thế nào?","options":["Phải tính lại toàn bộ","Trừ amount khỏi tổng của nhóm (giảm count, xoá nhóm khi count = 0)","Không cần làm gì","Xoá cả nhóm"],"answer":1,"explain":"sum và count bảo trì được bằng cộng/trừ; min/max mới có thể phải tính lại."}],"questions":[{"q":"\u003cstrong>PE 16.1\u003c/strong> — Dùng \u003ccode>explain\u003c/code> để xem plan trong các trường hợp (a)–(i). Viết truy vấn mẫu cho từng trường hợp trên PostgreSQL và cho biết plan thường thấy.","en":"\u003cp>\u003cstrong>Exercise 16.1.\u003c/strong> Get the university schema and the large university dataset from db-book.com, create the schema in a database system of your choice, and load the large dataset. Using the \u003cem>explain\u003c/em> feature (Note 16.1), look at the plan the database chooses in each case below.\u003c/p>\n\u003cp>a. A query with an equality condition on \u003cem>student.name\u003c/em> (which has no index).\u003c/p>\n\u003cp>b. The same query after creating an index on \u003cem>student.name\u003c/em>.\u003c/p>\n\u003cp>c. Simple queries joining two relations, and joining three relations.\u003c/p>\n\u003cp>d. A query computing an aggregate with grouping.\u003c/p>\n\u003cp>e. An SQL query whose chosen plan uses a semijoin operation.\u003c/p>\n\u003cp>f. An SQL query with a \u003cstrong>not in\u003c/strong> clause whose subquery uses aggregation; observe the chosen plan.\u003c/p>\n\u003cp>g. A query for which the chosen plan uses correlated evaluation (databases show this differently; most display a filter or project operator containing a subplan or subquery).\u003c/p>\n\u003cp>h. An SQL update that changes a single row of a relation; look at its plan.\u003c/p>\n\u003cp>i. An SQL update that changes many rows of a relation, computing the new value with a subquery; look at its plan.\u003c/p>","answer":"\u003cp>Kết quả phụ thuộc hệ quản trị và dữ liệu; dưới đây là truy vấn mẫu và plan PostgreSQL thường chọn trên large university dataset (chạy được ở tab SQL với dữ liệu nhỏ, nhưng dữ liệu nhỏ thì hầu như luôn là Seq Scan):\u003c/p>\n\u003cp>a. \u003ccode>explain select * from student where name = 'Zhang';\u003c/code> → \u003cstrong>Seq Scan\u003c/strong> on student, Filter: name = 'Zhang'.\u003cbr>b. \u003ccode>create index student_name_idx on student(name);\u003c/code> rồi chạy lại → \u003cstrong>Index Scan\u003c/strong> (hoặc Bitmap Index Scan + Bitmap Heap Scan) using student_name_idx. Sau khi tạo index nên \u003ccode>analyze student\u003c/code>.\u003cbr>c. \u003ccode>explain select * from student natural join takes;\u003c/code> → \u003cstrong>Hash Join\u003c/strong> (Seq Scan takes, Hash trên student). Ba bảng: \u003ccode>… natural join course\u003c/code> → hai Hash Join lồng nhau; thứ tự do optimizer chọn theo kích thước.\u003cbr>d. \u003ccode>explain select dept_name, count(*) from instructor group by dept_name;\u003c/code> → \u003cstrong>HashAggregate\u003c/strong> (hoặc Sort + GroupAggregate).\u003cbr>e. \u003ccode>explain select * from instructor where ID in (select ID from teaches);\u003c/code> → \u003cstrong>Hash Semi Join\u003c/strong> (hoặc Hash Join với HashAggregate loại trùng trên teaches).\u003cbr>f. \u003ccode>explain select * from instructor where salary not in (select max(salary) from instructor group by dept_name);\u003c/code> → Seq Scan với Filter \u003cstrong>NOT (hashed SubPlan 1)\u003c/strong>; subplan là HashAggregate.\u003cbr>g. \u003ccode>explain select name from instructor i where salary &gt; (select avg(salary) from instructor j where j.dept_name = i.dept_name);\u003c/code> → Seq Scan với Filter dùng \u003cstrong>SubPlan 1\u003c/strong> chạy lại cho mỗi dòng (correlated evaluation).\u003cbr>h. \u003ccode>explain update instructor set salary = salary * 1.05 where ID = '10101';\u003c/code> → \u003cstrong>Update\u003c/strong> on instructor ← \u003cstrong>Index Scan\u003c/strong> using instructor_pkey.\u003cbr>i. \u003ccode>explain update instructor i set salary = (select avg(salary) from instructor j where j.dept_name = i.dept_name);\u003c/code> → Update ← Seq Scan on instructor, với \u003cstrong>SubPlan\u003c/strong> tính avg cho từng dòng.\u003c/p>"},{"q":"\u003cstrong>PE 16.2\u003c/strong> — Chứng minh ba luật tương đương (a) join phân phối qua hiệu, (b) đẩy selection qua aggregation, (c) đẩy selection qua left outer join, và cho biết chúng giúp tối ưu thế nào.","en":"\u003cp>\u003cstrong>Exercise 16.2.\u003c/strong> Prove the following equivalences, and explain how each can be used to make certain queries more efficient:\u003c/p>\n\u003cp>a. E\u003csub>1\u003c/sub> ⋈\u003csub>θ\u003c/sub> (E\u003csub>2\u003c/sub> − E\u003csub>3\u003c/sub>) ≡ (E\u003csub>1\u003c/sub> ⋈\u003csub>θ\u003c/sub> E\u003csub>2\u003c/sub> − E\u003csub>1\u003c/sub> ⋈\u003csub>θ\u003c/sub> E\u003csub>3\u003c/sub>).\u003c/p>\n\u003cp>b. σ\u003csub>θ\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(E)) ≡ \u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(σ\u003csub>θ\u003c/sub>(E)), where θ uses only attributes of A.\u003c/p>\n\u003cp>c. σ\u003csub>θ\u003c/sub>(E\u003csub>1\u003c/sub> ⟕ E\u003csub>2\u003c/sub>) ≡ σ\u003csub>θ\u003c/sub>(E\u003csub>1\u003c/sub>) ⟕ E\u003csub>2\u003c/sub>, where θ uses only attributes of E\u003csub>1\u003c/sub>.\u003c/p>","answer":"\u003cp>\u003cstrong>a. E₁ ⋈\u003csub>θ\u003c/sub> (E₂ − E₃) ≡ E₁ ⋈\u003csub>θ\u003c/sub> E₂ − E₁ ⋈\u003csub>θ\u003c/sub> E₃\u003c/strong> (E₂, E₃ cùng schema).\u003cbr>Đặt R₁ = vế trái, R₂ = E₁ ⋈\u003csub>θ\u003c/sub> E₂, R₃ = E₁ ⋈\u003csub>θ\u003c/sub> E₃.\u003c/p>\n\u003cul>\u003cli>t ∈ R₁ ⇒ t = t₁·t₂ với t₁ ∈ E₁, t₂ ∈ E₂, t₂ ∉ E₃, thoả θ ⇒ t ∈ R₂; và t ∉ R₃ vì phần E₃ của t là t₂ ∉ E₃. Vậy t ∈ R₂ − R₃.\u003c/li>\u003cli>t ∈ R₂ − R₃ ⇒ t = t₁·t₂, t₂ ∈ E₂, thoả θ; nếu t₂ ∈ E₃ thì t ∈ R₃ (vô lý) ⇒ t₂ ∈ E₂ − E₃ ⇒ t ∈ R₁.\u003c/li>\u003c/ul>\n\u003cp>Ứng dụng: theo chiều phải → trái, thay hai join lớn (mà phần lớn tuple sẽ bị trừ đi) bằng một phép trừ trên E₂, E₃ rồi chỉ một join.\u003c/p>\n\u003cp>\u003cstrong>b. σ\u003csub>θ\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(E)) ≡ \u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(σ\u003csub>θ\u003c/sub>(E))\u003c/strong>, θ chỉ dùng thuộc tính của A.\u003cbr>Mọi tuple của E trong cùng một nhóm có cùng giá trị A, nên θ (chỉ phụ thuộc A) cho cùng kết quả trên mọi tuple của nhóm: nhóm bị loại ở vế trái ⇔ \u003cstrong>toàn bộ\u003c/strong> tuple của nhóm bị loại ở vế phải; nhóm được giữ thì giữ nguyên mọi tuple nên giá trị aggregate F không đổi.\u003cbr>Ứng dụng: lọc trước khi aggregate → không tốn công tính aggregate cho các nhóm sẽ bị loại (chuyển \u003ccode>having\u003c/code> trên cột nhóm thành \u003ccode>where\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>c. σ\u003csub>θ\u003c/sub>(E₁ ⟕ E₂) ≡ σ\u003csub>θ\u003c/sub>(E₁) ⟕ E₂\u003c/strong>, θ chỉ dùng thuộc tính của E₁.\u003cbr>Mỗi tuple của E₁ ⟕ E₂ có phần E₁ là một tuple t₁ của E₁ (khớp với tuple E₂ hoặc kèm null). θ chỉ xét t₁ nên tuple bị loại ở vế trái ⇔ t₁ không thoả θ ⇔ t₁ không có trong σ\u003csub>θ\u003c/sub>(E₁), và mọi tuple sinh từ t₁ bị loại ở cả hai vế; t₁ thoả θ thì sinh đúng cùng các tuple (khớp hoặc null) ở hai vế.\u003cbr>Ứng dụng: lọc E₁ trước khi outer join → join nhỏ hơn nhiều.\u003c/p>\n\u003cp>Bài CH16.06 kiểm chứng luật b trên dữ liệu.\u003c/p>"},{"q":"\u003cstrong>PE 16.3\u003c/strong> — Cho instance chứng tỏ các cặp biểu thức (a), (b), (d), (e) không tương đương; (c) thay max bằng min thì sao?","en":"\u003cp>\u003cstrong>Exercise 16.3.\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>a. Π\u003csub>A\u003c/sub>(r − s) and Π\u003csub>A\u003c/sub>(r) − Π\u003csub>A\u003c/sub>(s).\u003c/p>\n\u003cp>b. σ\u003csub>B\u003c4\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(r)) and \u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(σ\u003csub>B\u003c4\u003c/sub>(r)).\u003c/p>\n\u003cp>c. If both occurrences of max in the previous expressions were replaced by min, would the expressions be equivalent?\u003c/p>\n\u003cp>d. (r ⟖ s) ⟖ t and r ⟖ (s ⟖ t). In other words, the natural right outer join is not associative.\u003c/p>\n\u003cp>e. σ\u003csub>θ\u003c/sub>(E\u003csub>1\u003c/sub> ⟕ E\u003csub>2\u003c/sub>) and E\u003csub>1\u003c/sub> ⟕ σ\u003csub>θ\u003c/sub>(E\u003csub>2\u003c/sub>), where θ uses only attributes of E\u003csub>2\u003c/sub>.\u003c/p>","answer":"\u003cp>a. Π\u003csub>A\u003c/sub>(r − s) vs Π\u003csub>A\u003c/sub>(r) − Π\u003csub>A\u003c/sub>(s): r = {(1, 2)}, s = {(1, 3)} (schema (A, B)). r − s = {(1, 2)} → vế trái {(1)}; Π\u003csub>A\u003c/sub>(r) − Π\u003csub>A\u003c/sub>(s) = {1} − {1} = ∅.\u003c/p>\n\u003cp>b. σ\u003csub>B\u003c4\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(r)) vs \u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(σ\u003csub>B\u003c4\u003c/sub>(r)): r = {(1, 2), (1, 5)}. Vế trái: max = 5, không \u003c 4 → ∅. Vế phải: lọc còn (1, 2) → {(1, 2)}.\u003c/p>\n\u003cp>c. Với \u003cstrong>min\u003c/strong> thì \u003cstrong>tương đương\u003c/strong>: nếu min của nhóm \u003c 4 thì tuple đạt min vẫn còn sau khi lọc B \u003c 4 và vẫn là min của phần còn lại; nếu min ≥ 4 thì mọi tuple của nhóm bị lọc, nhóm biến mất ở cả hai vế.\u003c/p>\n\u003cp>d. (r ⟖ s) ⟖ t vs r ⟖ (s ⟖ t) — lời giải in trong sách (R = {(1, 2)}, S = {(2, 3)}, T = {(1, 4)}) cho hai vế \u003cstrong>bằng nhau\u003c/strong> nếu t có schema (A, D). Một instance đúng với r(A, B), s(B, C), t(A, D): r = {(1, 2)}, s = {(5, 3)}, t = {(1, 4)}.\u003c/p>\n\u003cul>\u003cli>r ⟖ s = {(null, 5, 3)} (s không khớp r); ⟖ t trên A: null ≠ 1 → {(A = 1, B = null, C = null, D = 4)}.\u003c/li>\u003cli>s ⟖ t: không có thuộc tính chung → tích {(5, 3, 1, 4)}; r ⟖ đó trên (A, B): (1, 2) không khớp (1, 5) → {(1, 5, 3, 4)}.\u003c/li>\u003c/ul>\n\u003cp>Hai kết quả khác nhau (CH16.03).\u003c/p>\n\u003cp>e. σ\u003csub>θ\u003c/sub>(E₁ ⟕ E₂) vs E₁ ⟕ σ\u003csub>θ\u003c/sub>(E₂), θ trên E₂: E₁(A, B) = {(1, 2)}, E₂(A, C) = {(2, 3)}, θ: C = 1. Vế trái: E₁ ⟕ E₂ = {(1, 2, null)}, θ trên null là unknown → ∅. Vế phải: σ\u003csub>θ\u003c/sub>(E₂) = ∅ nên {(1, 2, null)}.\u003c/p>\n\u003cp>Các bài CH16.01–CH16.05 yêu cầu tự dựng instance và hệ thống kiểm tra hai vế khác nhau.\u003c/p>"},{"q":"\u003cstrong>PE 16.4\u003c/strong> — Các luật tương đương 1 tới 7.b có còn đúng với đại số quan hệ multiset không?","en":"\u003cp>\u003cstrong>Exercise 16.4.\u003c/strong> SQL relations may contain duplicates (Chapter 3), and Notes 3.1, 3.2 and 3.3 define a multiset version of the relational algebra. Determine which of the equivalence rules 1 through 7.b still hold for the multiset version of the relational algebra.\u003c/p>","answer":"\u003cp>\u003cstrong>Có\u003c/strong> — các luật 1 tới 7.b (tách/giao hoán selection, chỉ giữ projection ngoài cùng, gộp selection vào join, join giao hoán và kết hợp, đẩy selection xuống join) đều đúng với multiset: mỗi luật chỉ lọc hoặc ghép từng tuple một cách độc lập, nên số lần xuất hiện của mỗi tuple kết quả (tích số lần của các tuple thành phần) như nhau ở hai vế. Lưu ý luật 3 với multiset: projection không loại trùng, nên Π\u003csub>L₁\u003c/sub>(Π\u003csub>L₂\u003c/sub>(E)) vẫn giữ đúng số lần.\u003c/p>\n\u003cp>Có những luật đúng với tập hợp nhưng \u003cstrong>sai\u003c/strong> với multiset, ví dụ A ∪ B = (A − B) ∪ (B − A) ∪ (A ∩ B): nếu t xuất hiện 4 lần trong A và 3 lần trong B, multiset union cho 7 lần, còn vế phải cho 1 + 0 + 3 = 4 lần. (Ví dụ của sách viết A ∩ B = A ∪ B − (A − B) − (B − A): vế trái 3 lần, vế phải 7 − 1 − 0 = 6 lần.) Nguyên nhân: union, intersect, except multiset bất đối xứng (cộng / min / trừ số lần).\u003c/p>"},{"q":"\u003cstrong>PE 16.5\u003c/strong> — r₁(A, B, C), r₂(C, D, E), r₃(E, F) với khoá A, C, E; 1000, 1500, 750 tuple. Ước lượng kích thước r₁ ⋈ r₂ ⋈ r₃ và chiến lược tính.","en":"\u003cp>\u003cstrong>Exercise 16.5.\u003c/strong> Relations r\u003csub>1\u003c/sub>(A, B, C), r\u003csub>2\u003c/sub>(C, D, E), and r\u003csub>3\u003c/sub>(E, F) have primary keys A, C, and E respectively. r\u003csub>1\u003c/sub> contains 1000 tuples, r\u003csub>2\u003c/sub> contains 1500 tuples, and r\u003csub>3\u003c/sub> contains 750 tuples. Estimate the size of r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ r\u003csub>3\u003c/sub>, and give an efficient strategy for computing this join.\u003c/p>","answer":"\u003cp>Kết quả không phụ thuộc thứ tự join. Xét (r₁ ⋈ r₂) ⋈ r₃: C là \u003cstrong>khoá của r₂\u003c/strong> nên mỗi tuple r₁ khớp tối đa một tuple r₂ → r₁ ⋈ r₂ có \u003cstrong>≤ 1000\u003c/strong> tuple; E là khoá của r₃ nên mỗi tuple của kết quả đó khớp tối đa một tuple r₃ → kết quả cuối \u003cstrong>≤ 1000\u003c/strong> tuple. (Nếu thêm C, E là foreign key not null thì đúng 1000.)\u003c/p>\n\u003cp>Chiến lược: dùng (hoặc tạo) index trên r₂.C và r₃.E. Với mỗi tuple r₁: tra index r₂ theo C (tối đa một tuple), rồi tra index r₃ theo E của tuple đó (tối đa một tuple) — indexed nested-loop hai tầng, chi phí ≈ b\u003csub>r1\u003c/sub> + 1000 × (c\u003csub>r2\u003c/sub> + c\u003csub>r3\u003c/sub>), không bao giờ tạo kết quả trung gian lớn. Hash join r₁ với r₂ rồi với r₃ cũng tốt.\u003c/p>"},{"q":"\u003cstrong>PE 16.6\u003c/strong> — Như PE 16.5 nhưng không có khoá; V(C, r₁) = 900, V(C, r₂) = 1100, V(E, r₂) = 50, V(E, r₃) = 100. Ước lượng kích thước và chiến lược.","en":"\u003cp>\u003cstrong>Exercise 16.6.\u003c/strong> Take the relations r\u003csub>1\u003c/sub>(A, B, C), r\u003csub>2\u003c/sub>(C, D, E), and r\u003csub>3\u003c/sub>(E, F) of Practice Exercise 16.5, but assume now that the only primary key of each relation is its whole schema. Let V(C, r\u003csub>1\u003c/sub>) = 900, V(C, r\u003csub>2\u003c/sub>) = 1100, V(E, r\u003csub>2\u003c/sub>) = 50, and V(E, r\u003csub>3\u003c/sub>) = 100, with r\u003csub>1\u003c/sub> having 1000 tuples, r\u003csub>2\u003c/sub> 1500 tuples, and r\u003csub>3\u003c/sub> 750 tuples. Estimate the size of r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ r\u003csub>3\u003c/sub> and give an efficient strategy for computing the join.\u003c/p>","answer":"\u003cp>r₁ ⋈ r₂ trên C: 1000 × 1500 / max(900, 1100) = 1 500 000 / 1100 ≈ \u003cstrong>1364\u003c/strong> tuple (mỗi tuple r₁ khớp trung bình 15/11 tuple r₂).\u003c/p>\n\u003cp>Kết quả đó ⋈ r₃ trên E: 1364 × 750 / max(V(E, r₂), V(E, r₃)) = (15000/11) × 750 / 100 ≈ \u003cstrong>10 227\u003c/strong> tuple. (V(E, r₁ ⋈ r₂) ≤ V(E, r₂) = 50, nên dùng max(50, 100) = 100.)\u003c/p>\n\u003cp>Chiến lược: so các kết quả trung gian — r₁ ⋈ r₂ ≈ 1364; r₂ ⋈ r₃ = 1500 × 750 / 100 = 11 250; r₁ × r₃ (không có thuộc tính chung) = 750 000. Vậy join \u003cstrong>r₁ với r₂ trước\u003c/strong> (kết quả trung gian nhỏ, cỡ r₁, r₂), rồi join với r₃ — ví dụ hash join với r₁ làm build, sau đó hash join kết quả với r₃ (r₃ làm build vì nhỏ hơn). CH16.07–CH16.08 tính các số này bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 16.7\u003c/strong> — department có B⁺-tree trên building. Cách tốt nhất cho (a) ¬(building \u003c Watson), (b) ¬(building = Watson), (c) ¬(building \u003c Watson ∨ budget \u003c 50000)?","en":"\u003cp>\u003cstrong>Exercise 16.7.\u003c/strong> Relation \u003cem>department\u003c/em> has a B\u003csup>+\u003c/sup>-tree index on \u003cem>building\u003c/em> and no other index. What is the best way to evaluate each of the following selections involving negation?\u003c/p>\n\u003cp>a. σ\u003csub>¬(building \u003c “Watson”)\u003c/sub>(\u003cem>department\u003c/em>)\u003c/p>\n\u003cp>b. σ\u003csub>¬(building = “Watson”)\u003c/sub>(\u003cem>department\u003c/em>)\u003c/p>\n\u003cp>c. σ\u003csub>¬(building \u003c “Watson” ∨ budget \u003c 50000)\u003c/sub>(\u003cem>department\u003c/em>)\u003c/p>","answer":"\u003cp>a. ≡ building ≥ 'Watson': dùng index tìm entry đầu tiên ≥ 'Watson' rồi duyệt lá tới cuối (nếu ít tuple thoả); ngược lại linear scan.\u003c/p>\n\u003cp>b. ≡ building ≠ 'Watson': gần như mọi tuple thoả → \u003cstrong>linear scan\u003c/strong>, index vô dụng.\u003c/p>\n\u003cp>c. Theo De Morgan ≡ \u003cstrong>building ≥ 'Watson' ∧ budget ≥ 50000\u003c/strong>: dùng index lấy các tuple building ≥ 'Watson' rồi kiểm tra budget ≥ 50000 trên từng tuple (lời giải sách in \"budget \u003c 5000\" là lỗi gõ).
