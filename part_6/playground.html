Nếu điều kiện building không chọn lọc thì linear scan.\u003c/p>"},{"q":"\u003cstrong>PE 16.8\u003c/strong> — Truy vấn join trên \u003ccode>upper(r.A) = upper(s.A)\u003c/code>: plan của hệ thống bạn dùng là gì, và làm sao dùng hash join hoặc merge join?","en":"\u003cp>\u003cstrong>Exercise 16.8.\u003c/strong> Consider the query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r, s\nwhere upper(r.A) = upper(s.A);\u003c/code>\u003c/pre>\n\u003cp>where \u003cem>upper\u003c/em> returns its argument with every lowercase letter replaced by the corresponding uppercase letter.\u003c/p>\n\u003cp>a. Find out which plan your database system generates for this query.\u003c/p>\n\u003cp>b. Some database systems evaluate this query with a (block) nested-loop join, which can be very slow. Briefly explain how a hash join or a merge join could be used instead.\u003c/p>","answer":"\u003cp>a. Tạo r, s và ít dữ liệu rồi \u003ccode>explain\u003c/code>. PostgreSQL chọn \u003cstrong>Hash Join\u003c/strong> với Hash Cond: upper(r.a) = upper(s.a) (hoặc Merge Join sau khi Sort theo upper(...)) — vì điều kiện vẫn là phép \u003cstrong>bằng\u003c/strong> giữa hai biểu thức, mỗi biểu thức chỉ phụ thuộc một bảng. So với \u003ccode>r.A = s.A\u003c/code>: plan có thể giống nhưng \u003cstrong>ước lượng số dòng\u003c/strong> khác hẳn, vì không có thống kê cho upper(A) (trừ khi tạo expression index rồi analyze).\u003c/p>\n\u003cp>b. Hash join: áp dụng upper() lên giá trị \u003cstrong>trước khi băm\u003c/strong> — chia partition và dựng hash table theo upper(r.A), probe bằng upper(s.A). Merge join: sắp hai bảng theo upper(A) rồi merge bình thường. Thuật toán không đổi, chỉ thay khoá join bằng biểu thức. Thêm expression index \u003ccode>create index on s (upper(A))\u003c/code> cho phép indexed nested-loop join và cho optimizer thống kê đúng (CH16.17–CH16.18).\u003c/p>"},{"q":"\u003cstrong>PE 16.9\u003c/strong> — Khi nào \u003csub>A,B\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E₁ ⋈ E₂) ≡ (\u003csub>A\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E₁)) ⋈ E₂? Nới lỏng thế nào với min/max?","en":"\u003cp>\u003cstrong>Exercise 16.9.\u003c/strong> State conditions under which the expressions\u003c/p>\n\u003cp>\u003csub>A,B\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E\u003csub>1\u003c/sub> ⋈ E\u003csub>2\u003c/sub>) and (\u003csub>A\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E\u003csub>1\u003c/sub>)) ⋈ E\u003csub>2\u003c/sub>\u003c/p>\n\u003cp>are equivalent, where agg is any aggregation operation. How can these conditions be relaxed when agg is min or max?\u003c/p>","answer":"\u003cp>Tương đương khi \u003cstrong>E₂ chỉ gồm các thuộc tính A và B, với A là khoá của E₂\u003c/strong> (không có hai tuple E₂ cùng A). Khi đó mỗi tuple E₁ khớp tối đa một tuple E₂ nên nhóm theo (A, B) ở vế trái chính là nhóm theo A, và aggregate không bị đếm lặp. Giá trị A có ở E₁ mà không có ở E₂ bị loại ở cả hai vế, không sao.\u003c/p>\n\u003cp>Nếu E₂ có hai tuple \u003cstrong>trùng cả (A, B)\u003c/strong>, ví dụ (1, x) hai lần: join nhân đôi mọi tuple E₁ có A = 1, nên vế trái (một nhóm (1, x)) có sum, count gấp đôi; vế phải aggregate trên E₁ trước (tổng đúng) rồi join ra \u003cstrong>hai\u003c/strong> dòng (1, x, tổng). Nếu A trùng nhưng B khác ((1, x), (1, y)) thì mỗi nhóm (A, B) vẫn nhận đủ các tuple E₁ của A nên sum/count hai vế tình cờ bằng nhau — nhưng điều kiện an toàn tổng quát là A là khoá của E₂.\u003c/p>\n\u003cp>Với \u003cstrong>min/max\u003c/strong>: trùng lặp không làm đổi giá trị min/max, nên chỉ cần \u003cstrong>không có tuple trùng trên (A, B)\u003c/strong> trong E₂ (vế trái loại trùng nhờ group by, vế phải thì không) — A không cần là khoá. CH16.19 yêu cầu dựng instance cho thấy hai vế khác nhau với sum.\u003c/p>"},{"q":"\u003cstrong>PE 16.10\u003c/strong> — Truy vấn natural join tập S; với tập con S1 ⊆ S, các thứ tự (sort order) nào của S1 là interesting?","en":"\u003cp>\u003cstrong>Exercise 16.10.\u003c/strong> Consider interesting orders in query optimization. A query computes the natural join of a set S of relations. For a subset S1 of S, which orders of S1 are interesting?\u003c/p>","answer":"\u003cp>Interesting order là thứ tự có thể có ích cho các phép \u003cstrong>phía trên\u003c/strong>. Với natural join, chỉ các join tiếp theo dùng được thứ tự. Đặt T = tập thuộc tính của S1 \u003cstrong>cũng xuất hiện trong một quan hệ nào đó thuộc S − S1\u003c/strong> (các thuộc tính có thể tham gia điều kiện join sau này). Khi đó \u003cstrong>mọi thứ tự trên mọi tập con của T\u003c/strong> đều là interesting order. (Nếu truy vấn có order by / group by thì thêm thứ tự trên các thuộc tính đó.)\u003c/p>"},{"q":"\u003cstrong>PE 16.11\u003c/strong> — Sửa FindBestPlan(S) thành FindBestPlan(S, O) có xét sort order O.","en":"\u003cp>\u003cstrong>Exercise 16.11.\u003c/strong> Change the function \u003cem>FindBestPlan\u003c/em>(S) into a function \u003cem>FindBestPlan\u003c/em>(S, O), where O is a required sort order for S, so that interesting sort orders are taken into account. A null order means the order does not matter. Hints: an algorithm A may already produce the order O; if it does not, a sort operation may have to be added. If A is a merge join, \u003cem>FindBestPlan\u003c/em> must be called on the two inputs with the orders those inputs need.\u003c/p>","answer":"\u003cp>Lưu plan tốt nhất theo cặp (S, O) thay vì chỉ S.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>procedure FindBestPlan(S, O)\n  if bestplan[S, O].cost ≠ ∞ then return bestplan[S, O]\n  if S chỉ có một quan hệ r:\n     với mỗi cách truy cập r (scan, các index): nếu cách đó cho thứ tự O (hoặc O = null)\n        cost = chi phí truy cập; nếu không thì cost = chi phí truy cập + chi phí sort theo O\n     lấy cách rẻ nhất → bestplan[S, O]\n  else:\n     for each tập con khác rỗng S1 ⊂ S, S1 ≠ S:\n        for each thuật toán join A cho S1 ⋈ (S − S1):\n           if A là merge join trên thuộc tính J:\n              p1 = FindBestPlan(S1, J); p2 = FindBestPlan(S − S1, J)\n           else:\n              p1 = FindBestPlan(S1, null); p2 = FindBestPlan(S − S1, null)\n           cost = p1.cost + p2.cost + chi phí A\n           if A không cho kết quả theo thứ tự O (và O ≠ null): cost += chi phí sort theo O\n           if cost &lt; bestplan[S, O].cost: ghi nhận (p1, p2, A, có thêm sort hay không)\n  return bestplan[S, O]\u003c/code>\u003c/pre>\n\u003cp>Gọi ở mức ngoài cùng với O = thứ tự của order by (hoặc null). Có thể giới hạn O ở các interesting order (PE 16.10) để bảng ghi nhớ không quá lớn.\u003c/p>"},{"q":"\u003cstrong>PE 16.12\u003c/strong> — Chứng minh n quan hệ có (2(n − 1))!/(n − 1)! thứ tự join.","en":"\u003cp>\u003cstrong>Exercise 16.12.\u003c/strong> Show that n relations have (2(n − 1))!/(n − 1)! different join orders.\u003c/p>\n\u003cp>Hint: a \u003cem>complete binary tree\u003c/em> is one in which every internal node has exactly two children. Use the fact that the number of different complete binary trees with n leaf nodes is (1/n)·C(2(n − 1), n − 1), where C denotes the binomial coefficient. If you like, derive this from the number of binary trees with n nodes, which is (1/(n + 1))·C(2n, n) — the Catalan number, derived in standard data-structures or algorithms textbooks.\u003c/p>","answer":"\u003cp>Mỗi thứ tự join là một \u003cstrong>cây nhị phân đầy đủ\u003c/strong> (mọi nút trong có đúng hai con) với n lá là n quan hệ (có thứ tự trái/phải vì cây con trái, phải là hai input khác nhau).\u003c/p>\n\u003cul>\u003cli>Cây nhị phân đầy đủ có n lá thì có n − 1 nút trong. Bỏ hết lá được một cây nhị phân (bất kỳ) n − 1 nút; ngược lại từ cây nhị phân n − 1 nút, thêm lá vào mọi chỗ trống được duy nhất một cây đầy đủ n lá. Đây là song ánh, nên số \u003cstrong>hình dạng\u003c/strong> cây = số cây nhị phân n − 1 nút = số Catalan C\u003csub>n−1\u003c/sub> = (1/n)·C(2(n − 1), n − 1).\u003c/li>\u003cli>Gán n quan hệ vào n lá: n! cách.\u003c/li>\u003c/ul>\n\u003cp>Tổng: n! · (1/n) · (2(n−1))! / ((n−1)! (n−1)!) = (n−1)! · (2(n−1))! / ((n−1)!)² = \u003cstrong>(2(n − 1))! / (n − 1)!\u003c/strong>. Ví dụ n = 3: 4!/2! = 12; n = 7: 12!/6! = 665 280 (CH16.12).\u003c/p>"},{"q":"\u003cstrong>PE 16.13\u003c/strong> — Chứng minh thứ tự join rẻ nhất tìm được trong O(3ⁿ).","en":"\u003cp>\u003cstrong>Exercise 16.13.\u003c/strong> Show that the cheapest join order can be found in O(3\u003csup>n\u003c/sup>) time. Assume that information about a set of relations (such as its optimal join order and the cost of that order) can be stored and retrieved in constant time. (If this is too hard, at least show the weaker bound O(2\u003csup>2n\u003c/sup>).)\u003c/p>","answer":"\u003cp>Dynamic programming: với mỗi tập con S của n quan hệ (tính theo kích thước tăng dần), plan tốt nhất của S = min trên mọi cách chia S thành S1 và S − S1 (S1 ≠ ∅, S1 ≠ S) của bestplan(S1) + bestplan(S − S1) + chi phí join. Tra/ghi bestplan tốn O(1).\u003c/p>\n\u003cp>Tập S có k phần tử có 2ᵏ − 2 cách chọn S1, mỗi cách O(1). Tổng thời gian:\u003c/p>\n\u003cp>Σ\u003csub>k=1..n\u003c/sub> C(n, k) · 2ᵏ ≤ Σ\u003csub>k=0..n\u003c/sub> C(n, k) · 2ᵏ · 1\u003csup>n−k\u003c/sup> = (1 + 2)ⁿ = \u003cstrong>3ⁿ\u003c/strong> (khai triển nhị thức).\u003c/p>\n\u003cp>Cận lỏng O(2²ⁿ): có 2ⁿ tập S, mỗi tập xét không quá 2ⁿ tập con S1 → 2ⁿ · 2ⁿ = 2²ⁿ = 4ⁿ.\u003c/p>"},{"q":"\u003cstrong>PE 16.14\u003c/strong> — Chỉ xét left-deep join tree: chứng minh thời gian tìm thứ tự tốt nhất khoảng n·2ⁿ.","en":"\u003cp>\u003cstrong>Exercise 16.14.\u003c/strong> Show that if only left-deep join trees are considered, as in the System R optimizer, finding the most efficient join order takes time about n·2\u003csup>n\u003c/sup>. Assume there is only one interesting sort order.\u003c/p>","answer":"\u003cp>Với left-deep tree, vế phải của phép join trên cùng phải là \u003cstrong>một\u003c/strong> quan hệ, nên với tập S có k phần tử chỉ có k cách chia (S − {r}, {r}) thay vì 2ᵏ − 2. Tổng thời gian:\u003c/p>\n\u003cp>Σ\u003csub>k=1..n\u003c/sub> C(n, k) · k = n · Σ\u003csub>k=1..n\u003c/sub> C(n − 1, k − 1) = n · 2\u003csup>n−1\u003c/sup> (dùng k·C(n, k) = n·C(n−1, k−1) và Σ C(n−1, j) = 2\u003csup>n−1\u003c/sup>).\u003c/p>\n\u003cp>Vậy khoảng \u003cstrong>n·2ⁿ\u003c/strong> (với một interesting order; mỗi order thêm nhân một hằng số). Ví dụ n = 10: 10 · 512 = 5120 bước, so với 3¹⁰ = 59 049 của cây bất kỳ và 10! = 3 628 800 nếu liệt kê mọi left-deep order.\u003c/p>"},{"q":"\u003cstrong>PE 16.15\u003c/strong> — Bank database: (a) truy vấn lồng tìm account có balance lớn nhất ở mỗi branch tên bắt đầu bằng B; (b) khử tương quan bằng SQL; (c) biểu thức đại số dùng semijoin; (d) thủ tục khử tương quan tổng quát.","en":"\u003cp>\u003cstrong>Exercise 16.15.\u003c/strong> Using the bank database of Figure 16.9 (primary keys underlined), write the following:\u003c/p>\n\u003cp>a. A nested query on relation \u003cem>account\u003c/em> that finds, for every branch whose name begins with “B”, all accounts having the maximum balance at that branch.\u003c/p>\n\u003cp>b. The same query rewritten without a nested subquery — that is, decorrelated, but still in SQL.\u003c/p>\n\u003cp>c. A relational-algebra expression, using semijoin, equivalent to the query.\u003c/p>\n\u003cp>d. A procedure (similar to the one in Section 16.4.4) for decorrelating queries of this kind.\u003c/p>\n\u003cp>\u003cem>Figure 16.9 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","answer":"\u003cp>a.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select S.account_number\nfrom account S\nwhere S.branch_name like 'B%'\n  and S.balance = (select max(T.balance) from account T where T.branch_name = S.branch_name);\u003c/code>\u003c/pre>\n\u003cp>b.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>with t1 (branch_name, max_balance) as (\n  select branch_name, max(balance) from account group by branch_name)\nselect account_number\nfrom account join t1 using (branch_name)\nwhere account.branch_name like 'B%' and account.balance = t1.max_balance;\u003c/code>\u003c/pre>\n\u003cp>(Tốt hơn: đưa \u003ccode>where branch_name like 'B%'\u003c/code> vào t1 để chỉ aggregate các branch cần.)\u003c/p>\n\u003cp>c. Đặt t1 = \u003csub>branch_name\u003c/sub>γ\u003csub>max(balance) as max_balance\u003c/sub>(σ\u003csub>branch_name like 'B%'\u003c/sub>(account)). Khi đó\u003c/p>\n\u003cp>Π\u003csub>account_number\u003c/sub>( σ\u003csub>branch_name like 'B%'\u003c/sub>(account) ⋉\u003csub>account.branch_name = t1.branch_name ∧ account.balance = t1.max_balance\u003c/sub> t1 )\u003c/p>\n\u003cp>Semijoin giữ mỗi account đúng một lần, kể cả khi nhiều account cùng đạt max.\u003c/p>\n\u003cp>d. Truy vấn dạng\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>select … from L1 where P1 and A1 op (select f(A2) from L2 where P2)\u003c/code>\u003c/pre>\n\u003cp>với P2 chứa các điều kiện tương quan (dùng biến của L1):\u003c/p>\n\u003col>\u003cli>Tách P2 = P2¹ ∧ P2², P2¹ chỉ dùng biến của L2, P2² là các điều kiện tương quan dạng (L2.X = L1.Y). Gọi V là tập thuộc tính của L2 xuất hiện trong P2².\u003c/li>\u003cli>Tạo t1 = \u003ccode>select V, f(A2) as fa from L2 where P2¹ group by V\u003c/code> (đại số: \u003csub>V\u003c/sub>γ\u003csub>f(A2)\u003c/sub>(σ\u003csub>P2¹\u003c/sub>(L2))).\u003c/li>\u003cli>Viết lại: \u003ccode>select … from L1, t1 where P1 and P2²[L2.V → t1.V] and A1 op t1.fa\u003c/code> — hoặc dùng semijoin L1 ⋉\u003csub>P2² ∧ A1 op fa\u003c/sub> t1 để không nhân dòng.\u003c/li>\u003c/ol>\n\u003cp>Chú ý: với f = count, nhóm rỗng trong truy vấn lồng cho 0 nhưng không có dòng trong t1 — phải dùng outer join và coalesce(fa, 0).\u003c/p>\n\u003cp>CH16.14–CH16.15 chạy câu a và b trên \u003ccode>qp_account\u003c/code>.\u003c/p>"}],"exercises":[{"id":"CH16.01","topic":"PE 16.3a phản ví dụ","level":2,"prompt":"\u003cp>Tạo hai bảng \u003ccode>qp_x_r(a int, b int)\u003c/code>, \u003ccode>qp_x_s(a int, b int)\u003c/code> và chèn dữ liệu sao cho Π\u003csub>A\u003c/sub>(r − s) \u003cstrong>khác\u003c/strong> Π\u003csub>A\u003c/sub>(r) − Π\u003csub>A\u003c/sub>(s). Hệ thống tính hai vế (dùng \u003ccode>except\u003c/code>) và trả về \u003ccode>differ\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.3 (a).\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>a. Π\u003csub>A\u003c/sub>(r − s) and Π\u003csub>A\u003c/sub>(r) − Π\u003csub>A\u003c/sub>(s).\u003c/p>","hint":"","solution":"create table qp_x_r (a int, b int);\ncreate table qp_x_s (a int, b int);\ninsert into qp_x_r values (1, 2);\ninsert into qp_x_s values (1, 3);","check":"with lhs as (select a from (select * from qp_x_r except select * from qp_x_s) d),\n     rhs as (select a from qp_x_r except select a from qp_x_s)\nselect exists (select * from lhs except select * from rhs)\n    or exists (select * from rhs except select * from lhs) as differ;","ordered":false,"fresh":false,"expected":{"fields":["differ"],"rows":[["true"]]}},{"id":"CH16.02","topic":"PE 16.3b phản ví dụ","level":2,"prompt":"\u003cp>Tạo \u003ccode>qp_x_m(a int, b int)\u003c/code> với dữ liệu sao cho σ\u003csub>B\u003c4\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(r)) khác \u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(σ\u003csub>B\u003c4\u003c/sub>(r)). Hệ thống so sánh hai vế và trả về \u003ccode>differ\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.3 (b).\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>b. σ\u003csub>B\u003c4\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(r)) and \u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(σ\u003csub>B\u003c4\u003c/sub>(r)).\u003c/p>","hint":"","solution":"create table qp_x_m (a int, b int);\ninsert into qp_x_m values (1, 2), (1, 5);","check":"with lhs as (select a, max(b) as b from qp_x_m group by a having max(b) \u003c 4),\n     rhs as (select a, max(b) as b from qp_x_m where b \u003c 4 group by a)\nselect exists (select * from lhs except select * from rhs)\n    or exists (select * from rhs except select * from lhs) as differ;","ordered":false,"fresh":false,"expected":{"fields":["differ"],"rows":[["true"]]}},{"id":"CH16.03","topic":"PE 16.3d right outer join","level":3,"prompt":"\u003cp>Tạo \u003ccode>qp_x_r(a int, b int)\u003c/code>, \u003ccode>qp_x_s(b int, c int)\u003c/code>, \u003ccode>qp_x_t(a int, d int)\u003c/code> và chèn dữ liệu sao cho \u003ccode>(qp_x_r natural right join qp_x_s) natural right join qp_x_t\u003c/code> \u003cstrong>khác\u003c/strong> \u003ccode>qp_x_r natural right join (qp_x_s natural right join qp_x_t)\u003c/code> (so sánh trên các cột a, b, c, d). Hệ thống trả về \u003ccode>differ\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.3 (d).\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>d. (r ⟖ s) ⟖ t and r ⟖ (s ⟖ t). In other words, the natural right outer join is not associative.\u003c/p>","hint":"Cho một tuple của s không khớp r, để vế trái sinh a = null rồi không khớp t.","solution":"create table qp_x_r (a int, b int);\ncreate table qp_x_s (b int, c int);\ncreate table qp_x_t (a int, d int);\ninsert into qp_x_r values (1, 2);\ninsert into qp_x_s values (5, 3);\ninsert into qp_x_t values (1, 4);","check":"with lhs as (select a, b, c, d from ((qp_x_r natural right join qp_x_s) natural right join qp_x_t) x),\n     rhs as (select a, b, c, d from (qp_x_r natural right join (qp_x_s natural right join qp_x_t)) y)\nselect exists (select * from lhs except select * from rhs)\n    or exists (select * from rhs except select * from lhs) as differ;","ordered":false,"fresh":false,"expected":{"fields":["differ"],"rows":[["true"]]}},{"id":"CH16.04","topic":"PE 16.3e selection & outer join","level":2,"prompt":"\u003cp>Tạo \u003ccode>qp_x_e1(a int, b int)\u003c/code>, \u003ccode>qp_x_e2(a int, c int)\u003c/code> với dữ liệu sao cho σ\u003csub>c = 1\u003c/sub>(E₁ ⟕ E₂) khác E₁ ⟕ σ\u003csub>c = 1\u003c/sub>(E₂) (natural left join trên a). Hệ thống trả về \u003ccode>differ\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.3 (e).\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>e. σ\u003csub>θ\u003c/sub>(E\u003csub>1\u003c/sub> ⟕ E\u003csub>2\u003c/sub>) and E\u003csub>1\u003c/sub> ⟕ σ\u003csub>θ\u003c/sub>(E\u003csub>2\u003c/sub>), where θ uses only attributes of E\u003csub>2\u003c/sub>.\u003c/p>","hint":"","solution":"create table qp_x_e1 (a int, b int);\ncreate table qp_x_e2 (a int, c int);\ninsert into qp_x_e1 values (1, 2);\ninsert into qp_x_e2 values (2, 3);","check":"with lhs as (select a, b, c from qp_x_e1 natural left join qp_x_e2 where c = 1),\n     rhs as (select a, b, c from qp_x_e1 natural left join (select * from qp_x_e2 where c = 1) e)\nselect exists (select * from lhs except select * from rhs)\n    or exists (select * from rhs except select * from lhs) as differ;","ordered":false,"fresh":false,"expected":{"fields":["differ"],"rows":[["true"]]}},{"id":"CH16.05","topic":"PE 16.3c min vs max","level":2,"prompt":"\u003cp>Trên \u003ccode>qp_emp(id, dept, salary)\u003c/code> với ngưỡng 30000: so sánh \"aggregate rồi lọc\" với \"lọc rồi aggregate\" theo dept. Trả về một dòng hai cột boolean:\u003c/p>\n\u003cul>\u003cli>\u003ccode>min_same\u003c/code>: \u003ccode>select dept, min(salary) … group by dept having min(salary) &lt; 30000\u003c/code> có \u003cstrong>cùng kết quả\u003c/strong> với \u003ccode>… where salary &lt; 30000 group by dept\u003c/code> không;\u003c/li>\u003cli>\u003ccode>max_same\u003c/code>: câu hỏi tương tự với max.\u003c/li>\u003c/ul>","en":"\u003cp>\u003cstrong>Exercise 16.3 (b, c).\u003c/strong> For each pair of expressions below, give relation instances showing that the two expressions are not equivalent.\u003c/p>\n\u003cp>b. σ\u003csub>B\u003c4\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(r)) and \u003csub>A\u003c/sub>γ\u003csub>max(B) as B\u003c/sub>(σ\u003csub>B\u003c4\u003c/sub>(r)).\u003c/p>\n\u003cp>c. If both occurrences of max in the previous expressions were replaced by min, would the expressions be equivalent?\u003c/p>","hint":"","solution":"with lmin as (select dept, min(salary) as v from qp_emp group by dept having min(salary) \u003c 30000),\n     rmin as (select dept, min(salary) as v from qp_emp where salary \u003c 30000 group by dept),\n     lmax as (select dept, max(salary) as v from qp_emp group by dept having max(salary) \u003c 30000),\n     rmax as (select dept, max(salary) as v from qp_emp where salary \u003c 30000 group by dept)\nselect not exists ((select * from lmin except select * from rmin) union (select * from rmin except select * from lmin)) as min_same,\n       not exists ((select * from lmax except select * from rmax) union (select * from rmax except select * from lmax)) as max_same;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["min_same","max_same"],"rows":[["true","false"]]}},{"id":"CH16.06","topic":"PE 16.2b having → where","level":1,"prompt":"\u003cp>Truy vấn sau tính lương trung bình mọi khoa rồi mới lọc:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select dept_name, avg(salary) from instructor group by dept_name\nhaving dept_name in ('Comp. Sci.', 'Physics', 'Finance');\u003c/code>\u003c/pre>\n\u003cp>Viết lại theo luật PE 16.2b: lọc \u003cstrong>trước\u003c/strong> khi aggregate (không dùng having). Trả về dept_name, avg_salary (làm tròn 2 chữ số).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.2 (b).\u003c/strong> Prove the following equivalences, and explain how each can be used to make certain queries more efficient:\u003c/p>\n\u003cp>b. σ\u003csub>θ\u003c/sub>(\u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(E)) ≡ \u003csub>A\u003c/sub>γ\u003csub>F\u003c/sub>(σ\u003csub>θ\u003c/sub>(E)), where θ uses only attributes of A.\u003c/p>","hint":"","solution":"select dept_name, round(avg(salary), 2) as avg_salary\nfrom instructor\nwhere dept_name in ('Comp. Sci.', 'Physics', 'Finance')\ngroup by dept_name;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["dept_name","avg_salary"],"rows":[["Comp. Sci.","77333.33"],["Finance","85000"],["Physics","91000"]]}},{"id":"CH16.07","topic":"PE 16.6 ước lượng join","level":2,"prompt":"\u003cp>Bảng \u003ccode>qp_card(rel, n)\u003c/code> và \u003ccode>qp_vstats(rel, attr, v)\u003c/code> chứa số liệu PE 16.6. Tính:\u003c/p>\n\u003cul>\u003cli>\u003ccode>est_r1_r2\u003c/code> = n\u003csub>r1\u003c/sub> · n\u003csub>r2\u003c/sub> / max(V(C, r1), V(C, r2)), làm tròn 1 chữ số;\u003c/li>\u003cli>\u003ccode>est_all\u003c/code> = est_r1_r2 (chưa làm tròn) · n\u003csub>r3\u003c/sub> / max(V(E, r2), V(E, r3)), làm tròn tới số nguyên.\u003c/li>\u003c/ul>","en":"\u003cp>\u003cstrong>Exercise 16.6.\u003c/strong> Take the relations r\u003csub>1\u003c/sub>(A, B, C), r\u003csub>2\u003c/sub>(C, D, E), and r\u003csub>3\u003c/sub>(E, F) of Practice Exercise 16.5, but assume now that the only primary key of each relation is its whole schema. Let V(C, r\u003csub>1\u003c/sub>) = 900, V(C, r\u003csub>2\u003c/sub>) = 1100, V(E, r\u003csub>2\u003c/sub>) = 50, and V(E, r\u003csub>3\u003c/sub>) = 100, with r\u003csub>1\u003c/sub> having 1000 tuples, r\u003csub>2\u003c/sub> 1500 tuples, and r\u003csub>3\u003c/sub> 750 tuples. Estimate the size of r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ r\u003csub>3\u003c/sub> and give an efficient strategy for computing the join.\u003c/p>","hint":"","solution":"with n as (select max(n) filter (where rel = 'r1') as n1, max(n) filter (where rel = 'r2') as n2,\n                  max(n) filter (where rel = 'r3') as n3 from qp_card),\n     v as (select max(v) filter (where rel = 'r1' and attr = 'C') as c1, max(v) filter (where rel = 'r2' and attr = 'C') as c2,\n                  max(v) filter (where rel = 'r2' and attr = 'E') as e2, max(v) filter (where rel = 'r3' and attr = 'E') as e3\n           from qp_vstats),\n     j as (select n1::numeric * n2 / greatest(c1, c2) as e12, n3, e2, e3 from n, v)\nselect round(e12, 1) as est_r1_r2, round(e12 * n3 / greatest(e2, e3)) as est_all from j;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["est_r1_r2","est_all"],"rows":[["1363.6","10227"]]}},{"id":"CH16.08","topic":"PE 16.6 chọn join đầu tiên","level":2,"prompt":"\u003cp>Vẫn số liệu PE 16.6. Ước lượng kích thước kết quả trung gian cho ba cách chọn cặp join đầu tiên: \u003ccode>r1⋈r2\u003c/code> (trên C), \u003ccode>r2⋈r3\u003c/code> (trên E), \u003ccode>r1⋈r3\u003c/code> (không có thuộc tính chung → tích Descartes). Trả về \u003ccode>pair\u003c/code> (đúng ba chuỗi trên) và \u003ccode>est\u003c/code> (làm tròn tới số nguyên), sắp theo est tăng dần.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.6.\u003c/strong> Take the relations r\u003csub>1\u003c/sub>(A, B, C), r\u003csub>2\u003c/sub>(C, D, E), and r\u003csub>3\u003c/sub>(E, F) of Practice Exercise 16.5, but assume now that the only primary key of each relation is its whole schema. Let V(C, r\u003csub>1\u003c/sub>) = 900, V(C, r\u003csub>2\u003c/sub>) = 1100, V(E, r\u003csub>2\u003c/sub>) = 50, and V(E, r\u003csub>3\u003c/sub>) = 100, with r\u003csub>1\u003c/sub> having 1000 tuples, r\u003csub>2\u003c/sub> 1500 tuples, and r\u003csub>3\u003c/sub> 750 tuples. Estimate the size of r\u003csub>1\u003c/sub> ⋈ r\u003csub>2\u003c/sub> ⋈ r\u003csub>3\u003c/sub> and give an efficient strategy for computing the join.\u003c/p>","hint":"","solution":"with n as (select max(n) filter (where rel = 'r1') as n1, max(n) filter (where rel = 'r2') as n2,\n                  max(n) filter (where rel = 'r3') as n3 from qp_card),\n     v as (select max(v) filter (where rel = 'r1' and attr = 'C') as c1, max(v) filter (where rel = 'r2' and attr = 'C') as c2,\n                  max(v) filter (where rel = 'r2' and attr = 'E') as e2, max(v) filter (where rel = 'r3' and attr = 'E') as e3\n           from qp_vstats)\nselect pair, round(est) as est from (\n  select 'r1⋈r2' as pair, n1::numeric * n2 / greatest(c1, c2) as est from n, v\n  union all select 'r2⋈r3', n2::numeric * n3 / greatest(e2, e3) from n, v\n  union all select 'r1⋈r3', n1::numeric * n3 from n, v) t\norder by est;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["pair","est"],"rows":[["r1⋈r2","1364"],["r2⋈r3","11250"],["r1⋈r3","750000"]]}},{"id":"CH16.09","topic":"ước lượng σ A ≤ v","level":2,"prompt":"\u003cp>Ước lượng số instructor có salary ≤ 70000 bằng công thức n\u003csub>r\u003c/sub> · (v − min) / (max − min) (min, max, n\u003csub>r\u003c/sub> lấy từ bảng instructor), rồi so với số thực tế. Trả về \u003ccode>estimate\u003c/code> (làm tròn 2 chữ số) và \u003ccode>actual\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select round(count(*) * (70000 - min(salary)) / (max(salary) - min(salary)), 2) as estimate,\n       count(*) filter (where salary \u003c= 70000) as actual\nfrom instructor;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["estimate","actual"],"rows":[["6.55","4"]]}},{"id":"CH16.10","topic":"histogram equi-width","level":2,"prompt":"\u003cp>Dựng histogram \u003cstrong>equi-width\u003c/strong> 4 bucket cho \u003ccode>qp_emp.salary\u003c/code> trên khoảng [20000, 100000) (mỗi bucket rộng 20000). Trả về \u003ccode>bucket\u003c/code> (1–4), \u003ccode>lo\u003c/code>, \u003ccode>hi\u003c/code> (biên dưới, biên trên của bucket) và \u003ccode>cnt\u003c/code>, sắp theo bucket.\u003c/p>","en":"","hint":"width_bucket(salary, 20000, 100000, 4).","solution":"select width_bucket(salary, 20000, 100000, 4) as bucket,\n       20000 + (width_bucket(salary, 20000, 100000, 4) - 1) * 20000 as lo,\n       20000 + width_bucket(salary, 20000, 100000, 4) * 20000 as hi,\n       count(*) as cnt\nfrom qp_emp\ngroup by 1\norder by 1;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["bucket","lo","hi","cnt"],"rows":[["1","20000","40000","50"],["2","40000","60000","50"],["3","60000","80000","51"],["4","80000","100000","49"]]}},{"id":"CH16.11","topic":"ước lượng bằng histogram","level":3,"prompt":"\u003cp>Dùng histogram của CH16.10 (giả sử phân bố đều \u003cstrong>trong\u003c/strong> mỗi bucket) để ước lượng số nhân viên có salary \u003c 45000: toàn bộ bucket [20000, 40000) cộng với phần (45000 − 40000)/20000 của bucket [40000, 60000). Trả về \u003ccode>estimate\u003c/code> (làm tròn 1 chữ số) và \u003ccode>actual\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with h as (select width_bucket(salary, 20000, 100000, 4) as bucket, count(*) as cnt from qp_emp group by 1)\nselect round(sum(case when bucket = 1 then cnt when bucket = 2 then cnt * (45000 - 40000) / 20000.0 else 0 end), 1) as estimate,\n       (select count(*) from qp_emp where salary \u003c 45000) as actual\nfrom h;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["estimate","actual"],"rows":[["62.5","62"]]}},{"id":"CH16.12","topic":"PE 16.12 số thứ tự join","level":1,"prompt":"\u003cp>Với n = 1 … 8, trả về \u003ccode>n\u003c/code>, \u003ccode>all_orders\u003c/code> = (2(n − 1))! / (n − 1)! (mọi cây join) và \u003ccode>left_deep\u003c/code> = n! (chỉ left-deep), kiểu số nguyên, sắp theo n.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.12.\u003c/strong> Show that n relations have (2(n − 1))!/(n − 1)! different join orders.\u003c/p>\n\u003cp>Hint: a \u003cem>complete binary tree\u003c/em> is one in which every internal node has exactly two children. Use the fact that the number of different complete binary trees with n leaf nodes is (1/n)·C(2(n − 1), n − 1), where C denotes the binomial coefficient. If you like, derive this from the number of binary trees with n nodes, which is (1/(n + 1))·C(2n, n) — the Catalan number, derived in standard data-structures or algorithms textbooks.\u003c/p>","hint":"","solution":"select n,\n       (factorial(2 * (n - 1)) / factorial(n - 1))::bigint as all_orders,\n       factorial(n)::bigint as left_deep\nfrom generate_series(1, 8) as n\norder by n;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["n","all_orders","left_deep"],"rows":[["1","1","1"],["2","2","2"],["3","12","6"],["4","120","24"],["5","1680","120"],["6","30240","720"],["7","665280","5040"],["8","17297280","40320"]]}},{"id":"CH16.13","topic":"thứ tự join left-deep tốt nhất","level":3,"prompt":"\u003cp>\u003ccode>qp_jrel(id, name, n)\u003c/code>: 4 quan hệ A, B, C, D (id 0–3). \u003ccode>qp_jpred(r1, r2, sel)\u003c/code>: điều kiện join giữa hai quan hệ và selectivity (cặp không có trong bảng là tích Descartes, sel = 1). Liệt kê \u003cstrong>mọi left-deep order\u003c/strong> (thứ tự thêm quan hệ, ví dụ \u003ccode>'B C D A'\u003c/code>). Khi thêm quan hệ R vào kết quả hiện có kích thước s: kích thước mới = s · n\u003csub>R\u003c/sub> · tích các sel của điều kiện nối R với các quan hệ đã có. \u003cstrong>Chi phí\u003c/strong> của một order = tổng kích thước mọi kết quả join (kể cả kết quả cuối).\u003c/p>\n\u003cp>Trả về \u003ccode>best_cost\u003c/code> (chi phí nhỏ nhất, làm tròn số nguyên) và \u003ccode>orders\u003c/code>: các order đạt chi phí đó, nối bằng \u003ccode>', '\u003c/code> theo thứ tự chữ cái.\u003c/p>","en":"","hint":"with recursive trên bitmask (1 \u003c\u003c id); tích các sel = exp(sum(ln(sel))); làm tròn kích thước mỗi bước tới 4 chữ số để tránh sai số.","solution":"with recursive plan(mask, ord, size, cost) as (\n  select 1 \u003c\u003c id, name::text, n::numeric, 0::numeric from qp_jrel\n  union all\n  select p.mask | (1 \u003c\u003c r.id), p.ord || ' ' || r.name, x.s, p.cost + x.s\n  from plan p\n  join qp_jrel r on p.mask & (1 \u003c\u003c r.id) = 0\n  cross join lateral (\n    select round(p.size * r.n * coalesce(\n             (select exp(sum(ln(j.sel))) from qp_jpred j\n              where (j.r1 = r.id and p.mask & (1 \u003c\u003c j.r2) \u003c> 0)\n                 or (j.r2 = r.id and p.mask & (1 \u003c\u003c j.r1) \u003c> 0)), 1), 4) as s) x\n),\nfull_plans as (select ord, round(cost) as cost from plan where mask = 15)\nselect cost as best_cost, string_agg(ord, ', ' order by ord) as orders\nfrom full_plans\nwhere cost = (select min(cost) from full_plans)\ngroup by cost;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["best_cost","orders"],"rows":[["6000","B C D A, C B D A"]]}},{"id":"CH16.14","topic":"PE 16.15a truy vấn lồng","level":2,"prompt":"\u003cp>Trên \u003ccode>qp_account(account_number, branch_name, balance)\u003c/code>: viết \u003cstrong>truy vấn lồng có tương quan\u003c/strong> tìm, với mỗi branch có tên bắt đầu bằng \u003ccode>B\u003c/code>, mọi account có balance lớn nhất ở branch đó. Trả về account_number, branch_name.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.15 (a).\u003c/strong> Using the bank database of Figure 16.9 (primary keys underlined), write the following:\u003c/p>\n\u003cp>a. A nested query on relation \u003cem>account\u003c/em> that finds, for every branch whose name begins with “B”, all accounts having the maximum balance at that branch.\u003c/p>\n\u003cp>\u003cem>Figure 16.9 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"select S.account_number, S.branch_name\nfrom qp_account S\nwhere S.branch_name like 'B%'\n  and S.balance = (select max(T.balance) from qp_account T where T.branch_name = S.branch_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["account_number","branch_name"],"rows":[["A-201","Brighton"],["A-218","Brighton"],["A-310","Bronx Main"],["A-401","Bay Ridge"],["A-402","Bay Ridge"]]}},{"id":"CH16.15","topic":"PE 16.15b khử tương quan","level":2,"prompt":"\u003cp>Viết lại CH16.14 \u003cstrong>không có subquery tương quan\u003c/strong>: tính max balance của mỗi branch một lần (with hoặc derived table + group by) rồi join. Trả về account_number, branch_name.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.15 (b).\u003c/strong> Using the bank database of Figure 16.9 (primary keys underlined), write the following:\u003c/p>\n\u003cp>b. The same query rewritten without a nested subquery — that is, decorrelated, but still in SQL.\u003c/p>\n\u003cp>\u003cem>Figure 16.9 — Banking database\u003c/em> (primary keys underlined):\u003c/p>\n\u003cul>\u003cli>branch (\u003cu>branch_name\u003c/u>, branch_city, assets)\u003c/li>\u003cli>customer (\u003cu>customer_name\u003c/u>, customer_street, customer_city)\u003c/li>\u003cli>loan (\u003cu>loan_number\u003c/u>, branch_name, amount)\u003c/li>\u003cli>borrower (\u003cu>customer_name, loan_number\u003c/u>)\u003c/li>\u003cli>account (\u003cu>account_number\u003c/u>, branch_name, balance)\u003c/li>\u003cli>depositor (\u003cu>customer_name, account_number\u003c/u>)\u003c/li>\u003c/ul>","hint":"","solution":"with t1 as (\n  select branch_name, max(balance) as max_balance\n  from qp_account where branch_name like 'B%'\n  group by branch_name)\nselect a.account_number, a.branch_name\nfrom qp_account a join t1 on a.branch_name = t1.branch_name and a.balance = t1.max_balance;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["account_number","branch_name"],"rows":[["A-201","Brighton"],["A-218","Brighton"],["A-310","Bronx Main"],["A-401","Bay Ridge"],["A-402","Bay Ridge"]]}},{"id":"CH16.16","topic":"not exists → anti-join","level":2,"prompt":"\u003cp>Tìm các branch \u003cstrong>không có\u003c/strong> account nào, viết bằng \u003cstrong>left outer join … is null\u003c/strong> (anti-join) thay cho \u003ccode>not exists\u003c/code>. Trả về branch_name, branch_city.\u003c/p>","en":"","hint":"","solution":"select b.branch_name, b.branch_city\nfrom qp_branch b left join qp_account a on a.branch_name = b.branch_name\nwhere a.account_number is null;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["branch_name","branch_city"],"rows":[["Pownal","Bennington"],["Austin","Austin"],["North Town","Rye"]]}},{"id":"CH16.17","topic":"PE 16.8 join trên upper()","level":1,"prompt":"\u003cp>Join \u003ccode>qp_names_r(id, name)\u003c/code> với \u003ccode>qp_names_s(code, name)\u003c/code> theo tên \u003cstrong>không phân biệt hoa thường\u003c/strong> (dùng upper). Trả về id, r_name, code.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.8.\u003c/strong> Consider the query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r, s\nwhere upper(r.A) = upper(s.A);\u003c/code>\u003c/pre>\n\u003cp>where \u003cem>upper\u003c/em> returns its argument with every lowercase letter replaced by the corresponding uppercase letter.\u003c/p>\n\u003cp>a. Find out which plan your database system generates for this query.\u003c/p>\n\u003cp>b. Some database systems evaluate this query with a (block) nested-loop join, which can be very slow. Briefly explain how a hash join or a merge join could be used instead.\u003c/p>","hint":"","solution":"select r.id, r.name as r_name, s.code\nfrom qp_names_r r join qp_names_s s on upper(r.name) = upper(s.name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["id","r_name","code"],"rows":[["1","alice","x1"],["1","alice","x5"],["2","Bob","x2"],["3","CAROL","x3"]]}},{"id":"CH16.18","topic":"expression index","level":2,"prompt":"\u003cp>Tạo \u003cstrong>expression index\u003c/strong> trên \u003ccode>qp_names_s\u003c/code> theo \u003ccode>upper(name)\u003c/code> để join của CH16.17 dùng được index (indexed nested-loop) và optimizer có thống kê. Hệ thống kiểm tra trong \u003ccode>pg_indexes\u003c/code> có index của qp_names_s mà định nghĩa chứa \u003ccode>upper\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.8.\u003c/strong> Consider the query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r, s\nwhere upper(r.A) = upper(s.A);\u003c/code>\u003c/pre>\n\u003cp>where \u003cem>upper\u003c/em> returns its argument with every lowercase letter replaced by the corresponding uppercase letter.\u003c/p>\n\u003cp>a. Find out which plan your database system generates for this query.\u003c/p>\n\u003cp>b. Some database systems evaluate this query with a (block) nested-loop join, which can be very slow. Briefly explain how a hash join or a merge join could be used instead.\u003c/p>","hint":"","solution":"create index qp_names_s_upper on qp_names_s (upper(name));","check":"select count(*) > 0 as has_upper_index\nfrom pg_indexes\nwhere tablename = 'qp_names_s' and indexdef ilike '%upper(%';","ordered":false,"fresh":false,"expected":{"fields":["has_upper_index"],"rows":[["true"]]}},{"id":"CH16.19","topic":"PE 16.9 đẩy aggregate qua join","level":3,"prompt":"\u003cp>Tạo \u003ccode>qp_x_e1(a int, c int)\u003c/code> và \u003ccode>qp_x_e2(a int, b text)\u003c/code> với dữ liệu sao cho \u003csub>A,B\u003c/sub>γ\u003csub>sum(C)\u003c/sub>(E₁ ⋈ E₂) \u003cstrong>khác\u003c/strong> (\u003csub>A\u003c/sub>γ\u003csub>sum(C)\u003c/sub>(E₁)) ⋈ E₂ (natural join trên a; so sánh trên các cột a, b, tổng). Hệ thống trả về \u003ccode>differ\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 16.9.\u003c/strong> State conditions under which the expressions\u003c/p>\n\u003cp>\u003csub>A,B\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E\u003csub>1\u003c/sub> ⋈ E\u003csub>2\u003c/sub>) and (\u003csub>A\u003c/sub>γ\u003csub>agg(C)\u003c/sub>(E\u003csub>1\u003c/sub>)) ⋈ E\u003csub>2\u003c/sub>\u003c/p>\n\u003cp>are equivalent, where agg is any aggregation operation. How can these conditions be relaxed when agg is min or max?\u003c/p>","hint":"Cho E₂ chứa cùng một tuple (a, b) hai lần.","solution":"create table qp_x_e1 (a int, c int);\ncreate table qp_x_e2 (a int, b text);\ninsert into qp_x_e1 values (1, 10), (1, 20);\ninsert into qp_x_e2 values (1, 'x'), (1, 'x');","check":"with lhs as (select a, b, sum(c) as total from qp_x_e1 natural join qp_x_e2 group by a, b),\n     rhs as (select a, b, total from (select a, sum(c) as total from qp_x_e1 group by a) g natural join qp_x_e2)\nselect exists (select * from lhs except all select * from rhs)\n    or exists (select * from rhs except all select * from lhs) as differ;","ordered":false,"fresh":false,"expected":{"fields":["differ"],"rows":[["true"]]}},{"id":"CH16.20","topic":"bảo trì materialized view","level":3,"prompt":"\u003cp>Hiện thực một materialized view được bảo trì \u003cstrong>incremental\u003c/strong> (immediate, bằng trigger):\u003c/p>\n\u003col>\u003cli>Tạo bảng \u003ccode>qp_branch_total(branch_name varchar(20) primary key, total numeric(12,2), num_accounts integer)\u003c/code> và nạp sẵn tổng balance, số account của mỗi branch từ \u003ccode>qp_account\u003c/code> (chỉ các branch có account).\u003c/li>\u003cli>Tạo trigger \u003cstrong>after insert\u003c/strong> trên \u003ccode>qp_account\u003c/code> (for each row, plpgsql) cộng balance và tăng num_accounts cho branch tương ứng — nếu branch chưa có trong qp_branch_total thì thêm dòng mới.\u003c/li>\u003c/ol>\n\u003cp>Hệ thống chèn hai account (\u003ccode>('A-900', 'Austin', 100)\u003c/code>, \u003ccode>('A-901', 'Brighton', 50)\u003c/code>) rồi đọc qp_branch_total.\u003c/p>","en":"","hint":"insert … on conflict (branch_name) do update set total = qp_branch_total.total + excluded.total, …","solution":"create table qp_branch_total (\n  branch_name   varchar(20) primary key,\n  total         numeric(12,2),\n  num_accounts  integer\n);\ninsert into qp_branch_total\nselect branch_name, sum(balance), count(*) from qp_account group by branch_name;\n\ncreate function qp_branch_total_ins() returns trigger language plpgsql as $$\nbegin\n  insert into qp_branch_total values (new.branch_name, new.balance, 1)\n  on conflict (branch_name) do update\n    set total = qp_branch_total.total + excluded.total,\n        num_accounts = qp_branch_total.num_accounts + 1;\n  return new;\nend $$;\n\ncreate trigger qp_account_ins after insert on qp_account\nfor each row execute function qp_branch_total_ins();","check":"insert into qp_account values ('A-900', 'Austin', 100), ('A-901', 'Brighton', 50);\nselect * from qp_branch_total;","ordered":false,"fresh":false,"expected":{"fields":["branch_name","total","num_accounts"],"rows":[["Mianus","700","1"],["Redwood","700","1"],["Round Hill","350","1"],["Downtown","1450","2"],["Bay Ridge","240","2"],["Perryridge","400","1"],["Bronx Main","1430","2"],["Austin","100","1"],["Brighton","2600","4"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
async function produceTable(db, sql, check, fresh) {
  if (fresh) {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
  for (let i = start; i <= items.length - (k - acc.length); i++) yield* subsetsOfSize(items, k, i + 1, [...acc, items[i]]);
}

// Candidate keys by increasing size. Attributes that never appear on a right
// side belong to every key; attributes only on right sides belong to none.
function fdCandidateKeys(R, fds) {
  const onRight = new Set(fds.flatMap(f => minus(f.rhs, f.lhs)));
  const onLeft = new Set(fds.flatMap(f => f.lhs));
  const core = R.filter(a => !onRight.has(a));
  const optional = R.filter(a => onRight.has(a) && onLeft.has(a));
  const keys = [];
  for (let k = 0; k <= optional.length; k++) {
    for (const extra of subsetsOfSize(optional, k)) {
      const K = order(R, [...core, ...extra]);
      if (keys.some(key => subset(key, K))) continue;
      if (fdIsSuperkey(R, fds, K)) keys.push(K);
    }
  }
  return keys;
}

// Canonical cover with a log of every change (slides 7.48–7.50): merge equal
// left sides, then delete one extraneous attribute at a time (Exercise 7.15
// shows why deleting two at once is wrong) until nothing changes.
function fdCover(R, fds, letters) {
  const fa = xs => fdFormat(xs, letters);
  const ff = f => fdFormatFD(f, letters);
  let F = fds.map(f => ({ lhs: [...f.lhs], rhs: [...f.rhs] }));
  const log = [];
  const mergeLeft = () => {
    const merged = [];
    for (const f of F) {
      const g = merged.find(x => same(x.lhs, f.lhs));
      if (g) {
        log.push(`Hợp (union rule): ${ff(g)} và ${ff(f)} → ${ff({ lhs: g.lhs, rhs: union(R, g.rhs, f.rhs) })}`);
        g.rhs = union(R, g.rhs, f.rhs);
      } else merged.push({ lhs: [...f.lhs], rhs: [...f.rhs] });
    }
    F = merged;
  };
  const step = () => {
    for (let i = 0; i < F.length; i++) {
      const f = F[i];
      // Left side: A ∈ α is extraneous if (α − A)⁺ under F contains β.
      if (f.lhs.length > 1) {
        for (const A of f.lhs) {
          const rest = minus(f.lhs, [A]);
          if (subset(f.rhs, fdClosure(R, F, rest).result)) {
            log.push(`${A} thừa ở vế trái của ${ff(f)}: (${fa(rest)})⁺ dưới F chứa ${fa(f.rhs)} → thay bằng ${ff({ lhs: rest, rhs: f.rhs })}`);
            F[i] = { lhs: rest, rhs: f.rhs };
            return true;
          }
        }
      }
      // Right side: A ∈ β is extraneous if α⁺ under F' (A removed from β) contains A.
      for (const A of f.rhs) {
        const reduced = { lhs: f.lhs, rhs: minus(f.rhs, [A]) };
        const Fp = F.map((g, j) => (j === i ? reduced : g)).filter(g => g.rhs.length);
        if (fdClosure(R, Fp, f.lhs).result.includes(A)) {
          log.push(`${A} thừa ở vế phải của ${ff(f)}: (${fa(f.lhs)})⁺ dưới F' (đã bỏ ${A}) vẫn chứa ${A} → ${reduced.rhs.length ? ff(reduced) : 'xoá FD này'}`);
          F = Fp;
          return true;
        }
      }
    }
    return false;
  };
  do mergeLeft(); while (step());
  return { cover: F, log };
}

// A BCNF violation on schema Ri (using F⁺ restricted to Ri): a set α ⊆ Ri
// with α⁺ ∩ Ri ⊋ α and α⁺ ⊉ Ri. Small schemas only (exponential search).
function fdBcnfViolation(R, fds, Ri) {
  for (let k = 1; k < Ri.length; k++) {
    for (const alpha of subsetsOfSize(Ri, k)) {
      const cl = fdClosure(R, fds, alpha).result;
      const beta = minus(order(Ri, cl), alpha);
      if (beta.length && !subset(Ri, cl)) return { lhs: alpha, rhs: beta };
    }
  }
  return null;
}

// BCNF decomposition (slide 7.57): replace Ri by (Ri − β) and (α ∪ β).
function fdBcnfDecompose(R, fds) {
  let result = [order(R, R)];
  const steps = [];
  for (let guard = 0; guard < 50; guard++) {
    const idx = result.findIndex(Ri => fdBcnfViolation(R, fds, Ri));
    if (idx < 0) break;
    const Ri = result[idx];
    const v = fdBcnfViolation(R, fds, Ri);
    const r1 = union(R, v.lhs, v.rhs);
    const r2 = minus(Ri, v.rhs);
    steps.push({ schema: Ri, fd: v, r1, r2 });
    result.splice(idx, 1, r1, r2);
  }
  return { result, steps };
}

// 3NF test on the original schema: for each α → A (A ∉ α) in F, α is a
// superkey or A is prime (in some candidate key).
function fdThirdNFViolations(R, fds, keys) {
  const prime = new Set((keys || fdCandidateKeys(R, fds)).flat());
  const out = [];
  for (const f of fds) {
    if (fdIsSuperkey(R, fds, f.lhs)) continue;
    const bad = minus(f.rhs, f.lhs).filter(a => !prime.has(a));
    if (bad.length) out.push({ lhs: f.lhs, rhs: bad });
  }
  return out;
}

function fdBcnfViolations(R, fds) {
  return fds.filter(f => minus(f.rhs, f.lhs).length && !fdIsSuperkey(R, fds, f.lhs));
}

// 3NF synthesis (slide 7.63) from the canonical cover.
function fdThirdNFDecompose(R, fds, letters) {
  const { cover } = fdCover(R, fds, letters);
  const schemas = [];
  const steps = [];
  for (const f of cover) {
    const s = union(R, f.lhs, f.rhs);
    if (schemas.some(x => subset(s, x))) steps.push({ kind: 'skip', fd: f, schema: s });
    else { schemas.push(s); steps.push({ kind: 'add', fd: f, schema: s }); }
  }
  const keys = fdCandidateKeys(R, fds);
  if (!schemas.some(s => keys.some(k => subset(k, s)))) {
    schemas.push(keys[0]);
    steps.push({ kind: 'key', schema: keys[0] });
  }
  // Remove schemas contained in another one.
  const result = schemas.filter((s, i) => !schemas.some((t, j) => j !== i && subset(s, t) && (!same(s, t) || j < i)));
  schemas.filter(s => !result.includes(s)).forEach(s => steps.push({ kind: 'drop', schema: s }));
  return { cover, keys, result, steps };
}

// Lossless test for a binary decomposition: R1 ∩ R2 → R1 or R1 ∩ R2 → R2.
function fdLosslessBinary(R, fds, R1, R2) {
  const common = R1.filter(a => R2.includes(a));
  const cl = fdClosure(R, fds, common).result;
  return { common, closure: cl, lossless: subset(R1, cl) || subset(R2, cl) };
}

// General lossless test (chase / tableau) for any number of schemas.
function fdLosslessChase(R, fds, schemas) {
  const rows = schemas.map((S, i) => R.map(a => (S.includes(a) ? `a:${a}` : `b${i}:${a}`)));
  let changed = true;
  while (changed) {
    changed = false;
    for (const f of fds) {
      const li = f.lhs.map(a => R.indexOf(a));
      for (let x = 0; x < rows.length; x++) {
        for (let y = x + 1; y < rows.length; y++) {
          if (!li.every(i => rows[x][i] === rows[y][i])) continue;
          for (const a of f.rhs) {
            const i = R.indexOf(a);
            const u = rows[x][i], v = rows[y][i];
            if (u === v) continue;
            const keep = u.startsWith('a:') ? u : v.startsWith('a:') ? v : u < v ? u : v;
            const drop = keep === u ? v : u;
            for (const r of rows) for (let j = 0; j < r.length; j++) if (r[j] === drop) r[j] = keep;
            changed = true;
          }
        }
      }
    }
  }
  return rows.some(r => r.every(v => v.startsWith('a:')));
}

// Dependency preservation without computing F⁺ (slide 7.53).
function fdPreserved(R, fds, schemas, f) {
  let result = [...f.lhs];
  let changed = true;
  while (changed) {
    changed = false;
    for (const Ri of schemas) {
      const t = order(Ri, fdClosure(R, fds, result.filter(a => Ri.includes(a))).result);
      const next = union(R, result, t);
      if (next.length > result.length) { result = next; changed = true; }
    }
  }
  return subset(f.rhs, result);
}

function fdParseSchemas(text, letters, R) {
  return String(text).split(/[\n;|]+/).map(s => s.replace(/^\s*R\d*\s*=\s*/i, '').trim()).filter(Boolean)
    .map(s => order(R, [...new Set(fdParseAttrs(s, letters))]));
}

function setSignal(state, info = {}) {
  const changed = signal.state !== state;
  Object.assign(signal, { state }, info);
  if (state === 'loading' || state === 'reloading') signal.startedAt = performance.now();
  signalEl.classList.toggle('is-ready', state === 'ready');
  signalEl.dataset.state = state;
  signalLabel.textContent = SIGNAL_LABEL[state];
  signalBtn.setAttribute('aria-label', SIGNAL_LABEL[state]);
  if (changed && !reduceMotion.matches) {
    signalLabel.animate([{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  }
  renderSignalPop();
}

});

document.addEventListener('click', e => {

});
setSignal('loading');

let sharedPromise = null;
let queue = Promise.resolve();

async function makeDb() { return createDatabase(await loadPGlite(), DATA.setup); }
function getShared() {
  if (!sharedPromise) {
    if (signal.state !== 'reloading') setSignal('loading');
    const t0 = performance.now();
    sharedPromise = makeDb().then(db => {
      setSignal('ready', { loadMs: performance.now() - t0, error: null });
      return db;
    }, err => {
      setSignal('error', { error: err?.message || String(err) });
      sharedPromise = null;
      throw err;
    });
  }
  return sharedPromise;
}
window.addEventListener('online', () => { if (signal.state === 'error') getShared().catch(() => {}); });
const getDb = fresh => (fresh ? makeDb() : getShared());

// Database calls must not interleave (begin/rollback wraps every run).
function serial(fn) {
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}

async function resetShared() {
  const old = sharedPromise;
  sharedPromise = null;
  setSignal('reloading');
  try { (await old)?.close(); } catch { /* ignore */ }
  return getShared();
}

// Runs user SQL for display. Exercises never change the shared database:
// everything happens inside a transaction that is rolled back.
async function runForDisplay(sql, { check = null, fresh = false, persist = false } = {}) {
  const db = await getDb(fresh);
  const out = { results: [], checkResult: null, error: null };
  if (persist || fresh) {
    try {
      out.results = await runScript(db, sql);
      if (check) out.checkResult = lastTable(await runScript(db, check));
    } catch (e) { out.error = e.message; }
    if (fresh) await db.close();
    return out;
  }
  await db.exec('begin');
  try {
    out.results = await runScript(db, sql);
    if (check) out.checkResult = lastTable(await runScript(db, check));
  } catch (e) {
    out.error = e.message;
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
  return out;
}

const num = (n, unit = '') => `<span class="n">${Number(n).toLocaleString('en-US')}</span>${unit}`;

function cell(v) {
  if (v === null || v === undefined) return '<span class="lx-null">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function tableHtml(table, title, limit = 200) {
  const rows = table.rows.slice(0, limit);
  const n = table.rows.length;
  return `<div class="lx-card">
    ${title ? `<div class="lx-card__head"><h3 class="lx-h2">${title}</h3><span class="lx-card__meta">${num(n)} dòng · ${num(table.fields.length)} cột</span></div>` : ''}
    <div class="lx-datawrap"><table class="lx-table lx-table--data"><thead><tr>${table.fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${Math.max(1, table.fields.length)}" class="lx-subtle">Không có dòng nào</td></tr>`}</tbody></table></div>
    ${n > limit ? `<div class="lx-card__foot">Hiển thị ${limit} dòng đầu trên ${num(n)} dòng</div>` : ''}</div>`;
}

function callout(kind, html) {
  return `<div class="lx-callout lx-callout--${kind}" role="status"><div class="lx-callout__text">${html}</div></div>`;
}

function resultsHtml(out) {
  const parts = [];
  const notes = [];
  out.results.forEach((r, i) => {
    const label = out.results.length > 1 ? `Kết quả câu lệnh ${i + 1}` : 'Kết quả';
    if (r.fields.length) parts.push(tableHtml(r, label));
    else notes.push(`Câu lệnh ${i + 1}: OK${r.affectedRows ? `, ${r.affectedRows.toLocaleString('en-US')} dòng bị ảnh hưởng` : ''}`);
  });
  if (notes.length) parts.unshift(`<div class="lx-callout lx-mono">${notes.map(esc).join('<br>')}</div>`);
  if (out.error) parts.push(callout('danger', `<strong>Lỗi SQL.</strong> ${esc(out.error)}`));
  if (out.checkResult) parts.push(tableHtml(out.checkResult, 'Câu truy vấn kiểm tra của hệ thống'));
  return parts.join('');
}

const exStatus = id => store.get('status:' + id, null);
function chapterProgress(ch) {
  const passed = ch.exercises.filter(ex => exStatus(ex.id) === 'pass').length;
  const failed = ch.exercises.filter(ex => exStatus(ex.id) === 'fail').length;
  const tried = passed + failed;
  const essays = store.get('essay:' + ch.store, []).filter(i => i < ch.questions.length).length;
  return { passed, failed, tried, total: ch.exercises.length, quiz: store.get('quiz:' + ch.store, null),
    needQuiz: HAS_QUIZ && ch.quiz.length > 0, essays, essayTotal: ch.questions.length };

const isDone = p => p.passed === p.total && (p.quiz || !p.needQuiz) && p.essays === p.essayTotal;

  return '<span class="lx-badge">Chưa làm</span>';
