3c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>serializable\u003c/strong>\u003c/td>\u003ctd>(mặc định chuẩn SQL) kết quả như một serial schedule\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>repeatable read\u003c/strong>\u003c/td>\u003ctd>chỉ đọc dữ liệu đã commit; đọc lại cùng item cho cùng giá trị; vẫn có thể có phantom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>read committed\u003c/strong>\u003c/td>\u003ctd>chỉ đọc dữ liệu đã commit; đọc lại có thể khác\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>read uncommitted\u003c/strong>\u003c/td>\u003ctd>đọc được cả dữ liệu chưa commit (dirty read)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Không mức nào cho phép \u003cstrong>dirty write\u003c/strong> (ghi đè item mà transaction khác chưa commit đã ghi). PostgreSQL mặc định \u003cstrong>read committed\u003c/strong>; \u003ccode>set transaction isolation level serializable\u003c/code>. \u003cstrong>Lost update\u003c/strong> (PE 17.8) có thể xảy ra ở read committed, không xảy ra ở repeatable read (giữ S-lock tới cuối hoặc kiểm tra khi ghi).\u003c/p>\n\u003ch3>10. Cài đặt isolation (giới thiệu, chi tiết ở Chương 18)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Locking\u003c/strong>: khoá trên dữ liệu, two-phase locking (S và X).\u003c/li>\u003cli>\u003cstrong>Timestamps\u003c/strong>: gán timestamp, phát hiện truy cập sai thứ tự.\u003c/li>\u003cli>\u003cstrong>Multiversion / snapshot isolation\u003c/strong>: mỗi transaction đọc một snapshot đã commit tại lúc bắt đầu; không chặn đọc, nhưng có thể không serializable (write skew — PE 17.9, 17.10).\u003c/li>\u003c/ul>\n\u003ch3>11. Transaction trong SQL — phantom\u003c/h3>\n\u003cp>Xung đột có thể ở \u003cstrong>vị từ\u003c/strong> chứ không chỉ ở tuple: T1 \u003ccode>select … where dept_name = 'Physics'\u003c/code> và T2 \u003ccode>insert\u003c/code> một instructor Physics — dù không chạm tuple chung, kết quả phụ thuộc thứ tự (\u003cstrong>phantom phenomenon\u003c/strong>). Giải pháp ở Chương 18 (index locking, predicate locking).\u003c/p>","quiz":[{"q":"Tính chất nào của ACID được đảm bảo chủ yếu bởi \u003cstrong>concurrency-control system\u003c/strong>?","options":["Atomicity","Consistency","Isolation","Durability"],"answer":2,"explain":"Isolation (kết quả như chạy tuần tự) do concurrency control đảm bảo; atomicity và durability do recovery system."},{"q":"Hai lệnh nào \u003cstrong>không\u003c/strong> xung đột?","options":["read(Q) của T1 và write(Q) của T2","write(Q) của T1 và write(Q) của T2","read(Q) của T1 và read(Q) của T2","write(Q) của T1 và read(Q) của T2"],"answer":2,"explain":"Chỉ xung đột khi cùng item, khác transaction và ít nhất một lệnh là write."},{"q":"Schedule là conflict serializable khi và chỉ khi:","options":["Precedence graph có chu trình","Precedence graph không có chu trình","Mọi transaction đều commit","Không có blind write"],"answer":1,"explain":"Đồ thị không chu trình ⇒ topological sort cho thứ tự serial tương đương."},{"q":"Vì sao thực tế dùng conflict serializability thay vì view serializability?","options":["View serializability không đúng","Kiểm tra view serializability là NP-complete","Conflict serializability cho phép nhiều schedule hơn","SQL không hỗ trợ view"],"answer":1,"explain":"PE 17.5: các giao thức thực tế dựa trên conflict serializability vì nó kiểm tra được hiệu quả."},{"q":"T2 đọc A do T1 ghi rồi T2 commit, sau đó T1 abort. Schedule này:","options":["Recoverable","Không recoverable","Cascadeless","Serial"],"answer":1,"explain":"Recoverable đòi hỏi T1 commit trước T2 vì T2 đọc dữ liệu của T1."},{"q":"Schedule cascadeless đòi hỏi:","options":["T\u003csub>i\u003c/sub> commit trước khi T\u003csub>j\u003c/sub> commit","T\u003csub>i\u003c/sub> commit trước khi T\u003csub>j\u003c/sub> đọc dữ liệu T\u003csub>i\u003c/sub> ghi","Không transaction nào abort","Các transaction không xen kẽ"],"answer":1,"explain":"Chỉ đọc dữ liệu đã commit ⇒ abort không lan sang transaction khác."},{"q":"Schedule view serializable nhưng không conflict serializable luôn chứa:","options":["Dirty read","Blind write","Deadlock","Phantom"],"answer":1,"explain":"Blind write: ghi mà không đọc trước."},{"q":"Mức isolation nào cho phép \u003cstrong>dirty read\u003c/strong>?","options":["serializable","repeatable read","read committed","read uncommitted"],"answer":3,"explain":"Read uncommitted cho đọc dữ liệu chưa commit; không mức nào cho dirty write."},{"q":"Lost update có thể xảy ra ở mức nào (theo cài đặt bằng khoá như PE 17.8)?","options":["Chỉ serializable","read committed","repeatable read","Không mức nào"],"answer":1,"explain":"Read committed nhả S-lock ngay sau khi đọc nên transaction khác ghi chen vào được."},{"q":"Durability thật sự cần loại storage nào?","options":["Volatile","Non-volatile","Stable","Cache"],"answer":2,"explain":"PE 17.4: chỉ stable storage (nhiều bản sao độc lập) đảm bảo không mất dữ liệu."}],"questions":[{"q":"\u003cstrong>PE 17.1.\u003c/strong> Hệ thống không bao giờ hỏng có cần recovery manager không?","en":"\u003cp>\u003cstrong>Exercise 17.1.\u003c/strong> Assume a database system that never fails. Does such a system still need a recovery manager?\u003c/p>","answer":"\u003cp>\u003cstrong>Có.\u003c/strong> Recovery manager không chỉ dùng khi hệ thống crash: nó còn phải \u003cstrong>rollback các transaction bị abort\u003c/strong> — do lỗi logic (vi phạm ràng buộc, chia cho 0), do người dùng yêu cầu \u003ccode>rollback\u003c/code>, hoặc do concurrency control (deadlock, timestamp test thất bại). Rollback cần log (old value) để khôi phục — chính là công việc của recovery manager. Ngoài ra nó còn hỗ trợ savepoint và rollback một phần.\u003c/p>"},{"q":"\u003cstrong>PE 17.2.\u003c/strong> File system: các bước khi tạo, xoá file và ghi dữ liệu; atomicity và durability liên quan thế nào?","en":"\u003cp>\u003cstrong>Exercise 17.2.\u003c/strong> Think of a file system such as the one in your favorite operating system.\u003c/p>\n\u003cp>a. Which steps are involved in creating a file, deleting a file, and writing data to a file?\u003c/p>\n\u003cp>b. Explain why atomicity and durability matter for creating files, deleting files, and writing data to files.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Tạo file\u003c/strong>: cấp vùng lưu trữ/khối, cấp inode (UNIX: số i-number, chèn entry vào i-list), ghi metadata (kích thước, quyền, thời gian), thêm entry tên → inode vào thư mục. \u003cstrong>Xoá file\u003c/strong>: bỏ entry khỏi thư mục, giảm link count, giải phóng inode và các khối dữ liệu (ngược lại với tạo). \u003cstrong>Ghi dữ liệu\u003c/strong>: tìm/cấp khối mới nếu cần, ghi nội dung, cập nhật inode (kích thước, con trỏ khối, thời gian).\u003c/p>\n\u003cp>b. Mỗi thao tác gồm nhiều bước ghi đĩa:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Atomicity\u003c/strong>: nếu crash giữa chừng (vd đã cấp inode nhưng chưa ghi entry thư mục, hoặc đã xoá entry nhưng chưa giải phóng khối) thì sinh ra file \"mồ côi\", khối không dùng được nhưng không được giải phóng, hoặc thư mục trỏ tới inode rác. Với người cài đặt file system, các bước tạo/xoá phải nguyên tử (journaling file system dùng log giống CSDL).\u003c/li>\u003cli>\u003cstrong>Durability\u003c/strong>: người dùng mong khi \u003ccode>write\u003c/code>/\u003ccode>close\u003c/code> (hoặc \u003ccode>fsync\u003c/code>) trả về thì dữ liệu còn sau crash; nếu dữ liệu chỉ nằm trong buffer cache thì có thể mất.\u003c/li>\u003cli>Với người \u003cem>dùng\u003c/em> file system, atomicity của nhiều lần ghi thường không được đảm bảo (file system không có transaction), chỉ có durability ở mức \u003ccode>fsync\u003c/code>.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 17.3.\u003c/strong> Vì sao người cài đặt CSDL quan tâm ACID nhiều hơn người cài đặt file system?","en":"\u003cp>\u003cstrong>Exercise 17.3.\u003c/strong> Implementers of database systems have cared far more about the ACID properties than implementers of file systems. Why might that be so?\u003c/p>","answer":"\u003cul>\u003cli>CSDL thường chạy các công việc \u003cstrong>quan trọng\u003c/strong> mà kết quả phải nguyên tử và bền vững, ảnh hưởng thế giới thực lâu dài: chuyển tiền, đặt chỗ, đơn hàng. Một nửa giao dịch chuyển tiền hay mất một lần đặt chỗ là không chấp nhận được.\u003c/li>\u003cli>CSDL có nhiều người dùng cập nhật \u003cstrong>đồng thời\u003c/strong> cùng dữ liệu có cấu trúc, nên isolation và consistency là bắt buộc.\u003c/li>\u003cli>Đa số người dùng file system không sẵn sàng trả giá (thời gian, dung lượng đĩa cho log, độ phức tạp) để có ACID đầy đủ; ứng dụng nào cần thì tự xử lý hoặc dùng CSDL.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 17.4.\u003c/strong> Loại storage nào đảm bảo durability? Vì sao?","en":"\u003cp>\u003cstrong>Exercise 17.4.\u003c/strong> Which class or classes of storage can be used to guarantee durability? Why?\u003c/p>","answer":"\u003cp>Chỉ \u003cstrong>stable storage\u003c/strong> đảm bảo durability thật sự. Volatile storage (RAM) mất dữ liệu khi mất điện/crash. Non-volatile storage (đĩa, flash) sống sót qua crash nhưng vẫn có thể hỏng (head crash, hỏng controller, cháy nổ). Stable storage là một \u003cstrong>trừu tượng\u003c/strong>: được xấp xỉ bằng cách lưu \u003cstrong>nhiều bản sao\u003c/strong> trên các thiết bị non-volatile có lỗi \u003cstrong>độc lập\u003c/strong>, và \u003cstrong>phân tán về vị trí địa lý\u003c/strong> (RAID, bản sao từ xa), để xác suất một sự cố làm mất mọi bản sao gần như bằng 0. Log của recovery system phải ghi lên stable storage trước khi báo commit.\u003c/p>"},{"q":"\u003cstrong>PE 17.5.\u003c/strong> Mọi schedule conflict serializable đều view serializable. Vì sao lại nhấn mạnh conflict serializability?","en":"\u003cp>\u003cstrong>Exercise 17.5.\u003c/strong> Every conflict-serializable schedule is also view serializable. Why, then, do we emphasize conflict serializability instead of view serializability?\u003c/p>","answer":"\u003cul>\u003cli>Kiểm tra view serializability tổng quát là \u003cstrong>NP-complete\u003c/strong> — quá đắt để dùng trực tuyến. Conflict serializability kiểm tra được bằng phát hiện chu trình trên precedence graph (đa thức).\u003c/li>\u003cli>Các giao thức concurrency control dùng trong thực tế (two-phase locking, timestamp ordering, validation) đều được chứng minh dựa trên conflict serializability; chúng chỉ sinh ra một \u003cstrong>tập con\u003c/strong> các schedule conflict serializable.\u003c/li>\u003cli>Phần chênh lệch (view serializable nhưng không conflict serializable) chỉ gồm các schedule có \u003cstrong>blind write\u003c/strong>, hiếm gặp trong thực tế, nên mất đi không đáng kể. Chỉ một dạng rất hạn chế của view serializability (Thomas write rule) được dùng.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 17.6.\u003c/strong> Precedence graph ở Figure 17.16 có tương ứng với schedule conflict serializable không?","en":"\u003cp>\u003cstrong>Exercise 17.6.\u003c/strong> Look at the precedence graph of Figure 17.16. Is the schedule it corresponds to conflict serializable? Justify your answer.\u003c/p>\n\u003cp>\u003cem>Figure 17.16 — Precedence graph for Practice Exercise 17.6\u003c/em> (nodes T1–T5, edges):\u003c/p>\n\u003cp>T1 → T2, T1 → T3, T1 → T4, T2 → T3, T2 → T4, T3 → T5, T4 → T5\u003c/p>","answer":"\u003cp>Các cạnh: T1→T2, T1→T3, T1→T4, T2→T3, T2→T4, T3→T5, T4→T5. Mọi cạnh đều đi \"xuống\" theo thứ tự T1, T2, {T3, T4}, T5, nên đồ thị \u003cstrong>không có chu trình\u003c/strong> ⇒ schedule \u003cstrong>conflict serializable\u003c/strong>. Một thứ tự serial tương đương là topological sort: \u003cstrong>T1, T2, T3, T4, T5\u003c/strong> (T1, T2, T4, T3, T5 cũng được vì giữa T3 và T4 không có cạnh). Bài CH17.07 tính thứ tự này bằng recursive CTE.\u003c/p>"},{"q":"\u003cstrong>PE 17.7.\u003c/strong> Cascadeless schedule là gì, vì sao mong muốn, khi nào nên chấp nhận noncascadeless?","en":"\u003cp>\u003cstrong>Exercise 17.7.\u003c/strong> What is a cascadeless schedule? Why is it desirable for schedules to be cascadeless? Are there situations in which allowing noncascadeless schedules would be preferable? Explain.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Định nghĩa\u003c/strong>: với mọi cặp T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub> mà T\u003csub>j\u003c/sub> đọc data item do T\u003csub>i\u003c/sub> ghi trước đó, \u003cstrong>commit của T\u003csub>i\u003c/sub> xuất hiện trước lệnh read\u003c/strong> đó của T\u003csub>j\u003c/sub>. Nói cách khác, transaction chỉ đọc dữ liệu đã commit.\u003c/li>\u003cli>\u003cstrong>Vì sao mong muốn\u003c/strong>: khi một transaction abort, không transaction nào khác đã đọc dữ liệu của nó, nên \u003cstrong>không có cascading rollback\u003c/strong> — tránh phải huỷ một chuỗi công việc dài. Cascadeless cũng kéo theo recoverable.\u003c/li>\u003cli>\u003cstrong>Khi nào chấp nhận noncascadeless\u003c/strong>: cascadeless làm giảm mức đồng thời (phải chờ commit mới đọc). Nếu abort \u003cstrong>rất hiếm\u003c/strong>, có thể chấp nhận rủi ro thỉnh thoảng phải cascading rollback để đổi lấy concurrency cao hơn (nhưng vẫn phải recoverable).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 17.8.\u003c/strong> Lost update: cho schedule minh hoạ; minh hoạ ở read committed; vì sao repeatable read không bị?","en":"\u003cp>\u003cstrong>Exercise 17.8.\u003c/strong> A \u003cem>lost update\u003c/em> anomaly happens when a transaction T\u003csub>j\u003c/sub> reads a data item, another transaction T\u003csub>k\u003c/sub> then writes that item (possibly based on an earlier read), and afterwards T\u003csub>j\u003c/sub> writes the item. The update made by T\u003csub>k\u003c/sub> is lost, because T\u003csub>j\u003c/sub>'s update did not take into account the value T\u003csub>k\u003c/sub> wrote.\u003c/p>\n\u003cp>a. Give a schedule that exhibits the lost update anomaly.\u003c/p>\n\u003cp>b. Give a schedule showing that the lost update anomaly can occur under the \u003cstrong>read committed\u003c/strong> isolation level.\u003c/p>\n\u003cp>c. Explain why the lost update anomaly cannot occur under the \u003cstrong>repeatable read\u003c/strong> isolation level.\u003c/p>","answer":"\u003cp>a. Schedule có lost update:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T1\u003c/th>\u003cth>T2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>read(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>read(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>write(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>write(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>T1 đọc A, T2 ghi A, rồi T1 ghi A dựa trên giá trị cũ → cập nhật của T2 bị mất. (Bảng \u003ccode>tx_sched\u003c/code> S2 là một ví dụ, bài CH17.10 tìm nó bằng SQL.)\u003c/p>\n\u003cp>b. Ở \u003cstrong>read committed\u003c/strong> cài bằng khoá (S-lock nhả ngay sau khi đọc, X-lock giữ tới commit):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T1\u003c/th>\u003cth>T2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>lock-S(A); read(A); unlock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock-X(A); read(A); write(A); commit; unlock(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lock-X(A); write(A); commit; unlock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Mọi lần đọc đều đọc dữ liệu đã commit, nhưng giá trị T2 ghi vẫn bị T1 ghi đè.\u003c/p>\n\u003cp>c. Ở \u003cstrong>repeatable read\u003c/strong>, T1 đọc X thì giữ S-lock tới cuối transaction. T2 muốn ghi X phải có X-lock nên phải chờ T1 kết thúc ⇒ thứ tự buộc là T1 rồi T2, giá trị của T2 không bị mất. (Nếu T1 cũng muốn ghi thì hai bên chờ nhau → deadlock, một bên bị rollback — vẫn không có lost update.)\u003c/p>"},{"q":"\u003cstrong>PE 17.9.\u003c/strong> Ngân hàng dùng snapshot isolation: tình huống không serializable gây hại?","en":"\u003cp>\u003cstrong>Exercise 17.9.\u003c/strong> A bank's database system uses snapshot isolation. Describe a concrete scenario in which a nonserializable execution occurs and causes a problem for the bank.\u003c/p>","answer":"\u003cp>Ràng buộc: tổng số dư tài khoản \u003cstrong>checking + savings\u003c/strong> của một khách không được âm. Khách có checking = 100, savings = 200.\u003c/p>\n\u003cul>\u003cli>T1 rút 200 từ \u003cstrong>checking\u003c/strong>: đọc cả hai số dư trên snapshot (100 + 200 = 300), thấy rút 200 vẫn còn 100 ≥ 0 → ghi checking = −100.\u003c/li>\u003cli>T2 chạy đồng thời rút 200 từ \u003cstrong>savings\u003c/strong>: đọc snapshot cũ (100 + 200), thấy hợp lệ → ghi savings = 0.\u003c/li>\u003c/ul>\n\u003cp>Hai transaction ghi \u003cstrong>hai item khác nhau\u003c/strong>, nên first-committer-wins không phát hiện xung đột; cả hai commit. Kết quả tổng = −100, vi phạm ràng buộc — không serial schedule nào cho kết quả này (\u003cstrong>write skew\u003c/strong>). Ngân hàng mất tiền. (Sửa: dùng serializable snapshot isolation hoặc \u003ccode>select … for update\u003c/code> để đọc có khoá.)\u003c/p>"},{"q":"\u003cstrong>PE 17.10.\u003c/strong> Hãng bay dùng snapshot isolation: tình huống không serializable nhưng có thể chấp nhận vì hiệu năng?","en":"\u003cp>\u003cstrong>Exercise 17.10.\u003c/strong> An airline's database system uses snapshot isolation. Describe a concrete scenario in which a nonserializable execution occurs, but the airline might accept it in exchange for better overall performance.\u003c/p>","answer":"\u003cp>Hệ thống đặt vé trên web, chuyến bay còn \u003cstrong>1 ghế\u003c/strong>. Hai khách A và B đặt cùng lúc: T3 và T4 mỗi bên đếm số ghế đã đặt trên snapshot của mình, thấy còn 1, và \u003cstrong>chèn\u003c/strong> một bản ghi đặt chỗ mới. Hai transaction không cập nhật tuple chung nên snapshot isolation cho cả hai commit → \u003cstrong>overbooking\u003c/strong> 1 chỗ, không serializable.\u003cbr>Hãng bay có thể chấp nhận vì: thường có khách huỷ vé trước giờ bay; nếu vẫn thừa thì đổi một khách sang chuyến khác kèm bồi thường — hãng vốn đã chủ động overbook. Đổi lại, các transaction đọc (xem chuyến, xem ghế) \u003cstrong>không bao giờ bị chặn\u003c/strong> bởi transaction ghi, nên hệ thống chịu tải cao tốt hơn nhiều.\u003c/p>"},{"q":"\u003cstrong>PE 17.11.\u003c/strong> Hệ đa bộ xử lý không sắp được thứ tự tuyệt đối giữa các thao tác trên các bộ xử lý khác nhau, nhưng thao tác trên cùng một data item thì sắp được. Định nghĩa conflict serializability có bị ảnh hưởng không?","en":"\u003cp>\u003cstrong>Exercise 17.11.\u003c/strong> The definition of a schedule assumes that all operations can be totally ordered in time. Now consider a database system running on a machine with several processors, where an exact ordering between operations executed on different processors cannot always be determined; operations on any single data item, however, can still be totally ordered.\u003c/p>\n\u003cp>Does this cause any problem for the definition of conflict serializability? Explain.\u003c/p>","answer":"\u003cp>\u003cstrong>Không.\u003c/strong> Conflict serializability chỉ dựa vào thứ tự giữa các \u003cstrong>cặp lệnh xung đột\u003c/strong>, mà hai lệnh xung đột luôn truy cập \u003cstrong>cùng một data item\u003c/strong> — thứ tự của chúng xác định được. Thứ tự giữa các lệnh trên \u003cstrong>các item khác nhau\u003c/strong> không bao giờ được dùng: chúng không xung đột và có thể đổi chỗ tuỳ ý. Ví dụ T1: read(A), write(B); T2: read(B): chỉ cần biết thứ tự read(B) so với write(B); read(A) và read(B) theo thứ tự nào cũng được. Vì vậy precedence graph vẫn xác định duy nhất và định nghĩa vẫn đúng.\u003c/p>"}],"exercises":[{"id":"CH17.01","topic":"commit","level":1,"prompt":"\u003cp>Viết \u003cstrong>một transaction\u003c/strong> chuyển 100 từ tài khoản \u003ccode>A-101\u003c/code> sang \u003ccode>A-102\u003c/code> (bảng \u003ccode>tx_account\u003c/code>) rồi \u003cstrong>commit\u003c/strong>. \u003cem>(Bài này chạy trên CSDL mới, được dùng begin/commit.)\u003c/em>\u003c/p>","en":"","hint":"","solution":"begin;\nupdate tx_account set balance = balance - 100 where acc_id = 'A-101';\nupdate tx_account set balance = balance + 100 where acc_id = 'A-102';\ncommit;","check":"select acc_id, balance from tx_account order by acc_id;","ordered":false,"fresh":true,"expected":{"fields":["acc_id","balance"],"rows":[["A-101","400"],["A-102","400"],["A-201","200"],["A-301","0"]]}},{"id":"CH17.02","topic":"atomicity","level":3,"prompt":"\u003cp>Viết hàm PL/pgSQL \u003ccode>tx_transfer(src varchar, dst varchar, amt numeric) returns text\u003c/code> chuyển \u003ccode>amt\u003c/code> từ \u003ccode>src\u003c/code> sang \u003ccode>dst\u003c/code> trong \u003ccode>tx_account\u003c/code>: \u003cstrong>cộng vào dst trước, trừ src sau\u003c/strong>. Nếu việc trừ vi phạm \u003ccode>check (balance &gt;= 0)\u003c/code> thì \u003cstrong>không được để lại thay đổi nào\u003c/strong> (kể cả phần đã cộng vào dst) và trả về \u003ccode>'FAILED'\u003c/code>; thành công trả về \u003ccode>'OK'\u003c/code>.\u003cbr>Khi chấm, hệ thống gọi \u003ccode>tx_transfer('A-101', 'A-102', 100)\u003c/code> và \u003ccode>tx_transfer('A-102', 'A-301', 1000)\u003c/code> rồi đọc số dư.\u003c/p>","en":"","hint":"Khối begin … exception when check_violation then … end trong PL/pgSQL là một subtransaction: lỗi trong khối làm huỷ mọi thay đổi của khối.","solution":"create function tx_transfer(src varchar, dst varchar, amt numeric) returns text as $$\nbegin\n  update tx_account set balance = balance + amt where acc_id = dst;\n  update tx_account set balance = balance - amt where acc_id = src;\n  return 'OK';\nexception when check_violation then\n  return 'FAILED';\nend;\n$$ language plpgsql;","check":"select tx_transfer('A-101', 'A-102', 100) as first_call,\n       tx_transfer('A-102', 'A-301', 1000) as second_call,\n       sql_value($$select string_agg(acc_id || '=' || balance, ', ' order by acc_id) from tx_account$$) as balances;","ordered":false,"fresh":false,"expected":{"fields":["first_call","second_call","balances"],"rows":[["OK","FAILED","A-101=400.00, A-102=400.00, A-201=200.00, A-301=0.00"]]}},{"id":"CH17.03","topic":"savepoint","level":2,"prompt":"\u003cp>Trong một transaction: cộng 50 vào \u003ccode>A-201\u003c/code>; tạo \u003ccode>savepoint s1\u003c/code>; đặt số dư mọi tài khoản của \u003ccode>Bob\u003c/code> về 0; \u003cstrong>rollback về s1\u003c/strong>; cộng 25 vào \u003ccode>A-301\u003c/code>; commit.\u003c/p>","en":"","hint":"","solution":"begin;\nupdate tx_account set balance = balance + 50 where acc_id = 'A-201';\nsavepoint s1;\nupdate tx_account set balance = 0 where owner = 'Bob';\nrollback to savepoint s1;\nupdate tx_account set balance = balance + 25 where acc_id = 'A-301';\ncommit;","check":"select acc_id, balance from tx_account order by acc_id;","ordered":false,"fresh":true,"expected":{"fields":["acc_id","balance"],"rows":[["A-101","500"],["A-102","300"],["A-201","250"],["A-301","25"]]}},{"id":"CH17.04","topic":"conflicting operations","level":2,"prompt":"\u003cp>\u003ccode>tx_sched(sched_id, step, txn, op, item)\u003c/code> lưu các schedule (op: R, W, C = commit, A = abort). Liệt kê mọi \u003cstrong>cặp lệnh xung đột\u003c/strong> của schedule \u003ccode>S1\u003c/code>: \u003ccode>step1, step2, txn1, txn2, item\u003c/code> với step1 \u003c step2.\u003c/p>","en":"","hint":"Cùng item, khác transaction, ít nhất một W; bỏ C/A.","solution":"select a.step as step1, b.step as step2, a.txn as txn1, b.txn as txn2, a.item\nfrom tx_sched a\n     join tx_sched b on b.sched_id = a.sched_id and b.item = a.item\n                    and a.step \u003c b.step and a.txn \u003c> b.txn\nwhere a.sched_id = 'S1' and 'W' in (a.op, b.op);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["step1","step2","txn1","txn2","item"],"rows":[["1","4","T1","T2","A"],["2","4","T1","T2","A"],["2","3","T1","T2","A"],["5","9","T1","T2","B"],["6","9","T1","T2","B"],["6","8","T1","T2","B"]]}},{"id":"CH17.05","topic":"precedence graph","level":2,"prompt":"\u003cp>Trả về các cạnh \u003ccode>src, dst\u003c/code> (không trùng) của \u003cstrong>precedence graph\u003c/strong> của schedule \u003ccode>S6\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select distinct a.txn as src, b.txn as dst\nfrom tx_sched a\n     join tx_sched b on b.sched_id = a.sched_id and b.item = a.item\n                    and a.step \u003c b.step and a.txn \u003c> b.txn\nwhere a.sched_id = 'S6' and 'W' in (a.op, b.op);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["src","dst"],"rows":[["T1","T2"],["T2","T3"],["T3","T1"]]}},{"id":"CH17.06","topic":"cycle detection","level":3,"prompt":"\u003cp>Với \u003cstrong>mỗi\u003c/strong> schedule trong \u003ccode>tx_sched\u003c/code>, cho biết có \u003cstrong>conflict serializable\u003c/strong> không: \u003ccode>sched_id, conflict_serializable\u003c/code> (boolean). Dùng recursive CTE tìm chu trình trên precedence graph.\u003c/p>","en":"","hint":"Tính bao đóng bắc cầu reach(src, dst); có chu trình ⇔ tồn tại reach(T, T).","solution":"with recursive e as (\n  select distinct a.sched_id, a.txn as src, b.txn as dst\n  from tx_sched a\n       join tx_sched b on b.sched_id = a.sched_id and b.item = a.item\n                      and a.step \u003c b.step and a.txn \u003c> b.txn\n  where 'W' in (a.op, b.op)\n), reach (sched_id, src, dst) as (\n  select sched_id, src, dst from e\n  union\n  select r.sched_id, r.src, e.dst\n  from reach r join e on e.sched_id = r.sched_id and e.src = r.dst\n)\nselect s.sched_id,\n       not exists (select 1 from reach r where r.sched_id = s.sched_id and r.src = r.dst) as conflict_serializable\nfrom (select distinct sched_id from tx_sched) s;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","conflict_serializable"],"rows":[["S1","true"],["S5","true"],["S2","false"],["S7","true"],["S4","true"],["S3","true"],["S6","false"]]}},{"id":"CH17.07","topic":"topological order","level":3,"prompt":"\u003cp>\u003ccode>tx_pg_edge(graph, src, dst)\u003c/code> chứa precedence graph \u003ccode>F17.16\u003c/code> của Figure 17.16. Tính \u003cstrong>thứ tự serial tương đương\u003c/strong>: mỗi transaction cùng \u003ccode>level\u003c/code> = độ dài đường đi \u003cstrong>dài nhất\u003c/strong> từ một đỉnh không có cạnh vào. Trả về \u003ccode>txn, level\u003c/code>, \u003cstrong>sắp theo level rồi txn\u003c/strong>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 17.6.\u003c/strong> Look at the precedence graph of Figure 17.16. Is the schedule it corresponds to conflict serializable? Justify your answer.\u003c/p>\n\u003cp>\u003cem>Figure 17.16 — Precedence graph for Practice Exercise 17.6\u003c/em> (nodes T1–T5, edges):\u003c/p>\n\u003cp>T1 → T2, T1 → T3, T1 → T4, T2 → T3, T2 → T4, T3 → T5, T4 → T5\u003c/p>","hint":"","solution":"with recursive lvl (txn, level) as (\n  select g.src, 0 from tx_pg_edge g\n  where g.graph = 'F17.16'\n    and not exists (select 1 from tx_pg_edge h where h.graph = g.graph and h.dst = g.src)\n  union\n  select e.dst, l.level + 1\n  from lvl l join tx_pg_edge e on e.graph = 'F17.16' and e.src = l.txn\n)\nselect txn, max(level) as level\nfrom lvl\ngroup by txn\norder by level, txn;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","level"],"rows":[["T1","0"],["T2","1"],["T3","2"],["T4","2"],["T5","3"]]}},{"id":"CH17.08","topic":"reads-from","level":2,"prompt":"\u003cp>Quan hệ \u003cstrong>reads-from\u003c/strong> của schedule \u003ccode>S4\u003c/code>: với mỗi lệnh R, trả về \u003ccode>step, reader, item, writer\u003c/code> — writer là transaction thực hiện \u003cstrong>lệnh W gần nhất trước đó\u003c/strong> trên cùng item, hoặc \u003ccode>initial\u003c/code> nếu chưa có ai ghi.\u003c/p>","en":"","hint":"","solution":"select r.step, r.txn as reader, r.item,\n       coalesce((select w.txn from tx_sched w\n                 where w.sched_id = r.sched_id and w.item = r.item and w.op = 'W' and w.step \u003c r.step\n                 order by w.step desc limit 1), 'initial') as writer\nfrom tx_sched r\nwhere r.sched_id = 'S4' and r.op = 'R';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["step","reader","item","writer"],"rows":[["1","T1","A","initial"],["2","T1","B","initial"],["4","T2","A","T1"],["6","T3","A","T2"]]}},{"id":"CH17.09","topic":"recoverable / cascadeless","level":3,"prompt":"\u003cp>Với mỗi schedule, trả về \u003ccode>sched_id, recoverable, cascadeless\u003c/code> (boolean). Dùng quan hệ reads-from ở CH17.08 (bỏ trường hợp đọc giá trị ban đầu hoặc đọc chính dữ liệu mình ghi). \u003cstrong>Recoverable\u003c/strong>: reader đã commit thì writer phải commit trước reader. \u003cstrong>Cascadeless\u003c/strong>: writer phải commit trước lệnh read.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 17.7.\u003c/strong> What is a cascadeless schedule? Why is it desirable for schedules to be cascadeless? Are there situations in which allowing noncascadeless schedules would be preferable? Explain.\u003c/p>","hint":"","solution":"with rf as (\n  select r.sched_id, r.step as read_step, r.txn as reader,\n         (select w.txn from tx_sched w\n          where w.sched_id = r.sched_id and w.item = r.item and w.op = 'W' and w.step \u003c r.step\n          order by w.step desc limit 1) as writer\n  from tx_sched r\n  where r.op = 'R'\n), d as (\n  select rf.*,\n         (select step from tx_sched c where c.sched_id = rf.sched_id and c.txn = rf.writer and c.op = 'C') as writer_commit,\n         (select step from tx_sched c where c.sched_id = rf.sched_id and c.txn = rf.reader and c.op = 'C') as reader_commit\n  from rf\n  where writer is not null and writer \u003c> reader\n)\nselect s.sched_id,\n       not exists (select 1 from d where d.sched_id = s.sched_id and d.reader_commit is not null\n                     and (d.writer_commit is null or d.writer_commit > d.reader_commit)) as recoverable,\n       not exists (select 1 from d where d.sched_id = s.sched_id\n                     and (d.writer_commit is null or d.writer_commit > d.read_step)) as cascadeless\nfrom (select distinct sched_id from tx_sched) s;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","recoverable","cascadeless"],"rows":[["S1","true","false"],["S5","true","true"],["S2","true","true"],["S7","true","true"],["S4","true","false"],["S3","false","false"],["S6","true","true"]]}},{"id":"CH17.10","topic":"lost update","level":3,"prompt":"\u003cp>Tìm \u003cstrong>lost update\u003c/strong> trong schedule \u003ccode>S2\u003c/code>: T\u003csub>j\u003c/sub> đọc X, sau đó T\u003csub>k\u003c/sub> (khác T\u003csub>j\u003c/sub>) ghi X, sau đó T\u003csub>j\u003c/sub> ghi X. Trả về \u003ccode>lost_txn\u003c/code> (T\u003csub>k\u003c/sub>, người bị mất cập nhật), \u003ccode>overwriting_txn\u003c/code> (T\u003csub>j\u003c/sub>), \u003ccode>item\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 17.8 (a).\u003c/strong> A \u003cem>lost update\u003c/em> anomaly happens when a transaction T\u003csub>j\u003c/sub> reads a data item, another transaction T\u003csub>k\u003c/sub> then writes that item (possibly based on an earlier read), and afterwards T\u003csub>j\u003c/sub> writes the item. The update made by T\u003csub>k\u003c/sub> is lost, because T\u003csub>j\u003c/sub>'s update did not take into account the value T\u003csub>k\u003c/sub> wrote.\u003c/p>\n\u003cp>a. Give a schedule that exhibits the lost update anomaly.\u003c/p>","hint":"","solution":"select distinct k.txn as lost_txn, j.txn as overwriting_txn, r.item\nfrom tx_sched r\n     join tx_sched k on k.sched_id = r.sched_id and k.item = r.item and k.op = 'W'\n                    and k.txn \u003c> r.txn and k.step > r.step\n     join tx_sched j on j.sched_id = r.sched_id and j.txn = r.txn and j.item = r.item\n                    and j.op = 'W' and j.step > k.step\nwhere r.sched_id = 'S2' and r.op = 'R';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["lost_txn","overwriting_txn","item"],"rows":[["T1","T2","A"]]}},{"id":"CH17.11","topic":"serial schedule","level":2,"prompt":"\u003cp>Với mỗi schedule, cho biết có phải \u003cstrong>serial schedule\u003c/strong> không (mọi lệnh của mỗi transaction nằm liền nhau): \u003ccode>sched_id, is_serial\u003c/code>.\u003c/p>","en":"","hint":"step − row_number() over (partition by sched_id, txn order by step) không đổi trên một đoạn liền nhau.","solution":"select sched_id, bool_and(groups = 1) as is_serial\nfrom (select sched_id, txn, count(distinct grp) as groups\n      from (select sched_id, txn,\n                   step - row_number() over (partition by sched_id, txn order by step) as grp\n            from tx_sched) x\n      group by sched_id, txn) y\ngroup by sched_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","is_serial"],"rows":[["S1","false"],["S2","false"],["S3","false"],["S4","false"],["S5","false"],["S6","false"],["S7","true"]]}},{"id":"CH17.12","topic":"final write","level":2,"prompt":"\u003cp>Điều kiện thứ 3 của view equivalence dùng \u003cstrong>final write\u003c/strong>. Với mỗi schedule và mỗi item, trả về transaction ghi item đó \u003cstrong>lần cuối\u003c/strong>: \u003ccode>sched_id, item, final_writer\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select distinct on (sched_id, item) sched_id, item, txn as final_writer\nfrom tx_sched\nwhere op = 'W'\norder by sched_id, item, step desc;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","item","final_writer"],"rows":[["S1","A","T2"],["S1","B","T2"],["S2","A","T2"],["S3","A","T1"],["S4","A","T2"],["S5","A","T1"],["S5","B","T2"],["S6","A","T2"],["S6","B","T3"],["S6","C","T1"],["S7","A","T2"]]}},{"id":"CH17.13","topic":"cycle members","level":3,"prompt":"\u003cp>Trong \u003ccode>tx_pg_edge\u003c/code>, đồ thị \u003ccode>G2\u003c/code> có chu trình. Trả về các transaction \u003cstrong>nằm trên một chu trình\u003c/strong> (\u003ccode>txn\u003c/code>) — đó là các transaction không thể xếp vào thứ tự serial.\u003c/p>","en":"","hint":"","solution":"with recursive reach (src, dst) as (\n  select src, dst from tx_pg_edge where graph = 'G2'\n  union\n  select r.src, e.dst from reach r join tx_pg_edge e on e.graph = 'G2' and e.src = r.dst\n)\nselect src as txn from reach where src = dst;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["txn"],"rows":[["T1"],["T2"],["T3"]]}}]},{"key":"ch18","store":"18","short":"18","label":"Chương 18","navLabel":"Chương 18","kind":"Chương","title":"Concurrency Control","titleVi":"Điều khiển đồng thời (Concurrency Control)","summary":"\u003ch3>1. Lock-based protocols\u003c/h3>\n\u003cul>\u003cli>Hai chế độ khoá: \u003cstrong>S (shared)\u003c/strong> — đọc; \u003cstrong>X (exclusive)\u003c/strong> — đọc và ghi. Ma trận tương thích: chỉ \u003cstrong>S–S\u003c/strong> tương thích.\u003c/li>\u003cli>Transaction xin khoá qua \u003cstrong>lock manager\u003c/strong>; nếu khoá không tương thích với khoá đang được transaction khác giữ thì phải \u003cstrong>chờ\u003c/strong>.\u003c/li>\u003cli>Chỉ khoá thôi chưa đủ: nhả khoá quá sớm vẫn cho schedule không serializable.\u003c/li>\u003cli>\u003cstrong>Lock manager\u003c/strong> dùng \u003cstrong>lock table\u003c/strong> (hash theo tên item) với hàng đợi các yêu cầu: yêu cầu mới được cấp nếu tương thích với mọi khoá đã cấp \u003cem>và\u003c/em> (để tránh starvation) mọi yêu cầu đang chờ trước nó.\u003c/li>\u003c/ul>\n\u003ch3>2. Two-phase locking (2PL)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Growing phase\u003c/strong>: chỉ xin khoá, không nhả. \u003cstrong>Shrinking phase\u003c/strong>: chỉ nhả, không xin thêm.\u003c/li>\u003cli>\u003cstrong>Lock point\u003c/strong>: thời điểm transaction nhận khoá cuối cùng. 2PL đảm bảo \u003cstrong>conflict serializability\u003c/strong>, thứ tự serial = thứ tự lock point (PE 18.1: nếu T\u003csub>i\u003c/sub> → T\u003csub>j\u003c/sub> thì lock point của T\u003csub>i\u003c/sub> \u003c của T\u003csub>j\u003c/sub>, chu trình sẽ cho mâu thuẫn).\u003c/li>\u003cli>2PL \u003cstrong>không\u003c/strong> tránh deadlock và \u003cstrong>không\u003c/strong> tránh cascading rollback.\u003c/li>\u003cli>\u003cstrong>Strict 2PL\u003c/strong>: giữ mọi \u003cstrong>X-lock\u003c/strong> tới khi commit/abort ⇒ cascadeless (recoverable).\u003c/li>\u003cli>\u003cstrong>Rigorous 2PL\u003c/strong>: giữ \u003cstrong>mọi\u003c/strong> khoá tới khi commit ⇒ thứ tự commit = thứ tự serializable (PE 18.3).\u003c/li>\u003cli>\u003cstrong>Lock conversion\u003c/strong>: upgrade S → X (chỉ trong growing phase), downgrade X → S (chỉ trong shrinking phase).\u003c/li>\u003cli>Tự động sinh lệnh khoá: read(Q) → xin lock-S(Q) nếu chưa có khoá; write(Q) → xin/upgrade lock-X(Q); nhả mọi khoá khi commit/abort.\u003c/li>\u003c/ul>\n\u003ch3>3. Graph-based protocols — tree protocol\u003c/h3>\n\u003cul>\u003cli>Áp thứ tự bộ phận lên data item (cây). Chỉ dùng X-lock.\u003c/li>\u003cli>Khoá đầu tiên có thể ở bất kỳ đâu; sau đó chỉ được khoá Q nếu đang giữ khoá \u003cstrong>cha\u003c/strong> của Q. Nhả khoá bất kỳ lúc nào; đã nhả item nào thì không khoá lại.\u003c/li>\u003cli>Đảm bảo conflict serializability \u003cstrong>và không deadlock\u003c/strong>; nhả khoá sớm hơn 2PL. Nhược điểm: phải khoá cả các nút không cần (đường đi), không đảm bảo recoverable nếu không thêm điều kiện. Có schedule được tree protocol cho phép mà 2PL không, và ngược lại (PE 18.5).\u003c/li>\u003c/ul>\n\u003ch3>4. Deadlock\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Prevention\u003c/strong>: khoá trước mọi item (hoặc theo thứ tự cố định); hoặc dùng timestamp:\u003c/li>\u003cli>\u003cstrong>Wait-die\u003c/strong> (non-preemptive): T\u003csub>i\u003c/sub> xin khoá do T\u003csub>j\u003c/sub> giữ: nếu T\u003csub>i\u003c/sub> \u003cstrong>già hơn\u003c/strong> (TS nhỏ hơn) thì \u003cstrong>chờ\u003c/strong>, ngược lại T\u003csub>i\u003c/sub> \u003cstrong>chết\u003c/strong> (rollback).\u003c/li>\u003cli>\u003cstrong>Wound-wait\u003c/strong> (preemptive): nếu T\u003csub>i\u003c/sub> già hơn thì \u003cstrong>wound\u003c/strong> T\u003csub>j\u003c/sub> (T\u003csub>j\u003c/sub> rollback), ngược lại T\u003csub>i\u003c/sub> chờ.\u003c/li>\u003cli>Transaction rollback giữ \u003cstrong>timestamp cũ\u003c/strong> khi restart ⇒ không starvation.\u003c/li>\u003cli>\u003cstrong>Timeout\u003c/strong>: chờ quá lâu thì rollback.\u003c/li>\u003cli>\u003cstrong>Detection\u003c/strong>: \u003cstrong>wait-for graph\u003c/strong> (T\u003csub>i\u003c/sub> → T\u003csub>j\u003c/sub> nếu T\u003csub>i\u003c/sub> chờ khoá T\u003csub>j\u003c/sub> giữ). Deadlock ⇔ có chu trình. Định kỳ chạy thuật toán tìm chu trình.\u003c/li>\u003cli>\u003cstrong>Recovery\u003c/strong>: chọn \u003cstrong>victim\u003c/strong> (chi phí rollback nhỏ nhất: đã chạy ít, giữ ít khoá, …), rollback toàn bộ hoặc một phần; tránh starvation bằng cách đếm số lần bị chọn.\u003c/li>\u003c/ul>\n\u003ch3>5. Multiple granularity\u003c/h3>\n\u003cul>\u003cli>Cây độ mịn: database → area → file (relation) → record. Khoá một nút ngầm định khoá mọi con.\u003c/li>\u003cli>Thêm \u003cstrong>intention locks\u003c/strong>: \u003cstrong>IS\u003c/strong>, \u003cstrong>IX\u003c/strong>, \u003cstrong>SIX\u003c/strong>. Ma trận tương thích:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>IS\u003c/th>\u003cth>IX\u003c/th>\u003cth>S\u003c/th>\u003cth>SIX\u003c/th>\u003cth>X\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IS\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IX\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SIX\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Khoá từ gốc xuống (cha phải có IS/IX tương ứng), nhả từ lá lên. \u003cstrong>Lock escalation\u003c/strong> khi quá nhiều khoá mịn. Ít khoá hơn khi truy cập nhiều item, nhiều khoá hơn khi truy cập một item (PE 18.9).\u003c/li>\u003cli>Ngoài S, X còn có thể có chế độ khác, vd \u003cstrong>increment (I)\u003c/strong> tương thích với chính nó (PE 18.7).\u003c/li>\u003c/ul>\n\u003ch3>6. Timestamp-ordering protocol\u003c/h3>\n\u003cul>\u003cli>Mỗi transaction có \u003cstrong>TS(T\u003csub>i\u003c/sub>)\u003c/strong> (đồng hồ hoặc bộ đếm). Mỗi item Q có \u003cstrong>W-timestamp(Q)\u003c/strong> và \u003cstrong>R-timestamp(Q)\u003c/strong> — TS lớn nhất của transaction đã ghi/đọc Q thành công.\u003c/li>\u003cli>\u003cstrong>read(Q)\u003c/strong> của T\u003csub>i\u003c/sub>: nếu TS(T\u003csub>i\u003c/sub>) \u003c W-timestamp(Q) → \u003cstrong>rollback\u003c/strong> T\u003csub>i\u003c/sub>; ngược lại thực hiện, R-timestamp(Q) := max(R-timestamp(Q), TS(T\u003csub>i\u003c/sub>)).\u003c/li>\u003cli>\u003cstrong>write(Q)\u003c/strong> của T\u003csub>i\u003c/sub>: nếu TS(T\u003csub>i\u003c/sub>) \u003c R-timestamp(Q) → rollback; nếu TS(T\u003csub>i\u003c/sub>) \u003c W-timestamp(Q) → rollback; ngược lại thực hiện, W-timestamp(Q) := TS(T\u003csub>i\u003c/sub>).\u003c/li>\u003cli>Đảm bảo conflict serializable (thứ tự TS), \u003cstrong>không deadlock\u003c/strong>, nhưng có thể \u003cstrong>starvation\u003c/strong>/livelock (PE 18.12) và schedule có thể không recoverable/cascadeless (cần thêm: ghi tất cả ở cuối, hoặc chờ commit, hoặc theo dõi dependency).\u003c/li>\u003cli>\u003cstrong>Thomas' write rule\u003c/strong>: trường hợp write với TS(T\u003csub>i\u003c/sub>) \u003c W-timestamp(Q) (nhưng ≥ R-timestamp) thì \u003cstrong>bỏ qua\u003c/strong> lệnh write (obsolete) thay vì rollback ⇒ cho một số schedule view serializable nhưng không conflict serializable.\u003c/li>\u003c/ul>\n\u003ch3>7. Validation-based protocol (optimistic)\u003c/h3>\n\u003cul>\u003cli>Ba pha: \u003cstrong>read\u003c/strong> (ghi vào biến cục bộ), \u003cstrong>validation\u003c/strong>, \u003cstrong>write\u003c/strong> (áp vào CSDL). Mốc: StartTS, ValidationTS (dùng làm TS), FinishTS.\u003c/li>\u003cli>T\u003csub>j\u003c/sub> qua validation nếu với mọi T\u003csub>i\u003c/sub> có TS(T\u003csub>i\u003c/sub>) \u003c TS(T\u003csub>j\u003c/sub>): \u003cstrong>FinishTS(T\u003csub>i\u003c/sub>) \u003c StartTS(T\u003csub>j\u003c/sub>)\u003c/strong>, hoặc \u003cstrong>StartTS(T\u003csub>j\u003c/sub>) \u003c FinishTS(T\u003csub>i\u003c/sub>) \u003c ValidationTS(T\u003csub>j\u003c/sub>)\u003c/strong> và write set của T\u003csub>i\u003c/sub> không giao read set của T\u003csub>j\u003c/sub>.\u003c/li>\u003cli>Tốt khi xung đột hiếm; tốn công vô ích khi tranh chấp cao.\u003c/li>\u003c/ul>\n\u003ch3>8. Multiversion schemes\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Multiversion timestamp ordering\u003c/strong>: mỗi Q có các phiên bản Q\u003csub>k\u003c/sub> (content, W-ts, R-ts). read(Q) của T\u003csub>i\u003c/sub> đọc phiên bản có \u003cstrong>W-ts lớn nhất ≤ TS(T\u003csub>i\u003c/sub>)\u003c/strong> — \u003cstrong>đọc không bao giờ chờ/thất bại\u003c/strong>. write(Q): nếu TS(T\u003csub>i\u003c/sub>) \u003c R-ts của phiên bản đó → rollback; nếu bằng W-ts → ghi đè; ngược lại tạo phiên bản mới.\u003c/li>\u003cli>\u003cstrong>Multiversion 2PL\u003c/strong>: transaction cập nhật dùng rigorous 2PL; read-only transaction đọc theo timestamp (ts-counter khi commit), không bao giờ chờ.\u003c/li>\u003cli>Thu gom phiên bản cũ khi không transaction nào cần.\u003c/li>\u003c/ul>\n\u003ch3>9. Snapshot isolation (SI)\u003c/h3>\n\u003cul>\u003cli>Mỗi transaction đọc \u003cstrong>snapshot\u003c/strong> các dữ liệu đã commit tại lúc bắt đầu; ghi vào bản riêng; khi commit kiểm tra xung đột ghi–ghi với transaction đồng thời:\u003c/li>\u003cli>\u003cstrong>First-committer-wins\u003c/strong>: T commit được nếu không transaction \u003cstrong>đồng thời\u003c/strong> nào (commit sau StartTS(T)) đã commit một ghi trên item T cũng ghi (PE 18.15).\u003c/li>\u003cli>\u003cstrong>First-updater-wins\u003c/strong>: kiểm tra ngay khi xin X-lock để ghi.\u003c/li>\u003cli>Ưu: đọc không bao giờ chờ, đọc không chặn ghi. Nhược: \u003cstrong>không serializable\u003c/strong> — \u003cstrong>write skew\u003c/strong> (hai transaction đọc chung, ghi hai item khác nhau, vi phạm ràng buộc). Oracle \"serializable\" thực chất là SI; PostgreSQL ≥ 9.1 có \u003cstrong>Serializable Snapshot Isolation\u003c/strong> phát hiện thêm phụ thuộc rw. \u003ccode>select … for update\u003c/code> để đọc có khoá.\u003c/li>\u003c/ul>\n\u003ch3>10. Insert, delete, predicate reads — phantom\u003c/h3>\n\u003cul>\u003cli>delete(Q) cần X-lock; insert(Q) cấp X-lock cho tuple mới.\u003c/li>\u003cli>\u003cstrong>Phantom\u003c/strong>: T1 đọc theo vị từ (vd \u003ccode>salary between 60000 and 80000\u003c/code>), T2 chèn tuple thoả vị từ — không có tuple chung nhưng vẫn xung đột. Giải pháp: khoá cả \u003cstrong>relation/dữ liệu về tập tuple\u003c/strong>, \u003cstrong>index locking\u003c/strong> (khoá các leaf node của index chứa khoảng key), \u003cstrong>next-key locking\u003c/strong>, hoặc \u003cstrong>predicate locking\u003c/strong> (đắt). Phiên bản timestamp: coi index bucket là data item có timestamp (PE 18.13).\u003c/li>\u003c/ul>\n\u003ch3>11. Weak levels of consistency trong thực tế\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Degree-two consistency\u003c/strong>: S-lock nhả bất kỳ lúc nào, X-lock theo 2PL. \u003cstrong>Cursor stability\u003c/strong>: giữ khoá trên tuple cursor đang trỏ tới.\u003c/li>\u003cli>Read committed, repeatable read như Chương 17.\u003c/li>\u003c/ul>\n\u003ch3>12. Concurrency trong index — B\u003csup>+\u003c/sup>-tree\u003c/h3>\n\u003cul>\u003cli>Không cần serializable trên cấu trúc index, chỉ cần đúng. \u003cstrong>Crabbing protocol\u003c/strong>: khoá nút con rồi mới nhả nút cha; khi chèn/xoá có thể giữ khoá trên đường từ nút không đầy (PE 18.14). \u003cstrong>B-link tree\u003c/strong>: nút có con trỏ sang anh em bên phải.\u003c/li>\u003cli>\u003cstrong>Latch-free\u003c/strong> cấu trúc dữ liệu với compare-and-swap (CAS); vấn đề \u003cstrong>ABA\u003c/strong> (PE 18.16).\u003c/li>\u003c/ul>","quiz":[{"q":"Trong 2PL, \u003cstrong>lock point\u003c/strong> là:","options":["Lúc transaction bắt đầu","Lúc nhận khoá cuối cùng","Lúc nhả khoá đầu tiên","Lúc commit"],"answer":1,"explain":"Thứ tự serial tương đương là thứ tự lock point."},{"q":"Biến thể nào của 2PL đảm bảo \u003cstrong>cascadeless\u003c/strong>?","options":["Basic 2PL","Strict 2PL","Tree protocol","Conservative 2PL"],"answer":1,"explain":"Giữ X-lock tới commit ⇒ không ai đọc được dữ liệu chưa commit."},{"q":"Wait-die: T\u003csub>i\u003c/sub> (TS = 10) xin khoá do T\u003csub>j\u003c/sub> (TS = 5) giữ. Kết quả:","options":["T\u003csub>i\u003c/sub> chờ","T\u003csub>i\u003c/sub> rollback","T\u003csub>j\u003c/sub> rollback","Cấp khoá ngay"],"answer":1,"explain":"T\u003csub>i\u003c/sub> trẻ hơn (TS lớn hơn) nên \"die\"."},{"q":"Wound-wait: T\u003csub>i\u003c/sub> (TS = 5) xin khoá do T\u003csub>j\u003c/sub> (TS = 10) giữ. Kết quả:","options":["T\u003csub>i\u003c/sub> chờ","T\u003csub>i\u003c/sub> rollback","T\u003csub>j\u003c/sub> rollback (bị wound)","Deadlock"],"answer":2,"explain":"Transaction già hơn \"wound\" transaction trẻ đang giữ khoá."},{"q":"Timestamp ordering: TS(T) = 5, R-timestamp(Q) = 4, W-timestamp(Q) = 7. Lệnh write(Q) của T với \u003cstrong>Thomas' write rule\u003c/strong>:","options":["Thực hiện","Rollback T","Bỏ qua lệnh write","Chờ"],"answer":2,"explain":"TS ≥ R-ts nhưng \u003c W-ts: giá trị đã lỗi thời, bỏ qua."},{"q":"Protocol nào \u003cstrong>không bao giờ deadlock\u003c/strong>?","options":["Strict 2PL","Rigorous 2PL","Tree protocol","Multiversion 2PL (với transaction cập nhật)"],"answer":2,"explain":"Tree protocol (và timestamp ordering) không có deadlock; các biến thể 2PL vẫn có thể deadlock."},{"q":"Intention lock \u003cstrong>IX\u003c/strong> trên một relation tương thích với khoá nào của transaction khác trên cùng relation?","options":["S","SIX","IS và IX","X"],"answer":2,"explain":"IX tương thích với IS và IX; xung đột với S, SIX, X."},{"q":"Trong multiversion timestamp ordering, read(Q) của T (TS = 8) với các phiên bản W-ts = 0, 5, 9 đọc phiên bản nào?","options":["W-ts = 0","W-ts = 5","W-ts = 9","Rollback"],"answer":1,"explain":"Phiên bản có W-ts lớn nhất không vượt quá TS(T)."},{"q":"Snapshot isolation có thể sinh ra bất thường nào?","options":["Dirty read","Lost update giữa hai transaction cùng ghi một item","Write skew","Đọc dữ liệu chưa commit"],"answer":2,"explain":"First-committer-wins chặn ghi–ghi trên cùng item, nhưng không chặn hai transaction ghi hai item khác nhau dựa trên snapshot chung."},{"q":"Phantom phenomenon xảy ra khi:","options":["Hai transaction cùng ghi một tuple","Một transaction đọc theo vị từ trong khi transaction khác chèn tuple thoả vị từ","Transaction đọc dữ liệu chưa commit","Deadlock giữa hai transaction"],"answer":1,"explain":"Xung đột trên vị từ, không trên tuple chung; xử lý bằng index locking hoặc predicate locking."}],"questions":[{"q":"\u003cstrong>PE 18.1.\u003c/strong> Chứng minh 2PL đảm bảo conflict serializability và có thể serialize theo lock point.","en":"\u003cp>\u003cstrong>Exercise 18.1.\u003c/strong> Show that the two-phase locking protocol guarantees conflict serializability, and that transactions can be serialized in the order of their lock points.\u003c/p>","answer":"\u003cp>Giả sử phản chứng: một tập T\u003csub>0\u003c/sub>, …, T\u003csub>n−1\u003c/sub> tuân theo 2PL tạo ra schedule không conflict serializable. Khi đó precedence graph có chu trình, giả sử T\u003csub>0\u003c/sub> → T\u003csub>1\u003c/sub> → … → T\u003csub>n−1\u003c/sub> → T\u003csub>0\u003c/sub>.\u003c/p>\n\u003cp>Gọi α\u003csub>i\u003c/sub> là lock point của T\u003csub>i\u003c/sub> (lúc nhận khoá cuối cùng). Cạnh T\u003csub>i\u003c/sub> → T\u003csub>j\u003c/sub> nghĩa là có item Q mà T\u003csub>i\u003c/sub> truy cập (với chế độ xung đột) trước T\u003csub>j\u003c/sub>. T\u003csub>j\u003c/sub> chỉ nhận được khoá xung đột trên Q sau khi T\u003csub>i\u003c/sub> \u003cstrong>nhả\u003c/strong> khoá trên Q; theo 2PL, T\u003csub>i\u003c/sub> nhả khoá chỉ sau lock point của nó. Vậy α\u003csub>i\u003c/sub> \u003c (lúc T\u003csub>i\u003c/sub> nhả Q) \u003c (lúc T\u003csub>j\u003c/sub> khoá Q) ≤ α\u003csub>j\u003c/sub>.\u003c/p>\n\u003cp>Đi theo chu trình: α\u003csub>0\u003c/sub> \u003c α\u003csub>1\u003c/sub> \u003c … \u003c α\u003csub>n−1\u003c/sub> \u003c α\u003csub>0\u003c/sub> — mâu thuẫn. Vậy precedence graph không có chu trình ⇒ conflict serializable. Hơn nữa mọi cạnh đi từ lock point nhỏ sang lớn, nên \u003cstrong>sắp transaction theo lock point là một topological sort\u003c/strong> — chính là thứ tự serial tương đương. (Bài CH18.03 tính lock point từ một schedule có lệnh khoá.)\u003c/p>"},{"q":"\u003cstrong>PE 18.2.\u003c/strong> Thêm lock/unlock cho T34, T35 theo 2PL. Có thể deadlock không?","en":"\u003cp>\u003cstrong>Exercise 18.2.\u003c/strong> Consider these two transactions:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>T34: read(A);\n     read(B);\n     if A = 0 then B := B + 1;\n     write(B).\n\nT35: read(B);\n     read(A);\n     if B = 0 then A := A + 1;\n     write(A).\u003c/code>\u003c/pre>\n\u003cp>Insert lock and unlock instructions into T34 and T35 so that they follow the two-phase locking protocol. Can executing these transactions lead to a deadlock?\u003c/p>","answer":"\u003cp>a.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>T34: lock-S(A); read(A); lock-X(B); read(B);\n     if A = 0 then B := B + 1; write(B);\n     unlock(A); unlock(B).\nT35: lock-S(B); read(B); lock-X(A); read(A);\n     if B = 0 then A := A + 1; write(A);\n     unlock(B); unlock(A).\u003c/code>\u003c/pre>\n\u003cp>Mỗi transaction xin hết khoá trước khi nhả khoá nào ⇒ 2PL.\u003c/p>\n\u003cp>b. \u003cstrong>Có thể deadlock.\u003c/strong> Schedule một phần:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T34\u003c/th>\u003cth>T35\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>lock-S(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock-S(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>read(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>read(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lock-X(B) — chờ T35 nhả S(B)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock-X(A) — chờ T34 nhả S(A)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Hai transaction chờ nhau: chu trình trong wait-for graph.\u003c/p>"},{"q":"\u003cstrong>PE 18.3.\u003c/strong> Lợi ích của rigorous 2PL? So với các dạng 2PL khác?","en":"\u003cp>\u003cstrong>Exercise 18.3.\u003c/strong> What advantage does rigorous two-phase locking offer? How does it compare with the other variants of two-phase locking?\u003c/p>","answer":"\u003cul>\u003cli>Rigorous 2PL giữ \u003cstrong>mọi\u003c/strong> khoá (S và X) tới khi commit/abort. Nó có mọi ưu điểm của \u003cstrong>strict 2PL\u003c/strong> (giữ X-lock tới commit ⇒ cascadeless, recoverable).\u003c/li>\u003cli>Thêm: với hai transaction xung đột, \u003cstrong>thứ tự commit chính là thứ tự serializable\u003c/strong> — người dùng thấy kết quả như các transaction chạy theo đúng thứ tự chúng commit, điều nhiều hệ thống/ứng dụng mong đợi. Cài đặt cũng đơn giản (nhả hết khoá một lúc khi kết thúc).\u003c/li>\u003cli>So sánh: \u003cstrong>basic 2PL\u003c/strong> cho concurrency cao nhất nhưng có thể cascading rollback; \u003cstrong>strict\u003c/strong> nhả S-lock sớm hơn nên concurrency cao hơn rigorous chút ít; rigorous giảm concurrency nhẹ (S-lock giữ lâu hơn). Đa số hệ thống thương mại dùng strict hoặc rigorous 2PL. Không biến thể nào tránh được deadlock.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.4.\u003c/strong> Chèn nút giả giữa mọi cặp nút của cây: vì sao tree protocol trên cây mới cho concurrency tốt hơn?","en":"\u003cp>\u003cstrong>Exercise 18.4.\u003c/strong> A database is organized as a rooted tree. Suppose a dummy vertex is inserted between every pair of vertices. Show that following the tree protocol on the new tree yields better concurrency than following it on the original tree.\u003c/p>","answer":"\u003cp>Xét A là cha của B, chèn nút giả D giữa A và B (A → D → B). Giả sử T2 đang khoá B; T1 đang khoá A và muốn khoá B; T3 muốn khoá A.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Cây gốc\u003c/strong>: T1 muốn khoá B phải đang giữ khoá cha A, nên T1 \u003cstrong>không nhả A\u003c/strong> được cho tới khi có B ⇒ T3 phải chờ cả thời gian T1 chờ T2.\u003c/li>\u003cli>\u003cstrong>Cây mới\u003c/strong>: T1 khoá D (cần giữ A, đang có), rồi \u003cstrong>nhả A\u003c/strong> ngay; T1 chờ B trong khi chỉ giữ D. T3 lấy được A và chạy tiếp song song.\u003c/li>\u003c/ul>\n\u003cp>Nút giả cho phép nhả khoá trên nút thật sớm hơn: transaction giữ nút giả \"đại diện\" cho cạnh đang đi xuống thay vì giữ nút cha. Ý tưởng này tổng quát thành khoá trên \u003cstrong>cạnh\u003c/strong> (edge locks — Buckley & Silberschatz, 1984).\u003c/p>"},{"q":"\u003cstrong>PE 18.5.\u003c/strong> Ví dụ schedule hợp lệ theo tree protocol mà không theo 2PL, và ngược lại.","en":"\u003cp>\u003cstrong>Exercise 18.5.\u003c/strong> Show with examples that some schedules are possible under the tree protocol but not under two-phase locking, and vice versa.\u003c/p>","answer":"\u003cp>Cây: A là cha của B, B là cha của C (A → B → C).\u003c/p>\n\u003cp>\u003cstrong>Hợp lệ theo tree protocol, không theo 2PL\u003c/strong> (T1 nhả A rồi mới khoá C — vi phạm 2PL):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T1\u003c/th>\u003cth>T2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>lock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lock(B)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unlock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lock(C)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unlock(B)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>unlock(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>unlock(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unlock(C)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Hợp lệ theo 2PL, không theo tree protocol\u003c/strong> (T1 khoá A và C mà không giữ B — C chỉ được khoá khi giữ cha B):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T1\u003c/th>\u003cth>T2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>lock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>lock(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lock(C)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>unlock(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unlock(A)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unlock(C)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"q":"\u003cstrong>PE 18.6.\u003c/strong> Dùng cơ chế bảo vệ trang của hệ điều hành (mprotect) để cài khoá mức trang cho persistent programming language.","en":"\u003cp>\u003cstrong>Exercise 18.6.\u003c/strong> In persistent programming languages locking is not explicit; instead, objects (or the pages holding them) must be locked when they are accessed. Most modern operating systems let a user set access protections (no access, read, write) on pages, and a memory access that violates the protection raises a protection violation (see, e.g., the Unix \u003ccode>mprotect\u003c/code> command). Describe how this access-protection mechanism can be used to implement page-level locking in a persistent programming language.\u003c/p>","answer":"\u003cul>\u003cli>Ban đầu dùng \u003ccode>mprotect\u003c/code> \u003cstrong>tắt quyền đọc và ghi\u003c/strong> trên mọi trang của CSDL trong không gian địa chỉ tiến trình.\u003c/li>\u003cli>Khi chương trình truy cập một đối tượng trên trang chưa có quyền, phần cứng sinh \u003cstrong>protection violation\u003c/strong>; handler của hệ thống:\u003c/li>\u003cli>truy cập đọc: xin \u003cstrong>S-lock\u003c/strong> trên trang từ lock manager (có thể chờ); khi được cấp, gọi \u003ccode>mprotect\u003c/code> bật \u003cstrong>quyền đọc\u003c/strong> cho trang, rồi cho lệnh chạy lại;\u003c/li>\u003cli>truy cập ghi: xin \u003cstrong>X-lock\u003c/strong> (hoặc nâng S → X), bật \u003cstrong>quyền đọc + ghi\u003c/strong>, chạy lại lệnh (có thể ghi log/bản cũ của trang lúc này).\u003c/li>\u003cli>Các lần truy cập sau trên trang đó không gây lỗi nữa ⇒ không tốn chi phí kiểm tra mỗi lần truy cập.\u003c/li>\u003cli>Khi commit/abort: nhả khoá và gọi \u003ccode>mprotect\u003c/code> thu hồi quyền trên các trang (theo strict 2PL).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.7.\u003c/strong> Khoá chế độ increment (I): (a) 2PL vẫn đảm bảo serializability; (b) tăng concurrency.","en":"\u003cp>\u003cstrong>Exercise 18.7.\u003c/strong> A database system offers an atomic \u003cem>increment\u003c/em> operation besides read and write. If V is the value of data item X, then\u003c/p>\n\u003cp>increment(X) by C\u003c/p>\n\u003cp>sets X to V + C in a single atomic step. The transaction does not learn the value of X unless it also executes read(X).\u003c/p>\n\u003cp>Increment operations lock the item in \u003cem>increment mode\u003c/em>, using the compatibility matrix of Figure 18.25.\u003c/p>\n\u003cp>a. Show that if every transaction locks the data it accesses in the matching mode, two-phase locking guarantees serializability.\u003c/p>\n\u003cp>b. Show that adding increment-mode locks allows more concurrency.\u003c/p>\n\u003cp>\u003cem>Figure 18.25 — Lock-compatibility matrix with increment mode\u003c/em> (true = compatible):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>S\u003c/th>\u003cth>X\u003c/th>\u003cth>I\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S\u003c/td>\u003ctd>true\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003ctd>true\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answer":"\u003cp>Ma trận (Figure 18.25): S–S và I–I tương thích, mọi cặp khác không.\u003c/p>\n\u003cp>a. Xem increment là một loại thao tác mới. Hai \u003cstrong>increment\u003c/strong> trên cùng item \u003cstrong>giao hoán\u003c/strong>: (V + C1) + C2 = (V + C2) + C1, và transaction không đọc giá trị nếu không read — nên chúng \u003cstrong>không xung đột\u003c/strong>, giống hai read. Increment xung đột với read (giá trị đọc phụ thuộc thứ tự) và write — đúng như ma trận: I không tương thích với S và X. Như vậy mọi cặp thao tác xung đột đều có chế độ khoá không tương thích, và lập luận lock point của PE 18.1 áp dụng y nguyên: thao tác xung đột được sắp theo thứ tự lock point ⇒ serializable.\u003c/p>\n\u003cp>b. Không có chế độ I, mỗi transaction muốn tăng giá trị phải đọc rồi ghi, tức cần \u003cstrong>X-lock\u003c/strong> — các transaction tăng cùng một bộ đếm (vd tổng tiền, số ghế đã bán) phải xếp hàng tuần tự. Với I-lock \u003cstrong>tương thích với chính nó\u003c/strong>, nhiều transaction giữ I-lock đồng thời và cùng tăng, giảm thời gian chờ khoá. Tổng quát: thêm ô \"true\" vào ma trận tương thích làm tăng concurrency và throughput. (Korth, \u003cem>Locking Primitives in a Database System\u003c/em>, JACM 1983.)\u003c/p>"},{"q":"\u003cstrong>PE 18.8.\u003c/strong> W-timestamp(Q) là \"TS lớn nhất đã ghi Q\" hay \"TS của transaction gần nhất đã ghi Q\": có khác gì không?","en":"\u003cp>\u003cstrong>Exercise 18.8.\u003c/strong> In timestamp ordering, W-timestamp(Q) is the largest timestamp of any transaction that successfully executed write(Q). Suppose we instead defined it as the timestamp of the most recent transaction that successfully executed write(Q). Would this change in wording make a difference? Explain.\u003c/p>","answer":"\u003cp>\u003cstrong>Không khác.\u003c/strong> Theo quy tắc write của timestamp ordering, write(Q) của T\u003csub>i\u003c/sub> chỉ thành công khi TS(T\u003csub>i\u003c/sub>) ≥ W-timestamp(Q) (và ≥ R-timestamp(Q)); ngược lại T\u003csub>i\u003c/sub> bị rollback. Vì vậy dãy timestamp của các lần ghi Q thành công là \u003cstrong>không giảm\u003c/strong> theo thời gian: transaction ghi Q gần đây nhất cũng là transaction có timestamp lớn nhất trong số những người đã ghi Q. (Với Thomas' write rule, lệnh ghi lỗi thời bị \u003cstrong>bỏ qua\u003c/strong> chứ không được thực hiện, nên kết luận vẫn đúng.)\u003c/p>"},{"q":"\u003cstrong>PE 18.9.\u003c/strong> Multiple granularity cần nhiều khoá hơn / ít khoá hơn khi nào? So sánh concurrency.","en":"\u003cp>\u003cstrong>Exercise 18.9.\u003c/strong> Multiple-granularity locking may need more locks, or fewer locks, than an equivalent system with a single lock granularity. Give an example of each situation, and compare how much concurrency each allows.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Ít khoá hơn\u003c/strong>: transaction quét/cập nhật cả relation (hàng triệu tuple). Hệ một độ mịn (mức tuple) phải xin hàng triệu khoá; multiple granularity chỉ cần IX/IS trên database và S/X trên relation — vài khoá.\u003c/li>\u003cli>\u003cstrong>Nhiều khoá hơn\u003c/strong>: transaction chỉ truy cập \u003cstrong>một\u003c/strong> tuple. Hệ một độ mịn chỉ cần 1 khoá; multiple granularity phải xin intention lock trên mọi tổ tiên (database IS, area IS, file IS) rồi S trên tuple — 4 khoá.\u003c/li>\u003cli>\u003cstrong>Concurrency\u003c/strong>: khoá thô (cả relation) có overhead thấp nhưng chặn mọi transaction khác cần relation đó ⇒ concurrency thấp. Khoá mịn cho concurrency cao (transaction khác vẫn truy cập tuple khác) nhưng tốn khoá. Multiple granularity cho mỗi transaction chọn độ mịn phù hợp; intention lock giúp phát hiện xung đột giữa khoá thô và khoá mịn mà không phải duyệt hết các nút con.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.10.\u003c/strong> Khi nào nên / không nên dùng: 2PL, 2PL + multiple granularity, tree protocol, timestamp ordering, validation, multiversion TO, multiversion 2PL?","en":"\u003cp>\u003cstrong>Exercise 18.10.\u003c/strong> For each protocol below, describe properties of practical applications that would make you recommend the protocol, and properties that would make you advise against it:\u003c/p>\n\u003cul>\u003cli>Two-phase locking\u003c/li>\u003cli>Two-phase locking with multiple-granularity locking\u003c/li>\u003cli>The tree protocol\u003c/li>\u003cli>Timestamp ordering\u003c/li>\u003cli>Validation\u003c/li>\u003cli>Multiversion timestamp ordering\u003c/li>\u003cli>Multiversion two-phase locking\u003c/li>\u003c/ul>","answer":"\u003cul>\u003cli>\u003cstrong>2PL\u003c/strong>: nên cho ứng dụng đơn giản, một độ mịn khoá là đủ, xung đột vừa phải. Không nên nếu có transaction \u003cstrong>read-only dài\u003c/strong> (chặn/ bị chặn — multiversion tốt hơn) hoặc nếu phải tránh deadlock bằng mọi giá.\u003c/li>\u003cli>\u003cstrong>2PL + multiple granularity\u003c/strong>: nên khi trộn lẫn transaction truy cập từng record và transaction truy cập cả relation (hoặc phần lớn). Nhược điểm như 2PL (deadlock), thêm overhead intention lock cho transaction nhỏ.\u003c/li>\u003cli>\u003cstrong>Tree protocol\u003c/strong>: nên khi các ứng dụng truy cập dữ liệu theo một thứ tự bộ phận cố định (cấu trúc cây, index); \u003cstrong>không deadlock\u003c/strong>, nhả khoá sớm. Không nên khi phải khoá nhiều nút không cần thiết (truy cập hai lá xa nhau phải khoá cả đường đi), cần recoverability mà không muốn thêm điều kiện.\u003c/li>\u003cli>\u003cstrong>Timestamp ordering\u003c/strong>: nên khi cần kết quả tương đương một thứ tự serial \u003cstrong>cụ thể\u003c/strong> (vd thứ tự đến); không deadlock. Không nên khi xung đột cao (rollback thay vì chờ, tốn công), cần recoverable (phải thêm overhead), có transaction read-only dài (starvation).\u003c/li>\u003cli>\u003cstrong>Validation\u003c/strong>: nên khi xác suất xung đột \u003cstrong>thấp\u003c/strong> — overhead thấp, concurrency và thời gian đáp ứng tốt. Không nên khi tranh chấp cao: nhiều công việc bị huỷ ở pha validation.\u003c/li>\u003cli>\u003cstrong>Multiversion TO\u003c/strong>: nên khi TO phù hợp và muốn \u003cstrong>đọc không bao giờ chờ\u003c/strong>; chịu chung nhược điểm của TO (rollback, không recoverable sẵn) và tốn bộ nhớ cho phiên bản.\u003c/li>\u003cli>\u003cstrong>Multiversion 2PL\u003c/strong>: nên khi có nhiều transaction \u003cstrong>read-only\u003c/strong> — chúng luôn commit, không chờ, không tham gia deadlock; transaction cập nhật theo rigorous 2PL nên recoverable, xung đột giải quyết bằng chờ. Không nên khi ít xung đột và ít read-only: overhead lưu phiên bản không đáng, plain 2PL tốt hơn; deadlock vẫn có giữa transaction cập nhật.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.11.\u003c/strong> Chạy transaction một lượt không khoá, không ghi, rồi chạy lại bằng strict 2PL — vì sao có thể nhanh hơn chỉ dùng strict 2PL?","en":"\u003cp>\u003cstrong>Exercise 18.11.\u003c/strong> Consider this way of running a transaction: first run it without acquiring any locks and without writing anything to the database (as in validation-based techniques), but — unlike validation — perform neither validation nor writes. Then run the transaction again under strict two-phase locking. Explain why this can perform better than simply using strict two-phase locking. (Hint: think about waits for disk I/O.)\u003c/p>","answer":"\u003cp>Transaction chờ hai thứ: \u003cstrong>disk I/O\u003c/strong> (chủ yếu là đọc — ghi được buffer xử lý bất đồng bộ) và \u003cstrong>chờ khoá\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>Lượt 1 (không khoá, không ghi) gần như gánh \u003cstrong>toàn bộ thời gian chờ đọc đĩa\u003c/strong>: mọi khối cần đọc được nạp vào buffer.\u003c/li>\u003cli>Lượt 2 (strict 2PL) chạy lại khi dữ liệu đã nằm trong bộ nhớ ⇒ gần như không có I/O khi \u003cstrong>đang giữ khoá\u003c/strong>, nên khoá được giữ trong thời gian ngắn hơn nhiều ⇒ ít chờ khoá, concurrency cao hơn.\u003c/li>\u003cli>Đĩa cũng được tận dụng tốt hơn: ở strict 2PL thuần, transaction có thể chờ khoá trong khi đĩa rảnh dù nó còn khối cần đọc; với kỹ thuật này, việc đọc không bị khoá chặn.\u003c/li>\u003cli>Có ích nhất khi transaction ít tính toán, phần lớn thời gian là I/O và chờ khoá (CSDL trên đĩa). Nếu transaction nặng tính toán thì lượt 1 là công phí; tối ưu: lưu kết quả lượt 1, ở lượt 2 khi khoá được item thì so sánh giá trị với giá trị đã dùng — nếu giống hết thì áp các cập nhật đã buffer thay vì chạy lại.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.12.\u003c/strong> Timestamp ordering: schedule mà write thất bại khiến transaction ghi restart và kéo theo cascading abort của transaction đọc; vì sao có thể starvation (livelock)?","en":"\u003cp>\u003cstrong>Exercise 18.12.\u003c/strong> Under the timestamp-ordering protocol, take two transactions: one writes data items p and q, the other reads the same two items. Give a schedule in which the timestamp test for a write fails and forces the first transaction to restart, which in turn causes a cascading abort of the other transaction. Show how this can lead to starvation of both transactions. (A situation in which two or more processes keep acting but never finish because of their interaction with each other is called a \u003cem>livelock\u003c/em>.)\u003c/p>","answer":"\u003cp>T1 ghi p và q, T2 đọc p và q, TS(T1) \u003c TS(T2):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T1\u003c/th>\u003cth>T2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>write(p)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>read(p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>read(q)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>write(q)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>write(p): thành công, W-ts(p) = TS(T1). read(p), read(q) của T2: thành công, R-ts(q) = TS(T2).\u003c/li>\u003cli>write(q) của T1: TS(T1) \u003c R-timestamp(q) = TS(T2) ⇒ \u003cstrong>thất bại, T1 rollback\u003c/strong>.\u003c/li>\u003cli>T2 đã đọc p do T1 ghi ⇒ \u003cstrong>cascading abort\u003c/strong> T2.\u003c/li>\u003cli>Cả hai restart (với timestamp mới, T1 vẫn nhỏ hơn T2 nếu restart theo cùng thứ tự). Nếu kịch bản xen kẽ lặp lại y hệt mỗi lần, không transaction nào hoàn thành ⇒ \u003cstrong>starvation của cả hai — livelock\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Bài CH18.10 mô phỏng đúng schedule này (bảng \u003ccode>tx_to_ops\u003c/code>) bằng recursive CTE.\u003c/p>"},{"q":"\u003cstrong>PE 18.13.\u003c/strong> Thiết kế giao thức dựa trên timestamp tránh phantom.","en":"\u003cp>\u003cstrong>Exercise 18.13.\u003c/strong> Design a timestamp-based protocol that avoids the phantom phenomenon.\u003c/p>","answer":"\u003cul>\u003cli>Cách thô: coi cả relation (hoặc một \"data item\" đại diện thông tin về tập tuple của relation) là một item có R-/W-timestamp: đọc theo vị từ ⇒ read item đó; insert/delete ⇒ write item đó. Đúng nhưng concurrency thấp.\u003c/li>\u003cli>Cách tinh (phỏng theo index locking): coi mỗi \u003cstrong>bucket/leaf node của B\u003csup>+\u003c/sup>-tree index\u003c/strong> là một data item có R-timestamp và W-timestamp, và \u003cstrong>bắt buộc mọi truy cập đọc theo khoảng phải đi qua index\u003c/strong>. Transaction T\u003csub>i\u003c/sub> đọc mọi tuple có key trong khoảng [l, h] thì phải \"read\" mọi leaf chứa khoảng đó (cập nhật R-ts). Mọi insert/delete tuple có key trong khoảng phải sửa một trong các leaf đó ⇒ là một \"write\" lên leaf, chịu kiểm tra timestamp ordering thông thường. Như vậy xung đột logic trên vị từ được chuyển thành xung đột trên index bucket, và phantom bị phát hiện (transaction vi phạm thứ tự bị rollback).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 18.14.\u003c/strong> Tree protocol trên B\u003csup>+\u003c/sup>-tree: khi chèn, lúc nào có thể nhả khoá sớm?","en":"\u003cp>\u003cstrong>Exercise 18.14.\u003c/strong> Suppose the tree protocol of Section 18.1.5 is used to control concurrent access to a B\u003csup>+\u003c/sup>-tree. Because an insert may cause a split that propagates up to the root, it seems an insert can release no lock until the whole operation is done. Under what circumstances can a lock be released earlier?\u003c/p>","answer":"\u003cp>Đi từ gốc xuống: nếu \u003cstrong>nút con sắp đi xuống không đầy\u003c/strong> thì một lần split ở dưới cũng sẽ dừng tại nút con đó, không lan lên trên ⇒ có thể \u003cstrong>nhả khoá mọi tổ tiên\u003c/strong> (trừ nút hiện tại), xin X-lock nút con, rồi nhả nút hiện tại và đi xuống. Nếu nút con \u003cstrong>đầy\u003c/strong>, giữ mọi khoá đang có (vì split có thể lan lên), xin X-lock nút con và đi xuống. Tới lá thì chèn. Kết quả: chỉ giữ khoá trên chuỗi nút \u003cstrong>đầy\u003c/strong> tính từ lá lên tới (và gồm) nút không đầy đầu tiên.\u003c/p>\n\u003cp>Tối ưu: dù nút con đầy, vẫn nhả khoá mọi nút trừ nút hiện tại; sau khi có X-lock nút con thì \u003cstrong>split nút con ngay\u003c/strong> (cha hiện tại còn chỗ vì đã đảm bảo trước đó), nhả cha, giữ đúng nửa cần đi xuống ⇒ mọi lúc chỉ giữ \u003cstrong>tối đa hai khoá\u003c/strong> (cha và con). (Đây là tree protocol Section 18.1.5, khác multiple granularity và B\u003csup>+\u003c/sup>-tree protocol riêng ở Section 18.10.2.)\u003c/p>"},{"q":"\u003cstrong>PE 18.15.\u003c/strong> Validation của snapshot isolation: (a) first-committer-wins bằng timestamp + update set; (b) bằng W-timestamp trên item; (c) first-updater-wins.","en":"\u003cp>\u003cstrong>Exercise 18.15.\u003c/strong> Snapshot isolation includes a validation step which, before transaction T writes a data item, checks whether a transaction concurrent with T has already written that item.\u003c/p>\n\u003cp>a. A simple implementation gives every transaction a start timestamp and a commit timestamp, plus an \u003cem>update set\u003c/em> (the set of data items it updated). Explain how to validate under the first-committer-wins scheme using the transaction timestamps and the update sets. You may assume validation and the other commit-processing steps run serially, one transaction at a time.\u003c/p>\n\u003cp>b. Now, instead of update sets, every data item carries a write timestamp. Explain how validation can be done as part of commit processing for first-committer-wins with this variant. Again assume validation and other commit steps run serially.\u003c/p>\n\u003cp>c. The first-updater-wins scheme can be implemented with timestamps as above, except that validation happens right after an exclusive lock is acquired rather than at commit time.\u003c/p>\n\u003col>\u003cli>Explain how write timestamps should be assigned to data items to implement first-updater-wins.\u003c/li>\u003cli>Show that, because of locking, repeating the validation at commit time would give the same result.\u003c/li>\u003cli>Explain why, in this case, validation and the other commit steps need not run serially.\u003c/li>\u003c/ol>","answer":"\u003cp>a. Mỗi T\u003csub>i\u003c/sub> có StartTS(T\u003csub>i\u003c/sub>), CommitTS(T\u003csub>i\u003c/sub>) và update_set(T\u003csub>i\u003c/sub>). Khi T\u003csub>i\u003c/sub> commit (validation chạy tuần tự), với mọi T\u003csub>k\u003c/sub> \u003cstrong>đã commit\u003c/strong> có CommitTS(T\u003csub>k\u003c/sub>) \u003c CommitTS(T\u003csub>i\u003c/sub>), phải có một trong hai:\u003c/p>\n\u003cul>\u003cli>CommitTS(T\u003csub>k\u003c/sub>) \u003c StartTS(T\u003csub>i\u003c/sub>) — T\u003csub>k\u003c/sub> xong trước khi T\u003csub>i\u003c/sub> bắt đầu, không đồng thời; hoặc\u003c/li>\u003cli>StartTS(T\u003csub>i\u003c/sub>) \u003c CommitTS(T\u003csub>k\u003c/sub>) \u003c CommitTS(T\u003csub>i\u003c/sub>) và update_set(T\u003csub>i\u003c/sub>) ∩ update_set(T\u003csub>k\u003c/sub>) = ∅.\u003c/li>\u003c/ul>\n\u003cp>Nếu không, T\u003csub>i\u003c/sub> abort. Chú ý chỉ so với transaction \u003cstrong>đã commit thành công\u003c/strong> — transaction bị abort không được tính (bài CH18.12 cho thấy T3 commit được vì T2 đã abort).\u003c/p>\n\u003cp>b. Mỗi item Q có W-timestamp(Q) = CommitTS của transaction cuối cùng đã commit một ghi lên Q. Khi T\u003csub>i\u003c/sub> commit: với mọi Q T\u003csub>i\u003c/sub> ghi, phải có \u003cstrong>W-timestamp(Q) \u003c StartTS(T\u003csub>i\u003c/sub>)\u003c/strong>; nếu đúng thì commit và đặt W-timestamp(Q) := CommitTS(T\u003csub>i\u003c/sub>) cho mọi Q đã ghi; ngược lại abort.\u003c/p>\n\u003cp>c. First-updater-wins:\u003c/p>\n\u003col>\u003cli>Khi T\u003csub>i\u003c/sub> xin được X-lock trên Q thì kiểm tra W-timestamp(Q) \u003c StartTS(T\u003csub>i\u003c/sub>) (nếu sai thì abort ngay); W-timestamp(Q) được gán khi ghi — bằng timestamp lúc T\u003csub>i\u003c/sub> commit (hoặc thời điểm ghi, miễn là lớn hơn StartTS của mọi transaction đồng thời).\u003c/li>\u003cli>Validation thực hiện \u003cstrong>sau khi có X-lock\u003c/strong>, và X-lock giữ tới cuối transaction ⇒ không transaction nào khác ghi được Q từ lúc validation tới lúc commit, nên W-timestamp(Q) không đổi; validation lặp lại khi commit cho cùng kết quả.\u003c/li>\u003cli>Nhờ X-lock, tại mỗi thời điểm chỉ một transaction có thể validate/ghi trên một item ⇒ hai transaction không thể cùng validate trên cùng item, nên không cần tuần tự hoá toàn bộ pha validation + commit.\u003c/li>\u003c/ol>"},{"q":"\u003cstrong>PE 18.16.\u003c/strong> Hàm latch-free insert/delete (Figure 18.23): (a) vấn đề ABA; (b) dùng DCAS với bộ đếm; (c) dùng 16 bit cao của con trỏ.","en":"\u003cp>\u003cstrong>Exercise 18.16.\u003c/strong> Consider the functions insert_latchfree() and delete_latchfree() of Figure 18.23.\u003c/p>\n\u003cp>a. Explain how the ABA problem can arise if a deleted node is inserted again.\u003c/p>\n\u003cp>b. Suppose a counter cnt is stored next to head, and DCAS((head, cnt), (oldhead, oldcnt), (newhead, newcnt)) performs an atomic compare-and-swap on the 128-bit pair (head, cnt). Rewrite insert_latchfree() and delete_latchfree() to use DCAS so that the ABA problem is avoided.\u003c/p>\n\u003cp>c. Most processors use only 48 of the 64 bits of an address to actually address memory. Explain how the remaining 16 bits can implement a counter when DCAS is not available.\u003c/p>\n\u003cp>\u003cem>Figure 18.23 — Latch-free insert and delete on a linked list (CAS = atomic compare-and-swap):\u003c/em>\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>insert_latchfree(head, value) {\n  node = new node\n  node-&gt;value = value\n  repeat\n    oldhead = head\n    node-&gt;next = oldhead\n    result = CAS(head, oldhead, node)\n  until (result == success)\n}\n\ndelete_latchfree(head) {\n  /* not quite safe; see the exercise */\n  repeat\n    oldhead = head\n    newhead = oldhead-&gt;next\n    result = CAS(head, oldhead, newhead)\n  until (result == success)\n}\u003c/code>\u003c/pre>","answer":"\u003cp>a. Danh sách: head → n1 → n2 → n3. P1 chạy delete: đọc oldhead = n1, newhead = n2, nhưng \u003cstrong>chưa\u003c/strong> kịp CAS. P2 xoá n1, xoá n2, rồi \u003cstrong>chèn lại n1\u003c/strong> ở đầu (head → n1 → n3). P1 chạy CAS(head, n1, n2): head vẫn là n1 nên CAS \u003cstrong>thành công\u003c/strong> và đặt head = n2 — nhưng n2 đã bị xoá (rác) ⇒ danh sách hỏng. Giá trị A → B → A nên CAS không nhận ra thay đổi.\u003c/p>\n\u003cp>b. Lưu bộ đếm cnt cạnh head; mỗi lần sửa head thì tăng cnt; dùng DCAS trên cặp 128 bit:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"\">\u003ccode>atomic_read(head, cnt) {\n  repeat\n    oldhead = head; oldcnt = cnt\n
