  result = DCAS((head, cnt), (oldhead, oldcnt), (oldhead, oldcnt))\n  until (result == success)\n  return (oldhead, oldcnt)\n}\ninsert_latchfree(head, value) {\n  node = new node; node-&gt;value = value\n  repeat\n    (oldhead, oldcnt) = atomic_read(head, cnt)\n    node-&gt;next = oldhead\n    result = DCAS((head, cnt), (oldhead, oldcnt), (node, oldcnt + 1))\n  until (result == success)\n}\ndelete_latchfree(head) {\n  repeat\n    (oldhead, oldcnt) = atomic_read(head, cnt)\n    newhead = oldhead-&gt;next\n    result = DCAS((head, cnt), (oldhead, oldcnt), (newhead, oldcnt + 1))\n  until (result == success)\n}\u003c/code>\u003c/pre>\n\u003cp>atomic_read đảm bảo đọc cặp (head, cnt) nhất quán. Trong kịch bản ABA, head lại là n1 nhưng cnt đã tăng ⇒ DCAS của P1 thất bại, P1 đọc lại.\u003c/p>\n\u003cp>c. CPU chỉ dùng 48 bit thấp của địa chỉ 64 bit (256 TB). Dùng \u003cstrong>16 bit cao làm bộ đếm\u003c/strong>: tách con trỏ và bộ đếm bằng phép AND với mặt nạ, ghép lại bằng AND/OR, rồi dùng \u003cstrong>CAS 64 bit\u003c/strong> thông thường trên cả giá trị. Vẫn có rủi ro nhỏ: bộ đếm quay vòng nếu có đúng 65 536 thao tác chen giữa lúc đọc head và lúc CAS.\u003c/p>"}],"exercises":[{"id":"CH18.01","topic":"lock compatibility","level":2,"prompt":"\u003cp>\u003ccode>tx_lock_req(req_id, item, txn, mode, status)\u003c/code> là bảng khoá của lock manager (mode S, X hoặc I); \u003ccode>tx_lock_compat(held, requested, ok)\u003c/code> là ma trận Figure 18.25. Với mỗi yêu cầu \u003cstrong>waiting\u003c/strong>, cho biết có cấp được ngay không (tương thích với mọi khoá \u003cstrong>held\u003c/strong> của transaction \u003cstrong>khác\u003c/strong> trên cùng item; bỏ qua thứ tự hàng đợi): \u003ccode>req_id, txn, item, mode, grantable\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.7.\u003c/strong> A database system offers an atomic \u003cem>increment\u003c/em> operation besides read and write. If V is the value of data item X, then\u003c/p>\n\u003cp>increment(X) by C\u003c/p>\n\u003cp>sets X to V + C in a single atomic step. The transaction does not learn the value of X unless it also executes read(X).\u003c/p>\n\u003cp>Increment operations lock the item in \u003cem>increment mode\u003c/em>, using the compatibility matrix of Figure 18.25.\u003c/p>\n\u003cp>a. Show that if every transaction locks the data it accesses in the matching mode, two-phase locking guarantees serializability.\u003c/p>\n\u003cp>b. Show that adding increment-mode locks allows more concurrency.\u003c/p>\n\u003cp>\u003cem>Figure 18.25 — Lock-compatibility matrix with increment mode\u003c/em> (true = compatible):\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>S\u003c/th>\u003cth>X\u003c/th>\u003cth>I\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S\u003c/td>\u003ctd>true\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I\u003c/td>\u003ctd>false\u003c/td>\u003ctd>false\u003c/td>\u003ctd>true\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","hint":"","solution":"select w.req_id, w.txn, w.item, w.mode,\n       not exists (select 1\n                   from tx_lock_req h\n                        join tx_lock_compat c on c.held = h.mode and c.requested = w.mode\n                   where h.item = w.item and h.status = 'held' and h.txn \u003c> w.txn and not c.ok) as grantable\nfrom tx_lock_req w\nwhere w.status = 'waiting';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["req_id","txn","item","mode","grantable"],"rows":[["3","T3","A","X","false"],["5","T2","B","I","true"],["6","T3","B","S","false"],["8","T4","C","S","true"],["9","T5","D","S","true"],["10","T4","A","S","true"]]}},{"id":"CH18.02","topic":"two-phase check","level":2,"prompt":"\u003cp>\u003ccode>tx_lock_sched(sched_id, step, txn, action, item)\u003c/code> lưu schedule có lệnh khoá (action: lock-S, lock-X, unlock, read, write, commit). Với mỗi (sched_id, txn), cho biết transaction có tuân theo \u003cstrong>2PL\u003c/strong> không (không xin khoá nào sau lần unlock đầu tiên): \u003ccode>sched_id, txn, two_phase\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select sched_id, txn,\n       coalesce(max(step) filter (where action like 'lock%')\n                \u003c min(step) filter (where action = 'unlock'), true) as two_phase\nfrom tx_lock_sched\ngroup by sched_id, txn;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","txn","two_phase"],"rows":[["L3","T2","true"],["L3","T1","false"],["L1","T2","true"],["L2","T1","true"],["L2","T2","true"],["L1","T1","true"]]}},{"id":"CH18.03","topic":"lock point","level":2,"prompt":"\u003cp>Với schedule \u003ccode>L1\u003c/code>, tính \u003cstrong>lock point\u003c/strong> (step của lệnh khoá cuối cùng) của mỗi transaction và trả về \u003ccode>txn, lock_point\u003c/code> \u003cstrong>sắp theo lock_point\u003c/strong> — đây là thứ tự serial tương đương theo PE 18.1.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.1.\u003c/strong> Show that the two-phase locking protocol guarantees conflict serializability, and that transactions can be serialized in the order of their lock points.\u003c/p>","hint":"","solution":"select txn, max(step) as lock_point\nfrom tx_lock_sched\nwhere sched_id = 'L1' and action like 'lock%'\ngroup by txn\norder by lock_point;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","lock_point"],"rows":[["T1","6"],["T2","11"]]}},{"id":"CH18.04","topic":"strict / rigorous 2PL","level":3,"prompt":"\u003cp>Với mỗi (sched_id, txn) trong \u003ccode>tx_lock_sched\u003c/code>, trả về \u003ccode>sched_id, txn, strict, rigorous\u003c/code>: \u003cstrong>strict\u003c/strong> — mọi unlock của item đã khoá X đều sau commit; \u003cstrong>rigorous\u003c/strong> — mọi unlock đều sau commit (transaction không unlock thì coi là đúng).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.3.\u003c/strong> What advantage does rigorous two-phase locking offer? How does it compare with the other variants of two-phase locking?\u003c/p>","hint":"","solution":"select s.sched_id, s.txn,\n       not exists (\n         select 1\n         from tx_lock_sched u\n              join tx_lock_sched l on l.sched_id = u.sched_id and l.txn = u.txn and l.item = u.item\n                                  and l.action = 'lock-X' and l.step \u003c u.step\n         where u.sched_id = s.sched_id and u.txn = s.txn and u.action = 'unlock'\n           and u.step \u003c (select c.step from tx_lock_sched c\n                         where c.sched_id = s.sched_id and c.txn = s.txn and c.action = 'commit')) as strict,\n       coalesce(min(s.step) filter (where s.action = 'unlock')\n                > max(s.step) filter (where s.action = 'commit'), true) as rigorous\nfrom tx_lock_sched s\ngroup by s.sched_id, s.txn;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["sched_id","txn","strict","rigorous"],"rows":[["L3","T2","false","false"],["L3","T1","false","false"],["L1","T2","true","true"],["L2","T1","false","false"],["L2","T2","true","false"],["L1","T1","true","true"]]}},{"id":"CH18.05","topic":"deadlock detection","level":3,"prompt":"\u003cp>\u003ccode>tx_waits(graph, waiter, holder)\u003c/code> lưu các \u003cstrong>wait-for graph\u003c/strong>. Trả về các transaction đang bị \u003cstrong>deadlock\u003c/strong> (nằm trên một chu trình): \u003ccode>graph, txn\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with recursive r (graph, src, dst) as (\n  select graph, waiter, holder from tx_waits\n  union\n  select r.graph, r.src, w.holder\n  from r join tx_waits w on w.graph = r.graph and w.waiter = r.dst\n)\nselect graph, src as txn from r where src = dst;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["graph","txn"],"rows":[["W2","T6"],["W2","T5"],["W2","T2"],["W2","T3"],["W2","T1"]]}},{"id":"CH18.06","topic":"deadlock victim","level":3,"prompt":"\u003cp>Trong mỗi wait-for graph, mỗi chu trình (thành phần liên thông mạnh có chu trình) chọn \u003cstrong>victim\u003c/strong> là transaction \u003cstrong>trẻ nhất\u003c/strong> (timestamp lớn nhất trong \u003ccode>tx_txn\u003c/code>). Trả về \u003ccode>graph, cycle_id, victim\u003c/code> với cycle_id là tên transaction nhỏ nhất (theo thứ tự chữ) của chu trình.\u003c/p>","en":"","hint":"Hai transaction cùng chu trình ⇔ mỗi bên đến được bên kia.","solution":"with recursive r (graph, src, dst) as (\n  select graph, waiter, holder from tx_waits\n  union\n  select r.graph, r.src, w.holder\n  from r join tx_waits w on w.graph = r.graph and w.waiter = r.dst\n), cyc as (\n  select graph, src as txn from r where src = dst\n), comp as (\n  select c.graph, c.txn,\n         (select min(c2.txn) from cyc c2\n          where c2.graph = c.graph\n            and exists (select 1 from r where r.graph = c.graph and r.src = c.txn and r.dst = c2.txn)\n            and exists (select 1 from r where r.graph = c.graph and r.src = c2.txn and r.dst = c.txn)) as cycle_id\n  from cyc c\n)\nselect distinct on (comp.graph, comp.cycle_id) comp.graph, comp.cycle_id, comp.txn as victim\nfrom comp join tx_txn t on t.txn = comp.txn\norder by comp.graph, comp.cycle_id, t.ts desc;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["graph","cycle_id","victim"],"rows":[["W2","T1","T3"],["W2","T5","T6"]]}},{"id":"CH18.07","topic":"wait-die / wound-wait","level":2,"prompt":"\u003cp>\u003ccode>tx_conflict(req_id, requester, holder)\u003c/code>: requester xin khoá đang bị holder giữ; timestamp ở \u003ccode>tx_txn\u003c/code> (nhỏ = già). Trả về \u003ccode>req_id, wait_die, wound_wait\u003c/code> với giá trị \u003ccode>wait\u003c/code>, \u003ccode>rollback requester\u003c/code> hoặc \u003ccode>rollback holder\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select c.req_id,\n       case when r.ts \u003c h.ts then 'wait' else 'rollback requester' end as wait_die,\n       case when r.ts \u003c h.ts then 'rollback holder' else 'wait' end as wound_wait\nfrom tx_conflict c\n     join tx_txn r on r.txn = c.requester\n     join tx_txn h on h.txn = c.holder;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["req_id","wait_die","wound_wait"],"rows":[["1","wait","rollback holder"],["2","rollback requester","wait"],["3","wait","rollback holder"],["4","rollback requester","wait"],["5","wait","rollback holder"]]}},{"id":"CH18.08","topic":"timestamp ordering","level":2,"prompt":"\u003cp>\u003ccode>tx_to_req(req_id, txn_ts, op, item, r_ts, w_ts)\u003c/code>: mỗi dòng là một yêu cầu độc lập — TS của transaction, thao tác R/W và R-/W-timestamp hiện tại của item. Trả về \u003ccode>req_id, basic_to, thomas\u003c/code>: quyết định của \u003cstrong>timestamp ordering\u003c/strong> cơ bản (\u003ccode>execute\u003c/code>/\u003ccode>rollback\u003c/code>) và khi dùng \u003cstrong>Thomas' write rule\u003c/strong> (\u003ccode>execute\u003c/code>/\u003ccode>rollback\u003c/code>/\u003ccode>ignore\u003c/code>).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.8.\u003c/strong> In timestamp ordering, W-timestamp(Q) is the largest timestamp of any transaction that successfully executed write(Q). Suppose we instead defined it as the timestamp of the most recent transaction that successfully executed write(Q). Would this change in wording make a difference? Explain.\u003c/p>","hint":"","solution":"select req_id,\n       case when op = 'R' then case when txn_ts \u003c w_ts then 'rollback' else 'execute' end\n            when txn_ts \u003c r_ts or txn_ts \u003c w_ts then 'rollback'\n            else 'execute' end as basic_to,\n       case when op = 'R' then case when txn_ts \u003c w_ts then 'rollback' else 'execute' end\n            when txn_ts \u003c r_ts then 'rollback'\n            when txn_ts \u003c w_ts then 'ignore'\n            else 'execute' end as thomas\nfrom tx_to_req;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["req_id","basic_to","thomas"],"rows":[["1","execute","execute"],["2","rollback","rollback"],["3","execute","execute"],["4","rollback","rollback"],["5","rollback","ignore"],["6","execute","execute"],["7","execute","execute"]]}},{"id":"CH18.09","topic":"multiversion read","level":2,"prompt":"\u003cp>Multiversion timestamp ordering: \u003ccode>tx_versions(item, w_ts, value)\u003c/code> là các phiên bản; \u003ccode>tx_mv_reads(req_id, txn_ts, item)\u003c/code> là các yêu cầu đọc. Trả về \u003ccode>req_id, value_read\u003c/code> — giá trị của phiên bản có W-timestamp lớn nhất ≤ TS của transaction.\u003c/p>","en":"","hint":"","solution":"select r.req_id,\n       (select v.value from tx_versions v\n        where v.item = r.item and v.w_ts \u003c= r.txn_ts\n        order by v.w_ts desc limit 1) as value_read\nfrom tx_mv_reads r;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["req_id","value_read"],"rows":[["1","100"],["2","150"],["3","150"],["4","200"],["5","10"],["6","20"]]}},{"id":"CH18.10","topic":"TO simulation","level":3,"prompt":"\u003cp>Mô phỏng \u003cstrong>timestamp ordering\u003c/strong> trên schedule \u003ccode>tx_to_ops(step, txn, ts, op, item)\u003c/code> (kịch bản PE 18.12). Ban đầu mọi R-/W-timestamp bằng 0. Xử lý lần lượt từng step:\u003c/p>\n\u003cul>\u003cli>read: TS \u003c W-ts → \u003ccode>rollback\u003c/code>; ngược lại \u003ccode>execute\u003c/code> và R-ts := max(R-ts, TS);\u003c/li>\u003cli>write: TS \u003c R-ts hoặc TS \u003c W-ts → \u003ccode>rollback\u003c/code>; ngược lại \u003ccode>execute\u003c/code> và W-ts := TS;\u003c/li>\u003cli>transaction đã bị rollback thì các lệnh sau của nó là \u003ccode>skipped\u003c/code> (không restart, không cascading).\u003c/li>\u003c/ul>\n\u003cp>Trả về \u003ccode>step, txn, op, item, outcome\u003c/code> sắp theo step.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.12.\u003c/strong> Under the timestamp-ordering protocol, take two transactions: one writes data items p and q, the other reads the same two items. Give a schedule in which the timestamp test for a write fails and forces the first transaction to restart, which in turn causes a cascading abort of the other transaction. Show how this can lead to starvation of both transactions. (A situation in which two or more processes keep acting but never finish because of their interaction with each other is called a \u003cem>livelock\u003c/em>.)\u003c/p>","hint":"Recursive CTE, mỗi bước mang trạng thái: jsonb R-ts, jsonb W-ts, mảng transaction đã rollback.","solution":"with recursive sim (step, rts, wts, aborted, outcome) as (\n  select 0, '{}'::jsonb, '{}'::jsonb, '{}'::text[], null::text\n  union all\n  select o.step,\n         case when o.txn = any (s.aborted) or o.op = 'W'\n                or o.ts \u003c coalesce((s.wts ->> o.item)::int, 0) then s.rts\n              else s.rts || jsonb_build_object(o.item, greatest(o.ts, coalesce((s.rts ->> o.item)::int, 0))) end,\n         case when o.txn = any (s.aborted) or o.op = 'R'\n                or o.ts \u003c coalesce((s.rts ->> o.item)::int, 0)\n                or o.ts \u003c coalesce((s.wts ->> o.item)::int, 0) then s.wts\n              else s.wts || jsonb_build_object(o.item, o.ts) end,\n         case when o.txn = any (s.aborted) then s.aborted\n              when (o.op = 'R' and o.ts \u003c coalesce((s.wts ->> o.item)::int, 0))\n                or (o.op = 'W' and (o.ts \u003c coalesce((s.rts ->> o.item)::int, 0)\n                                    or o.ts \u003c coalesce((s.wts ->> o.item)::int, 0))) then s.aborted || o.txn::text\n              else s.aborted end,\n         case when o.txn = any (s.aborted) then 'skipped'\n              when (o.op = 'R' and o.ts \u003c coalesce((s.wts ->> o.item)::int, 0))\n                or (o.op = 'W' and (o.ts \u003c coalesce((s.rts ->> o.item)::int, 0)\n                                    or o.ts \u003c coalesce((s.wts ->> o.item)::int, 0))) then 'rollback'\n              else 'execute' end\n  from sim s join tx_to_ops o on o.step = s.step + 1\n)\nselect s.step, o.txn, o.op, o.item, s.outcome\nfrom sim s join tx_to_ops o on o.step = s.step\norder by s.step;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["step","txn","op","item","outcome"],"rows":[["1","T1","W","p","execute"],["2","T2","R","p","execute"],["3","T2","R","q","execute"],["4","T1","W","q","rollback"],["5","T3","W","q","execute"],["6","T2","W","p","execute"],["7","T1","W","p","skipped"]]}},{"id":"CH18.11","topic":"validation","level":3,"prompt":"\u003cp>\u003ccode>tx_val(txn, start_ts, val_ts, finish_ts, read_set, write_set)\u003c/code> (mảng text). Áp dụng \u003cstrong>validation test\u003c/strong> cho từng T\u003csub>j\u003c/sub> so với \u003cstrong>mọi\u003c/strong> T\u003csub>i\u003c/sub> có val_ts nhỏ hơn: FinishTS(T\u003csub>i\u003c/sub>) \u003c StartTS(T\u003csub>j\u003c/sub>), hoặc StartTS(T\u003csub>j\u003c/sub>) \u003c FinishTS(T\u003csub>i\u003c/sub>) \u003c ValidationTS(T\u003csub>j\u003c/sub>) và write_set(T\u003csub>i\u003c/sub>) không giao read_set(T\u003csub>j\u003c/sub>). Trả về \u003ccode>txn, passes\u003c/code>.\u003c/p>","en":"","hint":"Toán tử && kiểm tra hai mảng có phần tử chung.","solution":"select j.txn,\n       not exists (select 1 from tx_val i\n                   where i.val_ts \u003c j.val_ts\n                     and not (i.finish_ts \u003c j.start_ts\n                              or (j.start_ts \u003c i.finish_ts and i.finish_ts \u003c j.val_ts\n                                  and not (i.write_set && j.read_set)))) as passes\nfrom tx_val j;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["txn","passes"],"rows":[["T1","true"],["T2","true"],["T3","false"],["T4","false"],["T5","true"]]}},{"id":"CH18.12","topic":"first-committer-wins","level":3,"prompt":"\u003cp>\u003ccode>tx_si(txn, start_ts, commit_ts, write_set)\u003c/code>: các transaction xin commit theo thứ tự commit_ts. Theo \u003cstrong>first-committer-wins\u003c/strong>, T commit được nếu không transaction nào \u003cstrong>đã commit thành công\u003c/strong> có commit_ts > start_ts(T) và write set giao write set của T; ngược lại T abort (và không được tính cho các transaction sau). Trả về \u003ccode>txn, status\u003c/code> (\u003ccode>commit\u003c/code>/\u003ccode>abort\u003c/code>) sắp theo commit_ts.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.15 (a).\u003c/strong> Snapshot isolation includes a validation step which, before transaction T writes a data item, checks whether a transaction concurrent with T has already written that item.\u003c/p>\n\u003cp>a. A simple implementation gives every transaction a start timestamp and a commit timestamp, plus an \u003cem>update set\u003c/em> (the set of data items it updated). Explain how to validate under the first-committer-wins scheme using the transaction timestamps and the update sets. You may assume validation and the other commit-processing steps run serially, one transaction at a time.\u003c/p>","hint":"Transaction bị abort không tính — cần xử lý tuần tự (recursive CTE mang theo danh sách đã commit).","solution":"with recursive s (n, txn, committed, status) as (\n  select 0, null::varchar, '{}'::text[], null::text\n  union all\n  select s.n + 1, t.txn,\n         case when exists (select 1 from tx_si k\n                           where k.txn = any (s.committed) and k.commit_ts > t.start_ts\n                             and k.write_set && t.write_set)\n              then s.committed else s.committed || t.txn::text end,\n         case when exists (select 1 from tx_si k\n                           where k.txn = any (s.committed) and k.commit_ts > t.start_ts\n                             and k.write_set && t.write_set)\n              then 'abort' else 'commit' end\n  from s join lateral (select * from tx_si order by commit_ts offset s.n limit 1) t on true\n)\nselect txn, status from s where n > 0 order by n;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","status"],"rows":[["T1","commit"],["T2","abort"],["T3","commit"],["T4","commit"],["T5","commit"],["T6","abort"]]}},{"id":"CH18.13","topic":"item W-timestamp","level":3,"prompt":"\u003cp>Theo cách cài đặt ở PE 18.15b, mỗi item giữ W-timestamp = commit_ts của transaction \u003cstrong>cuối cùng đã commit\u003c/strong> một ghi lên nó. Dùng kết quả first-committer-wins trên \u003ccode>tx_si\u003c/code> (như CH18.12), trả về \u003ccode>item, w_timestamp\u003c/code> cho mọi item từng được một transaction đã commit ghi.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.15 (b).\u003c/strong> Snapshot isolation includes a validation step which, before transaction T writes a data item, checks whether a transaction concurrent with T has already written that item.\u003c/p>\n\u003cp>b. Now, instead of update sets, every data item carries a write timestamp. Explain how validation can be done as part of commit processing for first-committer-wins with this variant. Again assume validation and other commit steps run serially.\u003c/p>","hint":"","solution":"with recursive s (n, txn, committed) as (\n  select 0, null::varchar, '{}'::text[]\n  union all\n  select s.n + 1, t.txn,\n         case when exists (select 1 from tx_si k\n                           where k.txn = any (s.committed) and k.commit_ts > t.start_ts\n                             and k.write_set && t.write_set)\n              then s.committed else s.committed || t.txn::text end\n  from s join lateral (select * from tx_si order by commit_ts offset s.n limit 1) t on true\n), final as (\n  select committed from s order by n desc limit 1\n)\nselect item, max(t.commit_ts) as w_timestamp\nfrom tx_si t cross join final f cross join lateral unnest(t.write_set) as item\nwhere t.txn = any (f.committed)\ngroup by item;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["item","w_timestamp"],"rows":[["B","10"],["A","9"],["C","10"]]}},{"id":"CH18.14","topic":"phantom","level":2,"prompt":"\u003cp>\u003ccode>tx_pred(txn, lo, hi)\u003c/code>: mỗi transaction đọc instructor theo vị từ \u003ccode>salary between lo and hi\u003c/code>. \u003ccode>tx_ins(ins_id, txn, salary)\u003c/code>: các lệnh chèn instructor. Liệt kê các lệnh chèn tạo \u003cstrong>phantom\u003c/strong> cho một transaction đọc \u003cstrong>khác\u003c/strong>: \u003ccode>reader, inserter, ins_id, salary\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 18.13.\u003c/strong> Design a timestamp-based protocol that avoids the phantom phenomenon.\u003c/p>","hint":"","solution":"select p.txn as reader, i.txn as inserter, i.ins_id, i.salary\nfrom tx_pred p join tx_ins i on i.salary between p.lo and p.hi and i.txn \u003c> p.txn;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["reader","inserter","ins_id","salary"],"rows":[["T1","T3","1","65000"],["T2","T4","3","95000"],["T2","T5","5","100000"]]}}]},{"key":"ch19","store":"19","short":"19","label":"Chương 19","navLabel":"Chương 19","kind":"Chương","title":"Recovery System","titleVi":"Phục hồi (Recovery System)","summary":"\u003ch3>1. Phân loại lỗi\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Transaction failure\u003c/strong>: lỗi logic (dữ liệu sai, vi phạm ràng buộc) hoặc lỗi hệ thống (deadlock, timestamp test) ⇒ transaction phải rollback.\u003c/li>\u003cli>\u003cstrong>System crash\u003c/strong>: mất điện, lỗi phần mềm/hệ điều hành — mất nội dung \u003cstrong>volatile storage\u003c/strong>, đĩa còn nguyên (\u003cstrong>fail-stop assumption\u003c/strong>).\u003c/li>\u003cli>\u003cstrong>Disk failure\u003c/strong>: hỏng một phần/toàn bộ đĩa ⇒ khôi phục từ bản sao lưu (archival dump) + log.\u003c/li>\u003cli>Recovery algorithm gồm: (1) việc làm \u003cstrong>trong lúc chạy bình thường\u003c/strong> để có đủ thông tin; (2) việc làm \u003cstrong>sau lỗi\u003c/strong> để đưa CSDL về trạng thái đảm bảo atomicity, consistency, durability.\u003c/li>\u003c/ul>\n\u003ch3>2. Storage và truyền dữ liệu\u003c/h3>\n\u003cul>\u003cli>Volatile, non-volatile, \u003cstrong>stable storage\u003c/strong> (nhiều bản sao; ghi khối an toàn: ghi bản 1, xong mới ghi bản 2; khi phục hồi so sánh hai bản).\u003c/li>\u003cli>Khối vật lý trên đĩa, \u003cstrong>buffer block\u003c/strong> trong bộ nhớ: \u003ccode>input(B)\u003c/code>, \u003ccode>output(B)\u003c/code>. Transaction dùng \u003ccode>read(X)\u003c/code>, \u003ccode>write(X)\u003c/code> trên vùng làm việc riêng; output có thể xảy ra bất kỳ lúc nào (buffer manager quyết định).\u003c/li>\u003c/ul>\n\u003ch3>3. Log-based recovery\u003c/h3>\n\u003cul>\u003cli>Log là dãy \u003cstrong>log record\u003c/strong> trên stable storage:\u003c/li>\u003cli>\u003ccode>&lt;T_i start&gt;\u003c/code>, \u003ccode>&lt;T_i, X_j, V_1, V_2&gt;\u003c/code> (ghi X\u003csub>j\u003c/sub>: old value V\u003csub>1\u003c/sub>, new value V\u003csub>2\u003c/sub>), \u003ccode>&lt;T_i commit&gt;\u003c/code>, \u003ccode>&lt;T_i abort&gt;\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Immediate modification\u003c/strong>: cập nhật có thể đến CSDL trước khi commit (cần undo). \u003cstrong>Deferred modification\u003c/strong>: chỉ áp sau commit (không cần undo/old value — PE 19.5).\u003c/li>\u003cli>\u003cstrong>Write-ahead logging (WAL)\u003c/strong>: log record phải lên stable storage \u003cstrong>trước\u003c/strong> khi khối dữ liệu tương ứng được output; \u003ccode>&lt;T commit&gt;\u003c/code> lên stable storage thì T mới được coi là commit.\u003c/li>\u003cli>Thứ tự ghi log và dữ liệu: log record tạo trước khi sửa CSDL.\u003c/li>\u003cli>\u003cstrong>undo(T\u003csub>i\u003c/sub>)\u003c/strong>: khôi phục old value, đi \u003cstrong>ngược\u003c/strong> từ bản ghi cuối của T\u003csub>i\u003c/sub>; mỗi lần khôi phục ghi \u003cstrong>redo-only (compensation) log record\u003c/strong> \u003ccode>&lt;T_i, X_j, V_1&gt;\u003c/code>; xong thì ghi \u003ccode>&lt;T_i abort&gt;\u003c/code>.\u003c/li>\u003cli>\u003cstrong>redo(T\u003csub>i\u003c/sub>)\u003c/strong>: đặt new value, đi \u003cstrong>xuôi\u003c/strong> từ bản ghi đầu tiên. Thứ tự quan trọng (PE 19.1): một item bị sửa nhiều lần thì undo xuôi sẽ cho giá trị sai.\u003c/li>\u003cli>undo/redo phải \u003cstrong>idempotent\u003c/strong> (thực hiện nhiều lần vẫn đúng).\u003c/li>\u003cli>Sau crash: transaction có \u003ccode>&lt;start&gt;\u003c/code> nhưng không có \u003ccode>&lt;commit&gt;\u003c/code> hay \u003ccode>&lt;abort&gt;\u003c/code> → \u003cstrong>undo\u003c/strong>; có \u003ccode>&lt;commit&gt;\u003c/code> hoặc \u003ccode>&lt;abort&gt;\u003c/code> → \u003cstrong>redo\u003c/strong> (với abort, redo cả các CLR — \"repeating history\").\u003c/li>\u003c/ul>\n\u003ch3>4. Checkpoint\u003c/h3>\n\u003cul>\u003cli>Không có checkpoint thì phải duyệt cả log và redo nhiều transaction đã ghi xuống đĩa từ lâu.\u003c/li>\u003cli>\u003cstrong>Checkpoint\u003c/strong>: (1) ghi mọi log record trong bộ nhớ ra stable storage; (2) ghi mọi buffer block đã sửa ra đĩa; (3) ghi \u003ccode>&lt;checkpoint L&gt;\u003c/code> với L là danh sách transaction \u003cstrong>đang active\u003c/strong>. Trong lúc checkpoint không cho cập nhật.\u003c/li>\u003cli>Khi phục hồi chỉ cần xét các transaction trong L và các transaction bắt đầu sau checkpoint. Bản ghi trước checkpoint của transaction không thuộc L có thể xoá (PE 19.3). \u003cstrong>Fuzzy checkpoint\u003c/strong> cho phép cập nhật tiếp trong lúc ghi buffer.\u003c/li>\u003cli>Tần suất (PE 19.2): checkpoint thường xuyên → phục hồi nhanh nhưng tốn hiệu năng lúc bình thường; không ảnh hưởng phục hồi sau \u003cstrong>hỏng đĩa\u003c/strong> (cần archival dump).\u003c/li>\u003c/ul>\n\u003ch3>5. Recovery algorithm (Section 19.4)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Rollback bình thường\u003c/strong> của T\u003csub>i\u003c/sub>: duyệt log ngược, mỗi \u003ccode>&lt;T_i, X_j, V_1, V_2&gt;\u003c/code> → ghi V\u003csub>1\u003c/sub> vào X\u003csub>j\u003c/sub>, ghi log \u003ccode>&lt;T_i, X_j, V_1&gt;\u003c/code>; gặp \u003ccode>&lt;T_i start&gt;\u003c/code> thì ghi \u003ccode>&lt;T_i abort&gt;\u003c/code> và dừng.\u003c/li>\u003cli>\u003cstrong>Phục hồi sau crash\u003c/strong>:\u003c/li>\u003cli>\u003cstrong>Redo phase\u003c/strong>: tìm \u003ccode>&lt;checkpoint L&gt;\u003c/code> cuối cùng, đặt \u003cstrong>undo-list = L\u003c/strong>. Duyệt \u003cstrong>xuôi\u003c/strong> từ checkpoint: redo mọi \u003ccode>&lt;T, X, V_1, V_2&gt;\u003c/code> và \u003ccode>&lt;T, X, V&gt;\u003c/code>; gặp \u003ccode>&lt;T start&gt;\u003c/code> thì thêm T vào undo-list; gặp \u003ccode>&lt;T commit&gt;\u003c/code> hoặc \u003ccode>&lt;T abort&gt;\u003c/code> thì bỏ T khỏi undo-list.\u003c/li>\u003cli>\u003cstrong>Undo phase\u003c/strong>: duyệt \u003cstrong>ngược\u003c/strong> từ cuối log: gặp bản ghi update của T thuộc undo-list thì undo như rollback bình thường (ghi CLR); gặp \u003ccode>&lt;T start&gt;\u003c/code> với T thuộc undo-list thì ghi \u003ccode>&lt;T abort&gt;\u003c/code> và bỏ T khỏi undo-list; dừng khi undo-list rỗng.\u003c/li>\u003cli>Phải ghi log cả hành động rollback; nếu không, transaction đã rollback bị undo lần nữa sau crash và có thể xoá mất cập nhật của transaction đã commit (PE 19.7).\u003c/li>\u003c/ul>\n\u003ch3>6. Buffer management\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Log buffer\u003c/strong>: log record gom trong bộ nhớ rồi ghi ra khối; khi commit phải force log. Group commit.\u003c/li>\u003cli>\u003cstrong>WAL rule\u003c/strong> khi output khối dữ liệu: mọi log record liên quan phải ra stable storage trước.\u003c/li>\u003cli>\u003cstrong>Force / no-force\u003c/strong>: force = ghi mọi khối đã sửa khi commit (chậm); thường dùng \u003cstrong>no-force\u003c/strong> (cần redo).\u003c/li>\u003cli>\u003cstrong>Steal / no-steal\u003c/strong>: steal = cho phép ghi khối chứa cập nhật chưa commit ra đĩa (cần undo); thường dùng \u003cstrong>steal\u003c/strong>.\u003c/li>\u003cli>Khi output khối phải giữ \u003cstrong>latch\u003c/strong> để không ai sửa giữa chừng. Buffer của OS (double paging) gây khó.\u003c/li>\u003c/ul>\n\u003ch3>7. Hỏng non-volatile storage\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Archival dump\u003c/strong> định kỳ toàn bộ CSDL lên thiết bị khác (đầu băng, cloud), kèm \u003ccode>&lt;dump&gt;\u003c/code> trong log. Phục hồi: nạp dump, redo log từ \u003ccode>&lt;dump&gt;\u003c/code>. \u003cstrong>Fuzzy dump\u003c/strong> cho phép cập nhật trong lúc dump.\u003c/li>\u003c/ul>\n\u003ch3>8. Early lock release và logical undo\u003c/h3>\n\u003cul>\u003cli>Giải phóng khoá sớm (vd khoá B\u003csup>+\u003c/sup>-tree index) thì không thể undo vật lý (old value) vì dữ liệu đã bị transaction khác sửa ⇒ cần \u003cstrong>logical undo\u003c/strong> (vd undo của insert là delete).\u003c/li>\u003cli>\u003cstrong>Operation logging\u003c/strong>: \u003ccode>&lt;T_i, O_j, operation-begin&gt;\u003c/code> … \u003ccode>&lt;T_i, O_j, operation-end, U&gt;\u003c/code> với U là thông tin logical undo. \u003cstrong>Nested top action\u003c/strong> / dummy CLR: thao tác không bao giờ undo (vd cấp phát vùng đĩa — PE 19.8).\u003c/li>\u003c/ul>\n\u003ch3>9. ARIES\u003c/h3>\n\u003cul>\u003cli>Mỗi log record có \u003cstrong>LSN\u003c/strong>; mỗi trang có \u003cstrong>PageLSN\u003c/strong> (LSN của bản ghi cuối đã áp vào trang); mỗi record có \u003cstrong>PrevLSN\u003c/strong> (bản ghi trước của cùng transaction). \u003cstrong>CLR\u003c/strong> có \u003cstrong>UndoNextLSN\u003c/strong> — bản ghi tiếp theo cần undo, nhờ đó không undo lại những gì đã undo.\u003c/li>\u003cli>\u003cstrong>DirtyPageTable\u003c/strong>: các trang đã sửa trong buffer mà chưa ghi ra đĩa, kèm \u003cstrong>RecLSN\u003c/strong> = LSN đầu tiên làm trang bẩn.\u003c/li>\u003cli>\u003cstrong>Checkpoint\u003c/strong> (fuzzy): ghi DirtyPageTable và danh sách transaction active (kèm LastLSN), không ép ghi trang.\u003c/li>\u003cli>Ba pha phục hồi:\u003c/li>\u003cli>\u003cstrong>Analysis\u003c/strong>: từ checkpoint cuối, đọc xuôi; xây lại DirtyPageTable (trang gặp lần đầu → RecLSN = LSN đó), undo-list (transaction chưa kết thúc, LastLSN); \u003cstrong>RedoLSN = min RecLSN\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Redo\u003c/strong> (repeating history): từ RedoLSN đọc xuôi; redo bản ghi update/CLR trừ khi trang không có trong DirtyPageTable, hoặc LSN \u003c RecLSN của trang, hoặc PageLSN trên đĩa ≥ LSN.\u003c/li>\u003cli>\u003cstrong>Undo\u003c/strong>: đi ngược theo PrevLSN của các transaction trong undo-list (với CLR thì nhảy theo UndoNextLSN), ghi CLR.\u003c/li>\u003cli>Ưu điểm: phục hồi nhanh, hỗ trợ logical undo, fuzzy checkpoint, recovery độc lập từng trang, savepoint, lock mịn.\u003c/li>\u003c/ul>\n\u003ch3>10. Remote backup\u003c/h3>\n\u003cul>\u003cli>Bản sao ở xa nhận log liên tục. Vấn đề: phát hiện lỗi, chuyển quyền (failover), thời gian phục hồi, thời gian commit (\u003cstrong>one-safe\u003c/strong>, \u003cstrong>two-very-safe\u003c/strong>, \u003cstrong>two-safe\u003c/strong>). Hot-spare: bản sao áp log ngay.\u003c/li>\u003c/ul>","quiz":[{"q":"Sau crash, transaction có \u003ccode>&lt;T start&gt;\u003c/code> và \u003ccode>&lt;T commit&gt;\u003c/code> trong log phải được:","options":["Undo","Redo","Bỏ qua","Abort"],"answer":1,"explain":"Đã commit thì cập nhật phải bền vững — redo."},{"q":"Vì sao undo phải đi \u003cstrong>ngược\u003c/strong> log?","options":["Nhanh hơn","Để item bị sửa nhiều lần trở về giá trị trước lần sửa đầu tiên","Vì log được ghi ngược","Để tránh deadlock"],"answer":1,"explain":"PE 19.1: undo xuôi để lại old value của lần sửa cuối, sai."},{"q":"Write-ahead logging yêu cầu:","options":["Ghi khối dữ liệu trước log","Log record ra stable storage trước khi khối dữ liệu tương ứng ra đĩa","Ghi mọi khối khi commit","Không ghi old value"],"answer":1,"explain":"Để luôn undo được những gì đã xuống đĩa."},{"q":"Chính sách buffer \u003cstrong>steal\u003c/strong> đòi hỏi recovery có khả năng:","options":["Redo","Undo","Không cần gì","Checkpoint liên tục"],"answer":1,"explain":"Khối chứa cập nhật chưa commit có thể ở trên đĩa nên phải undo được."},{"q":"Chính sách \u003cstrong>no-force\u003c/strong> đòi hỏi:","options":["Redo","Undo","Shadow paging","Không cần log"],"answer":0,"explain":"Khối của transaction đã commit có thể chưa ra đĩa — phải redo."},{"q":"\u003ccode>&lt;checkpoint {T2, T3}&gt;\u003c/code> nghĩa là:","options":["T2, T3 đã commit","T2, T3 đang active lúc checkpoint","T2, T3 bị abort","Chỉ T2, T3 cần redo"],"answer":1,"explain":"L là danh sách transaction active, khởi tạo undo-list khi phục hồi."},{"q":"Trong ARIES, \u003cstrong>RedoLSN\u003c/strong> là:","options":["LSN của checkpoint","RecLSN nhỏ nhất trong DirtyPageTable","LSN lớn nhất của log","PageLSN nhỏ nhất"],"answer":1,"explain":"Pha redo bắt đầu từ đó."},{"q":"ARIES bỏ qua redo bản ghi LSN = 60 trên trang P nếu:","options":["P không bẩn trong buffer trước crash","PageLSN trên đĩa của P ≥ 60","Transaction đã commit","LSN 60 là CLR"],"answer":1,"explain":"Cập nhật đã có trên đĩa (cũng bỏ nếu P không trong DirtyPageTable hoặc 60 \u003c RecLSN)."},{"q":"\u003cstrong>UndoNextLSN\u003c/strong> của một CLR dùng để:","options":["Redo nhanh hơn","Bỏ qua các bản ghi đã được undo khi undo tiếp","Đánh dấu checkpoint","Liên kết hai transaction"],"answer":1,"explain":"Không undo lại những gì đã undo trước crash."},{"q":"Checkpoint \u003cstrong>không\u003c/strong> giúp phục hồi nhanh hơn trong trường hợp:","options":["System crash","Mất điện","Hỏng đĩa","Lỗi hệ điều hành"],"answer":2,"explain":"PE 19.2: hỏng đĩa cần archival dump, vai trò tương tự checkpoint."}],"questions":[{"q":"\u003cstrong>PE 19.1.\u003c/strong> Vì sao undo-list phải xử lý ngược còn redo đi xuôi?","en":"\u003cp>\u003cstrong>Exercise 19.1.\u003c/strong> Explain why the log records of transactions on the undo-list must be processed in reverse order, while redo is done in the forward direction.\u003c/p>","answer":"\u003cp>Giả sử một transaction trên undo-list sửa X từ 1 → 2 rồi 2 → 3: log có \u003ccode>&lt;T, X, 1, 2&gt;\u003c/code> rồi \u003ccode>&lt;T, X, 2, 3&gt;\u003c/code>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Undo ngược\u003c/strong>: áp old value 2 rồi 1 ⇒ X = \u003cstrong>1\u003c/strong> (đúng, giá trị trước khi T chạy). Undo xuôi: áp 1 rồi 2 ⇒ X = 2 (\u003cstrong>sai\u003c/strong>). Lý luận tương tự khi nhiều transaction trên undo-list cùng sửa một item.\u003c/li>\u003cli>\u003cstrong>Redo xuôi\u003c/strong>: nếu T đã commit, áp new value 2 rồi 3 ⇒ X = \u003cstrong>3\u003c/strong> (đúng, giá trị cuối). Redo ngược: 3 rồi 2 ⇒ X = 2 (sai).\u003c/li>\u003c/ul>\n\u003cp>Bài CH19.06 tính cả hai kết quả trên log \u003ccode>LOG3\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 19.2.\u003c/strong> Mục đích checkpoint; tần suất ảnh hưởng hiệu năng, phục hồi sau crash, phục hồi sau hỏng đĩa thế nào?","en":"\u003cp>\u003cstrong>Exercise 19.2.\u003c/strong> What is the purpose of the checkpoint mechanism? How often should checkpoints be taken? How does checkpoint frequency affect:\u003c/p>\n\u003cul>\u003cli>system performance when no failure occurs?\u003c/li>\u003cli>the time needed to recover from a system crash?\u003c/li>\u003cli>the time needed to recover from a media (disk) failure?\u003c/li>\u003c/ul>","answer":"\u003cul>\u003cli>\u003cstrong>Mục đích\u003c/strong>: không có checkpoint thì sau crash phải duyệt \u003cstrong>toàn bộ\u003c/strong> log và redo/undo mọi transaction. Với checkpoint, hầu hết bản ghi trước checkpoint được bỏ qua (dữ liệu của chúng đã ra đĩa). Ngoài ra checkpoint cho phép \u003cstrong>xoá bớt log\u003c/strong> khi stable storage gần đầy.\u003c/li>\u003cli>\u003cstrong>Hiệu năng khi không lỗi\u003c/strong>: checkpoint tốn I/O (ghi mọi buffer bẩn) và tạm ngừng cập nhật ⇒ càng thường xuyên càng chậm.\u003c/li>\u003cli>\u003cstrong>Thời gian phục hồi sau crash\u003c/strong>: càng thường xuyên thì phần log cần xử lý càng ngắn ⇒ phục hồi càng nhanh.\u003c/li>\u003cli>\u003cstrong>Hỏng đĩa\u003c/strong>: checkpoint \u003cstrong>không\u003c/strong> giúp; phục hồi dùng \u003cstrong>archival dump\u003c/strong> (đóng vai trò tương tự checkpoint) + log.\u003c/li>\u003cli>Chọn tần suất: nếu phục hồi nhanh quan trọng thì checkpoint thường xuyên; nếu không thì thưa hơn; nếu stable storage cho log ít thì buộc phải checkpoint thường xuyên.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 19.3.\u003c/strong> Normal logging và archival logging: khi nào xoá được log record (thuật toán Section 19.4)?","en":"\u003cp>\u003cstrong>Exercise 19.3.\u003c/strong> Some database systems let the administrator choose between two kinds of logging: \u003cem>normal logging\u003c/em>, used for recovery from system crashes, and \u003cem>archival logging\u003c/em>, used for recovery from media (disk) failure. With the recovery algorithm of Section 19.4, when can a log record be deleted in each of these two cases?\u003c/p>","answer":"\u003cp>\u003cstrong>Normal logging\u003c/strong> (phục hồi sau crash): không xoá được\u003c/p>\n\u003cul>\u003cli>mọi bản ghi của transaction \u003cstrong>active lúc checkpoint gần nhất\u003c/strong> (có trong \u003ccode>&lt;checkpoint L&gt;\u003c/code>), và\u003c/li>\u003cli>mọi bản ghi của transaction \u003cstrong>bắt đầu sau\u003c/strong> checkpoint gần nhất.\u003c/li>\u003c/ul>\n\u003cp>Mọi bản ghi khác xoá được; sau mỗi checkpoint lại có thêm bản ghi đủ điều kiện xoá. Thực tế không xoá lẻ (tạo lỗ hổng trong log) mà tìm một điểm trong log sao cho mọi bản ghi trước đó đều xoá được và xoá cả đoạn — log thường chia thành nhiều file, xoá file khi mọi bản ghi trong đó xoá được.\u003c/p>\n\u003cp>\u003cstrong>Archival logging\u003c/strong> (phục hồi sau hỏng đĩa): giữ mọi bản ghi cần để redo từ \u003cstrong>archival dump gần nhất\u003c/strong>: áp quy tắc như trên nhưng thay checkpoint bằng thời điểm dump. Dump thưa hơn checkpoint nhiều (phải ghi cả CSDL) nên phải giữ log lâu hơn.\u003c/p>"},{"q":"\u003cstrong>PE 19.4.\u003c/strong> Sửa thuật toán Section 19.4 để có savepoint và rollback về savepoint.","en":"\u003cp>\u003cstrong>Exercise 19.4.\u003c/strong> Describe how to modify the recovery algorithm of Section 19.4 to support savepoints and rollback to a savepoint. (Savepoints are described in Section 19.9.3.)\u003c/p>","answer":"\u003cp>\u003cstrong>Tạo savepoint\u003c/strong> cho T\u003csub>i\u003c/sub>:\u003c/p>\n\u003col>\u003cli>Ghi ra stable storage mọi log record của T\u003csub>i\u003c/sub> đang nằm trong bộ nhớ.\u003c/li>\u003cli>Ghi log record \u003ccode>&lt;savepoint T_i&gt;\u003c/code> (hoặc \u003ccode>&lt;savepoint T_i, name&gt;\u003c/code> nếu cho phép nhiều savepoint có tên).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Rollback về savepoint\u003c/strong>: duyệt log \u003cstrong>ngược\u003c/strong> từ bản ghi cuối của T\u003csub>i\u003c/sub>, undo từng \u003ccode>&lt;T_i, X, V1, V2&gt;\u003c/code> như rollback bình thường (ghi V1, ghi redo-only log record \u003ccode>&lt;T_i, X, V1&gt;\u003c/code>), dừng khi gặp \u003ccode>&lt;savepoint T_i&gt;\u003c/code> tương ứng. Transaction \u003cstrong>không\u003c/strong> abort mà chạy tiếp.\u003c/p>\n\u003cul>\u003cli>Các CLR được sinh như thường lệ nên crash sau đó vẫn phục hồi đúng (redo lặp lại lịch sử, kể cả phần rollback một phần).\u003c/li>\u003cli>Muốn rollback lại về cùng savepoint nhiều lần: sau khi rollback ghi một \u003ccode>&lt;savepoint&gt;\u003c/code> mới. Một khi đã undo vượt qua một savepoint thì không thể quay về savepoint đó nữa.\u003c/li>\u003c/ul>\n\u003cp>Bài CH19.13 làm savepoint thật trên PostgreSQL.\u003c/p>"},{"q":"\u003cstrong>PE 19.5.\u003c/strong> Deferred modification: (a) còn cần old value? (b) redo phase sửa thế nào? (c) đọc item hiệu quả; (d) vấn đề khi nhiều cập nhật.","en":"\u003cp>\u003cstrong>Exercise 19.5.\u003c/strong> Assume the database uses the deferred-modification technique.\u003c/p>\n\u003cp>a. Is the old-value part of an update log record still needed? Why or why not?\u003c/p>\n\u003cp>b. Without old values in update log records, transaction undo is clearly impossible. How must the redo phase of recovery change as a consequence?\u003c/p>\n\u003cp>c. Deferred modification can be implemented by keeping updated data items in the transaction's local memory and reading items that were not updated directly from the database buffer. Suggest an efficient way to implement reading a data item so that a transaction sees its own updates.\u003c/p>\n\u003cp>d. What problem would this technique run into if transactions perform a large number of updates?\u003c/p>","answer":"\u003cp>a. \u003cstrong>Không cần.\u003c/strong> Cập nhật chỉ được áp vào CSDL sau khi commit. Transaction đã commit thì không bao giờ phải undo; transaction đang chạy lúc crash chưa sửa gì trên CSDL, giá trị cũ vẫn nằm nguyên trên đĩa.\u003c/p>\n\u003cp>b. Pha redo chỉ cần \u003cstrong>redo các transaction đã commit\u003c/strong> (áp new value theo thứ tự xuôi); \u003cstrong>không cần duy trì undo-list\u003c/strong> và không có pha undo, vì CSDL trên đĩa không chứa cập nhật của transaction chưa commit. (Bài CH19.09 tính giá trị sau phục hồi theo cách này.)\u003c/p>\n\u003cp>c. Mỗi transaction giữ một bảng băm (hash) item → giá trị đã cập nhật trong bộ nhớ cục bộ. \u003ccode>read(X)\u003c/code>: tra bảng cục bộ trước; nếu có thì trả về (transaction thấy cập nhật của chính mình); nếu không thì đọc từ database buffer (có thể chép vào vùng cục bộ).\u003c/p>\n\u003cp>d. Transaction cập nhật \u003cstrong>rất nhiều\u003c/strong> item có thể \u003cstrong>hết bộ nhớ\u003c/strong> để giữ các bản cục bộ (không thể steal ra đĩa vì chưa commit), và lúc commit phải áp một lượng lớn cập nhật.\u003c/p>"},{"q":"\u003cstrong>PE 19.6.\u003c/strong> Shadow paging với page table là B\u003csup>+\u003c/sup>-tree: (a) chia sẻ nút; (b) vì sao logging vẫn rẻ hơn cho cập nhật nhỏ.","en":"\u003cp>\u003cstrong>Exercise 19.6.\u003c/strong> The shadow-paging scheme requires copying the page table. Suppose the page table is stored as a B\u003csup>+\u003c/sup>-tree.\u003c/p>\n\u003cp>a. Suggest how the new copy and the shadow copy of the B\u003csup>+\u003c/sup>-tree can share as many nodes as possible, assuming updates touch only leaf entries and there are no insertions or deletions.\u003c/p>\n\u003cp>b. Even with this optimization, logging is much cheaper than shadow copying for transactions that make small updates. Explain why.\u003c/p>","answer":"\u003cp>a. Ban đầu bản mới chỉ là \u003cstrong>bản sao của nút gốc\u003c/strong> trỏ tới các nút của shadow copy. Khi một entry ở lá bị sửa, \u003cstrong>chép lá đó và mọi nút trên đường từ lá lên gốc\u003c/strong> (copy-on-write) và sửa con trỏ trong các bản sao; mọi nút khác \u003cstrong>dùng chung\u003c/strong> giữa bản mới và shadow. Commit = đổi con trỏ gốc nguyên tử.\u003c/p>\n\u003cp>b. Với cập nhật nhỏ, shadow paging vẫn phải chép và ghi \u003cstrong>nhiều trang\u003c/strong>: trang dữ liệu mới, lá page table và mọi nút trên đường lên gốc — mỗi trang ở vị trí đĩa khác nhau (I/O ngẫu nhiên), và dữ liệu bị phân mảnh. Logging chỉ sinh \u003cstrong>vài log record nhỏ\u003c/strong>, nằm chung trong một/vài trang log; commit chỉ cần ghi vài trang log, và log của các commit liên tiếp nằm \u003cstrong>liền nhau\u003c/strong> trên đĩa (ghi tuần tự, ít di chuyển đầu đọc).\u003c/p>"},{"q":"\u003cstrong>PE 19.7.\u003c/strong> Nếu không ghi log các hành động rollback thì undo khi phục hồi có thể làm CSDL sai như thế nào?","en":"\u003cp>\u003cstrong>Exercise 19.7.\u003c/strong> Suppose we (wrongly) change the recovery algorithm of Section 19.4 so that actions taken during transaction rollback are not logged. Then, when recovering from a system crash, transactions that were rolled back earlier would be put on the undo-list and rolled back a second time. Give an example showing how actions taken in the undo phase of recovery could leave the database in an incorrect state. (Hint: consider a data item updated by an aborted transaction and afterwards updated by a transaction that commits.)\u003c/p>","answer":"\u003cp>Log sinh ra bởi thuật toán (sai):\u003c/p>\n\u003col>\u003cli>\u003ccode>&lt;T1 start&gt;\u003c/code>\u003c/li>\u003cli>\u003ccode>&lt;T1, A, 1000, 900&gt;\u003c/code>\u003c/li>\u003cli>\u003ccode>&lt;T2 start&gt;\u003c/code>\u003c/li>\u003cli>\u003ccode>&lt;T2, A, 1000, 2000&gt;\u003c/code>\u003c/li>\u003cli>\u003ccode>&lt;T2 commit&gt;\u003c/code>\u003c/li>\u003c/ol>\n\u003cp>Giữa bước 2 và 3, T1 đã rollback (A trở về 1000) nhưng không có log record nào phản ánh điều đó. Khi phục hồi: redo đặt A = 900 rồi 2000; T1 không có commit/abort nên vào \u003cstrong>undo-list\u003c/strong>; pha undo áp old value của bản ghi 2 ⇒ \u003cstrong>A = 1000\u003c/strong>. Cập nhật của T2 \u003cstrong>đã commit\u003c/strong> bị mất — vi phạm durability.\u003c/p>\n\u003cp>Log đúng:\u003c/p>\n\u003col>\u003cli>\u003ccode>&lt;T1 start&gt;\u003c/code> 2. \u003ccode>&lt;T1, A, 1000, 900&gt;\u003c/code> 3. \u003ccode>&lt;T1, A, 1000&gt;\u003c/code> 4. \u003ccode>&lt;T1 abort&gt;\u003c/code> 5. \u003ccode>&lt;T2 start&gt;\u003c/code> 6. \u003ccode>&lt;T2, A, 1000, 2000&gt;\u003c/code> 7. \u003ccode>&lt;T2 commit&gt;\u003c/code>\u003c/li>\u003c/ol>\n\u003cp>T1 có \u003ccode>&lt;abort&gt;\u003c/code> nên không vào undo-list; redo cho A = 2000. Bài CH19.07 chạy cả hai log (\u003ccode>LOG4\u003c/code>, \u003ccode>LOG5\u003c/code>).\u003c/p>"},{"q":"\u003cstrong>PE 19.8.\u003c/strong> Vì sao vùng đĩa cấp cho file không được giải phóng khi transaction rollback? ARIES làm thế nào?","en":"\u003cp>\u003cstrong>Exercise 19.8.\u003c/strong> Disk space allocated to a file by a transaction should not be released even if that transaction rolls back. Explain why, and explain how ARIES makes sure such actions are not rolled back.\u003c/p>","answer":"\u003cp>Khi T cấp một trang mới cho relation, các transaction khác có thể \u003cstrong>đã lưu record vào chính trang đó\u003c/strong> (sau khi khoá/latch cấp phát được nhả sớm). Nếu rollback T giải phóng trang, record của transaction khác bị mất/hỏng. Vì vậy việc cấp phát không được undo — T chỉ undo việc \u003cstrong>chèn record của chính nó\u003c/strong>.\u003c/p>\n\u003cp>ARIES dùng \u003cstrong>nested top action\u003c/strong>: thao tác \"không bao giờ undo\", coi như có undo action rỗng. Sau khi thao tác hoàn tất, ghi một \u003cstrong>dummy CLR\u003c/strong> có \u003cstrong>UndoNextLSN\u003c/strong> trỏ tới bản ghi \u003cstrong>trước\u003c/strong> thao tác đó. Khi rollback T, undo đi theo UndoNextLSN nên \u003cstrong>nhảy qua\u003c/strong> các log record của thao tác cấp phát.\u003c/p>"},{"q":"\u003cstrong>PE 19.9.\u003c/strong> Vùng trống do T1 xoá record được cấp cho record T2 chèn trước khi T1 commit: (a) vấn đề khi T1 rollback; (b) có còn nếu khoá mức trang; (c) giải pháp post-commit action.","en":"\u003cp>\u003cstrong>Exercise 19.9.\u003c/strong> A transaction deletes a record, and the space freed by the deletion is given to a record inserted by another transaction, before the first transaction commits.\u003c/p>\n\u003cp>a. What problem can occur if the first transaction must be rolled back?\u003c/p>\n\u003cp>b. Would this be a problem if page-level locking were used instead of tuple-level locking?\u003c/p>\n\u003cp>c. Suggest a solution that keeps tuple-level locking, by recording post-commit actions in special log records and executing them after commit. Your scheme must guarantee that these actions are performed exactly once.\u003c/p>","answer":"\u003cp>a. Rollback T1 phải khôi phục tuple đã xoá. Nếu undo \u003cstrong>vật lý\u003c/strong> (chép lại old value vào vị trí cũ) thì sẽ \u003cstrong>ghi đè\u003c/strong> tuple mới của T2 và cấu trúc khối (slot directory) ⇒ hỏng dữ liệu. Phải undo \u003cstrong>logic\u003c/strong> (chèn lại tuple, có thể ở chỗ khác), làm recovery phức tạp hơn. Nếu T2 chèn tuple cùng \u003cstrong>khoá chính\u003c/strong> thì khi T1 rollback sẽ vi phạm ràng buộc khoá.\u003c/p>\n\u003cp>b. Với \u003cstrong>khoá mức trang\u003c/strong>, T2 không thể ghi vào trang mà T1 (chưa commit) đang khoá X, nên vùng trống không bị cấp cho T2 trước khi T1 commit ⇒ không có vấn đề (nhưng concurrency giảm).\u003c/p>\n\u003cp>c. \u003cstrong>Hoãn việc giải phóng vùng trống tới sau commit\u003c/strong>. Khi xoá, chỉ đánh dấu tuple đã xoá; record \u003ccode>&lt;T commit&gt;\u003c/code> ghi kèm danh sách \u003cstrong>post-commit action\u003c/strong> (giải phóng vùng nào). Sau commit, thực hiện các action đó như một transaction có log, rồi ghi \u003ccode>&lt;T post-commit&gt;\u003c/code> báo đã xong. Khi phục hồi: gặp commit có post-commit action mà \u003cstrong>không\u003c/strong> có record post-commit ⇒ rollback phần đã làm dở và \u003cstrong>thực hiện lại\u003c/strong> các action ở cuối phục hồi; có record post-commit ⇒ không làm lại. Vậy mỗi action được làm \u003cstrong>đúng một lần\u003c/strong>. Xung đột khoá chính: giữ \u003cstrong>khoá mức key\u003c/strong> tới khi T1 kết thúc để không ai dùng key đó.\u003c/p>"},{"q":"\u003cstrong>PE 19.10.\u003c/strong> Vì sao phục hồi transaction tương tác khó hơn transaction batch? Cách đơn giản xử lý?","en":"\u003cp>\u003cstrong>Exercise 19.10.\u003c/strong> Explain why recovering interactive transactions is harder than recovering batch transactions. Is there a simple way to handle the difficulty? (Hint: think of an ATM transaction that dispenses cash.)\u003c/p>","answer":"\u003cp>Transaction tương tác có \u003cstrong>output ra thế giới bên ngoài không thể thu hồi\u003c/strong>: in vé, phát tiền ATM, gửi email, điều khiển máy móc. Nếu transaction abort hoặc hệ thống crash sau khi output đã xảy ra, rollback CSDL không lấy lại được tiền đã phát. Transaction batch thường không có output như vậy giữa chừng, nên chỉ cần rollback/chạy lại.\u003c/p>\n\u003cp>Cách xử lý: \u003cstrong>dồn mọi output ra cuối, sau khi commit\u003c/strong> (observable external writes chỉ làm sau commit). Nên làm output \u003cstrong>nguyên tử\u003c/strong> — ATM đếm đủ tiền rồi đưa ra một lần, không đưa từng tờ. Nếu không làm nguyên tử được, ghi \u003cstrong>log vật lý của output\u003c/strong> (log sự kiện, thậm chí video) để sau này phục hồi thủ công, vd ghi có lại tiền vào tài khoản khách.\u003c/p>"},{"q":"\u003cstrong>PE 19.11.\u003c/strong> Undo transaction đã commit do nhập sai: (a) vì sao undo thông thường gây sai; (b) point-in-time recovery bằng dump; (c) vì sao không chạy lại bằng log record được.","en":"\u003cp>\u003cstrong>Exercise 19.11.\u003c/strong> Sometimes a transaction must be undone after it has committed, because it was executed by mistake — for example, a bank teller typed wrong input.\u003c/p>\n\u003cp>a. Give an example showing that undoing such a transaction with the normal undo mechanism could leave the database inconsistent.\u003c/p>\n\u003cp>b. One way out is to bring the whole database back to its state just before the erroneous transaction committed (\u003cem>point-in-time recovery\u003c/em>); with this scheme, transactions that committed later are rolled back as well. Suggest a change to the recovery algorithm of Section 19.4 that implements point-in-time recovery using database dumps.\u003c/p>\n\u003cp>c. Later, correct transactions can be re-executed logically if their updates are available as SQL, but they cannot be re-executed using their log records. Why?\u003c/p>","answer":"\u003cp>a. Tài khoản A = 100. T1 gửi 10, T2 gửi 10, chạy lần lượt: log \u003ccode>&lt;T1, A, 100, 110&gt;\u003c/code>, \u003ccode>&lt;T2, A, 110, 120&gt;\u003c/code>, A = 120. Muốn huỷ \u003cstrong>chỉ T1\u003c/strong> bằng undo thông thường (ghi old value) ⇒ A = \u003cstrong>100\u003c/strong>: thực chất huỷ cả T2. Đúng ra A phải là 110 (undo logic: trừ đi 10). Bài CH19.10 tính hai con số này.\u003c/p>\n\u003cp>b. Gọi transaction sai là T\u003csub>e\u003c/sub>:\u003c/p>\n\u003cul>\u003cli>Tìm \u003cstrong>archival dump D gần nhất trước\u003c/strong> \u003ccode>&lt;T_e start&gt;\u003c/code>; nạp lại CSDL từ D.\u003c/li>\u003cli>\u003cstrong>Redo\u003c/strong> mọi log record từ D tới \u003ccode>&lt;T_e commit&gt;\u003c/code> (không gồm). Gọi S1 là tập transaction (khác T\u003csub>e\u003c/sub>) còn active tại thời điểm đó.\u003c/li>\u003cli>\u003cstrong>Rollback T\u003csub>e\u003c/sub> và S1\u003c/strong> (undo như transaction chưa commit). CSDL ở trạng thái ngay trước khi T\u003csub>e\u003c/sub> commit.\u003c/li>\u003cli>Nếu có thông tin redo logic: duyệt tiếp log sau \u003ccode>&lt;T_e commit&gt;\u003c/code>, gọi S2 là các transaction bắt đầu sau đó; \u003cstrong>chạy lại logic\u003c/strong> các transaction trong S1 và S2.\u003c/li>\u003c/ul>\n\u003cp>c. Log record là \u003cstrong>vật lý\u003c/strong>: chứa giá trị tuyệt đối tính trên trạng thái cũ. Sau khi đã bỏ T1, áp \u003ccode>&lt;T2, A, 110, 120&gt;\u003c/code> sẽ đặt A = 120 — tức lại cộng cả phần của T1. Chỉ chạy lại \u003cstrong>câu SQL\u003c/strong> (A := A + 10) trên trạng thái mới mới cho đúng 110.\u003c/p>"},{"q":"\u003cstrong>PE 19.12.\u003c/strong> Ghi khối không nguyên tử (partial block write): (a) vấn đề; (b) phát hiện; (c) dùng RAID 1 để phục hồi.","en":"\u003cp>\u003cstrong>Exercise 19.12.\u003c/strong> The recovery techniques studied assume blocks are written to disk atomically. In reality a power failure can leave a block partially written: some sectors written, others not yet.\u003c/p>\n\u003cp>a. What problems can partial block writes cause?\u003c/p>\n\u003cp>b. Partial block writes can be detected with techniques similar to those used to validate sector reads. Explain how.\u003c/p>\n\u003cp>c. Explain how RAID 1 can be used to recover from a partially written block, restoring it to either its old value or its new value.\u003c/p>","answer":"\u003cp>a. Khối có thể chứa một phần dữ liệu mới, một phần cũ ⇒ \u003cstrong>không nhất quán\u003c/strong>: cấu trúc trang (header, slot directory) mâu thuẫn, record bị cắt đôi. Thuật toán phục hồi giả định khối hoặc cũ hoàn toàn hoặc mới hoàn toàn: redo/undo dựa trên PageLSN sai (PageLSN ở header có thể đã mới trong khi phần dữ liệu còn cũ ⇒ bỏ qua redo cần thiết). Nếu khối là log block thì log bị hỏng.\u003c/p>\n\u003cp>b. Ghi kèm \u003cstrong>checksum\u003c/strong> của cả khối (hoặc số phiên bản/LSN ở \u003cstrong>cả đầu và cuối\u003c/strong> khối, hoặc ở mỗi sector). Khi đọc, tính lại checksum hoặc so các bản sao số phiên bản; không khớp ⇒ khối đã bị ghi dở — giống cách đĩa dùng checksum để phát hiện sector đọc lỗi.\u003c/p>\n\u003cp>c. RAID 1 (mirroring) có hai bản. Ghi \u003cstrong>tuần tự\u003c/strong>: ghi xong bản 1 (và kiểm tra) rồi mới ghi bản 2. Khi phục hồi, với mỗi khối (hoặc chỉ các khối đang ghi dở, nếu ghi lại danh sách vào NVRAM): nếu một bản lỗi checksum thì chép bản còn tốt sang ⇒ khối nhận \u003cstrong>giá trị cũ\u003c/strong> (nếu bản 1 hỏng thì bản 2 còn cũ) hoặc \u003cstrong>giá trị mới\u003c/strong> (nếu bản 2 hỏng thì bản 1 đã mới). Nếu cả hai đều tốt nhưng khác nhau thì chép bản 1 sang bản 2 (hoặc ngược lại) để thống nhất. Đây chính là cách cài đặt stable storage.\u003c/p>"},{"q":"\u003cstrong>PE 19.13.\u003c/strong> Dùng undo log để tạo snapshot view của trang trong buffer (như Oracle).","en":"\u003cp>\u003cstrong>Exercise 19.13.\u003c/strong> Oracle uses undo log records to give transactions a snapshot view of the database under snapshot isolation. The snapshot seen by T\u003csub>i\u003c/sub> contains the updates of all transactions that had committed when T\u003csub>i\u003c/sub> started, plus T\u003csub>i\u003c/sub>'s own updates; updates of all other transactions are invisible to T\u003csub>i\u003c/sub>.\u003c/p>\n\u003cp>Describe a buffer-handling scheme that gives transactions a snapshot view of the pages in the buffer, including how the log is used to build the snapshot view. You may assume that each operation, and its undo action, affects only one page.\u003c/p>","answer":"\u003cul>\u003cli>Mỗi trang trong buffer có thể chứa cập nhật của các transaction \u003cstrong>chưa commit\u003c/strong> hoặc \u003cstrong>commit sau\u003c/strong> khi T\u003csub>i\u003c/sub> bắt đầu. Nếu trang không có cập nhật nào như vậy (mọi cập nhật trên trang thuộc transaction đã commit trước StartTS(T\u003csub>i\u003c/sub>), hoặc của chính T\u003csub>i\u003c/sub>) thì trả về \u003cstrong>chính trang trong buffer\u003c/strong>.\u003c/li>\u003cli>Ngược lại, \u003cstrong>chép trang\u003c/strong> ra một bản tạm. Dùng các \u003cstrong>undo log record\u003c/strong> của trang (liên kết theo trang, mới nhất trước): đi ngược từ bản ghi mới nhất, áp \u003cstrong>undo action\u003c/strong> của mỗi thao tác thuộc transaction mà T\u003csub>i\u003c/sub> không được thấy (chưa commit, hoặc commit sau StartTS(T\u003csub>i\u003c/sub>)), dừng khi tới thao tác cũ hơn thời điểm T\u003csub>i\u003c/sub> bắt đầu. Các thao tác của chính T\u003csub>i\u003c/sub> giữ nguyên.\u003c/li>\u003cli>Trả bản chép này làm \u003cstrong>snapshot page\u003c/strong> cho T\u003csub>i\u003c/sub>; có thể cache bản đó (kèm timestamp) để transaction khác cùng snapshot dùng lại. Giả định mỗi thao tác và undo của nó chỉ chạm một trang nên chỉ cần log của trang đó.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"CH19.01","topic":"transaction status","level":1,"prompt":"\u003cp>\u003ccode>tx_log(log_id, lsn, txn, kind, item, old_val, new_val, active)\u003c/code> lưu các log (hệ thống crash ngay sau bản ghi cuối). Với \u003ccode>LOG1\u003c/code>, trả về \u003ccode>txn, status\u003c/code>: \u003ccode>committed\u003c/code>, \u003ccode>aborted\u003c/code> hoặc \u003ccode>incomplete\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select txn,\n       case when bool_or(kind = 'commit') then 'committed'\n            when bool_or(kind = 'abort') then 'aborted'\n            else 'incomplete' end as status\nfrom tx_log\nwhere log_id = 'LOG1' and txn is not null\ngroup by txn;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["txn","status"],"rows":[["T0","committed"],["T1","committed"],["T2","incomplete"]]}},{"id":"CH19.02","topic":"values after recovery","level":3,"prompt":"\u003cp>Tính giá trị của mỗi item sau khi phục hồi \u003ccode>LOG1\u003c/code> bằng thuật toán Section 19.4: redo mọi bản ghi update/clr theo thứ tự, rồi undo (ngược) mọi update của transaction \u003cstrong>incomplete\u003c/strong>. Trả về \u003ccode>item, value\u003c/code>.\u003cbr>Gợi ý quy tắc: nếu item có update của transaction incomplete thì giá trị cuối là \u003cstrong>old_val của update sớm nhất\u003c/strong> trong số đó; ngược lại là giá trị (new_val) của bản ghi update/clr \u003cstrong>cuối cùng\u003c/strong>.\u003c/p>","en":"","hint":"","solution":"with undo_list as (\n  select txn from tx_log\n  where log_id = 'LOG1' and txn is not null\n  group by txn\n  having not bool_or(kind in ('commit', 'abort'))\n), w as (\n  select * from tx_log where log_id = 'LOG1' and kind in ('update', 'clr')\n)\nselect i.item,\n       coalesce((select u.old_val from w u\n                 where u.item = i.item and u.kind = 'update' and u.txn in (select txn from undo_list)\n                 order by u.lsn limit 1),\n                (select u.new_val from w u where u.item = i.item order by u.lsn desc limit 1)) as value\nfrom (select distinct item from w) i;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["item","value"],"rows":[["D","500"],["A","950"],["C","600"],["B","2050"]]}},{"id":"CH19.03","topic":"undo-list from checkpoint","level":2,"prompt":"\u003cp>\u003ccode>LOG2\u003c/code> có bản ghi \u003ccode>checkpoint\u003c/code> (cột \u003ccode>active\u003c/code> = danh sách L). Theo pha redo của Section 19.4: undo-list khởi tạo bằng L của checkpoint \u003cstrong>cuối cùng\u003c/strong>, thêm transaction có \u003ccode>start\u003c/code> sau checkpoint, bỏ transaction có \u003ccode>commit\u003c/code>/\u003ccode>abort\u003c/code> sau checkpoint. Trả về undo-list (\u003ccode>txn\u003c/code>).\u003c/p>","en":"","hint":"","solution":"with chk as (\n  select max(lsn) as lsn from tx_log where log_id = 'LOG2' and kind = 'checkpoint'\n), l as (\n  select unnest(active) as txn from tx_log where log_id = 'LOG2' and lsn = (select lsn from chk)\n  union\n  select txn from tx_log where log_id = 'LOG2' and kind = 'start' and lsn > (select lsn from chk)\n)\nselect txn from l\nwhere txn not in (select txn from tx_log\n                  where log_id = 'LOG2' and kind in ('commit', 'abort') and lsn > (select lsn from chk));","check":null,"ordered":false,"fresh":false,"expected":{"fields":["txn"],"rows":[["T4"],["T5"]]}},{"id":"CH19.04","topic":"redo phase","level":2,"prompt":"\u003cp>Liệt kê các bản ghi được \u003cstrong>redo\u003c/strong> khi phục hồi \u003ccode>LOG2\u003c/code> (mọi \u003ccode>update\u003c/code> và \u003ccode>clr\u003c/code> sau checkpoint cuối cùng): \u003ccode>lsn, txn, kind, item\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select lsn, txn, kind, item\nfrom tx_log\nwhere log_id = 'LOG2' and kind in ('update', 'clr')\n  and lsn > (select max(lsn) from tx_log where log_id = 'LOG2' and kind = 'checkpoint');","check":null,"ordered":false,"fresh":false,"expected":{"fields":["lsn","txn","kind","item"],"rows":[["8","T3","update","C"],["9","T2","update","A"],["11","T4","update","D"],["13","T3","clr","C"],["16","T5","update","B"],["17","T4","update","E"]]}},{"id":"CH19.05","topic":"undo phase log","level":3,"prompt":"\u003cp>Pha \u003cstrong>undo\u003c/strong> khi phục hồi \u003ccode>LOG2\u003c/code> duyệt log ngược và \u003cstrong>ghi thêm\u003c/strong> log: với mỗi update của transaction trong undo-list ghi CLR \u003ccode>&lt;T, X, old_val&gt;\u003c/code>; khi gặp \u003ccode>start\u003c/code> của transaction đó ghi \u003ccode>&lt;T abort&gt;\u003c/code>. Trả về các bản ghi được ghi thêm theo đúng thứ tự: \u003ccode>seq, txn, kind\u003c/code> (\u003ccode>clr\u003c/code>/\u003ccode>abort\u003c/code>), \u003ccode>item, value\u003c/code> (null với abort).\u003c/p>","en":"","hint":"","solution":"with undo_list as (\n  select txn from tx_log\n  where log_id = 'LOG2' and txn is not null\n  group by txn\n  having not bool_or(kind in ('commit', 'abort'))\n)\nselect row_number() over (order by lsn desc) as seq, txn,\n       case when kind = 'update' then 'clr' else 'abort' end as kind,\n       case when kind = 'update' then item end as item,\n       case when kind = 'update' then old_val end as value\nfrom tx_log\nwhere log_id = 'LOG2' and txn in (select txn from undo_list) and kind in ('update', 'start')\norder by seq;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["seq","txn","kind","item","value"],"rows":[["1","T4","clr","E","500"],["2","T5","clr","B","210"],["3","T5","abort",null,null],["4","T4","clr","D","400"],["5","T4","abort",null,null]]}},{"id":"CH19.06","topic":"undo order","level":2,"prompt":"\u003cp>\u003ccode>LOG3\u003c/code>: transaction incomplete T7 sửa X và Y nhiều lần. Với mỗi item trả về \u003ccode>item, correct_value\u003c/code> (undo \u003cstrong>ngược\u003c/strong>) và \u003ccode>wrong_value\u003c/code> (nếu undo \u003cstrong>xuôi\u003c/strong>, tức áp old_val theo thứ tự LSN tăng dần).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.1.\u003c/strong> Explain why the log records of transactions on the undo-list must be processed in reverse order, while redo is done in the forward direction.\u003c/p>","hint":"","solution":"select item,\n       (array_agg(old_val order by lsn))[1]      as correct_value,\n       (array_agg(old_val order by lsn desc))[1] as wrong_value\nfrom tx_log\nwhere log_id = 'LOG3' and kind = 'update'\ngroup by item;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["item","correct_value","wrong_value"],"rows":[["X","1","3"],["Y","10","20"]]}},{"id":"CH19.07","topic":"logging rollback","level":3,"prompt":"\u003cp>\u003ccode>LOG4\u003c/code> là log của thuật toán sửa \u003cstrong>sai\u003c/strong> ở PE 19.7 (rollback của T1 không ghi log); \u003ccode>LOG5\u003c/code> là log đúng (có CLR và abort). Áp cùng quy tắc phục hồi như CH19.02 cho cả hai log và trả về \u003ccode>log_id, item, value\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.7.\u003c/strong> Suppose we (wrongly) change the recovery algorithm of Section 19.4 so that actions taken during transaction rollback are not logged. Then, when recovering from a system crash, transactions that were rolled back earlier would be put on the undo-list and rolled back a second time. Give an example showing how actions taken in the undo phase of recovery could leave the database in an incorrect state. (Hint: consider a data item updated by an aborted transaction and afterwards updated by a transaction that commits.)\u003c/p>","hint":"","solution":"with undo_list as (\n  select log_id, txn from tx_log\n  where log_id in ('LOG4', 'LOG5') and txn is not null\n  group by log_id, txn\n  having not bool_or(kind in ('commit', 'abort'))\n), w as (\n  select * from tx_log where log_id in ('LOG4', 'LOG5') and kind in ('update', 'clr')\n)\nselect i.log_id, i.item,\n       coalesce((select u.old_val from w u\n                      join undo_list ul on ul.log_id = u.log_id and ul.txn = u.txn\n                 where u.log_id = i.log_id and u.item = i.item and u.kind = 'update'\n                 order by u.lsn limit 1),\n                (select u.new_val from w u\n                 where u.log_id = i.log_id and u.item = i.item\n                 order by u.lsn desc limit 1)) as value\nfrom (select distinct log_id, item from w) i;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["log_id","item","value"],"rows":[["LOG4","A","1000"],["LOG5","A","2000"]]}},{"id":"CH19.08","topic":"log truncation","level":2,"prompt":"\u003cp>Theo PE 19.3, với \u003ccode>LOG2\u003c/code>, bản ghi của transaction \u003cstrong>không\u003c/strong> active lúc checkpoint cuối và \u003cstrong>đã kết thúc trước\u003c/strong> checkpoint thì xoá được. Trả về các \u003ccode>lsn\u003c/code> của \u003ccode>LOG2\u003c/code> có thể xoá (mọi bản ghi của những transaction đó).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.3.\u003c/strong> Some database systems let the administrator choose between two kinds of logging: \u003cem>normal logging\u003c/em>, used for recovery from system crashes, and \u003cem>archival logging\u003c/em>, used for recovery from media (disk) failure. With the recovery algorithm of Section 19.4, when can a log record be deleted in each of these two cases?\u003c/p>","hint":"","solution":"with chk as (\n  select lsn, active from tx_log\n  where log_id = 'LOG2' and kind = 'checkpoint'\n  order by lsn desc limit 1\n)\nselect l.lsn\nfrom tx_log l, chk\nwhere l.log_id = 'LOG2' and l.txn is not null\n  and l.lsn \u003c chk.lsn\n  and not (l.txn = any (chk.active))\n  and l.txn not in (select txn from tx_log where log_id = 'LOG2' and lsn > chk.lsn and txn is not null);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["lsn"],"rows":[["1"],["2"],["3"]]}},{"id":"CH19.09","topic":"deferred modification","level":2,"prompt":"\u003cp>Giả sử \u003ccode>LOG1\u003c/code> được sinh với \u003cstrong>deferred modification\u003c/strong>: CSDL trên đĩa (\u003ccode>tx_disk(item, val)\u003c/code>) chỉ chứa giá trị ban đầu, chỉ cập nhật của transaction \u003cstrong>đã commit\u003c/strong> được áp khi phục hồi. Trả về giá trị sau phục hồi của mọi item trong \u003ccode>tx_disk\u003c/code>: \u003ccode>item, value\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.5 (b).\u003c/strong> Assume the database uses the deferred-modification technique.\u003c/p>\n\u003cp>b. Without old values in update log records, transaction undo is clearly impossible. How must the redo phase of recovery change as a consequence?\u003c/p>","hint":"","solution":"select d.item,\n       coalesce((select l.new_val from tx_log l\n                 where l.log_id = 'LOG1' and l.kind = 'update' and l.item = d.item\n                   and l.txn in (select txn from tx_log where log_id = 'LOG1' and kind = 'commit')\n                 order by l.lsn desc limit 1), d.val) as value\nfrom tx_disk d;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["item","value"],"rows":[["A","950"],["B","2050"],["C","600"],["D","500"]]}},{"id":"CH19.10","topic":"undo committed txn","level":2,"prompt":"\u003cp>\u003ccode>tx_bank_log(lsn, txn, item, old_val, new_val)\u003c/code>: T1 rồi T2 cùng gửi 10 vào A (đều đã commit). Muốn huỷ \u003cstrong>chỉ T1\u003c/strong>. Trả về một dòng \u003ccode>normal_undo\u003c/code> (A sau khi undo T1 bằng old value như bình thường) và \u003ccode>logical_undo\u003c/code> (A hiện tại trừ đi khoản T1 đã cộng).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.11 (a).\u003c/strong> Sometimes a transaction must be undone after it has committed, because it was executed by mistake — for example, a bank teller typed wrong input.\u003c/p>\n\u003cp>a. Give an example showing that undoing such a transaction with the normal undo mechanism could leave the database inconsistent.\u003c/p>","hint":"","solution":"select (select old_val from tx_bank_log where txn = 'T1') as normal_undo,\n       (select new_val from tx_bank_log order by lsn desc limit 1)\n         - (select new_val - old_val from tx_bank_log where txn = 'T1') as logical_undo;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["normal_undo","logical_undo"],"rows":[["100","110"]]}},{"id":"CH19.11","topic":"ARIES analysis","level":3,"prompt":"\u003cp>ARIES: \u003ccode>tx_aries_log(lsn, prev_lsn, txn, kind, page_id, undo_next_lsn)\u003c/code>, checkpoint ở LSN 50 ghi DirtyPageTable \u003ccode>tx_aries_chk_dpt(page_id, rec_lsn)\u003c/code>. Pha \u003cstrong>analysis\u003c/strong> đọc xuôi từ checkpoint: trang nào được update/clr mà chưa có trong DirtyPageTable thì thêm với RecLSN = LSN đó. Trả về DirtyPageTable sau analysis: \u003ccode>page_id, rec_lsn\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with chk as (\n  select lsn from tx_aries_log where kind = 'checkpoint'\n)\nselect page_id, rec_lsn from tx_aries_chk_dpt\nunion all\nselect page_id, min(lsn)\nfrom tx_aries_log\nwhere kind in ('update', 'clr') and lsn > (select lsn from chk)\n  and page_id not in (select page_id from tx_aries_chk_dpt)\ngroup by page_id;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["page_id","rec_lsn"],"rows":[["P1","10"],["P2","20"],["P3","60"],["P4","80"],["P5","110"]]}},{"id":"CH19.12","topic":"ARIES redo","level":3,"prompt":"\u003cp>Tiếp CH19.11. \u003cstrong>RedoLSN\u003c/strong> = RecLSN nhỏ nhất. Pha \u003cstrong>redo\u003c/strong> đọc xuôi từ RedoLSN và redo bản ghi update/clr trừ khi: trang không có trong DirtyPageTable, hoặc LSN \u003c RecLSN của trang, hoặc PageLSN trên đĩa (\u003ccode>tx_aries_page\u003c/code>) ≥ LSN. Trả về các bản ghi được redo: \u003ccode>lsn, txn, page_id\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with chk as (\n  select lsn from tx_aries_log where kind = 'checkpoint'\n), dpt as (\n  select page_id, rec_lsn from tx_aries_chk_dpt\n  union all\n  select page_id, min(lsn) from tx_aries_log\n  where kind in ('update', 'clr') and lsn > (select lsn from chk)\n    and page_id not in (select page_id from tx_aries_chk_dpt)\n  group by page_id\n)\nselect l.lsn, l.txn, l.page_id\nfrom tx_aries_log l\n     join dpt d on d.page_id = l.page_id\n     join tx_aries_page p on p.page_id = l.page_id\nwhere l.kind in ('update', 'clr')\n  and l.lsn >= (select min(rec_lsn) from dpt)\n  and l.lsn >= d.rec_lsn\n  and p.page_lsn \u003c l.lsn;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["lsn","txn","page_id"],"rows":[["90","T2","P1"],["10","T1","P1"],["60","T2","P3"],["80","T3","P4"],["120","T3","P5"]]}},{"id":"CH19.13","topic":"ARIES undo","level":3,"prompt":"\u003cp>Pha \u003cstrong>undo\u003c/strong> của ARIES: transaction chưa kết thúc (không có \u003ccode>commit\u003c/code>/\u003ccode>end\u003c/code>) là loser. Bắt đầu từ bản ghi cuối của mỗi loser, đi lùi theo \u003ccode>prev_lsn\u003c/code> (với CLR thì nhảy theo \u003ccode>undo_next_lsn\u003c/code>). Trả về các bản ghi \u003cstrong>update\u003c/strong> bị undo, theo \u003cstrong>thứ tự undo\u003c/strong> (LSN giảm dần): \u003ccode>lsn, txn, page_id\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with recursive losers as (\n  select txn, max(lsn) as last_lsn\n  from tx_aries_log\n  where txn is not null\n  group by txn\n  having not bool_or(kind in ('commit', 'end'))\n), chain (txn, lsn) as (\n  select txn, last_lsn from losers\n  union all\n  select l.txn, case when l.kind = 'clr' then l.undo_next_lsn else l.prev_lsn end\n  from chain c join tx_aries_log l on l.lsn = c.lsn\n  where (case when l.kind = 'clr' then l.undo_next_lsn else l.prev_lsn end) is not null\n)\nselect l.lsn, l.txn, l.page_id\nfrom chain c join tx_aries_log l on l.lsn = c.lsn\nwhere l.kind = 'update'\norder by l.lsn desc;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["lsn","txn","page_id"],"rows":[["90","T2","P1"],["80","T3","P4"],["60","T2","P3"],["20","T2","P2"]]}},{"id":"CH19.14","topic":"savepoint","level":2,"prompt":"\u003cp>Savepoint thật trên PostgreSQL: trong một transaction, cộng 100 vào \u003ccode>A-101\u003c/code>; \u003ccode>savepoint s1\u003c/code>; trừ 300 khỏi \u003ccode>A-102\u003c/code>; \u003ccode>savepoint s2\u003c/code>; xoá tài khoản \u003ccode>A-301\u003c/code>; \u003cstrong>rollback về s1\u003c/strong>; cộng 1 vào \u003ccode>A-201\u003c/code>; commit.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 19.4.\u003c/strong> Describe how to modify the recovery algorithm of Section 19.4 to support savepoints and rollback to a savepoint. (Savepoints are described in Section 19.9.3.)\u003c/p>","hint":"","solution":"begin;\nupdate tx_account set balance = balance + 100 where acc_id = 'A-101';\nsavepoint s1;\nupdate tx_account set balance = balance - 300 where acc_id = 'A-102';\nsavepoint s2;\ndelete from tx_account where acc_id = 'A-301';\nrollback to savepoint s1;\nupdate tx_account set balance = balance + 1 where acc_id = 'A-201';\ncommit;","check":"select acc_id, balance from tx_account order by acc_id;","ordered":false,"fresh":true,"expected":{"fields":["acc_id","balance"],"rows":[["A-101","600"],["A-102","300"],["A-201","201"],["A-301","0"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
