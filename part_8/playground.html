t khi r hoặc s chia theo thuộc tính khác thuộc tính join (phải truyền rất nhiều dữ liệu).\u003c/li>\u003cli>\u003cstrong>Throughput\u003c/strong>: mỗi cập nhật r hoặc s phải cập nhật thêm view (chi phí nhỏ cho mỗi cập nhật). Nếu join được truy vấn thường xuyên so với cập nhật → throughput tổng \u003cstrong>tốt hơn nhiều\u003c/strong>; nếu cập nhật dày mà ít khi truy vấn join → có thể \u003cstrong>tệ hơn\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Chỗ lưu trữ\u003c/strong>: tốn thêm chỗ cho view, nhưng dung lượng đĩa rẻ so với I/O và truyền mạng, nên thường không phải chi phí lớn.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 22.11\u003c/strong> — Cài bằng MapReduce: (a) broadcast join; (b) indexed nested-loop join với relation trong lưu ở parallel data store; (c) partitioned join.","en":"\u003cp>\u003cstrong>Exercise 22.11.\u003c/strong> Explain how each of the following join algorithms can be implemented in the MapReduce framework:\u003c/p>\n\u003cp>a. Broadcast join (also called asymmetric fragment-and-replicate join).\u003c/p>\n\u003cp>b. Indexed nested-loops join, where the inner relation is stored in a parallel data store.\u003c/p>\n\u003cp>c. Partitioned join.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Broadcast join\u003c/strong>: relation nhỏ s được phân phối tới mọi mapper (ví dụ qua distributed cache) và nạp vào bảng hash trong bộ nhớ khi mapper khởi động. Mapper đọc các tuple của relation lớn r (theo các split có sẵn), tra bảng hash, \u003cstrong>phát ra kết quả join ngay trong map\u003c/strong>. Không cần reduce (map-only job).\u003c/p>\n\u003cp>b. \u003cstrong>Indexed nested-loop\u003c/strong>: mapper đọc các tuple của relation ngoài r; với mỗi tuple, \u003cstrong>tra\u003c/strong> parallel data store (get/scan theo khoá join, dùng index) để lấy các tuple khớp của s, phát ra kết quả. Cũng là map-only; có thể gom nhiều khoá để tra theo lô.\u003c/p>\n\u003cp>c. \u003cstrong>Partitioned join\u003c/strong>: map đọc cả r và s, phát (\u003cstrong>khoá join\u003c/strong>, tuple kèm nhãn nguồn r/s). Shuffle repartition theo khoá join nên mọi tuple cùng khoá về cùng reducer. Reduce nhận (khoá, danh sách tuple), tách thành phần r và phần s, phát mọi cặp r × s (hash join cục bộ).\u003c/p>"}],"exercises":[{"id":"CH22.01","topic":"repartition: số tuple phải chuyển","level":1,"prompt":"\u003cp>\u003ccode>pd_emp(emp_id, dept_id, salary, node)\u003c/code> đang được chia round-robin trên 3 node (0–2); \u003ccode>pd_dept(dept_id, dname, node)\u003c/code> được chia theo \u003ccode>dept_id % 3\u003c/code>. Để làm \u003cstrong>partitioned join\u003c/strong> theo dept_id, ta repartition pd_emp bằng cùng hàm \u003ccode>dept_id % 3\u003c/code>. Trả về một số \u003ccode>moved\u003c/code>: số tuple của pd_emp phải chuyển sang node khác.\u003c/p>","en":"","hint":"","solution":"select count(*) as moved from pd_emp where node \u003c> dept_id % 3;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["moved"],"rows":[["13"]]}},{"id":"CH22.02","topic":"partitioned join: join cục bộ","level":2,"prompt":"\u003cp>Sau khi repartition pd_emp theo \u003ccode>dept_id % 3\u003c/code>, mỗi node join phần pd_emp của nó với phần pd_dept của nó (pd_dept.node). Trả về \u003ccode>node\u003c/code> và \u003ccode>local_results\u003c/code> (số dòng kết quả join ở node đó), cho cả 3 node 0–2 (kể cả node không có kết quả), sắp theo node. Tổng các local_results phải bằng số dòng của \u003ccode>pd_emp natural join pd_dept\u003c/code>.\u003c/p>","en":"","hint":"generate_series(0, 2) left join.","solution":"select n.node, count(e.emp_id) as local_results\nfrom generate_series(0, 2) as n(node)\nleft join (pd_emp e join pd_dept d on d.dept_id = e.dept_id) on d.node = n.node and e.dept_id % 3 = n.node\ngroup by n.node\norder by n.node;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","local_results"],"rows":[["0","2"],["1","11"],["2","5"]]}},{"id":"CH22.03","topic":"repartition vs broadcast","level":2,"prompt":"\u003cp>So sánh hai chiến lược cho join pd_emp với pd_dept trên 3 node: (1) \u003cstrong>repartition\u003c/strong> pd_emp theo dept_id % 3 (pd_dept đã đúng chỗ) — chi phí là số tuple pd_emp phải chuyển; (2) \u003cstrong>broadcast\u003c/strong> pd_dept tới mọi node (giữ nguyên pd_emp) — mỗi tuple pd_dept phải gửi tới 2 node còn lại. Trả về một dòng: \u003ccode>repartition_cost\u003c/code>, \u003ccode>broadcast_cost\u003c/code>, \u003ccode>cheaper\u003c/code> (\u003ccode>repartition\u003c/code> hoặc \u003ccode>broadcast\u003c/code>; nếu bằng nhau ghi \u003ccode>tie\u003c/code>).\u003c/p>","en":"","hint":"","solution":"with c as (\n  select (select count(*) from pd_emp where node \u003c> dept_id % 3) as repartition_cost,\n         (select count(*) * 2 from pd_dept) as broadcast_cost\n)\nselect repartition_cost, broadcast_cost,\n       case when repartition_cost \u003c broadcast_cost then 'repartition'\n            when repartition_cost > broadcast_cost then 'broadcast' else 'tie' end as cheaper\nfrom c;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["repartition_cost","broadcast_cost","cheaper"],"rows":[["13","12","broadcast"]]}},{"id":"CH22.04","topic":"partial aggregation: avg","level":2,"prompt":"\u003cp>Tính lương trung bình mỗi dept_id theo \u003cstrong>partial aggregation\u003c/strong>: bước 1, mỗi node (cột \u003ccode>node\u003c/code> hiện tại của pd_emp) tính (dept_id, sum, count) cục bộ; bước 2, gộp các kết quả cục bộ thành avg toàn cục = tổng các sum / tổng các count. Trả về dept_id, \u003ccode>avg_salary\u003c/code> làm tròn 2, sắp theo dept_id. (Kết quả phải giống \u003ccode>avg(salary)\u003c/code> trực tiếp.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.2.\u003c/strong> Describe how partial aggregation can be implemented for the \u003cstrong>count\u003c/strong> and \u003cstrong>avg\u003c/strong> aggregate functions so as to reduce data transfer.\u003c/p>","hint":"","solution":"with local_agg as (\n  select node, dept_id, sum(salary) as s, count(*) as c\n  from pd_emp group by node, dept_id\n)\nselect dept_id, round(sum(s)::numeric / sum(c), 2) as avg_salary\nfrom local_agg\ngroup by dept_id\norder by dept_id;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["dept_id","avg_salary"],"rows":[["1","57.11"],["2","87.5"],["3","46"],["4","72.5"],["5","100"]]}},{"id":"CH22.05","topic":"pre-aggregation giảm truyền","level":2,"prompt":"\u003cp>Tính \u003ccode>count(*)\u003c/code> mỗi dept_id, trong đó nhóm của dept_id được tính ở node \u003ccode>dept_id % 3\u003c/code>. Trả về một dòng: \u003ccode>without_preagg\u003c/code> — số tuple phải gửi nếu mỗi node gửi nguyên tuple (các tuple có node ≠ dept_id % 3); \u003ccode>with_preagg\u003c/code> — số tuple phải gửi nếu mỗi node gửi một tuple (dept_id, count cục bộ) cho mỗi dept_id nó có (chỉ tính các cặp (node, dept_id) có node ≠ dept_id % 3).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.5.\u003c/strong> Relation r is stored partitioned and indexed on A, and s is stored partitioned and indexed on B. Consider the query\u003c/p>\n\u003cp>\u003csub>r.C\u003c/sub>γ\u003csub>count(s.D)\u003c/sub>((σ\u003csub>A>5\u003c/sub>(r)) ⋈\u003csub>r.B=s.B\u003c/sub> s)\u003c/p>\n\u003cp>a. Using the exchange operator, give a parallel query plan for the part of the query that contains only the select and join operators.\u003c/p>\n\u003cp>b. Extend this plan to compute the aggregate as well, using pre-aggregation to keep data transfer as small as possible.\u003c/p>\n\u003cp>c. Skew during aggregation is a serious problem. Explain how the pre-aggregation above can also greatly reduce the effect of skew during aggregation.\u003c/p>","hint":"","solution":"select (select count(*) from pd_emp where node \u003c> dept_id % 3) as without_preagg,\n       (select count(*) from (select distinct node, dept_id from pd_emp) g where node \u003c> dept_id % 3) as with_preagg;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["without_preagg","with_preagg"],"rows":[["13","6"]]}},{"id":"CH22.06","topic":"skew sau repartition","level":2,"prompt":"\u003cp>Sau khi repartition pd_emp theo \u003ccode>dept_id % 3\u003c/code>, mỗi node nhận bao nhiêu tuple? Trả về một dòng: \u003ccode>max_load\u003c/code> (node nhiều nhất), \u003ccode>min_load\u003c/code> (node ít nhất, tính cả node 0 tuple trong 3 node) và \u003ccode>skew\u003c/code> = max_load / (số tuple / 3), làm tròn 2. Phòng nào gây skew?\u003c/p>","en":"","hint":"","solution":"with load as (\n  select n.node, count(e.emp_id) as cnt\n  from generate_series(0, 2) as n(node) left join pd_emp e on e.dept_id % 3 = n.node\n  group by n.node\n)\nselect max(cnt) as max_load, min(cnt) as min_load,\n       round(max(cnt) / ((select count(*) from pd_emp) / 3.0), 2) as skew\nfrom load;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max_load","min_load","skew"],"rows":[["11","2","1.83"]]}},{"id":"CH22.07","topic":"band join","level":3,"prompt":"\u003cp>\u003ccode>pd_band_r(a)\u003c/code> và \u003ccode>pd_band_s(b)\u003c/code> được range-partition cùng một vector: giá trị 1–10 → mảnh 0, 11–20 → mảnh 1, 21–30 → mảnh 2 (mảnh = \u003ccode>(x − 1) / 10\u003c/code>). Tính band join \u003ccode>|a − b| &lt;= 2\u003c/code>. Trả về các cặp mảnh \u003ccode>(r_part, s_part)\u003c/code> có ít nhất một cặp khớp, cùng số cặp khớp \u003ccode>matches\u003c/code>, sắp theo r_part, s_part. Kiểm tra: |r_part − s_part| luôn ≤ 1.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.4.\u003c/strong> Consider join processing with symmetric fragment-and-replicate using range partitioning. How can the evaluation be optimized when the join condition has the form |r.A − s.B| ≤ k, with k a small constant? (|x| is the absolute value of x.) A join with such a condition is called a \u003cem>band join\u003c/em>.\u003c/p>","hint":"","solution":"select (r.a - 1) / 10 as r_part, (s.b - 1) / 10 as s_part, count(*) as matches\nfrom pd_band_r r join pd_band_s s on abs(r.a - s.b) \u003c= 2\ngroup by 1, 2\norder by 1, 2;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["r_part","s_part","matches"],"rows":[["0","0","2"],["1","0","1"],["1","1","1"],["1","2","1"],["2","2","2"]]}},{"id":"CH22.08","topic":"Bloom filter","level":3,"prompt":"\u003cp>Mô phỏng semijoin filter bằng \u003cstrong>Bloom filter 16 bit\u003c/strong> với hai hàm hash h1(x) = x % 16 và h2(x) = (x * 7) % 16. Bit được bật là mọi h1(b), h2(b) với b trong \u003ccode>pd_bloom_s(b)\u003c/code>. Một tuple của \u003ccode>pd_bloom_r(id, b)\u003c/code> \u003cstrong>qua bộ lọc\u003c/strong> nếu cả h1(r.b) và h2(r.b) đều là bit đã bật. Trả về một dòng: \u003ccode>passed\u003c/code> (số tuple r qua bộ lọc — phải gửi đi), \u003ccode>true_matches\u003c/code> (số tuple r thực sự khớp một s.b), \u003ccode>false_positives\u003c/code> (= passed − true_matches) và \u003ccode>total_r\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.6.\u003c/strong> Relation r is stored partitioned and indexed on A, and s is stored partitioned and indexed on B. Consider the join r ⋈\u003csub>r.B=s.B\u003c/sub> s. Relation s is fairly small, but not small enough for asymmetric fragment-and-replicate to be the best choice; r is large, and most r tuples match no s tuple. A hash join can be used, with a semijoin filter to cut down data transfer. Explain how semijoin filtering with Bloom filters would work in this parallel join.\u003c/p>","hint":"","solution":"with bits as (\n  select b % 16 as bit from pd_bloom_s\n  union\n  select (b * 7) % 16 from pd_bloom_s\n)\nselect count(*) filter (where b % 16 in (select bit from bits) and (b * 7) % 16 in (select bit from bits)) as passed,\n       count(*) filter (where b in (select b from pd_bloom_s)) as true_matches,\n       count(*) filter (where b % 16 in (select bit from bits) and (b * 7) % 16 in (select bit from bits))\n         - count(*) filter (where b in (select b from pd_bloom_s)) as false_positives,\n       count(*) as total_r\nfrom pd_bloom_r;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["passed","true_matches","false_positives","total_r"],"rows":[["14","4","10","40"]]}},{"id":"CH22.09","topic":"outer join song song","level":2,"prompt":"\u003cp>\u003ccode>pd_lo_r(a, label)\u003c/code> nhỏ được \u003cstrong>replicate\u003c/strong> tới mọi node; \u003ccode>pd_lo_s(id, a, val, node)\u003c/code> lớn, đã chia trên 3 node. Theo PE 22.7b: mỗi node tính r ⋈ s\u003csub>node\u003c/sub> và báo về các r.a đã khớp; tuple r không khớp ở \u003cstrong>node nào\u003c/strong> thì bù null. Viết truy vấn trả về đúng các tuple được bù null: a, label, và \u003ccode>val\u003c/code> = null. Không dùng outer join: lấy hợp các r.a đã khớp ở từng node rồi loại.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.7 (b).\u003c/strong> We want to compute the left outer join r ⟕\u003csub>r.A=s.A\u003c/sub> s.\u003c/p>\n\u003cp>b. Now r is small and s is a large relation stored partitioned on s.B. Give an efficient parallel algorithm for the same left outer join.\u003c/p>","hint":"","solution":"select r.a, r.label, null::varchar as val\nfrom pd_lo_r r\nwhere r.a not in (select distinct r2.a\n                  from pd_lo_r r2 join pd_lo_s s on s.a = r2.a\n                  group by s.node, r2.a);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["a","label","val"],"rows":[["2","two",null],["4","four",null]]}},{"id":"CH22.10","topic":"group by không cần repartition","level":2,"prompt":"\u003cp>\u003ccode>pd_sab(id, a, b, c, node)\u003c/code> đang được chia theo b (node = b % 3). Trả về một dòng: \u003ccode>ab_groups_split\u003c/code> — số nhóm (a, b) có tuple nằm trên \u003cstrong>hơn một\u003c/strong> node; \u003ccode>a_groups_split\u003c/code> — số nhóm chỉ theo a có tuple nằm trên hơn một node. Từ đó, group by a, b có cần repartition không? group by a thì sao?\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 22.8.\u003c/strong> We want to compute \u003csub>A,B\u003c/sub>γ\u003csub>sum(C)\u003c/sub> on a relation s that is stored partitioned on s.B. The number of distinct s.B values is large and the number of tuples per s.B value is fairly uniform. Explain how to compute it efficiently while minimizing or avoiding repartitioning.\u003c/p>","hint":"","solution":"select (select count(*) from (select a, b from pd_sab group by a, b having count(distinct node) > 1) t) as ab_groups_split,\n       (select count(*) from (select a from pd_sab group by a having count(distinct node) > 1) t) as a_groups_split;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["ab_groups_split","a_groups_split"],"rows":[["0","4"]]}},{"id":"CH22.11","topic":"MapReduce word count","level":2,"prompt":"\u003cp>Mô phỏng MapReduce đếm từ trên \u003ccode>pd_doc(doc_id, body)\u003c/code>. \u003cstrong>Map\u003c/strong>: tách body thành các từ (chuyển chữ thường, tách theo mọi ký tự không phải chữ cái a–z), bỏ chuỗi rỗng, phát (word, 1). \u003cstrong>Reduce\u003c/strong>: cộng theo word. Trả về word và \u003ccode>cnt\u003c/code>, chỉ các từ xuất hiện \u003cstrong>ít nhất 2 lần\u003c/strong>, sắp theo cnt giảm dần rồi word.\u003c/p>","en":"","hint":"regexp_split_to_table(lower(body), '[^a-z]+').","solution":"with mapped as (\n  select w as word, 1 as one\n  from pd_doc, regexp_split_to_table(lower(body), '[^a-z]+') as w\n  where w \u003c> ''\n)\nselect word, sum(one) as cnt\nfrom mapped\ngroup by word\nhaving sum(one) >= 2\norder by cnt desc, word;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["word","cnt"],"rows":[["node","3"],["the","3"],["data","2"],["parallel","2"],["partition","2"]]}}]},{"key":"ch23","store":"23","short":"23","label":"Chương 23","navLabel":"Chương 23","kind":"Chương","title":"Parallel and Distributed Transaction Processing","titleVi":"Xử lý giao dịch song song và phân tán","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 23 ngoài lịch học CS4420. Bài SQL phân tích dữ liệu \"log\" của nhiều site: quyết định của coordinator và hành động phục hồi trong \u003cstrong>two-phase commit\u003c/strong>, quorum, đọc dữ liệu cũ do lazy replication, đồ thị wait-for toàn cục, Lamport timestamp, chain replication, lease và precedence graph của một federated schedule.\u003c/p>\n\u003ch3>1. Mô hình giao dịch phân tán (slide 23.3–23.8)\u003c/h3>\n\u003cul>\u003cli>Mỗi site có \u003cstrong>transaction manager\u003c/strong> (log, đồng thời cục bộ) và \u003cstrong>transaction coordinator\u003c/strong> (khởi động giao dịch, chia việc cho các site, điều phối kết thúc).\u003c/li>\u003cli>Lỗi đặc thù của hệ phân tán: \u003cstrong>site hỏng\u003c/strong>, \u003cstrong>mất message\u003c/strong>, \u003cstrong>link hỏng\u003c/strong>, \u003cstrong>network partition\u003c/strong> (mạng bị chia thành các nhóm không liên lạc được) (PE 23.2). Một site không phân biệt được site kia hỏng, link hỏng hay site kia quá tải (PE 23.4) → giao thức phải đúng trong mọi trường hợp.\u003c/li>\u003cli>LAN vs WAN (PE 23.1): WAN độ trễ cao, băng thông thấp, dễ partition → giảm số vòng liên lạc, nhân bản dữ liệu gần người dùng.\u003c/li>\u003c/ul>\n\u003ch3>2. Two-phase commit — 2PC (slide 23.9–23.20)\u003c/h3>\n\u003cp>Coordinator C của giao dịch T, các participant S\u003csub>i\u003c/sub>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Phase 1 (prepare)\u003c/strong>: C ghi \u003ccode>&lt;prepare T&gt;\u003c/code> và gửi \u003ccode>prepare T\u003c/code> tới mọi site. Mỗi site: nếu không commit được → ghi \u003ccode>&lt;no T&gt;\u003c/code> và trả lời abort; nếu được → force-write mọi log của T và \u003ccode>&lt;ready T&gt;\u003c/code> rồi trả lời ready.\u003c/li>\u003cli>\u003cstrong>Phase 2 (commit/abort)\u003c/strong>: nếu \u003cstrong>mọi\u003c/strong> site trả lời ready → C ghi \u003ccode>&lt;commit T&gt;\u003c/code> (đây là \u003cstrong>điểm quyết định\u003c/strong>); nếu có site trả lời no hoặc hết thời gian chờ → \u003ccode>&lt;abort T&gt;\u003c/code>. C gửi quyết định tới các site; mỗi site ghi log tương ứng.\u003c/li>\u003cli>\u003cstrong>Site S\u003csub>k\u003c/sub> phục hồi\u003c/strong>, xét log của chính nó:\u003c/li>\u003cli>có \u003ccode>&lt;commit T&gt;\u003c/code> → \u003cstrong>redo(T)\u003c/strong>; có \u003ccode>&lt;abort T&gt;\u003c/code> → \u003cstrong>undo(T)\u003c/strong>;\u003c/li>\u003cli>có \u003ccode>&lt;ready T&gt;\u003c/code> mà không có commit/abort → \u003cstrong>hỏi coordinator\u003c/strong> (hoặc site khác) về quyết định;\u003c/li>\u003cli>không có gì về T (chưa ready) → \u003cstrong>undo(T)\u003c/strong> (coordinator chắc chắn không thể đã commit).\u003c/li>\u003cli>\u003cstrong>Coordinator hỏng\u003c/strong>: participant nào có \u003ccode>&lt;commit T&gt;\u003c/code> thì T commit; có \u003ccode>&lt;abort T&gt;\u003c/code> hoặc chưa \u003ccode>&lt;ready T&gt;\u003c/code> thì T phải abort; nếu \u003cstrong>mọi\u003c/strong> site còn sống chỉ có \u003ccode>&lt;ready T&gt;\u003c/code> → phải \u003cstrong>chờ\u003c/strong> coordinator phục hồi: \u003cstrong>blocking problem\u003c/strong> của 2PC (vẫn giữ khoá của T).\u003c/li>\u003cli>Network partition: các site cùng phía coordinator chạy bình thường; phía kia hành xử như coordinator hỏng.\u003c/li>\u003cli>\u003cstrong>Three-phase commit\u003c/strong> tránh blocking trong một số giả định nhưng tốn thêm vòng; thực tế dùng 2PC + \u003cstrong>consensus\u003c/strong> (Paxos/Raft) để coordinator chịu lỗi.\u003c/li>\u003c/ul>\n\u003ch3>3. Persistent messaging và giao dịch dài (slide 23.21–23.25)\u003c/h3>\n\u003cul>\u003cli>Thay vì 2PC (giữ khoá, blocking), gửi \u003cstrong>message bền vững\u003c/strong>: bảo đảm được giao \u003cstrong>đúng một lần\u003c/strong> nếu giao dịch gửi commit. Message ghi vào bảng \u003cem>messages_to_send\u003c/em> trong cùng giao dịch; tiến trình riêng gửi và gửi lại tới khi nhận ack; bên nhận lưu \u003cem>received_messages\u003c/em> để loại trùng (theo timestamp hoặc \u003cstrong>sequence number\u003c/strong> — PE 23.5).\u003c/li>\u003cli>Lỗi ở phía nhận phải xử lý bằng \u003cstrong>giao dịch bù\u003c/strong> (compensating transaction).\u003c/li>\u003c/ul>\n\u003ch3>4. Đồng thời trong hệ phân tán (slide 23.26–23.40)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Single lock manager\u003c/strong>: một site cấp mọi khoá — đơn giản nhưng là nút thắt và điểm hỏng duy nhất.\u003c/li>\u003cli>\u003cstrong>Distributed lock manager\u003c/strong>: mỗi site quản khoá dữ liệu của mình. Phát hiện deadlock cần \u003cstrong>global wait-for graph\u003c/strong> (gộp các local graph) — có thể có \u003cstrong>false cycle\u003c/strong> do message trễ; PE 23.8 dùng timestamp trên cạnh liên site để chỉ chấp nhận cạnh đã được cả hai site xác nhận.\u003c/li>\u003cli>\u003cstrong>Timestamp toàn cục\u003c/strong>: (local timestamp, site id); \u003cstrong>Lamport clock\u003c/strong>: mỗi sự kiện tăng bộ đếm, khi nhận message đặt bộ đếm = max(hiện tại, timestamp trong message) + 1 → thứ tự phù hợp quan hệ \u003cem>happened-before\u003c/em>.\u003c/li>\u003c/ul>\n\u003ch3>5. Replication và tính nhất quán (slide 23.41–23.60)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Primary copy\u003c/strong>: mọi cập nhật qua bản chính (giữ khoá ở primary). Đồng bộ (cập nhật mọi replica trong giao dịch, dùng 2PC) hoặc \u003cstrong>lazy\u003c/strong> (truyền sau khi commit) — lazy nhanh nhưng đọc replica có thể thấy \u003cstrong>dữ liệu cũ\u003c/strong>, và cập nhật dựa trên dữ liệu cũ gây sai (PE 23.7).\u003c/li>\u003cli>\u003cstrong>Majority protocol\u003c/strong>: ghi/khoá phải được đa số replica; \u003cstrong>quorum consensus\u003c/strong>: n replica, read quorum Qr, write quorum Qw với \u003cstrong>Qr + Qw > n\u003c/strong> (mọi lần đọc giao với lần ghi gần nhất) và \u003cstrong>2·Qw > n\u003c/strong> (hai lần ghi không thể cùng lúc). Đọc lấy giá trị có \u003cstrong>version lớn nhất\u003c/strong> trong quorum.\u003c/li>\u003cli>\u003cstrong>Chain replication\u003c/strong> (PE 23.9): replica xếp thành chuỗi head → … → tail; ghi vào head, truyền dọc chuỗi, coi là xong khi \u003cstrong>tail\u003c/strong> đã áp dụng; đọc ở tail.\u003c/li>\u003cli>\u003cstrong>Lease\u003c/strong>: primary chỉ được phục vụ khi lease còn hạn; mất liên lạc thì không gia hạn được → tự ngừng trước khi primary mới được bầu (PE 23.10).\u003c/li>\u003cli>\u003cstrong>CAP theorem\u003c/strong>: khi có network partition, không thể vừa \u003cstrong>Consistency\u003c/strong> vừa \u003cstrong>Availability\u003c/strong>. Nhiều hệ chọn availability với \u003cstrong>eventual consistency\u003c/strong>; xung đột cập nhật được phát hiện bằng \u003cstrong>version vector\u003c/strong> và giải quyết bằng ứng dụng.\u003c/li>\u003cli>\u003cstrong>Consensus\u003c/strong> (Paxos, Raft): một nhóm node thống nhất một giá trị/một log dù có node hỏng (cần đa số còn sống). Raft: bầu \u003cstrong>leader\u003c/strong> theo term, leader nhân bản log, entry commit khi đa số đã nhận.\u003c/li>\u003c/ul>\n\u003ch3>6. Federated / multidatabase (slide 23.61–23.65)\u003c/h3>\n\u003cul>\u003cli>Mỗi site tự đảm bảo serializability cục bộ, nhưng global schedule vẫn có thể \u003cstrong>không serializable\u003c/strong> (PE 23.11, 23.12): thứ tự serial ở mỗi site khác nhau.\u003c/li>\u003cli>\u003cstrong>Ticket\u003c/strong>: mỗi site có data item \u003cem>ticket\u003c/em>; mọi global transaction phải đọc-ghi ticket tại các site nó truy cập → buộc các global transaction xung đột tại mỗi site, coordinator sắp xếp để thứ tự ở mọi site như nhau.\u003c/li>\u003c/ul>\n\u003ch3>Bảng tra nhanh phục hồi 2PC (log của site S\u003csub>k\u003c/sub>)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Log có\u003c/th>\u003cth>Hành động\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>&lt;commit T&gt;\u003c/code>\u003c/td>\u003ctd>redo(T)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;abort T&gt;\u003c/code> (hoặc \u003ccode>&lt;no T&gt;\u003c/code>)\u003c/td>\u003ctd>undo(T)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>chỉ \u003ccode>&lt;ready T&gt;\u003c/code>\u003c/td>\u003ctd>hỏi coordinator / site khác; nếu không ai biết → \u003cstrong>blocked\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>không có gì của T\u003c/td>\u003ctd>undo(T)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Trong 2PC, điểm quyết định commit của giao dịch T là lúc nào?","options":["Khi mọi site ghi \u003cready T>","Khi coordinator ghi \u003ccommit T> vào log bền vững","Khi site cuối cùng ghi \u003ccommit T>","Khi gửi prepare"],"answer":1,"explain":"Sau khi \u003ccommit T> ở coordinator được ghi bền vững, T chắc chắn commit."},{"q":"Site phục hồi thấy log có \u003cready T> nhưng không có commit/abort. Nó làm gì?","options":["redo(T)","undo(T)","Hỏi coordinator (hoặc site khác) về quyết định","Bỏ qua T"],"answer":2,"explain":"Site đã hứa commit nên không được tự quyết."},{"q":"Blocking problem của 2PC xảy ra khi?","options":["Một participant trả lời no","Coordinator hỏng và mọi site còn sống chỉ có \u003cready T>","Mạng chậm","Có deadlock cục bộ"],"answer":1,"explain":"Không ai biết quyết định; các site phải chờ và giữ khoá của T."},{"q":"n = 5 replica. Cấu hình quorum nào hợp lệ?","options":["Qr = 2, Qw = 3","Qr = 3, Qw = 3","Qr = 1, Qw = 3","Qr = 4, Qw = 2"],"answer":1,"explain":"Cần Qr + Qw > 5 và 2Qw > 5: chỉ (3, 3) thoả."},{"q":"Site A không nhận được trả lời từ B. A có phân biệt được B hỏng, link hỏng hay B quá tải?","options":["Có, nhờ timeout","Không — giao thức phải đúng trong mọi trường hợp","Có, nếu dùng 2PC","Có, trong LAN"],"answer":1,"explain":"PE 23.4."},{"q":"Trong chain replication, một lần ghi coi là hoàn tất khi nào?","options":["Head đã ghi","Đa số replica đã ghi","Tail đã áp dụng","Coordinator gửi ack"],"answer":2,"explain":"Đọc ở tail, nên ghi chỉ thấy được khi tail có."},{"q":"CAP theorem nói gì?","options":["Không thể có cả consistency, availability, partition tolerance khi có network partition","Mọi hệ phân tán đều eventual consistency","Partition không thể xảy ra trong LAN","2PC đảm bảo availability"],"answer":0,"explain":"Khi mạng bị chia, phải chọn giữa nhất quán và sẵn sàng."},{"q":"Lazy replication, đọc từ replica chưa cập nhật rồi ghi lên primary dựa trên giá trị đó gây ra gì?","options":["Deadlock","Mất cập nhật (lost update) / trạng thái không nhất quán","Blocking","Không vấn đề gì nếu có khoá X ở primary"],"answer":1,"explain":"PE 23.7: cộng 10 vào số dư cũ 100 thay vì 110."},{"q":"Lamport timestamp của sự kiện nhận message bằng gì?","options":["Timestamp của sự kiện gửi","max(timestamp sự kiện trước trên cùng tiến trình, timestamp sự kiện gửi) + 1","Số thứ tự trên tiến trình","Giờ đồng hồ thật"],"answer":1,"explain":"Bảo đảm a happened-before b ⇒ L(a) \u003c L(b)."}],"questions":[{"q":"\u003cstrong>PE 23.1\u003c/strong> — Những khác biệt chính giữa LAN và WAN ảnh hưởng tới thiết kế CSDL phân tán?","en":"\u003cp>\u003cstrong>Exercise 23.1.\u003c/strong> Which key differences between a local-area network and a wide-area network affect the design of a distributed database?\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Tốc độ truyền và độ trễ\u003c/strong>: LAN nhanh, độ trễ thấp; WAN chậm, độ trễ cao (khoảng cách địa lý). Giao thức cần nhiều vòng liên lạc chấp nhận được trong LAN nhưng hệ cho WAN phải \u003cstrong>giảm số vòng\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Nhân bản gần người dùng\u003c/strong> để giảm độ trễ đọc rất quan trọng trong WAN, ít quan trọng trong LAN.\u003c/li>\u003cli>\u003cstrong>Hỏng link và network partition\u003c/strong> xảy ra thường hơn trong WAN (LAN dễ làm dự phòng). Giao thức cho WAN phải xử lý các lỗi này mà không làm database mất nhất quán.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 23.2\u003c/strong> — (a) Các loại lỗi trong hệ phân tán; (b) loại nào cũng có ở hệ tập trung?","en":"\u003cp>\u003cstrong>Exercise 23.2.\u003c/strong> Building a highly available distributed system requires knowing which kinds of failures can happen.\u003c/p>\n\u003cp>a. List the possible kinds of failure in a distributed system.\u003c/p>\n\u003cp>b. Which of the items in your list for part a also apply to a centralized system?\u003c/p>","answer":"\u003cp>a. (1) \u003cstrong>Site hỏng\u003c/strong>; (2) \u003cstrong>đĩa hỏng\u003c/strong>; (3) \u003cstrong>mất message\u003c/strong>; (4) \u003cstrong>lỗi liên lạc\u003c/strong> — link hỏng làm một hoặc nhiều site mất kết nối, có thể dẫn tới \u003cstrong>network partition\u003c/strong>.\u003c/p>\n\u003cp>b. \u003cstrong>Site hỏng\u003c/strong> (máy sập) và \u003cstrong>đĩa hỏng\u003c/strong> cũng xảy ra ở hệ tập trung. Mất message và network partition là đặc thù của hệ phân tán.\u003c/p>"},{"q":"\u003cstrong>PE 23.3\u003c/strong> — Với mỗi loại lỗi ở PE 23.2a, 2PC bảo đảm atomicity thế nào?","en":"\u003cp>\u003cstrong>Exercise 23.3.\u003c/strong> Consider a failure that happens during 2PC for a transaction. For each kind of failure you listed in Exercise 23.2a, explain how 2PC keeps the transaction atomic in spite of that failure.\u003c/p>","answer":"\u003cp>Ý chính: sau khi mọi site đã gửi \u003ccode>&lt;ready T&gt;\u003c/code>, \u003cstrong>chỉ coordinator\u003c/strong> quyết định commit hay abort; mọi site khác chỉ commit/abort sau khi biết quyết định đó (trực tiếp từ coordinator hoặc gián tiếp qua site khác). Vì vậy không thể có site commit trong khi site khác abort.\u003c/p>\n\u003cp>Một site chỉ \u003cstrong>abort\u003c/strong> T khi: (i) chưa ghi \u003ccode>&lt;ready T&gt;\u003c/code> — coordinator chưa và sẽ không nhận được ready từ nó, nên chỉ có thể quyết định abort; (ii) đã ready nhưng biết site khác có \u003ccode>&lt;abort T&gt;\u003c/code> — site đó đã biết quyết định của coordinator; (iii) nó là coordinator — không ai commit được nếu coordinator chưa quyết định commit.\u003cbr>Một site chỉ \u003cstrong>commit\u003c/strong> T khi: (i) đã ready và biết site khác có \u003ccode>&lt;commit T&gt;\u003c/code>; (ii) nó là coordinator và đã nhận ready của mọi site.\u003c/p>\n\u003cp>Theo từng lỗi:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Participant hỏng\u003c/strong>: trước khi gửi ready → coordinator coi như no, abort; sau khi ready → khi phục hồi, site đọc log (commit → redo, abort → undo, chỉ ready → hỏi). Log ghi bền vững nên đĩa phục hồi đủ thông tin.\u003c/li>\u003cli>\u003cstrong>Coordinator hỏng\u003c/strong>: participant xem log của các site còn sống; nếu có commit/abort thì theo đó; nếu ai đó chưa ready thì abort; nếu mọi site chỉ ready thì \u003cstrong>chờ\u003c/strong> (blocking) — không bao giờ quyết định trái nhau.\u003c/li>\u003cli>\u003cstrong>Mất message / link hỏng / partition\u003c/strong>: hết thời gian chờ thì coi như site kia hỏng; phía có coordinator tiếp tục, phía kia xử lý như coordinator hỏng. Message gửi lại khi liên lạc khôi phục.\u003c/li>\u003cli>\u003cstrong>Đĩa hỏng\u003c/strong> (mất log bền vững) vượt khỏi phạm vi 2PC — cần stable storage (nhân bản log).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 23.4\u003c/strong> — Site A có phân biệt được B hỏng, link A–B hỏng, hay B quá tải (trả lời chậm 100 lần)? Hệ quả cho phục hồi?","en":"\u003cp>\u003cstrong>Exercise 23.4.\u003c/strong> A distributed system has two sites, A and B. Can site A tell apart the following situations?\u003c/p>\n\u003cul>\u003cli>B has gone down.\u003c/li>\u003cli>The link between A and B has gone down.\u003c/li>\u003cli>B is extremely overloaded, and its response time is 100 times longer than normal.\u003c/li>\u003c/ul>\n\u003cp>What does your answer imply for recovery in distributed systems?\u003c/p>","answer":"\u003cp>\u003cstrong>Không\u003c/strong>, chừng nào chưa liên lạc lại được với B — A chỉ thấy B không trả lời. Do đó hành động của A khi không liên lạc được với B phải \u003cstrong>đúng trong cả ba trường hợp\u003c/strong>, và phải cho phép B \u003cstrong>tái hoà nhập nhất quán\u003c/strong> khi liên lạc khôi phục (ví dụ B có thể vẫn đang chạy và đã làm gì đó trong lúc đó). Đây là lý do 2PC bị blocking, và các hệ dùng timeout, lease, consensus.\u003c/p>"},{"q":"\u003cstrong>PE 23.5\u003c/strong> — Đề xuất cơ chế persistent messaging dựa trên sequence number để bỏ message đã nhận sớm hơn timestamp.","en":"\u003cp>\u003cstrong>Exercise 23.5.\u003c/strong> The persistent-messaging scheme of this chapter relies on timestamps. Its drawback is that received messages can be discarded only once they are too old, so a large number of received messages may have to be remembered. Propose an alternative scheme based on sequence numbers instead of timestamps that can discard messages sooner.\u003c/p>","answer":"\u003cul>\u003cli>Mỗi message được gắn \u003cstrong>sequence number\u003c/strong> duy nhất cho cặp (site gửi, site nhận), tăng 1 cho mỗi message mới từ site gửi tới site nhận.\u003c/li>\u003cli>Site nhận chỉ \u003cstrong>lưu và ack\u003c/strong> một message nếu đã nhận \u003cstrong>mọi message có số nhỏ hơn\u003c/strong> từ site đó (message đến sớm thì bỏ hoặc giữ tạm, chờ gửi lại).\u003c/li>\u003cli>Site gửi gửi lại một message tới khi nhận ack có số \u003cstrong>≥\u003c/strong> số của message đó, rồi xoá nó khỏi hàng đợi gửi.\u003c/li>\u003cli>Site nhận bỏ mọi message có số \u003cstrong>≤\u003c/strong> số lớn nhất đã lưu từ site gửi đó (trùng lặp). Trong \u003cem>received_messages\u003c/em> chỉ cần giữ \u003cstrong>số lớn nhất\u003c/strong> của mỗi site gửi (sau khi message đã được xử lý cục bộ).\u003c/li>\u003c/ul>\n\u003cp>Chi phí lưu ở site nhận cố định và nhỏ cho mỗi site gửi, không phụ thuộc số message (cơ chế timestamp tốn chỗ cho mỗi message trong khoảng timeout). Bài CH23.09 tính số ack cao nhất cho mỗi site gửi.\u003c/p>"},{"q":"\u003cstrong>PE 23.6\u003c/strong> — Khác biệt giữa replication trong hệ phân tán và duy trì remote backup site?","en":"\u003cp>\u003cstrong>Exercise 23.6.\u003c/strong> Explain how data replication in a distributed system differs from maintaining a remote backup site.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Remote backup\u003c/strong>: mọi giao dịch chạy ở \u003cstrong>primary site\u003c/strong>; \u003cstrong>toàn bộ\u003c/strong> database được sao sang backup bằng cách gửi log record. Primary hỏng thì backup tiếp quản. Không dùng 2PC → chi phí thấp, độ sẵn sàng thấp hơn.\u003c/li>\u003cli>\u003cstrong>Replication phân tán\u003c/strong>: nhiều bản sao ở nhiều site, các item khác nhau có thể nhân bản ở các site khác nhau; giao dịch có thể chạy ở \u003cstrong>mọi site\u003c/strong>, đọc bản gần nhất. Phải dùng 2PC hoặc consensus để giữ các bản sao nhất quán → sẵn sàng cao hơn nhưng tốn chi phí hơn.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 23.7\u003c/strong> — Ví dụ lazy replication gây trạng thái không nhất quán dù cập nhật lấy khoá X ở bản chính, khi đọc từ node không phải master.","en":"\u003cp>\u003cstrong>Exercise 23.7.\u003c/strong> Give an example in which lazy replication leads to an inconsistent database state, even though updates obtain an exclusive lock on the primary (master) copy, when data are read from a node other than the master.\u003c/p>","answer":"\u003cp>Số dư tài khoản = 100, nhân bản ở N site. T1 và T2 mỗi giao dịch gửi thêm 10 → kết quả đúng phải là 120. T1 chạy trước: khoá X ở primary, đổi thành 110, commit; bản sao ở site s \u003cstrong>chưa được cập nhật\u003c/strong> (lazy). T2 đọc số dư từ site s (vẫn 100), rồi lấy khoá X ở primary và ghi 100 + 10 = \u003cstrong>110\u003c/strong>. Kết quả cuối ở primary là 110 — cập nhật của T1 bị \u003cstrong>mất\u003c/strong>. Khoá ở primary không giúp vì T2 đọc ở chỗ khác. Bài CH23.10 tìm các lần đọc thấy dữ liệu cũ.\u003c/p>"},{"q":"\u003cstrong>PE 23.8\u003c/strong> — Chứng minh: đồ thị do controller xây có chu trình ⇒ hệ đang deadlock; không có chu trình ⇒ hệ không deadlock lúc thuật toán bắt đầu.","en":"\u003cp>\u003cstrong>Exercise 23.8.\u003c/strong> Consider the following deadlock-detection algorithm. When transaction T\u003csub>i\u003c/sub> at site S\u003csub>1\u003c/sub> requests a resource from T\u003csub>j\u003c/sub> at site S\u003csub>3\u003c/sub>, a request message with timestamp n is sent. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>1\u003c/sub>. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>3\u003c/sub> only if T\u003csub>j\u003c/sub> has received the request message and cannot grant the requested resource immediately. A request from T\u003csub>i\u003c/sub> to T\u003csub>j\u003c/sub> at the same site is handled in the usual way, and no timestamp is attached to the edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>). A central coordinator starts the detection algorithm by sending an initiating message to every site.\u003c/p>\n\u003cp>When a site receives this message, it sends its local wait-for graph to the coordinator. Such a graph holds all the local information the site has about the state of the real graph; it reflects an instantaneous state of that site but is not synchronized with any other site.\u003c/p>\n\u003cp>After the controller has received a reply from every site, it builds a graph as follows:\u003c/p>\n\u003cul>\u003cli>The graph has a vertex for every transaction in the system.\u003c/li>\u003cli>The graph has an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) if and only if either there is an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) in one of the wait-for graphs, or an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) (for some n) appears in more than one wait-for graph.\u003c/li>\u003c/ul>\n\u003cp>Show that if the constructed graph contains a cycle, the system is in a deadlock state, and that if it contains no cycle, the system was not in a deadlock state when the algorithm started.\u003c/p>","answer":"\u003cp>\u003cstrong>(⇒ deadlock)\u003c/strong> Giả sử có chu trình T\u003csub>i\u003c/sub> → T\u003csub>j\u003c/sub> → … → T\u003csub>m\u003c/sub> → T\u003csub>i\u003c/sub>. Mỗi cạnh là (1) cạnh cục bộ (T\u003csub>k\u003c/sub>, T\u003csub>l\u003c/sub>) — chắc chắn T\u003csub>k\u003c/sub> đang chờ T\u003csub>l\u003c/sub>; hoặc (2) cạnh liên site (T\u003csub>k\u003c/sub>, T\u003csub>l\u003c/sub>, n) xuất hiện ở \u003cstrong>hơn một\u003c/strong> đồ thị — tức đã được chèn ở cả site của T\u003csub>l\u003c/sub>, nghĩa là yêu cầu đã tới T\u003csub>l\u003c/sub> và T\u003csub>l\u003c/sub> không cấp ngay được, nên T\u003csub>k\u003c/sub> thật sự đang chờ T\u003csub>l\u003c/sub>. Vậy mọi cạnh của chu trình là một quan hệ chờ thật, và một vòng chờ như vậy là deadlock (một giao dịch đang chờ không giải phóng tài nguyên).\u003c/p>\n\u003cp>\u003cstrong>(Không chu trình ⇒ không deadlock lúc bắt đầu)\u003c/strong> Ngay khi T\u003csub>k\u003c/sub> bắt đầu chờ T\u003csub>l\u003c/sub>: cùng site thì có cạnh cục bộ; khác site thì cạnh (T\u003csub>k\u003c/sub>, T\u003csub>l\u003c/sub>, n) được thêm ở \u003cstrong>cả hai\u003c/strong> site. Nếu lúc thuật toán bắt đầu có vòng chờ, các giao dịch trong vòng bị deadlock nên \u003cstrong>không cạnh nào của vòng biến mất\u003c/strong> cho tới khi thuật toán kết thúc. Do đó dù các đồ thị cục bộ được thu thập ở các thời điểm khác nhau, mọi cạnh của vòng vẫn có mặt trong các đồ thị gửi về, và controller sẽ thấy chu trình. Phản đảo: không thấy chu trình ⇒ không có deadlock lúc bắt đầu. Bài CH23.06 và CH23.07 xây đồ thị và tìm chu trình.\u003c/p>"},{"q":"\u003cstrong>PE 23.9\u003c/strong> — Chain replication: (a) sớm nhất khi nào được nhả khoá X sau khi cập nhật? (b) hai lý do định nghĩa chain theo partition/tablet thay vì từng item; (c) dùng consensus để chain xác định duy nhất?","en":"\u003cp>\u003cstrong>Exercise 23.9.\u003c/strong> Consider the chain-replication protocol of Section 23.4.3.2, a variant of the primary-copy protocol.\u003c/p>\n\u003cp>a. If locking is used for concurrency control, what is the earliest moment at which a process may release an exclusive lock after updating a data item?\u003c/p>\n\u003cp>b. Each data item could have its own chain, but give two reasons why it is better to define a chain at a coarser level, for example per partition or tablet.\u003c/p>\n\u003cp>c. How can consensus protocols be used to make sure that the chain is uniquely determined at every point in time?\u003c/p>","answer":"\u003cp>a. Chỉ sau khi cập nhật đã được ghi nhận ở \u003cstrong>tail\u003c/strong> của chuỗi, vì các lần đọc sau đọc ở tail; nhả sớm hơn thì giao dịch khác có thể đọc giá trị cũ ở tail rồi ghi đè. (Nếu dùng two-phase locking thì còn phải giữ tới khi giao dịch commit.)\u003c/p>\n\u003cp>b. (1) Lưu thông tin chain cho \u003cstrong>từng item\u003c/strong> tốn rất nhiều metadata. (2) Khi node hỏng, mọi chain chứa node đó phải sửa — làm theo từng item thì chi phí phục hồi rất lớn; theo partition chỉ phải sửa vài chain.\u003c/p>\n\u003cp>c. Mọi node trong chain phải đồng ý về \u003cstrong>thành viên và thứ tự\u003c/strong> của chain. Lưu cấu hình chain như metadata được nhân bản bằng consensus (Paxos/Raft), thường qua một dịch vụ điều phối chịu lỗi như \u003cstrong>ZooKeeper\u003c/strong> hay \u003cstrong>Chubby\u003c/strong>; mỗi thay đổi chain là một cập nhật metadata qua consensus, nên tại mọi thời điểm chỉ có một cấu hình được chấp nhận. Bài CH23.11 tìm các phiên bản đang trên đường qua chain.\u003c/p>"},{"q":"\u003cstrong>PE 23.10\u003c/strong> — Primary cũ bị ngắt rồi nối lại mà không biết đã có primary mới: (a) vấn đề gì? (b) dùng lease thế nào? (c) có ảnh hưởng majority/quorum protocol không?","en":"\u003cp>\u003cstrong>Exercise 23.10.\u003c/strong> With the primary-copy replication scheme, if the primary becomes disconnected from the rest of the system, a new node may be elected primary. The old primary may not notice that it was disconnected, and may later reconnect without knowing that a new primary exists.\u003c/p>\n\u003cp>a. What problems can occur if the old primary does not realize that a new primary has taken over?\u003c/p>\n\u003cp>b. How can leases be used to avoid these problems?\u003c/p>\n\u003cp>c. Would such a situation — a participant node is disconnected and then reconnected without realizing it was disconnected — cause any problem for the majority or quorum protocols?\u003c/p>","answer":"\u003cp>a. Primary cũ vẫn nhận và trả lời \u003cstrong>đọc\u003c/strong> bằng dữ liệu cũ, thiếu các cập nhật đã làm ở primary mới; nếu nó còn nhận \u003cstrong>ghi\u003c/strong>, hai primary cùng cập nhật → các bản sao mâu thuẫn.\u003c/p>\n\u003cp>b. Primary chỉ được phục vụ khi giữ \u003cstrong>lease\u003c/strong> còn hạn và phải gia hạn trước khi hết. Bị ngắt thì không gia hạn được, nên khi lease hết nó \u003cstrong>tự ngừng\u003c/strong> phục vụ. Primary mới chỉ được bầu sau khi lease của primary cũ chắc chắn đã hết → không bao giờ có hai primary cùng phục vụ. Bài CH23.12 tìm các request bị phục vụ ngoài lease.\u003c/p>\n\u003cp>c. \u003cstrong>Không\u003c/strong>: trong majority/quorum, mọi read quorum giao với mọi write quorum, nên một lần đọc luôn gặp ít nhất một node có phiên bản mới nhất (lấy version lớn nhất). Node cũ quay lại chỉ là một replica có version cũ.\u003c/p>"},{"q":"\u003cstrong>PE 23.11\u003c/strong> — Federated DB, tối đa một global transaction tại một thời điểm, mỗi site serializable cục bộ: (a) làm sao bảo đảm chỉ một global transaction? (b) ví dụ global schedule không serializable.","en":"\u003cp>\u003cstrong>Exercise 23.11.\u003c/strong> Consider a federated database system in which at most one global transaction is guaranteed to be active at any time, and every local site guarantees local serializability.\u003c/p>\n\u003cp>a. Suggest ways in which the federated system can make sure that at most one global transaction is active at any time.\u003c/p>\n\u003cp>b. Show with an example that a nonserializable global schedule can still occur under these assumptions.\u003c/p>","answer":"\u003cp>a. Dùng một \u003cstrong>data item đặc biệt\u003c/strong> ở một site: mọi global transaction phải lấy khoá trên nó trước khi bắt đầu và nhả sau khi kết thúc. Để không phụ thuộc một site, dùng \u003cstrong>bầu chọn\u003c/strong> để chọn coordinator trong các site đang sống và yêu cầu khoá trên item ở coordinator hiện tại.\u003c/p>\n\u003cp>b. Hai site, giao dịch cục bộ T1 (site 1) và T2 (site 2), global G1 và G2 (G2 bắt đầu sau khi G1 kết thúc) — bảng \u003ccode>pd_sched\u003c/code>:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>bước\u003c/th>\u003cth>site\u003c/th>\u003cth>giao dịch\u003c/th>\u003cth>thao tác\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>T1\u003c/td>\u003ctd>read(X1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>G1\u003c/td>\u003ctd>write(X1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>2\u003c/td>\u003ctd>G1\u003c/td>\u003ctd>write(X2)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>2\u003c/td>\u003ctd>T2\u003c/td>\u003ctd>read(X2)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>T2\u003c/td>\u003ctd>write(Y2)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>2\u003c/td>\u003ctd>G2\u003c/td>\u003ctd>read(Y2)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>1\u003c/td>\u003ctd>G2\u003c/td>\u003ctd>read(Y1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>1\u003c/td>\u003ctd>T1\u003c/td>\u003ctd>write(Y1)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Site 1 serializable theo thứ tự G2 → T1 → G1; site 2 theo G1 → T2 → G2. Toàn cục có chu trình G1 → T2 → G2 → T1 → G1 → \u003cstrong>không serializable\u003c/strong>, dù chỉ một global transaction chạy tại mỗi thời điểm. Bài CH23.13 tính các cạnh precedence.\u003c/p>"},{"q":"\u003cstrong>PE 23.12\u003c/strong> — Federated DB, mỗi site serializable cục bộ, mọi global transaction chỉ đọc: (a) ví dụ không serializable; (b) dùng ticket để bảo đảm global serializability.","en":"\u003cp>\u003cstrong>Exercise 23.12.\u003c/strong> Consider a federated database system in which every local site guarantees local serializability and all global transactions are read-only.\u003c/p>\n\u003cp>a. Show with an example that nonserializable executions can occur in such a system.\u003c/p>\n\u003cp>b. Show how a ticket scheme could be used to guarantee global serializability.\u003c/p>","answer":"\u003cp>a. Cùng hệ hai site như PE 23.11, nhưng G1, G2 chỉ đọc: site 1: G1 read(X1), T1 write(X1), G2 read(X1) → G1 → T1 → G2. Site 2: G2 read(X2), T2 write(X2), G1 read(X2) → G2 → T2 → G1. Mỗi site serializable, nhưng toàn cục G1 trước G2 ở site 1 và G2 trước G1 ở site 2 → chu trình, không serializable.\u003c/p>\n\u003cp>b. Vì mỗi site serializable cục bộ, một chu trình trong precedence graph toàn cục phải đi qua ít nhất hai site và hai global transaction. \u003cstrong>Ticket\u003c/strong>: mỗi site có một data item \u003cem>ticket\u003c/em>; mọi global transaction truy cập site phải đọc rồi ghi (tăng) ticket ở đó, nên hai global transaction luôn \u003cstrong>xung đột\u003c/strong> trên ticket tại mỗi site chung. Global transaction manager điều khiển thứ tự lấy ticket để các global transaction có \u003cstrong>cùng thứ tự serializable ở mọi site\u003c/strong> → không thể có chu trình như trên.\u003c/p>"},{"q":"\u003cstrong>PE 23.13\u003c/strong> — View v = \u003csub>A\u003c/sub>γ\u003csub>sum(B)\u003c/sub>(r) được duy trì trong giao dịch cập nhật, trên hệ dùng 2PC + Paxos qua nhiều data center: (a) vì sao tệ khi có giá trị A \"nóng\"? (b) operation locking giúp gì? (c) đánh đổi của duy trì view bất đồng bộ?","en":"\u003cp>\u003cstrong>Exercise 23.13.\u003c/strong> A large relation r(A, B, C) has a materialized view v = \u003csub>A\u003c/sub>γ\u003csub>sum(B)\u003c/sub>(r). View maintenance can be done as part of every transaction that updates r, on a parallel/distributed storage system that supports transactions spanning several nodes. The system uses two-phase commit together with a consensus protocol such as Paxos across geographically distributed data centers.\u003c/p>\n\u003cp>a. Explain why doing view maintenance inside the update transaction is a bad idea if some values of attribute A are \u003cem>hot\u003c/em> at certain times, that is, many updates concern those values of A.\u003c/p>\n\u003cp>b. Explain how operation locking (if supported) could solve this problem.\u003c/p>\n\u003cp>c. Explain the trade-offs of using asynchronous view maintenance in this setting.\u003c/p>","answer":"\u003cp>a. Mọi giao dịch cập nhật r với A nóng phải cập nhật \u003cstrong>cùng một tuple\u003c/strong> của view → xếp hàng trên khoá X của tuple đó. Commit qua 2PC + Paxos giữa các data center mất hàng trăm mili giây, khoá bị giữ suốt thời gian đó → throughput chỉ còn vài chục giao dịch mỗi giây, dù các giao dịch không xung đột gì khác.\u003c/p>\n\u003cp>b. Cập nhật view chỉ là \u003cstrong>cộng thêm\u003c/strong> vào sum. \u003cstrong>Operation locking\u003c/strong> (khoá theo thao tác, ví dụ khoá \"increment\") cho phép nhiều thao tác cộng chạy đồng thời vì phép cộng giao hoán, các khoá increment không xung đột nhau → throughput tăng mạnh.\u003c/p>\n\u003cp>c. \u003cstrong>Bất đồng bộ\u003c/strong>: giao dịch chỉ cập nhật r và ghi lại thay đổi; view được cập nhật sau → không còn nút thắt, throughput cao. Đổi lại, đọc view có thể thấy \u003cstrong>dữ liệu cũ\u003c/strong> (chưa phản ánh các cập nhật gần đây), và cần cơ chế bảo đảm mọi thay đổi cuối cùng đều được áp dụng đúng một lần.\u003c/p>"}],"exercises":[{"id":"CH23.01","topic":"2PC: quyết định của coordinator","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_2pc_log(txn, site, seq, rec)\u003c/code> chứa log của coordinator (site \u003ccode>C\u003c/code>) và các participant. Với mỗi giao dịch, trả về txn và \u003ccode>decision\u003c/code>: \u003ccode>commit\u003c/code> nếu coordinator đã ghi commit, \u003ccode>abort\u003c/code> nếu coordinator đã ghi abort, ngược lại \u003ccode>undecided\u003c/code>. Sắp theo txn.\u003c/p>","en":"","hint":"","solution":"select txn,\n       case when bool_or(site = 'C' and rec = 'commit') then 'commit'\n            when bool_or(site = 'C' and rec = 'abort') then 'abort'\n            else 'undecided' end as decision\nfrom pd_2pc_log\ngroup by txn\norder by txn;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","decision"],"rows":[["T1","commit"],["T2","abort"],["T3","commit"],["T4","undecided"],["T5","undecided"]]}},{"id":"CH23.02","topic":"2PC: phục hồi participant","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_2pc_part(txn, site)\u003c/code> liệt kê participant của mỗi giao dịch. Mỗi participant phục hồi chỉ dựa vào \u003cstrong>log của chính nó\u003c/strong>: có commit → \u003ccode>redo\u003c/code>; có abort hoặc no → \u003ccode>undo\u003c/code>; chỉ có ready → \u003ccode>ask\u003c/code>; không có record nào của txn → \u003ccode>undo\u003c/code>. Trả về txn, site, \u003ccode>action\u003c/code>, sắp theo txn, site.\u003c/p>","en":"","hint":"","solution":"select p.txn, p.site,\n       case when bool_or(l.rec = 'commit') then 'redo'\n            when bool_or(l.rec in ('abort', 'no')) then 'undo'\n            when bool_or(l.rec = 'ready') then 'ask'\n            else 'undo' end as action\nfrom pd_2pc_part p\nleft join pd_2pc_log l on l.txn = p.txn and l.site = p.site\ngroup by p.txn, p.site\norder by p.txn, p.site;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","site","action"],"rows":[["T1","S1","redo"],["T1","S2","redo"],["T2","S1","undo"],["T2","S2","undo"],["T3","S1","ask"],["T3","S2","redo"],["T4","S1","ask"],["T4","S2","ask"],["T5","S1","ask"],["T5","S2","undo"]]}},{"id":"CH23.03","topic":"2PC: blocking","level":2,"prompt":"\u003cp>Coordinator \u003ccode>C\u003c/code> vừa hỏng. Các participant còn sống trao đổi log với nhau. Với mỗi giao dịch, quyết định: \u003ccode>commit\u003c/code> nếu có participant nào có commit; \u003ccode>abort\u003c/code> nếu có participant có abort/no \u003cstrong>hoặc\u003c/strong> có participant chưa ghi ready; nếu \u003cstrong>mọi\u003c/strong> participant đều chỉ có ready → \u003ccode>blocked\u003c/code> (phải chờ C). Trả về txn, \u003ccode>outcome\u003c/code>, sắp theo txn.\u003c/p>","en":"","hint":"","solution":"with s as (\n  select p.txn, p.site,\n         bool_or(l.rec = 'commit') as has_commit,\n         bool_or(l.rec in ('abort', 'no')) as has_abort,\n         coalesce(bool_or(l.rec = 'ready'), false) as has_ready\n  from pd_2pc_part p left join pd_2pc_log l on l.txn = p.txn and l.site = p.site\n  group by p.txn, p.site\n)\nselect txn,\n       case when bool_or(has_commit) then 'commit'\n            when bool_or(has_abort) or not bool_and(has_ready) then 'abort'\n            else 'blocked' end as outcome\nfrom s\ngroup by txn\norder by txn;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn","outcome"],"rows":[["T1","commit"],["T2","abort"],["T3","commit"],["T4","blocked"],["T5","abort"]]}},{"id":"CH23.04","topic":"quorum consensus","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_quorum(cfg, n, r, w)\u003c/code>. Một cấu hình hợp lệ khi \u003ccode>r + w &gt; n\u003c/code> (đọc luôn giao với lần ghi gần nhất) \u003cstrong>và\u003c/strong> \u003ccode>2w &gt; n\u003c/code> (hai lần ghi không thể cùng lúc). Trả về cfg, \u003ccode>read_sees_write\u003c/code> (boolean r + w > n), \u003ccode>writes_conflict\u003c/code> (boolean 2w > n), \u003ccode>valid\u003c/code> (cả hai), sắp theo cfg.\u003c/p>","en":"","hint":"","solution":"select cfg, r + w > n as read_sees_write, 2 * w > n as writes_conflict, (r + w > n and 2 * w > n) as valid\nfrom pd_quorum\norder by cfg;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["cfg","read_sees_write","writes_conflict","valid"],"rows":[["A","true","true","true"],["B","true","true","true"],["C","false","true","false"],["D","true","true","true"],["E","true","false","false"],["F","false","false","false"]]}},{"id":"CH23.05","topic":"đọc quorum: version lớn nhất","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_copy(item, node, version, val)\u003c/code> là các bản sao; \u003ccode>pd_read_req(req, item, node)\u003c/code> cho biết mỗi lần đọc quorum hỏi những node nào. Lần đọc trả về giá trị có \u003cstrong>version lớn nhất\u003c/strong> trong các node được hỏi. Trả về req, item, \u003ccode>version\u003c/code>, \u003ccode>val\u003c/code>, sắp theo req.\u003c/p>","en":"","hint":"","solution":"select distinct on (q.req) q.req, q.item, c.version, c.val\nfrom pd_read_req q join pd_copy c on c.item = q.item and c.node = q.node\norder by q.req, c.version desc;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["req","item","version","val"],"rows":[["1","X","3","300"],["2","X","3","300"],["3","Y","1","10"],["4","Y","2","20"]]}},{"id":"CH23.06","topic":"global wait-for graph","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_wfg(site, waiter, holder, ts)\u003c/code> là các local wait-for graph (ts null = cạnh cục bộ; ts khác null = cạnh liên site gắn timestamp của request). Theo PE 23.8, đồ thị toàn cục gồm cạnh (waiter, holder) nếu: có một cạnh \u003cstrong>cục bộ\u003c/strong> như vậy, \u003cstrong>hoặc\u003c/strong> cạnh liên site (waiter, holder, ts) xuất hiện ở \u003cstrong>hơn một\u003c/strong> site. Trả về các cạnh (waiter, holder) của đồ thị toàn cục, không trùng, sắp theo waiter, holder.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.8.\u003c/strong> Consider the following deadlock-detection algorithm. When transaction T\u003csub>i\u003c/sub> at site S\u003csub>1\u003c/sub> requests a resource from T\u003csub>j\u003c/sub> at site S\u003csub>3\u003c/sub>, a request message with timestamp n is sent. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>1\u003c/sub>. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>3\u003c/sub> only if T\u003csub>j\u003c/sub> has received the request message and cannot grant the requested resource immediately. A request from T\u003csub>i\u003c/sub> to T\u003csub>j\u003c/sub> at the same site is handled in the usual way, and no timestamp is attached to the edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>). A central coordinator starts the detection algorithm by sending an initiating message to every site.\u003c/p>\n\u003cp>When a site receives this message, it sends its local wait-for graph to the coordinator. Such a graph holds all the local information the site has about the state of the real graph; it reflects an instantaneous state of that site but is not synchronized with any other site.\u003c/p>\n\u003cp>After the controller has received a reply from every site, it builds a graph as follows:\u003c/p>\n\u003cul>\u003cli>The graph has a vertex for every transaction in the system.\u003c/li>\u003cli>The graph has an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) if and only if either there is an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) in one of the wait-for graphs, or an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) (for some n) appears in more than one wait-for graph.\u003c/li>\u003c/ul>\n\u003cp>Show that if the constructed graph contains a cycle, the system is in a deadlock state, and that if it contains no cycle, the system was not in a deadlock state when the algorithm started.\u003c/p>","hint":"","solution":"select waiter, holder from pd_wfg where ts is null\nunion\nselect waiter, holder from pd_wfg where ts is not null\ngroup by waiter, holder, ts having count(distinct site) > 1\norder by waiter, holder;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["waiter","holder"],"rows":[["T1","T2"],["T2","T3"],["T3","T1"],["T5","T4"]]}},{"id":"CH23.07","topic":"phát hiện deadlock","level":3,"prompt":"\u003cp>Dùng đồ thị toàn cục của CH23.06, tìm các giao dịch nằm trên \u003cstrong>một chu trình\u003c/strong> (deadlock). Trả về cột \u003ccode>txn\u003c/code>, sắp theo txn. Gợi ý: recursive CTE tìm mọi cặp (x, y) mà y đến được từ x; x nằm trên chu trình nếu x đến được chính nó.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.8.\u003c/strong> Consider the following deadlock-detection algorithm. When transaction T\u003csub>i\u003c/sub> at site S\u003csub>1\u003c/sub> requests a resource from T\u003csub>j\u003c/sub> at site S\u003csub>3\u003c/sub>, a request message with timestamp n is sent. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>1\u003c/sub>. The edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) is inserted into the local wait-for graph of S\u003csub>3\u003c/sub> only if T\u003csub>j\u003c/sub> has received the request message and cannot grant the requested resource immediately. A request from T\u003csub>i\u003c/sub> to T\u003csub>j\u003c/sub> at the same site is handled in the usual way, and no timestamp is attached to the edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>). A central coordinator starts the detection algorithm by sending an initiating message to every site.\u003c/p>\n\u003cp>When a site receives this message, it sends its local wait-for graph to the coordinator. Such a graph holds all the local information the site has about the state of the real graph; it reflects an instantaneous state of that site but is not synchronized with any other site.\u003c/p>\n\u003cp>After the controller has received a reply from every site, it builds a graph as follows:\u003c/p>\n\u003cul>\u003cli>The graph has a vertex for every transaction in the system.\u003c/li>\u003cli>The graph has an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) if and only if either there is an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>) in one of the wait-for graphs, or an edge (T\u003csub>i\u003c/sub>, T\u003csub>j\u003c/sub>, n) (for some n) appears in more than one wait-for graph.\u003c/li>\u003c/ul>\n\u003cp>Show that if the constructed graph contains a cycle, the system is in a deadlock state, and that if it contains no cycle, the system was not in a deadlock state when the algorithm started.\u003c/p>","hint":"","solution":"with recursive g as (\n  select waiter, holder from pd_wfg where ts is null\n  union\n  select waiter, holder from pd_wfg where ts is not null\n  group by waiter, holder, ts having count(distinct site) > 1\n), reach(src, dst) as (\n  select waiter, holder from g\n  union\n  select r.src, g.holder from reach r join g on g.waiter = r.dst\n)\nselect src as txn from reach where src = dst order by src;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["txn"],"rows":[["T1"],["T2"],["T3"]]}},{"id":"CH23.08","topic":"Lamport timestamp","level":3,"prompt":"\u003cp>Bảng \u003ccode>pd_event(proc, seq, kind, msg)\u003c/code>: các sự kiện của từng tiến trình theo thứ tự seq; sự kiện \u003ccode>recv\u003c/code> nhận message do sự kiện \u003ccode>send\u003c/code> có cùng \u003ccode>msg\u003c/code> gửi. Lamport timestamp: L(e) = 1 + max(L của sự kiện liền trước trên cùng tiến trình, L của sự kiện send tương ứng nếu e là recv), với max của tập rỗng = 0. Trả về proc, seq, \u003ccode>lamport\u003c/code>, sắp theo proc, seq.\u003c/p>","en":"","hint":"L(e) bằng số sự kiện trên đường happened-before dài nhất kết thúc tại e. Recursive CTE đi theo các cạnh (sự kiện trước → sự kiện sau), rồi lấy max độ dài.","solution":"with recursive edge(fp, fs, tp, ts) as (\n  select proc, seq - 1, proc, seq from pd_event where seq > 1\n  union all\n  select s.proc, s.seq, r.proc, r.seq\n  from pd_event s join pd_event r on r.msg = s.msg and s.kind = 'send' and r.kind = 'recv'\n), path(proc, seq, len) as (\n  select proc, seq, 1 from pd_event\n  union all\n  select e.tp, e.ts, p.len + 1 from path p join edge e on e.fp = p.proc and e.fs = p.seq\n)\nselect proc, seq, max(len) as lamport\nfrom path\ngroup by proc, seq\norder by proc, seq;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["proc","seq","lamport"],"rows":[["P1","1","1"],["P1","2","2"],["P1","3","3"],["P1","4","7"],["P2","1","3"],["P2","2","4"],["P2","3","5"],["P3","1","1"],["P3","2","2"],["P3","3","5"],["P3","4","6"]]}},{"id":"CH23.09","topic":"persistent messaging: sequence number","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_msg_in(sender, seq, arrival)\u003c/code>: các message nhận được từ mỗi site gửi (sequence number bắt đầu từ 1). Theo PE 23.5, site nhận chỉ ack/lưu message seq = k nếu đã có mọi message 1 … k − 1. Với mỗi sender, trả về \u003ccode>acked_upto\u003c/code> = số k lớn nhất mà mọi message 1 … k đều đã nhận (0 nếu chưa có message 1). Sắp theo sender.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.5.\u003c/strong> The persistent-messaging scheme of this chapter relies on timestamps. Its drawback is that received messages can be discarded only once they are too old, so a large number of received messages may have to be remembered. Propose an alternative scheme based on sequence numbers instead of timestamps that can discard messages sooner.\u003c/p>","hint":"k thoả khi số message có seq ≤ k bằng k.","solution":"select s.sender,\n       coalesce((select max(m.seq) from pd_msg_in m\n                 where m.sender = s.sender\n                   and (select count(*) from pd_msg_in x where x.sender = m.sender and x.seq \u003c= m.seq) = m.seq), 0) as acked_upto\nfrom (select distinct sender from pd_msg_in) s\norder by s.sender;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["sender","acked_upto"],"rows":[["A","4"],["B","3"],["C","0"]]}},{"id":"CH23.10","topic":"lazy replication: đọc dữ liệu cũ","level":3,"prompt":"\u003cp>\u003ccode>pd_primary_hist(version, t_commit, balance)\u003c/code> là các phiên bản đã commit ở primary; \u003ccode>pd_replica_apply(node, version, t_apply)\u003c/code> cho biết replica áp dụng phiên bản lúc nào; \u003ccode>pd_replica_read(read_id, node, t)\u003c/code> là các lần đọc ở replica. Một lần đọc thấy balance của phiên bản lớn nhất mà replica đã áp dụng tại thời điểm ≤ t; balance đúng là phiên bản lớn nhất primary đã commit tại thời điểm ≤ t. Trả về read_id, node, \u003ccode>seen\u003c/code>, \u003ccode>primary_balance\u003c/code>, \u003ccode>stale\u003c/code> (boolean), sắp theo read_id.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.7.\u003c/strong> Give an example in which lazy replication leads to an inconsistent database state, even though updates obtain an exclusive lock on the primary (master) copy, when data are read from a node other than the master.\u003c/p>","hint":"","solution":"select r.read_id, r.node,\n       (select h.balance from pd_replica_apply a join pd_primary_hist h on h.version = a.version\n        where a.node = r.node and a.t_apply \u003c= r.t order by a.version desc limit 1) as seen,\n       (select h.balance from pd_primary_hist h where h.t_commit \u003c= r.t order by h.version desc limit 1) as primary_balance,\n       (select max(a.version) from pd_replica_apply a where a.node = r.node and a.t_apply \u003c= r.t)\n         \u003c (select max(h.version) from pd_primary_hist h where h.t_commit \u003c= r.t) as stale\nfrom pd_replica_read r\norder by r.read_id;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["read_id","node","seen","primary_balance","stale"],"rows":[["1","R1","110","110","false"],["2","R2","100","110","true"],["3","R2","100","120","true"],["4","R1","120","120","false"],["5","R2","120","120","false"]]}},{"id":"CH23.11","topic":"chain replication","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_chain(item, pos, node, version)\u003c/code>: chain của mỗi item, pos 1 là \u003cstrong>head\u003c/strong>, pos lớn nhất là \u003cstrong>tail\u003c/strong>; version là phiên bản mới nhất node đó đã áp dụng. Một lần ghi chỉ coi là commit khi tail đã áp dụng. Với mỗi item, trả về \u003ccode>head_version\u003c/code>, \u003ccode>committed_version\u003c/code> (version ở tail), \u003ccode>in_flight\u003c/code> (= head_version − committed_version), sắp theo item.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.9.\u003c/strong> Consider the chain-replication protocol of Section 23.4.3.2, a variant of the primary-copy protocol.\u003c/p>\n\u003cp>a. If locking is used for concurrency control, what is the earliest moment at which a process may release an exclusive lock after updating a data item?\u003c/p>\n\u003cp>b. Each data item could have its own chain, but give two reasons why it is better to define a chain at a coarser level, for example per partition or tablet.\u003c/p>\n\u003cp>c. How can consensus protocols be used to make sure that the chain is uniquely determined at every point in time?\u003c/p>","hint":"","solution":"select c.item,\n       max(c.version) filter (where c.pos = 1) as head_version,\n       max(c.version) filter (where c.pos = t.max_pos) as committed_version,\n       max(c.version) filter (where c.pos = 1) - max(c.version) filter (where c.pos = t.max_pos) as in_flight\nfrom pd_chain c\njoin (select item, max(pos) as max_pos from pd_chain group by item) t on t.item = c.item\ngroup by c.item\norder by c.item;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["item","head_version","committed_version","in_flight"],"rows":[["A","7","6","1"],["B","4","4","0"],["C","9","8","1"]]}},{"id":"CH23.12","topic":"lease","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_lease(node, lease_start, lease_end)\u003c/code> (lease có hiệu lực trong [lease_start, lease_end)) và \u003ccode>pd_serve(req, node, t)\u003c/code> (các request mà node đã phục vụ với tư cách primary lúc t). Tìm các request \u003cstrong>vi phạm\u003c/strong>: node không giữ lease nào còn hiệu lực tại t. Trả về req, node, t, sắp theo req.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.10.\u003c/strong> With the primary-copy replication scheme, if the primary becomes disconnected from the rest of the system, a new node may be elected primary. The old primary may not notice that it was disconnected, and may later reconnect without knowing that a new primary exists.\u003c/p>\n\u003cp>a. What problems can occur if the old primary does not realize that a new primary has taken over?\u003c/p>\n\u003cp>b. How can leases be used to avoid these problems?\u003c/p>\n\u003cp>c. Would such a situation — a participant node is disconnected and then reconnected without realizing it was disconnected — cause any problem for the majority or quorum protocols?\u003c/p>","hint":"","solution":"select s.req, s.node, s.t\nfrom pd_serve s\nwhere not exists (select * from pd_lease l\n                  where l.node = s.node and l.lease_start \u003c= s.t and s.t \u003c l.lease_end)\norder by s.req;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["req","node","t"],"rows":[["3","N1","22"],["4","N1","27"],["6","N2","40"]]}},{"id":"CH23.13","topic":"federated: precedence graph","level":3,"prompt":"\u003cp>Bảng \u003ccode>pd_sched(step, site, txn, op, item)\u003c/code> là schedule của PE 23.11b. Hai thao tác \u003cstrong>xung đột\u003c/strong> nếu cùng site, cùng item, khác giao dịch và ít nhất một là write; thao tác xảy ra trước (step nhỏ hơn) tạo cạnh \u003ccode>from_txn → to_txn\u003c/code>. Trả về các cạnh (from_txn, to_txn, site) không trùng, sắp theo site, from_txn. Có chu trình không?\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 23.11 (b).\u003c/strong> Consider a federated database system in which at most one global transaction is guaranteed to be active at any time, and every local site guarantees local serializability.\u003c/p>\n\u003cp>b. Show with an example that a nonserializable global schedule can still occur under these assumptions.\u003c/p>","hint":"","solution":"select distinct a.txn as from_txn, b.txn as to_txn, a.site\nfrom pd_sched a join pd_sched b\n  on a.site = b.site and a.item = b.item and a.txn \u003c> b.txn and a.step \u003c b.step\n and (a.op = 'write' or b.op = 'write')\norder by a.site, a.txn;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["from_txn","to_txn","site"],"rows":[["G2","T1","1"],["T1","G1","1"],["G1","T2","2"],["T2","G2","2"]]}}]}]}</script>
<script type="module">
// PGlite is loaded lazily so the page still renders (with the signal off and
// setup instructions) when the CDN cannot be reached.
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
let pgliteModule = null;
const loadPGlite = async () => (pgliteModule ||= await import(PGLITE_URL)).PGlite;

// Shared grading engine — used by the Node tools (run/grade/verify/build)
// and inlined into playground.html by build.mjs. Keep it free of imports
// so it runs unchanged in the browser.

// True when a script issues its own transaction control. Function bodies
// ($$ ... $$), string literals and comments are ignored, since a PL/pgSQL
// `begin ... end` block is not a transaction.
function hasTxControl(sql) {
  const code = sql
    .replace(/\$([A-Za-z_]*)\$[\s\S]*?\$\1\$/g, ' ')
    .replace(/'(?:[^']|'')*'/g, ' ')
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/--.*$/gm, ' ');
  return /\b(begin(?!\s+atomic)|commit|rollback|start\s+transaction)\b/i.test(code);
}

// Date/time values are kept as PostgreSQL's own text ('2018-03-01',
// '2018-03-08 00:00:00') instead of JS Dates, so results do not depend on
// the local time zone.
const RAW = v => v;
const RAW_TEXT_PARSERS = { 1082: RAW, 1083: RAW, 1114: RAW, 1184: RAW, 1266: RAW };

async function createDatabase(PGlite, setupScripts) {
  const db = new PGlite({ parsers: RAW_TEXT_PARSERS });
  for (const sql of setupScripts) await db.exec(sql);
  return db;
}

// Runs a multi-statement script and returns one entry per statement.
async function runScript(db, sql) {
  const res = await db.exec(sql, { rowMode: 'array' });
  return res.map(r => ({
    fields: (r.fields || []).map(f => f.name),
    types: (r.fields || []).map(f => f.dataTypeID),
    rows: r.rows || [],
    affectedRows: r.affectedRows ?? 0,
  }));
}

function lastTable(results) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (results[i].fields.length) return results[i];
  }
  return null;
}

// int2, int4, int8, float4, float8, numeric
const NUMERIC_TYPES = new Set([20, 21, 23, 700, 701, 1700]);

// Canonical text for comparing values: numbers lose trailing zeros
// ('65000.00' -> '65000') and are rounded to 4 decimals; strings such as
// IDs ('00128') stay untouched.
function normalizeValue(v, type) {
  if (v === null || v === undefined) return null;
  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'bigint') v = Number(v);
  if (typeof v === 'number' || (NUMERIC_TYPES.has(type) && typeof v === 'string' && v !== 'NaN')) {
    const n = Math.round(Number(v) * 10000) / 10000;
    return String(n);
  }
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function normalizeTable(table) {
  if (!table) return null;
  return {
    fields: table.fields,
    rows: table.rows.map(r => r.map((v, i) => normalizeValue(v, table.types?.[i]))),
  };
}

// Compares two normalized tables. Column names are ignored; column order
// and values matter. Row order matters only when `ordered` is true.
function compareTables(expected, actual, ordered) {
  if (!actual) return { ok: false, reason: 'Câu lệnh của bạn không trả về bảng kết quả nào (cần có một câu SELECT ở cuối).' };
  if (!expected) return { ok: false, reason: 'Đáp án không có bảng kết quả.' };
  if (expected.fields.length !== actual.fields.length) {
    return { ok: false, reason: `Số cột khác nhau: mong đợi ${expected.fields.length} cột (${expected.fields.join(', ')}), bạn trả về ${actual.fields.length} cột.` };
  }
  const key = r => JSON.stringify(r);
  const exp = expected.rows.map(key);
  const act = actual.rows.map(key);
  if (exp.length !== act.length) {
    return { ok: false, reason: `Số dòng khác nhau: mong đợi ${exp.length} dòng, bạn trả về ${act.length} dòng.` };
  }
  if (ordered) {
    const sameSet = [...exp].sort().join('\n') === [...act].sort().join('\n');
    if (exp.join('\n') !== act.join('\n')) {
      return { ok: false, reason: sameSet ? 'Đúng các dòng nhưng SAI THỨ TỰ — kiểm tra lại order by.' : 'Giá trị các dòng chưa khớp với đáp án.' };
    }
    return { ok: true };
  }
  const count = new Map();
  for (const k of exp) count.set(k, (count.get(k) || 0) + 1);
  let missing = 0;
  for (const k of act) {
    const c = count.get(k) || 0;
    if (c === 0) missing++;
    else count.set(k, c - 1);
  }
  if (missing) return { ok: false, reason: `${missing} dòng trong kết quả của bạn không có trong đáp án.` };
  return { ok: true };
}

// Executes `sql` (then `check`, if given) and returns the normalized table
// used for grading. Unless `fresh`, everything runs inside a transaction
// that is rolled back, so the shared database is never modified.
async function produceTable(db, sql, check, fresh) {
  if (fresh) {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  }
  await db.exec('begin');
  try {
    const results = await runScript(db, sql);
    const table = check ? lastTable(await runScript(db, check)) : lastTable(results);
    return normalizeTable(table);
  } finally {
    await db.exec('rollback');
    await db.exec('reset role');
  }
}

// Grades one exercise. `getDb(fresh)` returns the database to use: the
// shared one, or a brand-new one for exercises marked `fresh`.
async function gradeExercise(getDb, ex, userSql, expected) {
  if (!ex.fresh && hasTxControl(userSql)) {
    return { ok: false, reason: 'Bài này được chấm bên trong một transaction tự động — hãy bỏ BEGIN/COMMIT/ROLLBACK khỏi câu trả lời.' };
  }
  // Fresh databases are single-use: close them once the run is done.
  const produce = async sql => {
    const db = await getDb(ex.fresh);
    try { return await produceTable(db, sql, ex.check, ex.fresh); }
    finally { if (ex.fresh) await db.close(); }
  };
  const exp = expected || await produce(ex.solution);
  let actual;
  try {
    actual = await produce(userSql);
  } catch (e) {
    return { ok: false, reason: 'Lỗi SQL: ' + e.message, error: true };
  }
  return { ...compareTables(exp, actual, ex.ordered), expected: exp, actual };
}

// Splits an answer file into blocks keyed by the `-- @ex <id>` markers.
function parseAnswerFile(text) {
  const blocks = new Map();
  let current = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^--\s*@ex\s+(\S+)/);
    if (m) { current = m[1]; blocks.set(current, []); continue; }
    if (current) blocks.get(current).push(line);
  }
  const out = new Map();
  for (const [id, lines] of blocks) out.set(id, lines.join('\n'));
  return out;
}

function isBlank(sql) {
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*--/.test(l))
    .join('')
    .trim() === '';
}

// Functional-dependency toolkit (Chapter 7): attribute closure, candidate keys,
// canonical cover, BCNF / 3NF tests and decompositions, lossless-join and
// dependency-preservation tests. Pure functions, no imports — inlined into
// playground.html by build.mjs and imported by the Node tests.
//
// Attributes are strings. Sets are arrays kept in schema order. Input syntax:
//   schema "ABCDE" (one letter each) or "ID, name, dept_name" (comma separated)
//   FDs one per line or separated by ";":  "A -> BC", "CD → E", "ID, x -> name"

function fdParseAttrs(text, letters) {
  const s = String(text).trim();
  if (!s) return [];
  if (letters) return [...s.replace(/[\s,{}()]/g, '')];
  return s.replace(/[{}()]/g, '').split(/[,\s]+/).filter(Boolean);
}

// Single-letter mode when the schema has no separators (e.g. "ABCDE").
function fdLetterMode(schemaText) {
  return !/[,\s]/.test(String(schemaText).trim().replace(/^[{(]|[)}]$/g, ''));
}

function fdParse(schemaText, fdText) {
  const letters = fdLetterMode(schemaText);
  const R = [...new Set(fdParseAttrs(schemaText, letters))];
  const errors = [];
  const fds = [];
  String(fdText).split(/[\n;]+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.split(/\s*(?:->|→|=>)\s*/);
    if (m.length !== 2) { errors.push(`Không đọc được "${line}" (cần dạng A -> B).`); return; }
    const lhs = [...new Set(fdParseAttrs(m[0], letters))];
    const rhs = [...new Set(fdParseAttrs(m[1], letters))];
    const unknown = [...lhs, ...rhs].filter(a => !R.includes(a));
    if (!lhs.length || !rhs.length) errors.push(`"${line}" thiếu vế trái hoặc vế phải.`);
    else if (unknown.length) errors.push(`"${line}": thuộc tính ${[...new Set(unknown)].join(', ')} không có trong R.`);
    else fds.push({ lhs, rhs });
  });
  return { R, fds, letters, errors };
}

const order = (R, xs) => R.filter(a => xs.includes(a));
const union = (R, ...sets) => order(R, [...new Set(sets.flat())]);
const minus = (a, b) => a.filter(x => !b.includes(x));
const subset = (a, b) => a.every(x => b.includes(x));
const same = (a, b) => a.length === b.length && subset(a, b);

function fdFormat(attrs, letters) {
  if (!attrs.length) return '∅';
  return letters ? attrs.join('') : attrs.join(', ');
}
function fdFormatFD(fd, letters) {
  return `${fdFormat(fd.lhs, letters)} → ${fdFormat(fd.rhs, letters)}`;
}

// α⁺ under fds, with the FDs used in order (textbook algorithm, Figure 7.8).
function fdClosure(R, fds, alpha) {
  let result = order(R, alpha);
  const steps = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const fd of fds) {
      if (subset(fd.lhs, result) && !subset(fd.rhs, result)) {
        const added = minus(fd.rhs, result);
        result = union(R, result, fd.rhs);
        steps.push({ fd, added, result });
        changed = true;
      }
    }
  }
  return { result, steps };
}

const fdIsSuperkey = (R, fds, K) => subset(R, fdClosure(R, fds, K).result);

function* subsetsOfSize(items, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc; return; }
