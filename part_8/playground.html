\u003cstrong>nhiều bộ xử lý/core\u003c/strong> cùng chạy. (Thực tế hầu hết hệ hiện nay đều song song vì CPU nhiều core.)\u003c/p>"},{"q":"\u003cstrong>PE 20.2\u003c/strong> — Vì sao lệnh nguyên tử dùng làm mutex phải kèm memory fence? Tiến trình phải làm gì trước khi nhả mutex?","en":"\u003cp>\u003cstrong>Exercise 20.2.\u003c/strong> On many architectures, atomic instructions such as compare-and-swap and test-and-set also perform a memory fence as part of the instruction. Considering data in shared memory that is protected by a mutex built from such an atomic instruction, explain why executing the memory fence is needed. Also explain what a process should do before it releases a mutex.\u003c/p>","answer":"\u003cp>CPU hiện đại có thể \u003cstrong>sắp xếp lại\u003c/strong> lệnh đọc/ghi bộ nhớ và giữ giá trị trong cache của core. Memory fence bảo đảm mọi thao tác bộ nhớ trước fence hoàn tất (và được thấy bởi core khác) trước các thao tác sau nó. Khi lấy mutex, fence bảo đảm tiến trình thấy \u003cstrong>mọi cập nhật\u003c/strong> mà chủ cũ của mutex đã làm trên dữ liệu được bảo vệ, kể cả khi cập nhật xảy ra ở core khác.\u003c/p>\n\u003cp>Trước khi nhả mutex, tiến trình phải \u003cstrong>thực hiện memory fence\u003c/strong> (đẩy hết các lệnh ghi lên dữ liệu dùng chung) rồi mới ghi giá trị \"mở khoá\" — nếu không, tiến trình tiếp theo có thể lấy được mutex nhưng vẫn đọc giá trị cũ.\u003c/p>"},{"q":"\u003cstrong>PE 20.3\u003c/strong> — Nhược điểm của việc giữ cấu trúc dùng chung (như lock table) trong bộ nhớ của một tiến trình riêng và truy cập qua IPC?","en":"\u003cp>\u003cstrong>Exercise 20.3.\u003c/strong> Rather than keeping shared structures in shared memory, an alternative architecture keeps them in the local memory of one special process, and other processes reach the shared data through interprocess communication with that process. What would be the disadvantage of this architecture?\u003c/p>","answer":"\u003cul>\u003cli>Mỗi lần xin khoá tốn \u003cstrong>hai message IPC\u003c/strong> (yêu cầu và xác nhận cấp khoá); IPC đắt hơn truy cập bộ nhớ rất nhiều → chi phí khoá tăng mạnh.\u003c/li>\u003cli>Tiến trình giữ cấu trúc trở thành \u003cstrong>nút thắt cổ chai\u003c/strong> (mọi yêu cầu xếp hàng qua nó).\u003c/li>\u003c/ul>\n\u003cp>Ưu điểm duy nhất: cấu trúc được bảo vệ tốt hơn khỏi cập nhật sai, vì chỉ một tiến trình truy cập.\u003c/p>"},{"q":"\u003cstrong>PE 20.4\u003c/strong> — Phân biệt latch và lock.","en":"\u003cp>\u003cstrong>Exercise 20.4.\u003c/strong> For transactional concurrency control, explain the difference between a latch and a lock.\u003c/p>","answer":"\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Latch\u003c/th>\u003cth>Lock\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bảo vệ\u003c/td>\u003ctd>cấu trúc dữ liệu \u003cstrong>nội bộ\u003c/strong> của hệ (trang buffer, mục lock table, node B+-tree)\u003c/td>\u003ctd>\u003cstrong>dữ liệu\u003c/strong> của database (tuple, trang, bảng)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thời gian giữ\u003c/td>\u003ctd>rất ngắn, trong một thao tác\u003c/td>\u003ctd>thường tới cuối giao dịch (hoặc một phần lớn)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Giao thức\u003c/td>\u003ctd>không theo two-phase locking, không phát hiện deadlock\u003c/td>\u003ctd>theo 2PL, có xử lý deadlock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ai giữ\u003c/td>\u003ctd>tiến trình/luồng\u003c/td>\u003ctd>giao dịch\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"q":"\u003cstrong>PE 20.5\u003c/strong> — 80% thời gian ở SQL (song song hoá được), 20% ở code C. Speedup tối đa nếu chỉ song song hoá SQL?","en":"\u003cp>\u003cstrong>Exercise 20.5.\u003c/strong> A transaction is written in C with embedded SQL; about 80 percent of its running time is spent in SQL code and the other 20 percent in C code. If parallelism is applied only to the SQL code, how much speedup can one hope for? Explain.\u003c/p>","answer":"\u003cp>Theo \u003cstrong>Amdahl\u003c/strong>: speedup = 1 / ((1 − p) + p/n) với p = 0.8. Khi n rất lớn, p/n → 0 nên speedup → 1 / 0.2 = \u003cstrong>5\u003c/strong>. Phần 20% tuần tự luôn tốn ít nhất 1/5 thời gian ban đầu, nên không thể nhanh hơn 5 lần dù có bao nhiêu bộ xử lý. Bài CH20.04 tính công thức này cho nhiều giá trị p, n.\u003c/p>"},{"q":"\u003cstrong>PE 20.6\u003c/strong> — Tiến trình A cập nhật cấu trúc rồi bật cờ, B chờ cờ rồi xử lý. Sự cố gì xảy ra khi lệnh ghi bị sắp xếp lại, và dùng sfence/lfence thế nào?","en":"\u003cp>\u003cstrong>Exercise 20.6.\u003c/strong> In a shared-memory system, process A updates a data structure and then sets a flag to signal that the update is finished. Process B watches the flag and begins processing the data structure only once it sees that the flag is set.\u003c/p>\n\u003cp>Explain what can go wrong on a memory architecture in which writes may be reordered, and explain how the sfence and lfence instructions can be used to prevent the problem.\u003c/p>","answer":"\u003cp>Nếu lệnh ghi bị sắp xếp lại, lệnh ghi \u003cstrong>cờ\u003c/strong> có thể tới bộ nhớ chính \u003cstrong>trước\u003c/strong> một số lệnh ghi lên cấu trúc. B thấy cờ đã bật nhưng chỉ đọc được \u003cstrong>một phần\u003c/strong> cập nhật → xử lý dữ liệu không nhất quán.\u003c/p>\n\u003cp>Cách khắc phục:\u003c/p>\n\u003cul>\u003cli>A thực hiện \u003cstrong>sfence\u003c/strong> (store fence) \u003cstrong>sau khi cập nhật cấu trúc, trước khi bật cờ\u003c/strong>; có thể thêm sfence sau khi bật cờ để đẩy cờ ra bộ nhớ sớm.\u003c/li>\u003cli>B thực hiện \u003cstrong>lfence\u003c/strong> (load fence) \u003cstrong>sau khi thấy cờ bật, trước khi đọc cấu trúc\u003c/strong>, để các lệnh đọc cấu trúc không bị thực hiện sớm hơn lệnh đọc cờ.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 20.7\u003c/strong> — Vì sao trong shared memory, thời gian truy cập một ô nhớ có thể phụ thuộc vào vị trí ô nhớ?","en":"\u003cp>\u003cstrong>Exercise 20.7.\u003c/strong> On a shared-memory architecture, why can the time needed to access a memory location depend on which location is accessed?\u003c/p>","answer":"\u003cp>Vì kiến trúc \u003cstrong>NUMA\u003c/strong>: bộ nhớ được chia theo node, mỗi bộ xử lý truy cập bộ nhớ \u003cstrong>cục bộ\u003c/strong> của nó nhanh hơn bộ nhớ gắn với bộ xử lý khác — truy cập xa phải đi qua kết nối giữa các bộ xử lý. Bài CH20.08 tính độ trễ trung bình local/remote từ số đo.\u003c/p>"},{"q":"\u003cstrong>PE 20.8\u003c/strong> — Vì sao trên NUMA, hệ điều hành cấp phát bộ nhớ cục bộ và tránh chuyển tiến trình giữa các core?","en":"\u003cp>\u003cstrong>Exercise 20.8.\u003c/strong> Most operating systems for parallel machines (i) allocate memory from a local memory area when a process asks for memory, and (ii) try not to move a process from one core to another. Why do these optimizations matter on a NUMA architecture?\u003c/p>","answer":"\u003cul>\u003cli>Cấp phát ở bộ nhớ cục bộ: dữ liệu của tiến trình nằm gần bộ xử lý đang chạy nó → truy cập nhanh.\u003c/li>\u003cli>Nếu chuyển tiến trình sang core ở node khác, dữ liệu đã cấp phát giờ thành \u003cstrong>bộ nhớ xa\u003c/strong>, mọi truy cập chậm đi; lợi ích của cấp phát cục bộ mất hết. Vì vậy hệ điều hành cố giữ tiến trình trên core cũ.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 20.9\u003c/strong> — Giải thích superlinear speedup bằng việc dữ liệu vừa/không vừa bộ nhớ.","en":"\u003cp>\u003cstrong>Exercise 20.9.\u003c/strong> Some database operations, such as joins, run much faster when the data (for example, one of the relations being joined) fits in memory than when it does not. Show how this explains \u003cem>superlinear speedup\u003c/em>, in which an application obtains a speedup larger than the increase in resources given to it.\u003c/p>","answer":"\u003cp>Ví dụ: join r ⋈ s, s lớn hơn bộ nhớ của một máy. Với 1 node phải dùng thuật toán ngoài (block nested-loop đọc s nhiều lần, hoặc hash join chia partition ghi ra đĩa). Khi tăng lên n node (hoặc tăng gấp đôi bộ nhớ), phần s trên mỗi node \u003cstrong>vừa bộ nhớ\u003c/strong>: mỗi node đọc dữ liệu đúng \u003cstrong>một lần\u003c/strong> và join trong RAM. Tổng I/O giảm nhiều hơn n lần, nên thời gian giảm \u003cstrong>nhiều hơn n lần\u003c/strong> → speedup > n.\u003c/p>\n\u003cp>Bài CH20.02 và CH20.09: workload Q3 (64 GB, mỗi node 16 GB RAM) có speedup 2 với 2 node (32 GB/node, chưa vừa RAM) nhưng \u003cstrong>5\u003c/strong> với 4 node (16 GB/node, vừa RAM).\u003c/p>"},{"q":"\u003cstrong>PE 20.10\u003c/strong> — Khác biệt chính giữa homogeneous và federated distributed database?","en":"\u003cp>\u003cstrong>Exercise 20.10.\u003c/strong> What is the essential difference between homogeneous and federated distributed database systems?\u003c/p>","answer":"\u003cp>Ở \u003cstrong>mức độ hợp tác và điều khiển tập trung\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Homogeneous\u003c/strong>: mọi site chạy cùng phần mềm DBMS, có chung một \u003cstrong>global schema\u003c/strong>, chủ động hợp tác xử lý truy vấn và giao dịch.\u003c/li>\u003cli>\u003cstrong>Federated (heterogeneous)\u003c/strong>: các site có thể có schema và phần mềm khác nhau (thường là các hệ có sẵn), giữ quyền tự chủ, chỉ hợp tác hạn chế; cần lớp trung gian để dịch schema và truy vấn.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 20.11\u003c/strong> — Vì sao khách hàng có thể chỉ thuê IaaS thay vì các dịch vụ cloud khác?","en":"\u003cp>\u003cstrong>Exercise 20.11.\u003c/strong> Why might a client choose to subscribe only to the basic infrastructure-as-a-service model instead of the services offered by the other cloud service models?\u003c/p>","answer":"\u003cul>\u003cli>Muốn \u003cstrong>tự kiểm soát ứng dụng\u003c/strong> của mình → không dùng SaaS.\u003c/li>\u003cli>Muốn \u003cstrong>tự chọn và tự quản lý DBMS\u003c/strong> (phiên bản, cấu hình, tối ưu, sản phẩm thương mại có license riêng) → không dùng PaaS/DBaaS.\u003c/li>\u003c/ul>\n\u003cp>IaaS chỉ cung cấp máy (ảo), lưu trữ, mạng; mọi phần mềm phía trên do khách hàng quyết định.\u003c/p>"},{"q":"\u003cstrong>PE 20.12\u003c/strong> — Vì sao chạy DBMS truyền thống trên cloud tốt nhất là trong virtual machine (dữ liệu ở storage ngoài)?","en":"\u003cp>\u003cstrong>Exercise 20.12.\u003c/strong> Assuming the data reside on external storage, why do cloud-computing services best support traditional database systems by running them in a virtual machine, rather than directly on the provider’s physical machine?\u003c/p>","answer":"\u003cp>Khi máy vật lý hỏng, các \u003cstrong>VM\u003c/strong> đang chạy trên nó có thể được \u003cstrong>khởi động lại nhanh\u003c/strong> trên một hoặc nhiều máy vật lý khác, vì dữ liệu vẫn truy cập được ở storage ngoài (được nhân bản hoặc có độ sẵn sàng cao). DBMS truyền thống không cần biết gì về việc chuyển máy → \u003cstrong>độ sẵn sàng\u003c/strong> cao hơn. VM còn giúp chia một máy lớn cho nhiều khách hàng và cô lập chúng.\u003c/p>"}],"exercises":[{"id":"CH20.01","topic":"speedup","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_run(workload, nodes, data_gb, seconds)\u003c/code>. Với workload \u003ccode>Q1\u003c/code> (dữ liệu cố định 100 GB), tính cho mỗi số node: \u003ccode>nodes\u003c/code>, \u003ccode>speedup\u003c/code> = thời gian với 1 node chia thời gian với \u003ccode>nodes\u003c/code> node, và \u003ccode>efficiency\u003c/code> = speedup / nodes. Làm tròn speedup và efficiency 2 chữ số. Sắp theo nodes.\u003c/p>","en":"","hint":"Lấy thời gian 1 node bằng subquery; round(x, 2).","solution":"select nodes,\n       round((select seconds from pd_run where workload = 'Q1' and nodes = 1) / seconds, 2) as speedup,\n       round((select seconds from pd_run where workload = 'Q1' and nodes = 1) / seconds / nodes, 2) as efficiency\nfrom pd_run\nwhere workload = 'Q1'\norder by nodes;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["nodes","speedup","efficiency"],"rows":[["1","1","1"],["2","1.9","0.95"],["4","3.64","0.91"],["8","6.67","0.83"],["16","10","0.63"]]}},{"id":"CH20.02","topic":"linear / sublinear / superlinear","level":2,"prompt":"\u003cp>Với các workload \u003ccode>Q1\u003c/code> và \u003ccode>Q3\u003c/code> (cùng dữ liệu, tăng node), phân loại mỗi lần chạy có \u003ccode>nodes &gt; 1\u003c/code>: \u003ccode>superlinear\u003c/code> nếu speedup > nodes, \u003ccode>linear\u003c/code> nếu speedup = nodes, ngược lại \u003ccode>sublinear\u003c/code> (speedup tính như CH20.01, không làm tròn). Trả về workload, nodes, \u003ccode>kind\u003c/code>, sắp theo workload, nodes.\u003c/p>","en":"","hint":"","solution":"select r.workload, r.nodes,\n       case when b.seconds / r.seconds > r.nodes then 'superlinear'\n            when b.seconds / r.seconds = r.nodes then 'linear'\n            else 'sublinear' end as kind\nfrom pd_run r join pd_run b on b.workload = r.workload and b.nodes = 1\nwhere r.workload in ('Q1', 'Q3') and r.nodes > 1\norder by r.workload, r.nodes;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["workload","nodes","kind"],"rows":[["Q1","2","sublinear"],["Q1","4","sublinear"],["Q1","8","sublinear"],["Q1","16","sublinear"],["Q3","2","linear"],["Q3","4","superlinear"],["Q3","8","sublinear"]]}},{"id":"CH20.03","topic":"scaleup","level":1,"prompt":"\u003cp>Workload \u003ccode>Q2\u003c/code> tăng dữ liệu tỉ lệ với số node (10 GB mỗi node). Tính \u003ccode>scaleup\u003c/code> = thời gian của lần chạy 1 node chia thời gian của lần chạy \u003ccode>nodes\u003c/code> node, làm tròn 3 chữ số. Trả về nodes, data_gb, scaleup, sắp theo nodes. Scaleup tuyến tính thì giá trị là bao nhiêu?\u003c/p>","en":"","hint":"","solution":"select nodes, data_gb,\n       round((select seconds from pd_run where workload = 'Q2' and nodes = 1) / seconds, 3) as scaleup\nfrom pd_run\nwhere workload = 'Q2'\norder by nodes;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["nodes","data_gb","scaleup"],"rows":[["1","10","1"],["2","20","0.952"],["4","40","0.87"],["8","80","0.8"],["16","160","0.625"]]}},{"id":"CH20.04","topic":"Amdahl","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_amdahl(task, p, n)\u003c/code>: p là phần song song hoá được, n là số bộ xử lý. Tính speedup theo Amdahl \u003ccode>1 / ((1 − p) + p / n)\u003c/code> cho mỗi task, làm tròn 3 chữ số (cột \u003ccode>speedup\u003c/code>). Task \u003ccode>PE20.5\u003c/code> là PE 20.5 với n rất lớn.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 20.5.\u003c/strong> A transaction is written in C with embedded SQL; about 80 percent of its running time is spent in SQL code and the other 20 percent in C code. If parallelism is applied only to the SQL code, how much speedup can one hope for? Explain.\u003c/p>","hint":"","solution":"select task, round(1 / ((1 - p) + p / n), 3) as speedup\nfrom pd_amdahl;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["task","speedup"],"rows":[["A","2.5"],["B","4"],["C","9.143"],["D","1.98"],["PE20.5","5"]]}},{"id":"CH20.05","topic":"Amdahl: giới hạn","level":2,"prompt":"\u003cp>Với mỗi task trong \u003ccode>pd_amdahl\u003c/code>, trả về \u003ccode>max_speedup\u003c/code> = giới hạn của speedup khi n → ∞ (làm tròn 2 chữ số) và \u003ccode>pct_of_max\u003c/code> = speedup thật với n của task chia max_speedup, nhân 100, làm tròn 1 chữ số.\u003c/p>","en":"","hint":"","solution":"select task,\n       round(1 / (1 - p), 2) as max_speedup,\n       round(100 * (1 / ((1 - p) + p / n)) / (1 / (1 - p)), 1) as pct_of_max\nfrom pd_amdahl;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["task","max_speedup","pct_of_max"],"rows":[["A","5","50"],["B","5","80"],["C","20","45.7"],["D","2","99"],["PE20.5","5","100"]]}},{"id":"CH20.06","topic":"skew","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_job_task(job, node, seconds)\u003c/code>. Một job song song chỉ xong khi node chậm nhất xong. Với mỗi job, trả về \u003ccode>job_time\u003c/code> (thời gian job), \u003ccode>avg_time\u003c/code> (thời gian trung bình các node, làm tròn 2) và \u003ccode>skew\u003c/code> = job_time / avg_time (làm tròn 2). Sắp theo job.\u003c/p>","en":"","hint":"","solution":"select job,\n       max(seconds) as job_time,\n       round(avg(seconds), 2) as avg_time,\n       round(max(seconds) / avg(seconds), 2) as skew\nfrom pd_job_task\ngroup by job\norder by job;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["job","job_time","avg_time","skew"],"rows":[["J1","11","10","1.1"],["J2","25","10","2.5"],["J3","8","8","1"]]}},{"id":"CH20.07","topic":"kiến trúc song song","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_system(name, shared_memory, shared_disk)\u003c/code>. Phân loại mỗi hệ: \u003ccode>shared memory\u003c/code> nếu dùng chung bộ nhớ, \u003ccode>shared disk\u003c/code> nếu chỉ dùng chung đĩa, \u003ccode>shared nothing\u003c/code> nếu không dùng chung gì. Trả về name, \u003ccode>architecture\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select name,\n       case when shared_memory then 'shared memory'\n            when shared_disk then 'shared disk'\n            else 'shared nothing' end as architecture\nfrom pd_system;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["name","architecture"],"rows":[["Multicore server","shared memory"],["Oracle RAC cluster","shared disk"],["Teradata","shared nothing"],["Hadoop cluster","shared nothing"],["SAN cluster","shared disk"]]}},{"id":"CH20.08","topic":"NUMA","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_proc(proc, home_node)\u003c/code> và \u003ccode>pd_mem_access(proc, mem_node, ns)\u003c/code> (độ trễ đo được). Với mỗi bộ xử lý, trả về \u003ccode>local_ns\u003c/code> (độ trễ tới bộ nhớ node của chính nó), \u003ccode>remote_ns\u003c/code> (trung bình độ trễ tới các node khác) và \u003ccode>ratio\u003c/code> = remote_ns / local_ns làm tròn 2. Sắp theo proc.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 20.7.\u003c/strong> On a shared-memory architecture, why can the time needed to access a memory location depend on which location is accessed?\u003c/p>","hint":"","solution":"select p.proc,\n       max(m.ns) filter (where m.mem_node = p.home_node) as local_ns,\n       avg(m.ns) filter (where m.mem_node \u003c> p.home_node) as remote_ns,\n       round(avg(m.ns) filter (where m.mem_node \u003c> p.home_node)\n             / max(m.ns) filter (where m.mem_node = p.home_node), 2) as ratio\nfrom pd_proc p join pd_mem_access m on m.proc = p.proc\ngroup by p.proc\norder by p.proc;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["proc","local_ns","remote_ns","ratio"],"rows":[["P0","80","140","1.75"],["P1","82","138","1.68"],["P2","78","145","1.86"],["P3","80","150","1.88"]]}},{"id":"CH20.09","topic":"superlinear speedup","level":2,"prompt":"\u003cp>Workload \u003ccode>Q3\u003c/code> là một join 64 GB; mỗi node có \u003cstrong>16 GB\u003c/strong> RAM. Với mỗi lần chạy của Q3, trả về nodes, \u003ccode>gb_per_node\u003c/code> (data_gb / nodes, kiểu numeric, làm tròn 1), \u003ccode>fits_in_memory\u003c/code> (boolean: gb_per_node ≤ 16) và \u003ccode>speedup\u003c/code> (làm tròn 2). Sắp theo nodes. Speedup vượt số node bắt đầu từ lúc nào?\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 20.9.\u003c/strong> Some database operations, such as joins, run much faster when the data (for example, one of the relations being joined) fits in memory than when it does not. Show how this explains \u003cem>superlinear speedup\u003c/em>, in which an application obtains a speedup larger than the increase in resources given to it.\u003c/p>","hint":"","solution":"select nodes,\n       round(data_gb::numeric / nodes, 1) as gb_per_node,\n       data_gb::numeric / nodes \u003c= 16 as fits_in_memory,\n       round((select seconds from pd_run where workload = 'Q3' and nodes = 1) / seconds, 2) as speedup\nfrom pd_run\nwhere workload = 'Q3'\norder by nodes;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["nodes","gb_per_node","fits_in_memory","speedup"],"rows":[["1","64","false","1"],["2","32","false","2"],["4","16","true","5"],["8","8","true","7.5"]]}}]},{"key":"ch21","store":"21","short":"21","label":"Chương 21","navLabel":"Chương 21","kind":"Chương","title":"Parallel and Distributed Storage","titleVi":"Lưu trữ song song và phân tán","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 21 ngoài lịch học CS4420. Bài SQL mô phỏng: gán tuple vào node theo round-robin / hash / range, đo skew, tính vector phân hoạch từ histogram (PE 21.2), dùng \u003cstrong>declarative partitioning\u003c/strong> thật của PostgreSQL, và xử lý replica / master.\u003c/p>\n\u003ch3>1. Data partitioning (slide 21.3–21.12)\u003c/h3>\n\u003cp>Chia tuple của một relation lên n node (n đĩa) để đọc/ghi song song. Ba kỹ thuật cơ bản:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Round-robin\u003c/strong>: tuple thứ i (theo thứ tự chèn) về node i mod n. Chia đều tuyệt đối; nhưng truy vấn điểm hay truy vấn khoảng đều phải đọc \u003cstrong>mọi\u003c/strong> node.\u003c/li>\u003cli>\u003cstrong>Hash partitioning\u003c/strong>: chọn \u003cem>partitioning attribute\u003c/em>, node = h(giá trị) mod n. Truy vấn điểm (\u003ccode>where key = v\u003c/code>) chỉ đọc \u003cstrong>một\u003c/strong> node; truy vấn khoảng vẫn phải đọc mọi node. Đều nếu h tốt và giá trị khoá ít trùng.\u003c/li>\u003cli>\u003cstrong>Range partitioning\u003c/strong>: dùng \u003cem>partitioning vector\u003c/em> [v\u003csub>0\u003c/sub>, v\u003csub>1\u003c/sub>, …, v\u003csub>n−2\u003c/sub>]: giá trị \u003c v\u003csub>0\u003c/sub> về node 0, v\u003csub>i\u003c/sub> ≤ x \u003c v\u003csub>i+1\u003c/sub> về node i + 1, ≥ v\u003csub>n−2\u003c/sub> về node n − 1. Truy vấn điểm và truy vấn khoảng chỉ đọc các node có khoảng giao với điều kiện.\u003c/li>\u003cli>Range query chỉ chạm một node (PE 21.1): tốt khi khoảng hẹp (ít overhead, nhiều truy vấn chạy song song); xấu khi khoảng rộng (một node làm hết, mất song song) và tạo \u003cstrong>hot spot\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>2. Skew (slide 21.13–21.20)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Data-distribution skew\u003c/strong>: số tuple mỗi node lệch nhau — do \u003cem>attribute-value skew\u003c/em> (nhiều tuple cùng giá trị, mọi tuple cùng giá trị buộc phải về cùng node) hoặc \u003cem>partition skew\u003c/em> (vector range chọn kém, hàm hash tồi).\u003c/li>\u003cli>\u003cstrong>Execution skew\u003c/strong>: dữ liệu chia đều nhưng \u003cstrong>tải truy vấn\u003c/strong> dồn vào vài partition (dữ liệu \"nóng\"). Histogram trên giá trị thuộc tính không thấy được điều này; phải dùng \u003cstrong>tần suất truy cập\u003c/strong> của workload để chọn vector (PE 21.3).\u003c/li>\u003cli>\u003cstrong>Load-balanced range partitioning\u003c/strong> từ \u003cstrong>histogram\u003c/strong> (equi-depth): mỗi partition nhận N/p tuple; trong một bucket giả sử giá trị phân bố đều (PE 21.2).\u003c/li>\u003cli>\u003cstrong>Virtual nodes\u003c/strong>: chia thành nhiều partition nhỏ hơn số node thật, ánh xạ partition → node bằng bảng (\u003cem>partition table\u003c/em>) để cân bằng lại dễ dàng; partition quá lớn thì \u003cstrong>tách\u003c/strong> (giống tách node B+-tree), partition nóng thì chuyển sang node khác.\u003c/li>\u003c/ul>\n\u003ch3>3. Replication (slide 21.21–21.28)\u003c/h3>\n\u003cul>\u003cli>Lưu nhiều bản sao (replica) của mỗi partition trên các node khác nhau → chịu lỗi node, đọc song song.\u003c/li>\u003cli>Bản sao của dữ liệu thuộc một node nên \u003cstrong>rải lên nhiều node khác\u003c/strong> (thay vì một node dự phòng): khi node hỏng, tải được chia cho nhiều node (PE 21.6a).\u003c/li>\u003cli>Replica qua các \u003cstrong>data center\u003c/strong> xa nhau: chịu được thảm hoạ/mất điện cả data center; đọc gần người dùng (PE 21.4a).\u003c/li>\u003cli>\u003cstrong>Primary (master) replica\u003c/strong>: mọi cập nhật đi qua master, sau đó truyền tới các replica khác. Master có thể chọn theo partition hoặc \u003cstrong>theo record\u003c/strong> (PE 21.8).\u003c/li>\u003cli>Cập nhật replica: \u003cstrong>synchronous\u003c/strong> (cùng giao dịch, chậm nhưng nhất quán) hay \u003cstrong>asynchronous\u003c/strong> (nhanh, có thể đọc dữ liệu cũ). Chi tiết ở Chương 23.\u003c/li>\u003c/ul>\n\u003ch3>4. Parallel indexing (slide 21.29–21.33)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Local index\u003c/strong>: mỗi node đánh chỉ mục phần dữ liệu của nó.\u003c/li>\u003cli>\u003cstrong>Global primary index\u003c/strong>: index trên partitioning attribute.\u003c/li>\u003cli>\u003cstrong>Global secondary index\u003c/strong>: index trên thuộc tính khác, được chia theo giá trị index key; mỗi entry trỏ tới \u003cstrong>partitioning key\u003c/strong> (không trỏ thẳng tới vị trí vật lý) — để tuple chuyển node/tách partition không phải sửa index (PE 21.5).\u003c/li>\u003c/ul>\n\u003ch3>5. Distributed file systems & key-value stores (slide 21.34–21.50)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Distributed file system\u003c/strong> (Google FS, HDFS): file chia thành block lớn (64–128 MB) nhân bản trên nhiều máy; \u003cstrong>NameNode\u003c/strong> giữ metadata, \u003cstrong>DataNode\u003c/strong> giữ block. Tối ưu cho đọc tuần tự file lớn.\u003c/li>\u003cli>\u003cstrong>Sharding\u003c/strong>: chia dữ liệu theo khoá ở tầng ứng dụng lên nhiều database. Đơn giản nhưng ứng dụng phải tự định tuyến, join/giao dịch xuyên shard khó.\u003c/li>\u003cli>\u003cstrong>Key-value store / NoSQL\u003c/strong> (Bigtable, HBase, Cassandra, MongoDB, DynamoDB): API \u003ccode>get(key)\u003c/code>, \u003ccode>put(key, value)\u003c/code>, \u003ccode>delete(key)\u003c/code>, có thể quét theo khoảng khoá. Dữ liệu chia thành \u003cstrong>tablet\u003c/strong> theo khoảng khoá; \u003cstrong>tablet server\u003c/strong>; \u003cstrong>master\u003c/strong> quản lý ánh xạ tablet → server.\u003c/li>\u003cli>Range partitioning cho phép \u003cstrong>tách tablet\u003c/strong> khi quá lớn (như tách lá B+-tree); hash partitioning khó tách (như bucket của hash index) (PE 21.7a). Hash rồi range trên giá trị hash: đơn giản hoá kiểu khoá, nhưng mất truy vấn khoảng (PE 21.7b).\u003c/li>\u003c/ul>\n\u003ch3>6. PostgreSQL declarative partitioning (thực hành)\u003c/h3>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>create table t (id int, amount int) partition by range (amount);\ncreate table t_p0 partition of t for values from (minvalue) to (200);\ncreate table t_p1 partition of t for values from (200) to (500);  -- [200, 500)\ncreate table t_h0 partition of h for values with (modulus 4, remainder 0);  -- hash\nselect tableoid::regclass, count(*) from t group by 1;  -- tuple nằm ở partition nào\u003c/code>\u003c/pre>\n\u003cp>Đây là partitioning \u003cstrong>trên một máy\u003c/strong> (để pruning, bảo trì), nhưng cùng ý tưởng range/list/hash.\u003c/p>\n\u003ch3>Tóm tắt so sánh\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Round-robin\u003c/th>\u003cth>Hash\u003c/th>\u003cth>Range\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Quét toàn bộ\u003c/td>\u003ctd>tốt\u003c/td>\u003ctd>tốt\u003c/td>\u003ctd>tốt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Truy vấn điểm theo khoá\u003c/td>\u003ctd>đọc mọi node\u003c/td>\u003ctd>\u003cstrong>1 node\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1 node\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Truy vấn khoảng\u003c/td>\u003ctd>đọc mọi node\u003c/td>\u003ctd>đọc mọi node\u003c/td>\u003ctd>\u003cstrong>chỉ các node liên quan\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chia đều\u003c/td>\u003ctd>tuyệt đối\u003c/td>\u003ctd>tốt nếu khoá đa dạng\u003c/td>\u003ctd>phụ thuộc vector (dùng histogram)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Kỹ thuật partitioning nào trả lời truy vấn khoảng \u003ccode>where amount between 200 and 300\u003c/code> mà chỉ cần đọc một phần các node?","options":["Round-robin","Hash","Range","Không kỹ thuật nào"],"answer":2,"explain":"Chỉ range partitioning giữ thứ tự giá trị."},{"q":"Kỹ thuật nào chia đều tuple tuyệt đối nhưng không hỗ trợ truy vấn điểm?","options":["Round-robin","Hash","Range","List"],"answer":0,"explain":"Tuple i về node i mod n, không liên quan tới giá trị."},{"q":"Hash partitioning trên \u003ccode>customer\u003c/code>, một khách có 40% số đơn hàng. Hậu quả?","options":["Không ảnh hưởng","Attribute-value skew: node chứa khách đó quá tải","Execution skew không thể xảy ra","Hash sẽ tự tách"],"answer":1,"explain":"Mọi tuple cùng giá trị khoá phải về cùng một node."},{"q":"Histogram trên giá trị thuộc tính giúp tránh loại skew nào?","options":["Execution skew","Data-distribution skew","Cả hai","Không loại nào"],"answer":1,"explain":"PE 21.3: execution skew cần tần suất truy cập của workload."},{"q":"PE 21.2a: tổng tần suất 100, chia 5 partition. Mỗi partition nên có bao nhiêu tuple?","options":["10","20","25","5"],"answer":1,"explain":"N/p = 100/5."},{"q":"Vì sao global secondary index nên trỏ tới partitioning key thay vì (số partition, record id)?","options":["Tiết kiệm chỗ","Khi partition bị tách hoặc chuyển node, không phải cập nhật hàng loạt entry của index","Nhanh hơn khi đọc","Bắt buộc theo SQL"],"answer":1,"explain":"PE 21.5a."},{"q":"Vì sao rải bản sao dữ liệu của node N lên nhiều node thay vì một node dự phòng?","options":["Ít tốn chỗ hơn","Khi N hỏng, tải của N được chia cho nhiều node","Dễ backup","Để dùng RAID"],"answer":1,"explain":"PE 21.6a."},{"q":"Vì sao range partitioning kiểm soát kích thước tablet tốt hơn hash?","options":["Range nhanh hơn","Tablet quá đầy có thể tách tại một giá trị giữa khoảng (như tách lá B+-tree)","Hash không chia được","Range dùng ít bộ nhớ"],"answer":1,"explain":"PE 21.7a."}],"questions":[{"q":"\u003cstrong>PE 21.1\u003c/strong> — Truy vấn khoảng trên thuộc tính range-partitioned có thể chỉ cần đọc một đĩa. Ưu và nhược điểm?","en":"\u003cp>\u003cstrong>Exercise 21.1.\u003c/strong> For a range selection on a range-partitioned attribute, it may happen that only one disk has to be accessed. Describe the advantages and disadvantages of this property.\u003c/p>","answer":"\u003cp>\u003cstrong>Ưu\u003c/strong>: nếu khoảng chứa ít tuple, truy vấn chạy nhanh trên một đĩa; không tốn chi phí khởi động truy vấn trên nhiều đĩa; nhiều truy vấn như vậy chạy \u003cstrong>song song\u003c/strong> trên các đĩa khác nhau → throughput cao.\u003c/p>\n\u003cp>\u003cstrong>Nhược\u003c/strong>: nếu khoảng chứa nhiều tuple, một đĩa làm hết việc, \u003cstrong>không có song song bên trong truy vấn\u003c/strong> → response time lớn. Một số đĩa có thể thành \u003cstrong>hot spot\u003c/strong>.\u003c/p>\n\u003cp>Giải pháp kết hợp: \u003cem>hybrid range partitioning\u003c/em> — chia thành nhiều khoảng nhỏ (vài block) rồi gán các khoảng nhỏ đó vào đĩa theo kiểu round-robin. Bài CH21.06 đếm số node phải đọc với range và round-robin.\u003c/p>"},{"q":"\u003cstrong>PE 21.2\u003c/strong> — (a) Tìm hàm range partitioning cân bằng 5 partition từ histogram cho trước; (b) viết thuật toán tổng quát.","en":"\u003cp>\u003cstrong>Exercise 21.2.\u003c/strong> Recall that histograms are used to build load-balanced range partitions.\u003c/p>\n\u003cp>a. A histogram covers values 1 to 100, split into the 10 ranges 1–10, 11–20, …, 91–100, whose frequencies are, in order, 15, 5, 20, 10, 10, 5, 5, 20, 5, and 5. Give a load-balanced range-partitioning function that splits the values into five partitions.\u003c/p>\n\u003cp>b. Write an algorithm that computes a balanced range partitioning with p partitions, given a histogram of frequency distributions with n ranges.\u003c/p>","answer":"\u003cp>a. Tổng tần suất N = 100 → mỗi partition 20 tuple. Giả sử trong mỗi bucket mọi giá trị đều có khả năng như nhau. Cộng dồn: 15, 20, 40, 50, 60, 65, 70, 90, 95, 100.\u003c/p>\n\u003cul>\u003cli>tuple thứ 20 kết thúc ở cuối bucket 11–20 → partition 2 bắt đầu ở \u003cstrong>21\u003c/strong>;\u003c/li>\u003cli>tuple thứ 40 kết thúc ở cuối bucket 21–30 → bắt đầu ở \u003cstrong>31\u003c/strong>;\u003c/li>\u003cli>tuple thứ 60 kết thúc ở cuối bucket 41–50 → \u003cstrong>51\u003c/strong>;\u003c/li>\u003cli>tuple thứ 80: bucket 71–80 (20 tuple, đã có 70 trước đó) cần 10 tuple = nửa bucket → \u003cstrong>76\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Vector [21, 31, 51, 76]: các partition 1–20, 21–30, 31–50, 51–75, 76–100.\u003c/p>\n\u003cp>b. Thuật toán: N = Σ n\u003csub>j\u003c/sub>. Với i = 1 … p − 1, mục tiêu k\u003csub>i\u003c/sub> = i·N/p. Tìm bucket h\u003csub>j\u003c/sub> (từ s\u003csub>j\u003c/sub> đến e\u003csub>j\u003c/sub>, tần suất n\u003csub>j\u003c/sub>) mà tổng cộng dồn C\u003csub>j−1\u003c/sub> \u003c k\u003csub>i\u003c/sub> ≤ C\u003csub>j\u003c/sub>. Điểm cắt v\u003csub>i\u003c/sub> = s\u003csub>j\u003c/sub> + (k\u003csub>i\u003c/sub> − C\u003csub>j−1\u003c/sub>) / n\u003csub>j\u003c/sub> · (e\u003csub>j\u003c/sub> − s\u003csub>j\u003c/sub> + 1). Vector là [v\u003csub>1\u003c/sub>, …, v\u003csub>p−1\u003c/sub>]. Quét histogram một lần nên O(n + p). Bài CH21.07 cài thuật toán này bằng SQL.\u003c/p>"},{"q":"\u003cstrong>PE 21.3\u003c/strong> — Vì sao histogram trên giá trị thuộc tính tránh được data-distribution skew nhưng không tránh được execution skew? Dùng workload truy vấn điểm để thiết kế partitioning ra sao?","en":"\u003cp>\u003cstrong>Exercise 21.3.\u003c/strong> Histograms are usually built on the values of a particular attribute (or set of attributes) of a relation. Such histograms help avoid data-distribution skew but are of little use for avoiding execution skew. Explain why.\u003c/p>\n\u003cp>Now suppose you have a workload of queries that do point lookups. Explain how the queries of the workload can be used to design a partitioning scheme that avoids execution skew.\u003c/p>","answer":"\u003cp>Histogram cho biết \u003cstrong>có bao nhiêu tuple\u003c/strong> ở mỗi khoảng giá trị → chia sao cho số tuple mỗi partition bằng nhau. Nhưng execution skew do \u003cstrong>tần suất truy cập\u003c/strong>: vài giá trị (hay vài khoảng) được truy vấn nhiều hơn hẳn; partition chứa chúng bị quá tải dù số tuple bằng các partition khác.\u003c/p>\n\u003cp>Với workload truy vấn điểm: đếm số lần truy vấn rơi vào mỗi giá trị/khoảng (từ log truy vấn), xây \u003cstrong>histogram của tải\u003c/strong> (số truy cập theo khoảng giá trị) thay vì số tuple, rồi chọn vector sao cho \u003cstrong>tổng số truy cập\u003c/strong> mỗi partition bằng nhau (cùng thuật toán như PE 21.2b). Có thể cân bằng theo tổ hợp cả số tuple lẫn tải, và giá trị cực nóng có thể nhân bản để chia tải đọc.\u003c/p>"},{"q":"\u003cstrong>PE 21.4\u003c/strong> — (a) Hai lý do nhân bản dữ liệu qua nhiều data center; (b) replication trong CSDL tập trung khác gì trong CSDL song song/phân tán?","en":"\u003cp>\u003cstrong>Exercise 21.4.\u003c/strong> Replication:\u003c/p>\n\u003cp>a. Give two reasons for replicating data across geographically distributed data centers.\u003c/p>\n\u003cp>b. Centralized databases support replication by means of log records. How does replication in centralized databases differ from replication in parallel/distributed databases?\u003c/p>","answer":"\u003cp>a. (1) \u003cstrong>Sẵn sàng khi cả data center hỏng\u003c/strong> (mất điện, thiên tai): dữ liệu vẫn còn ở data center khác; đặt xa nhau để một thảm hoạ không ảnh hưởng cả hai. (2) \u003cstrong>Độ trễ thấp\u003c/strong>: người dùng đọc từ data center gần mình.\u003c/p>\n\u003cp>b. CSDL tập trung thường chỉ hỗ trợ \u003cstrong>nhân bản toàn bộ database\u003c/strong> bằng cách gửi log record sang một bản sao (một số hệ có logical replication cho vài relation). Không có partitioning và không thể nhân bản \u003cstrong>các phần khác nhau\u003c/strong> của database lên \u003cstrong>các node khác nhau\u003c/strong>. Hệ song song/phân tán nhân bản theo partition, rải bản sao lên nhiều node, nên khi một node hỏng tải được chia cho nhiều node.\u003c/p>"},{"q":"\u003cstrong>PE 21.5\u003c/strong> — (a) Vì sao global secondary index lưu (số partition, record id) là ý tồi? (b) Vì sao cài đặt global secondary index giống local secondary index trên file tổ chức B+-tree?","en":"\u003cp>\u003cstrong>Exercise 21.5.\u003c/strong> Parallel indices:\u003c/p>\n\u003cp>a. In a centralized database, secondary indices store the record identifier. A global secondary index could likewise store the number of the partition that holds the record together with a record identifier inside that partition. Why would this be a bad idea?\u003c/p>\n\u003cp>b. Global secondary indices are implemented much like the local secondary indices used when records are stored in a B\u003csup>+\u003c/sup>-tree file organization. Explain what the two situations have in common that leads to a similar implementation of the secondary indices.\u003c/p>","answer":"\u003cp>a. Partition thường bị \u003cstrong>tách\u003c/strong> hoặc \u003cstrong>chuyển node\u003c/strong> để cân bằng tải; khi đó vị trí của rất nhiều record đổi, kéo theo phải sửa hàng loạt entry trong secondary index.\u003c/p>\n\u003cp>b. Trong cả hai trường hợp record có thể \u003cstrong>di chuyển\u003c/strong> (sang node khác; hoặc sang vị trí khác trong file khi lá B+-tree tách). Nếu index lưu con trỏ vật lý thì phải sửa nhiều. Cách giải chung: secondary index lưu \u003cstrong>khoá\u003c/strong> (partitioning key / clustering key) của record; tra secondary index ra khoá, rồi tra theo khoá để tìm record. Record di chuyển mà khoá không đổi thì không phải sửa secondary index.\u003c/p>"},{"q":"\u003cstrong>PE 21.6\u003c/strong> — (a) Vì sao rải bản sao dữ liệu của một node lên nhiều node khác? (b) Ưu, nhược của RAID so với lưu thêm một bản sao mỗi data item?","en":"\u003cp>\u003cstrong>Exercise 21.6.\u003c/strong> Parallel database systems keep replicas of every data item (or partition) on more than one node.\u003c/p>\n\u003cp>a. Why is it better to spread the copies of the data items assigned to a node over several other nodes, rather than keeping all of those copies on the same node (or set of nodes)?\u003c/p>\n\u003cp>b. What are the advantages and disadvantages of using RAID storage instead of storing an extra copy of every data item?\u003c/p>","answer":"\u003cp>a. - Khi node hỏng, việc của nó được \u003cstrong>chia đều cho nhiều node\u003c/strong> còn lại thay vì dồn vào một node (node đó sẽ chịu gấp đôi tải).\u003c/p>\n\u003cul>\u003cli>Ngay cả khi không hỏng, có thể đọc từ nhiều bản sao để giảm hot spot cho các giao dịch chỉ đọc.\u003c/li>\u003c/ul>\n\u003cp>Bài CH21.10 đếm số item mỗi node nhận khi N2 hỏng.\u003c/p>\n\u003cp>b. RAID 1 (mirroring) cũng lưu thêm một bản sao, nhưng do phần cứng/bộ điều khiển đĩa làm, DBMS chỉ cần ghi một lần. Nhưng RAID chỉ chống \u003cstrong>hỏng đĩa\u003c/strong> trong một máy; máy hỏng thì dữ liệu không truy cập được, trong khi bản sao do DBMS đặt ở \u003cstrong>node khác\u003c/strong> chống được cả hỏng node. RAID 5 tốn ít chỗ hơn mirroring nhưng ghi chậm hơn và dựng lại đĩa hỏng tốn kém.\u003c/p>"},{"q":"\u003cstrong>PE 21.7\u003c/strong> — (a) Vì sao range partitioning kiểm soát kích thước tablet tốt hơn hash (so sánh B+-tree với hash index)? (b) Hash khoá rồi range trên giá trị hash: động lực và nhược điểm? (c) Horizontal rồi vertical tại mỗi node so với vertical rồi horizontal?","en":"\u003cp>\u003cstrong>Exercise 21.7.\u003c/strong> Partitioning and replication.\u003c/p>\n\u003cp>a. Explain why range partitioning gives better control over tablet sizes than hash partitioning. Draw an analogy between this situation and B\u003csup>+\u003c/sup>-tree indices versus hash indices.\u003c/p>\n\u003cp>b. Some systems first hash the key and then apply range partitioning to the hash values. What could motivate this choice, and what are its disadvantages compared with range partitioning directly on the key?\u003c/p>\n\u003cp>c. Data can be partitioned horizontally and then partitioned vertically locally at each node. The opposite is also possible: partition vertically first, then partition each vertical fragment horizontally on its own. What are the benefits of the first option over the second?\u003c/p>","answer":"\u003cp>a. Với range partitioning, tablet quá lớn được \u003cstrong>tách\u003c/strong> tại một giá trị ở giữa khoảng thành hai tablet, không ảnh hưởng tablet khác — giống \u003cstrong>tách lá B+-tree\u003c/strong> khi đầy. Hash partitioning cố định số bucket; muốn tách một bucket quá đầy phải đổi hàm hash (giống hash index: bucket tràn khó tách; chỉ các kỹ thuật dynamic hashing như linear/extendable hashing mới làm được).\u003c/p>\n\u003cp>b. Động lực: hash ánh xạ mọi kiểu khoá về một kiểu số, phân bố đều, đơn giản hoá phân hoạch và tránh skew do khoá tuần tự (ví dụ timestamp tăng dần dồn vào một tablet). Vẫn tách tablet được vì range trên giá trị hash. Nhược: \u003cstrong>mất truy vấn khoảng\u003c/strong> theo khoá — phải quét mọi tablet.\u003c/p>\n\u003cp>c. Horizontal trước rồi vertical tại chỗ: mọi phần của một record nằm trên \u003cstrong>cùng một node\u003c/strong>, ghép lại record không cần truyền mạng. Vertical trước rồi horizontal độc lập: các mảnh của cùng một record có thể nằm ở các node khác nhau, phải truyền dữ liệu để ghép.\u003c/p>"},{"q":"\u003cstrong>PE 21.8\u003c/strong> — (a) Master đổi trong lúc request đang tới; (b) hai lợi ích của master theo record; (c) theo dõi master của rất nhiều record thế nào?","en":"\u003cp>\u003cstrong>Exercise 21.8.\u003c/strong> To send a request to the master replica of a data item, a node must know which replica is currently the master for that item.\u003c/p>\n\u003cp>a. Suppose that after a node determines which node is the master replica of a data item, but before its request arrives there, mastership changes and another node becomes the master. How can this situation be handled?\u003c/p>\n\u003cp>b. The master replica can be chosen per partition, but some systems support a per-record master: the records of a partition (or tablet) are replicated on a set of nodes, and each record’s master may be any node of that set, independently of the masters of other records. Give two benefits of tracking the master per record.\u003c/p>\n\u003cp>c. Suggest how the master replica of every record can be tracked when there is a very large number of records.\u003c/p>","answer":"\u003cp>a. Node nhận request mà không còn là master trả về \u003cstrong>lỗi kèm lý do\u003c/strong> (\"không phải master\"); node gửi tra lại master hiện tại và gửi lại. Hoặc master cũ \u003cstrong>chuyển tiếp\u003c/strong> request tới master mới, master mới trả lời trực tiếp cho node gửi. Bài CH21.11 xác định request nào phải chuyển hướng.\u003c/p>\n\u003cp>b. (1) Đặt master của mỗi record ở \u003cstrong>vùng địa lý\u003c/strong> có nhiều truy cập record đó nhất (ví dụ nơi người dùng sống) → đọc không cần liên lạc vùng khác (độ trễ do tốc độ ánh sáng). (2) \u003cstrong>Ghi cũng làm cục bộ\u003c/strong> rồi truyền bất đồng bộ tới replica khác; tải master được rải trên nhiều node thay vì một node cho cả partition.\u003c/p>\n\u003cp>c. Mỗi record có thêm \u003cstrong>trường ẩn\u003c/strong> ghi master của nó (lưu cùng record, được nhân bản). Nếu thông tin cũ, đọc mọi replica của record để xem các node được ghi là master, rồi hỏi các node đó để tìm master hiện tại (dùng số epoch lớn nhất).\u003c/p>"}],"exercises":[{"id":"CH21.01","topic":"round-robin","level":1,"prompt":"\u003cp>Bảng \u003ccode>pd_order(order_id, customer, amount, order_date)\u003c/code>. Chia các đơn hàng lên \u003cstrong>4 node\u003c/strong> theo \u003cstrong>round-robin\u003c/strong> theo thứ tự order_id: đơn thứ nhất về node 0, thứ hai node 1, …, thứ năm lại về node 0. Trả về \u003ccode>node\u003c/code> và số đơn hàng \u003ccode>num_orders\u003c/code> của mỗi node, sắp theo node.\u003c/p>","en":"","hint":"(row_number() over (order by order_id) − 1) % 4.","solution":"select node, count(*) as num_orders\nfrom (select (row_number() over (order by order_id) - 1) % 4 as node from pd_order) t\ngroup by node\norder by node;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","num_orders"],"rows":[["0","6"],["1","6"],["2","6"],["3","6"]]}},{"id":"CH21.02","topic":"hash partitioning","level":1,"prompt":"\u003cp>Chia \u003ccode>pd_order\u003c/code> lên 4 node bằng \u003cstrong>hash partitioning\u003c/strong> trên \u003ccode>order_id\u003c/code>, với hàm hash \u003ccode>abs(hashtext(order_id::text)) % 4\u003c/code>. Trả về \u003ccode>node\u003c/code>, \u003ccode>num_orders\u003c/code>, sắp theo node.\u003c/p>","en":"","hint":"","solution":"select abs(hashtext(order_id::text)) % 4 as node, count(*) as num_orders\nfrom pd_order\ngroup by 1\norder by 1;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","num_orders"],"rows":[["0","9"],["1","7"],["2","6"],["3","2"]]}},{"id":"CH21.03","topic":"attribute-value skew","level":2,"prompt":"\u003cp>Giờ hash partitioning trên \u003ccode>customer\u003c/code> (hàm \u003ccode>abs(hashtext(customer)) % 4\u003c/code>). Trả về \u003ccode>node\u003c/code>, \u003ccode>num_orders\u003c/code> và \u003ccode>customers\u003c/code> (danh sách khách ở node đó, nối bằng \u003ccode>, \u003c/code> theo thứ tự tên), chỉ gồm các node có dữ liệu, sắp theo node. Vì sao lệch nhiều hơn CH21.02?\u003c/p>","en":"","hint":"string_agg(distinct customer, ', ' order by customer).","solution":"select abs(hashtext(customer)) % 4 as node, count(*) as num_orders,\n       string_agg(distinct customer, ', ' order by customer) as customers\nfrom pd_order\ngroup by 1\norder by 1;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","num_orders","customers"],"rows":[["0","4","Binh"],["3","20","An, Chi, Dung, Giang, Hoa"]]}},{"id":"CH21.04","topic":"range partitioning","level":1,"prompt":"\u003cp>Chia \u003ccode>pd_order\u003c/code> theo \u003cstrong>range partitioning\u003c/strong> trên \u003ccode>amount\u003c/code> với partitioning vector \u003cstrong>[200, 500, 1000]\u003c/strong>: amount \u003c 200 → node 0; 200 ≤ amount \u003c 500 → node 1; 500 ≤ amount \u003c 1000 → node 2; ≥ 1000 → node 3. Trả về node, num_orders, sắp theo node.\u003c/p>","en":"","hint":"width_bucket(amount, array[200, 500, 1000]) trả về đúng số node.","solution":"select width_bucket(amount, array[200, 500, 1000]) as node, count(*) as num_orders\nfrom pd_order\ngroup by 1\norder by 1;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","num_orders"],"rows":[["0","13"],["1","5"],["2","3"],["3","3"]]}},{"id":"CH21.05","topic":"skew của range partitioning","level":2,"prompt":"\u003cp>Với cách chia của CH21.04, trả về một dòng: \u003ccode>max_node\u003c/code> (số tuple của node đông nhất), \u003ccode>avg_node\u003c/code> (số tuple trung bình mỗi node, tính trên 4 node) và \u003ccode>skew\u003c/code> = max_node / avg_node làm tròn 2.\u003c/p>","en":"","hint":"","solution":"select max(cnt) as max_node, avg(cnt) as avg_node, round(max(cnt) / avg(cnt), 2) as skew\nfrom (select width_bucket(amount, array[200, 500, 1000]) as node, count(*) as cnt\n      from pd_order group by 1) t;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["max_node","avg_node","skew"],"rows":[["13","6","2.17"]]}},{"id":"CH21.06","topic":"truy vấn khoảng","level":2,"prompt":"\u003cp>Truy vấn \u003ccode>select * from pd_order where amount between 250 and 450\u003c/code>. Trả về một dòng hai cột: \u003ccode>range_nodes\u003c/code> — số node phải đọc với range partitioning của CH21.04 (các node có \u003cstrong>khoảng giá trị\u003c/strong> giao với [250, 450]), và \u003ccode>rr_nodes\u003c/code> — số node chứa ít nhất một tuple thoả điều kiện với round-robin của CH21.01 (với round-robin hệ thống không biết trước nên phải đọc cả 4 node; ở đây chỉ đếm node thực sự có kết quả).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 21.1.\u003c/strong> For a range selection on a range-partitioned attribute, it may happen that only one disk has to be accessed. Describe the advantages and disadvantages of this property.\u003c/p>","hint":"","solution":"select (select count(distinct width_bucket(v, array[200, 500, 1000])) from generate_series(250, 450) v) as range_nodes,\n       (select count(distinct node)\n        from (select (row_number() over (order by order_id) - 1) % 4 as node, amount from pd_order) t\n        where amount between 250 and 450) as rr_nodes;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["range_nodes","rr_nodes"],"rows":[["1","2"]]}},{"id":"CH21.07","topic":"vector từ histogram","level":3,"prompt":"\u003cp>Bảng \u003ccode>pd_hist(lo, hi, freq)\u003c/code> là histogram của PE 21.2a. Tính vector range partitioning \u003cstrong>cân bằng\u003c/strong> cho \u003cstrong>5 partition\u003c/strong>: với k = 1..4, mục tiêu là tuple thứ k·N/5 (N = tổng freq); tìm bucket chứa nó (tổng cộng dồn trước bucket \u003c mục tiêu ≤ tổng cộng dồn tới hết bucket), và điểm cắt = \u003ccode>lo + (mục tiêu − cộng dồn trước bucket) / freq · (hi − lo + 1)\u003c/code>. Trả về \u003ccode>k\u003c/code> và \u003ccode>cut\u003c/code> (kiểu \u003cstrong>integer\u003c/strong>), sắp theo k.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 21.2 (a).\u003c/strong> Recall that histograms are used to build load-balanced range partitions.\u003c/p>\n\u003cp>a. A histogram covers values 1 to 100, split into the 10 ranges 1–10, 11–20, …, 91–100, whose frequencies are, in order, 15, 5, 20, 10, 10, 5, 5, 20, 5, and 5. Give a load-balanced range-partitioning function that splits the values into five partitions.\u003c/p>","hint":"sum(freq) over (order by lo) cho cộng dồn; generate_series(1, 4) cho k.","solution":"with h as (\n  select lo, hi, freq, sum(freq) over (order by lo) as cum from pd_hist\n), t as (\n  select k, k * (select sum(freq) from pd_hist) / 5 as target from generate_series(1, 4) k\n)\nselect t.k, (h.lo + (t.target - (h.cum - h.freq)) * (h.hi - h.lo + 1) / h.freq)::integer as cut\nfrom t join h on h.cum - h.freq \u003c t.target and t.target \u003c= h.cum\norder by t.k;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["k","cut"],"rows":[["1","21"],["2","31"],["3","51"],["4","76"]]}},{"id":"CH21.08","topic":"partition by range (PostgreSQL)","level":2,"prompt":"\u003cp>Dùng \u003cstrong>declarative partitioning\u003c/strong> của PostgreSQL. Tạo bảng \u003ccode>pd_order_r(order_id integer, customer varchar(10), amount integer, order_date date)\u003c/code> \u003cstrong>partition by range (amount)\u003c/strong> với bốn partition đúng vector của CH21.04:\u003c/p>\n\u003cul>\u003cli>\u003ccode>pd_order_r0\u003c/code>: từ minvalue đến 200\u003c/li>\u003cli>\u003ccode>pd_order_r1\u003c/code>: [200, 500)\u003c/li>\u003cli>\u003ccode>pd_order_r2\u003c/code>: [500, 1000)\u003c/li>\u003cli>\u003ccode>pd_order_r3\u003c/code>: từ 1000 đến maxvalue\u003c/li>\u003c/ul>\n\u003cp>Rồi chép toàn bộ \u003ccode>pd_order\u003c/code> vào \u003ccode>pd_order_r\u003c/code>. Hệ thống đếm số tuple trong từng partition (\u003ccode>tableoid::regclass\u003c/code>).\u003c/p>","en":"","hint":"","solution":"create table pd_order_r (order_id integer, customer varchar(10), amount integer, order_date date)\n  partition by range (amount);\ncreate table pd_order_r0 partition of pd_order_r for values from (minvalue) to (200);\ncreate table pd_order_r1 partition of pd_order_r for values from (200) to (500);\ncreate table pd_order_r2 partition of pd_order_r for values from (500) to (1000);\ncreate table pd_order_r3 partition of pd_order_r for values from (1000) to (maxvalue);\ninsert into pd_order_r select * from pd_order;","check":"select tableoid::regclass::text as partition, count(*) as num_orders\nfrom pd_order_r group by 1 order by 1;","ordered":false,"fresh":false,"expected":{"fields":["partition","num_orders"],"rows":[["pd_order_r0","13"],["pd_order_r1","5"],["pd_order_r2","3"],["pd_order_r3","3"]]}},{"id":"CH21.09","topic":"partition by hash (PostgreSQL)","level":2,"prompt":"\u003cp>Tạo \u003ccode>pd_order_h\u003c/code> (cùng cột như \u003ccode>pd_order\u003c/code>) \u003cstrong>partition by hash (order_id)\u003c/strong> với 4 partition \u003ccode>pd_order_h0\u003c/code> … \u003ccode>pd_order_h3\u003c/code> (modulus 4, remainder 0 … 3), rồi chép toàn bộ \u003ccode>pd_order\u003c/code> vào. Hệ thống đếm số tuple mỗi partition và thử chèn \u003ccode>(25, 'An', 10, '2024-07-01')\u003c/code> vào bảng cha.\u003c/p>","en":"","hint":"","solution":"create table pd_order_h (order_id integer, customer varchar(10), amount integer, order_date date)\n  partition by hash (order_id);\ncreate table pd_order_h0 partition of pd_order_h for values with (modulus 4, remainder 0);\ncreate table pd_order_h1 partition of pd_order_h for values with (modulus 4, remainder 1);\ncreate table pd_order_h2 partition of pd_order_h for values with (modulus 4, remainder 2);\ncreate table pd_order_h3 partition of pd_order_h for values with (modulus 4, remainder 3);\ninsert into pd_order_h select * from pd_order;","check":"select try_sql($$insert into pd_order_h values (25, 'An', 10, '2024-07-01')$$) as insert_new;\nselect tableoid::regclass::text as partition, count(*) as num_orders\nfrom pd_order_h group by 1 order by 1;","ordered":false,"fresh":false,"expected":{"fields":["partition","num_orders"],"rows":[["pd_order_h0","5"],["pd_order_h1","8"],["pd_order_h2","5"],["pd_order_h3","7"]]}},{"id":"CH21.10","topic":"replica khi node hỏng","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_replica(item, node, role, backup_rank)\u003c/code>: mỗi item có một \u003ccode>primary\u003c/code> và hai \u003ccode>backup\u003c/code> (backup_rank 1, 2). Node \u003cstrong>N2 hỏng\u003c/strong>. Với mỗi item có primary ở N2, backup có thứ hạng nhỏ nhất \u003cstrong>còn sống\u003c/strong> lên làm primary. Trả về mỗi node còn sống (\u003ccode>node\u003c/code>) và số item nó \u003cstrong>nhận thêm\u003c/strong> làm primary (\u003ccode>taken_over\u003c/code>), chỉ các node nhận ít nhất một, sắp theo node.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 21.6 (a).\u003c/strong> Parallel database systems keep replicas of every data item (or partition) on more than one node.\u003c/p>\n\u003cp>a. Why is it better to spread the copies of the data items assigned to a node over several other nodes, rather than keeping all of those copies on the same node (or set of nodes)?\u003c/p>","hint":"","solution":"select r.node, count(*) as taken_over\nfrom pd_replica r\nwhere r.role = 'backup' and r.node \u003c> 'N2'\n  and r.item in (select item from pd_replica where role = 'primary' and node = 'N2')\n  and r.backup_rank = (select min(b.backup_rank) from pd_replica b\n                       where b.item = r.item and b.role = 'backup' and b.node \u003c> 'N2')\ngroup by r.node\norder by r.node;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["node","taken_over"],"rows":[["N1","1"],["N3","1"],["N4","1"]]}},{"id":"CH21.11","topic":"master đã đổi","level":2,"prompt":"\u003cp>Bảng \u003ccode>pd_master_epoch(item, epoch, node)\u003c/code>: mỗi lần master của một record đổi thì epoch tăng; master hiện tại là node có epoch lớn nhất. \u003ccode>pd_route(req, item, sent_to)\u003c/code> là các request đã gửi. Trả về req, item, sent_to, \u003ccode>current_master\u003c/code> và \u003ccode>redirect\u003c/code> (boolean: request gửi nhầm node, phải chuyển hướng). Sắp theo req.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 21.8.\u003c/strong> To send a request to the master replica of a data item, a node must know which replica is currently the master for that item.\u003c/p>\n\u003cp>a. Suppose that after a node determines which node is the master replica of a data item, but before its request arrives there, mastership changes and another node becomes the master. How can this situation be handled?\u003c/p>\n\u003cp>b. The master replica can be chosen per partition, but some systems support a per-record master: the records of a partition (or tablet) are replicated on a set of nodes, and each record’s master may be any node of that set, independently of the masters of other records. Give two benefits of tracking the master per record.\u003c/p>\n\u003cp>c. Suggest how the master replica of every record can be tracked when there is a very large number of records.\u003c/p>","hint":"","solution":"select r.req, r.item, r.sent_to, m.node as current_master, r.sent_to \u003c> m.node as redirect\nfrom pd_route r\njoin pd_master_epoch m on m.item = r.item\n and m.epoch = (select max(epoch) from pd_master_epoch where item = r.item)\norder by r.req;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["req","item","sent_to","current_master","redirect"],"rows":[["1","K1","N1","N3","true"],["2","K1","N3","N3","false"],["3","K2","N2","N2","false"],["4","K3","N2","N4","true"],["5","K3","N4","N4","false"]]}}]},{"key":"ch22","store":"22","short":"22","label":"Chương 22","navLabel":"Chương 22","kind":"Chương","title":"Parallel and Distributed Query Processing","titleVi":"Xử lý truy vấn song song và phân tán","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 22 ngoài lịch học CS4420. Trong bài SQL, \u003ccode>pd_emp\u003c/code> và \u003ccode>pd_dept\u003c/code> có cột \u003ccode>node\u003c/code> (0–2) cho biết tuple đang ở đâu; bạn tính số tuple phải chuyển của từng chiến lược, làm join/aggregate theo từng node rồi gộp, và kiểm tra kết quả bằng join thường.\u003c/p>\n\u003ch3>1. Các dạng song song (slide 22.3–22.6)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Interquery parallelism\u003c/strong>: nhiều truy vấn chạy song song trên các bộ xử lý khác nhau → tăng \u003cstrong>throughput\u003c/strong>; hợp với nhiều truy vấn nhỏ (PE 22.1a). Không giảm response time của từng truy vấn.\u003c/li>\u003cli>\u003cstrong>Intraquery parallelism\u003c/strong>: một truy vấn chạy song song → giảm \u003cstrong>response time\u003c/strong>:\u003c/li>\u003cli>\u003cstrong>Intraoperation\u003c/strong>: một phép toán (sort, join, aggregate) chạy song song trên các partition dữ liệu — mở rộng tốt nhất vì số tuple lớn (PE 22.1b).\u003c/li>\u003cli>\u003cstrong>Interoperation\u003c/strong>: các phép toán khác nhau của cây truy vấn chạy song song — \u003cem>pipelined\u003c/em> (đầu ra phép này là đầu vào phép kia) hoặc \u003cem>independent\u003c/em> (hai nhánh không phụ thuộc).\u003c/li>\u003c/ul>\n\u003ch3>2. Sort song song (slide 22.7–22.10)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Range-partitioning sort\u003c/strong>: phân phối tuple lại theo range trên khoá sắp xếp (dùng histogram để cân bằng), mỗi node sort phần của mình, nối kết quả theo thứ tự node.\u003c/li>\u003cli>\u003cstrong>Parallel external sort-merge\u003c/strong>: mỗi node sort dữ liệu cục bộ, rồi trộn song song các run đã sort (range-partition các run rồi merge).\u003c/li>\u003c/ul>\n\u003ch3>3. Join song song (slide 22.11–22.25)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Partitioned join\u003c/strong> (cho equi-join, natural join): \u003cstrong>repartition\u003c/strong> cả r và s trên thuộc tính join bằng cùng một hàm (hash hoặc range) → tuple khớp nhau nằm cùng node; mỗi node join cục bộ (hash join, merge join…). Nếu một relation đã được chia theo thuộc tính join thì chỉ repartition relation kia.\u003c/li>\u003cli>\u003cstrong>Fragment-and-replicate\u003c/strong> (cho điều kiện bất kỳ, ví dụ r.A \u003c s.B):\u003c/li>\u003cli>\u003cstrong>Asymmetric\u003c/strong> (= \u003cstrong>broadcast join\u003c/strong>): chia r (giữ nguyên partition hiện có), \u003cstrong>gửi toàn bộ s tới mọi node\u003c/strong>. Tốt khi s nhỏ.\u003c/li>\u003cli>\u003cstrong>Symmetric\u003c/strong>: chia r thành m mảnh, s thành n mảnh, mỗi cặp (r\u003csub>i\u003c/sub>, s\u003csub>j\u003c/sub>) xử lý ở một trong m·n bộ xử lý.\u003c/li>\u003cli>\u003cstrong>Band join\u003c/strong> |r.A − s.B| ≤ k với range partitioning: chỉ cần ghép r\u003csub>i\u003c/sub> với s\u003csub>i−1\u003c/sub>, s\u003csub>i\u003c/sub>, s\u003csub>i+1\u003c/sub> → khoảng 3n bộ xử lý thay vì n² (PE 22.4).\u003c/li>\u003cli>\u003cstrong>Chi phí truyền\u003c/strong>: repartition gửi các tuple không nằm sẵn ở node đích; broadcast gửi |s| × (n − 1) tuple. Chọn chiến lược ít truyền hơn.\u003c/li>\u003cli>\u003cstrong>Semijoin filter / Bloom filter\u003c/strong>: gửi một bit vector tóm tắt s.B tới các node của r; chỉ gửi đi các tuple r có thể khớp. Bloom filter có thể \u003cstrong>dương tính giả\u003c/strong> nhưng không bao giờ âm tính giả (PE 22.6).\u003c/li>\u003cli>\u003cstrong>Skew trong join\u003c/strong>: partition lệch → một node chậm. Xử lý: virtual partitions, tách giá trị nặng, broadcast phần nóng.\u003c/li>\u003c/ul>\n\u003ch3>4. Các phép khác (slide 22.26–22.32)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Selection\u003c/strong>: theo điều kiện partitioning thì chỉ đọc vài node; ngược lại đọc mọi node song song.\u003c/li>\u003cli>\u003cstrong>Duplicate elimination\u003c/strong>: sort/hash song song.\u003c/li>\u003cli>\u003cstrong>Aggregation\u003c/strong> (\u003ccode>group by\u003c/code>): repartition theo khoá group rồi tính cục bộ. \u003cstrong>Partial (pre-) aggregation\u003c/strong>: mỗi node tính trước aggregate cục bộ trên dữ liệu đang có, chỉ gửi \u003cstrong>một tuple mỗi nhóm\u003c/strong> → giảm mạnh dữ liệu truyền và ảnh hưởng của skew (PE 22.2, 22.5c):\u003c/li>\u003cli>count: gửi count cục bộ, toàn cục = \u003cstrong>sum\u003c/strong> các count;\u003c/li>\u003cli>sum: sum các sum; min/max: min/max các giá trị cục bộ;\u003c/li>\u003cli>\u003cstrong>avg\u003c/strong>: gửi (sum, count) cục bộ, toàn cục = Σsum / Σcount (không lấy trung bình các trung bình).\u003c/li>\u003cli>Nếu dữ liệu đã được chia theo một tập con của khoá group (ví dụ chia theo B, group by A, B) thì aggregate cục bộ luôn, \u003cstrong>không cần repartition\u003c/strong> (PE 22.8).\u003c/li>\u003cli>\u003cstrong>Outer join song song\u003c/strong>: s nhỏ → replicate s, mỗi node tính r\u003csub>i\u003c/sub> ⟕ s. r nhỏ, s lớn → replicate r, mỗi node tính r ⋈ s\u003csub>i\u003c/sub> và báo về các r đã khớp; r không khớp ở node nào được bù null (PE 22.7).\u003c/li>\u003c/ul>\n\u003ch3>5. Exchange operator và kế hoạch song song (slide 22.33–22.40)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Exchange operator\u003c/strong> chuyển tuple giữa các node: \u003cem>repartition\u003c/em> (hash/range), \u003cem>broadcast\u003c/em>, \u003cem>gather\u003c/em> (gom về một node), kèm \u003cem>merge\u003c/em> nếu cần giữ thứ tự.\u003c/li>\u003cli>Kế hoạch song song = kế hoạch tuần tự chèn thêm exchange. Ví dụ PE 22.5: chọn σ\u003csub>A>5\u003c/sub>(r) cục bộ (r chia theo A) → repartition theo B → join cục bộ với s (s đã chia theo B) → pre-aggregate theo r.C → repartition theo r.C → aggregate cuối.\u003c/li>\u003cli>Pipeline nhiều phép trên \u003cstrong>cùng\u003c/strong> bộ xử lý thường tốt hơn chia ra, vì tránh chi phí chuyển tuple (trừ khi shared memory) (PE 22.3).\u003c/li>\u003c/ul>\n\u003ch3>6. MapReduce và xử lý phân tán (slide 22.41–22.55)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>MapReduce\u003c/strong>: map(k, v) → danh sách (k', v'); hệ thống \u003cstrong>shuffle\u003c/strong> (repartition theo k'), reduce(k', danh sách v') → kết quả. Mapper/reducer hỏng thì chỉ chạy lại phần đó vì dữ liệu trung gian được ghi đĩa (PE 22.9).\u003c/li>\u003cli>Join bằng MapReduce: partitioned join = map phát (khoá join, tuple có đánh dấu nguồn), reduce ghép; broadcast join = mọi mapper nạp relation nhỏ vào bộ nhớ, join ngay trong map; indexed nested-loop = mapper tra index của data store cho mỗi tuple (PE 22.11).\u003c/li>\u003cli>\u003cstrong>Distributed query processing\u003c/strong> (giữa các site): chi phí truyền mạng chiếm ưu thế; \u003cstrong>semijoin\u003c/strong> r ⋉ s để giảm dữ liệu gửi; \u003cstrong>query shipping\u003c/strong> vs \u003cstrong>data shipping\u003c/strong>.\u003c/li>\u003cli>Hệ \u003cstrong>federated\u003c/strong>: wrapper/mediator dịch truy vấn sang các nguồn khác nhau.\u003c/li>\u003c/ul>\n\u003ch3>Công thức chi phí truyền (trong bài tập)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Chiến lược\u003c/th>\u003cth>Số tuple phải gửi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Repartition r theo thuộc tính join\u003c/td>\u003ctd>số tuple r có node hiện tại ≠ node đích\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Broadcast s tới n node\u003c/td>\u003ctd>\u003c/td>\u003ctd>s\u003c/td>\u003ctd>× (n − 1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Group by không pre-aggregate\u003c/td>\u003ctd>số tuple có node ≠ node của nhóm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Group by có pre-aggregate\u003c/td>\u003ctd>số \u003cstrong>nhóm cục bộ\u003c/strong> (node, nhóm) có node ≠ node của nhóm\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Hệ OLTP với rất nhiều truy vấn nhỏ. Dạng song song nào quan trọng nhất?","options":["Intraoperation","Interoperation","Interquery","Pipelined"],"answer":2,"explain":"PE 22.1a."},{"q":"Partitioned join áp dụng được cho điều kiện nào?","options":["r.A \u003c s.B","r.A = s.B (equi-join)","Mọi điều kiện","Chỉ cross product"],"answer":1,"explain":"Chỉ khi tuple khớp nhau có thể đưa về cùng node bằng một hàm partition."},{"q":"Broadcast join (asymmetric fragment-and-replicate) phù hợp khi nào?","options":["Cả hai relation đều lớn","Một relation nhỏ","Không có index","Join điều kiện bằng"],"answer":1,"explain":"Gửi relation nhỏ tới mọi node rẻ hơn repartition relation lớn."},{"q":"Pre-aggregation của avg: mỗi node nên gửi gì?","options":["avg cục bộ","(sum, count) cục bộ","Mọi tuple","max cục bộ"],"answer":1,"explain":"Toàn cục = Σsum / Σcount; trung bình các trung bình sai khi số tuple mỗi node khác nhau."},{"q":"Bloom filter dùng làm semijoin filter có thể sai theo kiểu nào?","options":["Bỏ sót tuple khớp","Cho qua tuple không khớp (false positive)","Cả hai","Không bao giờ sai"],"answer":1,"explain":"Bit được bật bởi giá trị khác có thể trùng; tuple khớp thật luôn qua."},{"q":"s đã chia theo B. Tính group by A, B sum(C) có cần repartition không?","options":["Có, theo (A, B)","Không: mọi tuple cùng (A, B) đã cùng B nên cùng node","Có, theo A","Chỉ khi có index"],"answer":1,"explain":"PE 22.8."},{"q":"Band join |r.A − s.B| ≤ k với range partitioning cùng vector: r_i cần ghép với những mảnh nào của s?","options":["Mọi s_j","s_{i−1}, s_i, s_{i+1}","Chỉ s_i","s_0"],"answer":1,"explain":"Với k nhỏ hơn độ rộng mỗi khoảng, chỉ các khoảng kề nhau có thể chứa cặp khớp (PE 22.4)."},{"q":"Exchange operator dùng để làm gì?","options":["Đổi thứ tự join","Chuyển (repartition/broadcast/gather) tuple giữa các node trong kế hoạch song song","Thay thế index","Ghi log"],"answer":1,"explain":"Kế hoạch song song = kế hoạch tuần tự + các exchange."}],"questions":[{"q":"\u003cstrong>PE 22.1\u003c/strong> — Dạng song song nào quan trọng nhất cho (a) nhiều truy vấn nhỏ; (b) ít truy vấn lớn, nhiều đĩa và bộ xử lý?","en":"\u003cp>\u003cstrong>Exercise 22.1.\u003c/strong> Which kind of parallelism (interquery, interoperation, or intraoperation) is likely to matter most for each of the following tasks?\u003c/p>\n\u003cp>a. Increasing the throughput of a system that runs many small queries.\u003c/p>\n\u003cp>b. Increasing the throughput of a system that runs a few large queries, when there are many disks and processors.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Interquery parallelism\u003c/strong>: chạy các truy vấn nhỏ trên các bộ xử lý khác nhau cho throughput tốt. Song song hoá từng truy vấn nhỏ chỉ tăng chi phí khởi động mà không giảm đáng kể response time.\u003c/p>\n\u003cp>b. \u003cstrong>Intraoperation parallelism\u003c/strong>: truy vấn thường có ít phép toán nhưng mỗi phép xử lý rất nhiều tuple; chỉ chia dữ liệu của từng phép lên nhiều đĩa/bộ xử lý mới tận dụng được phần cứng lớn (interoperation bị giới hạn bởi số phép toán).\u003c/p>"},{"q":"\u003cstrong>PE 22.2\u003c/strong> — Cài partial aggregation cho count và avg để giảm dữ liệu truyền.","en":"\u003cp>\u003cstrong>Exercise 22.2.\u003c/strong> Describe how partial aggregation can be implemented for the \u003cstrong>count\u003c/strong> and \u003cstrong>avg\u003c/strong> aggregate functions so as to reduce data transfer.\u003c/p>","answer":"\u003cp>Mỗi node tính trước trên dữ liệu cục bộ của nó, theo khoá group:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>count\u003c/strong>: node gửi (nhóm, count cục bộ) → node tổng hợp tính \u003cstrong>sum\u003c/strong> các count.\u003c/li>\u003cli>\u003cstrong>avg\u003c/strong>: node gửi (nhóm, sum cục bộ, count cục bộ) → node tổng hợp tính Σsum / Σcount. (Không gửi avg cục bộ, vì trung bình các trung bình sai khi số tuple khác nhau.)\u003c/li>\u003c/ul>\n\u003cp>Mỗi node chỉ gửi \u003cstrong>một tuple cho mỗi nhóm\u003c/strong> nó có, thay vì mọi tuple. Bài CH22.04 tính avg theo cách này và CH22.05 đếm số tuple tiết kiệm được.\u003c/p>"},{"q":"\u003cstrong>PE 22.3\u003c/strong> — Vì sao với pipelined parallelism, chạy nhiều phép trên một bộ xử lý thường tốt hơn? Còn đúng với shared memory? Với independent parallelism?","en":"\u003cp>\u003cstrong>Exercise 22.3.\u003c/strong> With pipelined parallelism, it is often worthwhile to run several operations of a pipeline on one processor, even when many processors are available.\u003c/p>\n\u003cp>a. Explain why.\u003c/p>\n\u003cp>b. Do the arguments of part a still hold if the machine has a shared-memory architecture? Explain why or why not.\u003c/p>\n\u003cp>c. Do the arguments of part a hold for independent parallelism? (That is, are there cases where, even though the operations are not pipelined and many processors are available, it is still better to run several operations on the same processor?)\u003c/p>","answer":"\u003cp>a. Nếu đặt mỗi phép ở một bộ xử lý, \u003cstrong>mọi tuple\u003c/strong> do một phép sinh ra phải được chuyển tới bộ xử lý của phép tiêu thụ nó; chi phí truyền thường lớn hơn lợi ích tăng tốc (pipeline thường ngắn và các phép không đều nhau).\u003c/p>\n\u003cp>b. Với \u003cstrong>shared memory\u003c/strong>, chuyển tuple giữa bộ xử lý rất rẻ (chỉ qua bộ nhớ chung), nên lập luận trên \u003cstrong>gần như không còn đúng\u003c/strong>.\u003c/p>\n\u003cp>c. \u003cstrong>Có\u003c/strong>: hai phép độc lập có thể cùng đưa kết quả vào một phép thứ ba; chạy cả ba trên cùng bộ xử lý có thể tốt hơn chuyển tuple giữa các bộ xử lý.\u003c/p>"},{"q":"\u003cstrong>PE 22.4\u003c/strong> — Tối ưu symmetric fragment-and-replicate với range partitioning cho band join |r.A − s.B| ≤ k.","en":"\u003cp>\u003cstrong>Exercise 22.4.\u003c/strong> Consider join processing with symmetric fragment-and-replicate using range partitioning. How can the evaluation be optimized when the join condition has the form |r.A − s.B| ≤ k, with k a small constant? (|x| is the absolute value of x.) A join with such a condition is called a \u003cem>band join\u003c/em>.\u003c/p>","answer":"\u003cp>Range-partition r trên A và s trên B bằng \u003cstrong>cùng một vector\u003c/strong> thành n mảnh r\u003csub>0\u003c/sub> … r\u003csub>n−1\u003c/sub>, s\u003csub>0\u003c/sub> … s\u003csub>n−1\u003c/sub> (độ rộng mỗi khoảng ≥ k). Một tuple của r\u003csub>i\u003c/sub> chỉ có thể khớp với tuple của s\u003csub>i−1\u003c/sub>, s\u003csub>i\u003c/sub>, s\u003csub>i+1\u003c/sub>. Vậy chỉ cần các bộ xử lý P\u003csub>i,i−1\u003c/sub>, P\u003csub>i,i\u003c/sub>, P\u003csub>i,i+1\u003c/sub>: mỗi mảnh được nhân bản lên \u003cstrong>3\u003c/strong> bộ xử lý thay vì n, tổng khoảng \u003cstrong>3n\u003c/strong> bộ xử lý thay vì n². Với cùng số bộ xử lý, có thể chia nhiều mảnh hơn nên mỗi join cục bộ nhanh hơn. Bài CH22.07 kiểm tra rằng mọi cặp khớp đều nằm ở các mảnh kề nhau.\u003c/p>"},{"q":"\u003cstrong>PE 22.5\u003c/strong> — r chia và đánh chỉ mục trên A, s trên B. Cho \u003csub>r.C\u003c/sub>γ\u003csub>count(s.D)\u003c/sub>(σ\u003csub>A>5\u003c/sub>(r) ⋈\u003csub>r.B=s.B\u003c/sub> s): (a) kế hoạch song song cho select + join dùng exchange; (b) thêm aggregate với pre-aggregation; (c) pre-aggregation giảm ảnh hưởng skew thế nào?","en":"\u003cp>\u003cstrong>Exercise 22.5.\u003c/strong> Relation r is stored partitioned and indexed on A, and s is stored partitioned and indexed on B. Consider the query\u003c/p>\n\u003cp>\u003csub>r.C\u003c/sub>γ\u003csub>count(s.D)\u003c/sub>((σ\u003csub>A>5\u003c/sub>(r)) ⋈\u003csub>r.B=s.B\u003c/sub> s)\u003c/p>\n\u003cp>a. Using the exchange operator, give a parallel query plan for the part of the query that contains only the select and join operators.\u003c/p>\n\u003cp>b. Extend this plan to compute the aggregate as well, using pre-aggregation to keep data transfer as small as possible.\u003c/p>\n\u003cp>c. Skew during aggregation is a serious problem. Explain how the pre-aggregation above can also greatly reduce the effect of skew during aggregation.\u003c/p>","answer":"\u003cp>a. Ở mỗi node của r: σ\u003csub>A>5\u003c/sub>(r\u003csub>i\u003c/sub>) — chỉ các node có khoảng A > 5 (nếu range-partition, dùng index trên A). → \u003cstrong>exchange: repartition theo B\u003c/strong> (hash trên B, cùng hàm chia s). → ở mỗi node j: join cục bộ với s\u003csub>j\u003c/sub> (s đã chia theo B nên không phải chuyển s; có thể dùng index trên s.B).\u003c/p>\n\u003cp>b. Sau join ở mỗi node j: \u003cstrong>pre-aggregate\u003c/strong> theo r.C — tính count(s.D) cục bộ cho mỗi giá trị r.C. → \u003cstrong>exchange: repartition theo r.C\u003c/strong> (chỉ một tuple mỗi (node, r.C)). → mỗi node nhận tính \u003cstrong>sum\u003c/strong> các count cục bộ cho các r.C nó phụ trách. → (gather nếu cần trả về một chỗ).\u003c/p>\n\u003cp>c. Không có pre-aggregation, một giá trị r.C xuất hiện rất nhiều làm node phụ trách nó nhận lượng tuple khổng lồ. Với pre-aggregation, mỗi node chỉ gửi \u003cstrong>một\u003c/strong> tuple cho mỗi giá trị r.C, nên lượng dữ liệu dồn về node nặng nhất tối đa là số node, bất kể skew → ảnh hưởng của skew giảm mạnh.\u003c/p>"},{"q":"\u003cstrong>PE 22.6\u003c/strong> — Join r ⋈\u003csub>r.B=s.B\u003c/sub> s, s đã chia theo B, nhỏ vừa phải; r lớn, chia theo A, đa số tuple không khớp. Dùng Bloom filter làm semijoin filter thế nào?","en":"\u003cp>\u003cstrong>Exercise 22.6.\u003c/strong> Relation r is stored partitioned and indexed on A, and s is stored partitioned and indexed on B. Consider the join r ⋈\u003csub>r.B=s.B\u003c/sub> s. Relation s is fairly small, but not small enough for asymmetric fragment-and-replicate to be the best choice; r is large, and most r tuples match no s tuple. A hash join can be used, with a semijoin filter to cut down data transfer. Explain how semijoin filtering with Bloom filters would work in this parallel join.\u003c/p>","answer":"\u003col>\u003cli>Mỗi node của s (hoặc một node gom lại) xây \u003cstrong>Bloom filter\u003c/strong> trên s.B: một bit vector m bit, mỗi giá trị b bật các bit h\u003csub>1\u003c/sub>(b), …, h\u003csub>k\u003c/sub>(b). Gộp (OR) lại và \u003cstrong>gửi bit vector tới mọi node của r\u003c/strong> — rẻ vì chỉ m bit.\u003c/li>\u003cli>Mỗi node của r kiểm tra từng tuple: chỉ khi \u003cstrong>mọi\u003c/strong> bit h\u003csub>i\u003c/sub>(r.B) đều bật thì tuple \u003cem>có thể\u003c/em> khớp.\u003c/li>\u003cli>Chỉ các tuple qua bộ lọc được \u003cstrong>repartition theo r.B\u003c/strong> và gửi tới node chứa s tương ứng (s đã chia theo B, không cần chia lại).\u003c/li>\u003cli>Mỗi node join cục bộ (loại các dương tính giả).\u003c/li>\u003c/ol>\n\u003cp>Vì đa số r không khớp, phần lớn bị loại tại chỗ → giảm mạnh dữ liệu truyền. Bloom filter có thể cho qua tuple không khớp (false positive) nhưng không bao giờ loại tuple khớp. Bài CH22.08 mô phỏng bộ lọc 16 bit với hai hàm hash.\u003c/p>"},{"q":"\u003cstrong>PE 22.7\u003c/strong> — Thuật toán song song cho r ⟕\u003csub>r.A=s.A\u003c/sub> s: (a) s nhỏ, r chia theo r.B; (b) r nhỏ, s lớn chia theo s.B.","en":"\u003cp>\u003cstrong>Exercise 22.7.\u003c/strong> We want to compute the left outer join r ⟕\u003csub>r.A=s.A\u003c/sub> s.\u003c/p>\n\u003cp>a. Relation s is small, while r is stored partitioned on r.B. Give an efficient parallel algorithm for the left outer join.\u003c/p>\n\u003cp>b. Now r is small and s is a large relation stored partitioned on s.B. Give an efficient parallel algorithm for the same left outer join.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Replicate s\u003c/strong> tới mọi node; mỗi node tính r\u003csub>i\u003c/sub> ⟕ s độc lập. Kết quả là hợp các kết quả cục bộ — đúng vì mỗi tuple r ở đúng một node và thấy toàn bộ s.\u003c/p>\n\u003cp>b. \u003cstrong>Replicate r\u003c/strong> tới mọi node; node i tính r ⋈ s\u003csub>i\u003c/sub> (inner join) và xuất kết quả. Mỗi node gửi về một node điều phối \u003cstrong>danh sách các tuple r đã khớp\u003c/strong> ở node đó. Node điều phối lấy hợp các danh sách; tuple r \u003cstrong>không có trong hợp\u003c/strong> được bù null cho các thuộc tính của s và thêm vào kết quả. (Không thể tính r ⟕ s\u003csub>i\u003c/sub> ở từng node vì sẽ sinh bản bù null sai cho tuple r khớp ở node khác.) Bài CH22.09 tìm các tuple cần bù null theo cách này.\u003c/p>"},{"q":"\u003cstrong>PE 22.8\u003c/strong> — Tính \u003csub>A,B\u003c/sub>γ\u003csub>sum(C)\u003c/sub> trên s đã chia theo s.B (nhiều giá trị B, phân bố đều) hiệu quả nhất?","en":"\u003cp>\u003cstrong>Exercise 22.8.\u003c/strong> We want to compute \u003csub>A,B\u003c/sub>γ\u003csub>sum(C)\u003c/sub> on a relation s that is stored partitioned on s.B. The number of distinct s.B values is large and the number of tuples per s.B value is fairly uniform. Explain how to compute it efficiently while minimizing or avoiding repartitioning.\u003c/p>","answer":"\u003cp>Tính aggregate \u003cstrong>cục bộ ở từng node, không repartition\u003c/strong>. Lý do: để group theo (A, B) cần mọi tuple cùng (A, B) nằm cùng node; chia theo B đã thoả điều này vì tuple cùng (A, B) thì cùng B. Vì số giá trị B lớn và phân bố đều, partition hiện có cũng cân bằng, nên song song tốt. (Không chia gì cũng thoả điều kiện nhưng mất song song.) Bài CH22.10 kiểm tra rằng không nhóm (A, B) nào trải trên hai node, trong khi nhóm theo A thì có.\u003c/p>"},{"q":"\u003cstrong>PE 22.9\u003c/strong> — Thêm khả năng chịu lỗi kiểu MapReduce cho partitioned parallel join: cần làm gì ở node gửi và node nhận khi repartition?","en":"\u003cp>\u003cstrong>Exercise 22.9.\u003c/strong> MapReduce implementations are fault tolerant: only the mappers or reducers that failed are re-executed. By default, a partitioned parallel join must be rerun entirely if even one node fails. A partitioned parallel join can be made fault tolerant in a MapReduce-like way, so that a node failure requires redoing only the work related to that node rather than the whole query. Explain what must be done, at partitioning time, at the sending node and at the receiving node to achieve this.\u003c/p>","answer":"\u003cp>Coi bước repartition như \u003cem>map\u003c/em> và bước join như \u003cem>reduce\u003c/em>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Node nhận\u003c/strong>: lưu mọi tuple nhận được xuống \u003cstrong>đĩa cục bộ\u003c/strong> và chỉ bắt đầu join khi đã nhận \u003cstrong>đủ\u003c/strong> từ mọi node gửi. Mỗi lô tuple ghi kèm node gửi; nếu node gửi hỏng và node khác thay nó chạy lại, node nhận \u003cstrong>bỏ\u003c/strong> mọi tuple từ node gửi cũ rồi nhận lại → không xử lý trùng.\u003c/li>\u003cli>\u003cstrong>Node gửi\u003c/strong>: để node nhận hỏng có thể khôi phục mà không bắt mọi node gửi đọc lại toàn bộ input, node gửi \u003cstrong>ghi xuống đĩa\u003c/strong> các tuple đã chia cho từng node đích (như mapper lưu output trung gian), và gửi lại khi node join thay thế yêu cầu. Cái giá là chi phí ghi đĩa thêm.\u003c/li>\u003c/ul>\n\u003cp>Cách khác — quét lại input để tìm tuple cho node hỏng — buộc mọi node gửi đọc lại toàn bộ dữ liệu, gần như chạy lại cả join, nên không hữu ích.\u003c/p>"},{"q":"\u003cstrong>PE 22.10\u003c/strong> — Duy trì r ⋈ s như materialized view trên parallel data store: lợi ích và chi phí về throughput, chỗ lưu trữ, response time?","en":"\u003cp>\u003cstrong>Exercise 22.10.\u003c/strong> When a parallel data store holds two relations r and s that must be joined, it may help to maintain the join as a materialized view. What are the benefits and overheads with respect to overall throughput, space use, and response time of user queries?\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Response time\u003c/strong> của truy vấn join giảm mạnh: đọc view thay vì join, đặc biệ
