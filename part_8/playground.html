<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4420 · Part 8 — Chương 20 đến 23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script>
// Theme: the saved choice, else the OS setting; applied before first paint. Any [data-theme-toggle] flips it.
(() => {
  const KEY = 'cs4420:theme', root = document.documentElement;
  const saved = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  const system = () => (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const label = t => (t === 'light' ? 'Chuyển sang giao diện tối' : 'Chuyển sang giao diện sáng');
  const apply = t => {
    root.dataset.theme = t;
    document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.setAttribute('aria-label', label(t)); b.dataset.tip = label(t); });
  };
  apply(saved() || system());
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!saved()) apply(system()); });
  addEventListener('storage', e => { if (e.key === KEY) apply(saved() || system()); });
  document.addEventListener('DOMContentLoaded', () => apply(root.dataset.theme));
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-theme-toggle]')) return;
    const t = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(KEY, JSON.stringify(t)); } catch { /* storage unavailable */ }
    apply(t);
  });
})();

// Online sync: every cs4420* key (except the per-device theme) is mirrored to /api/sync (api/sync.js).
// Pages write through lxStore so each change is stamped and queued; the newest write per key wins.
// Without the API (local serve, or Redis not configured) everything stays in this browser only.
(() => {
  const API = '/api/sync', PENDING = 'lxsync:pending', STAMPS = 'lxsync:stamps', INIT = 'lxsync:init';
  const syncable = k => k.startsWith('cs4420') && k !== 'cs4420:theme';
  const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } };
  let state = 'busy', lastSync = 0, lastPull = 0, disabled = false, pushing = false, timer = 0;

  const TEXT = {
    busy: ['Đang đồng bộ…', 'Đang đồng bộ tiến độ lên online…'],
    ok: ['Đã lưu online', 'Đã lưu online lúc '],
    err: ['Lỗi đồng bộ', 'Chưa lưu online được, sẽ thử lại. Bấm để thử ngay.'],
    local: ['Chỉ lưu trên máy này', 'Chỉ lưu trong trình duyệt này: lưu online chưa được bật.'],
  };
  const show = s => {
    state = s;
    const [short, long] = TEXT[s];
    const tip = s === 'ok' ? long + new Date(lastSync).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + '. Bấm để đồng bộ ngay.' : long;
    document.querySelectorAll('[data-sync]').forEach(b => { b.className = b.className.replace(/\bis-(busy|ok|err|local)\b/g, '').trim() + ' is-' + s; b.dataset.tip = tip; b.setAttribute('aria-label', tip); });
    document.querySelectorAll('[data-sync-text]').forEach(el => { el.textContent = short; });
  };

  const record = (k, v) => {
    if (!syncable(k)) return;
    const pending = load(PENDING), stamps = load(STAMPS);
    const t = Math.max(Date.now(), (stamps[k] || 0) + 1);
    pending[k] = { v, t }; stamps[k] = t;
    save(PENDING, pending); save(STAMPS, stamps);
    if (disabled) return;
    show('busy');
    clearTimeout(timer); timer = setTimeout(push, 1500);
  };
  window.lxStore = {
    set(k, raw) { try { localStorage.setItem(k, raw); } catch { return; } record(k, raw); },
    remove(k) { try { localStorage.removeItem(k); } catch { return; } record(k, null); },
  };

  async function push(keepalive = false) {
    clearTimeout(timer);
    if (disabled || pushing) return;
    const sent = load(PENDING);
    if (!Object.keys(sent).length) { if (state === 'busy') show('ok'); return; }
    pushing = true;
    try {
      const body = JSON.stringify({ changes: sent });
      const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: keepalive && body.length < 60000 });
      if (res.status === 404 || res.status === 503) { disabled = true; show('local'); return; }
      if (!res.ok) throw new Error('sync ' + res.status);
      const pending = load(PENDING);
      for (const k of Object.keys(sent)) if (pending[k] && pending[k].t === sent[k].t) delete pending[k];
      save(PENDING, pending);
      lastSync = Date.now();
      if (Object.keys(pending).length) timer = setTimeout(push, 1500); else show('ok');
    } catch (err) {
      console.warn(err);
      show('err');
      timer = setTimeout(push, 30000);
    } finally { pushing = false; }
  }

  async function pull() {
    if (disabled) return;
    lastPull = Date.now();
    show('busy');
    try {
      const res = await fetch(API, { headers: { accept: 'application/json' } });
      if (res.status === 404 || res.status === 503) { disabled = true; show('local'); return; }
      if (!res.ok) throw new Error('sync ' + res.status);
      const { data } = await res.json();
      const pending = load(PENDING), stamps = load(STAMPS), changed = [];
      for (const [k, e] of Object.entries(data || {})) {
        if (!syncable(k) || !(e.t > (stamps[k] || 0))) continue;
        try { if (e.v === null) localStorage.removeItem(k); else localStorage.setItem(k, e.v); } catch { continue; }
        stamps[k] = e.t;
        if (pending[k] && pending[k].t < e.t) delete pending[k];
        changed.push(k);
      }
      save(STAMPS, stamps); save(PENDING, pending);
      lastSync = Date.now();
      if (changed.length) dispatchEvent(new CustomEvent('lx:synced', { detail: { keys: changed } }));
      await push();
    } catch (err) {
      console.warn(err);
      show('err');
      timer = setTimeout(push, 30000);
    }
  }

  // First run on this device: queue what is already stored with the oldest stamp,
  // so it fills gaps online but never overrides progress saved from another device.
  if (!localStorage.getItem(INIT)) {
    const pending = load(PENDING), stamps = load(STAMPS);
    try { Object.keys(localStorage).filter(k => syncable(k) && !(k in stamps)).forEach(k => { pending[k] = { v: localStorage.getItem(k), t: 1 }; stamps[k] = 1; }); } catch { /* ignore */ }
    save(PENDING, pending); save(STAMPS, stamps); save(INIT, true);
  }

  document.addEventListener('DOMContentLoaded', () => { show(state); pull(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') push(true);
    else if (Date.now() - lastPull > 60000) pull();
  });
  addEventListener('pagehide', () => push(true));
  document.addEventListener('click', e => { if (e.target.closest('[data-sync]') && !disabled) pull(); });
})();
</script>
<style>
  /* ======================================================================
     CS4420 Practice Lab — "data terminal": a dark console read in long sessions.
     Cards sit darker than the ground; every selection is one 1px PostgreSQL-blue
     line as wide as its label; every figure, ID and query is set in JetBrains Mono.
     Grid: 248px sidebar + fluid canvas, 40px side padding, one 24px gap everywhere.
     ====================================================================== */
  :root {
    --ground: #171719;
    --surface: #131217;
    --raised: #212023;
    --well: #0d0d10;
    --hover: #1d1c21;
    --border: #262529;
    --rule: #1f1e23;
    --control: #3a3a3e;
    --text: #ffffff;
    --text-2: #cfcfd3;
    --muted: #8f9197;
    --accent: #4a8ad6;
    --accent-ink: #8bb6ea;
    --accent-bg: #16202e;
    --positive: #44a282;
    --negative: #e5566f;
    --negative-bg: #2c1a20;
    --warning: #d9a441;
    --warning-bg: #2a2416;
    --cell: #2c2b31;
    --selection: #2b4f7c;
    --control-hover: #55555b;
    --invert: #ffffff; --invert-ink: #111111; --invert-hover: #dcdce0;
    --tag-hover: #2e2d33;
    --accent-bg-ink: #d6e6fa; --warning-bg-ink: #f0d49c; --negative-bg-ink: #f6b8c3;
    --prose: #ececef; --code: #f0f0f2;
    --focus-line: #3d5f8a; --placeholder: #6f7177;
    --shadow: 0 12px 28px rgba(0,0,0,.2);
    --shadow-menu: 0 16px 40px rgba(0,0,0,.45);
    --font: "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --radius: 6px; --radius-sm: 4px;
    --gap: 24px; --pad: 40px;
    --sidebar: 248px; --control-height: 34px;
    color-scheme: dark;
  }
  /* Light: the same terminal printed on paper — white cards on a pale ground, ink text, deeper blue. */
  :root[data-theme="light"] {
    --ground: #f6f6f7;
    --surface: #ffffff;
    --raised: #eeeef0;
    --well: #f9f9fa;
    --hover: #ececee;
    --border: #e2e2e5;
    --rule: #ececee;
    --control: #cfcfd4;
    --text: #17171a;
    --text-2: #3c3c42;
    --muted: #6b6d73;
    --accent: #2f6fbf;
    --accent-ink: #235a9e;
    --accent-bg: #e8f0fa;
    --positive: #2b8a69;
    --negative: #c8354f;
    --negative-bg: #fbebee;
    --warning: #a87412;
    --warning-bg: #fbf3e2;
    --cell: #e4e4e8;
    --selection: #cfe0f5;
    --control-hover: #a9a9b0;
    --invert: #17171a; --invert-ink: #ffffff; --invert-hover: #3a3a40;
    --tag-hover: #e2e2e6;
    --accent-bg-ink: #1d4f8c; --warning-bg-ink: #7a5208; --negative-bg-ink: #9c2238;
    --prose: #222226; --code: #1f1f23;
    --focus-line: #8fb3e0; --placeholder: #9a9ca2;
    --shadow: 0 12px 28px rgba(20,20,30,.08);
    --shadow-menu: 0 16px 40px rgba(20,20,30,.16);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--text); font: 400 13px/20px var(--font); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--selection); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--text); }
  h1, h2, h3 { margin: 0; }
  .n, .lx-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lx-mono { font-size: 12px; font-weight: 500; }
  .lx-subtle, .lx-dash { color: var(--muted); }
  .lx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Shell: labelled sidebar on the ground, one rule, canvas beside it ---------- */

  .lx-brand__mark { width: 28px; height: 28px; flex: none; color: var(--accent); }
  .lx-brand__mark svg { width: 100%; height: 100%; display: block; }
  .lx-brand__name { font: 600 14px/18px var(--font); letter-spacing: -.01em; }
  .lx-brand__name span { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .lx-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-nav__group { display: flex; flex-direction: column; }
  .lx-nav__label { padding: 0 8px 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .lx-nav__item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; margin-bottom: 2px; padding: 6px 8px; border-radius: var(--radius-sm);
    color: var(--muted); text-decoration: none; font-size: 13px; line-height: 18px; }
  .lx-nav__item:hover { background: var(--hover); color: var(--text); }
  .lx-nav__item.is-active { color: var(--text); }

  .lx-nav__item.is-part.is-current { color: var(--text); font-weight: 600; }
  .lx-nav__k { flex: none; min-width: 34px; font: 500 12px/18px var(--mono); color: var(--muted); white-space: nowrap; }
  .lx-nav__item.is-active .lx-nav__k, .lx-nav__item.is-current .lx-nav__k { color: var(--text-2); }
  .lx-nav__t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-nav__c { flex: none; font: 400 11px/18px var(--mono); color: var(--muted); }
  .lx-nav__sub { display: flex; flex-direction: column; margin: 0 0 6px 20px; }
  .lx-nav__sub .lx-nav__item { min-height: 30px; padding: 5px 8px; }
  .lx-sidebar__foot { display: flex; align-items: center; gap: 4px; padding: 12px; border-top: 1px solid var(--border); }
  .lx-sidebar__foot > .lx-signalwrap { flex: 1; min-width: 0; }
  .lx-sidebar__foot > .lx-iconbtn::after { right: auto; left: 50%; transform: translate(-50%, 2px); }
  .lx-sidebar__foot > .lx-iconbtn:hover::after, .lx-sidebar__foot > .lx-iconbtn:focus-visible::after { transform: translate(-50%, 0); }
  .lx-sidebar__foot > .lx-sync::after { left: 0; transform: translateY(2px); }
  .lx-sidebar__foot > .lx-sync:hover::after, .lx-sidebar__foot > .lx-sync:focus-visible::after { transform: none; }
  .lx-sync .lx-sync__ok, .lx-sync .lx-sync__off { display: none; }
  .lx-sync.is-ok { color: var(--positive); } .lx-sync.is-ok .lx-sync__ok { display: block; }
  .lx-sync.is-err { color: var(--negative); } .lx-sync.is-local .lx-sync__off { display: block; }
  .lx-sync.is-busy svg { animation: lx-blink 1.2s ease-in-out infinite; }
  .lx-theme .lx-theme__sun, :root[data-theme="light"] .lx-theme .lx-theme__moon { display: none; }
  :root[data-theme="light"] .lx-theme .lx-theme__sun { display: block; }
  .lx-content { min-width: 0; }
  .lx-mbar { display: none; }

  /* ---------- PostgreSQL signal ---------- */
  .lx-signalwrap { position: relative; }
  .lx-signal { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--control-height); padding: 0 8px;
    border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font: 500 12px/1 var(--font); cursor: help; text-align: left; }
  .lx-signal:hover, .lx-signalwrap.is-open .lx-signal { background: var(--hover); color: var(--text); }
  .lx-signal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--control); transition: background-color .4s ease; }
  .is-ready .lx-signal__dot { background: var(--positive); }
  [data-state="error"] .lx-signal__dot { background: var(--negative); }
  [data-state="loading"] .lx-signal__dot, [data-state="reloading"] .lx-signal__dot { animation: lx-blink 1.2s ease-in-out infinite; background: var(--warning); }
  @keyframes lx-blink { 50% { opacity: .35; } }
  .lx-signal__label { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lx-pop { position: absolute; bottom: calc(100% + 8px); left: 0; width: 380px; max-width: calc(100vw - 32px); z-index: 30;
    background: var(--raised); color: var(--text); border: 1px solid var(--control); border-radius: var(--radius); box-shadow: var(--shadow-menu);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .18s ease, visibility 0s linear .18s; }
  .lx-signalwrap:hover .lx-pop, .lx-signalwrap:focus-within .lx-pop, .lx-signalwrap.is-open .lx-pop { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lx-pop__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  .lx-pop__title { font-weight: 600; font-size: 14px; }
  .lx-pop__body { padding: 0 16px 14px; font-size: 13px; line-height: 20px; color: var(--text-2); }
  .lx-pop__body p { margin: 0 0 8px; }
  .lx-pop__body ol { margin: 0; padding-left: 18px; }
  .lx-pop__body li { margin: 0 0 6px; }
  .lx-pop__body code { font: 500 12px/1 var(--mono); color: var(--text); background: var(--well); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-pop__body .lx-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0 0 10px; }
  .lx-pop__body .lx-kv dt { color: var(--muted); }
  .lx-pop__body .lx-kv dd { margin: 0; color: var(--text); }
  .lx-pop__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }

  /* ---------- Feedback motion only: no entrances ---------- */
  .lx-btn, .lx-iconbtn, .lx-nav__item, .lx-tab, .lx-row, .lx-opt, .lx-cellmap a, .lx-week, .lx-exlist a, .lx-editor { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .lx-btn:active, .lx-iconbtn:active { transform: translateY(1px); }
  .lx-callout, .lx-q__explain:not([hidden]) { animation: lx-in .2s ease-out; }
  @keyframes lx-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- Canvas, title row ---------- */
  .lx-page { max-width: 1320px; padding: 36px var(--pad) 80px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
  .lx-head__text { flex: 1 1 520px; min-width: 0; max-width: 880px; }
  .lx-h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
  .lx-ctx { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-ctx .n { color: var(--text-2); font-size: 12px; }
  .lx-lead { margin: 10px 0 0; color: var(--text-2); font-size: 14px; line-height: 22px; max-width: 780px; }
  .lx-find { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--text); }
  .lx-find .n { font-size: 13px; }
  .lx-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lx-spacer { flex: 1; }
  .lx-stack { display: flex; flex-direction: column; gap: 16px; }
  .lx-h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
  .lx-section { font-size: 20px; line-height: 26px; font-weight: 400; color: var(--muted); }
  .lx-section b { color: var(--text); font-weight: 600; }

  /* ---------- Buttons: pills; primary inverted white ---------- */
  .lx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text);
    font: 500 13px/1 var(--font); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lx-btn:hover { background: var(--raised); border-color: var(--control-hover); }
  .lx-btn--primary { background: var(--invert); border-color: var(--invert); color: var(--invert-ink); font-weight: 600; }
  .lx-btn--primary:hover { background: var(--invert-hover); border-color: var(--invert-hover); }
  .lx-btn--ghost { border-color: transparent; color: var(--text-2); padding: 0 12px; }
  .lx-btn--ghost:hover { background: var(--raised); border-color: transparent; color: var(--text); }
  .lx-btn[disabled] { opacity: .5; cursor: progress; }
  .lx-iconbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; flex: none; }
  .lx-iconbtn:hover { background: var(--raised); color: var(--text); }
  .lx-iconbtn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: 0; white-space: nowrap; padding: 5px 9px;
    border-radius: var(--radius-sm); background: var(--invert); color: var(--invert-ink); font: 500 12px/16px var(--font); opacity: 0; pointer-events: none; z-index: 10; transform: translateY(2px); transition: opacity .15s ease, transform .15s ease; }
  .lx-iconbtn:hover::after, .lx-iconbtn:focus-visible::after { opacity: 1; transform: none; }
  .lx-iconbtn.is-off { opacity: .35; pointer-events: none; }
  kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: var(--radius-sm); background: var(--raised); color: var(--text-2); border: 1px solid var(--control); white-space: nowrap; }

  /* ---------- Status: a dot and a word; blue = solved, amber = not yet ---------- */
  .lx-badge { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; font: 500 12px/18px var(--font); color: var(--muted); }
  .lx-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--control); }
  .lx-badge--success { color: var(--accent-ink); } .lx-badge--success::before { background: var(--accent); }
  .lx-badge--info { color: var(--text-2); } .lx-badge--info::before { background: var(--text-2); }
  .lx-badge--warning { color: var(--warning); } .lx-badge--warning::before { background: var(--warning); }
  .lx-badge--danger { color: var(--negative); } .lx-badge--danger::before { background: var(--negative); }
  .lx-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--raised); color: var(--text-2);
    font: 500 12px/1 var(--font); white-space: nowrap; flex: none; text-decoration: none; }
  a.lx-tag:hover { background: var(--tag-hover); color: var(--text); }

  /* ---------- Cards: darker than the ground ---------- */
  .lx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .lx-card__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 20px; }
  .lx-card__head + .lx-card__body { padding-top: 0; }
  .lx-card__meta { font-size: 13px; color: var(--muted); }
  .lx-card__body { padding: 20px; }
  .lx-card__foot { padding: 14px 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  .lx-scroll { overflow-x: auto; }

  /* Tables: rules and alignment */
  .lx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-table th { text-align: left; padding: 8px 20px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .lx-table td { padding: 11px 20px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .lx-table tbody tr:last-child td { border-bottom: 0; }
  .lx-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lx-table--data { font: 400 12px/18px var(--mono); }
  .lx-table--data th { font: 500 12px/16px var(--mono); color: var(--text-2); position: sticky; top: 0; background: var(--surface); }
  .lx-table--data td, .lx-table--data th { padding: 7px 16px; white-space: pre; }
  .lx-table--data tbody tr:hover td { background: var(--hover); }
  .lx-table--data td:first-child, .lx-table--data th:first-child { padding-left: 20px; }
  .lx-datawrap { max-height: 480px; overflow: auto; border-top: 1px solid var(--rule); }
  .lx-null { color: var(--muted); font-style: italic; }

  /* KPI strip: one container, divided */
  .lx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lx-kpi { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lx-kpi + .lx-kpi { border-left: 1px solid var(--rule); }
  .lx-kpi__k { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-kpi__v { font: 500 22px/28px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .lx-kpi--lead .lx-kpi__v { font-size: 32px; line-height: 38px; font-weight: 600; }
  .lx-kpi__u { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; font-family: var(--font); }
  .lx-kpi__n { font-size: 13px; line-height: 18px; color: var(--muted); }
  .lx-meter { position: relative; height: 4px; border-radius: 2px; background: var(--cell); overflow: hidden; margin-top: 6px; }
  .lx-meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* ---------- Signature: every SQL exercise as one cell ---------- */
  .lx-map { display: flex; flex-direction: column; }
  .lx-row { display: grid; grid-template-columns: 52px minmax(200px, 1fr) minmax(240px, 380px) 72px 72px 112px 32px; align-items: center; gap: 0 20px;
    padding: 14px 20px; border-top: 1px solid var(--rule); text-decoration: none; color: var(--text); }
  .lx-row:hover { background: var(--hover); }
  .lx-row--head { padding-top: 0; padding-bottom: 10px; border-top: 0; color: var(--muted); font-size: 12px; line-height: 16px; }
  .lx-row--head:hover { background: none; }
  .lx-row--head .r { font-family: var(--font); font-size: 12px; }
  .lx-row__k { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-row__t { min-width: 0; }
  .lx-row__t a { color: var(--text); text-decoration: none; font-weight: 600; }
  .lx-row__t a:hover { color: var(--accent-ink); }
  .lx-row__sub { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-row .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .lx-row .r small { color: var(--muted); font-size: 12px; }
  .lx-cellmap { display: flex; flex-wrap: wrap; gap: 3px; }
  .lx-cellmap a, .lx-cellmap span { display: block; width: 12px; height: 12px; border-radius: 2px; background: var(--cell); }
  .lx-cellmap .is-pass { background: var(--accent); }
  .lx-cellmap .is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-cellmap a:hover { background: var(--text-2); }
  .lx-cellmap--empty { font-size: 12px; color: var(--muted); }
  .lx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .lx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lx-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--cell); }
  .lx-legend i.is-pass { background: var(--accent); }
  .lx-legend i.is-fail { background: transparent; border: 1px solid var(--warning); }

  /* ---------- Fifteen weeks: this part's weeks carry the blue line ---------- */
  .lx-weeks { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 0; padding: 0 20px 20px; }
  .lx-week { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 10px 4px; border-top: 1px solid var(--control); color: var(--muted); font-size: 12px; line-height: 16px; text-decoration: none; }
  .lx-week + .lx-week { border-left: 1px solid var(--rule); }
  .lx-week__n { font: 600 13px/16px var(--mono); color: var(--text-2); }
  .lx-week__t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .lx-week.is-on { color: var(--text-2); }
  .lx-week.is-on::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--accent); }
  .lx-week.is-on .lx-week__n { color: var(--text); }
  .lx-week__exam { color: var(--warning); font-weight: 600; }
  .lx-weeks--thin .lx-week { min-height: 56px; }
  .lx-weeklist { list-style: none; margin: 0; padding: 0 20px 12px; }
  .lx-weeklist li { display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 13px; }
  .lx-weeklist .n { color: var(--text-2); font-size: 12px; }
  button.lx-week { appearance: none; background: none; border-right: 0; border-bottom: 0; text-align: left; font: inherit; cursor: pointer; }
  button.lx-week:hover { background: var(--hover); }
  .lx-week.is-now { background: var(--accent-bg); }
  .lx-week.is-now::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent); }

  .lx-callout { border-radius: var(--radius); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--raised); color: var(--text); font-size: 13px; }
  .lx-callout a { color: inherit; }
  .lx-callout--success { background: var(--accent-bg); color: var(--accent-bg-ink); }
  .lx-callout--warning { background: var(--warning-bg); color: var(--warning-bg-ink); }
  .lx-callout--danger { background: var(--negative-bg); color: var(--negative-bg-ink); font-family: var(--mono); font-size: 12px; }
  .lx-callout--danger strong { font-family: var(--font); }
  .lx-callout__text { flex: 1 1 320px; }

  /* ---------- Step tabs on one rule ---------- */
  .lx-flow { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); }
  .lx-flow__steps { flex: 1; display: flex; gap: 28px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .lx-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .lx-tab:hover { color: var(--text); }
  .lx-tab .n { font-size: 12px; color: var(--muted); }
  .lx-tab.is-active { color: var(--text); }
  .lx-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); }
  .lx-flow__arrows { display: flex; gap: 4px; padding-bottom: 5px; }
  .lx-flow__arrows .lx-iconbtn::after { bottom: auto; top: calc(100% + 6px); }

  /* ---------- Reading ---------- */
  .lx-prose { color: var(--prose); font-size: 14px; line-height: 23px; }
  .lx-prose h3 { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text); margin: 28px 0 8px; }
  .lx-prose h3:first-child { margin-top: 0; }
  .lx-prose p { margin: 8px 0; }
  .lx-prose ul, .lx-prose ol { padding-left: 20px; margin: 8px 0; }
  .lx-prose li { margin: 4px 0; }
  .lx-prose li::marker { color: var(--muted); }
  .lx-prose a { color: var(--accent-ink); }
  .lx-prose code, .lx-code { font: 500 12.5px/1 var(--mono); background: var(--raised); color: var(--code); border-radius: var(--radius-sm); padding: 2px 5px; }
  .lx-prose strong { font-weight: 600; color: var(--text); }
  .lx-prose .table-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-prose table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lx-prose th { text-align: left; padding: 8px 12px; color: var(--muted); font: 400 12px/16px var(--font); border-bottom: 1px solid var(--border); }
  .lx-prose td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .lx-prose tr:last-child td { border-bottom: 0; }
  pre.code { font: 400 12.5px/1.65 var(--mono); background: var(--well); color: var(--code); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 12px 0; }
  pre.code code { background: none; padding: 0; font: inherit; color: inherit; }
  details > summary { cursor: pointer; font-weight: 600; color: var(--text); list-style: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary svg.i { width: 12px; height: 12px; color: var(--muted); transition: transform .15s ease; }
  details > summary:hover { color: var(--accent-ink); }
  details[open] > summary svg.i { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: 8px; }
  .lx-en { margin: 0 0 14px; padding: 12px 16px; background: var(--raised); border-radius: var(--radius); color: var(--text-2); font-size: 13px; line-height: 21px; }
  .lx-en::before { content: "Đề gốc"; display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lx-en p { margin: 0; }

  /* ---------- Quiz & essays ---------- */
  .lx-qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .lx-qno { font: 600 13px/18px var(--mono); color: var(--text-2); }
  .lx-q__opts { display: grid; gap: 8px; margin-top: 14px; }
  .lx-opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--ground); border: 1px solid var(--border); cursor: pointer; }
  .lx-opt:hover { border-color: var(--control); background: var(--hover); }
  .lx-opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .lx-opt.is-right { border-color: var(--accent); background: var(--accent-bg); }
  .lx-opt.is-wrong { border-color: var(--negative); background: var(--negative-bg); }
  .lx-q__explain { margin-top: 12px; color: var(--text-2); }
  .lx-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .lx-check input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- Exercise: list beside the console ---------- */
  .lx-work { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-exlist { position: sticky; top: 24px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .lx-exlist ul { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  .lx-exlist a { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 8px; align-items: center; gap: 10px; min-height: 32px; padding: 6px 16px 6px 20px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .lx-exlist a:hover { background: var(--hover); color: var(--text); }
  .lx-exlist li[aria-selected="true"] a { color: var(--text); }
  .lx-exlist li[aria-selected="true"] a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--accent); }
  .lx-exlist .lx-list__id { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-exlist .lx-list__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lx-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cell); }
  .lx-dot.is-pass { background: var(--accent); }
  .lx-dot.is-fail { background: transparent; border: 1px solid var(--warning); }
  .lx-exhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 18px 20px 14px; }
  .lx-exhead__id { font: 600 18px/24px var(--mono); letter-spacing: -.01em; }
  .lx-exmeta { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .lx-console { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lx-console:focus-within { border-color: var(--focus-line); }
  .lx-console__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
  .lx-console__bar label { font: 500 12px/18px var(--mono); color: var(--text-2); }
  .lx-console__keys { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .lx-editor { width: 100%; min-height: 220px; resize: vertical; display: block; margin: 0;
    font: 400 13.5px/1.65 var(--mono); tab-size: 2; color: var(--code); caret-color: var(--accent); background: transparent;
    border: 0; border-radius: 0; padding: 14px 16px; }
  .lx-editor::placeholder { color: var(--placeholder); }
  .lx-editor:focus { outline: none; }
  input.lx-editor { min-height: 0; height: 40px; resize: none; }
  .lx-field { background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); }
  .lx-field:focus-within { border-color: var(--focus-line); }
  .lx-runbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; }
  .lx-pager { display: flex; justify-content: space-between; gap: 12px; }

  /* ---------- Schema & FD ---------- */
  .lx-tables { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); align-items: start; }
  .lx-tables .lx-card__head { padding: 14px 16px 10px 20px; }
  .lx-tables h3 { font: 600 14px/20px var(--mono); }
  .lx-cols-list { list-style: none; margin: 0; padding: 0 0 12px; }
  .lx-cols-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 20px; font: 400 13px/18px var(--mono); }
  .lx-cols-list li + li { border-top: 1px solid var(--rule); }
  .lx-cols-list .is-pk { color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .lx-cols-list .lx-subtle { text-align: right; }
  .lx-fd-form { display: flex; flex-direction: column; gap: 16px; }
  .lx-fd-form label { display: flex; flex-direction: column; gap: 8px; font-weight: 500; font-size: 13px; }
  .lx-fd-form label .lx-subtle { font-weight: 400; }
  .lx-fd-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .lx-select { height: var(--control-height); max-width: 100%; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; padding: 0 14px; }

  /* ---------- Reading columns with a side panel ---------- */
  .lx-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
  .lx-aside { position: sticky; top: 24px; display: flex; flex-direction: column; gap: var(--gap); }
  .lx-aside .lx-kpi__v { margin-bottom: 4px; }
  .lx-aside__note { margin: 12px 0 0; font-size: 13px; color: var(--text-2); }
  .lx-read { max-width: 860px; }
  .lx-toc { list-style: none; margin: 0; padding: 0 8px 12px; counter-reset: toc; max-height: calc(100vh - 140px); overflow-y: auto; }
  .lx-toc li { margin: 0; }
  .lx-toc button { appearance: none; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font: 400 13px/18px var(--font); padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer; }
  .lx-toc button:hover { background: var(--hover); color: var(--text); }
  .lx-qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; margin-top: 16px; }
  .lx-qcell { appearance: none; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--ground); color: var(--text-2); font: 500 12px/1 var(--mono); cursor: pointer; }
  .lx-qcell:hover { border-color: var(--control); color: var(--text); }
  .lx-qcell.is-pass { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lx-qcell.is-fail { border-color: var(--warning); color: var(--warning); }
  .lx-qcell.is-picked { border-color: var(--placeholder); color: var(--text); background: var(--raised); }
  .lx-howto { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gap); }
  .lx-howto ul { margin: 0; padding-left: 18px; }
  .lx-keys { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; margin: 0; align-items: center; }
  .lx-keys dt { white-space: nowrap; color: var(--muted); }
  .lx-keys dd { margin: 0; color: var(--text-2); }
  .lx-fdgrid { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .lx-fdin { position: sticky; top: 24px; }
  .lx-fdin .lx-select { max-width: 100%; }

  /* ---------- Tablet & phone: the sidebar folds into a 48px bar and a sheet ---------- */
  @media (max-width: 1100px) {
    .lx-split, .lx-fdgrid { grid-template-columns: minmax(0, 1fr); }
    .lx-aside, .lx-fdin { position: static; }
    .lx-work { grid-template-columns: 232px minmax(0, 1fr); }
    .lx-row { grid-template-columns: 48px minmax(160px, 1fr) minmax(160px, 240px) 64px 96px 32px; }
    .lx-row > .lx-row__ess { display: none; }
    .lx-weeks { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 0; }
  }
  @media (max-width: 900px) {
    :root { --pad: 16px; --gap: 16px; }
    .lx-app { display: block; }
    .lx-mbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 4px;
      background: var(--ground); border-bottom: 1px solid var(--border); }
    .lx-mbar .lx-brand__mark { width: 22px; height: 22px; }
    .lx-mbar__title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lx-mbar .lx-iconbtn { width: 44px; height: 44px; color: var(--text); }
    .lx-mbar .lx-iconbtn svg.i { width: 20px; height: 20px; }
    .lx-sidebar { display: none; position: fixed; inset: 52px 0 0; z-index: 24; height: auto; border-right: 0; }
    .lx-app.is-navopen .lx-sidebar { display: flex; }
    .lx-app.is-navopen { overflow: hidden; }
    .lx-sidebar > .lx-brand { display: none; }
    .lx-nav { padding-top: 16px; }
    .lx-nav__item, .lx-signal { min-height: 44px; font-size: 15px; }
    .lx-nav__sub .lx-nav__item { min-height: 44px; }
    .lx-pop { width: 100%; }
    .lx-page { padding: 20px var(--pad) 56px; }
    .lx-h1 { font-size: 22px; line-height: 28px; }
    .lx-head .lx-actions, .lx-head .lx-btn--primary { width: 100%; }
    .lx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lx-kpi { padding: 14px 16px; }
    .lx-kpi:nth-child(3) { border-left: 0; }
    .lx-kpi:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .lx-kpi--lead .lx-kpi__v { font-size: 26px; line-height: 32px; }
    .lx-row { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "k t s" "c c c"; gap: 10px 12px; padding: 14px 16px; }
    .lx-row--head { display: none; }
    .lx-row__k { grid-area: k; } .lx-row__t { grid-area: t; } .lx-row .lx-cellmap { grid-area: c; } .lx-row > .lx-row__st { grid-area: s; }
    .lx-row > .r, .lx-row > .lx-row__go { display: none; }
    .lx-weeks { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 16px 16px; }
    .lx-week:nth-child(5n + 1) { border-left: 1px solid var(--rule); }
    .lx-week:nth-child(3n + 1) { border-left: 0; }
    .lx-work { grid-template-columns: minmax(0, 1fr); }
    .lx-weeklist li { grid-template-columns: 72px minmax(0, 1fr); }

t values\n  ('A', 'M', 8,  0,  8,  50),\n  ('A', 'W', 8,  0,  8,  50),\n  ('A', 'F', 8,  0,  8,  50),\n  ('B', 'M', 9,  0,  9,  50),\n  ('B', 'W', 9,  0,  9,  50),\n  ('B', 'F', 9,  0,  9,  50),\n  ('C', 'M', 11, 0,  11, 50),\n  ('C', 'W', 11, 0,  11, 50),\n  ('C', 'F', 11, 0,  11, 50),\n  ('D', 'M', 13, 0,  13, 50),\n  ('D', 'W', 13, 0,  13, 50),\n  ('D', 'F', 13, 0,  13, 50),\n  ('E', 'T', 10, 30, 11, 45),\n  ('E', 'R', 10, 30, 11, 45),\n  ('F', 'T', 14, 30, 15, 45),\n  ('F', 'R', 14, 30, 15, 45),\n  ('G', 'M', 16, 0,  16, 50),\n  ('G', 'W', 16, 0,  16, 50),\n  ('G', 'F', 16, 0,  16, 50),\n  ('H', 'W', 10, 0,  12, 30);\n\ninsert into prereq values\n  ('BIO-301', 'BIO-101'),\n  ('BIO-399', 'BIO-101'),\n  ('CS-190',  'CS-101'),\n  ('CS-315',  'CS-101'),\n  ('CS-319',  'CS-101'),\n  ('CS-347',  'CS-101'),\n  ('EE-181',  'PHY-101');\n","-- =====================================================================\n-- Các bảng phụ dùng cho bài tập (self join, recursion, ranking,\n-- windowing, OLAP). Chạy SAU university_data.sql.\n-- =====================================================================\n\ndrop table if exists emp_super cascade;\ndrop table if exists grade_points cascade;\ndrop table if exists student_grades cascade;\ndrop table if exists dept_grades cascade;\ndrop table if exists sales cascade;\ndrop table if exists itemcategory cascade;\ndrop table if exists daily_sales cascade;\ndrop table if exists account_txn cascade;\n\n-- Slide 3: \"Self Join Example\" — relation emp-super(person, supervisor)\ncreate table emp_super (\n  person      varchar(20) primary key,\n  supervisor  varchar(20)\n);\ninsert into emp_super values\n  ('Bob',   'Alice'),\n  ('Mary',  'Susan'),\n  ('Alice', 'David'),\n  ('David', 'Mary'),\n  ('Tom',   'Bob'),\n  ('Eve',   'Alice');\n\n-- Điểm số quy đổi của từng letter grade\ncreate table grade_points (\n  grade   varchar(2) primary key,\n  points  numeric(2,1)\n);\ninsert into grade_points values\n  ('A', 4.0), ('A-', 3.7), ('B+', 3.3), ('B', 3.0), ('B-', 2.7),\n  ('C+', 2.3), ('C', 2.0), ('C-', 1.7), ('F', 0.0);\n\n-- Slide 5: student_grades(ID, GPA) và dept_grades(ID, dept_name, GPA)\n-- GPA = sum(points * credits) / sum(credits), bỏ qua môn chưa có điểm.\n-- Sinh viên chưa học môn nào có GPA = null.\ncreate table student_grades as\nselect s.ID,\n       round(sum(gp.points * c.credits) / sum(c.credits), 2)::numeric(3,2) as GPA\nfrom student s\n     left join takes t on t.ID = s.ID\n     left join course c on c.course_id = t.course_id\n     left join grade_points gp on gp.grade = t.grade\ngroup by s.ID;\n\ncreate table dept_grades as\nselect sg.ID, s.dept_name, sg.GPA\nfrom student_grades sg join student s on s.ID = sg.ID;\n\n-- Slide 5 (OLAP): sales(item_name, color, clothes_size, quantity)\ncreate table sales (\n  item_name     varchar(10),\n  color         varchar(10),\n  clothes_size  varchar(10),\n  quantity      integer\n);\ninsert into sales values\n  ('skirt', 'dark',   'small', 2),  ('skirt', 'dark',   'medium', 5),  ('skirt', 'dark',   'large', 1),\n  ('skirt', 'pastel', 'small', 11), ('skirt', 'pastel', 'medium', 9),  ('skirt', 'pastel', 'large', 15),\n  ('skirt', 'white',  'small', 2),  ('skirt', 'white',  'medium', 5),  ('skirt', 'white',  'large', 3),\n  ('dress', 'dark',   'small', 2),  ('dress', 'dark',   'medium', 6),  ('dress', 'dark',   'large', 12),\n  ('dress', 'pastel', 'small', 4),  ('dress', 'pastel', 'medium', 3),  ('dress', 'pastel', 'large', 3),\n  ('dress', 'white',  'small', 2),  ('dress', 'white',  'medium', 3),  ('dress', 'white',  'large', 0),\n  ('shirt', 'dark',   'small', 2),  ('shirt', 'dark',   'medium', 6),  ('shirt', 'dark',   'large', 6),\n  ('shirt', 'pastel', 'small', 4),  ('shirt', 'pastel', 'medium', 1),  ('shirt', 'pastel', 'large', 2),\n  ('shirt', 'white',  'small', 17), ('shirt', 'white',  'medium', 1),  ('shirt', 'white',  'large', 10),\n  ('pants', 'dark',   'small', 14), ('pants', 'dark',   'medium', 6),  ('pants', 'dark',   'large', 0),\n  ('pants', 'pastel', 'small', 1),  ('pants', 'pastel', 'medium', 0),  ('pants', 'pastel', 'large', 1),\n  ('pants', 'white',  'small', 3),  ('pants', 'white',  'medium', 0),  ('pants', 'white',  'large', 2);\n\ncreate table itemcategory (\n  item_name  varchar(10) primary key,\n  category   varchar(15)\n);\ninsert into itemcategory values\n  ('skirt', 'womenswear'), ('dress', 'womenswear'),\n  ('shirt', 'menswear'),   ('pants', 'menswear');\n\n-- Hàm tiện ích để kiểm tra ràng buộc: chạy câu SQL q, trả về 'ok' nếu thành\n-- công, ngược lại trả về mã SQLSTATE (23502 not null, 23503 foreign key,\n-- 23505 unique, 23514 check, 42501 permission denied, ...).\n-- Ví dụ: select try_sql($$insert into department values ('X', 'Y', -1)$$);\ncreate or replace function try_sql(q text) returns text\nlanguage plpgsql as $$\nbegin\n  execute q;\n  return 'ok';\nexception when others then\n  return sqlstate;\nend $$;\n\n-- Chạy câu truy vấn q và trả về giá trị đầu tiên (dạng text). Khác với một\n-- subquery thông thường, nó thấy được các thay đổi mà try_sql vừa làm\n-- trong cùng câu select (đọc từ trái sang phải).\n-- Ví dụ: select try_sql($$delete from ...$$), sql_value($$select count(*) from ...$$);\ncreate or replace function sql_value(q text) returns text\nlanguage plpgsql as $$\ndeclare\n  v text;\nbegin\n  execute q into v;\n  return v;\nend $$;\n\n-- Slide 5 (Windowing): sales(date, value) — đổi tên để không trùng bảng sales ở trên\ncreate table daily_sales (\n  sale_date  date primary key,\n  value      numeric(8,2)\n);\ninsert into daily_sales values\n  ('2018-03-01', 120), ('2018-03-02', 80),  ('2018-03-03', 200),\n  ('2018-03-04', 150), ('2018-03-05', 90),  ('2018-03-06', 300),\n  ('2018-03-07', 60);\n\n-- Slide 5 (Windowing within partitions): transaction(account_number, date_time, value)\n-- value > 0: gửi tiền, value \u003c 0: rút tiền\ncreate table account_txn (\n  account_number  varchar(10),\n  date_time       timestamp,\n  value           numeric(10,2),\n  primary key (account_number, date_time)\n);\ninsert into account_txn values\n  ('A-101', '2018-01-05 09:00', 500),\n  ('A-101', '2018-01-12 14:30', -200),\n  ('A-101', '2018-02-01 10:15', 300),\n  ('A-101', '2018-02-20 16:45', -50),\n  ('A-215', '2018-01-07 11:00', 1000),\n  ('A-215', '2018-01-30 08:20', -400),\n  ('A-215', '2018-03-02 13:10', 250);\n","-- =====================================================================\n-- Bảng cho Part 8 (Chương 20–23: kiến trúc, lưu trữ / xử lý truy vấn /\n-- giao dịch song song và phân tán). Mọi bảng đều có prefix pd_.\n-- \"Node\" và \"site\" chỉ là một cột dữ liệu: các bài mô phỏng việc chia\n-- dữ liệu, chuyển tuple và log của nhiều máy bằng SQL trên một database.\n--\n--   Ch20  pd_run, pd_amdahl, pd_job_task, pd_system, pd_proc, pd_mem_access\n--   Ch21  pd_order, pd_hist, pd_replica, pd_master_epoch, pd_route\n--   Ch22  pd_emp, pd_dept, pd_band_r, pd_band_s, pd_bloom_r, pd_bloom_s,\n--         pd_lo_r, pd_lo_s, pd_sab, pd_doc\n--   Ch23  pd_2pc_part, pd_2pc_log, pd_quorum, pd_copy, pd_read_req, pd_wfg,\n--         pd_event, pd_msg_in, pd_chain, pd_lease, pd_serve,\n--         pd_primary_hist, pd_replica_apply, pd_replica_read, pd_sched\n-- =====================================================================\n\ndrop table if exists pd_run, pd_amdahl, pd_job_task, pd_system, pd_proc, pd_mem_access cascade;\ndrop table if exists pd_order, pd_hist, pd_replica, pd_master_epoch, pd_route cascade;\ndrop table if exists pd_emp, pd_dept, pd_band_r, pd_band_s, pd_bloom_r, pd_bloom_s, pd_lo_r, pd_lo_s, pd_sab, pd_doc cascade;\ndrop table if exists pd_2pc_part, pd_2pc_log, pd_quorum, pd_copy, pd_read_req, pd_wfg, pd_event, pd_msg_in,\n  pd_chain, pd_lease, pd_serve, pd_primary_hist, pd_replica_apply, pd_replica_read, pd_sched cascade;\n\n-- ================================================================ Chương 20\n-- Thời gian chạy (giây) của 3 workload trên 1..16 node.\n--   Q1: speedup — dữ liệu cố định 100 GB.\n--   Q2: scaleup — dữ liệu tăng theo số node (10 GB mỗi node).\n--   Q3: join 64 GB, mỗi node có 16 GB RAM (superlinear speedup, PE 20.9).\ncreate table pd_run (\n  workload  varchar(5),\n  nodes     integer,\n  data_gb   integer,\n  seconds   numeric(8,2),\n  primary key (workload, nodes)\n);\ninsert into pd_run values\n  ('Q1', 1, 100, 400), ('Q1', 2, 100, 210), ('Q1', 4, 100, 110), ('Q1', 8, 100, 60), ('Q1', 16, 100, 40),\n  ('Q2', 1, 10, 100), ('Q2', 2, 20, 105), ('Q2', 4, 40, 115), ('Q2', 8, 80, 125), ('Q2', 16, 160, 160),\n  ('Q3', 1, 64, 600), ('Q3', 2, 64, 300), ('Q3', 4, 64, 120), ('Q3', 8, 64, 80);\n\n-- Amdahl: p = phần có thể song song hoá, n = số bộ xử lý.\ncreate table pd_amdahl (\n  task  varchar(10) primary key,\n  p     numeric(4,3) not null,\n  n     integer not null\n);\ninsert into pd_amdahl values\n  ('A', 0.8, 4), ('B', 0.8, 16), ('C', 0.95, 16), ('D', 0.5, 100), ('PE20.5', 0.8, 1000000);\n\n-- Thời gian từng node xử lý phần việc của một job song song.\ncreate table pd_job_task (\n  job      varchar(5),\n  node     integer,\n  seconds  numeric(6,2),\n  primary key (job, node)\n);\ninsert into pd_job_task values\n  ('J1', 1, 10), ('J1', 2, 11), ('J1', 3, 9), ('J1', 4, 10),\n  ('J2', 1, 5), ('J2', 2, 5), ('J2', 3, 5), ('J2', 4, 25),\n  ('J3', 1, 8), ('J3', 2, 8), ('J3', 3, 8), ('J3', 4, 8);\n\n-- Các hệ thống: bộ nhớ chung? đĩa chung?\ncreate table pd_system (\n  name           varchar(30) primary key,\n  shared_memory  boolean not null,\n  shared_disk    boolean not null\n);\ninsert into pd_system values\n  ('Multicore server', true, true),\n  ('Oracle RAC cluster', false, true),\n  ('Teradata', false, false),\n  ('Hadoop cluster', false, false),\n  ('SAN cluster', false, true);\n\n-- NUMA: mỗi bộ xử lý thuộc một node bộ nhớ; độ trễ truy cập (ns) theo node bộ nhớ.\ncreate table pd_proc (\n  proc       varchar(5) primary key,\n  home_node  integer not null\n);\ninsert into pd_proc values ('P0', 0), ('P1', 0), ('P2', 1), ('P3', 1);\ncreate table pd_mem_access (\n  proc      varchar(5) references pd_proc,\n  mem_node  integer,\n  ns        integer,\n  primary key (proc, mem_node)\n);\ninsert into pd_mem_access values\n  ('P0', 0, 80), ('P0', 1, 140), ('P1', 0, 82), ('P1', 1, 138),\n  ('P2', 0, 145), ('P2', 1, 78), ('P3', 0, 150), ('P3', 1, 80);\n\n-- ================================================================ Chương 21\ncreate table pd_order (\n  order_id    integer primary key,\n  customer    varchar(10) not null,\n  amount      integer not null,\n  order_date  date not null\n);\ninsert into pd_order values\n  (1, 'An', 120, '2024-01-05'), (2, 'Binh', 450, '2024-01-09'), (3, 'Chi', 980, '2024-01-15'),\n  (4, 'An', 60, '2024-01-20'), (5, 'Dung', 1500, '2024-02-02'), (6, 'Giang', 310, '2024-02-11'),\n  (7, 'Hoa', 75, '2024-02-14'), (8, 'Binh', 220, '2024-02-25'), (9, 'An', 640, '2024-03-03'),\n  (10, 'Chi', 180, '2024-03-08'), (11, 'Dung', 90, '2024-03-19'), (12, 'An', 1200, '2024-03-30'),\n  (13, 'Giang', 150, '2024-04-04'), (14, 'Hoa', 400, '2024-04-12'), (15, 'An', 55, '2024-04-18'),\n  (16, 'Binh', 130, '2024-05-01'), (17, 'Chi', 770, '2024-05-09'), (18, 'An', 95, '2024-05-21'),\n  (19, 'Dung', 260, '2024-06-02'), (20, 'Hoa', 110, '2024-06-10'), (21, 'An', 85, '2024-06-17'),\n  (22, 'Giang', 1990, '2024-06-23'), (23, 'Binh', 170, '2024-06-28'), (24, 'An', 140, '2024-06-30');\n\n-- Histogram của PE 21.2a.\ncreate table pd_hist (\n  lo    integer primary key,\n  hi    integer not null,\n  freq  integer not null\n);\ninsert into pd_hist values\n  (1, 10, 15), (11, 20, 5), (21, 30, 20), (31, 40, 10), (41, 50, 10),\n  (51, 60, 5), (61, 70, 5), (71, 80, 20), (81, 90, 5), (91, 100, 5);\n\n-- Bản sao của từng data item: một primary, hai backup.\ncreate table pd_replica (\n  item  varchar(5),\n  node  varchar(5),\n  role  varchar(10) check (role in ('primary', 'backup')),\n  primary key (item, node)\n);\ninsert into pd_replica values\n  ('I1', 'N1', 'primary'), ('I1', 'N2', 'backup'), ('I1', 'N3', 'backup'),\n  ('I2', 'N1', 'primary'), ('I2', 'N3', 'backup'), ('I2', 'N4', 'backup'),\n  ('I3', 'N1', 'primary'), ('I3', 'N4', 'backup'), ('I3', 'N2', 'backup'),\n  ('I4', 'N2', 'primary'), ('I4', 'N3', 'backup'), ('I4', 'N4', 'backup'),\n  ('I5', 'N2', 'primary'), ('I5', 'N4', 'backup'), ('I5', 'N1', 'backup'),\n  ('I6', 'N2', 'primary'), ('I6', 'N1', 'backup'), ('I6', 'N3', 'backup'),\n  ('I7', 'N3', 'primary'), ('I7', 'N4', 'backup'), ('I7', 'N1', 'backup'),\n  ('I8', 'N3', 'primary'), ('I8', 'N1', 'backup'), ('I8', 'N2', 'backup'),\n  ('I9', 'N4', 'primary'), ('I9', 'N1', 'backup'), ('I9', 'N2', 'backup');\n-- Thứ tự ưu tiên: khi primary hỏng, backup có thứ tự 1 lên làm primary.\nalter table pd_replica add column backup_rank integer;\nupdate pd_replica r set backup_rank = x.rk\nfrom (values ('I1','N2',1),('I1','N3',2),('I2','N3',1),('I2','N4',2),('I3','N4',1),('I3','N2',2),\n             ('I4','N3',1),('I4','N4',2),('I5','N4',1),('I5','N1',2),('I6','N1',1),('I6','N3',2),\n             ('I7','N4',1),('I7','N1',2),('I8','N1',1),('I8','N2',2),('I9','N1',1),('I9','N2',2)) as x(item, node, rk)\nwhere r.item = x.item and r.node = x.node;\n\n-- Lịch sử master của từng record (epoch tăng dần mỗi lần đổi master) và các request đã gửi.\ncreate table pd_master_epoch (\n  item   varchar(5),\n  epoch  integer,\n  node   varchar(5) not null,\n  primary key (item, epoch)\n);\ninsert into pd_master_epoch values\n  ('K1', 1, 'N1'), ('K1', 2, 'N3'),\n  ('K2', 1, 'N2'),\n  ('K3', 1, 'N4'), ('K3', 2, 'N2'), ('K3', 3, 'N4');\ncreate table pd_route (\n  req      integer primary key,\n  item     varchar(5) not null,\n  sent_to  varchar(5) not null\n);\ninsert into pd_route values (1, 'K1', 'N1'), (2, 'K1', 'N3'), (3, 'K2', 'N2'), (4, 'K3', 'N2'), (5, 'K3', 'N4');\n\n-- ================================================================ Chương 22\n-- pd_emp đang được chia round-robin trên 3 node (node = (emp_id - 1) % 3);\n-- pd_dept được chia theo dept_id % 3.\ncreate table pd_dept (\n  dept_id  integer primary key,\n  dname    varchar(15) not null,\n  node     integer not null\n);\ninsert into pd_dept values\n  (1, 'Sales', 1), (2, 'IT', 2), (3, 'HR', 0), (4, 'Finance', 1), (5, 'Legal', 2), (6, 'Research', 0);\ncreate table pd_emp (\n  emp_id   integer primary key,\n  dept_id  integer not null references pd_dept,\n  salary   integer not null,\n  node     integer not null\n);\ninsert into pd_emp values\n  (1, 1, 50, 0), (2, 1, 60, 1), (3, 2, 80, 2), (4, 1, 55, 0), (5, 3, 45, 1), (6, 1, 65, 2),\n  (7, 2, 90, 0), (8, 1, 52, 1), (9, 4, 70, 2), (10, 1, 58, 0), (11, 5, 100, 1), (12, 2, 85, 2),\n  (13, 1, 61, 0), (14, 3, 47, 1), (15, 1, 59, 2), (16, 2, 95, 0), (17, 1, 54, 1), (18, 4, 75, 2);\n\n-- Band join (PE 22.4): chia range theo khoảng 10 giá trị: 1–10 → 0, 11–20 → 1, 21–30 → 2.\ncreate table pd_band_r (a integer primary key);\ncreate table pd_band_s (b integer primary key);\ninsert into pd_band_r values (2), (9), (11), (19), (24), (30);\ninsert into pd_band_s values (1), (10), (12), (21), (22), (28);\n\n-- Bloom filter (PE 22.6): s nhỏ, r lớn và đa số tuple của r không khớp.\ncreate table pd_bloom_s (b integer primary key);\ninsert into pd_bloom_s values (3), (8), (21), (34);\ncreate table pd_bloom_r (id integer primary key, b integer not null);\ninsert into pd_bloom_r select g, (g * 7) % 40 + 1 from generate_series(1, 40) g;\n\n-- Left outer join (PE 22.7b): r nhỏ, s lớn và được chia trên 3 node.\ncreate table pd_lo_r (a integer primary key, label varchar(10));\ninsert into pd_lo_r values (1, 'one'), (2, 'two'), (3, 'three'), (4, 'four'), (5, 'five');\ncreate table pd_lo_s (id integer primary key, a integer, val varchar(10), node integer);\ninsert into pd_lo_s values\n  (1, 1, 'x1', 0), (2, 3, 'x2', 1), (3, 1, 'x3', 2), (4, 6, 'x4', 0), (5, 3, 'x5', 1), (6, 7, 'x6', 2), (7, 5, 'x7', 0);\n\n-- PE 22.8: s(A, B, C) đang được chia theo B (node = b % 3).\ncreate table pd_sab (id integer primary key, a integer, b integer, c integer, node integer);\ninsert into pd_sab\nselect g, g % 4, g % 9, g * 10, (g % 9) % 3 from generate_series(1, 36) g;\n\n-- MapReduce: đếm từ.\ncreate table pd_doc (doc_id integer primary key, body text);\ninsert into pd_doc values\n  (1, 'Parallel databases partition data across nodes.'),\n  (2, 'Each node processes its partition of the data in parallel.'),\n  (3, 'Skew makes one node slower: the slowest node decides the response time.');\n\n-- ================================================================ Chương 23\n-- Two-phase commit: coordinator là site C; S1, S2 là participant.\ncreate table pd_2pc_part (\n  txn   varchar(5),\n  site  varchar(5),\n  primary key (txn, site)\n);\ninsert into pd_2pc_part select t, s from unnest(array['T1','T2','T3','T4','T5']) t, unnest(array['S1','S2']) s;\n-- rec: prepare (coordinator), ready / no (phiếu của participant), commit, abort.\ncreate table pd_2pc_log (\n  txn   varchar(5),\n  site  varchar(5),\n  seq   integer,\n  rec   varchar(10) check (rec in ('prepare', 'ready', 'no', 'commit', 'abort')),\n  primary key (txn, site, seq)\n);\ninsert into pd_2pc_log values\n  ('T1', 'C', 1, 'prepare'), ('T1', 'S1', 2, 'ready'), ('T1', 'S2', 3, 'ready'), ('T1', 'C', 4, 'commit'), ('T1', 'S1', 5, 'commit'), ('T1', 'S2', 6, 'commit'),\n  ('T2', 'C', 1, 'prepare'), ('T2', 'S1', 2, 'ready'), ('T2', 'S2', 3, 'no'), ('T2', 'S2', 4, 'abort'), ('T2', 'C', 5, 'abort'), ('T2', 'S1', 6, 'abort'),\n  ('T3', 'C', 1, 'prepare'), ('T3', 'S1', 2, 'ready'), ('T3', 'S2', 3, 'ready'), ('T3', 'C', 4, 'commit'), ('T3', 'S2', 5, 'commit'),\n  ('T4', 'C', 1, 'prepare'), ('T4', 'S1', 2, 'ready'), ('T4', 'S2', 3, 'ready'),\n  ('T5', 'C', 1, 'prepare'), ('T5', 'S1', 2, 'ready');\n\n-- Cấu hình quorum: n bản sao, read quorum r, write quorum w.\ncreate table pd_quorum (\n  cfg  varchar(5) primary key,\n  n    integer not null,\n  r    integer not null,\n  w    integer not null\n);\ninsert into pd_quorum values ('A', 3, 2, 2), ('B', 3, 1, 3), ('C', 3, 1, 2), ('D', 5, 3, 3), ('E', 5, 4, 2), ('F', 4, 2, 2);\n\n-- Các bản sao của data item (version càng lớn càng mới) và các lần đọc quorum.\ncreate table pd_copy (\n  item     varchar(5),\n  node     varchar(5),\n  version  integer,\n  val      integer,\n  primary key (item, node)\n);\ninsert into pd_copy values\n  ('X', 'N1', 3, 300), ('X', 'N2', 2, 200), ('X', 'N3', 3, 300),\n  ('Y', 'N1', 1, 10), ('Y', 'N2', 2, 20), ('Y', 'N3', 1, 10);\ncreate table pd_read_req (\n  req   integer,\n  item  varchar(5),\n  node  varchar(5),\n  primary key (req, node)\n);\ninsert into pd_read_req values (1, 'X', 'N1'), (1, 'X', 'N2'), (2, 'X', 'N2'), (2, 'X', 'N3'), (3, 'Y', 'N1'), (3, 'Y', 'N3'), (4, 'Y', 'N2'), (4, 'Y', 'N3');\n\n-- Local wait-for graph của từng site (PE 23.8). ts null = cạnh cục bộ.\ncreate table pd_wfg (\n  site    varchar(5),\n  waiter  varchar(5),\n  holder  varchar(5),\n  ts      integer\n);\ninsert into pd_wfg values\n  ('S1', 'T1', 'T2', null), ('S1', 'T2', 'T3', 5),\n  ('S2', 'T2', 'T3', 5), ('S2', 'T3', 'T1', 8), ('S2', 'T5', 'T4', null),\n  ('S3', 'T3', 'T1', 8), ('S3', 'T4', 'T5', 11);\n\n-- Sự kiện của 3 tiến trình: local, send, recv (msg nối send với recv).\ncreate table pd_event (\n  proc  varchar(5),\n  seq   integer,\n  kind  varchar(5) check (kind in ('local', 'send', 'recv')),\n  msg   varchar(5),\n  primary key (proc, seq)\n);\ninsert into pd_event values\n  ('P1', 1, 'local', null), ('P1', 2, 'send', 'm1'), ('P1', 3, 'local', null), ('P1', 4, 'recv', 'm3'),\n  ('P2', 1, 'recv', 'm1'), ('P2', 2, 'send', 'm2'), ('P2', 3, 'local', null),\n  ('P3', 1, 'local', null), ('P3', 2, 'local', null), ('P3', 3, 'recv', 'm2'), ('P3', 4, 'send', 'm3');\n\n-- Persistent messaging bằng sequence number (PE 23.5): thứ tự các message tới nơi.\ncreate table pd_msg_in (\n  sender   varchar(5),\n  seq      integer,\n  arrival  integer,\n  primary key (sender, seq)\n);\ninsert into pd_msg_in values\n  ('A', 1, 1), ('A', 2, 2), ('A', 4, 3), ('A', 3, 5), ('A', 6, 6),\n  ('B', 2, 4), ('B', 1, 7), ('B', 3, 8),\n  ('C', 2, 9), ('C', 3, 10);\n\n-- Chain replication (PE 23.9): pos 1 là head, pos lớn nhất là tail.\ncreate table pd_chain (\n  item     varchar(5),\n  pos      integer,\n  node     varchar(5),\n  version  integer,\n  primary key (item, pos)\n);\ninsert into pd_chain values\n  ('A', 1, 'N1', 7), ('A', 2, 'N2', 7), ('A', 3, 'N3', 6),\n  ('B', 1, 'N2', 4), ('B', 2, 'N3', 4), ('B', 3, 'N4', 4),\n  ('C', 1, 'N3', 9), ('C', 2, 'N4', 8), ('C', 3, 'N1', 8);\n\n-- Lease của primary (PE 23.10) và các request mà node đã tự phục vụ với tư cách primary.\ncreate table pd_lease (\n  node         varchar(5),\n  lease_start  integer,\n  lease_end    integer,\n  primary key (node, lease_start)\n);\ninsert into pd_lease values ('N1', 0, 10), ('N1', 10, 20), ('N2', 25, 35);\ncreate table pd_serve (\n  req   integer primary key,\n  node  varchar(5) not null,\n  t     integer not null\n);\ninsert into pd_serve values (1, 'N1', 3), (2, 'N1', 15), (3, 'N1', 22), (4, 'N1', 27), (5, 'N2', 26), (6, 'N2', 40);\n\n-- Lazy replication (PE 23.7): các version đã commit ở primary và thời điểm replica nhận được.\ncreate table pd_primary_hist (\n  version   integer primary key,\n  t_commit  integer not null,\n  balance   integer not null\n);\ninsert into pd_primary_hist values (1, 0, 100), (2, 10, 110), (3, 20, 120);\ncreate table pd_replica_apply (\n  node     varchar(5),\n  version  integer references pd_primary_hist,\n  t_apply  integer not null,\n  primary key (node, version)\n);\ninsert into pd_replica_apply values ('R1', 1, 1), ('R1', 2, 12), ('R1', 3, 21), ('R2', 1, 2), ('R2', 2, 30), ('R2', 3, 31);\ncreate table pd_replica_read (\n  read_id  integer primary key,\n  node     varchar(5) not null,\n  t        integer not null\n);\ninsert into pd_replica_read values (1, 'R1', 15), (2, 'R2', 15), (3, 'R2', 25), (4, 'R1', 25), (5, 'R2', 35);\n\n-- Schedule trên hai site của một federated database (PE 23.11b).\n-- T1 là giao dịch cục bộ ở site 1, T2 ở site 2; G1, G2 là giao dịch toàn cục\n-- (G2 chỉ bắt đầu sau khi G1 kết thúc).\ncreate table pd_sched (\n  step  integer primary key,\n  site  integer not null,\n  txn   varchar(5) not null,\n  op    varchar(5) check (op in ('read', 'write')),\n  item  varchar(5) not null\n);\ninsert into pd_sched values\n  (1, 1, 'T1', 'read', 'X1'),\n  (2, 1, 'G1', 'write', 'X1'),\n  (3, 2, 'G1', 'write', 'X2'),\n  (4, 2, 'T2', 'read', 'X2'),\n  (5, 2, 'T2', 'write', 'Y2'),\n  (6, 2, 'G2', 'read', 'Y2'),\n  (7, 1, 'G2', 'read', 'Y1'),\n  (8, 1, 'T1', 'write', 'Y1');\n"],"setupFiles":["lab/db/university_schema.sql","lab/db/university_data.sql","lab/db/extra_tables.sql","lab/db/p8_tables.sql"],"schemaGroups":[{"title":"Bảng cho Chương 20–23 (mô phỏng nhiều node)","note":"","core":false,"tables":[{"table":"pd_2pc_log","columns":[{"column":"txn","type":"character varying(5)","pk":true},{"column":"site","type":"character varying(5)","pk":true},{"column":"seq","type":"integer(32,0)","pk":true},{"column":"rec","type":"character varying(10)","pk":false}]},{"table":"pd_2pc_part","columns":[{"column":"txn","type":"character varying(5)","pk":true},{"column":"site","type":"character varying(5)","pk":true}]},{"table":"pd_amdahl","columns":[{"column":"task","type":"character varying(10)","pk":true},{"column":"p","type":"numeric(4,3)","pk":false},{"column":"n","type":"integer(32,0)","pk":false}]},{"table":"pd_band_r","columns":[{"column":"a","type":"integer(32,0)","pk":true}]},{"table":"pd_band_s","columns":[{"column":"b","type":"integer(32,0)","pk":true}]},{"table":"pd_bloom_r","columns":[{"column":"id","type":"integer(32,0)","pk":true},{"column":"b","type":"integer(32,0)","pk":false}]},{"table":"pd_bloom_s","columns":[{"column":"b","type":"integer(32,0)","pk":true}]},{"table":"pd_chain","columns":[{"column":"item","type":"character varying(5)","pk":true},{"column":"pos","type":"integer(32,0)","pk":true},{"column":"node","type":"character varying(5)","pk":false},{"column":"version","type":"integer(32,0)","pk":false}]},{"table":"pd_copy","columns":[{"column":"item"," alse}]},{"table":"grade_points","columns":[{"column":"grade","type":"character varying(2)","pk":true},{"column":"points","type":"numeric(2,1)","pk":false}]},{"table":"itemcategory","columns":[{"column":"item_name","type":"character varying(10)","pk":true},{"column":"category","type":"character varying(15)","pk":false}]},{"table":"sales","columns":[{"column":"item_name","type":"character varying(10)","pk":false},{"column":"color","type":"character varying(10)","pk":false},{"column":"clothes_size","type":"character varying(10)","pk":false},{"column":"quantity","type":"integer(32,0)","pk":false}]},{"table":"student_grades","columns":[{"column":"id","type":"character varying(5)","pk":false},{"column":"gpa","type":"numeric(3,2)","pk":false}]}]}],"chapters":[{"key":"ch20","store":"20","short":"20","label":"Chương 20","navLabel":"Chương 20","kind":"Chương","title":"Database-System Architectures","titleVi":"Kiến trúc hệ CSDL","summary":"\u003ch3>0. Phạm vi\u003c/h3>\n\u003cp>Chương 20 không nằm trong lịch học CS4420 (Chương 1–7); phần này để tự học theo slide của sách. Bài SQL \u003cstrong>mô phỏng\u003c/strong> các khái niệm (speedup, scaleup, Amdahl, skew, NUMA) bằng dữ liệu đo đạc trong các bảng \u003ccode>pd_*\u003c/code>.\u003c/p>\n\u003ch3>1. Kiến trúc tập trung và client–server (slide 20.3–20.8)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Centralized system\u003c/strong>: một máy (có thể nhiều core) chạy DBMS. \u003cem>Coarse-grained parallelism\u003c/em>: vài core dùng chung bộ nhớ; \u003cem>fine-grained\u003c/em>: rất nhiều bộ xử lý.\u003c/li>\u003cli>\u003cstrong>Client–server\u003c/strong>: chức năng tách thành \u003cstrong>front end\u003c/strong> (form, report, GUI, công cụ phân tích) và \u003cstrong>back end\u003c/strong> (truy cập dữ liệu, tối ưu truy vấn, đồng thời, phục hồi). Giao tiếp qua SQL hoặc API (ODBC/JDBC).\u003c/li>\u003cli>\u003cstrong>Multiuser ≠ parallel\u003c/strong> (PE 20.1): một bộ xử lý một core vẫn phục vụ nhiều người dùng bằng cách chạy xen kẽ nhiều tiến trình.\u003c/li>\u003c/ul>\n\u003ch3>2. Server system architectures (slide 20.9–20.20)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Transaction server (query server)\u003c/strong>: client gửi yêu cầu (SQL, RPC), server thực thi và trả kết quả. Gồm nhiều tiến trình dùng chung \u003cstrong>shared memory\u003c/strong>:\u003c/li>\u003cli>\u003cem>server processes\u003c/em> nhận và thực hiện truy vấn; \u003cem>lock manager process\u003c/em>; \u003cem>database writer\u003c/em> (ghi buffer bị sửa xuống đĩa); \u003cem>log writer\u003c/em>; \u003cem>checkpoint\u003c/em>; \u003cem>process monitor\u003c/em>.\u003c/li>\u003cli>Shared memory chứa buffer pool, lock table, log buffer, cached query plans.\u003c/li>\u003cli>\u003cstrong>Mutual exclusion\u003c/strong> trên cấu trúc dùng chung bằng lệnh nguyên tử \u003cstrong>test-and-set\u003c/strong> hoặc \u003cstrong>compare-and-swap\u003c/strong>, kèm \u003cstrong>memory fence\u003c/strong> để mọi cập nhật trước đó được thấy bởi tiến trình lấy được mutex (PE 20.2, 20.6).\u003c/li>\u003cli>\u003cstrong>Latch vs lock\u003c/strong> (PE 20.4): \u003cem>latch\u003c/em> là khoá ngắn hạn bảo vệ cấu trúc dữ liệu \u003cstrong>nội bộ\u003c/strong> (một trang buffer, một mục lock table), giữ trong thời gian một thao tác, không theo 2PL; \u003cem>lock\u003c/em> do giao dịch giữ trên \u003cstrong>dữ liệu\u003c/strong> của database, thường giữ tới cuối giao dịch.\u003c/li>\u003cli>Lock table đặt trong shared memory (thay vì một tiến trình riêng): tránh hai message IPC cho mỗi lần xin khoá (PE 20.3).\u003c/li>\u003cli>\u003cstrong>Data server\u003c/strong> (page shipping / item shipping): client lấy dữ liệu về xử lý; cần \u003cem>prefetching\u003c/em>, \u003cem>data caching\u003c/em>, \u003cem>lock caching\u003c/em>, \u003cem>adaptive lock granularity\u003c/em> (lock de-escalation).\u003c/li>\u003c/ul>\n\u003ch3>3. Hệ song song (slide 20.21–20.35)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Throughput\u003c/strong> (số việc hoàn thành trong một đơn vị thời gian) vs \u003cstrong>response time\u003c/strong> (thời gian hoàn thành một việc).\u003c/li>\u003cli>\u003cstrong>Speedup\u003c/strong>: bài toán cố định, tăng tài nguyên N lần. speedup = T\u003csub>small\u003c/sub> / T\u003csub>large\u003c/sub>; \u003cstrong>tuyến tính\u003c/strong> nếu bằng N, \u003cstrong>sublinear\u003c/strong> nếu nhỏ hơn.\u003c/li>\u003cli>\u003cstrong>Scaleup\u003c/strong>: tăng cả bài toán và tài nguyên N lần. scaleup = T\u003csub>small\u003c/sub> / T\u003csub>large\u003c/sub> (bài toán nhỏ trên máy nhỏ chia cho bài toán lớn trên máy lớn); \u003cstrong>tuyến tính\u003c/strong> nếu = 1. \u003cem>Batch scaleup\u003c/em> (một việc lớn hơn) và \u003cem>transaction scaleup\u003c/em> (nhiều việc hơn).\u003c/li>\u003cli>\u003cstrong>Superlinear speedup\u003c/strong> (PE 20.9): speedup > N, xảy ra khi phần dữ liệu trên mỗi node bắt đầu \u003cstrong>vừa bộ nhớ\u003c/strong>, ví dụ relation trong của join nằm gọn trong RAM, tránh đọc đĩa nhiều lần.\u003c/li>\u003cli>Các yếu tố làm giảm speedup/scaleup:\u003c/li>\u003cli>\u003cstrong>Startup / sequential cost\u003c/strong>: chi phí khởi động nhiều tiến trình, phần không song song được → \u003cstrong>Amdahl's law\u003c/strong>: speedup = 1 / ((1 − p) + p/n), với p là phần song song hoá được. Khi n → ∞, speedup → 1/(1 − p). PE 20.5: p = 0.8 → tối đa 5.\u003c/li>\u003cli>\u003cstrong>Interference\u003c/strong>: tranh chấp tài nguyên dùng chung (bus, đĩa, khoá).\u003c/li>\u003cli>\u003cstrong>Skew\u003c/strong>: chia việc không đều, thời gian của job = thời gian của \u003cstrong>phần chậm nhất\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Gustafson's law\u003c/strong> (scaleup): scaleup = 1 / ((1 − p)/n + p).\u003c/li>\u003c/ul>\n\u003ch3>4. Interconnection network và kiến trúc song song (slide 20.36–20.50)\u003c/h3>\n\u003cul>\u003cli>Mạng nối: \u003cstrong>bus\u003c/strong> (không mở rộng tốt), \u003cstrong>ring\u003c/strong>, \u003cstrong>mesh\u003c/strong>, \u003cstrong>hypercube\u003c/strong> (số bước ≤ log n), \u003cstrong>tree-like / fat-tree\u003c/strong> (dùng trong data center).\u003c/li>\u003cli>\u003cstrong>Shared memory\u003c/strong>: mọi bộ xử lý dùng chung bộ nhớ (và đĩa). Giao tiếp rất nhanh; khó mở rộng quá vài chục/trăm core; cần \u003cstrong>cache coherency\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>NUMA\u003c/strong> (non-uniform memory access): mỗi bộ xử lý có bộ nhớ cục bộ; truy cập bộ nhớ của node khác chậm hơn (PE 20.7). Hệ điều hành cấp phát bộ nhớ cục bộ và hạn chế chuyển tiến trình giữa các core (PE 20.8).\u003c/li>\u003cli>\u003cstrong>Shared disk\u003c/strong>: mỗi node có bộ nhớ riêng, dùng chung đĩa (SAN). Chịu lỗi tốt (node hỏng, node khác tiếp quản), nút thắt ở kết nối tới đĩa.\u003c/li>\u003cli>\u003cstrong>Shared nothing\u003c/strong>: mỗi node có bộ nhớ và đĩa riêng, giao tiếp qua mạng. Mở rộng tới hàng nghìn node; chi phí truyền dữ liệu giữa các node cao.\u003c/li>\u003cli>\u003cstrong>Hierarchical\u003c/strong>: kết hợp — các node shared-memory nối với nhau theo kiểu shared nothing.\u003c/li>\u003c/ul>\n\u003ch3>5. Hệ phân tán (slide 20.51–20.60)\u003c/h3>\n\u003cul>\u003cli>Dữ liệu trải trên nhiều \u003cstrong>site\u003c/strong> địa lý; \u003cem>local transaction\u003c/em> (chỉ truy cập một site) và \u003cem>global transaction\u003c/em> (nhiều site).\u003c/li>\u003cli>\u003cstrong>Homogeneous\u003c/strong>: cùng phần mềm, cùng global schema, hợp tác xử lý truy vấn. \u003cstrong>Federated / heterogeneous\u003c/strong>: schema và phần mềm khác nhau, hợp tác hạn chế (PE 20.10).\u003c/li>\u003cli>Ưu điểm: chia sẻ dữ liệu, tự chủ (autonomy), sẵn sàng cao nhờ replication. Nhược: phức tạp, cần \u003cstrong>two-phase commit\u003c/strong>, chi phí truyền thông.\u003c/li>\u003c/ul>\n\u003ch3>6. Cloud (slide 20.61–20.68)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>IaaS\u003c/strong>: thuê máy (ảo); \u003cstrong>PaaS\u003c/strong>: thuê nền tảng (có DBMS được quản lý); \u003cstrong>SaaS\u003c/strong>: thuê ứng dụng; \u003cstrong>DBaaS\u003c/strong> là một dạng PaaS.\u003c/li>\u003cli>Chọn IaaS khi muốn tự kiểm soát ứng dụng và tự chọn, tự quản DBMS (PE 20.11).\u003c/li>\u003cli>\u003cstrong>Virtual machine / container\u003c/strong>: máy vật lý hỏng thì VM khởi động lại nhanh trên máy khác (nếu dữ liệu nằm ở storage ngoài) → sẵn sàng cao (PE 20.12).\u003c/li>\u003c/ul>\n\u003ch3>Công thức cần nhớ\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Đại lượng\u003c/th>\u003cth>Công thức\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Speedup\u003c/td>\u003ctd>T(1 node) / T(n node), cùng bài toán\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Efficiency\u003c/td>\u003ctd>speedup / n\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scaleup\u003c/td>\u003ctd>T(bài nhỏ, máy nhỏ) / T(bài lớn n lần, máy lớn n lần)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amdahl\u003c/td>\u003ctd>1 / ((1 − p) + p/n) → tối đa 1/(1 − p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skew\u003c/td>\u003ctd>thời gian job = max thời gian các node; độ lệch = max / trung bình\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","quiz":[{"q":"Một hệ có một CPU một core phục vụ 200 người dùng cùng lúc. Đó có phải hệ song song không?","options":["Có, vì có nhiều người dùng","Không: multiuser không đòi hỏi parallel, các tiến trình chạy xen kẽ","Có, nếu dùng shared memory","Không xác định"],"answer":1,"explain":"PE 20.1: một bộ xử lý vẫn có thể chạy nhiều tiến trình phục vụ nhiều người dùng."},{"q":"Bài toán cố định, tăng từ 1 lên 8 node, thời gian giảm từ 400 s xuống 60 s. Speedup là?","options":["8","6.67","0.15","340"],"answer":1,"explain":"speedup = 400 / 60 ≈ 6.67 \u003c 8 → sublinear."},{"q":"Scaleup tuyến tính nghĩa là gì?","options":["Thời gian giảm N lần khi tăng tài nguyên N lần","Bài toán lớn N lần trên máy lớn N lần chạy trong cùng thời gian","Throughput không đổi","Speedup bằng 1"],"answer":1,"explain":"scaleup = T_small/T_large = 1."},{"q":"PE 20.5: 80% thời gian ở SQL (song song được), 20% ở C. Speedup tối đa?","options":["4","5","80","Vô hạn"],"answer":1,"explain":"Amdahl: 1/(1 − 0.8) = 5 khi n → ∞."},{"q":"Bốn node xử lý một job trong 5, 5, 5, 25 giây. Thời gian của job?","options":["10 s","25 s","40 s","5 s"],"answer":1,"explain":"Job kết thúc khi phần chậm nhất xong — đây là ảnh hưởng của skew."},{"q":"Khác biệt chính giữa latch và lock?","options":["Latch giữ đến cuối giao dịch","Latch ngắn hạn bảo vệ cấu trúc nội bộ, không theo 2PL; lock do giao dịch giữ trên dữ liệu","Lock chỉ dùng trong shared nothing","Không khác nhau"],"answer":1,"explain":"PE 20.4."},{"q":"Kiến trúc nào mở rộng tốt nhất tới hàng nghìn node?","options":["Shared memory","Shared disk","Shared nothing","Bus"],"answer":2,"explain":"Không dùng chung bộ nhớ hay đĩa nên không có nút thắt chung; chi phí là truyền dữ liệu qua mạng."},{"q":"Vì sao có thể xảy ra superlinear speedup khi chạy join?","options":["Do lỗi đo đạc","Khi tăng node, phần dữ liệu mỗi node vừa bộ nhớ nên tránh được I/O lặp lại","Do Amdahl","Do skew"],"answer":1,"explain":"PE 20.9."},{"q":"Trong NUMA, vì sao hệ điều hành tránh chuyển tiến trình sang core khác?","options":["Để tiết kiệm điện","Vì tiến trình sẽ phải truy cập bộ nhớ (từng là cục bộ) ở node xa, chậm hơn","Vì không thể chuyển","Vì lock table"],"answer":1,"explain":"PE 20.8."},{"q":"Hệ phân tán federated khác homogeneous ở điểm nào?","options":["Federated có global schema chung","Federated có thể khác schema và phần mềm, hợp tác hạn chế","Homogeneous không dùng 2PC","Không khác"],"answer":1,"explain":"PE 20.10."}],"questions":[{"q":"\u003cstrong>PE 20.1\u003c/strong> — Hệ nhiều người dùng có nhất thiết là hệ song song không?","en":"\u003cp>\u003cstrong>Exercise 20.1.\u003c/strong> Must a multiuser system necessarily be a parallel system? Justify your answer.\u003c/p>","answer":"\u003cp>\u003cstrong>Không.\u003c/strong> Một bộ xử lý với một core vẫn chạy được nhiều tiến trình, xen kẽ theo thời gian, để phục vụ nhiều người dùng. Song song là chuyện có
