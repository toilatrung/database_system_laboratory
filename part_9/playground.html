a queue. PostgreSQL làm điều này với GiST index và \u003ccode>order by loc &lt;-&gt; point(...) limit k\u003c/code>.\u003c/p>"},{"q":"\u003cstrong>PE 24.5.\u003c/strong> Thủ tục đệ quy tính spatial join của hai relation đều có R-tree.","en":"\u003cp>\u003cstrong>Exercise 24.5.\u003c/strong> Give a recursive procedure that efficiently computes the spatial join of two relations that both have R-tree indices. (Hint: use bounding boxes to check whether leaf entries below a pair of internal nodes can possibly intersect.)\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>join(n1, n2):                     -- n1 thuộc R-tree của r, n2 thuộc R-tree của s\n  for each entry e1 in n1:\n    for each entry e2 in n2:\n      if MBR(e1) giao MBR(e2):\n        if n1, n2 đều là lá:\n          if đối tượng e1 thật sự giao e2: output (e1, e2)\n        else if n1 là lá: join(n1-as-single-entry, child(e2))\n        else if n2 là lá: join(child(e1), n2-as-single-entry)\n        else: join(child(e1), child(e2))\ngọi join(root_r, root_s)\u003c/code>\u003c/pre>\n\u003cp>Cặp node có MBR không giao nhau bị \u003cstrong>cắt bỏ cả cây con\u003c/strong>, nên chỉ một phần nhỏ các cặp được xét. Nếu hai cây khác chiều cao, tiếp tục đi xuống cây cao hơn khi cây kia đã tới lá.\u003c/p>"},{"q":"\u003cstrong>PE 24.6.\u003c/strong> Vẽ cấu trúc extendable hashing cho các khoá 2, 3, 5, 7, 11, 17, 19, 23, 29, 31 với h(x) = x mod 8, bucket chứa 3 bản ghi.","en":"\u003cp>\u003cstrong>Exercise 24.6.\u003c/strong> A file uses extendable hashing and holds records with these search-key values:\u003c/p>\n\u003cp>2, 3, 5, 7, 11, 17, 19, 23, 29, 31\u003c/p>\n\u003cp>Show the extendable hash structure for this file when the hash function is h(x) = x mod 8 and each bucket can hold three records.\u003c/p>","answer":"\u003cp>h(x) dạng 3 bit: 2→010, 3→011, 5→101, 7→111, 11→011, 17→001, 19→011, 23→111, 29→101, 31→111.\u003c/p>\n\u003cp>Dùng i bit đầu: với i = 1, nhóm 0 có {17, 2, 3, 11, 19} = 5 > 3; i = 2, nhóm 01 có {2, 3, 11, 19} = 4 > 3 → cần \u003cstrong>global depth i = 3\u003c/strong> (bài 24.13).\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ô\u003c/th>\u003cth>Bucket (local depth)\u003c/th>\u003cth>Khoá\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>000, 001\u003c/td>\u003ctd>B1 (2)\u003c/td>\u003ctd>17\u003c/td>\u003c/tr>\u003ctr>\u003ctd>010\u003c/td>\u003ctd>B2 (3)\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>011\u003c/td>\u003ctd>B3 (3)\u003c/td>\u003ctd>3, 11, 19\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100, 101\u003c/td>\u003ctd>B4 (2)\u003c/td>\u003ctd>5, 29\u003c/td>\u003c/tr>\u003ctr>\u003ctd>110, 111\u003c/td>\u003ctd>B5 (2)\u003c/td>\u003ctd>7, 23, 31\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>(Lời giải sách vẽ tương tự: bucket 01x tách thành 010 và 011 với local depth 3, các bucket còn lại local depth 2.)\u003c/p>"},{"q":"\u003cstrong>PE 24.7.\u003c/strong> Từ cấu trúc của PE 24.6, cấu trúc thay đổi thế nào sau: (a) xoá 11; (b) xoá 31; (c) chèn 1; (d) chèn 15?","en":"\u003cp>\u003cstrong>Exercise 24.7.\u003c/strong> Show how the extendable hash structure of Exercise 24.6 changes after each of the following steps:\u003c/p>\n\u003cp>a. Delete 11.\u003c/p>\n\u003cp>b. Delete 31.\u003c/p>\n\u003cp>c. Insert 1.\u003c/p>\n\u003cp>d. Insert 15.\u003c/p>","answer":"\u003cp>Áp dụng lần lượt a → d lên cấu trúc của 24.6:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>a. Xoá 11\u003c/strong>: bucket 011 còn {3, 19}. Lúc này bucket 010 {2} và 011 {3, 19} là buddy (cùng local depth 3, chỉ khác bit cuối, tổng 3 bản ghi ≤ 3) nên \u003cstrong>có thể coalesce\u003c/strong> thành bucket 01x với local depth 2; khi đó mọi bucket có local depth ≤ 2 và bảng có thể thu về 4 ô. Lời giải sách chọn không gộp.\u003c/li>\u003cli>\u003cstrong>b. Xoá 31\u003c/strong>: bucket 11x còn {7, 23}.\u003c/li>\u003cli>\u003cstrong>c. Chèn 1\u003c/strong>: h(1) = 001 → bucket 00x, thành {17, 1}.\u003c/li>\u003cli>\u003cstrong>d. Chèn 15\u003c/strong>: h(15) = 111 → bucket 11x, thành {7, 15, 23} — vừa đủ 3, không phải tách.\u003c/li>\u003c/ul>\n\u003cp>Lưu ý: nếu chèn 15 khi 31 chưa bị xoá, bucket 11x sẽ có 4 khoá cùng h = 111; tách hay nhân đôi bảng cũng không tách được chúng (h chỉ có 3 bit) → phải dùng \u003cstrong>overflow bucket\u003c/strong>.\u003c/p>"},{"q":"\u003cstrong>PE 24.8.\u003c/strong> Viết pseudocode xoá trong extendable hashing, kèm khi nào và cách coalesce bucket (không cần thu nhỏ bảng).","en":"\u003cp>\u003cstrong>Exercise 24.8.\u003c/strong> Write pseudocode for deleting entries from an extendable hash structure, including the details of when and how buckets are coalesced. You need not handle shrinking the bucket address table.\u003c/p>","answer":"\u003cpre class=\"code\" data-lang=\"\">\u003ccode>delete(K):\n  j := bucket được trỏ bởi i bit đầu của h(K)\n  xoá K khỏi bucket j\n  coalesce(j)\n\ncoalesce(j):\n  ij := local depth của j\n  if ij = 0: return\n  k  := buddy của j — bucket có (ij − 1) bit đầu giống j, bit thứ ij ngược lại\n  if local depth của k ≠ ij: return          -- buddy đã bị tách sâu hơn, không gộp được\n  if |j| + |k| &gt; bsize: return               -- gộp sẽ tràn\n  chuyển mọi bản ghi của k sang j\n  ij := ij − 1\n  cho mọi ô của bucket address table đang trỏ tới k trỏ sang j\n  giải phóng k\n  coalesce(j)                                -- có thể gộp tiếp ở mức trên\u003c/code>\u003c/pre>\n\u003cp>Mỗi lần chỉ gộp hai bucket; tiền tố chung của bucket kết quả ngắn hơn 1 bit.\u003c/p>"},{"q":"\u003cstrong>PE 24.9.\u003c/strong> Dùng một bộ đếm đi kèm bucket address table để kiểm tra nhanh khi nào bảng có thể thu nhỏ. Cập nhật bộ đếm thế nào khi tách, gộp, xoá bucket?","en":"\u003cp>\u003cstrong>Exercise 24.9.\u003c/strong> Propose an efficient way to test whether the bucket address table of an extendable hash structure can be reduced in size, by keeping an extra count together with the table. Explain how this count is maintained when buckets are split, coalesced, or deleted. (Note: shrinking the bucket address table is expensive, and later inserts may make it grow again, so it is better not to shrink it as soon as it becomes possible, but only when the number of index entries has become small relative to the size of the bucket address table.)\u003c/p>","answer":"\u003cp>Bảng dùng i bit. Giữ \u003cstrong>count = số bucket có local depth đúng bằng i\u003c/strong>. Bảng thu nhỏ được (còn i − 1 bit) ⇔ count = 0.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Tách\u003c/strong> bucket j: nếu i\u003csub>j\u003c/sub> = i thì bảng phải nhân đôi (i tăng) và hai bucket mới có local depth = i mới → \u003cstrong>count := 2\u003c/strong> (chỉ chúng). Nếu i\u003csub>j\u003c/sub> = i − 1 → hai bucket mới có depth i → \u003cstrong>count += 2\u003c/strong>. (Sách đếm theo bucket bị tách: đặt 1 hoặc tăng 1 — tương đương nếu đếm theo cặp.)\u003c/li>\u003cli>\u003cstrong>Gộp\u003c/strong> hai buddy có depth i → \u003cstrong>count −= 2\u003c/strong> (bucket kết quả có depth i − 1).\u003c/li>\u003cli>\u003cstrong>Xoá\u003c/strong> một bucket (gộp vào buddy) có depth i → giảm tương ứng.\u003c/li>\u003cli>Khi count = 0 thì có thể thu nhỏ. Vì thu nhỏ đắt và có thể phải nhân đôi lại ngay, nên trì hoãn: giữ \u003cstrong>mảng đếm\u003c/strong> count[d] = số bucket có local depth d; thu nhỏ nhiều mức một lúc khi các count[i], count[i−1], … đều bằng 0 và số entry đã nhỏ so với kích thước bảng.\u003c/li>\u003c/ul>"}],"exercises":[{"id":"CH24.01","topic":"Bloom filter: false positive","level":1,"prompt":"\u003cp>Bloom filter có m = 10000 bit, đã chèn n = 1000 khoá. Trả về một dòng hai cột: \u003ccode>fp_rate\u003c/code> — xác suất false positive (1 − e\u003csup>−kn/m\u003c/sup>)\u003csup>k\u003c/sup> với k = 7, làm tròn 5 chữ số; và \u003ccode>k_opt\u003c/code> — số hàm băm tối ưu (m/n)·ln 2 làm tròn tới số nguyên.\u003c/p>","en":"","hint":"exp(), ln(), power(); round(x::numeric, 5).","solution":"select round(power(1 - exp(-7 * 1000.0 / 10000), 7)::numeric, 5) as fp_rate,\n       round(10000.0 / 1000 * ln(2)) as k_opt;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["fp_rate","k_opt"],"rows":[["0.0082","7"]]}},{"id":"CH24.02","topic":"Bloom filter: bật bit","level":2,"prompt":"\u003cp>Bloom filter m = 40 bit, k = 3 hàm băm: h\u003csub>i\u003c/sub>(x) = \u003ccode>abs(hashtext(x || '#' || i)) % 40\u003c/code> với i = 1, 2, 3. Chèn mọi từ trong \u003ccode>ai_word\u003c/code>. Trả về các vị trí bit được bật (cột \u003ccode>pos\u003c/code>, không trùng).\u003c/p>","en":"","hint":"ai_word cross join generate_series(1, 3).","solution":"select distinct abs(hashtext(word || '#' || i)) % 40 as pos\nfrom ai_word cross join generate_series(1, 3) as i;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["pos"],"rows":[["19"],["10"],["13"],["2"],["30"],["12"],["5"],["4"],["9"],["15"],["20"],["28"],["25"],["22"],["27"],["3"],["39"],["8"],["37"],["36"],["21"],["0"],["33"],["23"],["7"]]}},{"id":"CH24.03","topic":"Bloom filter: tra cứu","level":2,"prompt":"\u003cp>Dùng filter của CH24.02. Với mỗi từ trong \u003ccode>ai_probe\u003c/code>, trả về \u003ccode>word\u003c/code>, \u003ccode>maybe_present\u003c/code> (true nếu cả 3 bit của từ đều đã bật) và \u003ccode>actually_present\u003c/code> (từ có trong ai_word). Những dòng maybe_present = true mà actually_present = false là false positive (trên dữ liệu mẫu có hai dòng như vậy).\u003c/p>","en":"","hint":"","solution":"with bits as (\n  select distinct abs(hashtext(word || '#' || i)) % 40 as pos\n  from ai_word cross join generate_series(1, 3) as i)\nselect p.word,\n       not exists (select 1 from generate_series(1, 3) as i\n                   where abs(hashtext(p.word || '#' || i)) % 40 not in (select pos from bits)) as maybe_present,\n       p.word in (select word from ai_word) as actually_present\nfrom ai_probe p;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["word","maybe_present","actually_present"],"rows":[["alpha","true","true"],["delta","true","true"],["kilo","true","true"],["mike","true","false"],["november","false","false"],["oscar","false","false"],["papa","false","false"],["quebec","false","false"],["romeo","false","false"],["sierra","false","false"],["tango","true","false"],["uniform","false","false"]]}},{"id":"CH24.04","topic":"LSM tree: tra cứu","level":2,"prompt":"\u003cp>LSM tree hai mức \u003ccode>ai_lsm_l0\u003c/code> (mới) và \u003ccode>ai_lsm_l1\u003c/code> (cũ); mỗi phiên bản có timestamp \u003ccode>ts\u003c/code>, tombstone có \u003ccode>is_delete = true\u003c/code>. Trả về giá trị hiện tại của mọi khoá còn sống: \u003ccode>k\u003c/code>, \u003ccode>val\u003c/code> (phiên bản có ts lớn nhất trên cả hai mức; khoá mà phiên bản mới nhất là tombstone thì không xuất hiện).\u003c/p>","en":"","hint":"union all hai mức, rồi distinct on (k) order by k, ts desc — hoặc row_number().","solution":"select k, val\nfrom (select distinct on (k) k, val, is_delete\n      from (select * from ai_lsm_l0 union all select * from ai_lsm_l1) as v\n      order by k, ts desc) as latest\nwhere not is_delete;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["k","val"],"rows":[["1","a2"],["2","b3"],["4","d1"],["5","e2"],["6","f1"],["7","g1"]]}},{"id":"CH24.05","topic":"LSM tree: compaction","level":3,"prompt":"\u003cp>Mô phỏng merge L0 vào L1: tạo bảng \u003ccode>ai_lsm_merged(k, val, ts)\u003c/code> chứa đúng \u003cstrong>một\u003c/strong> phiên bản mới nhất của mỗi khoá còn sống (bỏ tombstone và mọi phiên bản cũ). Hệ thống đọc bảng theo k.\u003c/p>","en":"","hint":"","solution":"create table ai_lsm_merged as\nselect k, val, ts\nfrom (select distinct on (k) k, val, ts, is_delete\n      from (select * from ai_lsm_l0 union all select * from ai_lsm_l1) as v\n      order by k, ts desc) as latest\nwhere not is_delete;","check":"select k, val, ts from ai_lsm_merged order by k;","ordered":true,"fresh":false,"expected":{"fields":["k","val","ts"],"rows":[["1","a2","16"],["2","b3","10"],["4","d1","4"],["5","e2","13"],["6","f1","6"],["7","g1","12"]]}},{"id":"CH24.06","topic":"bitmap index","level":2,"prompt":"\u003cp>Xây bitmap index trên \u003ccode>ai_customer.gender\u003c/code>: với mỗi giá trị gender, trả về \u003ccode>gender\u003c/code> và \u003ccode>bitmap\u003c/code> — chuỗi bit (kiểu \u003ccode>varbit\u003c/code>) dài 12, bit thứ i (từ trái) là 1 nếu khách có cust_id = i có gender đó. (Chưa xét cột deleted.)\u003c/p>","en":"","hint":"string_agg(case ... then '1' else '0' end, '' order by cust_id)::varbit","solution":"select g.gender,\n       string_agg(case when c.gender = g.gender then '1' else '0' end, '' order by c.cust_id)::varbit as bitmap\nfrom (select distinct gender from ai_customer) as g cross join ai_customer c\ngroup by g.gender;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["gender","bitmap"],"rows":[["F","101011010101"],["M","010100101010"]]}},{"id":"CH24.07","topic":"bitmap AND + count","level":2,"prompt":"\u003cp>Trả lời \"khách nữ có income_level = 2\" bằng bitmap: tính bitmap của gender = 'F', bitmap của income_level = 2 và \u003cstrong>AND\u003c/strong> chúng. Trả về một dòng: \u003ccode>result_bitmap\u003c/code> (varbit) và \u003ccode>num_rows\u003c/code> (số bit 1 của kết quả).\u003c/p>","en":"","hint":"bit_count(varbit) đếm số bit 1.","solution":"with b as (\n  select string_agg(case when gender = 'F' then '1' else '0' end, '' order by cust_id)::varbit as f,\n         string_agg(case when income_level = 2 then '1' else '0' end, '' order by cust_id)::varbit as l2\n  from ai_customer)\nselect f & l2 as result_bitmap, bit_count(f & l2) as num_rows\nfrom b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["result_bitmap","num_rows"],"rows":[["100010010000","3"]]}},{"id":"CH24.08","topic":"bitmap NOT + existence","level":3,"prompt":"\u003cp>Bản ghi có \u003ccode>deleted = true\u003c/code> coi như đã bị xoá. Tính \"income_level \u003cstrong>khác\u003c/strong> 3\" bằng bitmap: NOT bitmap(income_level = 3) \u003cstrong>AND\u003c/strong> existence bitmap (bit 1 nếu bản ghi chưa bị xoá). Trả về \u003ccode>naive_not\u003c/code> (chỉ NOT, chưa AND), \u003ccode>with_existence\u003c/code> và \u003ccode>num_rows\u003c/code> (số bit 1 của with_existence).\u003c/p>","en":"","hint":"","solution":"with b as (\n  select string_agg(case when income_level = 3 then '1' else '0' end, '' order by cust_id)::varbit as l3,\n         string_agg(case when deleted then '0' else '1' end, '' order by cust_id)::varbit as ex\n  from ai_customer)\nselect ~l3 as naive_not, ~l3 & ex as with_existence, bit_count(~l3 & ex) as num_rows\nfrom b;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["naive_not","with_existence","num_rows"],"rows":[["110111011110","110101011110","8"]]}},{"id":"CH24.09","topic":"nearest neighbor","level":1,"prompt":"\u003cp>Ba địa điểm trong \u003ccode>ai_place\u003c/code> gần điểm (5, 5) nhất: \u003ccode>name\u003c/code>, \u003ccode>dist\u003c/code> (khoảng cách Euclid, làm tròn 3 chữ số), sắp theo khoảng cách tăng dần.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 24.4.\u003c/strong> Give an algorithm for searching an R-tree that efficiently finds the nearest neighbor of a given query point.\u003c/p>","hint":"Toán tử \u003c-> giữa hai point; order by ... limit 3.","solution":"select name, round((loc \u003c-> point(5, 5))::numeric, 3) as dist\nfrom ai_place\norder by loc \u003c-> point(5, 5)\nlimit 3;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["name","dist"],"rows":[["Cafe","1"],["Park","1"],["Bank","1.414"]]}},{"id":"CH24.10","topic":"region query","level":1,"prompt":"\u003cp>Region query: với mỗi vùng trong \u003ccode>ai_region\u003c/code>, liệt kê các địa điểm nằm trong vùng đó (kể cả trên biên): \u003ccode>region\u003c/code>, \u003ccode>place\u003c/code>.\u003c/p>","en":"","hint":"point \u003c@ box.","solution":"select r.name as region, p.name as place\nfrom ai_region r join ai_place p on p.loc \u003c@ r.area;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["region","place"],"rows":[["Downtown","Cafe"],["East","Gym"],["Downtown","Bank"],["North","Museum"],["North","School"],["Downtown","Park"],["North","Station"],["North","Clinic"]]}},{"id":"CH24.11","topic":"MBR filter vs giao thật","level":3,"prompt":"\u003cp>Spatial join theo hai bước như R-tree: bước lọc dùng \u003cstrong>MBR\u003c/strong> của đoạn thẳng (\u003ccode>box(seg[0], seg[1])\u003c/code>) giao vùng (\u003ccode>&amp;&amp;\u003c/code>), bước tinh kiểm tra đoạn \u003cstrong>thật sự\u003c/strong> giao vùng (\u003ccode>seg ?# area\u003c/code>). Với mọi cặp (vùng, đoạn) qua được bước lọc, trả về \u003ccode>region\u003c/code>, \u003ccode>seg_id\u003c/code>, \u003ccode>really_intersects\u003c/code>. Các dòng false là false hit do MBR lớn.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 24.3.\u003c/strong> Suppose line segments are to be stored in an R-tree. When a segment is not parallel to the axes, its bounding box can be large and contain a lot of empty area.\u003c/p>\n\u003cul>\u003cli>Describe how such large bounding boxes affect the performance of queries asking for the line segments that intersect a given region.\u003c/li>\u003cli>Briefly describe a technique that improves the performance of such queries, and give an example of its benefit. (Hint: segments can be split into smaller pieces.)\u003c/li>\u003c/ul>","hint":"","solution":"select r.name as region, s.seg_id, s.seg ?# r.area as really_intersects\nfrom ai_region r join ai_segment s on box(s.seg[0], s.seg[1]) && r.area;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["region","seg_id","really_intersects"],"rows":[["Downtown","1","true"],["North","1","true"],["East","1","false"],["North","4","true"],["East","4","true"],["Downtown","5","true"],["North","5","true"],["East","5","true"],["North","6","true"]]}},{"id":"CH24.12","topic":"extendable hashing: bit","level":1,"prompt":"\u003cp>Với mỗi khoá trong \u003ccode>ai_hash_key\u003c/code> và h(x) = x mod 8, trả về \u003ccode>k\u003c/code>, \u003ccode>h\u003c/code> và \u003ccode>h_bits\u003c/code> — h viết dạng chuỗi nhị phân 3 bit (ví dụ 5 → '101').\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 24.6.\u003c/strong> A file uses extendable hashing and holds records with these search-key values:\u003c/p>\n\u003cp>2, 3, 5, 7, 11, 17, 19, 23, 29, 31\u003c/p>\n\u003cp>Show the extendable hash structure for this file when the hash function is h(x) = x mod 8 and each bucket can hold three records.\u003c/p>","hint":"(x % 8)::bit(3)::text.","solution":"select k, k % 8 as h, ((k % 8)::bit(3))::text as h_bits\nfrom ai_hash_key;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["k","h","h_bits"],"rows":[["2","2","010"],["3","3","011"],["5","5","101"],["7","7","111"],["11","3","011"],["17","1","001"],["19","3","011"],["23","7","111"],["29","5","101"],["31","7","111"]]}},{"id":"CH24.13","topic":"extendable hashing: global depth","level":3,"prompt":"\u003cp>Bucket chứa tối đa 3 bản ghi; extendable hashing dùng \u003cstrong>i bit đầu\u003c/strong> của h_bits (CH24.12). Với i = 1, 2, 3, trả về \u003ccode>i\u003c/code> và \u003ccode>max_bucket\u003c/code> — số khoá lớn nhất rơi vào cùng một tiền tố i bit. Từ đó thấy global depth nhỏ nhất là bao nhiêu.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 24.6.\u003c/strong> A file uses extendable hashing and holds records with these search-key values:\u003c/p>\n\u003cp>2, 3, 5, 7, 11, 17, 19, 23, 29, 31\u003c/p>\n\u003cp>Show the extendable hash structure for this file when the hash function is h(x) = x mod 8 and each bucket can hold three records.\u003c/p>","hint":"","solution":"select i, max(cnt) as max_bucket\nfrom (select i, left(((k % 8)::bit(3))::text, i) as prefix, count(*) as cnt\n      from ai_hash_key cross join generate_series(1, 3) as i\n      group by i, prefix) as t\ngroup by i;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["i","max_bucket"],"rows":[["3","3"],["2","4"],["1","5"]]}}]},{"key":"ch25","store":"25","short":"25","label":"Chương 25","navLabel":"Chương 25","kind":"Chương","title":"Advanced Application Development","titleVi":"Phát triển ứng dụng nâng cao","summary":"\u003ch3>0. Nội dung chương\u003c/h3>\n\u003cp>Ba chủ đề lớn khi đưa một ứng dụng CSDL vào vận hành: \u003cstrong>tuning hiệu năng\u003c/strong>, \u003cstrong>benchmark\u003c/strong> để đo và so sánh, và \u003cstrong>chuẩn hoá\u003c/strong> (standardization) để các hệ thống làm việc được với nhau. Thêm vào đó: \u003cstrong>kiểm thử\u003c/strong> ứng dụng, \u003cstrong>chuyển đổi\u003c/strong> (migration) ứng dụng cũ, và \u003cstrong>directory system\u003c/strong> (LDAP).\u003c/p>\n\u003ch3>1. Tuning hiệu năng\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Tìm bottleneck\u003c/strong>: một hệ thống là mạng các \u003cem>hàng đợi\u003c/em> (CPU, đĩa, lock, mạng…). Thời gian chủ yếu dồn vào vài thành phần; cải thiện thành phần không phải bottleneck gần như không có tác dụng. Hàng đợi với tỉ lệ sử dụng ρ có độ dài trung bình ≈ ρ/(1 − ρ) → giữ ρ dưới ~70%.\u003c/li>\u003cli>Công cụ: \u003ccode>EXPLAIN\u003c/code> / \u003ccode>EXPLAIN ANALYZE\u003c/code>, thống kê truy vấn (pg_stat_statements), buffer hit ratio, chờ lock (pg_locks), tiện ích hệ điều hành (top, iostat, netstat) — PE 25.1.\u003c/li>\u003cli>\u003cstrong>Các mức tuning\u003c/strong>:\u003c/li>\u003cli>\u003cem>Phần cứng\u003c/em>: thêm RAM (giảm I/O), SSD, thêm CPU. Quy tắc 5 phút: trang được truy cập thường hơn khoảng mỗi 5 phút (đĩa từ) thì nên giữ trong bộ nhớ; với SSD con số này khác.\u003c/li>\u003cli>\u003cem>Tham số hệ thống\u003c/em>: kích thước buffer, số tiến trình, checkpoint, mức log.\u003c/li>\u003cli>\u003cem>Lược đồ, index, view\u003c/em>: thêm/bỏ index theo \u003cstrong>workload\u003c/strong> (truy vấn nào chạy nhiều, chọn ít dòng mà phải quét cả bảng → thiếu index); clustered index; \u003cstrong>materialized view\u003c/strong> cho truy vấn tổng hợp lặp lại (đánh đổi chi phí cập nhật). Công cụ \u003cem>tuning wizard\u003c/em> đề xuất index/view từ workload.\u003c/li>\u003cli>\u003cem>Transaction\u003c/em>: dùng thao tác \u003cstrong>theo lô\u003c/strong> (set-oriented) thay vì từng dòng, giảm số lần gọi qua mạng; stored procedure; tách transaction dài; tránh lock \u003cstrong>hot spot\u003c/strong> (ví dụ sequence counter — dùng sequence không theo 2PL, PE 25.2); dùng snapshot isolation cho truy vấn chỉ đọc dài.\u003c/li>\u003cli>\u003cstrong>Bulk load\u003c/strong>: chèn rất nhiều bản ghi → bỏ index rồi tạo lại (bottom-up build rẻ hơn chèn từng khoá), hoặc dùng bulk-load sắp xếp rồi merge vào lá B\u003csup>+\u003c/sup>-tree (PE 25.4). Index tối ưu ghi (LSM) ít cần mẹo này.\u003c/li>\u003cli>\u003cstrong>Performance simulation\u003c/strong>: mô hình hoá hàng đợi để dự đoán hiệu năng trước khi mua phần cứng.\u003c/li>\u003c/ul>\n\u003ch3>2. Benchmark\u003c/h3>\n\u003cul>\u003cli>Đo \u003cstrong>throughput\u003c/strong> (giao dịch/giây) và \u003cstrong>response time\u003c/strong>. Với nhiều loại giao dịch có tốc độ khác nhau, throughput trung bình là \u003cstrong>trung bình điều hoà có trọng số\u003c/strong> theo tỉ lệ (mix), \u003cem>không\u003c/em> phải trung bình cộng: T = 1 / Σ(p\u003csub>i\u003c/sub>/t\u003csub>i\u003c/sub>) (PE 25.6).\u003c/li>\u003cli>\u003cstrong>TPC\u003c/strong> (Transaction Processing Performance Council):\u003c/li>\u003cli>\u003cstrong>TPC-C\u003c/strong>: OLTP (đơn hàng, kho) — đo tpmC và \u003cstrong>giá/hiệu năng\u003c/strong> ($/tpmC).\u003c/li>\u003cli>\u003cstrong>TPC-E\u003c/strong>: OLTP môi trường môi giới chứng khoán, thay thế dần TPC-C.\u003c/li>\u003cli>\u003cstrong>TPC-H\u003c/strong>: truy vấn ad hoc kiểu decision support (QphH); \u003cstrong>TPC-DS\u003c/strong>: data warehouse hiện đại.\u003c/li>\u003cli>Quy định: phải công bố toàn bộ cấu hình và \u003cstrong>chi phí\u003c/strong> hệ thống (kể cả bảo trì), kiểm toán độc lập, đáp ứng ACID.\u003c/li>\u003cli>Các benchmark khác: YCSB cho key-value store, benchmark cho hệ thống phân tích.\u003c/li>\u003c/ul>\n\u003ch3>3. Chuẩn hoá (standardization)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Anticipatory standard\u003c/strong> (đi trước sản phẩm, định hướng ngành) vs \u003cstrong>reactionary standard\u003c/strong> (chuẩn hoá cái đã có trên thị trường) — PE 25.8.\u003c/li>\u003cli>SQL: SQL-86/89, SQL-92, SQL:1999 (đệ quy, trigger, object-relational), SQL:2003 (XML, window), SQL:2006/2008/2011 (temporal), SQL:2016 (JSON)… Chuẩn chia thành nhiều phần (Framework, Foundation, CLI, PSM, MED, OLB…).\u003c/li>\u003cli>Kết nối CSDL: \u003cstrong>ODBC\u003c/strong>, \u003cstrong>JDBC\u003c/strong>, ADO.NET, Python DB-API. Chuẩn dữ liệu: XML, JSON; chuẩn object: ODMG (cũ), JDO, JPA.\u003c/li>\u003c/ul>\n\u003ch3>4. Directory system (LDAP)\u003c/h3>\n\u003cul>\u003cli>Thư mục = CSDL tối ưu cho \u003cstrong>đọc nhiều, ghi ít\u003c/strong>, dữ liệu dạng \u003cstrong>cây phân cấp\u003c/strong> (người, máy, dịch vụ).\u003c/li>\u003cli>\u003cstrong>LDAP\u003c/strong>: mỗi entry có \u003cstrong>distinguished name (DN)\u003c/strong> gồm các RDN từ lá lên gốc, ví dụ \u003ccode>cn=Lan, ou=Sales, o=Acme, c=VN\u003c/code>; entry có các thuộc tính (một số đa trị) thuộc object class.\u003c/li>\u003cli>Truy vấn: base DN + scope (base / one level / subtree) + filter.\u003c/li>\u003cli>\u003cstrong>Phân tán\u003c/strong>: mỗi tổ chức quản lý một cây con (\u003cem>directory information tree\u003c/em>, DIT); \u003cstrong>referral\u003c/strong> trỏ sang server khác. Referral cũng cho phép \u003cstrong>nhiều cây phân cấp\u003c/strong> (theo địa lý, theo phòng ban) trỏ tới cùng dữ liệu gốc mà không cần chép (PE 25.9).\u003c/li>\u003c/ul>\n\u003ch3>5. Kiểm thử ứng dụng\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Regression test\u003c/strong>: lưu kết quả mong đợi, sau mỗi thay đổi chạy lại và so sánh (except hai chiều).\u003c/li>\u003cli>Dữ liệu test cần bắt được lỗi: ví dụ dùng nhầm \u003ccode>natural join\u003c/code> thay cho \u003ccode>natural left outer join\u003c/code> chỉ lộ ra khi có tuple ở r \u003cstrong>không khớp\u003c/strong> s (PE 25.7); test cả giá trị null và tuple ở bảng được tham chiếu không có tuple tham chiếu (PE 4.5).\u003c/li>\u003cli>\u003cstrong>Mutation testing\u003c/strong>: thay đổi nhỏ câu truy vấn (đổi join, đổi toán tử) và kiểm tra bộ test có phát hiện được không.\u003c/li>\u003cli>\u003cstrong>Load test\u003c/strong>: kiểm tra hiệu năng dưới tải thật trước khi triển khai.\u003c/li>\u003c/ul>\n\u003ch3>6. Chuyển đổi ứng dụng (migration)\u003c/h3>\n\u003cul>\u003cli>Ứng dụng cũ (legacy) thường thiếu tài liệu; \u003cstrong>reverse engineering\u003c/strong> để dựng lại mô hình dữ liệu (E-R).\u003c/li>\u003cli>Chuyển dần: chạy song song hệ cũ và mới, đồng bộ dữ liệu, dùng \u003cem>wrapper\u003c/em> cho phép ứng dụng mới truy cập hệ cũ; chuyển \"big bang\" rủi ro cao.\u003c/li>\u003c/ul>","quiz":[{"q":"Hệ thống có CPU 95% còn đĩa 20%. Thêm đĩa nhanh hơn sẽ:","options":["Tăng throughput đáng kể","Hầu như không cải thiện vì bottleneck là CPU","Giảm CPU xuống 20%","Gây deadlock"],"answer":1,"explain":"Chỉ cải thiện bottleneck mới tăng hiệu năng."},{"q":"Ba loại giao dịch chạy 50, 100, 200 tps với tỉ lệ 25%, 25%, 50%. Throughput trung bình (không xung đột) là:","options":["137.5 tps","116.7 tps","100 tps","200 tps"],"answer":2,"explain":"1 / (0.25/50 + 0.25/100 + 0.5/200) = 1 / 0.01 = 100 (PE 25.6). 137.5 là trung bình cộng có trọng số — sai."},{"q":"Sequence counter bị lock theo 2PL trở thành bottleneck vì:","options":["Counter quá lớn","Lock giữ tới khi transaction kết thúc, các transaction khác phải chờ để lấy số","Counter không được log","Không thể rollback"],"answer":1,"explain":"Sequence không theo 2PL chỉ lock trong lúc tăng counter (PE 25.2)."},{"q":"Vì sao sequence không theo 2PL có thể để lại \"lỗ hổng\" trong các số của giao dịch đã commit?","options":["Do lỗi phần cứng","Giao dịch abort không trả lại số đã lấy","Do sắp xếp lại","Do snapshot isolation"],"answer":1,"explain":"Trả lại số sẽ có nguy cơ cấp trùng số cho hai giao dịch commit."},{"q":"TPC-H đo loại workload nào?","options":["OLTP đơn hàng","Decision support / truy vấn ad hoc","Key-value","Web server"],"answer":1,"explain":"TPC-C/TPC-E cho OLTP; TPC-H, TPC-DS cho phân tích."},{"q":"Kết quả TPC bắt buộc phải công bố thêm gì ngoài throughput?","options":["Mã nguồn","Giá hệ thống và chỉ số giá/hiệu năng","Số người dùng","Phiên bản hệ điều hành"],"answer":1,"explain":"Price/performance (ví dụ $/tpmC) là một phần của kết quả."},{"q":"Chèn hàng triệu bản ghi vào bảng có nhiều B+-tree index. Khuyến nghị thường gặp là:","options":["Chèn từng dòng trong transaction riêng","Bỏ index, chèn, rồi tạo lại index","Tăng isolation level","Dùng hash index"],"answer":1,"explain":"Tạo index bottom-up một lần rẻ hơn hàng triệu lần chèn ngẫu nhiên (PE 25.4)."},{"q":"Trong LDAP, một entry có thể xuất hiện trong hai cây phân cấp khác nhau mà không chép dữ liệu nhờ:","options":["Trigger","Referral","Materialized view","Replication"],"answer":1,"explain":"Entry trong cây thứ hai chỉ là referral trỏ tới entry gốc (PE 25.9)."},{"q":"Chuẩn được xây dựng trước khi có sản phẩm, nhằm định hướng ngành, gọi là:","options":["Reactionary standard","Anticipatory standard","De facto standard","Proprietary standard"],"answer":1,"explain":"Reactionary standard chuẩn hoá những gì đã có trên thị trường (PE 25.8)."}],"questions":[{"q":"\u003cstrong>PE 25.1.\u003c/strong> Tìm các thông tin hiệu năng mà hệ CSDL bạn dùng cung cấp (truy vấn đang chạy, tài nguyên tiêu thụ, buffer miss, lock tranh chấp) và thông tin CPU, I/O, mạng từ hệ điều hành.","en":"\u003cp>\u003cstrong>Exercise 25.1.\u003c/strong> Find out all the performance information that your favorite database system provides. At a minimum look for: which queries are executing now or were executed recently; the resources (CPU and I/O) each of them consumed; what fraction of page requests caused buffer misses (per query, if available); and which locks are highly contended. Also obtain CPU, I/O, and network utilization, including the number of open network connections, using operating-system utilities.\u003c/p>","answer":"\u003cp>Với \u003cstrong>PostgreSQL\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>Truy vấn đang/vừa chạy: view \u003ccode>pg_stat_activity\u003c/code> (query, state, thời điểm bắt đầu, wait_event); extension \u003ccode>pg_stat_statements\u003c/code> (số lần gọi, tổng/mean thời gian, shared_blks_hit/read → tỉ lệ buffer miss mỗi truy vấn).\u003c/li>\u003cli>Kế hoạch và chi phí: \u003ccode>EXPLAIN\u003c/code> (startup cost, total cost, số dòng ước lượng, độ rộng dòng) và \u003ccode>EXPLAIN (ANALYZE, BUFFERS)\u003c/code> (thời gian thật, số buffer hit/read).\u003c/li>\u003cli>Buffer: \u003ccode>pg_statio_user_tables\u003c/code>, \u003ccode>pg_stat_database\u003c/code> (blks_hit, blks_read).\u003c/li>\u003cli>Lock: \u003ccode>pg_locks\u003c/code> join \u003ccode>pg_stat_activity\u003c/code>; tham số \u003ccode>log_lock_waits\u003c/code>.\u003c/li>\u003cli>Hệ điều hành: \u003ccode>top\u003c/code>/\u003ccode>htop\u003c/code> (CPU), \u003ccode>iostat\u003c/code>/\u003ccode>vmstat\u003c/code> (I/O), \u003ccode>netstat -an\u003c/code> hoặc \u003ccode>ss -s\u003c/code> (số kết nối mạng mở), \u003ccode>sar\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>SQL Server: SQL Profiler / Extended Events, Performance Monitor với các counter Buffer Manager, Locks, SQL Statistics…; Oracle: AWR, V$ views.\u003c/p>"},{"q":"\u003cstrong>PE 25.2.\u003c/strong> (a) Vì sao sequence counter lock theo 2PL thành bottleneck? (b) Sequence không theo 2PL: (i) cải thiện concurrency thế nào; (ii) vì sao số của các giao dịch commit có thể có lỗ hổng?","en":"\u003cp>\u003cstrong>Exercise 25.2.\u003c/strong> Many applications need to generate a sequence number for every transaction.\u003c/p>\n\u003cp>a. If a sequence counter is locked in a two-phase manner, it can become a concurrency bottleneck. Explain why.\u003c/p>\n\u003cp>b. Many database systems offer built-in sequence counters that are not locked two-phase: when a transaction asks for a sequence number, the counter is locked, incremented, and immediately unlocked.\u003c/p>\n\u003col>\u003cli>Explain how such counters can improve concurrency.\u003c/li>\u003cli>Explain why the sequence numbers of the transactions that finally commit may contain gaps.\u003c/li>\u003c/ol>","answer":"\u003cp>a. Theo 2PL, lock X trên counter phải giữ ít nhất tới hết pha tăng lock (thực tế là tới commit với strict 2PL). Suốt thời gian đó mọi giao dịch khác cần số thứ tự phải \u003cstrong>chờ\u003c/strong>, dù dữ liệu chúng truy cập không hề xung đột → các giao dịch bị tuần tự hoá qua counter.\u003cbr>b. (i) Counter chỉ bị lock trong khoảnh khắc \u003cstrong>tăng giá trị\u003c/strong> rồi nhả ngay, nên nhiều giao dịch lấy số song song, không giữ lock tới cuối.\u003cbr>(ii) Nếu giao dịch đã lấy số rồi \u003cstrong>abort\u003c/strong>, số đó \u003cstrong>không được trả lại\u003c/strong>. Không thể khôi phục counter: giả sử T\u003csub>a\u003c/sub> lấy 100, T\u003csub>b\u003c/sub> lấy 101; nếu T\u003csub>a\u003c/sub> abort và counter quay về 100, giao dịch kế tiếp T\u003csub>c\u003c/sub> nhận 100 và T\u003csub>d\u003c/sub> nhận 101 — trùng với T\u003csub>b\u003c/sub>. Vì vậy số của các giao dịch commit có lỗ hổng (bài 25.05, 25.06).\u003c/p>"},{"q":"\u003cstrong>PE 25.3.\u003c/strong> Relation r(a, b, c). (a) Khi nào hiệu năng truy vấn bằng trên a phụ thuộc mạnh vào cách cluster r? (b) Có thể cluster để cả truy vấn bằng trên a và truy vấn khoảng trên b đều nhanh không? (c) Nếu không, chọn index thế nào?","en":"\u003cp>\u003cstrong>Exercise 25.3.\u003c/strong> You are given a relation r(a, b, c).\u003c/p>\n\u003cp>a. Give an example of a situation in which the performance of equality selection queries on attribute a depends greatly on how r is clustered.\u003c/p>\n\u003cp>b. Suppose there are also range selection queries on attribute b. Can r be clustered so that both the equality selections on r.a and the range selections on r.b are answered efficiently? Explain.\u003c/p>\n\u003cp>c. If such a clustering is not possible, suggest how both kinds of queries can be executed efficiently by choosing suitable indices.\u003c/p>","answer":"\u003cp>a. Khi mỗi giá trị a khớp \u003cstrong>nhiều\u003c/strong> tuple. Nếu r không cluster theo a, các tuple cùng a rải khắp file → mỗi tuple một lần đọc khối (hoặc phải quét cả r). Cluster theo a + index trên a thì các tuple nằm liền nhau, đọc ít khối.\u003cbr>b. Nói chung \u003cstrong>không\u003c/strong>: thứ tự vật lý chỉ có một. Chỉ được khi a và b có quan hệ đặc biệt (ví dụ a tăng thì b tăng), khi đó cùng một thứ tự phục vụ cả hai.\u003cbr>c. Cluster r theo a (truy vấn bằng rất nhanh) và tạo \u003cstrong>B\u003csup>+\u003c/sup>-tree secondary index trên b\u003c/strong>. Truy vấn khoảng trên b lấy danh sách con trỏ từ index, \u003cstrong>sắp xếp con trỏ theo địa chỉ khối\u003c/strong> rồi mới đọc, để mỗi khối chỉ đọc một lần (bitmap heap scan trong PostgreSQL). Bài 25.10 tạo hash index cho a và B\u003csup>+\u003c/sup>-tree cho b.\u003c/p>"},{"q":"\u003cstrong>PE 25.4.\u003c/strong> Khi chèn rất nhiều bản ghi trong thời gian ngắn: (a) vì sao nên bỏ index rồi tạo lại? (b) cập nhật B\u003csup>+\u003c/sup>-tree theo lô hiệu quả thế nào? (c) Với LSM tree lời khuyên còn ý nghĩa không?","en":"\u003cp>\u003cstrong>Exercise 25.4.\u003c/strong> When a large number of records are inserted into a relation within a short time, a common recommendation is to drop all indices and recreate them after the inserts have finished.\u003c/p>\n\u003cp>a. What is the motivation for this recommendation?\u003c/p>\n\u003cp>b. Dropping and recreating indices can be avoided by bulk-updating them. Suggest how this can be done efficiently for B\u003csup>+\u003c/sup>-tree indices.\u003c/p>\n\u003cp>c. Would this advice still make sense if the indices were write-optimized indices such as LSM trees?\u003c/p>","answer":"\u003cp>a. Mỗi lần chèn cập nhật mỗi index một lần, có thể tốn \u003cstrong>1 random I/O cho mỗi bản ghi mỗi index\u003c/strong> (~10 ms với đĩa từ). Với số bản ghi lớn, tạo lại index \u003cstrong>bottom-up\u003c/strong> (sắp xếp rồi dựng cây từ lá) rẻ hơn nhiều.\u003cbr>b. Gom các bản ghi mới thành lô, \u003cstrong>sắp xếp theo khoá index\u003c/strong>, rồi \u003cstrong>merge\u003c/strong> với tầng lá của B\u003csup>+\u003c/sup>-tree theo thứ tự: mỗi lá được đọc/ghi tối đa một lần, I/O gần như tuần tự.\u003cbr>c. Gần như không cần: LSM tree vốn được thiết kế để chèn bằng sequential I/O (ghi run rồi merge — chính là ý tưởng của (b)), nên không có phạt lớn khi chèn hàng loạt.\u003c/p>"},{"q":"\u003cstrong>PE 25.5.\u003c/strong> CPU và đĩa đều bận, các hàng đợi cân bằng, không có bottleneck đơn lẻ. Ứng dụng có còn tune được không?","en":"\u003cp>\u003cstrong>Exercise 25.5.\u003c/strong> A database application seems to have no single bottleneck: CPU and disk utilization are both high and all database queues are roughly balanced. Does this mean the application cannot be tuned any further? Explain.\u003c/p>","answer":"\u003cp>\u003cstrong>Vẫn có thể.\u003c/strong> \"Không có bottleneck đơn lẻ\" chỉ nói tài nguyên được dùng cân bằng, không nói công việc là cần thiết. Tuning ở mức cao hơn có thể \u003cstrong>giảm tổng khối lượng công việc\u003c/strong>: thêm index để tránh quét bảng, materialized view cho truy vấn tổng hợp lặp lại, viết lại truy vấn kém, dùng thao tác theo lô, \u003cstrong>cache\u003c/strong> kết quả ở tầng ứng dụng để giảm tải cho CSDL. Những thay đổi này giảm cả CPU lẫn I/O. Ngoài ra có thể nâng cấp phần cứng đồng đều.\u003c/p>"},{"q":"\u003cstrong>PE 25.6.\u003c/strong> Giao dịch loại A 50/s, B 100/s, C 200/s; tỉ lệ 25%, 25%, 50%. (a) Throughput trung bình nếu không xung đột? (b) Yếu tố nào làm kết quả tính sai?","en":"\u003cp>\u003cstrong>Exercise 25.6.\u003c/strong> A system runs three types of transactions. Type A transactions run at 50 per second, type B at 100 per second, and type C at 200 per second. The transaction mix is 25 percent type A, 25 percent type B, and 50 percent type C.\u003c/p>\n\u003cp>a. Assuming no interference between transactions, what is the average transaction throughput of the system?\u003c/p>\n\u003cp>b. Which factors can cause interference between transactions of different types, making the computed throughput incorrect?\u003c/p>","answer":"\u003cp>a. Xét 100 giao dịch: 25 A mất 25/50 = 0.5 s, 25 B mất 0.25 s, 50 C mất 0.25 s → tổng 1 s → \u003cstrong>100 giao dịch/giây\u003c/strong> (bài 25.03). Trung bình cộng có trọng số (137.5) là sai.\u003cbr>b. \u003cstrong>Tranh chấp lock\u003c/strong>: ví dụ A, B cập nhật, C đọc; A giữ lock trên dữ liệu nóng trong khi chờ ghi đĩa, các giao dịch khác chờ lock → lãng phí CPU, throughput thấp hơn. \u003cstrong>Deadlock, abort và restart\u003c/strong> (cả trong optimistic concurrency control) cũng làm giảm. Ngược lại, nếu A, B nặng về đĩa còn C nặng về CPU và không tranh chấp lock, chúng chạy chồng lên nhau → throughput thực tế có thể \u003cstrong>cao hơn\u003c/strong> tính toán. Giới hạn kích thước cấu trúc dữ liệu, chi phí quản lý giao dịch thay đổi cũng gây sai lệch.\u003c/p>"},{"q":"\u003cstrong>PE 25.7.\u003c/strong> Cần viết \u003ccode>r natural left outer join s\u003c/code> (r(A, B), s(B, C)) nhưng lại viết \u003ccode>r natural join s\u003c/code>. (a) Dữ liệu cho hai câu cùng kết quả; (b) dữ liệu làm lộ lỗi.","en":"\u003cp>\u003cstrong>Exercise 25.7.\u003c/strong> An application programmer was supposed to write the query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r natural left outer join s;\u003c/code>\u003c/pre>\n\u003cp>on relations r(A, B) and s(B, C), but wrote instead\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r natural join s;\u003c/code>\u003c/pre>\n\u003cp>a. Give sample data for r and s on which the two queries produce the same result.\u003c/p>\n\u003cp>b. Give sample data for r and s on which the two queries produce different results, thereby exposing the mistake.\u003c/p>","answer":"\u003cp>a. Mọi tuple của r đều khớp ít nhất một tuple của s, ví dụ r = {(a1, 1), (a2, 2)}, s = {(1, c1), (2, c2)} → hai câu đều ra {(a1, 1, c1), (a2, 2, c2)}. (s có thể có thêm tuple không khớp r, vẫn cùng kết quả.)\u003cbr>b. Có tuple của r \u003cstrong>không khớp\u003c/strong> s, ví dụ thêm (a3, 3) vào r: left outer join có thêm (a3, 3, null), natural join thì không. Dữ liệu \u003ccode>at_r\u003c/code>, \u003ccode>at_s\u003c/code> trong bài 25.07 có hai tuple như vậy. Bài học: dữ liệu test phải chứa tuple không khớp.\u003c/p>"},{"q":"\u003cstrong>PE 25.8.\u003c/strong> Lợi ích và hạn chế của anticipatory standard so với reactionary standard.","en":"\u003cp>\u003cstrong>Exercise 25.8.\u003c/strong> List some benefits and drawbacks of an anticipatory standard compared with a reactionary standard.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Anticipatory\u003c/strong> (chuẩn đi trước sản phẩm): các sản phẩm từ đầu đã theo cùng chuẩn nên \u003cstrong>tương thích\u003c/strong>, tránh việc mỗi hãng một kiểu rồi khó hoà giải (vấn đề gặp khi chuẩn hoá cú pháp con trỏ của ODMG). Nhưng thiếu kinh nghiệm thực tế, dễ \u003cstrong>quá tham vọng\u003c/strong>: nhiều tính năng phức tạp, lâu mới được hiện thực, có tính năng tỏ ra không phù hợp (SQL:1999 là ví dụ).\u003c/li>\u003cli>\u003cstrong>Reactionary\u003c/strong> (chuẩn hoá cái đã có): dựa trên kinh nghiệm dùng sản phẩm thật nên \u003cstrong>thực dụng\u003c/strong>, đã được kiểm chứng. Nhưng phải hoà giải khác biệt giữa các sản phẩm đã tồn tại, có hãng phải sửa sản phẩm, và chuẩn ra đời muộn.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 25.9.\u003c/strong> LDAP cung cấp nhiều cây phân cấp cho cùng dữ liệu mà không nhân bản dữ liệu gốc thế nào?","en":"\u003cp>\u003cstrong>Exercise 25.9.\u003c/strong> Describe how LDAP can provide several hierarchical views of the same data without replicating the base-level data.\u003c/p>","answer":"\u003cp>Dùng \u003cstrong>referral\u003c/strong>. Ví dụ thông tin phòng ban có thể tổ chức theo \u003cstrong>địa lý\u003c/strong> (mọi phòng ban tại một địa điểm) hoặc theo \u003cstrong>cấu trúc\u003c/strong> (một phòng ban ở mọi địa điểm). Chọn một cây làm nơi lưu \u003cstrong>dữ liệu gốc\u003c/strong> (ví dụ phòng ban tại từng địa điểm). Cây thứ hai được định nghĩa bằng schema riêng nhưng các entry của nó chỉ là \u003cstrong>referral\u003c/strong> trỏ tới entry gốc; client đi theo referral để lấy dữ liệu. Dữ liệu chỉ lưu một lần, cập nhật một chỗ. Bài 25.11 dựng đường dẫn DN trong cây theo địa lý.\u003c/p>"}],"exercises":[{"id":"CH25.01","topic":"tuning: thiếu index","level":2,"prompt":"\u003cp>Từ workload \u003ccode>at_workload\u003c/code> và danh sách index đang có \u003ccode>at_index\u003c/code>, tìm các ứng viên index còn thiếu: mẫu truy vấn trên cột \u003cstrong>chưa có index\u003c/strong> và có độ chọn lọc rows_returned / rows_scanned \u003cstrong>dưới 0.05\u003c/strong>. Trả về \u003ccode>table_name\u003c/code>, \u003ccode>column_name\u003c/code>, \u003ccode>calls_per_hour\u003c/code>.\u003c/p>","en":"","hint":"not exists trong at_index; chú ý chia số nguyên — dùng 1.0 * ...","solution":"select w.table_name, w.column_name, w.calls_per_hour\nfrom at_workload w\nwhere 1.0 * w.rows_returned / w.rows_scanned \u003c 0.05\n  and not exists (select * from at_index i\n                  where i.table_name = w.table_name and i.column_name = w.column_name);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["table_name","column_name","calls_per_hour"],"rows":[["orders","customer_id","1200"],["customer","email","2500"]]}},{"id":"CH25.02","topic":"tuning: bảng nóng","level":1,"prompt":"\u003cp>Với mỗi bảng trong \u003ccode>at_workload\u003c/code>, tính tổng số dòng phải đọc mỗi giờ (calls_per_hour × rows_scanned, đặt tên \u003ccode>rows_per_hour\u003c/code>). Sắp xếp giảm dần.\u003c/p>","en":"","hint":"","solution":"select table_name, sum(calls_per_hour::bigint * rows_scanned) as rows_per_hour\nfrom at_workload\ngroup by table_name\norder by rows_per_hour desc;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["table_name","rows_per_hour"],"rows":[["lineitem","6040000000"],["orders","795000000"],["customer","203200000"],["product","1205000"]]}},{"id":"CH25.03","topic":"throughput theo mix","level":2,"prompt":"\u003cp>Từ \u003ccode>at_txn_type(txn_type, rate_per_sec, mix_pct)\u003c/code>, tính throughput trung bình của hệ thống khi không có xung đột: 1 / Σ(mix\u003csub>i\u003c/sub> / rate\u003csub>i\u003c/sub>) với mix là tỉ lệ (mix_pct / 100). Trả về \u003ccode>throughput\u003c/code> làm tròn 2 chữ số, và \u003ccode>naive_avg\u003c/code> — trung bình cộng có trọng số Σ mix\u003csub>i\u003c/sub> × rate\u003csub>i\u003c/sub> (sai) để so sánh.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.6 (a).\u003c/strong> A system runs three types of transactions. Type A transactions run at 50 per second, type B at 100 per second, and type C at 200 per second. The transaction mix is 25 percent type A, 25 percent type B, and 50 percent type C.\u003c/p>\n\u003cp>a. Assuming no interference between transactions, what is the average transaction throughput of the system?\u003c/p>","hint":"","solution":"select round(1 / sum(mix_pct / 100 / rate_per_sec), 2) as throughput,\n       round(sum(mix_pct / 100 * rate_per_sec), 2) as naive_avg\nfrom at_txn_type;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["throughput","naive_avg"],"rows":[["100","137.5"]]}},{"id":"CH25.04","topic":"lock hot spot","level":2,"prompt":"\u003cp>Từ \u003ccode>at_lock_wait\u003c/code>, tìm các tài nguyên \"nóng\": thời gian chờ trung bình mỗi lần (total_wait_ms / waits) \u003cstrong>lớn hơn\u003c/strong> thời gian chờ trung bình chung của mọi lần chờ (tổng total_wait_ms / tổng waits). Trả về \u003ccode>resource\u003c/code>, \u003ccode>avg_wait_ms\u003c/code> (làm tròn 1 chữ số).\u003c/p>","en":"","hint":"","solution":"select resource, round(1.0 * total_wait_ms / waits, 1) as avg_wait_ms\nfrom at_lock_wait\nwhere 1.0 * total_wait_ms / waits > (select 1.0 * sum(total_wait_ms) / sum(waits) from at_lock_wait);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["resource","avg_wait_ms"],"rows":[["account:42","70"],["inventory:item 9","90"]]}},{"id":"CH25.05","topic":"sequence gaps","level":2,"prompt":"\u003cp>Bảng \u003ccode>at_txn\u003c/code> ghi số thứ tự \u003ccode>seq_no\u003c/code> mà mỗi transaction đã lấy và trạng thái cuối. Xét các transaction \u003cstrong>đã commit\u003c/strong>: trả về các số thứ tự \u003cstrong>bị thiếu\u003c/strong> (cột \u003ccode>missing_seq\u003c/code>) trong khoảng từ seq_no nhỏ nhất tới lớn nhất của chúng.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.2.\u003c/strong> Many applications need to generate a sequence number for every transaction.\u003c/p>\n\u003cp>a. If a sequence counter is locked in a two-phase manner, it can become a concurrency bottleneck. Explain why.\u003c/p>\n\u003cp>b. Many database systems offer built-in sequence counters that are not locked two-phase: when a transaction asks for a sequence number, the counter is locked, incremented, and immediately unlocked.\u003c/p>\n\u003col>\u003cli>Explain how such counters can improve concurrency.\u003c/li>\u003cli>Explain why the sequence numbers of the transactions that finally commit may contain gaps.\u003c/li>\u003c/ol>","hint":"generate_series(min, max) except ...","solution":"select g as missing_seq\nfrom generate_series((select min(seq_no) from at_txn where status = 'commit'),\n                     (select max(seq_no) from at_txn where status = 'commit')) as g\nexcept\nselect seq_no from at_txn where status = 'commit';","check":null,"ordered":false,"fresh":false,"expected":{"fields":["missing_seq"],"rows":[["103"],["105"],["109"],["106"]]}},{"id":"CH25.06","topic":"sequence không rollback","level":2,"prompt":"\u003cp>Chứng minh sequence không bị rollback: tạo sequence \u003ccode>at_order_seq\u003c/code> và commit; mở transaction mới, gọi \u003ccode>nextval\u003c/code> \u003cstrong>hai lần\u003c/strong>, rồi \u003cstrong>rollback\u003c/strong>; sau đó gọi \u003ccode>nextval\u003c/code> lần nữa. Câu cuối trả về giá trị nhận được (cột \u003ccode>next_value\u003c/code>). (Bài chạy trên database mới, được dùng begin/rollback.)\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.2 (b).\u003c/strong> Many applications need to generate a sequence number for every transaction.\u003c/p>\n\u003cp>b. Many database systems offer built-in sequence counters that are not locked two-phase: when a transaction asks for a sequence number, the counter is locked, incremented, and immediately unlocked.\u003c/p>\n\u003col>\u003cli>Explain how such counters can improve concurrency.\u003c/li>\u003cli>Explain why the sequence numbers of the transactions that finally commit may contain gaps.\u003c/li>\u003c/ol>","hint":"","solution":"begin;\ncreate sequence at_order_seq;\ncommit;\nbegin;\nselect nextval('at_order_seq');\nselect nextval('at_order_seq');\nrollback;\nselect nextval('at_order_seq') as next_value;","check":null,"ordered":false,"fresh":true,"expected":{"fields":["next_value"],"rows":[["3"]]}},{"id":"CH25.07","topic":"test bắt lỗi join","level":2,"prompt":"\u003cp>Với \u003ccode>at_r(a, b)\u003c/code> và \u003ccode>at_s(b, c)\u003c/code>: trả về các dòng có trong kết quả \u003ccode>at_r natural left outer join at_s\u003c/code> nhưng \u003cstrong>không\u003c/strong> có trong \u003ccode>at_r natural join at_s\u003c/code> — chính là các dòng làm lộ lỗi viết nhầm join. Cột b, a, c.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.7.\u003c/strong> An application programmer was supposed to write the query\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r natural left outer join s;\u003c/code>\u003c/pre>\n\u003cp>on relations r(A, B) and s(B, C), but wrote instead\u003c/p>\n\u003cpre class=\"code\" data-lang=\"sql\">\u003ccode>select *\nfrom r natural join s;\u003c/code>\u003c/pre>\n\u003cp>a. Give sample data for r and s on which the two queries produce the same result.\u003c/p>\n\u003cp>b. Give sample data for r and s on which the two queries produce different results, thereby exposing the mistake.\u003c/p>","hint":"","solution":"select * from at_r natural left outer join at_s\nexcept\nselect * from at_r natural join at_s;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["b","a","c"],"rows":[["3","a3",null],["4","a4",null]]}},{"id":"CH25.08","topic":"regression test","level":3,"prompt":"\u003cp>Regression test: \u003ccode>at_expected(dept_name, num_instructors)\u003c/code> là kết quả mong đợi của truy vấn \"số instructor mỗi khoa (chỉ khoa có instructor)\". Chạy truy vấn thật trên bảng instructor và so sánh hai chiều. Trả về \u003ccode>side\u003c/code> ('missing' = có trong mong đợi nhưng không có trong kết quả thật, 'unexpected' = ngược lại), \u003ccode>dept_name\u003c/code>, \u003ccode>num_instructors\u003c/code>.\u003c/p>","en":"","hint":"","solution":"with actual as (\n  select dept_name, count(*)::int as num_instructors from instructor group by dept_name)\n(select 'missing' as side, * from (select * from at_expected except select * from actual) as m)\nunion all\n(select 'unexpected', * from (select * from actual except select * from at_expected) as u);","check":null,"ordered":false,"fresh":false,"expected":{"fields":["side","dept_name","num_instructors"],"rows":[["missing","Physics","3"],["unexpected","Physics","2"]]}},{"id":"CH25.09","topic":"materialized view","level":2,"prompt":"\u003cp>Tuning bằng materialized view: tạo materialized view \u003ccode>at_dept_payroll(dept_name, total_salary, num_instructors)\u003c/code> tổng lương và số instructor mỗi khoa. Hệ thống tăng lương mọi instructor khoa Music thêm 1000 \u003cstrong>sau\u003c/strong> khi tạo view, rồi so sánh tổng lương Music trong view trước và sau \u003ccode>refresh materialized view\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.5.\u003c/strong> A database application seems to have no single bottleneck: CPU and disk utilization are both high and all database queues are roughly balanced. Does this mean the application cannot be tuned any further? Explain.\u003c/p>","hint":"","solution":"create materialized view at_dept_payroll as\nselect dept_name, sum(salary) as total_salary, count(*) as num_instructors\nfrom instructor\ngroup by dept_name;","check":"update instructor set salary = salary + 1000 where dept_name = 'Music';\ncreate temp table at_snap as select total_salary as before_refresh from at_dept_payroll where dept_name = 'Music';\nrefresh materialized view at_dept_payroll;\nselect s.before_refresh, p.total_salary as after_refresh\nfrom at_snap s, at_dept_payroll p where p.dept_name = 'Music';","ordered":false,"fresh":false,"expected":{"fields":["before_refresh","after_refresh"],"rows":[["40000","41000"]]}},{"id":"CH25.10","topic":"chọn loại index","level":2,"prompt":"\u003cp>Bảng \u003ccode>at_sale(sale_id, a, b, c)\u003c/code> có truy vấn \u003cstrong>bằng\u003c/strong> trên a và truy vấn \u003cstrong>khoảng\u003c/strong> trên b. Tạo index \u003ccode>at_sale_a_idx\u003c/code> kiểu \u003cstrong>hash\u003c/strong> trên a và \u003ccode>at_sale_b_idx\u003c/code> kiểu \u003cstrong>B\u003csup>+\u003c/sup>-tree\u003c/strong> (btree) trên b. Hệ thống đọc \u003ccode>pg_indexes\u003c/code>.\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.3.\u003c/strong> You are given a relation r(a, b, c).\u003c/p>\n\u003cp>a. Give an example of a situation in which the performance of equality selection queries on attribute a depends greatly on how r is clustered.\u003c/p>\n\u003cp>b. Suppose there are also range selection queries on attribute b. Can r be clustered so that both the equality selections on r.a and the range selections on r.b are answered efficiently? Explain.\u003c/p>\n\u003cp>c. If such a clustering is not possible, suggest how both kinds of queries can be executed efficiently by choosing suitable indices.\u003c/p>","hint":"","solution":"create index at_sale_a_idx on at_sale using hash (a);\ncreate index at_sale_b_idx on at_sale using btree (b);","check":"select indexname, substring(indexdef from 'USING (\\w+)') as method\nfrom pg_indexes where tablename = 'at_sale' and indexname \u003c> 'at_sale_pkey';","ordered":false,"fresh":false,"expected":{"fields":["indexname","method"],"rows":[["at_sale_a_idx","hash"],["at_sale_b_idx","btree"]]}},{"id":"CH25.11","topic":"LDAP DN","level":3,"prompt":"\u003cp>Cây thư mục \u003ccode>at_ldap(node_id, parent_id, rdn, person_id)\u003c/code>. Với mỗi entry là một người (person_id khác null), trả về \u003ccode>person_id\u003c/code> và \u003ccode>dn\u003c/code> — distinguished name ghép các RDN \u003cstrong>từ lá lên gốc\u003c/strong>, ngăn cách bởi ', ' (ví dụ 'cn=Lan, ou=Sales, ou=Hanoi, o=Acme').\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 25.9.\u003c/strong> Describe how LDAP can provide several hierarchical views of the same data without replicating the base-level data.\u003c/p>","hint":"with recursive đi từ lá lên cha.","solution":"with recursive up (person_id, node_id, dn) as (\n  select person_id, parent_id, rdn::text from at_ldap where person_id is not null\n  union all\n  select u.person_id, l.parent_id, u.dn || ', ' || l.rdn\n  from up u join at_ldap l on l.node_id = u.node_id)\nselect person_id, dn from up where node_id is null;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["person_id","dn"],"rows":[["E01","cn=Lan, ou=Sales, ou=Hanoi, o=Acme"],["E02","cn=Minh, ou=Sales, ou=Hanoi, o=Acme"],["E03","cn=Hoa, ou=IT, ou=Hanoi, o=Acme"],["E04","cn=Khoa, ou=Sales, ou=Saigon, o=Acme"]]}},{"id":"CH25.12","topic":"benchmark TPC","level":2,"prompt":"\u003cp>Từ \u003ccode>at_bench(system, txns_completed, seconds, total_cost_usd)\u003c/code>, tính cho mỗi hệ thống: \u003ccode>tps\u003c/code> = txns_completed / seconds (làm tròn 1), \u003ccode>price_per_tps\u003c/code> = total_cost_usd / tps (làm tròn 2). Sắp theo price_per_tps tăng dần (hệ thống \"đáng tiền\" nhất trước).\u003c/p>","en":"","hint":"","solution":"select system,\n       round(1.0 * txns_completed / seconds, 1) as tps,\n       round(total_cost_usd / (1.0 * txns_completed / seconds), 2) as price_per_tps\nfrom at_bench\norder by price_per_tps;","check":null,"ordered":true,"fresh":false,"expected":{"fields":["system","tps","price_per_tps"],"rows":[["Sys-C","2400","70"],["Sys-A","3000","150"],["Sys-B","3000","180"],["Sys-D","3500","420"]]}}]},{"key":"ch26","store":"26","short":"26","label":"Chương 26","navLabel":"Chương 26","kind":"Chương","title":"Blockchain Databases","titleVi":"Cơ sở dữ liệu blockchain","summary":"\u003ch3>1. Blockchain là gì\u003c/h3>\n\u003cul>\u003cli>Một \u003cstrong>sổ cái (ledger) chỉ được thêm\u003c/strong> (append-only), được \u003cstrong>nhân bản\u003c/strong> trên nhiều node không tin nhau, và \u003cstrong>chống sửa đổi\u003c/strong> (tamper-resistant).\u003c/li>\u003cli>Dữ liệu được gom thành \u003cstrong>khối (block)\u003c/strong>; mỗi khối chứa \u003cstrong>hash của khối trước\u003c/strong> (hash pointer) → thành chuỗi. Khối đầu là \u003cstrong>genesis block\u003c/strong>.\u003c/li>\u003cli>Sửa một khối làm hash của nó đổi → con trỏ ở khối sau không còn khớp → phải sửa \u003cstrong>mọi khối sau\u003c/strong> và thuyết phục đa số mạng chấp nhận → thực tế không làm được (PE 26.6).\u003c/li>\u003cli>\u003cstrong>Public (permissionless)\u003c/strong> blockchain: ai cũng tham gia, danh tính là khoá công khai (ẩn danh giả — pseudonymous), ví dụ Bitcoin, Ethereum. \u003cstrong>Permissioned\u003c/strong> blockchain: một tổ chức/nhóm kiểm soát thành viên và danh tính, ví dụ Hyperledger Fabric (PE 26.5).\u003c/li>\u003c/ul>\n\u003ch3>2. Hàm băm mật mã\u003c/h3>\n\u003cp>Cần ba tính chất:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Collision resistance\u003c/strong>: khó tìm x ≠ y với h(x) = h(y).\u003c/li>\u003cli>\u003cstrong>Irreversibility (one-way)\u003c/strong>: biết h(x) khó tìm lại x (khi x được chọn từ miền rất lớn).\u003c/li>\u003cli>\u003cstrong>Puzzle friendliness\u003c/strong>: biết k và giá trị đích, không có cách nào tìm nonce x để h(k ‖ x) rơi vào tập đích nhanh hơn thử từng giá trị.\u003c/li>\u003cli>SHA-256 là ví dụ; h(x) = x mod 2\u003csup>256\u003c/sup> \u003cstrong>không\u003c/strong> có các tính chất này (PE 26.2).\u003c/li>\u003c/ul>\n\u003ch3>3. Chữ ký số và giao dịch\u003c/h3>\n\u003cul>\u003cli>Mỗi người dùng có cặp khoá công khai/bí mật; giao dịch được \u003cstrong>ký\u003c/strong> bằng khoá bí mật, ai cũng kiểm tra được bằng khoá công khai.\u003c/li>\u003cli>Bitcoin dùng mô hình \u003cstrong>UTXO\u003c/strong>: mỗi giao dịch tiêu các output chưa tiêu của giao dịch trước; \u003cstrong>double spending\u003c/strong> = tiêu cùng một output hai lần — đồng thuận ngăn điều này.\u003c/li>\u003c/ul>\n\u003ch3>4. Merkle tree\u003c/h3>\n\u003cul>\u003cli>Các giao dịch trong khối là \u003cstrong>lá\u003c/strong>; mỗi node trong = hash(con trái ‖ con phải); số node lẻ thì nhân đôi node cuối. \u003cstrong>Merkle root\u003c/strong> được đặt trong header của khối.\u003c/li>\u003cli>Chứng minh một giao dịch thuộc khối chỉ cần \u003cstrong>log₂ n\u003c/strong> hash (đường từ lá lên gốc) — client nhẹ không cần tải cả khối.\u003c/li>\u003cli>Biến thể \u003cstrong>Merkle-Patricia tree\u003c/strong> (Ethereum) lưu trạng thái tài khoản.\u003c/li>\u003c/ul>\n\u003ch3>5. Đồng thuận (consensus)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Proof-of-work (PoW)\u003c/strong>: thợ đào tìm \u003cstrong>nonce\u003c/strong> sao cho hash của header nhỏ hơn một ngưỡng (ví dụ bắt đầu bằng một số chữ số 0). Độ khó tự điều chỉnh để giữ tốc độ ra khối (Bitcoin ~10 phút). Tốn \u003cstrong>năng lượng\u003c/strong> rất lớn; an toàn nếu không ai có > 50% sức tính toán. Dễ điều chỉnh tốc độ đào, khó bị một nhóm nhỏ chủ sở hữu lớn khống chế (PE 26.3, 26.4).\u003c/li>\u003cli>\u003cstrong>Proof-of-stake (PoS)\u003c/strong>: quyền tạo khối tỉ lệ với lượng tiền đặt cọc; tiết kiệm năng lượng; rủi ro tập trung quyền vào người giàu.\u003c/li>\u003cli>\u003cstrong>Byzantine consensus\u003c/strong> (PBFT…): dùng trong permissioned blockchain, chịu được f node \u003cstrong>độc hại hoặc lỗi tuỳ ý\u003c/strong> khi có ≥ 3f + 1 node; khác \u003cstrong>2PC\u003c/strong> vốn chỉ giả định lỗi \u003cstrong>fail-stop\u003c/strong> (PE 26.9).\u003c/li>\u003cli>\u003cstrong>Fork\u003c/strong>: hai khối cùng nối vào một khối cha. Quy tắc \u003cstrong>chuỗi dài nhất\u003c/strong> (nhiều công nhất) quyết định nhánh thắng. \u003cstrong>Soft fork\u003c/strong> = thay đổi luật tương thích ngược (khối cũ vẫn hợp lệ); \u003cstrong>hard fork\u003c/strong> = thay đổi không tương thích, làm khối/luật cũ không còn hợp lệ, có thể tách thành hai chuỗi (PE 26.1).\u003c/li>\u003cli>\u003cstrong>Finality\u003c/strong>: với PoW, giao dịch coi là chắc chắn sau vài khối (Bitcoin ~6 khối).\u003c/li>\u003c/ul>\n\u003ch3>6. Smart contract\u003c/h3>\n\u003cul>\u003cli>Chương trình lưu trên chuỗi, tự thực thi khi điều kiện thoả (Ethereum, ngôn ngữ Solidity, chạy trên EVM).\u003c/li>\u003cli>\u003cstrong>Gas\u003c/strong>: phí trả cho mỗi bước tính toán → giới hạn thời gian chạy, chống chương trình vô hạn và bù đắp cho thợ đào (PE 26.8).\u003c/li>\u003cli>Ứng dụng: escrow, token, chuỗi cung ứng; rủi ro: lỗi trong code là bất biến (vụ The DAO).\u003c/li>\u003c/ul>\n\u003ch3>7. Hiệu năng và mở rộng\u003c/h3>\n\u003cul>\u003cli>Throughput thấp (Bitcoin ~7 tps) so với CSDL truyền thống (hàng nghìn tới hàng triệu tps).\u003c/li>\u003cli>Hướng cải thiện: \u003cstrong>sharding\u003c/strong> (chia mạng thành nhóm xử lý song song — nhưng mỗi nhóm ít thợ đào hơn, dễ bị tấn công hơn, PE 26.10), \u003cstrong>off-chain / layer 2\u003c/strong> (payment channel, Lightning Network), sidechain, khối lớn hơn.\u003c/li>\u003c/ul>\n\u003ch3>8. Blockchain và CSDL\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>CSDL tập trung\u003c/th>\u003cth>Blockchain\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tin cậy\u003c/td>\u003ctd>tin quản trị viên\u003c/td>\u003ctd>không cần tin bên nào\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sửa/xoá\u003c/td>\u003ctd>được\u003c/td>\u003ctd>chỉ thêm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hiệu năng\u003c/td>\u003ctd>cao\u003c/td>\u003ctd>thấp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Truy vấn\u003c/td>\u003ctd>SQL phong phú\u003c/td>\u003ctd>hạn chế (thường phải xây index ngoài chuỗi)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Enterprise blockchain thường thêm \u003cstrong>truy cập kiểu CSDL\u003c/strong> (SQL, index) vì lưu dữ liệu tổng quát chứ không chỉ chuyển tiền (PE 26.11).\u003c/li>\u003cli>Ẩn danh trong public blockchain chỉ là \u003cstrong>giả danh\u003c/strong>: phân tích đồ thị giao dịch kết hợp dữ liệu ngoài có thể lộ danh tính (PE 26.7).\u003c/li>\u003cli>Ứng dụng phù hợp: nhiều bên không tin nhau cần chung một sổ cái — thanh toán xuyên biên giới, chuỗi cung ứng, chứng nhận, tài sản số.\u003c/li>\u003c/ul>","quiz":[{"q":"Vì sao sửa dữ liệu một khối cũ trong blockchain bị phát hiện?","options":["Khối bị mã hoá","Hash của khối đổi nên hash pointer ở khối kế tiếp không còn khớp","Có log riêng","Admin kiểm tra hằng ngày"],"answer":1,"explain":"Kẻ sửa phải tính lại mọi khối sau và thắng đồng thuận của cả mạng."},{"q":"Tính chất nào của hàm băm làm cho proof-of-work không có lối tắt?","options":["Collision resistance","Irreversibility","Puzzle friendliness","Tính tất định"],"answer":2,"explain":"Puzzle friendliness: không có cách tìm nonce nhanh hơn thử từng giá trị."},{"q":"h(x) = x mod 2^256 có collision resistance không?","options":["Có","Không — dễ tìm vô số x có cùng 256 bit cuối","Chỉ khi x \u003c 2^256","Chỉ với x nguyên tố"],"answer":1,"explain":"x và x + 2^256 luôn va chạm (PE 26.2)."},{"q":"Merkle root được dùng để:","options":["Mã hoá giao dịch","Tóm tắt mọi giao dịch của khối, cho phép chứng minh một giao dịch thuộc khối bằng log n hash","Chọn thợ đào","Lưu số dư"],"answer":1,"explain":"Đường từ lá lên gốc chỉ cần log₂ n hash."},{"q":"Lý do chính chọn proof-of-stake thay vì proof-of-work là:","options":["Bảo mật tuyệt đối","Tiết kiệm năng lượng","Dễ hiện thực hơn","Không cần chữ ký số"],"answer":1,"explain":"PoW tiêu tốn năng lượng khổng lồ (PE 26.3)."},{"q":"Hard fork khác soft fork ở chỗ:","options":["Hard fork làm các khối/luật cũ không còn hợp lệ","Hard fork nhanh hơn","Soft fork tạo hai đồng tiền","Không khác"],"answer":0,"explain":"Soft fork tương thích ngược; hard fork thì không (PE 26.1)."},{"q":"Gas trong Ethereum dùng để:","options":["Làm mát máy đào","Trả phí cho việc thực thi smart contract và giới hạn lượng tính toán","Tăng tốc mạng","Lưu khoá bí mật"],"answer":1,"explain":"Gas đặt giới hạn thời gian chạy và trả công thợ đào (PE 26.8)."},{"q":"Byzantine consensus hơn 2PC ở điểm nào khi người dùng không độc hại?","options":["Nhanh hơn","Chịu được lỗi tuỳ ý (arbitrary failures), không chỉ fail-stop","Ít thông điệp hơn","Không cần coordinator"],"answer":1,"explain":"2PC giả định fail-stop; mô hình Byzantine tổng quát hơn (PE 26.9)."},{"q":"Rủi ro của sharding trong blockchain là:","options":["Mất dữ liệu","Mỗi shard có ít thợ đào hơn nên dễ bị tấn công hơn","Không song song được","Không tính được hash"],"answer":1,"explain":"PE 26.10."}],"questions":[{"q":"\u003cstrong>PE 26.1.\u003c/strong> Fork trong blockchain là gì? Hai loại fork khác nhau thế nào?","en":"\u003cp>\u003cstrong>Exercise 26.1.\u003c/strong> What is a blockchain fork? Name the two kinds of fork and explain how they differ.\u003c/p>","answer":"\u003cp>\u003cstrong>Fork\u003c/strong> xảy ra khi một khối được nối vào một khối \u003cstrong>không phải khối mới nhất\u003c/strong> của chuỗi, khiến chuỗi tách thành hai nhánh (bài 26.12). Fork tạm thời do hai thợ đào tìm khối gần như cùng lúc được giải quyết bằng quy tắc chuỗi dài nhất.\u003cbr>Khi thay đổi luật giao thức:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Soft fork\u003c/strong>: luật mới chặt hơn nhưng \u003cstrong>tương thích ngược\u003c/strong> — các khối trước đó vẫn hợp lệ, node cũ vẫn chấp nhận khối mới.\u003c/li>\u003cli>\u003cstrong>Hard fork\u003c/strong>: luật mới \u003cstrong>không tương thích\u003c/strong> — làm các khối/luật trước đó không còn hợp lệ với node mới (hoặc ngược lại); nếu không phải mọi node cùng nâng cấp, chuỗi tách vĩnh viễn thành hai (ví dụ Ethereum / Ethereum Classic).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.2.\u003c/strong> Hàm h(x) = x mod 2\u003csup>256\u003c/sup> (256 bit cuối của x) có (a) collision resistance, (b) irreversibility, (c) puzzle friendliness không? Vì sao?","en":"\u003cp>\u003cstrong>Exercise 26.2.\u003c/strong> Consider the hash function h(x) = x mod 2\u003csup>256\u003c/sup>, i.e., it returns the last 256 bits of x. Does this function have each of the following properties? Explain why or why not.\u003c/p>\n\u003cp>a. Collision resistance.\u003c/p>\n\u003cp>b. Irreversibility.\u003c/p>\n\u003cp>c. Puzzle friendliness.\u003c/p>","answer":"\u003cp>a. \u003cstrong>Không.\u003c/strong> Với giá trị hash y bất kỳ, mọi x = y + k·2\u003csup>256\u003c/sup> đều cho h(x) = y → tạo bao nhiêu va chạm cũng được (bài 26.08 minh hoạ với mod 256).\u003cbr>b. \u003cstrong>Không theo nghĩa mạnh.\u003c/strong> Biết y, tập các x thoả x mod 2\u003csup>256\u003c/sup> = y rất dễ liệt kê; trừ khi miền giá trị thật của x là gần như vô hạn, kẻ tấn công dễ tìm lại x. (Nếu x nhỏ hơn 2\u003csup>256\u003c/sup> thì h(x) = x — lộ hoàn toàn.)\u003cbr>c. \u003cstrong>Không.\u003c/strong> h(k ‖ x) chỉ là 256 bit cuối của chuỗi ghép, phụ thuộc trực tiếp vào x (nếu x đủ dài, chính là x) → muốn hash đích nào chỉ cần chọn x tương ứng, không phải thử. Proof-of-work với hàm này là vô nghĩa.\u003c/p>"},{"q":"\u003cstrong>PE 26.3.\u003c/strong> Thiết kế public blockchain mới: vì sao có thể chọn proof-of-stake thay vì proof-of-work?","en":"\u003cp>\u003cstrong>Exercise 26.3.\u003c/strong> If you were designing a new public blockchain, why might you choose proof-of-stake instead of proof-of-work?\u003c/p>","answer":"\u003cp>Lý do lớn nhất là \u003cstrong>năng lượng\u003c/strong>: PoW bắt các thợ đào thi nhau tính hash, tiêu tốn điện năng khổng lồ và cần phần cứng chuyên dụng. PoS chọn người tạo khối theo lượng tiền đặt cọc, gần như không tốn tính toán. Thêm vào đó PoS có thể cho finality nhanh hơn, và kẻ gian bị phạt mất tiền cọc (slashing).\u003c/p>"},{"q":"\u003cstrong>PE 26.4.\u003c/strong> Vì sao có thể chọn proof-of-work thay vì proof-of-stake?","en":"\u003cp>\u003cstrong>Exercise 26.4.\u003c/strong> If you were designing a new public blockchain, why might you choose proof-of-work instead of proof-of-stake?\u003c/p>","answer":"\u003cul>\u003cli>PoW \u003cstrong>dễ điều chỉnh tốc độ đào\u003c/strong> (chỉ cần chỉnh độ khó) và đã được kiểm chứng lâu năm (Bitcoin).\u003c/li>\u003cli>PoW \u003cstrong>khó bị một nhóm nhỏ chủ sở hữu lớn khống chế\u003c/strong>: với PoS, người nắm nhiều tiền có nhiều quyền hơn và càng giàu thêm; với PoW, muốn kiểm soát phải bỏ chi phí thật (phần cứng, điện) liên tục.\u003c/li>\u003cli>PoS có những vấn đề riêng như \"nothing at stake\" (đặt cược trên mọi nhánh fork không tốn gì).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.5.\u003c/strong> Phân biệt public và permissioned blockchain; khi nào nên dùng mỗi loại?","en":"\u003cp>\u003cstrong>Exercise 26.5.\u003c/strong> Explain the difference between a public and a permissioned blockchain, and when each one is preferable.\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Public\u003c/strong>: không có cơ quan kiểm soát; ai cũng tham gia, đọc, đào; danh tính là khoá công khai. Cần đồng thuận chống Sybil (PoW/PoS) nên chậm. Phù hợp khi \u003cstrong>không có bên nào được mọi người tin\u003c/strong>, cần mở cho công chúng (tiền mã hoá công khai).\u003c/li>\u003cli>\u003cstrong>Permissioned\u003c/strong>: có tổ chức kiểm soát ít nhất việc \u003cstrong>cấp quyền thành viên và quản lý danh tính\u003c/strong>; các node đã biết nhau nên dùng được đồng thuận Byzantine nhanh hơn, hỗ trợ bảo mật dữ liệu. Phù hợp cho \u003cstrong>liên minh doanh nghiệp\u003c/strong> (ngân hàng, chuỗi cung ứng) — các bên biết nhau nhưng không muốn trao toàn quyền cho một bên.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.6.\u003c/strong> Tính chống sửa đổi của blockchain an toàn hơn trong thực tế so với bảo mật của một CSDL doanh nghiệp truyền thống ở điểm nào?","en":"\u003cp>\u003cstrong>Exercise 26.6.\u003c/strong> Data stored in a blockchain are protected by its tamper-resistance property. In what way is this tamper resistance more secure in practice than the security provided by a traditional enterprise database system?\u003c/p>","answer":"\u003cul>\u003cli>Blockchain được \u003cstrong>nhân bản rất nhiều\u003c/strong>: kẻ gian phải sửa một số lượng bản sao quá lớn; mọi lần thử thất bại đáng kể đều bị mạng \u003cstrong>phát hiện\u003c/strong>.\u003c/li>\u003cli>Cấu trúc \u003cstrong>hash pointer\u003c/strong>: sửa một khối buộc phải sửa \u003cstrong>mọi khối sau nó\u003c/strong> (và với PoW phải đào lại tất cả, nhanh hơn cả mạng) — bài 26.02, 26.03 cho thấy chuỗi bị sửa lộ ngay.\u003c/li>\u003cli>Với CSDL truyền thống, ai \u003cstrong>đánh cắp được mật khẩu quản trị\u003c/strong> là có thể sửa tuỳ ý ở bất kỳ đâu mà không để lại dấu vết (có thể sửa cả log).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.7.\u003c/strong> Trong public blockchain, làm sao xác định danh tính thật đằng sau một user ID?","en":"\u003cp>\u003cstrong>Exercise 26.7.\u003c/strong> In a public blockchain, how might someone find out the real-world identity behind a given user ID?\u003c/p>","answer":"\u003cp>User ID chỉ là \u003cstrong>giả danh\u003c/strong>, và mọi giao dịch đều công khai. Có thể:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Khai phá dữ liệu\u003c/strong> chuỗi kết hợp với dữ liệu ngoài đời (thời điểm, số tiền, địa chỉ IP, giao dịch với sàn có KYC) để tìm tương quan.\u003c/li>\u003cli>Dựng \u003cstrong>đồ thị quan hệ\u003c/strong> từ các giao dịch: một ID giao dịch với một ID đã bị lộ danh tính (ví dụ ví của một sàn, một cửa hàng) giúp suy ra danh tính; các địa chỉ cùng được dùng làm input một giao dịch thường thuộc cùng một người.\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.8.\u003c/strong> Gas trong Ethereum dùng để làm gì?","en":"\u003cp>\u003cstrong>Exercise 26.8.\u003c/strong> What is the purpose of gas in Ethereum?\u003c/p>","answer":"\u003cp>Gas là \u003cstrong>khoản phí trả cho thợ đào (validator) để thực thi smart contract\u003c/strong>: mỗi lệnh EVM tốn một lượng gas, người gửi giao dịch đặt giới hạn gas và giá gas. Nhờ tính phí cho việc thực thi, Ethereum \u003cstrong>giới hạn được tổng thời gian chạy\u003c/strong> (chương trình hết gas thì dừng — chống vòng lặp vô hạn, DoS) và \u003cstrong>không khuyến khích\u003c/strong> viết hợp đồng tốn nhiều tính toán.\u003c/p>"},{"q":"\u003cstrong>PE 26.9.\u003c/strong> Nếu người dùng được giả định không độc hại, Byzantine consensus còn ưu điểm gì so với 2PC?","en":"\u003cp>\u003cstrong>Exercise 26.9.\u003c/strong> Assume an environment in which users can be trusted not to be malicious. In that case, what advantages, if any, does Byzantine consensus have over two-phase commit (2PC)?\u003c/p>","answer":"\u003cp>Không độc hại nghĩa là không cần lo tấn công Sybil, nhưng vẫn cần chịu được \u003cstrong>lỗi tuỳ ý (arbitrary failures)\u003c/strong> — node gửi thông điệp sai do lỗi phần mềm, phần cứng, chứ không chỉ dừng hẳn. Mô hình lỗi \u003cstrong>Byzantine\u003c/strong> bao gồm những lỗi đó, còn \u003cstrong>2PC chỉ giả định fail-stop\u003c/strong> (node hoặc chạy đúng hoặc dừng). Ngoài ra 2PC có thể bị \u003cstrong>block\u003c/strong> khi coordinator hỏng, còn giao thức Byzantine vẫn tiến triển khi tối đa f trên 3f + 1 node hỏng.\u003c/p>"},{"q":"\u003cstrong>PE 26.10.\u003c/strong> Lợi ích và rủi ro của sharding.","en":"\u003cp>\u003cstrong>Exercise 26.10.\u003c/strong> Explain the benefits and the potential risks of sharding (in a blockchain).\u003c/p>","answer":"\u003cul>\u003cli>\u003cstrong>Lợi ích\u003c/strong>: chia mạng/dữ liệu thành các shard, mỗi shard xử lý một phần giao dịch → \u003cstrong>đào/xác nhận song song\u003c/strong>, throughput tăng gần tuyến tính theo số shard; mỗi node lưu ít dữ liệu hơn.\u003c/li>\u003cli>\u003cstrong>Rủi ro\u003c/strong>: tập thợ đào/validator bị chia thành các \u003cstrong>nhóm nhỏ hơn\u003c/strong>, kẻ tấn công chỉ cần chiếm đa số một shard (ít tốn kém hơn nhiều so với chiếm cả mạng); giao dịch \u003cstrong>xuyên shard\u003c/strong> phức tạp, cần giao thức phối hợp (giống commit phân tán).\u003c/li>\u003c/ul>"},{"q":"\u003cstrong>PE 26.11.\u003c/strong> Vì sao enterprise blockchain thường kèm truy cập kiểu CSDL?","en":"\u003cp>\u003cstrong>Exercise 26.11.\u003c/strong> Why do enterprise blockchains often provide database-style access?\u003c/p>","answer":"\u003cp>Enterprise blockchain thường lưu \u003cstrong>dữ liệu tổng quát\u003c/strong> (hợp đồng, lô hàng, hồ sơ, chứng nhận…) chứ không chỉ các giao dịch chuyển tiền giữa tài khoản. Người dùng cần \u003cstrong>truy vấn\u003c/strong> dữ liệu đó (lọc, join, tổng hợp), có index, quen dùng SQL và tích hợp với hệ thống sẵn có — nên các nền tảng thêm lớp truy cập kiểu CSDL (ví dụ world state dạng key-value/CouchDB trong Hyperledger Fabric, hoặc CSDL quan hệ có tính năng sổ cái như Oracle Blockchain Table). Bài 26.11 ép tính chỉ-thêm bằng trigger trong PostgreSQL.\u003c/p>"}],"exercises":[{"id":"CH26.01","topic":"tính hash khối","level":1,"prompt":"\u003cp>Mỗi khối trong \u003ccode>bc_block\u003c/code> có hash = sha256 của chuỗi \u003ccode>height || '|' || prev_hash || '|' || data || '|' || nonce\u003c/code> (mã hoá UTF-8), viết dạng hex. Tính lại hash cho mọi khối và trả về \u003ccode>height\u003c/code>, \u003ccode>hash_ok\u003c/code> (true nếu hash tính lại bằng cột hash).\u003c/p>","en":"","hint":"encode(sha256(convert_to(..., 'UTF8')), 'hex')","solution":"select height,\n       encode(sha256(convert_to(height || '|' || prev_hash || '|' || data || '|' || nonce, 'UTF8')), 'hex') = hash as hash_ok\nfrom bc_block;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["height","hash_ok"],"rows":[["0","true"],["1","true"],["2","true"],["3","true"],["4","true"],["5","true"]]}},{"id":"CH26.02","topic":"kiểm tra chuỗi bị sửa","level":2,"prompt":"\u003cp>\u003ccode>bc_block_tampered\u003c/code> là bản sao mà ai đó đã sửa dữ liệu một khối và tính lại hash của khối đó. Với mỗi khối, trả về \u003ccode>height\u003c/code>, \u003ccode>hash_ok\u003c/code> (hash tính lại bằng cột hash) và \u003ccode>link_ok\u003c/code> (prev_hash bằng hash của khối có height − 1; khối 0 coi là true).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 26.6.\u003c/strong> Data stored in a blockchain are protected by its tamper-resistance property. In what way is this tamper resistance more secure in practice than the security provided by a traditional enterprise database system?\u003c/p>","hint":"","solution":"select b.height,\n       encode(sha256(convert_to(b.height || '|' || b.prev_hash || '|' || b.data || '|' || b.nonce, 'UTF8')), 'hex') = b.hash as hash_ok,\n       coalesce(b.prev_hash = p.hash, true) as link_ok\nfrom bc_block_tampered b left join bc_block_tampered p on p.height = b.height - 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["height","hash_ok","link_ok"],"rows":[["0","true","true"],["1","true","true"],["3","true","false"],["4","true","true"],["5","true","true"],["2","true","true"]]}},{"id":"CH26.03","topic":"khối phải đào lại","level":2,"prompt":"\u003cp>Tiếp CH26.02: kẻ sửa muốn chuỗi hợp lệ trở lại thì phải tính lại (đào lại) mọi khối \u003cstrong>từ khối đầu tiên bị lỗi liên kết tới khối cuối\u003c/strong>. Trả về một dòng: \u003ccode>first_broken\u003c/code> (height nhỏ nhất có link_ok = false) và \u003ccode>blocks_to_remine\u003c/code> (số khối từ first_broken tới khối cuối).\u003c/p>","en":"\u003cp>\u003cstrong>Exercise 26.6.\u003c/strong> Data stored in a blockchain are protected by its tamper-resistance property. In what way is this tamper resistance more secure in practice than the security provided by a traditional enterprise database system?\u003c/p>","hint":"","solution":"with chk as (\n  select b.height, coalesce(b.prev_hash = p.hash, true) as link_ok\n  from bc_block_tampered b left join bc_block_tampered p on p.height = b.height - 1)\nselect min(height) as first_broken,\n       (select count(*) from bc_block_tampered where height >= (select min(height) from chk where not link_ok)) as blocks_to_remine\nfrom chk\nwhere not link_ok;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["first_broken","blocks_to_remine"],"rows":[["3","3"]]}},{"id":"CH26.04","topic":"Merkle: lá","level":1,"prompt":"\u003cp>Lá của Merkle tree là sha256 (hex) của payload mỗi giao dịch. Trả về \u003ccode>tx_no\u003c/code>, \u003ccode>leaf_hash\u003c/code> cho các giao dịch của khối 1 trong \u003ccode>bc_tx\u003c/code>.\u003c/p>","en":"","hint":"","solution":"select tx_no, encode(sha256(convert_to(payload, 'UTF8')), 'hex') as leaf_hash\nfrom bc_tx\nwhere block_height = 1;","check":null,"ordered":false,"fresh":false,"expected":{"fields":["tx_no","leaf_hash"],"rows":[["1","a30d1fb198100e6afdfcf4e7f4bbd9d034a965e06630bf75dcdc82843d7b25b4"],["2","1d67f8ef6d2f2e2f73893b641cb14aac914431be0a4389636b2ecdcdb347176c"],["3","1d697f80737cc0911253025c61e71442916c4cf4888863393775551ccab701c7"],["4","a925b92093b2767199e5dab20c73687c93dee36bd0c3935acfb5337911a19a83"]]}},{"id":"CH26.05","topic":"Merkle root","level":3,"prompt":"\u003cp>Tính \u003cstrong>Merkle root\u003c/strong> của khối 1: mỗi node cha = sha256 (hex) của chuỗi ghép hash con trái || hash con phải (ghép chuỗi hex, mã hoá UTF-8); ghép các node theo thứ tự 1-2, 3-4, …; nếu một mức có số node lẻ thì node cuối được ghép với chính nó. Trả về một dòng một cột \u003ccode>merkle_root\u00
